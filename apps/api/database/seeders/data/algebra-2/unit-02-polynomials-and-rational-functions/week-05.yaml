week: 5
unit: 2
title: "Factors, Zeros and the Shape of a Graph"
topics: ["2.5", "2.6", "2.7", "2.8"]
guide: guides/week-05.md
guide_description: |
  Why a factor (x − a) gives a zero at a and an x-intercept at (a, 0), and how to go from zeros back to factors;
  what factored form and standard form each reveal; sketching a polynomial from its factored form with a sign
  table and writing an equation from a graph using a scale factor k; and end behaviour for positive leading
  coefficients, with a numerical argument for why the leading term wins. Worked examples: sketching a cubic,
  finding k from a vertical intercept, and comparing x³ with −20x² for large x.
flashcards_description: |
  28 cards on factors and zeros, the information in each form, sign tables and sketches, writing equations from
  graphs, and end behaviour with a positive leading coefficient.

flashcards:
  - front: Factor (x − a) of a polynomial → what it means for the graph
    back: |
      The polynomial is 0 at x = a, so the graph has an x-intercept at (a, 0). For (x − 2)(x + 5)(x − 7) the intercepts are at 2, −5 and 7.
    topic_code: "2.5"
  - front: Zero of a polynomial → definition
    back: |
      An input a with p(a) = 0. On the graph it is an x-intercept. Zeros, roots and x-intercepts describe the same numbers.
    topic_code: "2.5"
  - front: Factor (x + 5) → which zero
    back: |
      x = −5, because x + 5 = x − (−5). The sign of the zero is opposite to the sign shown in the factor.
    topic_code: "2.5"
  - front: Factor (2x − 3) → which zero
    back: |
      x = 3/2, the solution of 2x − 3 = 0. A factor with a coefficient on x gives a fractional zero.
    topic_code: "2.5"
  - front: From a zero to a factor → the rule
    back: |
      A zero at a gives the factor (x − a). Zeros 3, −2 and 0 give the polynomial x(x − 3)(x + 2), or any nonzero multiple of it.
    topic_code: "2.5"
  - front: Zero product property → how it links factors to zeros
    back: |
      If a product is 0 then at least one factor is 0. So (x − 2)(x + 5)(x − 7) = 0 exactly when x = 2, x = −5 or x = 7.
    topic_code: "2.5"
  - front: Zeros of x(3x + 4)(x − 1)² → list them
    back: |
      0, −4/3 and 1. The squared factor gives only one zero (1), though it changes the shape of the graph there.
    topic_code: "2.5"
  - front: Factored form → what it shows immediately
    back: |
      The zeros (one per linear factor), the degree (count the linear factors), and the vertical intercept (multiply all the constants, including any number in front).
    topic_code: "2.6"
  - front: Standard form → what it shows immediately
    back: |
      The degree (highest exponent), the leading coefficient, and the vertical intercept (the constant term). The zeros are hidden.
    topic_code: "2.6"
  - front: Vertical intercept from factored form 2(x − 1)(x + 3)(x − 4) → compute
    back: |
      Multiply the constants: 2 · (−1) · 3 · (−4) = 24, so the graph passes through (0, 24). Equivalently, substitute x = 0.
    topic_code: "2.6"
  - front: Factor x³ − 9x fully → steps
    back: |
      Take out the common factor x: x(x² − 9). Then difference of squares: x(x − 3)(x + 3). Zeros 0, 3, −3.
    topic_code: "2.6"
  - front: Factor 2x³ − 8x² + 8x fully → steps
    back: |
      Common factor 2x: 2x(x² − 4x + 4). The quadratic is a perfect square: 2x(x − 2)². Zeros 0 and 2.
    topic_code: "2.6"
  - front: Leading coefficient from factored form → how to read it
    back: |
      Multiply the number in front by the coefficients of x in each factor. For −3(x − 2)(x + 7)(2x + 1) it is −3 · 1 · 1 · 2 = −6.
    topic_code: "2.6"
  - front: Converting between factored and standard form → which direction is easy
    back: |
      Factored to standard is just multiplication. Standard to factored is harder: look for a common factor, a quadratic pattern, or a known zero (division, week 7).
    topic_code: "2.6"
  - front: Sketching a polynomial from factored form → the four steps
    back: |
      Mark the zeros on the x-axis; plot the vertical intercept; make a sign table by testing one x in each interval between zeros; draw a smooth curve with those signs and the right end behaviour.
    topic_code: "2.7"
  - front: Sign table for (x + 2)(x − 1)(x − 3) → result
    back: |
      Negative for x < −2, positive on (−2, 1), negative on (1, 3), positive for x > 3. Each simple zero flips the sign.
    topic_code: "2.7"
  - front: What a sketch from factored form does not tell you → limits
    back: |
      The exact heights of the hills and depths of the dips (turning points). It shows intercepts, sign and general shape; a graphing tool gives the rest.
    topic_code: "2.7"
  - front: Writing an equation from a graph's zeros → why you need k
    back: |
      Zeros fix the factors but not the vertical stretch: p(x) = k · x(x + 4)(x − 2) for any nonzero k has the same zeros. Use one more point, such as (1, −10), to solve for k.
    topic_code: "2.7"
  - front: Cubic with zeros −1, 2, 5 through (0, −20) → find it
    back: |
      p(x) = k(x + 1)(x − 2)(x − 5) and p(0) = k · 1 · (−2) · (−5) = 10k = −20, so k = −2: p(x) = −2(x + 1)(x − 2)(x − 5).
    topic_code: "2.7"
  - front: Quadratic with zeros −3 and 1 through (2, 15) → find it
    back: |
      k(x + 3)(x − 1) with k · 5 · 1 = 15, so k = 3: 3(x + 3)(x − 1), which expands to 3x² + 6x − 9.
    topic_code: "2.7"
  - front: End behaviour → definition
    back: |
      What the outputs do as x → ∞ (far right) and as x → −∞ (far left). It is decided entirely by the leading term.
    topic_code: "2.8"
  - front: Why the leading term controls end behaviour → numerical argument
    back: |
      For x³ − 20x² + 5 at x = 1,000: x³ = 10⁹ while 20x² = 2 · 10⁷, fifty times smaller, and the gap keeps widening. Higher powers grow faster than lower powers, however big the lower coefficients are.
    topic_code: "2.8"
  - front: End behaviour, even degree, positive leading coefficient → describe
    back: |
      Both ends go up: as x → −∞, p(x) → ∞ and as x → ∞, p(x) → ∞. An even power of a negative number is positive. Example: 3x⁴ − 100x³ + x.
    topic_code: "2.8"
  - front: End behaviour, odd degree, positive leading coefficient → describe
    back: |
      Left end down, right end up: as x → −∞, p(x) → −∞ and as x → ∞, p(x) → ∞. An odd power of a negative number is negative. Example: x³ − 20x² + 5.
    topic_code: "2.8"
  - front: End behaviour of (x − 1)(x + 2)(x − 7)(x + 9)(x − 3) → describe
    back: |
      Five linear factors give leading term x⁵: odd degree, positive coefficient, so down on the left and up on the right.
    topic_code: "2.8"
  - front: Maximum number of turning points → rule
    back: |
      At most degree − 1. A cubic has at most 2 hills or dips, a quartic at most 3. The ends are fixed by the leading term regardless.
    topic_code: "2.8"
  - front: Error-spot → "the vertical intercept of (x − 1)(x + 3) is −1"
    back: |
      Substitute x = 0 into every factor: (−1)(3) = −3. The intercept is the product of all the constants, not the constant in one factor.
    topic_code: "2.6"
  - front: Error-spot → "x³ − 20x² goes down on the right because −20x² is big"
    back: |
      At x = 10 the quadratic term does dominate (−995), but by x = 100 the cube wins (800,005) and it only gets more one-sided. End behaviour is about very large |x|, where x³ controls.
    topic_code: "2.8"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (lessons 2.5 to 2.8: factors and zeros, factored and
    standard forms, sketching from factored form, and end behaviour), with about a third reviewing week 4 and
    Unit 1 (polynomial vocabulary and arithmetic, sequences). Includes a shared-context set on one cubic.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set: one cubic in factored form (2.5, 2.6, 2.7)
    - slug: alg2-u02-w05-q01
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Algebra 2, Unit 2, Lesson 5"
      points: 1
      stimulus: |
        Let p(x) = (x + 4)(x − 1)(2x − 6).
      prompt: |
        What are the zeros of p?
      options:
        - "4, −1, 6"
        - "−4, 1, 3"
        - "−4, 1, 6"
        - "−4, 1, −3"
      option_explanations:
        - |
          These have the wrong signs: (x + 4) is zero at x = −4 and (x − 1) at x = 1.
        - |
          Correct. x + 4 = 0 gives −4, x − 1 = 0 gives 1, and 2x − 6 = 0 gives x = 3.
        - |
          The last factor is 2x − 6, which is zero at x = 3, not 6.
        - |
          2x − 6 = 0 gives x = 3, a positive zero.
      answer: 1
    - slug: alg2-u02-w05-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Algebra 2, Unit 2, Lesson 6"
      points: 1
      stimulus: |
        Let p(x) = (x + 4)(x − 1)(2x − 6).
      prompt: |
        What is the vertical intercept of the graph of p?
      options:
        - "(0, 24)"
        - "(0, −24)"
        - "(0, −6)"
        - "(0, 2)"
      option_explanations:
        - |
          Correct. p(0) = (4)(−1)(−6) = 24, the product of the constants in the factors.
        - |
          The product (4)(−1)(−6) has two negative factors, so it is positive.
        - |
          −6 is the constant from one factor only; all three constants must be multiplied.
        - |
          2 is the leading coefficient (1 · 1 · 2), not the value at x = 0.
      answer: 0
    - slug: alg2-u02-w05-q03
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Algebra 2, Unit 2, Lesson 7"
      points: 1
      stimulus: |
        Let p(x) = (x + 4)(x − 1)(2x − 6).
      prompt: |
        On which interval is p(x) negative?
      options:
        - "x < −4 and 1 < x < 3"
        - "−4 < x < 1 and x > 3"
        - "−4 < x < 3 only"
        - "x < −4 only"
      option_explanations:
        - |
          Correct. Test x = −5: (−)(−)(−) is negative; test x = 2: (+)(+)(−) is negative. Between −4 and 1 (x = 0) p is positive, and for x > 3 all factors are positive.
        - |
          At x = 0 the value is 24, positive, and for x > 3 every factor is positive.
        - |
          The sign flips at x = 1, which lies inside this interval; p is positive on (−4, 1).
        - |
          p is also negative between 1 and 3, where exactly one factor (2x − 6) is negative.
      answer: 0
    - slug: alg2-u02-w05-q04
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Algebra 2, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Which describes the end behaviour of f(x) = 2x⁴ − 90x³ + 7x − 1?
      options:
        - "As x → −∞, f(x) → −∞; as x → ∞, f(x) → ∞."
        - "As x → −∞, f(x) → ∞; as x → ∞, f(x) → ∞."
        - "As x → −∞, f(x) → ∞; as x → ∞, f(x) → −∞."
        - "As x → −∞, f(x) → −∞; as x → ∞, f(x) → −∞."
      option_explanations:
        - |
          This is the pattern for odd degree with a positive leading coefficient; the degree here is 4.
        - |
          Correct. The leading term 2x⁴ has even degree and a positive coefficient, so both ends go up; −90x³ is irrelevant for very large |x|.
        - |
          This would need a negative leading coefficient with odd degree.
        - |
          Both ends down needs a negative leading coefficient with even degree; 2 is positive.
      answer: 1
    - slug: alg2-u02-w05-q05
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Algebra 2, Unit 2, Lesson 7"
      points: 1
      prompt: |
        A cubic polynomial has zeros −3, 0 and 2 and passes through (1, 8). Which equation describes it?
      options:
        - "p(x) = x(x + 3)(x − 2)"
        - "p(x) = −2x(x + 3)(x − 2)"
        - "p(x) = 2x(x − 3)(x + 2)"
        - "p(x) = 8x(x + 3)(x − 2)"
      option_explanations:
        - |
          This has the right zeros but p(1) = 1 · 4 · (−1) = −4, not 8.
        - |
          Correct. p(x) = kx(x + 3)(x − 2) and p(1) = k · 1 · 4 · (−1) = −4k = 8, so k = −2.
        - |
          The zeros of this polynomial are 0, 3 and −2, the wrong signs.
        - |
          With k = 8, p(1) = 8 · (−4) = −32, not 8.
      answer: 1
    - slug: alg2-u02-w05-q06
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Algebra 2, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Which is the fully factored form of x³ − 16x?
      options:
        - "x(x² − 16)"
        - "x(x − 4)²"
        - "x(x − 4)(x + 4)"
        - "(x − 4)(x² + 4x)"
      option_explanations:
        - |
          x² − 16 is a difference of squares and factors further.
        - |
          (x − 4)² = x² − 8x + 16, which is not x² − 16.
        - |
          Correct. Take out the common factor x, then factor the difference of squares: x(x − 4)(x + 4).
        - |
          This is a correct product, but x² + 4x = x(x + 4) still has a common factor, so it is not fully factored.
      answer: 2
    - slug: alg2-u02-w05-q07
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Algebra 2, Unit 2, Lesson 5"
      points: 1
      prompt: |
        The graph of a polynomial crosses the x-axis at exactly x = −1, x = 2 and x = 1/2. Which polynomial could it be?
      options:
        - "(x − 1)(x + 2)(2x − 1)"
        - "(x + 1)(x − 2)(2x − 1)"
        - "(x + 1)(x − 2)(x − 2)"
        - "(x + 1)(x − 2)(2x + 1)"
      option_explanations:
        - |
          The zeros here are 1, −2 and 1/2; the first two have the wrong signs.
        - |
          Correct. x + 1 = 0 at −1, x − 2 = 0 at 2, and 2x − 1 = 0 at 1/2.
        - |
          This has zeros −1 and 2 only; it is missing the zero at 1/2.
        - |
          2x + 1 = 0 gives x = −1/2, not 1/2, so the third intercept is in the wrong place.
      answer: 1
    - slug: alg2-u02-w05-q08
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Algebra 2, Unit 2, Lesson 8"
      points: 1
      prompt: |
        For g(x) = x³ − 50x² + 1, compare the terms x³ and −50x² at x = 1,000. Which statement is correct?
      options:
        - "−50x² is larger in size, so g(1000) is negative."
        - "x³ = 1,000,000,000 and −50x² = −50,000,000, so x³ dominates and g(1000) is positive."
        - "The two terms are equal in size, so g(1000) ≈ 1."
        - "The constant 1 dominates because it is the only positive term."
      option_explanations:
        - |
          50 · 10⁶ is much smaller than 10⁹; at x = 10 the quadratic term wins, but not at 1,000.
        - |
          Correct. The cube is 20 times larger than the quadratic term at x = 1,000, so g(1000) = 950,000,001, and the lead only grows for larger x.
        - |
          They are equal only at x = 50; beyond that the cube pulls away.
        - |
          The constant term is negligible next to terms in the millions and billions.
      answer: 1
    - slug: alg2-u02-w05-q09
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Algebra 2, Unit 2, Lesson 7"
      points: 1
      prompt: |
        Graph description: a smooth curve comes up from the bottom left, crosses the x-axis at −2, rises to a hill, crosses down through (0, 0), dips, crosses up at 3 and continues upward to the top right. Which equation could describe it?
      options:
        - "y = (x + 2)(x − 3)"
        - "y = x(x + 2)(x − 3)"
        - "y = x(x − 2)(x + 3)"
        - "y = −x(x + 2)(x − 3)"
      option_explanations:
        - |
          A quadratic has no third intercept and no hill-and-dip shape; the graph also passes through the origin.
        - |
          Correct. Zeros at −2, 0 and 3 give x(x + 2)(x − 3); the leading coefficient is positive, matching the bottom-left to top-right end behaviour.
        - |
          The zeros of this polynomial are 0, 2 and −3, the wrong positions.
        - |
          A negative leading coefficient would make the graph fall to the bottom right, but it rises there.
      answer: 1
    - slug: alg2-u02-w05-q10
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Algebra 2, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Without fully expanding, what is the leading coefficient of −2(x − 5)(3x + 1)(x + 2)?
      options:
        - "−2"
        - "−6"
        - "6"
        - "20"
      option_explanations:
        - |
          The 3 in (3x + 1) also multiplies into the leading term.
        - |
          Correct. The leading term is −2 · x · 3x · x = −6x³, so the leading coefficient is −6.
        - |
          The factor −2 in front makes the leading coefficient negative.
        - |
          20 is the constant term, −2 · (−5) · 1 · 2, not the leading coefficient.
      answer: 1
    - slug: alg2-u02-w05-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        What is (x + 3)(x − 3)(x + 1) in standard form?
      options:
        - "x³ + x² − 9x − 9"
        - "x³ − 9x + 1"
        - "x³ + x² + 9x + 9"
        - "x³ − x² − 9x + 9"
      option_explanations:
        - |
          Correct. (x + 3)(x − 3) = x² − 9, then (x² − 9)(x + 1) = x³ + x² − 9x − 9.
        - |
          The x² − 9 must be multiplied by every term of (x + 1), giving x² and −9 terms as well.
        - |
          The products −9 · x and −9 · 1 are negative.
        - |
          The factor (x + 1) contributes +x², and the constant is (−9)(1) = −9.
      answer: 0
    - slug: alg2-u02-w05-q12
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Algebra 2, Unit 2, Lesson 3"
      points: 1
      prompt: |
        Which polynomial has degree 4, leading coefficient −1 and constant term 6?
      options:
        - "6 − x⁴ + 2x"
        - "−x⁴ + 6x³"
        - "4x − x³ + 6"
        - "−6x⁴ + 1"
      option_explanations:
        - |
          Correct. In standard form, −x⁴ + 2x + 6: degree 4, leading coefficient −1, constant term 6.
        - |
          The constant term here is 0; 6 is the coefficient of x³.
        - |
          The highest power here is x³, so the degree is 3, not 4.
        - |
          The leading coefficient is −6 and the constant term is 1.
      answer: 0
    - slug: alg2-u02-w05-q13
      type: multi_select
      topic_code: "2.5"
      source: "IM Algebra 2, Unit 2, Lesson 5"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = (x − 6)(x + 1)(x + 1)(x − 2). Which statements are true? Select all that apply.
      options:
        - "f(6) = 0"
        - "The graph of f has an x-intercept at (1, 0)."
        - "f has exactly three distinct zeros."
        - "The degree of f is 4."
        - "(x + 2) is a factor of f."
      option_explanations:
        - |
          Correct. The factor (x − 6) is zero at x = 6, so the product is 0.
        - |
          The factor (x + 1) gives the zero −1, not 1; f(1) = (−5)(2)(2)(−1) = 20.
        - |
          Correct. The zeros are 6, −1 and 2; the repeated factor (x + 1) gives only one distinct zero.
        - |
          Correct. Four linear factors multiply to a degree-4 polynomial.
        - |
          The factor present is (x − 2), with zero 2; f(−2) = (−8)(−1)(−1)(−4) = 32, not 0.
      answer: [0, 2, 3]
    - slug: alg2-u02-w05-q14
      type: multi_select
      topic_code: "2.8"
      source: "IM Algebra 2, Unit 2, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Which polynomials have both ends of their graph going up (as x → −∞ and as x → ∞, the outputs go to ∞)? Select all that apply.
      options:
        - "x⁴ − 10x³"
        - "x³ + 10x²"
        - "(x − 1)(x + 1)(x − 2)(x + 2)"
        - "x(x − 1)(x − 2)(x − 3)(x − 4)"
        - "5x⁶ − x⁵"
      option_explanations:
        - |
          Correct. Leading term x⁴: even degree, positive coefficient, both ends up.
        - |
          Odd degree with a positive coefficient: left end down, right end up.
        - |
          Correct. Four linear factors give leading term x⁴, so both ends go up.
        - |
          Five linear factors give x⁵, odd degree: the left end goes down.
        - |
          Correct. Leading term 5x⁶: even degree, positive coefficient.
      answer: [0, 2, 4]
    - slug: alg2-u02-w05-q15
      type: true_false
      topic_code: "2.5"
      source: "IM Algebra 2, Unit 2, Lesson 5"
      points: 1
      prompt: |
        True or false: If (x − 7) is a factor of a polynomial p, then the graph of p passes through (7, 0).
      answer: true
      explanation: |
        True. Substituting x = 7 makes the factor (x − 7) zero, so the whole product is 0 and p(7) = 0, which is the point (7, 0) on the graph.
    - slug: alg2-u02-w05-q16
      type: true_false
      topic_code: "2.3"
      source: "IM Algebra 2, Unit 2, Lesson 3"
      points: 1
      prompt: |
        True or false: The expression 3x² + 2/x − 1 is a polynomial of degree 2.
      answer: false
      explanation: |
        False. The term 2/x is 2x⁻¹, and a negative exponent on the variable is not allowed in a polynomial, so the expression is not a polynomial at all; its degree is undefined.
    - slug: alg2-u02-w05-q17
      type: fill_blank
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        The degree of the product (x² + 1)(x³ − x)(x + 2) is ____.
      answer: ["6"]
      explanation: |
        Degrees add when polynomials are multiplied: 2 + 3 + 1 = 6. The leading term is x² · x³ · x = x⁶.
    - slug: alg2-u02-w05-q18
      type: fill_blank
      topic_code: "1.11"
      source: "IM Algebra 2, Unit 1, Lesson 11"
      points: 1
      prompt: |
        The sum 4 + 7 + 10 + … + 61 (an arithmetic sequence with 20 terms) is ____.
      answer: ["650"]
      explanation: |
        S(20) = 20 · (4 + 61)/2 = 20 · 32.5 = 650.
    - slug: alg2-u02-w05-q19
      type: numeric
      topic_code: "2.6"
      source: "IM Algebra 2, Unit 2, Lesson 6"
      points: 1
      prompt: |
        What is the vertical intercept (the value at x = 0) of y = −3(x − 2)(x + 1)(x − 4)? Give the exact value.
      answer: { value: -24, tolerance: 0 }
      explanation: |
        Substitute x = 0: −3 · (−2) · (1) · (−4) = −3 · 8 = −24.
    - slug: alg2-u02-w05-q20
      type: numeric
      topic_code: "2.7"
      source: "IM Algebra 2, Unit 2, Lesson 7"
      points: 1
      prompt: |
        A polynomial has the form p(x) = k(x − 1)(x + 2)(x − 5) and passes through (3, −60). What is k? Give the exact value.
      answer: { value: 3, tolerance: 0 }
      explanation: |
        p(3) = k · (3 − 1)(3 + 2)(3 − 5) = k · 2 · 5 · (−2) = −20k. Setting −20k = −60 gives k = 3.
    - slug: alg2-u02-w05-q21
      type: numeric
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        For the geometric sequence a(n) = 3 · 2ⁿ⁻¹, which term number n gives a(n) = 1536? Give a whole number.
      answer: { value: 10, tolerance: 0 }
      explanation: |
        3 · 2ⁿ⁻¹ = 1536 gives 2ⁿ⁻¹ = 512 = 2⁹, so n − 1 = 9 and n = 10.
    - slug: alg2-u02-w05-q22
      type: short_answer
      topic_code: "2.7"
      source: "IM Algebra 2, Unit 2, Lesson 7"
      points: 3
      prompt: |
        Let p(x) = (x + 3)(x − 1)(x − 4).

        (a) State the zeros and the vertical intercept of p.
        (b) Make a sign table showing whether p is positive or negative on each interval between the zeros, with a test value for each.
        (c) Describe the graph in words: where it comes from on the left, where it crosses, and where it goes on the right. Explain how the degree and leading coefficient justify the ends.
      answer: |
        (a) Zeros −3, 1, 4; p(0) = (3)(−1)(−4) = 12, so the vertical intercept is (0, 12).
        (b) x < −3 (test −4): (−)(−)(−) negative. −3 < x < 1 (test 0): (+)(−)(−) positive. 1 < x < 4 (test 2): (+)(+)(−) negative. x > 4 (test 5): (+)(+)(+) positive.
        (c) The graph comes up from the bottom left, crosses at −3, rises through (0, 12), comes back down through 1, dips below the axis, crosses up at 4 and rises to the top right. Degree 3 with leading coefficient 1 (odd, positive) forces the left end down and the right end up.
      explanation: |
        Three points, one per part. (a) all three zeros and the intercept 12. (b) correct signs on all four intervals with test values. (c) a coherent description plus the end-behaviour justification.
    - slug: alg2-u02-w05-q23
      type: short_answer
      topic_code: "2.6"
      source: "IM Algebra 2, Unit 2, Lesson 6"
      points: 3
      prompt: |
        A polynomial is given in standard form as q(x) = 2x³ + 2x² − 12x.

        (a) Write q in fully factored form, showing your steps.
        (b) State the zeros of q and the degree and leading coefficient.
        (c) Explain one thing the factored form shows at a glance that the standard form does not, and one thing the standard form shows that the factored form does not.
      answer: |
        (a) Common factor 2x: 2x(x² + x − 6). Factor the quadratic: 2x(x + 3)(x − 2).
        (b) Zeros 0, −3, 2; degree 3; leading coefficient 2.
        (c) The factored form shows the zeros (and so the x-intercepts) immediately; the standard form shows the leading coefficient and constant term directly, and is the form you add or subtract in.
      explanation: |
        Three points, one per part. (a) must show the common factor and the quadratic factoring. (b) all three zeros plus degree and leading coefficient. (c) one valid advantage of each form.
    - slug: alg2-u02-w05-q24
      type: long_answer
      topic_code: "2.8"
      source: "IM Algebra 2, Unit 2, Lesson 8"
      points: 6
      prompt: |
        Consider f(x) = x³ − 30x² + 100 and its leading term x³.

        Write a full response that (1) computes f(x) and x³ at x = 10, x = 100 and x = 1,000 and comments on what you see, (2) explains in general why the leading term of a polynomial determines its end behaviour, (3) states the end behaviour of f and of g(x) = x⁴ − 30x³ + 100, explaining the difference, and (4) explains why a polynomial's middle terms can still matter a great deal near the origin even though they do not affect the ends.
      answer: |
        (1) x = 10: x³ = 1,000, f(10) = 1,000 − 3,000 + 100 = −1,900. x = 100: x³ = 1,000,000, f(100) = 1,000,000 − 300,000 + 100 = 700,100. x = 1,000: x³ = 10⁹, f(1000) = 10⁹ − 3 · 10⁷ + 100 = 970,000,100. At x = 10 the quadratic term dominates and f is negative; by x = 100 f is positive and about 70% of x³; by x = 1,000 it is 97% of x³. The ratio f(x)/x³ approaches 1.
        (2) Each lower-degree term, divided by the leading term, is a constant over a positive power of x, which shrinks to 0 as |x| grows. So for large |x| the polynomial is the leading term times something close to 1, and its sign and size follow the leading term.
        (3) f: degree 3, leading coefficient 1, so f(x) → −∞ as x → −∞ and f(x) → ∞ as x → ∞. g: degree 4, leading coefficient 1, so both ends go up. The difference is that (−x)³ is negative while (−x)⁴ is positive.
        (4) Near the origin, x is small, so x³ is small too, and terms like −30x² and the constant 100 can easily outweigh it; they create the hills, dips and intercepts of the graph. End behaviour describes only what happens far away.
      explanation: |
        Six points: 2 for the six values and the comment that the ratio approaches 1 (1 if values are right without comment); 1 for the general argument that lower terms become negligible relative to the leading term; 2 for both end behaviours with the odd/even explanation; 1 for explaining why middle terms matter near the origin.
