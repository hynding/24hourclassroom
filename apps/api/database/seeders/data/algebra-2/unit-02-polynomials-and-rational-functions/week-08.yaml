    - slug: alg2-u02-w08-q22
      type: short_answer
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 3
      prompt: |
        Let f(x) = (x − 1)(x + 3) / ((x + 1)(x − 4)).

        (a) State the domain, the x-intercepts and the vertical intercept.
        (b) State the vertical asymptotes, and for the asymptote at x = 4 determine the direction of the graph on each side by testing x = 3.9 and x = 4.1.
        (c) State the horizontal asymptote and explain how you found it.
      answer: |
        (a) Domain x ≠ −1, 4. x-intercepts 1 and −3. Vertical intercept f(0) = (−1)(3)/((1)(−4)) = 3/4.
        (b) Vertical asymptotes x = −1 and x = 4. At 3.9: (2.9)(6.9)/((4.9)(−0.1)) ≈ −40.8, so the graph goes down on the left of 4. At 4.1: (3.1)(7.1)/((5.1)(0.1)) ≈ 43.2, so it goes up on the right.
        (c) y = 1, because the degrees are equal (2 and 2) and the leading coefficients are both 1.
      explanation: |
        Three points, one per part. (a) domain, both intercepts and 3/4. (b) both asymptotes and the two directions with the test values. (c) y = 1 with the degree reasoning.
    - slug: alg2-u02-w08-q23
      type: short_answer
      topic_code: "2.16"
      source: "IM Algebra 2, Unit 2, Lesson 16"
      points: 3
      prompt: |
        An open-top box has a square base of side x cm and must have a volume of 4000 cm³.

        (a) Write the height h as a function of x, and then the total surface area A(x) (base plus four sides) as a function of x.
        (b) Compute A(10), A(20) and A(30).
        (c) Explain, using the two terms of A(x), why the area is large for both small and large x, and estimate from your values where the minimum lies.
      answer: |
        (a) h = 4000/x². A(x) = x² + 4xh = x² + 4x · 4000/x² = x² + 16000/x.
        (b) A(10) = 100 + 1600 = 1700; A(20) = 400 + 800 = 1200; A(30) = 900 + 533.3 ≈ 1433.3.
        (c) For small x the term 16000/x is huge (a tall thin box with large sides); for large x the term x² is huge (a wide flat base). The values suggest the minimum is near x = 20 (a finer search gives exactly x = 20, where A = 1200).
      explanation: |
        Three points, one per part. (a) both functions. (b) the three values (accept 1433 for the last). (c) the two-term explanation and an estimate near x = 20.
    - slug: alg2-u02-w08-q24
      type: long_answer
      topic_code: "2.19"
      source: "IM Algebra 2, Unit 2, Lesson 19"
      points: 6
      prompt: |
        Let g(x) = (x² − x − 6)/(x − 1).

        Write a full response that (1) finds the domain, the x-intercepts and the vertical intercept, (2) identifies the vertical asymptote and the direction of the graph on each side of it, (3) rewrites g(x) by division as quotient + remainder/(x − 1) and states the slant asymptote, and (4) uses all of this to describe the graph in words, including a check of g at x = 10 against the slant asymptote.
      answer: |
        (1) Domain x ≠ 1. Numerator (x − 3)(x + 2), so x-intercepts 3 and −2. g(0) = −6/(−1) = 6, so the vertical intercept is (0, 6).
        (2) Vertical asymptote x = 1. At 0.9: numerator (−2.1)(2.9) = −6.09, denominator −0.1, so g ≈ 60.9 (up on the left). At 1.1: numerator (−1.9)(3.1) = −5.89, denominator 0.1, so g ≈ −58.9 (down on the right).
        (3) x² − x − 6 = (x − 1)(x) − 6, so g(x) = x − 6/(x − 1). Slant asymptote y = x.
        (4) The left branch comes in along the line y = x from the far left, passes through (−2, 0) and (0, 6), then rises steeply to +∞ as x approaches 1 from the left. The right branch rises from −∞ just right of x = 1, crosses the x-axis at 3, and settles toward the line y = x. Check: g(10) = 84/9 ≈ 9.33, close to the asymptote value 10, with the gap 6/9 = 0.67 explained by the remainder term.
      explanation: |
        Six points: 1 for domain and intercepts; 1 for the asymptote with correct directions; 2 for the division (quotient x, remainder −6) and slant asymptote y = x; 2 for a coherent description including the x = 10 check (1 if the check is missing).
