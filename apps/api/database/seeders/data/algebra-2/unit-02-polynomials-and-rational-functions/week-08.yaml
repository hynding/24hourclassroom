week: 8
unit: 2
title: "Rational Functions and Their Graphs"
topics: ["2.16", "2.17", "2.18", "2.19"]
guide: guides/week-08.md
guide_description: |
  Rational functions from situations (the surface area of a can with fixed volume, average cost per item) and
  finding a minimum from a graph; vertical asymptotes where the denominator is zero, holes where a factor
  cancels, and intercepts from the factored form; horizontal asymptotes by comparing degrees; and end behaviour
  by division, giving horizontal, slant or polynomial asymptotes. Worked examples: the 500 cm³ can, (x + 2)/(x − 3)
  near its asymptotes, and (2x² + 3x − 5)/(x + 3) rewritten by division.
flashcards_description: |
  28 cards on building rational functions, domains, vertical and horizontal asymptotes, holes, intercepts, and
  end behaviour by division.

flashcards:
  - front: Rational function → definition
    back: |
      A function p(x)/q(x) where p and q are polynomials and q is not the zero polynomial. Examples: (x + 2)/(x − 3), 2πr² + 1000/r (which is (2πr³ + 1000)/r).
    topic_code: "2.16"
  - front: Surface area of a can holding 500 cm³ as a function of radius → derive it
    back: |
      S = 2πr² + 2πrh with πr²h = 500, so h = 500/(πr²) and S(r) = 2πr² + 1000/r. The curved side becomes 1000/r.
    topic_code: "2.16"
  - front: Why S(r) = 2πr² + 1000/r is large for both tiny and huge r → reason
    back: |
      Tiny r makes 1000/r enormous (a tall thin can with a huge side); huge r makes 2πr² enormous (wide flat ends). The minimum, about 348.7 cm² at r ≈ 4.3 cm, sits in between and is read from a graph.
    topic_code: "2.16"
  - front: Average cost per item → rational function and its long-run value
    back: |
      A(x) = C(x)/x. For C(x) = 2000 + 15x, A(x) = 2000/x + 15, which approaches 15 as x grows: the fixed cost is spread ever thinner. Horizontal asymptote y = 15.
    topic_code: "2.16"
  - front: Height of a square-based box of volume 2000 and base side x → rational function
    back: |
      x²h = 2000 gives h = 2000/x². A fixed-volume constraint turns one dimension into a fraction of the other.
    topic_code: "2.16"
  - front: Domain of a rational function → rule
    back: |
      All real numbers except the zeros of the denominator. (x − 1)(x + 4)/(x(x − 5)) has domain x ≠ 0, 5.
    topic_code: "2.17"
  - front: Vertical asymptote → definition and cause
    back: |
      A vertical line x = a that the graph approaches without touching, occurring where the denominator is 0 and the numerator (after cancelling) is not. Dividing a nonzero number by something tiny gives huge outputs.
    topic_code: "2.17"
  - front: Behaviour of (x + 2)/(x − 3) near x = 3 → describe
    back: |
      At 2.99 the output is about −499 and at 3.01 about +501: the graph plunges to −∞ on the left of the asymptote and rises to +∞ on the right. Test one point on each side to find the directions.
    topic_code: "2.17"
  - front: Asymptote from an even power like 1/(x − 3)² → direction on each side
    back: |
      The same direction on both sides (here both up to +∞), because the square is positive on both sides. An odd power gives opposite directions.
    topic_code: "2.17"
  - front: Hole in a graph → when it happens
    back: |
      When a factor cancels from numerator and denominator. (x² − 9)/(x − 3) = x + 3 for x ≠ 3, so the graph is the line y = x + 3 with the single point (3, 6) missing.
    topic_code: "2.17"
  - front: Asymptote or hole at a denominator zero → how to decide
    back: |
      Factor and cancel first. If the factor cancels completely it is a hole; if it survives in the denominator it is a vertical asymptote. (x + 2)/(x² − 4) has a hole at −2 and an asymptote at 2.
    topic_code: "2.17"
  - front: x-intercepts of a rational function → where
    back: |
      Where the numerator is 0 and the denominator is not. For (x − 1)(x + 4)/(x(x − 5)) they are x = 1 and x = −4.
    topic_code: "2.17"
  - front: Vertical intercept of a rational function → how to find it, and when it is missing
    back: |
      Evaluate at x = 0. (x + 2)/(x − 3) gives −2/3. If 0 is not in the domain (a factor of x in the denominator), there is no vertical intercept.
    topic_code: "2.17"
  - front: Horizontal asymptote → definition
    back: |
      A horizontal line y = c that the graph approaches as x → ∞ or x → −∞. It describes the far ends only; the graph may cross it in the middle.
    topic_code: "2.18"
  - front: Horizontal asymptote when numerator degree < denominator degree → result
    back: |
      y = 0. Example: (3x + 1)/(x² − 4) behaves like 3x/x² = 3/x, which goes to 0.
    topic_code: "2.18"
  - front: Horizontal asymptote when the degrees are equal → result
    back: |
      y = ratio of the leading coefficients. (2x² − 5)/(x² + x) approaches 2; (5x² − 3x)/(2x² + 7) approaches 5/2.
    topic_code: "2.18"
  - front: Horizontal asymptote when numerator degree > denominator degree → result
    back: |
      None. The graph follows a polynomial at the ends (a line if the degrees differ by one), found by dividing.
    topic_code: "2.18"
  - front: Why (x + 2)/(x − 3) approaches 1 → reasoning with leading terms
    back: |
      For large |x| the numerator is about x and the denominator about x, so the ratio is about 1. At x = 1000 the value is 1002/997 ≈ 1.005.
    topic_code: "2.18"
  - front: Arrow notation for end behaviour → how to write it
    back: |
      "As x → ∞, g(x) → 5/2, and as x → −∞, g(x) → 5/2" for g(x) = (5x² − 3x)/(2x² + 7). The arrow means "approaches".
    topic_code: "2.18"
  - front: Graph of 4/(x + 1) → key features
    back: |
      Vertical asymptote x = −1 (up on the right, down on the left), horizontal asymptote y = 0, vertical intercept (0, 4), no x-intercept because the numerator is never 0. Two branches hugging the asymptotes.
    topic_code: "2.18"
  - front: End behaviour of a rational function by division → the principle
    back: |
      Divide numerator by denominator: f = quotient + remainder/divisor. The remainder term shrinks to 0 for large |x|, so the graph approaches the quotient.
    topic_code: "2.19"
  - front: Slant asymptote → when it occurs and how to find it
    back: |
      When the numerator's degree is exactly one more than the denominator's. The quotient of the division is a line y = mx + b, the slant asymptote. (x² + 1)/(x − 1) = x + 1 + 2/(x − 1) has slant asymptote y = x + 1.
    topic_code: "2.19"
  - front: (2x² + 3x − 5)/(x + 3) → rewrite and end behaviour
    back: |
      2x² + 3x − 5 = (x + 3)(2x − 3) + 4, so the function is 2x − 3 + 4/(x + 3). Slant asymptote y = 2x − 3; at x = 100 the value is about 197.04 against 197.
    topic_code: "2.19"
  - front: (x³ − 8)/x → rewrite and end behaviour
    back: |
      x² − 8/x. At the ends the graph follows the parabola y = x²; vertical asymptote x = 0; x-intercept at 2.
    topic_code: "2.19"
  - front: Quotient a constant versus linear versus quadratic → what the graph does at the ends
    back: |
      Constant quotient: horizontal asymptote. Linear quotient: slant asymptote. Quadratic or higher quotient: the graph follows that polynomial.
    topic_code: "2.19"
  - front: Role of the remainder term in a rational function → what it does
    back: |
      It is negligible far away but dominant near the vertical asymptote, where it makes the graph curve sharply away from the slant or horizontal asymptote.
    topic_code: "2.19"
  - front: Error-spot → "(x + 2)/(x − 3) has horizontal asymptote y = −2/3"
    back: |
      −2/3 is the vertical intercept f(0). The horizontal asymptote comes from the leading terms x/x, so it is y = 1.
    topic_code: "2.18"
  - front: Error-spot → "(x² − 1)/(x − 1) has a vertical asymptote at x = 1"
    back: |
      The factor (x − 1) cancels: the function equals x + 1 for x ≠ 1, so there is a hole at (1, 2), not an asymptote. Only 1/(x − 1) has an asymptote there.
    topic_code: "2.17"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (lessons 2.16 to 2.19: rational functions from
    situations, vertical and horizontal asymptotes, holes, intercepts and end behaviour by division), with
    about a third reviewing weeks 4 to 7 and Unit 1. Includes a shared-context set on one rational function.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set: one rational function (2.17, 2.18)
    - slug: alg2-u02-w08-q01
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 1
      stimulus: |
        Let f(x) = (2x − 6) / ((x + 1)(x − 4)).
      prompt: |
        Which lines are vertical asymptotes of the graph of f?
      options:
        - "x = 3 only"
        - "x = −1 and x = 4"
        - "x = 1 and x = −4"
        - "x = −1, x = 3 and x = 4"
      option_explanations:
        - |
          x = 3 is where the numerator is 0, which gives an x-intercept, not an asymptote.
        - |
          Correct. The denominator is 0 at x = −1 and x = 4 and the numerator is not, so both are vertical asymptotes.
        - |
          These have the wrong signs: (x + 1) is zero at −1 and (x − 4) at 4.
        - |
          x = 3 is an x-intercept; only denominator zeros produce asymptotes.
      answer: 1
    - slug: alg2-u02-w08-q02
      type: multiple_choice
      topic_code: "2.18"
      source: "IM Algebra 2, Unit 2, Lesson 18"
      points: 1
      stimulus: |
        Let f(x) = (2x − 6) / ((x + 1)(x − 4)).
      prompt: |
        What is the horizontal asymptote of the graph of f?
      options:
        - "y = 2"
        - "y = 0"
        - "y = 3/2"
        - "There is none."
      option_explanations:
        - |
          y = 2 would need equal degrees; the numerator has degree 1 and the denominator degree 2.
        - |
          Correct. The numerator's degree (1) is less than the denominator's (2), so f(x) → 0 as x → ±∞.
        - |
          3/2 is f(0) = −6/(−4), the vertical intercept, not an asymptote.
        - |
          A horizontal asymptote exists whenever the numerator's degree is at most the denominator's.
      answer: 1
    - slug: alg2-u02-w08-q03
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 1
      stimulus: |
        Let f(x) = (2x − 6) / ((x + 1)(x − 4)).
      prompt: |
        What happens to f(x) as x approaches 4 from the right (values slightly larger than 4)?
      options:
        - "f(x) → +∞"
        - "f(x) → −∞"
        - "f(x) → 0"
        - "f(x) → 2"
      option_explanations:
        - |
          Correct. At x = 4.1: numerator 2.2 > 0, denominator 5.1 · 0.1 > 0, so f is large and positive, growing without bound as x → 4⁺.
        - |
          The outputs go to −∞ on the left of 4 (at 3.9 the factor x − 4 is negative), not on the right.
        - |
          Outputs approach 0 only at the far ends, not near a vertical asymptote.
        - |
          Near a vertical asymptote the outputs grow without bound; they do not settle on a number.
      answer: 0
    - slug: alg2-u02-w08-q04
      type: multiple_choice
      topic_code: "2.16"
      source: "IM Algebra 2, Unit 2, Lesson 16"
      points: 1
      prompt: |
        A cylindrical can must hold 1000 cm³. Which expression gives its surface area S (two ends plus the curved side) as a function of its radius r?
      options:
        - "S(r) = 2πr² + 1000/r"
        - "S(r) = 2πr² + 2000/r"
        - "S(r) = πr² + 1000/r"
        - "S(r) = 2πr² + 2πr · 1000"
      option_explanations:
        - |
          This would be the area for a 500 cm³ can; the side term is 2V/r.
        - |
          Correct. h = 1000/(πr²), so the side 2πrh = 2πr · 1000/(πr²) = 2000/r, and the two ends add 2πr².
        - |
          There are two circular ends, so the end area is 2πr², not πr².
        - |
          The height is not 1000; it is 1000/(πr²), which makes the side term a fraction.
      answer: 1
    - slug: alg2-u02-w08-q05
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 1
      prompt: |
        Which statement about g(x) = (x² − 25)/(x − 5) is correct?
      options:
        - "The graph has a vertical asymptote at x = 5."
        - "The graph is the line y = x + 5 with a hole at (5, 10)."
        - "The graph has a horizontal asymptote at y = 1."
        - "The graph has x-intercepts at 5 and −5."
      option_explanations:
        - |
          The factor (x − 5) cancels with the numerator, so there is no asymptote there.
        - |
          Correct. (x − 5)(x + 5)/(x − 5) = x + 5 for x ≠ 5; the single point at x = 5 is missing.
        - |
          After cancelling, the function is linear and grows without bound; no horizontal asymptote.
        - |
          x = 5 is not in the domain, so it cannot be an intercept; the only x-intercept is −5.
      answer: 1
    - slug: alg2-u02-w08-q06
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Algebra 2, Unit 2, Lesson 9"
      points: 1
      prompt: |
        Which describes the end behaviour of p(x) = −3(x + 1)(x − 2)(x − 5)?
      options:
        - "Left end up, right end down"
        - "Left end down, right end up"
        - "Both ends up"
        - "Both ends down"
      option_explanations:
        - |
          Correct. Three linear factors give odd degree, and the factor −3 makes the leading coefficient negative, so the graph rises on the left and falls on the right.
        - |
          That is the pattern for odd degree with a positive leading coefficient; here the coefficient is −3.
        - |
          Both ends up requires even degree with a positive leading coefficient.
        - |
          Both ends down requires even degree; the degree here is 3.
      answer: 0
    - slug: alg2-u02-w08-q07
      type: multiple_choice
      topic_code: "2.19"
      source: "IM Algebra 2, Unit 2, Lesson 19"
      points: 1
      prompt: |
        Using division, which rewriting of r(x) = (x² + 3x − 1)/(x − 2) shows its end behaviour?
      options:
        - "r(x) = x + 5 + 9/(x − 2), so the graph approaches the line y = x + 5"
        - "r(x) = x + 1 − 3/(x − 2), so the graph approaches the line y = x + 1"
        - "r(x) = x + 3 − 1/(x − 2), so the graph approaches the line y = x + 3"
        - "r(x) = 1 + (3x − 1)/(x − 2), so the graph approaches y = 1"
      option_explanations:
        - |
          Correct. x² + 3x − 1 = (x − 2)(x + 5) + 9, and 9/(x − 2) → 0, so the slant asymptote is y = x + 5.
        - |
          (x − 2)(x + 1) − 3 = x² − x − 5, which is not the numerator.
        - |
          (x − 2)(x + 3) − 1 = x² + x − 7, which is not the numerator.
        - |
          The numerator's degree is larger than the denominator's, so there is no horizontal asymptote and this rewriting is not valid.
      answer: 0
    - slug: alg2-u02-w08-q08
      type: multiple_choice
      topic_code: "2.16"
      source: "IM Algebra 2, Unit 2, Lesson 16"
      points: 1
      prompt: |
        A printing job costs $180 to set up plus $0.40 per copy. Which function gives the average cost per copy for x copies, and what does it approach as x grows?
      options:
        - "A(x) = 180x + 0.40; it grows without bound"
        - "A(x) = 180/x + 0.40; it approaches $0.40"
        - "A(x) = 0.40/x + 180; it approaches $180"
        - "A(x) = (180 + 0.40x)/x; it approaches 0"
      option_explanations:
        - |
          Total cost divided by copies is (180 + 0.40x)/x, which does not grow without bound.
        - |
          Correct. (180 + 0.40x)/x = 180/x + 0.40, and 180/x → 0, so the average approaches the per-copy cost.
        - |
          The setup cost is the one spread over copies, so it is 180 that is divided by x.
        - |
          The expression is right but it approaches 0.40, the per-copy cost, not 0.
      answer: 1
    - slug: alg2-u02-w08-q09
      type: multiple_choice
      topic_code: "2.19"
      source: "IM Algebra 2, Unit 2, Lesson 19"
      points: 1
      prompt: |
        For large |x|, the graph of y = (x⁴ − 2x + 1)/(x² + 1) most closely resembles which graph?
      options:
        - "The parabola y = x²"
        - "The parabola y = x² − 1"
        - "The horizontal line y = 1"
        - "The line y = x"
      option_explanations:
        - |
          Close, but the division gives x² − 1 with remainder −2x + 2, so the parabola is shifted down by 1.
        - |
          Correct. x⁴ − 2x + 1 = (x² + 1)(x² − 1) + (−2x + 2), and the remainder term vanishes for large |x|.
        - |
          The numerator's degree exceeds the denominator's by 2, so the ends follow a quadratic, not a constant.
        - |
          A slant line needs the degrees to differ by exactly 1; here they differ by 2.
      answer: 1
    - slug: alg2-u02-w08-q10
      type: multiple_choice
      topic_code: "2.18"
      source: "IM Algebra 2, Unit 2, Lesson 18"
      points: 1
      prompt: |
        Graph description: a graph has a vertical asymptote at x = 2, approaches the line y = −3 at both far ends, and crosses the x-axis at x = −1. Which function could it be?
      options:
        - "y = (x + 1)/(x − 2)"
        - "y = −3(x + 1)/(x − 2)"
        - "y = −3(x − 1)/(x + 2)"
        - "y = (x + 1)/(−3(x − 2))"
      option_explanations:
        - |
          This has the right asymptote and intercept, but its horizontal asymptote is y = 1 (leading coefficients 1 and 1).
        - |
          Correct. Denominator zero at 2, numerator zero at −1, and leading coefficients −3 and 1 give the horizontal asymptote y = −3.
        - |
          The asymptote here is x = −2 and the intercept is at 1, both wrong.
        - |
          The leading coefficients are 1 and −3, so the horizontal asymptote would be y = −1/3.
      answer: 1
    - slug: alg2-u02-w08-q11
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Algebra 2, Unit 2, Lesson 15"
      points: 1
      prompt: |
        What is the remainder when x³ − 4x² + x + 10 is divided by (x − 3)?
      options:
        - "0"
        - "4"
        - "10"
        - "−2"
      option_explanations:
        - |
          A remainder of 0 would make (x − 3) a factor, but p(3) is not 0.
        - |
          Correct. By the Remainder Theorem the remainder is p(3) = 27 − 36 + 3 + 10 = 4.
        - |
          10 is the constant term, the remainder on dividing by x rather than by (x − 3).
        - |
          The remainder is p(3), and p(3) = 27 − 36 + 3 + 10 = 4, which is positive, not −2.
      answer: 1
    - slug: alg2-u02-w08-q12
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        What is (x² − 2x + 4)(x + 2)?
      options:
        - "x³ + 8"
        - "x³ − 8"
        - "x³ + 4x² + 8"
        - "x³ + 2x² − 4x + 8"
      option_explanations:
        - |
          Correct. x³ + 2x² − 2x² − 4x + 4x + 8 = x³ + 8; the middle terms cancel (a sum of cubes).
        - |
          The constant term is 4 · 2 = +8, not −8.
        - |
          The x² terms cancel: 2x² − 2x² = 0, so no x² term survives in the product.
        - |
          This multiplies by x only and adds 8; the +2 must multiply every term.
      answer: 0
    - slug: alg2-u02-w08-q13
      type: multi_select
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 2
      partial_credit: true
      prompt: |
        Let k(x) = x(x − 3) / ((x + 2)(x − 3)(x − 6)). Which statements are true? Select all that apply.
      options:
        - "The graph has a vertical asymptote at x = −2."
        - "The graph has a vertical asymptote at x = 3."
        - "The graph has a hole at x = 3."
        - "The graph has an x-intercept at x = 0."
        - "The domain is all real numbers except −2, 3 and 6."
      option_explanations:
        - |
          Correct. (x + 2) is zero at −2 and does not cancel.
        - |
          The factor (x − 3) cancels with the numerator, so there is no asymptote at 3.
        - |
          Correct. After cancelling, k(x) = x/((x + 2)(x − 6)) for x ≠ 3, with a single point missing at x = 3.
        - |
          Correct. The numerator is 0 at x = 0 and the denominator is −2 · (−6) = 12, so (0, 0) is on the graph.
        - |
          Correct. All three denominator zeros are excluded from the domain, even the one that becomes a hole.
      answer: [0, 2, 3, 4]
    - slug: alg2-u02-w08-q14
      type: multi_select
      topic_code: "2.18"
      source: "IM Algebra 2, Unit 2, Lesson 18"
      points: 2
      partial_credit: true
      prompt: |
        Which functions have the horizontal asymptote y = 0? Select all that apply.
      options:
        - "y = 5/(x − 1)"
        - "y = (x + 7)/(x² + 1)"
        - "y = (3x² + 1)/(x² − 4)"
        - "y = (x − 2)/(x³ + x)"
        - "y = (x² − 1)/(x + 1)"
      option_explanations:
        - |
          Correct. Degree 0 over degree 1: the outputs shrink to 0 at both ends.
        - |
          Correct. Degree 1 over degree 2, so the ratio behaves like 1/x.
        - |
          Equal degrees give the asymptote y = 3, not 0.
        - |
          Correct. Degree 1 over degree 3, so the ratio behaves like 1/x² and goes to 0.
        - |
          After cancelling this is the line y = x − 1 (with a hole), which has no horizontal asymptote.
      answer: [0, 1, 3]
    - slug: alg2-u02-w08-q15
      type: true_false
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        True or false: The graph of y = x²(x − 4) touches the x-axis at the origin and turns back without crossing.
      answer: true
      explanation: |
        True. The factor x² gives the zero 0 with multiplicity 2, which is even, so the graph bounces at (0, 0). At x = 4 the multiplicity is 1 and the graph crosses.
    - slug: alg2-u02-w08-q16
      type: true_false
      topic_code: "2.19"
      source: "IM Algebra 2, Unit 2, Lesson 19"
      points: 1
      prompt: |
        True or false: If (x² − 4x + 7)/(x − 2) is rewritten by division as x − 2 + 3/(x − 2), then its graph approaches the line y = x − 2 as x → ∞.
      answer: true
      explanation: |
        True. The remainder term 3/(x − 2) shrinks toward 0 as |x| grows, so the function values get ever closer to x − 2; the line y = x − 2 is a slant asymptote. (Check: (x − 2)(x − 2) + 3 = x² − 4x + 7.)
    - slug: alg2-u02-w08-q17
      type: fill_blank
      topic_code: "2.13"
      source: "IM Algebra 2, Unit 2, Lesson 13"
      points: 1
      prompt: |
        When x² + 7x + 10 is divided by (x + 5), the quotient is ____.
      answer: ["x + 2", "x+2", "(x + 2)", "(x+2)"]
      explanation: |
        x² + 7x + 10 = (x + 5)(x + 2), so the quotient is x + 2 with remainder 0.
    - slug: alg2-u02-w08-q18
      type: fill_blank
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 1
      prompt: |
        The graph of y = (x + 5)/(3x − 12) has a vertical asymptote at x = ____.
      answer: ["4", "x = 4"]
      explanation: |
        The denominator 3x − 12 is 0 when x = 4, and the numerator there is 9, not 0, so x = 4 is a vertical asymptote.
    - slug: alg2-u02-w08-q19
      type: numeric
      topic_code: "2.16"
      source: "IM Algebra 2, Unit 2, Lesson 16"
      points: 1
      prompt: |
        A cylindrical can must hold 500 cm³, so its surface area is S(r) = 2πr² + 1000/r. Find S(5) in cm², to one decimal place.
      answer: { value: 357.1, tolerance: 0.15 }
      explanation: |
