      prompt: |
        A water tank holds 8,000 litres. Each day, 10% of the water evaporates and then 500 litres are added.

        (a) Write a recursive rule for w(n), the volume after n days, with w(0) = 8000.
        (b) Find w(1) and w(2).
        (c) Is this sequence arithmetic, geometric or neither? Justify with its first three terms.
      answer: |
        (a) w(0) = 8000, w(n) = 0.9 · w(n − 1) + 500.
        (b) w(1) = 7200 + 500 = 7700; w(2) = 6930 + 500 = 7430.
        (c) Neither. Differences: −300, −270 (not constant); ratios: 0.9625, 0.9649 (not constant). The rule mixes multiplication and addition.
      explanation: |
        Three points, one per part. (a) the multiplication must come before the addition. (b) both values. (c) "neither" with numerical justification from differences and ratios.
