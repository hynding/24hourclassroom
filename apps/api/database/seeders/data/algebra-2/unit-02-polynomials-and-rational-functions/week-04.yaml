      prompt: |
        A sheet of card is 10 cm by 16 cm. A square of side x cm is cut from each corner and the sides are folded up to make an open box.

        Write a full response that (1) writes the volume V(x) in factored form and expands it to standard form, (2) states the sensible domain for x and explains it, (3) completes a table of V(x) for x = 1, 1.5, 2, 2.5, 3 and uses it to estimate the value of x that gives the largest volume, and (4) explains what the factored form tells you about the graph of V that the standard form does not show directly.
      answer: |
        (1) V(x) = x(16 − 2x)(10 − 2x) = x(160 − 32x − 20x + 4x²) = 4x³ − 52x² + 160x.
        (2) All three dimensions must be positive. 10 − 2x > 0 gives x < 5 (and then 16 − 2x > 0 automatically), so 0 < x < 5.
        (3) V(1) = 1 · 14 · 8 = 112; V(1.5) = 1.5 · 13 · 7 = 136.5; V(2) = 2 · 12 · 6 = 144; V(2.5) = 2.5 · 11 · 5 = 137.5; V(3) = 3 · 10 · 4 = 120. The largest volume in the table is at x = 2, so the best cut is about 2 cm (a graph confirms the maximum is at exactly x = 2, where V = 144).
        (4) The factored form shows the zeros directly: V = 0 at x = 0, x = 8 and x = 5, so the graph crosses the horizontal axis there, and the model's domain lies between the first two zeros that matter (0 and 5). The standard form shows the degree and leading coefficient but hides where the volume is zero.
      explanation: |
        Six points: 1 for the factored form and 1 for a correct expansion; 1 for the domain 0 < x < 5 with the reason; 2 for a correct table (allow one arithmetic slip) and the estimate x ≈ 2; 1 for explaining that the factored form reveals the zeros (x-intercepts) and so the sensible domain.
