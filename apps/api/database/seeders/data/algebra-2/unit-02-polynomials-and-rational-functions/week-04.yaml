week: 4
unit: 2
title: "Introducing Polynomials"
topics: ["2.1", "2.2", "2.3", "2.4"]
guide: guides/week-04.md
guide_description: |
  Where polynomials come from: the volume of a box folded from a sheet of card (a cubic) and the balance of
  repeated deposits at compound interest (a polynomial in the growth factor). Then the vocabulary (term,
  coefficient, degree, leading term, standard form), what is and is not a polynomial, and adding, subtracting and
  multiplying polynomials with a grid, including why the result is always another polynomial. Worked examples:
  a box from a square sheet, a three-deposit balance, the area of a garden path.
flashcards_description: |
  27 cards on the box and deposit models, polynomial vocabulary, degree and leading coefficient, and combining
  polynomials.

flashcards:
  - front: Open box from a 20 by 30 sheet with corner squares of side x → volume expression
    back: |
      Height x, length 30 − 2x, width 20 − 2x, so V(x) = x(30 − 2x)(20 − 2x). Expanded: 4x³ − 100x² + 600x, a cubic.
    topic_code: "2.1"
  - front: Sensible domain for the box volume model → how to find it
    back: |
      Every dimension must be positive. For a 20 by 30 sheet, 20 − 2x > 0 gives x < 10, so 0 < x < 10. Outside that range the formula gives meaningless values such as V(12) = −288.
    topic_code: "2.1"
  - front: Maximum volume of the box → how it is found
    back: |
      From a table or graph of V(x): the volume rises, peaks (near x ≈ 3.9 for the 20 by 30 sheet, V ≈ 1056) and falls to 0 at x = 10. Technology, not algebra, locates the peak at this stage.
    topic_code: "2.1"
  - front: Factored form versus expanded form of V(x) → what each shows
    back: |
      Factored, x(30 − 2x)(20 − 2x), shows where the volume is 0 (x = 0, 10, 15). Expanded, 4x³ − 100x² + 600x, shows the degree (3) and the leading term.
    topic_code: "2.1"
  - front: Yearly deposits at growth factor x → why the balance is a polynomial
    back: |
      Each deposit grows for a different number of years, so a $500 deposit made 4, 3, 2 and 1 years ago is worth 500x⁴ + 500x³ + 500x² + 500x. The deposits are the coefficients and the years are the exponents.
    topic_code: "2.2"
  - front: Growth factor x for 5% interest → value and use
    back: |
      x = 1.05. Substituting into the deposit polynomial 500x⁴ + 500x³ + 500x² + 500x gives about $2,262.82 after four deposits.
    topic_code: "2.2"
  - front: Why keep the deposit balance as a polynomial instead of a number → reason
    back: |
      With x as a variable you can ask new questions: which rate gives $2,400 (graph and read off x ≈ 1.075), or how a different deposit pattern changes the coefficients.
    topic_code: "2.2"
  - front: Polynomial → definition
    back: |
      A sum of terms, each a number times a whole-number power of the variable, such as 4x³ − 2x + 7. A single number or a single power of x also counts.
    topic_code: "2.3"
  - front: Expressions that are not polynomials → examples and why
    back: |
      1/x and x⁻² (negative exponent), √x (fractional exponent), 2ˣ (variable in the exponent). Only whole-number exponents on the variable are allowed.
    topic_code: "2.3"
  - front: Degree of a polynomial → definition
    back: |
      The highest exponent among its terms. 2x − 5x⁴ + 3 has degree 4. A nonzero constant has degree 0.
    topic_code: "2.3"
  - front: Leading term and leading coefficient → definition
    back: |
      The term of highest degree and the number in front of it. For −5x⁴ + x² + 2x + 3 the leading term is −5x⁴ and the leading coefficient is −5.
    topic_code: "2.3"
  - front: Standard form of a polynomial → what it means
    back: |
      Terms written in decreasing degree: 2x − 5x⁴ + 3 + x² becomes −5x⁴ + x² + 2x + 3. Missing degrees have coefficient 0 (the x³ coefficient here is 0).
    topic_code: "2.3"
  - front: Constant term of a polynomial → what it tells you
    back: |
      The term with no variable, which is the polynomial's value at x = 0. For 4x³ − 100x² + 600x the constant term is 0, so the graph passes through the origin.
    topic_code: "2.3"
  - front: Names by degree → 0 through 5
    back: |
      Degree 0 constant, 1 linear, 2 quadratic, 3 cubic, 4 quartic, 5 quintic.
    topic_code: "2.3"
  - front: Degree and leading coefficient of (x + 2)(x − 3)(2x + 1) without expanding → how
    back: |
      Multiply the leading terms: x · x · 2x = 2x³, so degree 3 and leading coefficient 2. The constant term is the product of the constants: 2 · (−3) · 1 = −6.
    topic_code: "2.3"
  - front: Adding polynomials → procedure
    back: |
      Combine like terms (same power of x). (5x² − 3x + 1) + (−5x² + 7x − 9) = 4x − 8. The degree can drop when leading terms cancel.
    topic_code: "2.4"
  - front: Subtracting polynomials → the sign rule
    back: |
      Subtract every term of the second polynomial, not just the first: (3x³ − 2x + 5) − (x³ + 4x² − 2x − 1) = 2x³ − 4x² + 6.
    topic_code: "2.4"
  - front: Multiplying polynomials with a grid → procedure
    back: |
      Put the terms of one polynomial across the top and the other down the side, fill each cell with the product, then add all the cells and combine like terms.
    topic_code: "2.4"
  - front: (x² − 3x + 2)(2x + 5) → expand
    back: |
      2x³ − 6x² + 4x + 5x² − 15x + 10 = 2x³ − x² − 11x + 10.
    topic_code: "2.4"
  - front: Degree of a product of polynomials → rule
    back: |
      The sum of the degrees, because the leading terms multiply: a degree-2 times a degree-1 is degree 3. The leading coefficient of the product is the product of the leading coefficients.
    topic_code: "2.4"
  - front: Degree of a sum of polynomials → rule
    back: |
      At most the larger of the two degrees, and possibly less if the leading terms cancel: (x² + x) + (−x² + 3) = x + 3 has degree 1.
    topic_code: "2.4"
  - front: Closure of polynomials → meaning
    back: |
      Adding, subtracting or multiplying two polynomials always gives another polynomial, because the exponents stay whole numbers. Division can produce a non-polynomial such as (x² + 1)/(x − 2).
    topic_code: "2.4"
  - front: (x + 3)(x² − 3x + 9) → expand
    back: |
      x³ − 3x² + 9x + 3x² − 9x + 27 = x³ + 27. The middle terms cancel, a sum of cubes pattern.
    topic_code: "2.4"
  - front: (x − 4)² → expand correctly
    back: |
      x² − 8x + 16. The cross term −8x comes from −4x twice; writing x² + 16 is the classic error.
    topic_code: "2.4"
  - front: Area of a 1-unit path around an (x + 6) by (x − 2) garden → polynomial
    back: |
      Outer rectangle (x + 8)(x) = x² + 8x minus garden (x + 6)(x − 2) = x² + 4x − 12 gives 4x + 12. The x² terms cancel, so the path area is linear in x.
    topic_code: "2.4"
  - front: Error-spot → "x² + x² = x⁴"
    back: |
      Adding like terms adds coefficients: x² + x² = 2x². Exponents add only when powers are multiplied: x² · x² = x⁴.
    topic_code: "2.4"
  - front: Which form to use when → factored or standard
    back: |
      Factored form shows zeros and, in models, the dimensions. Standard form shows degree, leading coefficient and constant term, and is the form for adding and lining up terms.
    topic_code: "2.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (lessons 2.1 to 2.4: the box and deposit models,
    polynomial vocabulary, and adding, subtracting and multiplying polynomials), with about a third reviewing
    Unit 1 (sequence types, nth-term formulas and sums). Includes a shared-context set on a box model. Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: the box (2.1, 2.3)
    - slug: alg2-u02-w04-q01
      type: multiple_choice
      topic_code: "2.1"
      source: "IM Algebra 2, Unit 2, Lesson 1"
      points: 1
      stimulus: |
        A sheet of card measures 12 cm by 18 cm. A square of side x cm is cut from each corner and the sides are folded up to make an open box.
      prompt: |
        Which expression gives the volume of the box in cm³?
      options:
        - "x(12 − x)(18 − x)"
        - "x(12 − 2x)(18 − 2x)"
        - "(12 − 2x)(18 − 2x)"
        - "x · 12 · 18"
      option_explanations:
        - |
          Each side loses two squares, one at each end, so the dimensions shrink by 2x, not x.
        - |
          Correct. The height is x and the base is (12 − 2x) by (18 − 2x), so V = x(12 − 2x)(18 − 2x).
        - |
          This is the area of the base, with no height; volume needs the factor x.
        - |
          The base shrinks when the corners are removed; it is not the full sheet.
      answer: 1
    - slug: alg2-u02-w04-q02
      type: multiple_choice
      topic_code: "2.1"
      source: "IM Algebra 2, Unit 2, Lesson 1"
      points: 1
      stimulus: |
        A sheet of card measures 12 cm by 18 cm. A square of side x cm is cut from each corner and the sides are folded up to make an open box.
      prompt: |
        Which values of x make sense for this box?
      options:
        - "0 < x < 6"
        - "0 < x < 9"
        - "0 < x < 12"
        - "All real numbers"
      option_explanations:
        - |
          Correct. The width 12 − 2x must be positive, so x < 6; the length 18 − 2x is then automatically positive.
        - |
          At x = 7 the width 12 − 14 = −2 is negative; x < 9 keeps only the length positive.
        - |
          Cutting 12 cm squares from a 12 cm side leaves nothing; the constraint is much tighter.
        - |
          Negative lengths and lengths bigger than the sheet have no physical meaning.
      answer: 0
    - slug: alg2-u02-w04-q03
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Algebra 2, Unit 2, Lesson 3"
      points: 1
      stimulus: |
        A sheet of card measures 12 cm by 18 cm. A square of side x cm is cut from each corner and the sides are folded up to make an open box.
      prompt: |
        When the volume expression is written in standard form, what are its degree and leading coefficient?
      options:
        - "Degree 2, leading coefficient 4"
        - "Degree 3, leading coefficient 1"
        - "Degree 3, leading coefficient 4"
        - "Degree 3, leading coefficient 216"
      option_explanations:
        - |
          Three linear factors multiply to degree 3, not 2.
        - |
          The leading term is x · (−2x) · (−2x) = 4x³, so the leading coefficient is 4.
        - |
          Correct. x(12 − 2x)(18 − 2x) = 4x³ − 60x² + 216x, degree 3 with leading coefficient 4.
        - |
          216 is the coefficient of x (12 · 18), not the leading coefficient.
      answer: 2
    - slug: alg2-u02-w04-q04
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Algebra 2, Unit 2, Lesson 2"
      points: 1
      prompt: |
        $300 is deposited at the start of each year for three years into an account whose balance is multiplied by x each year. Which polynomial gives the balance at the end of the third year?
      options:
        - "300x³"
        - "900x³"
        - "300x³ + 300x² + 300x"
        - "300x² + 300x + 300"
      option_explanations:
        - |
          Only the first deposit grows for three years; the others grow for two years and one year.
        - |
          Treating all $900 as deposited at the start overstates the growth of the later deposits.
        - |
          Correct. The three deposits grow for 3, 2 and 1 years: 300x³ + 300x² + 300x.
        - |
          This would be right if each deposit were made at the end of the year, with the last one earning nothing; here each deposit earns at least one year of growth.
      answer: 2
    - slug: alg2-u02-w04-q05
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Algebra 2, Unit 2, Lesson 3"
      points: 1
      prompt: |
        Which expression is NOT a polynomial?
      options:
        - "x⁴ − 3x + 1/2"
        - "7"
        - "3x² + 2/x"
        - "√2 · x³"
      option_explanations:
        - |
          A fraction as a coefficient is fine; the exponents on x are 4, 1 and 0.
        - |
          A constant such as 7 is a polynomial of degree 0, with no variable at all.
        - |
          Correct. 2/x is 2x⁻¹, and a negative exponent on the variable is not allowed in a polynomial.
        - |
          An irrational coefficient is allowed; the exponent on x is the whole number 3.
      answer: 2
    - slug: alg2-u02-w04-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        What is (4x³ − x² + 6) − (x³ + 5x² − 2x − 3)?
      options:
        - "3x³ − 6x² + 2x + 9"
        - "3x³ + 4x² − 2x + 3"
        - "3x³ − 6x² − 2x + 3"
        - "5x³ + 4x² − 2x + 3"
      option_explanations:
        - |
          Correct. Subtract every term: 4x³ − x³ = 3x³, −x² − 5x² = −6x², 0 − (−2x) = 2x, 6 − (−3) = 9.
        - |
          This changes the sign of only the first term of the second polynomial; every term must be subtracted.
        - |
          The −2x and −3 become +2x and +9 when subtracted.
        - |
          The cubes are subtracted, not added: 4x³ − x³ = 3x³.
      answer: 0
    - slug: alg2-u02-w04-q07
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        What is (x − 5)(x² + 2x − 1)?
      options:
        - "x³ − 3x² − 11x + 5"
        - "x³ + 2x² − x − 5"
        - "x³ − 3x² − 9x − 5"
        - "x³ − 3x² + 11x + 5"
      option_explanations:
        - |
          Correct. x³ + 2x² − x − 5x² − 10x + 5 = x³ − 3x² − 11x + 5.
        - |
          This multiplies only by x and then subtracts 5; the −5 must multiply every term of the quadratic.
        - |
          The x terms are −x and −10x, which add to −11x, and the constant is (−5)(−1) = +5.
        - |
          The x coefficient is −1 − 10 = −11, not +11.
      answer: 0
    - slug: alg2-u02-w04-q08
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Without expanding, what is the degree of (2x² − 1)(x³ + x)(x − 7)?
      options:
        - "3"
        - "5"
        - "6"
        - "7"
      option_explanations:
        - |
          3 is the largest single degree; degrees add when polynomials are multiplied.
        - |
          2 + 3 = 5 accounts for only the first two factors; the third adds one more.
        - |
          Correct. The leading terms multiply: 2x² · x³ · x = 2x⁶, so the degree is 2 + 3 + 1 = 6.
        - |
          7 is the constant in the last factor, not a degree.
      answer: 2
    - slug: alg2-u02-w04-q09
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Algebra 2, Unit 2, Lesson 3"
      points: 1
      prompt: |
        A polynomial is 5x − 8x³ + 2 − x⁶. Which statement is true?
      options:
        - "Its leading coefficient is 5 and its degree is 6."
        - "Its leading coefficient is −1 and its constant term is 2."
        - "Its leading coefficient is −8 and its degree is 3."
        - "Its standard form is 5x − 8x³ + 2 − x⁶."
      option_explanations:
        - |
          5 is the coefficient of the first term as written, not of the highest-degree term.
        - |
          Correct. In standard form, −x⁶ − 8x³ + 5x + 2, the leading term is −x⁶ with coefficient −1 and the constant term is 2.
        - |
          −8x³ is not the highest-degree term; −x⁶ is.
        - |
          Standard form lists terms from highest to lowest degree: −x⁶ − 8x³ + 5x + 2.
      answer: 1
    - slug: alg2-u02-w04-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Algebra 2, Unit 2, Lesson 2"
      points: 1
      prompt: |
        The balance from a series of deposits is B(x) = 200x³ + 200x² + 200x, where x is the yearly growth factor. What is B(1.1), to the nearest cent?
      options:
        - "$662.00"
        - "$728.20"
        - "$600.00"
        - "$796.00"
      option_explanations:
        - |
          662 is 200(1.21 + 1.1 + 1), which treats the first deposit as growing for only two years.
        - |
          Correct. 200(1.331) + 200(1.21) + 200(1.1) = 266.20 + 242 + 220 = 728.20.
        - |
          600 is the balance with no growth at all (x = 1).
        - |
          796 is 200(1.331 + 1.21 + 1.1 + 1), which adds a fourth deposit that was never made.
      answer: 1
    - slug: alg2-u02-w04-q11
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Algebra 2, Unit 1, Lesson 11"
      points: 1
      prompt: |
        What is the sum of the first 16 terms of the arithmetic sequence 12, 15, 18, …?
      options:
        - "57"
        - "552"
        - "1104"
        - "576"
      option_explanations:
        - |
          57 is the 16th term (12 + 3·15), not the sum.
        - |
          Correct. a(16) = 57, so S(16) = 16 · (12 + 57)/2 = 16 · 34.5 = 552.
        - |
          1104 is 16 · 69 without the division by 2.
        - |
          576 is 16 · 36, which uses an average that does not come from the first and last terms.
      answer: 1
    - slug: alg2-u02-w04-q12
      type: multiple_choice
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        A geometric sequence has a(1) = 7 and r = 10. Which is the first term greater than one million?
      options:
        - "a(6)"
        - "a(7)"
        - "a(8)"
        - "a(1,000,000)"
      option_explanations:
        - |
          a(6) = 7 · 10⁵ = 700,000, still below one million.
        - |
          Correct. a(7) = 7 · 10⁶ = 7,000,000, and the previous term is 700,000.
        - |
          a(8) = 70,000,000 is well past one million, but a(7) was already past it.
        - |
          The term number is tiny because each step multiplies by 10.
      answer: 1
    - slug: alg2-u02-w04-q13
      type: multi_select
      topic_code: "2.3"
      source: "IM Algebra 2, Unit 2, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are polynomials? Select all that apply.
      options:
        - "x³ − x² + x − 1"
        - "2ˣ + 1"
        - "(x + 1)(x − 4)(x + 9)"
        - "x² + √x"
        - "−6"
      option_explanations:
        - |
          Correct. Every term is a number times a whole-number power of x.
        - |
          The variable is in the exponent, which makes it exponential, not a polynomial.
        - |
          Correct. A product of polynomials is a polynomial (closure); expanded, it is a cubic.
        - |
          √x is x to the power 1/2, and fractional exponents are not allowed.
        - |
          Correct. A constant is a polynomial of degree 0.
      answer: [0, 2, 4]
    - slug: alg2-u02-w04-q14
      type: multi_select
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Let p(x) = x² + 3x and q(x) = −x² + x + 4. Which statements are true? Select all that apply.
      options:
        - "p(x) + q(x) = 4x + 4"
        - "p(x) − q(x) = 2x² + 2x − 4"
        - "The degree of p(x) + q(x) is 2."
        - "The degree of p(x) · q(x) is 4."
        - "p(x) · q(x) has leading coefficient −1."
      option_explanations:
        - |
          Correct. The x² terms cancel: x² − x² + 3x + x + 4 = 4x + 4.
        - |
          Correct. x² + 3x + x² − x − 4 = 2x² + 2x − 4.
        - |
          The x² terms cancel in the sum, so the degree drops to 1.
        - |
          Correct. Degrees add under multiplication: 2 + 2 = 4.
        - |
          Correct. The leading coefficients multiply: 1 · (−1) = −1.
      answer: [0, 1, 3, 4]
    - slug: alg2-u02-w04-q15
      type: true_false
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        True or false: The sum of two polynomials of degree 5 always has degree 5.
      answer: false
      explanation: |
        False. If the leading terms cancel, the degree drops: (x⁵ + x) + (−x⁵ + 2) = x + 2 has degree 1. The degree of a sum is at most the larger degree, never more.
    - slug: alg2-u02-w04-q16
      type: true_false
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 1
      prompt: |
        True or false: The sequence 1, 2, 4, 7, 11, 16 is geometric because its first three terms double.
      answer: false
      explanation: |
        False. The ratios 2, 2, 1.75, 1.57, 1.45 are not constant, so the sequence is not geometric; the differences 1, 2, 3, 4, 5 grow by one each step, so it is neither arithmetic nor geometric. A pattern in the first few terms must hold for every pair.
    - slug: alg2-u02-w04-q17
      type: fill_blank
      topic_code: "2.3"
      source: "IM Algebra 2, Unit 2, Lesson 3"
      points: 1
      prompt: |
        The leading coefficient of the polynomial 4x − 9x⁴ + x² + 12 is ____.
      answer: ["-9", "−9"]
      explanation: |
        In standard form the polynomial is −9x⁴ + x² + 4x + 12; the leading term is −9x⁴, so the leading coefficient is −9.
    - slug: alg2-u02-w04-q18
      type: fill_blank
      topic_code: "1.9"
      source: "IM Algebra 2, Unit 1, Lesson 9"
      points: 1
      prompt: |
        A sequence has the table n = 1 → 54, n = 2 → 18, n = 3 → 6, n = 4 → 2. Its explicit equation with first term a(1) is a(n) = ____.
      answer: ["54 · (1/3)ⁿ⁻¹", "54·(1/3)ⁿ⁻¹", "54 * (1/3)^(n-1)", "54*(1/3)^(n-1)", "54(1/3)^(n-1)", "54 · (1/3)^(n − 1)", "162 · (1/3)ⁿ", "54/3^(n-1)"]
      explanation: |
        Each term is one third of the previous one, so r = 1/3 with a(1) = 54: a(n) = 54 · (1/3)ⁿ⁻¹. Check: a(4) = 54/27 = 2.
    - slug: alg2-u02-w04-q19
      type: numeric
      topic_code: "2.1"
      source: "IM Algebra 2, Unit 2, Lesson 1"
      points: 1
      prompt: |
        A square sheet 24 cm on a side has squares of side 4 cm cut from each corner, and the sides are folded up. What is the volume of the box in cm³? Give a whole number.
      answer: { value: 1024, tolerance: 0 }
      explanation: |
        V = 4 · (24 − 8)² = 4 · 16² = 4 · 256 = 1024 cm³.
    - slug: alg2-u02-w04-q20
      type: numeric
      topic_code: "1.2"
      source: "IM Algebra 2, Unit 1, Lesson 2"
      points: 1
      prompt: |
        A geometric sequence has a(3) = 48 and a(5) = 768, with all terms positive. What is a(1)? Give the exact value.
      answer: { value: 3, tolerance: 0 }
      explanation: |
        r² = 768/48 = 16, so r = 4. Then a(2) = 48/4 = 12 and a(1) = 12/4 = 3.
    - slug: alg2-u02-w04-q21
      type: numeric
      topic_code: "2.2"
      source: "IM Algebra 2, Unit 2, Lesson 2"
      points: 1
      prompt: |
        A deposit of $100 at the start of each year for 3 years grows at 8% a year. Using the polynomial 100x³ + 100x² + 100x with x = 1.08, what is the balance at the end of year 3? Give your answer to the nearest cent.
      answer: { value: 350.61, tolerance: 0.02 }
      explanation: |
        100(1.259712) + 100(1.1664) + 100(1.08) = 125.97 + 116.64 + 108 = 350.61 dollars.
    - slug: alg2-u02-w04-q22
      type: short_answer
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 3
      prompt: |
        Let f(x) = 2x³ − x + 4 and g(x) = x² − 3x.

        (a) Find f(x) − g(x) in standard form.
        (b) Find f(x) · g(x) in standard form, showing a grid or the products you add.
        (c) State the degree and leading coefficient of f(x) · g(x) and explain how you could have predicted both without multiplying.
      answer: |
        (a) 2x³ − x² + 2x + 4.
        (b) 2x³ · x² = 2x⁵, 2x³ · (−3x) = −6x⁴, −x · x² = −x³, −x · (−3x) = 3x², 4 · x² = 4x², 4 · (−3x) = −12x. Sum: 2x⁵ − 6x⁴ − x³ + 7x² − 12x.
        (c) Degree 5 and leading coefficient 2: degrees add (3 + 2) and leading coefficients multiply (2 · 1).
      explanation: |
        Three points, one per part. (a) every sign must be right. (b) the six products or a grid must be shown and the sum correct. (c) both the values and the reasoning (degrees add, leading coefficients multiply).
