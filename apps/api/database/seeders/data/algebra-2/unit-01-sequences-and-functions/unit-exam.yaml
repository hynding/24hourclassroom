    type: short_answer
    topic_code: "1.10"
    source: "IM Algebra 2, Unit 1, Lesson 10"
    points: 3
    prompt: |
      A gym's membership is 400 people. Model X assumes 25 new members join each month and no one leaves. Model Y assumes membership grows by 6% each month.

      (a) Write an equation for each model, taking n = 0 as now.
      (b) Find each model's prediction after 12 months (nearest whole person).
      (c) Explain which model you would trust more for a prediction 5 years from now, and why.
    answer: |
      (a) X(n) = 400 + 25n; Y(n) = 400 · 1.06ⁿ.
      (b) X(12) = 700; Y(12) = 400 · 2.0122 ≈ 805.
      (c) Neither is reliable at 60 months, but Model Y is worse: it predicts 400 · 1.06⁶⁰ ≈ 13,177 members, far beyond what a gym can hold, whereas Model X predicts 1,900, which is at least conceivable. Growth by a fixed percentage cannot go on indefinitely in a space-limited business, and both models ignore members leaving.
    explanation: |
      Three points, one per part. (a) needs both equations with n (not n − 1). (b) accept 804 or 805 for Y. (c) the point is for recognising the limits of unbounded growth with a reason; a student who prefers X with the "space limit" argument or who rejects both with a sound reason earns it.
  - slug: alg2-u01-exam-q40
    type: long_answer
    topic_code: "1.11"
    source: "IM Algebra 2, Unit 1, Lesson 11"
    points: 6
    prompt: |
      A pile of pipes is stacked so that the bottom layer has 30 pipes and each layer above has one fewer pipe than the layer below. The top layer has 11 pipes.

      Write a full response that (1) writes an explicit formula for p(n), the number of pipes in layer n counted from the bottom, (2) finds the number of layers, showing the equation you solve, (3) finds the total number of pipes using the pairing idea and explains why the pairs all have the same total, and (4) checks the total with the formula S(n) = n(a(1) + a(n))/2 and comments on whether the formula would work if each layer had, say, half as many pipes as the one below.
    answer: |
      (1) p(1) = 30, d = −1, so p(n) = 30 − (n − 1) = 31 − n.
      (2) 31 − n = 11 gives n = 20 layers.
      (3) Pair the bottom with the top (30 + 11), the second with the second-from-top (29 + 12), and so on. Each pair adds to 41, because moving up one layer removes 1 pipe from one member of the pair and adds 1 to the other. Twenty layers make 10 pairs, so the total is 10 · 41 = 410 pipes.
      (4) S(20) = 20 · (30 + 11)/2 = 20 · 20.5 = 410, which agrees. If each layer had half as many pipes as the one below, the sequence would be geometric; the gaps would not be equal, the pairs would not add to a constant, and the formula would not apply. You would add the terms directly instead.
    explanation: |
      Six points: 1 for a correct formula for p(n); 1 for 20 layers with the equation; 2 for the total 410 by pairing with the explanation of why pairs are constant (1 if only the number is right); 1 for the formula check; 1 for explaining that the formula fails for a geometric stack because the gaps are unequal.
