week: 2
unit: 1
title: "Sequences as Functions and the nth Term"
topics: ["1.5", "1.6", "1.7", "1.8"]
guide: guides/week-02.md
guide_description: |
  A sequence is a function whose domain is the positive integers (or the whole numbers), so it has function
  notation, a domain and a graph made of separate points. Tables, graphs, recursive definitions and explicit
  formulas for arithmetic sequences (points on a line) and geometric sequences (points on an exponential curve),
  and the nth-term formulas a(n) = a(1) + (n − 1)d and a(n) = a(1) · rⁿ⁻¹. Worked examples: reading d or r from
  two points, finding which term has a given value, and comparing arithmetic and geometric growth.
flashcards_description: |
  28 cards on sequences as functions, domains, discrete graphs, the four representations of arithmetic and
  geometric sequences, and the explicit nth-term formulas.

flashcards:
  - front: Sequence as a function → what the inputs and outputs are
    back: |
      The input is the term number n and the output is the term a(n). The sequence 11, 17, 23 is the function with a(1) = 11, a(2) = 17, a(3) = 23.
    topic_code: "1.5"
  - front: Domain of a sequence → the usual choices
    back: |
      The positive integers {1, 2, 3, …} when the first term is a(1), or the whole numbers {0, 1, 2, …} when a starting value a(0) is natural (a population at time 0, say). State which you are using.
    topic_code: "1.5"
  - front: Graph of a sequence → why it is dots, not a line
    back: |
      The function has outputs only at whole-number inputs, so the graph is a set of separate points such as (1, 3), (2, 7), (3, 11). A connecting line would show values that do not exist.
    topic_code: "1.5"
  - front: a(6) = 59 in sequence language → what it says
    back: |
      The sixth term of the sequence is 59. Function notation for sequences works exactly like f(x): input the position, output the term.
    topic_code: "1.5"
  - front: Solving a(n) = 403 for a sequence → what you are finding
    back: |
      The term number n whose term equals 403. With a(n) = 7 + 4(n − 1): 4(n − 1) = 396, so n = 100.
    topic_code: "1.8"
  - front: Same sequence, domain starting at 0 vs 1 → how the formula changes
    back: |
      5, 10, 20, 40 is a(n) = 5 · 2ⁿ⁻¹ if the first term is a(1), but a(n) = 5 · 2ⁿ if the first term is a(0). The exponent counts steps from the starting term.
    topic_code: "1.5"
  - front: Four representations of an arithmetic sequence → list them
    back: |
      A table (outputs rise by d each row), a graph (points on a line of slope d), a recursive definition (a(n) = a(n − 1) + d) and an explicit formula (a(n) = a(1) + (n − 1)d).
    topic_code: "1.6"
  - front: Graph of an arithmetic sequence → what shape the points make
    back: |
      Points that lie on a straight line whose slope is the common difference d. Evenly spaced inputs give evenly spaced outputs.
    topic_code: "1.6"
  - front: Reading d from two points on an arithmetic sequence's graph → how
    back: |
      Rise over run, like slope. From (2, 17) and (5, 35): d = (35 − 17)/(5 − 2) = 6. Then step back to the first term: a(1) = 17 − 6 = 11.
    topic_code: "1.6"
  - front: a(n) = 40 − 5(n − 1) simplified to 45 − 5n → is 45 a term?
    back: |
      No. 45 would be a(0), which is outside a domain that starts at 1. The first term is a(1) = 40. The a(1) + (n − 1)d form keeps the first term visible.
    topic_code: "1.6"
  - front: Four representations of a geometric sequence → list them
    back: |
      A table (outputs multiply by r each row), a graph (points on an exponential curve), a recursive definition (a(n) = r · a(n − 1)) and an explicit formula (a(n) = a(1) · rⁿ⁻¹).
    topic_code: "1.7"
  - front: Graph of a geometric sequence with r > 1 → shape
    back: |
      Points on an exponential curve that rises faster and faster. The vertical gaps between consecutive points grow by the factor r each step.
    topic_code: "1.7"
  - front: Graph of a geometric sequence with 0 < r < 1 → shape
    back: |
      Points that drop quickly at first and then flatten toward the horizontal axis, never reaching it. Example: 100, 50, 25, 12.5, …
    topic_code: "1.7"
  - front: Graph of a geometric sequence with r < 0 → shape
    back: |
      Points that alternate above and below the horizontal axis. If |r| > 1 they move further from the axis each step; if |r| < 1 they close in on it.
    topic_code: "1.7"
  - front: Telling arithmetic from geometric on a graph → the quick test
    back: |
      Arithmetic points are evenly spaced vertically (constant rise); geometric points are not (the rise changes by a constant factor). Check the gaps between consecutive points.
    topic_code: "1.7"
  - front: Geometric sequence from two terms two steps apart → how to find r
    back: |
      Two steps multiply by r², so r² = (later term)/(earlier term). From a(2) = 50 and a(4) = 2, r² = 1/25 and r = ±1/5; use the signs of the terms to decide.
    topic_code: "1.7"
  - front: nth term of an arithmetic sequence → formula
    back: |
      a(n) = a(1) + (n − 1)d. Reason: to get from a(1) to a(n) you take n − 1 steps, each adding d.
    topic_code: "1.8"
  - front: nth term of a geometric sequence → formula
    back: |
      a(n) = a(1) · rⁿ⁻¹. Reason: to get from a(1) to a(n) you take n − 1 steps, each multiplying by r.
    topic_code: "1.8"
  - front: nth-term formulas when the domain starts at 0 → how they change
    back: |
      a(n) = a(0) + nd and a(n) = a(0) · rⁿ, because from a(0) to a(n) is n steps, not n − 1.
    topic_code: "1.8"
  - front: Why the exponent is n − 1, not n → check with the first term
    back: |
      a(1) must equal the first term. a(1) · r¹⁻¹ = a(1) · 1 = a(1), as required; a(1) · r¹ would be wrong unless r = 1.
    topic_code: "1.8"
  - front: Explicit versus recursive → which to use when
    back: |
      Use the explicit formula to jump to a distant term (a(50)) or to solve for n. Use the recursive rule to generate terms one after another, as in a spreadsheet, or when the situation describes a step-by-step process.
    topic_code: "1.8"
  - front: a(50) for 7, 11, 15, 19, … → compute
    back: |
      d = 4 and a(1) = 7, so a(50) = 7 + 49 · 4 = 203.
    topic_code: "1.8"
  - front: a(10) for 6, 12, 24, … → compute
    back: |
      r = 2 and a(1) = 6, so a(10) = 6 · 2⁹ = 6 · 512 = 3072.
    topic_code: "1.8"
  - front: Arithmetic versus geometric growth in the long run → which wins
    back: |
      A geometric sequence with r > 1 eventually exceeds any arithmetic sequence, however large d is and however small it starts. 2 · 1.5ⁿ⁻¹ overtakes 1000 + 50(n − 1) before n = 20.
    topic_code: "1.8"
  - front: Error-spot → "a(n) = 3 · 4ⁿ, so a(1) = 3"
    back: |
      With that formula a(1) = 3 · 4 = 12, not 3. If the first term is meant to be 3 and the domain starts at 1, the formula is a(n) = 3 · 4ⁿ⁻¹.
    topic_code: "1.8"
  - front: Explicit formula for 2, 9, 16, 23, … → write it
    back: |
      a(1) = 2 and d = 7, so a(n) = 2 + 7(n − 1), which simplifies to 7n − 5.
    topic_code: "1.6"
  - front: Explicit formula for 250, 50, 10, 2, … → write it
    back: |
      a(1) = 250 and r = 1/5, so a(n) = 250 · (1/5)ⁿ⁻¹.
    topic_code: "1.7"
  - front: Which term of 5, 8, 11, 14, … equals 92? → solve
    back: |
      5 + 3(n − 1) = 92, so 3(n − 1) = 87, n − 1 = 29, n = 30. The 30th term is 92.
    topic_code: "1.8"

quiz:
  description: |
    22 questions · about 35 minutes · mostly on this week (lessons 1.5 to 1.8: sequences as functions, their
    representations and the nth-term formulas), with about a third reviewing week 1 (recursive rules, common
    ratios and differences, classifying sequences). Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    - slug: alg2-u01-w02-q01
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Algebra 2, Unit 1, Lesson 5"
      points: 1
      prompt: |
        A sequence is defined by f(1) = 12 and f(n) = f(n − 1) − 3 for n ≥ 2. Which statement about the graph of f is true?
      options:
        - "It is a line with slope −3 through (1, 12)."
        - "It is a set of separate points that lie on a line with slope −3."
        - "It is a curve that flattens out as n grows."
        - "It is a set of separate points that lie on a line with slope 12."
      option_explanations:
        - |
          The points lie on such a line, but the graph of a sequence is only the points at whole-number inputs; there is no f(1.5).
        - |
          Correct. The outputs 12, 9, 6, 3, … fall by 3 per step, so the points (1, 12), (2, 9), (3, 6), … lie on a line of slope −3 and are plotted as dots.
        - |
          A constant difference gives points on a line, not a curve; curves come from geometric sequences.
        - |
          12 is the first term, not the rate of change. The slope of the line through the points is the common difference, −3.
      answer: 1
    - slug: alg2-u01-w02-q02
      type: multiple_choice
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        Which explicit formula gives the nth term of the arithmetic sequence 9, 14, 19, 24, … with a(1) = 9?
      options:
        - "a(n) = 9 + 5n"
        - "a(n) = 9 + 5(n − 1)"
        - "a(n) = 9 · 5ⁿ⁻¹"
        - "a(n) = 5 + 9(n − 1)"
      option_explanations:
        - |
          This gives a(1) = 14, not 9. From a(1) to a(n) is n − 1 steps, so the multiplier on d is n − 1.
        - |
          Correct. a(1) = 9, d = 5, and a(n) = a(1) + (n − 1)d. Check: a(4) = 9 + 15 = 24.
        - |
          This is the geometric form; the sequence adds 5 each step rather than multiplying by 5.
        - |
          The first term and the common difference are swapped: this formula starts at 5 and adds 9.
      answer: 1
    - slug: alg2-u01-w02-q03
      type: multiple_choice
      topic_code: "1.7"
      source: "IM Algebra 2, Unit 1, Lesson 7"
      points: 1
      prompt: |
        Graph description: the points (1, 2), (2, 6), (3, 18) and (4, 54) are plotted, rising faster and faster. Which explicit formula fits the sequence shown?
      options:
        - "a(n) = 2 + 4(n − 1)"
        - "a(n) = 2 · 3ⁿ"
        - "a(n) = 2 · 3ⁿ⁻¹"
        - "a(n) = 3 · 2ⁿ⁻¹"
      option_explanations:
        - |
          The differences 4, 12, 36 are not constant, so the sequence is not arithmetic; the points do not lie on a line.
        - |
          This gives a(1) = 6. With the first term at n = 1, the exponent must be n − 1.
        - |
          Correct. The ratios 6/2, 18/6, 54/18 are all 3, so r = 3 with a(1) = 2, and a(n) = 2 · 3ⁿ⁻¹.
        - |
          This swaps the first term and the ratio: it gives 3, 6, 12, 24.
      answer: 2
    - slug: alg2-u01-w02-q04
      type: multiple_choice
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        For the arithmetic sequence a(n) = 4 + 6(n − 1), which term equals 154?
      options:
        - "n = 25"
        - "n = 26"
        - "n = 27"
        - "n = 150"
      option_explanations:
        - |
          a(25) = 4 + 6·24 = 148, which is six short of 154.
        - |
          Correct. 4 + 6(n − 1) = 154 gives 6(n − 1) = 150, n − 1 = 25, n = 26. Check: 4 + 150 = 154.
        - |
          a(27) = 4 + 6·26 = 160, which overshoots 154.
        - |
          150 is 154 − 4, the value of 6(n − 1), not the term number; it still needs to be divided by 6 and then have 1 added.
      answer: 1
    - slug: alg2-u01-w02-q05
      type: multiple_choice
      topic_code: "1.6"
      source: "IM Algebra 2, Unit 1, Lesson 6"
      points: 1
      prompt: |
        The graph of an arithmetic sequence contains the points (2, 31) and (6, 15). What is the first term of the sequence?
      options:
        - "35"
        - "39"
        - "27"
        - "47"
      option_explanations:
        - |
          Correct. d = (15 − 31)/(6 − 2) = −4, and stepping back one term from a(2) = 31 gives a(1) = 35.
        - |
          39 would be a(0), two steps back from a(2). The first term is a(1), one step back.
        - |
          27 is a(3), one step forward from a(2); the first term is one step back.
        - |
          47 uses d = +4 and steps back four times. The sequence is decreasing (31 to 15), so d is negative.
      answer: 0
    - slug: alg2-u01-w02-q06
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A geometric sequence has a(0) = 810 and a(2) = 90, and all of its terms are positive. Using a domain that starts at 0, which formula gives a(n)?
      options:
        - "a(n) = 810 · (1/3)ⁿ"
        - "a(n) = 810 · (1/3)ⁿ⁻¹"
        - "a(n) = 810 · (1/9)ⁿ"
        - "a(n) = 810 − 360n"
      option_explanations:
        - |
          Correct. Two steps multiply by r², so r² = 90/810 = 1/9 and r = 1/3 (positive). With a(0) as the first term the exponent is n.
        - |
          With a domain starting at 0, this formula gives a(0) = 810 · 3 = 2430, not 810. The exponent n − 1 belongs with a domain starting at 1.
        - |
          1/9 is r², the factor for two steps; the ratio per step is 1/3.
        - |
          The sequence is geometric, not arithmetic, and this formula gives a(2) = 90 only by coincidence; a(1) would be 450 rather than 270.
      answer: 0
    - slug: alg2-u01-w02-q07
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Algebra 2, Unit 1, Lesson 5"
      points: 1
      prompt: |
        A sequence models the number of bacteria in a dish at the end of each hour, starting from the moment the dish is prepared. Which domain is the most natural choice?
      options:
        - "All real numbers greater than or equal to 0"
        - "The whole numbers 0, 1, 2, 3, …"
        - "The positive integers 1, 2, 3, …"
        - "All real numbers"
      option_explanations:
        - |
          A sequence has only whole-number inputs; it does not give a value at 1.5 hours.
        - |
          Correct. The count when the dish is prepared is a natural starting value, a(0), so the domain begins at 0 and continues through the whole numbers.
        - |
          Starting at 1 would leave out the initial count at time 0; it is a valid choice, but less natural when there is an obvious starting value.
        - |
          Negative or fractional hours have no meaning here, and a sequence never has real-number inputs.
      answer: 1
    - slug: alg2-u01-w02-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "IM Algebra 2, Unit 1, Lesson 2"
      points: 1
      prompt: |
        Which of these sequences is geometric with a common ratio between −1 and 0?
      options:
        - "64, −32, 16, −8"
        - "64, −128, 256, −512"
        - "64, 32, 16, 8"
        - "64, −32, 0, 32"
      option_explanations:
        - |
          Correct. Each ratio is −1/2: the signs alternate and the terms shrink toward 0.
        - |
          The ratio is −2, which is less than −1; the terms grow in size.
        - |
          The ratio is 1/2, which is positive; the signs never change.
        - |
          The differences are all −32 at first and then +32, and the ratios are not constant (0/−32 = 0); this is not geometric.
      answer: 0
    - slug: alg2-u01-w02-q09
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 1
      prompt: |
        A sequence begins 2, 6, 12, 20, 30. Which description is correct?
      options:
        - "Arithmetic with common difference 4"
        - "Geometric with common ratio 3"
        - "Neither arithmetic nor geometric; the differences increase by 2 each time"
        - "Neither arithmetic nor geometric; the ratios are constant but the differences are not"
      option_explanations:
        - |
          The differences 4, 6, 8, 10 are not all 4, so the sequence is not arithmetic.
        - |
          6/2 = 3 but 12/6 = 2, so there is no common ratio.
        - |
          Correct. Differences 4, 6, 8, 10 grow by 2 each step and ratios 3, 2, 1.67, 1.5 are not constant, so it is neither (each term is n(n + 1)).
        - |
          The ratios are not constant either: 3, 2, 5/3, 3/2.
      answer: 2
    - slug: alg2-u01-w02-q10
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Algebra 2, Unit 1, Lesson 4"
      points: 1
      prompt: |
        A spreadsheet lists the terms of the sequence a(1) = 20, a(n) = 1.5 · a(n − 1). Which is the first term larger than 500?
      options:
        - "a(8)"
        - "a(9)"
        - "a(10)"
        - "a(25)"
      option_explanations:
        - |
          a(8) = 20 · 1.5⁷ ≈ 341.7, which is still below 500.
        - |
          Correct. a(9) = 20 · 1.5⁸ ≈ 512.6, and the previous term is about 341.7, so the ninth term is the first above 500.
        - |
          a(10) ≈ 768.9 is above 500, but a(9) was already above it.
        - |
          500/20 = 25 would be the answer if the rule added 20 each step; it multiplies by 1.5 instead, so the target is reached much sooner.
      answer: 1
    - slug: alg2-u01-w02-q11
      type: multi_select
      topic_code: "1.7"
      source: "IM Algebra 2, Unit 1, Lesson 7"
      points: 2
      partial_credit: true
      prompt: |
        A geometric sequence is defined by g(1) = 3 and g(n) = 2 · g(n − 1). Which of the following are true? Select all that apply.
      options:
        - "g(n) = 3 · 2ⁿ⁻¹"
        - "The graph of g is a set of points on an exponential curve."
        - "g(5) = 48"
        - "The points on the graph of g are evenly spaced vertically."
        - "g(n) = 6 · 2ⁿ⁻²"
      option_explanations:
        - |
          Correct. First term 3, ratio 2, n − 1 steps from the first term.
        - |
          Correct. Constant ratio means exponential growth, so the points rise faster and faster along a curve.
        - |
          Correct. 3, 6, 12, 24, 48: the fifth term is 48, and 3 · 2⁴ = 48 confirms it.
        - |
          The vertical gaps 3, 6, 12, 24 double each time; even spacing belongs to arithmetic sequences.
        - |
          Correct. 6 · 2ⁿ⁻² = 3 · 2 · 2ⁿ⁻² = 3 · 2ⁿ⁻¹, the same formula written from the second term.
      answer: [0, 1, 2, 4]
    - slug: alg2-u01-w02-q12
      type: multi_select
      topic_code: "1.6"
      source: "IM Algebra 2, Unit 1, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        An arithmetic sequence has the table n = 1 → 50, n = 2 → 44, n = 3 → 38, n = 4 → 32. Which statements are true? Select all that apply.
      options:
        - "The common difference is −6."
        - "An explicit formula is a(n) = 50 − 6(n − 1)."
        - "An explicit formula is a(n) = 56 − 6n."
        - "The tenth term is −10."
        - "The sequence first becomes negative at the eighth term."
      option_explanations:
        - |
          Correct. 44 − 50 = −6, and every later difference is also −6.
        - |
          Correct. First term 50, common difference −6, n − 1 steps.
        - |
          Correct. 50 − 6(n − 1) = 50 − 6n + 6 = 56 − 6n, the same formula simplified.
        - |
          a(10) = 56 − 6·10 = −4, not −10; the tenth term is only slightly negative.
        - |
          a(9) = 56 − 54 = 2 and a(10) = −4, so the first negative term is the tenth, not the eighth (a(8) = 8).
      answer: [0, 1, 2]
    - slug: alg2-u01-w02-q13
      type: true_false
      topic_code: "1.5"
      source: "IM Algebra 2, Unit 1, Lesson 5"
      points: 1
      prompt: |
        True or false: Because a sequence is a function, it is correct to draw its graph as a continuous line or curve through the plotted points.
      answer: false
      explanation: |
        False. A sequence is a function whose domain is a set of whole numbers, so it has no output between consecutive term numbers. Its graph is the plotted points only.
    - slug: alg2-u01-w02-q14
      type: true_false
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: For any arithmetic sequence with d > 0 and any geometric sequence with r > 1, the geometric sequence's terms are eventually larger than the arithmetic sequence's terms.
      answer: true
      explanation: |
        True. Repeated multiplication by a number greater than 1 grows without bound and its step sizes themselves grow, while an arithmetic sequence grows by the same fixed amount each step. However large d is and however small the geometric sequence starts, the geometric terms eventually win.
    - slug: alg2-u01-w02-q15
      type: fill_blank
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        For the geometric sequence a(n) = 5 · 2ⁿ⁻¹, the value of a(8) is ____.
      answer: ["640"]
      explanation: |
        a(8) = 5 · 2⁷ = 5 · 128 = 640. Seven steps of doubling take the first term 5 to the eighth term.
    - slug: alg2-u01-w02-q16
      type: fill_blank
      topic_code: "1.1"
      source: "IM Algebra 2, Unit 1, Lesson 1"
      points: 1
      prompt: |
        A sequence is defined by a(1) = 5 and a(n) = 3·a(n − 1) − 4. The value of a(4) is ____.
      answer: ["83"]
      explanation: |
        a(2) = 3·5 − 4 = 11, a(3) = 3·11 − 4 = 29, a(4) = 3·29 − 4 = 83. Three applications of the rule take the first term to the fourth.
    - slug: alg2-u01-w02-q17
      type: numeric
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        An arithmetic sequence has a(1) = −15 and common difference 3.5. Find a(41). Give the exact value.
      answer: { value: 125, tolerance: 0 }
      explanation: |
        a(41) = −15 + 40 · 3.5 = −15 + 140 = 125. Forty steps separate the first term from the 41st.
    - slug: alg2-u01-w02-q18
      type: numeric
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The graph of a geometric sequence passes through (1, 800) and (3, 128), and every term is positive. What is the fifth term? Give the exact value.
      answer: { value: 20.48, tolerance: 0.001 }
      explanation: |
        Two steps take 800 to 128, so r² = 128/800 = 0.16 and r = 0.4. Then a(4) = 128 · 0.4 = 51.2 and a(5) = 51.2 · 0.4 = 20.48.
    - slug: alg2-u01-w02-q19
      type: numeric
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 1
      prompt: |
        An arithmetic sequence has a(4) = 11 and a(10) = 38. What is its common difference? Give the exact value.
      answer: { value: 4.5, tolerance: 0 }
      explanation: |
        From term 4 to term 10 is six steps and the terms rise by 27, so d = 27/6 = 4.5.
    - slug: alg2-u01-w02-q20
      type: short_answer
      topic_code: "1.6"
      source: "IM Algebra 2, Unit 1, Lesson 6"
      points: 3
      prompt: |
        A theatre has 18 seats in the first row, and each row behind it has 4 more seats than the row in front.

        (a) Write a recursive definition for s(n), the number of seats in row n.
        (b) Write an explicit formula for s(n) and use it to find the number of seats in row 15.
        (c) The last row has 94 seats. How many rows does the theatre have? Show the equation you solve.
      answer: |
        (a) s(1) = 18, s(n) = s(n − 1) + 4 for n ≥ 2.
        (b) s(n) = 18 + 4(n − 1), so s(15) = 18 + 4·14 = 74 seats.
        (c) 18 + 4(n − 1) = 94 gives 4(n − 1) = 76, n − 1 = 19, n = 20. The theatre has 20 rows.
      explanation: |
        Three points, one per part. (a) needs both the starting value and the rule. (b) accept 4n + 14 as the formula; the row-15 value must be 74. (c) needs the equation and n = 20.
    - slug: alg2-u01-w02-q21
      type: short_answer
      topic_code: "1.7"
      source: "IM Algebra 2, Unit 1, Lesson 7"
      points: 3
      prompt: |
        Table of a sequence:

        | n | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|
        | b(n) | 1,250 | 250 | 50 | 10 |

        (a) Explain how you can tell from the table that b is geometric, and state the common ratio.
        (b) Write an explicit formula for b(n).
        (c) Describe the graph of b: what shape the points follow and what happens to them as n grows.
      answer: |
        (a) Each term divided by the previous term is the same: 250/1250 = 50/250 = 10/50 = 1/5, so b is geometric with r = 1/5.
        (b) b(n) = 1250 · (1/5)ⁿ⁻¹.
        (c) The points (1, 1250), (2, 250), (3, 50), (4, 10), … lie on a decreasing exponential curve: they drop steeply at first, then flatten out and get closer and closer to the horizontal axis without ever reaching it. They are separate dots, not a connected curve.
      explanation: |
        Three points, one per part. (a) must mention constant ratios (not just "it divides by 5") and give r = 1/5 or 0.2. (b) accept 1250 · 0.2ⁿ⁻¹ or 6250 · (1/5)ⁿ. (c) needs the decay shape and the approach to 0; award the point even without the "dots" remark.
    - slug: alg2-u01-w02-q22
      type: long_answer
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 6
      prompt: |
        Two offers are made for a 30-day job. Offer A pays $100 on day 1 and $25 more each day than the day before. Offer B pays $1 on day 1 and doubles the pay each day.

        Write a full response that (1) writes an explicit formula for the daily pay under each offer, with day 1 as the first term, (2) finds the pay on day 10 under each offer, (3) determines the first day on which Offer B pays more than Offer A, showing the values you compare, and (4) explains in general terms why a geometric sequence with ratio greater than 1 always ends up ahead of an arithmetic sequence.
      answer: |
        (1) A(n) = 100 + 25(n − 1); B(n) = 1 · 2ⁿ⁻¹ = 2ⁿ⁻¹.
        (2) A(10) = 100 + 25·9 = 325 dollars; B(10) = 2⁹ = 512 dollars.
        (3) A(8) = 275 and B(8) = 128; A(9) = 300 and B(9) = 256; A(10) = 325 and B(10) = 512. So day 10 is the first day Offer B pays more.
        (4) Offer A adds the same $25 every day, so its daily increase never changes. Offer B multiplies by 2, so its daily increase itself doubles: once that increase passes $25 (from day 6 on, the jump is at least 32) the gap closes and then opens the other way faster every day. Repeated multiplication by a number greater than 1 eventually produces larger steps than any fixed addition, so the geometric sequence must overtake and then stay ahead.
      explanation: |
        Six points: 2 for the two explicit formulas (1 each; accept 25n + 75 for A); 1 for both day-10 values (325 and 512); 2 for identifying day 10 with the comparison of days 9 and 10 (1 point for day 10 without the supporting values); 1 for a general explanation that contrasts constant additive steps with growing multiplicative steps.
