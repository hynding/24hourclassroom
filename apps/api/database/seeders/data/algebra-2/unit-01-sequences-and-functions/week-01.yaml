week: 1
unit: 1
title: "Sequences: Patterns, Ratios and Differences"
topics: ["1.1", "1.2", "1.3", "1.4"]
guide: guides/week-01.md
guide_description: |
  What a sequence is and how to describe one with a recursive rule, starting from the Tower of Hanoi puzzle.
  Geometric sequences and the common ratio, arithmetic sequences and the common difference, how to tell the two
  apart (and spot a sequence that is neither), and how a spreadsheet or calculator generates terms from a
  recursive rule. Worked examples: finding a rule from a list, working a geometric sequence backwards, and
  finding when a growing balance first passes a target.
flashcards_description: |
  26 cards on sequence vocabulary, recursive definitions, common ratios and differences, classifying sequences,
  and generating terms with technology.

flashcards:
  - front: Sequence → definition and what a term is
    back: |
      A sequence is an ordered list of numbers. Each number in the list is a term, and its position is its term number or index. The first term is written a(1) or a₁; the nth term is a(n).
    topic_code: "1.1"
  - front: Tower of Hanoi move counts → the sequence and its rule
    back: |
      Moving 1, 2, 3, 4 discs takes 1, 3, 7, 15 moves. Each count is double the previous plus one: a(1) = 1, a(n) = 2·a(n − 1) + 1, which is the same as a(n) = 2ⁿ − 1.
    hint: move n − 1 discs aside, move the big one, move n − 1 back
    topic_code: "1.1"
  - front: Recursive definition of a sequence → the two parts it must have
    back: |
      A starting value (such as a(1) = 3) and a rule for getting each term from the previous one (such as a(n) = a(n − 1) + 5 for n ≥ 2). Without the starting value the rule describes infinitely many sequences.
    topic_code: "1.1"
  - front: a(n − 1) in a recursive rule → what it means
    back: |
      The term just before term n. So a(n) = 2·a(n − 1) + 1 says "to get any term, double the previous term and add one."
    topic_code: "1.1"
  - front: Geometric sequence → definition
    back: |
      A sequence in which each term is the previous term multiplied by the same number, called the common ratio r. Example: 3, 6, 12, 24 with r = 2.
    topic_code: "1.2"
  - front: Common ratio of a geometric sequence → how to compute it
    back: |
      Divide any term by the term before it: r = a(n) / a(n − 1). For 80, 20, 5 the ratio is 20/80 = 1/4 (not 4: later term over earlier term).
    topic_code: "1.2"
  - front: Geometric sequence with 0 < r < 1 → what the terms do
    back: |
      They shrink toward 0 but never reach it. Example: 80, 20, 5, 1.25, 0.3125, … with r = 1/4.
    topic_code: "1.2"
  - front: Geometric sequence with a negative common ratio → what the terms look like
    back: |
      The signs alternate. Example: 2, −6, 18, −54 has r = −3. It is still geometric because every ratio is the same.
    topic_code: "1.2"
  - front: Running a geometric sequence backwards → how
    back: |
      Divide by the common ratio. If the sequence is …, 45, 135 with r = 3, the term before 45 is 45/3 = 15.
    topic_code: "1.2"
  - front: Recursive definition of a geometric sequence → general shape
    back: |
      a(1) = first term, a(n) = r · a(n − 1) for n ≥ 2. For the bounce heights 150, 90, 54, …: a(1) = 150, a(n) = 0.6 · a(n − 1).
    topic_code: "1.2"
  - front: Arithmetic sequence → definition
    back: |
      A sequence in which consecutive terms always differ by the same number, the common difference d. Example: 11, 7, 3, −1 with d = −4.
    topic_code: "1.3"
  - front: Common difference of an arithmetic sequence → how to compute it
    back: |
      Subtract the earlier term from the later one: d = a(n) − a(n − 1). For 11, 7, 3 it is 7 − 11 = −4.
    topic_code: "1.3"
  - front: Recursive definition of an arithmetic sequence → general shape
    back: |
      a(1) = first term, a(n) = a(n − 1) + d for n ≥ 2. For 50, 43, 36, …: a(1) = 50, a(n) = a(n − 1) − 7.
    topic_code: "1.3"
  - front: How to classify a sequence as arithmetic, geometric or neither → the test
    back: |
      Subtract consecutive terms; if every difference is the same it is arithmetic. Divide consecutive terms; if every ratio is the same it is geometric. If neither test gives a constant, it is neither.
    topic_code: "1.3"
  - front: Sequence that is both arithmetic and geometric → the only possibility
    back: |
      A constant sequence such as 5, 5, 5, 5. Its common difference is 0 and its common ratio is 1. No other sequence passes both tests.
    topic_code: "1.3"
  - front: Is 1, 3, 7, 15 arithmetic or geometric? → why neither
    back: |
      Differences are 2, 4, 8 (not constant) and ratios are 3, 7/3, 15/7 (not constant). It is neither; it follows the rule a(n) = 2·a(n − 1) + 1.
    topic_code: "1.3"
  - front: Arithmetic sequence given two non-consecutive terms → how to find d
    back: |
      Divide the change in value by the number of steps between them. If a(4) = 29 and a(7) = 47, three steps add 18, so d = 6. Then step back from a(4) to get a(1) = 29 − 3·6 = 11.
    topic_code: "1.3"
  - front: Arithmetic sequences versus linear functions → the connection
    back: |
      An arithmetic sequence has a constant rate of change (add d each step), exactly like a linear function with slope d. Plotting the terms against n gives points on a line.
    topic_code: "1.3"
  - front: Geometric sequences versus exponential functions → the connection
    back: |
      A geometric sequence has a constant growth factor (multiply by r each step), exactly like an exponential function with base r. Plotting the terms against n gives points on an exponential curve.
    topic_code: "1.3"
  - front: Why a recursive rule suits a spreadsheet → the idea
    back: |
      A spreadsheet computes each cell from the cell above it, which is exactly what a recursive rule does. Put the first term in one cell and a formula like `=2*B2+1` below it, then fill down.
    topic_code: "1.4"
  - front: Generating sequence terms on a calculator with Ans → the procedure
    back: |
      Type the first term and press enter. Then type the rule using Ans for the previous term, for example `Ans*0.6`, and press enter repeatedly; each press produces the next term.
    topic_code: "1.4"
  - front: Which term first exceeds a target? → the technology approach
    back: |
      Generate terms with the recursive rule until one passes the target, then read off its term number. For 5, 15, 45, … the first term above 100,000 is the 11th (295,245).
    topic_code: "1.4"
  - front: Sequence b(1) = 8, b(n) = b(n − 1)/2 + 3 → long-run behaviour
    back: |
      8, 7, 6.5, 6.25, 6.125, … The terms approach 6 and never pass it, because 6 is a fixed point (6/2 + 3 = 6) and each step halves the gap to it.
    topic_code: "1.4"
  - front: Monthly interest as a sequence → the recursive rule
    back: |
      Interest of 0.5% a month means multiply the balance by 1.005 each month: a(0) = 1200, a(n) = 1.005 · a(n − 1). Technology finds that the balance first passes $1,300 in month 17.
    topic_code: "1.4"
  - front: Error-spot → "4, 12, 36 is arithmetic because 12 − 4 = 8"
    back: |
      One difference proves nothing; 36 − 12 = 24 ≠ 8. The ratios 12/4 and 36/12 are both 3, so the sequence is geometric with r = 3. Always check every pair of consecutive terms.
    topic_code: "1.3"
  - front: Off-by-one in sequences → how many steps from a(1) to a(5)?
    back: |
      Four steps, not five. In general a(n) is n − 1 steps from a(1), which is why the formulas next week use (n − 1).
    topic_code: "1.1"

quiz:
  description: |
    22 questions · about 35 minutes · all on this week (lessons 1.1 to 1.4: describing sequences, geometric and
    arithmetic sequences, classifying sequences, and generating terms with technology), with no review yet
    because this is week 1. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    - slug: alg2-u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "IM Algebra 2, Unit 1, Lesson 1"
      points: 1
      prompt: |
        The minimum number of moves needed to solve the Tower of Hanoi puzzle with 1, 2, 3 and 4 discs is 1, 3, 7 and 15. Which rule gives the number of moves for n discs from the number for n − 1 discs?
      options:
        - "a(n) = a(n − 1) + 2"
        - "a(n) = 2·a(n − 1) + 1"
        - "a(n) = 3·a(n − 1)"
        - "a(n) = a(n − 1)²"
      option_explanations:
        - |
          Adding 2 would give 1, 3, 5, 7, but the puzzle needs 7 moves for three discs, not 5.
        - |
          Correct. You move n − 1 discs aside, move the largest disc, then move the n − 1 discs back, so the count doubles and adds one: 2·7 + 1 = 15.
        - |
          Tripling gives 1, 3, 9, 27; the four-disc puzzle takes 15 moves, not 27.
        - |
          Squaring 3 gives 9, not 7, so this rule fails at the third term.
      answer: 1
    - slug: alg2-u01-w01-q02
      type: multiple_choice
      topic_code: "1.2"
      source: "IM Algebra 2, Unit 1, Lesson 2"
      points: 1
      prompt: |
        What is the common ratio of the geometric sequence 96, 24, 6, 1.5, …?
      options:
        - "4"
        - "−72"
        - "1/4"
        - "0.25 for the first step and 0.2 for the next"
      option_explanations:
        - |
          4 is 96/24, the earlier term divided by the later one. The common ratio is the later term divided by the earlier term.
        - |
          −72 is the difference 24 − 96. A ratio comes from division, not subtraction, and the differences here are not constant anyway.
        - |
          Correct. 24/96 = 1/4, 6/24 = 1/4 and 1.5/6 = 1/4, so every term is one quarter of the one before it.
        - |
          Every ratio is 1/4: 6/24 = 0.25 and 1.5/6 = 0.25. The sequence is geometric with one ratio.
      answer: 2
    - slug: alg2-u01-w01-q03
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Which sequence is arithmetic?
      options:
        - "3, 6, 12, 24, 48"
        - "3, 6, 9, 12, 15"
        - "3, 6, 10, 15, 21"
        - "3, 6, 11, 18, 27"
      option_explanations:
        - |
          Differences are 3, 6, 12, 24, which are not constant; the ratios are all 2, so this one is geometric.
        - |
          Correct. Every difference is 3, so this is arithmetic with common difference d = 3.
        - |
          Differences are 3, 4, 5, 6: they grow by one each time, so the sequence is neither arithmetic nor geometric.
        - |
          Differences are 3, 5, 7, 9. They are not constant, so the sequence is not arithmetic.
      answer: 1
    - slug: alg2-u01-w01-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 1
      prompt: |
        An arithmetic sequence has a(3) = 20 and a(6) = 2. What is its common difference?
      options:
        - "−18"
        - "−9"
        - "−6"
        - "6"
      option_explanations:
        - |
          −18 is the total change from term 3 to term 6. That change is spread over three steps, so the difference per step is smaller.
        - |
          Dividing by two steps is wrong; from term 3 to term 6 is three steps (3 to 4, 4 to 5, 5 to 6).
        - |
          Correct. The sequence falls by 18 over three steps, so d = −18/3 = −6. Check: 20, 14, 8, 2.
        - |
          The terms are decreasing, so the common difference must be negative.
      answer: 2
    - slug: alg2-u01-w01-q05
      type: multiple_choice
      topic_code: "1.2"
      source: "IM Algebra 2, Unit 1, Lesson 2"
      points: 1
      prompt: |
        A geometric sequence has a(4) = 54 and a(5) = 162. What is a(1)?
      options:
        - "2"
        - "6"
        - "18"
        - "27"
      option_explanations:
        - |
          Correct. r = 162/54 = 3. Working backwards: a(3) = 18, a(2) = 6, a(1) = 2. Check: 2, 6, 18, 54, 162.
        - |
          6 is a(2). Going back from a(4) = 54 takes three divisions by 3, not two.
        - |
          18 is a(3), one step back from 54. The first term is three steps back.
        - |
          27 is 54/2, but the ratio is 162/54 = 3, not 2.
      answer: 0
    - slug: alg2-u01-w01-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Algebra 2, Unit 1, Lesson 4"
      points: 1
      prompt: |
        A spreadsheet has 5 in cell B2 and the formula `=3*B2-4` in cell B3. The formula is filled down the column. What value appears in cell B5?
      options:
        - "11"
        - "29"
        - "83"
        - "245"
      option_explanations:
        - |
          11 is B3 (3·5 − 4). Two more rows of the rule are needed to reach B5.
        - |
          29 is B4 (3·11 − 4). One more row is needed.
        - |
          Correct. B3 = 3·5 − 4 = 11, B4 = 3·11 − 4 = 29, B5 = 3·29 − 4 = 83.
        - |
          245 would be B6 (3·83 − 4). B5 is one row earlier.
      answer: 2
    - slug: alg2-u01-w01-q07
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A ball dropped from a height of 400 cm rebounds to 75% of its previous height on every bounce. Which recursive definition describes the bounce heights, where a(1) is the height of the first bounce?
      options:
        - "a(1) = 400, a(n) = 0.75 · a(n − 1)"
        - "a(1) = 300, a(n) = 0.75 · a(n − 1)"
        - "a(1) = 300, a(n) = a(n − 1) − 100"
        - "a(1) = 400, a(n) = a(n − 1) − 75"
      option_explanations:
        - |
          400 cm is the drop height, not the height of the first bounce. The first bounce reaches 0.75 · 400 = 300 cm.
        - |
          Correct. The first bounce reaches 300 cm and every later bounce is 75% of the previous one, so multiply by 0.75 each step.
        - |
          Subtracting 100 each time would send the heights to 0 and then negative; a percentage rebound multiplies, it does not subtract.
        - |
          Both parts are wrong: the first bounce is 300 cm, and a 75% rebound is a ratio of 0.75, not a difference of 75.
      answer: 1
    - slug: alg2-u01-w01-q08
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement about the sequence 7, 7, 7, 7, … is true?
      options:
        - "It is arithmetic but not geometric."
        - "It is geometric but not arithmetic."
        - "It is both arithmetic (d = 0) and geometric (r = 1)."
        - "It is neither, because the terms do not change."
      option_explanations:
        - |
          It is arithmetic with d = 0, but it is also geometric: each term is 1 times the previous term.
        - |
          It is geometric with r = 1, but it is also arithmetic: each term is the previous term plus 0.
        - |
          Correct. Adding 0 and multiplying by 1 both leave 7 unchanged, so a constant sequence passes both tests, and it is the only kind that does.
        - |
          A sequence does not have to change to be arithmetic or geometric; constant differences (0) and constant ratios (1) both hold here.
      answer: 2
    - slug: alg2-u01-w01-q09
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A sequence is defined by a(1) = 4 and a(n) = a(n − 1)² − 10 for n ≥ 2. What is a(3)?
      options:
        - "6"
        - "26"
        - "36"
        - "246"
      option_explanations:
        - |
          6 is a(2): 4² − 10 = 6. The question asks for the next term after that.
        - |
          Correct. a(2) = 4² − 10 = 6, then a(3) = 6² − 10 = 26.
        - |
          36 is 6² without subtracting the 10 required by the rule.
        - |
          246 would be a(4) (16² − 10). Only two applications of the rule are needed to reach a(3).
      answer: 1
    - slug: alg2-u01-w01-q10
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Algebra 2, Unit 1, Lesson 4"
      points: 1
      prompt: |
        A population of 500 bacteria doubles every hour. Using a spreadsheet that lists the population at the end of each hour, which is the first hour at which the population exceeds 50,000?
      options:
        - "Hour 6"
        - "Hour 7"
        - "Hour 8"
        - "Hour 100"
      option_explanations:
        - |
          After 6 hours the population is 500 · 2⁶ = 32,000, which is still below 50,000.
        - |
          Correct. After 7 hours it is 500 · 2⁷ = 64,000, the first value above 50,000 (hour 6 gives 32,000).
        - |
          Hour 8 gives 128,000, but the population already passed 50,000 an hour earlier.
        - |
          Dividing 50,000 by 500 gives 100, but the population multiplies by 2 each hour rather than adding 500.
      answer: 1
    - slug: alg2-u01-w01-q11
      type: multi_select
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following sequences are geometric? Select all that apply.
      options:
        - "1, −2, 4, −8, 16"
        - "100, 10, 1, 0.1, 0.01"
        - "1, 4, 9, 16, 25"
        - "6, 6, 6, 6, 6"
        - "2, 5, 8, 11, 14"
      option_explanations:
        - |
          Correct. Each ratio is −2; a negative common ratio still makes a geometric sequence, with alternating signs.
        - |
          Correct. Each term is one tenth of the previous one, so r = 1/10.
        - |
          These are the perfect squares. Ratios 4, 2.25, 1.78 are not constant, so the sequence is not geometric.
        - |
          Correct. A constant sequence is geometric with r = 1 (and also arithmetic with d = 0).
        - |
          Each term is the previous plus 3, so it is arithmetic; the ratios 2.5, 1.6, 1.375 are not constant.
      answer: [0, 1, 3]
    - slug: alg2-u01-w01-q12
      type: multi_select
      topic_code: "1.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A sequence begins 3, 8, 18, 38, 78. Which of the following are true? Select all that apply.
      options:
        - "The rule a(n) = 2·a(n − 1) + 2 produces the sequence from a(1) = 3."
        - "The sequence is arithmetic."
        - "The next term is 158."
        - "The differences between consecutive terms form a geometric sequence."
        - "The sequence is geometric with common ratio 2."
      option_explanations:
        - |
          Correct. 2·3 + 2 = 8, 2·8 + 2 = 18, 2·18 + 2 = 38, 2·38 + 2 = 78.
        - |
          The differences 5, 10, 20, 40 are not constant, so it is not arithmetic.
        - |
          Correct. Applying the rule once more: 2·78 + 2 = 158.
        - |
          Correct. The differences 5, 10, 20, 40 double each time, a geometric sequence with r = 2.
        - |
          The ratios are 8/3 ≈ 2.67, 18/8 = 2.25, 38/18 ≈ 2.11; they are not constant, so the sequence is not geometric.
      answer: [0, 2, 3]
    - slug: alg2-u01-w01-q13
      type: true_false
      topic_code: "1.2"
      source: "IM Algebra 2, Unit 1, Lesson 2"
      points: 1
      prompt: |
        True or false: In a geometric sequence with first term 500 and common ratio 1/5, the terms get closer and closer to 0 but never become negative.
      answer: true
      explanation: |
        True. Multiplying a positive number by 1/5 gives a smaller positive number, so the terms 500, 100, 20, 4, 0.8, … shrink toward 0 and stay positive.
    - slug: alg2-u01-w01-q14
      type: true_false
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 1
      prompt: |
        True or false: If the first two differences of a sequence are equal, the sequence must be arithmetic.
      answer: false
      explanation: |
        False. 1, 3, 5, 8 has differences 2, 2, 3. A sequence is arithmetic only if every pair of consecutive terms has the same difference, so you must check all the differences you are given.
    - slug: alg2-u01-w01-q15
      type: fill_blank
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 1
      prompt: |
        The common difference of the arithmetic sequence 41, 34, 27, 20, … is ____.
      answer: ["-7", "−7", "d = -7", "d = −7"]
      explanation: |
        34 − 41 = −7, 27 − 34 = −7 and 20 − 27 = −7. The common difference is the later term minus the earlier one, so it is negative here.
    - slug: alg2-u01-w01-q16
      type: fill_blank
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The common ratio of the geometric sequence 2, −10, 50, −250, … is ____.
      answer: ["-5", "−5", "r = -5", "r = −5"]
      explanation: |
        −10/2 = −5, 50/(−10) = −5 and −250/50 = −5. The negative ratio is what makes the signs alternate.
    - slug: alg2-u01-w01-q17
      type: numeric
      topic_code: "1.1"
      source: "IM Algebra 2, Unit 1, Lesson 1"
      points: 1
      prompt: |
        The Tower of Hanoi puzzle with n discs takes 2ⁿ − 1 moves. How many moves does the puzzle with 10 discs take? Give a whole number.
      answer: { value: 1023, tolerance: 0 }
      explanation: |
        2¹⁰ = 1024, so the puzzle takes 1024 − 1 = 1023 moves. You can check with the recursive rule: 511 moves for 9 discs, and 2·511 + 1 = 1023.
    - slug: alg2-u01-w01-q18
      type: numeric
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A geometric sequence has a(1) = 3125 and common ratio 0.2. What is a(5)? Give the exact value.
      answer: { value: 5, tolerance: 0 }
      explanation: |
        Multiply by 0.2 four times: 3125, 625, 125, 25, 5. Four steps take a(1) to a(5).
    - slug: alg2-u01-w01-q19
      type: numeric
      topic_code: "1.4"
      source: "IM Algebra 2, Unit 1, Lesson 4"
      points: 1
      prompt: |
        A sequence is defined by c(1) = 2 and c(n) = 0.5 · c(n − 1) + 6. Use the rule (or a spreadsheet) to find c(5). Give your answer to three decimal places.
      answer: { value: 11.375, tolerance: 0.001 }
      explanation: |
        c(2) = 0.5·2 + 6 = 7, c(3) = 0.5·7 + 6 = 9.5, c(4) = 0.5·9.5 + 6 = 10.75, c(5) = 0.5·10.75 + 6 = 11.375. The terms climb toward 12, the value that the rule leaves unchanged.
    - slug: alg2-u01-w01-q20
      type: short_answer
      topic_code: "1.3"
      source: "IM Algebra 2, Unit 1, Lesson 3"
      points: 3
      prompt: |
        Three sequences start as follows:

        P: 5, 15, 45, 135
        Q: 5, 15, 25, 35
        R: 5, 15, 30, 50

        (a) Classify each sequence as arithmetic, geometric or neither, and state the common difference or common ratio where there is one.
        (b) Give the next term of each sequence.
        (c) Write a recursive definition for sequence Q.
      answer: |
        (a) P is geometric with r = 3 (15/5 = 45/15 = 135/45 = 3). Q is arithmetic with d = 10. R is neither: its differences are 10, 15, 20 and its ratios 3, 2, 5/3 are not constant.
        (b) P: 405. Q: 45. R: 75 (the differences grow by 5 each time, so the next difference is 25).
        (c) a(1) = 5, a(n) = a(n − 1) + 10 for n ≥ 2.
      explanation: |
        Three points, one per part. (a) needs all three classifications with r = 3 and d = 10 (1 point; award it if R is called "neither" with a reason). (b) needs all three next terms (accept any reasonable next term for R if the pattern in the differences is explained). (c) needs both the starting value and the rule.
    - slug: alg2-u01-w01-q21
      type: short_answer
      topic_code: "1.4"
      source: "IM Algebra 2, Unit 1, Lesson 4"
      points: 3
      prompt: |
        A car bought for $24,000 loses 15% of its value every year.

        (a) Write a recursive definition for the car's value, with v(0) = 24000 as the value when new.
        (b) Find the value after 3 years, to the nearest dollar.
        (c) Describe how you would use a spreadsheet to find the first year in which the value is below $10,000, and state that year.
      answer: |
        (a) v(0) = 24000, v(n) = 0.85 · v(n − 1) for n ≥ 1.
        (b) 24000 · 0.85 = 20400, then 17340, then 14739: about $14,739.
        (c) Put 0 and 24000 in the first row, the formulas `=A2+1` and `=0.85*B2` in the next row, fill down, and read the first row whose value is under 10,000. v(5) ≈ 10,649 and v(6) ≈ 9,052, so year 6.
