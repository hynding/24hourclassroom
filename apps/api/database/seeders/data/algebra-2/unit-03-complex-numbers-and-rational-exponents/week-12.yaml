week: 12
unit: 3
title: "Solving Equations with Squares, Cubes and Radicals"
topics: ["3.6", "3.7", "3.8", "3.9"]
guide: guides/week-12.md
guide_description: |
  Undoing squares (two possibilities) and square roots (one), and why √x = −6 has no solution; why squaring
  both sides produces an inequivalent equation that can gain extraneous solutions; why cubing is reversible and
  cube-root equations never gain solutions; and the four-step method for radical equations (isolate, raise to
  the power, solve, check). Worked examples: √(2x + 7) = x − 4, √(x + 3) + 3 = x, and the contrast between
  ∛(2x − 1) = 3 and √(2x − 1) = 3.
flashcards_description: |
  27 cards on solving square, root and cube equations, equivalence, extraneous solutions from squaring, and
  the radical-equation method.

flashcards:
  - front: Solving (x − 3)² = 16 → why two answers
    back: |
      x − 3 must be a number whose square is 16, so x − 3 = 4 or x − 3 = −4: x = 7 or x = −1. Undoing a square always gives a ± choice.
    topic_code: "3.6"
  - front: Solving √x = 6 → how and why one answer
    back: |
      Square both sides: x = 36, and the check √36 = 6 passes. The radical symbol names one nonnegative number, so there is one solution.
    topic_code: "3.6"
  - front: √x = −6 → why no solution
    back: |
      √x is never negative, so no x can make it −6. Squaring would produce x = 36, but √36 = 6 ≠ −6, so that candidate fails the check.
    topic_code: "3.6"
  - front: Solve 4(x − 1)² = 100 → steps
    back: |
      Divide by 4: (x − 1)² = 25. Then x − 1 = ±5, so x = 6 or x = −4.
    topic_code: "3.6"
  - front: Solve 3(x + 2)² − 12 = 0 → steps
    back: |
      3(x + 2)² = 12, (x + 2)² = 4, x + 2 = ±2, so x = 0 or x = −4.
    topic_code: "3.6"
  - front: x² = −9 over the real numbers → solutions
    back: |
      None: no real number has a negative square. (Next week introduces numbers that do.)
    topic_code: "3.6"
  - front: Equivalent equations → definition
    back: |
      Equations with exactly the same solution set. x = 5 and 2x = 10 are equivalent; x = 5 and x² = 25 are not, because the second also has −5.
    topic_code: "3.7"
  - front: Why squaring both sides can add solutions → reason
    back: |
      Squaring erases signs: 3 and −3 both become 9. So a² = b² is satisfied by a = b and by a = −b; the second case brings in solutions the original equation did not have.
    topic_code: "3.7"
  - front: Squaring never loses solutions → why
    back: |
      If a = b then certainly a² = b², so every solution of the original equation still solves the squared one. The danger is only in gaining extra candidates.
    topic_code: "3.7"
  - front: Solve √x = x − 2 → result and the extraneous candidate
    back: |
      x = x² − 4x + 4 gives (x − 1)(x − 4) = 0. x = 4 works (√4 = 2 = 4 − 2). x = 1 fails (√1 = 1 ≠ −1); it solves the "other sign" equation √x = −(x − 2).
    topic_code: "3.7"
  - front: Reversible steps in solving → list
    back: |
      Adding or subtracting the same quantity, multiplying or dividing by a nonzero number, and cubing both sides. Squaring and multiplying by an expression that can be zero are not reversible.
    topic_code: "3.7"
  - front: What to do after squaring both sides → the rule
    back: |
      Check every candidate in the original equation and discard those that fail. A graph of the two sides shows the genuine intersections and makes the extraneous candidate visible as a non-crossing.
    topic_code: "3.7"
  - front: Cube roots and sign → the key fact
    back: |
      Cubing keeps the sign (2³ = 8, (−2)³ = −8), so every real number has exactly one real cube root, including negatives: ∛(−64) = −4.
    topic_code: "3.8"
  - front: Why cubing both sides is reversible → reason
    back: |
      a = b exactly when a³ = b³, because different numbers have different cubes. So cubing never adds extraneous solutions.
    topic_code: "3.8"
  - front: Solve ∛(x + 1) = 3 → steps
    back: |
      Cube both sides: x + 1 = 27, so x = 26. Check: ∛27 = 3.
    topic_code: "3.8"
  - front: Solve ∛(x − 2) = −2 → steps
    back: |
      Cube: x − 2 = −8, so x = −6. A negative value for a cube root is perfectly fine.
    topic_code: "3.8"
  - front: Solve 2x³ + 54 = 0 → steps
    back: |
      x³ = −27, so x = −3. Only one real solution, unlike x² = 27.
    topic_code: "3.8"
  - front: ∛(2x − 1) = 3 versus √(2x − 1) = 3 → compare
    back: |
      Cube the first: 2x − 1 = 27, x = 14. Square the second: 2x − 1 = 9, x = 5. Both check, but only the square-root equation needed a check in principle.
    topic_code: "3.8"
  - front: Method for radical equations → four steps
    back: |
      Isolate the radical; raise both sides to the matching power; solve the polynomial equation; check every candidate in the original equation.
    topic_code: "3.9"
  - front: Why isolate the radical before squaring → reason
    back: |
      (√x + 2)² = x + 4√x + 4 still contains a radical. With √x alone on one side, squaring removes it cleanly.
    topic_code: "3.9"
  - front: Solve √(2x + 7) = x − 4 → full solution
    back: |
      Square: 2x + 7 = x² − 8x + 16, so x² − 10x + 9 = (x − 1)(x − 9) = 0. x = 9 checks (√25 = 5 = 9 − 4); x = 1 fails (√9 = 3 ≠ −3). Solution x = 9.
    topic_code: "3.9"
  - front: Solve √(x + 3) + 3 = x → full solution
    back: |
      Isolate: √(x + 3) = x − 3. Square: x + 3 = x² − 6x + 9, so (x − 1)(x − 6) = 0. x = 6 checks (3 + 3 = 6); x = 1 fails (2 + 3 ≠ 1). Solution x = 6.
    topic_code: "3.9"
  - front: Solve √x + 2 = 0 → result
    back: |
      √x = −2 is impossible, so there is no solution. Squaring would give the false candidate x = 4.
    topic_code: "3.9"
  - front: Solve √(x² + 9) = 5 → result
    back: |
      x² + 9 = 25, so x² = 16 and x = ±4. Both check, since x² is the same for 4 and −4. Two genuine solutions.
    topic_code: "3.9"
  - front: Graphical meaning of an extraneous candidate → describe
    back: |
      Graphing y = √(2x + 7) and y = x − 4 shows one crossing near x = 9 and none near x = 1, where the line is negative and the root is positive. The extraneous value is where the root meets the reflected line y = −(x − 4).
    topic_code: "3.9"
  - front: Error-spot → "(x − 3)² = 16 so x − 3 = 4 so x = 7"
    back: |
      Half the answer. x − 3 could also be −4, giving x = −1. Undoing a square needs ±.
    topic_code: "3.6"
  - front: Error-spot → "x = −4 must be extraneous because it is negative"
    back: |
      Sign alone decides nothing. In √(x² + 9) = 5, x = −4 checks perfectly. Only a failed substitution in the original equation makes a candidate extraneous.
    topic_code: "3.9"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 3.6 to 3.9: solving square, cube and radical
    equations, equivalence and extraneous solutions), with about a third reviewing week 11 and Units 1 and 2.
    Includes a shared-context set on one radical equation. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: one radical equation (3.9, 3.7)
    - slug: alg2-u03-w12-q01
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Algebra 2, Unit 3, Lesson 9"
      points: 1
      stimulus: |
        Consider the equation √(2x + 7) = x − 4.
      prompt: |
        After squaring both sides and collecting terms, which polynomial equation results?
      options:
        - "x² − 10x + 9 = 0"
        - "x² − 6x + 23 = 0"
        - "x² − 8x + 16 = 0"
        - "2x + 7 = x² − 16"
      option_explanations:
        - |
          Correct. 2x + 7 = (x − 4)² = x² − 8x + 16, so 0 = x² − 10x + 9.
        - |
          This adds 2x + 7 to the right side instead of subtracting it.
        - |
          This is (x − 4)² alone; the left side 2x + 7 must be subtracted from it.
        - |
          (x − 4)² is x² − 8x + 16, not x² − 16; the cross term is missing.
      answer: 0
    - slug: alg2-u03-w12-q02
      type: multiple_choice
      topic_code: "3.7"
      source: "IM Algebra 2, Unit 3, Lesson 7"
      points: 1
      stimulus: |
        Consider the equation √(2x + 7) = x − 4.
      prompt: |
        The squared equation has solutions x = 1 and x = 9. Which statement about x = 1 is correct?
      options:
        - "It is a solution of the original equation because 2(1) + 7 = 9 is a perfect square."
        - "It is extraneous because √9 = 3 but 1 − 4 = −3."
        - "It is extraneous because it is smaller than 9."
        - "It is a solution because both sides equal 3."
      option_explanations:
        - |
          The left side is √9 = 3, but the right side is −3; the two sides are not equal.
        - |
          Correct. At x = 1 the radical is positive and the right side negative; the candidate solves √(2x + 7) = −(x − 4) instead.
        - |
          Size has nothing to do with it; only substitution into the original equation decides.
        - |
          The right side at x = 1 is 1 − 4 = −3, not 3.
      answer: 1
    - slug: alg2-u03-w12-q03
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Algebra 2, Unit 3, Lesson 9"
      points: 1
      stimulus: |
        Consider the equation √(2x + 7) = x − 4.
      prompt: |
        What is the solution set of the original equation?
      options:
        - "{1, 9}"
        - "{9}"
        - "{1}"
        - "No solution"
      option_explanations:
        - |
          x = 1 fails the check (3 ≠ −3), so it is not in the solution set.
        - |
          Correct. √(2 · 9 + 7) = √25 = 5 and 9 − 4 = 5, so x = 9 is the only solution.
        - |
          x = 1 is the extraneous candidate; x = 9 is the one that works.
        - |
          x = 9 satisfies the equation, so there is a solution.
      answer: 1
    - slug: alg2-u03-w12-q04
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Algebra 2, Unit 3, Lesson 6"
      points: 1
      prompt: |
        What are the solutions of (x − 3)² = 16?
      options:
        - "x = 7 only"
        - "x = 7 and x = −1"
        - "x = 19 and x = −13"
        - "x = 5 and x = 1"
      option_explanations:
        - |
          x − 3 = −4 also works, giving x = −1, so this list is missing a solution.
        - |
          Correct. x − 3 = ±4, so x = 7 or x = −1. Check: (−1 − 3)² = 16.
        - |
          These come from x − 3 = ±16; the square root of 16 is 4, not 16.
        - |
          These come from x − 3 = ±2, but 2² = 4, not 16.
      answer: 1
    - slug: alg2-u03-w12-q05
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Algebra 2, Unit 3, Lesson 6"
      points: 1
      prompt: |
        What is the solution of √x = 6?
      options:
        - "x = 36"
        - "x = ±36"
        - "x = 3"
        - "x = ±6"
      option_explanations:
        - |
          Correct. Squaring gives x = 36, and √36 = 6 checks.
        - |
          √(−36) is not a real number, so −36 cannot be a solution.
        - |
          √3 ≈ 1.73, not 6; the equation needs x to be the square of 6.
        - |
          6 and −6 are the solutions of x² = 36, a different equation.
      answer: 0
    - slug: alg2-u03-w12-q06
      type: multiple_choice
      topic_code: "3.7"
      source: "IM Algebra 2, Unit 3, Lesson 7"
      points: 1
      prompt: |
        Why are the equations x = 5 and x² = 25 not equivalent?
      options:
        - "Because x² = 25 has no solutions."
        - "Because x² = 25 has the additional solution x = −5."
        - "Because x = 5 has two solutions."
        - "Because 25 is not a perfect square."
      option_explanations:
        - |
          x² = 25 has two solutions, 5 and −5, so it is not equivalent to x = 5.
        - |
          Correct. Squaring erases the sign, so the squared equation gains a solution the original lacks.
        - |
          x = 5 has exactly one solution and so cannot be equivalent to a two-solution equation.
        - |
          25 = 5², a perfect square; that is not the issue.
      answer: 1
    - slug: alg2-u03-w12-q07
      type: multiple_choice
      topic_code: "3.8"
      source: "IM Algebra 2, Unit 3, Lesson 8"
      points: 1
      prompt: |
        What are the real solutions of x³ = −64?
      options:
        - "x = −4 only"
        - "x = 4 and x = −4"
        - "x = 4 only"
        - "There are no real solutions."
      option_explanations:
        - |
          Correct. (−4)³ = −64, and cubing preserves sign, so no other real number works.
        - |
          4³ = +64, not −64; unlike squares, cubes distinguish sign.
        - |
          4³ = 64, the wrong sign; cubing keeps the sign, so the cube root of −64 is negative.
        - |
          Negative numbers have real cube roots; −4 works.
      answer: 0
    - slug: alg2-u03-w12-q08
      type: multiple_choice
      topic_code: "3.8"
      source: "IM Algebra 2, Unit 3, Lesson 8"
      points: 1
      prompt: |
        What is the solution of ∛(x + 1) = 3?
      options:
        - "x = 26"
        - "x = 8"
        - "x = 2"
        - "x = 26 and x = −28"
      option_explanations:
        - |
          Correct. Cubing both sides gives x + 1 = 27, so x = 26; the check ∛27 = 3 passes.
        - |
          8 is 3² − 1; the cube root is undone by cubing, so 3³ = 27 is needed.
        - |
          2 would require ∛3 = 3, which is false; check by substituting into the original.
        - |
          Cubing is reversible and produces exactly one candidate; there is no second solution.
      answer: 0
    - slug: alg2-u03-w12-q09
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Algebra 2, Unit 3, Lesson 9"
      points: 1
      prompt: |
        What is the solution set of √x + 2 = 0?
      options:
        - "x = 4"
        - "x = −4"
        - "x = 2"
        - "No solution"
      option_explanations:
        - |
          Squaring √x = −2 produces x = 4, but √4 + 2 = 4 ≠ 0; it is extraneous.
        - |
          √(−4) is not a real number, so −4 is not even in the domain, never mind a solution.
        - |
          √2 + 2 ≈ 3.41, not 0; a positive root plus 2 can never equal 0.
        - |
          Correct. Isolating gives √x = −2, which is impossible because a square root is never negative.
      answer: 3
    - slug: alg2-u03-w12-q10
      type: multiple_choice
      topic_code: "3.7"
      source: "IM Algebra 2, Unit 3, Lesson 7"
      points: 1
      prompt: |
        Which operation on both sides of an equation can introduce extraneous solutions?
      options:
        - "Adding 5"
        - "Multiplying by 3"
        - "Squaring"
        - "Cubing"
      option_explanations:
        - |
          Adding the same number is reversible (subtract it), so the solutions do not change.
        - |
          Multiplying by a nonzero number is reversible (divide by it).
        - |
          Correct. Squaring erases signs, so a² = b² is also satisfied by a = −b, which can add solutions.
        - |
          Cubing is reversible because different numbers have different cubes.
      answer: 2
    - slug: alg2-u03-w12-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      prompt: |
        What is 8^(4/3)?
      options:
        - "16"
        - "32/3"
        - "2"
        - "64"
      option_explanations:
        - |
          Correct. Take the cube root first: (∛8)⁴ = 2⁴ = 16.
        - |
          32/3 is 8 · 4/3; a rational exponent is a root and a power, not a product.
        - |
          2 is 8^(1/3); the numerator 4 means that root is raised to the fourth power.
        - |
          64 is 8², which would be the exponent 2, or 6/3.
      answer: 0
    - slug: alg2-u03-w12-q12
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Algebra 2, Unit 2, Lesson 15"
      points: 1
      prompt: |
        What is the remainder when x³ + 2x − 5 is divided by (x − 1)?
      options:
        - "−2"
        - "−5"
        - "2"
        - "0"
      option_explanations:
        - |
          Correct. By the Remainder Theorem the remainder is p(1) = 1 + 2 − 5 = −2.
        - |
          −5 is the constant term, the remainder on dividing by x.
        - |
          2 is the coefficient of x, not the value of the polynomial at 1.
        - |
          p(1) ≠ 0, so by the factor theorem (x − 1) is not a factor of p.
      answer: 0
    - slug: alg2-u03-w12-q13
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Algebra 2, Unit 1, Lesson 11"
      points: 1
      prompt: |
        What is the sum of the first 30 terms of the arithmetic sequence 2, 5, 8, …?
      options:
        - "89"
        - "1365"
        - "2730"
        - "1335"
      option_explanations:
        - |
          89 is the 30th term, 2 + 3 · 29, not the sum of the first thirty terms.
        - |
          Correct. a(30) = 89 and S = 30 · (2 + 89)/2 = 15 · 91 = 1365.
        - |
          2730 is 30 · 91 without dividing by 2; the sum formula is n(a₁ + aₙ)/2.
        - |
          1335 uses 87 as the last term; the 30th term is 89.
      answer: 1
    - slug: alg2-u03-w12-q14
      type: multi_select
      topic_code: "3.9"
      source: "IM Algebra 2, Unit 3, Lesson 9"
      points: 2
      partial_credit: true
      prompt: |
        Consider √(x + 5) = x − 1. Which statements are true? Select all that apply.
      options:
        - "Squaring both sides gives x² − 3x − 4 = 0."
        - "x = 4 is a solution of the original equation."
        - "x = −1 is a solution of the original equation."
        - "x = −1 is extraneous because √4 = 2 but −1 − 1 = −2."
        - "The original equation has exactly one solution."
      option_explanations:
        - |
          Correct. x + 5 = x² − 2x + 1 rearranges to x² − 3x − 4 = 0, which factors as (x − 4)(x + 1).
        - |
          Correct. Substituting x = 4: √9 = 3 and 4 − 1 = 3, so it checks.
        - |
          At x = −1 the radical is 2 and the right side is −2; they differ.
        - |
          Correct. The candidate came from squaring and fails the check.
        - |
          Correct. Only x = 4 survives the check; −2 is extraneous.
      answer: [0, 1, 3, 4]
    - slug: alg2-u03-w12-q15
      type: multi_select
      topic_code: "3.8"
      source: "IM Algebra 2, Unit 3, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Which equations have exactly one real solution? Select all that apply.
      options:
        - "x³ = 27"
        - "x² = 27"
        - "∛x = −2"
        - "√x = 3"
        - "x² = −9"
      option_explanations:
        - |
          Correct. Only 3 cubes to 27, because cubing preserves sign; there is one real solution.
        - |
          Both √27 and −√27 square to 27, so there are two solutions.
        - |
          Correct. Cubing gives x = −8, the only solution.
        - |
          Correct. Squaring gives x = 9, and it checks.
        - |
          No real number squares to −9, so there are no real solutions.
      answer: [0, 2, 3]
    - slug: alg2-u03-w12-q16
      type: true_false
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        True or false: The graph of y = (x − 4)²(x + 2) crosses the x-axis at x = 4.
      answer: false
      explanation: |
        False. The zero at 4 has multiplicity 2, so the graph touches the axis there and turns back without crossing. It crosses at −2, where the multiplicity is 1.
    - slug: alg2-u03-w12-q17
      type: true_false
      topic_code: "3.2"
      source: "IM Algebra 2, Unit 3, Lesson 2"
      points: 1
      prompt: |
        True or false: √(−9) is a real number because (−3)² = 9.
      answer: false
      explanation: |
        False. (−3)² = +9, not −9. No real number squares to a negative, so √(−9) is not real. Next week introduces the number i, for which i² = −1, to handle such roots.
    - slug: alg2-u03-w12-q18
      type: fill_blank
      topic_code: "3.8"
      source: "IM Algebra 2, Unit 3, Lesson 8"
      points: 1
      prompt: |
        The solution of ∛(x − 2) = −2 is x = ____.
      answer: ["-6", "−6", "x = -6", "x = −6"]
      explanation: |
        Cube both sides: x − 2 = (−2)³ = −8, so x = −6. Check: ∛(−8) = −2.
    - slug: alg2-u03-w12-q19
      type: fill_blank
      topic_code: "2.5"
      source: "IM Algebra 2, Unit 2, Lesson 5"
      points: 1
      prompt: |
        The zero of a polynomial corresponding to the factor (3x − 2) is x = ____.
      answer: ["2/3", "x = 2/3", "0.667", "0.67"]
      explanation: |
        Set 3x − 2 = 0: x = 2/3.
    - slug: alg2-u03-w12-q20
      type: numeric
      topic_code: "3.6"
      source: "IM Algebra 2, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Solve 4(x − 1)² = 100 and give the larger of the two solutions.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        (x − 1)² = 25, so x − 1 = ±5, giving x = 6 or x = −4. The larger is 6.
    - slug: alg2-u03-w12-q21
      type: numeric
      topic_code: "3.9"
      source: "IM Algebra 2, Unit 3, Lesson 9"
      points: 1
      prompt: |
        Solve √(x² + 9) = 5 and give the positive solution.
      answer: { value: 4, tolerance: 0 }
      explanation: |
        Squaring gives x² + 9 = 25, so x² = 16 and x = ±4. Both check, because x² is the same for 4 and −4; the positive solution is 4.
    - slug: alg2-u03-w12-q22
      type: numeric
      topic_code: "3.5"
      source: "IM Algebra 2, Unit 3, Lesson 5"
      points: 1
      prompt: |
        Evaluate 27^(−1/3). Give your answer as a decimal to three places.
      answer: { value: 0.333, tolerance: 0.001 }
      explanation: |
        27^(1/3) = 3, so 27^(−1/3) = 1/3 ≈ 0.333.
    - slug: alg2-u03-w12-q23
      type: short_answer
      topic_code: "3.7"
      source: "IM Algebra 2, Unit 3, Lesson 7"
      points: 3
      prompt: |
        (a) Explain, in your own words, why squaring both sides of an equation can create a solution that the original equation did not have.
        (b) Give an example of two inequivalent equations where one is obtained from the other by squaring, and state the solution set of each.
        (c) Explain why cubing both sides does not have this problem.
      answer: |
        (a) Squaring destroys the sign: a and −a have the same square. So the squared equation a² = b² is satisfied whenever a = b or a = −b, and the a = −b case can bring in values that do not satisfy the original.
        (b) x = 3 has solution set {3}; squaring gives x² = 9 with solution set {3, −3}. (Or √x = x − 2 with {4}, whose squared version x = x² − 4x + 4 has {1, 4}.)
        (c) Cubing keeps the sign, so different numbers have different cubes: a³ = b³ forces a = b. Cubing is reversible and cannot add solutions.
      explanation: |
        Three points, one per part. (a) the sign-erasing idea. (b) a valid pair with both solution sets. (c) the uniqueness of cubes.
    - slug: alg2-u03-w12-q24
      type: short_answer
      topic_code: "3.9"
