      prompt: |
        Solve √(x + 3) + 3 = x.

        (a) Isolate the radical and square both sides, showing the resulting quadratic equation.
        (b) Solve the quadratic.
        (c) Check each candidate in the original equation and state the solution set.
      answer: |
        (a) √(x + 3) = x − 3; squaring gives x + 3 = x² − 6x + 9, so x² − 7x + 6 = 0.
        (b) (x − 1)(x − 6) = 0, so x = 1 or x = 6.
        (c) x = 6: √9 + 3 = 6 ✓. x = 1: √4 + 3 = 5 ≠ 1 ✗. Solution set {6}.
      explanation: |
        Three points, one per part. (a) must isolate before squaring and get x² − 7x + 6 = 0. (b) both candidates. (c) both checks and the final answer {6}.
    - slug: alg2-u03-w12-q25
