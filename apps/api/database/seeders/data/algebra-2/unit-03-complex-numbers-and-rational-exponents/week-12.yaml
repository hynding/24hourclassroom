      prompt: |
        Write a full response that (1) solves ∛(2x − 1) = 3 and explains why no check for extraneous solutions is needed, (2) solves √(x + 7) = x + 1 completely, showing the check and identifying any extraneous candidate, (3) explains what the extraneous candidate in part (2) is actually a solution of, and (4) describes how a graph of y = √(x + 7) and y = x + 1 would show which candidate is genuine.
      answer: |
        (1) Cube both sides: 2x − 1 = 27, so x = 14. Cubing is reversible (different numbers have different cubes), so the cubed equation is equivalent to the original and no extraneous solutions can arise; ∛27 = 3 confirms.
        (2) Square: x + 7 = x² + 2x + 1, so x² + x − 6 = (x + 3)(x − 2) = 0, candidates −3 and 2. Check x = 2: √9 = 3 and 2 + 1 = 3 ✓. Check x = −3: √4 = 2 but −3 + 1 = −2 ✗. Solution x = 2; x = −3 is extraneous.
        (3) x = −3 satisfies √(x + 7) = −(x + 1), the equation with the opposite sign on the right, because squaring cannot distinguish the two.
        (4) The curve y = √(x + 7) starts at (−7, 0) and rises slowly; the line y = x + 1 rises with slope 1. They cross once, at (2, 3). At x = −3 the line is at −2, below the axis, while the curve is at 2; there is no crossing there, which is why −3 is not a solution.
      explanation: |
        Six points: 1 for x = 14 with the reversibility reason; 2 for the complete solution of part (2) with both checks (1 if the check is missing); 1 for identifying the opposite-sign equation; 2 for the graphical description with the crossing at (2, 3) and the non-crossing at x = −3.
