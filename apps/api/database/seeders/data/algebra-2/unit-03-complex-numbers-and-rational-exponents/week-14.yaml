        (1) Half of −6 is −3, squared is 9: x² − 6x + 9 = −2 + 9, so (x − 3)² = 7 and x = 3 ± √7.
        (2) y = (x − 3)² − 7. The vertex is (3, −7) and the minimum value is −7, reached at x = 3.
        (3) Divide by 3: x² + 4x = 5, so x² + 4x − 5 = 0, which factors as (x + 5)(x − 1) = 0. Solutions x = −5 and x = 1.
