      prompt: |
        (a) Find the complex number z such that (1 + 2i)z = −3 + 4i, and check it.
        (b) Find both square roots of 21 − 20i.
        (c) Explain why a nonzero complex number can never have exactly one square root.
      answer: |
        (a) z = (−3 + 4i)/(1 + 2i) = (−3 + 4i)(1 − 2i)/5 = (−3 + 6i + 4i − 8i²)/5 = (5 + 10i)/5 = 1 + 2i. Check: (1 + 2i)(1 + 2i) = 1 + 4i + 4i² = −3 + 4i.
        (b) Set (a + bi)² = 21 − 20i: a² − b² = 21 and 2ab = −20, so ab = −10. The pair (5, −2) gives 25 − 4 = 21. The square roots are 5 − 2i and −5 + 2i.
        (c) If w² = z then (−w)² = w² = z too, and when z ≠ 0, w ≠ 0 so w and −w are different numbers. Square roots therefore come in opposite pairs.
