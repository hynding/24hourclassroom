week: 14
unit: 3
title: "Conjugates, Working Backwards and Solving Quadratics"
topics: ["3.14", "3.15", "3.16"]
guide: guides/week-14.md
guide_description: |
  Powers and conjugates of complex numbers, the conjugate product a² + b², and rewriting a quotient in the
  form a + bi by multiplying by the conjugate of the denominator; working backwards from a sum or product to
  a missing complex number and finding both square roots of a complex number by matching real and imaginary
  parts; solving quadratics with real solutions by factoring, undoing a square and completing the square,
  with vertex form and a first look at (x + 1)² = −4.
flashcards_description: |
  27 cards on conjugates, quotients, powers, square roots of complex numbers, working backwards, and the
  three methods for solving a quadratic.

flashcards:
  - front: Conjugate of a + bi
    back: |
      a − bi: same real part, opposite imaginary part. The conjugate of −2 + 5i is −2 − 5i (not 2 − 5i).
    topic_code: "3.14"
  - front: Sum of z and its conjugate
    back: |
      (a + bi) + (a − bi) = 2a, a real number. For 4 − 3i the sum is 8.
    topic_code: "3.14"
  - front: Conjugate product of 4 − 3i and of 5 − 12i
    back: |
      (4 − 3i)(4 + 3i) = 16 + 9 = 25. (5 − 12i)(5 + 12i) = 25 + 144 = 169. In general a² + b².
    topic_code: "3.14"
  - front: Why conjugates help with division
    back: |
      Multiplying the top and bottom of a quotient by the conjugate of the denominator makes the denominator the real number a² + b², so the result can be written as a + bi.
    topic_code: "3.14"
  - front: (4 + 2i)/(1 + i) in the form a + bi
    back: |
      Multiply by (1 − i)/(1 − i): (4 − 4i + 2i − 2i²)/2 = (6 − 2i)/2 = 3 − i. Check: (1 + i)(3 − i) = 4 + 2i.
    topic_code: "3.14"
  - front: (3 + 2i)/(1 − i) in the form a + bi
    back: |
      (3 + 2i)(1 + i)/2 = (3 + 5i + 2i²)/2 = (1 + 5i)/2 = 1/2 + (5/2)i.
    topic_code: "3.14"
  - front: 1/i simplified
    back: |
      −i, because i · (−i) = −i² = 1. Equivalently multiply top and bottom by −i.
    topic_code: "3.14"
  - front: (1 + i)⁴ and (1 − i)⁴
    back: |
      (1 + i)² = 2i so (1 + i)⁴ = (2i)² = −4. (1 − i)² = −2i so (1 − i)⁴ = (−2i)² = −4 as well.
    topic_code: "3.14"
  - front: (2 + i)³ step by step
    back: |
      (2 + i)² = 3 + 4i; then (3 + 4i)(2 + i) = 6 + 3i + 8i + 4i² = 2 + 11i.
    topic_code: "3.14"
  - front: (2 + 3i)² and (2 − 3i)²
    back: |
      −5 + 12i and −5 − 12i: conjugate inputs give conjugate squares. Their sum is −10, their difference 24i.
    topic_code: "3.14"
  - front: Find z with (2 + i)z = 5
    back: |
      z = 5/(2 + i) = 5(2 − i)/(4 + 1) = 2 − i. Check: (2 + i)(2 − i) = 5.
    topic_code: "3.15"
  - front: Find z with z + (3 − i) = 7 + 2i
    back: |
      Subtract: z = (7 − 3) + (2 + 1)i = 4 + 3i.
    topic_code: "3.15"
  - front: Two complex numbers with sum 6 and product 13
    back: |
      A conjugate pair a ± bi has sum 2a and product a² + b². So a = 3 and 9 + b² = 13 gives b = 2: the numbers are 3 + 2i and 3 − 2i.
    topic_code: "3.15"
  - front: Method for square roots of p + qi
    back: |
      Set (a + bi)² = p + qi, expand to (a² − b²) + 2ab·i, and match: a² − b² = p and 2ab = q. Solve for real a and b, then both a + bi and −(a + bi) are square roots.
    topic_code: "3.15"
  - front: Square roots of 8 + 6i
    back: |
      a² − b² = 8 and ab = 3; (a, b) = (3, 1) works since 9 − 1 = 8. Roots: 3 + i and −3 − i.
    topic_code: "3.15"
  - front: Square roots of 2i and of −2i
    back: |
      ±(1 + i) since (1 + i)² = 2i; ±(1 − i) since (1 − i)² = −2i.
    topic_code: "3.15"
  - front: Square roots of 21 − 20i
    back: |
      a² − b² = 21 and ab = −10; (5, −2) works: 25 − 4 = 21 and 2(5)(−2) = −20. Roots ±(5 − 2i).
    topic_code: "3.15"
  - front: How many square roots does a nonzero complex number have?
    back: |
      Exactly two, and they are opposites, just as 9 has 3 and −3 and −16 has 4i and −4i.
    topic_code: "3.15"
  - front: Values of k with (3 + ki)(3 − ki) = 25
    back: |
      The product is 9 + k², so k² = 16 and k = 4 or k = −4.
    topic_code: "3.15"
  - front: Solving x² + 6x + 5 = 0 by factoring
    back: |
      (x + 1)(x + 5) = 0, so x = −1 or x = −5.
    topic_code: "3.16"
  - front: Solving 2x² + 4x − 6 = 0
    back: |
      Divide by 2 first: x² + 2x − 3 = (x + 3)(x − 1) = 0, so x = −3 or x = 1.
    topic_code: "3.16"
  - front: Solving x² − 4x = 12 by undoing a square
    back: |
      Add 4: (x − 2)² = 16, so x − 2 = ±4 and x = 6 or x = −2.
    topic_code: "3.16"
  - front: Completing the square on x² − 8x + 3 = 0
    back: |
      Half of −8 is −4, squared is 16: (x − 4)² = 13, so x = 4 ± √13.
    topic_code: "3.16"
  - front: Completing the square on x² + 10x + 7 = 0
    back: |
      (x + 5)² = 25 − 7 = 18, so x = −5 ± √18 = −5 ± 3√2.
    topic_code: "3.16"
  - front: Vertex form of y = x² − 6x + 2
    back: |
      (x − 3)² − 7, so the vertex is (3, −7) and the minimum value is −7.
    topic_code: "3.16"
  - front: What (x + 1)² = −4 signals
    back: |
      No real solution (a real square is never negative), but with complex numbers x + 1 = ±2i, so x = −1 ± 2i.
    topic_code: "3.16"
  - front: Completing the square → common error
    back: |
      Adding (b/2)² to one side only, or not dividing through by the leading coefficient first. Both sides must change together.
    topic_code: "3.16"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 3.14 to 3.16: conjugates and quotients,
    working backwards, and solving quadratics), with about a third reviewing weeks 11–13 and Units 1 and 2.
    Includes a shared-context set on the square roots of a complex number. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: square roots of 8 + 6i (3.15)
    - slug: alg2-u03-w14-q01
      type: multiple_choice
      topic_code: "3.15"
      source: "IM Algebra 2, Unit 3, Lesson 15"
      points: 1
      stimulus: |
        To find the square roots of 8 + 6i, set (a + bi)² = 8 + 6i with a and b real.
      prompt: |
        Expanding (a + bi)² and matching real and imaginary parts gives which pair of equations?
      options:
        - "a² + b² = 8 and ab = 6"
        - "a² − b² = 8 and 2ab = 6"
        - "a² − b² = 6 and 2ab = 8"
        - "a + b = 8 and ab = 6"
      option_explanations:
        - |
          (bi)² = −b², so the real part is a² − b², not a² + b²; and the cross term is 2ab, not ab.
        - |
          Correct. (a + bi)² = a² + 2abi + b²i² = (a² − b²) + 2ab·i, so a² − b² = 8 and 2ab = 6.
        - |
          The real part of 8 + 6i is 8 and the imaginary part is 6; this swaps them.
        - |
          Squaring does not produce a + b; the real part of the square is a² − b².
      answer: 1
    - slug: alg2-u03-w14-q02
      type: multiple_choice
      topic_code: "3.15"
      source: "IM Algebra 2, Unit 3, Lesson 15"
      points: 1
      stimulus: |
        To find the square roots of 8 + 6i, set (a + bi)² = 8 + 6i with a and b real.
      prompt: |
        Which pair (a, b) satisfies both equations?
      options:
        - "(2, 2)"
        - "(3, 1)"
        - "(1, 3)"
        - "(4, 2)"
      option_explanations:
        - |
          2 · 2 · 2 = 8 for the imaginary part, not 6, and 4 − 4 = 0 for the real part, not 8.
        - |
          Correct. 3² − 1² = 9 − 1 = 8 and 2 · 3 · 1 = 6, so both equations hold.
        - |
          1 − 9 = −8, the wrong sign for the real part.
        - |
          2 · 4 · 2 = 16, not 6, and 16 − 4 = 12, not 8.
      answer: 1
    - slug: alg2-u03-w14-q03
      type: multiple_choice
      topic_code: "3.15"
      source: "IM Algebra 2, Unit 3, Lesson 15"
      points: 1
      stimulus: |
        To find the square roots of 8 + 6i, set (a + bi)² = 8 + 6i with a and b real.
      prompt: |
        What are all the square roots of 8 + 6i?
      options:
        - "3 + i only"
        - "3 + i and 3 − i"
        - "3 + i and −3 − i"
        - "3 + i, −3 − i, 3 − i and −3 + i"
      option_explanations:
        - |
          The opposite of a square root is also a square root, since (−z)² = z².
        - |
          (3 − i)² = 9 − 6i + i² = 8 − 6i, which is the conjugate of 8 + 6i, not 8 + 6i itself.
        - |
          Correct. (3 + i)² = 8 + 6i and (−3 − i)² = (−1)²(3 + i)² = 8 + 6i; a nonzero complex number has exactly two square roots.
        - |
          3 − i and −3 + i square to 8 − 6i, not 8 + 6i; a nonzero number has only two square roots.
      answer: 2
    # ---- Single items on this week
    - slug: alg2-u03-w14-q04
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 1
      prompt: |
        What is the conjugate of −2 + 5i, and what is the product of −2 + 5i with its conjugate?
      options:
        - "2 − 5i; product −29"
        - "−2 − 5i; product 29"
        - "−2 − 5i; product −21"
        - "2 + 5i; product 29"
      option_explanations:
        - |
          The conjugate keeps the real part; only the sign of the imaginary part flips.
        - |
          Correct. The conjugate is −2 − 5i, and (−2 + 5i)(−2 − 5i) = 4 + 25 = 29.
        - |
          The conjugate is right, but a² + b² = 4 + 25 = 29; −21 treats i² as +1.
        - |
          2 + 5i is the opposite of the conjugate, not the conjugate; the real part must stay −2.
      answer: 1
    - slug: alg2-u03-w14-q05
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Write (4 + 2i)/(1 + i) in the form a + bi.
      options:
        - "4 + 2i"
        - "3 + i"
        - "3 − i"
        - "1 − i"
      option_explanations:
        - |
          Dividing by 1 + i is not the same as dividing by 1; the quotient must be checked by multiplying back.
        - |
          (1 + i)(3 + i) = 3 + i + 3i + i² = 2 + 4i, not 4 + 2i.
        - |
          Correct. Multiply by (1 − i)/(1 − i): (6 − 2i)/2 = 3 − i, and (1 + i)(3 − i) = 4 + 2i confirms it.
        - |
          (1 + i)(1 − i) = 1 + 1 = 2, not 4 + 2i, so 1 − i is not the quotient.
      answer: 2
    - slug: alg2-u03-w14-q06
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 1
      prompt: |
        What is (2 + i)³?
      options:
        - "8 + i"
        - "2 + 11i"
        - "6 + 11i"
        - "8 + 12i + 6i² + i³"
      option_explanations:
        - |
          Cubing a binomial produces cross terms; 8 + i only cubes each part separately.
        - |
          Correct. (2 + i)² = 3 + 4i, and (3 + 4i)(2 + i) = 6 + 3i + 8i + 4i² = 2 + 11i.
        - |
          The 4i² term contributes −4 to the real part, so it is 6 − 4 = 2, not 6.
        - |
          This expansion is correct as far as it goes, but i² = −1 and i³ = −i still have to be applied to reach 2 + 11i.
      answer: 1
    - slug: alg2-u03-w14-q07
      type: multiple_choice
      topic_code: "3.15"
      source: "IM Algebra 2, Unit 3, Lesson 15"
      points: 1
      prompt: |
        Find the complex number z such that (2 + i)z = 5.
      options:
        - "2 − i"
        - "2 + i"
        - "5/2 − i"
        - "3 − i"
      option_explanations:
        - |
          Correct. z = 5/(2 + i) = 5(2 − i)/5 = 2 − i, and (2 + i)(2 − i) = 4 + 1 = 5.
        - |
          (2 + i)(2 + i) = 4 + 4i + i² = 3 + 4i, not 5; the factor needed is the conjugate.
        - |
          (2 + i)(5/2 − i) = 5 − 2i + 5i/2 − i² = 6 + i/2, not 5.
        - |
          (2 + i)(3 − i) = 6 − 2i + 3i − i² = 7 + i, not 5.
      answer: 0
    - slug: alg2-u03-w14-q08
      type: multiple_choice
      topic_code: "3.15"
      source: "IM Algebra 2, Unit 3, Lesson 15"
      points: 1
      prompt: |
        Two complex numbers have sum 6 and product 13. What are they?
      options:
        - "3 + 2i and 3 − 2i"
        - "2 + 3i and 2 − 3i"
        - "6 + i and −i"
        - "3 + 4i and 3 − 4i"
      option_explanations:
        - |
          Correct. The sum is 6 and the product is 3² + 2² = 13.
        - |
          The sum would be 4, not 6, and the product 4 + 9 = 13 happens to match but the sum fails.
        - |
          The sum is 6, but the product is (6 + i)(−i) = −6i − i² = 1 − 6i, not 13.
        - |
          The sum is 6, but the product is 9 + 16 = 25, not 13.
      answer: 0
    - slug: alg2-u03-w14-q09
      type: multiple_choice
      topic_code: "3.16"
      source: "IM Algebra 2, Unit 3, Lesson 16"
      points: 1
      prompt: |
        Solve x² − 8x + 3 = 0 by completing the square.
      options:
        - "x = 4 ± √13"
        - "x = −4 ± √13"
        - "x = 4 ± √19"
        - "x = 8 ± √61"
      option_explanations:
        - |
          Correct. (x − 4)² = 16 − 3 = 13, so x = 4 ± √13.
        - |
          Half of −8 is −4, so the square is (x − 4)² and the solutions are centred at +4.
        - |
          Moving 3 to the right gives −3, and −3 + 16 = 13, not 19.
        - |
          The square is completed with half the x-coefficient, not the whole coefficient.
      answer: 0
    - slug: alg2-u03-w14-q10
      type: multiple_choice
      topic_code: "3.16"
      source: "IM Algebra 2, Unit 3, Lesson 16"
      points: 1
      prompt: |
        Which equation is equivalent to x² − 4x = 12 after completing the square, and what are its solutions?
      options:
        - "(x − 2)² = 12; x = 2 ± 2√3"
        - "(x − 2)² = 16; x = 6 and x = −2"
        - "(x − 4)² = 28; x = 4 ± 2√7"
        - "(x − 2)² = 8; x = 2 ± 2√2"
      option_explanations:
        - |
          Adding 4 to the left side to complete the square requires adding 4 to the right side as well: 12 + 4 = 16.
        - |
          Correct. x² − 4x + 4 = 16, so x − 2 = ±4 and x = 6 or x = −2.
        - |
          Half of −4 is −2, so the square is (x − 2)², not (x − 4)².
        - |
          The 4 added to complete the square must be added, not subtracted, on the right: 12 + 4 = 16.
      answer: 1
    - slug: alg2-u03-w14-q11
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Algebra 2, Unit 3, Lesson 11"
      points: 1
      prompt: |
        What is i²⁰²⁶?
      options:
        - "1"
        - "i"
        - "−1"
        - "−i"
      option_explanations:
        - |
          i raised to a multiple of 4 is 1, but 2026 = 4 · 506 + 2 leaves remainder 2.
        - |
          A remainder of 1 would give i; the remainder here is 2.
        - |
          Correct. 2026 leaves remainder 2 when divided by 4, so i²⁰²⁶ = i² = −1.
        - |
          A remainder of 3 would give −i; 2026 = 2024 + 2 leaves remainder 2.
      answer: 2
    - slug: alg2-u03-w14-q12
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Algebra 2, Unit 2, Lesson 15"
      points: 1
      prompt: |
        What is the remainder when p(x) = x³ − 2x + 1 is divided by x − 2?
      options:
        - "1"
        - "5"
        - "−3"
        - "0"
      option_explanations:
        - |
          1 is p(0), not p(2); the remainder on division by x − 2 is p(2).
        - |
          Correct. By the remainder theorem the remainder is p(2) = 8 − 4 + 1 = 5.
        - |
          p(−2) = −8 + 4 + 1 = −3 is the remainder on division by x + 2, not x − 2.
        - |
          A remainder of 0 would make x − 2 a factor, but p(2) = 5 ≠ 0.
      answer: 1
    - slug: alg2-u03-w14-q13
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Algebra 2, Unit 3, Lesson 6"
      points: 1
      prompt: |
        What are the solutions of x² = 50?
      options:
        - "x = 25 only"
        - "x = 5√2 only"
        - "x = ±5√2"
        - "x = ±25"
      option_explanations:
        - |
          25 is half of 50, not its square root; 25² = 625.
        - |
          The positive root is right, but −5√2 also squares to 50.
        - |
          Correct. √50 = √(25 · 2) = 5√2, and both 5√2 and −5√2 square to 50.
        - |
          (±25)² = 625, not 50; 25 is half of 50, not its square root.
      answer: 2
    - slug: alg2-u03-w14-q14
      type: multi_select
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 2
      partial_credit: true
      prompt: |
        Which of these expressions simplify to a real number? Select all that apply.
      options:
        - "(2i)²"
        - "i⁴"
        - "(1 + i)(1 − i)"
        - "(1 + i)²"
        - "1/i"
      option_explanations:
        - |
          Correct. (2i)² = 4i² = −4, a real number.
        - |
          Correct. i⁴ = (i²)² = (−1)² = 1, a real number.
        - |
          Correct. A conjugate product is a² + b² = 1 + 1 = 2.
        - |
          (1 + i)² = 1 + 2i + i² = 2i, which is imaginary.
        - |
          1/i = −i, which is imaginary, since i · (−i) = 1.
      answer: [0, 1, 2]
    - slug: alg2-u03-w14-q15
      type: multi_select
      topic_code: "3.15"
      source: "IM Algebra 2, Unit 3, Lesson 15"
      points: 2
      partial_credit: true
      prompt: |
        For which pairs (a, b) does (a + bi)² = 2i? Select all that apply.
      options:
        - "(1, 1)"
        - "(−1, −1)"
        - "(1, −1)"
        - "(√2, 0)"
        - "(0, √2)"
      option_explanations:
        - |
          Correct. (1 + i)² = 1 + 2i + i² = 1 + 2i − 1 = 2i.
        - |
          Correct. (−1 − i)² = (1 + i)² = 2i, since squaring removes the overall sign.
        - |
          (1 − i)² = 1 − 2i + i² = −2i, the wrong sign.
        - |
          (√2 + 0i)² = 2, a real number, not the imaginary number 2i.
        - |
          (√2 i)² = 2i² = −2, a real number, not 2i.
      answer: [0, 1]
    - slug: alg2-u03-w14-q16
      type: true_false
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 1
      prompt: |
        True or false: for every complex number z, the product of z and its conjugate is a real number that is never negative.
      answer: true
      explanation: |
        True. (a + bi)(a − bi) = a² + b², a sum of two real squares, which is real and at least 0 (and equals 0 only when z = 0).
    - slug: alg2-u03-w14-q17
      type: true_false
      topic_code: "3.3"
      source: "IM Algebra 2, Unit 3, Lesson 3"
      points: 1
      prompt: |
        True or false: 16^(1/4) = 4.
      answer: false
      explanation: |
        False. 16^(1/4) is the fourth root of 16, which is 2, because 2⁴ = 16. The value 4 is 16^(1/2).
    - slug: alg2-u03-w14-q18
      type: fill_blank
      topic_code: "3.16"
      source: "IM Algebra 2, Unit 3, Lesson 16"
      points: 1
      prompt: |
        The smaller of the two solutions of x² + 6x + 5 = 0 is x = ____
      answer: ["-5", "−5", "- 5", "− 5"]
      explanation: |
        (x + 1)(x + 5) = 0 gives x = −1 or x = −5; the smaller is −5.
    - slug: alg2-u03-w14-q19
      type: fill_blank
      topic_code: "3.12"
      source: "IM Algebra 2, Unit 3, Lesson 12"
      points: 1
      prompt: |
        Simplify: (4 − i) + (−1 + 3i) = ____
      answer: ["3 + 2i", "3+2i", "3 +2i", "3+ 2i", "2i + 3", "2i+3"]
      explanation: |
        Real parts 4 + (−1) = 3; imaginary parts −1 + 3 = 2; the sum is 3 + 2i.
    - slug: alg2-u03-w14-q20
      type: numeric
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Write (5 + 5i)/(1 + 2i) in the form a + bi and give the real part a.
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Multiply by (1 − 2i)/(1 − 2i): (5 − 10i + 5i − 10i²)/5 = (15 − 5i)/5 = 3 − i. The real part is 3.
    - slug: alg2-u03-w14-q21
      type: numeric
      topic_code: "3.8"
      source: "IM Algebra 2, Unit 3, Lesson 8"
      points: 1
      prompt: |
        Solve ∛(x − 5) = 3.
      answer: { value: 32, tolerance: 0 }
      explanation: |
        Cube both sides: x − 5 = 27, so x = 32. Cubing is reversible, so no extraneous solution can appear.
    - slug: alg2-u03-w14-q22
      type: numeric
      topic_code: "2.7"
      source: "IM Algebra 2, Unit 2, Lesson 7"
      points: 1
      prompt: |
        The polynomial p(x) = (x − 1)(x + 2)(x − 4) has a vertical intercept at (0, p(0)). Give p(0).
      answer: { value: 8, tolerance: 0 }
      explanation: |
        p(0) = (−1)(2)(−4) = 8.
    - slug: alg2-u03-w14-q23
      type: short_answer
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 3
      prompt: |
        (a) Explain why multiplying the numerator and denominator of (3 + 2i)/(1 − i) by 1 + i is a useful step.
        (b) Carry out the division and write the result in the form a + bi.
        (c) Verify your answer by multiplying it by 1 − i.
      answer: |
        (a) 1 + i is the conjugate of the denominator, and (1 − i)(1 + i) = 1 + 1 = 2 is a real number, so the quotient becomes a complex number divided by a real number, which is easy to write as a + bi.
        (b) (3 + 2i)(1 + i) = 3 + 3i + 2i + 2i² = 1 + 5i, so the quotient is (1 + 5i)/2 = 1/2 + (5/2)i.
        (c) (1 − i)(1/2 + (5/2)i) = 1/2 + (5/2)i − (1/2)i − (5/2)i² = 1/2 + 2i + 5/2 = 3 + 2i, the original numerator.
      explanation: |
        Three points, one per part. (a) identifies the conjugate and the real denominator. (b) 1/2 + (5/2)i with the i² step shown. (c) a complete multiplication back to 3 + 2i.
