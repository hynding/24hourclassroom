week: 15
unit: 3
title: "Complex Solutions and the Discriminant"
topics: ["3.17", "3.18", "3.19"]
guide: guides/week-15.md
guide_description: |
  Completing the square all the way to complex solutions and checking them by substitution; the quadratic
  formula with a negative discriminant, simplifying √(−n) to i√n and reducing the fraction correctly, with
  sum-and-product checks; the discriminant b² − 4ac as a predictor of two real, one real or two non-real
  solutions and of the number of x-intercepts; why non-real solutions come in conjugate pairs; building a
  quadratic from its solutions; and parameter questions such as which k gives x² + kx + 9 = 0 one solution.
flashcards_description: |
  27 cards on completing the square with complex results, the quadratic formula, the discriminant, conjugate
  pairs, and building quadratics from solutions.

flashcards:
  - front: Finishing (x + 1)² = −4
    back: |
      x + 1 = ±√(−4) = ±2i, so x = −1 ± 2i. A negative right side means complex solutions, not no solutions.
    topic_code: "3.17"
  - front: Four steps of completing the square for any quadratic
    back: |
      Make the leading coefficient 1; move the constant to the right; add (half the x-coefficient)² to both sides; undo the square with ±, bringing in i if the right side is negative.
    topic_code: "3.17"
  - front: Solutions of x² + 4x + 13 = 0
    back: |
      (x + 2)² = −9, so x = −2 ± 3i.
    topic_code: "3.17"
  - front: Solutions of x² − 6x + 25 = 0
    back: |
      (x − 3)² = −16, so x = 3 ± 4i.
    topic_code: "3.17"
  - front: Solutions of 2x² − 4x + 10 = 0
    back: |
      Divide by 2: x² − 2x + 5 = 0, (x − 1)² = −4, x = 1 ± 2i.
    topic_code: "3.17"
  - front: Solutions of x² − 2x + 3 = 0 in a + bi form
    back: |
      (x − 1)² = −2, so x = 1 ± i√2, that is 1 + (√2)i and 1 − (√2)i.
    topic_code: "3.17"
  - front: Checking x = −2 + 3i in x² + 4x + 13 = 0
    back: |
      x² = 4 − 12i + 9i² = −5 − 12i; 4x = −8 + 12i; sum with 13: (−5 − 8 + 13) + (−12 + 12)i = 0.
    topic_code: "3.17"
  - front: Sign that a complex-solution check is going right
    back: |
      The imaginary parts cancel exactly and the real parts sum to 0. If an i survives, recheck the arithmetic.
    topic_code: "3.17"
  - front: The quadratic formula
    back: |
      For ax² + bx + c = 0, x = (−b ± √(b² − 4ac)) / (2a). Unchanged for complex solutions; only √(negative) becomes i√(positive).
    topic_code: "3.18"
  - front: Solutions of x² − 4x + 7 = 0 by formula
    back: |
      Discriminant 16 − 28 = −12. x = (4 ± √(−12))/2 = (4 ± 2i√3)/2 = 2 ± i√3.
    topic_code: "3.18"
  - front: Solutions of 2x² + 2x + 5 = 0 by formula
    back: |
      Discriminant 4 − 40 = −36. x = (−2 ± 6i)/4 = −1/2 ± (3/2)i.
    topic_code: "3.18"
  - front: Solutions of 3x² − 2x + 1 = 0 by formula
    back: |
      Discriminant 4 − 12 = −8. x = (2 ± 2i√2)/6 = 1/3 ± (√2/3)i.
    topic_code: "3.18"
  - front: Simplifying (4 ± 2i√3)/2 → common error
    back: |
      Divide both terms: 2 ± i√3. Halving only the 4 (giving 2 ± 2i√3) or only the root is wrong.
    topic_code: "3.18"
  - front: √(−12) inside the quadratic formula
    back: |
      Write it as i√12 = 2i√3 before dividing by 2a. The negative under the root becomes a factor of i, never a minus sign.
    topic_code: "3.18"
  - front: Sum and product of the solutions of ax² + bx + c = 0
    back: |
      Sum = −b/a, product = c/a. A quick check: for x² − 4x + 7, (2 + i√3) + (2 − i√3) = 4 and (2 + i√3)(2 − i√3) = 7.
    topic_code: "3.18"
  - front: Discriminant (definition)
    back: |
      b² − 4ac, the expression under the root in the quadratic formula. Its sign tells the kind of solutions.
    topic_code: "3.19"
  - front: Discriminant positive, zero, negative → solutions
    back: |
      Positive: two different real solutions. Zero: one real solution (a double root). Negative: two non-real solutions forming a conjugate pair.
    topic_code: "3.19"
  - front: Discriminant and the x-intercepts of the parabola
    back: |
      Positive: crosses the x-axis twice. Zero: touches it once. Negative: never meets it.
    topic_code: "3.19"
  - front: Classify x² + 5x + 2 = 0, x² − 6x + 9 = 0, x² + x + 1 = 0
    back: |
      17 > 0: two real (irrational). 0: one real (x = 3). −3 < 0: two non-real.
    topic_code: "3.19"
  - front: Discriminant of 2x² − 3x + 4 = 0
    back: |
      (−3)² − 4(2)(4) = 9 − 32 = −23, so two non-real solutions.
    topic_code: "3.19"
  - front: Why non-real solutions come in conjugate pairs
    back: |
      The formula gives (−b ± i√(4ac − b²))/(2a): the same real part and opposite imaginary parts. A real-coefficient quadratic can never have exactly one non-real solution.
    topic_code: "3.19"
  - front: If 2 + 5i solves a real-coefficient quadratic, what else does?
    back: |
      Its conjugate 2 − 5i. The quadratic is x² − 4x + 29 = 0 (sum 4, product 4 + 25 = 29).
    topic_code: "3.19"
  - front: Quadratic with solutions 3 ± i
    back: |
      Sum 6, product 9 + 1 = 10: x² − 6x + 10 = 0. Equivalently (x − 3)² + 1 = 0.
    topic_code: "3.19"
  - front: Quadratic with solutions 1 ± i√2
    back: |
      Sum 2, product 1 + 2 = 3: x² − 2x + 3 = 0.
    topic_code: "3.19"
  - front: Values of k for which x² + kx + 9 = 0 has one real solution
    back: |
      k² − 36 = 0, so k = ±6. For −6 < k < 6 the solutions are non-real; for |k| > 6 there are two real solutions.
    topic_code: "3.19"
  - front: Values of c for which x² + 4x + c = 0 has non-real solutions
    back: |
      16 − 4c < 0, so c > 4.
    topic_code: "3.19"
  - front: Negative discriminant → common misreading
    back: |
      It does not mean "no solutions". There are two solutions; they are non-real, so the graph has no x-intercepts.
    topic_code: "3.19"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 3.17 to 3.19: complex solutions by
    completing the square and the quadratic formula, and the discriminant), with about a third reviewing
    weeks 11–14 and Units 1 and 2. Includes a shared-context set on one quadratic equation. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: x² − 4x + 7 = 0 (3.18, 3.19)
    - slug: alg2-u03-w15-q01
      type: multiple_choice
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 1
      stimulus: |
        Consider the equation x² − 4x + 7 = 0.
      prompt: |
        What is the discriminant, and what does it tell you about the solutions?
      options:
        - "−12; two non-real solutions"
        - "12; two real solutions"
        - "44; two real solutions"
        - "−12; no solutions"
      option_explanations:
        - |
          Correct. (−4)² − 4(1)(7) = 16 − 28 = −12 < 0, so the solutions are a non-real conjugate pair.
        - |
          The discriminant is 16 − 28, which is negative, not positive.
        - |
          44 comes from 16 + 28; the formula subtracts 4ac.
        - |
          A negative discriminant means the two solutions are non-real, not that there are none.
      answer: 0
    - slug: alg2-u03-w15-q02
      type: multiple_choice
      topic_code: "3.18"
      source: "IM Algebra 2, Unit 3, Lesson 18"
      points: 1
      stimulus: |
        Consider the equation x² − 4x + 7 = 0.
      prompt: |
        What are the solutions?
      options:
        - "x = 2 ± 2i√3"
        - "x = 2 ± i√3"
        - "x = 4 ± i√3"
        - "x = −2 ± i√3"
      option_explanations:
        - |
          (4 ± 2i√3)/2 halves both terms; the root term becomes i√3, not 2i√3.
        - |
          Correct. x = (4 ± √(−12))/2 = (4 ± 2i√3)/2 = 2 ± i√3.
        - |
          The 4 in the numerator must also be divided by 2, giving a real part of 2.
        - |
          −b = −(−4) = 4, so the real part is +2, not −2.
      answer: 1
    - slug: alg2-u03-w15-q03
      type: multiple_choice
      topic_code: "3.18"
      source: "IM Algebra 2, Unit 3, Lesson 18"
      points: 1
      stimulus: |
        Consider the equation x² − 4x + 7 = 0.
      prompt: |
        Which pair of values gives the sum and product of the two solutions, and how does it check the solutions?
      options:
        - "Sum 4, product 7: (2 + i√3) + (2 − i√3) = 4 and (2 + i√3)(2 − i√3) = 7"
        - "Sum −4, product 7: the sum of the solutions is b/a"
        - "Sum 4, product 1: the product of the solutions is always 1 for a monic quadratic"
        - "Sum 4, product −7: the product is −c/a"
      option_explanations:
        - |
          Correct. Sum = −b/a = 4 and product = c/a = 7, and the conjugate product is 4 + 3 = 7.
        - |
          The sum of the solutions is −b/a = 4, not b/a.
        - |
          The product of the solutions is c/a = 7; it equals 1 only when c = a.
        - |
          The product is c/a = 7, with no sign change.
      answer: 0
    # ---- Single items on this week
    - slug: alg2-u03-w15-q04
      type: multiple_choice
      topic_code: "3.17"
      source: "IM Algebra 2, Unit 3, Lesson 17"
      points: 1
      prompt: |
        Solve x² + 4x + 13 = 0 by completing the square.
      options:
        - "x = −2 ± 3i"
        - "x = 2 ± 3i"
        - "x = −2 ± 3"
        - "x = −4 ± 3i"
      option_explanations:
        - |
          Correct. (x + 2)² = −13 + 4 = −9, so x + 2 = ±3i and x = −2 ± 3i.
        - |
          Half of +4 is +2, so the square is (x + 2)² and the real part of the solutions is −2.
        - |
          The right side is −9, so its square roots are ±3i, not ±3.
        - |
          The square uses half the x-coefficient: (x + 2)², giving real part −2, not −4.
      answer: 0
    - slug: alg2-u03-w15-q05
      type: multiple_choice
      topic_code: "3.17"
      source: "IM Algebra 2, Unit 3, Lesson 17"
      points: 1
      prompt: |
        Solve x² − 6x + 25 = 0.
      options:
        - "x = 3 ± 4i"
        - "x = −3 ± 4i"
        - "x = 3 ± 16i"
        - "x = 6 ± 4i"
      option_explanations:
        - |
          Correct. (x − 3)² = −25 + 9 = −16, so x = 3 ± 4i.
        - |
          Half of −6 is −3, so (x − 3)² is the square and the real part of the solutions is +3.
        - |
          √(−16) = 4i, not 16i; take the square root of 16 and attach i.
        - |
          The real part is half of 6, not 6; by the formula it is −b/(2a) = 6/2 = 3.
      answer: 0
    - slug: alg2-u03-w15-q06
      type: multiple_choice
      topic_code: "3.18"
      source: "IM Algebra 2, Unit 3, Lesson 18"
      points: 1
      prompt: |
        Use the quadratic formula to solve 2x² + 2x + 5 = 0.
      options:
        - "x = −1 ± 3i"
        - "x = −1/2 ± (3/2)i"
        - "x = −1/2 ± 3i"
        - "x = −2 ± 6i"
      option_explanations:
        - |
          (−2 ± 6i)/4 divides both terms by 4, giving −1/2 ± (3/2)i; this halves instead.
        - |
          Correct. Discriminant 4 − 40 = −36; x = (−2 ± 6i)/4 = −1/2 ± (3/2)i.
        - |
          The 6i must also be divided by 4, giving (3/2)i.
        - |
          −2 ± 6i is the numerator; the whole thing is still to be divided by 2a = 4.
      answer: 1
    - slug: alg2-u03-w15-q07
      type: multiple_choice
      topic_code: "3.18"
      source: "IM Algebra 2, Unit 3, Lesson 18"
      points: 1
      prompt: |
        Use the quadratic formula to solve x² + 6x + 10 = 0.
      options:
        - "x = −3 ± i"
        - "x = 3 ± i"
        - "x = −3 ± 2i"
        - "x = −6 ± 2i"
      option_explanations:
        - |
          Correct. Discriminant 36 − 40 = −4; x = (−6 ± 2i)/2 = −3 ± i.
        - |
          −b = −6, so the real part is −6/2 = −3, not +3.
        - |
          The 2i in the numerator is divided by 2a = 2, giving i, not 2i.
        - |
          The numerator −6 ± 2i still has to be divided by 2a = 2.
      answer: 0
    - slug: alg2-u03-w15-q08
      type: multiple_choice
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 1
      prompt: |
        Which quadratic equation has solutions 3 + i and 3 − i?
      options:
        - "x² − 6x + 10 = 0"
        - "x² + 6x + 10 = 0"
        - "x² − 6x + 8 = 0"
        - "x² − 6x − 10 = 0"
      option_explanations:
        - |
          Correct. The solutions have sum 6 and product 9 + 1 = 10, so the equation is x² − 6x + 10 = 0.
        - |
          A sum of 6 requires the x-coefficient to be −6 (sum = −b/a).
        - |
          A product of 10 is needed; x² − 6x + 8 = 0 has real solutions 2 and 4.
        - |
          The product of 3 + i and 3 − i is +10, so the constant must be +10.
      answer: 0
    - slug: alg2-u03-w15-q09
      type: multiple_choice
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 1
      prompt: |
        Which equation has exactly one real solution?
      options:
        - "x² + 5x + 2 = 0"
        - "4x² − 12x + 9 = 0"
        - "x² + x + 1 = 0"
        - "2x² − 3x + 4 = 0"
      option_explanations:
        - |
          Discriminant 25 − 8 = 17 > 0, so two real solutions.
        - |
          Correct. Discriminant 144 − 144 = 0, so one real (double) solution, x = 3/2.
        - |
          Discriminant 1 − 4 = −3 < 0, so two non-real solutions.
        - |
          Discriminant 9 − 32 = −23 < 0, so two non-real solutions.
      answer: 1
    - slug: alg2-u03-w15-q10
      type: multiple_choice
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 1
      prompt: |
        For which values of c does x² + 4x + c = 0 have two non-real solutions?
      options:
        - "c > 4"
        - "c < 4"
        - "c > 16"
        - "c < 0"
      option_explanations:
        - |
          Correct. The discriminant 16 − 4c is negative exactly when 4c > 16, that is c > 4.
        - |
          For c < 4 the discriminant 16 − 4c is positive, giving two real solutions.
        - |
          The threshold is where 16 − 4c = 0, at c = 4, not c = 16.
        - |
          Negative c makes 16 − 4c even larger and positive, so the solutions are real.
      answer: 0
    - slug: alg2-u03-w15-q11
      type: multiple_choice
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 1
      prompt: |
        Without solving, what can you say about the graph of y = x² − 2x + 5?
      options:
        - "It crosses the x-axis twice."
        - "It touches the x-axis at exactly one point."
        - "It never meets the x-axis."
        - "It crosses the x-axis once and touches it once."
      option_explanations:
        - |
          Two crossings need a positive discriminant; here 4 − 20 = −16 is negative.
        - |
          Touching once needs a discriminant of 0; here it is −16.
        - |
          Correct. The discriminant is 4 − 20 = −16 < 0, so the solutions are non-real and there are no x-intercepts.
        - |
          A parabola meets the x-axis in at most two points and cannot both cross and touch.
      answer: 2
    - slug: alg2-u03-w15-q12
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 1
      prompt: |
        What is (2 − 5i)²?
      options:
        - "4 + 25i²"
        - "−21 − 20i"
        - "29 − 20i"
        - "−21 + 20i"
      option_explanations:
        - |
          The middle term −20i is missing and i² must be replaced by −1.
        - |
          Correct. 4 − 20i + 25i² = 4 − 20i − 25 = −21 − 20i.
        - |
          25i² is −25, not +25, so the real part is 4 − 25 = −21.
        - |
          The cross term is 2 · 2 · (−5i) = −20i, so the imaginary part is negative.
      answer: 1
    - slug: alg2-u03-w15-q13
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Algebra 2, Unit 2, Lesson 9"
      points: 1
      prompt: |
        What is the end behavior of p(x) = −2x⁵ + 7x³ − x + 4?
      options:
        - "As x → ∞, p(x) → ∞, and as x → −∞, p(x) → −∞."
        - "As x → ∞, p(x) → −∞, and as x → −∞, p(x) → ∞."
        - "As x → ∞ and as x → −∞, p(x) → −∞."
        - "As x → ∞ and as x → −∞, p(x) → ∞."
      option_explanations:
        - |
          This is the behavior for a positive leading coefficient on an odd degree; the leading coefficient here is −2.
        - |
          Correct. Odd degree with a negative leading coefficient: the ends go in opposite directions, down on the right and up on the left.
        - |
          Both ends going the same way happens only for even degree; 5 is odd.
        - |
          Both ends going the same way happens only for even degree, and the negative leading coefficient would send them down.
      answer: 1
    - slug: alg2-u03-w15-q14
      type: multi_select
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about quadratic equations with real coefficients are true? Select all that apply.
      options:
        - "If b² − 4ac < 0, the two solutions are complex conjugates of each other."
        - "If b² − 4ac = 0, the graph of y = ax² + bx + c touches the x-axis at exactly one point."
        - "If b² − 4ac > 0, the two solutions must be rational numbers."
        - "A quadratic equation can have exactly one non-real solution."
        - "x² + x + 1 = 0 has no real solution."
      option_explanations:
        - |
          Correct. The formula gives −b/(2a) ± i·√(4ac − b²)/(2a), a conjugate pair.
        - |
          Correct. A zero discriminant means a single double root, where the parabola touches the axis.
        - |
          x² + 5x + 2 = 0 has discriminant 17, so its two real solutions are irrational.
        - |
          Non-real solutions come in conjugate pairs, so there are either none or two.
        - |
          Correct. Its discriminant is 1 − 4 = −3 < 0, so both solutions are non-real.
      answer: [0, 1, 4]
    - slug: alg2-u03-w15-q15
      type: multi_select
      topic_code: "3.17"
      source: "IM Algebra 2, Unit 3, Lesson 17"
      points: 2
      partial_credit: true
      prompt: |
        Which equations have solutions x = −1 ± 3i? Select all that apply.
      options:
        - "x² + 2x + 10 = 0"
        - "(x + 1)² = −9"
        - "x² − 2x + 10 = 0"
        - "(x + 1)² = 9"
        - "2x² + 4x + 20 = 0"
      option_explanations:
        - |
          Correct. Completing the square gives (x + 1)² = −9, so x = −1 ± 3i.
        - |
          Correct. x + 1 = ±3i directly gives x = −1 ± 3i.
        - |
          This gives (x − 1)² = −9, so the solutions are 1 ± 3i, with the wrong real part.
        - |
          A positive right side gives real solutions: x + 1 = ±3, so x = 2 or x = −4.
        - |
          Correct. Dividing by 2 gives x² + 2x + 10 = 0, the same equation as the first option.
      answer: [0, 1, 4]
    - slug: alg2-u03-w15-q16
      type: true_false
      topic_code: "3.18"
      source: "IM Algebra 2, Unit 3, Lesson 18"
      points: 1
      prompt: |
        True or false: if 2 + 5i is a solution of a quadratic equation with real coefficients, then 2 − 5i is also a solution.
      answer: true
      explanation: |
        True. The quadratic formula produces −b/(2a) ± i·(something real), so the non-real solutions share a real part and have opposite imaginary parts. The equation here is x² − 4x + 29 = 0.
    - slug: alg2-u03-w15-q17
      type: true_false
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      prompt: |
        True or false: 27^(2/3) = 9.
      answer: true
      explanation: |
        True. 27^(2/3) = (∛27)² = 3² = 9.
    - slug: alg2-u03-w15-q18
      type: fill_blank
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 1
      prompt: |
        The discriminant of 2x² − 3x + 4 = 0 is ____
      answer: ["-23", "−23", "- 23", "− 23"]
      explanation: |
        b² − 4ac = (−3)² − 4(2)(4) = 9 − 32 = −23, so the solutions are non-real.
    - slug: alg2-u03-w15-q19
      type: fill_blank
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 1
      prompt: |
        The conjugate of 5 − 2i is ____
      answer: ["5 + 2i", "5+2i", "5 +2i", "5+ 2i"]
      explanation: |
        The conjugate keeps the real part and flips the sign of the imaginary part: 5 + 2i.
    - slug: alg2-u03-w15-q20
      type: numeric
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 1
      prompt: |
        For how many integer values of k does x² + kx + 9 = 0 have two non-real solutions?
      answer: { value: 11, tolerance: 0 }
      explanation: |
        Non-real solutions need k² − 36 < 0, so −6 < k < 6. The integers −5, −4, …, 4, 5 qualify: 11 values.
    - slug: alg2-u03-w15-q21
      type: numeric
      topic_code: "3.5"
      source: "IM Algebra 2, Unit 3, Lesson 5"
      points: 1
      prompt: |
        Evaluate 16^(−3/4). Give your answer as a decimal.
      answer: { value: 0.125, tolerance: 0.001 }
      explanation: |
        16^(3/4) = (⁴√16)³ = 2³ = 8, so 16^(−3/4) = 1/8 = 0.125.
    - slug: alg2-u03-w15-q22
      type: numeric
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        A geometric sequence begins 3, 6, 12, 24, … What is its 10th term?
      answer: { value: 1536, tolerance: 0 }
      explanation: |
        The nth term is 3 · 2^(n − 1), so the 10th term is 3 · 2⁹ = 3 · 512 = 1536.
    - slug: alg2-u03-w15-q23
      type: short_answer
      topic_code: "3.17"
      source: "IM Algebra 2, Unit 3, Lesson 17"
      points: 3
      prompt: |
        (a) Solve x² − 10x + 29 = 0 by completing the square.
        (b) Check one of your solutions by substituting it into the equation.
        (c) Explain, without computing, why you could have predicted that the two solutions are conjugates of each other.
      answer: |
        (a) (x − 5)² = −29 + 25 = −4, so x − 5 = ±2i and x = 5 ± 2i.
        (b) For x = 5 + 2i: x² = 25 + 20i + 4i² = 21 + 20i; −10x = −50 − 20i; so x² − 10x + 29 = 21 + 20i − 50 − 20i + 29 = 0.
        (c) Undoing the square gives x = 5 ± (square root of a negative), so the two solutions have the same real part 5 and opposite imaginary parts; that is exactly a conjugate pair. Equivalently, the quadratic formula always gives −b/(2a) ± i·(real number) when the discriminant is negative.
      explanation: |
        Three points, one per part. (a) 5 ± 2i with the completed square shown. (b) a full substitution reaching 0. (c) the ± structure or the formula argument.
