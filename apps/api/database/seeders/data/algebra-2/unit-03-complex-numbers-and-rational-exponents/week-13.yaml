        (1) x + 5 = 2 has no solution among whole numbers, so negatives were introduced; 3x = 2 has none among integers, so fractions were introduced; x² = 2 has none among fractions, so irrational numbers were introduced. Each time the old arithmetic rules were kept and the new numbers filled a gap. x² = −1 has no real solution because real squares are nonnegative, so a new number i is introduced in the same way.
        (2) i² = −1. Then i³ = i² · i = −i and i⁴ = (i²)² = 1. Powers of i cycle every four; 50 = 12 · 4 + 2, so i⁵⁰ = i² = −1.
