week: 13
unit: 3
title: "A New Kind of Number: Introducing i"
topics: ["3.10", "3.11", "3.12", "3.13"]
guide: guides/week-13.md
guide_description: |
  Why the number system has been extended before (negatives, fractions, irrationals) and why x² = −1 calls
  for one more step; the number i with i² = −1, square roots of negatives, the four-cycle of powers of i and
  the complex plane; adding, subtracting and scaling complex numbers, and multiplying by i as a quarter turn;
  multiplying complex numbers by distributing and replacing i² with −1, including (a + bi)(a − bi) = a² + b²
  and checking complex solutions of quadratics.
flashcards_description: |
  27 cards on why i was invented, powers of i, square roots of negatives, the complex plane, and the
  arithmetic of complex numbers.

flashcards:
  - front: Why the number i was invented
    back: |
      x² = −1 has no real solution because every real square is nonnegative. Defining i by i² = −1 and keeping all the arithmetic rules gives the equation a solution, just as negatives, fractions and irrationals fixed earlier gaps.
    topic_code: "3.10"
  - front: Number system needed to solve x + 5 = 2, 3x = 2, x² = 2, x² = −1
    back: |
      Integers (x = −3), rational numbers (x = 2/3), real numbers (x = ±√2), complex numbers (x = ±i).
    topic_code: "3.10"
  - front: Defining property of i
    back: |
      i² = −1. Everything else about complex numbers follows from this and the usual rules of arithmetic.
    topic_code: "3.11"
  - front: Imaginary number (definition)
    back: |
      A real multiple of i, such as 3i or −½i. Its square is a negative real number: (3i)² = 9i² = −9.
    topic_code: "3.11"
  - front: Complex number (definition)
    back: |
      A number a + bi with a and b real. Real numbers (b = 0) and imaginary numbers (a = 0) are both included.
    topic_code: "3.11"
  - front: Real part and imaginary part of 7 − 3i
    back: |
      Real part 7, imaginary part −3. The imaginary part is the real coefficient of i, not −3i.
    topic_code: "3.11"
  - front: √(−9) in terms of i
    back: |
      3i, because (3i)² = 9i² = −9. In general √(−a) = i√a for a > 0.
    topic_code: "3.11"
  - front: √(−12) simplified
    back: |
      i√12 = 2i√3, since √12 = √(4 · 3) = 2√3.
    topic_code: "3.11"
  - front: The four-cycle of powers of i
    back: |
      i¹ = i, i² = −1, i³ = −i, i⁴ = 1, then it repeats. Divide the exponent by 4; the remainder picks the value.
    topic_code: "3.11"
  - front: i³⁸, i⁴⁵, i¹⁰⁰ evaluated
    back: |
      38 = 9 · 4 + 2 so i³⁸ = i² = −1; 45 leaves remainder 1 so i⁴⁵ = i; 100 leaves remainder 0 so i¹⁰⁰ = 1.
    topic_code: "3.11"
  - front: Plotting a + bi in the complex plane
    back: |
      Put the point at (a, b): real part along the horizontal (real) axis, imaginary part along the vertical (imaginary) axis. 2 − 5i is 2 right and 5 down.
    topic_code: "3.11"
  - front: Where real numbers and imaginary numbers sit in the complex plane
    back: |
      Real numbers lie on the horizontal axis (b = 0); imaginary numbers lie on the vertical axis (a = 0).
    topic_code: "3.11"
  - front: Adding complex numbers (rule)
    back: |
      Add real parts and add imaginary parts: (3 + 4i) + (2 − 7i) = 5 − 3i.
    topic_code: "3.12"
  - front: (5 − 2i) − (−3 + 6i)
    back: |
      5 − 2i + 3 − 6i = 8 − 8i. Distribute the minus sign over both parts.
    topic_code: "3.12"
  - front: 3(2 + i) − 2(1 − 4i)
    back: |
      6 + 3i − 2 + 8i = 4 + 11i.
    topic_code: "3.12"
  - front: Can the sum of two non-real complex numbers be real?
    back: |
      Yes: (1 + i) + (1 − i) = 2. The imaginary parts cancel when they are opposites.
    topic_code: "3.12"
  - front: Geometric effect of adding w to z in the complex plane
    back: |
      Shift z by the real part of w horizontally and the imaginary part of w vertically, like adding vectors.
    topic_code: "3.12"
  - front: Geometric effect of multiplying a complex number by i
    back: |
      i(a + bi) = −b + ai, so (a, b) moves to (−b, a): a quarter turn counterclockwise about the origin. Doing it twice gives −z, a half turn, matching i² = −1.
    topic_code: "3.12"
  - front: Multiplying complex numbers (rule)
    back: |
      Distribute as with binomials, replace i² by −1, then collect real and imaginary parts.
    topic_code: "3.13"
  - front: (2 + 3i)(4 − i)
    back: |
      8 − 2i + 12i − 3i² = 8 + 10i + 3 = 11 + 10i.
    topic_code: "3.13"
  - front: (1 + i)² and (3 − i)²
    back: |
      (1 + i)² = 1 + 2i + i² = 2i. (3 − i)² = 9 − 6i + i² = 8 − 6i.
    topic_code: "3.13"
  - front: (3i)(−5i)
    back: |
      −15i² = 15. Two imaginary numbers can have a real product.
    topic_code: "3.13"
  - front: (a + bi)(a − bi) → result
    back: |
      a² − b²i² = a² + b², always a real number. (3 + 4i)(3 − 4i) = 9 + 16 = 25.
    topic_code: "3.13"
  - front: Checking that 2i solves x² + 4 = 0
    back: |
      (2i)² + 4 = 4i² + 4 = −4 + 4 = 0. Both 2i and −2i are solutions.
    topic_code: "3.13"
  - front: Checking that 1 + i solves x² − 2x + 2 = 0
    back: |
      (1 + i)² = 2i and −2(1 + i) = −2 − 2i, so 2i − 2 − 2i + 2 = 0.
    topic_code: "3.13"
  - front: √(−4) · √(−9) → common error
    back: |
      Convert first: (2i)(3i) = 6i² = −6. Combining under one root to get √36 = 6 is wrong.
    topic_code: "3.13"
  - front: Most common complex-arithmetic slip
    back: |
      Leaving i² in an answer or treating it as 1. In 8 − 3i², the −3i² is +3, so the value is 11.
    topic_code: "3.13"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 3.10 to 3.13: the number i, the complex
    plane, and adding, subtracting and multiplying complex numbers), with about a third reviewing weeks 11–12
    and Units 1 and 2. Includes a shared-context set on a pair of complex numbers. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: z and w (3.12, 3.13)
    - slug: alg2-u03-w13-q01
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Algebra 2, Unit 3, Lesson 12"
      points: 1
      stimulus: |
        Let z = 3 + 2i and w = 1 − 4i.
      prompt: |
        What is z + w?
      options:
        - "4 − 2i"
        - "4 + 6i"
        - "2 + 6i"
        - "4 − 8i"
      option_explanations:
        - |
          Correct. Real parts 3 + 1 = 4; imaginary parts 2 + (−4) = −2.
        - |
          The imaginary parts are 2 and −4; their sum is −2, not 6.
        - |
          2 + 6i is the difference z − w, not the sum z + w; adding −4i lowers the imaginary part.
        - |
          The imaginary part of w is −4, not −4 multiplied by 2; 2 + (−4) = −2.
      answer: 0
    - slug: alg2-u03-w13-q02
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Algebra 2, Unit 3, Lesson 12"
      points: 1
      stimulus: |
        Let z = 3 + 2i and w = 1 − 4i.
      prompt: |
        What is z − w?
      options:
        - "2 − 2i"
        - "2 + 6i"
        - "4 − 2i"
        - "2 − 6i"
      option_explanations:
        - |
          Subtracting −4i adds 4i, so the imaginary part is 2 + 4 = 6, not −2.
        - |
          Correct. 3 − 1 = 2 and 2 − (−4) = 6, so z − w = 2 + 6i.
        - |
          4 − 2i is the sum z + w, not the difference.
        - |
          The sign of the imaginary part is wrong: 2 − (−4) = 6.
      answer: 1
    - slug: alg2-u03-w13-q03
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 1
      stimulus: |
        Let z = 3 + 2i and w = 1 − 4i.
      prompt: |
        What is the product zw?
      options:
        - "3 − 8i"
        - "−5 − 10i"
        - "11 − 10i"
        - "11 + 10i"
      option_explanations:
        - |
          3 − 8i multiplies only the matching parts; the cross terms −12i and 2i and the i² term are missing.
        - |
          The −8i² term equals +8, so the real part is 3 + 8 = 11, not 3 − 8.
        - |
          Correct. 3 − 12i + 2i − 8i² = 3 − 10i + 8 = 11 − 10i.
        - |
          The cross terms are −12i + 2i = −10i, so the imaginary part is negative.
      answer: 2
    # ---- Single items on this week
    - slug: alg2-u03-w13-q04
      type: multiple_choice
      topic_code: "3.10"
      source: "IM Algebra 2, Unit 3, Lesson 10"
      points: 1
      prompt: |
        Which equation has no solution among the real numbers but gains solutions once the number i is introduced?
      options:
        - "x + 4 = 0"
        - "4x = 1"
        - "x² = 4"
        - "x² = −4"
      option_explanations:
        - |
          x = −4 is a real (integer) solution; negatives were the extension that fixed this kind of equation.
        - |
          x = 1/4 is a real solution; fractions fixed this kind of equation.
        - |
          x² = 4 has the real solutions 2 and −2, so no new numbers are needed for it.
        - |
          Correct. No real number squares to −4, but (2i)² = 4i² = −4, so 2i and −2i are solutions.
      answer: 3
    - slug: alg2-u03-w13-q05
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Algebra 2, Unit 3, Lesson 11"
      points: 1
      prompt: |
        What is i⁷?
      options:
        - "i"
        - "−1"
        - "−i"
        - "1"
      option_explanations:
        - |
          i is i¹ or i⁵; the remainder of 7 on division by 4 is 3, not 1.
        - |
          −1 is i² or i⁶; i⁷ is one more factor of i beyond i⁶, so it is −1 · i = −i.
        - |
          Correct. 7 = 4 + 3, so i⁷ = i⁴ · i³ = 1 · (−i) = −i.
        - |
          1 is i⁴ or i⁸; the exponent 7 does not leave remainder 0.
      answer: 2
    - slug: alg2-u03-w13-q06
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Algebra 2, Unit 3, Lesson 11"
      points: 1
      prompt: |
        Where is the complex number 2 − 5i plotted in the complex plane?
      options:
        - "2 units right of the origin and 5 units up"
        - "2 units right of the origin and 5 units down"
        - "5 units left of the origin and 2 units up"
        - "On the real axis, 2 units right of the origin"
      option_explanations:
        - |
          The imaginary part is −5, so the point is below the real axis, not above it.
        - |
          Correct. The real part 2 is measured horizontally and the imaginary part −5 vertically: the point (2, −5).
        - |
          This swaps the parts; the real part is always the horizontal coordinate.
        - |
          Only numbers with imaginary part 0 lie on the real axis; 2 − 5i has imaginary part −5.
      answer: 1
    - slug: alg2-u03-w13-q07
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Algebra 2, Unit 3, Lesson 11"
      points: 1
      prompt: |
        Which expression equals √(−36)?
      options:
        - "−6"
        - "6i"
        - "−6i"
        - "36i"
      option_explanations:
        - |
          (−6)² = 36, not −36; a real number cannot be a square root of a negative.
        - |
          Correct. (6i)² = 36i² = −36, and the radical symbol names the root with positive coefficient.
        - |
          −6i also squares to −36, but the radical symbol √(−36) is taken to mean 6i, the principal root.
        - |
          (36i)² = 1296i² = −1296, far from −36; take the square root of 36 first.
      answer: 1
    - slug: alg2-u03-w13-q08
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Algebra 2, Unit 3, Lesson 12"
      points: 1
      prompt: |
        Simplify 3(1 + 2i) − 2(4 − i).
      options:
        - "−5 + 8i"
        - "−5 + 4i"
        - "11 + 8i"
        - "−5 − 8i"
      option_explanations:
        - |
          Correct. Distribute both: 3 + 6i − 8 + 2i, then collect to get −5 + 8i.
        - |
          −2(−i) is +2i, so the imaginary parts are 6i + 2i = 8i, not 4i.
        - |
          The real part is 3 − 8 = −5; this adds 8 instead of subtracting.
        - |
          Both imaginary contributions are positive (6i and +2i), so the result is +8i.
      answer: 0
    - slug: alg2-u03-w13-q09
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 1
      prompt: |
        What is (2 + 3i)(2 − 3i)?
      options:
        - "4 − 9i²"
        - "−5"
        - "13"
        - "4 + 12i − 9"
      option_explanations:
        - |
          4 − 9i² is a correct intermediate step, but i² = −1 must still be applied to reach 13.
        - |
          −5 comes from treating i² as +1; since i² = −1, −9i² is +9, giving 4 + 9 = 13.
        - |
          Correct. The cross terms −6i and +6i cancel, and 4 − 9i² = 4 + 9 = 13.
        - |
          The cross terms cancel (−6i + 6i = 0), so there is no 12i term.
      answer: 2
    - slug: alg2-u03-w13-q10
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 1
      prompt: |
        What is (3 − i)²?
      options:
        - "9 + i²"
        - "8 − 6i"
        - "10 − 6i"
        - "9 − 6i"
      option_explanations:
        - |
          Squaring a binomial produces a middle term −6i, and i² must be replaced by −1.
        - |
          Correct. 9 − 6i + i² = 9 − 6i − 1 = 8 − 6i.
        - |
          i² is −1, not +1, so the real part is 9 − 1 = 8.
        - |
          The i² term has been dropped; it contributes −1 to the real part.
      answer: 1
    - slug: alg2-u03-w13-q11
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Algebra 2, Unit 3, Lesson 12"
      points: 1
      prompt: |
        Multiplying the complex number 2 + 5i by i gives a point in the complex plane. Which point, and what does the multiplication do geometrically?
      options:
        - "(2, 5): nothing changes"
        - "(5, 2): a reflection across the line through the origin at 45°"
        - "(−5, 2): a quarter turn counterclockwise about the origin"
        - "(−2, −5): a half turn about the origin"
      option_explanations:
        - |
          i(2 + 5i) = 2i + 5i² = −5 + 2i, so the point moves.
        - |
          The result −5 + 2i has a negative real part; a reflection across that line would give 5 + 2i.
        - |
          Correct. i(2 + 5i) = −5 + 2i, the point (−5, 2), which is (2, 5) rotated 90° counterclockwise.
        - |
          A half turn is multiplication by i² = −1, giving −2 − 5i; one factor of i is a quarter turn.
      answer: 2
    - slug: alg2-u03-w13-q12
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Algebra 2, Unit 3, Lesson 6"
      points: 1
      prompt: |
        What are the solutions of (x + 2)² = 9?
      options:
        - "x = 1 only"
        - "x = 1 and x = −5"
        - "x = 7 and x = −11"
        - "x = −1 and x = 5"
      option_explanations:
        - |
          Undoing a square gives two cases; x + 2 = −3 gives the second solution x = −5.
        - |
          Correct. x + 2 = ±3, so x = 1 or x = −5.
        - |
          These come from x + 2 = ±9; the square root of 9 is 3, not 9.
        - |
          These have the signs reversed: x + 2 = 3 gives 1 and x + 2 = −3 gives −5.
      answer: 1
    - slug: alg2-u03-w13-q13
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Algebra 2, Unit 2, Lesson 5"
      points: 1
      prompt: |
        A polynomial has zeros at x = −2, x = 1 and x = 3 and no others. Which could be its factored form?
      options:
        - "(x + 2)(x − 1)(x − 3)"
        - "(x − 2)(x + 1)(x + 3)"
        - "(x + 2)(x + 1)(x + 3)"
        - "x(x + 2)(x − 1)(x − 3)"
      option_explanations:
        - |
          Correct. Each factor is zero at the named input: x + 2 = 0 at −2, x − 1 = 0 at 1, x − 3 = 0 at 3.
        - |
          These factors are zero at 2, −1 and −3, the opposites of the required zeros.
        - |
          These factors are zero at −2, −1 and −3; only the first matches.
        - |
          The extra factor x adds a zero at x = 0, but the polynomial has no other zeros.
      answer: 0
    - slug: alg2-u03-w13-q14
      type: multi_select
      topic_code: "3.11"
      source: "IM Algebra 2, Unit 3, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about i are true? Select all that apply.
      options:
        - "i² = −1"
        - "i⁴ = 1"
        - "i is a real number"
        - "i³ = −i"
        - "(−i)² = 1"
      option_explanations:
        - |
          Correct. This is the defining property of i.
        - |
          Correct. i⁴ = (i²)² = (−1)² = 1, which is why the powers cycle every four.
        - |
          No real number squares to −1, so i is not on the real number line.
        - |
          Correct. i³ = i² · i = −1 · i = −i, the third value in the cycle.
        - |
          (−i)² = (−1)² · i² = 1 · (−1) = −1, not 1; −i is the other square root of −1.
      answer: [0, 1, 3]
    - slug: alg2-u03-w13-q15
      type: multi_select
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 2
      partial_credit: true
      prompt: |
        Which of these products are real numbers? Select all that apply.
      options:
        - "(2 + i)(2 − i)"
        - "(3i)(−3i)"
        - "(1 + i)²"
        - "i⁶"
        - "(1 + i)(1 − 2i)"
      option_explanations:
        - |
          Correct. 4 − i² = 4 + 1 = 5; the cross terms cancel.
        - |
          Correct. (3i)(−3i) = −9i² = 9, a real number, because i² = −1.
        - |
          (1 + i)² = 1 + 2i + i² = 2i, which is imaginary, not real.
        - |
          Correct. i⁶ = i⁴ · i² = 1 · (−1) = −1, a real number.
        - |
          1 − 2i + i − 2i² = 1 − i + 2 = 3 − i, which has a nonzero imaginary part.
      answer: [0, 1, 3]
    - slug: alg2-u03-w13-q16
      type: true_false
      topic_code: "3.12"
      source: "IM Algebra 2, Unit 3, Lesson 12"
      points: 1
      prompt: |
        True or false: the sum of two complex numbers that each have a nonzero imaginary part must also have a nonzero imaginary part.
      answer: false
      explanation: |
        False. A counterexample disproves it: (1 + i) + (1 − i) = 2, whose imaginary part is 0. Adding combines imaginary parts; if they are opposites, such as 1 and −1, the sum is a real number.
    - slug: alg2-u03-w13-q17
      type: true_false
      topic_code: "3.7"
      source: "IM Algebra 2, Unit 3, Lesson 7"
      points: 1
      prompt: |
        True or false: if a = b then a² = b², but a² = b² does not guarantee that a = b.
      answer: true
      explanation: |
        True. Squaring equal numbers gives equal squares, but a² = b² also holds when a = −b, as with 3 and −3. This is why squaring both sides of an equation can introduce extraneous solutions: the squared equation keeps every original solution and may add some with the opposite sign.
    - slug: alg2-u03-w13-q18
      type: fill_blank
      topic_code: "3.11"
      source: "IM Algebra 2, Unit 3, Lesson 11"
      points: 1
      prompt: |
        Simplify: i² = ____
      answer: ["-1", "−1", "- 1", "− 1"]
      explanation: |
        By definition i² = −1; this single fact is what makes the complex numbers work.
    - slug: alg2-u03-w13-q19
      type: fill_blank
      topic_code: "3.8"
      source: "IM Algebra 2, Unit 3, Lesson 8"
      points: 1
      prompt: |
        The only real solution of x³ = −125 is x = ____
      answer: ["-5", "−5", "- 5", "− 5"]
      explanation: |
        (−5)³ = −125 and cubing preserves sign, so −5 is the unique real cube root of −125.
    - slug: alg2-u03-w13-q20
      type: numeric
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 1
      prompt: |
        The product (1 + 2i)(3 + 4i) equals a + bi for real numbers a and b. Give the value of b.
      answer: { value: 10, tolerance: 0 }
      explanation: |
        (1 + 2i)(3 + 4i) = 3 + 4i + 6i + 8i² = 3 + 10i − 8 = −5 + 10i, so b = 10.
    - slug: alg2-u03-w13-q21
      type: numeric
      topic_code: "1.11"
      source: "IM Algebra 2, Unit 1, Lesson 11"
      points: 1
      prompt: |
        An arithmetic sequence starts 7, 11, 15, … Find the sum of its first 20 terms.
      answer: { value: 900, tolerance: 0 }
      explanation: |
        The 20th term is 7 + 4 · 19 = 83. The sum is 20(7 + 83)/2 = 20 · 45 = 900.
    - slug: alg2-u03-w13-q22
      type: numeric
      topic_code: "3.9"
      source: "IM Algebra 2, Unit 3, Lesson 9"
      points: 1
      prompt: |
        Solve √(5x − 1) = 7.
      answer: { value: 10, tolerance: 0 }
      explanation: |
        Square: 5x − 1 = 49, so x = 10. Check: √49 = 7, so the candidate is genuine.
    - slug: alg2-u03-w13-q23
      type: short_answer
      topic_code: "3.5"
      source: "IM Algebra 2, Unit 3, Lesson 5"
      points: 3
      prompt: |
        (a) Evaluate 8^(2/3) and show the step where you take the cube root.
        (b) Evaluate 8^(−2/3) and explain what the negative sign in the exponent does.
        (c) A student claims 8^(−2/3) = −4. Explain the error.
      answer: |
        (a) 8^(2/3) = (∛8)² = 2² = 4.
        (b) 8^(−2/3) = 1/8^(2/3) = 1/4. The negative exponent means take the reciprocal; it does not change the sign of the answer.
        (c) The student treated the negative exponent as a negative sign on the result. A negative exponent produces a reciprocal (1/4), and a positive base raised to any real power is positive.
      explanation: |
        Three points, one per part. (a) must show the cube root giving 2 and the value 4. (b) the value 1/4 with the reciprocal explanation. (c) identifies the sign-versus-reciprocal confusion.
    - slug: alg2-u03-w13-q24
      type: short_answer
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 3
      prompt: |
        (a) Compute (2 + i)².
        (b) Use part (a) to verify that x = 2 + i is a solution of x² − 4x + 5 = 0.
        (c) Without recomputing everything, explain why x = 2 − i should also be a solution, and confirm by substitution.
      answer: |
        (a) (2 + i)² = 4 + 4i + i² = 3 + 4i.
        (b) x² − 4x + 5 = (3 + 4i) − 4(2 + i) + 5 = 3 + 4i − 8 − 4i + 5 = 0.
        (c) Replacing i by −i throughout a calculation with real coefficients just flips the sign of every imaginary part, so the same cancellation happens. Check: (2 − i)² = 3 − 4i; 3 − 4i − 8 + 4i + 5 = 0.
      explanation: |
        Three points, one per part. (a) 3 + 4i with i² = −1 applied. (b) substitution showing both the real and imaginary parts cancel. (c) a sensible reason (symmetry in i, or the pairing of solutions) plus the substitution.
