  - slug: alg2-u03-exam-q46
    type: short_answer
    topic_code: "3.4"
    source: "IM Algebra 2, Unit 3, Lesson 4"
    points: 3
    prompt: |
      (a) Evaluate 81^(3/4), showing the root step.
      (b) Evaluate 81^(−3/4) and explain the effect of the negative sign.
      (c) Write ⁴√(x³) · x as a single power of x.
    answer: |
      (a) ⁴√81 = 3, so 81^(3/4) = 3³ = 27.
      (b) 81^(−3/4) = 1/81^(3/4) = 1/27. The negative exponent takes the reciprocal; it does not make the value negative.
      (c) ⁴√(x³) = x^(3/4), so x^(3/4) · x¹ = x^(3/4 + 1) = x^(7/4).
    explanation: |
      Three points, one per part. (a) the fourth root 3 and the value 27. (b) 1/27 with the reciprocal explanation. (c) x^(7/4) with exponents added.
  - slug: alg2-u03-exam-q47
    type: short_answer
    topic_code: "3.17"
    source: "IM Algebra 2, Unit 3, Lesson 17"
    points: 3
    prompt: |
      (a) Solve x² − 4x + 20 = 0 by completing the square.
      (b) Check one of your solutions by substitution.
      (c) Compute the discriminant and explain how it agrees with your answer to (a).
    answer: |
      (a) (x − 2)² = −20 + 4 = −16, so x − 2 = ±4i and x = 2 ± 4i.
      (b) x = 2 + 4i: x² = 4 + 16i + 16i² = −12 + 16i; −4x = −8 − 16i; so x² − 4x + 20 = −12 + 16i − 8 − 16i + 20 = 0.
      (c) b² − 4ac = 16 − 80 = −64 < 0, which predicts two non-real solutions forming a conjugate pair, exactly what 2 ± 4i are. (Also √(−64) = 8i and 8i/2 = 4i matches the imaginary part.)
    explanation: |
      Three points, one per part. (a) 2 ± 4i via (x − 2)² = −16. (b) a substitution that reaches 0. (c) −64 with the connection to non-real conjugate solutions.
  - slug: alg2-u03-exam-q48
    type: long_answer
    topic_code: "3.9"
    source: "IM Algebra 2, Unit 3, Lesson 9"
    points: 6
    prompt: |
      Write a full response that (1) solves √(2x + 3) = x completely, including the check of every candidate, (2) explains what the rejected candidate is actually a solution of and why squaring produced it, (3) solves x² + 6x + 13 = 0 and writes the solutions in the form a + bi, and (4) shows that the two solutions in part (3) are conjugates, computes their product, and explains what the graph of y = x² + 6x + 13 does at the x-axis.
    answer: |
      (1) Square: 2x + 3 = x², so x² − 2x − 3 = (x − 3)(x + 1) = 0, candidates 3 and −1. Check x = 3: √9 = 3 ✓. Check x = −1: √1 = 1 but the right side is −1 ✗. Solution: x = 3.
      (2) x = −1 satisfies √(2x + 3) = −x, the equation with the opposite sign on the right. Squaring erases the sign difference between x and −x, so both equations become 2x + 3 = x²; the squared equation is not equivalent to the original.
      (3) (x + 3)² = −13 + 9 = −4, so x + 3 = ±2i and x = −3 + 2i or x = −3 − 2i.
      (4) The two solutions share the real part −3 and have opposite imaginary parts ±2, so they are conjugates. Their product is (−3)² + 2² = 9 + 4 = 13, matching the constant term. Since the solutions are non-real, the parabola has no x-intercepts; it opens upward, so it lies entirely above the x-axis (vertex at (−3, 4)).
    explanation: |
      Six points: 2 for part (1) with both checks and the single solution 3 (1 if a check is missing); 1 for the opposite-sign explanation in part (2); 1 for −3 ± 2i; 2 for part (4): conjugates with product 13, and the no-intercept, above-the-axis description.
