unit: 3
description: |
  48 questions · about 90 minutes · every lesson of Unit 3 (3.1 to 3.19): exponent rules, roots and rational
  exponents, solving square, cube and radical equations, equivalence and extraneous solutions, the number i,
  the complex plane, complex arithmetic and conjugates, working backwards, and quadratics with real and
  non-real solutions. Includes three shared-context sets of three questions (an exponential function at
  fractional inputs, a radical equation, and a complex number), select-all, true/false, fill-in-the-blank and
  numeric items, two short-answer questions (3 points each) and one extended response (6 points). Multiple
  choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: f(x) = 81ˣ (3.3, 3.4, 3.5)
  - slug: alg2-u03-exam-q01
    type: multiple_choice
    topic_code: "3.3"
    source: "IM Algebra 2, Unit 3, Lesson 3"
    points: 1
    stimulus: |
      The function f is defined by f(x) = 81ˣ.
    prompt: |
      What is f(1/2)?
    options:
      - "40.5"
      - "9"
      - "3"
      - "81/2"
    option_explanations:
      - |
        81^(1/2) is a square root, not half of 81; halving the base is the wrong operation.
      - |
        Correct. 81^(1/2) = √81 = 9, because (81^(1/2))² must equal 81.
      - |
        3 is 81^(1/4), the fourth root; the square root of 81 is 9.
      - |
        A fractional exponent means a root, not a division of the base.
    answer: 1
  - slug: alg2-u03-exam-q02
    type: multiple_choice
    topic_code: "3.4"
    source: "IM Algebra 2, Unit 3, Lesson 4"
    points: 1
    stimulus: |
      The function f is defined by f(x) = 81ˣ.
    prompt: |
      What is f(3/4)?
    options:
      - "27"
      - "60.75"
      - "9"
      - "243"
    option_explanations:
      - |
        Correct. 81^(3/4) = (⁴√81)³ = 3³ = 27: fourth root first, then cube.
      - |
        60.75 is three-quarters of 81; a rational exponent is a root and a power, not a fraction of the base.
      - |
        9 is 81^(1/2); the exponent 3/4 calls for the fourth root cubed.
      - |
        243 = 3⁵ would need the exponent 5/4, not 3/4.
    answer: 0
  - slug: alg2-u03-exam-q03
    type: multiple_choice
    topic_code: "3.5"
    source: "IM Algebra 2, Unit 3, Lesson 5"
    points: 1
    stimulus: |
      The function f is defined by f(x) = 81ˣ.
    prompt: |
      What is f(−1/4)?
    options:
      - "−3"
      - "1/3"
      - "−1/3"
      - "1/81"
    option_explanations:
      - |
        A negative exponent means reciprocal; a positive base raised to any power is positive.
      - |
        Correct. 81^(−1/4) = 1/81^(1/4) = 1/3, since the fourth root of 81 is 3.
      - |
        The negative sign in the exponent produces a reciprocal, not a negative result.
      - |
        1/81 is 81^(−1); the exponent −1/4 takes the fourth root first.
    answer: 1
  # ---- Stimulus set B: √(x + 10) = x − 2 (3.7, 3.9)
  - slug: alg2-u03-exam-q04
    type: multiple_choice
    topic_code: "3.9"
    source: "IM Algebra 2, Unit 3, Lesson 9"
    points: 1
    stimulus: |
      Consider the equation √(x + 10) = x − 2.
    prompt: |
      Squaring both sides and collecting terms gives which equation?
    options:
      - "x² − 5x − 6 = 0"
      - "x² − 3x − 14 = 0"
      - "x² − 4x − 6 = 0"
      - "x + 10 = x² − 4"
    option_explanations:
      - |
        Correct. x + 10 = x² − 4x + 4 rearranges to x² − 5x − 6 = 0.
      - |
        This adds x + 10 to the right side instead of subtracting it.
      - |
        The x-terms are −4x − x = −5x, not −4x; the x on the left must be moved across.
      - |
        (x − 2)² = x² − 4x + 4; the cross term −4x is missing.
    answer: 0
  - slug: alg2-u03-exam-q05
    type: multiple_choice
    topic_code: "3.7"
    source: "IM Algebra 2, Unit 3, Lesson 7"
    points: 1
    stimulus: |
      Consider the equation √(x + 10) = x − 2.
    prompt: |
      The squared equation factors as (x − 6)(x + 1) = 0. Which statement about the candidate x = −1 is correct?
    options:
      - "It is a solution because −1 + 10 = 9 is a perfect square."
      - "It is extraneous because √9 = 3 while −1 − 2 = −3."
      - "It is extraneous because negative numbers can never solve radical equations."
      - "It is a solution because (−1)² = 1."
    option_explanations:
      - |
        A perfect square under the root does not make the two sides equal; the right side is −3.
      - |
        Correct. The left side is 3 and the right side is −3; x = −1 solves √(x + 10) = −(x − 2) instead.
      - |
        Negative candidates can be genuine (x = −4 solves √(x² + 9) = 5); only substitution decides.
      - |
        Squaring −1 has nothing to do with the check; substitute into the original equation.
    answer: 1
  - slug: alg2-u03-exam-q06
    type: multiple_choice
    topic_code: "3.9"
    source: "IM Algebra 2, Unit 3, Lesson 9"
    points: 1
    stimulus: |
      Consider the equation √(x + 10) = x − 2.
    prompt: |
      What is the solution set?
    options:
      - "{6, −1}"
      - "{6}"
      - "{−1}"
      - "The empty set"
    option_explanations:
      - |
        x = −1 fails the check (3 ≠ −3), so it is not a solution.
      - |
        Correct. √16 = 4 and 6 − 2 = 4, so x = 6 is the only solution.
      - |
        x = −1 is the extraneous candidate; x = 6 is the genuine one.
      - |
        x = 6 satisfies the original equation, so the solution set is not empty.
    answer: 1
  # ---- Stimulus set C: z = 2 + 3i (3.13, 3.14, 3.19)
  - slug: alg2-u03-exam-q07
    type: multiple_choice
    topic_code: "3.13"
    source: "IM Algebra 2, Unit 3, Lesson 13"
    points: 1
    stimulus: |
      Let z = 2 + 3i.
    prompt: |
      What is z²?
    options:
      - "4 + 9i"
      - "13 + 12i"
      - "−5 + 12i"
      - "4 − 9"
    option_explanations:
      - |
        Squaring a binomial has a middle term 2 · 2 · 3i = 12i, and (3i)² = −9, not 9i.
      - |
        (3i)² = 9i² = −9, so the real part is 4 − 9 = −5, not 4 + 9.
      - |
        Correct. 4 + 12i + 9i² = 4 + 12i − 9 = −5 + 12i.
      - |
        The middle term 12i is missing; only the squares of the two parts appear.
    answer: 2
  - slug: alg2-u03-exam-q08
    type: multiple_choice
    topic_code: "3.14"
    source: "IM Algebra 2, Unit 3, Lesson 14"
    points: 1
    stimulus: |
      Let z = 2 + 3i.
    prompt: |
      What is the product of z and its conjugate?
    options:
      - "13"
      - "−5"
      - "4 − 9i²"
      - "4"
    option_explanations:
      - |
        Correct. (2 + 3i)(2 − 3i) = 4 − 9i² = 4 + 9 = 13.
      - |
        −5 comes from treating i² as +1; since i² = −1, −9i² = +9.
      - |
        This is an unfinished step; 4 − 9i² simplifies to 13 once i² = −1 is applied.
      - |
        4 is the square of the real part alone; the imaginary part contributes +9.
    answer: 0
  - slug: alg2-u03-exam-q09
    type: multiple_choice
    topic_code: "3.19"
    source: "IM Algebra 2, Unit 3, Lesson 19"
    points: 1
    stimulus: |
      Let z = 2 + 3i.
    prompt: |
      Which quadratic equation has z and its conjugate as its two solutions?
    options:
      - "x² − 4x + 13 = 0"
      - "x² + 4x + 13 = 0"
      - "x² − 4x − 5 = 0"
      - "x² − 13x + 4 = 0"
    option_explanations:
      - |
        Correct. The solutions have sum 4 and product 13, so the equation is x² − 4x + 13 = 0.
      - |
        The sum of the solutions is +4, so the x-coefficient must be −4.
      - |
        The product is +13, not −5; −5 is the real part of z², which is a different quantity.
      - |
        Sum and product are swapped: the x-coefficient is −(sum) = −4 and the constant is the product 13.
    answer: 0
  # ---- Single items
  - slug: alg2-u03-exam-q10
    type: multiple_choice
    topic_code: "3.1"
    source: "IM Algebra 2, Unit 3, Lesson 1"
    points: 1
    prompt: |
      Simplify (2x³)² · x⁻⁴.
    options:
      - "4x²"
      - "2x²"
      - "4x¹⁰"
      - "4x⁻²"
    option_explanations:
      - |
        Correct. (2x³)² = 4x⁶, and x⁶ · x⁻⁴ = x².
      - |
        The coefficient 2 is squared as well: 2² = 4.
      - |
        Multiplying powers adds exponents: 6 + (−4) = 2, not 6 + 4.
      - |
        6 + (−4) = 2, a positive exponent; the negative exponent is absorbed, not kept.
    answer: 0
  - slug: alg2-u03-exam-q11
    type: multiple_choice
    topic_code: "3.1"
    source: "IM Algebra 2, Unit 3, Lesson 1"
    points: 1
    prompt: |
      Which argument best explains why 5⁰ must equal 1?
    options:
      - "Multiplying 5 by itself zero times gives nothing, and nothing is 1."
      - "5³/5³ = 1, and the quotient rule says 5³/5³ = 5³⁻³ = 5⁰, so 5⁰ = 1."
      - "Any number raised to any power is 1 when the power is small enough."
      - "5⁰ = 0 · 5 = 0, but mathematicians changed it to 1 by convention."
    option_explanations:
      - |
        "Multiplying zero times" does not define a value; the definition comes from keeping the rules consistent.
      - |
        Correct. The quotient rule forces 5⁰ to equal 5³/5³ = 1 if the rule is to keep working.
      - |
        There is no such principle; 5¹ = 5, and only the exponent 0 gives 1.
      - |
        5⁰ is not 0 · 5; the exponent counts factors, it is not a multiplier.
    answer: 1
  - slug: alg2-u03-exam-q12
    type: multiple_choice
    topic_code: "3.2"
    source: "IM Algebra 2, Unit 3, Lesson 2"
    points: 1
    prompt: |
      Which statement about x² = 64 and √64 is correct?
    options:
      - "Both have the two values 8 and −8."
      - "x² = 64 has solutions 8 and −8, while √64 is the single number 8."
      - "x² = 64 has the single solution 8, and √64 = ±8."
      - "Both have the single value 8."
    option_explanations:
      - |
        The radical symbol names only the nonnegative root, so √64 is 8 alone.
      - |
        Correct. Two numbers square to 64, but the symbol √64 means the nonnegative one.
      - |
        This reverses the facts: the equation has two solutions and the radical has one value.
      - |
        (−8)² = 64 too, so the equation has a second solution.
    answer: 1
  - slug: alg2-u03-exam-q13
    type: multiple_choice
    topic_code: "3.2"
    source: "IM Algebra 2, Unit 3, Lesson 2"
    points: 1
    prompt: |
      What is ∛(−216)?
    options:
      - "−6"
      - "6"
      - "Not a real number"
      - "−72"
    option_explanations:
      - |
        Correct. (−6)³ = −216, and every real number has exactly one real cube root.
      - |
        6³ = 216, the wrong sign; cubing preserves sign.
      - |
        Even roots of negatives are not real, but odd roots are: cube roots of negatives exist.
      - |
        −72 is −216 divided by 3, not its cube root.
    answer: 0
  - slug: alg2-u03-exam-q14
    type: multiple_choice
    topic_code: "3.3"
    source: "IM Algebra 2, Unit 3, Lesson 3"
    points: 1
    prompt: |
      What is 32^(1/5)?
    options:
      - "6.4"
      - "2"
      - "16"
      - "√32 / 5"
    option_explanations:
      - |
        6.4 is 32 divided by 5; a unit-fraction exponent means a root.
      - |
        Correct. 2⁵ = 32, so the fifth root of 32 is 2.
      - |
        16 is half of 32; the fifth root is much smaller.
      - |
        32^(1/5) is a fifth root, not a square root divided by 5.
    answer: 1
  - slug: alg2-u03-exam-q15
    type: multiple_choice
    topic_code: "3.3"
    source: "IM Algebra 2, Unit 3, Lesson 3"
    points: 1
    prompt: |
      Which reasoning shows that 25^(1/2) must equal 5 if the exponent rules hold?
    options:
      - "25 ÷ 2 = 12.5, and the square root of 12.5 is about 5."
      - "(25^(1/2))² = 25^(1/2 · 2) = 25¹ = 25, so 25^(1/2) is a number whose square is 25; the nonnegative one is 5."
      - "25^(1/2) = 25 · 1/2 = 12.5, but by convention it is rounded to 5."
      - "Because 5 + 5 = 10 and 10 is close to the base divided by 2."
    option_explanations:
      - |
        Dividing the base by 2 is unrelated to the exponent 1/2.
      - |
        Correct. The power rule forces the square of 25^(1/2) to be 25, so 25^(1/2) = √25 = 5.
      - |
        An exponent is not a multiplier, and there is no rounding in the definition.
      - |
        This is arithmetic coincidence, not a consequence of the exponent rules.
    answer: 1
  - slug: alg2-u03-exam-q16
    type: multiple_choice
    topic_code: "3.4"
    source: "IM Algebra 2, Unit 3, Lesson 4"
    points: 1
    prompt: |
      Evaluate 16^(5/4).
    options:
      - "20"
      - "32"
      - "80"
      - "8"
    option_explanations:
      - |
        20 is 16 times 5/4; a rational exponent is a root and a power.
      - |
        Correct. ⁴√16 = 2, and 2⁵ = 32: root first, then the fifth power.
      - |
        80 is 16 · 5; the exponent 5/4 means fourth root then fifth power.
      - |
        8 = 2³ is 16^(3/4), not 16^(5/4); the numerator 5 calls for the fifth power of 2.
    answer: 1
  - slug: alg2-u03-exam-q17
    type: multiple_choice
    topic_code: "3.4"
    source: "IM Algebra 2, Unit 3, Lesson 4"
    points: 1
    prompt: |
      Which expression equals ∛(x⁵) written with a rational exponent?
    options:
      - "x^(3/5)"
      - "x^(5/3)"
      - "x^(15)"
      - "x^(5 − 3)"
    option_explanations:
      - |
        The root index goes in the denominator: the cube root gives a denominator of 3, so the exponent is 5/3.
      - |
        Correct. ⁿ√(aᵐ) = a^(m/n), so ∛(x⁵) = x^(5/3).
      - |
        A cube root divides the exponent by 3; it does not multiply it.
      - |
        Roots divide exponents; they do not subtract from them.
    answer: 1
  - slug: alg2-u03-exam-q18
    type: multiple_choice
    topic_code: "3.5"
    source: "IM Algebra 2, Unit 3, Lesson 5"
    points: 1
    prompt: |
      Evaluate 8^(−4/3).
    options:
      - "−16"
      - "1/16"
      - "−1/16"
      - "1/6"
    option_explanations:
      - |
        A negative exponent gives a reciprocal, not a negative number.
      - |
        Correct. ∛8 = 2, 2⁴ = 16, and the negative exponent gives 1/16.
      - |
        The result is positive: a positive base to any real power is positive.
      - |
        1/6 would be 1/(8 · 4/3); the exponent is not a multiplier.
    answer: 1
  - slug: alg2-u03-exam-q19
    type: multiple_choice
    topic_code: "3.5"
    source: "IM Algebra 2, Unit 3, Lesson 5"
    points: 1
    prompt: |
      Evaluate (1/27)^(−2/3).
    options:
      - "1/9"
      - "9"
      - "−9"
      - "−1/9"
    option_explanations:
      - |
        The negative exponent flips the fraction first: (1/27)^(−2/3) = 27^(2/3), which is 9, not 1/9.
      - |
        Correct. (1/27)^(−2/3) = 27^(2/3) = (∛27)² = 3² = 9.
      - |
        A negative exponent does not make the answer negative.
      - |
        Both the sign and the reciprocal are wrong here; the value is 27^(2/3) = 9.
    answer: 1
  - slug: alg2-u03-exam-q20
    type: multiple_choice
    topic_code: "3.6"
    source: "IM Algebra 2, Unit 3, Lesson 6"
    points: 1
    prompt: |
      Solve 2(x + 3)² = 50.
    options:
      - "x = 2 only"
      - "x = 2 and x = −8"
      - "x = 4 and x = −10"
      - "x = 22 and x = −28"
    option_explanations:
      - |
        Undoing a square gives ±: x + 3 = −5 gives the second solution x = −8.
      - |
        Correct. (x + 3)² = 25, so x + 3 = ±5 and x = 2 or x = −8.
      - |
        These come from x + 3 = ±7, but 25 has square roots ±5.
      - |
        These come from x + 3 = ±25; the square root of 25 is 5, not 25.
    answer: 1
  - slug: alg2-u03-exam-q21
    type: multiple_choice
    topic_code: "3.6"
    source: "IM Algebra 2, Unit 3, Lesson 6"
    points: 1
    prompt: |
      How many solutions does √(x − 1) = −3 have?
    options:
      - "Two: x = 10 and x = −8"
      - "One: x = 10"
      - "None"
      - "One: x = −8"
    option_explanations:
      - |
        Squaring produces the single candidate x = 10, and it fails the check, so there are no solutions.
      - |
        At x = 10 the left side is √9 = 3, not −3; the candidate is extraneous.
      - |
        Correct. A square root is never negative, so no value of x makes the left side −3.
      - |
        x = −8 makes the radicand negative, and in any case a square root cannot be −3.
    answer: 2
  - slug: alg2-u03-exam-q22
    type: multiple_choice
    topic_code: "3.7"
    source: "IM Algebra 2, Unit 3, Lesson 7"
    points: 1
    prompt: |
      Which operation on both sides of an equation always produces an equivalent equation?
    options:
      - "Squaring both sides"
      - "Cubing both sides"
      - "Multiplying both sides by x"
      - "Taking the square root of both sides"
    option_explanations:
      - |
        Squaring can add solutions: x = 3 becomes x² = 9, which also has −3.
      - |
        Correct. Different numbers have different cubes, so a³ = b³ exactly when a = b; no solutions are gained or lost.
      - |
        Multiplying by x can add the solution x = 0: x = 5 becomes x² = 5x, which 0 also satisfies.
      - |
        Taking the nonnegative square root of both sides can lose solutions, since x² = 9 has x = −3 as well.
    answer: 1
  - slug: alg2-u03-exam-q23
    type: multiple_choice
    topic_code: "3.8"
    source: "IM Algebra 2, Unit 3, Lesson 8"
    points: 1
    prompt: |
      Solve ∛(4x + 1) = −3.
    options:
      - "x = −7"
      - "x = 7"
      - "No solution, because a cube root cannot be negative"
      - "x = −2"
    option_explanations:
      - |
        Correct. Cube both sides: 4x + 1 = −27, so x = −7, and ∛(−27) = −3 confirms it.
      - |
        4(7) + 1 = 29, and ∛29 is positive, not −3.
      - |
        Cube roots of negatives are real; ∛(−27) = −3, so there is a solution.
      - |
        4(−2) + 1 = −7, and ∛(−7) ≈ −1.9, not −3.
    answer: 0
  - slug: alg2-u03-exam-q24
    type: multiple_choice
    topic_code: "3.10"
    source: "IM Algebra 2, Unit 3, Lesson 10"
    points: 1
    prompt: |
      What is the smallest number system that contains a solution of x² = 5?
    options:
      - "The integers"
      - "The rational numbers"
      - "The real numbers"
      - "The complex numbers, because 5 is not a perfect square"
    option_explanations:
      - |
        No integer squares to 5, since 2² = 4 and 3² = 9 bracket it.
      - |
        √5 is irrational, so no fraction squares to 5.
      - |
        Correct. √5 and −√5 are real (irrational) numbers; this is the gap irrational numbers filled.
      - |
        Complex numbers are needed only when the square is negative; 5 is positive.
    answer: 2
  - slug: alg2-u03-exam-q25
    type: multiple_choice
    topic_code: "3.11"
    source: "IM Algebra 2, Unit 3, Lesson 11"
    points: 1
    prompt: |
      What is i⁹?
    options:
      - "i"
      - "−1"
      - "−i"
      - "1"
    option_explanations:
      - |
        Correct. 9 = 2 · 4 + 1, so i⁹ = (i⁴)² · i = 1 · i = i.
      - |
        −1 is i² or i⁶; 9 leaves remainder 1, not 2, on division by 4.
      - |
        −i is i³ or i⁷; the remainder here is 1.
      - |
        1 is i⁸, a multiple-of-4 power; one more factor of i gives i⁹ = i.
    answer: 0
  - slug: alg2-u03-exam-q26
    type: multiple_choice
    topic_code: "3.11"
    source: "IM Algebra 2, Unit 3, Lesson 11"
    points: 1
    prompt: |
      Which expression equals √(−75)?
    options:
      - "−5√3"
      - "5i√3"
      - "25i√3"
      - "−75i"
    option_explanations:
      - |
        The negative under the root becomes a factor of i, not a minus sign: (−5√3)² = 75, not −75.
      - |
        Correct. √(−75) = i√75 = i√(25 · 3) = 5i√3.
      - |
        √25 = 5, not 25; the factor pulled out of the root is 5.
      - |
        (−75i)² = 5625i² = −5625; the square root of 75 must be taken.
    answer: 1
  - slug: alg2-u03-exam-q27
    type: multiple_choice
    topic_code: "3.12"
    source: "IM Algebra 2, Unit 3, Lesson 12"
    points: 1
    prompt: |
      Simplify (6 − 2i) − 2(1 + 3i).
    options:
      - "4 − 8i"
      - "4 + 4i"
      - "8 − 8i"
      - "4 − 5i"
    option_explanations:
      - |
        Correct. Distribute the −2: 6 − 2i − 2 − 6i, which collects to 4 − 8i.
      - |
        −2(3i) = −6i, so the imaginary parts combine to −2i − 6i = −8i, not +4i.
      - |
        The real parts are 6 − 2 = 4, not 6 + 2.
      - |
        The 2 must be distributed to 3i as well, giving −6i, so the imaginary part is −8.
    answer: 0
  - slug: alg2-u03-exam-q28
    type: multiple_choice
    topic_code: "3.12"
    source: "IM Algebra 2, Unit 3, Lesson 12"
    points: 1
    prompt: |
      Which complex number is plotted at the point (−3, 4) in the complex plane, and where does multiplying it by i send it?
    options:
      - "−3 + 4i; to (−4, −3)"
      - "4 − 3i; to (3, 4)"
      - "−3 + 4i; to (3, −4)"
      - "−3i + 4; to (4, 3)"
    option_explanations:
      - |
        Correct. The horizontal coordinate is the real part, so the number is −3 + 4i, and i(−3 + 4i) = −3i + 4i² = −4 − 3i, at (−4, −3): a quarter turn counterclockwise.
      - |
        The real part is the horizontal coordinate −3, so the number is −3 + 4i, not 4 − 3i.
      - |
        (3, −4) is the opposite point, which is multiplication by −1 (a half turn), not by i.
      - |
        −3i + 4 is 4 − 3i, which sits at (4, −3), not (−3, 4).
    answer: 0
  - slug: alg2-u03-exam-q29
    type: multiple_choice
    topic_code: "3.13"
    source: "IM Algebra 2, Unit 3, Lesson 13"
    points: 1
    prompt: |
      What is (3 + i)(1 − 2i)?
    options:
      - "3 − 2i"
      - "5 − 5i"
      - "1 − 5i"
      - "3 − 5i − 2i²"
    option_explanations:
      - |
        3 − 2i multiplies only the first and last terms; the cross terms and the i² term are missing.
      - |
        Correct. 3 − 6i + i − 2i² = 3 − 5i + 2 = 5 − 5i.
      - |
        −2i² = +2, so the real part is 3 + 2 = 5, not 3 − 2.
      - |
        This is a correct intermediate step, but i² must be replaced by −1 to finish: 5 − 5i.
    answer: 1
  - slug: alg2-u03-exam-q30
    type: multiple_choice
    topic_code: "3.14"
    source: "IM Algebra 2, Unit 3, Lesson 14"
    points: 1
    prompt: |
      Write (2 + 6i)/(1 + i) in the form a + bi.
    options:
      - "2 + 6i"
      - "4 + 2i"
      - "−2 + 4i"
      - "4 − 2i"
    option_explanations:
      - |
        Dividing by 1 + i changes the number; check by multiplying: (1 + i)(2 + 6i) = −4 + 8i, not 2 + 6i.
      - |
        Correct. (2 + 6i)(1 − i)/2 = (2 − 2i + 6i − 6i²)/2 = (8 + 4i)/2 = 4 + 2i, and (1 + i)(4 + 2i) = 2 + 6i.
      - |
        (1 + i)(−2 + 4i) = −2 + 4i − 2i + 4i² = −6 + 2i, not 2 + 6i.
      - |
        (1 + i)(4 − 2i) = 4 − 2i + 4i − 2i² = 6 + 2i, not 2 + 6i.
    answer: 1
  - slug: alg2-u03-exam-q31
    type: multiple_choice
    topic_code: "3.15"
    source: "IM Algebra 2, Unit 3, Lesson 15"
