      - "x = 2 and x = 10"
      - "x = −4 and x = −5"
      - "x = −6 ± 4i"
    option_explanations:
      - |
        Correct. (x + 2)(x + 10) = 0, so x = −2 or x = −10; equivalently (x + 6)² = 16.
