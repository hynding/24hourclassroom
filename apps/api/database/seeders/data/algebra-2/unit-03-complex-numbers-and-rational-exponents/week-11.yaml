week: 11
unit: 3
title: "Exponents, Roots and Rational Exponents"
topics: ["3.1", "3.2", "3.3", "3.4", "3.5"]
guide: guides/week-11.md
guide_description: |
  The exponent rules and why zero and negative exponents are defined the way they are; square roots and cube
  roots, including why √49 is one number while x² = 49 has two solutions and why negative numbers have cube
  roots; unit-fraction exponents a^(1/n) = ⁿ√a as the only definition consistent with the power rule; positive
  rational exponents a^(m/n) = (ⁿ√a)ᵐ; and negative rational exponents as reciprocals. Worked examples:
  simplifying with mixed exponents, evaluating 27^(4/3), 16^(−3/4) and f(x) = 64ˣ at fractional inputs.
flashcards_description: |
  28 cards on the exponent rules, roots, unit-fraction and rational exponents, negative exponents and the
  classic errors.

flashcards:
  - front: Product rule for exponents → statement and reason
    back: |
      aᵐ · aⁿ = aᵐ⁺ⁿ, because multiplying m copies of a by n copies of a gives m + n copies. x⁵ · x⁻² = x³.
    topic_code: "3.1"
  - front: Quotient rule for exponents → statement
    back: |
      aᵐ / aⁿ = aᵐ⁻ⁿ (a ≠ 0): common factors cancel. 2¹⁰/2⁷ = 2³ = 8.
    topic_code: "3.1"
  - front: Power rule for exponents → statement
    back: |
      (aᵐ)ⁿ = aᵐⁿ, n groups of m factors. (2³)⁴ = 2¹² = 4096. This rule is what forces the meaning of fractional exponents.
    topic_code: "3.1"
  - front: Why a⁰ must equal 1 → reason
    back: |
      aⁿ/aⁿ = 1, and the quotient rule says it is also aⁿ⁻ⁿ = a⁰. For the rule to stay consistent, a⁰ = 1 (for a ≠ 0).
    topic_code: "3.1"
  - front: Why a⁻ⁿ must equal 1/aⁿ → reason
    back: |
      a⁰/aⁿ is 1/aⁿ, and by the quotient rule it is also a⁰⁻ⁿ = a⁻ⁿ. So a negative exponent means reciprocal: 5⁻² = 1/25.
    topic_code: "3.1"
  - front: Simplify (x³y)² · x⁻⁴ / y → steps
    back: |
      (x³y)² = x⁶y²; times x⁻⁴ gives x²y²; dividing by y gives x²y.
    topic_code: "3.1"
  - front: Rewrite 1/(4x⁻³) without negative exponents → result
    back: |
      A factor x⁻³ in the denominator moves to the numerator as x³: x³/4.
    topic_code: "3.1"
  - front: √a → definition
    back: |
      For a ≥ 0, the nonnegative number whose square is a. √49 = 7, never −7. √(−4) is not a real number.
    topic_code: "3.2"
  - front: Solve x² = 49 versus evaluate √49 → the difference
    back: |
      The equation has two solutions, x = 7 and x = −7, because both square to 49. The expression √49 is the single nonnegative value 7.
    topic_code: "3.2"
  - front: ∛a → definition and sign behaviour
    back: |
      The number whose cube is a. Every real number has exactly one real cube root, and negatives are allowed: ∛(−125) = −5 because (−5)³ = −125.
    topic_code: "3.2"
  - front: Solutions of x³ = −27 → how many and what
    back: |
      Exactly one real solution, x = −3. Cubing preserves sign, so there is no second solution the way there is for x² = 9.
    topic_code: "3.2"
  - front: Estimating √50 and ∛50 → method
    back: |
      Bracket with perfect powers: 7² = 49 < 50 < 64 = 8², so √50 ≈ 7.07; 3³ = 27 < 50 < 64 = 4³, so ∛50 ≈ 3.68.
    topic_code: "3.2"
  - front: Why 9^(1/2) must equal √9 → reason
    back: |
      By the power rule (9^(1/2))² = 9^(1/2 · 2) = 9¹ = 9, so 9^(1/2) is a number whose square is 9; we take the nonnegative one, 3.
    topic_code: "3.3"
  - front: a^(1/n) → meaning
    back: |
      The nth root ⁿ√a. 16^(1/2) = 4, 64^(1/3) = 4, 32^(1/5) = 2, 81^(1/4) = 3, (−27)^(1/3) = −3.
    topic_code: "3.3"
  - front: 0.25^(1/2) and 1000^(1/3) → evaluate
    back: |
      0.5 (since 0.5² = 0.25) and 10 (since 10³ = 1000).
    topic_code: "3.3"
  - front: a^(m/n) → two equivalent meanings
    back: |
      (ⁿ√a)ᵐ or ⁿ√(aᵐ): root then power, or power then root. 8^(2/3) = (∛8)² = 4 = ∛64. Taking the root first keeps numbers small.
    topic_code: "3.4"
  - front: 27^(4/3) → evaluate
    back: |
      (∛27)⁴ = 3⁴ = 81.
    topic_code: "3.4"
  - front: 16^(3/4) and 32^(3/5) → evaluate
    back: |
      (⁴√16)³ = 2³ = 8, and (⁵√32)³ = 2³ = 8.
    topic_code: "3.4"
  - front: Radical to rational exponent → the rule
    back: |
      The root index becomes the denominator and the power the numerator: √(x⁵) = x^(5/2), ∛(y²) = y^(2/3), ⁵√(x²) = x^(2/5).
    topic_code: "3.4"
  - front: (√x)³ · ∛x as one power → compute
    back: |
      x^(3/2) · x^(1/3) = x^(3/2 + 1/3) = x^(11/6).
    topic_code: "3.4"
  - front: a^(−m/n) → meaning
    back: |
      The reciprocal of a^(m/n): 8^(−2/3) = 1/8^(2/3) = 1/4; 16^(−3/4) = 1/8; 81^(−3/4) = 1/27.
    topic_code: "3.5"
  - front: 4^(−1/2) → value and the trap
    back: |
      1/√4 = 1/2. It is not −2: the minus sign in the exponent means reciprocal, not negative.
    topic_code: "3.5"
  - front: Negative exponent on a fraction → what happens
    back: |
      The fraction flips: (1/9)^(−1/2) = 9^(1/2) = 3, and (1/16)^(−3/4) = 16^(3/4) = 8.
    topic_code: "3.5"
  - front: f(x) = 64ˣ at x = 1/2, 2/3, −1/2 → values
    back: |
      f(1/2) = √64 = 8; f(2/3) = (∛64)² = 16; f(−1/2) = 1/√64 = 1/8.
    topic_code: "3.5"
  - front: 1/⁵√(x³) with a rational exponent → write it
    back: |
      x^(−3/5): the root gives the denominator 5, the power the numerator 3, and the reciprocal the minus sign.
    topic_code: "3.5"
  - front: Error-spot → "2³ · 3² = 6⁵"
    back: |
      The product rule needs the same base. 2³ · 3² = 8 · 9 = 72. Only like bases add their exponents.
    topic_code: "3.1"
  - front: Error-spot → "√(−16) = −4"
    back: |
      No real number squares to −16, so √(−16) is not a real number. (−4)² = +16. Only odd roots of negatives are real: ∛(−64) = −4.
    topic_code: "3.2"
  - front: Which rule defines each new exponent → the principle
    back: |
      Each extension (zero, negative, unit fraction, rational) is defined so the old rules keep holding: a⁰ from the quotient rule, a^(1/n) from the power rule, a^(m/n) from both.
    topic_code: "3.3"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 3.1 to 3.5: exponent rules, square and cube
    roots, unit-fraction, rational and negative exponents), with about a third reviewing Units 1 and 2.
    Includes a shared-context set on the function f(x) = 64ˣ. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: f(x) = 64ˣ (3.3, 3.4, 3.5)
    - slug: alg2-u03-w11-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Algebra 2, Unit 3, Lesson 3"
      points: 1
      stimulus: |
        Let f(x) = 64ˣ.
      prompt: |
        What is f(1/2)?
      options:
        - "32"
        - "8"
        - "4"
        - "1/8"
      option_explanations:
        - |
          32 is half of 64; an exponent of 1/2 means square root, not halving.
        - |
          Correct. 64^(1/2) = √64 = 8, because 8² = 64.
        - |
          4 is the cube root of 64, which is 64^(1/3).
        - |
          1/8 is 64^(−1/2); the exponent here is positive.
      answer: 1
    - slug: alg2-u03-w11-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      stimulus: |
        Let f(x) = 64ˣ.
      prompt: |
        What is f(2/3)?
      options:
        - "16"
        - "42.67"
        - "4"
        - "8"
      option_explanations:
        - |
          Correct. 64^(2/3) = (∛64)² = 4² = 16: cube root first, then square.
        - |
          42.67 is 64 · 2/3; a fractional exponent is a root and a power, not a multiplication.
        - |
          4 is 64^(1/3); the numerator 2 means that root must then be squared.
        - |
          8 is 64^(1/2), which is a different exponent.
      answer: 0
    - slug: alg2-u03-w11-q03
      type: numeric
      topic_code: "3.5"
      source: "IM Algebra 2, Unit 3, Lesson 5"
      points: 1
      stimulus: |
        Let f(x) = 64ˣ.
      prompt: |
        What is f(−1/2)? Give your answer as a decimal to three places.
      answer: { value: 0.125, tolerance: 0.001 }
      explanation: |
        64^(−1/2) = 1/64^(1/2) = 1/8 = 0.125. The negative exponent means reciprocal, not a negative answer.
    - slug: alg2-u03-w11-q04
      type: multiple_choice
      topic_code: "3.1"
      source: "IM Algebra 2, Unit 3, Lesson 1"
      points: 1
      prompt: |
        Which expression equals (x²y⁻³)² · x⁻¹ written without negative exponents?
      options:
        - "x³/y⁶"
        - "x⁵/y⁶"
        - "x³y⁶"
        - "x⁴/y⁵"
      option_explanations:
        - |
          Correct. (x²y⁻³)² = x⁴y⁻⁶; times x⁻¹ gives x³y⁻⁶ = x³/y⁶.
        - |
          The x⁻¹ factor lowers the power of x from 4 to 3, not raises it to 5.
        - |
          y⁻⁶ belongs in the denominator, not the numerator.
        - |
          The power rule doubles both exponents: y⁻³ becomes y⁻⁶, and x² becomes x⁴ before the x⁻¹ is applied.
      answer: 0
    - slug: alg2-u03-w11-q05
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Algebra 2, Unit 2, Lesson 9"
      points: 1
      prompt: |
        What is the end behaviour of y = −x⁴ + 6x² − 1?
      options:
        - "Both ends go down."
        - "Both ends go up."
        - "Left end up, right end down."
        - "Left end down, right end up."
      option_explanations:
        - |
          Correct. The leading term −x⁴ has even degree and a negative coefficient.
        - |
          Both ends up needs a positive leading coefficient.
        - |
          Opposite ends need odd degree; the degree here is 4.
        - |
          Opposite ends need odd degree; the degree here is 4.
      answer: 0
    - slug: alg2-u03-w11-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Algebra 2, Unit 3, Lesson 2"
      points: 1
      prompt: |
        Which statement is correct?
      options:
        - "√49 = ±7 and the equation x² = 49 has the single solution 7."
        - "√49 = 7 and the equation x² = 49 has two solutions, 7 and −7."
        - "√49 = 7 and the equation x² = 49 has the single solution 7."
        - "√49 = ±7 and the equation x² = 49 has two solutions, 7 and −7."
      option_explanations:
        - |
          Both parts are reversed: the symbol gives one value and the equation has two solutions.
        - |
          Correct. The radical symbol means the nonnegative root, while both 7 and −7 square to 49.
        - |
          (−7)² = 49 as well, so the equation has two solutions.
        - |
          The symbol √49 denotes one number, 7, not two.
      answer: 1
    - slug: alg2-u03-w11-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Algebra 2, Unit 3, Lesson 2"
      points: 1
      prompt: |
        What is ∛(−125)?
      options:
        - "−5"
        - "5"
        - "±5"
        - "Not a real number"
      option_explanations:
        - |
          Correct. (−5)³ = −125, and every real number has exactly one real cube root.
        - |
          5³ = +125, not −125, so 5 is the cube root of 125 rather than of −125.
        - |
          Cube roots are unique; only one real number cubes to −125.
        - |
          Even roots of negatives are not real, but odd roots are: cubing a negative gives a negative.
      answer: 0
    - slug: alg2-u03-w11-q08
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Algebra 2, Unit 3, Lesson 3"
      points: 1
      prompt: |
        Which argument best explains why 9^(1/2) should equal 3?
      options:
        - "Because 9 ÷ 2 = 4.5, which rounds to 3 after taking the root."
        - "Because the power rule gives (9^(1/2))² = 9¹ = 9, so 9^(1/2) must be a number whose square is 9."
        - "Because 9^(1/2) means 9 multiplied by itself half a time."
        - "Because a calculator says so."
      option_explanations:
        - |
          Dividing the base by 2 has nothing to do with a fractional exponent.
        - |
          Correct. Keeping the power rule consistent forces 9^(1/2) to be a square root of 9; the nonnegative one is chosen.
        - |
          "Half a multiplication" has no meaning; the definition comes from the rules, not from counting factors.
        - |
          A calculator follows the definition; the reason is the consistency of the exponent rules.
      answer: 1
    - slug: alg2-u03-w11-q09
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      prompt: |
        What is 27^(4/3)?
      options:
        - "36"
        - "81"
        - "9"
        - "12"
      option_explanations:
        - |
          36 is 27 · 4/3; a rational exponent is a root and a power.
        - |
          Correct. (∛27)⁴ = 3⁴ = 81: the cube root of 27 is 3, raised to the fourth power.
        - |
          9 is 27^(2/3) = 3², which uses the exponent 2/3 instead of 4/3.
        - |
          12 is 3 · 4, a multiplication; the exponent calls for 3 raised to the fourth power.
      answer: 1
    - slug: alg2-u03-w11-q10
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Algebra 2, Unit 3, Lesson 5"
      points: 1
      prompt: |
        What is 16^(−3/4)?
      options:
        - "−8"
        - "1/8"
        - "−12"
        - "8"
      option_explanations:
        - |
          A negative exponent gives a reciprocal, never a negative value for a positive base.
        - |
          Correct. 16^(3/4) = (⁴√16)³ = 2³ = 8, so 16^(−3/4) = 1/8.
        - |
          −12 is 16 · (−3/4), a multiplication rather than a power.
        - |
          8 is 16^(3/4); the negative sign in the exponent flips it to 1/8.
      answer: 1
    - slug: alg2-u03-w11-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      prompt: |
        Which expression is equivalent to ⁵√(x²)?
      options:
        - "x^(5/2)"
        - "x^(2/5)"
        - "x^(10)"
        - "x^(2) − x^(5)"
      option_explanations:
        - |
          The root index 5 goes in the denominator, not the numerator.
        - |
          Correct. The fifth root of x squared is x^(2/5): power on top, root index below.
        - |
          Multiplying 2 and 5 is not how roots and powers combine.
        - |
          Roots are not differences of powers; a radical always converts to a single rational exponent.
      answer: 1
    - slug: alg2-u03-w11-q12
      type: multiple_choice
      topic_code: "2.18"
      source: "IM Algebra 2, Unit 2, Lesson 18"
      points: 1
      prompt: |
        What is the horizontal asymptote of y = (3x + 1)/(x − 4)?
      options:
        - "y = 3"
        - "y = 0"
        - "y = −1/4"
        - "y = 4"
      option_explanations:
        - |
          Correct. Equal degrees: the ratio of leading coefficients is 3/1.
        - |
          y = 0 requires the numerator's degree to be smaller.
        - |
          −1/4 is the vertical intercept, not an asymptote.
        - |
          x = 4 is the vertical asymptote, not a horizontal one.
      answer: 0
    - slug: alg2-u03-w11-q13
      type: multiple_choice
      topic_code: "1.10"
      source: "IM Algebra 2, Unit 1, Lesson 10"
      points: 1
      prompt: |
        A town's population of 12,000 shrinks by 3% each year. Which equation models the population P(n) after n years?
      options:
        - "P(n) = 12000 − 360n"
        - "P(n) = 12000 · 0.97ⁿ"
        - "P(n) = 12000 · 0.03ⁿ"
        - "P(n) = 12000 · 1.03ⁿ"
      option_explanations:
        - |
          A 3% loss of the current population is not a constant 360 people.
        - |
          Correct. Losing 3% means keeping 97%, a constant factor each year.
        - |
          Multiplying by 0.03 keeps only 3% of the people each year.
        - |
          1.03 would be 3% growth, but the town is shrinking.
      answer: 1
    - slug: alg2-u03-w11-q14
      type: multi_select
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following expressions equal 4? Select all that apply.
      options:
        - "16^(1/2)"
        - "8^(2/3)"
        - "64^(1/3)"
        - "2^(−2)"
        - "32^(2/5)"
      option_explanations:
        - |
          Correct. 16^(1/2) is the square root of 16, which is 4.
        - |
          Correct. (∛8)² = 2² = 4: cube root of 8 is 2, then square it.
        - |
          Correct. 64^(1/3) is the cube root of 64, which is 4 because 4³ = 64.
        - |
          2^(−2) = 1/2² = 1/4, the reciprocal of 4, not 4 itself.
        - |
          Correct. (⁵√32)² = 2² = 4: the fifth root of 32 is 2, then square it.
      answer: [0, 1, 2, 4]
    - slug: alg2-u03-w11-q15
      type: multi_select
      topic_code: "3.2"
      source: "IM Algebra 2, Unit 3, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are true? Select all that apply.
      options:
        - "√36 = 6"
        - "√36 = ±6"
        - "The equation x² = 36 has two real solutions."
        - "∛(−8) = −2"
        - "√(−4) is a real number."
      option_explanations:
        - |
          Correct. The radical symbol denotes the nonnegative square root.
        - |
          The symbol gives one value; ±6 describes the solutions of x² = 36, not √36.
        - |
          Correct. Both 6 and −6 square to 36, so the equation has two solutions.
        - |
          Correct. (−2)³ = −8, and cube roots of negatives are real.
        - |
          No real number squares to a negative, so √(−4) is not real.
      answer: [0, 2, 3]
    - slug: alg2-u03-w11-q16
      type: true_false
      topic_code: "3.5"
      source: "IM Algebra 2, Unit 3, Lesson 5"
      points: 1
      prompt: |
        True or false: 4^(−1/2) = −2.
      answer: false
      explanation: |
        False. A negative exponent means reciprocal: 4^(−1/2) = 1/4^(1/2) = 1/√4 = 1/2. A positive base raised to any real exponent is positive.
    - slug: alg2-u03-w11-q17
      type: true_false
      topic_code: "2.22"
      source: "IM Algebra 2, Unit 2, Lesson 22"
      points: 1
      prompt: |
        True or false: When solving a rational equation, a candidate solution that makes an original denominator zero must be rejected as extraneous.
      answer: true
      explanation: |
        True. The original equation is undefined at such a value, so it cannot be a solution; it appeared only because clearing denominators multiplied by an expression that is zero there.
    - slug: alg2-u03-w11-q18
      type: fill_blank
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      prompt: |
        The value of 125^(2/3) is ____.
      answer: ["25"]
      explanation: |
        (∛125)² = 5² = 25. Taking the cube root first keeps the arithmetic small; 125² = 15,625 and ∛15,625 = 25 agrees.
    - slug: alg2-u03-w11-q19
      type: fill_blank
      topic_code: "2.6"
      source: "IM Algebra 2, Unit 2, Lesson 6"
      points: 1
      prompt: |
        The vertical intercept (value at x = 0) of y = (x − 2)(x + 5) is ____.
      answer: ["-10", "−10"]
      explanation: |
        Substitute x = 0: (−2)(5) = −10.
    - slug: alg2-u03-w11-q20
      type: numeric
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        A geometric sequence has a(1) = 5 and common ratio 2. What is a(9)? Give the exact value.
      answer: { value: 1280, tolerance: 0 }
      explanation: |
        a(9) = 5 · 2⁸ = 5 · 256 = 1280.
    - slug: alg2-u03-w11-q21
      type: numeric
      topic_code: "3.5"
      source: "IM Algebra 2, Unit 3, Lesson 5"
      points: 1
      prompt: |
        Evaluate 81^(−3/4). Give your answer as a decimal to three places.
      answer: { value: 0.037, tolerance: 0.001 }
      explanation: |
        81^(3/4) = (⁴√81)³ = 3³ = 27, so 81^(−3/4) = 1/27 ≈ 0.037.
    - slug: alg2-u03-w11-q22
      type: numeric
      topic_code: "2.25"
      source: "IM Algebra 2, Unit 2, Lesson 25"
      points: 1
      prompt: |
        What is 1 + 3 + 9 + … + 3⁶? Give the exact value.
      answer: { value: 1093, tolerance: 0 }
      explanation: |
        Seven terms with a = 1 and r = 3: (3⁷ − 1)/(3 − 1) = 2186/2 = 1093.
    - slug: alg2-u03-w11-q23
      type: short_answer
      topic_code: "3.3"
      source: "IM Algebra 2, Unit 3, Lesson 3"
      points: 3
      prompt: |
        (a) Using the power rule (aᵐ)ⁿ = aᵐⁿ, explain why 8^(1/3) must equal 2.
        (b) Evaluate 8^(2/3) in two different orders (root first, power first) and show that both give the same value.
        (c) Evaluate 8^(−1/3) and explain what the negative sign does.
      answer: |
        (a) (8^(1/3))³ = 8^(1/3 · 3) = 8¹ = 8, so 8^(1/3) is a number whose cube is 8, which is 2.
        (b) Root first: (∛8)² = 2² = 4. Power first: ∛(8²) = ∛64 = 4. Same value.
        (c) 8^(−1/3) = 1/8^(1/3) = 1/2. The negative exponent means take the reciprocal; it does not make the answer negative.
      explanation: |
        Three points, one per part. (a) must use the power rule explicitly. (b) both orders shown with the value 4. (c) the value 1/2 and the reciprocal meaning.
    - slug: alg2-u03-w11-q24
      type: short_answer
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 3
      prompt: |
        (a) Write √(x⁵) and ∛(y²) using rational exponents.
        (b) Evaluate 32^(3/5), showing the root and the power.
        (c) Write (√x)³ · ∛x as a single power of x.
      answer: |
        (a) x^(5/2) and y^(2/3).
        (b) ⁵√32 = 2, then 2³ = 8.
