    - slug: alg2-u03-w11-q25
      type: long_answer
      topic_code: "3.5"
      source: "IM Algebra 2, Unit 3, Lesson 5"
      points: 6
      prompt: |
        Write a full response that (1) explains why a⁰ must be 1 and a⁻ⁿ must be 1/aⁿ if the quotient rule aᵐ/aⁿ = aᵐ⁻ⁿ is to hold for every m and n, (2) explains why a^(1/n) must be ⁿ√a if the power rule is to hold, (3) uses these ideas to evaluate 16^(3/4), 16^(−3/4) and (1/16)^(−3/4), showing each step, and (4) describes one common mistake with negative or fractional exponents and how to avoid it.
      answer: |
        (1) aⁿ/aⁿ = 1 by cancelling, and the quotient rule makes it a⁰, so a⁰ = 1. Then a⁰/aⁿ = 1/aⁿ, and the rule makes it a⁰⁻ⁿ = a⁻ⁿ, so a⁻ⁿ = 1/aⁿ.
        (2) (a^(1/n))ⁿ = a^(n/n) = a¹ by the power rule, so a^(1/n) is a number whose nth power is a, that is, an nth root; for even n we take the nonnegative one.
        (3) 16^(3/4) = (⁴√16)³ = 2³ = 8. 16^(−3/4) = 1/16^(3/4) = 1/8. (1/16)^(−3/4) = 16^(3/4) = 8, because a negative exponent flips the fraction.
        (4) Reading a negative exponent as a negative answer, for example 4^(−1/2) = −2 instead of 1/2. Avoid it by rewriting a^(−k) as 1/aᵏ first, then evaluating. (Another: writing √49 = ±7; the radical symbol is the nonnegative root.)
      explanation: |
        Six points: 2 for the two quotient-rule arguments; 1 for the power-rule argument; 2 for the three values 8, 1/8, 8 with steps; 1 for a genuine mistake with a remedy.
