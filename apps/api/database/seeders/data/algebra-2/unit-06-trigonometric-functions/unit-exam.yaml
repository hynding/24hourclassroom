  - slug: alg2-u06-exam-q45
    type: long_answer
    topic_code: "6.19"
    source: "IM Algebra 2, Unit 6, Lesson 19"
    points: 6
    prompt: |
      At a harbour, high tide is 7.0 m at 4:00 and the following low tide is 3.0 m at 10:12, 6.2 hours later; the pattern repeats steadily. A boat needs at least 4.5 m of water to use the channel. Let t be hours after midnight. Write a full response that (1) builds a cosine model h(t) for the water depth, explaining each number, (2) finds the time of the next high tide and the depth at noon, (3) finds, to the nearest minute, the time after 4:00 at which the depth first drops below 4.5 m and the time at which it next rises back above 4.5 m, showing the equation you solve, and (4) explains one reason the real depths might differ from the model.
    answer: |
      (1) Midline (7 + 3)/2 = 5, amplitude (7 − 3)/2 = 2, period 2 · 6.2 = 12.4 hours, peak at t = 4: h(t) = 5 + 2 cos(2π(t − 4)/12.4).
      (2) Next high tide at 4 + 12.4 = 16.4 hours, which is 4:24 pm. At noon, t = 12: 2π(8)/12.4 ≈ 4.054 radians, cos ≈ −0.617, so h ≈ 5 − 1.23 ≈ 3.77 m.
      (3) Solve 5 + 2 cos(2π(t − 4)/12.4) = 4.5, so cos(2π(t − 4)/12.4) = −0.25. arccos(−0.25) ≈ 1.823, giving 2π(t − 4)/12.4 = 1.823 and t − 4 ≈ 1.823 · 12.4/(2π) ≈ 3.60 hours: the depth drops below 4.5 m at about 7:36. The cosine returns to −0.25 at 2π − 1.823 ≈ 4.460, so t − 4 ≈ 8.80 hours and the depth rises back above 4.5 m at about 12:48. The channel is closed to the boat for about 5.2 hours each cycle.
      (4) Real tides are affected by weather (wind and air pressure), by the shape of the harbour, and by the changing pull of the Moon and Sun through the month, so the highs and lows vary from cycle to cycle; the model only captures the regular 12.4-hour rhythm.
    explanation: |
      Six points: 2 for the model in (1) with midline 5, amplitude 2, period 12.4 and shift 4; 1 for 4:24 pm and about 3.77 m in (2); 2 for (3), one for cos(…) = −0.25 and one for both times (about 7:36 and 12:48, allow ±3 minutes); 1 for a sensible limitation in (4).
