unit: 6
description: |
  45 questions · about 85 minutes · every lesson of Unit 6 (6.1 to 6.19): coordinates on a circle, radians
  and the unit circle, the Pythagorean identity, unknown coordinates and angles, rising and falling, the
  graphs of sine, cosine and tangent, angles beyond 2π and negative angles, amplitude, midline, shift and
  period, comparing transformations, and modeling circular motion and periodic data. Includes three
  shared-context sets of three questions (a point on a circle of radius 6, an angle in quadrant II, and a
  transformed sine function), select-all, true/false, fill-in-the-blank and numeric items, two short-answer
  questions (3 points each) and one extended response (6 points), with a few review items from earlier units.
  Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
  matched automatically; the free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a point on the circle of radius 6 (6.1, 6.2, 6.3)
  - slug: alg2-u06-exam-q01
    type: multiple_choice
    topic_code: "6.1"
    source: "IM Algebra 2, Unit 6, Lesson 1"
    points: 1
    stimulus: |
      A point P moves counterclockwise around the circle of radius 6 centred at the origin, starting from (6, 0).
    prompt: |
      At one moment P has x-coordinate 3.6 and is above the x-axis. What is its y-coordinate?
    options:
      - "2.4"
      - "−4.8"
      - "√2.4"
      - "4.8"
    option_explanations:
      - |
        2.4 is 6 − 3.6; the coordinates satisfy x² + y² = 36, not x + y = 6.
      - |
        −4.8 also lies on the circle, but P is above the x-axis, so y is positive.
      - |
        y² = 23.04, not 2.4; the square root of 23.04 is 4.8.
      - |
        Correct. 3.6² + y² = 36 gives y² = 36 − 12.96 = 23.04 = 4.8², and above the axis y = 4.8.
    answer: 3
  - slug: alg2-u06-exam-q02
    type: multiple_choice
    topic_code: "6.2"
    source: "IM Algebra 2, Unit 6, Lesson 2"
    points: 1
    stimulus: |
      A point P moves counterclockwise around the circle of radius 6 centred at the origin, starting from (6, 0).
    prompt: |
      After turning through 5π/6, where is P?
    options:
      - "(−3√3, 3)"
      - "(−3, 3√3)"
      - "(−3√3, −3)"
      - "(3√3, 3)"
    option_explanations:
      - |
        Correct. (6 cos(5π/6), 6 sin(5π/6)) = (6 · (−√3/2), 6 · 1/2) = (−3√3, 3), in quadrant II.
      - |
        (−3, 3√3) is the point at 2π/3, where the reference angle is π/3.
      - |
        (−3√3, −3) is the point at 7π/6, below the axis; 5π/6 is above it.
      - |
        (3√3, 3) is the point at π/6; at 5π/6 the x-coordinate is negative.
    answer: 0
  - slug: alg2-u06-exam-q03
    type: multiple_choice
    topic_code: "6.3"
    source: "IM Algebra 2, Unit 6, Lesson 3"
    points: 1
    stimulus: |
      A point P moves counterclockwise around the circle of radius 6 centred at the origin, starting from (6, 0).
    prompt: |
      How far along the circle has P travelled after turning through 5π/6?
    options:
      - "5π/36"
      - "30π"
      - "5π"
      - "5π/6"
    option_explanations:
      - |
        5π/36 divides the angle by the radius; arc length multiplies them.
      - |
        30π would need an angle of 5π, more than two full turns.
      - |
        Correct. Arc length is rθ = 6 · 5π/6 = 5π, about 15.7 units.
      - |
        5π/6 is the arc on the unit circle; this circle has radius 6, so the arc is 6 times longer.
    answer: 2
  # ---- Stimulus set B: cos θ = −5/13 in quadrant II (6.5, 6.6, 6.11, 6.12)
  - slug: alg2-u06-exam-q04
    type: multiple_choice
    topic_code: "6.6"
    source: "IM Algebra 2, Unit 6, Lesson 6"
    points: 1
    stimulus: |
      An angle θ satisfies cos θ = −5/13 and π/2 < θ < π.
    prompt: |
      What is sin θ?
    options:
      - "144/169"
      - "12/13"
      - "8/13"
      - "−12/13"
    option_explanations:
      - |
        144/169 is sin²θ; take the square root to get sin θ.
      - |
        Correct. sin²θ = 1 − 25/169 = 144/169, and in quadrant II the sine is positive: 12/13.
      - |
        8/13 is 1 − 5/13; the identity subtracts the square of the cosine, not the cosine itself.
      - |
        −12/13 has the right size but the wrong sign; between π/2 and π the point is above the x-axis.
    answer: 1
  - slug: alg2-u06-exam-q05
    type: multiple_choice
    topic_code: "6.12"
    source: "IM Algebra 2, Unit 6, Lesson 12"
    points: 1
    stimulus: |
      An angle θ satisfies cos θ = −5/13 and π/2 < θ < π.
    prompt: |
      What is tan θ?
    options:
      - "−5/12"
      - "12/5"
      - "−12/13"
      - "−12/5"
    option_explanations:
      - |
        −5/12 is cos θ / sin θ, the reciprocal of the tangent.
      - |
        12/5 forgets the negative cosine; in quadrant II the tangent is negative.
      - |
        −12/13 is −sin θ; the tangent divides the sine by the cosine.
      - |
        Correct. tan θ = sin θ / cos θ = (12/13)/(−5/13) = −12/5; the tangent is negative in quadrant II.
    answer: 3
  - slug: alg2-u06-exam-q06
    type: multiple_choice
    topic_code: "6.11"
    source: "IM Algebra 2, Unit 6, Lesson 11"
    points: 1
    stimulus: |
      An angle θ satisfies cos θ = −5/13 and π/2 < θ < π.
    prompt: |
      What is sin(−θ)?
    options:
      - "12/13"
      - "5/13"
      - "−12/13"
      - "−5/13"
    option_explanations:
      - |
        12/13 is sin θ; the sign flips for the negative angle.
      - |
        5/13 would be −cos θ; the question asks for the sine.
      - |
        Correct. Sine is odd, sin(−θ) = −sin θ = −12/13: the point at −θ is the reflection of the point at θ across the x-axis.
      - |
        −5/13 is cos θ, which is also cos(−θ); the sine is what changes sign.
    answer: 2
  # ---- Stimulus set C: f(θ) = 5 sin(2(θ − π/6)) − 1 (6.16, 6.17)
  - slug: alg2-u06-exam-q07
    type: multiple_choice
    topic_code: "6.16"
    source: "IM Algebra 2, Unit 6, Lesson 16"
    points: 1
    stimulus: |
      Let f(θ) = 5 sin(2(θ − π/6)) − 1.
    prompt: |
      What are the midline and amplitude of f?
    options:
      - "Midline y = 1, amplitude 5"
      - "Midline y = −1, amplitude 5"
      - "Midline y = −1, amplitude 10"
      - "Midline y = 5, amplitude 1"
    option_explanations:
      - |
        The midline is y = −1, below the axis, since the constant is negative.
      - |
        Correct. The constant −1 is the midline and the factor 5 is the amplitude; the wave runs from −6 to 4.
      - |
        10 is the full distance from minimum to maximum; the amplitude is half of it.
      - |
        5 multiplies the sine, so it is the amplitude, and the constant −1 is the midline.
    answer: 1
  - slug: alg2-u06-exam-q08
    type: multiple_choice
    topic_code: "6.16"
    source: "IM Algebra 2, Unit 6, Lesson 16"
    points: 1
    stimulus: |
      Let f(θ) = 5 sin(2(θ − π/6)) − 1.
    prompt: |
      What is the period of f?
    options:
      - "π"
      - "π/6"
      - "2π"
      - "4π"
    option_explanations:
      - |
        Correct. The period of sin(bθ) is 2π/b, here 2π/2 = π.
      - |
        π/6 is the horizontal shift, not the period.
      - |
        2π is the period of sin θ; the factor 2 inside fits two waves into that length.
      - |
        4π would be the period of sin(θ/2); multiplying by 2 shortens the period.
    answer: 0
  - slug: alg2-u06-exam-q09
    type: multiple_choice
    topic_code: "6.17"
    source: "IM Algebra 2, Unit 6, Lesson 17"
    points: 1
    stimulus: |
      Let f(θ) = 5 sin(2(θ − π/6)) − 1.
    prompt: |
      Where is the first maximum of f for θ ≥ 0?
    options:
      - "θ = π/2"
      - "θ = π/6"
      - "θ = 2π/3"
      - "θ = 5π/12"
    option_explanations:
      - |
        π/2 is where sin θ peaks; with the compression and shift the peak moves to 5π/12.
      - |
        At θ = π/6 the argument is 0, so f is on its midline going up, not at a peak.
      - |
        At θ = 2π/3 the argument is π, another midline crossing (going down).
      - |
        Correct. Sine peaks where its argument is π/2: 2(θ − π/6) = π/2 gives θ = π/6 + π/4 = 5π/12.
    answer: 3
  # ---- Single items
  - slug: alg2-u06-exam-q10
    type: multiple_choice
    topic_code: "6.3"
    source: "IM Algebra 2, Unit 6, Lesson 3"
    points: 1
    prompt: |
      Which angle equals 300°?
    options:
      - "5π/3"
      - "3π/2"
      - "5π/6"
      - "300π"
    option_explanations:
      - |
        Correct. 300 · π/180 = 300π/180 = 5π/3, a sixth of a turn short of a full turn.
      - |
        3π/2 is 270°, straight down; 300° is 30° further round.
      - |
        5π/6 is 150°, in quadrant II; 300° is in quadrant IV.
      - |
        Degrees convert by multiplying by π/180, not by π alone.
    answer: 0
  - slug: alg2-u06-exam-q11
    type: multiple_choice
    topic_code: "6.3"
    source: "IM Algebra 2, Unit 6, Lesson 3"
    points: 1
    prompt: |
      How many degrees is 7π/4 radians?
    options:
      - "135°"
      - "315°"
      - "420°"
      - "225°"
    option_explanations:
      - |
        135° is 3π/4, in quadrant II; 7π/4 is in quadrant IV.
      - |
        Correct. 7π/4 · 180/π = 7 · 45 = 315°, an eighth of a turn short of a full turn.
      - |
        420° is 7π/3, more than a full turn; the denominator here is 4.
      - |
        225° is 5π/4; 7π/4 is two eighths further round.
    answer: 1
  - slug: alg2-u06-exam-q12
    type: multiple_choice
    topic_code: "6.4"
    source: "IM Algebra 2, Unit 6, Lesson 4"
    points: 1
    prompt: |
      What is sin(4π/3)?
    options:
      - "−1/2"
      - "1/2"
      - "−√3/2"
      - "√3/2"
    option_explanations:
      - |
        −1/2 is cos(4π/3), the x-coordinate, not the sine.
      - |
        1/2 is sin(π/6); the reference angle here is π/3 and the point is in quadrant III.
      - |
        Correct. 4π/3 is in quadrant III with reference angle π/3, so the sine is −sin(π/3) = −√3/2.
      - |
        √3/2 is sin(π/3) or sin(2π/3); below the axis the sine is negative.
    answer: 2
  - slug: alg2-u06-exam-q13
    type: multiple_choice
    topic_code: "6.4"
    source: "IM Algebra 2, Unit 6, Lesson 4"
    points: 1
    prompt: |
      Which angles in [0, 2π) have cos θ = −√3/2?
    options:
      - "2π/3 and 4π/3"
      - "π/6 and 11π/6"
      - "5π/6 and 7π/6"
      - "5π/6 only"
    option_explanations:
      - |
        2π/3 and 4π/3 have cosine −1/2; the reference angle there is π/3.
      - |
        π/6 and 11π/6 have cosine +√3/2; they lie to the right of the y-axis.
      - |
        Correct. Reference angle π/6 with negative cosine puts the points in quadrants II and III.
      - |
        7π/6 also has cosine −√3/2; the cosine is negative throughout quadrants II and III.
    answer: 2
  - slug: alg2-u06-exam-q14
    type: multiple_choice
    topic_code: "6.2"
    source: "IM Algebra 2, Unit 6, Lesson 2"
    points: 1
    prompt: |
      Where is the point at 45° on the circle of radius 8 centred at the origin?
    options:
      - "(4√3, 4)"
      - "(4√2, 4√2)"
      - "(4, 4)"
      - "(8, 8)"
    option_explanations:
      - |
        (4√3, 4) is the point at 30°, where the coordinates are unequal.
      - |
        Correct. (8 cos 45°, 8 sin 45°) = (8 · √2/2, 8 · √2/2) = (4√2, 4√2), and (4√2)² + (4√2)² = 64.
      - |
        (4, 4) is at 45° but only √32 ≈ 5.7 from the origin, not 8.
      - |
        (8, 8) is 8√2 from the origin; the coordinates must satisfy x² + y² = 64.
    answer: 1
  - slug: alg2-u06-exam-q15
    type: multiple_choice
    topic_code: "6.7"
    source: "IM Algebra 2, Unit 6, Lesson 7"
    points: 1
    prompt: |
      A point on the circle of radius 5 is at (−4, −3). To two decimal places, what is its angle θ in [0, 2π)?
    options:
      - "5.64"
      - "2.50"
      - "0.64"
      - "3.79"
    option_explanations:
      - |
        5.64 = 2π − 0.64 is the quadrant IV angle, where the x-coordinate would be positive.
      - |
        2.50 = π − 0.64 is the quadrant II angle, where the y-coordinate would be positive.
      - |
        0.64 is the reference angle, the quadrant I angle with cosine 4/5; this point has both coordinates negative.
      - |
        Correct. The reference angle is arccos(4/5) ≈ 0.64, and in quadrant III θ = π + 0.64 ≈ 3.79.
    answer: 3
  - slug: alg2-u06-exam-q16
    type: multiple_choice
    topic_code: "6.8"
    source: "IM Algebra 2, Unit 6, Lesson 8"
    points: 1
    prompt: |
      A point moves counterclockwise around a circle centred at the origin, starting on the positive x-axis. For which angles θ in [0, 2π] is its x-coordinate increasing?
    options:
      - "π < θ < 2π"
      - "π/2 < θ < 3π/2"
      - "0 < θ < π"
      - "0 < θ < π/2 and 3π/2 < θ < 2π"
    option_explanations:
      - |
        Correct. From the far left at θ = π the x-coordinate climbs from −r back to r at 2π.
      - |
        This is where the y-coordinate decreases, not where x increases.
      - |
        On (0, π) the x-coordinate falls from r to −r.
      - |
        These are the quadrants where the y-coordinate is increasing; x is decreasing on the first of them.
    answer: 0
  - slug: alg2-u06-exam-q17
    type: multiple_choice
    topic_code: "6.9"
    source: "IM Algebra 2, Unit 6, Lesson 9"
    points: 1
    prompt: |
      Which description fits the graph of y = cos θ on [0, 2π]?
    options:
      - "Starts at (0, −1), rises to (π, 1), falls back to (2π, −1)."
      - "Starts at (0, 0), rises to (π/2, 1), falls to (3π/2, −1), returns to (2π, 0)."
      - "Starts at (0, 1), falls to (π, −1), rises back to (2π, 1), crossing the axis at π/2 and 3π/2."
      - "Starts at (0, 0), rises without bound toward θ = π/2."
    option_explanations:
      - |
        This is −cos θ, the reflection of the cosine wave across the axis.
      - |
        This is the sine wave, the y-coordinate of the circling point.
      - |
        Correct. Cosine is the x-coordinate, which is 1 at the start, −1 at the far left and 0 on the y-axis.
      - |
        This is the tangent on (0, π/2); cosine never leaves [−1, 1].
    answer: 2
  - slug: alg2-u06-exam-q18
    type: multiple_choice
    topic_code: "6.10"
    source: "IM Algebra 2, Unit 6, Lesson 10"
    points: 1
    prompt: |
      What is cos(11π/3)?
    options:
      - "−1/2"
      - "1/2"
      - "√3/2"
      - "−√3/2"
    option_explanations:
      - |
        −1/2 is cos(2π/3) or cos(4π/3); 11π/3 is coterminal with 5π/3, where x is positive.
      - |
        Correct. 11π/3 − 2π = 5π/3, in quadrant IV with reference angle π/3, so the cosine is +1/2.
      - |
        √3/2 is sin(π/3); the cosine at a reference angle of π/3 is 1/2.
      - |
        −√3/2 is sin(5π/3), the y-coordinate, not the cosine.
    answer: 1
  - slug: alg2-u06-exam-q19
    type: multiple_choice
    topic_code: "6.11"
    source: "IM Algebra 2, Unit 6, Lesson 11"
    points: 1
    prompt: |
      What is sin(−π/6)?
    options:
      - "−√3/2"
      - "1/2"
      - "√3/2"
      - "−1/2"
    option_explanations:
      - |
        −√3/2 is sin(−π/3); the reference angle here is π/6.
      - |
        1/2 is sin(π/6); the negative angle is below the axis, so its sine is negative.
      - |
        √3/2 is cos(−π/6), the x-coordinate, which the negative angle does not change.
      - |
        Correct. −π/6 is a clockwise turn to the quadrant IV point (√3/2, −1/2); sin(−θ) = −sin θ.
    answer: 3
  - slug: alg2-u06-exam-q20
    type: multiple_choice
    topic_code: "6.12"
    source: "IM Algebra 2, Unit 6, Lesson 12"
    points: 1
    prompt: |
      What is tan(3π/4)?
    options:
      - "−1"
      - "1"
      - "undefined"
      - "−√2/2"
    option_explanations:
      - |
        Correct. tan(3π/4) = (√2/2)/(−√2/2) = −1: the ray at 135° has slope −1.
      - |
        1 is tan(π/4); in quadrant II the cosine is negative, so the tangent is negative.
      - |
        The tangent is undefined only where the cosine is 0, at odd multiples of π/2.
      - |
        −√2/2 is cos(3π/4), not the ratio of sine to cosine.
    answer: 0
  - slug: alg2-u06-exam-q21
    type: multiple_choice
    topic_code: "6.13"
    source: "IM Algebra 2, Unit 6, Lesson 13"
    points: 1
    prompt: |
      What is the minimum value of y = 4 cos θ + 1?
    options:
      - "−4"
      - "1"
      - "−3"
      - "5"
    option_explanations:
      - |
        −4 is the minimum of 4 cos θ before the shift up by 1.
      - |
        1 is the midline; the wave swings 4 below it.
      - |
        Correct. The midline is 1 and the amplitude 4, so the minimum is 1 − 4 = −3, at θ = π.
      - |
        5 is the maximum, at θ = 0 where cos θ = 1.
    answer: 2
  - slug: alg2-u06-exam-q22
    type: multiple_choice
    topic_code: "6.14"
    source: "IM Algebra 2, Unit 6, Lesson 14"
    points: 1
    prompt: |
      Where does the graph of y = sin(θ + π/3) cross its midline going upward?
    options:
      - "θ = π/3, and every 2π after"
      - "θ = −π/3, and every 2π after"
      - "θ = π/6, and every 2π after"
      - "θ = 2π/3, and every 2π after"
    option_explanations:
      - |
        θ + π/3 shifts the wave to the left, so the crossing moves to −π/3, not +π/3.
      - |
        Correct. Sine rises through its midline where its argument is 0: θ + π/3 = 0 gives θ = −π/3 (and 5π/3, 11π/3, …).
      - |
        At θ = π/6 the argument is π/6 + π/3 = π/2, where the wave is at a peak, not crossing its midline.
      - |
        At θ = 2π/3 the argument is π, a downward crossing.
    answer: 1
  - slug: alg2-u06-exam-q23
    type: multiple_choice
    topic_code: "6.15"
    source: "IM Algebra 2, Unit 6, Lesson 15"
    points: 1
    prompt: |
      What is the period of y = cos(πθ/4)?
    options:
      - "8"
      - "8π"
      - "1/4"
      - "π/4"
    option_explanations:
      - |
        Correct. 2π ÷ (π/4) = 8: the argument reaches 2π when θ = 8.
      - |
        8π would be the period of cos(θ/4); the π in the coefficient cancels the π in 2π.
      - |
        1/4 is the number of waves per 2π units only if b were 1/4; here b = π/4.
      - |
        π/4 is b, the coefficient of θ, not the period.
    answer: 0
  - slug: alg2-u06-exam-q24
    type: multiple_choice
    topic_code: "6.18"
    source: "IM Algebra 2, Unit 6, Lesson 18"
    points: 1
    prompt: |
      A wheel of radius 9 m has its centre 10 m above the ground and turns once every 30 seconds. A point on the rim is at the top at t = 0. Which function gives its height after t seconds?
    options:
      - "h(t) = 10 − 9 cos(πt/15)"
      - "h(t) = 10 + 9 cos(30t)"
      - "h(t) = 10 + 9 sin(πt/15)"
      - "h(t) = 10 + 9 cos(πt/15)"
    option_explanations:
      - |
        A reflected cosine starts at the bottom of the wheel: h(0) = 10 − 9 = 1 m.
      - |
        b is 2π divided by the period, π/15, not the period 30.
      - |
        +sin starts level with the centre: h(0) = 10.
      - |
        Correct. b = 2π/30 = π/15, and starting at the top calls for +cos: h(0) = 19.
    answer: 3
  - slug: alg2-u06-exam-q25
    type: multiple_choice
    topic_code: "6.19"
    source: "IM Algebra 2, Unit 6, Lesson 19"
    points: 1
    prompt: |
      At a harbour, high tide of 4.8 m occurs at 1:00 and the next low tide of 0.8 m at 7:12, 6.2 hours later. With t in hours after midnight, which model fits?
    options:
      - "h(t) = 4.8 + 2 cos(2π(t − 1)/12.4)"
      - "h(t) = 2.8 + 2 cos(2π(t − 1)/6.2)"
      - "h(t) = 2.8 + 4 cos(2π(t − 1)/12.4)"
      - "h(t) = 2.8 + 2 cos(2π(t − 1)/12.4)"
    option_explanations:
      - |
        The midline is the average of high and low, 2.8 m, not the high-tide height.
      - |
        High to low is half a period; the full period is 12.4 hours.
      - |
        Amplitude is half the range, (4.8 − 0.8)/2 = 2.
      - |
        Correct. Midline (4.8 + 0.8)/2 = 2.8, amplitude 2, period 2 · 6.2 = 12.4 hours, peak at t = 1.
    answer: 3
  - slug: alg2-u06-exam-q26
    type: multiple_choice
    topic_code: "6.17"
    source: "IM Algebra 2, Unit 6, Lesson 17"
    points: 1
    prompt: |
      Let f(θ) = cos θ and g(θ) = 2 cos(θ − π/4) + 3. Which expresses g in terms of f?
    options:
      - "g(θ) = 2f(θ + π/4) + 3"
      - "g(θ) = 2f(θ − π/4) + 3"
      - "g(θ) = f(2θ − π/4) + 3"
      - "g(θ) = 2f(θ − π/4 + 3)"
    option_explanations:
      - |
        θ + π/4 would shift the graph left; g has θ − π/4, a shift to the right.
      - |
        Correct. The input is shifted by π/4, then the output is doubled and 3 is added: stretch by 2, right π/4, up 3.
      - |
        The 2 multiplies the output (amplitude 2), not the input.
      - |
