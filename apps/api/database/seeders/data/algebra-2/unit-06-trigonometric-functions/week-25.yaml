    - slug: alg2-u06-w25-q25
      type: long_answer
      topic_code: "6.8"
      source: "IM Algebra 2, Unit 6, Lesson 8"
      points: 6
      prompt: |
        A water wheel of radius 4 metres turns counterclockwise with its centre 1 metre above the surface of a stream. Follow one paddle, starting from the 3 o'clock position (level with the centre, on the right), and let θ be the angle it has turned through. Write a full response that (1) explains why the paddle's height above the water is h = 1 + 4 sin θ, (2) finds the paddle's greatest and least heights and the angles at which they occur, (3) finds the interval of angles in [0, 2π) during which the paddle is under water, to two decimal places, and (4) states where in the turn the height is decreasing and finds the height after the paddle has turned through 5 radians.
      answer: |
        (1) Relative to the centre, the paddle is at (4 cos θ, 4 sin θ): the spoke of length 4 is the hypotenuse of a right triangle with angle θ at the centre, so its vertical leg is 4 sin θ. The centre is 1 m above the water, so h = 1 + 4 sin θ.
        (2) sin θ ranges from −1 to 1, so h ranges from 1 − 4 = −3 m (at θ = 3π/2, the bottom) to 1 + 4 = 5 m (at θ = π/2, the top).
        (3) Under water means h < 0, that is sin θ < −1/4. arcsin(1/4) ≈ 0.25, so the sine equals −1/4 at θ = π + 0.25 ≈ 3.39 and θ = 2π − 0.25 ≈ 6.03, and it is below −1/4 between them: the paddle is under water for 3.39 < θ < 6.03.
        (4) The height decreases from the top to the bottom, π/2 < θ < 3π/2. After 5 radians, h = 1 + 4 sin 5 ≈ 1 + 4(−0.959) ≈ −2.84 m: the paddle is under water, about 2.8 m below the surface, which agrees with (3) since 3.39 < 5 < 6.03.
      explanation: |
        Six points: 1 for the right-triangle argument in (1); 1 for 5 m at π/2 and −3 m at 3π/2 in (2); 2 for the interval (3.39, 6.03) from sin θ = −1/4 with both endpoints in (3); 1 for (π/2, 3π/2) and 1 for h ≈ −2.84 m in (4).
