week: 25
unit: 6
title: "The Pythagorean Identity and Motion around a Circle"
topics: ["6.5", "6.6", "6.7", "6.8"]
guide: guides/week-25.md
guide_description: |
  Why cos²θ + sin²θ = 1 and how it gives one coordinate from the other up to sign; choosing the sign from
  the quadrant; finding coordinates from an angle and radius, or the angle from the coordinates with arccos
  and a reference angle; and where the height and horizontal position of a circling point rise and fall.
flashcards_description: |
  28 cards on the Pythagorean identity, choosing signs by quadrant, unknown coordinates and angles, and rising and falling.

flashcards:
  - front: The Pythagorean identity → statement
    back: |
      cos²θ + sin²θ = 1 for every angle θ. It is x² + y² = 1 written for the unit-circle point (cos θ, sin θ).
    topic_code: "6.5"
  - front: Why cos²θ + sin²θ = 1 is called Pythagorean
    back: |
      The point (cos θ, sin θ) is the corner of a right triangle with hypotenuse 1 and legs |cos θ| and |sin θ|, so the identity is the Pythagorean theorem for that triangle.
    topic_code: "6.5"
  - front: cos²θ → what the notation means
    back: |
      (cos θ)², the cosine squared. It is not cos(θ²), the cosine of the square of the angle.
    topic_code: "6.5"
  - front: Checking the Pythagorean identity at π/3
    back: |
      (1/2)² + (√3/2)² = 1/4 + 3/4 = 1. The identity holds at every labelled point of the unit circle.
    topic_code: "6.5"
  - front: cos θ when sin θ = 3/5 and no quadrant is given
    back: |
      cos²θ = 1 − 9/25 = 16/25, so cos θ = 4/5 or −4/5. Two points on the unit circle have height 3/5, one in quadrant I and one in quadrant II.
    topic_code: "6.5"
  - front: sin θ when cos θ = 0.28 and no quadrant is given
    back: |
      sin²θ = 1 − 0.0784 = 0.9216, so sin θ = ±0.96.
    topic_code: "6.5"
  - front: cos θ when sin θ = 3/5 and θ is in quadrant II
    back: |
      −4/5. The identity gives ±4/5; in quadrant II the x-coordinate is negative.
    topic_code: "6.6"
  - front: sin θ and tan θ when cos θ = −5/13 and π < θ < 3π/2
    back: |
      sin θ = −12/13 (quadrant III, negative), and tan θ = sin θ / cos θ = (−12/13)/(−5/13) = 12/5.
    topic_code: "6.6"
  - front: Quadrant with cos θ > 0 and sin θ < 0
    back: |
      Quadrant IV only: x positive, y negative, angles between 3π/2 and 2π.
    topic_code: "6.6"
  - front: sin θ when cos θ = 0.6 and 3π/2 < θ < 2π
    back: |
      −0.8: sin²θ = 1 − 0.36 = 0.64, and the angle is in quadrant IV where sine is negative.
    topic_code: "6.6"
  - front: Sign of tan θ by quadrant
    back: |
      Positive in I and III (cos and sin have the same sign), negative in II and IV.
    topic_code: "6.6"
  - front: Pythagorean identity on a circle of radius r
    back: |
      A point (x, y) on it satisfies x² + y² = r²; with x = r cos θ and y = r sin θ this is r²(cos²θ + sin²θ) = r².
    topic_code: "6.6"
  - front: Coordinates from the angle and radius with a calculator
    back: |
      (r cos θ, r sin θ), with the calculator in radian mode if θ is in radians. Radius 9 at θ = 2: (9 cos 2, 9 sin 2) ≈ (−3.75, 8.18).
    topic_code: "6.7"
  - front: What arccos (cos⁻¹) returns
    back: |
      The one angle between 0 and π whose cosine is the given number. It never returns a quadrant III or IV angle.
    topic_code: "6.7"
  - front: What arcsin (sin⁻¹) returns
    back: |
      The one angle between −π/2 and π/2 whose sine is the given number: a quadrant I or quadrant IV angle (written as a negative angle).
    topic_code: "6.7"
  - front: Routine for the angle of a point (x, y) on a circle of radius r
    back: |
      Reference angle α = arccos(|x|/r), between 0 and π/2. Then θ = α, π − α, π + α or 2π − α for quadrants I, II, III, IV.
    topic_code: "6.7"
  - front: Angle of (−3, 4) on the circle of radius 5
    back: |
      arccos(−3/5) ≈ 2.21 radians (about 126.9°). The point is in quadrant II, which arccos covers, so no adjustment.
    topic_code: "6.7"
  - front: Angle of (−3, −4) on the circle of radius 5
    back: |
      Reference angle arccos(3/5) ≈ 0.93; quadrant III, so θ = π + 0.93 ≈ 4.07 radians.
    topic_code: "6.7"
  - front: Angle of (12, −5) on the circle of radius 13
    back: |
      Reference angle arccos(12/13) ≈ 0.39; quadrant IV, so θ = 2π − 0.39 ≈ 5.89 radians.
    topic_code: "6.7"
  - front: Radius of the origin-centred circle through (−8, −15)
    back: |
      r = √(64 + 225) = √289 = 17.
    topic_code: "6.7"
  - front: Where sin θ is increasing on [0, 2π]
    back: |
      On (0, π/2) and (3π/2, 2π): the height of the circling point rises from 0 to r and later from −r back to 0.
    topic_code: "6.8"
  - front: Where cos θ is decreasing on [0, 2π]
    back: |
      On (0, π): the x-coordinate falls from r to −r during the first half turn, then climbs back on (π, 2π).
    topic_code: "6.8"
  - front: Largest and smallest y-coordinate of a point on a circle of radius r
    back: |
      Largest r at θ = π/2 (the top); smallest −r at θ = 3π/2 (the bottom).
    topic_code: "6.8"
  - front: Where the height of a circling point changes fastest and slowest
    back: |
      Fastest at θ = 0 and π, where the point moves almost vertically; slowest at the top and bottom, where it moves almost horizontally.
    topic_code: "6.8"
  - front: Height function for a Ferris wheel of radius 12 m with centre 14 m up
    back: |
      h = 14 + 12 sin θ for a rider starting level with the centre on the right. Maximum 26 m at θ = π/2, minimum 2 m at 3π/2.
    topic_code: "6.8"
  - front: Interval where cos θ and sin θ are both decreasing
    back: |
      (π/2, π), quadrant II: cosine decreases on (0, π) and sine on (π/2, 3π/2).
    topic_code: "6.8"
  - front: Interval where cos θ and sin θ are both increasing
    back: |
      (3π/2, 2π), quadrant IV: cosine increases on (π, 2π) and sine on (3π/2, 2π).
    topic_code: "6.8"
  - front: Angle at which the x-coordinate of a circling point is smallest
    back: |
      θ = π, where x = −r. The x-coordinate is largest, r, at θ = 0 and 2π.
    topic_code: "6.8"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 6.5 to 6.8: the Pythagorean identity,
    choosing signs by quadrant, unknown coordinates and angles, and rising and falling), with about a quarter
    reviewing earlier units. Includes a shared-context set on an angle with sin θ = 3/5 in quadrant II.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: sin θ = 3/5 in quadrant II (6.5, 6.6, 6.7)
    - slug: alg2-u06-w25-q01
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Algebra 2, Unit 6, Lesson 5"
      points: 1
      stimulus: |
        An angle θ satisfies sin θ = 3/5 and π/2 < θ < π.
      prompt: |
        What is cos²θ?
      options:
        - "4/5"
        - "16/25"
        - "9/25"
        - "2/5"
      option_explanations:
        - |
          4/5 is |cos θ|, the square root of cos²θ, not cos²θ itself.
        - |
          Correct. cos²θ = 1 − sin²θ = 1 − 9/25 = 16/25.
        - |
          9/25 is sin²θ; the cosine squared is what is left after subtracting it from 1.
        - |
          2/5 is 1 − 3/5; the identity subtracts the square of the sine, not the sine itself.
      answer: 1
    - slug: alg2-u06-w25-q02
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Algebra 2, Unit 6, Lesson 6"
      points: 1
      stimulus: |
        An angle θ satisfies sin θ = 3/5 and π/2 < θ < π.
      prompt: |
        What is cos θ?
      options:
        - "4/5"
        - "−3/5"
        - "−4/5"
        - "−16/25"
      option_explanations:
        - |
          4/5 is the cosine of the quadrant I angle with the same sine; between π/2 and π the cosine is negative.
        - |
          −3/5 has the wrong size: the cosine satisfies cos²θ = 16/25, not 9/25.
        - |
          Correct. cos θ = ±4/5, and in quadrant II the x-coordinate is negative.
        - |
          −16/25 is the negative of cos²θ; take the square root before choosing the sign.
      answer: 2
    - slug: alg2-u06-w25-q03
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Algebra 2, Unit 6, Lesson 6"
      points: 1
      stimulus: |
        An angle θ satisfies sin θ = 3/5 and π/2 < θ < π.
      prompt: |
        What is tan θ?
      options:
        - "−3/4"
        - "3/4"
        - "3/5"
        - "−4/3"
      option_explanations:
        - |
          Correct. tan θ = sin θ / cos θ = (3/5)/(−4/5) = −3/4.
        - |
          3/4 forgets that the cosine is negative in quadrant II, which makes the tangent negative.
        - |
          3/5 is sin θ itself; the tangent divides the sine by the cosine.
        - |
          −4/3 is cos θ / sin θ, the reciprocal of the tangent.
      answer: 0
    - slug: alg2-u06-w25-q04
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Algebra 2, Unit 6, Lesson 7"
      points: 1
      stimulus: |
        An angle θ satisfies sin θ = 3/5 and π/2 < θ < π.
      prompt: |
        Where is the point at angle θ on the circle of radius 20 centred at the origin?
      options:
        - "(−4/5, 3/5)"
        - "(−12, 16)"
        - "(16, 12)"
        - "(−16, 12)"
      option_explanations:
        - |
          (−4/5, 3/5) is the point on the unit circle; multiply both coordinates by the radius 20.
        - |
          (−12, 16) swaps the roles of cosine and sine: x = 20 cos θ = −16.
        - |
          (16, 12) is in quadrant I; the angle is in quadrant II, so the x-coordinate is negative.
        - |
          Correct. (20 cos θ, 20 sin θ) = (20 · (−4/5), 20 · 3/5) = (−16, 12), and 16² + 12² = 400.
      answer: 3
    # ---- Single items on this week
    - slug: alg2-u06-w25-q05
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Algebra 2, Unit 6, Lesson 5"
      points: 1
      prompt: |
        If sin θ = −0.8 and nothing else is known about θ, which values are possible for cos θ?
      options:
        - "0.6 or −0.6"
        - "0.36 or −0.36"
        - "0.2 or −0.2"
        - "0.6 only"
      option_explanations:
        - |
          Correct. cos²θ = 1 − 0.64 = 0.36, so cos θ = ±0.6; both quadrants III and IV have sine −0.8.
        - |
          0.36 is cos²θ; the cosine itself is its square root, ±0.6.
        - |
          0.2 is 1 − 0.8; the identity uses the squares, 1 − 0.64 = 0.36, and then a square root.
        - |
          Without the quadrant the sign is open: (−0.6, −0.8) is also a unit-circle point.
      answer: 0
    - slug: alg2-u06-w25-q06
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Algebra 2, Unit 6, Lesson 7"
      points: 1
      prompt: |
        To two decimal places, where is the point at θ = 2.5 radians on the circle of radius 6?
      options:
        - "(5.99, 0.26)"
        - "(−3.59, 4.81)"
        - "(4.81, 3.59)"
        - "(−4.81, 3.59)"
      option_explanations:
        - |
          This is the result of a calculator in degree mode, treating the angle as 2.5°.
        - |
          This swaps cosine and sine; the x-coordinate is 6 cos 2.5, which is −4.81.
        - |
          2.5 radians is past π/2 ≈ 1.57, so the point is in quadrant II with a negative x-coordinate.
        - |
          Correct. 6 cos 2.5 ≈ 6(−0.8011) ≈ −4.81 and 6 sin 2.5 ≈ 6(0.5985) ≈ 3.59; 2.5 radians is in quadrant II.
      answer: 3
    - slug: alg2-u06-w25-q07
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Algebra 2, Unit 6, Lesson 7"
      points: 1
      prompt: |
        A point on the circle of radius 13 is at (−5, 12). To two decimal places, what is its angle θ in [0, 2π)?
      options:
        - "5.11"
        - "1.97"
        - "4.32"
        - "1.18"
      option_explanations:
        - |
          5.11 = 2π − 1.18 is the quadrant IV angle, where the y-coordinate would be negative.
        - |
          Correct. The reference angle is arccos(5/13) ≈ 1.18, and in quadrant II θ = π − 1.18 ≈ 1.97.
        - |
          4.32 = π + 1.18 is the quadrant III angle, where both coordinates would be negative.
        - |
          1.18 is the reference angle, the quadrant I angle with cosine 5/13; this point has x < 0.
      answer: 1
    - slug: alg2-u06-w25-q08
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Algebra 2, Unit 6, Lesson 8"
      points: 1
      prompt: |
        A point moves counterclockwise around a circle centred at the origin, starting on the positive x-axis. For which angles θ in [0, 2π] is its y-coordinate decreasing?
      options:
        - "π < θ < 2π"
        - "0 < θ < π"
        - "π/2 < θ < 3π/2"
        - "0 < θ < π/2 and 3π/2 < θ < 2π"
      option_explanations:
        - |
          On (π, 2π) the height falls to −r and then rises again; it is increasing after 3π/2.
        - |
          On (0, π) the height first rises to the top and then falls; it is not decreasing throughout.
        - |
          Correct. The height falls from the top at π/2 to the bottom at 3π/2.
        - |
          These are the intervals where the height is increasing, not decreasing.
      answer: 2
    - slug: alg2-u06-w25-q09
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Algebra 2, Unit 6, Lesson 6"
      points: 1
      prompt: |
        cos θ = −0.28 and θ is in quadrant III. What is sin θ?
      options:
        - "−0.72"
        - "0.96"
        - "−0.96"
        - "−0.28"
      option_explanations:
        - |
          −0.72 comes from 1 − 0.28 without squaring; the identity uses cos²θ = 0.0784.
        - |
          0.96 has the right size but the wrong sign: below the x-axis the sine is negative.
        - |
          Correct. sin²θ = 1 − 0.0784 = 0.9216 = 0.96², and in quadrant III the sine is negative.
        - |
          −0.28 would only be the sine if the angle were on a 45° line, and (−0.28)² + (−0.28)² ≠ 1.
      answer: 2
    - slug: alg2-u06-w25-q10
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Algebra 2, Unit 6, Lesson 7"
      points: 1
      prompt: |
        A point on the circle of radius 10 has y-coordinate −6 and lies to the right of the y-axis. To two decimal places, what is its angle in [0, 2π)?
      options:
        - "0.64"
        - "5.64"
        - "2.50"
        - "3.79"
      option_explanations:
        - |
          0.64 is the reference angle; the point is below the axis, so the angle is in quadrant IV.
        - |
          Correct. x = 8, the reference angle is arccos(0.8) ≈ 0.64, and in quadrant IV θ = 2π − 0.64 ≈ 5.64.
        - |
          2.50 = π − 0.64 is the quadrant II angle, above the axis and to the left.
        - |
          3.79 = π + 0.64 is the quadrant III angle, whose x-coordinate would be −8.
      answer: 1
    - slug: alg2-u06-w25-q11
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Algebra 2, Unit 2, Lesson 5"
      points: 1
      prompt: |
        Which polynomial has zeros at exactly x = −1, x = 2 and x = 3?
      options:
        - "(x + 1)(x − 2)(x − 3)"
        - "x(x + 1)(x − 2)(x − 3)"
        - "(x + 1)(x − 2)"
        - "(x − 1)(x + 2)(x + 3)"
      option_explanations:
        - |
          Correct. Each factor is zero at one of the listed values: x + 1 at −1, x − 2 at 2, x − 3 at 3.
        - |
          The extra factor x adds a zero at x = 0 that was not asked for.
        - |
          This is missing the zero at x = 3; a third factor x − 3 is needed.
        - |
          These factors vanish at 1, −2 and −3, the opposites of the required zeros.
      answer: 0
    - slug: alg2-u06-w25-q12
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Algebra 2, Unit 3, Lesson 9"
      points: 1
      prompt: |
        Solve √(2x + 1) = 5.
      options:
        - "x = 24"
        - "x = 13"
        - "x = 2"
        - "x = 12"
      option_explanations:
        - |
          24 is the value of 2x after subtracting 1 from 25; divide by 2 to find x = 12.
        - |
          13 is 2x + 1 after subtracting 12, not the solution; 2x + 1 = 25 gives x = 12.
        - |
          x = 2 gives √5, not 5; the square root must be undone by squaring both sides.
        - |
          Correct. Squaring gives 2x + 1 = 25, so x = 12; check: √25 = 5.
      answer: 3
    - slug: alg2-u06-w25-q13
      type: multiple_choice
      topic_code: "4.9"
      source: "IM Algebra 2, Unit 4, Lesson 9"
      points: 1
      prompt: |
        What is log₃(81)?
      options:
        - "4"
        - "27"
        - "9"
        - "3"
      option_explanations:
        - |
          Correct. 3⁴ = 81, so the exponent that turns 3 into 81 is 4.
        - |
          27 is 81 ÷ 3; a logarithm asks for an exponent, not a quotient.
        - |
          9 is √81, the square root; the logarithm base 3 asks how many factors of 3 make 81.
        - |
          3³ = 27, not 81; one more factor of 3 is needed.
      answer: 0
    - slug: alg2-u06-w25-q14
      type: multi_select
      topic_code: "6.5"
      source: "IM Algebra 2, Unit 6, Lesson 5"
      points: 2
      partial_credit: true
      prompt: |
        Which pairs could be (cos θ, sin θ) for some angle θ? Select all that apply.
      options:
        - "(0.8, −0.6)"
        - "(−1, 1)"
        - "(−√2/2, √2/2)"
        - "(1/2, 1/2)"
        - "(√3/2, −1/2)"
      option_explanations:
        - |
          Correct. 0.64 + 0.36 = 1, so the point is on the unit circle, in quadrant IV.
        - |
          (−1)² + 1² = 2; a unit-circle point cannot have both coordinates of size 1.
        - |
          Correct. 1/2 + 1/2 = 1; this is the point at 3π/4.
        - |
          (1/2)² + (1/2)² = 1/2, not 1; the point is inside the unit circle.
        - |
          Correct. 3/4 + 1/4 = 1; this is the point at 11π/6.
      answer: [0, 2, 4]
    - slug: alg2-u06-w25-q15
      type: multi_select
      topic_code: "6.8"
      source: "IM Algebra 2, Unit 6, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        A point moves counterclockwise at a steady speed around the circle of radius r centred at the origin, starting at (r, 0). Which statements are true? Select all that apply.
      options:
        - "Its height is −r after three quarters of a turn."
        - "Its height is increasing during the second quarter of the turn."
        - "Its height is largest after a quarter turn."
        - "Its height changes fastest when it is at the top of the circle."
        - "Its x-coordinate is decreasing during the whole first half turn."
      option_explanations:
        - |
          Correct. Three quarters of a turn brings the point to (0, −r), the bottom.
        - |
          During the second quarter the point moves from the top down to (−r, 0), so its height is decreasing.
        - |
          Correct. After a quarter turn the point is at (0, r), the top of the circle.
        - |
          At the top the point moves almost horizontally, so its height changes slowest there, not fastest.
        - |
          Correct. From (r, 0) to (−r, 0) the x-coordinate falls steadily from r to −r.
      answer: [0, 2, 4]
    - slug: alg2-u06-w25-q16
      type: true_false
      topic_code: "6.5"
      source: "IM Algebra 2, Unit 6, Lesson 5"
      points: 1
      prompt: |
        True or false: the identity cos²θ + sin²θ = 1 holds only for angles between 0 and π/2.
      answer: false
      explanation: |
        False. Every point (cos θ, sin θ) is on the unit circle whatever the angle, so x² + y² = 1 holds for all θ, including angles past π/2 and negative angles.
    - slug: alg2-u06-w25-q17
      type: true_false
      topic_code: "1.8"
      source: "IM Algebra 2, Unit 1, Lesson 8"
      points: 1
      prompt: |
        True or false: the arithmetic sequence with first term 5 and common difference 3 has nth term a(n) = 3n + 2.
      answer: true
      explanation: |
        True. a(n) = 5 + 3(n − 1) = 3n + 2, and it checks: a(1) = 5, a(2) = 8, a(3) = 11.
    - slug: alg2-u06-w25-q18
      type: fill_blank
      topic_code: "6.6"
      source: "IM Algebra 2, Unit 6, Lesson 6"
      points: 1
      prompt: |
        If sin θ = 5/13 and θ is in quadrant II, then cos θ = ____
      answer: ["−12/13", "-12/13", "cos θ = −12/13"]
      explanation: |
        cos²θ = 1 − 25/169 = 144/169, so cos θ = ±12/13; in quadrant II the cosine is negative.
    - slug: alg2-u06-w25-q19
      type: fill_blank
      topic_code: "4.14"
      source: "IM Algebra 2, Unit 4, Lesson 14"
      points: 1
      prompt: |
        The solution of 4 · 2ˣ = 128 is x = ____
      answer: ["5", "x = 5", "x=5"]
      explanation: |
        Dividing by 4 gives 2ˣ = 32 = 2⁵, so x = 5.
    - slug: alg2-u06-w25-q20
      type: numeric
      topic_code: "6.7"
      source: "IM Algebra 2, Unit 6, Lesson 7"
      points: 1
      prompt: |
        Give the y-coordinate of the point at θ = 4 radians on the circle of radius 5 centred at the origin, to two decimal places.
      answer: { value: -3.78, tolerance: 0.02 }
      explanation: |
        5 sin 4 ≈ 5(−0.7568) ≈ −3.78. Four radians is between π and 3π/2, quadrant III, so a negative height is expected.
    - slug: alg2-u06-w25-q21
      type: numeric
      topic_code: "6.7"
      source: "IM Algebra 2, Unit 6, Lesson 7"
      points: 1
      prompt: |
        A circle centred at the origin passes through (−8, −15). What is its radius?
      answer: { value: 17, tolerance: 0 }
      explanation: |
        r² = 64 + 225 = 289, so r = 17.
    - slug: alg2-u06-w25-q22
      type: numeric
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 1
      prompt: |
        Compute (3 + 2i)(3 − 2i). Give a single real number.
      answer: { value: 13, tolerance: 0 }
      explanation: |
        9 − 6i + 6i − 4i² = 9 + 4 = 13, since i² = −1.
    - slug: alg2-u06-w25-q23
      type: short_answer
      topic_code: "6.6"
      source: "IM Algebra 2, Unit 6, Lesson 6"
      points: 3
      prompt: |
        cos θ = −7/25 and π < θ < 3π/2.
        (a) Find sin θ exactly, explaining how you chose its sign.
        (b) Find tan θ.
        (c) Find θ in radians to two decimal places.
      answer: |
        (a) sin²θ = 1 − 49/625 = 576/625, so sin θ = ±24/25; the angle is in quadrant III, where the sine is negative, so sin θ = −24/25.
        (b) tan θ = (−24/25)/(−7/25) = 24/7.
        (c) The reference angle is arccos(7/25) ≈ 1.29, so θ = π + 1.29 ≈ 4.43.
      explanation: |
        Three points, one per part. (a) −24/25 with the quadrant III reason. (b) 24/7 (positive). (c) θ ≈ 4.43 from π plus the reference angle 1.29.
