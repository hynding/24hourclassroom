      points: 3
      prompt: |
        Let f(θ) = 3 sin θ − 1 and g(θ) = 3 sin(2θ) − 1.
        (a) Name every feature (midline, amplitude, period, maximum, minimum) the two functions share.
        (b) Name the feature that differs and give its value for each function.
        (c) How many maximums does each function have for 0 ≤ θ ≤ 2π, and at which θ?
      answer: |
        (a) Both have midline y = −1, amplitude 3, maximum 2 and minimum −4.
        (b) The period: f has period 2π, g has period π. g is f compressed horizontally by a factor of 1/2.
        (c) f has one maximum, at θ = π/2. g has two, where 2θ = π/2 or 5π/2, at θ = π/4 and θ = 5π/4.
      explanation: |
        Three points, one per part. (a) midline −1, amplitude 3, max 2, min −4 (at least three named). (b) periods 2π and π. (c) one at π/2; two at π/4 and 5π/4.
    - slug: alg2-u06-w28-q24
      type: short_answer
      topic_code: "6.19"
      source: "IM Algebra 2, Unit 6, Lesson 19"
      points: 3
      prompt: |
        A city's average monthly temperature is highest in July (month 7) at 26°C and lowest in January (month 1) at 2°C, repeating every 12 months.
        (a) Give the midline, amplitude and period of a cosine model T(m).
        (b) Write the model.
        (c) Use it to estimate the April (m = 4) temperature, and say why the real April average might differ.
      answer: |
        (a) Midline (26 + 2)/2 = 14, amplitude (26 − 2)/2 = 12, period 12 months.
        (b) T(m) = 14 + 12 cos(2π(m − 7)/12) = 14 + 12 cos((π/6)(m − 7)).
        (c) m = 4: (π/6)(−3) = −π/2, cos = 0, so T ≈ 14°C. The real average could differ because a year's weather is not perfectly regular and the warming and cooling halves of the year are not exactly symmetric.
      explanation: |
        Three points, one per part. (a) 14, 12 and 12. (b) a correct cosine (or equivalent sine) model. (c) 14°C with a sensible reason for the model's limits.
    - slug: alg2-u06-w28-q25
      type: long_answer
      topic_code: "6.18"
      source: "IM Algebra 2, Unit 6, Lesson 18"
      points: 6
      prompt: |
        A mill wheel of radius 3 m turns at a steady rate, once every 12 seconds, with its axle 2 m above the surface of the water. Follow one paddle that is at the very top at t = 0. Write a full response that (1) builds the paddle's height above the water, h(t), explaining the choice of function and each number in it, (2) states the midline, amplitude and period and what each means, (3) finds the first time the paddle enters the water, to two decimal places, showing the equation you solve, and (4) finds how long the paddle spends under water during each turn, to two decimal places.
      answer: |
        (1) Starting at the top calls for a cosine: h(t) = 2 + 3 cos(bt), with midline 2 (the axle height), amplitude 3 (the radius) and b = 2π/12 = π/6. So h(t) = 2 + 3 cos(πt/6). Check: h(0) = 5, the top, 5 m above the water.
        (2) Midline 2 m is the axle height, the average of the paddle's highest (5 m) and lowest (−1 m) positions; amplitude 3 m is the radius, how far the paddle swings above and below the axle; period 12 s is the time for one turn.
        (3) The paddle enters the water when h = 0: 2 + 3 cos(πt/6) = 0, cos(πt/6) = −2/3. arccos(−2/3) ≈ 2.30, so πt/6 ≈ 2.30 and t ≈ 2.30 · 6/π ≈ 4.39 s.
        (4) The paddle is under water while cos(πt/6) < −2/3, which is for πt/6 between 2.30 and 2π − 2.30 ≈ 3.98. That is an angle of about 1.68 radians, taking 1.68 · 6/π ≈ 3.21 seconds. (Equivalently it leaves the water at t ≈ 7.61 s, and 7.61 − 4.39 = 3.21.)
      explanation: |
        Six points: 2 for (1), one for the cosine with midline 2 and amplitude 3 and one for b = π/6; 1 for (2); 2 for (3), one for cos(πt/6) = −2/3 and one for t ≈ 4.39 s; 1 for about 3.21 s in (4).
