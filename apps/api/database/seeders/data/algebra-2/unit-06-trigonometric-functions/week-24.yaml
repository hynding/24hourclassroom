week: 24
unit: 6
title: "Circles, Right Triangles and the Unit Circle"
topics: ["6.1", "6.2", "6.3", "6.4"]
guide: guides/week-24.md
guide_description: |
  Position on a circle through x² + y² = r²; right-triangle ratios giving the point (r cos θ, r sin θ);
  radians as arc length on the unit circle with degree conversions; the exact first-quadrant values at
  π/6, π/4 and π/3; and the full unit circle in all four quadrants by reference angles and symmetry.
flashcards_description: |
  28 cards on circle coordinates, right-triangle ratios, radians and the exact values on the unit circle.

flashcards:
  - front: Equation of the circle of radius r centred at the origin
    back: |
      x² + y² = r². It is the Pythagorean theorem for the triangle with legs |x| and |y| and hypotenuse r.
    topic_code: "6.1"
  - front: Point on the circle of radius 5 with x = 3
    back: |
      y² = 25 − 9 = 16, so (3, 4) or (3, −4): the position on the circle decides the sign.
    topic_code: "6.1"
  - front: Minute-hand tip of length 10 at 12, 3, 6 and 9 o'clock
    back: |
      (0, 10), (10, 0), (0, −10), (−10, 0).
    topic_code: "6.1"
  - front: Does the x-coordinate of a point circling at steady speed change at a steady rate?
    back: |
      No. Near the top and bottom of the circle x changes fastest; near the far left and right it barely moves.
    topic_code: "6.1"
  - front: Coordinates of the point at angle θ on a circle of radius r
    back: |
      (r cos θ, r sin θ), with θ measured counterclockwise from the positive x-axis.
    topic_code: "6.2"
  - front: Right-triangle ratios in terms of a point (x, y) on a circle of radius r
    back: |
      cos θ = x/r, sin θ = y/r, tan θ = y/x.
    topic_code: "6.2"
  - front: Point on the circle of radius 10 at 120°
    back: |
      (10 cos 120°, 10 sin 120°) = (−5, 5√3) ≈ (−5, 8.66).
    topic_code: "6.2"
  - front: Angle of the point (4, 4√3) on the circle of radius 8
    back: |
      cos θ = 1/2 and sin θ = √3/2, so θ = 60° (π/3).
    topic_code: "6.2"
  - front: Rider on a 20 m Ferris wheel spoke at 35° from horizontal
    back: |
      About (16.4, 11.5) metres from the centre: 20 cos 35° and 20 sin 35°.
    topic_code: "6.2"
  - front: Definition of a radian
    back: |
      The angle that cuts an arc of length 1 on the unit circle. A full turn is 2π radians; 1 radian ≈ 57.3°.
    topic_code: "6.3"
  - front: Degrees to radians, radians to degrees
    back: |
      Multiply by π/180 to get radians; multiply by 180/π to get degrees.
    topic_code: "6.3"
  - front: 30°, 45°, 60°, 90° in radians
    back: |
      π/6, π/4, π/3, π/2.
    topic_code: "6.3"
  - front: 120°, 135°, 150°, 180°, 270° in radians
    back: |
      2π/3, 3π/4, 5π/6, π, 3π/2.
    topic_code: "6.3"
  - front: 225° in radians and 7π/6 in degrees
    back: |
      5π/4; 210°.
    topic_code: "6.3"
  - front: (cos θ, sin θ) at θ = π/6
    back: |
      (√3/2, 1/2), from the 30-60-90 triangle with hypotenuse 1.
    topic_code: "6.3"
  - front: (cos θ, sin θ) at θ = π/4
    back: |
      (√2/2, √2/2): the 45-45-90 triangle with hypotenuse 1 has equal legs.
    topic_code: "6.3"
  - front: (cos θ, sin θ) at θ = π/3
    back: |
      (1/2, √3/2). Compare π/6, where the coordinates are swapped.
    topic_code: "6.3"
  - front: (cos θ, sin θ) at 0, π/2, π, 3π/2
    back: |
      (1, 0), (0, 1), (−1, 0), (0, −1).
    topic_code: "6.3"
  - front: Arc length cut off by angle θ (radians) on a circle of radius r
    back: |
      rθ. On a radius-3 circle, 2π/3 cuts an arc of length 2π.
    topic_code: "6.3"
  - front: Which coordinate is cosine and which is sine?
    back: |
      cos θ is the x-coordinate and sin θ the y-coordinate of the unit-circle point at angle θ (alphabetical order).
    topic_code: "6.4"
  - front: Signs of cos θ and sin θ by quadrant
    back: |
      I: (+, +); II: (−, +); III: (−, −); IV: (+, −).
    topic_code: "6.4"
  - front: Reference angle
    back: |
      The acute angle between the ray at θ and the x-axis. The point's coordinates are those of the reference angle with the quadrant's signs.
    topic_code: "6.4"
  - front: (cos θ, sin θ) at 5π/6
    back: |
      (−√3/2, 1/2): reference angle π/6, quadrant II.
    topic_code: "6.4"
  - front: (cos θ, sin θ) at 4π/3 and at 7π/4
    back: |
      (−1/2, −√3/2) and (√2/2, −√2/2).
    topic_code: "6.4"
  - front: All θ in [0, 2π) with sin θ = −1/2
    back: |
      7π/6 and 11π/6: reference angle π/6 in quadrants III and IV.
    topic_code: "6.4"
  - front: All θ in [0, 2π) with cos θ = −√2/2
    back: |
      3π/4 and 5π/4: reference angle π/4 in quadrants II and III.
    topic_code: "6.4"
  - front: Effect on (cos θ, sin θ) of θ → −θ, θ → π − θ, θ → θ + π
    back: |
      −θ keeps cos and flips sin; π − θ keeps sin and flips cos; θ + π flips both.
    topic_code: "6.4"
  - front: Point at 5π/3 on the circle of radius 4
    back: |
      4 · (1/2, −√3/2) = (2, −2√3).
    topic_code: "6.4"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 6.1 to 6.4: coordinates on a circle,
    right-triangle ratios, radians and the unit circle), with about a quarter reviewing earlier units.
    Includes a shared-context set on a point moving around a circle of radius 10. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: circle of radius 10 (6.1, 6.2)
    - slug: alg2-u06-w24-q01
      type: multiple_choice
      topic_code: "6.1"
      source: "IM Algebra 2, Unit 6, Lesson 1"
      points: 1
      stimulus: |
        A point P moves counterclockwise around the circle of radius 10 centred at the origin, starting from (10, 0).
      prompt: |
        At one moment P has x-coordinate 6 and is above the x-axis. What is its y-coordinate?
      options:
        - "8"
        - "4"
        - "−8"
        - "√6"
      option_explanations:
        - |
          Correct. 36 + y² = 100 gives y² = 64, and above the axis y = 8.
        - |
          4 is 10 − 6; the coordinates satisfy x² + y² = 100, not x + y = 10.
        - |
          −8 also satisfies the circle equation, but the point is above the x-axis, so y is positive.
        - |
          √6 does not come from the circle equation; y² = 100 − 36 = 64.
      answer: 0
    - slug: alg2-u06-w24-q02
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Algebra 2, Unit 6, Lesson 2"
      points: 1
      stimulus: |
        A point P moves counterclockwise around the circle of radius 10 centred at the origin, starting from (10, 0).
      prompt: |
        After turning through 120°, where is P?
      options:
        - "(−5, 5√3)"
        - "(5, 5√3)"
        - "(−5√3, 5)"
        - "(5√3, −5)"
      option_explanations:
        - |
          Correct. (10 cos 120°, 10 sin 120°) = (10 · (−1/2), 10 · √3/2).
        - |
          (5, 5√3) is the point at 60°; at 120° the point is in quadrant II with negative x.
        - |
          (−5√3, 5) is the point at 150°, where the reference angle is 30°.
        - |
          (5√3, −5) is in quadrant IV, at 330°, not quadrant II.
      answer: 0
    - slug: alg2-u06-w24-q03
      type: multiple_choice
      topic_code: "6.1"
      source: "IM Algebra 2, Unit 6, Lesson 1"
      points: 1
      stimulus: |
        A point P moves counterclockwise around the circle of radius 10 centred at the origin, starting from (10, 0).
      prompt: |
        Between the start and a quarter turn, how do the coordinates of P change?
      options:
        - "x falls from 10 to 0 and y rises from 0 to 10."
        - "x rises from 0 to 10 and y falls from 10 to 0."
        - "x and y both rise from 0 to 10."
        - "x stays 10 and y rises from 0 to 10."
      option_explanations:
        - |
          Correct. Counterclockwise from (10, 0) the point reaches (0, 10) at a quarter turn.
        - |
          This describes the motion from (0, 10) back to (10, 0), the reverse direction.
        - |
          Both coordinates cannot be 10 at once; 10² + 10² = 200, not 100.
        - |
          The x-coordinate cannot stay at 10 while y changes; the point would leave the circle.
      answer: 0
    # ---- Single items on this week
    - slug: alg2-u06-w24-q04
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Algebra 2, Unit 6, Lesson 3"
      points: 1
      prompt: |
        Which angle equals 225°?
      options:
        - "5π/4"
        - "3π/4"
        - "5π/3"
        - "225π"
      option_explanations:
        - |
          Correct. 225 · π/180 = 225π/180 = 5π/4, a quarter turn past the half turn.
        - |
          3π/4 is 135°; 225° is π/4 beyond a half turn, not short of it.
        - |
          5π/3 is 300°, in quadrant IV; 225° is in quadrant III.
        - |
          Degrees convert by multiplying by π/180, not by π alone.
      answer: 0
    - slug: alg2-u06-w24-q05
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Algebra 2, Unit 6, Lesson 3"
      points: 1
      prompt: |
        What are the exact coordinates of the unit-circle point at θ = π/6?
      options:
        - "(√3/2, 1/2)"
        - "(1/2, √3/2)"
        - "(√2/2, √2/2)"
        - "(1/2, 1/2)"
      option_explanations:
        - |
          Correct. The 30° ray reaches the point whose height is 1/2 and whose x-coordinate is √3/2.
        - |
          (1/2, √3/2) is the point at π/3, where the coordinates are swapped.
        - |
          (√2/2, √2/2) is the point at π/4, where the two coordinates are equal.
        - |
          (1/2, 1/2) is not on the unit circle: (1/2)² + (1/2)² = 1/2, not 1.
      answer: 0
    - slug: alg2-u06-w24-q06
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Algebra 2, Unit 6, Lesson 4"
      points: 1
      prompt: |
        What is cos(2π/3)?
      options:
        - "−1/2"
        - "1/2"
        - "−√3/2"
        - "√3/2"
      option_explanations:
        - |
          Correct. 2π/3 is in quadrant II with reference angle π/3, so the cosine is −cos(π/3) = −1/2.
        - |
          1/2 is cos(π/3); in quadrant II the cosine is negative.
        - |
          −√3/2 is the cosine at 5π/6, where the reference angle is π/6.
        - |
          √3/2 is sin(2π/3), the y-coordinate, not the cosine.
      answer: 0
    - slug: alg2-u06-w24-q07
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Algebra 2, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Which angles in [0, 2π) have sin θ = −√2/2?
      options:
        - "5π/4 and 7π/4"
        - "π/4 and 3π/4"
        - "3π/4 and 5π/4"
        - "7π/4 only"
      option_explanations:
        - |
          Correct. Reference angle π/4 with negative sine puts the points in quadrants III and IV.
        - |
          π/4 and 3π/4 both have sine +√2/2; they lie above the x-axis.
        - |
          3π/4 and 5π/4 share the cosine −√2/2, not the sine.
        - |
          5π/4 also has sine −√2/2; the sine is negative throughout quadrants III and IV.
      answer: 0
    - slug: alg2-u06-w24-q08
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Algebra 2, Unit 6, Lesson 2"
      points: 1
      prompt: |
        A point on the circle of radius 6 is at (3, 3√3). What angle does its ray make with the positive x-axis?
      options:
        - "60°"
        - "30°"
        - "45°"
        - "120°"
      option_explanations:
        - |
          Correct. cos θ = 3/6 = 1/2 and sin θ = 3√3/6 = √3/2, the values at 60°.
        - |
          At 30° the x-coordinate would be the larger one, 3√3, and y would be 3.
        - |
          At 45° the two coordinates would be equal.
        - |
          At 120° the x-coordinate would be negative, −3.
      answer: 0
    - slug: alg2-u06-w24-q09
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Algebra 2, Unit 6, Lesson 3"
      points: 1
      prompt: |
        An angle of 3π/4 is drawn at the centre of a circle of radius 8. How long is the arc it cuts off?
      options:
        - "6π"
        - "3π/32"
        - "24π"
        - "3π/4"
      option_explanations:
        - |
          Correct. Arc length is rθ = 8 · 3π/4 = 6π.
        - |
          3π/32 divides the angle by the radius; the arc multiplies them.
        - |
          24π would need an angle of 3π, more than a full turn.
        - |
          3π/4 is the arc on the unit circle; this circle has radius 8, so it is 8 times longer.
      answer: 0
    - slug: alg2-u06-w24-q10
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Algebra 2, Unit 6, Lesson 4"
      points: 1
      prompt: |
        If cos θ = −0.6 and sin θ = 0.8, which quadrant is the point at angle θ in?
      options:
        - "II"
        - "I"
        - "III"
        - "IV"
      option_explanations:
        - |
          Correct. Negative x and positive y is the upper-left region, quadrant II.
        - |
          Quadrant I has both coordinates positive.
        - |
          Quadrant III has both coordinates negative; here the sine is positive.
        - |
          Quadrant IV has positive x and negative y, the reverse of this point.
      answer: 0
    - slug: alg2-u06-w24-q11
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Algebra 2, Unit 2, Lesson 9"
      points: 1
      prompt: |
        Which value is a zero of p(x) = (x − 2)(x + 5)(x − 1)?
      options:
        - "−5"
        - "5"
        - "2 and −2"
        - "−1"
      option_explanations:
        - |
          Correct. x + 5 = 0 at x = −5, which makes the whole product zero.
        - |
          5 makes x + 5 equal 10, not 0; the zero of that factor is −5.
        - |
          2 is a zero, but −2 is not: no factor vanishes at −2.
        - |
          −1 makes x − 1 equal −2; the zero of that factor is 1.
      answer: 0
    - slug: alg2-u06-w24-q12
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 1
      prompt: |
        What is (2 + 3i)(1 − i)?
      options:
        - "5 + i"
        - "−1 + i"
        - "2 − 3i"
        - "5 − i"
      option_explanations:
        - |
          Correct. 2 − 2i + 3i − 3i² = 2 + i + 3 = 5 + i, using i² = −1.
        - |
          −1 + i treats i² as +1; it is −1, so −3i² adds 3.
        - |
          2 − 3i is the conjugate of the first factor, not the product.
        - |
          The imaginary parts −2i + 3i combine to +i, not −i.
      answer: 0
    - slug: alg2-u06-w24-q13
      type: multiple_choice
      topic_code: "4.14"
      source: "IM Algebra 2, Unit 4, Lesson 14"
      points: 1
      prompt: |
        Solve 5 · 2ˣ = 80.
      options:
        - "x = 4"
        - "x = 16"
        - "x = log₂(80)"
        - "x = 3"
      option_explanations:
        - |
          Correct. Dividing by 5 gives 2ˣ = 16 = 2⁴, so x = 4.
        - |
          16 is 2ˣ, not x; the exponent that gives 16 is 4.
        - |
          Divide by 5 before taking the logarithm; log₂(80) ≈ 6.3 solves 2ˣ = 80.
        - |
          2³ = 8 and 5 · 8 = 40, not 80; the exponent must be one larger.
      answer: 0
    - slug: alg2-u06-w24-q14
      type: multi_select
      topic_code: "6.3"
      source: "IM Algebra 2, Unit 6, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about radians are true? Select all that apply.
      options:
        - "A full turn is 2π radians."
        - "π/3 radians is 60°."
        - "One radian is larger than one degree."
        - "π/2 radians is 45°."
        - "Radian measure of an angle equals the arc length it cuts on the unit circle."
      option_explanations:
        - |
          Correct. The unit circle's circumference is 2π, so a full turn cuts an arc of 2π.
        - |
          Correct. π/3 · 180/π = 60, one sixth of a half turn.
        - |
          Correct. One radian is about 57.3°, since 2π radians make 360°.
        - |
          π/2 is a quarter turn, which is 90°; the angle 45° is π/4 radians.
        - |
          Correct. That is the definition of a radian: arc length on a circle of radius 1.
      answer: [0, 1, 2, 4]
    - slug: alg2-u06-w24-q15
      type: multi_select
      topic_code: "6.4"
      source: "IM Algebra 2, Unit 6, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Which angles have cos θ = 1/2? Select all that apply.
      options:
        - "π/3"
        - "5π/3"
        - "2π/3"
        - "π/6"
        - "−π/3"
      option_explanations:
        - |
          Correct. The first-quadrant angle with cosine 1/2 is π/3.
        - |
          Correct. 5π/3 is in quadrant IV with reference angle π/3, and cosine is positive there.
        - |
          2π/3 is in quadrant II, where the cosine is negative: cos(2π/3) = −1/2.
        - |
          cos(π/6) = √3/2, not 1/2; 1/2 is its sine.
        - |
          Correct. Reflecting π/3 across the x-axis keeps the cosine: cos(−π/3) = 1/2.
      answer: [0, 1, 4]
    - slug: alg2-u06-w24-q16
      type: true_false
      topic_code: "6.4"
      source: "IM Algebra 2, Unit 6, Lesson 4"
      points: 1
      prompt: |
        True or false: for every angle θ, sin(π − θ) = sin θ.
      answer: true
      explanation: |
        True. π − θ is the reflection of θ across the y-axis, which keeps the y-coordinate and so keeps the sine.
    - slug: alg2-u06-w24-q17
      type: true_false
      topic_code: "5.2"
      source: "IM Algebra 2, Unit 5, Lesson 2"
      points: 1
      prompt: |
        True or false: the graph of y = f(x − 2) is the graph of y = f(x) shifted 2 units to the left.
      answer: false
      explanation: |
        False. f(x − 2) reaches f(a) at x = a + 2, so every point moves 2 units to the right.
    - slug: alg2-u06-w24-q18
      type: fill_blank
      topic_code: "6.3"
      source: "IM Algebra 2, Unit 6, Lesson 3"
      points: 1
      prompt: |
        In degrees, 5π/6 radians is ____°
      answer: ["150"]
      explanation: |
        5π/6 · 180/π = 150.
    - slug: alg2-u06-w24-q19
      type: fill_blank
      topic_code: "1.7"
      source: "IM Algebra 2, Unit 1, Lesson 7"
      points: 1
      prompt: |
        The geometric sequence 3, 6, 12, 24, … has 8th term ____
      answer: ["384"]
      explanation: |
        The nth term is 3 · 2^(n−1), so the 8th is 3 · 2⁷ = 3 · 128 = 384.
    - slug: alg2-u06-w24-q20
      type: numeric
      topic_code: "6.1"
      source: "IM Algebra 2, Unit 6, Lesson 1"
      points: 1
      prompt: |
        A point on the circle of radius 13 centred at the origin has x-coordinate 5 and lies below the x-axis. Give its y-coordinate.
      answer: { value: -12, tolerance: 0 }
      explanation: |
        y² = 169 − 25 = 144, and below the axis y = −12.
    - slug: alg2-u06-w24-q21
      type: numeric
      topic_code: "6.2"
      source: "IM Algebra 2, Unit 6, Lesson 2"
      points: 1
      prompt: |
        Give the y-coordinate of the point at 50° on the circle of radius 12, to the nearest hundredth.
      answer: { value: 9.19, tolerance: 0.02 }
      explanation: |
        12 sin 50° ≈ 12 · 0.7660 ≈ 9.19.
    - slug: alg2-u06-w24-q22
      type: numeric
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      prompt: |
        Evaluate 27^(2/3).
      answer: { value: 9, tolerance: 0 }
      explanation: |
        (∛27)² = 3² = 9.
    - slug: alg2-u06-w24-q23
      type: short_answer
      topic_code: "6.4"
      source: "IM Algebra 2, Unit 6, Lesson 4"
      points: 3
      prompt: |
        (a) Give the exact coordinates of the unit-circle point at θ = 7π/6, naming the reference angle and the quadrant.
        (b) Give the coordinates of the point at 7π/6 on the circle of radius 10.
        (c) Find the other angle in [0, 2π) whose point has the same y-coordinate as the point at 7π/6, and explain how you know.
      answer: |
        (a) Reference angle π/6, quadrant III, so (cos, sin) = (−√3/2, −1/2).
        (b) 10 · (−√3/2, −1/2) = (−5√3, −5) ≈ (−8.66, −5).
        (c) 11π/6: the sine is −1/2 wherever the reference angle is π/6 and the point is below the x-axis, which is quadrants III and IV; the quadrant IV angle is 2π − π/6 = 11π/6.
      explanation: |
        Three points, one per part. (a) (−√3/2, −1/2) with reference angle and quadrant named. (b) (−5√3, −5). (c) 11π/6 with the reasoning that sine is negative in quadrants III and IV.
    - slug: alg2-u06-w24-q24
      type: short_answer
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 3
      prompt: |
        (a) Evaluate log₂(32) and log(0.001).
        (b) Solve 3ˣ = 50, giving an exact expression and a decimal to two places.
        (c) Explain how you can tell, without a calculator, that your answer to (b) is between 3 and 4.
      answer: |
        (a) log₂(32) = 5 because 2⁵ = 32; log(0.001) = −3 because 10⁻³ = 0.001.
        (b) x = log₃(50) = ln 50 / ln 3 ≈ 3.56.
        (c) 3³ = 27 < 50 < 81 = 3⁴, so the exponent that gives 50 is between 3 and 4.
      explanation: |
        Three points, one per part. (a) 5 and −3. (b) log₃(50) ≈ 3.56 in exact and decimal form. (c) the bracket 27 < 50 < 81.
    - slug: alg2-u06-w24-q25
      type: long_answer
      topic_code: "6.2"
      source: "IM Algebra 2, Unit 6, Lesson 2"
      points: 6
      prompt: |
        A Ferris wheel has radius 15 metres and its centre is 17 metres above the ground. A rider starts at the 3 o'clock position (level with the centre) and the wheel turns counterclockwise. Write a full response that (1) explains why the rider's position relative to the centre after turning through an angle θ is (15 cos θ, 15 sin θ), (2) finds the rider's height above the ground after turning 60°, 150° and 270°, with exact values, (3) finds, to the nearest tenth of a degree, the first angle at which the rider is 25 metres above the ground, and (4) explains why there is a second angle in the first turn with the same height and finds it.
      answer: |
        (1) Drop a perpendicular from the rider to the horizontal line through the centre. The right triangle has hypotenuse 15 (the spoke) and angle θ at the centre, so the horizontal leg is 15 cos θ and the vertical leg is 15 sin θ; these are the coordinates relative to the centre.
        (2) Height = 17 + 15 sin θ. At 60°: 17 + 15 · √3/2 = 17 + 7.5√3 ≈ 30.0 m. At 150°: 17 + 15 · 1/2 = 24.5 m. At 270°: 17 + 15 · (−1) = 2 m.
        (3) 17 + 15 sin θ = 25 gives sin θ = 8/15 ≈ 0.5333, so θ ≈ 32.2°.
        (4) The sine is the same at θ and at 180° − θ (reflection across the y-axis keeps the height), so the rider is again at 25 m at about 180° − 32.2° = 147.8°, on the way down.
      explanation: |
        Six points: 1 for the right-triangle argument in (1); 2 for the three exact heights in (2); 2 for sin θ = 8/15 and θ ≈ 32.2° in (3); 1 for 147.8° with the symmetry reason in (4).
