        Three points, one per part. (a) right 3, up 2, start (3, 2). (b) x ≥ 3 and y ≥ 2. (c) (7, 4).
    - slug: alg2-u06-w26-q25
      type: long_answer
      topic_code: "6.12"
      source: "IM Algebra 2, Unit 6, Lesson 12"
      points: 6
      prompt: |
        A searchlight at the origin turns counterclockwise, and its beam at angle θ (measured from the positive x-axis) shines onto a long straight wall along the line x = 10. Let h(θ) be the y-coordinate of the spot of light on the wall. Write a full response that (1) explains why h(θ) = 10 tan θ, (2) finds h at θ = π/6, π/4 and π/3 exactly and as decimals, (3) describes what happens to the spot as θ increases toward π/2 and says for which angles in (0, π) the beam misses the wall entirely, and (4) explains why h(θ + π) = h(θ) and what that means physically.
      answer: |
        (1) The beam is the ray at angle θ, a line through the origin with slope tan θ, so its equation is y = (tan θ)x. On the wall x = 10, so the spot is at height y = 10 tan θ.
        (2) h(π/6) = 10 · √3/3 = 10√3/3 ≈ 5.77; h(π/4) = 10 · 1 = 10; h(π/3) = 10√3 ≈ 17.32.
        (3) As θ approaches π/2, tan θ grows without bound, so the spot races up the wall and never reaches a highest point; at θ = π/2 the beam is vertical and parallel to the wall, so there is no spot. For π/2 < θ < π the beam points into the left half-plane (x < 0) and never meets the wall at x = 10, so the beam misses the wall for every θ in [π/2, π).
        (4) Turning by π reverses the beam's direction: the ray at θ + π is the same line as the ray at θ, with slope tan(θ + π) = (−sin θ)/(−cos θ) = tan θ. So h(θ + π) = 10 tan θ = h(θ). Physically, the beam pointing the opposite way lies along the same line, so if it were extended backwards it would hit the wall at the same spot; the light itself only reaches the wall when the beam points toward x > 0.
      explanation: |
        Six points: 1 for the slope argument in (1); 2 for the three values in (2) (1 point if two are right); 2 for (3), one for the unbounded growth near π/2 and one for the interval [π/2, π) where the beam misses the wall; 1 for the same-line argument in (4).
