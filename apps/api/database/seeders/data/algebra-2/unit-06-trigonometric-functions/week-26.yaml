        Let g(x) = √(x − 3) + 2, a transformation of f(x) = √x.
        (a) Describe the transformation in words and give the starting point of the graph of g.
        (b) Give the domain and range of g.
        (c) The point (4, 2) is on the graph of f. Which point on the graph of g does it become?
      answer: |
        (a) Shift right 3 and up 2; the graph starts at (3, 2).
        (b) Domain x ≥ 3 (the radicand must be nonnegative); range y ≥ 2.
        (c) (4 + 3, 2 + 2) = (7, 4); check: √(7 − 3) + 2 = 2 + 2 = 4.
