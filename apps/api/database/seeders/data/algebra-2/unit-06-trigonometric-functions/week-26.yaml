week: 26
unit: 6
title: "The Graphs of Sine, Cosine and Tangent"
topics: ["6.9", "6.10", "6.11", "6.12"]
guide: guides/week-26.md
guide_description: |
  Sine and cosine as functions of the angle and their graphs on [0, 2π]; angles beyond 2π, coterminal angles
  and the period 2π; negative angles, the even symmetry of cosine and the odd symmetry of sine, with domain
  and range; and tangent as the slope of the ray, with its asymptotes, period π and graph.
flashcards_description: |
  30 cards on the sine and cosine graphs, coterminal angles and period, negative angles and symmetry, and tangent.

flashcards:
  - front: y = sin θ as a function → what it records
    back: |
      The height (y-coordinate) of the unit-circle point at angle θ, plotted against θ. Its graph is a wave.
    topic_code: "6.9"
  - front: Graph of y = sin θ on [0, 2π] → shape in words
    back: |
      Starts at (0, 0), rises to (π/2, 1), falls through (π, 0) to (3π/2, −1), returns to (2π, 0). Steep at the zeros, flat at the peaks.
    topic_code: "6.9"
  - front: Graph of y = cos θ on [0, 2π] → shape in words
    back: |
      Starts at its maximum (0, 1), falls through (π/2, 0) to (π, −1), rises through (3π/2, 0) back to (2π, 1).
    topic_code: "6.9"
  - front: Zeros of sin θ on [0, 2π]
    back: |
      0, π and 2π: the angles where the circling point is on the x-axis.
    topic_code: "6.9"
  - front: Zeros of cos θ on [0, 2π]
    back: |
      π/2 and 3π/2: the angles where the point is on the y-axis.
    topic_code: "6.9"
  - front: Maximum and minimum of sin θ and where they occur
    back: |
      Maximum 1 at θ = π/2 (the top of the circle); minimum −1 at θ = 3π/2 (the bottom).
    topic_code: "6.9"
  - front: How the cosine graph relates to the sine graph
    back: |
      Cosine is the sine wave shifted π/2 to the left: cos θ = sin(θ + π/2). Cosine starts at a peak where sine starts at a zero.
    topic_code: "6.9"
  - front: Where the sine graph is steepest and where it is flattest
    back: |
      Steepest at its zeros (0, π, 2π), where the circling point moves almost vertically; flat at its peaks, where the point moves almost horizontally.
    topic_code: "6.9"
  - front: Coterminal angles → definition
    back: |
      Angles whose rays coincide: θ and θ + 2πk for any integer k. They have the same cosine and sine.
    topic_code: "6.10"
  - front: Period of sin θ and cos θ
    back: |
      2π. A full turn brings the point back where it started, so the graph on [0, 2π] repeats on every interval of length 2π.
    topic_code: "6.10"
  - front: sin(17π/4) → evaluate
    back: |
      17π/4 − 4π = π/4, so sin(17π/4) = sin(π/4) = √2/2.
    topic_code: "6.10"
  - front: cos(10π/3) → evaluate
    back: |
      10π/3 − 2π = 4π/3, quadrant III with reference angle π/3, so cos(10π/3) = −1/2.
    topic_code: "6.10"
  - front: Angle in [0, 2π) coterminal with 31π/4
    back: |
      31π/4 − 6π = 31π/4 − 24π/4 = 7π/4.
    topic_code: "6.10"
  - front: Angle turned through in 4.5 revolutions
    back: |
      4.5 · 2π = 9π. Four full turns are 8π, so the point ends at angle π, directly opposite its start.
    topic_code: "6.10"
  - front: Three angles other than π/3 whose sine is √3/2
    back: |
      7π/3 and 13π/3 (coterminal with π/3), and 2π/3 (the other point at height √3/2). Add any multiple of 2π to either for more.
    topic_code: "6.10"
  - front: Negative angle → direction of turning
    back: |
      Clockwise from the positive x-axis. −π/2 is the bottom of the circle; −π/6 is the reflection of π/6 across the x-axis.
    topic_code: "6.11"
  - front: cos(−θ) in terms of cos θ
    back: |
      cos(−θ) = cos θ. Reflecting across the x-axis keeps the x-coordinate, so cosine is an even function.
    topic_code: "6.11"
  - front: sin(−θ) in terms of sin θ
    back: |
      sin(−θ) = −sin θ. Reflecting across the x-axis flips the y-coordinate, so sine is an odd function.
    topic_code: "6.11"
  - front: Domain and range of sin θ and of cos θ
    back: |
      Domain all real numbers (any angle, positive or negative, however large); range [−1, 1].
    topic_code: "6.11"
  - front: sin(−5π/6) and cos(−5π/6)
    back: |
      sin(−5π/6) = −sin(5π/6) = −1/2; cos(−5π/6) = cos(5π/6) = −√3/2.
    topic_code: "6.11"
  - front: All solutions of cos θ = 0
    back: |
      θ = π/2 + πk for every integer k: …, −π/2, π/2, 3π/2, 5π/2, … The zeros are spaced π apart.
    topic_code: "6.11"
  - front: All solutions of sin θ = 1
    back: |
      θ = π/2 + 2πk for every integer k: only the top of the circle, reached once per turn.
    topic_code: "6.11"
  - front: tan θ → definition from the unit circle
    back: |
      tan θ = sin θ / cos θ, the slope of the ray at angle θ. It equals y/x for any point (x, y) on that ray.
    topic_code: "6.12"
  - front: Where tan θ is undefined
    back: |
      Wherever cos θ = 0: at π/2, 3π/2, −π/2, … (odd multiples of π/2), where the ray is vertical. The graph has a vertical asymptote at each.
    topic_code: "6.12"
  - front: Period of tan θ and why
    back: |
      π. The ray at θ + π is the same line as the ray at θ (both coordinates flip), so the slope is the same.
    topic_code: "6.12"
  - front: tan θ at π/6, π/4 and π/3
    back: |
      √3/3, 1 and √3: the ratios (1/2)/(√3/2), (√2/2)/(√2/2) and (√3/2)/(1/2).
    topic_code: "6.12"
  - front: Quadrants where tan θ is positive
    back: |
      I and III, where sin θ and cos θ have the same sign. Negative in II and IV.
    topic_code: "6.12"
  - front: Graph of y = tan θ on (−π/2, π/2) → shape in words
    back: |
      Increasing throughout, from very large negative values near θ = −π/2 through (−π/4, −1), (0, 0), (π/4, 1), to very large positive values near θ = π/2. Vertical asymptotes at ±π/2.
    topic_code: "6.12"
  - front: tan(7π/6) and tan(−π/3)
    back: |
      tan(7π/6) = tan(π/6) = √3/3 (period π); tan(−π/3) = −tan(π/3) = −√3 (odd).
    topic_code: "6.12"
  - front: Range of tan θ
    back: |
      All real numbers. Unlike sine and cosine, tangent has no maximum or minimum; each branch runs from −∞ to ∞.
    topic_code: "6.12"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 6.9 to 6.12: the sine and cosine graphs,
    angles beyond 2π, negative angles and tangent), with about a quarter reviewing earlier units. Includes a
    shared-context set on a wave described in words. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a described wave (6.9, 6.10, 6.11)
    - slug: alg2-u06-w26-q01
      type: multiple_choice
      topic_code: "6.9"
      source: "IM Algebra 2, Unit 6, Lesson 9"
      points: 1
      stimulus: |
        Graph description: the graph of y = f(θ) is a wave through (0, 0), rising to (π/2, 1), falling through (π, 0) to (3π/2, −1) and back to (2π, 0), and repeating in both directions every 2π.
      prompt: |
        Which function is f?
      options:
        - "f(θ) = cos θ"
        - "f(θ) = −sin θ"
        - "f(θ) = tan θ"
        - "f(θ) = sin θ"
      option_explanations:
        - |
          Cosine starts at its maximum, (0, 1), not at (0, 0).
        - |
          −sin θ falls first, to −1 at π/2; this graph rises to 1 at π/2.
        - |
          Tangent is not a wave: it has vertical asymptotes and no maximum of 1.
        - |
          Correct. Sine starts at 0, peaks at π/2 and is lowest at 3π/2, exactly as described.
      answer: 3
    - slug: alg2-u06-w26-q02
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Algebra 2, Unit 6, Lesson 11"
      points: 1
      stimulus: |
        Graph description: the graph of y = f(θ) is a wave through (0, 0), rising to (π/2, 1), falling through (π, 0) to (3π/2, −1) and back to (2π, 0), and repeating in both directions every 2π.
      prompt: |
        What is f(−π/2)?
      options:
        - "0"
        - "undefined"
        - "−1"
        - "1"
      option_explanations:
        - |
          The zeros are at multiples of π; −π/2 is halfway between two of them, at a trough.
        - |
          The wave is defined for every real θ, negative angles included.
        - |
          Correct. Moving left from (0, 0) by a quarter period reaches the bottom of the wave: f(−π/2) = −f(π/2) = −1.
        - |
          1 is f(π/2); the wave is odd, so the value at −π/2 is the opposite.
      answer: 2
    - slug: alg2-u06-w26-q03
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Algebra 2, Unit 6, Lesson 10"
      points: 1
      stimulus: |
        Graph description: the graph of y = f(θ) is a wave through (0, 0), rising to (π/2, 1), falling through (π, 0) to (3π/2, −1) and back to (2π, 0), and repeating in both directions every 2π.
      prompt: |
        What is f(9π/2)?
      options:
        - "1"
        - "9/2"
        - "0"
        - "−1"
      option_explanations:
        - |
          Correct. 9π/2 − 4π = π/2, two full periods past the first peak, so f(9π/2) = f(π/2) = 1.
        - |
          The outputs of this wave never leave [−1, 1].
        - |
          The zeros are at multiples of π; 9π/2 is an odd multiple of π/2.
        - |
          −1 would be the value at 3π/2 + 2πk; 9π/2 is 4π past π/2, a peak.
      answer: 0
    - slug: alg2-u06-w26-q04
      type: multiple_choice
      topic_code: "6.9"
      source: "IM Algebra 2, Unit 6, Lesson 9"
      points: 1
      stimulus: |
        Graph description: the graph of y = f(θ) is a wave through (0, 0), rising to (π/2, 1), falling through (π, 0) to (3π/2, −1) and back to (2π, 0), and repeating in both directions every 2π.
      prompt: |
        For which θ in [0, 2π] is f(θ) = −1/2?
      options:
        - "7π/6 only"
        - "7π/6 and 11π/6"
        - "5π/6 and 7π/6"
        - "π/6 and 5π/6"
      option_explanations:
        - |
          The horizontal line y = −1/2 meets the wave twice per period, once falling and once rising.
        - |
          Correct. sin θ = −1/2 where the reference angle is π/6 and the point is below the axis: quadrants III and IV.
        - |
          5π/6 has f = +1/2 and 7π/6 has f = −1/2; they share a cosine, not a sine.
        - |
          At π/6 and 5π/6 the wave is at +1/2, above the axis.
      answer: 1
    # ---- Single items on this week
    - slug: alg2-u06-w26-q05
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Algebra 2, Unit 6, Lesson 10"
      points: 1
      prompt: |
        What is sin(13π/6)?
      options:
        - "√3/2"
        - "13/6"
        - "−1/2"
        - "1/2"
      option_explanations:
        - |
          √3/2 is cos(π/6), the x-coordinate; the sine is the height, 1/2.
        - |
          A sine value is a coordinate on the unit circle, never larger than 1.
        - |
          −1/2 is sin(7π/6) or sin(11π/6); 13π/6 is coterminal with π/6, in quadrant I.
        - |
          Correct. 13π/6 − 2π = π/6, and sin(π/6) = 1/2.
      answer: 3
    - slug: alg2-u06-w26-q06
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Algebra 2, Unit 6, Lesson 10"
      points: 1
      prompt: |
        What is cos(7π/2)?
      options:
        - "1"
        - "−1"
        - "0"
        - "√2/2"
      option_explanations:
        - |
          1 is cos 0 or cos 2π; subtracting 2π from 7π/2 leaves 3π/2, not a multiple of 2π.
        - |
          −1 is cos π; 7π/2 is coterminal with 3π/2, not with π.
        - |
          Correct. 7π/2 − 2π = 3π/2, the bottom of the circle, where the x-coordinate is 0.
        - |
          √2/2 belongs to π/4 and its relatives; 7π/2 is an odd multiple of π/2, on the y-axis.
      answer: 2
    - slug: alg2-u06-w26-q07
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Algebra 2, Unit 6, Lesson 11"
      points: 1
      prompt: |
        Which equation is true for every angle θ?
      options:
        - "cos(−θ) = cos θ"
        - "cos(−θ) = −cos θ"
        - "sin(−θ) = sin θ"
        - "tan(−θ) = tan θ"
      option_explanations:
        - |
          Correct. The points at θ and −θ are reflections across the x-axis, which keeps the x-coordinate.
        - |
          This fails at θ = 0, where cos 0 = 1 but −cos 0 = −1.
        - |
          Reflecting across the x-axis flips the height: sin(−θ) = −sin θ.
        - |
          Tangent is odd: tan(−θ) = −tan θ, since the sine changes sign and the cosine does not.
      answer: 0
    - slug: alg2-u06-w26-q08
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Algebra 2, Unit 6, Lesson 11"
      points: 1
      prompt: |
        What are the domain and range of y = cos θ?
      options:
        - "Domain [0, 2π]; range [−1, 1]"
        - "Domain all real numbers; range [−1, 1]"
        - "Domain [−1, 1]; range all real numbers"
        - "Domain all real numbers; range all real numbers"
      option_explanations:
        - |
          Angles beyond 2π and negative angles are allowed; the graph continues in both directions.
        - |
          Correct. Any angle, positive or negative, has a cosine, and that cosine is an x-coordinate on the unit circle.
        - |
          This swaps the two: the inputs are angles, the outputs are between −1 and 1.
        - |
          The outputs are coordinates on the unit circle, so they stay between −1 and 1.
      answer: 1
    - slug: alg2-u06-w26-q09
      type: multiple_choice
      topic_code: "6.12"
      source: "IM Algebra 2, Unit 6, Lesson 12"
      points: 1
      prompt: |
        What is tan(5π/6)?
      options:
        - "−1/2"
        - "−√3/3"
        - "√3/3"
        - "−√3"
      option_explanations:
        - |
          −1/2 is not a tangent value here; divide the sine 1/2 by the cosine −√3/2.
        - |
          Correct. tan(5π/6) = sin(5π/6)/cos(5π/6) = (1/2)/(−√3/2) = −1/√3 = −√3/3.
        - |
          √3/3 is tan(π/6); in quadrant II the cosine is negative, so the tangent is negative.
        - |
          −√3 is tan(2π/3), where the reference angle is π/3.
      answer: 1
    - slug: alg2-u06-w26-q10
      type: multiple_choice
      topic_code: "6.12"
      source: "IM Algebra 2, Unit 6, Lesson 12"
      points: 1
      prompt: |
        For which angle is tan θ undefined?
      options:
        - "3π/4"
        - "π"
        - "0"
        - "3π/2"
      option_explanations:
        - |
          tan(3π/4) = (√2/2)/(−√2/2) = −1, defined.
        - |
          tan π = 0/(−1) = 0; the ray at π is horizontal, with slope 0.
        - |
          tan 0 = 0/1 = 0: the ray at angle 0 is horizontal and has slope 0, so the tangent is defined.
        - |
          Correct. cos(3π/2) = 0, so the ray is vertical and has no slope.
      answer: 3
    - slug: alg2-u06-w26-q11
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Algebra 2, Unit 5, Lesson 5"
      points: 1
      prompt: |
        Which of these functions is odd, so that f(−x) = −f(x) for every x?
      options:
        - "f(x) = x³ − x"
        - "f(x) = |x|"
        - "f(x) = x³ + 1"
        - "f(x) = x² + 1"
      option_explanations:
        - |
          Correct. f(−x) = −x³ + x = −(x³ − x) = −f(x) for every x.
        - |
          |x| is even, since |−x| = |x| for every x; its graph is a V symmetric about the y-axis.
        - |
          x³ + 1 is neither: f(1) = 2 but f(−1) = 0, which is neither 2 nor −2.
        - |
          x² + 1 is even: f(−x) = f(x). Its graph is symmetric about the y-axis.
      answer: 0
    - slug: alg2-u06-w26-q12
      type: multiple_choice
      topic_code: "2.19"
      source: "IM Algebra 2, Unit 2, Lesson 19"
      points: 1
      prompt: |
        What is the horizontal asymptote of g(x) = (3x² + 1)/(x² − 4)?
      options:
        - "y = 0"
        - "y = −1/4"
        - "y = 3"
        - "x = 2"
      option_explanations:
        - |
          y = 0 would need the denominator's degree to exceed the numerator's; here they are equal.
        - |
          −1/4 is g(0), the y-intercept, not the long-run value.
        - |
          Correct. Numerator and denominator have the same degree, so the ratio approaches 3/1 for large |x|.
        - |
          x = 2 is a vertical asymptote (the denominator is 0 there); a horizontal asymptote is a y-value.
      answer: 2
    - slug: alg2-u06-w26-q13
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        What is log(1000) + log₂(1/8)?
      options:
        - "0"
        - "−6"
        - "6"
        - "1"
      option_explanations:
        - |
          Correct. log(1000) = 3 since 10³ = 1000, and log₂(1/8) = −3 since 2⁻³ = 1/8; the sum is 0.
        - |
          −6 has both signs wrong: log(1000) is positive 3.
        - |
          6 treats log₂(1/8) as +3; a fraction less than 1 has a negative logarithm.
        - |
          1 would be log(10) alone; log(1000) is 3, and the second term still has to be added.
      answer: 0
    - slug: alg2-u06-w26-q14
      type: multi_select
      topic_code: "6.10"
      source: "IM Algebra 2, Unit 6, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Which angles have the same sine as π/3? Select all that apply.
      options:
        - "7π/3"
        - "−5π/3"
        - "4π/3"
        - "−π/3"
        - "2π/3"
      option_explanations:
        - |
          Correct. 7π/3 = π/3 + 2π is coterminal with π/3.
        - |
          Correct. −5π/3 + 2π = π/3, so the two angles are coterminal.
        - |
          4π/3 is in quadrant III, where the sine is −√3/2.
        - |
          −π/3 is the reflection across the x-axis; its sine is −√3/2.
        - |
          Correct. 2π/3 is the reflection of π/3 across the y-axis, which keeps the height √3/2.
      answer: [0, 1, 4]
    - slug: alg2-u06-w26-q15
      type: multi_select
      topic_code: "6.12"
      source: "IM Algebra 2, Unit 6, Lesson 12"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the tangent function are true? Select all that apply.
      options:
        - "tan θ takes every real value."
        - "The period of tan θ is 2π."
        - "tan(−θ) = tan θ for every θ."
        - "tan θ = sin θ / cos θ."
        - "The graph of y = tan θ has a vertical asymptote at every θ = π/2 + πk."
      option_explanations:
        - |
          Correct. Each branch runs from −∞ to ∞; the range is all real numbers.
        - |
          The period is π: the ray at θ + π is the same line, so the slope repeats every half turn.
        - |
          Tangent is odd, tan(−θ) = −tan θ, because the sine changes sign while the cosine does not.
        - |
          Correct. The tangent is the slope of the ray through (cos θ, sin θ), rise over run.
        - |
          Correct. Those are the angles where the cosine is 0 and the ray is vertical.
      answer: [0, 3, 4]
    - slug: alg2-u06-w26-q16
      type: true_false
      topic_code: "6.11"
      source: "IM Algebra 2, Unit 6, Lesson 11"
      points: 1
      prompt: |
        True or false: sin(−θ) = −sin θ for every angle θ.
      answer: true
      explanation: |
        True. The point at −θ is the reflection of the point at θ across the x-axis, which flips the y-coordinate; sine is an odd function.
    - slug: alg2-u06-w26-q17
      type: true_false
      topic_code: "3.16"
      source: "IM Algebra 2, Unit 3, Lesson 16"
      points: 1
      prompt: |
        True or false: the equation x² + 9 = 0 has the solutions x = 3i and x = −3i.
      answer: true
      explanation: |
        True. x² = −9, so x = ±√(−9) = ±3i; check: (3i)² = 9i² = −9.
    - slug: alg2-u06-w26-q18
      type: fill_blank
      topic_code: "6.10"
      source: "IM Algebra 2, Unit 6, Lesson 10"
      points: 1
      prompt: |
        The angle in [0, 2π) that is coterminal with 23π/6 is ____
      answer: ["11π/6", "11pi/6", "11π/6 radians"]
      explanation: |
        23π/6 − 2π = 23π/6 − 12π/6 = 11π/6.
    - slug: alg2-u06-w26-q19
      type: fill_blank
      topic_code: "1.11"
      source: "IM Algebra 2, Unit 1, Lesson 11"
      points: 1
      prompt: |
        The sum 2 + 4 + 6 + … + 20 of the first ten positive even numbers is ____
      answer: ["110"]
      explanation: |
        Ten terms with first term 2 and last term 20: 10 · (2 + 20)/2 = 110.
    - slug: alg2-u06-w26-q20
      type: numeric
      topic_code: "6.12"
      source: "IM Algebra 2, Unit 6, Lesson 12"
      points: 1
      prompt: |
        The point at angle θ on the circle of radius 10 is (−6, 8). Give tan θ to two decimal places.
      answer: { value: -1.33, tolerance: 0.01 }
      explanation: |
        tan θ = y/x = 8/(−6) = −4/3 ≈ −1.33. The radius cancels, so the ratio of the coordinates is enough.
    - slug: alg2-u06-w26-q21
      type: numeric
      topic_code: "6.11"
      source: "IM Algebra 2, Unit 6, Lesson 11"
      points: 1
      prompt: |
        Evaluate sin(−π/2) + cos(−π). Give an exact integer.
      answer: { value: -2, tolerance: 0 }
      explanation: |
        sin(−π/2) = −sin(π/2) = −1 and cos(−π) = cos π = −1, so the sum is −2.
    - slug: alg2-u06-w26-q22
      type: numeric
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      prompt: |
        Evaluate 16^(3/4).
      answer: { value: 8, tolerance: 0 }
      explanation: |
        16^(1/4) = 2 and 2³ = 8.
    - slug: alg2-u06-w26-q23
