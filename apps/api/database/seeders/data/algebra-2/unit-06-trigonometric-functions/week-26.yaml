      source: "IM Algebra 2, Unit 6, Lesson 11"
      points: 3
      prompt: |
        (a) Evaluate cos(−7π/3), showing the steps.
        (b) Give all solutions of cos θ = 1/2.
        (c) Explain, using the unit circle, why sin(θ + 2π) = sin θ for every θ.
      answer: |
        (a) cos(−7π/3) = cos(7π/3) because cosine is even; 7π/3 − 2π = π/3, so the value is cos(π/3) = 1/2.
        (b) θ = π/3 + 2πk or θ = −π/3 + 2πk (equivalently 5π/3 + 2πk) for any integer k: the two unit-circle points with x-coordinate 1/2, repeated every full turn.
        (c) Adding 2π to an angle is one extra full turn, which brings the ray back to the same point on the circle; the point's y-coordinate, the sine, is therefore unchanged.
      explanation: |
        Three points, one per part. (a) 1/2 with the even-function step and the subtraction of 2π. (b) both families ±π/3 + 2πk (1 point only if both are present). (c) the full-turn argument.
