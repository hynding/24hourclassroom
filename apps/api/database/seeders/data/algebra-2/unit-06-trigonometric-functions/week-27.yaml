      type: short_answer
      topic_code: "2.15"
      source: "IM Algebra 2, Unit 2, Lesson 15"
      points: 3
      prompt: |
        Let p(x) = x³ − 2x² + x − 5.
        (a) Use the remainder theorem to find the remainder when p(x) is divided by x − 2.
        (b) Decide whether x − 1 is a factor of p(x), and explain.
        (c) State the remainder theorem in your own words.
      answer: |
        (a) p(2) = 8 − 8 + 2 − 5 = −3, so the remainder is −3.
        (b) p(1) = 1 − 2 + 1 − 5 = −5, which is not 0, so x − 1 is not a factor.
        (c) When a polynomial p(x) is divided by x − a, the remainder is p(a); in particular x − a is a factor exactly when p(a) = 0.
      explanation: |
        Three points, one per part. (a) −3. (b) not a factor, because p(1) = −5 ≠ 0. (c) remainder equals p(a).
    - slug: alg2-u06-w27-q25
      type: long_answer
      topic_code: "6.13"
      source: "IM Algebra 2, Unit 6, Lesson 13"
      points: 6
      prompt: |
        A Ferris wheel of radius 10 m has its centre 12 m above the ground. A rider boards at the lowest point and the wheel turns counterclockwise through an angle θ. Write a full response that (1) explains why the rider's height is h(θ) = 12 − 10 cos θ, (2) states the midline, amplitude, maximum and minimum of h and what each means for the ride, (3) finds the height at θ = π/3, θ = π and θ = 5π/3, and (4) finds the first two angles at which the rider is exactly 17 m above the ground, showing the equation you solve.
      answer: |
        (1) Measured from the centre, the rider's vertical position is 10 sin of the angle from the positive x-axis. Starting at the bottom means starting at angle −π/2, so that position is 10 sin(θ − π/2) = −10 cos θ (the sine wave moved right π/2 is the cosine wave reflected). Adding the centre height: h(θ) = 12 − 10 cos θ. Check: at θ = 0, h = 2, the bottom of the wheel, 2 m up.
        (2) Midline y = 12 (the height of the centre), amplitude 10 (the radius), maximum 22 m (the top, reached at θ = π), minimum 2 m (the boarding height, at θ = 0 and 2π).
        (3) h(π/3) = 12 − 10(1/2) = 7 m; h(π) = 12 − 10(−1) = 22 m; h(5π/3) = 12 − 10(1/2) = 7 m.
        (4) 12 − 10 cos θ = 17 gives cos θ = −1/2, so θ = 2π/3 (on the way up) and θ = 4π/3 (on the way down). Check: 12 − 10(−1/2) = 17 ✓.
      explanation: |
        Six points: 2 for (1), one for the −cos θ reasoning (starting at the bottom) and one for the +12; 1 for all four features in (2); 1 for the three heights in (3); 2 for (4), one for cos θ = −1/2 and one for both angles 2π/3 and 4π/3.
