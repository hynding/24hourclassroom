week: 27
unit: 6
title: "Amplitude, Midline, Shift and Period"
topics: ["6.13", "6.14", "6.15", "6.16"]
guide: guides/week-27.md
guide_description: |
  Unit 5's transformations applied to sine and cosine: amplitude and midline from a · sin θ + k, horizontal
  shifts from sin(θ − h) and why cosine is a shifted sine, the period 2π/b of sin(bθ), and reading or writing
  all four features in y = a sin(b(θ − h)) + k from a graph, a description or an equation.
flashcards_description: |
  28 cards on amplitude, midline, horizontal shift, period and the general form of a transformed sine or cosine.

flashcards:
  - front: Midline of y = a sin θ + k
    back: |
      The line y = k, halfway between the maximum and the minimum: k = (max + min)/2.
    topic_code: "6.13"
  - front: Amplitude of y = a sin θ + k
    back: |
      |a|, the distance from the midline to the maximum: (max − min)/2.
    topic_code: "6.13"
  - front: Maximum and minimum of y = a cos θ + k
    back: |
      Maximum k + |a|, minimum k − |a|. For y = 2 cos θ − 3: maximum −1, minimum −5.
    topic_code: "6.13"
  - front: Effect of a negative a in y = a sin θ + k
    back: |
      The wave is reflected across its midline, so it heads down first instead of up. The amplitude is still |a|.
    topic_code: "6.13"
  - front: Windmill tip with blade 5 m and hub 8 m up → height function
    back: |
      h(θ) = 8 + 5 sin θ for a tip starting level with the hub. Midline 8, amplitude 5, highest 13 m, lowest 3 m.
    topic_code: "6.13"
  - front: Midline and amplitude from a maximum of 11 and a minimum of 5
    back: |
      Midline (11 + 5)/2 = 8, amplitude (11 − 5)/2 = 3.
    topic_code: "6.13"
  - front: Height of a Ferris-wheel rider who starts at the top (radius 20 m, centre 24 m up)
    back: |
      h = 24 + 20 cos θ: cosine starts at its maximum, 44 m. A rider starting at 3 o'clock is 24 + 20 sin θ.
    topic_code: "6.13"
  - front: y = sin(θ − h) → effect of h
    back: |
      The sine wave moved h to the right (left if h is negative), as with f(x − h). It crosses its midline going up at θ = h instead of at 0.
    topic_code: "6.14"
  - front: cos θ written as a shifted sine
    back: |
      cos θ = sin(θ + π/2): the sine wave moved π/2 to the left. Check: sin(π/2) = 1 = cos 0.
    topic_code: "6.14"
  - front: sin θ written as a shifted cosine
    back: |
      sin θ = cos(θ − π/2): the cosine wave moved π/2 to the right.
    topic_code: "6.14"
  - front: Wave rising through its midline at π/4 with a peak at 3π/4 → equation
    back: |
      y = sin(θ − π/4), or equally y = cos(θ − 3π/4). One graph, many equations.
    topic_code: "6.14"
  - front: First maximum of y = cos(θ + π/3) for θ ≥ 0
    back: |
      Cosine peaks where its argument is 0, at θ = −π/3; one period later, at θ = 5π/3.
    topic_code: "6.14"
  - front: Why one wave has many correct equations
    back: |
      Sine and cosine forms differ by a shift of π/2, and shifting by any multiple of the period gives the same graph. Check an equation by evaluating a point.
    topic_code: "6.14"
  - front: Period of y = sin(bθ), b > 0
    back: |
      2π/b. The argument bθ completes 2π when θ = 2π/b, so one full wave fits in that length.
    topic_code: "6.15"
  - front: Number of full waves of y = sin(bθ) in [0, 2π]
    back: |
      b waves. sin(2θ) makes two, cos(4θ) makes four, sin(θ/3) makes one third of a wave.
    topic_code: "6.15"
  - front: Period of y = cos(4θ)
    back: |
      2π/4 = π/2.
    topic_code: "6.15"
  - front: Period of y = sin(θ/3)
    back: |
      2π ÷ (1/3) = 6π: the wave is stretched to three times its usual length.
    topic_code: "6.15"
  - front: Period of y = 5 sin(πθ)
    back: |
      2π/π = 2. The amplitude 5 has no effect on the period.
    topic_code: "6.15"
  - front: Sine function with period 10 → equation
    back: |
      b = 2π/10 = π/5, so y = sin((π/5)θ).
    topic_code: "6.15"
  - front: Telling apart y = 2 sin θ, y = sin(2θ) and y = sin θ + 2
    back: |
      2 sin θ has amplitude 2 (max 2, min −2); sin(2θ) has period π (two peaks in [0, 2π]); sin θ + 2 has midline 2 (max 3, min 1).
    topic_code: "6.15"
  - front: General form y = a sin(b(θ − h)) + k → the four features
    back: |
      Amplitude |a|, period 2π/b, horizontal shift h (right if positive), midline y = k. Same for cosine.
    topic_code: "6.16"
  - front: Shift of y = sin(2θ − π/2)
    back: |
      Factor first: 2θ − π/2 = 2(θ − π/4), so the shift is π/4 to the right, not π/2.
    topic_code: "6.16"
  - front: Writing an equation from a graphed wave → the steps
    back: |
      Midline = (max + min)/2; amplitude = (max − min)/2; period = peak-to-peak distance, b = 2π/period; shift = where a cosine cycle peaks (or a sine cycle rises through the midline). Then check a point.
    topic_code: "6.16"
  - front: Wave with maximum 9 at θ = 1 and minimum 1 at θ = 3 → equation
    back: |
      Midline 5, amplitude 4, period 4 (peak to trough is half a period), b = π/2: y = 4 cos((π/2)(θ − 1)) + 5.
    topic_code: "6.16"
  - front: Features of y = −3 sin(4(θ + π/8)) + 2
    back: |
      Midline y = 2, amplitude 3, period π/2, shift π/8 to the left, reflected across the midline (so it falls first). Maximum 5, minimum −1.
    topic_code: "6.16"
  - front: b from a known period
    back: |
      b = 2π/period. Period 8 gives b = π/4; period 0.5 gives b = 4π.
    topic_code: "6.16"
  - front: Checking an equation written from a graph
    back: |
      Substitute a peak or a midline crossing. For y = 4 cos((π/2)(θ − 1)) + 5 at θ = 3: cos π = −1, giving 1, the minimum, as the graph shows.
    topic_code: "6.16"
  - front: Rewriting y = 2 sin(3θ − π) + 1 in factored form
    back: |
      3θ − π = 3(θ − π/3), so y = 2 sin(3(θ − π/3)) + 1: shift π/3 right, period 2π/3, amplitude 2, midline 1.
    topic_code: "6.16"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 6.13 to 6.16: amplitude, midline,
    horizontal shift, period and the general form of a transformed sine or cosine), with about a quarter
    reviewing earlier units. Includes a shared-context set on a wave described by its peaks and trough.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a wave described by its peaks (6.13, 6.14, 6.16)
    - slug: alg2-u06-w27-q01
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Algebra 2, Unit 6, Lesson 13"
      points: 1
      stimulus: |
        Graph description: a wave has a maximum of 7 at θ = π/2, a minimum of −1 at θ = 3π/2, and a maximum of 7 again at θ = 5π/2.
      prompt: |
        What are the midline and amplitude of the wave?
      options:
        - "Midline y = 4, amplitude 3"
        - "Midline y = −1, amplitude 7"
        - "Midline y = 3, amplitude 8"
        - "Midline y = 3, amplitude 4"
      option_explanations:
        - |
          The midline is the average of 7 and −1, which is 3, and the amplitude is 4.
        - |
          The midline is not the minimum, and the amplitude is not the maximum.
        - |
          8 is the full distance from minimum to maximum; the amplitude is half of it.
        - |
          Correct. Midline (7 + (−1))/2 = 3 and amplitude (7 − (−1))/2 = 4.
      answer: 3
    - slug: alg2-u06-w27-q02
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Algebra 2, Unit 6, Lesson 16"
      points: 1
      stimulus: |
        Graph description: a wave has a maximum of 7 at θ = π/2, a minimum of −1 at θ = 3π/2, and a maximum of 7 again at θ = 5π/2.
      prompt: |
        Which sine equation describes the wave?
      options:
        - "y = 3 sin θ + 4"
        - "y = 4 sin(θ − π/2) + 3"
        - "y = 4 sin θ + 3"
        - "y = 4 cos θ + 3"
      option_explanations:
        - |
          This has midline 4 and amplitude 3, giving a maximum of 7 but a minimum of 1, not −1.
        - |
          Shifting sine right by π/2 moves its peak to θ = π, not π/2.
        - |
          Correct. Period 2π (peaks 2π apart), so b = 1; sin θ peaks at π/2 with no shift; amplitude 4, midline 3.
        - |
          Cosine peaks at θ = 0, but this wave peaks at π/2.
      answer: 2
    - slug: alg2-u06-w27-q03
      type: multiple_choice
      topic_code: "6.14"
      source: "IM Algebra 2, Unit 6, Lesson 14"
      points: 1
      stimulus: |
        Graph description: a wave has a maximum of 7 at θ = π/2, a minimum of −1 at θ = 3π/2, and a maximum of 7 again at θ = 5π/2.
      prompt: |
        Which cosine equation describes the same wave?
      options:
        - "y = 4 cos(θ − π/2) + 3"
        - "y = 4 cos θ + 3"
        - "y = 4 cos(θ − π) + 3"
        - "y = 4 cos(θ + π/2) + 3"
      option_explanations:
        - |
          Correct. Cosine peaks where its argument is 0, so shifting right by π/2 puts the peak at θ = π/2.
        - |
          Unshifted cosine peaks at θ = 0; this wave is at its midline there.
        - |
          A shift of π puts the peak at θ = π, where this wave is at its midline.
        - |
          θ + π/2 shifts the cosine left, putting a peak at θ = −π/2 and the next at 3π/2, where this wave is lowest.
      answer: 0
    - slug: alg2-u06-w27-q04
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Algebra 2, Unit 6, Lesson 16"
      points: 1
      stimulus: |
        Graph description: a wave has a maximum of 7 at θ = π/2, a minimum of −1 at θ = 3π/2, and a maximum of 7 again at θ = 5π/2.
      prompt: |
        What is the value of the wave at θ = π?
      options:
        - "7"
        - "3"
        - "0"
        - "−1"
      option_explanations:
        - |
          7 is the maximum, reached at π/2 and 5π/2, not at π.
        - |
          Correct. π is halfway between the peak at π/2 and the trough at 3π/2, so the wave is on its midline, y = 3.
        - |
          The midline of this wave is y = 3, not y = 0; 4 sin π + 3 = 3.
        - |
          −1 is the minimum, reached at θ = 3π/2, a quarter period after π.
      answer: 1
    # ---- Single items on this week
    - slug: alg2-u06-w27-q05
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Algebra 2, Unit 6, Lesson 13"
      points: 1
      prompt: |
        What is the maximum value of y = −5 cos θ + 2?
      options:
        - "−3"
        - "5"
        - "7"
        - "2"
      option_explanations:
        - |
          −3 is the minimum, at θ = 0 where cos θ = 1 and y = −5 + 2.
        - |
          5 is the amplitude; add it to the midline 2 to get the maximum.
        - |
          Correct. The amplitude is 5 and the midline is 2, so the maximum is 2 + 5 = 7, reached where cos θ = −1.
        - |
          2 is the midline, the centre of the wave; the maximum lies 5 above it.
      answer: 2
    - slug: alg2-u06-w27-q06
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Algebra 2, Unit 6, Lesson 15"
      points: 1
      prompt: |
        What is the period of y = sin(3θ)?
      options:
        - "2π"
        - "3"
        - "6π"
        - "2π/3"
      option_explanations:
        - |
          2π is the period of sin θ; the factor 3 squeezes three waves into that interval.
        - |
          3 is the number of waves in [0, 2π], not the period.
        - |
          6π would be the period of sin(θ/3); multiplying the input by 3 shortens the period.
        - |
          Correct. 3θ runs through 2π when θ runs through 2π/3, so one wave fits in that length.
      answer: 3
    - slug: alg2-u06-w27-q07
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Algebra 2, Unit 6, Lesson 15"
      points: 1
      prompt: |
        Which function completes exactly four full waves between θ = 0 and θ = 2π?
      options:
        - "y = 4 cos θ"
        - "y = cos(4θ)"
        - "y = cos(θ/4)"
        - "y = cos θ + 4"
      option_explanations:
        - |
          4 cos θ has amplitude 4 but still one wave in [0, 2π].
        - |
          Correct. The period of cos(4θ) is π/2, and four periods fill [0, 2π].
        - |
          cos(θ/4) has period 8π; only a quarter of a wave fits in [0, 2π].
        - |
          Adding 4 raises the midline and leaves the period at 2π.
      answer: 1
    - slug: alg2-u06-w27-q08
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Algebra 2, Unit 6, Lesson 16"
      points: 1
      prompt: |
        What is the horizontal shift of y = 2 sin(2θ − π/3) + 1?
      options:
        - "π/6 to the right"
        - "π/3 to the left"
        - "π/3 to the right"
        - "π/6 to the left"
      option_explanations:
        - |
          Correct. 2θ − π/3 = 2(θ − π/6), so the sine wave is moved π/6 to the right.
        - |
          A minus sign inside moves the graph to the right, not the left.
        - |
          π/3 is the number inside before factoring out the 2; the shift is π/3 ÷ 2.
        - |
          The size π/6 is right but the direction is wrong: θ − π/6 is a shift to the right.
      answer: 0
    - slug: alg2-u06-w27-q09
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Algebra 2, Unit 6, Lesson 16"
      points: 1
      prompt: |
        A wave has midline y = 10, amplitude 6 and period 8, and it rises through its midline at θ = 2. Which equation describes it?
      options:
        - "y = 10 sin((π/4)(θ − 2)) + 6"
        - "y = 6 sin(8(θ − 2)) + 10"
        - "y = 6 sin((π/4)(θ + 2)) + 10"
        - "y = 6 sin((π/4)(θ − 2)) + 10"
      option_explanations:
        - |
          The amplitude multiplies the sine and the midline is added: 6 and 10 are swapped here.
        - |
          b is 2π divided by the period, π/4, not the period itself.
        - |
          θ + 2 shifts the wave left, so it would rise through the midline at θ = −2.
        - |
          Correct. b = 2π/8 = π/4; sine rises through its midline at the start of its cycle, shifted to θ = 2.
      answer: 3
    - slug: alg2-u06-w27-q10
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Algebra 2, Unit 3, Lesson 12"
      points: 1
      prompt: |
        What is (5 − 2i) − (3 + 4i)?
      options:
        - "2 − 2i"
        - "8 − 6i"
        - "2 − 6i"
        - "2 + 2i"
      option_explanations:
        - |
          The imaginary parts combine as −2i − 4i = −6i, not −2i.
        - |
          8 adds the real parts; subtraction gives 5 − 3 = 2.
        - |
          Correct. Real parts 5 − 3 = 2; imaginary parts −2i − 4i = −6i.
        - |
          The imaginary part of the second number must be subtracted too: −2i − 4i = −6i.
      answer: 2
    - slug: alg2-u06-w27-q11
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Algebra 2, Unit 5, Lesson 9"
      points: 1
      prompt: |
        The point (6, 2) is on the graph of y = f(x). Which point is on the graph of y = f(3x)?
      options:
        - "(18, 2)"
        - "(2, 2)"
        - "(2, 6)"
        - "(6, 6)"
      option_explanations:
        - |
          (18, 2) would be on y = f(x/3), a horizontal stretch by 3.
        - |
          Correct. f(3x) = f(6) = 2 when 3x = 6, that is x = 2; the graph is compressed horizontally by 1/3.
        - |
          The output is unchanged by an input scaling: f(3 · 2) = f(6) = 2.
        - |
          (6, 6) would be on y = 3f(x), a vertical stretch.
      answer: 1
    - slug: alg2-u06-w27-q12
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 2, Unit 2, Lesson 10"
      points: 1
      prompt: |
        How does the graph of p(x) = (x − 1)²(x + 3) behave at x = 1?
      options:
        - "It touches the x-axis and turns back without crossing."
        - "It crosses the x-axis and flattens out as it crosses."
        - "It crosses the x-axis in a straight line."
        - "It has a vertical asymptote."
      option_explanations:
        - |
          Correct. The zero at 1 has multiplicity 2 (even), so the graph bounces off the axis there.
        - |
          A flattened crossing comes from an odd multiplicity of 3 or more.
        - |
          A straight crossing is the behaviour at a zero of multiplicity 1, such as x = −3.
        - |
          Polynomials have no asymptotes; the factor (x − 1)² is a zero, not a division by zero.
      answer: 0
    - slug: alg2-u06-w27-q13
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Algebra 2, Unit 4, Lesson 6"
      points: 1
      prompt: |
        An exponential function passes through (0, 5) and (2, 45). Which equation describes it?
      options:
        - "f(x) = 5 · 9ˣ"
        - "f(x) = 3 · 5ˣ"
        - "f(x) = 5 · 3ˣ"
        - "f(x) = 5 + 20x"
      option_explanations:
        - |
          9 is b², the growth factor over two steps; the one-step factor is 3.
        - |
          This gives f(0) = 3, but the function passes through (0, 5).
        - |
          Correct. f(0) = 5 fixes the starting value, and 5 · b² = 45 gives b² = 9, so b = 3.
        - |
          A linear function is not exponential, even though it passes through both points.
      answer: 2
    - slug: alg2-u06-w27-q14
      type: multi_select
      topic_code: "6.13"
      source: "IM Algebra 2, Unit 6, Lesson 13"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about y = −3 sin θ + 4 are true? Select all that apply.
      options:
        - "Its maximum value is 7."
        - "Its amplitude is 3."
        - "Its minimum value is 1."
        - "Its midline is y = 4."
        - "Its amplitude is −3."
      option_explanations:
        - |
          Correct. Maximum = 4 + 3 = 7, reached at θ = 3π/2 where sin θ = −1.
        - |
          Correct. Amplitude is |a| = 3; the negative sign reflects the wave but does not change its size.
        - |
          Correct. Minimum = midline − amplitude = 4 − 3 = 1, reached at θ = π/2 where −3 sin θ = −3.
        - |
          Correct. The constant 4 is the midline, halfway between the maximum 7 and the minimum 1.
        - |
          Amplitude is a distance and is never negative; here it is 3.
      answer: [0, 1, 2, 3]
    - slug: alg2-u06-w27-q15
      type: multi_select
      topic_code: "6.15"
      source: "IM Algebra 2, Unit 6, Lesson 15"
      points: 2
      partial_credit: true
      prompt: |
        Which functions have period π? Select all that apply.
      options:
        - "y = cos(2(θ − 1)) + 5"
        - "y = 2 sin θ"
        - "y = sin(θ/2)"
        - "y = sin(2θ)"
        - "y = tan θ"
      option_explanations:
        - |
          Correct. The shift and the midline do not change the period, which is 2π/2 = π.
        - |
          The factor 2 outside changes the amplitude, not the period, which stays 2π.
        - |
          sin(θ/2) has period 2π ÷ (1/2) = 4π: only half a wave fits in [0, 2π].
        - |
          Correct. 2π/2 = π: two waves in [0, 2π].
        - |
          Correct. Tangent repeats every half turn, since the ray at θ + π is the same line.
      answer: [0, 3, 4]
    - slug: alg2-u06-w27-q16
      type: true_false
      topic_code: "6.16"
      source: "IM Algebra 2, Unit 6, Lesson 16"
      points: 1
      prompt: |
        True or false: the amplitude of y = −6 cos(2θ) + 1 is −6.
      answer: false
      explanation: |
        False. Amplitude is the distance from the midline to a peak, |a| = 6. The negative sign reflects the wave across its midline y = 1.
    - slug: alg2-u06-w27-q17
      type: true_false
      topic_code: "1.2"
      source: "IM Algebra 2, Unit 1, Lesson 2"
      points: 1
      prompt: |
        True or false: in a geometric sequence, each term is the previous term plus a fixed constant.
      answer: false
      explanation: |
        False. That describes an arithmetic sequence. In a geometric sequence each term is the previous term multiplied by a fixed ratio, as in 3, 6, 12, 24.
    - slug: alg2-u06-w27-q18
      type: fill_blank
      topic_code: "6.15"
      source: "IM Algebra 2, Unit 6, Lesson 15"
      points: 1
      prompt: |
        The period of y = cos(5θ) is ____
      answer: ["2π/5", "2pi/5", "0.4π", "0.4pi"]
      explanation: |
        The period of cos(bθ) is 2π/b, here 2π/5: five full waves fit in [0, 2π].
    - slug: alg2-u06-w27-q19
      type: fill_blank
      topic_code: "3.1"
      source: "IM Algebra 2, Unit 3, Lesson 1"
      points: 1
      prompt: |
        Simplified, (x³)⁴ equals x raised to the power ____
      answer: ["12"]
      explanation: |
        A power of a power multiplies the exponents: (x³)⁴ = x³ · x³ · x³ · x³ = x¹².
    - slug: alg2-u06-w27-q20
      type: numeric
      topic_code: "6.16"
      source: "IM Algebra 2, Unit 6, Lesson 16"
      points: 1
      prompt: |
        Evaluate y = 4 cos((π/2)(θ − 1)) + 5 at θ = 3. Give an exact integer.
      answer: { value: 1, tolerance: 0 }
      explanation: |
        (π/2)(3 − 1) = π and cos π = −1, so y = 4(−1) + 5 = 1, the minimum of the wave.
    - slug: alg2-u06-w27-q21
      type: numeric
      topic_code: "6.13"
      source: "IM Algebra 2, Unit 6, Lesson 13"
      points: 1
      prompt: |
        A Ferris wheel of radius 15 m has its centre 18 m above the ground. A rider starts level with the centre on the right and the wheel turns counterclockwise. How high is the rider, in metres, after turning through 7π/6? Give the exact decimal.
      answer: { value: 10.5, tolerance: 0.01 }
      explanation: |
        h = 18 + 15 sin(7π/6) = 18 + 15(−1/2) = 18 − 7.5 = 10.5 m.
    - slug: alg2-u06-w27-q22
      type: numeric
      topic_code: "6.15"
      source: "IM Algebra 2, Unit 6, Lesson 15"
      points: 1
      prompt: |
        A sine function y = sin(bθ) has period 0.25. Give b to two decimal places.
      answer: { value: 25.13, tolerance: 0.02 }
      explanation: |
        b = 2π/period = 2π/0.25 = 8π ≈ 25.13.
    - slug: alg2-u06-w27-q23
      type: short_answer
      topic_code: "6.16"
      source: "IM Algebra 2, Unit 6, Lesson 16"
      points: 3
      prompt: |
        Graph description: a wave has a maximum of 12 at θ = 2 and the next minimum, 4, at θ = 6.
        (a) Give the midline and the amplitude.
        (b) Give the period and the value of b.
        (c) Write a cosine equation for the wave and check it at θ = 6.
      answer: |
        (a) Midline y = (12 + 4)/2 = 8; amplitude (12 − 4)/2 = 4.
        (b) Peak to the next trough is half a period, so the period is 2 · 4 = 8 and b = 2π/8 = π/4.
        (c) y = 4 cos((π/4)(θ − 2)) + 8. At θ = 6: (π/4)(4) = π, cos π = −1, y = −4 + 8 = 4 ✓.
      explanation: |
        Three points, one per part. (a) midline 8 and amplitude 4. (b) period 8 (not 4) and b = π/4. (c) a correct equation with the check; y = 4 sin((π/4)(θ − 0)) + 8 or another equivalent form earns the point if the check is shown.
