week: 18
unit: 4
title: "What Is a Logarithm?"
topics: ["4.9", "4.10", "4.11"]
guide: guides/week-18.md
guide_description: |
  The base-10 logarithm as the exponent on 10 that produces a number, read from a table of powers of 10 and
  estimated between integers; translating between exponential form bˣ = y and logarithmic form log_b(y) = x
  for any base; evaluating logarithms exactly (including negative and fractional values such as log₃(1/81) =
  −4 and log₉(27) = 3/2), using technology for the rest, and why log of 0 or of a negative number is undefined.
flashcards_description: |
  26 cards on the meaning of a logarithm, converting between forms, exact and approximate evaluation, and
  the domain of the logarithm.

flashcards:
  - front: Meaning of log(50)
    back: |
      The exponent x with 10ˣ = 50. Since 10¹ < 50 < 10², it is between 1 and 2 (about 1.699).
    topic_code: "4.9"
  - front: Table of base-10 logs from 0.001 to 10,000
    back: |
      log(0.001) = −3, log(0.01) = −2, log(0.1) = −1, log(1) = 0, log(10) = 1, log(100) = 2, log(1000) = 3, log(10,000) = 4.
    topic_code: "4.9"
  - front: Bracketing log(300) and log(2000)
    back: |
      100 < 300 < 1000 gives 2 < log(300) < 3 (≈ 2.477); 1000 < 2000 < 10,000 gives 3 < log(2000) < 4 (≈ 3.301).
    topic_code: "4.9"
  - front: Sign of log(y) for 0 < y < 1
    back: |
      Negative: a power of 10 below 1 needs a negative exponent. log(0.5) ≈ −0.301, log(0.3) ≈ −0.52.
    topic_code: "4.9"
  - front: Ordering log(0.3), log(1), log(45), log(2000) without a calculator
    back: |
      log(0.3) < 0 = log(1) < log(45) (between 1 and 2) < log(2000) (between 3 and 4).
    topic_code: "4.9"
  - front: Definition of log_b(y)
    back: |
      The exponent x such that bˣ = y. The base b is positive and not 1; the argument y must be positive.
    topic_code: "4.10"
  - front: log_b(y) = x ↔ exponential form
    back: |
      bˣ = y. The base stays the base, and the value of the log is the exponent.
    topic_code: "4.10"
  - front: 5³ = 125 in logarithmic form
    back: |
      log₅(125) = 3.
    topic_code: "4.10"
  - front: 2⁻⁴ = 1/16 in logarithmic form
    back: |
      log₂(1/16) = −4.
    topic_code: "4.10"
  - front: log₄(2) = 1/2 in exponential form
    back: |
      4^(1/2) = 2, since √4 = 2.
    topic_code: "4.10"
  - front: log₉(27) = 3/2 in exponential form
    back: |
      9^(3/2) = 27: √9 = 3 and 3³ = 27.
    topic_code: "4.10"
  - front: 2ᵗ = 40 solved with a logarithm
    back: |
      t = log₂(40), between 5 and 6 because 2⁵ = 32 < 40 < 64 = 2⁶ (about 5.32).
    topic_code: "4.10"
  - front: '"log" with no base written'
    back: |
      Base 10, the common logarithm. log(1000) = 3.
    topic_code: "4.10"
  - front: log₂(8), log₂(32), log₃(81), log₅(125)
    back: |
      3, 5, 4, 3.
    topic_code: "4.11"
  - front: log(10,000) and log(0.001)
    back: |
      4 and −3, from 10⁴ and 10⁻³.
    topic_code: "4.11"
  - front: log₃(1/81) and log₂(0.125)
    back: |
      −4, since 3⁻⁴ = 1/81; −3, since 2⁻³ = 1/8 = 0.125.
    topic_code: "4.11"
  - front: log₄(2), log₈(2), log₁₆(8)
    back: |
      1/2, 1/3, 3/4: from 4^(1/2) = 2, 8^(1/3) = 2, 16^(3/4) = 8.
    topic_code: "4.11"
  - front: log₉(27) and log₂(√2)
    back: |
      3/2 (9^(3/2) = 27) and 1/2 (2^(1/2) = √2).
    topic_code: "4.11"
  - front: log₂(1/√2)
    back: |
      −1/2, because 1/√2 = 2^(−1/2).
    topic_code: "4.11"
  - front: log_b(1) and log_b(b) for any base
    back: |
      0 and 1, because b⁰ = 1 and b¹ = b.
    topic_code: "4.11"
  - front: Sanity check for a calculator value of log₂(12)
    back: |
      It must lie between log₂(8) = 3 and log₂(16) = 4; the calculator gives ≈ 3.585.
    topic_code: "4.11"
  - front: Why log(0) and log(−100) are undefined
    back: |
      10ˣ is positive for every real x, so no exponent produces 0 or a negative number. The argument of a log must be positive.
    topic_code: "4.11"
  - front: Is log(0.001) undefined?
    back: |
      No: it equals −3. Small positive arguments give negative logs; only 0 and negative arguments are off limits.
    topic_code: "4.11"
  - front: Why log₅(10) is between 1 and 2, closer to 1
    back: |
      5 < 10 < 25 puts it between 1 and 2; 10 is below the geometric midpoint √125 ≈ 11.2, so the log is below 1.5 (≈ 1.43).
    topic_code: "4.11"
  - front: Swapping base and argument → common error
    back: |
      log₄(2) = 1/2 but log₂(4) = 2. Always ask "the base to what power gives the argument?"
    topic_code: "4.11"
  - front: log₈(2) is not 8/2
    back: |
      A logarithm is an exponent: 8^(1/3) = 2, so log₈(2) = 1/3.
    topic_code: "4.11"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 4.9 to 4.11: the meaning of a logarithm,
    converting between forms, and evaluating logarithms), with about a third reviewing weeks 16–17 and Units
    1–3. Includes a shared-context set on the equation 10ˣ = 300. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: 10ˣ = 300 (4.9, 4.10)
    - slug: alg2-u04-w18-q01
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 2, Unit 4, Lesson 10"
      points: 1
      stimulus: |
        Consider the equation 10ˣ = 300.
      prompt: |
        Which expression gives the exact solution?
      options:
        - "x = 300/10"
        - "x = log(300)"
        - "x = log₃₀₀(10)"
        - "x = 10^(300)"
      option_explanations:
        - |
          30 is a quotient, not an exponent; 10³⁰ is enormously larger than 300.
        - |
          Correct. log(300) is defined as the exponent on 10 that produces 300.
        - |
          This swaps base and argument; log₃₀₀(10) is the exponent on 300 that gives 10, about 0.4.
        - |
          10³⁰⁰ is a number with 301 digits, not the exponent that gives 300.
      answer: 1
    - slug: alg2-u04-w18-q02
      type: multiple_choice
      topic_code: "4.9"
      source: "IM Algebra 2, Unit 4, Lesson 9"
      points: 1
      stimulus: |
        Consider the equation 10ˣ = 300.
      prompt: |
        Between which two integers does the solution lie?
      options:
        - "1 and 2"
        - "2 and 3"
        - "3 and 4"
        - "29 and 31"
      option_explanations:
        - |
          10² = 100 is already below 300, so x is above 2.
        - |
          Correct. 10² = 100 < 300 < 1000 = 10³, so 2 < x < 3.
        - |
          10³ = 1000 is above 300, so x is below 3.
        - |
          The exponent is small; 10³⁰ is astronomically larger than 300.
      answer: 1
    - slug: alg2-u04-w18-q03
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      stimulus: |
        Consider the equation 10ˣ = 300.
      prompt: |
        Which value of x, found with technology, is consistent with the bracket?
      options:
        - "x ≈ 1.477"
        - "x ≈ 2.477"
        - "x ≈ 3.477"
        - "x ≈ 2.301"
      option_explanations:
        - |
          1.477 is below 2, but 10² = 100 < 300 means x must exceed 2.
        - |
          Correct. log(300) ≈ 2.477, which lies between 2 and 3; check 10^2.477 ≈ 300.
        - |
          3.477 exceeds 3, but 10³ = 1000 > 300 means x must be below 3.
        - |
          2.301 is log(200), not log(300); 10^2.301 ≈ 200.
      answer: 1
    # ---- Single items on this week
    - slug: alg2-u04-w18-q04
      type: multiple_choice
      topic_code: "4.9"
      source: "IM Algebra 2, Unit 4, Lesson 9"
      points: 1
      prompt: |
        What does log₂(8) mean, and what is its value?
      options:
        - "8 divided by 2; its value is 4."
        - "The exponent to which 2 must be raised to get 8; its value is 3."
        - "2 raised to the 8th power; its value is 256."
        - "The exponent to which 8 must be raised to get 2; its value is 1/3."
      option_explanations:
        - |
          A logarithm is an exponent, not a quotient.
        - |
          Correct. 2³ = 8, so the exponent that turns 2 into 8 is 3: log₂(8) = 3.
        - |
          2⁸ = 256 is a power, not a logarithm; the log asks for the exponent.
        - |
          That describes log₈(2), with base and argument swapped.
      answer: 1
    - slug: alg2-u04-w18-q05
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 2, Unit 4, Lesson 10"
      points: 1
      prompt: |
        Which equation says the same thing as 5³ = 125?
      options:
        - "log₅(125) = 3"
        - "log₃(125) = 5"
        - "log₅(3) = 125"
        - "log₁₂₅(5) = 3"
      option_explanations:
        - |
          Correct. The base 5 stays the base, 125 is the argument, and 3 is the exponent.
        - |
          3 is the exponent, not the base; 3⁵ = 243, not 125.
        - |
          125 is the result of the power, so it is the argument of the log, not its value.
        - |
          log₁₂₅(5) = 1/3, since 125^(1/3) = 5; this swaps base and argument.
      answer: 0
    - slug: alg2-u04-w18-q06
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 2, Unit 4, Lesson 10"
      points: 1
      prompt: |
        Which equation says the same thing as log₄(2) = 1/2?
      options:
        - "2^(1/2) = 4"
        - "4^(1/2) = 2"
        - "4² = 2"
        - "(1/2)⁴ = 2"
      option_explanations:
        - |
          The base of the log, 4, must be the base of the power.
        - |
          Correct. √4 = 2, so 4 raised to the 1/2 gives 2.
        - |
          4² = 16; the exponent is the value of the log, 1/2.
        - |
          1/2 is the exponent, not the base; the base of the log is 4.
      answer: 1
    - slug: alg2-u04-w18-q07
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Evaluate log₃(1/81).
      options:
        - "4"
        - "−4"
        - "1/4"
        - "Undefined"
      option_explanations:
        - |
          3⁴ = 81, not 1/81; the reciprocal needs a negative exponent.
        - |
          Correct. 3⁻⁴ = 1/81, so the logarithm is −4.
        - |
          3^(1/4) ≈ 1.32, not 1/81; a positive fractional exponent gives a value above 1.
        - |
          1/81 is positive, so its logarithm is defined; small positive arguments just give negative logs.
      answer: 1
    - slug: alg2-u04-w18-q08
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Evaluate log(0.001).
      options:
        - "−3"
        - "3"
        - "−1000"
        - "0.001 is too small to have a logarithm"
      option_explanations:
        - |
          Correct. 0.001 = 10⁻³, so log(0.001) = −3.
        - |
          3 is log(1000); 0.001 is 1/1000, which needs the opposite exponent.
        - |
          The logarithm is the exponent −3, not the reciprocal of the argument.
        - |
          Every positive number has a logarithm; small ones have negative logs.
      answer: 0
    - slug: alg2-u04-w18-q09
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Evaluate log₉(27).
      options:
        - "3"
        - "3/2"
        - "2/3"
        - "18"
      option_explanations:
        - |
          9³ = 729, not 27; the exponent must be less than 2.
        - |
          Correct. 9^(3/2) = (√9)³ = 3³ = 27, so the logarithm is 3/2.
        - |
          9^(2/3) = ∛81 ≈ 4.33, not 27; the exponent is 3/2.
        - |
          27 − 9 = 18 is a difference, not an exponent.
      answer: 1
    - slug: alg2-u04-w18-q10
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Which expression is undefined?
      options:
        - "log(0.5)"
        - "log(1)"
        - "log(−100)"
        - "log(10⁻⁵)"
      option_explanations:
        - |
          log(0.5) ≈ −0.301; a positive argument less than 1 gives a negative log, which is fine.
        - |
          log(1) = 0, because 10⁰ = 1; the value is defined.
        - |
          Correct. 10ˣ is positive for every real x, so no exponent produces −100.
        - |
          log(10⁻⁵) = −5; the argument 10⁻⁵ is a small positive number.
      answer: 2
    - slug: alg2-u04-w18-q11
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        A calculator reports log₂(12) ≈ 3.585. Which bracket confirms this is reasonable?
      options:
        - "log₂(12) must be between log₂(8) = 3 and log₂(16) = 4."
        - "log₂(12) must be between log₂(10) = 1 and log₂(100) = 2."
        - "log₂(12) must be between 12/2 = 6 and 12/4 = 3."
        - "log₂(12) must equal 12 − 2 · 4 = 4, so the calculator is wrong."
      option_explanations:
        - |
          Correct. 2³ = 8 < 12 < 16 = 2⁴, so the logarithm lies between 3 and 4.
        - |
          log₂(10) ≈ 3.32 and log₂(100) ≈ 6.64; these are base-10 values, not base 2.
        - |
          A logarithm is an exponent, not a quotient of the argument by the base.
        - |
          There is no such rule; 2⁴ = 16 ≠ 12, so the value is not 4.
      answer: 0
    - slug: alg2-u04-w18-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Algebra 2, Unit 4, Lesson 3"
      points: 1
      prompt: |
        Let f(x) = 81(1/3)ˣ. What is f(1/2)?
      options:
        - "40.5"
        - "27√3 ≈ 46.8"
        - "27"
        - "81/6 = 13.5"
      option_explanations:
        - |
          40.5 is half of 81; a rational input uses a root, not a fraction of the output.
        - |
          Correct. f(1/2) = 81/3^(1/2) = 81/√3 = 27√3 ≈ 46.8.
        - |
          27 is f(1) = 81 · 1/3, the value after a full unit, not half of one.
        - |
          Dividing 81 by 6 has no connection to the exponent 1/2.
      answer: 1
    - slug: alg2-u04-w18-q13
      type: multiple_choice
      topic_code: "3.17"
      source: "IM Algebra 2, Unit 3, Lesson 17"
      points: 1
      prompt: |
        Solve x² + 4x + 29 = 0.
      options:
        - "x = −2 ± 5i"
        - "x = 2 ± 5i"
        - "x = −2 ± 5"
        - "x = −4 ± 5i"
      option_explanations:
        - |
          Correct. (x + 2)² = −29 + 4 = −25, so x = −2 ± 5i.
        - |
          Half of +4 is +2, so the square is (x + 2)² and the real part is −2.
        - |
          The right side −25 is negative, so its square roots are ±5i.
        - |
          The square is completed with half the x-coefficient, giving real part −2.
      answer: 0
    - slug: alg2-u04-w18-q14
      type: multi_select
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions equal 2? Select all that apply.
      options:
        - "log₃(9)"
        - "log(100)"
        - "log₂(4)"
        - "log₄(2)"
        - "log₅(10)"
      option_explanations:
        - |
          Correct. 3² = 9, so the exponent on 3 that gives 9 is 2: log₃(9) = 2.
        - |
          Correct. 10² = 100, so the exponent on 10 that gives 100 is 2: log(100) = 2.
        - |
          Correct. 2² = 4, so the exponent on 2 that gives 4 is 2: log₂(4) = 2.
        - |
          log₄(2) = 1/2, because 4^(1/2) = 2; base and argument matter.
        - |
          5² = 25, not 10, so log₅(10) is not 2; it is about 1.43.
      answer: [0, 1, 2]
    - slug: alg2-u04-w18-q15
      type: multi_select
      topic_code: "4.10"
      source: "IM Algebra 2, Unit 4, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are equivalent to log_b(y) = x? Select all that apply.
      options:
        - "bˣ = y"
        - "yˣ = b"
        - "x is the exponent to which b must be raised to produce y."
        - "b^y = x"
        - "y = bˣ"
      option_explanations:
        - |
          Correct. This is the exponential form of the logarithmic equation.
        - |
          This makes y the base; the base of the log is b.
        - |
          Correct. This is the definition of the logarithm in words.
        - |
          This puts the argument in the exponent and the exponent as the result, which is backwards.
        - |
          Correct. y = bˣ is bˣ = y written the other way round.
      answer: [0, 2, 4]
    - slug: alg2-u04-w18-q16
      type: true_false
      topic_code: "4.8"
      source: "IM Algebra 2, Unit 4, Lesson 8"
      points: 1
      prompt: |
        True or false: the solution of 8ˣ = 2 is x = 3.
      answer: false
      explanation: |
        False. 8³ = 512. Since 8^(1/3) = ∛8 = 2, the solution is x = 1/3.
    - slug: alg2-u04-w18-q17
      type: true_false
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 1
      prompt: |
        True or false: the graph of f(x) = (x − 2)/(x² − 4) has a vertical asymptote at x = 2.
      answer: false
      explanation: |
        False. x² − 4 = (x − 2)(x + 2), so the factor x − 2 cancels and the graph has a hole at x = 2, not an asymptote. The vertical asymptote is at x = −2.
    - slug: alg2-u04-w18-q18
      type: fill_blank
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Evaluate: log₂(32) = ____
      answer: ["5"]
      explanation: |
        2⁵ = 32, so log₂(32) = 5.
    - slug: alg2-u04-w18-q19
      type: fill_blank
      topic_code: "4.1"
      source: "IM Algebra 2, Unit 4, Lesson 1"
      points: 1
      prompt: |
        A quantity multiplied by 1.25 each year grows by ____ percent per year.
      answer: ["25", "25%"]
      explanation: |
        1.25 − 1 = 0.25, a 25% increase per year.
    - slug: alg2-u04-w18-q20
      type: numeric
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Use technology to find log(2000) to three decimal places.
      answer: { value: 3.301, tolerance: 0.001 }
      explanation: |
        10³ = 1000 < 2000 < 10,000, so the answer is between 3 and 4; the calculator gives 3.301.
    - slug: alg2-u04-w18-q21
      type: numeric
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Evaluate log₂(0.125) exactly.
      answer: { value: -3, tolerance: 0 }
      explanation: |
        0.125 = 1/8 = 2⁻³, so log₂(0.125) = −3.
    - slug: alg2-u04-w18-q22
      type: numeric
      topic_code: "3.14"
      source: "IM Algebra 2, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Write (3 + i)/(1 − i) in the form a + bi and give the imaginary part b.
      answer: { value: 2, tolerance: 0 }
      explanation: |
        Multiply by (1 + i)/(1 + i): (3 + 3i + i + i²)/2 = (2 + 4i)/2 = 1 + 2i, so b = 2.
    - slug: alg2-u04-w18-q23
      type: short_answer
      topic_code: "4.10"
      source: "IM Algebra 2, Unit 4, Lesson 10"
      points: 3
      prompt: |
        A population doubles every hour, and 2ˣ = 40 gives the number of hours x until it is 40 times its starting size.
        (a) Rewrite the equation in logarithmic form.
        (b) Without technology, bracket x between two consecutive integers and justify the bracket.
        (c) Use technology to find x to two decimal places and confirm it fits the bracket.
      answer: |
        (a) x = log₂(40).
        (b) 2⁵ = 32 < 40 < 64 = 2⁶, so 5 < x < 6.
        (c) x ≈ 5.32, which lies between 5 and 6 as required.
      explanation: |
        Three points, one per part. (a) log₂(40). (b) the bracket 5 < x < 6 with the powers 32 and 64. (c) ≈ 5.32 checked against the bracket.
    - slug: alg2-u04-w18-q24
      type: short_answer
      topic_code: "1.9"
      source: "IM Algebra 2, Unit 1, Lesson 9"
      points: 3
      prompt: |
        A sequence begins 5, 15, 45, 135, …
        (a) Write a recursive definition for the sequence, including the first term.
        (b) Write an explicit formula for the nth term.
        (c) Find the 8th term.
      answer: |
        (a) g(1) = 5, g(n) = 3 · g(n − 1) for n ≥ 2.
        (b) g(n) = 5 · 3^(n − 1).
        (c) g(8) = 5 · 3⁷ = 5 · 2187 = 10,935.
      explanation: |
        Three points, one per part. (a) a correct recursive rule with the starting term. (b) 5 · 3^(n − 1) (or an equivalent with a consistent index). (c) 10,935.
    - slug: alg2-u04-w18-q25
      type: long_answer
      topic_code: "4.9"
      source: "IM Algebra 2, Unit 4, Lesson 9"
      points: 6
      prompt: |
        Write a full response that (1) explains, using a table of powers of 10, what the base-10 logarithm of a number means, (2) evaluates log(1000), log(0.01), log(√10) and log(1) exactly with a reason for each, (3) brackets log(45) between two integers, uses technology to find it to three decimal places, and checks the value against the bracket, and (4) explains why log(−5) and log(0) are undefined while log(0.005) is defined and negative.
      answer: |
        (1) The table 10⁻² = 0.01, 10⁻¹ = 0.1, 10⁰ = 1, 10¹ = 10, 10² = 100, 10³ = 1000 pairs each number with the exponent on 10 that produces it. log(y) is that exponent: log(100) = 2 because 10² = 100. For numbers not in the table, log(y) is the exponent in between, such as log(50) between 1 and 2.
        (2) log(1000) = 3 because 10³ = 1000; log(0.01) = −2 because 10⁻² = 0.01; log(√10) = 1/2 because 10^(1/2) = √10; log(1) = 0 because 10⁰ = 1.
        (3) 10 < 45 < 100, so 1 < log(45) < 2. Technology gives log(45) ≈ 1.653, which lies in the bracket; 10^1.653 ≈ 45 confirms it.
        (4) 10ˣ is positive for every real exponent x, so no exponent gives −5 or 0: those logarithms do not exist. 0.005 is positive, so some exponent produces it; because 0.005 < 1 the exponent is negative (10⁻³ = 0.001 < 0.005 < 0.01 = 10⁻², so log(0.005) ≈ −2.3).
      explanation: |
        Six points: 1 for the table explanation; 2 for the four exact values with reasons (3, −2, 1/2, 0); 1 for the bracket and the value ≈ 1.653 checked; 2 for the domain explanation (positivity of 10ˣ) and the negative-but-defined case for 0.005.
