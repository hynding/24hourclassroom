      source: "IM Algebra 2, Unit 4, Lesson 14"
      points: 3
      prompt: |
        (a) Solve 6 · 4ᵗ = 96 exactly.
        (b) Solve 2eᵗ = 11, giving an exact answer and a decimal approximation.
        (c) Explain why, in both parts, the coefficient must be removed before using a logarithm.
      answer: |
        (a) 4ᵗ = 16, so t = log₄(16) = 2.
        (b) eᵗ = 5.5, so t = ln(5.5) ≈ 1.705.
        (c) A logarithm answers "the base to what power gives this number?", so the equation must have the form bᵗ = c with the power alone on one side; log(6 · 4ᵗ) is not 6 · log(4ᵗ), so the 6 cannot be carried through.
      explanation: |
        Three points, one per part. (a) t = 2. (b) ln 5.5 ≈ 1.705. (c) the isolation reason.
    - slug: alg2-u04-w20-q25
      type: long_answer
      topic_code: "4.15"
      source: "IM Algebra 2, Unit 4, Lesson 15"
      points: 6
      prompt: |
        A culture is measured at 400 cells at t = 0 and 1600 cells at t = 2 hours. Write a full response that (1) builds an exponential model P(t) from the two measurements, (2) states the doubling time and explains why it does not depend on the 400, (3) finds, with a logarithm, when the culture reaches 10,000 cells and checks the answer against a bracket of whole hours, and (4) explains how to get the same answer from a graph and gives one reason the model will eventually stop being accurate.
      answer: |
        (1) b² = 1600/400 = 4, so b = 2 and P(t) = 400 · 2ᵗ.
        (2) The doubling time is 1 hour, since the factor per hour is 2. Doubling means a · 2ᵗ = 2a, and the a cancels, leaving 2ᵗ = 2; the starting amount plays no part.
        (3) 400 · 2ᵗ = 10,000 gives 2ᵗ = 25, so t = log₂(25) ≈ 4.64 hours. Bracket: 2⁴ = 16 < 25 < 32 = 2⁵, so between 4 and 5 hours, consistent.
        (4) Graph y = 400 · 2ᵗ and y = 10,000 and read the t-coordinate of the intersection, which is where the two expressions are equal, about 4.6. The model fails eventually because the culture runs out of nutrients or space; unbounded doubling is impossible in a real dish.
      explanation: |
        Six points: 1 for P(t) = 400 · 2ᵗ; 1 for the doubling time with the cancellation argument; 2 for t = log₂(25) ≈ 4.64 with the bracket 4 < t < 5; 2 for the intersection description and a sensible limitation.
