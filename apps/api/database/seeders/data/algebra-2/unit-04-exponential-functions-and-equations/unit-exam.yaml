    type: short_answer
    topic_code: "4.11"
    source: "IM Algebra 2, Unit 4, Lesson 11"
    points: 3
    prompt: |
      (a) Evaluate log₈(4) exactly and explain your reasoning.
      (b) Solve 8ˣ = 100, giving the exact answer and a decimal to three places, and check it against a bracket.
      (c) Explain the difference between log(x) and ln(x), and give the value of each at x = 100 to two decimal places.
    answer: |
      (a) 8 = 2³ and 4 = 2², so 8^(2/3) = 4 and log₈(4) = 2/3.
      (b) x = log₈(100) ≈ 2.215. Bracket: 8² = 64 < 100 < 512 = 8³, so 2 < x < 3.
      (c) log(x) is the exponent on 10 that gives x; ln(x) is the exponent on e. log(100) = 2 exactly; ln(100) ≈ 4.61.
    explanation: |
      Three points, one per part. (a) 2/3 with the common-base reasoning. (b) log₈(100) ≈ 2.215 with the bracket. (c) base 10 versus base e, with 2 and ≈ 4.61.
  - slug: alg2-u04-exam-q46
    type: long_answer
    topic_code: "4.15"
    source: "IM Algebra 2, Unit 4, Lesson 15"
    points: 6
    prompt: |
      $2000 is invested. Write a full response that (1) finds the value after 6 years if the investment grows 5% per year, compounded yearly, (2) finds the doubling time under that yearly growth using a logarithm, (3) finds the value after 6 years and the doubling time if instead the investment grows continuously at a 5% rate, and (4) explains why the continuous results are slightly larger and states the actual yearly percent growth of the continuous model.
    answer: |
      (1) A(6) = 2000(1.05)⁶ ≈ 2000 · 1.3401 ≈ 2680.19.
      (2) 1.05ᵗ = 2 gives t = log₁.₀₅(2) ≈ 14.21 years.
      (3) B(6) = 2000e^(0.05 · 6) = 2000e^0.3 ≈ 2000 · 1.3499 ≈ 2699.72. Doubling: e^(0.05t) = 2, t = ln(2)/0.05 ≈ 13.86 years.
      (4) Continuous compounding adds interest at every instant, so interest earned early in a year earns more interest before the year ends; the yearly factor is e^0.05 ≈ 1.0513, an actual growth of about 5.13% per year rather than 5%, which makes the balance higher and the doubling time shorter.
    explanation: |
      Six points: 1 for 2680.19; 1 for 14.21 years from 1.05ᵗ = 2; 2 for 2699.72 and 13.86 years; 2 for the compounding-within-the-year explanation and the 5.13% figure.
