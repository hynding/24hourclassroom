week: 16
unit: 4
title: "Exponential Growth, Decay and Rational Inputs"
topics: ["4.1", "4.2", "4.3", "4.4"]
guide: guides/week-16.md
guide_description: |
  Exponential growth and decay as repeated multiplication, percent change to growth factor and back, and
  linear versus exponential tables; reading a and b from a table, a graph or a description, and the graph's
  asymptote; the meaning of f(1/2) and other rational inputs as growth over a fraction of a time unit, with
  b^(1/n) as the factor over 1/n of a unit; converting between time units (6% per year is 1.06^(1/12) per
  month, not 0.5%) and evaluating models such as 24000(0.85)ᵗ at t = 2.5.
flashcards_description: |
  27 cards on growth factors and percent change, the four representations of an exponential function,
  rational inputs, and changing the time unit.

flashcards:
  - front: Exponential versus linear change
    back: |
      Linear adds the same amount each step; exponential multiplies by the same factor each step. From 1000: +50 gives 1000, 1050, 1100; ×1.05 gives 1000, 1050, 1102.5.
    topic_code: "4.1"
  - front: Form of an exponential function
    back: |
      f(x) = a · bˣ with a the initial value f(0) and b the growth factor; b > 1 grows, 0 < b < 1 decays.
    topic_code: "4.1"
  - front: Percent change to growth factor
    back: |
      Up p% → b = 1 + p/100; down p% → b = 1 − p/100. Up 5% is 1.05; down 20% is 0.8; a 35% decrease is 0.65.
    topic_code: "4.1"
  - front: Growth factor to percent change
    back: |
      Percent = (b − 1) · 100. b = 0.88 is a 12% decrease; b = 1.5 is 50% growth; b = 2 is 100% growth (doubling).
    topic_code: "4.1"
  - front: 80 mg decreasing 20% per hour → amount after 3 hours
    back: |
      80 · 0.8³ = 80 · 0.512 = 40.96 mg. Multiply by 0.8 three times; do not subtract 16 three times.
    topic_code: "4.1"
  - front: f(x) = 200(0.9)ˣ → f(0), f(1), f(2)
    back: |
      200, 180, 162. Each step removes 10% of the current amount, so the drops shrink (20, then 18).
    topic_code: "4.1"
  - front: Why exponential decay never reaches zero
    back: |
      a · bˣ is a product of nonzero numbers, so it is never 0. The graph approaches the x-axis (horizontal asymptote y = 0) without touching it.
    topic_code: "4.1"
  - front: Testing a table for exponential behaviour
    back: |
      Divide consecutive outputs (for equally spaced inputs). A constant ratio means exponential with that ratio as b; a constant difference means linear.
    topic_code: "4.2"
  - front: Table 3, 12, 48, 192 at x = 0, 1, 2, 3 → equation
    back: |
      Ratios are all 4 and f(0) = 3, so f(x) = 3 · 4ˣ.
    topic_code: "4.2"
  - front: Table 400, 300, 225 at x = 0, 1, 2 → equation and f(4)
    back: |
      Ratio 0.75, so g(x) = 400(0.75)ˣ, a 25% decrease per step; g(4) = 126.5625.
    topic_code: "4.2"
  - front: Graph through (0, 5) and (2, 45) → equation
    back: |
      a = 5 from the intercept; 5b² = 45 gives b² = 9, b = 3; f(x) = 5 · 3ˣ.
    topic_code: "4.2"
  - front: Graph through (1, 6) and (3, 24), no intercept visible → a and b
    back: |
      b² = 24/6 = 4 so b = 2; then a · 2 = 6 gives a = 3: f(x) = 3 · 2ˣ.
    topic_code: "4.2"
  - front: Features of an exponential graph
    back: |
      y-intercept a, no x-intercept, horizontal asymptote y = 0 (on the right for decay, on the left for growth), always above the x-axis when a > 0.
    topic_code: "4.2"
  - front: Sequence 5, 10, 17, 26 → linear, exponential or neither?
    back: |
      Neither: differences 5, 7, 9 are not constant and ratios 2, 1.7, 1.53 are not constant. (It is quadratic.)
    topic_code: "4.2"
  - front: Meaning of P(1/2) for P(t) = 500 · 2ᵗ (t in hours)
    back: |
      The population after half an hour: 500 · 2^(1/2) = 500√2 ≈ 707. The half-hour factor is √2 because two of them make one doubling.
    topic_code: "4.3"
  - front: Factor over 1/n of a time unit
    back: |
      b^(1/n), because n of them multiply to b. Doubling per hour gives 2^(1/3) ≈ 1.26 per 20 minutes.
    topic_code: "4.3"
  - front: 100 · 2ˣ at x = −1, 1/2, 3/2, 5/2
    back: |
      50, 141.4, 282.8, 565.7.
    topic_code: "4.3"
  - front: 9ˣ at x = 1/2, 3/2, −1/2
    back: |
      3, 27, 1/3. Rational exponents from Unit 3 make the values exact.
    topic_code: "4.3"
  - front: f(x) = 16(1/2)ˣ → f(1/2), f(3/2), f(−2)
    back: |
      16/√2 ≈ 11.31; 16/2^(3/2) ≈ 5.66; 16 · 4 = 64.
    topic_code: "4.3"
  - front: Doubling every year → monthly growth factor
    back: |
      2^(1/12) ≈ 1.0595, about 5.95% per month. Twelve of them multiply to 2.
    topic_code: "4.3"
  - front: 6% per year → monthly growth factor
    back: |
      1.06^(1/12) ≈ 1.00487, about 0.487% per month. Not 0.5%: dividing the rate ignores compounding.
    topic_code: "4.4"
  - front: 8% per year → quarterly factor
    back: |
      1.08^(1/4) ≈ 1.0194, about 1.94% per quarter.
    topic_code: "4.4"
  - front: Half-life 10 days → daily factor
    back: |
      (1/2)^(1/10) ≈ 0.933, about a 6.7% loss per day.
    topic_code: "4.4"
  - front: Triples every 4 hours → hourly factor and P(t)
    back: |
      3^(1/4) ≈ 1.316 per hour; P(t) = P₀ · 3^(t/4). From 100, P(6) = 100 · 3^1.5 ≈ 520.
    topic_code: "4.4"
  - front: 1.02 per month → annual growth
    back: |
      1.02¹² ≈ 1.268, about 26.8% per year, not 24%.
    topic_code: "4.4"
  - front: Car worth 24000 losing 15% per year → value at 2.5 years
    back: |
      V(2.5) = 24000(0.85)^2.5 ≈ 24000 · 0.6661 ≈ 15,987.
    topic_code: "4.4"
  - front: Changing the time unit → common error
    back: |
      Dividing or multiplying the percent (6%/12 = 0.5%). Factors multiply, so the smaller-unit factor is the nth root of the larger-unit factor.
    topic_code: "4.4"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 4.1 to 4.4: growth and decay, the four
    representations, rational inputs and changing time units), with about a third reviewing Units 1–3.
    Includes a shared-context set on a bacteria population. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: P(t) = 500 · 2ᵗ (4.1, 4.3)
    - slug: alg2-u04-w16-q01
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Algebra 2, Unit 4, Lesson 1"
      points: 1
      stimulus: |
        A bacteria population is modeled by P(t) = 500 · 2ᵗ, where t is the time in hours.
      prompt: |
        What is the population after 3 hours?
      options:
        - "1500"
        - "3000"
        - "4000"
        - "8000"
      option_explanations:
        - |
          1500 adds 500 three times; the population doubles each hour instead.
        - |
          3000 is 500 · 6; three doublings multiply by 2³ = 8, not by 6.
        - |
          Correct. P(3) = 500 · 2³ = 500 · 8 = 4000.
        - |
          8000 = 500 · 16 would be four doublings, P(4).
      answer: 2
    - slug: alg2-u04-w16-q02
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Algebra 2, Unit 4, Lesson 3"
      points: 1
      stimulus: |
        A bacteria population is modeled by P(t) = 500 · 2ᵗ, where t is the time in hours.
      prompt: |
        What is the population after half an hour, to the nearest whole number?
      options:
        - "750"
        - "707"
        - "1000"
        - "354"
      option_explanations:
        - |
          750 assumes growth is linear within the hour (half of the 500 increase); the half-hour factor is √2, not 1.5.
        - |
          Correct. P(1/2) = 500 · 2^(1/2) = 500√2 ≈ 707.
        - |
          1000 is the population after a full hour, P(1).
        - |
          354 = 500/√2 is P(−1/2), half an hour before the start.
      answer: 1
    - slug: alg2-u04-w16-q03
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Algebra 2, Unit 4, Lesson 3"
      points: 1
      stimulus: |
        A bacteria population is modeled by P(t) = 500 · 2ᵗ, where t is the time in hours.
      prompt: |
        By what factor does the population grow every 20 minutes?
      options:
        - "2/3"
        - "2^(1/3) ≈ 1.26"
        - "1 + 1/3 ≈ 1.33"
        - "2^(1/20)"
      option_explanations:
        - |
          A factor of 2/3 would shrink the population; 20 minutes is a third of an hour, so three of the factors must multiply to 2.
        - |
          Correct. Three 20-minute periods make an hour, so the factor f satisfies f³ = 2, giving f = 2^(1/3) ≈ 1.26.
        - |
          1.33³ ≈ 2.37, not 2; growth over a third of an hour is the cube root of 2, not one third of the increase.
        - |
          The exponent is the fraction of an hour (1/3), not the number of minutes.
      answer: 1
    # ---- Single items on this week
    - slug: alg2-u04-w16-q04
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Algebra 2, Unit 4, Lesson 1"
      points: 1
      prompt: |
        A quantity decreases by 12% every year. Which growth factor describes this?
      options:
        - "0.12"
        - "0.88"
        - "1.12"
        - "−0.12"
      option_explanations:
        - |
          0.12 is the fraction lost each year; the fraction that remains is 0.88.
        - |
          Correct. New = old − 0.12 · old = 0.88 · old.
        - |
          1.12 would be a 12% increase, the opposite of what is described.
        - |
          Growth factors are positive; a negative factor would flip the sign of the quantity.
      answer: 1
    - slug: alg2-u04-w16-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Algebra 2, Unit 4, Lesson 1"
      points: 1
      prompt: |
        Which sequence of values at x = 0, 1, 2, 3 comes from an exponential function?
      options:
        - "7, 14, 21, 28"
        - "7, 14, 28, 56"
        - "7, 14, 23, 34"
        - "7, 10, 14, 19"
      option_explanations:
        - |
          Constant differences of 7 make this linear, not exponential.
        - |
          Correct. Each value is twice the previous one, a constant ratio of 2: f(x) = 7 · 2ˣ.
        - |
          Differences 7, 9, 11 and ratios 2, 1.64, 1.48 are neither constant.
        - |
          Differences 3, 4, 5 are not constant, and neither are the ratios.
      answer: 1
    - slug: alg2-u04-w16-q06
      type: multiple_choice
      topic_code: "4.2"
      source: "IM Algebra 2, Unit 4, Lesson 2"
      points: 1
      prompt: |
        A table gives f(0) = 3, f(1) = 12, f(2) = 48, f(3) = 192. Which equation defines f?
      options:
        - "f(x) = 3 · 4ˣ"
        - "f(x) = 4 · 3ˣ"
        - "f(x) = 3 + 9x"
        - "f(x) = 12ˣ"
      option_explanations:
        - |
          Correct. f(0) = 3 gives a = 3 and the constant ratio 12/3 = 4 gives b = 4.
        - |
          4 · 3ˣ gives 4 at x = 0, but the table says 3.
        - |
          3 + 9x gives 3, 12, 21, 30: linear, which does not match 48 and 192.
        - |
          12ˣ gives 1 at x = 0 and 144 at x = 2, neither of which matches the table.
      answer: 0
    - slug: alg2-u04-w16-q07
      type: multiple_choice
      topic_code: "4.2"
      source: "IM Algebra 2, Unit 4, Lesson 2"
      points: 1
      prompt: |
        The graph of an exponential function passes through (0, 5) and (2, 45). What is its equation?
      options:
        - "f(x) = 5 · 9ˣ"
        - "f(x) = 5 · 3ˣ"
        - "f(x) = 45 · 3ˣ"
        - "f(x) = 5 + 20x"
      option_explanations:
        - |
          5 · 9² = 405, not 45; the factor over two steps is 9, so the factor per step is 3.
        - |
          Correct. a = 5 from the intercept, and 5b² = 45 gives b = 3.
        - |
          45 is f(2), not the y-intercept; a must be f(0) = 5.
        - |
          The question states the function is exponential; a line through the two points would not be.
      answer: 1
    - slug: alg2-u04-w16-q08
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Algebra 2, Unit 4, Lesson 4"
      points: 1
      prompt: |
        An account grows 6% per year. What is the growth factor per month?
      options:
        - "1.005, because 6%/12 = 0.5%"
        - "1.06^(1/12) ≈ 1.00487"
        - "1.06/12 ≈ 0.0883"
        - "1.06^12 ≈ 2.01"
      option_explanations:
        - |
          Dividing the rate ignores compounding; twelve factors of 1.005 multiply to about 1.0617, not 1.06.
        - |
          Correct. The monthly factor m must satisfy m¹² = 1.06, so m = 1.06^(1/12) ≈ 1.00487.
        - |
          A growth factor below 1 would mean the account shrinks; dividing a factor by 12 is meaningless.
        - |
          1.06¹² is the factor over 12 years, not over one month.
      answer: 1
    - slug: alg2-u04-w16-q09
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Algebra 2, Unit 4, Lesson 3"
      points: 1
      prompt: |
        A quantity doubles every year. Which statement about its growth over 6 months is correct?
      options:
        - "It grows by a factor of 1, because half a doubling is no change."
        - "It grows by a factor of 1.5, half of the yearly increase."
        - "It grows by a factor of √2 ≈ 1.41, because two such factors make 2."
        - "It grows by a factor of 2^6 = 64."
      option_explanations:
        - |
          Half a year of growth is a factor strictly between 1 and 2.
        - |
          1.5 · 1.5 = 2.25, not 2; growth compounds, so the half-year factor is the square root of 2.
        - |
          Correct. The 6-month factor f satisfies f · f = 2, so f = 2^(1/2) ≈ 1.41.
        - |
          The exponent is the fraction of a year (1/2), not the number of months.
      answer: 2
    - slug: alg2-u04-w16-q10
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Algebra 2, Unit 4, Lesson 4"
      points: 1
      prompt: |
        A radioactive sample has a half-life of 10 days. Which expression gives the fraction remaining after one day?
      options:
        - "1/2 ÷ 10 = 0.05"
        - "1 − 0.05 = 0.95"
        - "(1/2)^(1/10) ≈ 0.933"
        - "(1/2)^10 ≈ 0.001"
      option_explanations:
        - |
          Dividing the half by 10 gives the amount, not the factor; and 0.05 would mean 95% lost in a day.
        - |
          0.95¹⁰ ≈ 0.60, not 0.5, so a 5% daily loss does not produce a 10-day half-life.
        - |
          Correct. The daily factor d satisfies d¹⁰ = 1/2, so d = (1/2)^(1/10) ≈ 0.933, about a 6.7% loss per day.
        - |
          (1/2)¹⁰ is the fraction remaining after ten half-lives, 100 days.
      answer: 2
    - slug: alg2-u04-w16-q11
      type: multiple_choice
      topic_code: "4.2"
      source: "IM Algebra 2, Unit 4, Lesson 2"
      points: 1
      prompt: |
        Which feature does the graph of every function f(x) = a · bˣ (with a > 0, 0 < b < 1) have?
      options:
        - "An x-intercept where the function reaches 0"
        - "A horizontal asymptote at y = 0 that the graph approaches as x increases"
        - "A vertical asymptote at x = 0"
        - "A minimum point at (0, a)"
      option_explanations:
        - |
          a · bˣ is never 0, so the graph never meets the x-axis.
        - |
          Correct. As x grows, bˣ shrinks toward 0, so the graph flattens toward the x-axis without reaching it.
        - |
          Exponential functions are defined for every x, including 0, so there is no vertical asymptote.
        - |
          (0, a) is the y-intercept; the function keeps decreasing to the right of it, so it is not a minimum.
      answer: 1
    - slug: alg2-u04-w16-q12
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Algebra 2, Unit 3, Lesson 4"
      points: 1
      prompt: |
        Evaluate 16^(3/2).
      options:
        - "24"
        - "64"
        - "8"
        - "4096"
      option_explanations:
        - |
          24 is 16 · 3/2; a rational exponent is a root and a power, not a multiplier.
        - |
          Correct. √16 = 4 and 4³ = 64: square root first, then the cube.
        - |
          8 = 2³ is 16^(3/4), not 16^(3/2); the denominator 2 calls for a square root.
        - |
          4096 = 16³ ignores the square root in the exponent.
      answer: 1
    - slug: alg2-u04-w16-q13
      type: multiple_choice
      topic_code: "1.6"
      source: "IM Algebra 2, Unit 1, Lesson 6"
      points: 1
      prompt: |
        A sequence is defined by f(1) = 2 and f(n) = 3 · f(n − 1) for n ≥ 2. What is f(4)?
      options:
        - "11"
        - "18"
        - "54"
        - "162"
      option_explanations:
        - |
          11 adds 3 three times; the rule multiplies by 3.
        - |
          18 is f(3), one step short: the terms run 2, 6, 18, 54.
        - |
          Correct. Multiply by 3 three times: 2 → 6 → 18 → 54, so f(4) = 54.
        - |
          162 is f(5), one multiplication by 3 too many.
      answer: 2
    - slug: alg2-u04-w16-q14
      type: short_answer
      topic_code: "3.19"
      source: "IM Algebra 2, Unit 3, Lesson 19"
      points: 3
      prompt: |
        (a) Without solving, determine how many real solutions x² + 5x + 7 = 0 has, and justify your answer.
        (b) Find the solutions of x² + 5x + 7 = 0 in the form a + bi.
        (c) Explain how the graph of y = x² + 5x + 7 reflects your answer to (a).
      answer: |
        (a) The discriminant is 25 − 28 = −3 < 0, so there are no real solutions (two non-real ones).
        (b) x = (−5 ± √(−3))/2 = −5/2 ± (√3/2)i.
        (c) The real solutions would be the x-intercepts; since there are none, the parabola (opening upward) lies entirely above the x-axis.
      explanation: |
        Three points, one per part. (a) the discriminant −3 and the conclusion. (b) −5/2 ± (√3/2)i. (c) no x-intercepts, graph above the axis.
    - slug: alg2-u04-w16-q15
      type: multi_select
      topic_code: "4.1"
      source: "IM Algebra 2, Unit 4, Lesson 1"
      points: 2
      partial_credit: true
      prompt: |
        Let f(x) = 200(0.9)ˣ. Which statements are true? Select all that apply.
      options:
        - "f is decreasing."
        - "f decreases by 10% for each increase of 1 in x."
        - "f(0) = 200"
        - "f(x) = 0 for some large enough x."
        - "f(2) = 180"
      option_explanations:
        - |
          Correct. The factor 0.9 is between 0 and 1, so each step multiplies by less than 1.
        - |
          Correct. Multiplying by 0.9 keeps 90%, a 10% decrease.
        - |
          Correct. 200 · 0.9⁰ = 200 · 1 = 200, the initial value.
        - |
          200 · 0.9ˣ is positive for every x; it approaches 0 but never equals it.
        - |
          f(2) = 200 · 0.9² = 200 · 0.81 = 162; 180 is f(1), after one step.
      answer: [0, 1, 2]
    - slug: alg2-u04-w16-q16
      type: multi_select
      topic_code: "4.4"
      source: "IM Algebra 2, Unit 4, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        An investment grows 8% per year. Which expressions equal the growth factor per month? Select all that apply.
      options:
        - "1.08^(1/12)"
        - "The twelfth root of 1.08"
        - "1.08/12"
        - "1 + 0.08/12"
        - "The number m such that m¹² = 1.08"
      option_explanations:
        - |
          Correct. Twelve months of growth must multiply to 1.08, so the monthly factor is 1.08^(1/12) ≈ 1.00643.
        - |
          Correct. The twelfth root of 1.08 is another name for 1.08^(1/12).
        - |
          1.08/12 = 0.09 is less than 1 and would mean the investment shrinks to 9% each month.
        - |
          1.00667¹² ≈ 1.083, not 1.08; dividing the rate ignores compounding.
        - |
          Correct. This is exactly the defining condition of the monthly factor.
      answer: [0, 1, 4]
    - slug: alg2-u04-w16-q17
      type: true_false
      topic_code: "3.13"
      source: "IM Algebra 2, Unit 3, Lesson 13"
      points: 1
      prompt: |
        True or false: (1 + i)² = 2.
      answer: false
      explanation: |
        False. (1 + i)² = 1 + 2i + i² = 1 + 2i − 1 = 2i, an imaginary number, not 2.
    - slug: alg2-u04-w16-q18
      type: true_false
      topic_code: "2.19"
      source: "IM Algebra 2, Unit 2, Lesson 19"
      points: 1
      prompt: |
        True or false: the graph of f(x) = (2x + 1)/(x − 3) has the horizontal asymptote y = 2.
      answer: true
      explanation: |
        True. Numerator and denominator have the same degree, so for large |x| the function approaches the ratio of leading coefficients, 2/1 = 2.
    - slug: alg2-u04-w16-q19
      type: fill_blank
      topic_code: "4.1"
      source: "IM Algebra 2, Unit 4, Lesson 1"
      points: 1
      prompt: |
        A 35% decrease per year corresponds to a growth factor of ____
      answer: ["0.65", ".65"]
      explanation: |
        After losing 35%, 65% remains, so the factor is 1 − 0.35 = 0.65.
    - slug: alg2-u04-w16-q20
      type: fill_blank
      topic_code: "3.6"
      source: "IM Algebra 2, Unit 3, Lesson 6"
      points: 1
      prompt: |
        The positive solution of (x − 1)² = 49 is x = ____
      answer: ["8"]
      explanation: |
        x − 1 = ±7 gives x = 8 or x = −6; the positive one is 8.
    - slug: alg2-u04-w16-q21
      type: numeric
      topic_code: "4.4"
      source: "IM Algebra 2, Unit 4, Lesson 4"
      points: 1
      prompt: |
        A car bought for $24,000 loses 15% of its value each year. Find its value after 2.5 years, to the nearest dollar.
      answer: { value: 15987, tolerance: 2 }
      explanation: |
        V(2.5) = 24000(0.85)^2.5 ≈ 24000 · 0.66611 ≈ 15,987.
    - slug: alg2-u04-w16-q22
      type: numeric
      topic_code: "4.2"
      source: "IM Algebra 2, Unit 4, Lesson 2"
      points: 1
      prompt: |
        An exponential function has g(0) = 400, g(1) = 300 and g(2) = 225. Find g(4).
      answer: { value: 126.5625, tolerance: 0.01 }
      explanation: |
        The ratio is 0.75, so g(x) = 400(0.75)ˣ and g(4) = 400 · 0.31640625 = 126.5625.
    - slug: alg2-u04-w16-q23
      type: numeric
      topic_code: "3.18"
      source: "IM Algebra 2, Unit 3, Lesson 18"
      points: 1
      prompt: |
        The solutions of x² − 8x + 25 = 0 are a ± bi. Give the real part a.
      answer: { value: 4, tolerance: 0 }
      explanation: |
        Completing the square: (x − 4)² = −9, so x = 4 ± 3i and a = 4. Equivalently a = −b/(2a) = 8/2 = 4.
    - slug: alg2-u04-w16-q24
      type: short_answer
      topic_code: "4.4"
      source: "IM Algebra 2, Unit 4, Lesson 4"
      points: 3
      prompt: |
        A bacteria culture starts with 100 cells and triples every 4 hours.
        (a) Find the hourly growth factor to three decimal places and explain how you found it.
        (b) Write a function P(t) for the population after t hours and find P(6) to the nearest cell.
        (c) A student says the hourly growth factor is 3/4 = 0.75. Explain the error.
      answer: |
        (a) Four hourly factors must multiply to 3, so the factor is 3^(1/4) ≈ 1.316.
        (b) P(t) = 100 · 3^(t/4) (equivalently 100 · 1.316ᵗ). P(6) = 100 · 3^(1.5) ≈ 100 · 5.196 ≈ 520 cells.
        (c) 0.75 is less than 1 and would describe decay. Growth factors combine by multiplying, not dividing, so the hourly factor is the fourth root of 3, not 3 divided by 4.
      explanation: |
        Three points, one per part. (a) 1.316 with the fourth-root reasoning. (b) a correct function and P(6) ≈ 520. (c) identifies both that 0.75 is decay and that factors combine multiplicatively.
    - slug: alg2-u04-w16-q25
      type: long_answer
      topic_code: "4.2"
      source: "IM Algebra 2, Unit 4, Lesson 2"
      points: 6
      prompt: |
        A table shows the value of a quantity: 400 at x = 0, 300 at x = 1, 225 at x = 2. Write a full response that (1) shows the table is exponential and writes an equation g(x), (2) finds g(1/2) and explains what it represents, (3) describes the graph of g: its y-intercept, its behaviour as x increases, and why it has no x-intercept, and (4) compares g with the linear function L(x) = 400 − 100x, which agrees with g at x = 0 and x = 1, by finding the values of both at x = 2 and x = 4 and explaining in words why they differ.
      answer: |
        (1) 300/400 = 0.75 and 225/300 = 0.75: a constant ratio, so the table is exponential with b = 0.75 and a = 400: g(x) = 400(0.75)ˣ, a 25% decrease per unit.
        (2) g(1/2) = 400(0.75)^(1/2) = 400√0.75 ≈ 346.4. It is the value halfway between x = 0 and x = 1, assuming the same proportional decay; the half-step factor √0.75 ≈ 0.866 applied twice gives 0.75.
        (3) The y-intercept is (0, 400). As x increases, g decreases, and the decreases get smaller each step (100, then 75, then 56.25), so the graph flattens toward the x-axis, which is a horizontal asymptote. It never reaches 0 because 400(0.75)ˣ is a product of positive numbers.
        (4) At x = 2: g(2) = 225, L(2) = 200. At x = 4: g(4) = 126.5625, L(4) = 0. L subtracts the same 100 every step and reaches zero at x = 4; g removes 25% of a shrinking amount, so its decreases shrink and it stays above L from x = 2 onward and above 0 forever.
      explanation: |
        Six points: 1 for showing the constant ratio and the equation; 1 for g(1/2) ≈ 346.4 with an interpretation; 2 for the graph description including the asymptote and the no-intercept reason; 2 for the four values (225, 200, 126.56, 0) and the multiplicative-versus-additive explanation.
