      prompt: |
        Consider 2x² + 3x + 5 = 0.
        (a) Compute the discriminant and state what it tells you.
        (b) Solve the equation with the quadratic formula, writing the solutions in the form a + bi.
        (c) Verify that the product of the two solutions equals c/a.
      answer: |
        (a) b² − 4ac = 9 − 40 = −31 < 0, so there are two non-real solutions forming a conjugate pair.
        (b) x = (−3 ± √(−31))/4 = (−3 ± i√31)/4 = −3/4 ± (√31/4)i.
        (c) (−3/4 + (√31/4)i)(−3/4 − (√31/4)i) = 9/16 + 31/16 = 40/16 = 5/2 = c/a. ✓
      explanation: |
        Three points, one per part. (a) −31 and the non-real conclusion. (b) −3/4 ± (√31/4)i. (c) the conjugate product 5/2 matching c/a.
    - slug: alg2-u04-w19-q25
      type: long_answer
      topic_code: "4.12"
      source: "IM Algebra 2, Unit 4, Lesson 12"
      points: 6
      prompt: |
        $1000 is invested at a 6% annual rate. Write a full response that (1) computes the balance after 10 years with yearly compounding, with monthly compounding, and with continuous compounding, (2) explains what pattern the three balances show and how the number e is connected to it, (3) finds the actual percent growth per year under continuous compounding and explains why it is not exactly 6%, and (4) finds, with a logarithm, how many years continuous compounding takes to double the investment, showing the equation you solved.
      answer: |
        (1) Yearly: 1000(1.06)¹⁰ ≈ 1790.85. Monthly: 1000(1 + 0.06/12)¹²⁰ = 1000(1.005)¹²⁰ ≈ 1819.40. Continuous: 1000e^(0.06 · 10) = 1000e^0.6 ≈ 1822.12.
        (2) More frequent compounding gives a larger balance, but the increases shrink: about $28.55 from yearly to monthly, then only about $2.72 from monthly to continuous. Compounding n times per year gives (1 + 0.06/n)ⁿ per year, which approaches e^0.06 as n grows; e is the limit of (1 + 1/n)ⁿ, the 100% version of the same process.
        (3) The yearly factor is e^0.06 ≈ 1.0618, so the balance grows about 6.18% per year. It exceeds 6% because interest earned early in the year itself earns interest before the year ends.
        (4) 1000e^(0.06t) = 2000, so e^(0.06t) = 2, 0.06t = ln 2, and t = ln(2)/0.06 ≈ 11.55 years.
      explanation: |
        Six points: 2 for the three balances (1790.85, 1819.40, 1822.12); 1 for the diminishing-gains pattern and the link to e as a limit; 1 for 6.18% with the interest-on-interest reason; 2 for the doubling time 11.55 years from the equation e^(0.06t) = 2.
