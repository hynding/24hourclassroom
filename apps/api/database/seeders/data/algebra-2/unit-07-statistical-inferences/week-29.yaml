week: 29
unit: 7
title: "Study Design and Describing Distributions"
topics: ["7.1", "7.2", "7.3", "7.4"]
guide: guides/week-29.md
guide_description: |
  How graphs and headlines mislead and what to ask before trusting a claim; statistical questions and the
  three study types (survey, observational study, experiment) with association versus causation; what
  random selection and random assignment each do; and describing a distribution by shape, centre and
  spread, with the mean, median and standard deviation.
flashcards_description: |
  30 cards on skeptical reading of data, study types, randomness in sampling and grouping, and describing distributions.

flashcards:
  - front: Questions to ask before trusting a claim made from data
    back: |
      Who was measured? How were they chosen? How many? What exactly was asked or measured? Does the data answer the question? What was left out?
    topic_code: "7.1"
  - front: Vertical axis that starts far above zero → why it misleads
    back: |
      Small differences fill the whole height of the graph, so a 2% change can look like a doubling.
    topic_code: "7.1"
  - front: Graph that shows only a short time window → why it misleads
    back: |
      A brief wobble can look like a trend; the same data over years may show the opposite.
    topic_code: "7.1"
  - front: Leading question → what it is
    back: |
      Wording that pushes an answer: "Do you support wasting money on the stadium?" Answers to it say little about real opinion.
    topic_code: "7.1"
  - front: The claim "9 out of 10 dentists recommend it" → what to ask
    back: |
      How many dentists (9 of 10 or 900 of 1,000)? How were they chosen? What was the exact question? Were other brands offered?
    topic_code: "7.1"
  - front: Statistical question → definition
    back: |
      A question answered by collecting data that vary from person to person or item to item, such as how far students travel to school.
    topic_code: "7.2"
  - front: Survey → definition
    back: |
      Asking a sample of a population questions and recording the answers; estimates a proportion or mean for the population.
    topic_code: "7.2"
  - front: Observational study → definition
    back: |
      Measuring existing groups without changing anything, such as comparing people who already do and do not do something. Shows association only.
    topic_code: "7.2"
  - front: Experiment → definition
    back: |
      The researcher assigns subjects to a treatment group and a control group, applies the treatment, and measures the response.
    topic_code: "7.2"
  - front: The only study type that can support a claim of cause
    back: |
      A randomized experiment: random assignment makes the groups alike, so the treatment is the only systematic difference.
    topic_code: "7.2"
  - front: Association versus causation
    back: |
      Association: two variables change together. Causation: one makes the other change. Observational studies show the first; only experiments can show the second.
    topic_code: "7.2"
  - front: Confounding variable → definition and example
    back: |
      A third factor tied to both the treatment and the response. Families that make time for breakfast may also make time for homework, explaining the breakfast–grades link.
    topic_code: "7.2"
  - front: Steps to design a simple experiment
    back: |
      Name the treatment and the response; get subjects; assign them to groups at random; apply the treatment to one group only; measure both groups the same way; compare.
    topic_code: "7.2"
  - front: The finding "teens who eat breakfast have higher grades" → what the study shows
    back: |
      An association from an observational study. Nobody was assigned to eat or skip breakfast, so a confounder could explain it.
    topic_code: "7.2"
  - front: Random selection → purpose
    back: |
      Every member of the population has the same chance of being chosen, so the sample is representative and differs from the population only by chance, not systematically.
    topic_code: "7.3"
  - front: Random assignment → purpose
    back: |
      Splitting subjects into groups by chance makes the groups alike on average in every trait, so a difference in results is due to the treatment or to chance, not to who was in which group.
    topic_code: "7.3"
  - front: Volunteer (self-selected) sample → the problem
    back: |
      People who choose to respond differ from those who do not; online polls draw those who feel strongly.
    topic_code: "7.3"
  - front: Convenience sample → the problem
    back: |
      Whoever is nearby (the first 100 at a mall) is not the population; shoppers, early arrivers or office visitors are unusual in unknown ways.
    topic_code: "7.3"
  - front: Judgment sample of "typical" rectangles → what went wrong
    back: |
      People picked large rectangles, so the sample mean area came out well above the population mean. Random choice has no such tilt.
    topic_code: "7.3"
  - front: Letting volunteers choose their own group in an experiment → the problem
    back: |
      Those who think they need the treatment, or like it, pick that group; the groups differ before the treatment starts.
    topic_code: "7.3"
  - front: Choosing 100 of a school's 1,200 students fairly
    back: |
      Number the students 1 to 1,200 and pick 100 numbers with a random number generator. Not the band class, not a social-media poll, not office visitors.
    topic_code: "7.3"
  - front: Shape words for a distribution
    back: |
      Symmetric, bell-shaped, skewed right (long tail of high values), skewed left (long tail of low values), uniform (flat), bimodal (two peaks).
    topic_code: "7.4"
  - front: Skewed right versus skewed left → how to tell
    back: |
      Name the skew for the side with the long tail. Incomes are skewed right; scores on an easy test are skewed left.
    topic_code: "7.4"
  - front: Mean versus median under skew or an outlier
    back: |
      The mean is pulled toward the tail or outlier; the median barely moves. Report the median for skewed data, the mean for symmetric data.
    topic_code: "7.4"
  - front: Standard deviation → meaning and how to compute
    back: |
      A typical distance from the mean. Square each deviation from the mean, average the squares, take the square root. (The sample version divides by n − 1.)
    topic_code: "7.4"
  - front: Mean, median and standard deviation of 4, 6, 6, 7, 12
    back: |
      Mean 7, median 6; squared deviations 9, 1, 1, 0, 25 sum to 36, so the population standard deviation is √(36/5) ≈ 2.68.
    topic_code: "7.4"
  - front: Changing the largest value of a data set to something much larger → effects
    back: |
      The mean and standard deviation increase; the median does not change; the shape becomes skewed right with an outlier.
    topic_code: "7.4"
  - front: Bimodal distribution → meaning and example
    back: |
      Two peaks, usually two mixed groups: heights of adults and young children together. The mean lands between the peaks and describes almost nobody.
    topic_code: "7.4"
  - front: Uniform distribution → meaning and example
    back: |
      Roughly flat: every value about equally common, such as the last digit of phone numbers or the result of a fair die.
    topic_code: "7.4"
  - front: When the mean and the median are equal
    back: |
      For a symmetric distribution. Any skew or outlier separates them, with the mean on the tail side.
    topic_code: "7.4"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 7.1 to 7.4: skeptical reading of data,
    study types, random selection and assignment, and describing distributions), with about a quarter
    reviewing earlier units. Includes a shared-context set on a study-app claim. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: the study-app claim (7.1, 7.2, 7.3)
    - slug: alg2-u07-w29-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Algebra 2, Unit 7, Lesson 2"
      points: 1
      stimulus: |
        A website reports: "Students who use our study app score 12 points higher on exams. We compared the exam scores of 2,000 students who had downloaded the app with 2,000 students who had not."
      prompt: |
        What type of study is this?
      options:
        - "An experiment"
        - "An observational study"
        - "A simulation"
        - "A survey"
      option_explanations:
        - |
          An experiment would assign students to use or not use the app; here nobody was assigned.
        - |
          Correct. The students chose for themselves whether to download the app; the researchers only observed and compared existing groups.
        - |
          A simulation generates data from a model; this used real students' scores.
        - |
          A survey asks people questions; this compared measured exam scores.
      answer: 1
    - slug: alg2-u07-w29-q02
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Algebra 2, Unit 7, Lesson 2"
      points: 1
      stimulus: |
        A website reports: "Students who use our study app score 12 points higher on exams. We compared the exam scores of 2,000 students who had downloaded the app with 2,000 students who had not."
      prompt: |
        What does this study show?
      options:
        - "An association between using the app and higher scores, but not that the app causes them"
        - "That the app has no effect, because the groups were not surveyed"
        - "That the app causes scores to rise by 12 points"
        - "Nothing, because the sample is too small"
      option_explanations:
        - |
          Correct. Without random assignment, other differences between the groups could explain the gap.
        - |
          The study does find a difference; the issue is what explains it, not whether it exists.
        - |
          Only a randomized experiment can support a claim of cause; this compared self-selected groups.
        - |
          Four thousand students is a large sample; the problem is how the groups formed, not their size.
      answer: 0
    - slug: alg2-u07-w29-q03
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Algebra 2, Unit 7, Lesson 3"
      points: 1
      stimulus: |
        A website reports: "Students who use our study app score 12 points higher on exams. We compared the exam scores of 2,000 students who had downloaded the app with 2,000 students who had not."
      prompt: |
        What change to the design would allow a claim that the app causes higher scores?
      options:
        - "Ask the app users whether they think the app helped."
        - "Compare only students at the same school."
        - "Compare 20,000 app users with 20,000 non-users instead."
        - "Randomly assign volunteers to use the app or not, then compare their scores."
      option_explanations:
        - |
          Opinions about the app are not evidence of its effect on scores.
        - |
          That removes one possible difference but leaves every other way the self-selected groups differ.
        - |
          A bigger observational study has the same flaw: the groups still chose themselves.
        - |
          Correct. Random assignment makes the two groups alike on average, so the app is the only systematic difference.
      answer: 3
    - slug: alg2-u07-w29-q04
      type: multiple_choice
      topic_code: "7.1"
      source: "IM Algebra 2, Unit 7, Lesson 1"
      points: 1
      stimulus: |
        A website reports: "Students who use our study app score 12 points higher on exams. We compared the exam scores of 2,000 students who had downloaded the app with 2,000 students who had not."
      prompt: |
        Which is the most plausible confounding variable?
      options:
        - "Exam scores are measured in points."
        - "Both groups have 2,000 students."
        - "Students who go looking for study apps already study more than those who do not."
        - "The app is free to download."
      option_explanations:
        - |
          The unit of measurement has nothing to do with why the groups differ.
        - |
          Equal group sizes are a feature of the comparison, not a variable tied to both app use and scores.
        - |
          Correct. Motivation to study is linked both to downloading the app and to higher scores, so it could explain the gap without the app doing anything.
        - |
          The price does not connect to exam scores.
      answer: 2
    # ---- Single items on this week
    - slug: alg2-u07-w29-q05
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Algebra 2, Unit 7, Lesson 2"
      points: 1
      prompt: |
        Which of these is a statistical question?
      options:
        - "What is the school's phone number?"
        - "How many days are there in March?"
        - "How many hours per week do students at this school work at paid jobs?"
        - "How many hours did I work last week?"
      option_explanations:
        - |
          The phone number is a single fact to look up, not data that vary from person to person.
        - |
          A fixed fact; there is no variability to collect.
        - |
          Correct. Answering it needs data that vary from student to student.
        - |
          This has a single fixed answer for one person; nothing varies.
      answer: 2
    - slug: alg2-u07-w29-q06
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Algebra 2, Unit 7, Lesson 2"
      points: 1
      prompt: |
        A gardener wants to know whether a new fertilizer makes tomato plants produce more fruit. Which study design is best?
      options:
        - "Give the fertilizer to the 20 healthiest-looking plants and compare them with the rest."
        - "Survey gardeners about whether they use the fertilizer and how their tomatoes do."
        - "Compare the harvests of gardens that happen to use the fertilizer with those that do not."
        - "Randomly assign half of 40 similar plants to get the fertilizer and compare the fruit counts."
      option_explanations:
        - |
          Choosing the healthiest plants for the treatment builds a difference into the groups before the fertilizer is applied.
        - |
          A survey reports opinions and existing habits; it cannot isolate the fertilizer's effect.
        - |
          An observational comparison leaves confounders (soil, sunlight, the gardener's skill) in place.
        - |
          Correct. Random assignment to treatment and control makes a cause-and-effect conclusion possible.
      answer: 3
    - slug: alg2-u07-w29-q07
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Algebra 2, Unit 7, Lesson 3"
      points: 1
      prompt: |
        What is the purpose of assigning subjects to the treatment and control groups at random?
      options:
        - "To make the groups alike on average in every trait, so the treatment is the only systematic difference."
        - "To make sure the treatment group is larger."
        - "To make the sample represent the whole population."
        - "To guarantee the two groups have exactly the same mean before the treatment."
      option_explanations:
        - |
          Correct. Chance, not the subjects' choices or the researcher's judgment, decides who gets the treatment.
        - |
          Group sizes are usually kept equal; randomness is about who, not how many.
        - |
          That is the job of random selection of the sample; assignment is about the groups within it.
        - |
          Random groups still differ a little by chance; the point is that they do not differ systematically.
      answer: 0
    - slug: alg2-u07-w29-q08
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Algebra 2, Unit 7, Lesson 4"
      points: 1
      prompt: |
        A distribution has a long tail of high values to the right. Which statement is true?
      options:
        - "It is symmetric, and the mean equals the median."
        - "It is skewed right, and the mean is greater than the median."
        - "It is skewed right, and the mean equals the median."
        - "It is skewed left, and the mean is less than the median."
      option_explanations:
        - |
          A long tail on one side is the opposite of symmetric.
        - |
          Correct. The skew is named for the tail, and the tail of high values pulls the mean up past the median.
        - |
          The mean and median agree only for symmetric data; a tail separates them.
        - |
          The tail is on the right, so the skew is to the right, and the mean is pulled up, not down.
      answer: 1
    - slug: alg2-u07-w29-q09
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Algebra 2, Unit 7, Lesson 4"
      points: 1
      prompt: |
        The data set 3, 5, 5, 6, 8, 21 has mean 8 and median 5.5. Which value better describes a typical member, and why?
      options:
        - "The median, 5.5, because it is smaller."
        - "The mean, 8, because it is a whole number."
        - "The mean, 8, because it uses every value."
        - "The median, 5.5, because the outlier 21 pulls the mean above five of the six values."
      option_explanations:
        - |
          Smaller is not the reason; the median wins because it ignores how extreme the outlier is.
        - |
          Whether a number is whole has nothing to do with how typical it is.
        - |
          Using every value is exactly why the mean is dragged toward the outlier.
        - |
          Correct. With a single high outlier the data are skewed right, and the median resists the pull.
      answer: 3
    - slug: alg2-u07-w29-q10
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Algebra 2, Unit 7, Lesson 4"
      points: 1
      prompt: |
        On an easy test most students scored between 85 and 100, and a few scored between 40 and 60. What is the shape of the score distribution?
      options:
        - "Skewed right"
        - "Uniform"
        - "Skewed left"
        - "Symmetric"
      option_explanations:
        - |
          Skewed right would have the tail among the high values; here the tail is the low scores.
        - |
          Uniform means every score range is about equally common, which is not the case.
        - |
          Correct. The peak is high and the long tail stretches toward the low values on the left.
        - |
          A cluster at one end with a tail at the other is not symmetric.
      answer: 2
    - slug: alg2-u07-w29-q11
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Algebra 2, Unit 6, Lesson 4"
      points: 1
      prompt: |
        What is cos(5π/6)?
      options:
        - "√3/2"
        - "−√3/2"
        - "1/2"
        - "−1/2"
      option_explanations:
        - |
          √3/2 is cos(π/6); in quadrant II the x-coordinate is negative.
        - |
          Correct. 5π/6 is in quadrant II with reference angle π/6, so the cosine is −cos(π/6) = −√3/2.
        - |
          1/2 is sin(5π/6), the y-coordinate, not the cosine.
        - |
          −1/2 is cos(2π/3), where the reference angle is π/3.
      answer: 1
    - slug: alg2-u07-w29-q12
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Algebra 2, Unit 6, Lesson 15"
      points: 1
      prompt: |
        What is the period of y = sin(θ/2)?
      options:
        - "4π"
        - "1/2"
        - "2π"
        - "π"
      option_explanations:
        - |
          Correct. 2π ÷ (1/2) = 4π: the wave is stretched to twice its usual length.
        - |
          1/2 is b, the coefficient of θ; the period is 2π divided by it.
        - |
          2π is the period of sin θ; the factor 1/2 inside changes it.
        - |
          π would be the period of sin(2θ); dividing the input by 2 lengthens the period.
      answer: 0
    - slug: alg2-u07-w29-q13
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 2, Unit 2, Lesson 4"
      points: 1
      prompt: |
        What is (2x² − 3x + 1) − (x² + 4x − 5)?
      options:
        - "3x² + x − 4"
        - "x² − 7x + 6"
        - "x² + x − 4"
        - "x² − 7x − 4"
      option_explanations:
        - |
          This adds the x² terms instead of subtracting them.
        - |
          Correct. 2x² − x² = x², −3x − 4x = −7x, and 1 − (−5) = 6.
        - |
          The whole second polynomial is subtracted, so 4x becomes −4x and −5 becomes +5.
        - |
          The constant term is 1 − (−5) = 1 + 5 = 6, not −4; subtracting a negative adds.
      answer: 1
    - slug: alg2-u07-w29-q14
      type: multi_select
      topic_code: "7.2"
      source: "IM Algebra 2, Unit 7, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        Which of these studies are experiments? Select all that apply.
      options:
        - "A random sample of 500 adults is asked how many hours they sleep."
        - "Half of 60 seedlings, chosen at random, are given extra light; the heights of both halves are compared after a month."
        - "A researcher compares the blood pressure of people who are already vegetarians with that of people who are not."
        - "Patients are randomly given either a new drug or a placebo, and their recovery times are compared."
        - "Students in a class are assigned by coin flip to study with music or in silence, then take the same test."
      option_explanations:
        - |
          Asking questions of a sample is a survey.
        - |
          Correct. The researcher assigns the treatment (extra light) at random and measures a response.
        - |
          Nobody was assigned to be vegetarian; this compares existing groups, an observational study.
        - |
          Correct. Random assignment to drug or placebo is the classic experiment.
        - |
          Correct. The coin flip assigns the treatment (music), so this is a randomized experiment.
      answer: [1, 3, 4]
    - slug: alg2-u07-w29-q15
      type: multi_select
      topic_code: "7.4"
      source: "IM Algebra 2, Unit 7, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the standard deviation of a data set are true? Select all that apply.
      options:
        - "It measures a typical distance of the values from the mean."
        - "Adding one value far from the rest increases it."
        - "It is never negative."
        - "If every value in the set is the same, it is 0."
        - "It equals the mean minus the median."
      option_explanations:
        - |
          Correct. That is its meaning: how far from the mean the data typically sit.
        - |
          Correct. A far-off value adds a large squared deviation (and moves the mean), raising the result.
        - |
          Correct. It is the square root of an average of squares, so it cannot be negative.
        - |
          Correct. Every deviation from the mean is 0, so the standard deviation is 0.
        - |
          The difference between mean and median says something about skew, not about spread.
      answer: [0, 1, 2, 3]
    - slug: alg2-u07-w29-q16
      type: true_false
      topic_code: "7.2"
      source: "IM Algebra 2, Unit 7, Lesson 2"
      points: 1
      prompt: |
        True or false: a well-run observational study with a very large sample can prove that one variable causes another.
      answer: false
      explanation: |
        False. However large, an observational study compares groups that formed themselves, so a confounding variable can always explain an association. Only random assignment in an experiment supports a claim of cause.
    - slug: alg2-u07-w29-q17
      type: true_false
      topic_code: "4.2"
      source: "IM Algebra 2, Unit 4, Lesson 2"
      points: 1
      prompt: |
        True or false: a quantity that decays by 20% each year is multiplied by 0.8 each year.
      answer: true
      explanation: |
        True. Losing 20% leaves 80%, so the growth factor is 1 − 0.2 = 0.8, and the amount after t years is a · 0.8ᵗ.
    - slug: alg2-u07-w29-q18
      type: fill_blank
      topic_code: "7.4"
      source: "IM Algebra 2, Unit 7, Lesson 4"
      points: 1
      prompt: |
        The median of the data set 7, 3, 9, 12, 5, 8 is ____
      answer: ["7.5", "7,5"]
      explanation: |
        Sorted: 3, 5, 7, 8, 9, 12. With six values the median is the average of the middle two, (7 + 8)/2 = 7.5.
    - slug: alg2-u07-w29-q19
      type: fill_blank
      topic_code: "6.3"
      source: "IM Algebra 2, Unit 6, Lesson 3"
      points: 1
      prompt: |
        In radians, 90° is ____
      answer: ["π/2", "pi/2", "π/2 radians"]
      explanation: |
        A quarter turn is a quarter of 2π, which is π/2.
    - slug: alg2-u07-w29-q20
      type: numeric
      topic_code: "4.8"
      source: "IM Algebra 2, Unit 4, Lesson 8"
      points: 1
      prompt: |
        Solve 3ˣ = 81 for x.
      answer: { value: 4, tolerance: 0 }
      explanation: |
        3⁴ = 81, so x = 4.
    - slug: alg2-u07-w29-q21
      type: numeric
      topic_code: "7.4"
      source: "IM Algebra 2, Unit 7, Lesson 4"
      points: 1
      prompt: |
        Find the standard deviation of 2, 4, 4, 4, 5, 5, 7, 9, using the population formula (divide the sum of squared deviations by the number of values, 8). Give an exact value.
      answer: { value: 2, tolerance: 0.01 }
      explanation: |
        The mean is 40/8 = 5. Squared deviations: 9, 1, 1, 1, 0, 0, 4, 16, total 32. 32/8 = 4, and √4 = 2.
    - slug: alg2-u07-w29-q22
      type: numeric
      topic_code: "3.2"
      source: "IM Algebra 2, Unit 3, Lesson 2"
      points: 1
      prompt: |
        Evaluate √144 + ∛(−27).
      answer: { value: 9, tolerance: 0 }
      explanation: |
        √144 = 12 and ∛(−27) = −3 (since (−3)³ = −27), so the sum is 9.
    - slug: alg2-u07-w29-q23
      type: short_answer
      topic_code: "7.3"
      source: "IM Algebra 2, Unit 7, Lesson 3"
      points: 3
      prompt: |
        A gym has 40 volunteers to test whether a new six-week training program improves the number of push-ups a person can do.
        (a) Describe a method for assigning the volunteers to the program group and the control group at random.
        (b) Explain why letting the volunteers choose their own group would spoil the study.
        (c) Say what should be measured, when, and how the two groups should be compared.
      answer: |
        (a) Write each volunteer's name on a slip, shuffle the 40 slips, and deal the first 20 to the program group and the rest to the control group (or number the volunteers and pick 20 numbers with a random number generator).
        (b) People who feel strong, or keen, or who need help would sort themselves unevenly between the groups, so the groups would differ before the program starts and any difference at the end could be due to who chose what, not to the program.
        (c) Count each person's push-ups before the six weeks and after; compute each person's change; compare the mean change of the program group with the mean change of the control group.
      explanation: |
        Three points, one per part. (a) a genuinely random method (slips, random numbers, coin flips), not "every other person in line". (b) self-selection makes the groups differ before treatment. (c) a before-and-after measure of push-ups compared between the groups' means.
    - slug: alg2-u07-w29-q24
      type: short_answer
      topic_code: "7.4"
      source: "IM Algebra 2, Unit 7, Lesson 4"
      points: 3
      prompt: |
        A data set is 20, 22, 23, 25, 25, 26, 29.
        (a) Find the mean (to one decimal place) and the median.
        (b) The 29 is changed to 59. Find the new mean and median and describe the new shape.
        (c) After the change, which measure of centre should be reported as "typical", and why?
      answer: |
        (a) Mean = 170/7 ≈ 24.3; median = 25 (the fourth of seven values).
        (b) New mean = 200/7 ≈ 28.6; median still 25. The distribution is now skewed right with an outlier at 59.
        (c) The median, 25: the mean 28.6 is larger than six of the seven values because the single outlier pulls it, while the median still sits in the middle of the data.
      explanation: |
        Three points, one per part. (a) 24.3 and 25. (b) 28.6, 25, skewed right or outlier named. (c) median with the outlier reason.
    - slug: alg2-u07-w29-q25
      type: long_answer
      topic_code: "7.1"
      source: "IM Algebra 2, Unit 7, Lesson 1"
      points: 6
      prompt: |
        A cereal company's advertisement says: "Kids who eat our cereal get better grades! In our survey of 50 families who buy our cereal, 80% said their child's grades were good or excellent." Write a full critique that (1) identifies the type of study and what such a study can and cannot show, (2) explains two problems with how the families were chosen, (3) explains a problem with what was asked or measured and names a plausible confounding variable, and (4) outlines a study that could actually test whether the cereal affects grades, naming the treatment, the control, how groups are formed and what is measured.
      answer: |
        (1) It is a survey of existing customers, an observational design. At most it can show an association between buying the cereal and parents reporting good grades; it cannot show that the cereal causes better grades, because nobody was assigned to eat it.
        (2) The 50 families are all buyers, chosen by the company (a convenience or self-selected sample, not a random sample of families), so they may be unlike families in general; and there is no comparison group of non-buyers, so "better" has nothing to be better than. Fifty is also a small sample on which to rest a national claim.
        (3) The measure is the parents' own description of grades as "good or excellent", a vague and flattering self-report rather than actual grades, and the question may have been phrased to invite a positive answer. A plausible confounder is family income or attention: families who buy branded cereal and answer company surveys may also be the families who supervise homework, which would explain good grades without the cereal doing anything.
        (4) Recruit volunteer families with school-age children; randomly assign half to eat the cereal for breakfast every school day for a term (treatment) and half to eat their usual breakfast (control); keep everything else the same; record each child's actual grades before and after the term from school reports; compare the mean change in grades between the two groups.
      explanation: |
        Six points: 1 for naming a survey or observational study and association-not-causation in (1); 2 for two distinct sampling problems in (2) (buyers only, no comparison group, company-chosen, small); 1 for the self-report or leading-question problem and 1 for a sensible confounder in (3); 1 for a randomized experiment with treatment, control, random assignment and a real grade measure in (4).
