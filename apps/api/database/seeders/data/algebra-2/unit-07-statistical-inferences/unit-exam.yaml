    type: short_answer
    topic_code: "7.10"
    source: "IM Algebra 2, Unit 7, Lesson 10"
    points: 3
    prompt: |
      A random sample of 1,200 residents is asked whether they support a new bus route; 540 say yes. A simulation of many samples of 1,200 from a population with 45% support gives sample proportions with standard deviation 0.014.
      (a) Give the sample proportion and the margin of error.
      (b) Write the interval estimate as a sentence a newspaper could print.
      (c) The city council wants a margin of error of about 0.014. Roughly how large a sample would it need, and why?
    answer: |
      (a) 540/1,200 = 0.45; margin of error 2 · 0.014 = 0.028, about 0.03.
      (b) About 45% of residents support the route, with a margin of error of about 3 percentage points: support is likely between 42% and 48%.
      (c) About 4,800: halving the margin takes about four times the sample, because the standard deviation of sample proportions shrinks like 1/√n.
    explanation: |
      Three points, one per part. (a) 0.45 and about 0.03. (b) 42% to 48% with appropriate hedging. (c) about 4,800 with the four-times reason.
  - slug: alg2-u07-exam-q44
    type: short_answer
    topic_code: "7.14"
    source: "IM Algebra 2, Unit 7, Lesson 14"
    points: 3
    prompt: |
      In a randomized experiment the treatment group's mean exceeds the control group's by 2.5 units. Random regroupings of the results give differences in means with mean 0 and standard deviation 1.0, roughly normal. The area to the left of z = 2.5 is 0.994.
      (a) Find the z-score of the observed difference and the proportion of regroupings at least as extreme in both tails.
      (b) State the decision at a 5% cutoff and at a 1% cutoff.
      (c) Explain in one sentence what the proportion in (a) represents.
    answer: |
      (a) z = 2.5/1.0 = 2.5; one tail 1 − 0.994 = 0.006, both tails about 0.012 (1.2%).
      (b) Significant at 5% (1.2% < 5%); not significant at 1% (1.2% > 1%).
      (c) It is the proportion of random regroupings, with no treatment effect at all, that would produce a difference as large as the observed one in either direction: how often chance alone does this.
    explanation: |
      Three points, one per part. (a) z = 2.5 and about 0.012. (b) both decisions. (c) a correct description of the two-tailed proportion under chance.
  - slug: alg2-u07-exam-q45
    type: long_answer
    topic_code: "7.15"
    source: "IM Algebra 2, Unit 7, Lesson 15"
    points: 6
    prompt: |
      A teacher wonders whether a ten-minute walk before a quiz improves students' quiz scores. Write a full response that (1) explains why simply comparing the scores of students who choose to walk with those who do not would not answer the question, (2) designs a randomized experiment, naming the treatment, the control, how the groups are formed, what is measured and how the groups are kept otherwise alike, (3) explains how the results would be analysed with a randomization distribution, including what number is compared with what and how the decision is made, and (4) states two limitations the teacher should mention when reporting the result.
    answer: |
      (1) Students who choose to walk may differ from the others in ways that affect scores, such as energy, mood, sleep or habits; such a comparison is observational and shows only association, with those confounders unaccounted for.
      (2) Treatment: a ten-minute walk immediately before the quiz; control: ten minutes of sitting quietly (so both groups spend the same time away from studying). Assign the class at random, for example by shuffling slips with half marked "walk". Everyone takes the same quiz at the same time under the same conditions, and the quizzes are graded without knowing who walked. The response is each student's quiz score, and the statistic is the difference in mean scores, walk minus sit.
      (3) Pretend the walk has no effect and shuffle all the scores into two groups of the same sizes at random many times, recording the difference in means each time; the differences centre at 0 and are roughly normal. Compare the observed difference with this distribution: find the proportion of regroupings at least as extreme (both tails), or z = (observed difference)/(regrouping standard deviation). If that proportion is below a cutoff chosen beforehand (say 5%), the difference is significant and the walk is the likely cause; otherwise there is not enough evidence.
      (4) Limitations (any two): one class is a small sample, so chance differences are large and a real effect could be missed; the result applies to this class and this quiz and may not generalise to other students or subjects; students could not be blinded to whether they walked, so expectations might play a part; a significant result shows the walk likely helped on average but not by how much for any individual, and "not significant" would not mean the walk does nothing.
    explanation: |
      Six points: 1 for self-selection and confounding in (1); 2 for (2), one for treatment, control and random assignment and one for keeping conditions alike and a clear measure; 2 for (3), one for the regrouping distribution centred at 0 and one for the comparison with a cutoff set beforehand; 1 for two sensible limitations in (4).
