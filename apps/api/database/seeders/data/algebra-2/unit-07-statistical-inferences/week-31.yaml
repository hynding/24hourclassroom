      prompt: |
        A factory needs its tennis balls to have a mean diameter between 6.54 cm and 6.86 cm. Twelve random samples of 30 balls have sample mean diameters whose mean is 6.62 cm and whose standard deviation is 0.02 cm.
        (a) Give the margin of error and the interval estimate for the mean diameter.
        (b) Does the factory appear to meet the requirement? Explain.
        (c) Explain what "appear to" is doing in your answer to (b).
      answer: |
        (a) Margin 2 · 0.02 = 0.04 cm; the mean diameter is likely between 6.58 cm and 6.66 cm (6.62 ± 0.04).
        (b) Yes: the whole interval lies inside 6.54 to 6.86, so the mean diameter is likely within the requirement.
        (c) The interval is based on random samples and captures the true mean about 95% of the time, not always; and it says nothing about individual balls, only about the mean.
      explanation: |
        Three points, one per part. (a) 0.04 and 6.58 to 6.66. (b) yes, interval inside the requirement. (c) the 95%-not-certain point or the mean-not-individuals point.
    - slug: alg2-u07-w31-q25
      type: long_answer
      topic_code: "7.10"
      source: "IM Algebra 2, Unit 7, Lesson 10"
      points: 6
      prompt: |
        A city wants to estimate the proportion of its 40,000 households that own a pet. Write a full response that (1) describes how to choose random samples of households and explains why random selection matters, (2) uses these results to give an estimate with a margin of error: 25 random samples of 60 households gave sample proportions with mean 0.58 and standard deviation 0.06, (3) explains what the "likely" in the interval statement means and why the interval could still miss the true proportion, and (4) says how the city could cut the margin of error to about 0.06, what that would cost, and why switching to a convenience sample at a pet store instead would not help however large it was.
      answer: |
        (1) Number every household from a complete list (such as the utility or tax roll) and pick 60 numbers with a random number generator for each sample, so every household has the same chance of being chosen. Random selection makes the sample differ from the population only by chance, not systematically, which is what lets a margin of error describe the error.
        (2) Estimate 0.58; margin of error 2 · 0.06 = 0.12; the proportion of pet-owning households is likely between 0.46 and 0.70 (0.58 ± 0.12).
        (3) "Likely" means the method produces an interval that contains the true proportion about 95% of the time, since about 95% of sample proportions lie within two standard deviations of the centre. About one time in twenty the samples happen to be unusual and the interval misses; the margin of error describes chance error, not a guarantee.
        (4) Halving the margin from 0.12 to 0.06 takes about four times the sample size, samples of about 240 households, so four times the interviewing cost and time. A pet-store sample would be biased toward pet owners whatever its size; the margin of error only measures random error, so a huge biased sample would give a tiny margin around a wrong answer.
      explanation: |
        Six points: 1 for a genuinely random method and 1 for why randomness matters in (1); 1 for 0.58 ± 0.12 in (2); 1 for the 95% meaning and the possibility of a miss in (3); 1 for four times the sample (about 240) with its cost and 1 for the bias argument in (4).
