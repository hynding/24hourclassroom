# The Algebra 2 course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: Algebra 2
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: Algebra 2
slug: alg2
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full year of Algebra 2 for a student who has finished Algebra 1 and
  Geometry, one week at a time: a study guide, a flashcard deck and a quiz
  every week, a summary sheet and an exam at the end of each of the seven
  units (sequences, polynomials and rational functions, complex numbers and
  rational exponents, exponential and logarithmic functions, transformations,
  trigonometric functions, and statistical inference), and a final-exam prep
  guide with a full practice final. Adapted from IM 9–12 Math by Illustrative
  Mathematics (Algebra 2), licensed under CC BY 4.0, and rewritten in our own
  words with original worked examples, questions and cards.
teacher: { name: "Algebra 2 Teacher", email: algebra2@example.com }
student: { name: "Algebra 2 Student", email: algebra2-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
start_date: 2026-08-31
subject: math
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The format of the practice final, what each unit contributes, the formulas and procedures to know cold, how to show work for the free-response items, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["Illustrative Mathematics", "CC BY 4.0"]
attribution: |
  Adapted from IM 9–12 Math by Illustrative Mathematics (Algebra 2,
  https://im.kendallhunt.com/HS/teachers/3/index.html), © 2019 Illustrative
  Mathematics, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/). The lesson sequence and
  learning goals follow the IM course; every explanation, worked example,
  flashcard and question here was written for this course. The Illustrative
  Mathematics name and logo are used only to credit the source.
# The eight Standards for Mathematical Practice; guides tag lessons with them.
practices:
  MP1: Make sense of problems and persevere in solving them
  MP2: Reason abstractly and quantitatively
  MP3: Construct viable arguments and critique the reasoning of others
  MP4: Model with mathematics
  MP5: Use appropriate tools strategically
  MP6: Attend to precision
  MP7: Look for and make use of structure
  MP8: Look for and express regularity in repeated reasoning
