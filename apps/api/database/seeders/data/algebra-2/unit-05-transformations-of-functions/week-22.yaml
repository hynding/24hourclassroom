week: 22
unit: 5
title: "Symmetry, Writing Transformations and Scaling Outputs"
topics: ["5.5", "5.6", "5.7", "5.8"]
guide: guides/week-22.md
guide_description: |
  Symmetry about the y-axis (even) and about the origin (odd) read from graphs and used to find values; the
  algebraic tests f(−x) = f(x) and f(−x) = −f(x), with polynomial parity shortcuts and one-point disproofs;
  writing the equation of a transformed function from a description or a graph for any parent function; and
  vertical scaling k · f(x), including which features change (heights, intercepts) and which do not (zeros).
flashcards_description: |
  27 cards on even and odd symmetry in graphs and equations, writing transformations algebraically, and
  vertical stretches, compressions and reflections.

flashcards:
  - front: Graph symmetric about the y-axis → point rule
    back: |
      (a, b) on the graph exactly when (−a, b) is. Examples: x², |x|, x⁴ − 3x². Such functions are called even.
    topic_code: "5.5"
  - front: Graph symmetric about the origin → point rule
    back: |
      (a, b) on the graph exactly when (−a, −b) is; a half-turn about (0, 0) leaves the graph unchanged. Examples: x³, x, 1/x. Such functions are called odd.
    topic_code: "5.5"
  - front: Even function with f(2) = 4 → f(−2)
    back: |
      f(−2) = 4, by y-axis symmetry.
    topic_code: "5.5"
  - front: Odd function with f(2) = 6 → f(−2)
    back: |
      f(−2) = −6, by origin symmetry.
    topic_code: "5.5"
  - front: Value of an odd function at 0
    back: |
      Must be 0 if defined, because f(−0) = −f(0) forces f(0) = −f(0). An even function can have any value at 0.
    topic_code: "5.5"
  - front: Graphs with neither symmetry
    back: |
      y = 2ˣ, y = (x − 1)², y = x² + x, y = √x: folding or half-turning does not match them to themselves.
    topic_code: "5.5"
  - front: Algebraic test for even
    back: |
      f(−x) = f(x) for every x. x⁴ − 3x²: (−x)⁴ − 3(−x)² = x⁴ − 3x². ✓
    topic_code: "5.6"
  - front: Algebraic test for odd
    back: |
      f(−x) = −f(x) for every x. x³ − x: (−x)³ − (−x) = −x³ + x = −(x³ − x). ✓
    topic_code: "5.6"
  - front: Classify x² + x
    back: |
      f(−x) = x² − x, which is neither f(x) nor −f(x): neither even nor odd.
    topic_code: "5.6"
  - front: Classify (x + 1)² quickly
    back: |
      f(1) = 4 and f(−1) = 0, which is neither 4 nor −4: neither. One failing pair of inputs disproves both symmetries.
    topic_code: "5.6"
  - front: Parity shortcut for polynomials
    back: |
      Only even powers (constants included): even. Only odd powers: odd. A mix: neither. x² − 5 is even, 5x³ − x is odd, x³ + 1 is neither.
    topic_code: "5.6"
  - front: Is 2ˣ even, odd or neither?
    back: |
      Neither: 2⁻ˣ = (1/2)ˣ is a different function from 2ˣ and from −2ˣ.
    topic_code: "5.6"
  - front: Why one matching point does not prove evenness
    back: |
      The equation f(−x) = f(x) must hold for every x. A single pair agreeing could be coincidence; a single pair disagreeing is a disproof.
    topic_code: "5.6"
  - front: Building a transformed equation, inside and outside
    back: |
      Horizontal shifts go inside with x: f(x − h). Reflection across the x-axis and vertical shifts go outside: −f(x) + k.
    topic_code: "5.7"
  - front: x³, left 1, down 4 → equation
    back: |
      (x + 1)³ − 4, through (−1, −4), y-intercept −3.
    topic_code: "5.7"
  - front: x², reflected across the x-axis, right 2, up 3 → equation
    back: |
      −(x − 2)² + 3: vertex (2, 3), opens downward, y-intercept −1, zeros 2 ± √3.
    topic_code: "5.7"
  - front: 2ˣ, right 2, up 1 → equation and features
    back: |
      2^(x − 2) + 1: asymptote y = 1, through (2, 2).
    topic_code: "5.7"
  - front: √x, reflected across the y-axis, up 2 → equation
    back: |
      √(−x) + 2: domain x ≤ 0, starts at (0, 2).
    topic_code: "5.7"
  - front: log₂(x), right 4 → equation and features
    back: |
      log₂(x − 4): asymptote x = 4, x-intercept (5, 0).
    topic_code: "5.7"
  - front: Reading a transformation from a graph
    back: |
      Identify the parent shape, locate the key point (vertex, corner, start, asymptote) for h and k, then check a second point to detect a reflection.
    topic_code: "5.7"
  - front: Vertical scaling y = k · f(x)
    back: |
      Every output multiplied by k: (a, b) → (a, kb). |k| > 1 stretches away from the x-axis; 0 < |k| < 1 compresses; k < 0 also reflects.
    topic_code: "5.8"
  - front: Image of (2, 5) under 3f(x) and of (1, 3) under −2f(x)
    back: |
      (2, 15); (1, −6).
    topic_code: "5.8"
  - front: Features that stay fixed under k · f(x)
    back: |
      The zeros, because k · 0 = 0. The y-intercept, maximum and minimum values are multiplied by k.
    topic_code: "5.8"
  - front: f has max 6 at x = 1 and zeros −2, 4 → describe −0.5f(x)
    back: |
      Minimum −3 at x = 1 (reflected and compressed); zeros still −2 and 4.
    topic_code: "5.8"
  - front: 2 · 2ˣ as a shift
    back: |
      2 · 2ˣ = 2ˣ⁺¹, so for this exponential a vertical stretch by the base equals a shift left 1. Not true for x²: 2x² is not a shift of x².
    topic_code: "5.8"
  - front: y = 2|x| − 5 → vertex and zeros
    back: |
      Vertex (0, −5); zeros where 2|x| = 5, x = ±2.5.
    topic_code: "5.8"
  - front: Vertical versus horizontal scaling (preview)
    back: |
      3f(x) triples heights; f(3x) (next week) changes widths. Do not confuse them.
    topic_code: "5.8"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 5.5 to 5.8: symmetry, writing
    transformations and scaling outputs), with about a third reviewing week 21 and Units 3–4. Includes a
    shared-context set on the function x³ − x. Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: f(x) = x³ − x (5.5, 5.6)
    - slug: alg2-u05-w22-q01
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Algebra 2, Unit 5, Lesson 6"
      points: 1
      stimulus: |
        Let f(x) = x³ − x.
      prompt: |
        Which expression equals f(−x) after simplifying?
      options:
        - "x³ − x"
        - "−x³ + x"
        - "−x³ − x"
        - "x³ + x"
      option_explanations:
        - |
          (−x)³ = −x³, so the cube term changes sign; the result is not f(x) itself.
        - |
          Correct. (−x)³ − (−x) = −x³ + x; both terms change sign.
        - |
          −(−x) = +x, so the second term becomes +x, not −x.
        - |
          The cube of −x is −x³, not x³, because an odd power keeps the negative sign.
      answer: 1
    - slug: alg2-u05-w22-q02
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Algebra 2, Unit 5, Lesson 6"
      points: 1
      stimulus: |
        Let f(x) = x³ − x.
      prompt: |
        Is f even, odd, or neither, and why?
      options:
        - "Even, because f(−x) = f(x)"
        - "Odd, because f(−x) = −x³ + x = −f(x)"
        - "Neither, because f has both a cube term and a linear term"
        - "Even, because the graph is symmetric about the x-axis"
      option_explanations:
        - |
          f(−x) = −x³ + x is not equal to x³ − x, so the even test fails.
        - |
          Correct. f(−x) = −(x³ − x), so f is odd and its graph is symmetric about the origin.
        - |
          Both terms have odd powers, so the function is odd; a mix of even and odd powers would be neither.
        - |
          A graph symmetric about the x-axis cannot be a function; even means symmetric about the y-axis.
      answer: 1
    - slug: alg2-u05-w22-q03
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Algebra 2, Unit 5, Lesson 5"
      points: 1
      stimulus: |
        Let f(x) = x³ − x.
      prompt: |
        The point (2, 6) is on the graph of f. Which other point must be on the graph, by symmetry?
      options:
        - "(−2, 6)"
        - "(−2, −6)"
        - "(2, −6)"
        - "(6, 2)"
      option_explanations:
        - |
          (−2, 6) would follow from y-axis symmetry, but f is odd, not even; f(−2) = −8 + 2 = −6.
        - |
          Correct. Odd functions are symmetric about the origin: (a, b) → (−a, −b), and f(−2) = −6 confirms it.
        - |
          (2, −6) would mean two outputs for one input, impossible for a function.
        - |
          Swapping coordinates is not a symmetry of this graph.
      answer: 1
    # ---- Single items on this week
    - slug: alg2-u05-w22-q04
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Algebra 2, Unit 5, Lesson 5"
      points: 1
      prompt: |
        The graph of an even function passes through (3, −2). Which statement must be true?
      options:
        - "The graph also passes through (−3, 2)."
        - "The graph also passes through (−3, −2)."
        - "The graph also passes through (3, 2)."
        - "The graph passes through the origin."
      option_explanations:
        - |
          (−3, 2) would come from origin symmetry, which is the odd case.
        - |
          Correct. Even functions are symmetric about the y-axis: (a, b) → (−a, b).
        - |
          (3, 2) and (3, −2) together would give one input two outputs.
        - |
          Even functions need not pass through the origin; y = x² + 1 does not.
      answer: 1
    - slug: alg2-u05-w22-q05
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Algebra 2, Unit 5, Lesson 6"
      points: 1
      prompt: |
        Which function is even?
      options:
        - "g(x) = x⁴ − 3x²"
        - "g(x) = x³ + 2x"
        - "g(x) = x² + x"
        - "g(x) = (x + 1)²"
      option_explanations:
        - |
          Correct. g(−x) = x⁴ − 3x² = g(x); only even powers appear.
        - |
          This one is odd: g(−x) = −x³ − 2x = −g(x).
        - |
          g(−x) = x² − x, which is neither g(x) nor −g(x).
        - |
          g(1) = 4 and g(−1) = 0, so g is neither even nor odd.
      answer: 0
    - slug: alg2-u05-w22-q06
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Algebra 2, Unit 5, Lesson 6"
      points: 1
      prompt: |
        Which function is neither even nor odd?
      options:
        - "h(x) = x² − 5"
        - "h(x) = 1/x"
        - "h(x) = x² + x"
        - "h(x) = 5x³ − x"
      option_explanations:
        - |
          x² − 5 has only even powers (the constant counts as even), so it is even.
        - |
          1/(−x) = −1/x = −f(x), so 1/x is odd, not "neither".
        - |
          Correct. h(−x) = x² − x, which equals neither h(x) nor −h(x); h(1) = 2 while h(−1) = 0.
        - |
          Only odd powers appear, so 5x³ − x is odd.
      answer: 2
    - slug: alg2-u05-w22-q07
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Algebra 2, Unit 5, Lesson 7"
      points: 1
      prompt: |
        Which equation gives the graph of y = x³ shifted left 1 and down 4?
      options:
        - "y = (x − 1)³ − 4"
        - "y = (x + 1)³ − 4"
        - "y = (x + 1)³ + 4"
        - "y = x³ − 1 − 4"
      option_explanations:
        - |
          (x − 1)³ shifts right 1, not left; the point (0, 0) would move to (1, −4).
        - |
          Correct. Replacing x by x + 1 shifts left 1; subtracting 4 shifts down 4. The point (0, 0) moves to (−1, −4).
        - |
          Adding 4 outside the cube shifts the graph up 4, not down.
        - |
          x³ − 5 is only a vertical shift down 5; the horizontal shift must be inside the cube.
      answer: 1
    - slug: alg2-u05-w22-q08
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Algebra 2, Unit 5, Lesson 7"
      points: 1
      prompt: |
        A parabola has vertex (2, 3) and passes through (0, −1). Which equation describes it as a transformation of y = x²?
      options:
        - "y = (x − 2)² + 3"
        - "y = −(x − 2)² + 3"
        - "y = (x + 2)² − 3"
        - "y = −(x + 2)² + 3"
      option_explanations:
        - |
          (0 − 2)² + 3 = 7, not −1; the arms must point down, so a reflection is needed.
        - |
          Correct. Vertex (2, 3) gives (x − 2)² + 3, and −(0 − 2)² + 3 = −1 matches, so the parabola is reflected.
        - |
          (x + 2)² − 3 has vertex (−2, −3), not (2, 3), and it opens upward.
        - |
          −(x + 2)² + 3 has vertex (−2, 3), the wrong x-coordinate.
      answer: 1
    - slug: alg2-u05-w22-q09
      type: multiple_choice
      topic_code: "5.8"
      source: "IM Algebra 2, Unit 5, Lesson 8"
      points: 1
      prompt: |
        The point (2, 5) is on the graph of f. Which point is on the graph of y = 3f(x)?
      options:
        - "(6, 5)"
        - "(2, 15)"
        - "(6, 15)"
        - "(2, 8)"
      option_explanations:
        - |
          Multiplying the output does not change the input; the x-coordinate stays 2.
        - |
          Correct. 3f(2) = 3 · 5 = 15, so (2, 15).
        - |
          Only the output is tripled, not both coordinates.
        - |
          (2, 8) would come from f(x) + 3, a shift, not a stretch.
      answer: 1
    - slug: alg2-u05-w22-q10
      type: multiple_choice
      topic_code: "5.8"
      source: "IM Algebra 2, Unit 5, Lesson 8"
      points: 1
      prompt: |
        Which equation gives the graph of y = √x stretched vertically by a factor of 4?
      options:
        - "y = √(4x)"
        - "y = 4√x"
        - "y = √x + 4"
        - "y = √(x + 4)"
      option_explanations:
        - |
          √(4x) = 2√x scales the input; it happens to equal a vertical stretch by 2, not 4.
        - |
          Correct. Every output is multiplied by 4: (4, 2) becomes (4, 8).
        - |
          Adding 4 outside the root shifts the graph up 4; it does not stretch it.
        - |
          Replacing x by x + 4 shifts the graph left.
      answer: 1
    - slug: alg2-u05-w22-q11
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Algebra 2, Unit 5, Lesson 7"
      points: 1
      prompt: |
        What are the horizontal asymptote and one point on the graph of h(x) = 2^(x − 2) + 1?
      options:
        - "Asymptote y = 1; point (2, 2)"
        - "Asymptote y = 0; point (2, 2)"
        - "Asymptote y = 1; point (−2, 2)"
        - "Asymptote y = 2; point (0, 1)"
      option_explanations:
        - |
          Correct. The +1 moves the asymptote to y = 1, and h(2) = 2⁰ + 1 = 2.
        - |
          The vertical shift of 1 moves the asymptote up to y = 1.
        - |
          x − 2 is a shift right, so the point (0, 1) of 2ˣ moves to (2, 2), not (−2, 2).
        - |
          The asymptote is y = 1, and h(0) = 2⁻² + 1 = 1.25.
      answer: 0
    - slug: alg2-u05-w22-q12
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 1
      prompt: |
        Which equation describes the graph of y = 2ˣ reflected across the x-axis?
      options:
        - "y = (1/2)ˣ"
        - "y = −2ˣ"
        - "y = 2^(−x)"
        - "y = log₂(x)"
      option_explanations:
        - |
          (1/2)ˣ = 2^(−x) is the reflection across the y-axis.
        - |
          Correct. Every output changes sign: the graph now lies below the x-axis with y-intercept −1.
        - |
          2^(−x) changes the sign of the input, a reflection across the y-axis.
        - |
          log₂(x) is the reflection across the line y = x.
      answer: 1
    - slug: alg2-u05-w22-q13
      type: multiple_choice
      topic_code: "4.13"
      source: "IM Algebra 2, Unit 4, Lesson 13"
      points: 1
      prompt: |
        A quantity grows continuously at a 10% rate: Q(t) = Q₀e^(0.1t). What is the actual percent increase per unit of t?
      options:
        - "Exactly 10%"
        - "About 10.5%"
        - "About 1%"
        - "About 27%"
      option_explanations:
        - |
          Continuous compounding at 10% gives a little more than 10% per unit.
        - |
          Correct. e^0.1 ≈ 1.1052, about a 10.5% increase.
        - |
          0.1 is 10% written as a decimal, not 1%; the actual growth is slightly above 10%.
        - |
          27% would need a factor of 1.27; e^0.1 ≈ 1.105.
      answer: 1
    - slug: alg2-u05-w22-q14
      type: multi_select
      topic_code: "5.6"
      source: "IM Algebra 2, Unit 5, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        Which functions are odd? Select all that apply.
      options:
        - "f(x) = x³"
        - "f(x) = 1/x"
        - "f(x) = x"
        - "f(x) = x²"
        - "f(x) = 2ˣ"
      option_explanations:
        - |
          Correct. (−x)³ = −x³, so f(−x) = −f(x) and the cube is odd.
        - |
          Correct. 1/(−x) = −1/x, so f(−x) = −f(x).
        - |
          Correct. The identity function satisfies f(−x) = −x = −f(x).
        - |
          x² is even, not odd: (−x)² = x² = f(x), symmetric about the y-axis.
        - |
          2^(−x) = (1/2)ˣ is neither 2ˣ nor −2ˣ, so 2ˣ is neither even nor odd.
      answer: [0, 1, 2]
    - slug: alg2-u05-w22-q15
      type: multi_select
      topic_code: "5.8"
      source: "IM Algebra 2, Unit 5, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Let g(x) = −2f(x). Which statements are true? Select all that apply.
      options:
        - "The graph of g is the graph of f reflected across the x-axis."
        - "The graph of g is stretched vertically by a factor of 2 compared with f."
        - "If (1, 3) is on the graph of f, then (1, −6) is on the graph of g."
        - "The graph of g is the graph of f shifted down 2."
        - "The zeros of g are different from the zeros of f."
      option_explanations:
        - |
          Correct. The negative sign changes the sign of every output.
        - |
          Correct. The factor 2 doubles every distance from the x-axis.
        - |
          Correct. g(1) = −2 · f(1) = −2 · 3 = −6.
        - |
          Multiplying by −2 is a scaling, not a shift; (1, 3) goes to (1, −6), not (1, 1).
        - |
          If f(a) = 0 then g(a) = −2 · 0 = 0; the zeros are the same.
      answer: [0, 1, 2]
    - slug: alg2-u05-w22-q16
      type: true_false
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 1
      prompt: |
        True or false: the graph of y = f(−x) is the reflection of the graph of y = f(x) across the y-axis.
      answer: true
      explanation: |
        True. Replacing x by −x sends each point (a, b) to (−a, b), which is a reflection across the y-axis.
    - slug: alg2-u05-w22-q17
      type: true_false
      topic_code: "4.15"
      source: "IM Algebra 2, Unit 4, Lesson 15"
      points: 1
      prompt: |
        True or false: the functions P(t) = 100(1.5)ᵗ and Q(t) = 7(1.5)ᵗ have the same doubling time.
      answer: true
      explanation: |
        True. Doubling means a(1.5)ᵗ = 2a, and a cancels, leaving 1.5ᵗ = 2 in both cases: t = log₁.₅(2) ≈ 1.71.
    - slug: alg2-u05-w22-q18
      type: fill_blank
      topic_code: "5.8"
      source: "IM Algebra 2, Unit 5, Lesson 8"
      points: 1
      prompt: |
        If (4, 10) is on the graph of y = f(x), then (4, ____) is on the graph of y = 0.5f(x).
      answer: ["5"]
      explanation: |
        The output is halved: 0.5 · 10 = 5.
    - slug: alg2-u05-w22-q19
      type: fill_blank
      topic_code: "5.2"
      source: "IM Algebra 2, Unit 5, Lesson 2"
      points: 1
      prompt: |
        If (4, 10) is on the graph of y = f(x), then (____, 10) is on the graph of y = f(x − 3).
      answer: ["7"]
      explanation: |
        f(x − 3) shifts the graph right 3, so the input becomes 4 + 3 = 7: f(7 − 3) = f(4) = 10.
    - slug: alg2-u05-w22-q20
      type: numeric
      topic_code: "5.6"
      source: "IM Algebra 2, Unit 5, Lesson 6"
      points: 1
      prompt: |
        The function f(x) = x⁴ − 3x² satisfies f(2) = 4. Use symmetry to find f(−2).
      answer: { value: 4, tolerance: 0 }
      explanation: |
        f is even (only even powers), so f(−2) = f(2) = 4.
    - slug: alg2-u05-w22-q21
      type: numeric
      topic_code: "5.7"
      source: "IM Algebra 2, Unit 5, Lesson 7"
      points: 1
      prompt: |
        Let g(x) = −(x − 2)² + 3. Find g(0).
      answer: { value: -1, tolerance: 0 }
      explanation: |
        g(0) = −(−2)² + 3 = −4 + 3 = −1.
    - slug: alg2-u05-w22-q22
      type: numeric
      topic_code: "4.14"
      source: "IM Algebra 2, Unit 4, Lesson 14"
      points: 1
      prompt: |
        Solve 1.5ᵗ = 10. Give t to two decimal places.
      answer: { value: 5.68, tolerance: 0.02 }
      explanation: |
        t = log₁.₅(10) ≈ 5.68. Check: 1.5⁵ ≈ 7.6 and 1.5⁶ ≈ 11.4, so 5 < t < 6.
    - slug: alg2-u05-w22-q23
      type: short_answer
      topic_code: "5.6"
      source: "IM Algebra 2, Unit 5, Lesson 6"
      points: 3
      prompt: |
        Classify each function as even, odd or neither, showing the computation of f(−x) or a counterexample.
        (a) f(x) = x³ + 2x
        (b) f(x) = x² − 5
        (c) f(x) = (x + 1)²
      answer: |
        (a) f(−x) = −x³ − 2x = −(x³ + 2x) = −f(x): odd.
        (b) f(−x) = (−x)² − 5 = x² − 5 = f(x): even.
        (c) f(−x) = (1 − x)² = x² − 2x + 1, while f(x) = x² + 2x + 1 and −f(x) = −x² − 2x − 1; neither. (Or: f(1) = 4, f(−1) = 0.)
