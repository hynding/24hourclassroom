      source: "IM Algebra 2, Unit 3, Lesson 17"
      points: 3
      prompt: |
        (a) Solve x² + 6x + 25 = 0 by completing the square.
        (b) Check one solution by substitution.
        (c) Explain why the two solutions had to be conjugates of each other.
      answer: |
        (a) (x + 3)² = −25 + 9 = −16, so x + 3 = ±4i and x = −3 ± 4i.
        (b) For x = −3 + 4i: x² = 9 − 24i + 16i² = −7 − 24i; 6x = −18 + 24i; so x² + 6x + 25 = −7 − 24i − 18 + 24i + 25 = 0.
        (c) Undoing the square gives −3 ± (square root of a negative number), the same real part with opposite imaginary parts, which is exactly a conjugate pair.
      explanation: |
        Three points, one per part. (a) −3 ± 4i. (b) a substitution reaching 0. (c) the ± structure.
