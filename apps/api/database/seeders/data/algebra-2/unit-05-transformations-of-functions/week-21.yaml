    - slug: alg2-u05-w21-q25
      type: long_answer
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 6
      prompt: |
        Let f(x) = x². Write a full response that (1) writes the equation of g, the graph of f shifted left 3 and down 2, and gives its vertex and y-intercept, (2) writes the equation of h(x) = −f(x) + 4, describes the two transformations involved, and finds its vertex and x-intercepts, (3) explains why the graph of f(−x) is identical to the graph of f, and (4) tracks the point (2, 4) on f through the transformation k(x) = −f(x − 1) + 2, giving the image point and checking it with the formula for k.
      answer: |
        (1) g(x) = (x + 3)² − 2. Vertex (−3, −2); y-intercept g(0) = 9 − 2 = 7.
        (2) h(x) = −x² + 4: reflect f across the x-axis, then shift up 4. Vertex (0, 4), opening downward; x-intercepts where x² = 4, at x = 2 and x = −2.
        (3) f(−x) = (−x)² = x² = f(x), so every input and its opposite give the same output; the graph is symmetric about the y-axis and reflecting it across that axis changes nothing.
        (4) k reflects across the x-axis, shifts right 1 and up 2. (2, 4) → (2, −4) → (3, −4) → (3, −2). Check: k(3) = −(3 − 1)² + 2 = −4 + 2 = −2. ✓
