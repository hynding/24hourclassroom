week: 21
unit: 5
title: "Moving and Reflecting Functions"
topics: ["5.1", "5.2", "5.3", "5.4"]
guide: guides/week-21.md
guide_description: |
  Why a basic function often needs shifting to fit data (a decay that levels off at 20, not 0); vertical
  translations f(x) + k and horizontal translations f(x − h), including the backwards-looking sign, read from
  equations, tables and graphs; combining shifts and reading vertex, asymptote and intercept from the
  equation; reflections −f(x) across the x-axis and f(−x) across the y-axis, combined with shifts, and
  tracking a single point through every transformation.
flashcards_description: |
  27 cards on matching data with shifted functions, vertical and horizontal translations, combined shifts,
  and reflections across the axes.

flashcards:
  - front: Why cooling-coffee data is not a plain exponential
    back: |
      100, 60, 40, 30, 25 has ratios 0.6, 0.67, 0.75, 0.83, not constant. The amount above room temperature (20) is 80, 40, 20, 10, 5, which halves each step: h(t) = 80(0.5)ᵗ + 20.
    topic_code: "5.1"
  - front: Role of translations in modeling
    back: |
      A basic function may have the right shape but the wrong position; a shift fixes the position (for example the asymptote) without changing the shape.
    topic_code: "5.1"
  - front: Data 5, 7, 11, 19, 35 at t = 0 to 4 → model
    back: |
      Subtract 3: 2, 4, 8, 16, 32 = 2ᵗ⁺¹. Model: y = 2ᵗ⁺¹ + 3, an exponential shifted up 3.
    topic_code: "5.1"
  - front: Vertical translation y = f(x) + k
    back: |
      Every output increases by k: the graph slides up (k > 0) or down (k < 0). Intercepts and horizontal asymptotes move with it.
    topic_code: "5.2"
  - front: Horizontal translation y = f(x − h)
    back: |
      The graph slides right h; f(x + 3) slides left 3. The sign looks backwards because g(x) = f(x − h) reaches f(0) at x = h.
    topic_code: "5.2"
  - front: Features of y = 2ˣ − 3
    back: |
      Asymptote y = −3, y-intercept (0, −2); the graph of 2ˣ moved down 3.
    topic_code: "5.2"
  - front: Features of y = 2^(x − 1)
    back: |
      Moved right 1: passes through (1, 1) instead of (0, 1). The asymptote y = 0 does not move under a horizontal shift.
    topic_code: "5.2"
  - front: Image of (3, 5) under f(x) + 4, f(x − 4), f(x + 2)
    back: |
      (3, 9); (7, 5); (1, 5).
    topic_code: "5.2"
  - front: Table of f shifted by g(x) = f(x − 2) + 1
    back: |
      Same outputs plus 1, at inputs 2 larger: f: (−2, 4), (0, 0), (2, 4) becomes g: (0, 5), (2, 1), (4, 5).
    topic_code: "5.2"
  - front: y = log₂(x + 3) → asymptote and intercept
    back: |
      log₂(x) moved left 3: asymptote x = −3, x-intercept (−2, 0).
    topic_code: "5.2"
  - front: y = f(x − h) + k in words
    back: |
      Right h and up k. (x − 1)² − 5 has vertex (1, −5); (x + 4)² − 2 has vertex (−4, −2).
    topic_code: "5.3"
  - front: y = |x − 2| + 3 and y = √(x + 1) − 4 → key points
    back: |
      Vertex (2, 3); starting point (−1, −4).
    topic_code: "5.3"
  - front: y = 2^(x − 2) + 1 → asymptote and a point
    back: |
      Asymptote y = 1; passes through (2, 2), the image of (0, 1).
    topic_code: "5.3"
  - front: Image of (3, 5) under g(x) = f(x + 1) − 4
    back: |
      Left 1, down 4: (2, 1).
    topic_code: "5.3"
  - front: Image of (3, 5) under g(x) = f(x − 1) + 6
    back: |
      Right 1, up 6: (4, 11).
    topic_code: "5.3"
  - front: y = x³ moved left 1 and down 4 → equation and y-intercept
    back: |
      y = (x + 1)³ − 4; at x = 0, 1 − 4 = −3, so (0, −3).
    topic_code: "5.3"
  - front: Does the order of two shifts matter?
    back: |
      No. Right 2 then up 3 lands in the same place as up 3 then right 2.
    topic_code: "5.3"
  - front: Reflection across the x-axis y = −f(x)
    back: |
      Every output changes sign: (a, b) → (a, −b). −x² opens downward; −√x has outputs ≤ 0; −2ˣ has y-intercept −1.
    topic_code: "5.4"
  - front: Reflection across the y-axis y = f(−x)
    back: |
      Every input changes sign: (a, b) → (−a, b). 2^(−x) = (1/2)ˣ decays; √(−x) is defined for x ≤ 0.
    topic_code: "5.4"
  - front: Image of (3, 5) under −f(x), f(−x), −f(−x)
    back: |
      (3, −5); (−3, 5); (−3, −5).
    topic_code: "5.4"
  - front: f(x) = x² − 4x → −f(x) and f(−x)
    back: |
      −f(x) = −x² + 4x; f(−x) = x² + 4x. At x = 2, f(−x) gives 4 + 8 = 12, the same as f(−2).
    topic_code: "5.4"
  - front: Why x² is unchanged by f(−x)
    back: |
      (−x)² = x², so the graph is symmetric about the y-axis. Next week: such functions are called even.
    topic_code: "5.4"
  - front: y = −(x − 2)² + 3 → features
    back: |
      x² reflected across the x-axis, then right 2 and up 3: vertex (2, 3), opens downward, y-intercept −1.
    topic_code: "5.4"
  - front: y = −√x + 4 → where it crosses the x-axis
    back: |
      Downward square root starting at (0, 4); crosses where √x = 4, at x = 16.
    topic_code: "5.4"
  - front: y = √(−x) + 2 → description
    back: |
      √x reflected across the y-axis (now defined for x ≤ 0) and moved up 2; starts at (0, 2) and extends left.
    topic_code: "5.4"
  - front: −f(x) versus f(−x) → common confusion
    back: |
      −f(x) flips outputs (across the x-axis); f(−x) flips inputs (across the y-axis). Check with one point.
    topic_code: "5.4"
  - front: Applying a shift to a formula → common error
    back: |
      f(x − 2) replaces every x: (x − 2)² − 3(x − 2), not x² − 3(x − 2).
    topic_code: "5.2"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 5.1 to 5.4: matching data, translations
    and reflections), with about a third reviewing Units 2–4. Includes a shared-context set on a function
    given by three points. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: f through three points (5.2, 5.3, 5.4)
    - slug: alg2-u05-w21-q01
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Algebra 2, Unit 5, Lesson 2"
      points: 1
      stimulus: |
        The graph of a function f passes through the points (2, 3), (4, 7) and (6, 1).
      prompt: |
        Which three points lie on the graph of g(x) = f(x) − 4?
      options:
        - "(2, −1), (4, 3), (6, −3)"
        - "(−2, 3), (0, 7), (2, 1)"
        - "(6, 3), (8, 7), (10, 1)"
        - "(2, 7), (4, 11), (6, 5)"
      option_explanations:
        - |
          Correct. Subtracting 4 from every output moves each point down 4.
        - |
          Those points come from f(x + 4), a shift left 4, not a vertical shift.
        - |
          Those points come from f(x − 4), a shift right 4.
        - |
          Adding 4 to the outputs would be f(x) + 4, a shift up.
      answer: 0
    - slug: alg2-u05-w21-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Algebra 2, Unit 5, Lesson 3"
      points: 1
      stimulus: |
        The graph of a function f passes through the points (2, 3), (4, 7) and (6, 1).
      prompt: |
        Which three points lie on the graph of h(x) = f(x − 3) + 2?
      options:
        - "(−1, 5), (1, 9), (3, 3)"
        - "(5, 5), (7, 9), (9, 3)"
        - "(5, 1), (7, 5), (9, −1)"
        - "(2, 3), (4, 7), (6, 1)"
      option_explanations:
        - |
          f(x − 3) shifts right 3, not left; the inputs must increase by 3.
        - |
          Correct. Each point moves right 3 and up 2: (2, 3) → (5, 5), (4, 7) → (7, 9), (6, 1) → (9, 3).
        - |
          The vertical shift is +2 (up), so the outputs increase by 2 rather than decrease.
        - |
          The transformation moves every point; nothing stays in place.
      answer: 1
    - slug: alg2-u05-w21-q03
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 1
      stimulus: |
        The graph of a function f passes through the points (2, 3), (4, 7) and (6, 1).
      prompt: |
        Which three points lie on the graph of k(x) = f(−x)?
      options:
        - "(2, −3), (4, −7), (6, −1)"
        - "(−2, 3), (−4, 7), (−6, 1)"
        - "(−2, −3), (−4, −7), (−6, −1)"
        - "(3, 2), (7, 4), (1, 6)"
      option_explanations:
        - |
          Changing the sign of the outputs is −f(x), a reflection across the x-axis.
        - |
          Correct. f(−x) changes the sign of every input: (a, b) → (−a, b), a reflection across the y-axis.
        - |
          Changing both signs is −f(−x), two reflections.
        - |
          Swapping coordinates is the inverse relation, not a reflection across an axis.
      answer: 1
    # ---- Single items on this week
    - slug: alg2-u05-w21-q04
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Algebra 2, Unit 5, Lesson 2"
      points: 1
      prompt: |
        What is the vertex of the graph of y = (x − 1)² − 5?
      options:
        - "(1, −5)"
        - "(−1, −5)"
        - "(1, 5)"
        - "(−1, 5)"
      option_explanations:
        - |
          Correct. (x − 1)² moves the vertex of x² right 1, and −5 moves it down 5.
        - |
          (x − 1)² is a shift right 1, so the x-coordinate is +1.
        - |
          The −5 outside the square moves the graph down, so the y-coordinate is −5.
        - |
          Both signs are reversed; the vertex is (1, −5).
      answer: 0
    - slug: alg2-u05-w21-q05
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Algebra 2, Unit 5, Lesson 2"
      points: 1
      prompt: |
        What is the horizontal asymptote of y = 2ˣ − 3, and what is the y-intercept?
      options:
        - "Asymptote y = 0; y-intercept (0, 1)"
        - "Asymptote y = −3; y-intercept (0, −2)"
        - "Asymptote y = −3; y-intercept (0, 1)"
        - "Asymptote y = 3; y-intercept (0, 4)"
      option_explanations:
        - |
          Those are the features of 2ˣ before the shift; subtracting 3 moves both down.
        - |
          Correct. The whole graph moves down 3: the asymptote y = 0 becomes y = −3 and (0, 1) becomes (0, −2).
        - |
          The y-intercept also moves: 2⁰ − 3 = −2.
        - |
          Subtracting 3 moves the graph down, not up.
      answer: 1
    - slug: alg2-u05-w21-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Algebra 2, Unit 5, Lesson 3"
      points: 1
      prompt: |
        The point (3, 5) lies on the graph of f. Which point lies on the graph of g(x) = f(x + 1) − 4?
      options:
        - "(4, 1)"
        - "(2, 1)"
        - "(4, 9)"
        - "(2, 9)"
      option_explanations:
        - |
          f(x + 1) shifts left 1, so the x-coordinate decreases to 2.
        - |
          Correct. Left 1 and down 4: (3, 5) → (2, 1).
        - |
          Both directions are reversed: the shift is left and down.
        - |
          The −4 moves the point down, so the y-coordinate is 1, not 9.
      answer: 1
    - slug: alg2-u05-w21-q07
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Algebra 2, Unit 5, Lesson 3"
      points: 1
      prompt: |
        Which equation gives the graph of y = |x| shifted right 2 and up 3?
      options:
        - "y = |x + 2| + 3"
        - "y = |x − 2| + 3"
        - "y = |x − 2| − 3"
        - "y = |x + 3| − 2"
      option_explanations:
        - |
          |x + 2| is a shift left 2, the opposite horizontal direction.
        - |
          Correct. Replacing x by x − 2 shifts right 2; adding 3 shifts up 3; the vertex is (2, 3).
        - |
          The −3 outside the absolute value shifts down, not up.
        - |
          This shifts left 3 and down 2, the wrong directions and amounts.
      answer: 1
    - slug: alg2-u05-w21-q08
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 1
      prompt: |
        Which statement correctly contrasts y = −f(x) and y = f(−x)?
      options:
        - "−f(x) reflects the graph across the y-axis; f(−x) reflects it across the x-axis."
        - "−f(x) reflects the graph across the x-axis; f(−x) reflects it across the y-axis."
        - "Both reflect the graph across the x-axis; they are the same function."
        - "−f(x) shifts the graph down; f(−x) shifts it left."
      option_explanations:
        - |
          This has the two reflections swapped; the sign on the output flips vertically.
        - |
          Correct. −f(x) changes the sign of outputs, (a, b) → (a, −b); f(−x) changes the sign of inputs, (a, b) → (−a, b).
        - |
          They differ: for f(x) = 2ˣ, −f(x) = −2ˣ while f(−x) = (1/2)ˣ.
        - |
          Neither is a shift; both are reflections.
      answer: 1
    - slug: alg2-u05-w21-q09
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 1
      prompt: |
        Which function is the reflection of y = 2ˣ across the y-axis?
      options:
        - "y = −2ˣ"
        - "y = (1/2)ˣ"
        - "y = 2ˣ − 1"
        - "y = log₂(x)"
      option_explanations:
        - |
          −2ˣ is the reflection across the x-axis.
        - |
          Correct. 2^(−x) = (2⁻¹)ˣ = (1/2)ˣ: the growth curve becomes the mirror-image decay curve, still through (0, 1).
        - |
          Subtracting 1 is a vertical shift down 1, not a reflection.
        - |
          log₂(x) is the reflection across the line y = x, the inverse function.
      answer: 1
    - slug: alg2-u05-w21-q10
      type: multiple_choice
      topic_code: "5.1"
      source: "IM Algebra 2, Unit 5, Lesson 1"
      points: 1
      prompt: |
        A cooling object has temperatures 100, 60, 40, 30, 25 at t = 0, 1, 2, 3, 4 minutes, in a 20-degree room. Which model fits the data?
      options:
        - "T(t) = 100(0.6)ᵗ"
        - "T(t) = 80(0.5)ᵗ + 20"
        - "T(t) = 100(0.5)ᵗ"
        - "T(t) = 100 − 20t"
      option_explanations:
        - |
          100(0.6)² = 36, not 40, and this model decays to 0 rather than to room temperature.
        - |
          Correct. The amount above 20 is 80, 40, 20, 10, 5, halving each minute; the +20 puts the asymptote at room temperature.
        - |
          100(0.5)¹ = 50, not 60; the data is not a plain exponential because it levels off at 20.
        - |
          A line gives 100, 80, 60, 40, 20 and keeps falling below room temperature.
      answer: 1
    - slug: alg2-u05-w21-q11
      type: multiple_choice
      topic_code: "4.14"
      source: "IM Algebra 2, Unit 4, Lesson 14"
      points: 1
      prompt: |
        Solve 2 · 5ᵗ = 250.
      options:
        - "t = log₅(250) ≈ 3.43"
        - "t = 2"
        - "t = 3"
        - "t = log₁₀(125) ≈ 2.10"
      option_explanations:
        - |
          Divide by 2 first: the power 5ᵗ equals 125, not 250.
        - |
          5² = 25, so 2 · 5² = 50, not 250; the exponent must be larger.
        - |
          Correct. Dividing by 2 gives 5ᵗ = 125 = 5³, so t = 3.
        - |
          The base is 5, so the exponent is log₅(125) = 3, not the base-10 logarithm.
      answer: 2
    - slug: alg2-u05-w21-q12
      type: multiple_choice
      topic_code: "4.17"
      source: "IM Algebra 2, Unit 4, Lesson 17"
      points: 1
      prompt: |
        Which point lies on the graph of y = log₃(x)?
      options:
        - "(0, 1)"
        - "(27, 3)"
        - "(3, 27)"
        - "(−3, 1)"
      option_explanations:
        - |
          log₃(0) is undefined; the graph never reaches the y-axis.
        - |
          Correct. 3³ = 27, so log₃(27) = 3 and (27, 3) is on the graph.
        - |
          (3, 27) is on y = 3ˣ; the logarithm swaps the coordinates.
        - |
          Negative inputs are outside the domain of a logarithm.
      answer: 1
    - slug: alg2-u05-w21-q13
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 2, Unit 2, Lesson 17"
      points: 1
      prompt: |
        What is the vertical asymptote of f(x) = (x + 1)/(x − 5)?
      options:
        - "x = −1"
        - "x = 5"
        - "y = 1"
        - "x = 1"
      option_explanations:
        - |
          x = −1 is the zero of the numerator, where the graph crosses the x-axis.
        - |
          Correct. The denominator is zero at x = 5 and the numerator is not, so the graph has a vertical asymptote there.
        - |
          y = 1 is the horizontal asymptote (ratio of leading coefficients), not a vertical one.
        - |
          Neither numerator nor denominator is zero at x = 1.
      answer: 1
    - slug: alg2-u05-w21-q14
      type: multi_select
      topic_code: "5.3"
      source: "IM Algebra 2, Unit 5, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Let g(x) = f(x − 2) + 5. Which statements are true? Select all that apply.
      options:
        - "The graph of g is the graph of f shifted right 2."
        - "The graph of g is the graph of f shifted up 5."
        - "The graph of g is the graph of f shifted left 2."
        - "If the graph of f has a vertex at (0, 0), the graph of g has a vertex at (2, 5)."
        - "g(x) = f(x) + 3"
      option_explanations:
        - |
          Correct. Replacing x by x − 2 moves every point 2 to the right.
        - |
          Correct. Adding 5 to the output moves every point up 5.
        - |
          f(x − 2) moves right, not left; f(x + 2) would move left.
        - |
          Correct. (0, 0) moves right 2 and up 5 to (2, 5).
        - |
          A horizontal shift cannot be rewritten as a vertical one in general; g(0) = f(−2) + 5, not f(0) + 3.
      answer: [0, 1, 3]
    - slug: alg2-u05-w21-q15
      type: multi_select
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Which of these send the point (a, b) on the graph of f to the point (−a, b)? Select all that apply.
      options:
        - "y = f(−x)"
        - "Reflecting the graph across the y-axis"
        - "y = −f(x)"
        - "Reflecting the graph across the x-axis"
        - "Replacing every x in the equation with −x"
      option_explanations:
        - |
          Correct. f(−x) takes the value b at x = −a.
        - |
          Correct. A reflection across the y-axis changes the sign of the x-coordinate only.
        - |
          −f(x) sends (a, b) to (a, −b), flipping the output rather than the input.
        - |
          A reflection across the x-axis changes the sign of the y-coordinate.
        - |
          Correct. That is exactly how the equation of f(−x) is written.
      answer: [0, 1, 4]
    - slug: alg2-u05-w21-q16
      type: true_false
      topic_code: "5.2"
      source: "IM Algebra 2, Unit 5, Lesson 2"
      points: 1
      prompt: |
        True or false: the graph of y = f(x + 3) is the graph of y = f(x) shifted 3 units to the right.
      answer: false
      explanation: |
        False. It is shifted 3 units to the left: g(x) = f(x + 3) reaches the value f(0) already at x = −3.
    - slug: alg2-u05-w21-q17
      type: true_false
      topic_code: "4.18"
      source: "IM Algebra 2, Unit 4, Lesson 18"
      points: 1
      prompt: |
        True or false: an increase of 2 in pH means the hydrogen-ion concentration is 100 times smaller.
      answer: true
      explanation: |
        True. pH = −log[H⁺], so each unit of pH is a factor of 10 in concentration; two units is 10² = 100.
    - slug: alg2-u05-w21-q18
      type: fill_blank
      topic_code: "5.2"
      source: "IM Algebra 2, Unit 5, Lesson 2"
      points: 1
      prompt: |
        The graph of y = x² + 7 is the graph of y = x² shifted up ____ units.
      answer: ["7"]
      explanation: |
        Adding 7 to every output moves the graph up 7; the vertex becomes (0, 7).
    - slug: alg2-u05-w21-q19
      type: fill_blank
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Evaluate: log₇(49) = ____
      answer: ["2"]
      explanation: |
        7² = 49, so the logarithm is 2.
    - slug: alg2-u05-w21-q20
      type: numeric
      topic_code: "5.3"
      source: "IM Algebra 2, Unit 5, Lesson 3"
      points: 1
      prompt: |
        The point (3, 5) is on the graph of f. Give the y-coordinate of the corresponding point on the graph of g(x) = f(x − 1) + 6.
      answer: { value: 11, tolerance: 0 }
      explanation: |
        The point moves right 1 and up 6, to (4, 11); the y-coordinate is 11.
    - slug: alg2-u05-w21-q21
      type: numeric
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 1
      prompt: |
        Let f(x) = x² − 4x and g(x) = f(−x). Find g(2).
      answer: { value: 12, tolerance: 0 }
      explanation: |
        g(2) = f(−2) = (−2)² − 4(−2) = 4 + 8 = 12. Equivalently g(x) = x² + 4x.
    - slug: alg2-u05-w21-q22
      type: numeric
      topic_code: "4.6"
      source: "IM Algebra 2, Unit 4, Lesson 6"
      points: 1
      prompt: |
        An exponential function passes through (0, 5) and (2, 45). Find its value at x = 3.
      answer: { value: 135, tolerance: 0 }
      explanation: |
        5b² = 45 gives b = 3, so f(x) = 5 · 3ˣ and f(3) = 135.
    - slug: alg2-u05-w21-q23
      type: short_answer
      topic_code: "5.1"
      source: "IM Algebra 2, Unit 5, Lesson 1"
      points: 3
      prompt: |
        A cup of coffee in a 20°C room has temperatures 100, 60, 40, 30, 25 (°C) at t = 0, 1, 2, 3, 4 minutes.
        (a) Show that a model of the form T(t) = 100 · bᵗ cannot fit this data.
        (b) Write a model of the form T(t) = a · bᵗ + c that fits every data point, and explain how you found a, b and c.
        (c) What does your model predict in the long run, and why does that make sense?
      answer: |
        (a) The ratios of consecutive temperatures are 0.6, 0.667, 0.75 and 0.833, which are not constant, so no single b works.
        (b) Subtracting the room temperature gives 80, 40, 20, 10, 5, which halves every minute. So c = 20, a = 80 and b = 0.5: T(t) = 80(0.5)ᵗ + 20. Check: T(3) = 10 + 20 = 30.
        (c) As t grows, 80(0.5)ᵗ → 0, so T(t) → 20: the coffee approaches room temperature and never goes below it.
