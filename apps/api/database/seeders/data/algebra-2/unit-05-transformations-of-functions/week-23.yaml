week: 23
unit: 5
title: "Scaling Inputs, Combining Functions and Modeling Data"
topics: ["5.9", "5.10", "5.11"]
guide: guides/week-23.md
guide_description: |
  Horizontal scaling f(kx): compression toward the y-axis for k > 1, stretch for 0 < k < 1, with points
  (a, b) → (a/k, b) and zeros moving while heights stay; adding, subtracting and multiplying functions from
  formulas, tables and contexts such as profit = revenue − cost; and building a model for data by reading the
  pattern (differences, ratios, levelling off), transforming a parent function to fit, checking residuals and
  stating the model's limits.
flashcards_description: |
  26 cards on scaling inputs, combining functions, and choosing and fitting a model to data.

flashcards:
  - front: Horizontal scaling y = f(kx) → point rule
    back: |
      (a, b) → (a/k, b): inputs divided by k, outputs unchanged. k > 1 compresses toward the y-axis; 0 < k < 1 stretches.
    topic_code: "5.9"
  - front: Image of (6, 4) under f(2x), f(x/3), f(−2x)
    back: |
      (3, 4); (18, 4); (−3, 4).
    topic_code: "5.9"
  - front: Width of the graph of f(2x) compared with f
    back: |
      Half as wide, not twice: every input is halved to produce the same output.
    topic_code: "5.9"
  - front: Zeros under horizontal scaling
    back: |
      They move: if f(9) = 0 then f(3x) is zero at x = 3. (Vertical scaling leaves zeros alone.)
    topic_code: "5.9"
  - front: f(x) = x² − 9 → f(3x) and its zeros
    back: |
      9x² − 9 = 9(x² − 1), zeros ±1: the zeros ±3 of f divided by 3.
    topic_code: "5.9"
  - front: √(4x) as a vertical scaling
    back: |
      √(4x) = 2√x: a horizontal compression by 1/4 equals a vertical stretch by 2. Likewise (2x)² = 4x².
    topic_code: "5.9"
  - front: Does f(2x) = 4f(x) hold for every function?
    back: |
      No. It holds for x², but for f(x) = x² + 1, f(2x) = 4x² + 1 while 4f(x) = 4x² + 4.
    topic_code: "5.9"
  - front: f has a maximum at (4, 7) and zeros 1, 10 → describe f(2x)
    back: |
      Maximum at (2, 7); zeros at 0.5 and 5. Heights unchanged, widths halved.
    topic_code: "5.9"
  - front: Sum, difference and product of functions (definitions)
    back: |
      (f + g)(x) = f(x) + g(x); (f − g)(x) = f(x) − g(x); (f · g)(x) = f(x) · g(x), all at the same input.
    topic_code: "5.10"
  - front: f(x) = x² − 4, g(x) = 2x + 1 → (f + g)(3), (f − g)(2), (f · g)(−1)
    back: |
      5 + 7 = 12; 0 − 5 = −5; (−3)(−1) = 3.
    topic_code: "5.10"
  - front: (f − g)(x) for f(x) = x² − 4, g(x) = 2x + 1
    back: |
      x² − 4 − 2x − 1 = x² − 2x − 5.
    topic_code: "5.10"
  - front: Combining functions from a table
    back: |
      If f(2) = 5 and g(2) = −3 then (f + g)(2) = 2 and (f − g)(2) = 8; no formulas needed.
    topic_code: "5.10"
  - front: Profit from revenue R(x) = 50x and cost C(x) = 200 + 30x
    back: |
      P(x) = R(x) − C(x) = 20x − 200; break-even at x = 10; P(25) = 300.
    topic_code: "5.10"
  - front: Combined population of two towns
    back: |
      A(t) + B(t) for A(t) = 5000(1.02)ᵗ and B(t) = 8000(0.99)ᵗ; the gap B(t) − A(t) shrinks over time.
    topic_code: "5.10"
  - front: Graphing f + g
    back: |
      Add the heights at each x. Where g is 0 the sum equals f; opposite signs partly cancel.
    topic_code: "5.10"
  - front: 70(0.9)ᵗ + 20 as a sum of two functions
    back: |
      A decaying exponential (the excess above room temperature, shrinking 10% per unit) plus the constant 20 (the long-run level and asymptote).
    topic_code: "5.10"
  - front: Pattern → parent function (equally spaced data)
    back: |
      Constant first differences: linear. Constant second differences: quadratic. Constant ratios: exponential. Constant ratios after subtracting a level: shifted exponential.
    topic_code: "5.11"
  - front: Cooling data 90, 83, 76.7, 71.0, 65.9 in a 20° room → model
    back: |
      Subtract 20: 70, 63, 56.7, 51.0, 45.9, ratio 0.9. T(t) = 70(0.9)ᵗ + 20.
    topic_code: "5.11"
  - front: T(t) = 70(0.9)ᵗ + 20 → T(10) and when T = 30
    back: |
      T(10) ≈ 44.4. 70(0.9)ᵗ = 10 gives t = log₀.₉(1/7) ≈ 18.5 minutes.
    topic_code: "5.11"
  - front: Ball peaks at 25 m at t = 2 s, height 5 m at t = 0 → model
    back: |
      h(t) = −5(t − 2)² + 25; check h(0) = 5. Hits the ground at t = 2 + √5 ≈ 4.24 s.
    topic_code: "5.11"
  - front: Data 3, 7, 15, 27, 43 at x = 0 to 4 → model
    back: |
      Second differences all 4, so quadratic: y = 2x² + 2x + 3 (check x = 2: 15; x = 4: 43).
    topic_code: "5.11"
  - front: "Data rising toward a ceiling of 50: 10, 30, 40, 45, 47.5 → model"
    back: |
      Amount below 50 is 40, 20, 10, 5, 2.5, halving: y = 50 − 40(0.5)ᵗ.
    topic_code: "5.11"
  - front: Residual (definition and use)
    back: |
      Data value minus model value. Small residuals of mixed sign mean a good fit; a drift in one direction means the wrong parent function or parameters.
    topic_code: "5.11"
  - front: Limits of a model
    back: |
      A cooling model ends when the coffee is drunk, a ball model at the ground, exponential growth when resources run out. State where the model applies.
    topic_code: "5.11"
  - front: Fitting a plain exponential to data that levels off → error
    back: |
      Subtract the level first: 100, 60, 40, 30, 25 is not a · bᵗ, but minus 20 it is 80(0.5)ᵗ.
    topic_code: "5.11"
  - front: Order in a difference of functions → error
    back: |
      Profit is revenue minus cost, not cost minus revenue; (f − g)(x) = f(x) − g(x).
    topic_code: "5.10"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (lessons 5.9 to 5.11: scaling inputs, combining
    functions and modeling data), with about a third reviewing weeks 21–22 and Unit 4. Includes a
    shared-context set on two functions f and g. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: f(x) = x² − 4, g(x) = 2x + 1 (5.10)
    - slug: alg2-u05-w23-q01
      type: multiple_choice
      topic_code: "5.10"
      source: "IM Algebra 2, Unit 5, Lesson 10"
      points: 1
      stimulus: |
        Let f(x) = x² − 4 and g(x) = 2x + 1.
      prompt: |
        What is (f + g)(3)?
      options:
        - "12"
        - "5"
        - "35"
        - "6"
      option_explanations:
        - |
          Correct. f(3) = 5 and g(3) = 7, so the sum is 12.
        - |
          5 is f(3) alone; g(3) = 7 must be added.
        - |
          35 is f(3) · g(3), the product, not the sum.
        - |
          6 would be f(3) + 1; g(3) = 2 · 3 + 1 = 7.
      answer: 0
    - slug: alg2-u05-w23-q02
      type: multiple_choice
      topic_code: "5.10"
      source: "IM Algebra 2, Unit 5, Lesson 10"
      points: 1
      stimulus: |
        Let f(x) = x² − 4 and g(x) = 2x + 1.
      prompt: |
        Which expression equals (f − g)(x)?
      options:
        - "x² − 2x − 5"
        - "x² − 2x − 3"
        - "x² + 2x − 3"
        - "−x² + 2x + 5"
      option_explanations:
        - |
          Correct. x² − 4 − (2x + 1) = x² − 2x − 5.
        - |
          The constant is −4 − 1 = −5; this subtracts only the 2x.
        - |
          x² + 2x − 3 is (f + g)(x), the sum rather than the difference.
        - |
          −x² + 2x + 5 is (g − f)(x), the wrong order.
      answer: 0
    - slug: alg2-u05-w23-q03
      type: multiple_choice
      topic_code: "5.10"
      source: "IM Algebra 2, Unit 5, Lesson 10"
      points: 1
      stimulus: |
        Let f(x) = x² − 4 and g(x) = 2x + 1.
      prompt: |
        What is (f · g)(−1)?
      options:
        - "−4"
        - "3"
        - "−3"
        - "2"
      option_explanations:
        - |
          −4 is f(−1) + g(−1) = −3 + (−1); the question asks for the product.
        - |
          Correct. f(−1) = 1 − 4 = −3 and g(−1) = −2 + 1 = −1, so the product is 3.
        - |
          −3 is f(−1) alone; it must be multiplied by g(−1) = −1.
        - |
          2 is f(−1) − g(−1) = −3 − (−1), a difference rather than a product.
      answer: 1
    # ---- Single items on this week
    - slug: alg2-u05-w23-q04
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Algebra 2, Unit 5, Lesson 9"
      points: 1
      prompt: |
        The point (6, 4) is on the graph of f. Which point is on the graph of y = f(2x)?
      options:
        - "(12, 4)"
        - "(3, 4)"
        - "(6, 8)"
        - "(3, 2)"
      option_explanations:
        - |
          f(2x) needs an input of 3 to reach f(6); inputs are divided by 2, not doubled.
        - |
          Correct. f(2 · 3) = f(6) = 4, so (3, 4).
        - |
          Doubling the output would be 2f(x), a vertical stretch.
        - |
          Only the input changes; the output stays 4.
      answer: 1
    - slug: alg2-u05-w23-q05
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Algebra 2, Unit 5, Lesson 9"
      points: 1
      prompt: |
        How does the graph of y = f(x/3) compare with the graph of y = f(x)?
      options:
        - "It is compressed horizontally to one third of the width."
        - "It is stretched horizontally to three times the width."
        - "It is stretched vertically by a factor of 3."
        - "It is shifted right 3."
      option_explanations:
        - |
          f(x/3) needs inputs three times as large to reach the same outputs, so it is wider, not narrower.
        - |
          Correct. (a, b) → (3a, b): every input is tripled.
        - |
          The outputs are unchanged; only the inputs scale.
        - |
          Dividing x by 3 is a scaling, not a shift; f(x − 3) would shift right 3.
      answer: 1
    - slug: alg2-u05-w23-q06
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Algebra 2, Unit 5, Lesson 9"
      points: 1
      prompt: |
        For f(x) = √x, which vertical scaling gives the same graph as the horizontal scaling y = f(4x)?
      options:
        - "y = 4√x"
        - "y = 2√x"
        - "y = √x/4"
        - "y = 16√x"
      option_explanations:
        - |
          √(4x) = √4 · √x = 2√x, not 4√x; the factor comes out as its square root.
        - |
          Correct. √(4x) = 2√x, so compressing the inputs by 1/4 doubles the outputs.
        - |
          Dividing by 4 would compress vertically; √(4x) is larger than √x.
        - |
          16√x would need √(256x), since 16 = √256.
      answer: 1
    - slug: alg2-u05-w23-q07
      type: multiple_choice
      topic_code: "5.10"
      source: "IM Algebra 2, Unit 5, Lesson 10"
      points: 1
      prompt: |
        Two towns have populations A(t) = 5000(1.02)ᵗ and B(t) = 8000(0.99)ᵗ after t years. Which function gives the combined population, and what happens to it at t = 0?
      options:
        - "(A + B)(t) = 13000(1.01)ᵗ; it is 13,000 at t = 0."
        - "(A + B)(t) = 5000(1.02)ᵗ + 8000(0.99)ᵗ; it is 13,000 at t = 0."
        - "(A · B)(t) = 40,000,000(1.0098)ᵗ; it is 13,000 at t = 0."
        - "(B − A)(t) = 3000(0.97)ᵗ; it is 3,000 at t = 0."
      option_explanations:
        - |
          Two exponentials with different bases do not add to a single exponential; the sum must be kept as two terms.
        - |
          Correct. The combined population is the sum of the two functions, and A(0) + B(0) = 5000 + 8000.
        - |
          The product of two populations is not a population; and its value at t = 0 is 40,000,000.
        - |
          B − A is the gap, not the total, and the difference of two exponentials is not a single exponential.
      answer: 1
    - slug: alg2-u05-w23-q08
      type: multiple_choice
      topic_code: "5.11"
      source: "IM Algebra 2, Unit 5, Lesson 11"
      points: 1
      prompt: |
        A coffee cools in a 20°C room. Which model levels off at room temperature?
      options:
        - "T(t) = 90(0.9)ᵗ"
        - "T(t) = 70(0.9)ᵗ + 20"
        - "T(t) = 90 − 7t"
        - "T(t) = 20(0.9)ᵗ"
      option_explanations:
        - |
          90(0.9)ᵗ decays toward 0, below room temperature.
        - |
          Correct. The exponential part shrinks toward 0, so T(t) approaches the constant 20.
        - |
          A line keeps falling forever and crosses below 20.
        - |
          20(0.9)ᵗ starts at 20 and decays to 0; it is not a cooling model.
      answer: 1
    - slug: alg2-u05-w23-q09
      type: multiple_choice
      topic_code: "5.11"
      source: "IM Algebra 2, Unit 5, Lesson 11"
      points: 1
      prompt: |
        A ball's height is modeled by h(t) = −5(t − 2)² + 25 metres after t seconds. What is its maximum height, and when does it occur?
      options:
        - "25 m at t = 2 s"
        - "25 m at t = −2 s"
        - "5 m at t = 0 s"
        - "−5 m at t = 2 s"
      option_explanations:
        - |
          Correct. The vertex of the downward parabola is (2, 25): the square term is 0 at t = 2 and negative otherwise.
        - |
          (t − 2)² is zero at t = 2, not t = −2; the vertex is at t = 2.
        - |
          h(0) = −20 + 25 = 5 is the starting height, not the maximum.
        - |
          −5 is the vertical scale factor, not a height; the maximum is +25.
      answer: 0
    - slug: alg2-u05-w23-q10
      type: multiple_choice
      topic_code: "5.11"
      source: "IM Algebra 2, Unit 5, Lesson 11"
      points: 1
      prompt: |
        Equally spaced data has first differences 4, 8, 12, 16. Which parent function should be used to model it?
      options:
        - "Linear"
        - "Quadratic"
        - "Exponential"
        - "Square root"
      option_explanations:
        - |
          Linear data has constant first differences; these are growing.
        - |
          Correct. The second differences are all 4, the signature of a quadratic.
        - |
          Exponential data has constant ratios; here 3, 7, 15, 27, 43 have ratios 2.3, 2.1, 1.8, 1.6.
        - |
          Square-root data has shrinking first differences, not growing ones.
      answer: 1
    - slug: alg2-u05-w23-q11
      type: multiple_choice
      topic_code: "5.8"
      source: "IM Algebra 2, Unit 5, Lesson 8"
      points: 1
      prompt: |
        The graph of f has zeros at x = −1 and x = 5 and a maximum value of 8. What are the zeros and maximum value of y = 3f(x)?
      options:
        - "Zeros −3 and 15; maximum 24"
        - "Zeros −1 and 5; maximum 24"
        - "Zeros −1 and 5; maximum 8"
        - "Zeros −3 and 15; maximum 8"
      option_explanations:
        - |
          A vertical stretch does not move zeros: 3 · 0 = 0.
        - |
          Correct. Zeros are unchanged and every output is tripled, so the maximum becomes 24.
        - |
          The outputs are tripled, so the maximum is 3 · 8 = 24.
        - |
          Neither claim is right: zeros stay put and heights triple.
      answer: 1
    - slug: alg2-u05-w23-q12
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Algebra 2, Unit 5, Lesson 6"
      points: 1
      prompt: |
        Which function is odd?
      options:
        - "f(x) = x⁴ + x²"
        - "f(x) = x³ − 4x"
        - "f(x) = x² − x"
        - "f(x) = 3ˣ"
      option_explanations:
        - |
          Only even powers appear, so this function is even.
        - |
          Correct. f(−x) = −x³ + 4x = −(x³ − 4x) = −f(x), so f is odd.
        - |
          f(−x) = x² + x, which is neither f(x) nor −f(x).
        - |
          3^(−x) = (1/3)ˣ is neither 3ˣ nor −3ˣ, so the exponential is neither even nor odd.
      answer: 1
    - slug: alg2-u05-w23-q13
      type: multiple_choice
      topic_code: "4.16"
      source: "IM Algebra 2, Unit 4, Lesson 16"
      points: 1
      prompt: |
        For which t is 200(0.75)ᵗ < 25?
      options:
        - "t > log₀.₇₅(0.125) ≈ 7.2"
        - "t < log₀.₇₅(0.125) ≈ 7.2"
        - "t > 8"
        - "t > log₀.₇₅(25) ≈ −11.2"
      option_explanations:
        - |
          Correct. 0.75ᵗ < 0.125, and since 0.75ᵗ decreases, this holds for t larger than log₀.₇₅(0.125) ≈ 7.23.
        - |
          For smaller t the value is still above 25; the base is below 1, so the function decreases.
        - |
          8 is the required factor's reciprocal (200/25), not the time.
        - |
          Divide by 200 first: the power must be below 0.125, not 25.
      answer: 0
    - slug: alg2-u05-w23-q14
      type: multi_select
      topic_code: "5.9"
      source: "IM Algebra 2, Unit 5, Lesson 9"
      points: 2
      partial_credit: true
      prompt: |
        Let g(x) = f(2x). Which statements are true? Select all that apply.
      options:
        - "The graph of g is the graph of f compressed horizontally to half its width."
        - "If (8, 3) is on the graph of f, then (4, 3) is on the graph of g."
        - "g(x) = 2f(x) for every function f."
        - "If f(x) = x², then g(x) = 4x²."
        - "The zeros of g are twice the zeros of f."
      option_explanations:
        - |
          Correct. Every input is halved to produce the same output.
        - |
          Correct. g(4) = f(2 · 4) = f(8) = 3, so the input is halved.
        - |
          f(2x) and 2f(x) differ in general; for f(x) = x + 1, f(2x) = 2x + 1 but 2f(x) = 2x + 2.
        - |
          Correct. (2x)² = 4x², so for this function f(2x) = 4f(x).
        - |
          The zeros of g are half the zeros of f: if f(6) = 0 then g(3) = 0.
      answer: [0, 1, 3]
    - slug: alg2-u05-w23-q15
      type: multi_select
      topic_code: "5.11"
      source: "IM Algebra 2, Unit 5, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Which models approach the value 20 in the long run? Select all that apply.
      options:
        - "y = 70(0.9)ᵗ + 20"
        - "y = 20 − 5(0.8)ᵗ"
        - "y = 20(0.9)ᵗ"
        - "y = 20 + 3t"
        - "y = 20 + 50e^(−0.1t)"
      option_explanations:
        - |
          Correct. 70(0.9)ᵗ → 0, so y → 20 from above.
        - |
          Correct. 5(0.8)ᵗ → 0, so y → 20 from below.
        - |
          20(0.9)ᵗ starts at 20 and decays toward 0.
        - |
          A line with slope 3 grows without bound.
        - |
          Correct. 50e^(−0.1t) → 0 as t grows, so y → 20 from above.
      answer: [0, 1, 4]
    - slug: alg2-u05-w23-q16
      type: true_false
      topic_code: "5.9"
      source: "IM Algebra 2, Unit 5, Lesson 9"
      points: 1
      prompt: |
        True or false: the graph of y = f(x/2) is the graph of y = f(x) stretched horizontally by a factor of 2.
      answer: true
      explanation: |
        True. f(x/2) reaches f(a) at x = 2a, so every point (a, b) moves to (2a, b): twice as wide.
    - slug: alg2-u05-w23-q17
      type: true_false
      topic_code: "5.4"
      source: "IM Algebra 2, Unit 5, Lesson 4"
      points: 1
      prompt: |
        True or false: the graph of y = −f(x) is the reflection of the graph of y = f(x) across the y-axis.
      answer: false
      explanation: |
        False. −f(x) changes the sign of every output, which is a reflection across the x-axis; f(−x) is the reflection across the y-axis.
    - slug: alg2-u05-w23-q18
      type: fill_blank
      topic_code: "5.10"
      source: "IM Algebra 2, Unit 5, Lesson 10"
      points: 1
      prompt: |
        If f(2) = 5 and g(2) = −3, then (f + g)(2) = ____
      answer: ["2"]
      explanation: |
        (f + g)(2) = f(2) + g(2) = 5 + (−3) = 2.
    - slug: alg2-u05-w23-q19
      type: fill_blank
      topic_code: "5.2"
      source: "IM Algebra 2, Unit 5, Lesson 2"
      points: 1
      prompt: |
        The vertex of y = (x − 3)² + 1 has x-coordinate ____
      answer: ["3"]
      explanation: |
        (x − 3)² shifts the vertex of x² right 3, to (3, 1).
    - slug: alg2-u05-w23-q20
      type: numeric
      topic_code: "5.11"
      source: "IM Algebra 2, Unit 5, Lesson 11"
      points: 1
      prompt: |
        A cooling model is T(t) = 70(0.9)ᵗ + 20. Find T(5) to the nearest tenth.
      answer: { value: 61.3, tolerance: 0.1 }
      explanation: |
        0.9⁵ ≈ 0.5905, so T(5) ≈ 70 · 0.5905 + 20 ≈ 61.3.
    - slug: alg2-u05-w23-q21
      type: numeric
      topic_code: "5.9"
      source: "IM Algebra 2, Unit 5, Lesson 9"
      points: 1
      prompt: |
        Let f(x) = x² − 9 and g(x) = f(3x). Give the positive zero of g.
      answer: { value: 1, tolerance: 0 }
      explanation: |
        g(x) = 9x² − 9 = 9(x − 1)(x + 1), so the positive zero is 1 (the zero 3 of f divided by 3).
    - slug: alg2-u05-w23-q22
      type: numeric
      topic_code: "4.11"
      source: "IM Algebra 2, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Evaluate log₂(64).
      answer: { value: 6, tolerance: 0 }
      explanation: |
        2⁶ = 64, so the logarithm is 6.
    - slug: alg2-u05-w23-q23
      type: short_answer
      topic_code: "5.10"
      source: "IM Algebra 2, Unit 5, Lesson 10"
      points: 3
      prompt: |
        A company sells x items for $50 each. Its costs are $200 plus $30 per item.
        (a) Write the revenue function R(x) and the cost function C(x).
        (b) Write the profit function P(x) as a combination of R and C, and simplify it.
        (c) Find the break-even quantity and the profit from selling 25 items.
      answer: |
        (a) R(x) = 50x; C(x) = 200 + 30x.
        (b) P(x) = R(x) − C(x) = 50x − (200 + 30x) = 20x − 200.
        (c) P(x) = 0 at x = 10 items. P(25) = 500 − 200 = 300 dollars.
      explanation: |
        Three points, one per part. (a) both functions. (b) P = R − C simplified to 20x − 200. (c) break-even 10 and P(25) = 300.
