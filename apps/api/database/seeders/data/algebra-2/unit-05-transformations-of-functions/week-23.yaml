    - slug: alg2-u05-w23-q25
      type: long_answer
      topic_code: "5.11"
      source: "IM Algebra 2, Unit 5, Lesson 11"
      points: 6
      prompt: |
        A cup of tea in a 20°C room is measured at 90, 83, 76.7, 71.0 and 65.9 °C at t = 0, 1, 2, 3, 4 minutes. Write a full response that (1) explains why a plain exponential T(t) = a · bᵗ is the wrong parent function and identifies the transformation needed, (2) finds the model by subtracting the room temperature and showing the constant ratio, (3) uses the model to predict the temperature at 10 minutes and the time when the tea reaches 30°C, and (4) describes the model as a sum of two simpler functions and gives one limitation of the model.
      answer: |
        (1) The data levels off at room temperature, 20°C, not at 0, and the ratios 83/90 ≈ 0.92, 76.7/83 ≈ 0.92, 71/76.7 ≈ 0.93 drift upward. An exponential shifted up by 20 (a vertical translation) is needed.
        (2) Subtract 20: 70, 63, 56.7, 51.0, 45.9. Ratios 63/70 = 0.9, 56.7/63 = 0.9, 51/56.7 ≈ 0.9, 45.9/51 = 0.9. So T(t) = 70(0.9)ᵗ + 20.
        (3) T(10) = 70(0.9)¹⁰ + 20 ≈ 70 · 0.3487 + 20 ≈ 44.4°C. For 30°C: 70(0.9)ᵗ = 10, 0.9ᵗ = 1/7, t = log₀.₉(1/7) ≈ 18.5 minutes.
        (4) T is the sum of the constant function 20 (the room temperature, the long-run level) and the decaying exponential 70(0.9)ᵗ (the excess heat, losing 10% per minute). Limitation: it applies only while the tea sits undisturbed in the same room; drinking it, stirring it or a change in room temperature breaks the model, and it never predicts exactly 20°C.
      explanation: |
        Six points: 1 for the levelling-off argument and the vertical shift; 2 for the subtraction and constant ratio leading to 70(0.9)ᵗ + 20; 2 for T(10) ≈ 44.4 and t ≈ 18.5; 1 for the sum decomposition with a sensible limitation.
