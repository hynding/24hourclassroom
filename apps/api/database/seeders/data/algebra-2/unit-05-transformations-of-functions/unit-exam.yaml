    prompt: |
      A drink in a 15°C room is measured at 75, 66, 58.3 and 51.8 °C at t = 0, 1, 2, 3 minutes.
      (a) Explain how you can tell the data is a shifted exponential rather than a plain exponential or a line.
      (b) Find a model of the form T(t) = a · bᵗ + c.
