    answer: |
      (a) The differences 9, 7.7, 6.5 shrink, so it is not linear; the ratios 0.88, 0.883, 0.889 are not constant, so it is not a plain exponential; but the temperature is heading toward the room temperature 15, which suggests an exponential shifted up 15.
