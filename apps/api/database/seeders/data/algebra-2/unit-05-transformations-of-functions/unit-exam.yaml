unit: 5
description: |
  43 questions · about 80 minutes · every lesson of Unit 5 (5.1 to 5.11): matching data, translations,
  reflections, even and odd symmetry, writing transformations algebraically, scaling outputs and inputs,
  combining functions and modeling data. Includes three shared-context sets of three questions (a function
  given by points, a transformed parabola, and a pair of functions), select-all, true/false,
  fill-in-the-blank and numeric items, two short-answer questions (3 points each) and one extended response
  (6 points). Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher
  against the scoring notes.
questions:
  # ---- Stimulus set A: f through three points (5.3, 5.4)
  - slug: alg2-u05-exam-q01
    type: multiple_choice
    topic_code: "5.3"
    source: "IM Algebra 2, Unit 5, Lesson 3"
    points: 1
    stimulus: |
      The graph of f passes through (−2, 1), (0, 5) and (3, −4).
    prompt: |
      Which points lie on the graph of y = f(x − 1) − 2?
    options:
      - "(−1, −1), (1, 3), (4, −6)"
      - "(−3, −1), (−1, 3), (2, −6)"
      - "(−1, 3), (1, 7), (4, −2)"
      - "(−2, −1), (0, 3), (3, −6)"
    option_explanations:
      - |
        Correct. Each point moves right 1 and down 2.
      - |
        f(x − 1) shifts right, not left; the x-coordinates increase by 1.
      - |
        The −2 moves the points down, so the y-coordinates decrease by 2.
      - |
        The horizontal shift is missing; x − 1 inside moves each point right 1.
    answer: 0
  - slug: alg2-u05-exam-q02
    type: multiple_choice
    topic_code: "5.4"
    source: "IM Algebra 2, Unit 5, Lesson 4"
    points: 1
    stimulus: |
      The graph of f passes through (−2, 1), (0, 5) and (3, −4).
    prompt: |
      Which points lie on the graph of y = −f(x)?
    options:
      - "(2, 1), (0, 5), (−3, −4)"
      - "(−2, −1), (0, −5), (3, 4)"
      - "(2, −1), (0, −5), (−3, 4)"
      - "(1, −2), (5, 0), (−4, 3)"
    option_explanations:
      - |
        Changing the sign of the inputs is f(−x), the reflection across the y-axis.
      - |
        Correct. −f(x) changes the sign of every output: (a, b) → (a, −b).
      - |
        Changing both signs is −f(−x), two reflections.
      - |
        Swapping coordinates is not a reflection across an axis.
    answer: 1
  - slug: alg2-u05-exam-q03
    type: multiple_choice
    topic_code: "5.4"
    source: "IM Algebra 2, Unit 5, Lesson 4"
    points: 1
    stimulus: |
      The graph of f passes through (−2, 1), (0, 5) and (3, −4).
    prompt: |
      Which points lie on the graph of y = f(−x)?
    options:
      - "(2, 1), (0, 5), (−3, −4)"
      - "(−2, −1), (0, −5), (3, 4)"
      - "(2, −1), (0, −5), (−3, 4)"
      - "(−2, 1), (0, 5), (3, −4)"
    option_explanations:
      - |
        Correct. f(−x) changes the sign of every input: (a, b) → (−a, b); (0, 5) stays fixed on the y-axis.
      - |
        Changing the sign of every output is −f(x), a reflection across the x-axis, not f(−x).
      - |
        This changes both signs, which is −f(−x).
      - |
        The graph only stays the same if f is even, which these points rule out: f(−2) = 1 but f(2) is not given as 1.
    answer: 0
  # ---- Stimulus set B: g(x) = −2(x + 1)² + 8 (5.7, 5.8)
  - slug: alg2-u05-exam-q04
    type: multiple_choice
    topic_code: "5.7"
    source: "IM Algebra 2, Unit 5, Lesson 7"
    points: 1
    stimulus: |
      Let g(x) = −2(x + 1)² + 8, a transformation of f(x) = x².
    prompt: |
      Which list of transformations produces g from f?
    options:
      - "Reflect across the x-axis, stretch vertically by 2, shift left 1, shift up 8"
      - "Reflect across the y-axis, stretch vertically by 2, shift right 1, shift up 8"
      - "Stretch horizontally by 2, shift left 1, shift down 8"
      - "Reflect across the x-axis, compress vertically by 1/2, shift right 1, shift up 8"
    option_explanations:
      - |
        Correct. The −2 outside reflects and stretches by 2; x + 1 inside shifts left 1; + 8 shifts up 8.
      - |
        The negative sign is on the output, so the reflection is across the x-axis; and x + 1 shifts left.
      - |
        The factor 2 multiplies the output, a vertical stretch; and +8 shifts up.
      - |
        A factor of 2 is a stretch, not a compression, and x + 1 shifts left.
    answer: 0
  - slug: alg2-u05-exam-q05
    type: multiple_choice
    topic_code: "5.8"
    source: "IM Algebra 2, Unit 5, Lesson 8"
    points: 1
    stimulus: |
      Let g(x) = −2(x + 1)² + 8, a transformation of f(x) = x².
    prompt: |
      What is the vertex of the graph of g, and is it a maximum or a minimum?
    options:
      - "(1, 8), a minimum"
      - "(−1, 8), a maximum"
      - "(−1, −8), a minimum"
      - "(1, −8), a maximum"
    option_explanations:
      - |
        x + 1 is a shift left, so the vertex has x-coordinate −1; and the negative coefficient makes it a maximum.
      - |
        Correct. The vertex is (−1, 8), and because the coefficient −2 is negative the parabola opens downward.
      - |
        The +8 outside the square puts the vertex at height 8, and the graph opens downward.
      - |
        Both coordinates have the wrong sign; the point lies in the diagonally opposite quadrant.
    answer: 1
  - slug: alg2-u05-exam-q06
    type: multiple_choice
    topic_code: "5.7"
    source: "IM Algebra 2, Unit 5, Lesson 7"
    points: 1
    stimulus: |
      Let g(x) = −2(x + 1)² + 8, a transformation of f(x) = x².
    prompt: |
      What are the zeros of g?
    options:
      - "x = 1 and x = −3"
      - "x = −1 and x = 3"
      - "x = −1 only"
      - "x = 2 and x = −2"
    option_explanations:
      - |
        Correct. −2(x + 1)² + 8 = 0 gives (x + 1)² = 4, so x + 1 = ±2 and x = 1 or x = −3.
      - |
        x + 1 = ±2 gives 1 and −3, not −1 and 3.
      - |
        −1 is the x-coordinate of the vertex, where g = 8, not 0.
      - |
        ±2 are the values of x + 1, not of x; subtract 1 from each to get x = 1 or x = −3.
    answer: 0
  # ---- Stimulus set C: f(x) = 2x − 3, g(x) = x² + 1 (5.10)
  - slug: alg2-u05-exam-q07
    type: multiple_choice
    topic_code: "5.10"
    source: "IM Algebra 2, Unit 5, Lesson 10"
    points: 1
    stimulus: |
      Let f(x) = 2x − 3 and g(x) = x² + 1.
    prompt: |
      What is (f + g)(2)?
    options:
      - "6"
      - "5"
      - "1"
      - "11"
    option_explanations:
      - |
        Correct. f(2) = 1 and g(2) = 5, so the sum is 6.
      - |
        5 is g(2) alone; the sum still needs f(2) = 1 added to it.
      - |
        1 is f(2) alone; the sum still needs g(2) = 5 added to it.
      - |
        11 is f(2) + 2g(2); each function is added once.
    answer: 0
  - slug: alg2-u05-exam-q08
    type: multiple_choice
    topic_code: "5.10"
    source: "IM Algebra 2, Unit 5, Lesson 10"
    points: 1
    stimulus: |
      Let f(x) = 2x − 3 and g(x) = x² + 1.
    prompt: |
      Which expression equals (g − f)(x)?
    options:
      - "x² − 2x + 4"
      - "x² − 2x − 2"
      - "−x² + 2x − 4"
      - "x² + 2x − 2"
    option_explanations:
      - |
        Correct. x² + 1 − (2x − 3) = x² − 2x + 4.
      - |
        Subtracting −3 adds 3, so the constant is 1 + 3 = 4.
      - |
        −x² + 2x − 4 is (f − g)(x), the opposite order.
      - |
        x² + 2x − 2 is (f + g)(x), the sum, not the difference f − g.
    answer: 0
  - slug: alg2-u05-exam-q09
    type: multiple_choice
    topic_code: "5.10"
    source: "IM Algebra 2, Unit 5, Lesson 10"
    points: 1
    stimulus: |
      Let f(x) = 2x − 3 and g(x) = x² + 1.
    prompt: |
      What is (f · g)(−1)?
    options:
      - "−3"
      - "−10"
      - "10"
      - "−7"
    option_explanations:
      - |
        −3 is f(−1) + g(−1) = −5 + 2, the sum rather than the product.
      - |
        Correct. f(−1) = −5 and g(−1) = 2, so the product is −10.
      - |
        The sign is wrong: a negative times a positive is negative.
      - |
        −7 is f(−1) − g(−1), a difference rather than a product.
    answer: 1
  # ---- Single items
  - slug: alg2-u05-exam-q10
    type: multiple_choice
    topic_code: "5.1"
    source: "IM Algebra 2, Unit 5, Lesson 1"
    points: 1
    prompt: |
      A drink cools in a 15°C room. Which model is the right shape for its temperature?
    options:
      - "T(t) = 75(0.85)ᵗ"
      - "T(t) = 60(0.85)ᵗ + 15"
      - "T(t) = 75 − 9t"
      - "T(t) = 15(0.85)ᵗ + 60"
    option_explanations:
      - |
        This decays to 0, not to room temperature.
      - |
        Correct. The exponential part decays to 0, so the temperature approaches 15, the room temperature.
      - |
        A line keeps falling past 15 and below zero, so it cannot model a quantity that levels off.
      - |
        This levels off at 60, not at the room temperature.
    answer: 1
  - slug: alg2-u05-exam-q11
    type: multiple_choice
    topic_code: "5.2"
    source: "IM Algebra 2, Unit 5, Lesson 2"
    points: 1
    prompt: |
      What is the vertical asymptote and the x-intercept of y = log₂(x − 3)?
    options:
      - "Asymptote x = 3; x-intercept (4, 0)"
      - "Asymptote x = −3; x-intercept (−2, 0)"
      - "Asymptote x = 0; x-intercept (1, 0)"
      - "Asymptote y = 3; x-intercept (4, 0)"
    option_explanations:
      - |
        Correct. The graph of log₂(x) shifts right 3: the asymptote x = 0 becomes x = 3 and (1, 0) becomes (4, 0).
      - |
        x − 3 inside the function shifts the graph right by 3, not left.
      - |
        Those are the features before the shift.
      - |
        A horizontal shift moves the vertical asymptote; the asymptote is x = 3, a vertical line.
    answer: 0
  - slug: alg2-u05-exam-q12
    type: multiple_choice
    topic_code: "5.3"
    source: "IM Algebra 2, Unit 5, Lesson 3"
    points: 1
    prompt: |
      Where does the graph of y = √(x + 2) − 5 start, and in which direction does it extend?
    options:
      - "At (−2, −5), extending to the right"
      - "At (2, −5), extending to the right"
      - "At (−2, 5), extending to the left"
      - "At (2, 5), extending to the left"
    option_explanations:
      - |
        Correct. √x starts at (0, 0); x + 2 shifts left 2 and −5 shifts down 5, and the shape still extends right.
      - |
        x + 2 shifts left, so the start has x-coordinate −2.
      - |
        The −5 shifts down, and no reflection across the y-axis is present.
      - |
        Both coordinates are wrong and the direction is unchanged by shifts.
    answer: 0
  - slug: alg2-u05-exam-q13
    type: multiple_choice
    topic_code: "5.3"
    source: "IM Algebra 2, Unit 5, Lesson 3"
    points: 1
    prompt: |
      The point (3, 5) is on the graph of f. Which point is on the graph of y = f(x − 2) + 1?
    options:
      - "(1, 6)"
      - "(5, 6)"
      - "(5, 4)"
      - "(1, 4)"
    option_explanations:
      - |
        f(x − 2) shifts right 2, so the x-coordinate becomes 5.
      - |
        Correct. Right 2 and up 1: (3, 5) → (5, 6).
      - |
        The +1 outside the function moves the point up, to y = 6, not down to y = 4.
      - |
        Both directions are reversed here: the horizontal and the vertical shift are each the wrong way.
    answer: 1
  - slug: alg2-u05-exam-q14
    type: multiple_choice
    topic_code: "5.4"
    source: "IM Algebra 2, Unit 5, Lesson 4"
    points: 1
    prompt: |
      Which equation gives the graph of y = √x reflected across the y-axis?
    options:
      - "y = −√x"
      - "y = √(−x)"
      - "y = √x − 1"
      - "y = 1/√x"
    option_explanations:
      - |
        −√x is the reflection across the x-axis.
      - |
        Correct. Replacing x by −x reflects across the y-axis; the graph is defined for x ≤ 0.
      - |
        Subtracting 1 outside the function shifts the graph down by 1, not up.
      - |
        The reciprocal is a different function altogether, not a reflection.
    answer: 1
  - slug: alg2-u05-exam-q15
    type: multiple_choice
    topic_code: "5.4"
    source: "IM Algebra 2, Unit 5, Lesson 4"
    points: 1
    prompt: |
      Which description fits the graph of y = 2^(−x) + 1?
    options:
      - "Increasing, with horizontal asymptote y = 1"
      - "Decreasing, with horizontal asymptote y = 1 and y-intercept (0, 2)"
      - "Decreasing, with horizontal asymptote y = 0 and y-intercept (0, 1)"
      - "Increasing, with vertical asymptote x = 1"
    option_explanations:
      - |
        2^(−x) = (1/2)ˣ is decreasing; the reflection across the y-axis turns growth into decay.
      - |
        Correct. The reflection makes it decay, the +1 lifts the asymptote to y = 1, and 2⁰ + 1 = 2.
      - |
        The +1 moves both the asymptote and the intercept up by 1.
      - |
        Exponential graphs have horizontal asymptotes, and this one is decreasing.
    answer: 1
  - slug: alg2-u05-exam-q16
    type: multiple_choice
    topic_code: "5.5"
    source: "IM Algebra 2, Unit 5, Lesson 5"
    points: 1
    prompt: |
      The graph of an even function passes through (3, 7). Which point must also be on the graph?
    options:
      - "(−3, 7)"
      - "(−3, −7)"
      - "(3, −7)"
      - "(7, 3)"
    option_explanations:
      - |
        Correct. Even functions are symmetric about the y-axis: (a, b) → (−a, b).
      - |
        (−3, −7) is what origin symmetry (an odd function) would give.
      - |
        (3, −7) would give one input two outputs.
      - |
        Swapping coordinates is not a symmetry of an even function.
    answer: 0
  - slug: alg2-u05-exam-q17
    type: multiple_choice
    topic_code: "5.5"
    source: "IM Algebra 2, Unit 5, Lesson 5"
    points: 1
    prompt: |
      An odd function f is defined at x = 0. What must f(0) be?
    options:
      - "0"
      - "1"
      - "−1"
      - "It can be any number."
    option_explanations:
      - |
        Correct. f(−0) = −f(0) means f(0) = −f(0), which forces f(0) = 0.
      - |
        f(0) = 1 would need −f(0) = f(−0) = 1 as well, so 1 = −1, impossible.
      - |
        The same argument rules out −1: a negative input does not have a real square root here.
      - |
        Origin symmetry pins the value at 0; an even function can have any value at 0.
    answer: 0
  - slug: alg2-u05-exam-q18
    type: multiple_choice
    topic_code: "5.6"
    source: "IM Algebra 2, Unit 5, Lesson 6"
    points: 1
    prompt: |
      Classify p(x) = x⁴ − 2x² + 1.
    options:
      - "Even"
      - "Odd"
      - "Neither"
      - "Both even and odd"
    option_explanations:
      - |
        Correct. p(−x) = x⁴ − 2x² + 1 = p(x); only even powers (and a constant) appear.
      - |
        An odd function would need p(−x) = −p(x), but p(1) = 0 and p(−1) = 0 and p(2) = 9 = p(−2), not −9.
      - |
        The algebra gives p(−x) = p(x) for every x, so it is even.
      - |
        Only the zero function is both; p(2) = 9 ≠ 0.
    answer: 0
  - slug: alg2-u05-exam-q19
    type: multiple_choice
    topic_code: "5.6"
    source: "IM Algebra 2, Unit 5, Lesson 6"
    points: 1
    prompt: |
      Classify q(x) = x³ + x².
    options:
      - "Even"
      - "Odd"
      - "Neither"
      - "Even, because it has an x² term"
    option_explanations:
      - |
        q(1) = 2 and q(−1) = 0, so q(−x) ≠ q(x).
      - |
        q(−1) = 0 is not −q(1) = −2, so q is not odd.
      - |
        Correct. q(−x) = −x³ + x² matches neither q(x) nor −q(x); mixed powers give neither.
      - |
        One even-power term does not make the whole function even; the x³ term breaks the symmetry.
    answer: 2
  - slug: alg2-u05-exam-q20
    type: multiple_choice
    topic_code: "5.7"
    source: "IM Algebra 2, Unit 5, Lesson 7"
    points: 1
    prompt: |
      Which equation gives the graph of y = |x| shifted right 4, shifted down 2, and reflected across the x-axis?
    options:
      - "y = −|x − 4| − 2"
      - "y = −|x + 4| + 2"
      - "y = |−x − 4| − 2"
      - "y = −|x − 4| + 2"
    option_explanations:
      - |
        Correct. x − 4 inside shifts right 4; the negative sign outside reflects; −2 shifts down. The vertex is (4, −2), opening downward.
      - |
        x + 4 inside shifts the graph left by 4 and +2 outside shifts it up by 2, not the other way.
      - |
        A negative inside the absolute value reflects across the y-axis, not the x-axis.
      - |
        The +2 outside the function shifts the graph up, not down.
    answer: 0
  - slug: alg2-u05-exam-q21
    type: multiple_choice
    topic_code: "5.7"
    source: "IM Algebra 2, Unit 5, Lesson 7"
    points: 1
    prompt: |
      A parabola has vertex (−1, 2) and passes through (0, 5). Which equation describes it?
    options:
      - "y = (x + 1)² + 2"
      - "y = 3(x + 1)² + 2"
      - "y = 3(x − 1)² + 2"
      - "y = −3(x + 1)² + 2"
    option_explanations:
      - |
        (0 + 1)² + 2 = 3, not 5; a vertical stretch is needed.
      - |
        Correct. y = a(x + 1)² + 2 with a · 1 + 2 = 5 gives a = 3.
      - |
        (x − 1)² puts the vertex at x = 1, not −1.
      - |
        −3(1) + 2 = −1, not 5; the parabola opens upward.
    answer: 1
  - slug: alg2-u05-exam-q22
    type: multiple_choice
    topic_code: "5.8"
    source: "IM Algebra 2, Unit 5, Lesson 8"
    points: 1
    prompt: |
      The point (2, −3) is on the graph of f. Which point is on the graph of y = 4f(x)?
    options:
      - "(8, −3)"
      - "(2, −12)"
      - "(2, 1)"
      - "(8, −12)"
    option_explanations:
      - |
        Multiplying the outputs does not change the input.
      - |
        Correct. The output −3 is multiplied by 4 to give −12, so the point becomes (2, −12).
      - |
        (2, 1) would come from f(x) + 4, a shift.
      - |
        Only the output is multiplied by 4; the input 2 is left unchanged.
    answer: 1
  - slug: alg2-u05-exam-q23
    type: multiple_choice
    topic_code: "5.8"
    source: "IM Algebra 2, Unit 5, Lesson 8"
    points: 1
    prompt: |
      Which feature of the graph of f is guaranteed to be the same for the graph of y = 5f(x)?
    options:
      - "The y-intercept"
      - "The zeros"
      - "The maximum value"
      - "The horizontal asymptote, if there is one"
    option_explanations:
      - |
        The y-intercept f(0) becomes 5f(0), which differs unless f(0) = 0.
      - |
        Correct. If f(a) = 0 then 5f(a) = 0; a vertical stretch keeps every x-intercept.
      - |
        The maximum value is multiplied by 5 as well, because every output is scaled.
      - |
        A horizontal asymptote y = c becomes y = 5c, which moves unless c = 0.
    answer: 1
  - slug: alg2-u05-exam-q24
    type: multiple_choice
    topic_code: "5.9"
    source: "IM Algebra 2, Unit 5, Lesson 9"
    points: 1
    prompt: |
      The point (6, 4) is on the graph of f. Which point is on the graph of y = f(x/2)?
    options:
      - "(3, 4)"
      - "(12, 4)"
      - "(6, 2)"
      - "(6, 8)"
    option_explanations:
      - |
        (3, 4) is the image under f(2x), a compression; f(x/2) stretches.
      - |
        Correct. f(12/2) = f(6) = 4, so the point moves to (12, 4).
      - |
        Dividing the output by 2 would be 0.5f(x).
      - |
        Doubling the output would be written 2f(x); this expression doubles the input instead.
    answer: 1
  - slug: alg2-u05-exam-q25
    type: multiple_choice
    topic_code: "5.9"
    source: "IM Algebra 2, Unit 5, Lesson 9"
    points: 1
    prompt: |
      For f(x) = |x|, how does the graph of y = f(3x) compare with the graph of f?
    options:
      - "It is three times as wide."
      - "It is one third as wide, which for this function is the same as the vertical stretch y = 3|x|."
      - "It is shifted right 3."
      - "It is identical, because |3x| = |x|."
    option_explanations:
      - |
        f(3x) compresses horizontally: inputs are divided by 3.
      - |
        Correct. |3x| = 3|x|, so the horizontal compression by 1/3 coincides with a vertical stretch by 3.
      - |
        Multiplying x by 3 is a scaling, not a shift.
      - |
        |3x| = 3|x|, which differs from |x| everywhere except at x = 0, so the graph does change.
    answer: 1
  - slug: alg2-u05-exam-q26
    type: multiple_choice
    topic_code: "5.10"
    source: "IM Algebra 2, Unit 5, Lesson 10"
    points: 1
    prompt: |
      Revenue is R(x) = 80x and cost is C(x) = 500 + 55x. What is the profit function, and at what quantity does the company break even?
    options:
      - "P(x) = 25x − 500; break-even at x = 20"
      - "P(x) = 135x + 500; break-even at x = 0"
      - "P(x) = 500 − 25x; break-even at x = 20"
      - "P(x) = 25x − 500; break-even at x = 500"
    option_explanations:
      - |
        Correct. P = R − C = 80x − 500 − 55x = 25x − 500, which is 0 when x = 20.
      - |
        Profit is revenue minus cost, not revenue plus cost; adding would overstate it.
      - |
        500 − 25x is C − R, the wrong order; it would say profit falls as sales rise.
      - |
        The break-even quantity solves 25x = 500, giving 20, not 500.
    answer: 0
  - slug: alg2-u05-exam-q27
    type: multiple_choice
    topic_code: "5.11"
    source: "IM Algebra 2, Unit 5, Lesson 11"
    points: 1
    prompt: |
      Data at x = 0, 1, 2, 3, 4 is 1, 2, 5, 10, 17. Which model fits?
    options:
      - "y = 2ˣ"
      - "y = x² + 2"
      - "y = 2x + 1"
      - "y = x² + 1"
