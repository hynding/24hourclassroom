  - slug: alg2-u05-exam-q43
    type: long_answer
    topic_code: "5.7"
    source: "IM Algebra 2, Unit 5, Lesson 7"
    points: 6
    prompt: |
      Let f(x) = x². Write a full response that (1) writes the equation of g, the graph of f stretched vertically by 2, reflected across the x-axis, shifted left 1 and up 8, and finds its vertex, zeros and y-intercept, (2) explains why reflecting f across the y-axis produces the same graph, using the definition of an even function, (3) compares the graphs of 4f(x) and f(2x), explaining why they coincide for this f and giving an example of a function for which they would not, and (4) tracks the point (3, 9) through h(x) = 0.5f(x − 2) − 3, giving the image point and verifying it with the formula.
    answer: |
      (1) g(x) = −2(x + 1)² + 8. Vertex (−1, 8), a maximum. Zeros: (x + 1)² = 4, so x = 1 or x = −3. y-intercept g(0) = −2 + 8 = 6.
      (2) f(−x) = (−x)² = x² = f(x), so f is even; every point (a, b) has its mirror (−a, b) already on the graph, and the reflection maps the graph onto itself.
      (3) 4f(x) = 4x² and f(2x) = (2x)² = 4x²: the vertical stretch by 4 and the horizontal compression by 1/2 give the same graph because squaring turns the factor 2 on the input into a factor 4 on the output. For f(x) = x² + 1 they differ: 4f(x) = 4x² + 4 but f(2x) = 4x² + 1.
      (4) h compresses vertically by 1/2, shifts right 2 and down 3. (3, 9) → (3, 4.5) → (5, 4.5) → (5, 1.5). Check: h(5) = 0.5(5 − 2)² − 3 = 0.5 · 9 − 3 = 1.5. ✓
    explanation: |
      Six points: 2 for g with vertex, both zeros and intercept; 1 for the even-function explanation; 2 for the 4x² coincidence with a valid counterexample; 1 for the tracked point (5, 1.5) with a check.
