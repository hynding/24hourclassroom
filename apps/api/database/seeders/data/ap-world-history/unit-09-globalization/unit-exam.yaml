      A strong essay chooses a cause and defends the choice against others. Candidates: technology (jets, containers, satellites, the internet) lowered the cost of connection toward zero; policy (Bretton Woods, GATT and the WTO, the market turn of the 1980s, Deng's reforms, the Soviet collapse) removed the barriers; the search by multinationals for cheaper labour moved production to Asia; the Cold War's end made the market global; decolonization created the states and migrants that filled the networks; American power supplied the dollar, the rules and the culture. The best answers argue that technology was necessary but not sufficient (the same tools existed behind the Iron Curtain), and that political decisions, above all China's opening and the end of the Cold War, determined timing and extent; or that technology was decisive because policy only followed what containers and computers made profitable. Evidence: freight costs falling 90% after 1956; the internet's public opening in the 1990s; China's share of manufacturing rising from 2% to 25%; the WTO's founding; the 1997 and 2008 crises as proof of integration; Bollywood and K-pop as proof of cultural flow. Context: the nineteenth-century globalization interrupted by two wars and a depression. Complexity: the same causes produced the resistance of 9.7; or the contrast between 1945–79 (regulated, bloc-divided) and after 1979 (open, global); or that interconnection was not new, only faster and deeper.
    explanation: |
      LEQ rubric, 6 points.

      Thesis (1): names a most significant cause and gives a line of reasoning for ranking it, not merely a list of causes.
      Contextualisation (1): the broader setting (the 1913 world economy, the wars and depression, the post-war order, decolonization, the Cold War) described, not just named.
      Evidence (2): two or more specific examples (containers, the internet, Bretton Woods, the WTO, Deng's reforms, the Soviet collapse, China's manufacturing share, a financial crisis, a cultural export) used to support the ranking; 1 pt for evidence merely named.
      Analysis and reasoning (1): causation used to structure the essay, distinguishing enabling conditions from decisive choices or weighing one cause against another.
      Complexity (1): a sophisticated qualification, counter-argument, periodisation or cross-theme connection sustained across the essay.
