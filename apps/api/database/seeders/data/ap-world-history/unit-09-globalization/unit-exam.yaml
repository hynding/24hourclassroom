unit: 9
description: |
  45 questions · about 75 minutes · every topic of unit 9 (9.1 to 9.9) with review of units 5 to 8. Four
  source-based multiple-choice sets in the AP style (Clinton on China's entry to the WTO against Bush after
  11 September; Kennedy at Rice University; the Universal Declaration of Human Rights described; a table of
  growth, poverty and emissions), stand-alone multiple choice, select-all, true/false and fill-in-the-blank
  items, two short-answer questions (3 points each), one on a described photograph, and one long essay
  question (6 points) on causation. Multiple choice, select-all and true/false items are graded at once;
  fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher
  against the scoring notes.
questions:
  # ---- Stimulus set A: Clinton (2000) and Bush (2001) (9.4, 9.7, 9.8, 8.8)
  - slug: apworld-u09-exam-q01
    type: multiple_choice
    topic_code: "9.4"
    source: "Primary sources: William J. Clinton, remarks at Johns Hopkins University, 8 March 2000 (American Presidency Project); George W. Bush, Address to a Joint Session of Congress, 20 September 2001 (White House archives); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "By joining the W.T.O., China is not simply agreeing to import more of our products; it is agreeing to import one of democracy's most cherished values: economic freedom."
      — President Bill Clinton, on China's entry to the World Trade Organization, 8 March 2000

      Source 2: "Our war on terror begins with al Qaeda, but it does not end there. It will not end until every terrorist group of global reach has been found, stopped and defeated."
      — President George W. Bush, address to Congress, 20 September 2001
    prompt: |
      Source 1 most directly reflects which development of the 1990s?
    options:
      - "The belief that free trade and open markets would spread prosperity and, in time, democracy, which guided the expansion of the WTO, NAFTA and the EU"
      - "The revival of protectionism after the financial crisis"
      - "The containment of China through military alliances"
      - "The rejection of international institutions by the United States"
    option_explanations:
      - |
        Correct. The liberal consensus of 9.4 held that markets and democracy travelled together; admitting China to the WTO in 2001 was its largest bet.
      - |
        Protectionism revived after 2008; in 2000 the direction was toward openness.
      - |
        Clinton argues for engagement through trade, the opposite of containment.
      - |
        The speech urges support for a global institution, not withdrawal from it.
    answer: 0
    explanation: |
      Skill: contextualisation. Place the source in the free-trade optimism of the decade after the Cold War.

  - slug: apworld-u09-exam-q02
    type: multiple_choice
    topic_code: "9.7"
    source: "Primary sources: William J. Clinton, remarks at Johns Hopkins University, 8 March 2000 (American Presidency Project); George W. Bush, Address to a Joint Session of Congress, 20 September 2001 (White House archives); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "By joining the W.T.O., China is not simply agreeing to import more of our products; it is agreeing to import one of democracy's most cherished values: economic freedom."
      — President Bill Clinton, on China's entry to the World Trade Organization, 8 March 2000

      Source 2: "Our war on terror begins with al Qaeda, but it does not end there. It will not end until every terrorist group of global reach has been found, stopped and defeated."
      — President George W. Bush, address to Congress, 20 September 2001
    prompt: |
      Taken together, the two sources best illustrate which feature of globalization at the turn of the century?
    options:
      - "The withdrawal of the United States from world affairs"
      - "That the same connections which carried trade and values also carried new threats, so that the optimism of 2000 gave way within eighteen months to a global security campaign"
      - "The replacement of economic concerns by religious ones in American politics"
      - "The end of the WTO as a result of terrorism"
    option_explanations:
      - |
        Both sources commit the United States more deeply to the world, not less.
      - |
        Correct. Al-Qaeda used air travel, finance and media, the tools of the global economy Clinton celebrated; 9.7's resistance arrived through 9.1's connections.
      - |
        Economic globalization continued after 2001; China's trade grew fastest in the decade that followed.
      - |
        The WTO admitted China in December 2001, three months after the attacks.
    answer: 1
    explanation: |
      Skill: comparison of sources. Connection cuts both ways; both speeches are about a world the United States could not wall off.

  - slug: apworld-u09-exam-q03
    type: multiple_choice
    topic_code: "9.8"
    source: "Primary sources: William J. Clinton, remarks at Johns Hopkins University, 8 March 2000 (American Presidency Project); George W. Bush, Address to a Joint Session of Congress, 20 September 2001 (White House archives); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "By joining the W.T.O., China is not simply agreeing to import more of our products; it is agreeing to import one of democracy's most cherished values: economic freedom."
      — President Bill Clinton, on China's entry to the World Trade Organization, 8 March 2000

      Source 2: "Our war on terror begins with al Qaeda, but it does not end there. It will not end until every terrorist group of global reach has been found, stopped and defeated."
      — President George W. Bush, address to Congress, 20 September 2001
    prompt: |
      The institution named in Source 1 differs from the United Nations Security Council chiefly in that the WTO
    options:
      - "has a standing army to enforce its rulings"
      - "gives the United States a veto over every decision"
      - "binds members to trade rules and judges disputes between them through panels whose decisions can authorise retaliation, without any great-power veto"
      - "admits only democratic states"
    option_explanations:
      - |
        No international economic institution has armed forces.
      - |
        The WTO works by consensus among all members; no single state holds a Security Council-style veto.
      - |
        Correct. The WTO's dispute system is the strongest enforcement any global institution has, which is why Seattle's protesters called it unelected power and why later governments attacked it.
      - |
        China's admission in 2001 shows that political system is no bar to membership.
    answer: 2
    explanation: |
      Skill: comparison of institutions (9.8). Trade rules bind more tightly than security resolutions.

  - slug: apworld-u09-exam-q04
    type: multiple_choice
    topic_code: "8.8"
    source: "Primary sources: William J. Clinton, remarks at Johns Hopkins University, 8 March 2000 (American Presidency Project); George W. Bush, Address to a Joint Session of Congress, 20 September 2001 (White House archives); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "By joining the W.T.O., China is not simply agreeing to import more of our products; it is agreeing to import one of democracy's most cherished values: economic freedom."
      — President Bill Clinton, on China's entry to the World Trade Organization, 8 March 2000

      Source 2: "Our war on terror begins with al Qaeda, but it does not end there. It will not end until every terrorist group of global reach has been found, stopped and defeated."
      — President George W. Bush, address to Congress, 20 September 2001
    prompt: |
      Both speeches were possible only because of which change in the decade before them?
    options:
      - "The founding of the United Nations"
      - "The Chinese Revolution of 1949"
      - "The oil shock of 1973"
      - "The end of the Cold War, which left the United States as the sole superpower able to set the terms of trade and to wage a global campaign without a rival bloc opposing it"
    option_explanations:
      - |
        The UN dates from 1945; it is too remote to explain speeches of 2000 and 2001.
      - |
        China's revolution created the state Clinton addresses, but the speeches respond to the 1990s, not 1949.
      - |
        The oil shock belongs to the 1970s stagnation that preceded the market turn.
      - |
        Correct. After 1991 no Soviet veto, army or alternative economic model stood in the way; Clinton's engagement of China and Bush's 'every nation ... has a decision to make' both assume American primacy (8.8).
    answer: 3
    explanation: |
      Skill: causation (spiral to 8.8). The unipolar moment is the context of both.

  # ---- Stimulus set B: Kennedy at Rice (1962) (9.1, 9.3, 8.3)
  - slug: apworld-u09-exam-q05
    type: multiple_choice
    topic_code: "9.1"
    source: "Primary source: John F. Kennedy, address at Rice University, Houston, 12 September 1962 (John F. Kennedy Presidential Library); U.S. government work"
    points: 1
    stimulus: |
      "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard".

      — President John F. Kennedy, speaking at Rice University, Houston, 12 September 1962, five years after Sputnik and a year after Yuri Gagarin's orbital flight
    prompt: |
      Which later development was most directly a product of the programme Kennedy describes?
    options:
      - "Communications and weather satellites that carried television, telephone calls and later the internet and GPS across the world"
      - "The container ship, which cut the cost of ocean freight"
      - "The discovery of antibiotics"
      - "The Green Revolution's high-yield wheat"
    option_explanations:
      - |
        Correct. The rockets, computing and satellite technology of the space race became the infrastructure of global communication (9.1).
      - |
        Containers (1956) came from shipping, not from the space programme.
      - |
        Penicillin was developed during the Second World War.
      - |
        Borlaug's wheat came from agricultural research in Mexico, unconnected to space.
    answer: 0
    explanation: |
      Skill: causation. A Cold War contest built the hardware of globalization.

  - slug: apworld-u09-exam-q06
    type: multiple_choice
    topic_code: "9.3"
    source: "Primary source: John F. Kennedy, address at Rice University, Houston, 12 September 1962 (John F. Kennedy Presidential Library); U.S. government work"
    points: 1
    stimulus: |
      "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard".

      — President John F. Kennedy, speaking at Rice University, Houston, 12 September 1962, five years after Sputnik and a year after Yuri Gagarin's orbital flight
    prompt: |
      An unintended effect of the programme on the environmental debate was that
    options:
      - "rocket launches became the main cause of global warming"
      - "photographs of the whole Earth from space, such as Earthrise (1968), gave the environmental movement its image of a single, fragile planet"
      - "the Moon was found to hold resources that replaced fossil fuels"
      - "satellites proved that climate change was not occurring"
    option_explanations:
      - |
        Launches contribute a negligible share of emissions; fossil fuels on Earth are the cause.
      - |
        Correct. Earthrise and the 'blue marble' photographs appeared on the first Earth Day posters (1970) and shaped the idea of one shared environment.
      - |
        No lunar resource has replaced any fuel; the Moon's economic return was nil.
      - |
        Satellites are the chief instruments measuring warming, sea-level rise and ice loss; they confirm it.
    answer: 1
    explanation: |
      Skill: causation (unintended consequences). A view from space changed how people saw the Earth.

  - slug: apworld-u09-exam-q07
    type: multiple_choice
    topic_code: "8.3"
    source: "Primary source: John F. Kennedy, address at Rice University, Houston, 12 September 1962 (John F. Kennedy Presidential Library); U.S. government work"
    points: 1
    stimulus: |
      "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard".

      — President John F. Kennedy, speaking at Rice University, Houston, 12 September 1962, five years after Sputnik and a year after Yuri Gagarin's orbital flight
    prompt: |
      The speech is best understood in the context of
    options:
      - "the détente of the 1970s"
      - "the collapse of the Soviet Union"
      - "the Cold War competition for prestige, in which Soviet firsts in space suggested to the newly independent states that communism could out-build capitalism"
      - "the Marshall Plan's reconstruction of Europe"
    option_explanations:
      - |
        Détente came a decade later, after the Moon landing.
      - |
        The Soviet Union collapsed in 1991, long after the speech.
      - |
        Correct. Sputnik and Gagarin were propaganda victories in the contest for the Third World (8.3); the Moon programme answered them, and the Cuban missile crisis came one month after the speech.
      - |
        The Marshall Plan (1948–52) rebuilt Europe's economies and has no connection to space.
    answer: 2
    explanation: |
      Skill: contextualisation (spiral to 8.3, the Cold War's effects). The space race was a Cold War front.

  # ---- Stimulus set C: the UDHR described (9.5, 9.8, 7.8)
  - slug: apworld-u09-exam-q08
    type: multiple_choice
    topic_code: "9.5"
    source: "Primary source: Universal Declaration of Human Rights (1948), Article 1, a short phrase quoted; the rest described in our own words"
    points: 1
    stimulus: |
      Source description: The Universal Declaration of Human Rights, adopted by the United Nations General Assembly on 10 December 1948 with no votes against and eight abstentions (the Soviet bloc, Saudi Arabia and South Africa), opens by declaring that all human beings are "born free and equal in dignity and rights". Its thirty articles list civil and political rights (life, liberty, freedom from slavery and torture, fair trial, free expression, free elections) and economic and social rights (work, fair pay, rest, education, an adequate standard of living). The drafting committee was chaired by Eleanor Roosevelt and included members from China, Lebanon, France, Chile and other states.
    prompt: |
      Which later movement most directly invoked the standard the declaration set?
    options:
      - "The anti-globalization protests against the WTO"
      - "The tariff wars of 2018–19"
      - "The Green Revolution in agriculture"
      - "The campaign against apartheid in South Africa, which cited the declaration against a state that had abstained from it"
    option_explanations:
      - |
        The Seattle protesters invoked fairness and democracy, but their target was trade rules, not a rights document.
      - |
        Tariff policy belongs to economic nationalism, unrelated to the declaration.
      - |
        The Green Revolution was a matter of seeds and fertilisers, not rights.
      - |
        Correct. The ANC, the UN General Assembly's resolutions and the sanctions campaign all measured apartheid against the declaration's equality clause; South Africa's abstention in 1948 made the point for them.
    answer: 3
    explanation: |
      Skill: causation (effects of a document). The declaration became the yardstick for every rights movement after it (9.5).

  - slug: apworld-u09-exam-q09
    type: multiple_choice
    topic_code: "9.8"
    source: "Primary source: Universal Declaration of Human Rights (1948), Article 1, a short phrase quoted; the rest described in our own words"
    points: 1
    stimulus: |
      Source description: The Universal Declaration of Human Rights, adopted by the United Nations General Assembly on 10 December 1948 with no votes against and eight abstentions (the Soviet bloc, Saudi Arabia and South Africa), opens by declaring that all human beings are "born free and equal in dignity and rights". Its thirty articles list civil and political rights (life, liberty, freedom from slavery and torture, fair trial, free expression, free elections) and economic and social rights (work, fair pay, rest, education, an adequate standard of living). The drafting committee was chaired by Eleanor Roosevelt and included members from China, Lebanon, France, Chile and other states.
    prompt: |
      The chief limit on the declaration's effect was that
    options:
      - "it was a resolution of the General Assembly with no enforcement mechanism, so that states could sign it and ignore it, and the abstaining states showed the disagreements beneath it"
      - "it listed only political rights and ignored economic ones"
      - "it was written entirely by Western states"
      - "it was repealed by the UN in 1966"
    option_explanations:
      - |
        Correct. The declaration binds no one; the later covenants (1966) and NGOs such as Amnesty had to turn its words into pressure, and the Soviet, Saudi and South African abstentions foreshadowed the arguments over whose rights count.
      - |
        Articles 22 to 27 set out economic and social rights, at Soviet and Latin American insistence.
      - |
        The committee included China, Lebanon, Chile and India; the description says so.
      - |
        The 1966 covenants added binding treaties; the declaration was never repealed.
    answer: 0
    explanation: |
      Skill: claims and evidence (limits of a source). A standard without a court.

  - slug: apworld-u09-exam-q10
    type: multiple_choice
    topic_code: "7.8"
    source: "Primary source: Universal Declaration of Human Rights (1948), Article 1, a short phrase quoted; the rest described in our own words"
    points: 1
    stimulus: |
      Source description: The Universal Declaration of Human Rights, adopted by the United Nations General Assembly on 10 December 1948 with no votes against and eight abstentions (the Soviet bloc, Saudi Arabia and South Africa), opens by declaring that all human beings are "born free and equal in dignity and rights". Its thirty articles list civil and political rights (life, liberty, freedom from slavery and torture, fair trial, free expression, free elections) and economic and social rights (work, fair pay, rest, education, an adequate standard of living). The drafting committee was chaired by Eleanor Roosevelt and included members from China, Lebanon, France, Chile and other states.
    prompt: |
      The declaration's adoption in 1948 was most directly a response to
    options:
      - "the Cuban missile crisis"
      - "the Holocaust and the other mass atrocities of the Second World War, which the Nuremberg trials had just placed before the world"
      - "the Great Depression"
      - "the independence of India"
    option_explanations:
      - |
        The missile crisis came in 1962, fourteen years later.
      - |
        Correct. The declaration and the Genocide Convention (adopted the day before it) were the UN's answer to the crimes of 1939–45 (7.8), after Nuremberg had established that states could be judged.
      - |
        The Depression shaped the economic articles, but the immediate cause was the war's atrocities.
      - |
        Indian independence (1947) was part of the decolonizing context, not the trigger.
    answer: 1
    explanation: |
      Skill: causation (spiral to 7.8, mass atrocities). Never again, written down.

  # ---- Stimulus set D: growth, poverty, emissions table (9.4, 9.3, 6.4)
  - slug: apworld-u09-exam-q11
    type: multiple_choice
    topic_code: "9.4"
    source: "Data table compiled for this course from standard published estimates (rounded)"
    points: 1
    stimulus: |
      The world economy, 1980–2015 (approximate)

      | Indicator | 1980 | 2000 | 2015 |
      |---|---|---|---|
      | World GDP (trillions of 2015 dollars) | 28 | 50 | 75 |
      | Share of humanity in extreme poverty | 42% | 28% | 10% |
      | China's share of world manufacturing output | 2% | 7% | 25% |
      | United States' share of world manufacturing output | 23% | 25% | 17% |
      | World carbon dioxide emissions (billions of tonnes a year) | 19 | 25 | 36 |
      | Share of emissions from China | 8% | 14% | 28% |
    prompt: |
      Which conclusion is best supported by the table?
    options:
      - "Poverty fell because the United States increased its manufacturing"
      - "World output fell while emissions rose"
      - "The decline in extreme poverty coincided with the shift of manufacturing to China and with a sharp rise in emissions, much of it from China"
      - "China's growth had no effect on the environment"
    option_explanations:
      - |
        The American share of manufacturing fell after 2000; the poverty fall tracks China's rise, not America's.
      - |
        World output nearly tripled; both output and emissions rose.
      - |
        Correct. The three trends are one process: industrialisation moved to China, lifted hundreds of millions from poverty and burned the coal that raised emissions (9.4 and 9.3 together).
      - |
        China's share of emissions more than tripled; the table shows the environmental effect directly.
    answer: 2
    explanation: |
      Skill: analysing data. Read the rows together; the exam likes a conclusion that links two trends.

  - slug: apworld-u09-exam-q12
    type: multiple_choice
    topic_code: "9.3"
    source: "Data table compiled for this course from standard published estimates (rounded)"
    points: 1
    stimulus: |
      The world economy, 1980–2015 (approximate)

      | Indicator | 1980 | 2000 | 2015 |
      |---|---|---|---|
      | World GDP (trillions of 2015 dollars) | 28 | 50 | 75 |
      | Share of humanity in extreme poverty | 42% | 28% | 10% |
      | China's share of world manufacturing output | 2% | 7% | 25% |
      | United States' share of world manufacturing output | 23% | 25% | 17% |
      | World carbon dioxide emissions (billions of tonnes a year) | 19 | 25 | 36 |
      | Share of emissions from China | 8% | 14% | 28% |
    prompt: |
      The emissions rows help explain which feature of the climate negotiations from Kyoto (1997) to Paris (2015)?
    options:
      - "The agreement of every state to cut emissions equally"
      - "The absence of any role for developing countries"
      - "The refusal of the United States to attend"
      - "The dispute over whether the rich countries, responsible for most past emissions, or the fast-growing countries, responsible for most new emissions, should cut first"
    option_explanations:
      - |
        Kyoto bound only developed countries; Paris let each state set its own target. Equal cuts were never agreed.
      - |
        China and India were central to every negotiation after 2000 precisely because their emissions were rising.
      - |
        The United States attended Kyoto and Paris; it signed Kyoto without ratifying it and joined Paris, left it in 2017 and rejoined in 2021.
      - |
        Correct. The table shows China's share rising from 8% to 28%; the rich countries pointed to that, and China pointed to the century of emissions before 1980. Paris's answer was voluntary national pledges.
    answer: 3
    explanation: |
      Skill: analysing data (causation). The 'common but differentiated responsibilities' argument in numbers.

  - slug: apworld-u09-exam-q13
    type: multiple_choice
    topic_code: "6.4"
    source: "Data table compiled for this course from standard published estimates (rounded)"
    points: 1
    stimulus: |
      The world economy, 1980–2015 (approximate)

      | Indicator | 1980 | 2000 | 2015 |
      |---|---|---|---|
      | World GDP (trillions of 2015 dollars) | 28 | 50 | 75 |
      | Share of humanity in extreme poverty | 42% | 28% | 10% |
      | China's share of world manufacturing output | 2% | 7% | 25% |
      | United States' share of world manufacturing output | 23% | 25% | 17% |
      | World carbon dioxide emissions (billions of tonnes a year) | 19 | 25 | 36 |
      | Share of emissions from China | 8% | 14% | 28% |
    prompt: |
      China's rise in the table reversed which pattern of the nineteenth-century world economy?
    options:
      - "The division of the world into industrial producers in Europe and North America and exporters of raw materials elsewhere, in which China had sold tea and silk and bought manufactured goods"
      - "The dominance of Chinese manufacturing in world trade before 1800"
      - "The gold standard"
      - "The export of European capital to the Americas"
    option_explanations:
      - |
        Correct. The imperial world economy of 6.4 made Asia a supplier of commodities and a market for Western goods; by 2015 China made a quarter of the world's manufactures.
      - |
        China had led the world in manufactures before 1800, so its rise after 1980 is a return to that older pattern, not a reversal of it; the question asks about the nineteenth century.
      - |
        The gold standard ended in 1971, before the table begins, and has nothing to do with manufacturing shares.
      - |
        Capital exports to the Americas concern a different region and are not reversed by China's growth.
    answer: 0
    explanation: |
      Skill: continuity and change (spiral to 6.4, the imperial world economy). Nineteenth-century roles reversed in a generation.

  # ---- Stand-alone multiple choice (9.1–9.9 with review of units 5–8)
  - slug: apworld-u09-exam-q14
    type: multiple_choice
    topic_code: "9.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The shipping container, introduced in 1956, transformed world trade chiefly because it
    options:
      - "made ships faster"
      - "cut the cost and time of loading and unloading so sharply that the price of moving goods across oceans ceased to matter, allowing production to be located wherever labour was cheapest"
      - "allowed goods to be sent by air instead of sea"
      - "ended the need for ports"
    option_explanations:
      - |
        Ship speeds changed little; the saving was in port time, which fell from weeks to hours.
      - |
        Correct. Standard boxes moved by crane from ship to train to truck cut freight costs by more than 90% and made global supply chains possible (9.1).
      - |
        Containers are a sea and land technology; air freight is a separate, costlier channel.
      - |
        Ports became more important, but fewer and larger: Singapore, Rotterdam, Shanghai.
    answer: 1
    explanation: |
      Skill: causation. A humble box did more for globalization than most treaties.

  - slug: apworld-u09-exam-q15
    type: multiple_choice
    topic_code: "9.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The spread of HIV/AIDS from the 1980s and of COVID-19 in 2020 both demonstrate that
    options:
      - "medical science had made no progress since 1900"
      - "pandemics affect only poor countries"
      - "the same transport and migration networks that carry trade carry disease, so that an outbreak anywhere can become global within months"
      - "international health institutions had been abolished"
    option_explanations:
      - |
        Antiretroviral drugs turned HIV into a manageable condition, and COVID-19 vaccines were made within a year; progress was enormous.
      - |
        Both pandemics struck rich and poor countries; AIDS was first identified in the United States.
      - |
        Correct. Air travel moved HIV across continents and carried COVID-19 to every country in three months; connection is the vector (9.2).
      - |
        The WHO coordinated the response to both, however imperfectly.
    answer: 2
    explanation: |
      Skill: comparison and causation. Globalization's networks carry everything, including pathogens.

  - slug: apworld-u09-exam-q16
    type: multiple_choice
    topic_code: "9.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The rise of heart disease, diabetes and cancer as leading causes of death in many countries after 1950 is best explained by
    options:
      - "the failure of vaccination programmes"
      - "the spread of new infectious diseases"
      - "the decline of medical care in industrial countries"
      - "longer lives and changed diets and habits, as the conquest of infection meant people lived long enough to die of the diseases of ageing and affluence"
    option_explanations:
      - |
        Vaccination succeeded; that success is part of the explanation.
      - |
        New infections (HIV, Ebola) killed far fewer than heart disease.
      - |
        Medical care improved; it is the reason people survived infections.
      - |
        Correct. Life expectancy rose from under 50 to over 70 worldwide; with infection controlled, tobacco, sugar, inactivity and age became the killers (9.2).
    answer: 3
    explanation: |
      Skill: causation. The epidemiological transition in one sentence.

  - slug: apworld-u09-exam-q17
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The Bretton Woods conference of 1944 created which pair of institutions?
    options:
      - "The International Monetary Fund and the World Bank"
      - "The United Nations and the League of Nations"
      - "The World Trade Organization and the European Union"
      - "NATO and the Warsaw Pact"
    option_explanations:
      - |
        Correct. The IMF to stabilise currencies and the World Bank to lend for reconstruction and development; both outlived the dollar-gold system they were built around (8.1).
      - |
        The UN was founded at San Francisco in 1945; the League dissolved in 1946.
      - |
        The WTO dates from 1995 and the EU's origins from 1951–57.
      - |
        NATO (1949) and the Warsaw Pact (1955) were military alliances, not economic institutions.
    answer: 0
    explanation: |
      Skill: developments and processes (spiral to 8.1). The economic half of the post-war order.

  - slug: apworld-u09-exam-q18
    type: multiple_choice
    topic_code: "9.4"
    source: "general knowledge"
    points: 1
    prompt: |
      The economic growth of South Korea, Taiwan, Singapore and Hong Kong from the 1960s was based primarily on
    options:
      - "exports of oil and minerals"
      - "export-oriented manufacturing guided by the state, with investment in schooling, land reform and access to the American market"
      - "Soviet-style central planning"
      - "agricultural self-sufficiency and closed borders"
    option_explanations:
      - |
        None of the four has significant oil or mineral exports; they imported raw materials.
      - |
        Correct. The 'tigers' combined state direction (Korea's chaebol, Singapore's planning) with open export markets, the model China later adapted (9.4).
      - |
        All four were capitalist and allied with the United States.
      - |
