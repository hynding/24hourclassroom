      Your response should include a historically defensible thesis, use the broader historical context, support the argument with at least two specific pieces of evidence, use historical reasoning (causation) to frame the argument, and demonstrate a complex understanding by, for example, weighing one cause against others, considering a counter-argument or connecting the argument to another period or theme.
