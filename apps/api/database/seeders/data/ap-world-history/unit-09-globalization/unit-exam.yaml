      (c) The haze over the city points to air pollution and the carbon emissions of ships, trucks and factories; deindustrialisation in the countries that import the containers' contents; the dependence of every economy on supply chains that a pandemic or a blocked canal can halt; the Danish ship's name shows that profits flow to multinationals, not to the dockworkers.
