    # ---- Long answer (LEQ)
    - slug: apworld-u09-w31-q25
      type: long_answer
      topic_code: "9.4"
      source: "general knowledge"
      points: 6
      prompt: |
        After 1980 free-market policies, trade agreements and multinational corporations reshaped the world economy.

        Evaluate the extent to which economic globalization after 1980 benefited the world's population.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Economic globalization after 1980 produced the largest reduction of poverty in history and benefited most of humanity in income, goods and health, but its gains were concentrated in East and South Asia and among the owners of capital, while industrial workers in the West, debtor countries in the 1980s and the environment bore its costs; the benefit was great in aggregate and unequal in distribution, and the inequality generated the backlash that now threatens it.

        Context: the Bretton Woods order; the stagnation of the 1970s; the Soviet collapse and Deng's reforms; the container and the internet.

        Body 1 (benefits): extreme poverty from 40% to under 10%; China's 800 million; the tigers; life expectancy and literacy rising; cheaper goods; Indian services; remittances.

        Body 2 (costs): deindustrialisation in the American Midwest and northern England; structural adjustment and the lost decade in Latin America and Africa; the 1997 and 2008 crises; rising inequality within countries; sweatshops; environmental damage from supply chains.

        Body 3 (comparison across regions and models): East Asia's developmental states versus Africa's commodity dependence; Europe's social market versus Anglo-American neoliberalism; China's party-led market.

        Complexity: inequality fell between countries while rising within them; the same policies produced growth in one place and crisis in another, so institutions and states mattered as much as markets; the backlash (populism, protectionism after 2016) as evidence of distribution's political weight.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim about extent of benefit with a line of reasoning that addresses distribution. Zero for "globalization had good and bad effects" without weighting.

        Contextualization (0–1): Bretton Woods and the postwar order; the 1970s crisis; the end of the Cold War; the technologies of exchange.

        Evidence (0–2): 1 pt for at least two specific examples (poverty figures; China's reforms; the tigers; NAFTA or the WTO; structural adjustment; the 2008 crisis; deindustrialisation; inequality data). 2 pts for using them to support the weighting.

        Analysis and reasoning (0–2): 1 pt for causation or comparison structuring the essay. 1 pt for complexity: between-country versus within-country inequality; the role of states and institutions; the backlash; environmental cost.
