week: 31
unit: 9
title: "Economics, Reform, and Culture in the Global Age"
topics: ["9.4", "9.5", "9.6"]
guide: guides/week-31.md
guide_description: |
  The market turn after 1979 (Thatcher, Reagan, Deng, Pinochet, structural adjustment), the institutions and
  firms of the global economy (WTO, EU, NAFTA, multinationals), the Asian tigers and China, winners and losers
  and the crisis of 2008. Then the calls for reform since 1948: human rights, women's rights, racial and ethnic
  minorities, caste, microfinance, and how states answered. And global culture: Hollywood and English,
  Bollywood, K-pop, reggae and football, religious revival, and the reactions against homogenisation.
flashcards_description: |
  30 cards on neoliberal policies and their results, the institutions of global trade, the rise of East Asia,
  the rights movements and documents since 1948, and the flows and fusions of global culture.

flashcards:
  - front: Neoliberalism → policies and leaders
    back: |
      Privatisation of state industries, deregulation, lower taxes, free trade, weaker unions, tight money against inflation. Thatcher (Britain, 1979), Reagan (United States, 1981), Pinochet's Chile under the Chicago boys (from 1973), the IMF's structural adjustment, and after 1991 the former Soviet bloc. A revival of nineteenth-century liberalism after the stagnation of the 1970s.
    topic_code: "9.4"
  - front: Why the market model won after 1979 → four causes
    back: |
      Inflation, oil shocks and stagnation discredited Keynesian management in the West; the Soviet and Latin American planned or protected economies stagnated; the Asian tigers showed export markets worked; the Soviet collapse of 1991 removed the alternative. The IMF, World Bank and WTO spread the model as conditions and rules.
    topic_code: "9.4"
  - front: Deng Xiaoping's reforms (from 1978) → what changed and what did not
    back: |
      Communes dissolved and households farm for profit; special economic zones (Shenzhen) with foreign investment; private enterprise permitted; state firms reformed; WTO entry (2001). The party kept its monopoly (Tiananmen, 1989). Growth near 10% a year for thirty years; about 800 million lifted from extreme poverty; the world's second economy by 2010.
    topic_code: "9.4"
  - front: Asian tigers → who, how, and when
    back: |
      South Korea, Taiwan, Hong Kong and Singapore from the 1960s: export manufacturing (textiles, then ships, steel, electronics), high savings, education, land reform, state guidance of credit and industry, American markets and aid. Poor countries became rich in a generation; the model for China and Southeast Asia.
    topic_code: "9.4"
  - front: Structural adjustment → what the IMF required and the results
    back: |
      Loans in the debt crisis of the 1980s came with conditions: cut public spending, devalue, privatise, open to trade and investment. Results: stabilised finances in some cases, but cuts to health and education, rising poverty and a lost decade in Latin America and Africa; the backlash shaped the anti-globalization movement.
    topic_code: "9.4"
  - front: Multinational corporations → scale and organisation
    back: |
      Firms producing and selling in many countries: Toyota, Shell, Apple, Walmart, Samsung, Nestlé. By the 2000s the largest had revenues above most states' budgets. They organise supply chains across borders (design, components, assembly, sale in different countries), move production to cheap labour, and shift profits to low-tax jurisdictions.
    topic_code: "9.4"
  - front: Trade institutions → GATT to WTO, and the regional blocs
    back: |
      GATT (1947) cut tariffs through rounds; the WTO (1995) added services, intellectual property and dispute settlement; China joined in 2001. Regional: the European Union (single market 1993, euro 1999), NAFTA (1994, now USMCA), ASEAN (1967), Mercosur (1991). Trade grew far faster than output.
    topic_code: "9.4"
  - front: European Union → the sequence of integration
    back: |
      Coal and Steel Community (1951); Treaty of Rome and the Common Market (1957); enlargement from six to twenty-seven; single market (1993); Maastricht and the EU (1993); the euro (1999); eastward enlargement (2004); Britain leaves (2020). The deepest economic and political integration of sovereign states in history.
    topic_code: "9.4"
  - front: Outsourcing and supply chains → how a product crosses borders
    back: |
      A smartphone designed in California with chips from Taiwan, screens from Korea, assembly in Shenzhen and sale worldwide; call centres and software in India. Containers, the internet and wage gaps make it pay. Effects: manufacturing jobs leave the West, industrialization comes to Asia, prices fall, inequality shifts.
    topic_code: "9.4"
  - front: Winners and losers of globalization, 1980–2008 → the balance sheet
    back: |
      Winners: East and South Asian workers and middle classes (extreme poverty from 40% of humanity to under 10%), consumers, the global rich, multinational firms. Losers: industrial workers in the West (deindustrialisation), structural-adjustment Africa and Latin America in the 1980s, small farmers, the environment. Inequality fell between countries and rose within them.
    topic_code: "9.4"
  - front: Financial crises of the global age → 1994, 1997, 2008
    back: |
      Mexico (1994) and East Asia (1997): capital flight and IMF bailouts with harsh conditions. The global financial crisis of 2008: American mortgage debt packaged and sold worldwide brought down banks; governments spent and central banks lent to avoid a repeat of 1929; a deep recession followed, with the backlash against globalization and elites growing from it.
    topic_code: "9.4"
  - front: Clinton on China and the WTO (2000) → the argument and its outcome
    back: |
      Clinton told Congress that by joining the WTO China was agreeing to import not just more American goods but economic freedom, which he expected to bring political freedom. China's entry in 2001 made it the workshop of the world; the political prediction did not come true, and the trade shock on Western manufacturing fed later protectionism.
    topic_code: "9.4"
  - front: Universal Declaration of Human Rights (1948) → content and significance
    back: |
      Adopted by the UN General Assembly under Eleanor Roosevelt's chairmanship; declares all human beings born free and equal in dignity and rights, with civil, political, economic and social rights for everyone. Not binding, but the foundation of the 1966 covenants, the Helsinki process, Amnesty International and the language every rights movement has used since.
    topic_code: "9.5"
  - front: Women's rights in the global age → milestones
    back: |
      Suffrage spreading (Switzerland 1971, Saudi Arabia 2015); the UN Decade for Women (1975–85); CEDAW, the convention against discrimination (1979); the Beijing conference (1995) declaring women's rights human rights; rising education and labour-force participation; laws on equal pay and violence. Gaps remain in pay, representation and safety, and some states resist.
    topic_code: "9.5"
  - front: Racial and ethnic minorities → reform movements and responses
    back: |
      U.S. civil rights acts (1964–65); apartheid ended (1994); India's constitution (1950, Ambedkar) outlawed untouchability and reserved seats and jobs for Dalits; indigenous rights in Australia (Mabo, 1992), Canada and Latin America (Bolivia's Morales, 2006); the UN Declaration on Indigenous Peoples (2007). Responses ranged from legal reform to continued discrimination.
    topic_code: "9.5"
  - front: Caste in India after independence → reform and persistence
    back: |
      The constitution of 1950, drafted under B. R. Ambedkar, a Dalit, abolished untouchability and created reservations (quotas) in education, jobs and legislatures for scheduled castes and tribes, extended to other backward classes in 1990. Dalit political parties rose; discrimination and violence persist, especially in villages.
    topic_code: "9.5"
  - front: Microfinance → Grameen Bank and the debate
    back: |
      Muhammad Yunus's Grameen Bank (Bangladesh, 1983) lent small sums to groups of poor women without collateral; repayment rates were high and the model spread worldwide; Nobel Peace Prize 2006. Critics found over-indebtedness and modest effects on poverty; the model's claims were larger than its results.
    topic_code: "9.5"
  - front: Human rights institutions → NGOs, tribunals, the ICC
    back: |
      Amnesty International (1961), Human Rights Watch (1978), Médecins Sans Frontières (1971); the Helsinki Accords (1975) and watch groups; tribunals for Yugoslavia (1993) and Rwanda (1994); the International Criminal Court (2002), which the United States, China and Russia have not joined. Law without a police force, effective where states consent.
    topic_code: "9.5"
  - front: State responses to calls for reform → reform, co-option, repression
    back: |
      Reform: civil rights acts, apartheid's end, suffrage extensions, anti-discrimination law. Co-option: official women's and youth organisations in one-party states. Repression: Tiananmen (1989), the jailing of dissidents in many states, the murder of journalists. The exam wants an example of each.
    topic_code: "9.5"
  - front: Global popular culture → flows from the West
    back: |
      Hollywood and American television, rock and hip-hop, Coca-Cola, McDonald's, Disney, blue jeans, the NBA; English as the language of business, science, aviation and the internet. Spread by film, satellite television, the internet and American economic and military presence; often called Americanisation.
    topic_code: "9.6"
  - front: Global popular culture → flows from outside the West
    back: |
      Bollywood (India) to Africa, the Middle East and the diaspora; Nollywood (Nigeria) as the second-largest film industry by volume; Japanese anime and video games; K-pop and Korean television; reggae (Jamaica), salsa, Afrobeat, Latin pop; yoga and martial arts; cuisines carried by migrants. Globalization remixes rather than replaces.
    topic_code: "9.6"
  - front: Sport as global culture → football and the Olympics
    back: |
      The football World Cup (from 1930) and the Olympics (revived 1896) became the largest shared events in history, watched by billions; clubs field players from every continent; the Olympics carried Cold War boycotts (1980, 1984), apartheid's exclusion (1964–92) and the rise of China (2008). Sport unites and also displays national rivalry.
    topic_code: "9.6"
  - front: Religion in the global age → growth and spread
    back: |
      Evangelical and Pentecostal Christianity growing fastest in Latin America, Africa and Asia; Islamic revival from the Muslim Brotherhood and Iran's revolution to Southeast Asia and the diaspora; a Polish (1978) and an Argentine (2013) pope; Hindu nationalism in India; secularisation in Europe and East Asia. Religion both carries global culture and reacts against it.
    topic_code: "9.6"
  - front: Reactions against cultural globalization → examples
    back: |
      French film quotas and language laws; the Académie française against English words; Islamist rejection of Western culture; Chinese censorship of the internet (the Great Firewall); movements to protect indigenous languages; slow food against fast food. Fear of homogenisation produced protection, revival and, at the extreme, violence.
    topic_code: "9.6"
  - front: English as a global language → why and with what effects
    back: |
      British empire, then American power, then the internet (most early content in English) made English the language of business, science, aviation and pop culture; about 1.5 billion speakers, most as a second language. Effects: access and inequality, pressure on smaller languages, and new Englishes (Indian, Nigerian, Singaporean) that reshape the language itself.
    topic_code: "9.6"
  - front: Consumer culture → brands and malls across the world
    back: |
      Global brands (Coca-Cola, Nike, Apple, Samsung, Toyota) sold with global advertising; shopping malls from Dubai to Manila; credit cards and e-commerce (Amazon, Alibaba). Effects: shared tastes and aspirations, rising debt, environmental cost, and the fusion of global brands with local products (McDonald's in India without beef).
    topic_code: "9.6"
  - front: Migration and culture → how migrants remake cities
    back: |
      Post-1945 migration from former colonies and poorer countries made London, Paris, Toronto, Sydney and Dubai multicultural; migrants carried food (curry, kebab, tacos), music, festivals and faith, and sent remittances home. Reactions ranged from multicultural policy to anti-immigrant politics.
    topic_code: "9.6"
  - front: Inequality within countries since 1980 → the pattern
    back: |
      In the United States and Britain the top 1% share of income roughly doubled after 1980 while median wages stagnated; China and India grew more unequal as they grew; Latin America, long unequal, became slightly less so after 2000. Globalization, technology, weaker unions and tax policy are the usual causes named; the backlash is week 32.
    topic_code: "9.4"
  - front: Extreme poverty since 1980 → the numbers
    back: |
      People living on under about two dollars a day fell from about 40% of humanity in 1980 to under 10% by 2015, mostly in China, India and Southeast Asia; sub-Saharan Africa's share fell more slowly and its numbers rose with population. The largest reduction of poverty in history, and the strongest argument made for globalization.
    topic_code: "9.4"
  - front: Comparison of economic models after 1980 → four
    back: |
      Anglo-American neoliberalism (market, low tax, weak unions); the European social market (market with welfare state and regulation); the East Asian developmental state (export markets under state guidance); China's party-led market. All used markets and trade; they differed in the state's role and in politics.
    topic_code: "9.4"

quiz:
  description: |
    25 questions · about 35 minutes · topics 9.4, 9.5 and 9.6 (the global economy, calls for reform, and global
    culture), with about a third of the items reviewing the Cold War's institutions and end, the communist and
    new states of unit 8, the Depression of unit 7 and the industrial economy of units 5 and 6. Multiple
    choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Clinton on China and the WTO (9.4)
    - slug: apworld-u09-w31-q01
      type: multiple_choice
      topic_code: "9.4"
      source: "Primary source: William J. Clinton, remarks at the Paul H. Nitze School of Advanced International Studies, Johns Hopkins University, 8 March 2000 (American Presidency Project); U.S. government work"
      points: 1
      stimulus: |
        "By joining the W.T.O., China is not simply agreeing to import more of our products; it is agreeing to import one of democracy's most cherished values: economic freedom."

        — President Bill Clinton, urging Congress to approve permanent normal trade relations with China ahead of its entry into the World Trade Organization, Washington, 8 March 2000
      prompt: |
        The argument in the speech rests on the assumption that
      options:
        - "China would abandon market reforms after joining the WTO"
        - "trade with China would reduce American exports"
        - "economic liberalisation leads to political liberalisation, so that opening China's economy would in time open its politics"
        - "the WTO would impose democracy on China by treaty"
      option_explanations:
        - |
          Clinton expected reform to deepen, not reverse.
        - |
          He argued the opposite: that the United States would sell more to China.
        - |
          Correct. The expectation that markets bring democracy was the liberal faith of the 1990s; China's growth without political change tested it.
        - |
          The WTO's rules concern trade, not political systems, and Clinton did not claim otherwise.
      answer: 2
      explanation: |
        Skill: sourcing (assumptions). Identify the theory behind a policy argument.

    - slug: apworld-u09-w31-q02
      type: multiple_choice
      topic_code: "9.4"
      source: "Primary source: William J. Clinton, remarks at the Paul H. Nitze School of Advanced International Studies, Johns Hopkins University, 8 March 2000 (American Presidency Project); U.S. government work"
      points: 1
      stimulus: |
        "By joining the W.T.O., China is not simply agreeing to import more of our products; it is agreeing to import one of democracy's most cherished values: economic freedom."

        — President Bill Clinton, urging Congress to approve permanent normal trade relations with China ahead of its entry into the World Trade Organization, Washington, 8 March 2000
      prompt: |
        China's entry into the WTO in 2001 had which economic effect over the following decade?
      options:
        - "China became the world's largest manufacturer and exporter, while manufacturing employment in the United States and Europe fell sharply as production moved to Chinese factories"
        - "the United States stopped trading with China"
        - "China returned to Maoist collective farming"
        - "China's exports collapsed"
      option_explanations:
        - |
          Correct. The China shock accelerated deindustrialisation in the West and lifted hundreds of millions of Chinese out of poverty; it also fed the backlash of week 32.
        - |
          Trade grew to make China the largest trading partner of the United States.
        - |
          Deng's reforms had ended the communes in the early 1980s and were not reversed.
        - |
          Chinese exports rose about fivefold in the decade after entry.
      answer: 0
      explanation: |
        Skill: causation (effects). The largest single event in the global economy of the 2000s.

    - slug: apworld-u09-w31-q03
      type: multiple_choice
      topic_code: "8.4"
      source: "Primary source: William J. Clinton, remarks at the Paul H. Nitze School of Advanced International Studies, Johns Hopkins University, 8 March 2000 (American Presidency Project); U.S. government work"
      points: 1
      stimulus: |
        "By joining the W.T.O., China is not simply agreeing to import more of our products; it is agreeing to import one of democracy's most cherished values: economic freedom."

        — President Bill Clinton, urging Congress to approve permanent normal trade relations with China ahead of its entry into the World Trade Organization, Washington, 8 March 2000
      prompt: |
        The China Clinton describes had reached this point by
      options:
        - "joining the Soviet bloc"
        - "continuing Mao's policies of communes and self-reliance"
        - "the reforms begun by Deng Xiaoping in 1978, which dissolved the communes, opened special economic zones to foreign investment and allowed private enterprise while the Communist Party kept political control"
        - "a democratic revolution in 1989"
      option_explanations:
        - |
          The Soviet bloc had dissolved in 1991; China had split from it in 1960.
        - |
          Mao's economy had produced the Great Leap famine and stagnation; Deng reversed it.
        - |
          Correct. Twenty-two years of market reform under one-party rule produced the economy Clinton wanted in the WTO; Tiananmen (1989) had shown the party would not yield power.
        - |
          The 1989 protests were crushed; no democratic revolution occurred.
      answer: 2
      explanation: |
        Spiral review of 8.4 (spread of communism): from Mao's China to Deng's, the background of 9.4.

    # ---- Stimulus set B: growth and poverty table (9.4)
    - slug: apworld-u09-w31-q04
      type: multiple_choice
      topic_code: "9.4"
      source: "Data table compiled for this course from standard published estimates (rounded)"
      points: 1
      stimulus: |
        Income per person and extreme poverty, selected economies, 1980–2015 (approximate; income in constant international dollars)

        | Economy | Income per person 1980 | Income per person 2015 | Share in extreme poverty 1980 | Share in extreme poverty 2015 |
        |---|---|---|---|---|
        | China | 1,000 | 13,000 | about 90% | under 2% |
        | South Korea | 5,000 | 35,000 | under 5% | under 1% |
        | India | 1,100 | 5,500 | about 60% | about 15% |
        | Vietnam | 800 | 5,500 | about 70% | about 3% |
        | Brazil | 9,000 | 14,000 | about 20% | about 4% |
        | Nigeria | 3,000 | 5,500 | about 50% | about 40% |
        | United States | 30,000 | 56,000 | under 1% | under 1% |
        | World | 7,000 | 15,000 | about 40% | under 10% |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "The United States was the poorest economy in 1980."
        - "Brazil grew faster than China."
        - "Poverty rose everywhere between 1980 and 2015."
        - "East and South Asian economies grew fastest and cut extreme poverty most, so that world poverty fell from about 40% to under 10%, while Nigeria's progress was far slower."
      option_explanations:
        - |
          The United States had the highest income in both years.
        - |
          China's income rose thirteenfold, Brazil's by about half.
        - |
          Every row shows poverty falling; the question is how much.
        - |
          Correct. The table is the case for globalization's gains and for their unevenness.
      answer: 3
      explanation: |
        Skill: data analysis. Compare rates of change, not just levels.

    - slug: apworld-u09-w31-q05
      type: multiple_choice
      topic_code: "9.4"
      source: "Data table compiled for this course from standard published estimates (rounded)"
      points: 1
      stimulus: |
        Income per person and extreme poverty, selected economies, 1980–2015 (approximate; income in constant international dollars)

        | Economy | Income per person 1980 | Income per person 2015 | Share in extreme poverty 1980 | Share in extreme poverty 2015 |
        |---|---|---|---|---|
        | China | 1,000 | 13,000 | about 90% | under 2% |
        | South Korea | 5,000 | 35,000 | under 5% | under 1% |
        | India | 1,100 | 5,500 | about 60% | about 15% |
        | Vietnam | 800 | 5,500 | about 70% | about 3% |
        | Brazil | 9,000 | 14,000 | about 20% | about 4% |
        | Nigeria | 3,000 | 5,500 | about 50% | about 40% |
        | United States | 30,000 | 56,000 | under 1% | under 1% |
        | World | 7,000 | 15,000 | about 40% | under 10% |
      prompt: |
        South Korea's figures reflect which development that began before 1980?
      options:
        - "the discovery of oil"
        - "export-led industrialization under a strong state from the 1960s, with high savings, education, land reform and access to American markets, the pattern of the Asian tigers"
        - "Soviet economic aid"
        - "the Green Revolution alone"
      option_explanations:
        - |
          South Korea has almost no oil; it imports energy.
        - |
          Correct. Korea's path from textiles to ships, steel and electronics made it rich within a generation and was the model China followed.
        - |
          South Korea was an American ally; the Soviet Union aided the North.
        - |
          Agriculture played a small part; manufacturing exports drove growth.
      answer: 1
      explanation: |
        Skill: causation. The tiger model behind the table.

    - slug: apworld-u09-w31-q06
      type: multiple_choice
      topic_code: "6.4"
      source: "Data table compiled for this course from standard published estimates (rounded)"
      points: 1
      stimulus: |
        Income per person and extreme poverty, selected economies, 1980–2015 (approximate; income in constant international dollars)

        | Economy | Income per person 1980 | Income per person 2015 | Share in extreme poverty 1980 | Share in extreme poverty 2015 |
        |---|---|---|---|---|
        | China | 1,000 | 13,000 | about 90% | under 2% |
        | South Korea | 5,000 | 35,000 | under 5% | under 1% |
        | India | 1,100 | 5,500 | about 60% | about 15% |
        | Vietnam | 800 | 5,500 | about 70% | about 3% |
        | Brazil | 9,000 | 14,000 | about 20% | about 4% |
        | Nigeria | 3,000 | 5,500 | about 50% | about 40% |
        | United States | 30,000 | 56,000 | under 1% | under 1% |
        | World | 7,000 | 15,000 | about 40% | under 10% |
      prompt: |
        Nigeria's slower progress is often explained by its dependence on a single export, oil, a pattern that continues
      options:
        - "the export-commodity economies created under imperialism in the nineteenth century, when colonies were organised to supply one or two raw materials to industrial countries"
        - "the Soviet planned economy"
        - "the free-trade policies of the WTO"
        - "the self-sufficient village economies of precolonial Africa"
      option_explanations:
        - |
          Correct. Unit 6's monocultures became unit 9's resource curse: oil replaced palm oil and cocoa, but the dependence remained.
        - |
          Nigeria never had a Soviet-style economy.
        - |
          The WTO's rules did not create oil dependence, which predates it.
        - |
          Precolonial economies traded widely but were not organised around one export.
      answer: 0
      explanation: |
        Spiral review of 6.4 (global economic development): the long shadow of the export economy.

    # ---- Stimulus set C: the Universal Declaration of Human Rights (9.5)
    - slug: apworld-u09-w31-q07
      type: multiple_choice
      topic_code: "9.5"
      source: "Primary source: Universal Declaration of Human Rights (1948), Article 1, a short phrase quoted; the rest described in our own words"
      points: 1
      stimulus: |
        Source description: The Universal Declaration of Human Rights, adopted by the United Nations General Assembly on 10 December 1948 with no votes against and eight abstentions (the Soviet bloc, Saudi Arabia and South Africa), opens by declaring that all human beings are "born free and equal in dignity and rights". Its thirty articles go on to list civil and political rights (life, liberty, freedom from slavery and torture, fair trial, free expression, free elections) and economic and social rights (work, fair pay, rest, education, an adequate standard of living). The drafting committee was chaired by Eleanor Roosevelt and included members from China, Lebanon, France, Chile and other states.
      prompt: |
        The declaration is best understood as
      options:
        - "a declaration of war on the Soviet Union"
        - "a binding treaty enforced by a world court"
        - "a statement of principles with no legal force that nonetheless became the common language of rights movements and the basis of later binding covenants"
        - "a document applying only to Europeans"
      option_explanations:
        - |
          The Soviet bloc abstained but did not vote against; the declaration was adopted in a spirit of consensus.
        - |
          It bound no one; the covenants of 1966 and later treaties created obligations.
        - |
          Correct. From the civil rights movement to Helsinki dissidents to anti-apartheid campaigners, every movement after 1948 claimed its words.
        - |
          Its drafters came from several continents and it claims universality.
      answer: 2
      explanation: |
        Skill: sourcing (nature of the document). Know what the declaration is and is not.

    - slug: apworld-u09-w31-q08
      type: multiple_choice
      topic_code: "9.5"
      source: "Primary source: Universal Declaration of Human Rights (1948), Article 1, a short phrase quoted; the rest described in our own words"
      points: 1
      stimulus: |
        Source description: The Universal Declaration of Human Rights, adopted by the United Nations General Assembly on 10 December 1948 with no votes against and eight abstentions (the Soviet bloc, Saudi Arabia and South Africa), opens by declaring that all human beings are "born free and equal in dignity and rights". Its thirty articles go on to list civil and political rights (life, liberty, freedom from slavery and torture, fair trial, free expression, free elections) and economic and social rights (work, fair pay, rest, education, an adequate standard of living). The drafting committee was chaired by Eleanor Roosevelt and included members from China, Lebanon, France, Chile and other states.
      prompt: |
        The abstention of South Africa is best explained by
      options:
        - "its opposition to economic rights"
        - "the apartheid system it had begun to construct in 1948, which the declaration's equality clauses condemned"
        - "its alliance with the Soviet Union"
        - "its absence from the United Nations"
      option_explanations:
        - |
          South Africa's objection was to racial equality, not to economic rights.
        - |
          Correct. The National Party's victory of 1948 and the declaration were months apart; the anti-apartheid movement used the declaration against the state for the next forty-six years.
        - |
          South Africa was anti-communist and Western-aligned.
        - |
          South Africa was a founding UN member and present for the vote.
      answer: 1
      explanation: |
        Skill: sourcing (context). Who abstained and why tells you what the declaration threatened.

    - slug: apworld-u09-w31-q09
      type: multiple_choice
      topic_code: "7.8"
      source: "Primary source: Universal Declaration of Human Rights (1948), Article 1, a short phrase quoted; the rest described in our own words"
      points: 1
      stimulus: |
        Source description: The Universal Declaration of Human Rights, adopted by the United Nations General Assembly on 10 December 1948 with no votes against and eight abstentions (the Soviet bloc, Saudi Arabia and South Africa), opens by declaring that all human beings are "born free and equal in dignity and rights". Its thirty articles go on to list civil and political rights (life, liberty, freedom from slavery and torture, fair trial, free expression, free elections) and economic and social rights (work, fair pay, rest, education, an adequate standard of living). The drafting committee was chaired by Eleanor Roosevelt and included members from China, Lebanon, France, Chile and other states.
      prompt: |
        The declaration's adoption in 1948, with the Genocide Convention the day before, was most directly a response to
      options:
        - "the Russian Revolution"
        - "the partition of India"
        - "the Great Depression"
        - "the Holocaust and the other atrocities of the Second World War, which the Nuremberg trials had just exposed and which convinced the UN's founders that rights needed international statement"
      option_explanations:
        - |
          The revolution of 1917 was three decades earlier and the Soviet bloc abstained.
        - |
          Partition's violence (1947) was contemporary but not the declaration's cause.
        - |
          The Depression shaped the economic articles but was not the occasion.
        - |
          Correct. The crimes against humanity tried at Nuremberg in 1945–46 are the declaration's immediate background.
      answer: 3
      explanation: |
        Spiral review of 7.8 (mass atrocities): from Nuremberg to the Universal Declaration.

    # ---- Stand-alone multiple choice
    - slug: apworld-u09-w31-q10
      type: multiple_choice
      topic_code: "9.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Thatcher in Britain and Reagan in the United States responded to the stagnation of the 1970s by
