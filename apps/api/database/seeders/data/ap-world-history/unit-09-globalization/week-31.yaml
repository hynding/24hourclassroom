        (b) 1 pt: a technology explained as enabling production or distribution (digital video, satellite, internet, streaming, air travel and migration).

        (c) 1 pt: an explanation that uses the table to qualify Americanisation (volume versus revenue; regional flows; non-Western producers reaching the West).

