        - |
          The single market (1993) coincided with but did not create the internet.
      answer: 2
      explanation: |
        Spiral review of 8.3 (effects of the Cold War): the internet as a Cold War invention.

    # ---- Stimulus set C: disease and life expectancy table (9.2)
    - slug: apworld-u09-w30-q07
      type: multiple_choice
      topic_code: "9.2"
      source: "Data table compiled for this course from standard published estimates (rounded)"
      points: 1
      stimulus: |
        Disease and life expectancy, 1900–2020 (approximate)

        | Indicator | 1900 | 1950 | 1980 | 2020 |
        |---|---|---|---|---|
        | World life expectancy at birth (years) | 32 | 48 | 62 | 72 |
        | Smallpox deaths per year (millions) | about 5 | about 2 | 0 (eradicated) | 0 |
        | Malaria deaths per year (millions) | over 2 | over 2 | about 1 | about 0.6 |
        | HIV/AIDS deaths per year (millions) | 0 | 0 | 0 | about 0.7 (peak 2 in 2004) |
        | Leading cause of death worldwide | infectious disease | infectious disease | mixed | heart disease and stroke |

        Note: the 1918–19 influenza pandemic killed about 50 million people, more than the First World War.
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "Malaria deaths have risen since 1900."
        - "Life expectancy fell after 1980."
        - "Infectious disease has been eliminated."
        - "Life expectancy more than doubled as smallpox was eradicated and malaria reduced, while new epidemics appeared and chronic diseases became the leading causes of death."
      option_explanations:
        - |
          Malaria deaths fell from over 2 million to about 0.6 million.
        - |
          Life expectancy rose from 62 to 72 after 1980.
        - |
          Malaria, tuberculosis and HIV still kill millions a year between them.
        - |
          Correct. The table shows the two shifts of 9.2: victories over old killers and the rise of diseases of long life.
      answer: 3
      explanation: |
        Skill: data analysis. Read every row for change over time.

