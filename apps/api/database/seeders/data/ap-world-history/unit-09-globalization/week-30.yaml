        |---|---|---|---|---|
        | North America | 45% | 90% | 40 | 105 |
        | Europe | 20% | 85% | 50 | 120 |
        | East Asia | 10% | 70% | 30 | 115 |
        | Latin America | 4% | 70% | 12 | 105 |
        | South Asia | under 1% | 40% | under 1 | 85 |
        | Sub-Saharan Africa | under 1% | 30% | 2 | 85 |
      prompt: |
        The growth of mobile subscriptions in sub-Saharan Africa from 2 to 85 per hundred people is best explained by
      options:
        - "leapfrogging: mobile networks were far cheaper to build than wired ones, so regions that had never had telephones went straight to mobile, with services such as mobile money following"
        - "a decline in population"
        - "the Marshall Plan"
        - "the construction of fixed-line telephone networks across the continent"
      option_explanations:
        - |
          Correct. Kenya's M-Pesa (2007) brought banking to people without banks; farmers got market prices by text.
        - |
          Africa's population grew faster than any other region's.
        - |
          The Marshall Plan rebuilt Europe in 1948–52.
        - |
          Fixed lines were never built at scale; that is why mobile mattered so much.
      answer: 0
      explanation: |
        Skill: causation. Technology adoption depends on cost and existing infrastructure.

