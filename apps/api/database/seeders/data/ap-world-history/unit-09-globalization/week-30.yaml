        | Malaria deaths per year (millions) | over 2 | over 2 | about 1 | about 0.6 |
        | HIV/AIDS deaths per year (millions) | 0 | 0 | 0 | about 0.7 (peak 2 in 2004) |
        | Leading cause of death worldwide | infectious disease | infectious disease | mixed | heart disease and stroke |

        Note: the 1918–19 influenza pandemic killed about 50 million people, more than the First World War.
      prompt: |
        The pandemic in the note spread so widely mainly because
      options:
        - "it was deliberately spread as a weapon"
        - "the First World War moved millions of soldiers by troopship and railway across continents and crowded them in camps and trenches, and demobilisation carried the virus home"
        - "air travel was already common"
        - "the League of Nations ordered quarantines lifted"
      option_explanations:
        - |
          No belligerent used influenza as a weapon; it struck all sides.
        - |
          Correct. Total war's mobilisation of people was the pandemic's transport; India, cut by troop movements and famine, lost perhaps 12 million.
        - |
          Commercial air travel did not exist in 1918.
        - |
          The League was founded in 1920, after the pandemic.
      answer: 1
      explanation: |
        Spiral review of 7.3 (conducting the First World War): the war as the vector of the century's worst pandemic.

    # ---- Stand-alone multiple choice
    - slug: apworld-u09-w30-q10
      type: multiple_choice
      topic_code: "9.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The shipping container, introduced in 1956, contributed to globalization by
      options:
        - "cutting the cost and time of moving goods by sea so sharply that manufacturing could be spread across several countries in a single supply chain"
        - "ending all international trade"
        - "replacing railways with canals"
        - "making air freight obsolete"
      option_explanations:
        - |
          Correct. Standard boxes, purpose-built ships and cranes cut loading from days to hours and freight costs by about 90%.
        - |
          World trade grew about twentyfold in the half-century after containerisation.
        - |
          Containers move by ship, rail and truck together; that intermodality is the point.
        - |
          Air freight grew alongside containers for high-value goods.
      answer: 0
      explanation: |
        Skill: causation. The least glamorous technology of the global economy may be the most important.

    - slug: apworld-u09-w30-q11
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The eradication of smallpox, declared in 1980, was organised by the World Health Organization, which was
      options:
        - "a private charity founded by pharmaceutical companies"
        - "a specialised agency of the United Nations founded in 1948, part of the postwar order of international institutions"
        - "a department of the Soviet health ministry"
        - "an agency of the League of Nations that survived its dissolution"
      option_explanations:
        - |
          The WHO is an intergovernmental body funded by member states.
        - |
