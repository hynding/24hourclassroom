    # ---- Short answers
    - slug: apworld-u09-w30-q23
      type: short_answer
      topic_code: "9.3"
      source: "Described source: the Earthrise photograph, NASA, 24 December 1968, described in our own words; U.S. government work"
      points: 3
      stimulus: |
        Source description: A colour photograph taken by an astronaut on the Apollo 8 mission as it orbited the Moon on 24 December 1968. The grey, cratered lunar surface fills the bottom of the frame. Above it, against black space, the Earth rises: a blue and white sphere, half in shadow, with swirls of cloud over ocean and a brown patch of land. No borders, cities or people are visible. The photograph was published worldwide within days and became known as Earthrise.
      prompt: |
        Using the source description, answer (a), (b) and (c).

        (a) Describe what the photograph shows and how it presents the Earth.
        (b) Explain ONE way the photograph reflects the technology of its time.
        (c) Explain ONE way the photograph is connected to the environmental movement that grew after 1968.
      answer: |
        (a) The Earth seen from lunar orbit as a single small blue sphere above a dead grey surface, with no human divisions visible: the planet presented as one fragile whole in an empty black space.
        (b) It was made possible by the Cold War space race: Apollo 8, the first crewed flight around the Moon, was a step toward Kennedy's goal of landing before 1970 and was funded as a competition with the Soviet Union; the colour photograph itself and its instant worldwide circulation depended on the era's film, broadcasting and satellite technology.
        (c) The image of a borderless, finite planet became the emblem of the environmental movement: it appeared at the first Earth Day (1970), on the cover of the Whole Earth Catalog, and in arguments for the Stockholm conference (1972) that pollution and resources were planetary problems; the technology that reached the Moon showed how small and shared the Earth was.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate description drawn from the source (single sphere, no borders, grey Moon, black space) with an inference about presentation (fragility, unity).

        (b) 1 pt: a link to the space race, Apollo, Cold War competition or the media technology that spread the image.

        (c) 1 pt: a specific connection to environmentalism explained: Earth Day; the idea of a finite planet; Stockholm 1972; the shift from local pollution to planetary concern.

    - slug: apworld-u09-w30-q24
      type: short_answer
      topic_code: "9.2"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE disease that medical advances have eliminated or greatly reduced since 1900.
        (b) Explain ONE reason diseases of poverty such as malaria and tuberculosis persist despite available treatments.
        (c) Explain ONE way globalization has affected the spread of disease since 1900.
      answer: |
        (a) Smallpox (eradicated 1980); or polio (reduced from hundreds of thousands of cases a year to a few dozen); or measles, diphtheria or tetanus (vaccines); or tuberculosis in rich countries (antibiotics).
        (b) They persist where clean water, housing, nutrition and health systems are lacking; prevention and treatment exist but require money, trained staff and functioning states that poor countries and conflict zones lack; drug and insecticide resistance grows; donors and companies invest less in diseases of the poor.
        (c) Jet travel and mass migration spread new viruses across continents within days (SARS 2003, COVID-19 2020); troop movements spread the 1918 influenza; trade and travel spread HIV from the 1980s; the same connections carry vaccines, drugs, money and WHO surveillance, so that smallpox could be eradicated and COVID vaccines developed in a year, though distributed unequally.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a correct disease and the advance that reduced it.

        (b) 1 pt: a reason explained: poverty and weak health systems; resistance; investment priorities; conflict.

        (c) 1 pt: a specific effect of globalization on disease explained, in either direction (faster spread or faster response).

    # ---- Long answer (LEQ)
    - slug: apworld-u09-w30-q25
      type: long_answer
      topic_code: "9.3"
      source: "general knowledge"
      points: 6
      prompt: |
        Since 1900 the human population has grown fivefold and its use of energy and land far more.

        Evaluate the extent to which technological change since 1900 has been the primary cause of environmental change.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Technology was the enabling cause of environmental change since 1900, since fossil-fuel engines, industrial agriculture and chemical industry made the transformation physically possible, but population growth, rising consumption and the political choices of states and corporations determined its scale; technology was necessary but not sufficient, and the same technologies now offer the means of repair.

        Context: the industrial revolution's coal economy; the demographic transition; the global economy of unit 6.

        Body 1 (technology as cause): oil, the car and the jet; electricity from coal; fertiliser and pesticides; chainsaws and bulldozers in the Amazon; industrial fishing fleets; CFCs; nuclear accidents; CO2 from 280 to 420 ppm.

        Body 2 (other causes): population from 1.6 to 8 billion; consumption per person rising faster still; state development policies (Soviet and Chinese industrialization, Brazilian frontier settlement); corporate interests (Bhopal, oil); poverty driving deforestation and overgrazing in the Sahel.

        Body 3 (technology as remedy): the Montreal Protocol's substitutes; wind and solar; the Green Revolution feeding more people on less new land; monitoring by satellite; vaccines and sanitation reducing disease.

        Complexity: comparison of rich and poor countries (who emitted, who suffers); continuity with the industrial age versus the acceleration after 1950; the debate over growth and conservation (Brundtland); the Anthropocene as a claim about human agency, not technology alone.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim about the extent of technology's causal role with a line of reasoning. Zero for "technology caused many environmental changes" without weighing other causes.

        Contextualization (0–1): the industrial revolution; population growth; the global economy before 1900.

        Evidence (0–2): 1 pt for at least two specific examples (CO2 figures; population figures; the Amazon; Bhopal or Chernobyl; CFCs and Montreal; Kyoto or Paris; the Green Revolution; renewables). 2 pts for using them to support the weighting.

        Analysis and reasoning (0–2): 1 pt for causation structuring the essay (enabling versus driving causes). 1 pt for complexity: technology as remedy; rich-poor comparison; the acceleration after 1950; the debate between development and conservation.
