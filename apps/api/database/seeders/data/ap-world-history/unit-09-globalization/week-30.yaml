week: 30
unit: 9
title: "Technology, Disease, and the Environment in the Global Age"
topics: ["9.1", "9.2", "9.3"]
guide: guides/week-30.md
guide_description: |
  The technologies that shrank the world after 1945 (computing, the internet, mobile phones, satellites, jets,
  containers, energy and the Green Revolution), the diseases beaten, persisting and new (smallpox eradicated,
  malaria and tuberculosis persisting, the 1918 influenza, HIV/AIDS, Ebola and COVID-19, the diseases of long
  life), and environmental change since 1900: population, fossil fuels and climate, deforestation and pollution,
  and the debates and responses from Montreal to Paris and the Green Belt Movement.
flashcards_description: |
  30 cards on the communication, transport, energy and food technologies of the global age, the history of
  disease and medicine since 1900, and the causes, effects and debates of environmental change.

flashcards:
  - front: Computing revolution → four inventions and dates
    back: |
      The transistor (1947), the integrated circuit (1958), the microprocessor (1971) and the personal computer (late 1970s–80s). Each made computing smaller and cheaper; by the 2000s a phone held more computing power than the Apollo programme.
    topic_code: "9.1"
  - front: Internet → from ARPANET to the smartphone
    back: |
      ARPANET, a U.S. Defense Department research network (1969); TCP/IP (1983); the World Wide Web invented at CERN (1991); commercial opening in the mid-1990s; search engines and social media (2000s); the smartphone (2007). About 5 billion users by the 2020s. A Cold War military project become the world's commons.
    topic_code: "9.1"
  - front: Mobile telephony in Africa and Asia → leapfrogging
    back: |
      Countries that never built fixed-line networks jumped straight to mobile: sub-Saharan Africa went from almost no telephones in 1995 to hundreds of millions of subscriptions by 2015. Mobile money (M-Pesa, Kenya, 2007) brought banking to people without banks; farmers and traders got prices in real time.
    topic_code: "9.1"
  - front: Container shipping (1956) → what it changed
    back: |
      Malcom McLean's standard steel box, with purpose-built ships, cranes and ports, cut the cost of moving goods by sea by about 90% and loading time from days to hours. Global supply chains became possible: parts and products crossing several countries before sale. The quiet technology behind globalization.
    topic_code: "9.1"
  - front: Jet aircraft and mass travel → dates and scale
    back: |
      The Boeing 707 (1958) and the 747 (1970) made intercontinental flight routine; about 4.5 billion passenger journeys a year by 2019. Effects: tourism as a leading industry, migration and diaspora ties, business across continents, and the spread of disease (SARS, COVID-19) at jet speed.
    topic_code: "9.1"
  - front: Satellites → what they do for the global economy
    back: |
      Communication satellites (Telstar, 1962) carry television, telephone and data across oceans; weather satellites forecast storms; GPS (1990s, from U.S. military origins) guides ships, aircraft, cars and phones. The space race's lasting civilian dividend.
    topic_code: "9.1"
  - front: Energy since 1900 → the sequence of fuels
    back: |
      Coal dominant to the 1950s; oil leading thereafter (OPEC embargo of 1973 shows its weight); natural gas rising; nuclear power from 1954 (Chernobyl 1986, Fukushima 2011 set it back); hydro throughout; wind and solar growing fast after 2010 as costs fell. Fossil fuels still supply about four-fifths of energy.
    topic_code: "9.1"
  - front: Green Revolution and GM crops → the food technologies
    back: |
      High-yield wheat and rice with fertiliser and irrigation (1960s) doubled grain output in Asia and Latin America and ended famine in South Asia. Genetically modified crops (from 1996: soy, maize, cotton) raised yields and cut pesticide use in the Americas and Asia, and were widely banned in Europe. Costs: chemicals, water, debt, loss of smallholders.
    topic_code: "9.1"
  - front: Kennedy's Rice University speech (1962) → the faith in technology
    back: |
      Kennedy said the United States chose to go to the Moon in that decade not because it was easy but because it was hard. Apollo 11 landed in July 1969. The speech is the voice of the mid-century confidence that technology, state funding and competition could solve any problem.
    topic_code: "9.1"
  - front: Life expectancy since 1900 → the numbers and the causes
    back: |
      World average about 32 years in 1900, about 48 in 1950, over 70 by 2020. Causes: clean water and sanitation, vaccines, antibiotics, better nutrition, the WHO (1948) and national health systems, falling child mortality. Gap between richest and poorest countries still about thirty years.
    topic_code: "9.2"
  - front: Antibiotics and vaccines → milestones
    back: |
      Penicillin discovered (1928), mass-produced in the Second World War; streptomycin for tuberculosis (1943). Vaccines: diphtheria and tetanus (1920s–40s), polio (Salk 1955, Sabin 1961), measles (1963); the WHO's Expanded Programme on Immunization (1974). Antibiotic resistance is the new problem.
    topic_code: "9.2"
  - front: Eradication of smallpox → how and when
    back: |
      Smallpox killed about 300 million people in the twentieth century. The WHO's intensified campaign (1967) used vaccination and ring containment around every outbreak; last natural case in Somalia (1977); declared eradicated (1980). The only human disease ever eliminated; polio has been reduced to a handful of cases.
    topic_code: "9.2"
  - front: Diseases of poverty → which persist and why
    back: |
      Malaria (about 600,000 deaths a year, mostly African children), tuberculosis (over a million a year), cholera (Haiti 2010, Yemen 2017), diarrhoeal disease from dirty water. They persist where sanitation, housing and health systems are poor; the tools exist, the money and the states often do not.
    topic_code: "9.2"
  - front: Influenza pandemic of 1918–19 → scale and spread
    back: |
      About 50 million dead worldwide, more than the First World War, with a third of humanity infected; it killed young adults unusually. Spread by troopships, railways and demobilisation; India lost perhaps 12 million. The precedent for every later pandemic.
    topic_code: "9.2"
  - front: HIV/AIDS → sequence and geography
    back: |
      Identified 1981; spread by sexual contact, blood and needles; about 40 million dead by the 2020s. Southern Africa hit hardest, with life expectancy falling by a decade in the 1990s. Antiretroviral therapy (1996) made it manageable; generic drugs and PEPFAR (2003) brought treatment to Africa. Stigma and inequality shaped who died.
    topic_code: "9.2"
  - front: Ebola and COVID-19 → what the new epidemics showed
    back: |
      Ebola (West Africa 2014–16, about 11,000 dead) showed weak health systems and slow international response. COVID-19 (from late 2019; millions dead, economies locked down) showed jet-speed spread, vaccines developed within a year, and unequal distribution between rich and poor countries. Both linked disease to globalization.
    topic_code: "9.2"
  - front: Diseases of affluence and long life → the shift
    back: |
      As people live longer and eat more, heart disease, stroke, diabetes, cancers and dementia become the leading causes of death, first in rich countries and now everywhere. Obesity rising worldwide; tobacco falling in the West, rising in poorer countries. Health inequality now runs between infections for the poor and chronic disease for the rich.
    topic_code: "9.2"
  - front: World population → the numbers 1900–2022
    back: |
      1.6 billion (1900), 2.5 billion (1950), 4 billion (1975), 6 billion (1999), 8 billion (2022). Growth fastest in the 1960s; fertility now falling almost everywhere, fastest in East Asia and Europe, slowest in sub-Saharan Africa. More people consuming more is the first cause of environmental change.
    topic_code: "9.3"
  - front: Climate change → the numbers
    back: |
      Carbon dioxide about 280 parts per million before industry, 315 in 1958, over 420 by the 2020s; warming about 1.2 °C above pre-industrial levels; sea level up about 20 cm since 1900. Causes: burning coal, oil and gas, deforestation, cement, methane from livestock. Effects: heatwaves, floods, droughts, melting ice, stronger storms.
    topic_code: "9.3"
  - front: Deforestation and desertification → where and why
    back: |
      Tropical forests cleared for cattle, soy, palm oil, timber and smallholdings: the Amazon, Indonesia and Malaysia, the Congo basin. Desertification in the Sahel and northern China from overgrazing, drought and population pressure. Effects: carbon release, species loss, soil erosion, displacement of forest peoples.
    topic_code: "9.3"
  - front: Industrial disasters → Bhopal (1984) and Chernobyl (1986)
    back: |
      Bhopal: a gas leak from a Union Carbide pesticide plant in India killed thousands and injured hundreds of thousands; compensation was small and late. Chernobyl: a Soviet reactor explosion spread radiation across Europe and was concealed for days. Both showed that the risks of industrial technology fall hardest on the poor and that states hide them.
    topic_code: "9.3"
  - front: Montreal Protocol (1987) → why it worked
    back: |
      Phased out the chlorofluorocarbons destroying the ozone layer. It worked because the science was clear, substitutes existed, producers were few, and rich countries paid for poor countries' transition. The ozone layer is recovering. The model that climate negotiators have tried to copy.
    topic_code: "9.3"
  - front: Kyoto (1997) and Paris (2015) → the two climate agreements compared
    back: |
      Kyoto: binding emission cuts for rich countries only; the United States never ratified; developing countries exempt; emissions kept rising. Paris: every country pledges its own cuts, with a goal of well below 2 °C and efforts toward 1.5 °C; no enforcement; the United States withdrew (2017), rejoined (2021), withdrew again (2025). Progress real but short of the target.
    topic_code: "9.3"
  - front: Sustainable development → the Brundtland definition and the debate
    back: |
      The Brundtland report (1987): development that meets present needs without compromising future generations. The debate: whether poor countries should limit emissions the rich used to industrialise; whether growth and conservation conflict; who pays for adaptation in countries that emitted least (Bangladesh, Pacific islands, the Sahel).
    topic_code: "9.3"
  - front: Green Belt Movement (Kenya, 1977) → what it did
    back: |
      Wangari Maathai organised women's groups to plant trees against deforestation and soil loss; over 50 million planted; the movement also fought land grabs and the Moi dictatorship. Maathai won the Nobel Peace Prize in 2004. Grassroots environmentalism linked to women's rights and democracy.
    topic_code: "9.3"
  - front: Environmental NGOs and activists → Greenpeace, Mendes, Earth Day
    back: |
      Greenpeace (1971) against nuclear testing and whaling; Chico Mendes organising Amazon rubber tappers until his murder (1988); the first Earth Day (1970) and the UN conferences of Stockholm (1972) and Rio (1992). Non-state actors pressing states and corporations.
    topic_code: "9.3"
  - front: Why technology spread unevenly → the digital divide
    back: |
      Internet and mobile access depend on electricity, income, literacy and infrastructure; by 2020 about 90% of Europeans were online against about 40% of Africans, with gaps between cities and villages, rich and poor, men and women. Technology connects the world and also measures its inequality.
    topic_code: "9.1"
  - front: Globalization and disease → the link
    back: |
      Trade, migration and air travel spread cholera (1800s), influenza (1918), HIV (1980s), SARS (2003) and COVID-19 (2020) faster each time; the same connections spread vaccines, drugs and the WHO's surveillance. Disease is the clearest proof that the world is one system.
    topic_code: "9.2"
  - front: Water, air and fisheries → three environmental problems and their responses
    back: |
      Rivers and lakes poisoned by industry (the Cuyahoga fire, 1969; the Ganges; Lake Erie) answered by clean-water laws; urban smog (London 1952, Beijing, Delhi) answered by clean-air laws and cleaner fuels in rich countries; fisheries collapsed (Newfoundland cod, 1992) answered by quotas and reserves with mixed results.
    topic_code: "9.3"
  - front: The Anthropocene → the idea
    back: |
      A proposed name for the present geological era, in which human activity (fossil fuels, farming, nuclear fallout, plastics) dominates Earth's systems. Whether or not geologists adopt it, the term sums up unit 9's environmental argument: the scale of human impact since 1900 is unprecedented.
    topic_code: "9.3"

quiz:
  description: |
    25 questions · about 35 minutes · topics 9.1, 9.2 and 9.3 (technology and exchange, disease, and the
    environment in the global age), with about a third of the items reviewing the Cold War's technologies and
    institutions from unit 8, the industrial age of unit 5 and the First World War of unit 7. Multiple choice,
    select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Kennedy at Rice University (9.1)
    - slug: apworld-u09-w30-q01
      type: multiple_choice
      topic_code: "9.1"
      source: "Primary source: John F. Kennedy, address at Rice University, 12 September 1962 (U.S. National Archives); U.S. government work"
      points: 1
      stimulus: |
        "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard".

        — President John F. Kennedy, speaking at Rice University, Houston, 12 September 1962, five years after Sputnik and a year after Yuri Gagarin's orbital flight
      prompt: |
        The programme Kennedy announces was undertaken primarily
      options:
        - "at the request of the United Nations"
        - "to establish a permanent colony"
        - "as a commercial venture by private companies"
        - "as a Cold War competition for prestige and missile technology with the Soviet Union, which had led in space since Sputnik"
      option_explanations:
        - |
          The United Nations had no role in Apollo; it was a national programme in a two-power race.
        - |
          The goal was landing and return, not settlement.
        - |
          Apollo was a federal programme costing about 25 billion dollars; private firms were contractors.
        - |
          Correct. The space race was the Cold War by other means; the Moon landing of July 1969 answered Sputnik and Gagarin.
      answer: 3
      explanation: |
        Skill: sourcing (context). Technology in the global age came largely from state competition.

    - slug: apworld-u09-w30-q02
      type: multiple_choice
      topic_code: "9.1"
      source: "Primary source: John F. Kennedy, address at Rice University, 12 September 1962 (U.S. National Archives); U.S. government work"
      points: 1
      stimulus: |
        "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard".

        — President John F. Kennedy, speaking at Rice University, Houston, 12 September 1962, five years after Sputnik and a year after Yuri Gagarin's orbital flight
      prompt: |
        Which lasting technology of the global economy grew most directly out of the programme Kennedy describes and its rivals?
      options:
        - "the container ship"
        - "the steam engine"
        - "communication, weather and navigation satellites, including GPS, on which global telephony, broadcasting, shipping and smartphones depend"
        - "the printing press"
      option_explanations:
        - |
          Containers came from the shipping industry in 1956, independent of space.
        - |
          The steam engine belongs to the first industrial revolution.
        - |
          Correct. The rockets built for the race put into orbit the satellites that make the world one market.
        - |
          Printing dates from the 1450s and owes nothing to rockets.
      answer: 2
      explanation: |
        Skill: causation (effects). The civilian dividend of the space race.

    - slug: apworld-u09-w30-q03
      type: multiple_choice
      topic_code: "8.3"
      source: "Primary source: John F. Kennedy, address at Rice University, 12 September 1962 (U.S. National Archives); U.S. government work"
      points: 1
      stimulus: |
        "We choose to go to the Moon in this decade and do the other things, not because they are easy, but because they are hard".

        — President John F. Kennedy, speaking at Rice University, Houston, 12 September 1962, five years after Sputnik and a year after Yuri Gagarin's orbital flight
      prompt: |
        The speech illustrates which effect of the Cold War?
      options:
        - "the end of government funding for science"
        - "the mobilisation of state money, universities and industry for scientific and technological competition, from the space race to computing and the internet"
        - "the Non-Aligned Movement's rejection of technology"
        - "the dissolution of NASA"
      option_explanations:
        - |
          Federal science spending multiplied after Sputnik.
        - |
          Correct. NASA, the Defense Department's ARPANET and the microchip industry are all children of the Cold War state.
        - |
          Non-aligned states competed for the same technologies through aid from both blocs.
        - |
          NASA was founded in 1958 and still exists.
      answer: 1
      explanation: |
        Spiral review of 8.3 (effects of the Cold War): the arms and space races as engines of unit 9's technology.

    # ---- Stimulus set B: connectivity table (9.1)
    - slug: apworld-u09-w30-q04
      type: multiple_choice
      topic_code: "9.1"
      source: "Data table compiled for this course from standard published estimates (rounded)"
      points: 1
      stimulus: |
        Internet users and mobile telephone subscriptions, selected regions (approximate share of population)

        | Region | Internet users 2000 | Internet users 2020 | Mobile subscriptions per 100 people, 2000 | Mobile subscriptions per 100 people, 2020 |
        |---|---|---|---|---|
        | North America | 45% | 90% | 40 | 105 |
        | Europe | 20% | 85% | 50 | 120 |
        | East Asia | 10% | 70% | 30 | 115 |
        | Latin America | 4% | 70% | 12 | 105 |
        | South Asia | under 1% | 40% | under 1 | 85 |
        | Sub-Saharan Africa | under 1% | 30% | 2 | 85 |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "Connectivity spread to every region between 2000 and 2020, with mobile telephony reaching near-universal levels even where internet use remained lower, while a gap between rich and poor regions persisted."
        - "Sub-Saharan Africa had more internet users than Europe in 2020."
        - "Mobile telephony declined in North America."
        - "South Asia was fully connected by 2000."
      option_explanations:
        - |
          Correct. Mobile phones leapfrogged fixed lines everywhere; internet use followed more slowly and unevenly.
        - |
          Africa's 30% was the lowest share in the table.
        - |
          North America's subscriptions rose from 40 to 105 per hundred.
        - |
          South Asia had under 1% internet use and almost no mobile phones in 2000.
      answer: 0
      explanation: |
        Skill: data analysis. Read both measures and the gap between regions.

