        | HIV/AIDS deaths per year (millions) | 0 | 0 | 0 | about 0.7 (peak 2 in 2004) |
        | Leading cause of death worldwide | infectious disease | infectious disease | mixed | heart disease and stroke |

        Note: the 1918–19 influenza pandemic killed about 50 million people, more than the First World War.
      prompt: |
        The change in the last row is best explained by
      options:
        - "a decline in medical knowledge"
        - "the spread of smoking in 1900"
        - "the eradication of all disease"
        - "longer lives and richer diets, so that more people survive infections to die of heart disease, stroke, cancer and diabetes, first in rich countries and then everywhere"
      option_explanations:
        - |
          Medical knowledge advanced; the shift is a consequence of its success.
        - |
          Smoking contributed to heart disease and cancer in the twentieth century, but the row records a change in what people die of, driven by survival.
        - |
          Infectious disease persists; it is simply no longer the leading cause.
        - |
          Correct. The epidemiological transition: diseases of poverty give way to diseases of affluence and age.
      answer: 3
      explanation: |
        Skill: causation. What people die of changes with how long they live.

