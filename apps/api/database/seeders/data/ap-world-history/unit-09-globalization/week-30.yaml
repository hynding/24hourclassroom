      type: multiple_choice
      topic_code: "8.3"
      source: "Data table compiled for this course from standard published estimates (rounded)"
      points: 1
      stimulus: |
        Internet users and mobile telephone subscriptions, selected regions (approximate share of population)

        | Region | Internet users 2000 | Internet users 2020 | Mobile subscriptions per 100 people, 2000 | Mobile subscriptions per 100 people, 2020 |
        |---|---|---|---|---|
        | North America | 45% | 90% | 40 | 105 |
        | Europe | 20% | 85% | 50 | 120 |
        | East Asia | 10% | 70% | 30 | 115 |
        | Latin America | 4% | 70% | 12 | 105 |
        | South Asia | under 1% | 40% | under 1 | 85 |
        | Sub-Saharan Africa | under 1% | 30% | 2 | 85 |
      prompt: |
        The internet whose spread the table records had originated in
      options:
        - "a United Nations development programme"
        - "a private telephone company's research"
        - "ARPANET, a U.S. Defense Department research network of 1969 built during the Cold War, opened to the public and commerce in the 1990s"
        - "the European Union's single market"
      option_explanations:
        - |
          The UN played no part in the internet's creation.
        - |
          The network was federally funded; the World Wide Web came from CERN, a public laboratory.
        - |
