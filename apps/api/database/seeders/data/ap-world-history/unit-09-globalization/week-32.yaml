week: 32
unit: 9
title: "Resistance to Globalization, Global Institutions, and Causation"
topics: ["9.7", "9.8", "9.9"]
guide: guides/week-32.md
guide_description: |
  The responses to globalization: the anti-globalization left (Seattle 1999, the World Social Forum, Occupy),
  economic nationalism and populism (Brexit, tariff wars, anti-immigrant parties), religious fundamentalism,
  and transnational terrorism (al-Qaeda, 11 September 2001, ISIS) with the American response. Then the
  institutions of the global age: the United Nations and its agencies, peacekeeping's successes and failures,
  the IMF, World Bank and WTO, regional bodies, NGOs, the Millennium and Sustainable Development Goals. The
  week closes with the unit's causation review: what drove globalization after 1900, what it produced, and
  whether it is a continuation of older patterns or a new era.
flashcards_description: |
  30 cards on the forms and causes of resistance to globalization, the terrorist movements and the war on
  terror, the UN system, peacekeeping, international financial institutions, regional organisations, NGOs,
  the development goals, and the causes and effects of globalization since 1900.

flashcards:
  - front: Anti-globalization movement → events and demands
    back: |
      Protests against free-trade institutions and corporate power: the Seattle WTO meeting (1999), the Genoa G8 summit (2001), the World Social Forum (from 2001, Porto Alegre), Occupy Wall Street (2011). Demands: debt relief for poor countries, fair trade, labour and environmental standards, curbs on finance. Mostly from the left; drew on the resistance traditions of 8.7.
    topic_code: "9.7"
  - front: Seattle 1999
    back: |
      Tens of thousands of trade unionists, environmentalists, farmers and students disrupted the World Trade Organization's ministerial meeting in November–December 1999; the talks collapsed. The first mass protest aimed at a global economic institution, and the symbol of the anti-globalization movement.
    topic_code: "9.7"
  - front: Populism in the twenty-first century → meaning
    back: |
      Politics claiming to defend the people against elites, usually nationalist and anti-immigrant, hostile to global institutions and trade deals. Fed by deindustrialisation, the 2008 crisis and migration. Examples: Brexit (2016), tariff wars after 2018, nationalist parties across Europe, India and Latin America.
    topic_code: "9.7"
  - front: Brexit (2016)
    back: |
      The British referendum of 23 June 2016 in which 52% voted to leave the European Union; Britain left in 2020. Causes: control of migration, sovereignty, the losers of deindustrialisation, distrust of Brussels. The first withdrawal from a major regional bloc, and the clearest case of economic nationalism against integration.
    topic_code: "9.7"
  - front: Economic nationalism (post-2008)
    back: |
      Policies putting national producers first: tariffs, buy-national rules, exit from trade deals, limits on migration. Revived after the 2008 crisis in the United States, Britain, India and elsewhere; a reversal of the free-trade consensus of 9.4 and a return of the protectionism of the 1930s (7.4).
    topic_code: "9.7"
  - front: Religious fundamentalism → definition and examples
    back: |
      Movements demanding a return to scriptural law and rejecting secular modernity and foreign cultural influence. Iran's Islamic Republic (1979), the Taliban in Afghanistan (1996), Christian fundamentalism in the United States, Hindu nationalism in India, ultra-Orthodox politics in Israel. A response to globalization's cultural flows, not only to poverty.
    topic_code: "9.7"
  - front: Al-Qaeda
    back: |
      Network led by Osama bin Laden, formed by Arab veterans of the Afghan war against the Soviet Union (8.3). Aims: expel Western forces from Muslim lands, overthrow governments it saw as apostate, restore a caliphate. Bombed U.S. embassies in East Africa (1998) and carried out the attacks of 11 September 2001.
    topic_code: "9.7"
  - front: 11 September 2001
    back: |
      Nineteen al-Qaeda hijackers flew four airliners into the World Trade Center, the Pentagon and a field in Pennsylvania, killing nearly 3,000 people. The United States invaded Afghanistan (October 2001) to destroy al-Qaeda and the Taliban; the 'war on terror' then expanded to Iraq (2003), surveillance and detention at Guantánamo.
    topic_code: "9.7"
  - front: War on terror
    back: |
      The American response to 9/11 under George W. Bush: the invasion of Afghanistan (2001), the invasion of Iraq (2003, justified by weapons claims that proved false), the Patriot Act's surveillance powers, detention without trial at Guantánamo, drone strikes. Costly, long and divisive; the Taliban returned in 2021.
    topic_code: "9.7"
  - front: ISIS (Islamic State)
    back: |
      Grew from al-Qaeda in Iraq after the 2003 invasion; seized Mosul and declared a caliphate across Syria and Iraq in 2014; used social media to recruit worldwide; lost its territory by 2019 to Iraqi, Kurdish, Syrian, Iranian and Western forces. Shows terrorism exploiting the tools of globalization it rejected.
    topic_code: "9.7"
  - front: Why terrorism is a response to globalization
    back: |
      Its grievances are global (Western troops and culture in Muslim lands, support for Israel, secular states); its methods are global (air travel, the internet, international finance, media spectacle); its recruits cross borders. It rejects globalization's culture while using its tools.
    topic_code: "9.7"
  - front: Four forms of resistance to globalization
    back: |
      Left anti-globalization protest (Seattle, Occupy); economic nationalism and populism (Brexit, tariffs); religious fundamentalism (Iran, the Taliban); transnational terrorism (al-Qaeda, ISIS). Each answers a different loss: inequality, jobs and sovereignty, secularisation, and foreign power.
    topic_code: "9.7"
  - front: United Nations → structure
    back: |
      Founded 1945 (51 members; 193 today). General Assembly (one state, one vote), Security Council (five permanent members with vetoes: United States, Soviet Union/Russia, Britain, France, China; ten elected), Secretariat under the Secretary-General, International Court of Justice, and agencies: WHO, UNICEF, UNHCR, UNESCO, FAO.
    topic_code: "9.8"
  - front: UN peacekeeping → successes and failures
    back: |
      Blue-helmet forces placed with the host's consent to monitor ceasefires. Successes: Namibia (1989–90), Mozambique (1992–94), Cambodia's election (1993), East Timor (1999). Failures: Rwanda (1994, the genocide went on under UN eyes), Srebrenica (1995, 8,000 killed in a UN safe area), Somalia (1993). Limited by the veto, by weak mandates and by members' unwillingness to send troops.
    topic_code: "9.8"
  - front: Security Council veto → effect on the UN
    back: |
      Any of the five permanent members can block a resolution. It paralysed the UN during the Cold War (except Korea in 1950, when the Soviets were absent), blocked action on Syria after 2011 and on Ukraine in 2022, and means the UN acts only where the great powers agree or do not care.
    topic_code: "9.8"
  - front: World Health Organization
    back: |
      UN agency (1948) coordinating disease control: led the eradication of smallpox (declared 1980), the near-eradication of polio, and the response to Ebola, SARS and COVID-19. Its authority depends on members' funding and cooperation, which the pandemic strained.
    topic_code: "9.8"
  - front: UNHCR and UNICEF
    back: |
      The UN refugee agency (1950) protects and shelters refugees and displaced people, now more than 100 million; the children's fund (1946) runs vaccination, nutrition and schooling programmes. Both depend on voluntary funding and on states admitting them.
    topic_code: "9.8"
  - front: IMF and World Bank → roles
    back: |
      Both created at Bretton Woods (1944). The IMF lends to governments in currency crises on conditions (structural adjustment: cut spending, privatise, open markets); the World Bank lends for development projects. Criticised for conditions that hurt the poor and for voting weighted by wealth; still the lenders of last resort.
    topic_code: "9.8"
  - front: World Trade Organization (1995)
    back: |
      Successor to the General Agreement on Tariffs and Trade (1947); sets trade rules and judges disputes among 164 members. China joined in 2001. Its Doha round (2001) never concluded; its dispute court stalled after 2019 when the United States blocked appointments. The target of the Seattle protests.
    topic_code: "9.8"
  - front: European Union → stages
    back: |
      Coal and Steel Community (1951) → European Economic Community (1957, six members) → single market (1993) and EU → euro (1999–2002) → eastern enlargement (2004) → 27 members after Brexit. The deepest regional integration anywhere: shared law, court, parliament and currency; strained by the eurozone crisis and migration.
    topic_code: "9.8"
  - front: Regional organisations outside Europe
    back: |
      African Union (2002, from the OAU of 1963: peacekeeping, continental free-trade area 2021); ASEAN (1967, Southeast Asia: trade and security); NAFTA/USMCA (1994/2020); Mercosur (1991, South America); the Arab League (1945); the Organization of American States (1948). Looser than the EU; mostly trade and consultation.
    topic_code: "9.8"
  - front: Non-governmental organisation (NGO)
    back: |
      A private, non-profit body working across borders: the Red Cross (1863), Amnesty International (1961, prisoners of conscience), Médecins Sans Frontières (1971, medical aid in war zones), Greenpeace (1971), Oxfam (1942), Human Rights Watch (1978). They monitor states, deliver aid and shape opinion; they answer to donors, not voters.
    topic_code: "9.8"
  - front: Millennium Development Goals (2000)
    back: |
      Eight UN targets for 2015: halve extreme poverty and hunger, universal primary schooling, gender equality in schooling, cut child mortality by two-thirds, improve maternal health, fight HIV/AIDS and malaria, environmental sustainability, a global partnership. Poverty halved early (largely by China); child mortality fell by half; several goals missed.
    topic_code: "9.8"
  - front: Sustainable Development Goals (2015)
    back: |
      Seventeen UN goals for 2030 succeeding the MDGs, adding climate action, clean energy, inequality, cities and oceans. Agreed by all members; voluntary, measured by indicators, behind schedule after the pandemic.
    topic_code: "9.8"
  - front: Limits of international institutions
    back: |
      No enforcement without members' consent (the veto; no UN army); funding depends on rich states; weighted voting at the IMF and World Bank; nationalist withdrawal (Brexit, U.S. exits from the Paris agreement in 2017 and the WHO in 2020, later reversed); great powers ignore rulings (the United States on Nicaragua, China on the South China Sea).
    topic_code: "9.8"
  - front: Causes of globalization after 1900
    back: |
      Technology (jet aircraft, containers, satellites, the internet); policy (Bretton Woods, GATT and the WTO, the market turn after 1979, China's opening, the end of the Cold War); the search for cheaper labour by multinationals; migration; and the institutions that lowered the cost of cooperating. Technology made it possible; policy chose it.
    topic_code: "9.9"
  - front: Effects of globalization after 1900
    back: |
      Economic: growth, falling poverty in Asia, rising inequality within countries, deindustrialisation in the West, financial contagion. Social: migration, urbanisation, women's and rights movements. Cultural: global popular culture, English, religious revival, fusion and backlash. Environmental: climate change, deforestation, extinction. Political: international institutions, and the nationalist, religious and terrorist resistance to them.
    topic_code: "9.9"
  - front: Continuity or new era → the case for continuity
    back: |
      Trade, migration and cultural exchange across Afro-Eurasia are as old as the Silk Roads; the nineteenth century already had steamships, telegraphs, mass migration and a world economy (6.x); empire and the search for markets drove both ages. Globalization is older patterns at greater speed.
    topic_code: "9.9"
  - front: Continuity or new era → the case for a new era
    back: |
      Instant communication; production split across continents; capital moving in seconds; universal institutions (UN, WTO) with no earlier equivalent; the whole planet's climate changed by human activity; a global culture shared by billions; non-state actors (multinationals, NGOs, terrorist networks) rivalling states. Differences of kind, not only degree.
    topic_code: "9.9"
  - front: Globalization's winners and losers (summary)
    back: |
      Winners: East Asia's workers and middle classes, multinationals, skilled professionals, consumers everywhere, the very rich. Losers: industrial workers in rich countries, farmers facing subsidised imports, countries dependent on one commodity, the environment. The resistance of 9.7 comes from the losers and from those who fear cultural loss.
    topic_code: "9.9"

quiz:
  description: |
    25 questions on resistance to globalization, global institutions, and the causes and effects of
    globalization since 1900, with spiral review from earlier units. Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: apworld-u09-w32-q01
      type: multiple_choice
      topic_code: "9.7"
      source: "Primary source: George W. Bush, Address to a Joint Session of Congress and the American People, 20 September 2001 (White House archives); U.S. government work"
      points: 1
      stimulus: |
        "Our war on terror begins with al Qaeda, but it does not end there. It will not end until every terrorist group of global reach has been found, stopped and defeated. ... Every nation, in every region, now has a decision to make. Either you are with us, or you are with the terrorists."

        — President George W. Bush, address to Congress nine days after the attacks of 11 September 2001
      prompt: |
        Which of the following best describes the scope of the policy the speech announces?
      options:
        - "An open-ended, worldwide campaign against terrorist networks rather than a war against a single state"
        - "A limited police action to arrest the planners of a single attack"
        - "A declaration of war on Afghanistan alone, to end once its government fell"
        - "A negotiated settlement with al-Qaeda through the United Nations"
      option_explanations:
        - |
          Correct. 'Does not end there' and 'every terrorist group of global reach' set no limit of place or time; the campaign reached Afghanistan, Iraq, Yemen, Somalia and beyond.
        - |
          The speech speaks of war and of every group of global reach, not of a police case against named men.
        - |
          Afghanistan was the first target, but the speech names no end point and explicitly looks past al-Qaeda.
        - |
          The speech demands that nations choose sides; it offers no negotiation with the attackers.
      answer: 0
      explanation: |
        Skill: claims and evidence in sources. Read the scope words: 'begins with ... does not end there'.

    - slug: apworld-u09-w32-q02
      type: multiple_choice
      topic_code: "9.7"
      source: "Primary source: George W. Bush, Address to a Joint Session of Congress and the American People, 20 September 2001 (White House archives); U.S. government work"
      points: 1
      stimulus: |
        "Our war on terror begins with al Qaeda, but it does not end there. It will not end until every terrorist group of global reach has been found, stopped and defeated. ... Every nation, in every region, now has a decision to make. Either you are with us, or you are with the terrorists."

        — President George W. Bush, address to Congress nine days after the attacks of 11 September 2001
      prompt: |
        The sentence 'Either you are with us, or you are with the terrorists' most directly served to
      options:
        - "invite other states to mediate between the United States and al-Qaeda"
        - "pressure governments such as Pakistan's, which had recognised the Taliban, to join the American side"
        - "announce the withdrawal of American forces from the Middle East"
        - "reject any cooperation with the United Nations"
      option_explanations:
        - |
          The sentence leaves no room for mediation; it demands alignment.
        - |
          Correct. Pakistan, Saudi Arabia and other states with ties to the Taliban or to Islamist movements were given a stark choice, and Pakistan switched to supporting the Afghan campaign within days.
        - |
          The speech prepared the public for sending forces abroad, not for withdrawal.
        - |
          The United States sought and received UN Security Council support for action against al-Qaeda; the sentence is aimed at states, not the UN.
      answer: 1
      explanation: |
        Skill: purpose and audience. The audience was not only Americans but every government with ties to the Taliban.

    - slug: apworld-u09-w32-q03
      type: multiple_choice
      topic_code: "8.8"
      source: "Primary source: George W. Bush, Address to a Joint Session of Congress and the American People, 20 September 2001 (White House archives); U.S. government work"
      points: 1
      stimulus: |
        "Our war on terror begins with al Qaeda, but it does not end there. It will not end until every terrorist group of global reach has been found, stopped and defeated. ... Every nation, in every region, now has a decision to make. Either you are with us, or you are with the terrorists."

        — President George W. Bush, address to Congress nine days after the attacks of 11 September 2001
      prompt: |
        The network the speech names, al-Qaeda, had its origins most directly in which earlier development?
      options:
        - "The Iranian Revolution of 1979, whose Shia leadership founded al-Qaeda"
        - "The Suez Crisis of 1956, when Arab states turned against the West"
        - "The Soviet war in Afghanistan (1979–89), where Arab volunteers who fought the Soviet army, some with American and Saudi support, formed the network's core"
        - "The partition of India in 1947, which created Pakistan"
      option_explanations:
        - |
          Al-Qaeda is Sunni and hostile to Iran's Shia government; the two are rivals, not parent and child.
        - |
          Suez belongs to the story of Arab nationalism under Nasser, which Islamists opposed.
        - |
          Correct. Bin Laden and the Arab 'Afghans' organised in the war against the Soviet occupation; the end of the Cold War left them a trained network with a new target.
        - |
          Partition created the state in which the Taliban later found shelter, but it did not produce al-Qaeda.
      answer: 2
      explanation: |
        Skill: causation across units (spiral to 8.8, the end of the Cold War). Terrorism's modern networks are a legacy of the Cold War's last proxy war.

    - slug: apworld-u09-w32-q04
      type: multiple_choice
      topic_code: "9.8"
      source: "Data table compiled for this course from published United Nations figures (rounded)"
      points: 1
      stimulus: |
        The United Nations, selected years (approximate)

        | Year | Member states | Peacekeeping missions active | Peacekeepers deployed |
        |---|---|---|---|
        | 1945 | 51 | 0 | 0 |
        | 1960 | 99 | 2 | about 20,000 (mostly Congo) |
        | 1975 | 144 | 4 | about 5,000 |
        | 1990 | 159 | 8 | about 10,000 |
        | 1995 | 185 | 16 | about 60,000 |
        | 2015 | 193 | 16 | about 105,000 |
      prompt: |
        The change in membership between 1945 and 1975 is best explained by
      options:
        - "the admission of the former Soviet republics after 1991"
        - "the merger of the League of Nations into the United Nations"
        - "the partition of European states into smaller units"
        - "decolonization, as dozens of new states in Africa and Asia joined on independence"
      option_explanations:
        - |
          The Soviet republics joined after 1991, which lies outside the 1945–75 interval.
        - |
          The League dissolved in 1946 and its members were mostly already in the UN; it brought no wave of new states.
        - |
          Europe's map barely changed between 1945 and 1975; the new members came from Africa and Asia.
        - |
          Correct. Seventeen African states joined in 1960 alone; by 1975 the former colonies were the majority of members and shifted General Assembly votes toward the Global South.
      answer: 3
      explanation: |
        Skill: analysing data (causation). Membership tripled because the empires of Unit 6 dissolved in Unit 8.

    - slug: apworld-u09-w32-q05
      type: multiple_choice
      topic_code: "9.8"
      source: "Data table compiled for this course from published United Nations figures (rounded)"
      points: 1
      stimulus: |
        The United Nations, selected years (approximate)

        | Year | Member states | Peacekeeping missions active | Peacekeepers deployed |
        |---|---|---|---|
        | 1945 | 51 | 0 | 0 |
        | 1960 | 99 | 2 | about 20,000 (mostly Congo) |
        | 1975 | 144 | 4 | about 5,000 |
        | 1990 | 159 | 8 | about 10,000 |
        | 1995 | 185 | 16 | about 60,000 |
        | 2015 | 193 | 16 | about 105,000 |
      prompt: |
        The jump in peacekeeping between 1990 and 1995 is most directly explained by
      options:
        - "the end of the Cold War, which removed the Security Council vetoes that had blocked missions and released a wave of civil wars for the UN to police"
        - "the founding of NATO, which placed its armies under UN command"
        - "the creation of the World Trade Organization in 1995"
        - "the decision of the United States to leave the Security Council"
      option_explanations:
        - |
          Correct. Cambodia, Mozambique, Somalia, Bosnia and Rwanda all received missions in 1992–94, once Washington and Moscow stopped vetoing each other.
        - |
          NATO dates from 1949 and never placed its forces under UN command.
        - |
          The WTO concerns trade rules and has no role in peacekeeping.
        - |
          The United States has never left the Security Council; it is a permanent member.
      answer: 0
      explanation: |
        Skill: analysing data (causation). The veto paralysed the UN until 1989; its removal produced both the opportunity and the demand.

    - slug: apworld-u09-w32-q06
      type: multiple_choice
      topic_code: "8.1"
      source: "Data table compiled for this course from published United Nations figures (rounded)"
      points: 1
      stimulus: |
        The United Nations, selected years (approximate)

        | Year | Member states | Peacekeeping missions active | Peacekeepers deployed |
        |---|---|---|---|
        | 1945 | 51 | 0 | 0 |
        | 1960 | 99 | 2 | about 20,000 (mostly Congo) |
        | 1975 | 144 | 4 | about 5,000 |
        | 1990 | 159 | 8 | about 10,000 |
        | 1995 | 185 | 16 | about 60,000 |
        | 2015 | 193 | 16 | about 105,000 |
      prompt: |
        Compared with the League of Nations, the United Nations of 1945 differed most importantly in that it
      options:
        - "had no permanent members and gave every state an equal vote on security"
        - "included the United States and the Soviet Union from the start, and gave the great powers vetoes so they would stay"
        - "possessed its own standing army independent of member states"
        - "excluded all states that had fought on the Axis side permanently"
      option_explanations:
        - |
          The Security Council's five permanent members have vetoes; votes are not equal on security.
        - |
          Correct. The League's fatal weakness was the absence of the United States and, for most of its life, the Soviet Union; the veto was the price of keeping both inside the new body.
        - |
          The UN has never had an army of its own; peacekeepers are lent by members for each mission.
        - |
          Italy joined in 1955, Japan in 1956 and the two Germanys in 1973.
      answer: 1
      explanation: |
        Skill: comparison (spiral to 8.1, the setting up of the post-war order). The veto made the UN durable and often powerless at once.

    - slug: apworld-u09-w32-q07
      type: multiple_choice
      topic_code: "9.7"
      source: "Data table compiled for this course from published referendum, election and trade-policy records (rounded)"
      points: 1
      stimulus: |
        Signs of resistance to economic globalization, 1999–2020 (selected)

        | Year | Event | Form |
        |---|---|---|
        | 1999 | Seattle WTO ministerial meeting shut down by protest | left anti-globalization |
        | 2001 | First World Social Forum, Porto Alegre, Brazil | left anti-globalization |
        | 2011 | Occupy Wall Street; protests in 80 countries | left anti-globalization |
        | 2016 | Britain votes 52% to leave the European Union | nationalist, populist |
        | 2017 | United States withdraws from the Trans-Pacific Partnership and announces exit from the Paris climate agreement | nationalist, populist |
        | 2018–19 | United States and China impose tariffs on hundreds of billions of dollars of each other's goods | economic nationalism |
      prompt: |
        Which of the following best characterises the change in resistance to globalization shown between 1999 and 2019?
      options:
        - "Resistance disappeared once the 2008 crisis was over"
        - "Resistance remained confined to street protest without entering government"
        - "Resistance shifted from protest outside institutions by the left to policy inside governments by nationalists"
        - "Resistance moved from the rich countries to the poor countries"
      option_explanations:
        - |
          The events after 2008 are the largest in the table; resistance grew after the crisis.
        - |
          Brexit, the TPP withdrawal and the tariffs were acts of governments, not of protesters.
        - |
          Correct. The first three rows are movements outside power; the last three are votes and decisions by states, from a nationalist rather than a left standpoint.
        - |
          Every row is in a rich country or at a meeting of rich countries; the table shows no geographic shift.
      answer: 2
      explanation: |
        Skill: continuity and change (patterns in a table). The agenda of the protesters was taken up by populists with different aims.

    - slug: apworld-u09-w32-q08
      type: multiple_choice
      topic_code: "9.7"
      source: "Data table compiled for this course from published referendum, election and trade-policy records (rounded)"
      points: 1
      stimulus: |
        Signs of resistance to economic globalization, 1999–2020 (selected)

        | Year | Event | Form |
        |---|---|---|
        | 1999 | Seattle WTO ministerial meeting shut down by protest | left anti-globalization |
        | 2001 | First World Social Forum, Porto Alegre, Brazil | left anti-globalization |
        | 2011 | Occupy Wall Street; protests in 80 countries | left anti-globalization |
        | 2016 | Britain votes 52% to leave the European Union | nationalist, populist |
        | 2017 | United States withdraws from the Trans-Pacific Partnership and announces exit from the Paris climate agreement | nationalist, populist |
        | 2018–19 | United States and China impose tariffs on hundreds of billions of dollars of each other's goods | economic nationalism |
      prompt: |
        The grievances behind the events of 2016–19 in the table were most directly produced by
      options:
        - "the collapse of the Soviet Union, which ended American industrial exports"
        - "the end of the gold standard in 1971"
        - "the Asian financial crisis of 1997, which bankrupted Western banks"
        - "deindustrialisation in the rich countries, migration, and the financial crisis of 2008, which left many voters feeling that open markets had cost them jobs and security"
      option_explanations:
        - |
          The Soviet collapse opened new markets; it did not end American industrial exports.
        - |
          The end of the gold standard is too remote (1971) to explain votes of 2016–19.
        - |
          The 1997 crisis struck Thailand, Indonesia and Korea; Western banks survived it.
        - |
          Correct. Factory closures in the English Midlands and the American Midwest, the migration debate and the bank bailouts of 2008 fed the populist votes and the turn to tariffs.
      answer: 3
      explanation: |
        Skill: causation. The losers of 9.4 became the voters of 9.7.

    - slug: apworld-u09-w32-q09
      type: multiple_choice
      topic_code: "9.4"
      source: "Data table compiled for this course from published referendum, election and trade-policy records (rounded)"
      points: 1
      stimulus: |
        Signs of resistance to economic globalization, 1999–2020 (selected)

        | Year | Event | Form |
        |---|---|---|
        | 1999 | Seattle WTO ministerial meeting shut down by protest | left anti-globalization |
        | 2001 | First World Social Forum, Porto Alegre, Brazil | left anti-globalization |
        | 2011 | Occupy Wall Street; protests in 80 countries | left anti-globalization |
        | 2016 | Britain votes 52% to leave the European Union | nationalist, populist |
        | 2017 | United States withdraws from the Trans-Pacific Partnership and announces exit from the Paris climate agreement | nationalist, populist |
        | 2018–19 | United States and China impose tariffs on hundreds of billions of dollars of each other's goods | economic nationalism |
      prompt: |
        The institutions and policies these events targeted had been built on which set of ideas?
      options:
        - "The free-trade, open-market consensus of the 1980s and 1990s, which held that lower barriers and freer capital would make every participant richer"
        - "The import-substitution strategies of Latin America in the 1950s"
        - "The central planning of the Soviet five-year plans"
        - "The mercantilist policies of the eighteenth-century empires"
      option_explanations:
        - |
          Correct. The WTO, the EU single market, NAFTA and the TPP all expressed the neoliberal consensus of 9.4; the resistance in the table rejected its distribution of gains.
        - |
          Import substitution was the opposite policy: tariffs to build home industry.
        - |
          Soviet planning had collapsed before the first row of the table.
        - |
          Mercantilism belongs to Unit 4; the institutions targeted here were built after 1945 and expanded after 1979.
      answer: 0
      explanation: |
        Skill: contextualisation (spiral to 9.4). Name the ideas before judging the reaction to them.

    - slug: apworld-u09-w32-q10
      type: multiple_choice
      topic_code: "9.8"
      source: "general knowledge"
      points: 1
      prompt: |
        The UN's failures in Rwanda (1994) and Srebrenica (1995) are best explained by
      options:
        - "the absence of any UN presence in either country"
        - "weak mandates, members' refusal to send or risk troops, and Security Council reluctance to call the killings what they were, rather than ignorance of what was happening"
        - "the veto of China, which blocked all action in both cases"
        - "the opposition of non-governmental organisations to intervention"
      option_explanations:
        - |
