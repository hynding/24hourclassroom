    - slug: apworld-u09-w32-q25
      type: long_answer
      topic_code: "9.9"
      source: "general knowledge"
      points: 6
      prompt: |
        Long essay question (LEQ). Develop an argument that answers the prompt, supported with specific historical evidence.

        Evaluate the extent to which globalization in the period after 1945 represented a change from earlier patterns of global interaction.

        Your response should include a historically defensible thesis, use the broader historical context, support the argument with at least two specific pieces of evidence, use historical reasoning (continuity and change) to frame the argument, and demonstrate a complex understanding by, for example, qualifying the argument, considering a counter-argument or connecting it to another period or theme.
      answer: |
        A strong essay argues that globalization after 1945 was in some respects a continuation of the nineteenth-century world economy at greater speed, but in several respects a change of kind. Continuities: long-distance trade, migration and cultural exchange are ancient; the 1880–1914 world already had steamships, telegraphs, mass migration, foreign investment and a gold standard; European empires had built the ports, railways and plantations the post-war economy used; the search for markets and cheap labour drove both ages. Changes: instant communication and jet travel; production split across continents in supply chains coordinated in real time; capital moving in seconds and crises spreading in days (1997, 2008); universal institutions (UN, IMF, WTO, WHO) with no earlier equivalent; the shift of industrial growth to East Asia and the fall of extreme poverty from one-third to one-tenth of humanity; a global popular culture reaching billions; human alteration of the planet's climate; and non-state actors (multinationals, NGOs, terrorist networks) rivalling states. Context: decolonization, the Cold War and its end, the market turn after 1979. Complexity: the same technologies produced the resistance (populism, fundamentalism, terrorism), so that globalization and its opposition are both new; or the decline of European empires means that globalization after 1945 was the first not organised by Europe; or qualify by period (1945–79 regulated and bloc-divided; after 1979 open and global).
      explanation: |
        LEQ rubric, 6 points.

        Thesis (1): a defensible claim that evaluates the extent of change, with a line of reasoning, not merely 'there were continuities and changes'.
        Contextualisation (1): the broader setting (the nineteenth-century world economy, the world wars and depression, decolonization, the Cold War) described, not just named.
        Evidence (2): two or more specific examples (containers, the internet, supply chains, Bretton Woods, the WTO, the 1997 or 2008 crisis, the Asian tigers, the Paris agreement, al-Qaeda) used to support the argument; 1 pt for evidence merely named.
        Analysis and reasoning (1): continuity and change used to structure the essay, with explicit judgement about which outweighs which.
        Complexity (1): a sophisticated qualification, counter-argument, periodisation or cross-theme connection sustained across the essay.
