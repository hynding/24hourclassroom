  - slug: apworld-u03-exam-q18
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The Mughal mansabdar system and the Ottoman devshirme both aimed to
    options:
      - "create a hereditary landed nobility independent of the ruler"
      - "produce a military and administrative elite whose position depended on the emperor or sultan rather than on inherited status"
      - "exclude all non-Muslims from state service"
      - "replace cavalry with navies"
    option_explanations:
      - |
