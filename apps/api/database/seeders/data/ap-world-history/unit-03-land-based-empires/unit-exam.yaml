    prompt: |
      The Ottoman and Mughal "Revenue" entries share which feature that created long-term problems for both empires?
    options:
      - "Both collected taxes directly through salaried officials with no intermediaries"
      - "Both relied on intermediaries (tax farmers; zamindars) who kept a share and over time built local power at the centre's expense"
      - "Both abolished taxation on agriculture"
      - "Both depended on American silver"
    option_explanations:
      - |
