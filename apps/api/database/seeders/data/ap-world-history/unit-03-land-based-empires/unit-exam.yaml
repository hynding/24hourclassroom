      Martin Luther, Disputation on the Power and Efficacy of Indulgences (the Ninety-five Theses), 1517, in Works of Martin Luther, volume 1 (A. J. Holman Company, 1915)
    prompt: |
      Review. The rapid circulation of these theses across Germany depended on a technology that reached Europe through which process studied in Unit 2?
    options:
      - "The diffusion of Chinese inventions westward along the networks of exchange"
      - "The Columbian Exchange"
      - "The Ming voyages of Zheng He"
      - "The Bantu migrations"
    option_explanations:
      - |
        Correct. Printing, paper, gunpowder and the compass all moved from China to the west along the Silk Roads and sea routes.
      - |
