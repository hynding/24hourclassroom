  # ---- Stimulus set D: comparison table (3.4)
  - slug: apworld-u03-exam-q10
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge; table compiled for this course"
    points: 1
    stimulus: |
      Table compiled for this course: six land-based empires, c. 1450–1750.

      | Empire | Elite | Legitimacy | Revenue | Religious policy |
      |---|---|---|---|---|
      | Ottoman | Devshirme; timar cavalry | Caliph; holy cities | Timar, then tax farming | Sunni; millets |
      | Safavid | Slave army; Persian bureaucrats | Shia Islam; Isfahan | Land and silk | Forced Shia conversion |
      | Mughal | Mansabdars incl. Rajputs | Persianate kingship; Taj Mahal | Zamindars; cash land tax | Akbar's inclusion; Aurangzeb's orthodoxy |
      | Qing | Examinations with Manchu checks; banners | Mandate of Heaven; portraits | Low silver land tax | Confucian; Buddhist patronage |
      | Russia | Service nobility | Orthodox tsar; Third Rome | Serfdom; poll tax | Orthodox; Church under state |
      | France | Intendants; standing army | Divine right; Versailles | Taille; sold offices | Catholic; Nantes revoked |
    prompt: |
      Which empires in the table are most similar in using a ruler's claim to represent a religious tradition's leadership as a basis of legitimacy?
    options:
      - "Qing and France"
      - "Ottoman (caliph and guardian of the holy cities) and Russia (Orthodox tsar of the Third Rome)"
      - "Mughal and Qing"
      - "Safavid and France"
    option_explanations:
      - |
        The Qing claimed the Mandate of Heaven, not religious headship; France's divine right was a doctrine, not a claim to lead Catholicism.
      - |
        Correct. Both claimed to be the protector and head of their faith's community: Sunni Islam and Orthodox Christianity.
      - |
        The Mughals under Akbar stood above sects; the Qing were Confucian emperors.
      - |
        The Safavids led Shia Islam, but France's king did not claim to lead the Catholic Church.
    answer: 1
    explanation: |
      Comparison in 3.4 should identify the structure of a legitimacy claim, not just the religion's name.

