  # ---- Stimulus set B: Machiavelli (3.2)
  - slug: apworld-u03-exam-q04
    type: multiple_choice
    topic_code: "3.2"
    source: "Primary source: Niccolò Machiavelli, The Prince, ch. XVII (trans. W. K. Marriott, 1908), Project Gutenberg"
    points: 1
    stimulus: |
      "Upon this a question arises: whether it be better to be loved than feared or feared than loved? ... it is much safer to be feared than loved, when, of the two, either must be dispensed with. ... Nevertheless a prince ought to inspire fear in such a way that, if he does not win love, he avoids hatred."

      Niccolò Machiavelli, The Prince (1513), chapter XVII, translated by W. K. Marriott, 1908
    prompt: |
      Machiavelli's reasoning rests on which assumption about human nature?
    options:
      - "That people are naturally loyal and grateful to their rulers"
      - "That people are self-interested and unreliable, so fear binds them more surely than affection"
      - "That people obey only religious authority"
      - "That people cannot be governed at all"
    option_explanations:
      - |
        He says the opposite: men are ungrateful and fickle.
      - |
        Correct. He describes men as fickle, false and covetous, so a prince cannot rely on their love.
      - |
        Machiavelli's argument is secular and says nothing about religion as the basis of obedience here.
      - |
        He is writing a manual for governing successfully.
    answer: 1
    explanation: |
      The passage is a classic of secular political realism.

  - slug: apworld-u03-exam-q05
    type: multiple_choice
    topic_code: "3.2"
    source: "Primary source: Niccolò Machiavelli, The Prince, ch. XVII (trans. W. K. Marriott, 1908), Project Gutenberg"
    points: 1
    stimulus: |
      "Upon this a question arises: whether it be better to be loved than feared or feared than loved? ... it is much safer to be feared than loved, when, of the two, either must be dispensed with. ... Nevertheless a prince ought to inspire fear in such a way that, if he does not win love, he avoids hatred."

      Niccolò Machiavelli, The Prince (1513), chapter XVII, translated by W. K. Marriott, 1908
    prompt: |
      Which ruler's method of controlling his nobility best matches the balance Machiavelli recommends?
    options:
      - "Aurangzeb's restoration of the jizya on Hindus"
      - "Shah Ismail's forced conversion of Persia"
      - "The Tokugawa requirement that daimyo alternate residence in Edo and leave their families there, combined with the honours of attendance on the shogun"
      - "Songhai's reliance on cavalry"
    option_explanations:
      - |
        Aurangzeb's policy provoked exactly the hatred Machiavelli warns against.
      - |
        Forced conversion created a Shia identity but by coercion and bloodshed, not by managed fear.
      - |
        Correct. Sankin-kotai produced fear (hostages, expense, surveillance) while court ceremony offered status, avoiding open hatred.
      - |
        A military fact, not a method of managing an elite.
    answer: 2
    explanation: |
      Sankin-kotai and Versailles are the two clearest applications of fear-without-hatred in the unit.

  - slug: apworld-u03-exam-q06
    type: multiple_choice
    topic_code: "1.6"
    source: "Primary source: Niccolò Machiavelli, The Prince, ch. XVII (trans. W. K. Marriott, 1908), Project Gutenberg"
    points: 1
    stimulus: |
      "Upon this a question arises: whether it be better to be loved than feared or feared than loved? ... it is much safer to be feared than loved, when, of the two, either must be dispensed with. ... Nevertheless a prince ought to inspire fear in such a way that, if he does not win love, he avoids hatred."

      Niccolò Machiavelli, The Prince (1513), chapter XVII, translated by W. K. Marriott, 1908
    prompt: |
      Review. Machiavelli wrote for the rulers of Italian city-states. Which Unit 1 feature of Europe explains why Italy was governed by such states rather than by a single monarchy in 1513?
    options:
      - "The political fragmentation of medieval Europe, in which trading cities such as Venice, Florence and Genoa governed themselves while kings were weak"
      - "The Mongol conquest of Italy"
      - "The rule of the Byzantine emperor over all Italy"
      - "The Ottoman occupation of Rome"
    option_explanations:
      - |
        Correct. Europe's feudal decentralisation and the wealth of Italian commerce produced independent republics and principalities.
      - |
        The Mongols never reached Italy.
      - |
        Byzantium had lost its Italian holdings centuries earlier and fell in 1453.
      - |
        The Ottomans briefly held Otranto in 1480 but never Rome.
    answer: 0
    explanation: |
      Spiral review of 1.6: the decentralised Europe of Unit 1 is the background to Renaissance politics.

  # ---- Stimulus set C: Busbecq described (3.1)
  - slug: apworld-u03-exam-q07
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge; Busbecq's Turkish letters are described, not quoted"
    points: 1
    stimulus: |
      Description written for this course of a passage in the Turkish letters of Ogier Ghiselin de Busbecq, Habsburg ambassador to Suleiman the Magnificent (1554–1562).

      Busbecq reports that in the sultan's service honours go to merit, not birth: the highest officers are sons of shepherds and ploughmen, promoted for ability and loyalty, and the sultan alone makes a man's fortune. He describes the janissaries in camp as sober, silent and orderly, forbidden wine, living on simple rations, and contrasts them with the luxury and quarrels of Christian armies. He concludes that the Ottomans have a full treasury, discipline, unity and experience, while the Christians have empty purses, disorder and division, and warns that unless Europe reforms, the result of the struggle cannot be in doubt.
    prompt: |
      Busbecq's description of promotion by merit reflects the Ottoman reliance on
    options:
      - "a hereditary Turkish aristocracy"
      - "elites recruited through the devshirme and trained in the palace, who owed their position entirely to the sultan"
      - "Christian mercenaries hired from Europe"
      - "Shia clerics imported from Persia"
    option_explanations:
      - |
        Busbecq's point is that birth counted for nothing; the Turkish aristocracy was deliberately counterbalanced.
      - |
        Correct. Devshirme recruits, legally the sultan's slaves, rose by ability and could not pass on their rank.
      - |
        The janissaries were the sultan's own troops, not hired Europeans.
      - |
        The Ottomans were Sunni and at war with Shia Persia.
    answer: 1
    explanation: |
      Busbecq saw the devshirme system from the outside and admired what it produced.

