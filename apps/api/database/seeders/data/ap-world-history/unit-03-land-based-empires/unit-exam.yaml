  # ---- Short answer
  - slug: apworld-u03-exam-q40
    type: short_answer
    topic_code: "3.1"
    source: "general knowledge; Babur's memoirs are described, not quoted"
    points: 3
    prompt: |
      In his memoirs Babur describes the Battle of Panipat (1526): his army of about 12,000 faced the Delhi Sultan's far larger force with elephants; he chained several hundred carts together as a barrier, placed matchlockmen and field cannon behind them with gaps for cavalry to charge through, and sent horsemen around both flanks in the Mongol manner. Within hours the sultan's army broke and Ibrahim Lodi was killed.

      (a) Identify ONE military technology or tactic in the description that explains Babur's victory.
      (b) Explain ONE way the description reflects the Mughals' Central Asian and Mongol heritage.
      (c) Explain ONE way Babur's successors used methods other than military force to consolidate the conquest the battle began.
    answer: |
      (a) 1 point: field cannon and matchlocks; the wagon barrier (a Central Asian and Ottoman tactic) protecting gunners; the combination of firepower with cavalry; the flanking manoeuvre.
      (b) 1 point with explanation: the flanking charge (tulughma) was a Mongol steppe tactic; Babur's claim of descent from Timur and Chinggis gave him legitimacy among Turkic and Muslim elites; the mobile cavalry army was the steppe inheritance; his memoir itself, in Chaghatai Turkish, shows the Central Asian culture the dynasty brought.
      (c) 1 point with explanation: Akbar married Rajput princesses and gave Rajputs high mansabdar rank; abolished the jizya; built a surveyed land-revenue system (Todar Mal) through zamindars; patronised Persianate art and architecture; held religious debates and proclaimed tolerance (sulh-i kul); Shah Jahan's Taj Mahal displayed imperial wealth.
    explanation: |
      Scoring: one point per part. (b) and (c) require explanation connecting the example to heritage or to consolidation.

  - slug: apworld-u03-exam-q41
    type: short_answer
    topic_code: "3.3"
    source: "general knowledge"
    points: 3
    prompt: |
      (a) Identify ONE change in a belief system in Europe between 1450 and 1750.
      (b) Explain ONE way a ruler in Asia used religious policy to consolidate power in the same period.
      (c) Explain ONE similarity between the religious conflicts of Europe and those of the Islamic world in this period.
    answer: |
      (a) 1 point: the Protestant Reformation splitting Western Christianity; the Catholic Reformation's reforms (Trent, Jesuits); the rise of Calvinism; the Church of England; state control of churches after Augsburg and Westphalia.
      (b) 1 point with explanation: Shah Ismail imposed Shia Islam to give Persia a distinct identity against the Ottomans; Akbar's tolerance and abolition of the jizya won Hindu and Rajput loyalty; the Ottoman sultans used the caliphal title and guardianship of Mecca; the Qing patronised Tibetan Buddhism to bind Mongols and Tibetans; the Tokugawa banned Christianity to prevent foreign influence and daimyo disloyalty.
      (c) 1 point with explanation: in both, a religious division became a political frontier between states (Protestant and Catholic states after Augsburg and Westphalia; Shia Safavids against Sunni Ottomans); in both, rulers enforced their own confession within their borders and persecuted the other (Inquisition, revocation of Nantes; Safavid conversion, Ottoman suppression of Shia); in both, religious war was also a struggle for territory and power.
    explanation: |
      Scoring: one point per part. (b) and (c) require reasoning, not a bare name.

  # ---- Long answer
  - slug: apworld-u03-exam-q42
    type: long_answer
    topic_code: "3.4"
    source: "general knowledge; interpretation written for this course"
    points: 6
    prompt: |
      Evaluate the extent to which religion served as a tool of state-building in the land-based empires of the period c. 1450 to c. 1750.

      Write a complete essay with a thesis, context, specific evidence from at least two empires, and reasoning that compares them.
    answer: |
      Thesis (1 point): a defensible claim about extent, for example that religion was a central tool of legitimacy and elite formation in every empire, but that the empires which used it to include (Ottoman millets, Akbar) proved more stable than those which used it to exclude (Aurangzeb, Louis XIV's revocation of Nantes), with the Safavid case showing that exclusion could build a national identity at a cost.
      Contextualisation (1 point): the Reformation and Catholic Reformation; the Mongol legacy; the gunpowder revolution; the spread of Islam in Unit 2; the Sunni–Shia division.
      Evidence (2 points): at least two specific examples, for example the Ottoman caliphate and the holy cities; the devshirme's conversion of Christian boys; the millets; the Safavid imposition of Shia Islam and imported clergy; Akbar's abolition of the jizya, Din-i Ilahi and Rajput marriages; Aurangzeb's restoration of the jizya; the Qing Mandate of Heaven and Buddhist patronage; Moscow as the Third Rome and the Holy Synod; divine right and Versailles; Augsburg, Nantes and Westphalia; Songhai's hajj and Timbuktu scholars.
      Analysis and reasoning (1 point): uses comparison (or causation) to explain why rulers chose inclusion or enforcement and with what results.
      Complexity (1 point): distinguishes legitimacy, elite recruitment and social control as different uses of religion; notes change over time within an empire; weighs religion against gunpowder, taxation and bureaucracy as tools; or compares outcomes across empires.
    explanation: |
      Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that catalogues religious policies without judging their extent or effect cannot earn the thesis point.
