    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge; Busbecq's Turkish letters are described, not quoted"
    points: 1
    stimulus: |
      Description written for this course of a passage in the Turkish letters of Ogier Ghiselin de Busbecq, Habsburg ambassador to Suleiman the Magnificent (1554–1562).

      Busbecq reports that in the sultan's service honours go to merit, not birth: the highest officers are sons of shepherds and ploughmen, promoted for ability and loyalty, and the sultan alone makes a man's fortune. He describes the janissaries in camp as sober, silent and orderly, forbidden wine, living on simple rations, and contrasts them with the luxury and quarrels of Christian armies. He concludes that the Ottomans have a full treasury, discipline, unity and experience, while the Christians have empty purses, disorder and division, and warns that unless Europe reforms, the result of the struggle cannot be in doubt.
