unit: 3
description: |
  42 questions · about 72 minutes · every topic of Unit 3 (3.1 to 3.4) with review of Units 1 and 2. Four
  source-based multiple-choice sets in the AP style (Luther's Ninety-five Theses, Machiavelli on fear and love, a
  described passage from Busbecq's Turkish letters, and a comparison table of six empires), stand-alone multiple
  choice, select-all, true/false and fill-in-the-blank items, two short-answer questions (3 points each) and one
  long essay question (6 points). Multiple choice, select-all and true/false items are graded at once;
  fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher against
  the scoring notes.
questions:
  # ---- Stimulus set A: Luther (3.3)
  - slug: apworld-u03-exam-q01
    type: multiple_choice
    topic_code: "3.3"
    source: "Primary source: Martin Luther, Disputation on the Power and Efficacy of Indulgences (1517), Works of Martin Luther vol. 1 (Holman, 1915), Project Gutenberg"
    points: 1
    stimulus: |
      "1. Our Lord and Master Jesus Christ, when He said Poenitentiam agite, willed that the whole life of believers should be repentance. ... 21. Therefore those preachers of indulgences are in error, who say that by the pope's indulgences a man is freed from every penalty, and saved; ... 43. Christians are to be taught that he who gives to the poor or lends to the needy does a better work than buying pardons; ... 62. The true treasure of the Church is the Most Holy Gospel of the glory and the grace of God."

      Martin Luther, Disputation on the Power and Efficacy of Indulgences (the Ninety-five Theses), 1517, in Works of Martin Luther, volume 1 (A. J. Holman Company, 1915)
    prompt: |
      Thesis 43 most directly challenges which practice of the early sixteenth-century Church?
    options:
      - "The celibacy of the clergy"
      - "The use of Latin in the Mass"
      - "The sale of indulgences as a work meriting remission of sin"
      - "The veneration of saints"
    option_explanations:
      - |
        Clerical marriage became a Protestant issue later; the theses do not raise it.
      - |
        The theses are themselves in Latin and say nothing about the language of worship.
      - |
        Correct. Luther ranks charity above purchased pardons, undermining the commerce that funded St Peter's.
      - |
        Saints are not mentioned; the target is the indulgence trade.
    answer: 2
    explanation: |
      The theses are a focused attack on indulgences, from which the wider Reformation grew.

  - slug: apworld-u03-exam-q02
    type: multiple_choice
    topic_code: "3.3"
    source: "Primary source: Martin Luther, Disputation on the Power and Efficacy of Indulgences (1517), Works of Martin Luther vol. 1 (Holman, 1915), Project Gutenberg"
    points: 1
    stimulus: |
      "1. Our Lord and Master Jesus Christ, when He said Poenitentiam agite, willed that the whole life of believers should be repentance. ... 21. Therefore those preachers of indulgences are in error, who say that by the pope's indulgences a man is freed from every penalty, and saved; ... 43. Christians are to be taught that he who gives to the poor or lends to the needy does a better work than buying pardons; ... 62. The true treasure of the Church is the Most Holy Gospel of the glory and the grace of God."

      Martin Luther, Disputation on the Power and Efficacy of Indulgences (the Ninety-five Theses), 1517, in Works of Martin Luther, volume 1 (A. J. Holman Company, 1915)
    prompt: |
      Which later development was a direct consequence of the movement these theses began?
    options:
      - "The Safavid conversion of Persia to Shia Islam"
      - "The Peace of Augsburg (1555), allowing German princes to choose Lutheranism or Catholicism for their territories"
      - "The Mughal conquest of northern India"
      - "The founding of the Qing dynasty"
    option_explanations:
      - |
        The Safavid change (1501) preceded Luther and belonged to a different religion.
      - |
        Correct. Lutheran princes and the emperor settled their wars by letting each ruler decide his state's religion.
      - |
        Panipat (1526) was unconnected to German theology.
      - |
        The Qing rose in 1644 from Manchu conquest, not from the Reformation.
    answer: 1
    explanation: |
      Augsburg marks the political consequence of the religious split: state control of religion.

  - slug: apworld-u03-exam-q03
    type: multiple_choice
    topic_code: "2.5"
    source: "Primary source: Martin Luther, Disputation on the Power and Efficacy of Indulgences (1517), Works of Martin Luther vol. 1 (Holman, 1915), Project Gutenberg"
    points: 1
    stimulus: |
