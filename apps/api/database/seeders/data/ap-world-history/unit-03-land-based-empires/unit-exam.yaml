  # ---- Stand-alone multiple choice (new content)
  - slug: apworld-u03-exam-q13
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The fall of Constantinople in 1453 is most often cited as evidence of which change in warfare?
    options:
      - "The decline of the cavalry charge"
      - "The ability of large siege cannon to breach walls that had resisted attack for a thousand years"
      - "The first use of naval gunpowder weapons"
      - "The end of infantry warfare"
    option_explanations:
      - |
        Cavalry remained central to Ottoman and Mughal armies.
      - |
        Correct. Mehmed II's bombards destroyed the Theodosian walls; medieval fortification was obsolete.
      - |
        Ships took part, but the decisive weapons were land bombards.
      - |
        Janissary infantry was the heart of the army; infantry grew more important, not less.
    answer: 1
    explanation: |
      1453 is the standard marker for the gunpowder revolution in siege warfare.

  - slug: apworld-u03-exam-q14
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which best explains the Mughal Empire's rapid decline after Aurangzeb's death in 1707?
    options:
      - "The arrival of the Manchus in India"
      - "Decades of Deccan wars that exhausted the treasury, the alienation of Rajputs, Marathas and Sikhs, and the growing independence of regional governors and zamindars"
      - "The conversion of the emperors to Sikhism"
      - "A Safavid invasion"
    option_explanations:
      - |
        The Manchus ruled China and never entered India.
      - |
        Correct. Overextension, religious alienation and administrative decentralisation combined to fragment the empire.
      - |
        No Mughal emperor became a Sikh; the Sikhs were among the empire's enemies.
      - |
        The Safavids fell in 1722; Nadir Shah's Persian raid on Delhi (1739) was a symptom of Mughal weakness, not its cause.
    answer: 1
    explanation: |
      The causes of decline combine topics 3.1, 3.2 and 3.3.

