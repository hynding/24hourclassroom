    # ---- Short answer
    - slug: apworld-u03-w10-q22
      type: short_answer
      topic_code: "3.3"
      source: "Primary source: Martin Luther, Disputation on the Power and Efficacy of Indulgences (1517), Works of Martin Luther vol. 1 (Holman, 1915), Project Gutenberg"
      points: 3
      prompt: |
        In 1517 Luther wrote that "every truly repentant Christian has a right to full remission of penalty and guilt, even without letters of pardon" and asked why the pope, "whose wealth is to-day greater than the riches of the richest", did not build St Peter's "with his own money, rather than with the money of poor believers" (Ninety-five Theses, 36 and 86, Holman translation, 1915).

        (a) Identify ONE cause of the Protestant Reformation suggested by the passage.
        (b) Explain ONE way rulers in Europe used the Reformation to increase their own power.
        (c) Explain ONE way the Catholic Church's response to the Reformation affected regions outside Europe.
      answer: |
        (a) 1 point: the sale of indulgences; papal wealth and the funding of St Peter's; the doctrine that pardons could be bought rather than earned by repentance; resentment of money flowing from Germany to Rome.
        (b) 1 point with explanation: German princes adopted Lutheranism to seize church lands and escape the emperor's authority (confirmed at Augsburg, 1555); Henry VIII made himself head of the English Church and took the monasteries' wealth; Scandinavian kings nationalised their churches; the principle cuius regio, eius religio put religion under state control.
        (c) 1 point with explanation: the Jesuits carried Catholic missions to Akbar's court, Ming and Qing China, Japan, the Philippines and the Americas; Spanish and Portuguese empires enforced Catholic orthodoxy and the Inquisition in their colonies; the Church's global reach became part of European expansion in Unit 4.
      explanation: |
        Scoring: one point per part. (b) and (c) require an explanation of how, not a bare name.

    - slug: apworld-u03-w10-q23
      type: short_answer
      topic_code: "3.4"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE similarity in how the Ottoman and Mughal empires dealt with religious diversity among their subjects.
        (b) Explain ONE difference in how the Safavid and Mughal empires used religion to legitimise their rule.
        (c) Explain ONE way religious policy affected the long-term stability of a land-based empire in this period.
      answer: |
        (a) 1 point: both Muslim dynasties ruled large non-Muslim populations and for most of the period allowed them to practise their faiths (Ottoman millets; Akbar's tolerance); both employed non-Muslims in state service; both taxed non-Muslims at times through the jizya.
        (b) 1 point with explanation: the Safavids made Shia Islam the exclusive identity of the state and converted the population by force, so legitimacy came from championing one sect; Akbar's Mughals claimed to stand above sects (sulh-i kul, the Din-i Ilahi) and drew legitimacy from inclusion of a Hindu majority; or the Safavids relied on a clergy they imported, while the Mughals relied on Persianate kingship and tolerance.
        (c) 1 point with explanation: Aurangzeb's orthodoxy alienated Rajputs, Marathas and Sikhs and contributed to Mughal collapse after 1707; Louis XIV's revocation of the Edict of Nantes drove skilled Huguenots abroad; Safavid Shia identity outlasted the dynasty and unified Persia; the Peace of Westphalia stabilised Europe by removing religion from inter-state war; Ottoman millets kept a diverse empire governable for centuries.
      explanation: |
        Scoring: one point per part. (b) and (c) require reasoning that connects policy to legitimacy or stability.

    # ---- Long answer
    - slug: apworld-u03-w10-q24
      type: long_answer
      topic_code: "3.4"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which the land-based empires of the period c. 1450 to c. 1750 were similar in the methods they used to expand and consolidate their rule.

        Write a complete essay with a thesis, context, specific evidence from at least two empires, and reasoning that explains both similarities and differences.
      answer: |
        Thesis (1 point): a defensible claim about extent, for example that the empires were broadly similar in means (gunpowder armies, dependent elites, religious and architectural legitimacy, reorganised taxation) but differed in how they handled the peoples and faiths they ruled, with lasting consequences.
        Contextualisation (1 point): the Mongol collapse and the transfer of gunpowder; the Black Death's aftermath; the religious divisions of the period; the rise of maritime empires alongside.
        Evidence (2 points): at least two specific examples from two or more empires, for example cannon at Constantinople and Panipat; the devshirme and the mansabdars; the examinations with Manchu checks; Versailles and the Forbidden City; the Taj Mahal and the Süleymaniye; tax farming, zamindars and the Single Whip; millets, Akbar's tolerance, Safavid conversion, the revocation of Nantes; Siberian forts and serfdom.
        Analysis and reasoning (1 point): uses comparison to explain why methods converged (shared problems of paying armies and controlling nobles) and why they diverged (majority religion, ethnic composition, inherited institutions).
        Complexity (1 point): weighs the strands separately, notes change within empires (Akbar to Aurangzeb; timar to tax farming; Peter's reforms), compares outcomes (Qing and Ottoman longevity versus Mughal and Safavid collapse), or connects the land empires to Unit 4's maritime ones.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An answer that lists features of several empires without an argument about extent of similarity cannot earn the thesis point.
