week: 10
unit: 3
title: "Empires: Belief Systems, and the Unit 3 Comparison"
topics: ["3.3", "3.4"]
guide: guides/week-10.md
guide_description: |
  Study guide for week 10 (CED topics 3.3–3.4): continuity and change in belief systems between 1450 and 1750, and the Unit 3 comparison. Covers the Protestant Reformation (Luther, Calvin, Henry VIII) and the Catholic Reformation (Trent, Jesuits, Inquisition) and the wars they caused; the Sunni–Shia split as an Ottoman–Safavid frontier; Sikhism, Bhakti, Sufism and Akbar's tolerance and Din-i Ilahi against Aurangzeb's orthodoxy; and a comparison grid of six empires. Reads Luther's Ninety-five Theses closely.
flashcards_description: |
  30 cards on topics 3.3–3.4: causes, doctrines and consequences of the Protestant and Catholic Reformations; the religious wars and their settlements; the Sunni–Shia frontier; Sikhism and the Mughal religious policies of Akbar and Aurangzeb; and the comparison of land-based empires.
flashcards:
  - front: "What Luther attacked in 1517 and what he came to deny"
    back: "Attacked the sale of indulgences and papal wealth; came to deny papal authority and teach salvation by faith alone, Scripture alone and the priesthood of all believers."
    topic_code: "3.3"
  - front: "Why the Reformation spread when earlier protests had failed → two reasons"
    back: "The printing press carried Luther's writings across Germany in weeks; German princes who adopted Lutheranism gained church lands and independence from the emperor."
    hint: "One is a Unit 2 technology transfer."
    topic_code: "3.3"
  - front: "Thesis 27 of the Ninety-five Theses → what it mocks"
    back: "The indulgence preachers' claim that 'so soon as the penny jingles into the money-box, the soul flies out' of purgatory: salvation sold for cash."
    topic_code: "3.3"
  - front: "Calvinism → founder, place, two doctrines, where it spread"
    back: "John Calvin, Geneva (from 1536); predestination and disciplined, self-governing congregations; spread to Scotland, the Netherlands, France (Huguenots), England (Puritans) and New England."
    topic_code: "3.3"
  - front: "Henry VIII's break with Rome (1534) → cause and consequence"
    back: "Pope refused to annul his marriage; the Act of Supremacy made the king head of the Church of England and he seized monastic lands, binding the gentry to the new order."
    topic_code: "3.3"
  - front: "Council of Trent (1545–1563) → two kinds of decision"
    back: "Reaffirmed every doctrine Luther attacked (works, sacraments, papal authority, Latin Vulgate) and reformed abuses: seminaries for priests, residence of bishops, an end to indulgence sales."
    topic_code: "3.3"
  - front: "Jesuits → founder, date, three roles"
    back: "Ignatius Loyola, 1540; the Church's teachers (best schools in Europe), preachers winning back Poland and southern Germany, and missionaries to Akbar's court, Ming China, Japan and the Americas."
    topic_code: "3.3"
  - front: "Peace of Augsburg (1555) → principle"
    back: "Cuius regio, eius religio: each prince of the Holy Roman Empire chose Lutheranism or Catholicism for his state; Calvinism excluded, which helped cause later war."
    topic_code: "3.3"
  - front: "Thirty Years' War (1618–1648) → origin, course, settlement"
    back: "Began as a Catholic–Protestant conflict in Bohemia; became a European power struggle (Catholic France fighting Catholic Habsburgs); devastated Germany; the Peace of Westphalia let each state settle its own religion."
    topic_code: "3.3"
  - front: "Edict of Nantes (1598) and its revocation (1685)"
    back: "Henry IV granted French Huguenots toleration to end the Wars of Religion; Louis XIV revoked it, driving Protestants abroad, for the sake of one faith under one king."
    topic_code: "3.3"
  - front: "Continuity and change in European Christianity, 1450–1750 → one of each"
    back: "Continuity: Christianity remained the frame of law, education and politics. Change: one Western Church became many, states controlled their churches, and the printed vernacular Bible reached lay readers."
    topic_code: "3.3"
  - front: "Origin of the Sunni–Shia division versus its early modern form"
    back: "Began in the 600s over succession to Muhammad; after 1501 it became a frontier between the Shia Safavid state and the Sunni Ottoman Empire, each persecuting the other's adherents."
    topic_code: "3.3"
  - front: "Twelver Shia Islam → core belief and Safavid use"
    back: "Twelve imams descended from Ali, the last hidden and awaited; Shah Ismail made it Persia's state religion and imported Shia scholars from Lebanon and Iraq to build a clergy."
    topic_code: "3.3"
  - front: "Ottoman management of religion → ulama and millets"
    back: "State-appointed Sunni scholars under the Sheikh ul-Islam issued rulings; Christian and Jewish communities (millets) ran their own courts and schools under their own leaders in return for taxes."
    topic_code: "3.3"
  - front: "Bektashi Sufis → link to the janissaries"
    back: "A Sufi order attached to the janissary corps, giving the devshirme soldiers a flexible popular Islam distinct from the official ulama."
    topic_code: "3.3"
  - front: "Guru Nanak → dates, region, four teachings"
    back: "1469–1539, Punjab; one God beyond Hindu and Muslim names; equality of all people; rejection of caste and empty ritual; honest work and service as worship."
    topic_code: "3.3"
  - front: "Why Sikhism became a martial faith"
    back: "Mughal persecution: Guru Arjan executed (1606), Guru Tegh Bahadur executed (1675); Guru Gobind Singh founded the Khalsa (1699), a disciplined brotherhood that resisted Aurangzeb."
    topic_code: "3.3"
  - front: "Sikhism and syncretism → the CED's phrasing"
    back: "A new religion that drew on Hindu Bhakti and Islamic Sufism while rejecting both traditions' authority; the CED calls it a syncretic belief system of the period."
    topic_code: "3.3"
  - front: "Akbar's four measures of religious inclusion"
    back: "Married Rajput princesses; abolished the jizya (1564); appointed Hindus to high office; held interfaith debates at Fatehpur Sikri with Muslims, Hindus, Jains, Parsis and Jesuits."
    topic_code: "3.3"
  - front: "Din-i Ilahi (1582) → what it was and its fate"
    back: "Akbar's 'Divine Faith', a court cult centred on the emperor blending Islamic, Hindu, Zoroastrian and Christian elements; few joined and it died with him, but his policy of tolerance lasted two more reigns."
    topic_code: "3.3"
  - front: "Sulh-i kul → meaning"
    back: "'Peace with all': Akbar's principle of universal tolerance as the basis of Mughal rule over a Hindu majority."
    topic_code: "3.3"
  - front: "Aurangzeb's religious policy → three acts and their cost"
    back: "Restored the jizya (1679), demolished some temples, enforced Islamic law; alienated Rajputs, Marathas and Sikhs, whose wars drained the empire he had enlarged."
    topic_code: "3.3"
  - front: "Jesuits at Akbar's court and in China → what they show"
    back: "The Catholic Reformation's global reach: Jesuits debated at Fatehpur Sikri and served Ming and Qing emperors as astronomers and painters; tolerated for their learning, later restricted."
    topic_code: "3.3"
  - front: "Religion as a tool of state in three empires → one line each"
    back: "Ottomans: caliphal Sunni orthodoxy with millets. Safavids: Shia Islam as national identity. Mughals: tolerance under Akbar, orthodoxy under Aurangzeb."
    topic_code: "3.4"
  - front: "Compare Ottoman millets and Akbar's inclusion"
    back: "Both ruled large non-Muslim populations; the Ottomans separated minorities into self-governing communities under Sunni rule, Akbar tried to absorb a Hindu majority into a common imperial culture."
    topic_code: "3.4"
  - front: "Compare the Reformation and the Safavid conversion as changes in belief"
    back: "Both split a religious world along political lines (Protestant states vs Catholic; Shia Persia vs Sunni Ottomans); the Reformation began from below (a friar and printing), the Safavid change from above (a shah's decree)."
    topic_code: "3.4"
  - front: "Compare Qing and Ottoman legitimacy"
    back: "Qing: Mandate of Heaven, Confucian examinations, Buddhist patronage for Inner Asia, Manchu identity kept separate. Ottoman: caliphate and holy cities, Sunni ulama, devshirme elite. Both ruled majorities of other peoples through adopted institutions."
    topic_code: "3.4"
  - front: "Compare Russian and Mughal expansion and administration"
    back: "Russia: frontier settlement across Siberia, service nobility, serfdom, Orthodox tsar. Mughals: conquest of populous India, mansabdars of mixed origin, zamindar land tax, tolerance then orthodoxy."
    topic_code: "3.4"
  - front: "How to write a Unit 3 comparison in one paragraph"
    back: "Pick two empires and two columns (expansion, elites, legitimacy, revenue, religion); state one similarity and one difference; give a specific example for each; explain the reason for each (shared problem or different circumstances)."
    topic_code: "3.4"
  - front: "Common thread of all Unit 3 empires → the four shared problems"
    back: "Paying gunpowder armies, controlling hereditary nobles, legitimising rule over other peoples, and managing religious difference. The answers differed; the problems did not."
    topic_code: "3.4"
quiz:
  description: |
    Week 10 quiz on CED topics 3.3–3.4 with spiral review of Units 1 and 2 and topics 3.1–3.2 · 24 questions · about 40 minutes. Stimulus sets use Luther's Ninety-five Theses (Holman translation, 1915), a described account of Akbar's religious policy and a comparison table of six empires. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Luther (3.3)
    - slug: apworld-u03-w10-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "Primary source: Martin Luther, Disputation on the Power and Efficacy of Indulgences (1517), Works of Martin Luther vol. 1 (Holman, 1915), Project Gutenberg"
      points: 1
      stimulus: |
        "27. They preach man who say that so soon as the penny jingles into the money-box, the soul flies out [of purgatory]. ... 36. Every truly repentant Christian has a right to full remission of penalty and guilt, even without letters of pardon. ... 62. The true treasure of the Church is the Most Holy Gospel of the glory and the grace of God. ... 86. Why does not the pope, whose wealth is to-day greater than the riches of the richest, build just this one church of St. Peter with his own money, rather than with the money of poor believers?"

        Martin Luther, Disputation on the Power and Efficacy of Indulgences (the Ninety-five Theses), 1517, in Works of Martin Luther, volume 1 (A. J. Holman Company, 1915)
      prompt: |
        Luther's main objection in these theses is to
      options:
        - "the existence of purgatory"
        - "the sale of indulgences as a substitute for genuine repentance and as a means of funding papal building"
        - "the use of Latin in worship"
        - "the Ottoman threat to Vienna"
      option_explanations:
        - |
          In 1517 Luther still accepted purgatory; he attacked the claim that money could empty it.
        - |
          Correct. Theses 27, 36 and 86 together attack the commerce in pardons and the wealth behind it, while thesis 62 states what true grace is.
        - |
          Vernacular worship came later in the Reformation; the theses are in Latin.
        - |
          The Ottomans are not mentioned; this is a dispute within the Western Church.
      answer: 1
      explanation: |
        The theses began as a protest against a practice, not yet a break with Rome.

    - slug: apworld-u03-w10-q02
      type: multiple_choice
      topic_code: "3.3"
      source: "Primary source: Martin Luther, Disputation on the Power and Efficacy of Indulgences (1517), Works of Martin Luther vol. 1 (Holman, 1915), Project Gutenberg"
      points: 1
      stimulus: |
        "27. They preach man who say that so soon as the penny jingles into the money-box, the soul flies out [of purgatory]. ... 36. Every truly repentant Christian has a right to full remission of penalty and guilt, even without letters of pardon. ... 62. The true treasure of the Church is the Most Holy Gospel of the glory and the grace of God. ... 86. Why does not the pope, whose wealth is to-day greater than the riches of the richest, build just this one church of St. Peter with his own money, rather than with the money of poor believers?"

        Martin Luther, Disputation on the Power and Efficacy of Indulgences (the Ninety-five Theses), 1517, in Works of Martin Luther, volume 1 (A. J. Holman Company, 1915)
      prompt: |
        Which development most directly explains why these propositions, unlike earlier criticisms of the Church, reached a mass audience within weeks?
      options:
        - "The Mongol postal system"
        - "The Council of Trent"
        - "The printing press, which reproduced the theses and Luther's later pamphlets cheaply across Germany"
        - "The Jesuit schools"
      option_explanations:
        - |
          The yam had vanished with the khanates; Germany in 1517 used printers and carters.
        - |
          Trent met from 1545, decades later, in response to the Reformation.
        - |
          Correct. Printing, a technology China had developed and Europe had adopted in the 1450s, turned a Latin disputation into a German movement.
        - |
          The Jesuits were founded in 1540 and worked against Luther's movement.
      answer: 2
      explanation: |
        Technology explains the Reformation's speed; a Unit 2 transfer shaping a Unit 3 change.

    - slug: apworld-u03-w10-q03
      type: multiple_choice
      topic_code: "1.6"
      source: "Primary source: Martin Luther, Disputation on the Power and Efficacy of Indulgences (1517), Works of Martin Luther vol. 1 (Holman, 1915), Project Gutenberg"
      points: 1
      stimulus: |
        "27. They preach man who say that so soon as the penny jingles into the money-box, the soul flies out [of purgatory]. ... 36. Every truly repentant Christian has a right to full remission of penalty and guilt, even without letters of pardon. ... 62. The true treasure of the Church is the Most Holy Gospel of the glory and the grace of God. ... 86. Why does not the pope, whose wealth is to-day greater than the riches of the richest, build just this one church of St. Peter with his own money, rather than with the money of poor believers?"

        Martin Luther, Disputation on the Power and Efficacy of Indulgences (the Ninety-five Theses), 1517, in Works of Martin Luther, volume 1 (A. J. Holman Company, 1915)
      prompt: |
        Review. Luther's position as a university professor presenting propositions for formal debate reflects which institution of medieval Europe studied in Unit 1?
      options:
        - "The manorial court"
        - "The university with its Scholastic method of disputation"
        - "The guild"
        - "The feudal levy"
      option_explanations:
        - |
          Manorial courts settled peasants' disputes, not theology.
        - |
          Correct. Universities such as Paris and Wittenberg trained theologians in formal disputation; the theses are a product of that Scholastic culture.
        - |
          Guilds regulated crafts and trade in towns; they held no theological debates.
        - |
          The feudal levy was a military obligation.
      answer: 1
      explanation: |
        Spiral review of 1.6: the medieval university produced both Scholasticism and the man who broke its Church.

    # ---- Set B: Akbar described (3.3)
    - slug: apworld-u03-w10-q04
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge; Akbar's religious policy is described from the Mughal chronicles, not quoted"
      points: 1
      stimulus: |
        Description written for this course of Akbar's religious policy as recorded in the Mughal chronicles of Abu'l Fazl and his critic Badauni.

        Akbar (reigned 1556–1605) married Rajput princesses without requiring their conversion, abolished the jizya tax on non-Muslims in 1564, appointed Hindus such as Todar Mal and Man Singh to the highest offices, and from 1575 held debates in a House of Worship at Fatehpur Sikri at which Sunni and Shia scholars, Hindu pandits, Jains, Parsis and Jesuit priests argued before him. In 1582 he proclaimed a Divine Faith (Din-i Ilahi) centred on himself, with rituals drawn from several religions, which a small circle of courtiers joined. Abu'l Fazl praised the emperor as a universal ruler above all sects; Badauni, an orthodox Sunni, recorded the same events with horror as apostasy. Akbar's successors Jahangir and Shah Jahan kept the policy of tolerance; Aurangzeb restored the jizya in 1679.
      prompt: |
        Akbar's policies are best explained as a response to
      options:
        - "pressure from the Ottoman sultan to adopt Sunni orthodoxy"
        - "his conversion to Christianity under Jesuit influence"
        - "the Safavid imposition of Shia Islam"
        - "the need to secure the loyalty of a Hindu majority and of Rajput warriors whose support the Mughal state required"
      option_explanations:
        - |
          The Ottomans had no influence over Mughal religious policy.
        - |
          Akbar heard the Jesuits but never converted; the Din-i Ilahi centred on himself.
        - |
          Safavid Shia policy affected Persia; Akbar's court included Shia scholars but did not react to Persian decrees.
        - |
          Correct. Ruling a Hindu majority with a small Muslim elite, Akbar used inclusion to turn potential enemies into officers and taxpayers.
      answer: 3
      explanation: |
        Religious policy in 3.3 is always tied to the political problem of 3.2: who must the ruler keep loyal?

    - slug: apworld-u03-w10-q05
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge; Akbar's religious policy is described from the Mughal chronicles, not quoted"
      points: 1
      stimulus: |
        Description written for this course of Akbar's religious policy as recorded in the Mughal chronicles of Abu'l Fazl and his critic Badauni.

        Akbar (reigned 1556–1605) married Rajput princesses without requiring their conversion, abolished the jizya tax on non-Muslims in 1564, appointed Hindus such as Todar Mal and Man Singh to the highest offices, and from 1575 held debates in a House of Worship at Fatehpur Sikri at which Sunni and Shia scholars, Hindu pandits, Jains, Parsis and Jesuit priests argued before him. In 1582 he proclaimed a Divine Faith (Din-i Ilahi) centred on himself, with rituals drawn from several religions, which a small circle of courtiers joined. Abu'l Fazl praised the emperor as a universal ruler above all sects; Badauni, an orthodox Sunni, recorded the same events with horror as apostasy. Akbar's successors Jahangir and Shah Jahan kept the policy of tolerance; Aurangzeb restored the jizya in 1679.
      prompt: |
        The contrast between Abu'l Fazl's and Badauni's accounts best illustrates which principle of historical analysis?
      options:
        - "Two sources describing the same events can differ because of the authors' positions and purposes, so each must be read for point of view"
        - "Later sources are always more reliable than contemporary ones"
        - "Only one of two conflicting sources can contain any true information"
        - "Chronicles written in Persian cannot be used as evidence"
      option_explanations:
        - |
          Correct. A courtier praising his patron and an orthodox critic lamenting apostasy agree on the facts and disagree on their meaning.
        - |
          Both are contemporary; the principle at issue is point of view, not date.
        - |
          Both are valuable precisely because they corroborate the events while differing in judgement.
        - |
          Language has nothing to do with evidentiary value.
      answer: 0
      explanation: |
        Sourcing: the disagreement is itself evidence of how contested Akbar's policy was among Muslim elites.

    - slug: apworld-u03-w10-q06
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge; Akbar's religious policy is described from the Mughal chronicles, not quoted"
      points: 1
      stimulus: |
        Description written for this course of Akbar's religious policy as recorded in the Mughal chronicles of Abu'l Fazl and his critic Badauni.

        Akbar (reigned 1556–1605) married Rajput princesses without requiring their conversion, abolished the jizya tax on non-Muslims in 1564, appointed Hindus such as Todar Mal and Man Singh to the highest offices, and from 1575 held debates in a House of Worship at Fatehpur Sikri at which Sunni and Shia scholars, Hindu pandits, Jains, Parsis and Jesuit priests argued before him. In 1582 he proclaimed a Divine Faith (Din-i Ilahi) centred on himself, with rituals drawn from several religions, which a small circle of courtiers joined. Abu'l Fazl praised the emperor as a universal ruler above all sects; Badauni, an orthodox Sunni, recorded the same events with horror as apostasy. Akbar's successors Jahangir and Shah Jahan kept the policy of tolerance; Aurangzeb restored the jizya in 1679.
      prompt: |
        Review. The religious climate that made Akbar's eclecticism and the rise of Sikhism possible was prepared by which Unit 1 developments in South Asia?
      options:
        - "The Bhakti movement in Hinduism and Sufi Islam, both stressing personal devotion over caste and ritual"
        - "The Mongol conquest of Delhi"
        - "The spread of Theravada Buddhism to the Punjab"
        - "The Portuguese capture of Goa"
      option_explanations:
        - |
          Correct. Bhakti poets and Sufi saints had already drawn Hindus and Muslims toward a shared devotional language that Nanak and Akbar built on.
        - |
          The Mongols raided but never conquered Delhi.
        - |
          Theravada spread in Southeast Asia and Ceylon, not the Punjab.
        - |
          Goa (1510) was a coastal Portuguese enclave with no effect on Mughal religious policy.
      answer: 0
      explanation: |
        Spiral review of 1.3: the devotional movements of Unit 1 are the roots of Unit 3's South Asian syntheses.

    # ---- Set C: comparison table (3.4)
    - slug: apworld-u03-w10-q07
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: six land-based empires compared, c. 1450–1750.

        | Empire | Elite | Legitimacy | Revenue | Religious policy |
        |---|---|---|---|---|
        | Ottoman | Devshirme; timar cavalry | Caliph; holy cities; mosques | Timar, then tax farming | Sunni orthodoxy; millets for Christians and Jews |
        | Safavid | Slave army; Persian bureaucrats | Shia Islam; Isfahan | Land and silk | Forced Shia conversion |
        | Mughal | Mansabdars incl. Rajputs | Persianate kingship; Taj Mahal | Zamindars; cash land tax | Akbar's inclusion; Aurangzeb's orthodoxy |
        | Qing | Examination officials with Manchu checks; banners | Mandate of Heaven; Buddhist patronage; portraits | Low silver land tax | Confucian state; Jesuits tolerated, then restricted |
        | Russia | Service nobility | Orthodox tsar; Third Rome | Serfdom; poll tax | Orthodox; Church under state after Peter |
        | France | Intendants; standing army | Divine right; Versailles | Taille; sold offices | Catholic; Edict of Nantes revoked 1685 |
      prompt: |
        Which pair of empires is most similar in the way their religious policy treated the majority of their subjects?
      options:
        - "Safavid Persia and Mughal India under Akbar, both enforcing the ruler's faith on the majority"
        - "Russia and the Mughals, both Orthodox"
        - "Ottoman Empire and Qing China, both ruling large populations of a different religion or ethnicity through adopted institutions while keeping the ruling group distinct"
        - "France and the Safavids, both Protestant"
      option_explanations:
        - |
          Akbar did the opposite of enforcement; the Safavids forced conversion.
        - |
          The Mughals were Muslim rulers of a Hindu majority, not Orthodox.
        - |
          Correct. Sunni Ottomans ruled Balkan Christians through millets; Manchu Qing ruled Han Chinese through Confucian institutions; both kept their own elites separate.
        - |
          France was Catholic, the Safavids Shia Muslim.
      answer: 2
      explanation: |
        The comparison asks for the structure of policy, not the name of the religion.

