      prompt: |
        Review. Which revenue system in the table most directly tied its empire's finances to the global flow of precious metals from the Americas and Japan?
      options:
        - "Ottoman tax farming"
        - "Russian serfdom"
        - "The Qing silver land tax, inherited from the Ming Single Whip reform"
        - "The French taille"
      option_explanations:
        - |
          Tax farming raised cash in local coin; it did not depend on a single imported metal.
        - |
          Serfdom was labour and poll tax in kind and coin, within Russia.
        - |
          Correct. Taxes payable in silver made China the world's largest importer of silver and its economy sensitive to supply from Potosí and Japan.
        - |
          The taille was a domestic land and property tax.
      answer: 2
      explanation: |
        Spiral review of 3.2 pointing forward to Unit 4's silver trade.

    # ---- Standalone new content
    - slug: apworld-u03-w10-q10
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which best describes the Catholic Reformation's response to Protestantism?
      options:
        - "The Church accepted Luther's doctrines at the Council of Trent"
        - "The Church abolished the papacy"
        - "The Church ended all missionary activity"
