    # ---- Short answer
    - slug: apworld-u03-w09-q22
      type: short_answer
      topic_code: "3.2"
      source: "Primary source: Niccolò Machiavelli, The Prince, ch. XVII (trans. W. K. Marriott, 1908), Project Gutenberg"
      points: 3
      prompt: |
        Machiavelli wrote in 1513 that "it is much safer to be feared than loved, when, of the two, either must be dispensed with", but that a prince "ought to inspire fear in such a way that, if he does not win love, he avoids hatred" (The Prince, chapter XVII, Marriott translation, 1908).

        (a) Identify ONE method by which a ruler of a land-based empire between 1450 and 1750 made his elite dependent on and therefore afraid of displeasing him.
        (b) Explain ONE way a ruler in the same period used religion or architecture to win something closer to love or awe than fear.
        (c) Explain ONE limitation of using Machiavelli's text as evidence for how empires outside Europe were governed.
      answer: |
        (a) 1 point: the devshirme, whose men were the sultan's slaves; Versailles and the system of royal favour; sankin-kotai hostages; the Table of Ranks tying noble status to service; Shah Abbas's slave army replacing tribal chiefs; Qing dual appointments.
        (b) 1 point with explanation: Louis XIV's divine-right ceremony and the Sun King imagery; the Ottoman guardianship of the holy cities and imperial mosques; Qing patronage of Tibetan Buddhism to bind Mongols; Akbar's religious tolerance and Fatehpur Sikri; the Taj Mahal's display of Mughal splendour; Askia Muhammad's hajj; each sought willing obedience through awe or shared faith.
        (c) 1 point: Machiavelli wrote about Italian city-states and a European prince, with no knowledge of Ottoman, Mughal or Chinese institutions; he is prescriptive, not descriptive; his secular framework ignores the religious legitimacy (Mandate of Heaven, caliphate) central elsewhere; his work was one Florentine's advice, not a record of practice.
      explanation: |
        Scoring: one point per part. (b) must explain how the method produced consent; (c) must connect the limitation to Machiavelli's situation or scope.

    - slug: apworld-u03-w09-q23
      type: short_answer
      topic_code: "3.2"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE similarity between the Ottoman devshirme and the Tokugawa treatment of the samurai as ways of controlling a military class.
        (b) Explain ONE difference between the Mughal and Ottoman systems of tax collection.
        (c) Explain ONE way a tax system created a long-term problem for the empire that used it.
      answer: |
        (a) 1 point: both produced a military elite dependent on the ruler or lord for pay and position rather than on hereditary land; both separated soldiers from an independent economic base (slaves of the sultan; stipended samurai forbidden to farm or trade).
        (b) 1 point with explanation: the Mughals used a surveyed, fixed land assessment collected by zamindars who were rural landholders, while the Ottomans sold collection rights to tax farmers, often urban financiers, for a term; or the Mughal system aimed at a standard share of yield while tax farming aimed at maximum cash now.
        (c) 1 point with explanation: Ottoman tax farming oppressed peasants and created provincial power-holders beyond central control; Mughal zamindars became a hereditary elite that withheld revenue and later allied with the British; the Ming silver tax tied China's economy to foreign silver supply and caused crisis when it fell; French exemptions for nobles and clergy left the crown chronically short and contributed to 1789; Russian serfdom locked the economy into unfree labour.
      explanation: |
        Scoring: one point per part; (b) and (c) require an explanation of the difference or the problem, not just naming a system.

    # ---- Long answer
    - slug: apworld-u03-w09-q24
      type: long_answer
      topic_code: "3.2"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Compare the methods by which two land-based empires of the period c. 1450 to c. 1750 legitimised and consolidated their power, and evaluate the extent to which those methods were similar.

        Write a complete essay with a thesis, context, specific evidence for both empires, and reasoning that explains the similarities and differences.
      answer: |
        Thesis (1 point): a defensible claim about the extent of similarity, for example that the Ottomans and the Mughals both built loyal elites of mixed or servile origin and both used Islamic legitimacy and monumental architecture, but differed in how they taxed and in how they treated religious minorities.
        Contextualisation (1 point): the gunpowder revolution, the Mongol and Timurid heritage, the cost of standing armies, or the religious divisions of the period.
        Evidence (2 points): at least two specific examples for the comparison, for example the devshirme and janissaries; mansabdars and Rajput alliances; the caliphal title and the Süleymaniye; the Taj Mahal and Fatehpur Sikri; tax farming versus Todar Mal's settlement and zamindars; Akbar's abolition of the jizya; Versailles and intendants; Qing portraits and dual appointments; the Single Whip silver tax; serfdom and the Table of Ranks.
        Analysis and reasoning (1 point): uses comparison to explain why the methods were similar (shared problems of paying gunpowder armies and controlling nobles) and why they differed (ethnic and religious composition, inherited institutions).
        Complexity (1 point): weighs the three strands (elites, legitimacy, revenue) separately, notes change over time within an empire (Ottoman timar to tax farming; Akbar to Aurangzeb), or connects administrative choices to later decline.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. A description of two empires without explicit comparison earns at most the evidence points.
