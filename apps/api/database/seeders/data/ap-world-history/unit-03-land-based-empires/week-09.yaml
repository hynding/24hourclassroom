week: 9
unit: 3
title: "Empires: Administration"
topics: ["3.2"]
guide: guides/week-09.md
guide_description: |
  Study guide for week 9 (CED topic 3.2): how the land-based empires of 1450–1750 legitimised and consolidated power. Covers bureaucratic elites and military professionals (devshirme, mansabdars, examination officials with Manchu checks, salaried samurai, intendants, the Table of Ranks); religion, art and monumental architecture (divine right, Versailles, the Forbidden City, Qing portraits, the Taj Mahal, Isfahan, Songhai's Islam); and tax systems (zamindars, tax farming, the Single Whip silver tax, serfdom). Reads Machiavelli's chapter on fear and love closely and describes the Ain-i-Akbari, Versailles and the Forbidden City.
flashcards_description: |
  30 cards on topic 3.2: who served each empire, why subjects obeyed, and how each empire raised revenue, with comparisons across the Ottoman, Safavid, Mughal, Qing, Tokugawa, Russian and French states.
flashcards:
  - front: "The three questions every early modern ruler had to answer"
    back: "Who serves me (bureaucracy and army), why should they obey (legitimacy through religion, art, buildings), and how do I pay for it (taxation). Topic 3.2 is each empire's set of answers."
    topic_code: "3.2"
  - front: "Devshirme as an administrative, not just military, institution"
    back: "The ablest boys went to the palace school and into government; grand viziers were often devshirme men. As the sultan's slaves they could not found noble dynasties, so they counterbalanced the Turkish aristocracy."
    topic_code: "3.2"
  - front: "Mansabdars → what they were and why Akbar mixed their origins"
    back: "Mughal officers ranked by number, paid from assigned revenues; Akbar recruited Persians, Central Asians, Indian Muslims and Hindu Rajputs so no faction could dominate the court."
    topic_code: "3.2"
  - front: "Qing checks on the Chinese bureaucracy → two"
    back: "Manchu quotas in examinations and offices, and dual appointments pairing a Han official with a Manchu colleague; the banner armies stayed a hereditary Manchu caste."
    topic_code: "3.2"
  - front: "Salaried samurai under the Tokugawa → the change and its purpose"
    back: "After 1603 samurai were paid rice stipends and lived in castle towns, forbidden to farm or trade; a landed warrior class became a dependent administrative class, ending the civil wars."
    hint: "What happens to a warrior with no land and no war?"
    topic_code: "3.2"
  - front: "Sankin-kotai → mechanism and effect"
    back: "Daimyo had to alternate years between their domains and Edo and leave families in Edo as hostages (compulsory 1635); the expense and surveillance kept lords loyal and made Edo a huge city."
    topic_code: "3.2"
  - front: "Louis XIV's intendants → who and why"
    back: "Salaried royal officials sent to the provinces to supervise taxes, justice and the army, bypassing the hereditary nobility and provincial governors."
    topic_code: "3.2"
  - front: "Peter the Great's Table of Ranks (1722)"
    back: "Ranked all military and civil posts in fourteen grades; nobles had to serve to keep status, and commoners who rose through the ranks gained nobility. Service to the state replaced birth as the measure of rank."
    topic_code: "3.2"
  - front: "Common pattern in how empires built loyal elites"
    back: "Salaried or enslaved servants dependent on the ruler (devshirme, mansabdars, samurai stipends, intendants, Table of Ranks) replaced hereditary lords with their own power bases."
    topic_code: "3.2"
  - front: "Divine right of kings → doctrine and spokesman"
    back: "European claim that monarchs receive authority from God and answer only to Him; argued by Bishop Bossuet for Louis XIV and by James I of England."
    topic_code: "3.2"
  - front: "Versailles as an instrument of rule"
    back: "From 1682 the nobility lived at court under the king's eye, competing for ceremonial honours (attending his rising and retiring); a class that had rebelled in the Fronde became dependent courtiers."
    topic_code: "3.2"
  - front: "Ottoman religious legitimacy → two claims"
    back: "The sultan as caliph and as guardian of Mecca and Medina after 1517; imperial mosques such as the Süleymaniye proclaimed the empire the champion of Sunni Islam."
    topic_code: "3.2"
  - front: "Isfahan under Shah Abbas → what it was meant to show"
    back: "A planned capital with a vast square, the Shah Mosque and the bazaar: Safavid Shia piety, wealth from silk, and the shah's order, displayed to merchants and ambassadors."
    topic_code: "3.2"
  - front: "Taj Mahal → builder, date, purpose as legitimacy"
    back: "Shah Jahan, 1632–1653, mausoleum for Mumtaz Mahal; its scale and marble announced Mughal wealth and Persianate taste to every subject and visitor."
    topic_code: "3.2"
  - front: "Forbidden City → how its design expressed authority"
    back: "Successive gates and courtyards on a north–south axis reduced the visitor and raised the throne; the emperor faced south as Son of Heaven. The Qing kept it, adopting the Confucian order it embodied."
    topic_code: "3.2"
  - front: "Qing imperial portraits → why painted in several guises"
    back: "Kangxi and Qianlong were shown as Confucian scholars for the Han, Manchu warriors for the banners, and Buddhist patrons for Mongols and Tibetans; one ruler speaking to each audience of a multi-ethnic empire."
    topic_code: "3.2"
  - front: "Qing patronage of Tibetan Buddhism → purpose"
    back: "Bound Mongol and Tibetan elites, for whom the Dalai Lama's religion was central, to an emperor who presented himself as its protector."
    topic_code: "3.2"
  - front: "Songhai's use of Islam for legitimacy"
    back: "Askia Muhammad, a usurper, made the hajj, took the title caliph of the Sudan and patronised Timbuktu's scholars, turning religious prestige into a right to rule."
    topic_code: "3.2"
  - front: "Moscow as the 'Third Rome'"
    back: "After Constantinople fell (1453), Russian churchmen called Moscow the successor of Rome and Byzantium; the tsar was protector of Orthodoxy. Peter later put the Church under a state department (the Holy Synod)."
    topic_code: "3.2"
  - front: "Machiavelli on fear and love → the argument in three steps"
    back: "Better to be both; if one must be dropped, safer to be feared, because men are fickle and self-interested; but the prince must avoid being hated, above all by not seizing subjects' property or women."
    topic_code: "3.2"
  - front: "Zamindars → role and long-term problem"
    back: "Mughal landholders who collected land tax from peasants and kept a share; over time they became a hereditary rural elite that resisted the centre and later dealt with the British."
    topic_code: "3.2"
  - front: "Todar Mal's revenue settlement (1580s)"
    back: "Akbar's minister measured fields, fixed assessments by crop and region, and demanded cash; the Ain-i-Akbari records the results province by province."
    topic_code: "3.2"
  - front: "Ottoman tax farming → how it worked and what it cost"
    back: "The state sold the right to collect a province's taxes to the highest bidder, who paid cash up front and kept what he squeezed out; quick revenue, oppressed peasants, weakened central control."
    topic_code: "3.2"
  - front: "Ming Single Whip reform (1570s) → content and global consequence"
    back: "Consolidated many taxes and labour duties into one payment in silver; tied China's revenue to silver from Japan and the Americas, drawing the world's silver to China (Unit 4)."
    hint: "Think about where the silver came from."
    topic_code: "3.2"
  - front: "Qing fiscal policy → aim"
    back: "Kept land tax low and stable (Kangxi froze the quota) to win Han consent; prosperity under Qianlong rested on this, and later underfunded the state."
    topic_code: "3.2"
  - front: "Russian serfdom (1649 code) → function for the state"
    back: "Bound peasants to land and lords, guaranteeing labour for the service nobility and taxpayers for the tsar's poll tax; Peter taxed beards, baths and coffins besides."
    topic_code: "3.2"
  - front: "French taille and sale of offices → why the crown stayed poor"
    back: "The taille fell on commoners, nobles and clergy being exempt; selling offices raised cash once but created hereditary office-holders. Revenue never matched Louis XIV's wars."
    topic_code: "3.2"
  - front: "Ain-i-Akbari → what it is and how to source it"
    back: "Abu'l Fazl's administrative handbook of Akbar's empire (c. 1590): household, army ranks, provincial revenue statistics. Evidence of a state that knew its land, and propaganda for a perfect ruler."
    topic_code: "3.2"
  - front: "Compare Ottoman tax farming and Mughal zamindars"
    back: "Both delegated collection to intermediaries who kept a share; tax farmers were urban financiers bidding for short terms, zamindars were rural landholders with hereditary local power. Both eroded central control."
    topic_code: "3.2"
  - front: "Compare Versailles and sankin-kotai as ways to control nobles"
    back: "Both kept the elite at the capital, under observation and spending on display; France used ceremony and favour, Japan used compulsory alternate residence and hostages. Both replaced rebellion with dependence."
    topic_code: "3.2"
quiz:
  description: |
    Week 9 quiz on CED topic 3.2 with spiral review of Units 1 and 2 and topic 3.1 · 24 questions · about 40 minutes. Stimulus sets use Machiavelli's The Prince (Marriott translation, 1908) and a described passage of the Ain-i-Akbari. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Machiavelli (3.2)
    - slug: apworld-u03-w09-q01
      type: multiple_choice
      topic_code: "3.2"
      source: "Primary source: Niccolò Machiavelli, The Prince, ch. XVII (trans. W. K. Marriott, 1908), Project Gutenberg"
      points: 1
      stimulus: |
        "Upon this a question arises: whether it be better to be loved than feared or feared than loved? ... it is much safer to be feared than loved, when, of the two, either must be dispensed with. ... Nevertheless a prince ought to inspire fear in such a way that, if he does not win love, he avoids hatred."

        Niccolò Machiavelli, The Prince (1513), chapter XVII, translated by W. K. Marriott, 1908
      prompt: |
        Which practice of a ruler in the period 1450–1750 best illustrates Machiavelli's advice to be feared without being hated?
      options:
        - "Louis XIV keeping the French nobility at Versailles under his eye while rewarding them with ceremonial honours"
        - "Songhai's refusal to adopt firearms"
        - "The Ming decision to end Zheng He's voyages"
        - "The Safavid conversion of Persia to Shia Islam by force"
      option_explanations:
        - |
          Correct. Versailles combined surveillance and dependence (fear) with favour and splendour (avoiding hatred), domesticating a rebellious class.
        - |
          A military omission, not a method of ruling subjects.
        - |
          A foreign-policy choice with no bearing on how subjects were managed.
        - |
          Forced conversion is the opposite of avoiding hatred, though it did create a loyal identity in the long run.
      answer: 0
      explanation: |
        Machiavelli describes the balance the Sun King's court was designed to strike.

    - slug: apworld-u03-w09-q02
      type: multiple_choice
      topic_code: "3.2"
      source: "Primary source: Niccolò Machiavelli, The Prince, ch. XVII (trans. W. K. Marriott, 1908), Project Gutenberg"
      points: 1
      stimulus: |
        "Upon this a question arises: whether it be better to be loved than feared or feared than loved? ... it is much safer to be feared than loved, when, of the two, either must be dispensed with. ... Nevertheless a prince ought to inspire fear in such a way that, if he does not win love, he avoids hatred."

        Niccolò Machiavelli, The Prince (1513), chapter XVII, translated by W. K. Marriott, 1908
      prompt: |
        Machiavelli's argument differs most sharply from which other justification of authority used by rulers in this period?
      options:
        - "The Ottoman use of tax farming"
        - "The divine right of kings, which grounded obedience in God's appointment rather than in the ruler's management of fear and love"
        - "The Mughal mansabdar ranking"
        - "The Tokugawa stipend system for samurai"
      option_explanations:
        - |
          Tax farming is a revenue method, not a justification of authority.
        - |
          Correct. Machiavelli treats rule as a craft of managing human nature; divine right treats it as a sacred trust requiring obedience regardless of the ruler's conduct.
        - |
          The mansabdar system organised officers; it did not argue why subjects should obey.
        - |
          Stipends controlled a class; they were a method, not a doctrine.
      answer: 1
      explanation: |
        The contrast between secular statecraft and sacred kingship is the heart of the topic's legitimacy strand.

    - slug: apworld-u03-w09-q03
      type: multiple_choice
      topic_code: "1.6"
      source: "Primary source: Niccolò Machiavelli, The Prince, ch. XVII (trans. W. K. Marriott, 1908), Project Gutenberg"
      points: 1
      stimulus: |
        "Upon this a question arises: whether it be better to be loved than feared or feared than loved? ... it is much safer to be feared than loved, when, of the two, either must be dispensed with. ... Nevertheless a prince ought to inspire fear in such a way that, if he does not win love, he avoids hatred."

        Niccolò Machiavelli, The Prince (1513), chapter XVII, translated by W. K. Marriott, 1908
      prompt: |
        Review. Machiavelli's secular, practical approach to politics reflects which development in Europe that began in the period of Unit 1?
      options:
        - "The spread of Islam into Spain"
        - "The Mongol conquest of Hungary"
        - "The revival of classical learning and the growth of city-states in Italy, which Scholastic universities had begun to feed with recovered Greek texts"
        - "The founding of the Hanseatic League"
      option_explanations:
        - |
          Islamic Spain transmitted Greek learning but did not produce Italian humanism directly.
        - |
          The Mongols reached Hungary in 1241 and left; they had no effect on Florentine political thought.
        - |
          Correct. Machiavelli was a Florentine humanist drawing on Roman history; the universities and trading cities of Unit 1 are the background.
        - |
          The Hansa was a northern commercial league, unrelated to political theory in Florence.
      answer: 2
      explanation: |
        Spiral review of 1.6: Italy's city-states and the recovery of classical texts set up the Renaissance thinking Machiavelli represents.

    # ---- Set B: Ain-i-Akbari described (3.2)
    - slug: apworld-u03-w09-q04
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge; the Ain-i-Akbari is described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the Ain-i-Akbari (c. 1590), the administrative handbook compiled by Abu'l Fazl, minister to the Mughal emperor Akbar.

        The work describes the imperial household down to the kitchens and stables; lists the mansabdars, the officers ranked by number from ten to several thousand, each paid from assigned revenues and required to maintain a stated body of cavalry; and gives, province by province, the measured area of cultivated land, the rate of assessment for each crop, and the revenue due in cash. It explains that under the settlement of the minister Todar Mal the fields were surveyed with a standard rod and the tax fixed at about one third of the average yield, payable in coin, and that local landholders (zamindars) collected from the peasants and forwarded the state's share. Throughout, Akbar is presented as a ruler of perfect wisdom and justice whose light illuminates the realm.
      prompt: |
        The revenue system described is best characterised as
      options:
        - "a tribute system in which conquered towns sent goods to the capital"
        - "tax farming sold to the highest bidder"
        - "a surveyed land tax assessed by crop and area, paid in cash, and collected through local intermediaries"
        - "a poll tax levied only on non-Muslims"
      option_explanations:
        - |
          Tribute in goods describes the Mexica; the Mughal system was a measured tax on land.
        - |
          Tax farming was the Ottoman practice; the Mughal state fixed assessments and used zamindars, not bidders.
        - |
          Correct. Survey, assessment by crop, cash payment and zamindar collection are the four features of Todar Mal's settlement.
        - |
          The jizya on non-Muslims existed at times (Akbar abolished it) but is not the land-revenue system described.
      answer: 2
      explanation: |
        The Mughal land revenue is the CED's example of a systematic tax system supporting a land-based empire.

    - slug: apworld-u03-w09-q05
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge; the Ain-i-Akbari is described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the Ain-i-Akbari (c. 1590), the administrative handbook compiled by Abu'l Fazl, minister to the Mughal emperor Akbar.

        The work describes the imperial household down to the kitchens and stables; lists the mansabdars, the officers ranked by number from ten to several thousand, each paid from assigned revenues and required to maintain a stated body of cavalry; and gives, province by province, the measured area of cultivated land, the rate of assessment for each crop, and the revenue due in cash. It explains that under the settlement of the minister Todar Mal the fields were surveyed with a standard rod and the tax fixed at about one third of the average yield, payable in coin, and that local landholders (zamindars) collected from the peasants and forwarded the state's share. Throughout, Akbar is presented as a ruler of perfect wisdom and justice whose light illuminates the realm.
      prompt: |
        The final sentence of the description most directly suggests that the Ain-i-Akbari should be read as
      options:
        - "a neutral statistical record with no political purpose"
        - "a critique of Mughal taxation by a peasant"
        - "a European traveller's account"
        - "both an administrative record and a work of legitimisation presenting the emperor as ideal"
      option_explanations:
        - |
          The statistics may be reliable, but the framing is openly celebratory.
        - |
          The author was the emperor's minister, not a peasant, and the tone is praise.
        - |
          Abu'l Fazl was a Mughal official writing in Persian.
        - |
          Correct. Abu'l Fazl served Akbar and wrote to glorify him; the handbook is evidence for administration and for the ideology of kingship at once.
      answer: 3
      explanation: |
        Sourcing: point of view (a courtier) and purpose (praise and record) make the work both data and propaganda.

    - slug: apworld-u03-w09-q06
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge; the Ain-i-Akbari is described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the Ain-i-Akbari (c. 1590), the administrative handbook compiled by Abu'l Fazl, minister to the Mughal emperor Akbar.

        The work describes the imperial household down to the kitchens and stables; lists the mansabdars, the officers ranked by number from ten to several thousand, each paid from assigned revenues and required to maintain a stated body of cavalry; and gives, province by province, the measured area of cultivated land, the rate of assessment for each crop, and the revenue due in cash. It explains that under the settlement of the minister Todar Mal the fields were surveyed with a standard rod and the tax fixed at about one third of the average yield, payable in coin, and that local landholders (zamindars) collected from the peasants and forwarded the state's share. Throughout, Akbar is presented as a ruler of perfect wisdom and justice whose light illuminates the realm.
      prompt: |
        Review. The mansabdar system's practice of paying officers from assigned land revenues most closely continues which practice of the Delhi Sultanate studied in Unit 1?
      options:
        - "The iqta, a revenue assignment granted to Turkic military commanders in return for service"
        - "The Bhakti devotional movement"
        - "The Hindu temple economy of Vijayanagara"
        - "The Chinese tributary system"
      option_explanations:
        - |
          Correct. The sultans of Delhi assigned the revenue of districts to their commanders; the Mughal mansab and jagir refined that system.
        - |
          Bhakti was a religious movement, not a way of paying soldiers.
        - |
          Vijayanagara was the southern Hindu rival, and temple endowments are not officer pay.
        - |
          The tributary system governed China's foreign relations, not Indian military pay.
      answer: 0
      explanation: |
        Spiral review of 1.3: Mughal administration built on the Delhi Sultanate's Persianate and Turkic practices.

    # ---- Standalone new content
    - slug: apworld-u03-w09-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The Tokugawa policy of paying samurai in rice stipends and requiring them to live in castle towns had which effect?
      options:
        - "It turned the samurai into an independent landed aristocracy"
        - "It abolished the samurai class entirely"
        - "It made the samurai the main merchants of Japan"
        - "It transformed a warrior class into salaried administrators dependent on their lords"
      option_explanations:
        - |
          Samurai lost their land; dependence, not independence, was the result.
        - |
          The class survived until the 1870s; it was demilitarised, not abolished.
        - |
          Samurai were forbidden to trade; merchants were a separate, lower status group that grew rich.
        - |
          Correct. With no land, no war and a stipend, the samurai became bureaucrats and the daimyo's power to rebel shrank.
      answer: 3
      explanation: |
        The salaried samurai are the CED's Japanese example of a military elite turned bureaucratic.

    - slug: apworld-u03-w09-q08
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The Qing emperors' portraits showing them as Confucian scholars, Manchu warriors and patrons of Tibetan Buddhism are best explained as
      options:
        - "evidence that the emperors could not decide on a religion"
        - "copies of European royal portraits"
        - "proof that the Qing abandoned Confucianism"
        - "an attempt to appeal separately to the Han, Manchu, Mongol and Tibetan peoples of a multi-ethnic empire"
      option_explanations:
        - |
          The variety was deliberate, not indecision.
        - |
          Jesuit painters worked at court, but the purpose and iconography were Qing.
        - |
          The Qing ruled through Confucian institutions and the examinations throughout.
        - |
          Correct. Each image addressed one constituency whose loyalty the dynasty needed.
      answer: 3
      explanation: |
        Art as legitimacy is a CED illustrative example for 3.2.

    - slug: apworld-u03-w09-q09
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which best explains why the Ottoman state turned increasingly to tax farming in the seventeenth century?
      options:
        - "Tax farming guaranteed peasants fair treatment"
        - "It provided immediate cash for wars and salaried troops as the timar cavalry system became obsolete"
        - "The sultans wished to give power to provincial governors"
        - "Islamic law required it"
      option_explanations:
        - |
          Tax farmers squeezed peasants to recover their bids; fairness was the casualty.
        - |
          Correct. Gunpowder infantry needed cash wages; selling collection rights raised money now at the cost of future control.
        - |
          Tax farmers were often financiers from the capital; the effect was to weaken, not empower, central oversight of provinces.
        - |
          Sharia set some taxes but did not mandate farming them out; it was a fiscal expedient.
      answer: 1
      explanation: |
        Tax farming is the CED's Ottoman example of a revenue system with long-term costs.

    - slug: apworld-u03-w09-q10
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The Ming Single Whip reform's requirement that taxes be paid in silver had which consequence beyond China?
      options:
        - "It ended Chinese demand for foreign goods"
        - "It caused China to adopt paper money"
        - "It created enormous Chinese demand for silver, drawing Japanese and American silver into China through global trade"
        - "It led the Ming to conquer the silver mines of Potosí"
      option_explanations:
        - |
          Demand for silver rose; China exported silk and porcelain to obtain it.
        - |
          The Ming had abandoned paper money after inflation; silver replaced it.
        - |
          Correct. Chinese silver demand is a main reason the Manila galleons and the Portuguese Japan trade existed (Unit 4).
        - |
          Potosí was Spanish; the Ming never campaigned overseas.
      answer: 2
      explanation: |
        Topic 3.2's Ming example connects to Unit 4's silver trade.

    - slug: apworld-u03-w09-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which pair correctly matches a monument with the legitimising message its builder intended?
      options:
        - "Taj Mahal: Mughal wealth and Persianate refinement under Shah Jahan"
        - "Versailles: the independence of the French nobility from the crown"
        - "Forbidden City: the equality of emperor and subject"
        - "Süleymaniye Mosque: the Ottoman sultan's conversion to Christianity"
      option_explanations:
        - |
          Correct. The mausoleum's scale and materials proclaimed what the emperor could command.
        - |
          Versailles was built to make the nobility dependent, not independent.
        - |
          The Forbidden City's axis and courtyards elevated the throne above all.
        - |
          The Süleymaniye proclaimed Sunni Islam's imperial champion.
      answer: 0
      explanation: |
        Monumental architecture in 3.2 always carries a political message; identify it.

    - slug: apworld-u03-w09-q12
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The 1649 Russian law code that bound peasants permanently to the land served the state chiefly by
      options:
        - "freeing peasants to move to Siberia"
        - "abolishing the nobility"
        - "converting peasants to Catholicism"
        - "securing labour for the service nobility and a fixed base of taxpayers for the tsar"
      option_explanations:
        - |
          The code prevented movement; flight to Siberia was illegal, though it happened.
        - |
          The nobility was strengthened by guaranteed labour and tied to state service.
        - |
          Russia was Orthodox; religion was not the code's concern.
        - |
          Correct. Serfdom paid the nobles who served the state and anchored the peasants who paid its taxes.
      answer: 3
      explanation: |
        Russian serfdom is the CED's example of coerced labour as a fiscal foundation of a land-based empire.

    # ---- Review MC
    - slug: apworld-u03-w09-q13
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Qing decision to keep the banner armies as a hereditary Manchu military caste while governing through Chinese examination officials is best explained by
      options:
        - "a shortage of Chinese willing to serve"
        - "Confucian doctrine requiring separate armies"
        - "the need of a small conquering elite to retain its own armed power while using the conquered state's institutions to rule a vast population"
        - "the Russian example at Nerchinsk"
      option_explanations:
        - |
          Chinese scholars competed fiercely for office; the issue was control, not supply.
        - |
          Confucian doctrine says nothing about ethnic armies; the arrangement was a Manchu political choice.
        - |
          Correct. The Manchus were a tiny minority; separate banners guaranteed force, and Han officials guaranteed administration and consent.
        - |
          The treaty concerned a frontier; Qing internal organisation predated it.
      answer: 2
      explanation: |
        Spiral review of 3.1 in the light of 3.2: conquest and administration were kept in different hands.

    - slug: apworld-u03-w09-q14
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Askia Muhammad's pilgrimage to Mecca (1496–1497) to legitimise his rule over Songhai repeated the strategy of which Unit 1 ruler?
      options:
        - "Mansa Musa of Mali, whose hajj of 1324 displayed his wealth and piety across the Islamic world"
        - "Kublai Khan of the Yuan"
        - "Pachacuti of the Inca"
        - "Mehmed II of the Ottomans"
      option_explanations:
