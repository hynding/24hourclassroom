      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: six land-based empires, c. 1450–1750.

        | Empire | Founder or key conqueror | Decisive event | Core army | Religion of rulers |
        |---|---|---|---|---|
        | Ottoman | Mehmed II; Suleiman | Constantinople 1453; Mohács 1526 | Janissaries (devshirme), sipahi cavalry, siege cannon | Sunni Islam |
        | Safavid | Shah Ismail; Shah Abbas I | Tabriz 1501; Chaldiran 1514 (defeat) | Qizilbash cavalry, then slave musketeers | Twelver Shia Islam |
        | Mughal | Babur; Akbar | Panipat 1526 | Cannon and matchlocks behind wagons, cavalry; Rajput allies | Sunni Islam (Akbar eclectic) |
        | Qing | Nurhaci; Kangxi | Beijing 1644 | Banner armies with cannon and muskets | Manchu shamanism, Tibetan Buddhism, Confucian state |
        | Russia | Ivan IV; Peter I | Kazan 1552; Pacific 1639 | Artillery, streltsy musketeers, Cossacks | Orthodox Christianity |
        | Songhai | Sunni Ali; Askia Muhammad | Timbuktu 1468; Tondibi 1591 (defeat) | Cavalry and river fleet; no firearms | Islam |
      prompt: |
        The Safavid row's change from "Qizilbash cavalry" to "slave musketeers" is best explained by
      options:
        - "the Safavid conversion to Sunni Islam"
        - "a Mughal invasion of Persia"
        - "the abolition of slavery in Persia"
        - "Shah Abbas's wish to end tribal chiefs' power and to match Ottoman firepower after the defeat at Chaldiran"
      option_explanations:
        - |
          The Safavids remained Shia; religion did not change the army.
        - |
          The Mughals and Safavids contested Kandahar but never invaded Persia's heartland.
        - |
          The new army was made of enslaved Georgians and Armenians; slavery expanded rather than ended.
        - |
          Correct. Chaldiran showed cavalry could not face janissary guns, and the Qizilbash chiefs threatened the shah; a slave army loyal to him solved both.
      answer: 3
      explanation: |
        Abbas copied the Ottoman devshirme model to build a gunpowder army under his own control.

    - slug: apworld-u03-w08-q06
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: six land-based empires, c. 1450–1750.

        | Empire | Founder or key conqueror | Decisive event | Core army | Religion of rulers |
        |---|---|---|---|---|
        | Ottoman | Mehmed II; Suleiman | Constantinople 1453; Mohács 1526 | Janissaries (devshirme), sipahi cavalry, siege cannon | Sunni Islam |
        | Safavid | Shah Ismail; Shah Abbas I | Tabriz 1501; Chaldiran 1514 (defeat) | Qizilbash cavalry, then slave musketeers | Twelver Shia Islam |
        | Mughal | Babur; Akbar | Panipat 1526 | Cannon and matchlocks behind wagons, cavalry; Rajput allies | Sunni Islam (Akbar eclectic) |
        | Qing | Nurhaci; Kangxi | Beijing 1644 | Banner armies with cannon and muskets | Manchu shamanism, Tibetan Buddhism, Confucian state |
        | Russia | Ivan IV; Peter I | Kazan 1552; Pacific 1639 | Artillery, streltsy musketeers, Cossacks | Orthodox Christianity |
        | Songhai | Sunni Ali; Askia Muhammad | Timbuktu 1468; Tondibi 1591 (defeat) | Cavalry and river fleet; no firearms | Islam |
      prompt: |
        Review. Songhai's capture of Timbuktu in 1468 is best understood as a continuation of which Unit 1 pattern?
      options:
        - "The spread of Christianity in Ethiopia"
        - "The rise of Swahili city-states on the Indian Ocean"
        - "West African states built on control of the trans-Saharan gold and salt trade and its market towns, as Mali had been"
        - "The Aztec tribute system"
      option_explanations:
        - |
          Ethiopia's Christian kingdom lay on the far side of the continent.
        - |
          The Swahili towns were coastal and oriented to the ocean, not the Niger bend.
        - |
          Correct. Songhai took over the trade cities, routes and Muslim scholarship that had made Mali rich.
        - |
          The Aztecs were in Mesoamerica, unconnected to West Africa.
      answer: 2
      explanation: |
        Spiral review of 1.5 and 2.4: Songhai succeeded Mali in the same economic niche.

    # ---- Standalone new content
    - slug: apworld-u03-w08-q07
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which best explains how the Manchus, a relatively small population, were able to conquer and hold Ming China after 1644?
      options:
        - "They combined a disciplined banner army with Chinese-style institutions, Confucian legitimacy and the service of Ming officials and generals"
        - "They exterminated the Han Chinese population"
        - "They were invited by the Ming emperor to rule jointly"
        - "They converted the Chinese to Islam"
      option_explanations:
        - |
          Correct. The Manchus had already built a bureaucratic state; a Ming general opened the wall to them, and they kept the examinations and claimed the Mandate of Heaven.
        - |
          The Qing ruled a Han population of over a hundred million; extermination is absurd.
        - |
          The last Ming emperor hanged himself as rebels took Beijing; there was no invitation.
        - |
          The Manchus practised shamanism and patronised Tibetan Buddhism and Confucianism; Islam was not involved.
      answer: 0
      explanation: |
        Qing success came from adopting Chinese institutions while keeping a separate Manchu military elite.

    - slug: apworld-u03-w08-q08
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Russia's expansion across Siberia between the 1580s and 1639 differed from Ottoman expansion mainly in that it
      options:
        - "relied on fur traders and Cossacks building forts among small, scattered peoples rather than on conquering populous states"
        - "used no firearms"
        - "was directed entirely by the Orthodox Church"
        - "ended in defeat at the Pacific coast"
      option_explanations:
        - |
          Correct. Siberia's peoples were few and dispersed; forts, tribute in furs and firearms sufficed, unlike the Ottoman conquest of Byzantium, Hungary and Egypt.
        - |
          Firearms were decisive against peoples who had none.
        - |
          Traders and the state led; the Church followed.
        - |
          Russians reached the Pacific in 1639 and settled it; the only check was the Qing on the Amur.
      answer: 0
      explanation: |
        Comparison of expansion types: frontier settlement versus conquest of established states.

    - slug: apworld-u03-w08-q09
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The Ottoman–Safavid conflict that began at Chaldiran in 1514 is best characterised as
      options:
        - "a purely commercial dispute over silk prices"
        - "a war between Christians and Muslims"
        - "a brief skirmish with no lasting consequences"
        - "a struggle combining Sunni–Shia religious rivalry with competition for Iraq, the Caucasus and eastern Anatolia"
      option_explanations:
        - |
          Silk mattered, but the war was fought over territory and faith.
        - |
          Both empires were Muslim; the division was within Islam.
        - |
          The rivalry lasted over a century and fixed a frontier that still roughly exists.
        - |
          Correct. Ismail's Shia state claimed the loyalty of Anatolian Turks, and both empires wanted Baghdad and the Caucasus.
      answer: 3
      explanation: |
        Rivalry between empires, including its religious dimension, is explicit CED content for 3.1.

    - slug: apworld-u03-w08-q10
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge; Babur's memoirs are described, not quoted"
      points: 1
      prompt: |
        Babur's memoir describes his army at Panipat (1526) chaining wagons together as a barrier with matchlockmen and cannon behind them while cavalry swept around the enemy's flanks. This tactic shows the Mughal conquest of India drew on
      options:
        - "the naval technology of the Portuguese"
        - "the Chinese civil service"
        - "both the gunpowder methods of the Ottomans and the mounted tactics of the Central Asian steppe"
        - "the elephant corps of the Delhi Sultanate"
      option_explanations:
        - |
          Panipat was a land battle far from the sea; no ships were involved.
        - |
          Administration came later under Akbar; the battle was won by tactics and weapons.
        - |
          Correct. Babur had Ottoman-trained gunners and a wagon fort of the Ottoman type, combined with the flanking cavalry of his Timurid and Mongol heritage.
        - |
          The elephants belonged to the losing side and panicked under fire.
      answer: 2
      explanation: |
        The Mughals were a Central Asian dynasty using the latest western Asian firepower.

    - slug: apworld-u03-w08-q11
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which empire's expansion was halted at Vienna in 1529 and again in 1683?
      options:
        - "Safavid"
        - "Mughal"
        - "Russian"
        - "Ottoman"
      option_explanations:
        - |
          The Safavids fought the Ottomans in the east and never approached Europe.
        - |
          The Mughals expanded within India and never campaigned in Europe.
        - |
          Russia expanded east and, under Peter, to the Baltic; it never attacked Vienna.
        - |
          Correct. Suleiman's siege of 1529 and Kara Mustafa's of 1683 both failed; after 1683 the Habsburgs took Hungary.
      answer: 3
      explanation: |
        Vienna marks the limit of Ottoman land expansion into Europe.

    - slug: apworld-u03-w08-q12
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which best describes the significance of Askia Muhammad's reign (1493–1528) for Songhai?
      options:
