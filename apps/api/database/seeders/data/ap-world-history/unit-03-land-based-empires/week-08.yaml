    # ---- Short answer
    - slug: apworld-u03-w08-q22
      type: short_answer
      topic_code: "3.1"
      source: "general knowledge; Busbecq's Turkish letters are described, not quoted"
      points: 3
      prompt: |
        Busbecq, the Habsburg ambassador at Suleiman's court, warned his masters in the 1550s that the Ottomans had discipline, unity and a full treasury while Christian Europe had quarrels and empty purses.

        (a) Identify ONE military or administrative practice that gave the Ottoman Empire the advantages Busbecq describes.
        (b) Explain ONE way gunpowder weapons changed the process of empire-building in the period 1450–1750.
        (c) Explain ONE limitation of Busbecq's letters as evidence about the Ottoman Empire.
      answer: |
        (a) 1 point: the devshirme and the salaried janissary corps; promotion by merit in palace service; the timar system supporting cavalry; a centralised treasury under the sultan; the use of siege artillery.
        (b) 1 point with explanation: cannon made walled cities and castles indefensible, so rulers who could afford artillery absorbed local lords and rival states (Constantinople 1453, Kazan 1552); musket armies required pay, drill and supply, which pushed rulers to build bureaucracies and tax systems; states without firearms (Songhai) were destroyed.
        (c) 1 point: he was a hostile foreign diplomat writing to persuade his own side to reform, so he exaggerates Ottoman unity and discipline; he saw the court and camp, not the provinces; he wrote during Suleiman's peak, not the later strains; his Latin letters were polished for publication decades later.
      explanation: |
        Scoring: one point per part. (b) must state a mechanism, not just 'guns helped'; (c) must tie the limitation to Busbecq's position or purpose.

    - slug: apworld-u03-w08-q23
      type: short_answer
      topic_code: "3.1"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE similarity in how the Mughal and Qing empires expanded between 1500 and 1750.
        (b) Explain ONE difference in how the Russian Empire and the Ottoman Empire expanded in the same period.
        (c) Explain ONE way rivalry between empires shaped the development of at least one land-based empire.
      answer: |
        (a) 1 point: both were founded by outsiders from the north (Timurid Central Asians; Manchus) who used gunpowder and cavalry to conquer a far larger settled population, and both kept or adopted the conquered region's administrative traditions (Persianate and Indian; Confucian).
        (b) 1 point with explanation: Russia expanded across sparsely populated Siberia through fur traders, Cossacks and forts, collecting tribute from small peoples, while the Ottomans conquered populous established states (Byzantium, Hungary, Mamluk Egypt) with large armies and siege artillery; or Russia faced little resistance until it met the Qing, while the Ottomans were checked by the Habsburgs and Safavids.
        (c) 1 point with explanation: the Ottoman–Safavid rivalry led Shah Abbas to build a gunpowder slave army after Chaldiran and fixed Persia's Shia identity; the Safavid–Mughal contest over Kandahar drained Mughal resources; the Qing–Russian meeting produced the Treaty of Nerchinsk and defined frontiers; Ottoman–Habsburg war drove both to innovate and to tax.
      explanation: |
        Scoring: one point per part. (b) and (c) need explanation of why or how, not a bare contrast or name.

    # ---- Long answer
    - slug: apworld-u03-w08-q24
      type: long_answer
      topic_code: "3.1"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which gunpowder technology explains the expansion of land-based empires in the period c. 1450 to c. 1750.

        Write a complete essay with a thesis, context, specific evidence and reasoning that considers other causes as well.
      answer: |
        Thesis (1 point): a defensible claim about extent, for example that gunpowder was necessary but not sufficient: it decided sieges and battles, but expansion also depended on recruitment systems, administration, legitimacy and the weakness of rivals.
        Contextualisation (1 point): the Mongol collapse and the Black Death; the transfer of gunpowder along the Silk Roads; the fragmentation of Anatolia, Persia and northern India; the Ming crisis of the 1630s.
        Evidence (2 points): at least two specific examples, for example cannon at Constantinople (1453); Chaldiran (1514); Panipat (1526); Kazan (1552); Tondibi (1591); Qing cannon against the Dzungars; the devshirme and janissaries; Shah Abbas's slave army; Akbar's Rajput alliances; the Manchu use of Ming generals; Cossack forts in Siberia.
        Analysis and reasoning (1 point): uses causation to connect technology to outcomes and to weigh it against other causes (recruitment, administration, religion, rivals' weakness).
        Complexity (1 point): notes that gunpowder empires were checked by each other (Vienna, Chaldiran's reverse at later wars), that Songhai's fall shows the technology's necessity while Russia's Siberian expansion shows its sufficiency only against peoples without it, or that non-military factors (Akbar's tolerance, Qing Confucian legitimacy) explain holding what guns won.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that credits gunpowder alone without weighing other causes cannot earn the complexity point.
