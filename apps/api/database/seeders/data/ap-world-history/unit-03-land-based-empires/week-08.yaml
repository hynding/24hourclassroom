week: 8
unit: 3
title: "Empires Expand, c. 1450–1750"
topics: ["3.1"]
guide: guides/week-08.md
guide_description: |
  Study guide for week 8 (CED topic 3.1): how and why land-based empires expanded between 1450 and 1750. Covers gunpowder and the gunpowder empires; the Ottoman, Safavid, Mughal, Ming and Qing, Russian and Songhai empires in order; the Ottoman–Safavid and Safavid–Mughal rivalries; and described readings of Busbecq's Turkish letters and Babur's memoirs. Spirals back to the Mongols, Dar al-Islam, the Delhi Sultanate, Mali and the Ming voyages.
flashcards_description: |
  30 cards on topic 3.1: the role of gunpowder; founders, battles and armies of the Ottoman, Safavid, Mughal, Qing, Russian and Songhai empires; the rivalries between them; and the described sources Busbecq and Babur.
flashcards:
  - front: "Gunpowder empires → which three the term names and why it also fits three others"
    back: "Ottomans, Safavids, Mughals; all three rose on cannon and musketeers. The Ming, the Qing and Russia expanded the same way, so the CED groups all six as land-based empires built with gunpowder."
    topic_code: "3.1"
  - front: "Two political effects of cannon after 1450"
    back: "Walls stopped protecting local lords, so the power with the artillery absorbed them; musket armies needed pay, drill and supply, so rulers needed revenue, bureaucracies and roads. Centralisation followed the gun."
    hint: "Think about what a castle was for."
    topic_code: "3.1"
  - front: "Where gunpowder came from and how the empires got it"
    back: "Invented in China; carried west along the Mongol-era Silk Roads; cast into siege cannon by Ottoman and European foundries by the 1400s. The empires adopted it; none invented it."
    topic_code: "3.1"
  - front: "Fall of Constantinople (1453) → who, how, result"
    back: "Mehmed II, with giant bronze cannon cast by a Hungarian engineer, breached the Theodosian walls. The city became Istanbul, the Ottoman capital, and the Byzantine Empire ended."
    topic_code: "3.1"
  - front: "Janissaries and the devshirme → recruitment and role"
    back: "A levy of Christian boys from the Balkans, converted to Islam, trained as salaried infantry with firearms and loyal only to the sultan. The core of Ottoman conquests and the model Shah Abbas copied."
    topic_code: "3.1"
  - front: "Suleiman the Magnificent's conquests → four"
    back: "Belgrade (1521), Rhodes (1522), Hungary after Mohács (1526), the failed siege of Vienna (1529); also naval war against the Habsburgs in the Mediterranean and against Portugal in the Indian Ocean."
    topic_code: "3.1"
  - front: "Selim I's conquest of Egypt (1517) → why it mattered"
    back: "Gave the Ottomans Syria, Egypt, the Red Sea and guardianship of Mecca and Medina; the sultan became the leading Sunni ruler and the empire controlled the spice routes through Cairo."
    topic_code: "3.1"
  - front: "Limits of Ottoman expansion → two dates and places"
    back: "Vienna, 1529 and 1683: both sieges failed, the second decisively; Lepanto, 1571: naval defeat in the Mediterranean. After 1683 the Habsburgs took Hungary."
    topic_code: "3.1"
  - front: "Shah Ismail and the founding of the Safavid state (1501)"
    back: "Leader of a militant Sufi order whose Qizilbash tribal cavalry took Tabriz; declared Twelver Shia Islam the religion of Persia and converted a Sunni population, often by force."
    topic_code: "3.1"
  - front: "Qizilbash → who they were and why Shah Abbas curbed them"
    back: "Turkic tribal cavalry, 'red-heads' from their caps, who made the Safavids; their chiefs became over-mighty, so Abbas built a slave army of Georgians and Armenians with muskets and cannon to replace them."
    topic_code: "3.1"
  - front: "Chaldiran (1514) → who fought, who won, lesson"
    back: "Ottomans under Selim I defeated Shah Ismail's Qizilbash cavalry with janissary muskets and artillery. Taught the Safavids that cavalry alone could not face a gunpowder army."
    topic_code: "3.1"
  - front: "Shah Abbas I (1588–1629) → three achievements"
    back: "Built a gunpowder army of enslaved Caucasians; recovered provinces from Ottomans and Uzbeks; moved the capital to Isfahan and made it a centre of trade, silk and architecture."
    topic_code: "3.1"
  - front: "Babur → ancestry, where he came from, what he founded"
    back: "Descendant of Timur and Chinggis Khan; a Timurid prince expelled from Central Asia by the Uzbeks, who took Kabul and then northern India, founding the Mughal Empire in 1526."
    topic_code: "3.1"
  - front: "Panipat (1526) → tactics that won it"
    back: "Babur chained wagons together as a barrier with matchlockmen and field cannon behind, then sent cavalry around the flanks; the Delhi Sultanate's larger army and its elephants broke."
    hint: "Mongol cavalry plus Ottoman-style guns."
    topic_code: "3.1"
  - front: "Akbar's expansion (1556–1605) → where and by what means"
    back: "Gujarat, Bengal, Rajasthan and the north Deccan; by war but also by marrying Rajput princesses and giving Rajput chiefs high rank, turning rivals into officers."
    topic_code: "3.1"
  - front: "Aurangzeb (1658–1707) → extent and cost"
    back: "Pushed the Mughal Empire to its greatest size by conquering the Deccan sultanates, but decades of war drained the treasury and alienated Marathas, Sikhs and Rajputs; the empire fragmented after 1707."
    topic_code: "3.1"
  - front: "Manchus → who they were and how they took China"
    back: "A people of the northeast (Manchuria) who built a Chinese-style state with a banner army; when peasant rebellion toppled the Ming in 1644, a Ming general opened the Great Wall and the Manchus took Beijing as the Qing."
    topic_code: "3.1"
  - front: "Qing expansion under Kangxi and his successors → four regions"
    back: "Taiwan (1683), Mongolia, Tibet and Xinjiang (after destroying the Dzungars, 1750s); the empire roughly doubled in area by 1760, using cannon and musketeers with banner cavalry."
    topic_code: "3.1"
  - front: "Treaty of Nerchinsk (1689) → parties and significance"
    back: "Qing China and Russia fixed their Amur frontier; the first treaty China made with a European power on equal terms, showing two expanding land empires meeting."
    topic_code: "3.1"
  - front: "Ivan IV's conquests → two cities and their effect"
    back: "Kazan (1552) and Astrakhan (1556), Tatar khanates taken with artillery; opened the whole Volga to Russia and the road across the Urals into Siberia."
    topic_code: "3.1"
  - front: "Russian expansion across Siberia → who, how, when reached the Pacific"
    back: "Cossacks and fur traders moving by river, building forts and collecting fur tribute (yasak) from small peoples with firearms; reached the Pacific coast in 1639."
    topic_code: "3.1"
  - front: "Peter the Great's expansion → where and what he built"
    back: "Defeated Sweden in the Great Northern War to win a Baltic coast; founded St Petersburg (1703) as a 'window on Europe'; later Catherine II took the Black Sea coast from the Ottomans."
    topic_code: "3.1"
  - front: "Songhai → founders and achievements"
    back: "Sunni Ali (1464–1492) took Timbuktu and Djenné with cavalry and a river fleet; Askia Muhammad (1493–1528) organised provinces, a Muslim court and made the hajj. The largest state in West African history."
    topic_code: "3.1"
  - front: "Tondibi (1591) → what happened and what it shows"
    back: "A Moroccan force of musketeers crossed the Sahara and destroyed the Songhai army. Shows that an empire without gunpowder could not survive against one that had it."
    topic_code: "3.1"
  - front: "Ottoman–Safavid rivalry → two dimensions and a lasting result"
    back: "Sunni versus Shia and Turk versus Persian; fought over Iraq and the Caucasus from 1514; the frontier fixed in 1639 roughly remains the Turkey–Iran border."
    topic_code: "3.1"
  - front: "Safavid–Mughal rivalry → what was contested"
    back: "Kandahar and the Afghan passes between Persia and India, which changed hands repeatedly in the 1600s."
    topic_code: "3.1"
  - front: "Why no single empire dominated Eurasia after 1450 as the Mongols had"
    back: "Several gunpowder empires of comparable strength checked each other (Ottoman–Safavid, Safavid–Mughal, Ottoman–Habsburg, Qing–Russia); rivalry consumed revenue and drove military innovation."
    topic_code: "3.1"
  - front: "Busbecq's Turkish letters → who wrote them and what they argued"
    back: "Habsburg ambassador at Suleiman's court (1554–1562); described janissary discipline and promotion by merit regardless of birth, and warned that Europe's quarrelsome nobles would lose to Ottoman unity. Admiring but hostile."
    topic_code: "3.1"
  - front: "The Baburnama → what it is evidence for"
    back: "Babur's own memoir in Chaghatai Turkish: gunpowder tactics at Panipat, Timurid and Mongol ancestry as legitimacy, and the Persianate taste (gardens, poetry) the Mughals brought to India."
    topic_code: "3.1"
  - front: "Compare how the Ottomans and the Qing justified conquest"
    back: "Ottomans: ghazi (holy war) tradition, then guardianship of the holy cities and the caliphal title. Qing: the Mandate of Heaven and Confucian rule as a new dynasty, while keeping Manchu identity separate."
    topic_code: "3.1"
quiz:
  description: |
    Week 8 quiz on CED topic 3.1 with spiral review of Units 1 and 2 · 24 questions · about 40 minutes. Stimulus sets use a described passage from Busbecq's Turkish letters and a comparison table of six land-based empires. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Busbecq described (3.1)
    - slug: apworld-u03-w08-q01
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge; Busbecq's Turkish letters are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of a passage in the Turkish letters of Ogier Ghiselin de Busbecq, Habsburg ambassador to Suleiman the Magnificent (1554–1562), published in Latin in 1581.

        Busbecq reports that at the sultan's court no honour is given to birth, and that the highest offices are held by men who were shepherds' or ploughmen's sons, promoted for ability, courage and service; he says each man is the maker of his own fortune. He describes the janissaries in camp as sober, silent and orderly, living on bread, salt and a little meat, with wine forbidden, and contrasts them with the luxury and quarrels of Christian armies. He concludes that on the Ottoman side are a full treasury, discipline and unity, and on the Christian side empty purses, disorder and division, so that the outcome of the struggle is not in doubt unless Europe reforms.
      prompt: |
        The system of promotion Busbecq describes was most directly a product of which Ottoman institution?
      options:
        - "The timar land grants to Turkish cavalry"
        - "The Safavid Qizilbash tribal levy"
        - "The devshirme, which recruited Christian boys to serve the sultan as soldiers and officials"
        - "The Chinese civil service examination"
      option_explanations:
        - |
          Timar-holders were cavalry rewarded with land; the passage is about men of no birth rising to office, which was the devshirme path.
        - |
          The Qizilbash were Safavid tribal cavalry whose chiefs were precisely hereditary; the opposite of what Busbecq describes.
        - |
          Correct. Boys taken by the devshirme owed everything to the sultan and could rise to grand vizier; birth meant nothing in that system.
        - |
          The Ottomans had no examination system; promotion was by palace training and service.
      answer: 2
      explanation: |
        The devshirme produced both the janissaries and the slave-administrators of the palace, the two things Busbecq admired.

    - slug: apworld-u03-w08-q02
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge; Busbecq's Turkish letters are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of a passage in the Turkish letters of Ogier Ghiselin de Busbecq, Habsburg ambassador to Suleiman the Magnificent (1554–1562), published in Latin in 1581.

        Busbecq reports that at the sultan's court no honour is given to birth, and that the highest offices are held by men who were shepherds' or ploughmen's sons, promoted for ability, courage and service; he says each man is the maker of his own fortune. He describes the janissaries in camp as sober, silent and orderly, living on bread, salt and a little meat, with wine forbidden, and contrasts them with the luxury and quarrels of Christian armies. He concludes that on the Ottoman side are a full treasury, discipline and unity, and on the Christian side empty purses, disorder and division, so that the outcome of the struggle is not in doubt unless Europe reforms.
      prompt: |
        Busbecq's purpose in writing most likely led him to
      options:
        - "exaggerate Ottoman weaknesses to reassure his emperor"
        - "present Ottoman institutions in an admiring light in order to shame his own side into reform"
        - "describe only the sultan's harem and gardens"
        - "ignore the janissaries entirely"
      option_explanations:
        - |
          He stresses Ottoman strengths, not weaknesses; his conclusion is a warning.
        - |
          Correct. A diplomat urging his Habsburg masters to reform had reason to paint the enemy as disciplined and united.
        - |
          The passage is about the army and promotion, not court life.
        - |
          The janissaries are the centre of his description.
      answer: 1
      explanation: |
        Sourcing: audience (the Habsburg court) and purpose (persuasion) shape an admiring account of an enemy.

    - slug: apworld-u03-w08-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge; Busbecq's Turkish letters are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of a passage in the Turkish letters of Ogier Ghiselin de Busbecq, Habsburg ambassador to Suleiman the Magnificent (1554–1562), published in Latin in 1581.

        Busbecq reports that at the sultan's court no honour is given to birth, and that the highest offices are held by men who were shepherds' or ploughmen's sons, promoted for ability, courage and service; he says each man is the maker of his own fortune. He describes the janissaries in camp as sober, silent and orderly, living on bread, salt and a little meat, with wine forbidden, and contrasts them with the luxury and quarrels of Christian armies. He concludes that on the Ottoman side are a full treasury, discipline and unity, and on the Christian side empty purses, disorder and division, so that the outcome of the struggle is not in doubt unless Europe reforms.
      prompt: |
        Review. Busbecq's praise of Ottoman discipline resembles which earlier European observer's account of a non-European army?
      options:
        - "Marco Polo's description of the Mongol army organised in tens, hundreds and thousands and able to ride for days without fire or food"
        - "Boccaccio's description of the plague in Florence"
        - "Magna Carta's clauses on scutage"
        - "Columbus's description of the Taino"
      option_explanations:
        - |
          Correct. Polo, like Busbecq, explained an Asian army's organisation and endurance to Europeans whose own armies were feudal levies.
        - |
          Boccaccio described disease and social collapse, not an army.
        - |
          Magna Carta concerns English feudal obligations, not a foreign army.
        - |
          Columbus wrote of people without iron or weapons, the reverse of a formidable army.
      answer: 0
      explanation: |
        Spiral review of 2.2: both sources are European outsiders admiring a disciplined Asian military system.

    # ---- Set B: empire comparison table (3.1)
    - slug: apworld-u03-w08-q04
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: six land-based empires, c. 1450–1750.

        | Empire | Founder or key conqueror | Decisive event | Core army | Religion of rulers |
        |---|---|---|---|---|
        | Ottoman | Mehmed II; Suleiman | Constantinople 1453; Mohács 1526 | Janissaries (devshirme), sipahi cavalry, siege cannon | Sunni Islam |
        | Safavid | Shah Ismail; Shah Abbas I | Tabriz 1501; Chaldiran 1514 (defeat) | Qizilbash cavalry, then slave musketeers | Twelver Shia Islam |
        | Mughal | Babur; Akbar | Panipat 1526 | Cannon and matchlocks behind wagons, cavalry; Rajput allies | Sunni Islam (Akbar eclectic) |
        | Qing | Nurhaci; Kangxi | Beijing 1644 | Banner armies with cannon and muskets | Manchu shamanism, Tibetan Buddhism, Confucian state |
        | Russia | Ivan IV; Peter I | Kazan 1552; Pacific 1639 | Artillery, streltsy musketeers, Cossacks | Orthodox Christianity |
        | Songhai | Sunni Ali; Askia Muhammad | Timbuktu 1468; Tondibi 1591 (defeat) | Cavalry and river fleet; no firearms | Islam |
      prompt: |
        The table best supports which generalisation about expansion in this period?
      options:
        - "Empires expanded only where the population shared the rulers' religion"
        - "Successful expansion depended on gunpowder weapons, and the empire that lacked them was destroyed"
        - "All six empires were founded by nomadic peoples"
        - "Naval power was the decisive factor in every case"
      option_explanations:
        - |
          Ottomans ruled Christians, Mughals ruled Hindus, Qing ruled Han Chinese; religion was not shared.
        - |
          Correct. Five empires list cannon or muskets; Songhai, with none, fell to Moroccan musketeers in 1591.
        - |
          The Qing had nomadic origins and the Mughals Timurid ones, but Russia and Songhai did not.
        - |
          The table shows land armies; only the Ottomans had a significant navy.
      answer: 1
      explanation: |
        The gunpowder divide is the organising idea of topic 3.1.

