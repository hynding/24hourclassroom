week: 22
unit: 6
title: "Migration and Causation in the Imperial Age"
topics: ["6.6", "6.7", "6.8"]
guide: guides/week-22.md
guide_description: |
  Why tens of millions of people moved between 1750 and 1900 (population growth, famine, the export economies'
  demand for labour, steamships), who went where (Europeans to the Americas, Indian and Chinese indentured workers
  to plantations and mines, convicts to Australia), what migration did to sending and receiving societies (gender
  roles, remittances, enclaves, exclusion laws), and the unit's causation capstone: weighing the effects of
  imperialism.
flashcards_description: |
  30 cards on the causes and types of migration, the major flows and their numbers, the effects on home and host
  societies, exclusion laws, and the causation web for the whole of unit 6.

flashcards:
  - front: Causes of migration 1750–1900 → the four the CED expects
    back: |
      Population growth that outran rural land; famine and poverty (Ireland 1845–52, Italy, Guangdong); the export economies' demand for labour after slavery's abolition (plantations, mines, railways); and industrial transport (steamships, railways) that made moving cheap and fast.
    topic_code: "6.6"
  - front: Push vs pull factors → one example each from Europe and Asia
    back: |
      Push: the Irish Potato Famine; land hunger in southern Italy; the Taiping war's devastation in China; famine in India. Pull: wages in U.S. factories and Argentine farms; contracts on Caribbean sugar estates and Malayan tin mines; gold in California and Australia.
    topic_code: "6.6"
  - front: Irish Potato Famine (1845–52) → toll and migration
    back: |
      Potato blight destroyed the crop on which the rural poor depended; about a million died and more than a million emigrated within a decade, mostly to the United States and Britain. Ireland's population fell from over 8 million to under 5 million by 1900 through continued emigration.
    topic_code: "6.6"
  - front: European emigration 1846–1940 → scale and main destinations
    back: |
      Roughly 50–55 million people left Europe, the largest migration in history to that point. Most went to the United States; Argentina, Brazil and Canada took millions more, Australia and New Zealand smaller numbers. The peak decades were 1880–1914.
    topic_code: "6.6"
  - front: Italian emigration (1876–1914) → where and the "birds of passage"
    back: |
      About 14 million Italians left, to the United States, Argentina and Brazil above all. Many were seasonal or temporary workers who returned with savings (birds of passage); Buenos Aires became in part an Italian city, and Italian-Argentine culture and dialect followed.
    topic_code: "6.6"
  - front: Indentured labour → definition and how it differed from slavery
    back: |
      A contract binding a worker for a term (usually five years) in exchange for passage and wages, with return passage sometimes promised. Unlike slavery it was time-limited and nominally voluntary, but recruiters deceived, voyages were deadly and planters enforced contracts with fines, jail and debt: semi-coerced labour.
    topic_code: "6.6"
  - front: Indian indentured migration (1834–1917) → scale and destinations
    back: |
      Over 1.3 million Indians went under indenture to Mauritius, British Guiana, Trinidad, Jamaica, Natal, Fiji, Malaya and Ceylon after Britain abolished slavery (1833–38). Many stayed, creating the large Indian-descended populations of those places. Abolished in 1917 after nationalist protest.
    topic_code: "6.6"
  - front: Chinese overseas migration in the 1800s → destinations and the "coolie trade"
    back: |
      Several million left Guangdong and Fujian for Southeast Asia (Singapore, Malaya, Java), the Americas (California gold fields, Cuban sugar, Peruvian guano and railways) and Australia. Some went freely through kin networks; the coolie trade to Cuba and Peru was often coerced, with shipboard mortality comparable to the slave trade.
    topic_code: "6.6"
  - front: Convict transportation to Australia → numbers and dates
    back: |
      Britain shipped about 160,000 convicts to New South Wales, Van Diemen's Land (Tasmania) and Western Australia between 1788 and 1868. Coerced migration that founded settler colonies; free settlers and gold-rush migrants soon outnumbered the convicts.
    topic_code: "6.6"
  - front: Japanese emigration after 1885 → where
    back: |
      Contract workers to Hawaii's sugar plantations from 1885, then farmers and labourers to the U.S. West Coast, and from 1908 to Brazil's coffee estates and to Peru. Anti-Japanese agitation in California led to the Gentlemen's Agreement of 1907 limiting entry to the United States.
    topic_code: "6.6"
  - front: Lebanese and Syrian migration (1880–1914) → pattern
    back: |
      Christians and others from Ottoman Syria left for the Americas (Brazil, Argentina, the United States) and West Africa, typically as pedlars and shopkeepers who built trading networks. An example of commercial diaspora migration rather than plantation labour.
    topic_code: "6.6"
  - front: Steamships and migration → how transport changed the flows
    back: |
      By the 1870s steamers crossed the Atlantic in about ten days at fares ordinary labourers could afford, and shipping lines competed for migrant traffic with agents in European villages. Faster, cheaper, more predictable passage made temporary and return migration possible for the first time.
    topic_code: "6.6"
  - front: Internal rural-to-urban migration → why it counts in 6.6
    back: |
      Industrialization pulled tens of millions from countryside to city within countries: Manchester, Berlin, Osaka, Buenos Aires and Bombay grew by migration more than by births. Same causes (land hunger, factory wages, railways) as international migration, shorter distance.
    topic_code: "6.6"
  - front: Male-dominated migration → effects on sending societies
    back: |
      Most long-distance migrants were men, so women in Guangdong, the Punjab, southern Italy and Ireland took over farms, trades and household authority; marriage patterns changed; and remittances sent home paid for land, houses and temples. Migration reshaped gender roles at home as well as abroad.
    topic_code: "6.7"
  - front: Remittances → what they were and why they mattered
    back: |
      Money sent home by migrants. Villages in Guangdong, Lebanon, Italy and Ireland came to depend on it; it financed land purchases, schools and religious buildings and tied sending regions to the world economy. A main channel through which migration changed the places people left.
    topic_code: "6.7"
  - front: Ethnic enclaves → three examples and their function
    back: |
      Chinatowns in San Francisco, Singapore and Lima; Little Italy in New York; Indian merchant quarters in Durban and Zanzibar. They offered housing, credit, work, temples and churches, and news from home, and preserved language and custom while producing mixed cultures (Chinese-Peruvian chifa cooking, Indo-Caribbean music).
    topic_code: "6.7"
  - front: Migrant labour and infrastructure → two railways built by migrants
    back: |
      Chinese workers built much of the Central Pacific Railroad across the Sierra Nevada (1860s); about 32,000 Indian workers built the Uganda Railway from Mombasa to Lake Victoria (1896–1901), and some stayed as East Africa's Indian community. The industrial age's infrastructure was migrant-built.
    topic_code: "6.7"
  - front: Chinese Exclusion Act (1882) → terms and significance
    back: |
      A U.S. law suspending the immigration of Chinese labourers for ten years and barring Chinese from naturalisation; renewed and tightened until repeal in 1943. The first U.S. immigration restriction aimed at a nationality, a response to nativist agitation in California.
    topic_code: "6.7"
  - front: White Australia policy (1901) → mechanism
    back: |
      The Immigration Restriction Act, among the first laws of the new Australian federation, required a dictation test in any European language chosen by the official, used to exclude Asians and Pacific Islanders without naming them. Pacific Islander sugar workers were also deported.
    topic_code: "6.7"
  - front: Nativism → definition and three examples outside the United States
    back: |
      Hostility to immigrants among the receiving population. Canada's Chinese head tax (1885, raised to $500 in 1903); the Vancouver anti-Asian riot (1907); Australia's dictation test (1901); anti-Chinese violence in Peru and Mexico; South Africa's restrictions on Indians that Gandhi organised against in Natal.
    topic_code: "6.7"
  - front: Emma Lazarus, "The New Colossus" (1883) → how to use it with the Exclusion Act
    back: |
      Her sonnet, later placed on the Statue of Liberty, welcomes "your tired, your poor, your huddled masses yearning to breathe free". Written a year after the Chinese Exclusion Act, it shows that the United States both welcomed and restricted migrants at the same time; a good contrast pair for an SAQ.
    topic_code: "6.7"
  - front: Diaspora → definition and four examples from this period
    back: |
      A people dispersed from a homeland while keeping identity and ties to it. Indian communities in the Caribbean, East Africa and Fiji; Chinese in Southeast Asia and the Americas; Irish in the United States, Britain and Australia; Lebanese in the Americas and West Africa.
    topic_code: "6.7"
  - front: Abolition of Indian indenture (1917) → why
    back: |
      Indian nationalists condemned the system as a new slavery, Gandhi having organised Indian workers in Natal against discriminatory laws; wartime shipping shortages and the Raj's wish to keep Indian loyalty led Britain to end it. An early victory for colonial nationalism over an imperial labour system.
    topic_code: "6.7"
  - front: Comparison → Atlantic slave trade vs Indian indenture
    back: |
      Similar: plantation labour, deadly voyages, workers from one continent carried to another, planter control. Different: indenture was contractual and time-limited, workers were paid, families could follow, and many returned or stayed as free people; the slave trade was hereditary and total. Indenture replaced slavery on the same estates.
    topic_code: "6.7"
  - front: Causation in the imperial age (6.8) → what the capstone asks
    back: |
      To explain the relative significance of imperialism's effects between 1750 and 1900: economic (export economies, debt), environmental (deforestation, crop transfer), political (partition, the Raj, China's semi-colonial status), social (racial hierarchies, migration), cultural (missions, Western-educated elites) and technological (railways, telegraphs). Choose and defend a ranking.
    topic_code: "6.8"
  - front: Causes of imperialism → the web to draw for 6.8
    back: |
      Industrial demand for raw materials and markets → surplus capital → nationalist rivalry after 1871 → Social Darwinism and the civilizing mission → strategic needs (Suez) → enabling technology (steam, quinine, Maxim gun, telegraph) → the weakness of the Mughal, Qing and Ottoman states. Several causes reinforcing one another.
    topic_code: "6.8"
  - front: Effects of imperialism by theme → one example each
    back: |
      ECN: monoculture and debt (Egypt, Peru). ENV: forest clearance for tea and coffee. GOV: partition of Africa; the Raj. SIO: racial hierarchies; indentured migration. CDI: missions; Western-educated elites such as the founders of the Indian National Congress (1885). TEC: railways built for export, later used by nationalists.
    topic_code: "6.8"
  - front: Argument → why economic effects of imperialism might be the most significant
    back: |
      The export economy outlived the empires: former colonies still sold the same raw materials at prices set abroad decades after independence, and debt remained a lever of outside influence. Counter-weigh with political effects (borders, states) before concluding.
    topic_code: "6.8"
  - front: Argument → why political effects of imperialism might be the most significant
    back: |
      The borders drawn between 1884 and 1914 became the states of modern Africa and the Middle East, grouping or dividing peoples with little regard for existing polities; the twentieth century's decolonization, civil wars and nationalisms grew from them. Counter-weigh with the economic argument.
    topic_code: "6.8"
  - front: Imperialism and later history → three effects that reach into units 7–9
    back: |
      Colonial troops and resources fought the world wars; Western-educated elites became the nationalist leaders of decolonization; and the global division of labour between industrial and raw-material economies shaped debates about development and globalization after 1945.
    topic_code: "6.8"

quiz:
  description: |
    25 questions · about 40 minutes · topics 6.6, 6.7 and 6.8 (the causes and effects of migration and the
    causation capstone for unit 6), with about a third of the items reviewing the rest of the unit and the
    industrial and Atlantic economies of units 4 and 5. Multiple choice, select-all and true/false items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: migration data table (6.6, 6.7)
    - slug: apworld-u06-w22-q01
      type: multiple_choice
      topic_code: "6.6"
      source: "Data table compiled for this course from standard migration estimates, rounded"
      points: 1
      stimulus: |
        Selected long-distance migration flows, 1830–1914 (approximate totals):

        | Flow | Type | Approximate number |
        |---|---|---|
        | Europe to the Americas | mostly free | 50 million |
        | Ireland to the United States and Britain, 1845–1870 | free, famine-driven | 2 million |
        | Italy to the Americas, 1876–1914 | free; many returned | 10 million |
        | India to Caribbean, Mauritius, Natal, Fiji, Malaya, 1834–1917 | indentured | 1.3 million |
        | China to Southeast Asia and the Americas | free and indentured | 3 million |
        | Britain to Australia (convicts), 1788–1868 | coerced | 160,000 |
        | Japan to Hawaii, the Americas, 1885–1914 | contract and free | 300,000 |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "Indentured migration was larger than free European migration."
        - "Free migration from Europe to the Americas was by far the largest flow, but contract and coerced migration from Asia moved millions of people to plantation and mining regions."
        - "Convict transportation was the largest coerced flow of the period."
        - "Migration from Asia was entirely coerced."
      option_explanations:
        - |
          The European flow at 50 million dwarfs the Indian indentured total of 1.3 million.
        - |
          Correct. Europe's 50 million were mostly free, while the Indian, Chinese and Japanese rows show several million moving under contract or coercion to the export economies.
        - |
          At 160,000, convict transportation was far smaller than Indian indenture or the Chinese coolie trade.
        - |
          The table marks the Chinese and Japanese flows as mixed free and contract movement.
      answer: 1
      explanation: |
        Skill: analysing data. Compare the type column with the numbers before choosing; the table distinguishes free, contract and coerced flows.

    - slug: apworld-u06-w22-q02
      type: multiple_choice
      topic_code: "6.6"
      source: "Data table compiled for this course from standard migration estimates, rounded"
      points: 1
      stimulus: |
        Selected long-distance migration flows, 1830–1914 (approximate totals):

        | Flow | Type | Approximate number |
        |---|---|---|
        | Europe to the Americas | mostly free | 50 million |
        | Ireland to the United States and Britain, 1845–1870 | free, famine-driven | 2 million |
        | Italy to the Americas, 1876–1914 | free; many returned | 10 million |
        | India to Caribbean, Mauritius, Natal, Fiji, Malaya, 1834–1917 | indentured | 1.3 million |
        | China to Southeast Asia and the Americas | free and indentured | 3 million |
        | Britain to Australia (convicts), 1788–1868 | coerced | 160,000 |
        | Japan to Hawaii, the Americas, 1885–1914 | contract and free | 300,000 |
      prompt: |
        The start date of the Indian indentured flow (1834) is best explained by
      options:
        - "the Sepoy Rebellion"
        - "the Chinese Exclusion Act"
        - "the opening of the Suez Canal"
        - "the British abolition of slavery in its colonies (1833–38), which left Caribbean and Indian Ocean planters looking for a new labour supply"
      option_explanations:
        - |
          The rebellion of 1857 came twenty-three years after the first indentured ships.
        - |
          The U.S. act of 1882 concerned Chinese labourers and had no connection to Indian indenture.
        - |
          The canal opened in 1869, thirty-five years later; it shortened the route but did not start the flow.
        - |
          Correct. Mauritius took the first indentured Indians in 1834 as emancipation approached; British Guiana and Trinidad followed, replacing enslaved labour with contract labour on the same estates.
      answer: 3
      explanation: |
        Skill: causation. Indenture was the planters' answer to abolition; the date is the clue.

    - slug: apworld-u06-w22-q03
      type: multiple_choice
      topic_code: "6.7"
      source: "Data table compiled for this course from standard migration estimates, rounded"
      points: 1
      stimulus: |
        Selected long-distance migration flows, 1830–1914 (approximate totals):

        | Flow | Type | Approximate number |
        |---|---|---|
        | Europe to the Americas | mostly free | 50 million |
        | Ireland to the United States and Britain, 1845–1870 | free, famine-driven | 2 million |
        | Italy to the Americas, 1876–1914 | free; many returned | 10 million |
        | India to Caribbean, Mauritius, Natal, Fiji, Malaya, 1834–1917 | indentured | 1.3 million |
        | China to Southeast Asia and the Americas | free and indentured | 3 million |
        | Britain to Australia (convicts), 1788–1868 | coerced | 160,000 |
        | Japan to Hawaii, the Americas, 1885–1914 | contract and free | 300,000 |
      prompt: |
        Which of the following was a long-term effect of the flow shown in the fourth row (India to the Caribbean, Mauritius, Natal, Fiji and Malaya)?
      options:
        - "The creation of large Indian-descended communities in Trinidad, Guyana, Mauritius and Fiji, with their own religious and cultural institutions"
        - "The depopulation of India"
        - "The end of sugar production in the Caribbean"
        - "The immediate independence of those colonies"
      option_explanations:
        - |
          Correct. Many indentured workers stayed after their terms; Hindu temples, mosques and Indo-Caribbean music and food are the visible results of this diaspora.
        - |
          1.3 million over eighty years was a small share of India's population of about 250–300 million.
        - |
          Indentured labour kept sugar production going after emancipation; that was its purpose.
        - |
          These colonies gained independence only after the Second World War.
      answer: 0
      explanation: |
        Skill: causation (effects). Topic 6.7's enclaves and diasporas are the human legacy of the flows in the table.

    # ---- Stimulus set B: Chinese Exclusion Act (6.7)
    - slug: apworld-u06-w22-q04
      type: multiple_choice
      topic_code: "6.7"
      source: "Primary source: Chinese Exclusion Act, 6 May 1882 (U.S. government work), U.S. National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "Whereas in the opinion of the Government of the United States the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof: Therefore, Be it enacted ... That from and after the expiration of ninety days next after the passage of this act, and until the expiration of ten years next after the passage of this act, the coming of Chinese laborers to the United States be, and the same is hereby, suspended".

        — Chinese Exclusion Act, passed by the U.S. Congress, 6 May 1882
      prompt: |
        The act is best understood as evidence of which effect of migration in the late nineteenth century?
      options:
        - "The growth of nativist hostility in receiving societies, leading to legal restriction of migrants by nationality or race"
        - "The decline of Chinese migration to Southeast Asia"
        - "The success of Chinese migrants in winning citizenship"
        - "The abolition of indentured labour"
      option_explanations:
        - |
          Correct. Agitation by white workers in California, who saw Chinese labourers as competitors, produced the first U.S. restriction aimed at a nationality; Australia and Canada passed similar measures.
        - |
          The act concerned the United States; Chinese migration to Singapore, Malaya and Java continued to grow.
        - |
          The act also barred Chinese from naturalisation; it was a defeat, not a success, for Chinese residents.
        - |
          Indenture was unaffected; Indian indenture lasted until 1917.
      answer: 0
      explanation: |
        Skill: sourcing (purpose). A law's preamble states its justification; "endangers the good order of certain localities" is nativism in legal dress.

    - slug: apworld-u06-w22-q05
      type: multiple_choice
      topic_code: "6.7"
      source: "Primary source: Chinese Exclusion Act, 6 May 1882 (U.S. government work), U.S. National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "Whereas in the opinion of the Government of the United States the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof: Therefore, Be it enacted ... That from and after the expiration of ninety days next after the passage of this act, and until the expiration of ten years next after the passage of this act, the coming of Chinese laborers to the United States be, and the same is hereby, suspended".

        — Chinese Exclusion Act, passed by the U.S. Congress, 6 May 1882
      prompt: |
        Which of the following measures in another country most closely paralleled this act?
      options:
        - "The Treaty of Nanjing"
        - "The Berlin Conference"
        - "Britain's abolition of Indian indenture in 1917"
        - "Australia's Immigration Restriction Act of 1901, which used a dictation test to exclude non-European migrants"
      option_explanations:
        - |
          Nanjing (1842) opened Chinese ports to British trade; it had nothing to do with restricting migration.
        - |
          Berlin (1884–85) set rules for European claims in Africa.
        - |
          Ending indenture responded to Indian nationalist protest against exploitation; it restricted a labour system, not migrants by race.
        - |
          Correct. The White Australia policy achieved the same end as exclusion, keeping out Asians and Pacific Islanders, by an indirect test rather than by naming a nationality.
      answer: 3
      explanation: |
        Skill: comparison. Receiving societies in the United States, Australia and Canada restricted Asian migration within two decades of one another.

    - slug: apworld-u06-w22-q06
      type: multiple_choice
      topic_code: "6.6"
      source: "Primary source: Chinese Exclusion Act, 6 May 1882 (U.S. government work), U.S. National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "Whereas in the opinion of the Government of the United States the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof: Therefore, Be it enacted ... That from and after the expiration of ninety days next after the passage of this act, and until the expiration of ten years next after the passage of this act, the coming of Chinese laborers to the United States be, and the same is hereby, suspended".

        — Chinese Exclusion Act, passed by the U.S. Congress, 6 May 1882
      prompt: |
        The "Chinese laborers" the act refers to had mostly come to the United States because of
      options:
        - "forced transportation by the Qing government"
        - "religious persecution in China"
        - "the California gold rush and railway construction, which offered wages to men from the overpopulated and war-damaged provinces of Guangdong and Fujian"
        - "an alliance between China and the United States"
      option_explanations:
        - |
          The Qing discouraged emigration until the 1890s; migrants left through kin and merchant networks, not state transport.
        - |
          Economic motives dominated; the Taiping war's devastation and land hunger pushed, gold and railway wages pulled.
        - |
          Correct. Chinese migrants mined in the 1850s and built the Central Pacific Railroad in the 1860s; by 1880 about 100,000 lived in the United States, mostly in California.
        - |
          There was no such alliance; the Burlingame Treaty of 1868 had merely allowed free migration, which the 1882 act reversed.
      answer: 2
      explanation: |
        Skill: causation. Link the law's target to the push and pull factors that brought the migrants in the first place.

    # ---- Stand-alone multiple choice (6.6–6.8 and review)
    - slug: apworld-u06-w22-q07
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which technological development most directly made mass transoceanic migration affordable for ordinary labourers after 1870?
      options:
        - "The telegraph"
        - "The steamship, which cut the Atlantic crossing to about ten days and lowered fares as shipping lines competed for migrant traffic"
        - "The spinning jenny"
        - "The Maxim gun"
      option_explanations:
        - |
          The telegraph carried news and remittance orders but did not move people.
        - |
          Correct. Steam made passage fast, cheap and predictable, which also made temporary and return migration ("birds of passage") possible.
        - |
          The spinning jenny mechanised textile production in the 1760s and had no role in transport.
        - |
          The Maxim gun (1884) mattered for conquest (week 19), not for migration.
      answer: 1
      explanation: |
        Spiral review of 5.5 (technology of the industrial age) as the means of 6.6's migration: steam turned push and pull into movement on a mass scale.

    - slug: apworld-u06-w22-q08
      type: multiple_choice
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Because most long-distance migrants between 1850 and 1914 were men, sending societies in Guangdong, the Punjab and southern Italy experienced
      options:
        - "a decline in remittances"
        - "the end of agriculture"
        - "changes in gender roles, as women took over farms, trades and household authority, supported by money sent home"
        - "mass immigration from the Americas"
      option_explanations:
        - |
          Remittances rose with migration; they were how absent men supported households.
        - |
          Farming continued, increasingly under women's management.
        - |
          Correct. The CED names changed gender roles at home as an effect of male-dominated migration; remittances were the other side of the same change.
        - |
          Return migration brought some people back, but there was no mass immigration into these regions.
      answer: 2
      explanation: |
        Skill: causation (effects on sending societies). Migration changed the places people left, not only the places they went.

    - slug: apworld-u06-w22-q09
      type: multiple_choice
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The Indian merchant communities of Durban, Zanzibar and Nairobi and the Chinatowns of Singapore and Lima are examples of
      options:
        - "indentured plantations"
        - "religious revitalization movements"
        - "colonial administrations"
        - "ethnic enclaves formed by migrants, which preserved language and religion while producing mixed cultures in the host society"
      option_explanations:
        - |
          Merchant and urban communities were distinct from plantation labour, though some grew from it.
        - |
          Revitalization movements (Ghost Dance, Xhosa cattle killing) belong to topic 6.3, not to migration.
        - |
          These were migrant communities, not governments, though they sometimes mediated between colonial rulers and local populations.
        - |
          Correct. Enclaves gave migrants credit, work, worship and news from home, and their cooking, music and festivals became part of the host society's culture.
      answer: 3
      explanation: |
        Skill: developments and processes. Enclaves and diasporas are the CED's named effects of migration on receiving societies.

    - slug: apworld-u06-w22-q10
      type: multiple_choice
      topic_code: "6.8"
      source: "general knowledge"
      points: 1
      prompt: |
        A historian arguing that the most significant effect of imperialism between 1750 and 1900 was political would most likely emphasise
      options:
        - "the price of cotton in Liverpool"
        - "the borders drawn in Africa and the Middle East between 1884 and 1914, which became the states and conflicts of the twentieth century"
        - "the spread of refrigerated shipping"
        - "the growth of Chinatowns"
      option_explanations:
        - |
          Prices are evidence for an economic argument about the export economy.
        - |
          Correct. The partition's borders, the Raj and the reduction of China to semi-colonial status reshaped political maps for a century, the core of a political-significance claim.
        - |
          Refrigerated shipping is a technological and economic development.
        - |
          Enclaves are a social effect of migration.
      answer: 1
      explanation: |
        Skill: argumentation (relative significance). Topic 6.8 asks for a ranked judgment; match the evidence to the kind of effect being claimed.

    - slug: apworld-u06-w22-q11
      type: multiple_choice
      topic_code: "6.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best illustrates how an effect of imperialism in 1750–1900 became a cause of later developments?
      options:
        - "Western-educated colonial elites, trained to staff imperial administrations, later founded nationalist organisations such as the Indian National Congress (1885)"
        - "The Maxim gun was invented in 1884"
        - "Kipling wrote a poem in 1899"
        - "The Suez Canal opened in 1869"
      option_explanations:
        - |
          Correct. Colonial schools and law courts produced lawyers and journalists who turned the empire's own ideas of liberty and nation against it, the bridge from unit 6 to units 7 and 8.
        - |
          The invention is a cause of conquest, not an effect that became a cause.
        - |
          The poem is a source illustrating ideology, not a chain of cause and effect.
        - |
          The canal is a cause of British interest in Egypt, not an effect of imperialism.
      answer: 0
      explanation: |
        Skill: causation (chains). The strongest 6.8 essays show effects turning into causes of what came next.

