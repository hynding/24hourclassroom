    # ---- Short answer (SAQ)
    - slug: apworld-u06-w22-q23
      type: short_answer
      topic_code: "6.7"
      source: "Primary sources: Emma Lazarus, The New Colossus (1883), public domain; Chinese Exclusion Act (1882), U.S. National Archives"
      points: 3
      stimulus: |
        Source 1: "Give me your tired, your poor, / Your huddled masses yearning to breathe free" — Emma Lazarus, "The New Colossus", a sonnet written in 1883 to raise money for the pedestal of the Statue of Liberty and placed on it in 1903.

        Source 2: "the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof" — preamble of the Chinese Exclusion Act, passed by the U.S. Congress, 6 May 1882.
      prompt: |
        Using the two sources, answer (a), (b) and (c).

        (a) Describe ONE difference between the attitudes toward migrants expressed in the two sources.
        (b) Explain ONE historical reason for the attitude expressed in Source 2.
        (c) Explain ONE way the contrast between the two sources reflects a broader pattern in receiving societies between 1850 and 1914.
      answer: |
        (a) Source 1 welcomes poor migrants as a matter of national pride and purpose; Source 2 treats a particular group of migrants, Chinese labourers, as a danger to public order to be kept out.
        (b) White workers in California saw Chinese migrants, who had come for gold and railway work, as competitors who accepted lower wages, and politicians in both parties courted that resentment; racial ideas that ranked Asians as unassimilable made exclusion seem reasonable.
        (c) Receiving societies both needed and feared migrants: the United States, Australia and Canada took millions of Europeans while restricting Asians (the White Australia policy, Canada's head tax), so welcome and exclusion operated at the same time and were sorted by race.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate contrast: welcome versus exclusion; universal versus targeted; migrants as a gift versus a danger. Zero for describing only one source.

        (b) 1 pt: a reason explained: labour competition in California; nativist politics; racial ideology; economic depression of the 1870s. Must be specific to Chinese exclusion, not generic prejudice.

        (c) 1 pt: a broader pattern with an example beyond the United States or beyond these two texts: selective restriction by race across settler societies; the coexistence of mass European immigration with Asian exclusion; nativism as a reaction to labour migration. Zero for restating (a).

    - slug: apworld-u06-w22-q24
      type: short_answer
      topic_code: "6.8"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE cause of imperial expansion between 1750 and 1900.
        (b) Explain ONE economic effect of imperialism on a colonised or dependent region in this period.
        (c) Explain ONE way an effect of imperialism in this period became a cause of a later development.
      answer: |
        (a) Industrial demand for raw materials and markets; or nationalist rivalry after 1871; or Social Darwinism and the civilizing mission; or new military and medical technology; or strategic needs such as the Suez route.
        (b) Export economies and monoculture: Egypt became dependent on cotton, Cuba on sugar, Peru on guano; land went to cash crops, food was imported, prices were set abroad, and debt to foreign banks gave outsiders leverage, as when Egypt's debt led to British occupation in 1882.
        (c) Western-educated colonial elites, trained for imperial administration, founded nationalist movements (the Indian National Congress, 1885) that later led decolonization; or the borders drawn in the partition of Africa became the states and conflicts of the twentieth century; or the migrations imperial economies set in motion created diasporas that shaped later politics.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a cause correctly identified. Zero for an effect (e.g. monoculture) offered as a cause.

        (b) 1 pt: an economic effect explained with a case: export dependence, debt, foreign ownership of railways and mines, the drain of wealth, famine under export policy. Must name a region.

        (c) 1 pt: a chain from an effect of imperialism to a later cause: educated elites and nationalism; colonial borders and later conflict; migration and diaspora politics; colonial troops in the world wars. Zero for a second effect with no later consequence.

    # ---- Long answer (LEQ)
    - slug: apworld-u06-w22-q25
      type: long_answer
      topic_code: "6.8"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1750 and 1900 industrial states built empires that reshaped the economies, environments, politics, societies and cultures of Africa, Asia, the Pacific and Latin America, and set tens of millions of people in motion across the world.

        Evaluate the relative significance of the effects of imperialism on the world in the period 1750–1900.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: The most significant effect of imperialism was economic, the reorganisation of much of the world into raw-material exporters tied to industrial buyers by trade, debt and foreign-owned infrastructure, because this structure outlived the empires themselves; political partition and mass migration were major effects too, but both followed from and served the economic one.

        Context: Industrialization in Britain, Europe, the United States and Japan; the earlier maritime empires' coastal posts; the weakening of the Mughal, Qing and Ottoman states.

        Body 1 (economic effects): monoculture (Egyptian cotton, Cuban sugar, Peruvian guano, Malayan rubber); the unequal treaties and the Boxer indemnity in China; British railways and loans in Argentina; Indian famines under export policy; the drain theory.

        Body 2 (political effects, weighed): the partition of Africa and its borders; the Raj; the destruction of the Zulu, Sokoto and Mahdist states; the survival of Ethiopia and Siam; Japan as a new empire. Significant, but the borders mattered because of the economies inside them.

        Body 3 (social and demographic effects, weighed): indentured and free migration creating diasporas; gender roles at home; exclusion laws; racial hierarchies in colonies. Significant for the societies of the Caribbean, East Africa and Southeast Asia, and caused by the labour demands of the export economy.

        Complexity: effects differed by region (settler colonies versus colonies of rule versus semi-colonies); some effects became causes (educated elites, nationalism); environmental damage as a long-term cost.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim ranking at least one effect above others with a reason. Zero for "imperialism had many effects" or a list with no ranking.

        Contextualization (0–1): industrialization; earlier empires; the decline of the land-based empires; nationalism and the ideologies of 6.1.

        Evidence (0–2): 1 pt for at least two specific examples across the unit (Treaty of Nanjing, Berlin Conference, Congo rubber, Java's cultivation system, Indian famines, indenture, Chinese Exclusion Act, Adwa, the Raj, Argentine railways, Roosevelt Corollary). 2 pts for using evidence to support the ranking.

        Analysis and reasoning (0–2): 1 pt for causation used to structure the argument (causes, effects, relative weight). 1 pt for complexity: explaining how effects interacted or became causes; comparing regions; acknowledging and answering the strongest alternative ranking; considering effects on the imperial powers themselves (nationalism, cheap raw materials, nativism).

        Common errors: a list of effects without a judgment; treating China or Argentina as colonies; omitting migration; ignoring effects on Europe, the United States and Japan.
