week: 19
unit: 6
title: "Rationales for Imperialism and State Expansion"
topics: ["6.1", "6.2"]
guide: guides/week-19.md
guide_description: |
  Why industrial states built empires after 1750 and how they did it: the economic, nationalist, racial,
  religious and strategic rationales (Hobson, Kipling, the civilizing mission, Social Darwinism), and the four
  patterns of expansion: company to crown in India and Java, settler colonies, the partition of Africa after
  Berlin, and the new empires of the United States, Russia and Japan.
flashcards_description: |
  28 cards on the rationales for imperialism, the Berlin Conference, the shift from company to Crown rule,
  settler colonies, and the expansion of the United States, Russia and Japan.

flashcards:
  - front: New imperialism → dates and what was new about it
    back: |
      The burst of formal empire-building from about 1870 to 1914, above all the partition of Africa and Southeast Asia. Europeans had held colonies since the 1500s; what was new was the speed, the scale and the industrial technology (steamships, quinine, Maxim guns, telegraphs) that made conquering interiors cheap.
    topic_code: "6.2"
  - front: Social Darwinism → how it was used to justify empire
    back: |
      Writers such as Herbert Spencer applied "survival of the fittest" to nations and races, claiming that supposedly fitter peoples were entitled to rule or replace others. It made conquest seem natural and scientific and fed pseudo-scientific racism.
    topic_code: "6.1"
  - front: Civilizing mission (mission civilisatrice) → the claim and the reality
    back: |
      The claim that colonial rule brought Christianity, law, schools, medicine and railways to peoples who could not provide them. In practice it justified rule by a small foreign elite, forced labour and the suppression of local institutions, though missions did build schools and hospitals.
    topic_code: "6.1"
  - front: Hobson, Imperialism (1902) → his central argument
    back: |
      A British critic of empire who argued that under-consumption at home pushed financiers to seek foreign markets and investments, "the taproot of Imperialism". Empire benefited investors and arms makers, not the nation as a whole. Lenin built on him in 1917.
    hint: economic explanation; a critic, not a supporter
    topic_code: "6.1"
  - front: Kipling, "The White Man's Burden" (1899) → purpose and audience
    back: |
      A poem published in McClure's Magazine urging the United States to keep the Philippines after the war with Spain. It frames empire as a thankless duty toward "new-caught, sullen peoples, half-devil and half-child", a classic statement of the civilizing mission with racial hierarchy underneath.
    topic_code: "6.1"
  - front: Twain, "To the Person Sitting in Darkness" (1901) → what it argued
    back: |
      Mark Twain's satire of imperialism, written against the American war in the Philippines and the Boxer-era interventions in China. It mocked empire as a profitable "game" dressed up as civilization and shows that anti-imperialist opinion existed within the imperial powers themselves.
    topic_code: "6.1"
  - front: Nationalism as a cause of imperialism → two examples after 1871
    back: |
      After unification, Germany claimed Togo, Cameroon, Namibia and Tanganyika in 1884–85 to show great-power standing; France sought colonies in Africa and Indochina partly to recover prestige after losing Alsace-Lorraine to Germany in 1871. Colonies became a measure of national greatness.
    topic_code: "6.1"
  - front: Religious motives for empire → missionary expansion and David Livingstone
    back: |
      Protestant and Catholic missionary societies multiplied after 1800. Livingstone's travels in Africa (1840s–1873) linked missions, anti-slavery and exploration in the British imagination, and the Berlin Act's promise to suppress the slave trade gave conquest a humanitarian face.
    topic_code: "6.1"
  - front: Technologies that made the conquest of Africa and Asia cheap → list four
    back: |
      Quinine against malaria; steam gunboats that could go up rivers such as the Niger and Yangzi; breech-loading rifles and the Maxim machine gun (1884); and telegraph cables and railways that let a metropole govern distant colonies. Together they turned European military advantage into overwhelming superiority.
    topic_code: "6.2"
  - front: Strategic rationale → why Britain occupied Egypt in 1882
    back: |
      The Suez Canal (1869) was the short route to India, and Egypt's debt crisis and a nationalist revolt under Urabi threatened control of it. Britain occupied Egypt to protect the canal and stayed until the 1950s, an example of empire driven by the defence of routes and coaling stations.
    topic_code: "6.2"
  - front: East India Company to the Raj → what changed in 1858
    back: |
      After the rebellion of 1857–58, Parliament abolished the Company's rule and the Crown took direct control of India through a Viceroy and a Secretary of State. In 1876 Victoria was proclaimed Empress of India. The sepoy army was reorganised with more British troops and recruitment from "martial races".
    topic_code: "6.2"
  - front: Dutch East India Company (VOC) to Dutch state rule → dates and the cultivation system
    back: |
      The VOC went bankrupt in 1799 and the Dutch state took over Java and the archipelago. From 1830 the cultivation system forced Javanese villages to grow export crops (sugar, coffee, indigo) on a share of their land for the government, which paid for the Netherlands' own industrial growth.
    topic_code: "6.2"
  - front: Royal Niger Company → an example of company rule ending
    back: |
      A British chartered company that governed and traded on the lower Niger from 1886. Its charter was revoked in 1900 and Britain made Nigeria a protectorate, the same company-to-crown path as India and Java, compressed into fifteen years.
    topic_code: "6.2"
  - front: Settler colony → definition and three examples
    back: |
      A colony where large numbers of migrants from the metropole took land to farm and stay, displacing indigenous peoples. Australia (convicts from 1788, then free settlers), New Zealand (Treaty of Waitangi 1840, then land wars) and French Algeria (conquered from 1830, legally part of France, about a million Europeans by 1900).
    topic_code: "6.2"
  - front: Treaty of Waitangi (1840) → what it was and what followed
    back: |
      An agreement between the British Crown and Maori chiefs that, in its English text, ceded sovereignty while guaranteeing Maori land; the Maori text differed. Settler demand for land led to the New Zealand Wars (1845–1872) and large confiscations.
    topic_code: "6.2"
  - front: French Algeria → how it differed from most African colonies
    back: |
      Conquered from 1830, Algeria was annexed as departments of France itself, not held as a colony, and settled by about a million Europeans (colons) by 1900 who took the best land. That made decolonization in 1954–62 a war rather than a negotiation.
    topic_code: "6.2"
  - front: Berlin Conference (1884–85) → what it decided and what it did not
    back: |
      It set rules for claiming African territory: a power must notify the others and show "effective occupation", and the Congo basin was recognised as Leopold II's personal Congo Free State with free trade and a pledge to end the slave trade. It did not draw most of Africa's borders; the scramble that followed did. No African ruler attended.
    topic_code: "6.2"
  - front: Scramble for Africa → share of the continent under European control in 1870 and 1914
    back: |
      About a tenth in 1870, mostly coastal; by 1914 everything except Ethiopia and Liberia. Britain ran a chain from Egypt to the Cape, France held most of the north and west, Belgium's king the Congo, Portugal Angola and Mozambique, Germany and Italy the rest.
    topic_code: "6.2"
  - front: Congo Free State → who owned it and why that mattered
    back: |
      From 1885 the personal possession of King Leopold II of Belgium, not of the Belgian state. Without parliamentary oversight his agents ran a forced-labour rubber regime enforced by hostage-taking and mutilation; international protest led Belgium to annex it in 1908.
    topic_code: "6.2"
  - front: Siam (Thailand) → why it stayed independent
    back: |
      Kings Mongkut and Chulalongkorn modernised the army, administration and law, ceded border provinces to France and Britain, and benefited from both powers' preference for a buffer state between French Indochina and British Burma and Malaya.
    topic_code: "6.2"
  - front: French Indochina → how and when it was assembled
    back: |
      France took Cochinchina (southern Vietnam) in 1862, made Cambodia a protectorate in 1863, took the rest of Vietnam in the 1880s and Laos in 1893, uniting them as the Indochinese Union. Conquest was justified by protecting Catholic missionaries and opening the Mekong and Red River trade.
    topic_code: "6.2"
  - front: United States overseas expansion → four acquisitions between 1867 and 1899
    back: |
      Alaska bought from Russia (1867); Hawaii annexed (1898) after planters overthrew Queen Liliuokalani in 1893; Puerto Rico, Guam and the Philippines taken from Spain in 1898; and the Philippine-American War (1899–1902) fought against Filipino independence forces.
    topic_code: "6.2"
  - front: Russian expansion in Central Asia → key dates and motives
    back: |
      Tashkent fell in 1865, Samarkand in 1868, Khiva in 1873 and the Turkmen lands by 1884. Motives: cotton for Russian mills after the American Civil War cut supplies, security of the frontier, and rivalry with Britain in Afghanistan (the "Great Game"). Settlers followed along the Trans-Siberian Railway (begun 1891).
    topic_code: "6.2"
  - front: Japan's empire by 1910 → the sequence of acquisitions
    back: |
      Ryukyu Islands annexed (1879); Taiwan taken from China after the Sino-Japanese War (1895); southern Sakhalin and a sphere in Manchuria after defeating Russia (1905); Korea made a protectorate (1905) and annexed (1910). Japan became the first non-Western industrial imperial power.
    topic_code: "6.2"
  - front: Meiji Constitution (1889) → what it says about the emperor
    back: |
      Drafted under Ito Hirobumi on Prussian models and translated into English by Ito Miyoji, it declared the emperor "sacred and inviolable" and "the head of the Empire, combining in Himself the rights of sovereignty", with a two-house Diet whose powers were limited. It gave Japan a centralised state capable of imperial expansion.
    topic_code: "6.2"
  - front: Direct rule vs indirect rule → definitions and one example each
    back: |
      Direct rule: officials from the metropole govern at every level, as in French West Africa, where chiefs became salaried agents. Indirect rule: existing rulers are kept in office under a colonial resident, as in the emirates of northern Nigeria under Lugard or India's princely states.
    topic_code: "6.2"
  - front: Omdurman (1898) → what it shows about technology and empire
    back: |
      An Anglo-Egyptian army with Maxim guns, artillery and gunboats killed about 10,000 Mahdist soldiers on the Nile in a single morning while losing fewer than 50 men. It is the standard example of how industrial weapons made the late-century conquests so lopsided.
    topic_code: "6.2"
  - front: Causation chain → from industrialization to the scramble for Africa
    back: |
      Factories demand raw materials and markets → bankers seek foreign investments → rival nation-states compete for standing → steamships, quinine and machine guns make conquest cheap → Berlin's "effective occupation" rule rewards speed → almost all of Africa partitioned by 1900. Several causes, reinforcing one another.
    topic_code: "6.1"

quiz:
  description: |
    21 questions · about 35 minutes · topics 6.1 and 6.2 (the rationales for imperialism and how states expanded),
    with about a third of the items reviewing industrialization, the Enlightenment and the land-based empires from
    units 3 and 5. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items
    are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set A: Kipling, The White Man's Burden (6.1)
    - slug: apworld-u06-w19-q01
      type: multiple_choice
      topic_code: "6.1"
      source: "Primary source: Rudyard Kipling, The White Man's Burden (1899), in The Five Nations (1903), Project Gutenberg eBook #60260"
      points: 1
      stimulus: |
        "Take up the White Man's burden—
        Send forth the best ye breed—
        Go bind your sons to exile
        To serve your captives' need;
        To wait in heavy harness
        On fluttered folk and wild—
        Your new-caught, sullen peoples,
        Half-devil and half-child."

        — Rudyard Kipling, "The White Man's Burden", 1899, a poem addressed to the United States after its victory over Spain
      prompt: |
        The poem's description of colonised peoples as "Half-devil and half-child" most directly reflects which ideology of the late nineteenth century?
      options:
        - "Marxist socialism, which saw colonised workers as allies of the European proletariat"
        - "A racial hierarchy derived from Social Darwinism and pseudo-scientific racism, which ranked peoples as more or less fit to govern themselves"
        - "Mercantilism, which measured a nation's wealth by its stock of gold and silver"
        - "Enlightenment deism, which rejected all religious justification for rule"
      option_explanations:
        - |
          Socialists of the period were generally critics of empire; the poem's purpose is to urge the United States to take up colonial rule, not to see the colonised as comrades.
        - |
          Correct. Calling peoples "half-devil and half-child" treats them as both dangerous and immature, a ranking of races that Social Darwinists used to argue that "fitter" nations had a duty and a right to rule.
        - |
          Mercantilist thinking about bullion belongs to the 1500s–1700s and says nothing about the character of colonised peoples.
        - |
          The poem's language of burden and duty is moral and quasi-religious; it is the opposite of a rejection of moral justification.
      answer: 1
      explanation: |
        Skill: sourcing (point of view). The phrase packs the racial assumptions of the civilizing mission into four words; naming the ideology behind them is the first move on any imperialism question.

    - slug: apworld-u06-w19-q02
      type: multiple_choice
      topic_code: "6.1"
      source: "Primary source: Rudyard Kipling, The White Man's Burden (1899), in The Five Nations (1903), Project Gutenberg eBook #60260"
      points: 1
      stimulus: |
        "Take up the White Man's burden—
        Send forth the best ye breed—
        Go bind your sons to exile
        To serve your captives' need;
        To wait in heavy harness
        On fluttered folk and wild—
        Your new-caught, sullen peoples,
        Half-devil and half-child."

        — Rudyard Kipling, "The White Man's Burden", 1899, a poem addressed to the United States after its victory over Spain
      prompt: |
        The historical situation in which Kipling published the poem was most directly
      options:
        - "the Berlin Conference's division of the Congo basin"
        - "the sepoy rebellion against the East India Company"
        - "the American debate over whether to annex the Philippines after the war with Spain"
        - "Japan's annexation of Korea"
      option_explanations:
        - |
          The Berlin Conference met in 1884–85, fifteen years earlier, and concerned European claims in Africa, not the United States.
        - |
          The rebellion of 1857–58 was forty years earlier and concerned British India; it is not the poem's setting.
        - |
          Correct. Kipling published the poem in February 1899 as the U.S. Senate debated the treaty with Spain; "new-caught" peoples are the Filipinos, and the poem urges Americans to accept the burden of ruling them.
        - |
          Japan annexed Korea in 1910, eleven years after the poem.
      answer: 2
      explanation: |
        Skill: historical situation. A source's date and audience point to the event it responds to; 1899 plus an address to Americans means the Philippine question.

    - slug: apworld-u06-w19-q03
      type: multiple_choice
      topic_code: "6.1"
      source: "Primary source: Rudyard Kipling, The White Man's Burden (1899), in The Five Nations (1903), Project Gutenberg eBook #60260"
      points: 1
      stimulus: |
        "Take up the White Man's burden—
        Send forth the best ye breed—
        Go bind your sons to exile
        To serve your captives' need;
        To wait in heavy harness
        On fluttered folk and wild—
        Your new-caught, sullen peoples,
        Half-devil and half-child."

        — Rudyard Kipling, "The White Man's Burden", 1899, a poem addressed to the United States after its victory over Spain
      prompt: |
        Which of the following writers of the same period would most directly have challenged the poem's argument?
      options:
        - "A British missionary society secretary describing the schools built in Uganda"
        - "A French colonial minister explaining the mission civilisatrice to the Chamber of Deputies"
        - "A Social Darwinist arguing that empire was the natural result of competition among races"
        - "J. A. Hobson, arguing in 1902 that empire served financiers seeking foreign investments rather than any civilizing purpose"
      option_explanations:
        - |
          Missionary reports generally supported the idea that colonial rule carried a duty to improve, which is the poem's own claim.
        - |
          The French civilizing mission is the same idea in French; a minister defending it would agree with Kipling, not challenge him.
        - |
          Social Darwinism is the racial hierarchy the poem assumes; it supplied the argument rather than opposing it.
        - |
          Correct. Hobson's Imperialism (1902) argued that the "taproot" of empire was economic, the search for outlets for surplus capital, and that talk of duty disguised the interests of investors.
      answer: 3
      explanation: |
        Skill: claims and evidence across sources. The exam often pairs a justification of empire with a contemporary critic; know Hobson and Twain as the critics of 1899–1902.

    # ---- Stimulus set B: colonial holdings table (6.2)
    - slug: apworld-u06-w19-q04
      type: multiple_choice
      topic_code: "6.2"
      source: "Data table compiled for this course from standard estimates of colonial area and population in 1914, rounded"
      points: 1
      stimulus: |
        Colonial empires in 1914 (approximate, excluding the metropole):

        | Imperial power | Colonial area (million sq km) | Colonial population (millions) |
        |---|---|---|
        | Britain | 33 | 400 |
        | France | 11 | 55 |
        | Germany | 3 | 12 |
        | Belgium (Congo) | 2.4 | 15 |
        | Portugal | 2.1 | 9 |
        | Netherlands | 2.0 | 40 |
        | Italy | 1.6 | 2 |
        | Japan | 0.3 | 20 |
        | United States (overseas) | 0.3 | 10 |

        Figures rounded; Russia's contiguous Asian territories are not counted as colonies here.
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "The Netherlands ruled more colonial territory than France."
        - "Colonial population was always proportional to colonial area."
        - "Germany, which unified only in 1871, had acquired the second-largest colonial empire by 1914."
        - "Britain's empire was by far the largest by both area and population, while the latecomers Germany, Italy and Japan held comparatively little."
      option_explanations:
        - |
          The Netherlands held 2 million square kilometres to France's 11; what it had was a very populous colony (Java), not a large one.
        - |
          The Netherlands (small area, 40 million people) and Italy (larger area, 2 million people) show the opposite: population depended on which lands were taken, not their size.
        - |
          Germany's 3 million square kilometres were far behind Britain's 33 and France's 11; it was a latecomer with modest holdings.
        - |
          Correct. Britain held roughly three times France's area and more than seven times its colonial population; the states that unified or industrialised late held small empires.
      answer: 3
      explanation: |
        Skill: analysing data. Read both columns before choosing; the table rewards comparing area and population separately.

    - slug: apworld-u06-w19-q05
      type: multiple_choice
      topic_code: "6.2"
      source: "Data table compiled for this course from standard estimates of colonial area and population in 1914, rounded"
      points: 1
      stimulus: |
        Colonial empires in 1914 (approximate, excluding the metropole):

        | Imperial power | Colonial area (million sq km) | Colonial population (millions) |
        |---|---|---|
        | Britain | 33 | 400 |
        | France | 11 | 55 |
        | Germany | 3 | 12 |
        | Belgium (Congo) | 2.4 | 15 |
        | Portugal | 2.1 | 9 |
        | Netherlands | 2.0 | 40 |
        | Italy | 1.6 | 2 |
        | Japan | 0.3 | 20 |
        | United States (overseas) | 0.3 | 10 |

        Figures rounded; Russia's contiguous Asian territories are not counted as colonies here.
      prompt: |
        The Netherlands' colonial population of about 40 million is best explained by
      options:
        - "its control of the densely populated island of Java, where Dutch rule grew out of the East India Company's trading posts"
        - "its conquest of the Congo basin at the Berlin Conference"
        - "large-scale Dutch settlement of the East Indies by farmers from the Netherlands"
        - "its annexation of Korea and Taiwan"
      option_explanations:
        - |
          Correct. Java had a large population before Dutch rule, and the Dutch state inherited the VOC's position there in 1799; a small area can hold many people.
        - |
          The Congo went to Leopold II of Belgium, not the Netherlands.
        - |
          The East Indies were a colony of rule, not a settler colony; Dutch settlers were few and the population counted is Javanese and other islanders.
        - |
          Korea and Taiwan were taken by Japan (1910 and 1895).
      answer: 0
      explanation: |
        Skill: causation from data. Ask where a power's colonial population lived; for the Netherlands the answer is Java, acquired through the company-to-crown path.

