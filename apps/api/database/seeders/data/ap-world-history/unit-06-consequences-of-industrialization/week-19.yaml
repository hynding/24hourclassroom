    # ---- Short answer (SAQ)
    - slug: apworld-u06-w19-q22
      type: short_answer
      topic_code: "6.1"
      source: "Primary source: J. A. Hobson, Imperialism: A Study (London, 1902; New York: James Pott, 1902), Library of Economics and Liberty"
      points: 3
      stimulus: |
        "It is this economic condition of affairs that forms the taproot of Imperialism." Hobson goes on to conclude that "Imperialism is the endeavour of the great controllers of industry to broaden the channel for the flow of their surplus wealth by seeking foreign markets and foreign investments".

        — J. A. Hobson, British economist and journalist, Imperialism: A Study, 1902
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Describe Hobson's explanation of the cause of imperialism as shown in the excerpt.
        (b) Explain ONE rationale for imperialism, other than the economic one, that was widely used in the period 1750–1900.
        (c) Explain ONE way in which the historical situation of 1902 might have shaped Hobson's argument.
      answer: |
        (a) Hobson argues that imperialism grows from an economic condition at home: industrialists and financiers who cannot profitably use their surplus wealth seek foreign markets and investments, and push their governments to acquire territory to secure them.
        (b) Social Darwinism and racial ideology: writers applied "survival of the fittest" to nations and races and argued that supposedly fitter peoples had a right and duty to rule others; or the civilizing mission, the claim that colonial rule brought Christianity, law and science to those who lacked them, as in Kipling's "White Man's Burden"; or nationalism, the pursuit of colonies as marks of great-power status after 1871.
        (c) Hobson wrote during and just after the South African (Boer) War of 1899–1902, which he had reported on and which he believed had been fought in the interests of gold and diamond financiers; the war's cost and controversy made a financial explanation of empire persuasive to British readers.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate description of the economic argument: surplus capital or wealth seeking foreign outlets (markets, investments), with industrialists or financiers as the drivers. Zero for "greed" with no mechanism.

        (b) 1 pt: a non-economic rationale explained, not just named: Social Darwinism, the civilizing mission or Christianity, nationalism and prestige, or strategic security of routes. Must say how it justified expansion.

        (c) 1 pt: a plausible link between 1902 and the argument: the Boer War and the gold-mining interests; the recent scramble for Africa and its costs; growing domestic criticism of empire; Hobson's audience of British liberals. Zero for "he was biased" without a historical situation.

    - slug: apworld-u06-w19-q23
      type: short_answer
      topic_code: "6.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        Map description: A map of Africa titled "European claims, 1884 and 1914" shows two layers. In the 1884 layer, European holdings are thin coastal strips: French Algeria and Senegal, British Cape Colony, the Gold Coast and Lagos, Portuguese Angola and Mozambique, and a few forts; the interior is unshaded. In the 1914 layer the whole continent is shaded by power except two unshaded areas labelled Ethiopia and Liberia. A chain of British territory runs from Egypt through the Sudan, Uganda and Kenya to Rhodesia and South Africa, interrupted only by German East Africa; French territory covers most of the west and north; the Congo Free State is labelled "Belgium (1908)".
      prompt: |
        Using the map description, answer (a), (b) and (c).

        (a) Identify ONE change between the 1884 and 1914 layers shown on the map.
        (b) Explain ONE cause of that change.
        (c) Explain ONE reason that the two unshaded areas remained outside European control in 1914.
      answer: |
        (a) In 1884 European control was limited to coastal strips; by 1914 the entire continent except Ethiopia and Liberia had been partitioned among European powers, with Britain holding a near-continuous chain from Egypt to South Africa.
        (b) The Berlin Conference's rule of effective occupation rewarded speed, so the powers raced to sign treaties and station troops; industrial technology (quinine, steamboats, Maxim guns, railways) made conquest of the interior cheap; and nationalist rivalry after 1871 made colonies symbols of status.
        (c) Ethiopia under Menelik II modernised its army with imported rifles and defeated the Italian invasion at Adwa in 1896, forcing Italy to recognise its independence; Liberia had been founded for freed American slaves and enjoyed informal American protection.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific change read from the map: coastal strips to full partition; the British Cape-to-Cairo chain; the Congo passing to Belgium; only two independent states left. Zero for restating "Europeans took Africa" without reference to the layers.

        (b) 1 pt: a cause explained: Berlin's effective-occupation rule and the resulting race; industrial military and medical technology; nationalist rivalry; economic demand for raw materials; strategic concerns such as the Suez route. Must connect cause to the change.

        (c) 1 pt: an accurate reason for Ethiopia (Adwa 1896, Menelik's modern army and diplomacy) or Liberia (American foundation and protection). Zero for claiming Europeans were not interested in them.

