    # ---- Stand-alone multiple choice (6.1, 6.2 and review)
    - slug: apworld-u06-w19-q07
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The British government's assumption of direct rule over India in 1858 was most directly a response to
      options:
        - "the Berlin Conference's rules on effective occupation"
        - "the opening of the Suez Canal"
        - "the rebellion of 1857–58, which convinced Parliament that the East India Company could not be trusted with an empire"
        - "pressure from Indian nationalists for self-government"
      option_explanations:
        - |
          Berlin (1884–85) concerned Africa and came a generation later.
        - |
          The canal opened in 1869, eleven years later, and concerned the route to India rather than how India was governed.
        - |
          Correct. The uprising that began among sepoys at Meerut spread across northern India; after its suppression the Government of India Act (1858) abolished Company rule and created the Raj.
        - |
          The Indian National Congress was founded in 1885 and did not demand self-government until later; the change of 1858 was a British decision about the Company.
      answer: 2
      explanation: |
        Skill: causation. The company-to-crown transition had a trigger; name the event and the law.

    - slug: apworld-u06-w19-q08
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes what the Berlin Conference of 1884–85 decided?
      options:
        - "It drew the precise borders of every African colony and assigned them to the European powers."
        - "It returned the Congo basin to African rule under international supervision."
        - "It set rules for European claims in Africa, including notification of other powers and effective occupation, and recognised Leopold II's Congo Free State."
        - "It created the League of Nations mandate system for former German colonies."
      option_explanations:
        - |
          The conference set rules for claiming territory; most borders were drawn afterwards by bilateral treaties and conquest during the scramble.
        - |
          The Congo basin went to King Leopold II as a personal possession, with free trade for all powers; no African ruler took part.
        - |
          Correct. The General Act required a power to notify others of a claim and to establish effective authority, which set off the race to sign treaties and station troops; it also recognised the Congo Free State and pledged to suppress the slave trade.
        - |
          Mandates came with the League of Nations in 1919–20, after the First World War.
      answer: 2
      explanation: |
        Skill: developments and processes. Distinguish what Berlin did (rules, the Congo) from what it is often said to have done (draw the map).

    - slug: apworld-u06-w19-q09
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        French Algeria and British Nigeria differed most in that
      options:
        - "Algeria was settled by about a million Europeans and annexed to France, while Nigeria was governed by a small number of officials through indirect rule over a large African population"
        - "Nigeria was legally part of Britain while Algeria remained a protectorate"
        - "Algeria was acquired by purchase while Nigeria was conquered"
        - "Nigeria's colonial economy depended on mining while Algeria's depended on rubber"
      option_explanations:
        - |
          Correct. Algeria was a settler colony made into French departments; Nigeria was a colony of rule where Lugard kept northern emirs in office under British residents.
        - |
          The reverse: Algeria was annexed as departments of France; Nigeria was a protectorate and colony, never part of Britain.
        - |
          Both were conquered, Algeria from 1830 and Nigeria by stages through the 1890s–1900s.
        - |
          Nigeria's exports were palm oil, cocoa and groundnuts; Algeria's were wine and wheat from settler farms. Neither fits the option.
      answer: 0
      explanation: |
        Skill: comparison. The settler colony versus colony-of-rule distinction explains why decolonization later took such different forms.

    - slug: apworld-u06-w19-q10
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which sequence correctly orders Japan's imperial acquisitions?
      options:
        - "Taiwan taken from China; Korea annexed; Ryukyu Islands annexed"
        - "Korea annexed; Ryukyu Islands annexed; Taiwan taken from China"
        - "Korea annexed; Taiwan taken from China; Ryukyu Islands annexed"
        - "Ryukyu Islands annexed (1879); Taiwan taken from China (1895); Korea annexed (1910)"
      option_explanations:
        - |
          The Ryukyu Islands were the first acquisition, not the last.
        - |
          Korea came last and the Ryukyus first; this order is reversed.
        - |
          Korea was the last of the three, annexed in 1910 after being made a protectorate in 1905.
        - |
          Correct. The Ryukyus were absorbed in 1879, Taiwan ceded by the Treaty of Shimonoseki in 1895 and Korea annexed in 1910 after Japan defeated Russia.
      answer: 3
      explanation: |
        Skill: developments and processes. Japan's expansion followed its victories over China (1895) and Russia (1905); the order tracks those wars.

    - slug: apworld-u06-w19-q11
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which industrial-era technology most directly enabled European armies to defeat much larger African forces such as the Mahdists at Omdurman in 1898?
      options:
        - "The spinning jenny and the power loom"
        - "The Bessemer process for cheap steel alone"
        - "Breech-loading rifles and the Maxim machine gun, which delivered sustained fire that spear- and musket-armed forces could not match"
        - "The telephone"
      option_explanations:
        - |
