        Figures rounded; Russia's contiguous Asian territories are not counted as colonies here.
      prompt: |
        The presence of Japan and the United States in the table is most significant as evidence that
      options:
        - "imperial expansion after 1850 was carried out only by Western European states"
        - "non-European and recently industrialised states also built overseas empires in this period"
