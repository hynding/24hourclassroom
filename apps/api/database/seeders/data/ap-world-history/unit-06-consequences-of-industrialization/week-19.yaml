    # ---- Long answer (LEQ)
    - slug: apworld-u06-w19-q24
      type: long_answer
      topic_code: "6.1"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1750 and 1900 industrial states expanded their control over Africa, Asia and the Pacific, and the United States, Russia and Japan also became imperial powers. Historians explain this expansion through economic motives, nationalism, ideologies of race and civilization, and new technologies.

        Evaluate the extent to which economic motives drove the imperial expansion of industrial states in the period 1750–1900.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Economic motives (raw materials, markets and investment outlets) were the underlying driver of expansion, but they operated through nationalism, racial and religious ideologies and new technologies, which explain the timing and the form the empires took; the extent is large but not total.

        Context: Industrialization in Britain and then Europe, the United States and Japan created demand for cotton, rubber, tin and palm oil and surplus capital seeking returns; earlier maritime empires had held coastal posts, not interiors.

        Body 1 (economic causes): Hobson's taproot argument; Egypt occupied in 1882 after a debt crisis to protect the Suez route; the Congo rubber regime; Java's cultivation system; Russia's push into Central Asia for cotton.

        Body 2 (non-economic causes): nationalism after 1871 (Germany's claims of 1884–85, France's search for prestige); Social Darwinism and the civilizing mission (Kipling, missionary societies); strategic competition (the Great Game, coaling stations).

        Body 3 (technology as enabling cause): quinine, steam gunboats, Maxim guns at Omdurman, telegraph; these explain why expansion accelerated after 1870 rather than earlier.

        Complexity: economic motives were necessary but not sufficient; many colonies lost money (German Africa) and were held for prestige, which shows ideology and rivalry mattered in their own right.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim that evaluates the extent to which economic motives drove expansion and sets out a line of reasoning. Zero for "economic motives were important" with no position on extent.

        Contextualization (0–1): describes a broader context, e.g. industrialization's demand for raw materials and capital outlets; the earlier maritime empires and their limits; the nationalism of unified Germany and Italy; the decline of the Mughal, Qing and Ottoman states.

        Evidence (0–2): 1 pt for at least two specific examples (Hobson 1902, Egypt 1882, the Congo Free State, Java's cultivation system, Berlin Conference, Kipling 1899, Omdurman 1898, the Philippines 1898, Japan's acquisition of Taiwan and Korea, Russian conquest of Tashkent). 2 pts when the examples are used to support the argument about extent.

        Analysis and reasoning (0–2): 1 pt for framing the argument with causation (distinguishing underlying, immediate and enabling causes) or comparison across empires. 1 pt for complexity: weighing economic against ideological and strategic motives; noting colonies that lost money; explaining timing through technology; or contrasting the United States, Russia and Japan with European cases.

        Common errors: a single-cause argument; treating Kipling or Hobson as neutral descriptions; placing the scramble for Africa before 1870; ignoring non-European imperial states.
