    # ---- Short answer (SAQ)
    - slug: apworld-u06-w20-q23
      type: short_answer
      topic_code: "6.3"
      source: "Described source: James Mooney, The Ghost-Dance Religion and the Sioux Outbreak of 1890 (Bureau of American Ethnology, 14th Annual Report, 1896), a U.S. government work, summarised in our own words"
      points: 3
      stimulus: |
        Source description: In 1896 the U.S. Bureau of American Ethnology published a report by the ethnologist James Mooney on the Ghost Dance. Mooney had travelled to interview the Paiute prophet Wovoka and visited Lakota, Arapaho and Cheyenne communities. The report describes the dance's teaching, in which the dead would return and the earth be renewed, as a religion of hope among peoples whose bison herds had been destroyed and who were confined to reservations. It compares the movement to religious revivals in other times and places, describes the government's alarm as largely a misunderstanding, and treats the killings at Wounded Knee as a tragedy that followed from that misunderstanding.
      prompt: |
        Using the source description, answer (a), (b) and (c).

        (a) Describe ONE way Mooney's report explains the appeal of the Ghost Dance.
        (b) Explain ONE way the report's point of view differs from the view of the U.S. Army in 1890.
        (c) Explain ONE similarity between the Ghost Dance and another religiously inspired response to state expansion in the period 1750–1900 outside North America.
      answer: |
        (a) Mooney explains the dance as a religion of hope for peoples whose economic base, the bison, had been destroyed and who were confined to reservations; the promise of the dead returning and the earth renewed answered a catastrophe.
        (b) The Army in 1890 treated the dance as a prelude to an uprising and sent troops, which led to Wounded Knee; Mooney, writing as an ethnologist six years later, saw it as a peaceful religious movement and the alarm as a misunderstanding.
        (c) The Xhosa cattle killing of 1856–57 also followed the collapse of a people's herds and land base and also rested on a prophecy that the ancestors would return and drive the settlers away; or the Mahdist movement in Sudan answered Egyptian and British rule with a religious promise of a purified world.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an explanation drawn from the description: loss of the bison; confinement to reservations; the promise of renewal and the return of the dead; comparison with other revivals. Zero for restating "it was a religion".

        (b) 1 pt: a contrast of viewpoints: the Army saw a military threat, Mooney a religion; or Mooney's purpose (scientific description for a government bureau) versus the Army's (security). Must state both sides.

        (c) 1 pt: an accurate similarity with a non-North-American movement: the Xhosa cattle killing (prophecy after loss of herds), the Mahdist movement (religious answer to foreign rule), Maji Maji (belief in protection from bullets). Zero for a North American example or for an armed uprising without a religious dimension.

    - slug: apworld-u06-w20-q24
      type: short_answer
      topic_code: "6.3"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE example of direct armed resistance to European or American expansion between 1750 and 1900 in Africa or Asia.
        (b) Explain ONE reason why most armed resistance to imperial expansion failed in this period.
        (c) Explain ONE way a people responded to expansion by forming a new state or political organisation rather than by armed resistance alone.
      answer: |
        (a) The Sepoy Rebellion in India (1857–58); or Samory Touré's war against the French (1882–98); or the Zulu war against Britain (1879); or Yaa Asantewaa's rising on the Gold Coast (1900); or Abd al-Qadir's resistance in Algeria (1832–47).
        (b) Industrial weapons such as breech-loading rifles, Maxim guns and artillery gave European-led forces overwhelming firepower, as at Omdurman in 1898; and the empires could also recruit colonial troops and exploit divisions among local states, so single polities fought alone against far greater resources.
        (c) The Cherokee Nation adopted a written constitution in 1827 and took its case to the U.S. Supreme Court, trying to secure its land through the expanding state's own institutions; or the Sokoto Caliphate and Zulu kingdom were new, centralised states built in the early 1800s that then confronted European expansion.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a correctly named and dated example of armed resistance in Africa or Asia. Zero for the Ghost Dance or Cherokee (North America) or for a religious movement with no fighting.

        (b) 1 pt: a reason explained with a mechanism: technology gap; colonial armies; telegraph and steam; local divisions. "Europeans were stronger" alone earns zero.

        (c) 1 pt: a new state or political response described accurately: Cherokee constitution and lawsuits; Sokoto; Zulu; Mahdist state; Boer republics. Zero if the answer only describes a battle.

    # ---- Long answer (LEQ)
    - slug: apworld-u06-w20-q25
      type: long_answer
      topic_code: "6.3"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1750 and 1900 peoples in the Americas, Africa, Asia and the Pacific responded to the expansion of industrial and settler states in a variety of ways, including armed resistance, the creation of new states, and religious movements.

        Evaluate the extent to which responses to imperial expansion in the period 1750–1900 were similar across different regions of the world.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Responses were strikingly similar in form across regions (armed resistance everywhere; religious movements on the U.S. Plains, the Cape and the Sudan; new states from the Cherokee to Sokoto), because conquest posed the same problem everywhere; but their timing and outcomes differed with each region's access to modern weapons, its unity and the strength of the invading state, so similarity of response went with difference of result.

        Context: Industrialization gave Europe, the United States and Japan steamships, machine guns and quinine; the old land-based empires were weakening; nationalism and the civilizing mission justified conquest.

        Body 1 (similar forms): armed resistance in the Andes (Túpac Amaru II), India (1857), Zululand (1879), West Africa (Samory), the Gold Coast (1900); religious movements among the Xhosa, Lakota and Sudanese; new states among the Cherokee, Zulu, Sokoto and Mahdists.

        Body 2 (different outcomes and reasons): Adwa versus Omdurman (arms, unity, numbers); Isandlwana versus Ulundi (a battle versus a war); Cherokee legal victory ignored by a settler state.

        Body 3 (regional difference): in settler colonies (United States, Argentina, Algeria, New Zealand) resistance faced demographic displacement; in colonies of rule (India, Nigeria) resistance later turned into nationalist politics.

        Complexity: similarity in the human response, difference in structural conditions; religious movements as rational responses to economic collapse.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim about the extent of similarity with a line of reasoning (e.g. similar in form, different in outcome). Zero for "responses were both similar and different" without specifying how.

        Contextualization (0–1): broader context such as industrial military technology, the decline of the Mughal and Qing states, the ideologies of 6.1, or the earlier pattern of resistance in unit 4.

        Evidence (0–2): 1 pt for at least two specific examples from the CED's list or equivalents (Túpac Amaru II, Sepoy Rebellion, Samory Touré, Yaa Asantewaa, Zulu, Adwa, Mahdists, Ghost Dance, Xhosa cattle killing, Cherokee Nation, Sokoto, Maori wars). 2 pts for using them to support the argument about similarity and difference.

        Analysis and reasoning (0–2): 1 pt for structuring the essay by comparison (across regions or categories of response). 1 pt for complexity: explaining why outcomes differed (arms, unity, settler versus rule colonies); treating religious movements as responses to economic collapse; connecting to later nationalism; or qualifying the thesis with a counter-example such as Ethiopia.

        Common errors: listing examples without comparing; confusing Adwa and Omdurman; treating all resistance as failure without explaining Ethiopia; ignoring the Americas.
