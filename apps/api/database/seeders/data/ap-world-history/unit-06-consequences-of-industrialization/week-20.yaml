week: 20
unit: 6
title: "Indigenous Responses to State Expansion"
topics: ["6.3"]
guide: guides/week-20.md
guide_description: |
  How peoples across the Americas, Africa, Asia and the Pacific answered conquest between 1750 and 1900: direct
  armed resistance (Túpac Amaru II, the Sepoy Rebellion, Samory Touré, the Zulu, Yaa Asantewaa), new states on
  the periphery (the Cherokee Nation, the Sokoto Caliphate, the Mahdist state), and religiously inspired movements
  (the Ghost Dance, the Xhosa cattle killing), with Adwa and Omdurman as the paired cases of success and failure.
flashcards_description: |
  27 cards on the three kinds of response to state expansion, the leaders and movements the CED names, and why
  Ethiopia won at Adwa while almost everyone else lost.

flashcards:
  - front: Three categories of response to imperial expansion → the CED's sorting
    back: |
      Direct armed resistance (Sepoy Rebellion, Samory Touré, the Zulu, Yaa Asantewaa); new states formed on the edges of empires (Cherokee Nation, Zulu kingdom, Sokoto Caliphate, the Mahdist state); and religiously inspired movements (Ghost Dance, Xhosa cattle killing, the Mahdi). Many movements fit two categories.
    topic_code: "6.3"
  - front: Túpac Amaru II → who, when, against what
    back: |
      A descendant of the Inca line who led an Andean uprising in 1780–81 against the heavier taxes and forced labour (mita) of the Bourbon reforms. Tens of thousands joined; the revolt was crushed and he was executed in Cuzco in 1781, but it exposed Spanish weakness before the independence wars.
    topic_code: "6.3"
  - front: Sepoy Rebellion of 1857 → trigger and deeper causes
    back: |
      The trigger was the rumour that new rifle cartridges were greased with cow and pig fat, offending Hindu and Muslim soldiers. Deeper causes: annexation of princely states, land-revenue pressure on peasants, missionary activity and fear for religion. It spread from Meerut across northern India.
    topic_code: "6.3"
  - front: Consequences of the 1857–58 rebellion → three outcomes
    back: |
      The East India Company was abolished and the Crown ruled India directly (1858); the army was reorganised with more British troops and recruitment from favoured groups; and British rulers became warier of social reform and more distant from Indians, hardening racial separation.
    topic_code: "6.3"
  - front: Samory Touré → state, strategy and end
    back: |
      Founder of the Wassoulou Empire in the upper Niger region. He built a disciplined professional army, bought modern rifles and set up workshops to repair and copy them, and fought the French from 1882, retreating eastward as they advanced, until his capture in 1898.
    topic_code: "6.3"
  - front: Yaa Asantewaa → the War of the Golden Stool (1900)
    back: |
      Queen mother of Ejisu in the Asante kingdom. When the British governor demanded the Golden Stool, the sacred symbol of the Asante nation, she rallied chiefs who hesitated and led the 1900 rising; Britain won and annexed Asante in 1902, but the stool was never handed over.
    topic_code: "6.3"
  - front: Anglo-Zulu War (1879) → Isandlwana and Ulundi
    back: |
      Britain invaded the Zulu kingdom in January 1879. At Isandlwana Zulu regiments armed mainly with spears destroyed a British column of about 1,300 men, the worst British defeat by an African army; six months later British firepower won at Ulundi and the kingdom was broken up.
    topic_code: "6.3"
  - front: Abd al-Qadir → resistance in Algeria
    back: |
      A religious and political leader who united tribes of western Algeria against the French from 1832, built a state with its own administration, and fought until his surrender in 1847. France's conquest took fifteen years and great brutality, including the destruction of crops and villages.
    topic_code: "6.3"
  - front: Battle of Adwa (1896) → why Ethiopia won
    back: |
      Menelik II had bought tens of thousands of modern rifles and artillery from France, Russia and Italy itself, united Ethiopia's regional lords, and outnumbered the Italian army about five to one on ground he chose. Italy recognised Ethiopian independence; Ethiopia and Liberia alone stayed free in 1914.
    hint: rifles + unity + numbers + diplomacy
    topic_code: "6.3"
  - front: Omdurman (1898) vs Adwa (1896) → the comparison to have ready
    back: |
      Both were African armies facing European invaders two years apart. The Mahdists at Omdurman charged Maxim guns and artillery with spears and old rifles and lost about 10,000 men; the Ethiopians at Adwa had modern rifles, artillery and unity and won. Arms and organisation, not courage, decided the outcomes.
    topic_code: "6.3"
  - front: Mahdist state in Sudan → founder, dates, fate
    back: |
      Muhammad Ahmad declared himself the Mahdi in 1881, defeated Egyptian and British-led forces, took Khartoum in 1885 (killing General Gordon) and founded an Islamic state. His successor the Khalifa ruled until Kitchener's Anglo-Egyptian army destroyed the Mahdist army at Omdurman in 1898.
    topic_code: "6.3"
  - front: Ghost Dance (1889–90) → beliefs and end
    back: |
      A religious movement begun by the Paiute prophet Wovoka that spread across the Plains: dancers believed the dead would return, the bison come back and the settlers disappear. The U.S. Army's fear of it led to the killing of Sitting Bull and the massacre of about 250 Lakota at Wounded Knee in December 1890.
    topic_code: "6.3"
  - front: Xhosa cattle killing (1856–57) → prophecy and result
    back: |
      The prophetess Nongqawuse said that if the Xhosa killed their cattle and destroyed their grain, the ancestors would rise and drive the British away. Up to 400,000 cattle were killed; tens of thousands died of famine and the British completed the conquest of Xhosaland with little fighting.
    topic_code: "6.3"
  - front: Religious movements as responses to conquest → how to explain them on the exam
    back: |
      Explain them as responses to catastrophe: the collapse of the bison economy on the Plains, cattle disease and land loss in the Cape, foreign rule in Sudan. Prophecy promised a restored world when armies had failed; call them revitalization movements, not irrational outbursts.
    topic_code: "6.3"
  - front: Cherokee Nation → how it resisted and why it failed
    back: |
      The Cherokee adopted Sequoyah's syllabary, a newspaper and a written constitution (1827), and won in the Supreme Court (Worcester v. Georgia, 1832). Georgia and President Jackson ignored the ruling and the Cherokee were removed west on the Trail of Tears in 1838–39: legal resistance could not stop a settler state.
    topic_code: "6.3"
  - front: Sokoto Caliphate → origin and what happened under British rule
    back: |
      Founded in 1804 by Usman dan Fodio's jihad in Hausaland, it became the largest state in nineteenth-century West Africa. When Lugard's forces conquered it in 1903 the emirs were kept in office under British residents, the model of indirect rule.
    topic_code: "6.3"
  - front: Zulu kingdom → why it counts as a state formed on the periphery
    back: |
      Shaka's regimental army (early 1800s) turned a small chiefdom into a centralised state during the upheavals of the mfecane. It was a new political creation that then confronted Boer settlers and the British, which is why the CED lists it with the Cherokee and the Sokoto Caliphate.
    topic_code: "6.3"
  - front: Boer republics → a settler response to another empire
    back: |
      Dutch-descended farmers (Boers) trekked away from British rule at the Cape in the 1830s and founded the Transvaal and Orange Free State. Their conflict with Britain over gold and diamonds produced the South African War of 1899–1902, an imperial war between two settler societies.
    topic_code: "6.3"
  - front: Maori land wars (1845–72) → what the pa shows
    back: |
      Maori fought settler land seizures in New Zealand for a generation. Their fortified pa, with trenches and bunkers, repeatedly withstood British artillery; defeat came from numbers, confiscation of land after each war and divisions among Maori, not from any single battle.
    topic_code: "6.3"
  - front: Can Vuong movement (1885–89) → Vietnamese resistance to France
    back: |
      "Aid the King": scholar-officials and peasants fought the French in the name of the young emperor Ham Nghi after France completed its conquest of Vietnam. It was suppressed by 1889, but it began a tradition of resistance that later nationalists and communists claimed.
    topic_code: "6.3"
  - front: Philippine-American War (1899–1902) → why it belongs with 6.3
    back: |
      Filipino forces under Emilio Aguinaldo had fought Spain for independence; when the United States took the islands in 1898 they fought the new ruler. The war killed about 200,000 Filipinos, mostly civilians, and showed that a republic could be an imperial power too.
    topic_code: "6.3"
  - front: Little Bighorn (1876) and Wounded Knee (1890) → the arc of Plains resistance
    back: |
      Lakota, Cheyenne and Arapaho destroyed Custer's command in 1876, the high point of armed resistance; within a year most had been forced onto reservations as the bison were destroyed. Wounded Knee (1890), a massacre of Ghost Dancers, marks the end of armed resistance on the Plains.
    topic_code: "6.3"
  - front: Conquest of the Desert (1878–85) → Argentina's settler expansion
    back: |
      The Argentine army's campaign under Roca to take Patagonia and the pampas from the Mapuche and Tehuelche, killing or displacing thousands and opening the land to ranching and European immigration. A Latin American counterpart to the U.S. Plains wars.
    topic_code: "6.3"
  - front: Why most armed resistance failed after 1880 → four reasons
    back: |
      Industrial weapons (breech-loaders, Maxim guns, artillery); steamships and telegraphs that moved and coordinated troops; colonial armies recruited locally (sepoys, tirailleurs, Egyptian regiments); and divisions among local states that gave invaders allies. Resistance that came earlier or had modern arms did better.
    topic_code: "6.3"
  - front: Colonial troops → who actually fought the wars of conquest
    back: |
      Most soldiers in European colonial armies were colonial subjects: Indian sepoys in Asia and Africa, Senegalese tirailleurs for France, Egyptian and Sudanese regiments for Britain, Askari for Germany. Empires were conquered largely with locally recruited armies under European officers.
    topic_code: "6.3"
  - front: Maji Maji rising (1905–07) → cause and significance
    back: |
      Peoples of German East Africa (Tanganyika) rose against forced cotton growing, united by a prophet's "maji" (water) believed to turn bullets to water. German suppression and famine killed perhaps 200,000; the rising combined religious inspiration with economic grievance across ethnic lines.
    topic_code: "6.3"
  - front: Comparison → Cherokee legal resistance vs Samory's military resistance
    back: |
      Both borrowed the empire's tools (a constitution and court cases; rifles and workshops) and both failed. The Cherokee case failed because a settler state ignored its own court; Samory's because French firepower and supply outlasted him. Similar strategy of adaptation, different arenas, same outcome.
    topic_code: "6.3"

quiz:
  description: |
    23 questions · about 35 minutes · topic 6.3 (responses to state expansion), with about a third of the items
    reviewing the rationales and methods of expansion from week 19 and earlier challenges to state power from
    units 3 to 5. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items
    are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set A: interpretation on Samory Touré (6.3)
    - slug: apworld-u06-w20-q01
      type: multiple_choice
      topic_code: "6.3"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): Samory Touré's sixteen-year war against the French is often told as a story of heroic defeat, but it is better understood as a story of adaptation. Samory built a professional army paid from the gold and slave trades, organised it in units trained on European lines, bought repeating rifles through British Sierra Leone, and set up workshops where captured weapons were repaired and copied. When the French advanced he moved his whole state eastward, hundreds of kilometres, rather than fight a decisive battle. What he could not do was match the French supply of ammunition or prevent the French from recruiting his African enemies. His capture in 1898 came when there was no more room to move.
      prompt: |
        Which of the following best describes the author's main argument?
      options:
        - "Samory failed because he refused to adopt European military methods."
        - "Samory's resistance should be understood as a sustained adaptation to European power whose limits were set by supply and by African divisions, rather than as a simple heroic defeat."
        - "The French defeated Samory only because of the Maxim gun."
        - "Samory's state was destroyed by the Mahdists."
      option_explanations:
        - |
          The passage says the opposite: Samory trained units on European lines, bought repeating rifles and copied weapons.
        - |
          Correct. The author's thesis is that adaptation, not heroism, is the key, and that ammunition supply and French recruitment of Samory's enemies explain the outcome.
        - |
          The passage mentions ammunition supply and African allies of the French, not the Maxim gun; the question asks for the argument as written.
        - |
          The Mahdists were in Sudan, thousands of kilometres away; the passage concerns the French in West Africa.
      answer: 1
      explanation: |
        Skill: claims in a secondary source. Find the sentence that reframes the usual story ("better understood as") and the reasons offered for the outcome.

    - slug: apworld-u06-w20-q02
      type: multiple_choice
      topic_code: "6.3"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): Samory Touré's sixteen-year war against the French is often told as a story of heroic defeat, but it is better understood as a story of adaptation. Samory built a professional army paid from the gold and slave trades, organised it in units trained on European lines, bought repeating rifles through British Sierra Leone, and set up workshops where captured weapons were repaired and copied. When the French advanced he moved his whole state eastward, hundreds of kilometres, rather than fight a decisive battle. What he could not do was match the French supply of ammunition or prevent the French from recruiting his African enemies. His capture in 1898 came when there was no more room to move.
      prompt: |
        Which other response to imperial expansion most closely resembles the pattern of adaptation the author describes?
      options:
        - "The Xhosa cattle killing of 1856–57"
        - "The Ghost Dance of 1889–90"
        - "Menelik II's purchase of modern rifles and artillery before Adwa in 1896"
        - "The Cherokee decision not to resist removal by force"
      option_explanations:
        - |
          The cattle killing was a prophetic movement that destroyed the Xhosa economy; it did not borrow European tools.
        - |
          The Ghost Dance was a religious movement, not a military or technological adaptation.
        - |
          Correct. Menelik, like Samory, acquired modern weapons from Europeans and organised a disciplined army; the difference is that Ethiopia's unity and numbers let him win a decisive battle.
        - |
          The Cherokee adapted legally (a constitution, court cases), not militarily; and the option describes a refusal to fight rather than an adaptation of warfare.
      answer: 2
      explanation: |
        Skill: comparison. Group responses by their method: Samory and Menelik both armed and organised on European lines, which is why Adwa is the natural comparison.

    - slug: apworld-u06-w20-q03
      type: multiple_choice
      topic_code: "6.3"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): Samory Touré's sixteen-year war against the French is often told as a story of heroic defeat, but it is better understood as a story of adaptation. Samory built a professional army paid from the gold and slave trades, organised it in units trained on European lines, bought repeating rifles through British Sierra Leone, and set up workshops where captured weapons were repaired and copied. When the French advanced he moved his whole state eastward, hundreds of kilometres, rather than fight a decisive battle. What he could not do was match the French supply of ammunition or prevent the French from recruiting his African enemies. His capture in 1898 came when there was no more room to move.
      prompt: |
        A historian who wanted to qualify the author's argument would most likely point out that
      options:
        - "Samory's state was itself built partly on conquest and the slave trade, so neighbouring peoples had reasons of their own to side with the French"
        - "the French had no interest in West Africa"
        - "repeating rifles did not exist in the 1880s"
        - "Samory was captured in 1850"
      option_explanations:
        - |
          Correct. The passage treats French recruitment of Samory's "African enemies" as an external limit; a critic would add that his own expansion and slaving created those enemies, complicating the picture of adaptation.
        - |
          France was building a West African empire from Senegal to the Niger in exactly these years.
        - |
          Repeating rifles were in wide use by the 1880s; the passage's claim is accurate.
        - |
          Samory was captured in 1898, as the passage states; his war began in 1882.
      answer: 0
      explanation: |
        Skill: argumentation (qualifying a claim). The strongest qualification works with the passage's own evidence and adds what it leaves out.

    # ---- Stimulus set B: map of resistance (6.3)
    - slug: apworld-u06-w20-q04
      type: multiple_choice
      topic_code: "6.3"
      source: "Map description written for this course"
      points: 1
      stimulus: |
        Map description: A world map titled "Responses to imperial expansion, 1780–1900" marks eleven movements with symbols. A rifle symbol (armed resistance) appears at Cuzco (Túpac Amaru II, 1780–81), Algeria (Abd al-Qadir, 1832–47), northern India (1857–58), Zululand (1879), the upper Niger (Samory Touré, 1882–98), Adwa in Ethiopia (1896) and Kumasi on the Gold Coast (Yaa Asantewaa, 1900). A star symbol (religious movement) appears in the eastern Cape (cattle killing, 1856–57), the Sudan (Mahdi, 1881–98) and the northern U.S. Plains (Ghost Dance, 1889–90). A flag symbol (new state) appears in the southeastern United States (Cherokee Nation, 1827) and in Hausaland (Sokoto Caliphate, 1804). Only the Adwa symbol is circled, with the legend "resistance succeeded".
      prompt: |
        Which conclusion is best supported by the map?
      options:
        - "Resistance to expansion occurred only in Africa."
        - "Armed resistance, religious movements and new state formation occurred on several continents, and almost all of them failed to prevent conquest."
        - "Religious movements were the most common form of response."
        - "Resistance succeeded wherever it was armed."
      option_explanations:
        - |
          The map marks movements in South America, North America, Africa and India.
        - |
          Correct. Eleven movements across four continents, in three categories, with a single circled success at Adwa.
        - |
          The map shows seven armed movements, three religious ones and two new states; armed resistance was most common.
        - |
          Seven movements carry the rifle symbol and only one is circled as successful.
      answer: 1
      explanation: |
        Skill: analysing a map. Count the symbols and categories before reading the options; the legend's single circle is the key detail.

    - slug: apworld-u06-w20-q05
      type: multiple_choice
      topic_code: "6.3"
      source: "Map description written for this course"
      points: 1
      stimulus: |
        Map description: A world map titled "Responses to imperial expansion, 1780–1900" marks eleven movements with symbols. A rifle symbol (armed resistance) appears at Cuzco (Túpac Amaru II, 1780–81), Algeria (Abd al-Qadir, 1832–47), northern India (1857–58), Zululand (1879), the upper Niger (Samory Touré, 1882–98), Adwa in Ethiopia (1896) and Kumasi on the Gold Coast (Yaa Asantewaa, 1900). A star symbol (religious movement) appears in the eastern Cape (cattle killing, 1856–57), the Sudan (Mahdi, 1881–98) and the northern U.S. Plains (Ghost Dance, 1889–90). A flag symbol (new state) appears in the southeastern United States (Cherokee Nation, 1827) and in Hausaland (Sokoto Caliphate, 1804). Only the Adwa symbol is circled, with the legend "resistance succeeded".
      prompt: |
        The movement marked at Cuzco differs from most of the others on the map in that it
      options:
        - "was directed against a European power's demands for taxes and forced labour in an existing colony rather than against a new conquest"
        - "succeeded in winning independence"
        - "was a religious movement led by a prophet"
        - "took place after the Berlin Conference"
      option_explanations:
        - |
          Correct. Túpac Amaru II rose in 1780–81 against the Bourbon reforms' taxes and the mita inside Spain's 250-year-old Peruvian colony; most other movements resisted new nineteenth-century conquests.
        - |
          The uprising was crushed and its leader executed; independence came forty years later through other movements.
        - |
          It was an armed uprising with an Inca-descended leader, not a prophetic movement.
        - |
          1780 is a century before the Berlin Conference of 1884–85.
      answer: 0
      explanation: |
        Skill: comparison across time. Reading dates on a map separates resistance to old colonial rule from resistance to the new imperialism.

    - slug: apworld-u06-w20-q06
      type: multiple_choice
      topic_code: "6.3"
      source: "Map description written for this course"
      points: 1
      stimulus: |
        Map description: A world map titled "Responses to imperial expansion, 1780–1900" marks eleven movements with symbols. A rifle symbol (armed resistance) appears at Cuzco (Túpac Amaru II, 1780–81), Algeria (Abd al-Qadir, 1832–47), northern India (1857–58), Zululand (1879), the upper Niger (Samory Touré, 1882–98), Adwa in Ethiopia (1896) and Kumasi on the Gold Coast (Yaa Asantewaa, 1900). A star symbol (religious movement) appears in the eastern Cape (cattle killing, 1856–57), the Sudan (Mahdi, 1881–98) and the northern U.S. Plains (Ghost Dance, 1889–90). A flag symbol (new state) appears in the southeastern United States (Cherokee Nation, 1827) and in Hausaland (Sokoto Caliphate, 1804). Only the Adwa symbol is circled, with the legend "resistance succeeded".
      prompt: |
        Which of the following best explains why the Adwa symbol is the only one circled?
      options:
        - "Italy chose not to fight at Adwa."
        - "Ethiopia was never of interest to any European power."
        - "Menelik II had acquired modern rifles and artillery, united Ethiopia's regional lords and outnumbered the Italian army, so Ethiopia defeated the invasion decisively in 1896."
        - "The other movements never fought a battle."
      option_explanations:
        - |
          Italy invaded Ethiopia and fought at Adwa with about 17,000 men; it lost the battle and recognised Ethiopian independence afterwards.
        - |
          Italy had claimed a protectorate over Ethiopia under the disputed Treaty of Wuchale (1889); the war arose from that claim.
        - |
          Correct. Arms bought from France, Russia and Italy, unity behind the emperor and a large army let Ethiopia win the one decisive African victory of the scramble.
        - |
          Isandlwana (1879), the Mahdist capture of Khartoum (1885) and Samory's campaigns were all real battles; they were won or lost in the long run by firepower and supply.
      answer: 2
      explanation: |
        Skill: causation. The exam expects the specific reasons for Ethiopia's success, not a vague appeal to resistance.

    # ---- Stand-alone multiple choice (6.3 and review)
    - slug: apworld-u06-w20-q07
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The Xhosa cattle killing of 1856–57 and the Ghost Dance of 1889–90 were similar in that both
      options:
        - "were organised by European missionaries to convert indigenous peoples"
        - "succeeded in halting settler expansion for a generation"
        - "were armed uprisings led by professional soldiers"
        - "were prophetic movements promising a restored world, arising after the collapse of a people's economic base and ending in catastrophe"
      option_explanations:
        - |
          Both were indigenous movements led by prophets (Nongqawuse, Wovoka); missionaries opposed them.
        - |
          The cattle killing caused famine that completed British conquest; the Ghost Dance ended at Wounded Knee. Neither halted expansion.
        - |
          Neither was an armed uprising; the Ghost Dancers were unarmed when attacked, and the cattle killing involved no fighting.
        - |
          Correct. Both answered the destruction of herds (cattle disease and land loss; the slaughter of the bison) with prophecy of ancestors returning and settlers vanishing, and both ended in disaster.
      answer: 3
      explanation: |
        Skill: comparison. The CED groups these as religiously inspired responses; the similarity is in cause and form, the difference in detail.

    - slug: apworld-u06-w20-q08
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The Cherokee Nation's adoption of a written constitution in 1827 and its appeal to the U.S. Supreme Court are best understood as
      options:
        - "preparation for an armed uprising against Georgia"
        - "a decision to migrate voluntarily to the West"
        - "an attempt to resist dispossession by adopting the political and legal institutions of the expanding state"
        - "a religious revitalization movement"
      option_explanations:
        - |
          The Cherokee leadership chose legal and diplomatic resistance precisely to avoid a war they could not win.
        - |
          Removal on the Trail of Tears (1838–39) was forced; the constitution was an effort to stay.
        - |
          Correct. The Cherokee built a state on the American model and won in Worcester v. Georgia (1832); the strategy failed when Georgia and President Jackson ignored the Court and removal followed.
        - |
          A constitution, newspaper and lawsuits are political and legal tools, not prophecy.
      answer: 2
      explanation: |
        Skill: developments and processes. The Cherokee are the CED's example of a new state formed on the periphery of an expanding one.

    - slug: apworld-u06-w20-q09
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following was an immediate trigger of the 1857 rebellion in India?
      options:
        - "The partition of Bengal"
        - "The founding of the Indian National Congress"
        - "The opening of the Suez Canal"
        - "Rumours that new rifle cartridges were greased with cow and pig fat, offending both Hindu and Muslim sepoys"
      option_explanations:
        - |
          Bengal was partitioned in 1905, nearly fifty years later.
        - |
          Congress was founded in 1885; it was a later, constitutional response to British rule.
        - |
          The canal opened in 1869, after the rebellion.
        - |
          Correct. Biting the cartridges would have violated the religious rules of both communities; the rumour fused with deeper grievances over annexations, land revenue and missionary activity.
      answer: 3
      explanation: |
        Skill: causation (trigger versus underlying causes). Name the spark and be ready to add the deeper grievances.

    - slug: apworld-u06-w20-q10
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The Sokoto Caliphate and the Zulu kingdom are both listed by the CED as examples of
      options:
        - "religiously inspired movements that rejected all contact with Europeans"
        - "colonies founded by chartered companies"
        - "new states formed in Africa in the early nineteenth century that later confronted European expansion"
        - "states that successfully defeated European invasion"
      option_explanations:
        - |
          The Sokoto jihad was religious in origin, but the Zulu state was a military creation, and neither rejected all contact.
        - |
          Both were African creations: Usman dan Fodio's jihad (1804) and Shaka's regimental state.
        - |
          Correct. Both were formed around 1800–1820, became the largest states of their regions, and were conquered (the Zulu in 1879, Sokoto in 1903), after which Britain used their rulers for indirect rule.
        - |
          Both were defeated; only Ethiopia won decisively.
      answer: 2
      explanation: |
        Skill: developments and processes. "New states on the periphery" means states created in the century of expansion, not only states that resisted it.

    - slug: apworld-u06-w20-q11
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The Anglo-Zulu War of 1879 is often cited to show that
      options:
        - "the Zulu had adopted Maxim guns before the British"
        - "Britain lost control of southern Africa"
        - "religious prophecy decided the outcome"
        - "African armies could win a battle against a European force but rarely a war, because European firepower and reinforcements prevailed over time"
      option_explanations:
        - |
          The Zulu fought mainly with spears and some old firearms; the Maxim gun was not even patented until 1884.
        - |
          Britain won the war and later absorbed Zululand into Natal.
        - |
          The war was decided by battles and firepower; it was not a religious movement.
        - |
          Correct. Zulu regiments destroyed a British column at Isandlwana in January; by July British rifles and artillery had won at Ulundi and the kingdom was partitioned.
      answer: 3
      explanation: |
        Skill: causation. Isandlwana versus Ulundi is the standard illustration of the gap between a battle and a war.

    - slug: apworld-u06-w20-q12
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
