      prompt: |
        The Gold Coast row differs from the Ceylon row in that
      options:
        - "Ceylon was an independent country"
        - "cocoa was grown by Dutch colonists"
        - "cocoa was grown mainly by African smallholders who chose to enter the market, whereas Ceylon tea was grown on European-owned plantations with indentured Tamil labour"
        - "cocoa was a food crop consumed locally"
      option_explanations:
        - |
          Ceylon was a British crown colony until 1948.
        - |
          The Gold Coast was British; cocoa farmers were Akan and other Africans.
        - |
          Correct. The Gold Coast cocoa boom was an African initiative; Ceylon's tea estates were British-owned and worked by migrant labour, two different routes into the same export economy.
        - |
          Cocoa was exported almost entirely to Europe and North America for chocolate.
      answer: 2
      explanation: |
        Skill: comparison. The export economy took different social forms: peasant production versus plantation.

    # ---- Stand-alone multiple choice (6.4, 6.5 and review)
    - slug: apworld-u06-w21-q10
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        The Open Door notes of 1899–1900 are best understood as
      options:
        - "a British plan to partition China"
        - "Japan's claim to Manchuria"
        - "a Chinese demand that the powers leave China"
        - "the U.S. proposal that all powers enjoy equal trading rights in China's spheres of influence and respect China's territorial integrity, protecting American access without a sphere of its own"
      option_explanations:
        - |
          Britain already held the largest sphere and preferred trade to partition; the notes opposed carving China up.
        - |
          Japan's claims in Manchuria grew after 1905 and 1931; the Open Door was an American initiative.
        - |
          The notes were written by U.S. Secretary of State John Hay to the other powers, not by China.
        - |
          Correct. The United States, arriving late, wanted trade without the cost of a sphere; the policy served American commerce first and Chinese sovereignty second.
      answer: 3
      explanation: |
