week: 21
unit: 6
title: "Global Economic Development and Economic Imperialism"
topics: ["6.4", "6.5"]
guide: guides/week-21.md
guide_description: |
  How industrial demand turned colonies and independent countries alike into exporters of cotton, rubber, guano,
  beef and coffee, and what monoculture did to land and people; then economic imperialism without annexation:
  the Opium Wars and the Treaty of Nanjing, spheres of influence and the Open Door in China, and British finance
  and U.S. intervention in Latin America from the Monroe Doctrine to the Roosevelt Corollary.
flashcards_description: |
  29 cards on export economies and their environmental effects, the unequal treaties and the Boxer Protocol,
  British informal empire in Latin America, and the Roosevelt Corollary.

flashcards:
  - front: Export economy → definition and three examples by 1900
    back: |
      An economy organised around producing a few raw materials or cash crops for foreign markets and importing manufactured goods. Examples: Egyptian cotton for Lancashire mills, Argentine beef and wheat for Britain, Malayan tin and rubber for British industry.
    topic_code: "6.4"
  - front: Monoculture → two economic and two environmental consequences
    back: |
      Economic: dependence on one world price, and food imports when land went to cash crops. Environmental: forest clearance (coffee in Brazil, tea in Ceylon), soil exhaustion and erosion. Famine followed when prices or harvests failed, as in India in the 1870s and 1890s.
    topic_code: "6.4"
  - front: Java's cultivation system (1830) → how it worked and whom it paid
    back: |
      Villages had to grow government export crops (sugar, coffee, indigo) on a share of their land or give labour instead. Profits flowed to the Dutch treasury and financed railways and industry in the Netherlands while Javanese peasants faced food shortages.
    topic_code: "6.4"
  - front: Rubber → where it was produced in 1900 and under what conditions
    back: |
      Wild rubber from the Congo Free State (forced quotas enforced by mutilation and hostage-taking) and the Amazon (debt-bound tappers); then plantation rubber in British Malaya from seeds smuggled out of Brazil through Kew Gardens in 1876. By the 1910s Malayan plantations undercut the wild sources.
    topic_code: "6.4"
  - front: Guano → Peru's boom and bust
    back: |
      Seabird droppings from Peru's coastal islands were exported as fertiliser from the 1840s. The state borrowed in London against future guano income to build railways; when deposits ran out it defaulted in 1876, and after the War of the Pacific (1879–84) Chile took the nitrate provinces.
    topic_code: "6.4"
  - front: Cotton after the American Civil War → how the shortage reshaped Egypt and India
    back: |
      The Union blockade (1861–65) cut off Southern cotton, so British mills turned to Egypt and India. Egypt's Khedive Ismail expanded cotton and borrowed heavily; the debt crisis led to British occupation in 1882. Indian cotton exports grew, and Russian conquest of Central Asia was partly a search for cotton too.
    topic_code: "6.4"
  - front: Tea → why Britain planted it in Assam and Ceylon
    back: |
      Britain depended on Chinese tea and wanted a supply it controlled. Tea seeds and knowledge were taken from China in the 1840s; plantations in Assam (India) and, after a coffee blight in the 1870s, Ceylon were worked by indentured Tamil labourers. An example of imperial crop transfer creating a new monoculture.
    topic_code: "6.4"
  - front: West African palm oil and cocoa → who grew them
    back: |
      Mostly African smallholders and traders, not European plantations. Palm oil lubricated machines and made soap; Gold Coast farmers made cocoa the colony's main export by 1911. Shows local agency within the export economy, though prices were set abroad.
    topic_code: "6.4"
  - front: Refrigerated shipping (1870s) → effect on Argentina and New Zealand
    back: |
      Refrigerated steamships let Argentine beef and New Zealand lamb reach Britain fresh. Argentina's pampas became British-financed ranches and wheat farms linked by British-built railways to Buenos Aires; by 1900 Britain held more investment there than in any colony except India.
    topic_code: "6.4"
  - front: Dadabhai Naoroji's drain theory (1901) → the argument
    back: |
      In Poverty and Un-British Rule in India Naoroji argued that Britain drained India's wealth through taxes, remitted salaries and pensions, and interest paid to London, leaving India poorer than before British rule. The argument became central to Indian nationalism.
    topic_code: "6.4"
  - front: Indian famines of 1876–78 and 1896–1900 → why they belong in 6.4
    back: |
      Millions died while grain was still exported by rail to ports and prices were left to the market. They show how an export-oriented economy and colonial policy could turn drought into mass death; critics in India and Britain used them against the Raj.
    topic_code: "6.4"
  - front: Economic imperialism → definition and the two CED regions
    back: |
      Control of a region's economy by foreign states or companies through trade, loans, investment and occasional force, without annexation. The CED's main cases: China under the unequal treaties and spheres of influence, and Latin America under British finance and U.S. intervention.
    topic_code: "6.5"
  - front: Opium trade → why Britain sold opium to China
    back: |
      Britain bought Chinese tea with silver and had little China wanted. The East India Company grew opium in Bengal and sold it through private traders at Canton, reversing the silver flow by the 1830s. Chinese attempts to stop the trade (Lin Zexu, 1839) led to the First Opium War.
    topic_code: "6.5"
  - front: Lin Zexu (1839) → what he did and wrote
    back: |
      The Qing commissioner at Canton who confiscated and destroyed about 20,000 chests of British opium and wrote a letter to Queen Victoria asking how Britain could ban opium at home yet sell it to China; it apparently never reached her. Britain's response was war.
    topic_code: "6.5"
  - front: Treaty of Nanjing (1842) → five terms
    back: |
      Hong Kong ceded "in perpetuity"; five ports opened (Canton, Amoy, Foochow, Ningbo, Shanghai) with British consuls; an indemnity of $21 million; a fixed low tariff; and the Cohong monopoly abolished. A supplementary treaty added extraterritoriality and most-favoured-nation status.
    topic_code: "6.5"
  - front: Extraterritoriality → definition and why China resented it
    back: |
      Foreign nationals in China were tried by their own consuls under their own laws, not by Chinese courts. It created foreign enclaves beyond Chinese law in the treaty ports and became a symbol of lost sovereignty that lasted until 1943.
    topic_code: "6.5"
  - front: Second Opium War (1856–60) → outcomes
    back: |
      Anglo-French forces took Beijing and burned the Summer Palace. The treaties legalised opium, opened more ports including inland river ports, allowed foreign legations in Beijing and missionaries in the interior, and ceded Kowloon to Britain. Russia took the Amur region in the same years.
    topic_code: "6.5"
  - front: Taiping Rebellion (1850–64) → leader, beliefs, toll
    back: |
      Hong Xiuquan, who believed he was the younger brother of Jesus, led a movement that took Nanjing and ruled much of the Yangzi valley, promising land redistribution and an end to foot-binding and opium. Its suppression killed perhaps twenty million and left the Qing dependent on provincial armies.
    topic_code: "6.5"
  - front: Spheres of influence in China (after 1895) → who held what
    back: |
      Germany in Shandong (Qingdao), Russia in Manchuria (Port Arthur), Britain in the Yangzi valley and Weihaiwei, France in the south near Indochina, Japan in Fujian. Each held railway, mining and leasing rights; China kept nominal sovereignty.
    topic_code: "6.5"
  - front: Open Door policy (1899–1900) → who proposed it and why
    back: |
      U.S. Secretary of State John Hay's notes asked the powers to allow equal trade in each other's spheres and (in 1900) to preserve China's territorial integrity. The United States had no sphere and wanted access; the policy protected American trade more than Chinese sovereignty.
    topic_code: "6.5"
  - front: Boxer Rebellion (1899–1901) → who, what, result
    back: |
      The "Righteous and Harmonious Fists", peasants in northern China who practised martial rituals believed to stop bullets, attacked missionaries, Chinese Christians and foreigners; the Qing court backed them. An eight-nation force took Beijing; the Boxer Protocol imposed a 450-million-tael indemnity and foreign garrisons.
    topic_code: "6.5"
  - front: British informal empire in Latin America → the mechanism
    back: |
      No colonies, but British merchants replaced Spanish ones after independence, British banks lent to governments, and British companies built and owned railways, ports, utilities and mines. Trade and debt gave London influence over policy without political rule.
    topic_code: "6.5"
  - front: War of the Pacific (1879–84) → cause and economic result
    back: |
      Chile fought Peru and Bolivia for the nitrate-rich Atacama. Chile won, Bolivia lost its coast, and British firms came to dominate Chilean nitrate mining and exports, an example of a Latin American war shaped by an export commodity and foreign capital.
    topic_code: "6.5"
  - front: Porfirio Díaz's Mexico (1876–1911) → foreign capital and its cost
    back: |
      Díaz invited U.S. and British investment into railways, mines, oil and land; exports and railway mileage soared. Rural communities lost land to haciendas and foreign companies, and the concentration of wealth was a cause of the Mexican Revolution of 1910.
    topic_code: "6.5"
  - front: Monroe Doctrine (1823) → what it warned and what it could not do
    back: |
      President Monroe declared that any European attempt to extend its system to the Western Hemisphere would be seen as "dangerous to our peace and safety". The United States lacked the navy to enforce it; British sea power did so in practice, which suited British commercial interests.
    topic_code: "6.5"
  - front: Roosevelt Corollary (1904) → what it added to the Monroe Doctrine
    back: |
      Theodore Roosevelt declared that "chronic wrongdoing" or weakness in a Western Hemisphere state could force the United States to exercise "an international police power". It justified customs receiverships and marine landings in the Dominican Republic, Nicaragua, Haiti and Cuba.
    topic_code: "6.5"
  - front: United Fruit Company (1899) → what a "banana republic" means
    back: |
      A U.S. company that owned banana plantations, railways, ports and steamships across Central America and the Caribbean and used its weight to shape governments. The phrase describes a small state whose economy and politics were dominated by one foreign company.
    topic_code: "6.5"
  - front: Panama Canal (1903–14) → how the United States got the land
    back: |
      When Colombia's senate rejected a canal treaty in 1903, the United States backed a Panamanian secession, recognised the new republic within days and secured a canal zone. The canal, opened in 1914, joined the Atlantic and Pacific and anchored U.S. power in the Caribbean.
    topic_code: "6.5"
  - front: Comparison → formal colony vs semi-colony vs dependent republic
    back: |
      India/Java: foreign government sets policy and forces crops. China: own emperor, but treaties fix tariffs, grant extraterritoriality and carve spheres. Argentina/Peru: own government, but foreign loans and foreign-owned railways and mines set the economy's shape. Same industrial demand, three levels of political control.
    topic_code: "6.5"

quiz:
  description: |
    24 questions · about 35 minutes · topics 6.4 and 6.5 (the global export economy and economic imperialism),
    with about a third of the items reviewing weeks 19–20 and the industrial and maritime economies of units 4
    and 5. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set A: Treaty of Nanjing (6.5)
    - slug: apworld-u06-w21-q01
      type: multiple_choice
      topic_code: "6.5"
      source: "Primary source: Treaty of Nanking (29 August 1842), English text, World and Japan database (University of Tokyo)"
      points: 1
      stimulus: |
        Article II: His Majesty the Emperor of China agrees that British Subjects, with their families and establishments, shall be allowed to reside, for the purpose of carrying on their Mercantile pursuits, without molestation or restraint at "the Cities and Towns of Canton, Amoy, Foochow-fu, Ningpo, and Shanghai".

        Article III: "His Majesty the Emperor of China cedes to Her Majesty the Queen of Great Britain, etc., the Island of Hongkong, to be possessed in perpetuity by Her Britannic Majesty, Her Heirs and Successors, and to be governed by such Laws and Regulations as Her Majesty the Queen of Great Britain, etc., shall see fit to direct."

        — Treaty of Nanking, signed aboard a British warship, 29 August 1842, ending the First Opium War (Article II paraphrased except for the names of the ports; Article III quoted)
      prompt: |
        The treaty is best understood as an example of
      options:
        - "the partition of China among the European powers"
        - "a mutual defence alliance between Britain and China"
        - "the Qing dynasty's voluntary opening of China to free trade"
        - "economic imperialism, in which an industrial power used military victory to secure commercial access and a territorial foothold without annexing the country"
      option_explanations:
        - |
          China was never partitioned; spheres of influence came only after 1895 and still left the Qing in nominal control.
        - |
          The treaty imposed obligations on China alone; it was the first of the "unequal treaties".
        - |
          The treaty was signed aboard a warship after a war the Qing had lost; there was nothing voluntary about it.
        - |
          Correct. Five ports, a ceded island and (in the supplementary treaty) fixed tariffs and extraterritoriality gave Britain economic control while China kept its emperor and most of its territory.
      answer: 3
      explanation: |
        Skill: developments and processes. The CED's phrase for China's situation is economic imperialism; Nanjing is its founding document.

    - slug: apworld-u06-w21-q02
      type: multiple_choice
      topic_code: "6.5"
      source: "Primary source: Treaty of Nanking (29 August 1842), English text, World and Japan database (University of Tokyo)"
      points: 1
      stimulus: |
        Article II: His Majesty the Emperor of China agrees that British Subjects, with their families and establishments, shall be allowed to reside, for the purpose of carrying on their Mercantile pursuits, without molestation or restraint at "the Cities and Towns of Canton, Amoy, Foochow-fu, Ningpo, and Shanghai".

        Article III: "His Majesty the Emperor of China cedes to Her Majesty the Queen of Great Britain, etc., the Island of Hongkong, to be possessed in perpetuity by Her Britannic Majesty, Her Heirs and Successors, and to be governed by such Laws and Regulations as Her Majesty the Queen of Great Britain, etc., shall see fit to direct."

        — Treaty of Nanking, signed aboard a British warship, 29 August 1842, ending the First Opium War (Article II paraphrased except for the names of the ports; Article III quoted)
      prompt: |
        The war that produced this treaty was most directly caused by
      options:
        - "Japan's invasion of Korea"
        - "Chinese attempts to stop the British-run opium trade, which had reversed the flow of silver and spread addiction"
        - "Britain's wish to convert China to Christianity"
        - "the Taiping Rebellion's capture of Nanjing"
      option_explanations:
        - |
          Japan's war with China over Korea came in 1894–95.
        - |
          Correct. Lin Zexu's destruction of about 20,000 chests of opium at Canton in 1839 gave Britain the pretext; the deeper cause was the trade deficit opium had been used to fix.
        - |
          Missionary access came in later treaties; the 1839–42 war was about trade and opium.
        - |
          The Taiping took Nanjing in 1853, eleven years after the treaty.
      answer: 1
      explanation: |
        Skill: causation. The chain runs tea → silver → opium → Lin Zexu → war → treaty.

    - slug: apworld-u06-w21-q03
      type: multiple_choice
      topic_code: "6.5"
      source: "Primary source: Treaty of Nanking (29 August 1842), English text, World and Japan database (University of Tokyo)"
      points: 1
      stimulus: |
        Article II: His Majesty the Emperor of China agrees that British Subjects, with their families and establishments, shall be allowed to reside, for the purpose of carrying on their Mercantile pursuits, without molestation or restraint at "the Cities and Towns of Canton, Amoy, Foochow-fu, Ningpo, and Shanghai".

        Article III: "His Majesty the Emperor of China cedes to Her Majesty the Queen of Great Britain, etc., the Island of Hongkong, to be possessed in perpetuity by Her Britannic Majesty, Her Heirs and Successors, and to be governed by such Laws and Regulations as Her Majesty the Queen of Great Britain, etc., shall see fit to direct."

        — Treaty of Nanking, signed aboard a British warship, 29 August 1842, ending the First Opium War (Article II paraphrased except for the names of the ports; Article III quoted)
      prompt: |
        Which later development in China most directly continued the pattern established by this treaty?
      options:
        - "The Meiji Restoration"
        - "The Berlin Conference"
        - "The spheres of influence carved out by Germany, Russia, Britain, France and Japan after 1895, and the Boxer Protocol's indemnity of 1901"
        - "The Qing conquest of Xinjiang"
      option_explanations:
        - |
          The Meiji Restoration (1868) was Japan's response to its own unequal treaties, not a development in China.
        - |
          The Berlin Conference of 1884–85 set rules for European claims in Africa and had nothing to do with China.
        - |
          Correct. Leased ports, railway and mining concessions and the Boxer indemnity extended the loss of economic sovereignty that began with Nanjing, still without formal colonisation.
        - |
          Xinjiang was conquered in the 1750s, long before, and was an act of Qing expansion rather than of foreign control.
      answer: 2
      explanation: |
        Skill: continuity and change. Nanjing opened the "century of humiliation"; spheres and indemnities were its later chapters.

    # ---- Stimulus set B: Roosevelt Corollary (6.5)
    - slug: apworld-u06-w21-q04
      type: multiple_choice
      topic_code: "6.5"
      source: "Primary source: Theodore Roosevelt, Fourth Annual Message to Congress, 6 December 1904 (U.S. government work), American Presidency Project"
      points: 1
      stimulus: |
        "Chronic wrongdoing, or an impotence which results in a general loosening of the ties of civilized society, may in America, as elsewhere, ultimately require intervention by some civilized nation, and in the Western Hemisphere the adherence of the United States to the Monroe Doctrine may force the United States, however reluctantly, in flagrant cases of such wrongdoing or impotence, to the exercise of an international police power."

        — President Theodore Roosevelt, Annual Message to Congress, 6 December 1904
      prompt: |
        Roosevelt's statement most directly reflects which development in the relationship between the United States and Latin America?
      options:
        - "The abolition of the Monroe Doctrine"
        - "The formation of a military alliance among all American republics"
        - "The United States' decision to withdraw from Caribbean affairs"
        - "A shift from warning Europeans away from the hemisphere (the Monroe Doctrine of 1823) to claiming a U.S. right to intervene in Latin American states itself"
      option_explanations:
        - |
          Roosevelt explicitly builds on the doctrine ("the adherence of the United States to the Monroe Doctrine").
        - |
          No alliance is proposed; the message asserts a unilateral U.S. power.
        - |
          The message justifies intervention, and marine landings in the Dominican Republic, Nicaragua and Haiti followed within a decade.
        - |
          Correct. Monroe had told Europe to stay out; Roosevelt added that the United States would police "wrongdoing or impotence" itself, in practice collecting debts and controlling customs.
      answer: 3
      explanation: |
        Skill: continuity and change. The corollary kept the doctrine's name and changed its meaning from defensive to interventionist.

    - slug: apworld-u06-w21-q05
      type: multiple_choice
      topic_code: "6.5"
      source: "Primary source: Theodore Roosevelt, Fourth Annual Message to Congress, 6 December 1904 (U.S. government work), American Presidency Project"
      points: 1
      stimulus: |
        "Chronic wrongdoing, or an impotence which results in a general loosening of the ties of civilized society, may in America, as elsewhere, ultimately require intervention by some civilized nation, and in the Western Hemisphere the adherence of the United States to the Monroe Doctrine may force the United States, however reluctantly, in flagrant cases of such wrongdoing or impotence, to the exercise of an international police power."

        — President Theodore Roosevelt, Annual Message to Congress, 6 December 1904
      prompt: |
        The immediate historical situation behind the message was
      options:
        - "the Boxer Rebellion in China"
        - "the Mexican Revolution"
        - "European naval pressure on Venezuela and the Dominican Republic to collect unpaid debts, which Roosevelt wanted to pre-empt"
        - "the outbreak of the First World War"
      option_explanations:
        - |
          The Boxer rising (1899–1901) was in China; Roosevelt's message concerns the Western Hemisphere.
        - |
          The Mexican Revolution began in 1910, six years later.
        - |
          Correct. In 1902–03 Britain, Germany and Italy blockaded Venezuela over debts, and the Dominican Republic faced the same; Roosevelt's answer was a U.S. customs receivership (1905) so that Europeans had no reason to land.
        - |
          The First World War began in 1914, a decade after this message, and could not have prompted it.
      answer: 2
      explanation: |
        Skill: historical situation. A source's date (1904) and its talk of "impotence" point to the debt crises of the Caribbean republics.

    - slug: apworld-u06-w21-q06
      type: multiple_choice
      topic_code: "6.5"
      source: "Primary source: Theodore Roosevelt, Fourth Annual Message to Congress, 6 December 1904 (U.S. government work), American Presidency Project"
      points: 1
      stimulus: |
        "Chronic wrongdoing, or an impotence which results in a general loosening of the ties of civilized society, may in America, as elsewhere, ultimately require intervention by some civilized nation, and in the Western Hemisphere the adherence of the United States to the Monroe Doctrine may force the United States, however reluctantly, in flagrant cases of such wrongdoing or impotence, to the exercise of an international police power."

        — President Theodore Roosevelt, Annual Message to Congress, 6 December 1904
      prompt: |
        Roosevelt's phrase "some civilized nation" draws on the same assumption as which other source of the period?
      options:
        - "Lin Zexu's letter to Queen Victoria"
        - "Kipling's poem The White Man's Burden, which also treated rule by so-called civilized powers over others as a duty"
        - "The Treaty of Nanjing"
        - "The Taiping land programme"
      option_explanations:
        - |
          Lin Zexu appealed to shared moral principles against the opium trade; he did not rank nations as civilized or not.
        - |
          Correct. Both texts assume a hierarchy of nations in which the "civilized" have a right and duty to act over the rest, the civilizing-mission ideology of topic 6.1.
        - |
          The treaty records terms imposed after a war; it does not argue from civilization.
        - |
          The Taiping programme was a Chinese rebel manifesto about land and morals, unrelated to Western claims of civilization.
      answer: 1
      explanation: |
        Skill: making connections across sources. U.S. intervention in the Caribbean used the same vocabulary as European empire in Africa and Asia.

    # ---- Stimulus set C: export table (6.4)
    - slug: apworld-u06-w21-q07
      type: multiple_choice
      topic_code: "6.4"
      source: "Data table compiled for this course from standard trade estimates for c. 1900, rounded"
      points: 1
      stimulus: |
        Share of total exports held by the leading export commodity, c. 1900 (approximate):

        | Country or colony | Leading export | Share of exports |
        |---|---|---|
        | Cuba | sugar | about 70% |
        | Brazil | coffee | about 60% |
        | Egypt | raw cotton | about 80% |
        | Chile | nitrates | about 65% |
        | Ceylon | tea | about 55% |
        | Gold Coast (by 1911) | cocoa | about 50% |
        | Britain | manufactured goods (cotton textiles largest) | about 75% manufactures |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "By 1900 many colonies and independent countries depended on a single raw-material export, while Britain exported manufactured goods."
        - "Britain's economy was as dependent on one crop as Cuba's."
        - "Egypt's cotton was mostly consumed within Egypt."
        - "Chile had no export economy."
      option_explanations:
        - |
          Correct. Six of the seven rows show one commodity at 50–80% of exports; the industrial country stands apart as an exporter of manufactures.
        - |
          Britain's row is about manufactured goods in general, which includes many products; it is the mirror image of monoculture, not an example of it.
        - |
          The table is about exports; Egyptian cotton went to British and French mills.
        - |
          Nitrates at about 65% of exports are the definition of an export economy.
      answer: 0
      explanation: |
        Skill: analysing data. The table shows the division of labour topic 6.4 describes: raw-material exporters and industrial exporters.

