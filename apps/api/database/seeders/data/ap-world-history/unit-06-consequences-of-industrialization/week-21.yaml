      source: "Data table compiled for this course from standard trade estimates for c. 1900, rounded"
      points: 1
      stimulus: |
        Share of total exports held by the leading export commodity, c. 1900 (approximate):

        | Country or colony | Leading export | Share of exports |
        |---|---|---|
        | Cuba | sugar | about 70% |
        | Brazil | coffee | about 60% |
        | Egypt | raw cotton | about 80% |
        | Chile | nitrates | about 65% |
        | Ceylon | tea | about 55% |
        | Gold Coast (by 1911) | cocoa | about 50% |
        | Britain | manufactured goods (cotton textiles largest) | about 75% manufactures |
      prompt: |
        Which of the following was a likely consequence of the pattern shown for Cuba, Brazil and Egypt?
      options:
        - "The end of foreign investment"
        - "Immunity from world price changes"
        - "Rapid industrialization funded by export earnings"
        - "Vulnerability to a fall in the price of one commodity, and reliance on imported food and manufactured goods"
      option_explanations:
        - |
          Export economies attracted foreign investment in railways, ports and plantations; they did not end it.
        - |
          Dependence on one commodity meant the opposite: a price fall hit the whole economy.
        - |
          Export earnings mostly flowed to foreign investors, landowners and imports of manufactures; none of these three industrialised in this period.
        - |
