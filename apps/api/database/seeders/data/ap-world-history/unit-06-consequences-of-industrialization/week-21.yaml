    # ---- Short answer (SAQ)
    - slug: apworld-u06-w21-q24
      type: short_answer
      topic_code: "6.5"
      source: "Primary source: Treaty of Nanking (1842), World and Japan database; and the Monroe Doctrine (1823), Avalon Project"
      points: 3
      stimulus: |
        Source 1: "His Majesty the Emperor of China cedes to Her Majesty the Queen of Great Britain, etc., the Island of Hongkong, to be possessed in perpetuity by Her Britannic Majesty, Her Heirs and Successors" — Treaty of Nanking, Article III, 29 August 1842.

        Source 2: "we should consider any attempt on their part to extend their system to any portion of this hemisphere as dangerous to our peace and safety." — President James Monroe, message to Congress, 2 December 1823, referring to the European powers.
      prompt: |
        Using the two sources, answer (a), (b) and (c).

        (a) Describe ONE difference between the forms of foreign economic influence that developed in China after Source 1 and in Latin America in the decades after Source 2.
        (b) Explain ONE way Source 1 reflects the military advantage of industrial states in the nineteenth century.
        (c) Explain ONE way the policy stated in Source 2 was changed or extended by the United States by the early twentieth century.
      answer: |
        (a) In China foreign influence was formalised in treaties that opened ports, fixed tariffs and granted extraterritoriality, backed by wars and later spheres of influence; in Latin America the republics kept full legal sovereignty and foreign influence worked through British loans, foreign-owned railways and trade, with U.S. military intervention only after 1900.
        (b) Britain could dictate the cession of Hong Kong and the opening of ports because steam gunboats and modern artillery had defeated Qing forces easily in 1839–42; the treaty was signed aboard a British warship, and the same technological gap later produced the unequal treaties of 1858–60.
        (c) The Roosevelt Corollary of 1904 turned Monroe's warning to Europe into a U.S. claim to "international police power" in the hemisphere, used to take over customs houses and land marines in the Dominican Republic, Nicaragua and Haiti; or the United States built the Panama Canal after backing Panama's secession from Colombia in 1903.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate contrast between treaty-based, war-backed economic imperialism in China and finance-and-trade-based influence over sovereign Latin American states (with U.S. intervention as a later addition). Zero for saying Latin America was colonised by Britain.

        (b) 1 pt: links the treaty's terms to industrial military power: gunboats, artillery, the ease of the British victory; or notes the warship signing. Zero for describing the terms without the connection to force.

        (c) 1 pt: a specific extension: the Roosevelt Corollary and its interventions; the Panama Canal; dollar diplomacy; the Platt Amendment in Cuba (1901). Zero for a vague "the U.S. became more powerful".

    - slug: apworld-u06-w21-q25
      type: short_answer
      topic_code: "6.4"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE cash crop or raw material that a colony or dependent region exported to industrial states in the period 1750–1900, and name the region.
        (b) Explain ONE environmental consequence of the growth of export agriculture or mining in this period.
        (c) Explain ONE way the growth of export economies affected the political or economic independence of a region.
      answer: |
        (a) Raw cotton from Egypt or India; rubber from the Congo Free State or Malaya; guano and nitrates from Peru and Chile; coffee from Brazil; sugar from Cuba; palm oil or cocoa from West Africa; tea from Ceylon.
        (b) Forest clearance for coffee in Brazil and tea in Ceylon; soil exhaustion under continuous cotton or sugar; the mining out of guano deposits and the destruction of bird populations; the overtapping of wild rubber trees in the Amazon and Congo.
        (c) Export earnings and the loans raised against them tied governments to foreign creditors: Egypt's cotton debt led to British occupation in 1882; Peru's guano debt led to default and the loss of its nitrate provinces; Argentina's British-owned railways and banks gave London influence over a sovereign republic.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a correctly paired commodity and region from the period. Zero for a manufactured good or a mismatched pair (tea from Egypt).

        (b) 1 pt: an environmental effect explained, not just named: deforestation, soil exhaustion, erosion, resource exhaustion, species loss. Zero for a purely economic consequence.

        (c) 1 pt: a specific link between exports or export-backed debt and loss of independence or policy control: Egypt 1882; Peru 1876–84; British informal empire in Argentina; U.S. customs receiverships; Java's cultivation system. Zero for a general claim with no case.

    # ---- Long answer (LEQ)
    - slug: apworld-u06-w21-q26
      type: long_answer
      topic_code: "6.5"
      source: "general knowledge"
      points: 6
      prompt: |
        In the period 1750–1900 industrial states gained control over the economies of regions in Asia, Africa and Latin America by a variety of means, from formal colonial rule to treaties, loans and investment.

        Evaluate the extent to which economic imperialism in China and Latin America in the period 1750–1900 differed from formal colonial rule in regions such as India and Africa.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Economic imperialism in China and Latin America differed from formal rule in its political form (sovereignty kept, foreign governors absent) but produced similar economic results: export dependence, foreign control of tariffs, railways and finance, and the use of force when needed; the difference was substantial in politics and limited in economics.

        Context: Industrial demand for raw materials and markets; new military technology; the earlier maritime empires' coastal posts.

        Body 1 (differences): India and Africa had foreign governments that could force crops (Java's cultivation system), levy taxes and recruit armies; China kept its emperor and Latin American republics their constitutions; influence came through the Treaty of Nanjing, spheres of influence, British loans and the Roosevelt Corollary.

        Body 2 (similarities): all became raw-material exporters (Indian cotton, Egyptian cotton, Chilean nitrates, Argentine beef, Cuban sugar); foreign capital built the railways; tariffs were set abroad in China and in colonies alike; force underpinned all of them (Opium Wars, 1900 expedition, U.S. marines, colonial conquest).

        Body 3 (why the difference): size and cohesion of the Qing state and the Latin American republics, and great-power rivalry (Open Door) made partition unnecessary or impractical; colonies were taken where states were small or divided.

        Complexity: the line between formal and informal empire shifted over time (Egypt from debt to occupation; Hong Kong and the leased ports as colonies within a semi-colony).
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim on the extent of difference with a line of reasoning (e.g. politically different, economically similar). Zero for "they were different in some ways and similar in others" without specifying.

        Contextualization (0–1): industrialization's demand for raw materials and capital outlets; earlier maritime empires; the weakness of the Qing and the new Latin American republics; the ideologies of 6.1.

        Evidence (0–2): 1 pt for at least two specific examples (Treaty of Nanjing, extraterritoriality, spheres of influence, Boxer Protocol, British railways in Argentina, Peru's guano debt, the Roosevelt Corollary, Java's cultivation system, Indian cotton and famines, Congo rubber). 2 pts for using them to support the comparison.

        Analysis and reasoning (0–2): 1 pt for a comparative structure. 1 pt for complexity: explaining why some regions were colonised and others not; showing change over time (Egypt, the leased ports); weighing political against economic measures; noting local agency (West African smallholders, Argentine elites).

        Common errors: calling China a colony; treating Latin America as politically ruled by Britain; ignoring the role of force in economic imperialism; omitting Latin America entirely.
