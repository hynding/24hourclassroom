unit: 6
description: |
  45 questions · about 75 minutes · every topic of unit 6 (6.1 to 6.8) with review of units 4 and 5. Four
  source-based multiple-choice sets in the AP style (Hobson on the economics of empire, the Meiji Constitution,
  Twain's anti-imperialist satire, and a table of foreign investment and exports), stand-alone multiple choice,
  select-all, true/false and fill-in-the-blank items, one short-answer question (3 points) on a described
  photograph, and one long essay question (6 points) on continuity and change. Multiple choice, select-all and
  true/false items are graded at once; fill-in-the-blank items are matched automatically; the free-response items
  are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: Hobson on the economics of empire (6.1, 6.5, 6.8)
  - slug: apworld-u06-exam-q01
    type: multiple_choice
    topic_code: "6.1"
    source: "Primary source: J. A. Hobson, Imperialism: A Study (1902), Library of Economics and Liberty (1902 edition, James Pott and Co.)"
    points: 1
    stimulus: |
      "It is this economic condition of affairs that forms the taproot of Imperialism." Hobson concludes that "Imperialism is the endeavour of the great controllers of industry to broaden the channel for the flow of their surplus wealth by seeking foreign markets and foreign investments".

      — J. A. Hobson, British economist, Imperialism: A Study, 1902, written after he reported on the South African War
    prompt: |
      Hobson's argument most directly challenges which contemporary justification for empire?
    options:
      - "The claim that migration should be restricted"
      - "The claim that colonies were acquired to spread civilization and Christianity"
      - "The claim that Africa was unoccupied"
      - "The claim that Japan was an imperial power"
    option_explanations:
      - |
        Migration restriction is a separate question from the economic roots of empire.
      - |
        Correct. By locating the root of empire in surplus capital seeking outlets, Hobson denies that the civilizing mission was the real motive and recasts it as a cover for financial interests.
      - |
        Hobson's argument concerns motives in the metropole, not the population of Africa.
      - |
        Japan's expansion is not mentioned; Hobson wrote about British and European finance.
    answer: 1
    explanation: |
      Skill: claims and evidence. A critic's thesis is best understood against the claim it answers: here the civilizing mission.

  - slug: apworld-u06-exam-q02
    type: multiple_choice
    topic_code: "6.5"
    source: "Primary source: J. A. Hobson, Imperialism: A Study (1902), Library of Economics and Liberty (1902 edition, James Pott and Co.)"
    points: 1
    stimulus: |
      "It is this economic condition of affairs that forms the taproot of Imperialism." Hobson concludes that "Imperialism is the endeavour of the great controllers of industry to broaden the channel for the flow of their surplus wealth by seeking foreign markets and foreign investments".

      — J. A. Hobson, British economist, Imperialism: A Study, 1902, written after he reported on the South African War
    prompt: |
      Which of the following developments would Hobson most likely have cited as evidence for his argument?
    options:
      - "The Treaty of Waitangi"
      - "The abolition of Indian indenture in 1917"
      - "The Ghost Dance of 1889–90"
      - "British loans to Egypt and Peru and British ownership of Argentine railways, which gave London financial control over regions it did not govern"
    option_explanations:
      - |
        Waitangi (1840) was a treaty with Maori chiefs about sovereignty and land, not about capital exports.
      - |
        Indenture's abolition came after Hobson wrote and concerned labour, not investment.
      - |
        The Ghost Dance was an indigenous religious response to conquest, unrelated to finance.
      - |
        Correct. Foreign investment seeking returns abroad is exactly the "flow of their surplus wealth" Hobson describes; Egypt's debt leading to occupation would be his ideal case.
    answer: 3
    explanation: |
      Skill: using evidence to support a claim. Match the argument (capital exports drive empire) to the cases that show capital at work.

  - slug: apworld-u06-exam-q03
    type: multiple_choice
    topic_code: "6.8"
    source: "Primary source: J. A. Hobson, Imperialism: A Study (1902), Library of Economics and Liberty (1902 edition, James Pott and Co.)"
    points: 1
    stimulus: |
      "It is this economic condition of affairs that forms the taproot of Imperialism." Hobson concludes that "Imperialism is the endeavour of the great controllers of industry to broaden the channel for the flow of their surplus wealth by seeking foreign markets and foreign investments".

      — J. A. Hobson, British economist, Imperialism: A Study, 1902, written after he reported on the South African War
    prompt: |
      A historian evaluating the relative significance of causes of imperialism might qualify Hobson's argument by noting that
    options:
      - "no European state acquired colonies after 1870"
      - "many colonies, such as Germany's in Africa, cost more than they earned and were held for national prestige, which suggests that nationalism and rivalry mattered independently of profit"
      - "Hobson supported the Boer War"
      - "surplus capital did not exist in Britain"
    option_explanations:
      - |
        The scramble for Africa took place almost entirely after 1870.
      - |
        Correct. Unprofitable colonies are the standard objection to a purely economic explanation; a complex 6.8 argument weighs prestige and ideology alongside finance.
      - |
        Hobson opposed the Boer War and wrote his book partly because of it.
      - |
        Britain was the world's largest exporter of capital in 1900; the question is whether that explains empire, not whether it existed.
    answer: 1
    explanation: |
      Skill: argumentation (relative significance). Qualifying a monocausal thesis with cases it cannot explain is the complexity move.

  # ---- Stimulus set B: Meiji Constitution (6.2, 5.4, 6.8)
  - slug: apworld-u06-exam-q04
    type: multiple_choice
    topic_code: "6.2"
    source: "Primary source: Constitution of the Empire of Japan (1889), English translation by Ito Miyoji (1889), National Diet Library of Japan"
    points: 1
    stimulus: |
      "Article 1. The Empire of Japan shall be reigned over and governed by a line of Emperors unbroken for ages eternal.
      Article 3. The Emperor is sacred and inviolable.
      Article 4. The Emperor is the head of the Empire, combining in Himself the rights of sovereignty, and exercises them, according to the provisions of the present Constitution."

      — Constitution of the Empire of Japan, promulgated 11 February 1889, translated into English the same year by Ito Miyoji
    prompt: |
      The constitution is best understood as evidence that Japan's leaders sought to
    options:
      - "abolish the monarchy and establish a republic on the French model"
      - "build a centralised modern state, with the emperor as the symbol of sovereignty, strong enough to compete with the Western powers"
      - "restore the Tokugawa shogunate"
      - "accept Chinese tributary status"
    option_explanations:
      - |
        The articles make the emperor sacred and sovereign; nothing could be further from a republic.
      - |
        Correct. Modelled on Prussia's constitution, it concentrated authority in the imperial state while adopting Western constitutional forms, the political base for industrialization and empire.
      - |
        The Meiji Restoration of 1868 had overthrown the shogunate; the constitution confirmed imperial rule.
      - |
        Japan had left the Chinese order and would defeat China six years later.
    answer: 1
    explanation: |
      Skill: sourcing (purpose). A constitution's articles on sovereignty tell you what kind of state its authors wanted.

  - slug: apworld-u06-exam-q05
    type: multiple_choice
    topic_code: "5.4"
    source: "Primary source: Constitution of the Empire of Japan (1889), English translation by Ito Miyoji (1889), National Diet Library of Japan"
    points: 1
    stimulus: |
      "Article 1. The Empire of Japan shall be reigned over and governed by a line of Emperors unbroken for ages eternal.
      Article 3. The Emperor is sacred and inviolable.
      Article 4. The Emperor is the head of the Empire, combining in Himself the rights of sovereignty, and exercises them, according to the provisions of the present Constitution."

      — Constitution of the Empire of Japan, promulgated 11 February 1889, translated into English the same year by Ito Miyoji
    prompt: |
      The constitution was one part of a broader transformation of Japan after 1868 that also included
    options:
      - "the division of Japan into European colonies"
      - "state-sponsored railways, shipyards and arsenals, a conscript army and compulsory schooling"
      - "the closing of Japan to all foreign trade"
      - "the adoption of the Chinese examination system"
    option_explanations:
      - |
        Japan revised its unequal treaties and became a coloniser; it was never partitioned.
      - |
        Correct. The Meiji state industrialised from above (unit 5) and built the army and navy that took Taiwan in 1895 and Korea in 1910.
      - |
        Seclusion ended in the 1850s; Meiji Japan sent missions abroad and imported technology.
      - |
        Japan adopted Western schooling and law, not the Chinese examinations.
    answer: 1
    explanation: |
      Review of 5.4 (industrialization spreads): the constitution and the factories were two sides of the same programme.

  - slug: apworld-u06-exam-q06
    type: multiple_choice
    topic_code: "6.8"
    source: "Primary source: Constitution of the Empire of Japan (1889), English translation by Ito Miyoji (1889), National Diet Library of Japan"
    points: 1
    stimulus: |
      "Article 1. The Empire of Japan shall be reigned over and governed by a line of Emperors unbroken for ages eternal.
      Article 3. The Emperor is sacred and inviolable.
      Article 4. The Emperor is the head of the Empire, combining in Himself the rights of sovereignty, and exercises them, according to the provisions of the present Constitution."

      — Constitution of the Empire of Japan, promulgated 11 February 1889, translated into English the same year by Ito Miyoji
    prompt: |
      Japan's path after 1868 is most significant for the history of imperialism because it shows that
    options:
      - "constitutions prevented imperial expansion"
      - "Japan remained a victim of the unequal treaties until 1945"
      - "only Western nations could industrialise"
      - "a non-Western state could adopt industrial technology and Western political forms and become an imperial power itself, defeating China (1895) and Russia (1905)"
    option_explanations:
      - |
        The constitution helped organise the state that expanded.
      - |
        Japan renegotiated its unequal treaties by 1899 and imposed treaties of its own on Korea and China.
      - |
        Japan's industrialization disproves the claim.
      - |
        Correct. Japan's example complicates any account of imperialism as purely Western and inspired nationalists across Asia after 1905.
    answer: 3
    explanation: |
      Skill: making connections (6.8). Japan is the case that turns a victim of economic imperialism into an imperial state within forty years.

  # ---- Stimulus set C: Twain's satire (6.1, 6.2, 6.3)
  - slug: apworld-u06-exam-q07
    type: multiple_choice
    topic_code: "6.1"
    source: "Primary source: Mark Twain, To the Person Sitting in Darkness, North American Review, February 1901, Project Gutenberg eBook #62636"
    points: 1
    stimulus: |
      Twain describes imperialism as a "game" played by the European powers and, after 1898, by the United States in the Philippines: "There is more money in it, more territory, more sovereignty and other kinds of emolument, than there is in any other game that is played."

      — Mark Twain, American writer and vice-president of the Anti-Imperialist League, "To the Person Sitting in Darkness", North American Review, February 1901
    prompt: |
      Twain's purpose in the essay was most directly to
    options:
      - "persuade Americans to annex Cuba"
      - "expose the gap between the civilizing rhetoric of imperialism and its pursuit of money, territory and power, in order to turn American opinion against the war in the Philippines"
      - "praise Kipling's call for the United States to take up the white man's burden"
      - "describe the economics of the opium trade"
    option_explanations:
      - |
        Twain opposed annexations; the essay attacks the Philippine war and the Boxer-era interventions in China.
      - |
        Correct. The "game" metaphor and the list of money, territory and sovereignty strip the civilizing mission of its moral cover; Twain wrote as a leading anti-imperialist.
      - |
        Twain's essay is a direct answer to the kind of argument Kipling made two years earlier.
      - |
        The essay mentions China's treatment by the powers but is not an economic study of opium.
    answer: 1
    explanation: |
      Skill: sourcing (purpose and audience). Satire works by contrast; identify what is being contrasted (rhetoric and interest) and for whom (American readers in 1901).

  - slug: apworld-u06-exam-q08
    type: multiple_choice
    topic_code: "6.2"
    source: "Primary source: Mark Twain, To the Person Sitting in Darkness, North American Review, February 1901, Project Gutenberg eBook #62636"
    points: 1
    stimulus: |
      Twain describes imperialism as a "game" played by the European powers and, after 1898, by the United States in the Philippines: "There is more money in it, more territory, more sovereignty and other kinds of emolument, than there is in any other game that is played."

      — Mark Twain, American writer and vice-president of the Anti-Imperialist League, "To the Person Sitting in Darkness", North American Review, February 1901
    prompt: |
      The events of 1898–1901 that provoked the essay included
    options:
      - "the U.S. acquisition of the Philippines, Puerto Rico and Guam from Spain and the war against Filipino independence forces"
      - "the French conquest of Algeria"
      - "the Sepoy Rebellion"
      - "the Berlin Conference"
    option_explanations:
      - |
        Correct. The Treaty of Paris (1898) transferred Spain's colonies; the Philippine-American War began in 1899 and the eight-nation expedition against the Boxers in 1900 added to Twain's targets.
      - |
        Algeria was conquered from 1830, seventy years earlier, by France.
      - |
        The rebellion of 1857 concerned British India two generations before.
      - |
        Berlin (1884–85) was a European conference on Africa.
    answer: 0
    explanation: |
      Skill: historical situation. The date (February 1901) and the author's nationality point to the Philippine war.

  - slug: apworld-u06-exam-q09
    type: multiple_choice
    topic_code: "6.3"
    source: "Primary source: Mark Twain, To the Person Sitting in Darkness, North American Review, February 1901, Project Gutenberg eBook #62636"
    points: 1
    stimulus: |
      Twain describes imperialism as a "game" played by the European powers and, after 1898, by the United States in the Philippines: "There is more money in it, more territory, more sovereignty and other kinds of emolument, than there is in any other game that is played."

      — Mark Twain, American writer and vice-president of the Anti-Imperialist League, "To the Person Sitting in Darkness", North American Review, February 1901
    prompt: |
      The "person sitting in darkness" of Twain's title refers to colonised peoples; which contemporary response by such peoples would most directly support Twain's view that they did not welcome the "blessings" of empire?
    options:
      - "The Filipino independence forces under Aguinaldo fighting the United States from 1899, and the Boxers attacking foreigners in China in 1900"
      - "The Cherokee adoption of a written constitution in 1827"
      - "The abolition of the Dutch East India Company in 1799"
      - "The purchase of Alaska in 1867"
    option_explanations:
      - |
        Correct. Both movements were under way as Twain wrote and are the "darkness" he ironically describes as resisting enlightenment.
      - |
        The Cherokee constitution was a response to American expansion seventy years earlier, not to the events of 1899–1901.
      - |
        The VOC's bankruptcy was a Dutch decision, not a response by colonised peoples.
      - |
        Alaska was purchased from Russia; no colonised people resisted in Twain's sense.
    answer: 0
    explanation: |
      Skill: making connections. Pair a critic in the metropole with the resistance abroad that he defends.

  # ---- Stimulus set D: investment and exports table (6.4, 6.5, 6.8)
  - slug: apworld-u06-exam-q10
    type: multiple_choice
    topic_code: "6.5"
    source: "Data table compiled for this course from standard estimates of British overseas investment and export dependence, c. 1913, rounded"
    points: 1
    stimulus: |
      British overseas investment and the leading export of selected regions, c. 1913 (approximate):

      | Region | Political status | British investment (million pounds) | Leading export |
      |---|---|---|---|
      | India | British colony | 380 | cotton, jute, tea |
      | Argentina | independent republic | 320 | beef, wheat |
      | Brazil | independent republic | 150 | coffee |
      | China | independent, under unequal treaties | 45 | silk, tea |
      | Egypt | British occupation (since 1882) | 45 | cotton |
      | Mexico | independent republic | 100 | silver, copper, oil |
    prompt: |
      Which conclusion is best supported by the table?
    options:
      - "British capital flowed only to British colonies."
      - "Argentina attracted almost as much British investment as India despite being an independent republic, which supports the idea of a British informal empire in Latin America."
      - "China received more British investment than any other region."
      - "Egypt was an independent republic in 1913."
    option_explanations:
      - |
        Four of the six regions were not British colonies and together received more British capital than India.
      - |
        Correct. 320 million pounds in a sovereign state, in railways, banks and ranches, is the financial basis of economic imperialism without political rule.
      - |
        China's 45 million was the smallest figure alongside Egypt's.
      - |
        The table marks Egypt as under British occupation since 1882.
    answer: 1
    explanation: |
      Skill: analysing data. Compare the political-status column with the investment column; the mismatch is the point.

  - slug: apworld-u06-exam-q11
    type: multiple_choice
    topic_code: "6.4"
    source: "Data table compiled for this course from standard estimates of British overseas investment and export dependence, c. 1913, rounded"
    points: 1
    stimulus: |
      British overseas investment and the leading export of selected regions, c. 1913 (approximate):

      | Region | Political status | British investment (million pounds) | Leading export |
      |---|---|---|---|
      | India | British colony | 380 | cotton, jute, tea |
      | Argentina | independent republic | 320 | beef, wheat |
      | Brazil | independent republic | 150 | coffee |
      | China | independent, under unequal treaties | 45 | silk, tea |
      | Egypt | British occupation (since 1882) | 45 | cotton |
      | Mexico | independent republic | 100 | silver, copper, oil |
    prompt: |
      The "leading export" column is best explained by
    options:
      - "the absence of foreign trade before 1900"
      - "the Berlin Conference's allocation of crops"
      - "the reorganisation of these economies around raw materials and cash crops demanded by industrial states, often financed by the investment shown in the third column"
      - "the industrialization of each region"
    option_explanations:
      - |
        All six had traded abroad for centuries; what changed was scale and specialisation.
      - |
        Berlin allocated territory in Africa, not crops.
      - |
        Correct. Railways, ports and plantations built with British capital carried cotton, beef and coffee to industrial buyers; investment and monoculture were one system.
      - |
        None of these regions had industrialised; they exported raw materials and imported manufactures.
    answer: 2
    explanation: |
      Skill: causation. The two columns are linked: capital built the infrastructure that specialised the economy.

  - slug: apworld-u06-exam-q12
    type: multiple_choice
    topic_code: "6.8"
    source: "Data table compiled for this course from standard estimates of British overseas investment and export dependence, c. 1913, rounded"
    points: 1
    stimulus: |
      British overseas investment and the leading export of selected regions, c. 1913 (approximate):

      | Region | Political status | British investment (million pounds) | Leading export |
      |---|---|---|---|
      | India | British colony | 380 | cotton, jute, tea |
      | Argentina | independent republic | 320 | beef, wheat |
      | Brazil | independent republic | 150 | coffee |
      | China | independent, under unequal treaties | 45 | silk, tea |
      | Egypt | British occupation (since 1882) | 45 | cotton |
      | Mexico | independent republic | 100 | silver, copper, oil |
    prompt: |
      A historian using this table to argue that the most significant effect of imperialism was economic rather than political would emphasise that
    options:
      - "political status varied widely across the regions while the pattern of raw-material exports and foreign investment was the same in all of them"
      - "India was the only colony"
      - "Mexico exported oil"
      - "British investment in China was large"
    option_explanations:
      - |
        Correct. The uniformity of the economic pattern across colonies, an occupied country, a semi-colony and three republics is the strongest evidence that the economic structure mattered more than the political form.
      - |
        India's status is one row; the argument rests on the comparison across rows.
      - |
        One export is a detail, not an argument about significance.
      - |
        China's investment figure was the smallest.
    answer: 0
    explanation: |
      Skill: argumentation (6.8). Relative-significance arguments rest on patterns that hold across cases.

  # ---- Stand-alone multiple choice (6.1–6.8 and review)
  - slug: apworld-u06-exam-q13
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Social Darwinism contributed to imperialism by
    options:
      - "opposing missionary activity"
      - "demanding free trade with China"
      - "arguing that all human societies were equal"
      - "applying the idea of survival of the fittest to nations and races, so that conquest of the supposedly less fit appeared natural and even beneficial"
    option_explanations:
      - |
        Missions and Social Darwinism often coexisted in the civilizing mission.
      - |
        Trade policy toward China came from commercial interests, not from Social Darwinism.
      - |
        Social Darwinism ranked societies; equality was the view of its critics.
      - |
        Correct. Writers such as Herbert Spencer and their popularisers turned biology into a hierarchy that justified rule by supposedly fitter peoples.
    answer: 3
    explanation: |
      Skill: developments and processes. One of the 6.1 ideologies, with its mechanism.

  - slug: apworld-u06-exam-q14
    type: multiple_choice
    topic_code: "6.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best describes the rule of "effective occupation" agreed at the Berlin Conference?
    options:
      - "A European claim to African territory required actual administrative presence and notification to the other powers, which encouraged a race to sign treaties and station troops"
      - "African rulers had to approve any European claim"
      - "Only Britain could claim territory in Africa"
      - "Territory could be claimed by discovery alone"
    option_explanations:
      - |
        Correct. The General Act of 1885 replaced vague coastal claims with a requirement of authority on the ground, which accelerated the scramble.
      - |
        No African ruler attended the conference or had any role under its rules.
      - |
        Seven European states claimed African territory under the rules.
      - |
        Discovery claims were exactly what the rule replaced.
    answer: 0
    explanation: |
      Skill: developments and processes. Berlin's rule explains the speed of partition after 1885.

  - slug: apworld-u06-exam-q15
    type: multiple_choice
    topic_code: "6.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following is the best example of a settler colony in the period 1750–1900?
    options:
      - "British Nigeria"
      - "The Dutch East Indies"
      - "French Algeria, where about a million Europeans had taken land by 1900 and the territory was annexed as departments of France"
      - "The Congo Free State"
    option_explanations:
      - |
        Nigeria was governed through indirect rule by a small number of officials; few Britons settled.
      - |
        Java was a colony of rule and forced crops; Dutch settlers were few.
      - |
        Correct. Large European settlement, land seizure and legal incorporation into the metropole define the settler colony, which is why decolonization there became a war.
      - |
        The Congo was Leopold II's extractive possession with almost no European settlement.
    answer: 2
    explanation: |
      Skill: comparison. Settler colonies versus colonies of rule is a distinction the exam uses repeatedly.

  - slug: apworld-u06-exam-q16
    type: multiple_choice
    topic_code: "6.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Russia's conquest of Central Asia in the 1860s–80s and Britain's expansion in India were similar in that both
    options:
      - "were overseas maritime empires"
      - "involved the conquest of Muslim states by an industrialising power and were partly motivated by the demand for cotton"
      - "were carried out by chartered companies throughout"
      - "ended in the 1850s"
    option_explanations:
      - |
        Russia's expansion was overland across contiguous territory; India was reached by sea.
      - |
        Correct. Tashkent (1865), Samarkand (1868) and Khiva (1873) fell to Russian armies seeking cotton after the American Civil War and security against Britain; India's cotton was Britain's alternative supply.
      - |
        Russia's conquest was a state enterprise from the start; Britain's passed from Company to Crown in 1858.
      - |
        Both continued into the 1880s and beyond.
    answer: 1
    explanation: |
      Skill: comparison. The CED names Russia as an expanding state; cotton links its conquests to the export economy.

  - slug: apworld-u06-exam-q17
    type: multiple_choice
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which pair of events best illustrates the contrast between African success and failure against European invasion in the 1890s?
    options:
      - "Adwa (1896), where Ethiopia defeated Italy, and Omdurman (1898), where the Mahdist army was destroyed"
      - "Isandlwana (1879) and Ulundi (1879)"
      - "The Xhosa cattle killing and the Ghost Dance"
      - "The Berlin Conference and the Boxer Protocol"
    option_explanations:
      - |
        Correct. Two African armies two years apart: one with modern rifles, artillery and unity won; one with spears and old rifles lost 10,000 men in a morning.
      - |
        Both were in the same war and the same year; Isandlwana was a Zulu victory in a war the Zulu lost.
      - |
        Both were religious movements that ended in catastrophe; neither was a success.
      - |
        Neither was a battle, and neither involved an African victory.
    answer: 0
    explanation: |
      Skill: comparison. Adwa versus Omdurman is the paired case for explaining why most resistance failed.

  - slug: apworld-u06-exam-q18
    type: multiple_choice
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      The Cherokee Nation, the Sokoto Caliphate and the Zulu kingdom are grouped together in the CED because each
    options:
      - "was a religious revitalization movement"
      - "successfully defeated a European or American army and kept its independence"
      - "was a new state formed on the periphery of an expanding empire in the late eighteenth or early nineteenth century"
      - "was a European chartered company"
    option_explanations:
      - |
        The Sokoto jihad had religious origins, but the Cherokee and Zulu states were political and military creations.
      - |
        All three lost: Cherokee removal (1838–39), Zulu defeat (1879), Sokoto conquest (1903).
      - |
        Correct. Each was a new or reorganised state (constitution 1827; jihad 1804; Shaka's regiments) that then confronted an expanding state.
      - |
        None was a company; all were indigenous states.
    answer: 2
    explanation: |
      Skill: developments and processes. The "new states on the periphery" category of 6.3.

  - slug: apworld-u06-exam-q19
    type: multiple_choice
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following was a consequence of the 1857 rebellion in India?
    options:
      - "India became independent."
      - "The Mughal Empire was restored to full power."
      - "The East India Company was granted a new charter to rule India for fifty more years."
      - "The British Crown took direct control of India, reorganised the army and became warier of social reform."
    option_explanations:
      - |
        Independence came in 1947, ninety years later.
      - |
        The rebels had proclaimed the aged Mughal emperor their leader; after defeat he was exiled to Burma and the dynasty ended.
      - |
        The Company was abolished as a governing body in 1858.
      - |
        Correct. The Government of India Act created the Raj; the army was rebuilt with more British troops; the last Mughal was exiled and Victoria proclaimed Empress in 1876.
    answer: 3
    explanation: |
      Skill: causation (consequences). The rebellion's outcome is the company-to-crown transition of 6.2.

