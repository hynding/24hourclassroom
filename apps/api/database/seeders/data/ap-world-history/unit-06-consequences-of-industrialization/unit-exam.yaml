  # ---- Short answer (SAQ)
  - slug: apworld-u06-exam-q44
    type: short_answer
    topic_code: "6.7"
    source: "Described source: a photograph of Indian workers laying track on the Uganda Railway, c. 1898 (described in words; the image is not reproduced)"
    points: 3
    stimulus: |
      Photograph description: A black-and-white photograph taken about 1898 shows a railway embankment in open East African grassland. Several dozen men in turbans and white cotton clothing, identified in the original caption as indentured workers from India, are carrying rails and spiking them to sleepers. A European in a sun helmet stands on the embankment with a notebook. In the background are canvas tents and a line of ox carts. The caption reads: "Uganda Railway, mile 250, coolies laying track."
    prompt: |
      Using the photograph description, answer (a), (b) and (c).

      (a) Describe ONE feature of the labour system shown in the photograph.
      (b) Explain ONE reason the British government built the railway from Mombasa to Lake Victoria.
      (c) Explain ONE long-term effect of the migration shown on East African society.
    answer: |
      (a) The workers are indentured migrants from India, contracted for a term of years and working under European supervision; the labour force was imported rather than recruited locally, and the caption's term "coolies" reflects the contract-labour system of the period.
      (b) Britain built the railway to secure its claim to Uganda and Kenya against other powers after the partition, to move troops and officials inland, and to open the highlands to settlers and export crops, turning a strategic claim into an economic colony.
      (c) Many of the roughly 32,000 Indian workers and the traders who followed them stayed, founding the Indian communities of Kenya and Uganda, which became a commercial middle layer between British rulers and Africans and later faced expulsion from Uganda in 1972; or the railway created the settler economy and the displacement of African pastoralists that shaped Kenyan nationalism.
    explanation: |
      Three points, one per part.

      (a) 1 pt: a feature read from the description: imported indentured labour; European supervision; the caption's language; the scale of the workforce. Zero for a feature not in the description.

      (b) 1 pt: a reason explained: strategic control after partition; access to Uganda; settlers and exports; suppression of the slave trade (an official justification). Must connect to British imperial aims.

      (c) 1 pt: a long-term effect of Indian migration or of the railway on East Africa: the Indian diaspora and its economic role; settler agriculture and African land loss; Nairobi's growth as a railway town. Zero for an effect on India or Britain.

  # ---- Long answer (LEQ)
  - slug: apworld-u06-exam-q45
    type: long_answer
    topic_code: "6.8"
    source: "general knowledge"
    points: 6
    prompt: |
      Between 1750 and 1900 the relationship between industrial states and the rest of the world was transformed by imperialism, the export economy and mass migration, yet many features of earlier European expansion persisted.

      Evaluate the extent to which the relationship between industrial states and non-industrial regions changed in the period 1750–1900.

      In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
    answer: |
      Thesis: The relationship changed profoundly in depth and scale (conquest of interiors, direct administration, economic control by treaty and debt, migration of tens of millions) while continuing an older pattern in which distant regions supplied Europe with raw materials under coerced or semi-coerced labour; the change was great in means and reach, more limited in underlying purpose.

      Context: The maritime empires of 1450–1750 held coastal posts and American plantations; industrialization after 1750 created new demands and new tools.

      Body 1 (change in reach and method): the Raj after 1858; the partition of Africa after Berlin; Omdurman and the technology gap; the unequal treaties in China; the Roosevelt Corollary. Before 1750 Europeans had traded with the Mughals and Qing as equals or inferiors.

      Body 2 (change in economy and population): monoculture and famine; the drain of wealth; fifty million European migrants and over a million indentured Indians; enclaves and exclusion laws. The scale of movement and specialisation had no precedent.

      Body 3 (continuity): plantations and coerced labour (slavery to indenture); the casta hierarchy to colonial racial orders; the search for Asian goods and African resources; religious justification (missions then and now); resistance and new states in every period.

      Complexity: change was uneven by region (settler colonies, colonies of rule, semi-colonies); some regions (Japan) crossed from the dependent side to the industrial side, showing the relationship was not fixed.
    explanation: |
      Scored on the six-point LEQ rubric.

      Thesis/claim (0–1): a defensible claim on the extent of change with a line of reasoning that names what changed and what continued. Zero for "there was both change and continuity" without content.

      Contextualization (0–1): the maritime empires of unit 4; the industrial revolution of unit 5; the decline of the land-based empires of unit 3.

      Evidence (0–2): 1 pt for at least two specific examples (Raj 1858, Berlin 1884–85, Treaty of Nanjing, Adwa, Omdurman, Java's cultivation system, Indian famines, indenture, Chinese Exclusion Act, Meiji Japan, Roosevelt Corollary, the Congo). 2 pts for using them to support the argument about extent.

      Analysis and reasoning (0–2): 1 pt for using continuity and change to structure the essay. 1 pt for complexity: explaining why change happened when it did (technology, industrial demand); distinguishing regions; noting Japan's crossing; connecting to later decolonization; weighing change in method against continuity in purpose.

      Common errors: writing only about change; placing the scramble before 1870; treating China or Latin America as colonies; no evidence from before 1870 for the continuity side.
