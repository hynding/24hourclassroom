  - slug: apworld-final-q59
    type: long_answer
    topic_code: "6.8"
    source: "Primary sources: Treaty of Nanking (1842), World and Japan database (University of Tokyo); Chinese Exclusion Act (1882), U.S. National Archives; Constitution of the Empire of Japan (1889), trans. Ito Miyoji, National Diet Library; Rudyard Kipling, The White Man's Burden (1899), Project Gutenberg #60260; J. A. Hobson, Imperialism: A Study (1902), Library of Economics and Liberty; Theodore Roosevelt, Annual Message to Congress, 6 December 1904, American Presidency Project; a photograph of the Uganda Railway under construction, c. 1898, described in words"
    points: 7
    stimulus: |
      Document-based question. Documents 1-4 (documents 5-7 and the question are below).

      Document 1. Source: Treaty of Nanking, signed aboard a British warship, 29 August 1842, ending the First Opium War between Britain and China.
      "His Majesty the Emperor of China cedes to Her Majesty the Queen of Great Britain, etc., the Island of Hongkong, to be possessed in perpetuity by Her Britannic Majesty, Her Heirs and Successors, and to be governed by such Laws and Regulations as Her Majesty the Queen of Great Britain, etc., shall see fit to direct."
      (Other articles opened the ports of Canton, Amoy, Foochow, Ningpo and Shanghai to British merchants and residents and imposed an indemnity of 21 million dollars.)

      Document 2. Source: Chinese Exclusion Act, passed by the Congress of the United States, 6 May 1882.
      "Whereas in the opinion of the Government of the United States the coming of Chinese laborers to this country endangers the good order of certain localities within the territory thereof: Therefore, Be it enacted ... That from and after the expiration of ninety days next after the passage of this act, and until the expiration of ten years next after the passage of this act, the coming of Chinese laborers to the United States be, and the same is hereby, suspended".

      Document 3. Source: Constitution of the Empire of Japan, promulgated 11 February 1889, drafted after a study of European constitutions and modelled chiefly on Prussia's.
      "Article 1. The Empire of Japan shall be reigned over and governed by a line of Emperors unbroken for ages eternal. Article 3. The Emperor is sacred and inviolable. Article 4. The Emperor is the head of the Empire, combining in Himself the rights of sovereignty, and exercises them, according to the provisions of the present Constitution."

      Document 4. Source: Rudyard Kipling, British poet born in India, "The White Man's Burden", 1899, addressed to the United States after its victory over Spain and its annexation of the Philippines.
      "Take up the White Man's burden— / Send forth the best ye breed— / Go bind your sons to exile / To serve your captives' need; / To wait in heavy harness / On fluttered folk and wild— / Your new-caught, sullen peoples, / Half-devil and half-child."
    prompt: |
      Evaluate the extent to which industrialisation changed the relationship between the industrial powers and the rest of the world in the period from 1840 to 1914.

      In your response you should do the following.
      - Respond to the prompt with a historically defensible thesis or claim that establishes a line of reasoning.
      - Describe a broader historical context relevant to the prompt.
      - Support an argument in response to the prompt using at least four documents.
      - Use at least one additional piece of specific historical evidence (beyond that found in the documents) relevant to an argument about the prompt.
      - For at least two documents, explain how or why the document's point of view, purpose, historical situation, and/or audience is relevant to an argument.
      - Use evidence to support, qualify or modify an argument that addresses the prompt.

      Document 5. Source: J. A. Hobson, British economist and journalist, Imperialism: A Study, 1902, written after he reported on the South African War.
      "It is this economic condition of affairs that forms the taproot of Imperialism." Hobson goes on to conclude that "Imperialism is the endeavour of the great controllers of industry to broaden the channel for the flow of their surplus wealth by seeking foreign markets and foreign investments".

      Document 6. Source: President Theodore Roosevelt, Annual Message to Congress, 6 December 1904, after a European naval blockade of Venezuela over unpaid debts.
      "Chronic wrongdoing, or an impotence which results in a general loosening of the ties of civilized society, may in America, as elsewhere, ultimately require intervention by some civilized nation, and in the Western Hemisphere the adherence of the United States to the Monroe Doctrine may force the United States, however reluctantly, in flagrant cases of such wrongdoing or impotence, to the exercise of an international police power."

      Document 7. Source: Description of a photograph of the Uganda Railway under construction in British East Africa, about 1898 (described in words; the image is not reproduced). Several dozen Indian labourers, recruited under contract from British India, lay steel rails on a cleared embankment through dry scrub; a British engineer in a sun helmet stands to one side with a plan; in the background an African porter column carries sleepers on their heads. The line, built 1896-1901 from Mombasa to Lake Victoria, was financed by the British government to secure the Nile headwaters and open the interior to trade and settlement; about 32,000 Indian workers were brought in and some 2,500 died.
    answer: |
      Thesis: Industrialisation changed the relationship to a great extent, turning a commerce between rough equals into domination, because industrial weapons, ships and capital let Europe, the United States and Japan open, control and often annex non-industrial societies; but unevenly, since Japan industrialised and joined the dominators, China and Latin America kept sovereignty while losing economic control, and the labour the new economy drew in was met by exclusion.

      Context: before 1840 European power in Asia was confined to ports and India; China restricted foreigners to Canton; the industrial revolution gave Britain, then others, output, weapons and capital no agrarian society could match.

      Body 1, force opened markets: Doc 1 (unequal treaty dictated aboard a warship); Doc 5 (Hobson, a liberal critic after the Boer War, finds the taproot in surplus capital); Doc 6 (Roosevelt's police power over debtors, aimed at European creditors). Outside: Tientsin 1858, Berlin 1884-85, Suez, Omdurman.

      Body 2, infrastructure and labour: Doc 7 (imperial capital, Indian contract labour, African porters, the engineer apart); Doc 2 (industrial America wanted goods, not people; purpose: white Californian labour). Outside: indenture to the Caribbean, Fiji and Natal; the Congo rubber regime.

      Body 3, limits: Doc 3 (Japan borrowed the form to keep sovereignty and won treaty revision, then beat China and Russia); Doc 4 (civilising mission, with 'sullen' admitting resistance; audience: the newest empire). Outside: 1857, the Boxers, Adwa.

      Complexity: great in means and reach, uneven in result; a world economy that moved goods and capital freely while sorting people by race; reversed after 1914, showing that industrial dominance lasted only while unshared.
    explanation: |
      Seven points. College Board DBQ rubric applied to this prompt.

      A. Thesis/claim, 1 pt: a historically defensible claim that evaluates the extent of change and establishes a line of reasoning. Acceptable: that industrialisation transformed the relationship into one of domination through force, capital and infrastructure, with qualifications for Japan, informal empire or resistance. Zero: restating the prompt, or 'industrialisation changed the relationship a lot' with no reasoning.

      B. Contextualization, 1 pt: a broader context before, during or after 1840-1914, described in more than a phrase: the pre-1840 balance (Canton system, Mughal decline, the Atlantic revolutions), the industrial revolution's technologies and demands, the abolition of slavery and the rise of indentured labour, or the First World War as the end point.

      C. Evidence from the documents, up to 2 pts: 1 pt for accurately describing the content of at least three documents; 2 pts for using at least four documents to support an argument. Quoting without explanation does not count as use.

      D. Evidence beyond the documents, 1 pt: one specific piece of outside evidence used in an argument and different from the contextualization. Acceptable: the Second Opium War, Berlin Conference, Suez, Omdurman, the Sepoy Rebellion, the Boxers, Adwa, indentured labour, the Congo Free State, the Russo-Japanese War, the Panama Canal, the Boer War, the Self-Strengthening Movement, the Porfiriato.

      E. Sourcing, 1 pt: for at least two documents, an explanation of how point of view, purpose, situation or audience matters to the argument. Examples: Doc 1 dictated aboard a warship; Doc 2's audience of white Californian labour; Doc 3's purpose of treaty revision; Doc 4's addressee and the admission in 'sullen'; Doc 5's liberal critic's purpose after the Boer War; Doc 6's audience of European creditors; Doc 7's composition with the engineer apart. Describing a source's background without connecting it to the argument earns zero.

      F. Complexity, 1 pt: a sophisticated understanding sustained through the essay: the uneven results (Japan, informal empire, surviving states), the contradiction between free goods and excluded people, the role of resistance, or a connection to the period after 1914. A single 'however' sentence earns zero.

      Fuller model of the body paragraphs, for marking against. Body 1: Doc 1 shows the first unequal treaty, won by steam gunboats, taking a port in perpetuity and opening five more; its situation, dictated aboard a warship, shows the new balance of force. Doc 5 explains why: Hobson, writing as a liberal critic after the Boer War, locates the taproot of imperialism in surplus capital seeking outlets; his purpose was to persuade British readers that empire served financiers, which both explains and exaggerates the economic motive. Doc 6 extends the pattern to the Americas: Roosevelt claims a police power over debtor republics; his audience, Congress and the European powers, needed assurance that the United States would collect debts so Europe need not. Body 2: Doc 7 shows the industrial empire physically, a railway built with imperial capital, Indian contract labour and African porters for strategic and commercial ends; Doc 2 shows industrial America, having drawn Chinese workers to build its railways, excluding them by law to satisfy white labour in California, so the industrial powers wanted the world's goods and not its people. Body 3: Doc 3 shows Japan borrowing the industrial powers' constitutional form to keep its sovereignty and then join them, winning treaty revision by 1899 and defeating China (1895) and Russia (1905); Doc 4 shows the civilising mission in its own voice and, in 'sullen', an admission of resistance, addressed to the United States as the newest industrial power taking up the oldest justification. Complexity: Japan became an imperial power; China and the Latin American republics kept nominal sovereignty under economic control; Ethiopia and Siam stayed independent; the industrial powers' nationalism and racism (Docs 2 and 4) built a world economy that moved goods and capital freely while sorting people by race; the world wars and decolonization reversed much of it.

  - slug: apworld-final-q60
    type: long_answer
    topic_code: "9.9"
    source: "general knowledge"
    points: 6
    prompt: |
      Long essay question. On the May 2027 exam you will be set a single required prompt. For practice, choose ONE of the three below, state which you are answering, and write for 40 minutes.

      Prompt 1 (continuity and change). From the Silk Roads of the thirteenth century to the container ships and internet of the twenty-first, long-distance exchange has shaped the world's economies, cultures and environments. Evaluate the extent to which the networks of exchange after 1900 represented a change from the networks of the period 1200 to 1750.

      Prompt 2 (causation). Between 1750 and 1914 a small number of industrial states came to dominate much of the world politically and economically, and after 1945 that dominance was dismantled within a generation. Evaluate the most significant cause of the collapse of European overseas empires in the period 1914 to 1975.

      Prompt 3 (comparison). Revolutions in the period 1750 to the present have been justified by ideas about rights, nation and class, and have produced very different states. Evaluate the extent to which the revolutions of the twentieth century (such as those in Russia, China, Mexico, Iran or Cuba) differed from the Atlantic revolutions of 1750 to 1850 in their causes or their outcomes.

      In your response you should do the following.
      - Respond to the prompt with a historically defensible thesis or claim that establishes a line of reasoning.
      - Describe a broader historical context relevant to the prompt.
      - Support an argument in response to the prompt using specific and relevant examples of evidence.
      - Use historical reasoning (comparison, causation, or continuity and change) to frame or structure an argument that addresses the prompt.
      - Use evidence to support, qualify or modify an argument that addresses the prompt.
    answer: |
      Prompt 1. Thesis: the networks after 1900 continued the older patterns in what moved and why, but changed them in kind by speed, volume, organisation and reach (production split across continents, instant capital and information, universal institutions, a global culture, planetary environmental effects). Evidence: the yam and caravanserai against the container and internet; the Black Death against COVID-19; Mansa Musa's gold against China's quarter of world manufacturing. Complexity: the 1870-1914 economy as the bridge; states behind both (the Mongol peace, Bretton Woods).

      Prompt 2. Thesis: the most significant cause was the two world wars, which bankrupted the empires, broke the myth of invincibility (Singapore 1942), mobilised colonial soldiers who returned with new expectations, and produced an order (Atlantic Charter, UN, two anti-colonial superpowers) in which empire lost legitimacy; nationalism supplied the agency, the wars the opportunity. Evidence: Quit India; British withdrawal from India and Greece (1947); Dien Bien Phu; Suez; Ghana; Algeria; Portugal 1974. Complexity: nationalism necessary but not sufficient; different timing by empire; economic dependence outlasting independence.

      Prompt 3. Thesis: the twentieth-century revolutions differed chiefly in outcome rather than cause: both sprang from fiscal crisis, war, Enlightenment-derived ideas and excluded groups' grievances, but the Atlantic revolutions produced constitutional states of property-owning citizens while Russia, China and Cuba, drawing on Marxism and mobilising peasants, produced one-party states that transformed society by force; Mexico and Iran qualify the pattern. Evidence: France and Haiti against 1917 and 1949; the Rights of Man against the Soviet constitution; Bolívar's republics against the PRI. Complexity: shared language of rights and nation; Haiti as the Atlantic case nearest the twentieth century.
    explanation: |
      LEQ rubric, 6 points, applied to whichever prompt is chosen.

      A. Thesis/claim, 1 pt: a historically defensible claim that answers the chosen prompt and establishes a line of reasoning (an evaluation of extent, a ranking of causes, or a comparison with a judgement). Restating the prompt or listing topics earns zero.

      B. Contextualization, 1 pt: a broader context relevant to the prompt described in more than a phrase: for Prompt 1 the pre-1750 networks or the 1870-1914 economy; for Prompt 2 the imperial high tide or the First World War's settlement; for Prompt 3 the Enlightenment and the Atlantic world or the industrial and imperial world of 1900.

      C. Evidence, up to 2 pts: 1 pt for at least two specific, relevant pieces of evidence; 2 pts for using them to support an argument. Evidence should come from at least two units of the course for Prompts 1 and 3, and from at least two regions for Prompt 2.

      D. Analysis and reasoning, 1 pt: the named reasoning process used to frame or structure the essay: continuity and change (Prompt 1), causation with causes weighed (Prompt 2), comparison with similarities and differences explained (Prompt 3). Narration in date order earns zero.

      E. Complexity, 1 pt: a sophisticated understanding sustained across the essay: qualifying the thesis with cases that do not fit, weighing a counter-argument, connecting to another period or theme, or explaining both continuity and change (or both similarity and difference) with a judgement about which matters more. A single qualifying sentence earns zero.

      Acceptable context and evidence by prompt. Prompt 1: context in the Silk Roads, Indian Ocean and trans-Saharan routes under the Mongols and the Islamic world, or the Atlantic system after 1492; evidence such as the yam, caravanserais, Venetian and Gujarati merchants, the Ming treasure fleets, the Black Death, Mansa Musa, the Manila galleon, against containers, the internet, multinationals, the WTO, China's manufacturing share, COVID-19; organised by what moved, how, who carried it and with what effect. Prompt 2: context in the imperial high tide of 1914 and Wilson's self-determination and the mandates; evidence such as Indian soldiers in both wars, the fall of Singapore, Britain's bankruptcy, the Atlantic Charter, the Dutch in Indonesia, Dien Bien Phu, Suez as the end of independent imperial action, Ghana 1957, the Algerian war and de Gaulle, the Portuguese revolution; causes weighed: the wars, nationalism, superpower and UN pressure, economic cost, settler resistance. Prompt 3: context in the Enlightenment and the Atlantic world of 1750, or the industrial economy and imperialism of 1900; evidence such as the French and Haitian revolutions, the Declaration of the Rights of Man, Bolívar, against Russia 1917, China 1949, Mexico 1910-20, Iran 1979, Cuba 1959, the Soviet constitution, land reform in each; organised by causes, participants, ideas and outcomes.
