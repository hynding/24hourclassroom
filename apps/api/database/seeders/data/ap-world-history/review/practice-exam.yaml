week: 34
description: |
  A full-length practice version of the May 2027 AP World History: Modern exam, built to the real paper's shape.
  The real exam is fully digital in the Bluebook app and runs 3 hours 15 minutes in two sections. Section I,
  Part A is 55 multiple-choice questions in 55 minutes (40% of the score), always in sets of 3 or 4 on one
  source: a primary text, a historian's interpretation, an image or map described here in words, or a chart or
  table. Section I, Part B is 3 required short-answer questions in 40 minutes (20%): SAQ 1 on a secondary text,
  SAQ 2 on a primary text, SAQ 3 without a source here (on the real paper it uses a non-text source); no two
  come from the same period. Section II is the document-based question (7 documents, 60 minutes including a
  15-minute reading period, 25%, scored out of 7) and one long essay question (40 minutes, 15%, scored out of
  6; the 2027 paper sets a single prompt, so this practice version offers three and you answer one).
  Multiple-choice items follow the Course and Exam Description's unit weights: units 1, 2, 7, 8 and 9 lighter,
  units 3 to 6 the bulk. In the app, items 1-55 (1 point each) are graded at once; items 56-58 (3 points
  each), item 59 (the DBQ, 7 points) and item 60 (the LEQ, 6 points) are graded by your teacher against the
  scoring notes attached to each. The paper is therefore out of 77 points and the halves weigh differently from
  exam day, when the free-response questions are 60% of the score; score Section I and Section II separately to
  see where you stand. Sit it in one block if you can: 55 minutes for items 1-55, 40 minutes for items 56-58, a
  short break, then 100 minutes for items 59 and 60 (spend the first 15 reading the documents and planning).
questions:
  # ======================================================================
  # Section I, Part A: 55 multiple choice in sets of 3-4.
  # Unit 1 (4): q01-q04 · Unit 2 (4): q05-q08 · Unit 3 (4): q09-q12 · Unit 4 (7): q13-q19
  # Unit 5 (8): q20-q27 · Unit 6 (8): q28-q35 · Unit 7 (7): q36-q42 · Unit 8 (7): q43-q49 · Unit 9 (6): q50-q55
  # ======================================================================
  # ---- Set A: interpretation on Song China (1.1, 1.2, 1.6, 1.7)
  - slug: apworld-final-q01
    type: multiple_choice
    topic_code: "1.1"
    source: "Interpretation written for this course, reflecting standard accounts of the Song economy; no historian is quoted"
    points: 1
    stimulus: |
      Interpretation (written for this course): Under the Song dynasty (960–1279) China was the richest and most urbanised society in the world. Champa rice from Vietnam allowed two harvests a year and the population passed 100 million; iron production reached levels Europe would not match for six centuries; paper money, credit and a tax system paid in cash supported cities such as Kaifeng and Hangzhou of a million people. The state staffed itself through examinations in the Confucian classics, which rewarded learning over birth and created a scholar-official class, while Buddhism, which had flourished under the Tang, was absorbed into a revived Confucianism. Yet the same state was militarily weak: it paid tribute to the Liao and Jin peoples of the north, lost the north altogether in 1127, and fell to the Mongols in 1279.
    prompt: |
      Which of the following developments most directly explains the population growth the interpretation describes?
    options:
      - "The spread of fast-ripening Champa rice, which allowed two crops a year in the Yangzi valley"
      - "The conquest of the Song by the Mongols"
      - "The adoption of paper money"
      - "The revival of Confucian learning"
    option_explanations:
      - |
        Correct. New rice strains and the drained paddies of the south are the agricultural base of the Song economy (1.1).
      - |
        The Mongol conquest came at the end of the period and reduced the population through war.
      - |
        Paper money eased trade but fed no one; it is an effect of growth, not a cause.
      - |
        Neo-Confucianism shaped the elite and the examinations; it did not change harvests.
    answer: 0
    explanation: |
      Skill: causation. Agriculture first; the exam always asks what fed the cities.

  - slug: apworld-final-q02
    type: multiple_choice
    topic_code: "1.1"
    source: "Interpretation written for this course, reflecting standard accounts of the Song economy; no historian is quoted"
    points: 1
    stimulus: |
      Interpretation (written for this course): Under the Song dynasty (960–1279) China was the richest and most urbanised society in the world. Champa rice from Vietnam allowed two harvests a year and the population passed 100 million; iron production reached levels Europe would not match for six centuries; paper money, credit and a tax system paid in cash supported cities such as Kaifeng and Hangzhou of a million people. The state staffed itself through examinations in the Confucian classics, which rewarded learning over birth and created a scholar-official class, while Buddhism, which had flourished under the Tang, was absorbed into a revived Confucianism. Yet the same state was militarily weak: it paid tribute to the Liao and Jin peoples of the north, lost the north altogether in 1127, and fell to the Mongols in 1279.
    prompt: |
      The examination system described in the interpretation had which effect on Chinese society?
    options:
      - "It abolished the imperial throne"
      - "It created a bureaucracy of scholar-officials chosen by merit in the classics, which limited the aristocracy's hold on office while still favouring families who could afford years of study"
      - "It opened government to women"
      - "It replaced Confucianism with Buddhism as the state's ideology"
    option_explanations:
      - |
        The emperor remained; the examinations staffed his government.
      - |
        Correct. Merit in principle, wealth in practice: the gentry who could educate sons dominated, but birth alone no longer guaranteed office (1.1).
      - |
        Women were excluded from the examinations throughout imperial history.
      - |
        The interpretation says the opposite: Confucianism revived and absorbed Buddhist ideas.
    answer: 1
    explanation: |
      Skill: developments and processes. The examination system is the Song's signature institution.

  - slug: apworld-final-q03
    type: multiple_choice
    topic_code: "1.7"
    source: "Interpretation written for this course, reflecting standard accounts of the Song economy; no historian is quoted"
    points: 1
    stimulus: |
      Interpretation (written for this course): Under the Song dynasty (960–1279) China was the richest and most urbanised society in the world. Champa rice from Vietnam allowed two harvests a year and the population passed 100 million; iron production reached levels Europe would not match for six centuries; paper money, credit and a tax system paid in cash supported cities such as Kaifeng and Hangzhou of a million people. The state staffed itself through examinations in the Confucian classics, which rewarded learning over birth and created a scholar-official class, while Buddhism, which had flourished under the Tang, was absorbed into a revived Confucianism. Yet the same state was militarily weak: it paid tribute to the Liao and Jin peoples of the north, lost the north altogether in 1127, and fell to the Mongols in 1279.
    prompt: |
      Compared with the Song state, the states of Western Europe in the same period (c. 1200–1450) were
    options:
      - "larger, richer and more centralised"
      - "governed by examination-selected bureaucracies"
      - "smaller and more fragmented, with power divided among monarchs, feudal lords and the Church, and with far smaller cities"
      - "united under a single emperor in Rome"
    option_explanations:
      - |
        No European kingdom approached Song China in size, wealth or administrative reach.
      - |
        European offices went by birth, Church training or purchase; no examination system existed.
      - |
        Correct. Feudal decentralisation, the Church's parallel authority and towns of tens of thousands, not a million, are the contrasts the CED expects (1.6, 1.7).
      - |
        The Holy Roman Emperor ruled no united Europe, and Rome was the pope's.
    answer: 2
    explanation: |
      Skill: comparison. Song centralisation against European fragmentation.

  - slug: apworld-final-q04
    type: multiple_choice
    topic_code: "1.2"
    source: "Interpretation written for this course, reflecting standard accounts of the Song economy; no historian is quoted"
    points: 1
    stimulus: |
      Interpretation (written for this course): Under the Song dynasty (960–1279) China was the richest and most urbanised society in the world. Champa rice from Vietnam allowed two harvests a year and the population passed 100 million; iron production reached levels Europe would not match for six centuries; paper money, credit and a tax system paid in cash supported cities such as Kaifeng and Hangzhou of a million people. The state staffed itself through examinations in the Confucian classics, which rewarded learning over birth and created a scholar-official class, while Buddhism, which had flourished under the Tang, was absorbed into a revived Confucianism. Yet the same state was militarily weak: it paid tribute to the Liao and Jin peoples of the north, lost the north altogether in 1127, and fell to the Mongols in 1279.
    prompt: |
      In the same period, the Islamic world differed from Song China most notably in that political authority in Dar al-Islam
    options:
      - "was held by a single hereditary emperor in Baghdad throughout the period"
      - "rested on examinations in the Confucian classics"
      - "passed to Buddhist monasteries"
      - "was fragmented among new Turkic and other states (the Seljuks, the Mamluks, the Delhi Sultanate), while a shared religion, law and learning held the civilisation together"
    option_explanations:
      - |
        The Abbasid caliph's political power had collapsed long before 1258, when the Mongols ended the caliphate.
      - |
        Islamic states recruited through the ulama and through military slavery, not examinations.
      - |
        Buddhism had no role in the Islamic world's politics.
      - |
        Correct. Political fragmentation with cultural unity (sharia, Arabic, the madrasa, Sufi orders) is the CED's picture of 1.2, the reverse of Song China's political unity.
    answer: 3
    explanation: |
      Skill: comparison (1.2 against 1.1). Unity of faith, plurality of states.

  # ---- Set B: described map of Afro-Eurasian trade routes c. 1300 (2.1, 2.2, 2.3, 2.6)
  - slug: apworld-final-q05
    type: multiple_choice
    topic_code: "2.1"
    source: "Described map drawn for this course (described in words; no image is shown)"
    points: 1
    stimulus: |
      Described map (no image is shown): Afro-Eurasia about 1300. A band of overland routes runs from Hangzhou and Dadu (Beijing) through Samarkand and Tabriz to the Black Sea and the Mediterranean, with caravanserais marked every few days' travel; the whole band lies within the four Mongol khanates, shaded as one colour. A second set of routes follows the monsoon winds across the Indian Ocean from Guangzhou through Malacca, Calicut and Hormuz to Aden and Kilwa. A third crosses the Sahara from Timbuktu and Gao to Sijilmasa and Cairo. Small symbols show silk and porcelain moving west, horses and silver moving east, gold and salt crossing the desert, and spices, cotton cloth and enslaved people on the ocean routes. A dotted line marks the spread of plague westward along the overland routes after 1331.
    prompt: |
      The shading of the overland routes within a single colour most directly explains which feature of trade in this period?
    options:
      - "The Mongol conquests placed most of the Silk Roads under one political authority, reducing tolls and banditry and allowing travellers such as Marco Polo and Ibn Battuta to cross Eurasia"
      - "The Silk Roads were closed to all but Chinese merchants"
      - "The overland routes had been abandoned in favour of the sea"
      - "The Mongols forbade trade with Europe"
    option_explanations:
      - |
        Correct. The 'Pax Mongolica' of 2.2 is the reason the Silk Roads peaked in the thirteenth and fourteenth centuries (2.1).
      - |
        Persian, Arab, Armenian, Jewish and Italian merchants all used the routes; the Mongols welcomed them.
      - |
        The sea routes grew, but the map shows the overland routes at their busiest.
      - |
        The Mongols encouraged trade with everyone, Europe included; Genoese merchants settled at Caffa.
    answer: 0
    explanation: |
      Skill: reading a map (causation). Political unity under the Mongols is the key to the Silk Roads' revival.

  - slug: apworld-final-q06
    type: multiple_choice
    topic_code: "2.3"
    source: "Described map drawn for this course (described in words; no image is shown)"
    points: 1
    stimulus: |
      Described map (no image is shown): Afro-Eurasia about 1300. A band of overland routes runs from Hangzhou and Dadu (Beijing) through Samarkand and Tabriz to the Black Sea and the Mediterranean, with caravanserais marked every few days' travel; the whole band lies within the four Mongol khanates, shaded as one colour. A second set of routes follows the monsoon winds across the Indian Ocean from Guangzhou through Malacca, Calicut and Hormuz to Aden and Kilwa. A third crosses the Sahara from Timbuktu and Gao to Sijilmasa and Cairo. Small symbols show silk and porcelain moving west, horses and silver moving east, gold and salt crossing the desert, and spices, cotton cloth and enslaved people on the ocean routes. A dotted line marks the spread of plague westward along the overland routes after 1331.
    prompt: |
      The Indian Ocean routes on the map depended most on which technology or knowledge?
    options:
      - "The steam engine"
      - "Knowledge of the monsoon winds, together with the lateen sail, the astrolabe and the magnetic compass, which let ships sail out on one season's wind and return on the next"
      - "The caravel and the cannon"
      - "The Grand Canal of China"
    option_explanations:
      - |
        Steam belongs to the nineteenth century (5.5), five centuries later.
      - |
        Correct. The monsoon's seasonal reversal set the rhythm of Indian Ocean trade and the growth of ports such as Calicut and Malacca (2.3).
      - |
        The caravel is a fifteenth-century Portuguese ship (4.1); cannon came later still.
      - |
        The Grand Canal joined north and south China internally; it is not an ocean route.
    answer: 1
    explanation: |
      Skill: developments and processes. The monsoon is the Indian Ocean's engine.

  - slug: apworld-final-q07
    type: multiple_choice
    topic_code: "2.6"
    source: "Described map drawn for this course (described in words; no image is shown)"
    points: 1
    stimulus: |
      Described map (no image is shown): Afro-Eurasia about 1300. A band of overland routes runs from Hangzhou and Dadu (Beijing) through Samarkand and Tabriz to the Black Sea and the Mediterranean, with caravanserais marked every few days' travel; the whole band lies within the four Mongol khanates, shaded as one colour. A second set of routes follows the monsoon winds across the Indian Ocean from Guangzhou through Malacca, Calicut and Hormuz to Aden and Kilwa. A third crosses the Sahara from Timbuktu and Gao to Sijilmasa and Cairo. Small symbols show silk and porcelain moving west, horses and silver moving east, gold and salt crossing the desert, and spices, cotton cloth and enslaved people on the ocean routes. A dotted line marks the spread of plague westward along the overland routes after 1331.
    prompt: |
      The dotted line on the map best supports which conclusion?
    options:
      - "Trade routes carried only goods, never people or diseases"
      - "The plague originated in Europe and spread east"
      - "The same networks that moved silk and silver moved the Black Death, so that connectivity had environmental as well as economic consequences"
      - "The Mongols deliberately spread the plague to Europe"
    option_explanations:
      - |
        The line shows a disease moving along trade routes, with the merchants, soldiers and rats that used them.
      - |
        The line runs westward from Central Asia; Europe was the destination, reached in 1347.
      - |
        Correct. The Black Death killed a third of Europe and devastated the Islamic world and China; it is the CED's main case of the environmental consequences of connectivity (2.6).
      - |
        The story of plague corpses catapulted into Caffa is a single chronicle's claim; the spread followed trade, not policy.
    answer: 2
    explanation: |
      Skill: reading a map (claims and evidence). Networks carry everything.

  - slug: apworld-final-q08
    type: multiple_choice
    topic_code: "2.4"
    source: "Described map drawn for this course (described in words; no image is shown)"
    points: 1
    stimulus: |
      Described map (no image is shown): Afro-Eurasia about 1300. A band of overland routes runs from Hangzhou and Dadu (Beijing) through Samarkand and Tabriz to the Black Sea and the Mediterranean, with caravanserais marked every few days' travel; the whole band lies within the four Mongol khanates, shaded as one colour. A second set of routes follows the monsoon winds across the Indian Ocean from Guangzhou through Malacca, Calicut and Hormuz to Aden and Kilwa. A third crosses the Sahara from Timbuktu and Gao to Sijilmasa and Cairo. Small symbols show silk and porcelain moving west, horses and silver moving east, gold and salt crossing the desert, and spices, cotton cloth and enslaved people on the ocean routes. A dotted line marks the spread of plague westward along the overland routes after 1331.
    prompt: |
      The trans-Saharan routes shown on the map contributed most directly to
    options:
      - "the decline of Islam in West Africa"
      - "the isolation of West Africa from the rest of the world"
      - "the rise of Christian kingdoms in the Sahel"
      - "the wealth of Mali, whose control of the gold trade financed Mansa Musa's pilgrimage to Mecca in 1324 and the spread of Islam and Arabic learning to Timbuktu"
    option_explanations:
      - |
        The routes carried Islam into West Africa with the merchants; the faith grew, not declined.
      - |
        The routes were West Africa's connection to the Mediterranean and the Islamic world.
      - |
        The Sahel's kingdoms (Ghana, Mali, Songhai) were Muslim or ruled by Muslim elites; Christian Ethiopia lay far to the east.
      - |
        Correct. Gold north, salt south, and Islam, books and scholars with the camels: the trans-Saharan routes made Mali (2.4).
    answer: 3
    explanation: |
      Skill: causation. Gold and salt built the empires of the Sahel.

  # ---- Set C: interpretation on the gunpowder empires (3.1, 3.2, 3.3, 3.4)
  - slug: apworld-final-q09
    type: multiple_choice
    topic_code: "3.1"
    source: "Interpretation written for this course, reflecting standard accounts of the early modern land-based empires; no historian is quoted"
    points: 1
    stimulus: |
      Interpretation (written for this course): Between 1450 and 1750 four great land empires rose on the use of gunpowder: the Ottomans took Constantinople in 1453 with cannon and ruled from the Danube to the Persian Gulf; the Safavids made Persia Shia and held it against the Ottomans; the Mughals under Akbar ruled most of India by combining Muslim rule with Hindu allies; and the Qing, Manchu conquerors of China, doubled its territory into Central Asia. Each ruled through a mixture of devotion to the ruler's person, a tax-collecting bureaucracy, and recruited or enslaved soldiers loyal to the throne rather than to local nobles: the Ottoman devshirme and janissaries, the Safavid ghulams, the Mughal mansabdars, the Qing banners. Each used religion to legitimise rule and faced religious minorities with policies that ranged from Akbar's toleration to Aurangzeb's reimposed poll tax. By 1750 all four were under pressure from internal revolt and from European sea power.
    prompt: |
      The interpretation attributes the expansion of these empires primarily to
    options:
      - "the adoption of gunpowder weapons, which gave centralised states that could afford cannon and muskets a decisive advantage over nomadic cavalry and fortified nobles"
      - "the conversion of their rulers to Christianity"
      - "alliances with European maritime powers"
      - "the discovery of the Americas"
    option_explanations:
      - |
        Correct. The 'gunpowder empires' are the CED's label for 3.1; artillery breached Constantinople and reduced the fortress and the steppe raider alike.
      - |
        All four were Muslim or, in the Qing case, Confucian and Buddhist in legitimation.
      - |
        The land empires rose independently of Europe and, by 1750, in competition with it.
      - |
        American silver reached these empires through trade but did not cause their rise.
    answer: 0
    explanation: |
      Skill: claims and evidence. Identify the interpretation's main cause before judging it.

  - slug: apworld-final-q10
    type: multiple_choice
    topic_code: "3.2"
    source: "Interpretation written for this course, reflecting standard accounts of the early modern land-based empires; no historian is quoted"
    points: 1
    stimulus: |
      Interpretation (written for this course): Between 1450 and 1750 four great land empires rose on the use of gunpowder: the Ottomans took Constantinople in 1453 with cannon and ruled from the Danube to the Persian Gulf; the Safavids made Persia Shia and held it against the Ottomans; the Mughals under Akbar ruled most of India by combining Muslim rule with Hindu allies; and the Qing, Manchu conquerors of China, doubled its territory into Central Asia. Each ruled through a mixture of devotion to the ruler's person, a tax-collecting bureaucracy, and recruited or enslaved soldiers loyal to the throne rather than to local nobles: the Ottoman devshirme and janissaries, the Safavid ghulams, the Mughal mansabdars, the Qing banners. Each used religion to legitimise rule and faced religious minorities with policies that ranged from Akbar's toleration to Aurangzeb's reimposed poll tax. By 1750 all four were under pressure from internal revolt and from European sea power.
    prompt: |
      The devshirme and the ghulams served a common administrative purpose, which was to
    options:
      - "spread Christianity among the empire's soldiers"
      - "give the ruler soldiers and officials who owed everything to him and nothing to hereditary nobles, strengthening the centre against the provinces"
      - "replace taxation with plunder"
      - "hand provincial government to local aristocrats"
    option_explanations:
      - |
        Devshirme boys were converted to Islam; the Safavid ghulams likewise.
      - |
        Correct. Slave soldiers and officials, like the Mughal mansabdars paid by the throne, were the land empires' answer to the problem every empire faced: loyalty (3.2).
      - |
        All four empires ran tax systems (the Ottoman tax farms, the Mughal zamindars, the Qing land tax).
      - |
        The purpose was the opposite: to bypass local aristocrats.
    answer: 1
    explanation: |
      Skill: comparison (methods of rule). Loyalty bought by dependence on the ruler.

  - slug: apworld-final-q11
    type: multiple_choice
    topic_code: "3.3"
    source: "Interpretation written for this course, reflecting standard accounts of the early modern land-based empires; no historian is quoted"
    points: 1
    stimulus: |
      Interpretation (written for this course): Between 1450 and 1750 four great land empires rose on the use of gunpowder: the Ottomans took Constantinople in 1453 with cannon and ruled from the Danube to the Persian Gulf; the Safavids made Persia Shia and held it against the Ottomans; the Mughals under Akbar ruled most of India by combining Muslim rule with Hindu allies; and the Qing, Manchu conquerors of China, doubled its territory into Central Asia. Each ruled through a mixture of devotion to the ruler's person, a tax-collecting bureaucracy, and recruited or enslaved soldiers loyal to the throne rather than to local nobles: the Ottoman devshirme and janissaries, the Safavid ghulams, the Mughal mansabdars, the Qing banners. Each used religion to legitimise rule and faced religious minorities with policies that ranged from Akbar's toleration to Aurangzeb's reimposed poll tax. By 1750 all four were under pressure from internal revolt and from European sea power.
    prompt: |
      The rivalry between the Ottomans and the Safavids was sharpened by which religious development?
    options:
      - "The Protestant Reformation"
      - "The spread of Sikhism"
      - "The Safavid adoption of Shia Islam as the state religion, which set a Shia Persia against the Sunni Ottoman claim to lead the Muslim world"
      - "The conversion of the Ottomans to Buddhism"
    option_explanations:
      - |
        The Reformation divided Christian Europe; it had no part in a conflict between two Muslim empires.
      - |
        Sikhism arose in Mughal India; it did not affect the Ottoman–Safavid frontier.
      - |
        Correct. Shah Ismail's conversion of Persia (1501) made the border a sectarian line and the wars of the sixteenth century partly religious (3.3).
      - |
        The Ottomans were Sunni Muslims and claimed the caliphate after 1517.
    answer: 2
    explanation: |
      Skill: developments and processes (belief systems and empire). The Sunni–Shia frontier is the CED's example.

  - slug: apworld-final-q12
    type: multiple_choice
    topic_code: "3.4"
    source: "Interpretation written for this course, reflecting standard accounts of the early modern land-based empires; no historian is quoted"
    points: 1
    stimulus: |
      Interpretation (written for this course): Between 1450 and 1750 four great land empires rose on the use of gunpowder: the Ottomans took Constantinople in 1453 with cannon and ruled from the Danube to the Persian Gulf; the Safavids made Persia Shia and held it against the Ottomans; the Mughals under Akbar ruled most of India by combining Muslim rule with Hindu allies; and the Qing, Manchu conquerors of China, doubled its territory into Central Asia. Each ruled through a mixture of devotion to the ruler's person, a tax-collecting bureaucracy, and recruited or enslaved soldiers loyal to the throne rather than to local nobles: the Ottoman devshirme and janissaries, the Safavid ghulams, the Mughal mansabdars, the Qing banners. Each used religion to legitimise rule and faced religious minorities with policies that ranged from Akbar's toleration to Aurangzeb's reimposed poll tax. By 1750 all four were under pressure from internal revolt and from European sea power.
    prompt: |
      A historian who wished to challenge the interpretation's final sentence would most likely point out that
    options:
      - "the Ottoman Empire had already collapsed by 1700"
      - "none of the four empires ever faced a revolt"
      - "European sea power had no effect on any Asian state before 1900"
      - "the Qing in 1750 were at the height of their power and territory, so that 'pressure' describes the Mughals and Safavids far better than it describes China"
    option_explanations:
      - |
        The Ottoman Empire lasted until 1922, two centuries past the date the option gives.
      - |
        Revolts were constant: janissary mutinies, the Afghan overthrow of the Safavids (1722), Maratha wars against the Mughals.
      - |
        The Portuguese, Dutch and British took ports and trade from the Mughals and the Safavids from the sixteenth century.
      - |
        Correct. The Qianlong emperor's empire in 1750 was expanding, prosperous and untroubled by Europe; a generalisation across the four fails for China (3.4).
    answer: 3
    explanation: |
      Skill: argumentation (qualifying an interpretation). The best challenge finds the case the generalisation does not fit.

  # ---- Set D: transatlantic slave trade table (4.4, 4.5, 4.7, 4.8)
  - slug: apworld-final-q13
    type: multiple_choice
    topic_code: "4.4"
    source: "Data table compiled for this course from standard published estimates of the transatlantic slave trade (rounded)"
    points: 1
    stimulus: |
      Enslaved Africans embarked on the transatlantic crossing, by period and by destination (approximate, in millions)

      | Period | Embarked |
      |---|---|
      | 1501–1600 | 0.3 |
      | 1601–1700 | 1.9 |
      | 1701–1800 | 6.5 |
      | 1801–1866 | 3.9 |
      | Total | 12.5 (about 10.7 million survived the crossing) |

      | Destination | Share of arrivals |
      |---|---|
      | Brazil | about 45% |
      | British Caribbean | about 22% |
      | Spanish Americas | about 12% |
      | French Caribbean | about 10% |
      | British North America and the United States | about 4% |
    prompt: |
      The rise in the number embarked between the sixteenth and eighteenth centuries is best explained by
    options:
      - "the growth of sugar plantations in Brazil and the Caribbean, whose deadly labour regime demanded constant replacement, and later of tobacco, rice and coffee"
      - "the abolition of the trade by Britain in 1807"
      - "the decline of Portuguese shipping"
      - "the end of the demand for American silver"
    option_explanations:
      - |
        Correct. Sugar was the engine: Brazil and the Caribbean took two-thirds of all arrivals, and the eighteenth century was the plantation system's peak (4.4, 4.5).
      - |
        Abolition came after the peak and reduced the trade, which is the fall in the last row.
      - |
        Portugal and Brazil carried more enslaved people than any other nation, nearly half the total.
      - |
        Silver mining used mostly Indigenous labour under the mita; it is not the driver of the Atlantic trade.
    answer: 0
    explanation: |
      Skill: analysing data (causation). Sugar explains both the volume and the geography.

