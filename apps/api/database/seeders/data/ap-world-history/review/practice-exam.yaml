      - "The steamship, the telegraph, the gold standard, free trade and European capital exports, which had built an integrated world economy centred on London by 1914"
    option_explanations:
      - |
        The Cold War began in 1947; Keynes describes 1914.
      - |
        Tariffs rose in some states after 1879, but Britain kept free trade and world trade grew to a peak in 1913.
      - |
        The empires were at their greatest extent in 1914; their collapse came after Keynes wrote.
      - |
        Correct. The 'first globalization' of 6.4 is Keynes's subject; 7.1's shifting power after 1900 begins from this high point.
    answer: 3
    explanation: |
      Skill: contextualisation. Keynes describes the imperial world economy from the consumer's end.

