  # ======================================================================
  # Section I, Part B: three short-answer questions (3 points each)
  # ======================================================================
  - slug: apworld-final-q56
    type: short_answer
    topic_code: "2.2"
    source: "Interpretation written for this course, reflecting standard accounts of the Mongol Empire; no historian is quoted"
    points: 3
    stimulus: |
      Interpretation (written for this course): The Mongol conquests of the thirteenth century were the most destructive wars the world had yet seen: cities such as Baghdad, Merv and Kiev were destroyed, and populations in Persia and northern China fell by millions. Yet the empire the conquests built did more to connect Afro-Eurasia than any state before it. Under Mongol rule the Silk Roads were safe from the Pacific to the Black Sea; a relay post system carried messages across the continent; Persian astronomers worked in China and Chinese engineers in Persia; paper money, printing, gunpowder and the compass moved west; merchants, missionaries and envoys such as Marco Polo and Rabban Sauma crossed the whole of Asia. The Mongols made little themselves, but they made the exchange possible, and when their empire broke up in the fourteenth century the connections they had opened did not close.
    prompt: |
      Using the excerpt, answer (a), (b) and (c).

      (a) Describe ONE historical development from the period 1200 to 1450 that supports the author's claim that the Mongol Empire connected Afro-Eurasia.

      (b) Explain ONE way in which a historian could challenge or qualify the author's final sentence, using a specific piece of evidence from the period 1200 to 1450.

      (c) Explain ONE reason the Mongols were able to build an empire of the size the author describes.
    answer: |
      (a) The yam relay system of post stations, which carried messengers and official travellers across the empire with fresh horses every few miles; or the Pax Mongolica that let merchants such as the Polos travel from Venice to Khanbaliq; or the transfer of technologies (gunpowder, printing, the compass) and knowledge (Persian astronomy at the Chinese court, Chinese medicine in the Ilkhanate) across the empire; or the settlement of Chinese and Persian artisans in one another's lands.

      (b) The Black Death travelled the same routes in the 1340s and killed a third of the people it reached, so the connections brought catastrophe as well as exchange; or the break-up of the empire into warring khanates after 1260 and the collapse of the Yuan (1368) and Ilkhanate (1335) made the overland routes less safe and shifted trade to the Indian Ocean, so the connections did partly close; or the Ming's later restrictions on trade show the limits of what the Mongols left behind.

      (c) Cavalry armies of mounted archers with superior mobility and discipline; Chinggis Khan's reorganisation of the tribes into a decimal army loyal to him rather than to clans; the adoption of siege technology and engineers from conquered China and Persia; a policy of terror against cities that resisted and clemency for those that submitted; the recruitment of conquered peoples' administrators (Uighur scribes, Persian officials, Chinese bureaucrats); and the political fragmentation of the states they attacked (the Khwarazmian Empire, the Jin, the Abbasid caliphate).
    explanation: |
      Three points, one per part. Skills: (a) claims and evidence, (b) argumentation (qualifying a secondary source), (c) causation.

      (a) 1 pt for describing a specific development, not just naming it: the yam, the Pax Mongolica and its travellers, technology transfer, the movement of scholars or artisans, the Mongol capital as a meeting place. 'They had trade' earns zero.

      (b) 1 pt for an explanation with specific evidence that complicates 'the connections did not close': the plague (2.6), the empire's fragmentation and the shift to sea routes (2.3), Ming withdrawal, the Timurid wars. Restating the author or disagreeing without evidence earns zero.

      (c) 1 pt for a reason with a mechanism: mobility and archery, Chinggis's military and political reforms, adopted siege technology, terror as policy, use of conquered administrators, or the weakness and division of the targets (2.2). Naming 'horses' without explaining why they mattered earns zero.

  - slug: apworld-final-q57
    type: short_answer
    topic_code: "6.2"
    source: "Primary source: Constitution of the Empire of Japan (1889), English translation by Ito Miyoji (1889), National Diet Library of Japan"
    points: 3
    stimulus: |
      "Article 1. The Empire of Japan shall be reigned over and governed by a line of Emperors unbroken for ages eternal.
      Article 3. The Emperor is sacred and inviolable.
      Article 4. The Emperor is the head of the Empire, combining in Himself the rights of sovereignty, and exercises them, according to the provisions of the present Constitution."

      — Constitution of the Empire of Japan, promulgated 11 February 1889, translated into English the same year by Ito Miyoji
    prompt: |
      Using the source, answer (a), (b) and (c).

      (a) Describe ONE way the constitution combines older Japanese ideas with a borrowed Western form.

      (b) Explain ONE reason Japan's leaders adopted a written constitution in the 1880s.

      (c) Explain ONE way Japan's response to Western pressure in the nineteenth century differed from China's.
    answer: |
      (a) It is a written constitution with articles, a parliament (the Diet), a cabinet and courts, modelled on Prussia's; but it places at its head an emperor described as sacred and descended from an unbroken line, drawing on Shinto myth and the restored imperial authority of 1868. Sovereignty rests in the emperor, not the people; the Diet advises and consents.

      (b) To win the revision of the unequal treaties, Japan's leaders needed to show the Western powers a modern state with law, courts and representative institutions; to channel the Freedom and People's Rights movement's demands into a safe form; to give the Meiji oligarchs' rule legitimacy and permanence; and because the Iwakura mission (1871–73) had concluded that constitutional government was part of what made the West strong.

      (c) Japan centralised power under the restored emperor and adopted Western industry, conscription, schooling and law wholesale from 1868, keeping sovereignty and revising the unequal treaties by 1899, then joining the imperial powers by defeating China (1895) and Russia (1905); China's Self-Strengthening Movement adopted arms and arsenals but kept the Confucian state and the Qing court, lost to Japan in 1895, suffered the Boxer Protocol and fell in 1911. The difference lay in the completeness of the reform and in who controlled it: a new elite in Japan, the old court in China.
    explanation: |
      Three points, one per part. Skills: (a) sourcing and content, (b) causation, (c) comparison.

      (a) 1 pt for a described combination drawn from the text: the sacred emperor (older) within a written constitution and parliament (borrowed); 'ages eternal' alongside 'provisions of the present Constitution'. Naming only one side earns zero.

      (b) 1 pt for an explained reason: treaty revision, domestic pressure, legitimacy, the Iwakura mission's conclusions, the Prussian model's appeal to oligarchs (6.2, 5.6).

      (c) 1 pt for a specific contrast with China with a reason for the difference: completeness of reform, who led it, outcomes (1895, 1905, 1911). 'Japan modernised and China did not' without detail earns zero.

  - slug: apworld-final-q58
    type: short_answer
    topic_code: "8.9"
    source: "general knowledge"
    points: 3
    prompt: |
      Answer (a), (b) and (c).

      (a) Identify ONE way in which the Cold War shaped the process of decolonization in Asia or Africa between 1945 and 1975.

      (b) Explain ONE way in which a newly independent state attempted to remain outside the Cold War's blocs.

      (c) Explain ONE reason many newly independent states adopted authoritarian or one-party government within a decade of independence.
    answer: |
      (a) The superpowers armed and funded rival nationalist movements, turning independence struggles into proxy wars (Vietnam, Angola, the Congo); the United States tolerated its allies' colonial wars when communism was at stake (France in Vietnam) and pressed for independence when it was not (the Dutch in Indonesia); the Soviet Union supplied arms and scholarships to movements such as the MPLA and the ANC; the Suez crisis of 1956 showed both superpowers forcing Britain and France to withdraw.

      (b) Non-alignment: Nehru's India, Nasser's Egypt, Sukarno's Indonesia and Tito's Yugoslavia met at Bandung (1955) and founded the Non-Aligned Movement (1961), refusing to join either bloc while taking aid from both; India accepted Soviet steel mills and American wheat; Egypt took Soviet arms and American offers for the Aswan Dam before Nasser nationalised the canal.

      (c) Inherited borders enclosed rival peoples, and leaders argued that only one party could hold them together (Nkrumah's Ghana, Nyerere's Tanzania); the colonial state had been authoritarian and left no tradition of opposition; economic disappointment and falling commodity prices discredited elected governments; the army was often the only organised national institution, hence coups (Nigeria 1966, Ghana 1966); Cold War patrons rewarded reliable strongmen (Mobutu in Zaire); and the model of single-party mobilisation, from the Soviet Union or China, seemed to promise faster development.
    explanation: |
      Three points, one per part. Skills: (a) causation and making connections, (b) developments and processes, (c) causation.

      (a) 1 pt for a specific way the Cold War shaped decolonization, with an example (8.5, 8.3).

      (b) 1 pt for an explained strategy of non-alignment with a named state and what it did (8.6).

      (c) 1 pt for a reason with a mechanism: borders, colonial legacy, economic failure, the army's position, Cold War patronage, the one-party development model (8.6). 'They were corrupt' without a reason earns zero.

