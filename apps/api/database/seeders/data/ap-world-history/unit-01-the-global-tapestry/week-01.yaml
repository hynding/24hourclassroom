week: 1
unit: 1
title: "East Asia and Dar al-Islam, c. 1200–1450"
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  Song China's examination bureaucracy, Neo-Confucianism and commercial boom (Champa rice, the Grand Canal, paper
  money, iron and porcelain), how Korea, Japan and Vietnam borrowed and adapted, and the Islamic world after the
  Abbasid decline: Turkic states, the preservation and extension of learning, and the spread of Islam by conquest,
  trade and Sufi missionaries. Worked examples on continuity and change and on building a comparison claim.
flashcards_description: |
  27 cards on Song China, its neighbours, and Dar al-Islam from c. 1200 to c. 1450: terms, dates, people and the
  comparisons the exam asks for.

flashcards:
  - front: Song dynasty (960–1279) → the three things the exam wants you to know about it
    back: |
      A bureaucracy chosen by civil service examinations on the Confucian classics; a Neo-Confucian revival that reasserted hierarchy and filial piety; and the most commercialised economy in the world, built on Champa rice, the Grand Canal, iron and steel, porcelain, silk and paper money.
    topic_code: "1.1"
  - front: Civil service examination under the Song → open to whom in theory, and in practice?
    back: |
      In theory any man could sit the examinations on the Confucian classics; in practice years of expensive study favoured landowning families. The system still brought in new talent and made education, not birth alone, the mark of elite status.
    topic_code: "1.1"
  - front: Scholar-gentry → who they were and why they mattered
    back: |
      Landowning families whose sons were educated for the examinations and staffed the bureaucracy. They dominated local society, mediated between the state and villages, and carried Confucian values into every province.
    topic_code: "1.1"
  - front: Neo-Confucianism (Zhu Xi) → what it borrowed and what it reasserted
    back: |
      A Song revival of Confucian thought that borrowed Buddhist and Daoist questions about the cosmos and the self while reasserting social hierarchy, filial piety and the subordination of women. It became the orthodoxy tested in the examinations.
    topic_code: "1.1"
  - front: Filial piety → definition and why the state cared
    back: |
      The duty of children to honour and obey their parents. Confucians treated it as the root of all order: a filial son would be a loyal subject, so the family was the model and training ground for the state.
    topic_code: "1.1"
  - front: Foot binding → what it signals about Song society
    back: |
      Binding elite girls' feet spread under the Song as a mark of status and refinement. It shows women's roles narrowing in the Neo-Confucian era even as women kept dowry rights and ran households and textile work.
    topic_code: "1.1"
  - front: Champa rice → where it came from and what it did
    back: |
      A fast-ripening, drought-tolerant rice from Champa (Vietnam) adopted in Song China. Two harvests a year raised food output and supported a population that roughly doubled to about 100 million.
    topic_code: "1.1"
  - front: Grand Canal under the Song → economic role
    back: |
      Linked the rice-growing Yangzi region with the political north, moving grain, tax revenue and manufactured goods. It knit regional markets into one economy and fed the capital.
    topic_code: "1.1"
  - front: Song iron and steel → scale and uses
    back: |
      Coal-fired furnaces produced iron on a scale Europe did not match until the 1700s, for tools, weapons, coins and bridges. It is a key example of Song technological and industrial strength.
    topic_code: "1.1"
  - front: Proto-industrialisation in Song China → meaning
    back: |
      Rural households and workshops producing goods (silk, porcelain, iron) for distant markets rather than for their own use, without factories. It explains how Song exports reached the Indian Ocean and Islamic worlds.
    topic_code: "1.1"
  - front: Paper money in China → who invented it, who kept it
    back: |
      The Song issued the world's first state paper currency, backed by the state's authority. The Mongol Yuan continued it (Marco Polo described mulberry-bark notes that no one dared refuse) and over-issued it, causing inflation.
    topic_code: "1.1"
  - front: Buddhism in Song China → forms and Confucian reaction
    back: |
      Chan (Zen) and Pure Land Buddhism were widely popular. Neo-Confucians criticised monasteries as unproductive and foreign but absorbed Buddhist ideas about the cosmos into their own philosophy.
    topic_code: "1.1"
  - front: Tributary system → how it worked
    back: |
      Neighbouring rulers sent envoys with gifts and ritual submission to the Chinese emperor and received gifts, recognition and trading rights in return. It expressed Chinese claims to centrality while giving neighbours access to Chinese markets.
    topic_code: "1.1"
  - front: Korea (Goryeo) → borrowed from China and kept its own
    back: |
      Adopted Chinese writing, Buddhism, Confucian ideas and a civil service examination, but a hereditary aristocracy kept control of high office. A tributary partner of China that remained politically separate.
    topic_code: "1.1"
  - front: Japan under the Kamakura shogunate (from 1185) → what it did NOT borrow from China
    back: |
      Japan borrowed Chinese writing, Buddhism and court ritual but never adopted the examination bureaucracy. Real power passed to the shogun and samurai lords while the emperor reigned as a figurehead.
    topic_code: "1.1"
  - front: Vietnam (Dai Viet) → adaptation of Chinese models
    back: |
      Adopted Confucian bureaucracy, examinations and Chinese script after winning independence from China, while women kept a larger public role than in China and the state fiercely resisted Chinese political control.
    topic_code: "1.1"
  - front: Abbasid Caliphate by 1200 → its real condition
    back: |
      A caliph still reigned in Baghdad but real power lay with regional dynasties, mostly Turkic. The Mongols sacked Baghdad and killed the last Abbasid caliph in 1258.
    topic_code: "1.2"
  - front: Seljuk Turks → relationship to the Abbasid caliph
    back: |
      Turkic Muslims who took Baghdad in the 1050s, ruled as sultans and left the caliph as a religious figurehead. The first clear case of Turkic military rulers governing in the name of an Arab caliphate.
    topic_code: "1.2"
  - front: Mamluk Sultanate (1250–1517) → origin and famous victory
    back: |
      Egypt and Syria ruled by former enslaved soldiers (mamluks) of Turkic and Circassian origin who seized power in 1250 and defeated the Mongols at Ain Jalut in 1260, protecting Cairo as a centre of Islamic learning.
    topic_code: "1.2"
  - front: Delhi Sultanate (1206–1526) → what kind of state
    back: |
      Turkic and Afghan Muslim rulers over northern India, a Muslim ruling minority governing a Hindu majority. It spread Islam in South Asia by conquest and patronage while most of the population remained Hindu.
    topic_code: "1.2"
  - front: Nasir al-Din al-Tusi → why he appears in topic 1.2
    back: |
      A Persian scholar (1201–1274) who ran the Maragha observatory under Mongol patronage and improved astronomical models. An example of Islamic science continuing and advancing after the fall of Baghdad.
    topic_code: "1.2"
  - front: Ibn Khaldun → contribution
    back: |
      A North African scholar (1332–1406) whose introduction to history analysed how group solidarity builds dynasties and how luxury weakens them. Often called an early social scientist and historian of civilisations.
    topic_code: "1.2"
  - front: Ibn Battuta → who, when, why historians use him
    back: |
      A Moroccan jurist who travelled from 1325 to 1354 across North Africa, Arabia, East Africa, India, Southeast Asia and China, and served as a judge in Delhi and the Maldives. His account shows the shared law and culture of Dar al-Islam.
    topic_code: "1.2"
  - front: Three ways Islam spread, c. 1200–1450 → with an example of each
    back: |
      Conquest (the Delhi Sultanate in northern India); trade (merchants carrying Islam to the Swahili coast and West Africa); Sufi missionaries (mystics winning converts in Southeast Asia and Central Asia by blending Islam with local practice).
    topic_code: "1.2"
  - front: Sufism → definition and role in conversion
    back: |
      The mystical tradition of Islam, organised in brotherhoods under revered teachers. Sufis travelled widely, tolerated local customs and emphasised personal devotion, which made them effective missionaries where armies and jurists were not.
    topic_code: "1.2"
  - front: House of Wisdom legacy → what Islamic scholars preserved and extended
    back: |
      Greek philosophy, mathematics and medicine translated into Arabic at Baghdad and then extended: algebra, trigonometry, optics, hospitals, astronomical tables. This learning later reached Europe through Spain and Sicily.
    topic_code: "1.2"
  - front: Compare how Song China and Dar al-Islam held together culturally
    back: |
      Song China relied on one state and one examination curriculum; Dar al-Islam, politically fragmented, relied on shared sharia law, Arabic scholarship, and networks of merchants, judges and Sufis that let a traveller like Ibn Battuta find work anywhere.
    topic_code: "1.2"

quiz:
  description: |
    21 questions · about 35 minutes · all on this week (topics 1.1 and 1.2: Song China and its neighbours, and Dar
    al-Islam), with no review yet because this is week 1. Multiple choice, select-all and true/false items are graded
    at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Marco Polo on paper money (1.1)
    - slug: apworld-u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book II ch. 24 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "He makes them take of the bark of a certain tree, in fact of the Mulberry Tree, the leaves of which are the food of the silkworms ... and this they make into something resembling sheets of paper, but black. ... And the Kaan causes every year to be made such a vast quantity of this money, which costs him nothing, that it must equal in amount all the treasure in the world. ... And nobody, however important he may think himself, dares to refuse them on pain of death."

        — Marco Polo, Venetian merchant describing the court of Kublai Khan, *The Travels of Marco Polo*, Book II, chapter 24 (Yule–Cordier edition, 1903)
      prompt: |
        The paper currency Polo describes is best understood as a continuation of which earlier development?
      options:
        - "The Tang dynasty's practice of paying officials in silk"
        - "The commercial innovations of Song China, including the first state-issued paper money"
        - "The Abbasid Caliphate's use of letters of credit between merchants"
        - "The Mongol tradition of trading in livestock rather than coin"
      option_explanations:
        - |
          Silk was used as money earlier, but the printed, sealed notes Polo describes are a different instrument that began under the Song.
        - |
          Correct. Song China issued the first state paper currency in the 1000s; the Mongol Yuan inherited and expanded it, which is what Polo saw.
        - |
          Islamic merchants used credit instruments, but Polo is describing state-issued currency enforced by the Chinese government, not merchant credit.
        - |
          Mongol herders did not use paper money on the steppe; the system came from the Chinese state they conquered.
      answer: 1
      explanation: |
        Skill: continuity and change. The Yuan continued a Song innovation; the question tests whether you can place a source in a longer development.

    - slug: apworld-u01-w01-q02
      type: multiple_choice
      topic_code: "1.1"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book II ch. 24 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "He makes them take of the bark of a certain tree, in fact of the Mulberry Tree, the leaves of which are the food of the silkworms ... and this they make into something resembling sheets of paper, but black. ... And the Kaan causes every year to be made such a vast quantity of this money, which costs him nothing, that it must equal in amount all the treasure in the world. ... And nobody, however important he may think himself, dares to refuse them on pain of death."

        — Marco Polo, Venetian merchant describing the court of Kublai Khan, *The Travels of Marco Polo*, Book II, chapter 24 (Yule–Cordier edition, 1903)
      prompt: |
        Which feature of the excerpt most clearly reflects Polo's point of view as a European merchant?
      options:
        - "His emphasis on the religious meaning of the mulberry tree"
        - "His criticism of the Khan for ruling without a Confucian bureaucracy"
        - "His astonishment that money with no metal content could be made to circulate by state authority"
        - "His claim that the Chinese had learned paper-making from Venice"
      option_explanations:
        - |
          Polo mentions the mulberry only to explain the raw material; nothing in the excerpt treats the tree as sacred.
        - |
          Polo admired the Khan and says nothing about Confucian officials here; the excerpt is about money, not administration.
        - |
          Correct. European money was coin whose value lay in its metal; a merchant would be amazed by notes that "cost him nothing" yet circulated under threat of death.
        - |
          Paper-making was Chinese in origin and Polo makes no such claim; the excerpt describes a process he had never seen at home.
      answer: 2
      explanation: |
        Skill: sourcing (point of view). Ask what the author's background made remarkable to him.

    - slug: apworld-u01-w01-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book II ch. 24 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "He makes them take of the bark of a certain tree, in fact of the Mulberry Tree, the leaves of which are the food of the silkworms ... and this they make into something resembling sheets of paper, but black. ... And the Kaan causes every year to be made such a vast quantity of this money, which costs him nothing, that it must equal in amount all the treasure in the world. ... And nobody, however important he may think himself, dares to refuse them on pain of death."

        — Marco Polo, Venetian merchant describing the court of Kublai Khan, *The Travels of Marco Polo*, Book II, chapter 24 (Yule–Cordier edition, 1903)
      prompt: |
        A historian using this excerpt as evidence about the Chinese economy in the period 1200–1450 would most need to consider which of the following?
      options:
        - "That Polo was describing a Mongol state that had conquered the Song, and that issuing notes in such vast quantity eventually produced inflation"
        - "That paper money was unknown in China and Polo must have confused it with silk"
        - "That the Mongols abolished all trade with the Islamic world"
        - "That Chinese merchants refused to use any form of currency"
      option_explanations:
        - |
          Correct. The Yuan over-issued paper money; a historian must separate the Song origin of the system from its Mongol-era abuse.
        - |
          Paper money is well documented in Song and Yuan China; Polo's description matches Chinese records.
        - |
          The Mongols encouraged trade across Eurasia, including with Muslim merchants, many of whom served the Yuan state.
        - |
          Song and Yuan China were highly monetised; copper coin, silver and paper notes all circulated widely.
      answer: 0
      explanation: |
        Skill: evaluating evidence. The same source supports a claim about Song innovation and a claim about Yuan inflation; the historian must know the context.

    # ---- Stimulus set B: a described table of Song economic indicators (1.1)
    - slug: apworld-u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: Rounded figures compiled for this course from standard estimates of the Chinese economy.

        | Indicator | c. 750 (Tang) | c. 1100 (Song) |
        |---|---|---|
        | Population (millions) | about 50 | about 100 |
        | Rice harvests per year in the south | 1 | 2 (with Champa rice) |
        | Annual iron output (tons, rounded) | about 10,000 | about 100,000 |
        | Share of population living south of the Yangzi | under half | about two-thirds |
      prompt: |
        Which conclusion is best supported by the data in the table?
      options:
        - "Song China's growth depended mainly on conquering new territory in Central Asia"
        - "Agricultural innovation and manufacturing growth went together with a shift of population to the south"
        - "The Song population grew because the examination system expanded"
        - "Iron output rose because China imported ore from the Islamic world"
      option_explanations:
        - |
          The Song lost territory, including the north after 1127; the table shows internal growth, not conquest.
        - |
          Correct. Two harvests, doubled population, a tenfold rise in iron and a southward shift of people describe an internally driven economic transformation.
        - |
          The examinations selected officials; they did not feed people. The table offers no data on examinations.
        - |
          Song iron came from domestic mines smelted with coal; nothing in the table mentions imports.
      answer: 1
      explanation: |
        Skill: analysing a data stimulus. Read every row and look for the pattern that links them.

    - slug: apworld-u01-w01-q05
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: Rounded figures compiled for this course from standard estimates of the Chinese economy.

        | Indicator | c. 750 (Tang) | c. 1100 (Song) |
        |---|---|---|
        | Population (millions) | about 50 | about 100 |
        | Rice harvests per year in the south | 1 | 2 (with Champa rice) |
        | Annual iron output (tons, rounded) | about 10,000 | about 100,000 |
        | Share of population living south of the Yangzi | under half | about two-thirds |
      prompt: |
        The change in the "rice harvests per year" row is most directly explained by which development?
      options:
        - "The introduction of a fast-ripening rice variety from Vietnam"
        - "The building of the Great Wall to protect northern farms"
        - "The Mongol conquest of the Song in 1279"
        - "The adoption of maize from the Americas"
      option_explanations:
        - |
          Correct. Champa rice, adopted from Vietnam, ripened in about two months and tolerated drought, allowing two crops a year in the south.
        - |
          Wall-building concerned the northern frontier and had nothing to do with rice yields in the south.
        - |
          The Mongol conquest came after the period in the table and did not raise harvests.
        - |
          Maize reached China only after the Columbian Exchange in the 1500s, far too late for this table.
      answer: 0
      explanation: |
        Skill: causation. Champa rice is the CED's named example of an agricultural innovation behind Song growth.

    - slug: apworld-u01-w01-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: Rounded figures compiled for this course from standard estimates of the Chinese economy.

        | Indicator | c. 750 (Tang) | c. 1100 (Song) |
        |---|---|---|
        | Population (millions) | about 50 | about 100 |
        | Rice harvests per year in the south | 1 | 2 (with Champa rice) |
        | Annual iron output (tons, rounded) | about 10,000 | about 100,000 |
        | Share of population living south of the Yangzi | under half | about two-thirds |
      prompt: |
        The southward shift of population shown in the last row made which piece of infrastructure especially important to the Song state?
      options:
        - "The Silk Road caravan cities of Central Asia"
        - "The Grand Canal linking the Yangzi region to the north"
        - "The Great Wall's garrison towns"
        - "The tributary ports of Korea"
      option_explanations:
        - |
          Overland Silk Road trade mattered for luxuries, but it did not move the southern grain the state needed.
        - |
          Correct. With most people and rice in the south, the Grand Canal carried grain, taxes and goods to the political north.
        - |
          Garrisons consumed grain; they did not solve the problem of moving it from the south.
        - |
          Korean ports were part of tributary diplomacy, not of China's internal grain supply.
      answer: 1
      explanation: |
        Skill: connecting a data pattern to the infrastructure that managed it.

    # ---- Stand-alone multiple choice (1.1, 1.2)
    - slug: apworld-u01-w01-q07
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best describes the Song civil service examination system?
      options:
        - "It was restricted by law to the sons of nobles"
        - "It tested military skill and horsemanship above all"
        - "It tested knowledge of the Confucian classics and was open in principle to men of any background, though wealth helped"
        - "It was abolished by the Song in favour of hereditary office"
      option_explanations:
        - |
          The examinations were legally open to commoners; that openness was their point, even if the rich had advantages.
        - |
          The examinations tested classical learning and essay writing, not fighting; the Song in fact subordinated the military to civil officials.
        - |
          Correct. Candidates memorised and interpreted the Confucian canon; any man could sit, but years of study favoured landowning families.
        - |
          The Song expanded the examinations enormously; they were the main route to office until 1905.
      answer: 2
      explanation: |
        The CED describes the examination system as a continuity from earlier dynasties that the Song expanded.

    - slug: apworld-u01-w01-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        After the decline of Abbasid political power, which of the following best describes the new states that governed much of the Islamic world between 1200 and 1450?
      options:
        - "Arab tribal confederations restoring the early caliphate"
        - "Christian crusader kingdoms controlling Baghdad and Cairo"
        - "Persian republics governed by elected councils of merchants"
        - "Turkic-led sultanates such as the Seljuks, Mamluks and Delhi Sultanate that ruled in the name of Islam"
      option_explanations:
        - |
          Arab political dominance had ended; the new rulers were mostly Turkic in origin.
        - |
          Crusaders held parts of the Levant coast for a time but never Baghdad or Cairo.
        - |
          There were no elected republics; the states were military sultanates.
        - |
          Correct. Turkic peoples who entered the Islamic world as soldiers and migrants founded the Seljuk, Mamluk and Delhi states.
      answer: 3
      explanation: |
        The CED's key idea for 1.2: Turkic peoples replaced Arabs as the rulers of the central Islamic lands.

    - slug: apworld-u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A Moroccan jurist who travelled from 1325 to 1354 found that he could serve as a judge in Delhi and in the Maldives. His experience best illustrates which feature of Dar al-Islam in this period?
      options:
        - "The political unity of the caliphate under one ruler"
        - "The shared legal and religious culture that outlasted political fragmentation"
        - "The dominance of Arabic speakers in every government"
        - "The absence of long-distance travel before 1450"
      option_explanations:
        - |
          There was no single ruler; the Abbasid caliphate had been destroyed in 1258.
        - |
          Correct. Sharia law, Arabic learning and networks of scholars meant that a trained jurist was employable anywhere in the Islamic world.
        - |
          Rulers in Delhi were Turkic and Persian-speaking; Arabic was the language of law and religion, not of every court.
        - |
          Ibn Battuta's travels are themselves evidence of extensive long-distance travel.
      answer: 1
      explanation: |
        Ibn Battuta is the CED's example of the cultural coherence of Dar al-Islam.

    - slug: apworld-u01-w01-q10
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes how Japan adapted Chinese models in the period around 1200–1450?
      options:
        - "Japan adopted Chinese writing and Buddhism but not the examination bureaucracy, and power rested with the shogun and samurai"
        - "Japan became a Chinese province governed by Song officials"
        - "Japan rejected Buddhism entirely and adopted Confucian examinations"
        - "Japan's emperor ruled directly through a Chinese-style civil service"
      option_explanations:
        - |
          Correct. Japan borrowed selectively; the Kamakura shogunate (from 1185) placed real power with military lords while the emperor reigned.
        - |
          Japan was never a Chinese province; it borrowed by choice through contact and tribute.
        - |
          Buddhism (especially Zen and Pure Land) flourished in Japan; the examinations never took root.
        - |
          The emperor was a figurehead under the shogunate; there was no examination-based civil service.
      answer: 0
      explanation: |
        Skill: comparison. The CED asks how neighbouring states borrowed from and differed from China.

    - slug: apworld-u01-w01-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The work of Nasir al-Din al-Tusi at the Maragha observatory and of Ibn Khaldun on the rise and fall of dynasties best supports which claim about the Islamic world after 1258?
      options:
        - "Scholarship ended with the destruction of Baghdad"
        - "Islamic scholars abandoned Greek learning for Chinese models"
        - "Intellectual life continued and advanced under new patrons, including the Mongols"
        - "All scientific work moved to Christian Europe"
      option_explanations:
        - |
          Al-Tusi worked after 1258 under Mongol patronage, which shows that scholarship did not end.
        - |
          Islamic scholars continued to build on Greek mathematics and astronomy; Chinese influence was limited to specific techniques.
        - |
          Correct. New rulers, including the Mongol Ilkhans, funded observatories and scholars; Ibn Khaldun wrote in the 1370s.
        - |
          Europe later drew on Islamic science, but the work itself continued in Persia, Egypt and North Africa.
      answer: 2
      explanation: |
        The CED stresses continuity of intellectual innovation in Dar al-Islam across the period.

    - slug: apworld-u01-w01-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains the role of Sufi missionaries in the spread of Islam between 1200 and 1450?
      options:
        - "They led the armies that conquered northern India"
        - "They enforced strict legal orthodoxy and rejected all local practice"
        - "They confined their teaching to the Arabian Peninsula"
        - "They won converts by personal devotion and by tolerating local customs, reaching regions armies never entered"
      option_explanations:
        - |
          Conquest was the work of Turkic sultans; Sufis were mystics and teachers, not generals.
        - |
          Jurists enforced orthodoxy; Sufis were often criticised precisely for their accommodation of local custom.
        - |
          Sufis travelled widely; their influence was greatest far from Arabia.
        - |
          Correct. Sufi brotherhoods blended Islam with local religious practice and spread the faith in Southeast Asia, Central Asia and Africa.
      answer: 3
      explanation: |
        The CED names merchants, military expansion and Sufi missionaries as the three carriers of Islam.

    # ---- Select all
    - slug: apworld-u01-w01-q13
      type: multi_select
      topic_code: "1.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following were features of the Song Chinese economy between c. 1000 and 1279? Select all that apply.
      options:
        - "Two rice harvests a year in the south thanks to Champa rice"
        - "Large-scale iron and steel production using coal"
        - "State-issued paper money"
        - "Factories powered by steam engines"
        - "Porcelain and silk produced for export along the Silk Roads and the Indian Ocean"
      option_explanations:
        - |
          Correct. Champa rice allowed double cropping and underpinned population growth.
        - |
          Correct. Song iron output was unmatched anywhere until the eighteenth century.
        - |
          Correct. The Song issued the first state paper currency; the Yuan continued it.
        - |
          Steam power belongs to the Industrial Revolution of the 1700s and 1800s; Song production was household and workshop based.
        - |
          Correct. Song porcelain and silk were the luxury exports that drew merchants from across Eurasia.
      answer: [0, 1, 2, 4]
      explanation: |
        Skill: identifying the components of Song commercialisation and proto-industrialisation.

    - slug: apworld-u01-w01-q14
      type: multi_select
      topic_code: "1.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following accurately describe the Islamic world between c. 1200 and c. 1450? Select all that apply.
      options:
        - "Turkic peoples founded major states such as the Mamluk Sultanate and the Delhi Sultanate"
        - "The Mongols destroyed the Abbasid Caliphate in 1258"
        - "Islam spread into sub-Saharan Africa and Southeast Asia largely through merchants and Sufis"
        - "A single caliph ruled all Muslims from Baghdad throughout the period"
        - "Islamic scholars preserved Greek learning and advanced mathematics, astronomy and medicine"
      option_explanations:
        - |
          Correct. Turkic soldiers and migrants became the rulers of the central Islamic lands and northern India.
        - |
          Correct. Hulagu's army sacked Baghdad and killed the last Abbasid caliph there.
        - |
          Correct. Trade and Sufi missionaries, more than armies, carried Islam to Mali, the Swahili coast and the Indonesian islands.
        - |
          Political unity had ended long before 1200; the Abbasid caliph was a figurehead and then a victim of the Mongols.
        - |
          Correct. Translation, hospitals, observatories and new mathematics continued across the period.
      answer: [0, 1, 2, 4]
      explanation: |
        The CED's three strands for 1.2: new Turkic states, intellectual transfer, and the spread of Islam.

    # ---- True / false
    - slug: apworld-u01-w01-q15
      type: true_false
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Neo-Confucianism rejected every Buddhist idea and sought to remove Buddhism from Chinese life entirely.
      answer: false
      explanation: |
        False. Neo-Confucians such as Zhu Xi criticised monasteries but absorbed Buddhist and Daoist questions about the cosmos and the self into a renewed Confucian philosophy. Buddhism remained popular, especially in its Chan and Pure Land forms.

    - slug: apworld-u01-w01-q16
      type: true_false
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The Mamluk Sultanate of Egypt was founded by former enslaved soldiers and defeated a Mongol army at Ain Jalut in 1260.
      answer: true
      explanation: |
        True. Mamluks were enslaved Turkic and Circassian soldiers who seized power in 1250; their victory at Ain Jalut stopped the Mongol advance into Egypt and preserved Cairo as a centre of Islamic learning and trade.

