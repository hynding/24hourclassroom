    # ---- Short answers (SAQ style)
    - slug: apworld-u01-w01-q19
      type: short_answer
      topic_code: "1.1"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book II ch. 76 (Yule–Cordier edition, 1903), Wikisource"
      points: 3
      stimulus: |
        "First and foremost, then, the document stated the city of Kinsay to be so great that it hath an hundred miles of compass. And there are in it twelve thousand bridges of stone, for the most part so lofty that a great fleet could pass beneath them. And let no man marvel that there are so many bridges, for you see the whole city stands as it were in the water and surrounded by water, so that a great many bridges are required to give free passage about it."

        — Marco Polo describing Kinsay (Hangzhou), the former Southern Song capital, *The Travels of Marco Polo*, Book II, chapter 76 (Yule–Cordier edition, 1903)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Identify ONE claim in the excerpt that a historian should treat with caution, and explain why.
        (b) Explain ONE economic development of Song China that helps account for the size of a city like Hangzhou.
        (c) Explain ONE way Polo's intended audience shaped the way he described the city.
      answer: |
        (a) The claim of "twelve thousand bridges" and "an hundred miles of compass" is almost certainly exaggerated; Polo was repeating figures from a document and writing to impress, so the numbers show scale rather than exact measurement.
        (b) Song commercialisation: double-cropped Champa rice fed a large urban population, the Grand Canal and river network brought grain and goods to the city, and manufacturing of silk and porcelain and the use of paper money supported a dense population of merchants and artisans.
        (c) Polo wrote for European readers whose largest cities held perhaps 100,000 people; he emphasised size, water and bridges because these would astonish them, which explains the piling up of superlatives.
      explanation: |
        Three points, one per part.

        (a) 1 pt: identifies a specific claim (bridges, circumference) and gives a reason for caution (round numbers, reliance on a document, desire to impress). Zero for "it is biased" without a reason.

        (b) 1 pt: a specific Song development linked to urban size: Champa rice and population growth; the Grand Canal and water transport; manufacturing and trade; paper money and commercial credit. Zero for a development from another period (e.g. steam power).

        (c) 1 pt: links audience (European, merchant, Christian) to emphasis: superlatives, comparison to what readers knew, focus on commerce. Accept purpose (to entertain or promote travel) if explained.

    - slug: apworld-u01-w01-q20
      type: short_answer
      topic_code: "1.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        A historian writing for this course argues: "The destruction of Baghdad in 1258 is often treated as the end of Islamic civilisation's golden age. In fact, the century after 1258 saw observatories built under Mongol patronage, the writing of a new science of history in North Africa, the expansion of Islam into West Africa and Southeast Asia, and travellers crossing the Islamic world with no sense that anything had ended."
      prompt: |
        Using the passage, answer (a), (b) and (c).

        (a) Describe the historian's main argument.
        (b) Explain ONE piece of historical evidence that supports the argument.
        (c) Explain ONE piece of historical evidence that could be used to challenge or qualify the argument.
      answer: |
        (a) The historian argues that 1258 was a political catastrophe but not a cultural or religious decline: Islamic learning, trade and conversion continued and expanded after the fall of Baghdad.
        (b) Nasir al-Din al-Tusi's observatory at Maragha, funded by the Mongol Ilkhans after 1258, produced advanced astronomical work; or Ibn Battuta's travels (1325–1354) show a functioning, connected Dar al-Islam; or Mali's rulers adopted Islam and Timbuktu became a centre of learning.
        (c) The loss of Baghdad's libraries and the end of the caliphate removed a unifying symbol of political authority; the Islamic world was now divided among competing Turkic and Mongol states, and the centre of Arabic scholarship shifted to Cairo, which could be read as a real break even if not an end.
      explanation: |
        Three points, one per part.

        (a) 1 pt: the argument that Islamic civilisation continued or flourished after 1258 despite political collapse. Zero for merely restating that Baghdad fell.

        (b) 1 pt: specific evidence of continuity after 1258: al-Tusi and Maragha; Ibn Khaldun; Ibn Battuta; Mamluk Cairo; Islam's spread into Mali or Southeast Asia. Must be dated after 1258 or clearly span it.

        (c) 1 pt: specific evidence of loss or change: destruction of libraries and the caliphate; political fragmentation; shift of scholarly centre to Cairo; Mongol rule over Persia. Zero for a vague "some things got worse".

    # ---- Long essay (LEQ style)
    - slug: apworld-u01-w01-q21
      type: long_answer
      topic_code: "1.1"
      source: "general knowledge"
      points: 6
      prompt: |
        In the period c. 1200 to c. 1450, states in East Asia and in the Islamic world drew on older traditions of government, religion and learning while also innovating.

        Develop an argument that evaluates the extent to which Song China maintained continuity with earlier Chinese traditions in the period c. 1200 to c. 1450.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (continuity and change, causation, or comparison).
      answer: |
        Thesis: Song China maintained strong continuity with earlier traditions in government and ideology, keeping the examination system, Confucian ethics and the tributary order, but it transformed the scale and basis of those traditions, expanding the examinations into the main route to office, remaking Confucianism as Neo-Confucianism, and building a commercial economy without precedent.

        Context: Tang China (618–907) had built a Confucian bureaucracy, a cosmopolitan capital and Buddhist institutions; after its collapse the Song reunified most of China in 960 but faced strong northern neighbours and lost the north in 1127.

        Body 1 (continuities): examinations on the Confucian classics; filial piety and the family as model for the state; the tributary system with Korea and Vietnam; Buddhism's continuing popularity.

        Body 2 (changes): printing and the massive expansion of examinations produced the scholar-gentry; Zhu Xi's Neo-Confucianism absorbed Buddhist metaphysics; women's status narrowed (foot binding); Champa rice, the Grand Canal, iron, paper money and export manufacturing created the world's most commercialised economy.

        Body 3 (weighing): the form of the state continued but its social base and economic foundation changed; the Mongol conquest of 1279 then preserved many Song institutions, showing their durability.

        Conclusion: continuity in ideals, transformation in scale and economy; the Song is best described as reinventing tradition rather than preserving it.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim that answers "to what extent" with a line of reasoning, e.g. continuity in political ideals but transformation in economy and social base. Zero for "the Song continued some things and changed others" with no evaluation.

        Contextualization (0–1): relevant broader context before or around the argument: the Tang legacy, the Song's loss of the north, the wider East Asian world of Korea, Japan and Vietnam, or the Silk Road trade. Must be developed, not a passing phrase.

        Evidence (0–2): 1 pt for at least two specific examples (examination system, scholar-gentry, Neo-Confucianism and Zhu Xi, filial piety, foot binding, Champa rice, Grand Canal, iron and steel, paper money, porcelain exports, tributary system, Buddhism). 2 pts when the evidence is used to support the argument about continuity or change, not merely listed.

        Analysis and reasoning (0–2): 1 pt for framing the argument with continuity and change (or comparison with Dar al-Islam). 1 pt for complexity: weighing degrees of continuity in different areas, explaining why some things continued (printing cheapened the classics) and others changed, or showing that the Mongols preserved Song institutions after 1279. Must be sustained, not a single sentence.

        Common errors: treating paper money or the examinations as Mongol creations; claiming the Song conquered new territory; writing only about the economy and ignoring government and belief.
