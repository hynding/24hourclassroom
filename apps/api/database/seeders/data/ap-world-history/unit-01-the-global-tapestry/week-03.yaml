    - slug: apworld-u01-w03-q16
      type: true_false
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Magna Carta (1215) granted equal legal rights to all people in England, including serfs.
      answer: false
      explanation: |
        False. The charter protected "freemen", meaning men of property, and was forced on the king by barons defending their own interests. Serfs, the majority, gained nothing directly; the principle that the king is under law was later extended by others.

