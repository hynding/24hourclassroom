week: 3
unit: 1
title: "Africa and Europe, c. 1200–1450"
topics: ["1.5", "1.6"]
guide: guides/week-03.md
guide_description: |
  State-building in Africa (Mali and the gold-salt trade, Mansa Musa and Timbuktu, the Swahili city-states, Great
  Zimbabwe, Christian Ethiopia, the Hausa kingdoms) and Europe (Christianity, Judaism and Islam; feudalism and
  manorialism; the growth of monarchies and the decline of serfdom; Magna Carta). Worked examples on comparing
  religion's role in two regions and on causation for the rise of European kings.
flashcards_description: |
  28 cards on African states and the trade routes that built them, and on European belief, feudalism, manorialism
  and the growth of monarchies before 1450.

flashcards:
  - front: Sahel → why empires formed there
    back: |
      The savanna belt south of the Sahara where gold from the southern forests met salt from desert mines. Whoever taxed and protected that exchange, first Ghana, then Mali, then Songhai, grew rich and powerful.
    topic_code: "1.5"
  - front: Mali Empire (c. 1230–1600s) → founder, wealth, religion
    back: |
      Founded by Sundiata around 1230; grew rich taxing the trans-Saharan gold and salt trade; its rulers (mansas) were Muslim, which linked them to North African merchants and scholars while most villagers kept local religions.
    topic_code: "1.5"
  - front: Mansa Musa's pilgrimage (1324) → what it showed
    back: |
      The ruler of Mali travelled to Mecca with so much gold that prices in Cairo fell. It advertised Mali's wealth across the Islamic world and brought back scholars and architects who built mosques in Timbuktu.
    topic_code: "1.5"
  - front: Timbuktu → role under Mali
    back: |
      A Niger-bend trading city that became a centre of Islamic learning, with mosques, scholars and a trade in manuscripts. Evidence that Islam in West Africa produced scholarship, not only conversion.
    topic_code: "1.5"
  - front: Ibn Battuta in Mali (1352–1353) → what he praised and what he criticised
    back: |
      He praised the safety of the roads, devotion to prayer and hatred of injustice; as a Moroccan jurist he disapproved of women's freedom of movement and of customs that blended Islam with older practice. Useful but shaped by his own standards.
    topic_code: "1.5"
  - front: Swahili city-states → examples and economic base
    back: |
      Kilwa, Mombasa, Mogadishu, Zanzibar: independent Muslim trading towns on the East African coast selling gold, ivory and enslaved people to Indian Ocean merchants and buying cloth, porcelain and glass. Sea-based states, not a single kingdom.
    topic_code: "1.5"
  - front: Swahili language and culture → what blended
    back: |
      A Bantu language with many Arabic loanwords, spoken by a coastal society that mixed African and Arab, Persian and Indian elements through trade and intermarriage. Coral-stone mosques express the same blend.
    topic_code: "1.5"
  - front: Kilwa → why it stood out
    back: |
      The southernmost major Swahili town, which controlled the gold trade from the Zimbabwe plateau through Sofala. Travellers called it one of the most beautiful cities they had seen.
    topic_code: "1.5"
  - front: Great Zimbabwe (c. 1200–1450) → what and why it mattered
    back: |
      Stone-walled capital of a Shona kingdom in the interior, supported by cattle, gold mining and trade with the coast. It shows a large African state far from any Muslim or Christian influence; it declined around 1450.
    topic_code: "1.5"
  - front: Ethiopia under the Solomonic dynasty (from 1270) → religion and claim to rule
    back: |
      A Christian highland kingdom, Christian since the 300s, whose kings claimed descent from Solomon and the Queen of Sheba. Rock-cut churches at Lalibela and Red Sea trade; an African state built on Christianity.
    topic_code: "1.5"
  - front: Hausa kingdoms → examples and character
    back: |
      Kano, Katsina and other city-states of the central savanna living by farming, cloth and leather crafts and trans-Saharan trade. Independent of each other; their rulers adopted Islam gradually in the 1300s and 1400s.
    topic_code: "1.5"
  - front: Role of Islam in African state-building → three benefits to rulers
    back: |
      Literate officials and legal experts; trading partners and credit among Muslim merchants; a universal creed that raised a ruler above local chiefs. In most states Islam was the faith of the court and towns above a countryside of local religions.
    topic_code: "1.5"
  - front: Catholic Church in Europe c. 1200 → why it was the one continent-wide institution
    back: |
      It ran parishes, monasteries and universities, crowned kings, judged wills and marriages and taxed everyone, in a Europe where kings were weak. Its clerks staffed royal governments and its courts reached every village.
    topic_code: "1.6"
  - front: Scholasticism → what it did and where its sources came from
    back: |
      University philosophy (Aquinas and others) reconciling Christian theology with Aristotle, whose works arrived through Arabic translations and commentaries from Muslim Spain and Sicily. A direct intellectual debt to Dar al-Islam.
    topic_code: "1.6"
  - front: Jews in medieval Europe → status and treatment
    back: |
      Tolerated as moneylenders, merchants and scholars but barred from land and guilds and periodically attacked or expelled (England 1290, France 1306, Spain 1492). Religious difference shaped social position.
    topic_code: "1.6"
  - front: Feudalism → definition
    back: |
      The political arrangement in which lords granted land (fiefs) to vassals in return for military service and loyalty, creating a chain of personal obligations in place of a strong central state.
    topic_code: "1.6"
  - front: Manorialism → definition and relation to feudalism
    back: |
      The economic arrangement in which serfs worked a lord's estate (the manor) and their own plots in return for protection. Feudalism organised the warriors; manorialism organised the farmers who fed them.
    topic_code: "1.6"
  - front: Serf versus slave → the difference the exam wants
    back: |
      A serf was unfree, bound to the land and owing labour and dues, but could not be sold apart from the land and had customary rights; an enslaved person was property. Serfdom declined in western Europe after the Black Death.
    topic_code: "1.6"
  - front: Magna Carta (1215) → who, why, what it said
    back: |
      English barons forced King John to seal a charter promising no taxation without common counsel and no punishment of freemen except by law. It protected propertied men, not serfs, but established that the king is under law.
    topic_code: "1.6"
  - front: Why European monarchies grew stronger by 1450 → three causes
    back: |
      War (the Hundred Years' War) forced kings to build taxes and standing armies; royal courts and bureaucracies replaced feudal justice; assemblies granted taxes in return for consultation, which strengthened kings while limiting them.
    topic_code: "1.6"
  - front: Hundred Years' War (1337–1453) → effect on states
    back: |
      Fought between England and France over the French crown; it produced national taxes, professional armies and a sharper sense of English and French identity, strengthening both monarchies.
    topic_code: "1.6"
  - front: Decline of serfdom in western Europe → causes
    back: |
      Growing towns and money rents loosened ties before 1348; the Black Death then made labour scarce and let peasants bargain or flee. In eastern Europe, by contrast, lords tightened serfdom.
    topic_code: "1.6"
  - front: Medieval universities → when and why they mattered
    back: |
      Paris, Bologna and Oxford grew in the 1100s and 1200s under Church sponsorship, training lawyers, physicians and theologians. They supplied the literate officials that growing monarchies and the Church both needed.
    topic_code: "1.6"
  - front: Crusades (1095–1291) → significance for the period after 1200
    back: |
      Religious wars against Muslims in the Holy Land and Iberia; by 1200 their main effects were trade links with the eastern Mediterranean, Italian merchant wealth and a habit of religious violence that later turned on Jews and heretics.
    topic_code: "1.6"
  - front: Italian merchant republics (Venice, Genoa) → role in Europe c. 1200–1450
    back: |
      Self-governing trading cities that linked Europe to Mediterranean and Black Sea trade, including the Silk Roads' western ends. Their wealth and banking foreshadow the Renaissance and overseas exploration.
    topic_code: "1.6"
  - front: Compare the Swahili city-states with the Italian city-states
    back: |
      Both were independent trading cities on a sea, enriched by long-distance commerce and run by merchant elites; the Swahili towns were Muslim and tied to the Indian Ocean monsoon trade, the Italian ones Christian and tied to the Mediterranean and Black Sea.
    topic_code: "1.5"
  - front: Compare Mali's mansas with European kings c. 1300
    back: |
      Both used a universal religion for legitimacy and literate officials; Mali's ruler controlled trade routes and governed provinces through governors and cavalry, while European kings were still bargaining with feudal lords and the Church for taxes and soldiers.
    topic_code: "1.6"
  - front: Which theme? Gold, salt and the location of Mali
    back: |
      Economic Systems (ECN) and Humans and the Environment (ENV): the geography of scarce resources and desert routes explains where the state formed, and Governance (GOV) explains how it taxed and protected the trade.
    topic_code: "1.5"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 1.5 and 1.6: Africa and Europe), with about a third
    reviewing weeks 1 and 2. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set A: Magna Carta (1.6)
    - slug: apworld-u01-w03-q01
      type: multiple_choice
      topic_code: "1.6"
      source: "Primary source: Magna Carta (1215), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "No scutage not aid shall be imposed on our kingdom, unless by common counsel of our kingdom, except for ransoming our person, for making our eldest son a knight, and for once marrying our eldest daughter; and for these there shall not be levied more than a reasonable aid. ... No freemen shall be taken or imprisoned or disseised or exiled or in any way destroyed, nor will we go upon him nor send upon him, except by the lawful judgment of his peers or by the law of the land."

        — Magna Carta, clauses 12 and 39, sealed by King John of England under pressure from rebellious barons, 1215 (Avalon Project text; "scutage" and "aid" were feudal payments)
      prompt: |
        The excerpt most directly reflects which feature of European political life in the early 1200s?
      options:
        - "The absolute authority of kings over all their subjects"
        - "The power of feudal lords to limit a king who depended on their payments and service"
        - "The Church's control over royal taxation"
        - "The equality of serfs and nobles before the law"
      option_explanations:
        - |
          The charter exists because the king's authority was not absolute; the barons had just forced him to accept limits.
        - |
          Correct. Feudal payments ("scutage", "aid") required the lords' consent, and the barons used their leverage to bind the king.
        - |
          The Church is not mentioned in these clauses; the counsel in question is that of the kingdom's great men.
        - |
          "Freemen" excluded serfs, who were the majority; the charter protected the propertied.
      answer: 1
      explanation: |
        Skill: reading a source in its context. Magna Carta is evidence of feudal decentralisation, not democracy.

    - slug: apworld-u01-w03-q02
      type: multiple_choice
      topic_code: "1.6"
      source: "Primary source: Magna Carta (1215), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "No scutage not aid shall be imposed on our kingdom, unless by common counsel of our kingdom, except for ransoming our person, for making our eldest son a knight, and for once marrying our eldest daughter; and for these there shall not be levied more than a reasonable aid. ... No freemen shall be taken or imprisoned or disseised or exiled or in any way destroyed, nor will we go upon him nor send upon him, except by the lawful judgment of his peers or by the law of the land."

        — Magna Carta, clauses 12 and 39, sealed by King John of England under pressure from rebellious barons, 1215 (Avalon Project text; "scutage" and "aid" were feudal payments)
      prompt: |
        Which later development in Europe before 1450 is most directly connected to the principle in the first sentence of the excerpt?
      options:
        - "The growth of representative assemblies such as Parliament that granted taxes to kings"
        - "The expulsion of Jews from England in 1290"
        - "The founding of the University of Paris"
        - "The spread of the Black Death"
      option_explanations:
        - |
          Correct. The need for "common counsel" before taxation grew into assemblies of lords, clergy and towns that kings summoned to approve taxes, especially during the Hundred Years' War.
        - |
          The expulsion was a religious and financial measure unconnected to consent for taxation.
        - |
          Universities grew from Church schools; they are not a development of the consent principle.
        - |
          The plague was a biological event, not a political consequence of the charter.
      answer: 0
      explanation: |
        Skill: continuity and change. Trace the principle of consent forward.

    - slug: apworld-u01-w03-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "Primary source: Magna Carta (1215), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "No scutage not aid shall be imposed on our kingdom, unless by common counsel of our kingdom, except for ransoming our person, for making our eldest son a knight, and for once marrying our eldest daughter; and for these there shall not be levied more than a reasonable aid. ... No freemen shall be taken or imprisoned or disseised or exiled or in any way destroyed, nor will we go upon him nor send upon him, except by the lawful judgment of his peers or by the law of the land."

        — Magna Carta, clauses 12 and 39, sealed by King John of England under pressure from rebellious barons, 1215 (Avalon Project text; "scutage" and "aid" were feudal payments)
      prompt: |
        A historian comparing this document with the government of Song China (week 1) would most likely note which contrast?
      options:
        - "Song China also had charters limiting the emperor through baronial consent"
        - "Song China was governed by a centralised examination bureaucracy, whereas England's king negotiated with armed landholders"
        - "England had a larger professional bureaucracy than Song China"
        - "Both states collected taxes only with the consent of merchants"
      option_explanations:
        - |
          No such charters existed in China; the emperor's authority was checked by Confucian norms and officials, not by armed nobles.
        - |
          Correct. The Song ruled through salaried examination graduates; England's king depended on feudal lords whose consent the charter demanded.
        - |
          England's royal administration was tiny beside the Song bureaucracy.
        - |
          Neither state depended on merchant consent; the charter concerns feudal lords, and Song taxes were set by the state.
      answer: 1
      explanation: |
        Skill: comparison with week 1, the contrast between feudal and bureaucratic government.

    # ---- Stimulus set B: a described map of African trade routes (1.5)
    - slug: apworld-u01-w03-q04
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Map description: A map of Africa about 1350. Across the Sahara, dotted caravan routes run from Morocco and Tunis south to the Niger bend, passing salt mines marked at Taghaza; the Mali Empire is shaded across the Sahel with Timbuktu, Gao and the gold fields of the southern forests labelled. On the east coast, Mogadishu, Mombasa, Kilwa and Sofala are marked as ports, with arrows showing seasonal monsoon winds blowing toward India and Arabia for half the year and back for the other half. Inland from Sofala, Great Zimbabwe is marked beside gold fields. In the northeast highlands, Ethiopia is labelled with a cross; the Red Sea route to Arabia is drawn beside it.
      prompt: |
        Which conclusion about African state-building is best supported by the map?
      options:
        - "African states formed where trade routes met valuable resources such as gold and salt"
        - "African states were created by Arab conquest of the interior"
        - "All African states adopted Islam by 1350"
        - "Africa's trade was confined to the Mediterranean coast"
      option_explanations:
        - |
          Correct. Mali sits between salt mines and gold fields; Great Zimbabwe sits on gold fields with a route to the coast; the Swahili ports sit on the monsoon routes.
        - |
          The map shows trade routes, not armies; Mali and Great Zimbabwe were African states, and Kilwa was ruled by African Muslims.
        - |
          Ethiopia is marked with a cross as a Christian kingdom; Great Zimbabwe followed local religion.
        - |
          The map shows Indian Ocean and Red Sea routes as well as trans-Saharan ones.
      answer: 0
      explanation: |
        Skill: analysing a described map. Look for the pattern linking resources, routes and states.

    - slug: apworld-u01-w03-q05
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Map description: A map of Africa about 1350. Across the Sahara, dotted caravan routes run from Morocco and Tunis south to the Niger bend, passing salt mines marked at Taghaza; the Mali Empire is shaded across the Sahel with Timbuktu, Gao and the gold fields of the southern forests labelled. On the east coast, Mogadishu, Mombasa, Kilwa and Sofala are marked as ports, with arrows showing seasonal monsoon winds blowing toward India and Arabia for half the year and back for the other half. Inland from Sofala, Great Zimbabwe is marked beside gold fields. In the northeast highlands, Ethiopia is labelled with a cross; the Red Sea route to Arabia is drawn beside it.
      prompt: |
        The monsoon arrows on the map best explain which feature of the East African coast?
      options:
        - "The isolation of the Swahili towns from the wider world"
        - "The conquest of the coast by the Mali Empire"
        - "The absence of Islam on the coast before 1500"
        - "The rise of independent port cities whose merchants traded with Arabia, Persia and India on a seasonal rhythm"
      option_explanations:
        - |
          The monsoon connected the coast to the Indian Ocean world rather than isolating it.
        - |
          Mali lay across the continent in the Sahel and never reached the Indian Ocean.
        - |
          Islam had been adopted by coastal elites by the 1100s–1200s, carried by the very traders the monsoon brought.
        - |
          Correct. Predictable winds let ships sail to Asia and return each year, making Kilwa, Mombasa and Mogadishu trading cities with Muslim merchant elites.
      answer: 3
      explanation: |
        Skill: connecting environment to economy and state form (sea-based states).

    - slug: apworld-u01-w03-q06
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Map description: A map of Africa about 1350. Across the Sahara, dotted caravan routes run from Morocco and Tunis south to the Niger bend, passing salt mines marked at Taghaza; the Mali Empire is shaded across the Sahel with Timbuktu, Gao and the gold fields of the southern forests labelled. On the east coast, Mogadishu, Mombasa, Kilwa and Sofala are marked as ports, with arrows showing seasonal monsoon winds blowing toward India and Arabia for half the year and back for the other half. Inland from Sofala, Great Zimbabwe is marked beside gold fields. In the northeast highlands, Ethiopia is labelled with a cross; the Red Sea route to Arabia is drawn beside it.
      prompt: |
        The cross marking Ethiopia on the map is a reminder that
      options:
        - "Ethiopia was converted by Portuguese missionaries after 1500"
        - "Ethiopia was a Muslim sultanate allied with Mali"
        - "Christianity in Ethiopia predated Islam and gave its Solomonic kings a distinct basis for rule"
        - "Ethiopia had no contact with the Red Sea trade"
      option_explanations:
        - |
          Ethiopia had been Christian since the 300s, more than a thousand years before the Portuguese arrived.
        - |
          Ethiopia was Christian and lay on the opposite side of the continent from Mali.
        - |
          Correct. The Solomonic dynasty (from 1270) claimed descent from Solomon and ruled a Christian kingdom with rock-cut churches at Lalibela.
        - |
          The map draws the Red Sea route beside Ethiopia; the kingdom traded through it.
      answer: 2
      explanation: |
        Skill: recognising religious diversity in African state-building.

    # ---- Stand-alone, this week and review
    - slug: apworld-u01-w03-q07
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Mansa Musa's pilgrimage to Mecca in 1324 is most significant to historians because it
      options:
        - "marked the conversion of the Mali Empire's rulers to Islam for the first time"
        - "ended the trans-Saharan gold trade"
        - "led to the Mongol invasion of West Africa"
        - "demonstrated Mali's wealth and its integration into the Islamic world of trade and scholarship"
      option_explanations:
        - |
          Mali's rulers had been Muslim since the empire's founding; Musa's hajj displayed an existing faith.
        - |
          The gold trade continued for centuries; the pilgrimage advertised it.
        - |
          The Mongols never reached West Africa; they had been stopped at Ain Jalut in 1260.
        - |
          Correct. The gold he distributed, the scholars and architects he brought home, and the reports that reached Cairo and Europe all show Mali as a major Islamic state.
      answer: 3
      explanation: |
        Mansa Musa is the CED's reference point for Mali's wealth and Islamic connections.

    - slug: apworld-u01-w03-q08
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best describes the relationship between feudalism and manorialism in medieval Europe?
      options:
        - "Feudalism organised the economy of the manor; manorialism organised the loyalty of knights"
        - "Both were systems invented by the Church to collect tithes"
        - "Feudalism organised political and military obligations between lords and vassals; manorialism organised the labour of serfs on estates"
        - "Both ended with Magna Carta in 1215"
      option_explanations:
        - |
          This reverses the two: feudalism concerned warriors and land grants, manorialism concerned farming.
        - |
          The Church collected tithes, but feudalism and manorialism were arrangements among lay lords and peasants.
        - |
          Correct. Fiefs for service bound the warrior class; the manor bound serfs to a lord's land in return for protection.
        - |
          Magna Carta limited the king; feudal and manorial arrangements continued for centuries after it.
      answer: 2
      explanation: |
        The CED pairs feudalism (political) with manorialism (economic) as the structures of European society.

    - slug: apworld-u01-w03-q09
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains why serfdom declined in western Europe during the fourteenth and fifteenth centuries?
      options:
        - "Population loss after the Black Death made labour scarce, giving peasants leverage to demand wages or freedom"
        - "Kings abolished it by decree in 1215"
        - "The Church declared serfdom a sin"
        - "Serfs were replaced by enslaved Africans"
      option_explanations:
        - |
          Correct. With a third or more of the population dead, lords competed for workers; money rents and flight to towns replaced labour services.
        - |
          No decree ended serfdom; Magna Carta did not even apply to serfs.
        - |
          The Church owned serfs on its own manors and did not condemn the institution.
        - |
          African slavery developed in Atlantic colonies after 1450, not on European manors.
      answer: 0
      explanation: |
        Skill: causation linking demography (the plague) to social structure.

    - slug: apworld-u01-w03-q10
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Swahili city-states of East Africa most closely resemble which Southeast Asian states studied in week 2?
      options:
        - "The Khmer Empire, a land-based rice state"
        - "The Sinhala kingdoms of Sri Lanka"
        - "Sea-based trading states such as Srivijaya and Malacca"
        - "The Rajput kingdoms of northwestern India"
      option_explanations:
        - |
          Angkor lived by irrigated rice far from the sea; the Swahili towns lived by maritime trade.
        - |
          Sri Lanka's kingdoms were Buddhist and agricultural; the comparison does not hold.
        - |
          Correct. Like Srivijaya and Malacca, the Swahili towns were port cities enriched by taxing and supplying long-distance sea trade, with Muslim merchant elites.
        - |
          The Rajputs were inland Hindu warrior kingdoms in India, not Southeast Asia.
      answer: 2
      explanation: |
        Spiral review of 1.3 applied to 1.5.

    - slug: apworld-u01-w03-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Scholastic philosophers such as Thomas Aquinas were able to study Aristotle in depth chiefly because
      options:
        - "the Mongols brought Greek manuscripts from China"
        - "Byzantium banned Aristotle, pushing his works west"
        - "Viking traders carried Greek texts from Scandinavia"
        - "Muslim scholars had translated and commented on Aristotle, and those works reached Europe through Spain and Sicily"
      option_explanations:
        - |
          Greek manuscripts were never in China, and the Mongols took no interest in Aristotle.
        - |
          Byzantium preserved Greek texts but did not ban Aristotle; the main route west ran through Arabic.
        - |
          Scandinavia had no Greek philosophical texts to carry.
        - |
          Correct. Arabic translations and the commentaries of Muslim thinkers reached Latin Europe through contact zones in Iberia and Sicily.
      answer: 3
      explanation: |
        Spiral review of 1.2: the transfer of learning from Dar al-Islam to Europe.

    - slug: apworld-u01-w03-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Great Zimbabwe and the Inca Empire were alike in that both
      options:
        - "were Muslim states on the Indian Ocean"
        - "built monumental stone architecture and ran large economies without a writing system"
        - "depended on paper money issued by a central mint"
        - "were conquered by the Mongols"
      option_explanations:
        - |
          Neither was Muslim or on the Indian Ocean; Great Zimbabwe traded to the coast through intermediaries.
        - |
          Correct. Great Zimbabwe's dry-stone walls and Cusco's masonry were built by societies without writing; the Inca used quipu, the Shona oral records.
        - |
          Neither used paper money; the Inca had no money at all.
        - |
          The Mongols reached neither Africa south of Egypt nor the Americas.
      answer: 1
      explanation: |
        Spiral review of 1.4 through comparison with 1.5.

    - slug: apworld-u01-w03-q22
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following best describes the tributary system of Song China?
      options:
        - "A military alliance in which China paid its neighbours for protection"
        - "A diplomatic order in which neighbouring rulers sent gifts and ritual submission and received recognition and trade"
        - "A system of tax collection within Chinese provinces"
        - "The Mongol method of ruling conquered Chinese cities"
      option_explanations:
        - |
          The Song sometimes paid northern neighbours, but the tributary system ran the other way: neighbours acknowledged China.
        - |
          Correct. Korea, Vietnam and others sent missions and gifts to the emperor and gained legitimacy and access to Chinese markets.
        - |
          Tribute here concerns foreign rulers, not domestic taxation.
        - |
          The Mongols conquered the Song in 1279; the tributary system was a Chinese institution older than that.
      answer: 1
      explanation: |
        Spiral review of 1.1.

    - slug: apworld-u01-w03-q23
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which best explains why the Sultanate of Malacca became the leading port of Southeast Asia after c. 1400?
      options:
        - "It conquered Java and Sumatra by force"
        - "The Khmer moved their capital there"
        - "It banned foreign traders"
        - "Its ruler's conversion to Islam and its position on the strait drew Muslim merchants from India, Arabia and China"
      option_explanations:
        - |
          Malacca was a small port state; its power was commercial, not territorial.
        - |
          The Khmer were a land-based state in Cambodia and never moved to the Malay peninsula.
        - |
          Malacca welcomed foreign merchants; that openness was the source of its wealth.
