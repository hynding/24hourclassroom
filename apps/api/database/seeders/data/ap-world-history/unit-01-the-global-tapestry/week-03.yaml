    # ---- Short answers (SAQ style)
    - slug: apworld-u01-w03-q19
      type: short_answer
      topic_code: "1.5"
      source: "general knowledge; Ibn Battuta's account of Mali (1352–1353) is described, not quoted"
      points: 3
      stimulus: |
        Ibn Battuta, a Moroccan jurist, crossed the Sahara to Mali in 1352 and later dictated an account of it. He reported that travellers could cross the empire without fear of robbers, that people were punctual in prayer and memorised the Quran, and that the sultan punished injustice severely. He also complained that women went about unveiled and mixed freely with men, that some customs seemed to him un-Islamic, and that the sultan's gift to him was disappointingly small.
      prompt: |
        Using the passage, answer (a), (b) and (c).

        (a) Identify ONE feature of the Mali Empire's government or society shown in the passage.
        (b) Explain ONE way Ibn Battuta's background shaped his judgments.
        (c) Explain ONE way that trade contributed to the development of states such as Mali.
      answer: |
        (a) Mali maintained order and safe roads across a large territory, and its court and towns practised Islam seriously (prayer, Quran study, Islamic justice).
        (b) As a jurist trained in Moroccan Islamic law, he measured Mali against North African norms, so he praised legal order and piety but disapproved of women's freedom and local customs; as a courtier used to lavish gifts, he judged the sultan by his generosity.
        (c) Control of the trans-Saharan gold and salt trade gave Mali's rulers revenue from taxes and tolls to pay soldiers and officials, and the Muslim merchants who ran the trade brought Islam, literacy and connections to North Africa that strengthened the state.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific feature from the passage: safe roads and public order; strict justice; Islamic observance; women's freedom; customs blending Islam with local practice. Zero for features not in the passage (e.g. Timbuktu's library).

        (b) 1 pt: links his background (jurist, Moroccan, Muslim, courtier) to a specific judgment. Zero for "he was biased" with no connection.

        (c) 1 pt: a mechanism connecting trade to state power: revenue; merchant networks; Islam and literacy; cavalry paid from trade. Zero for "trade made them rich" without explaining how that built the state.

    - slug: apworld-u01-w03-q20
      type: short_answer
      topic_code: "1.6"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Describe ONE way the Catholic Church shaped political life in Europe between c. 1200 and c. 1450.
        (b) Explain ONE cause of the growth of royal power in England or France by 1450.
        (c) Explain ONE similarity between the way religion supported rulers in Europe and in an African state of the same period.
      answer: |
        (a) The Church crowned and legitimised kings, supplied the clerks who staffed royal governments, and ran its own courts and taxes; popes could excommunicate rulers and sanction wars such as the crusades.
        (b) The Hundred Years' War forced kings to raise regular taxes and professional armies, which required royal bureaucracies and bargaining with assemblies; this built the machinery of the state and reduced dependence on feudal levies.
        (c) In both Europe and Mali, a universal religion gave rulers legitimacy beyond local loyalties and provided literate officials: European kings were anointed by the Church and governed with clergy, while Mali's mansas used Islam to connect with North African scholars and merchants and to present themselves as righteous rulers.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific political role of the Church: coronation and legitimacy; clerical administrators; Church courts; excommunication; crusades; universities. Zero for a purely religious role with no political effect.

        (b) 1 pt: a cause with mechanism: war and taxation; royal courts replacing feudal justice; assemblies; professional armies. Zero for "kings got stronger because they wanted to".

        (c) 1 pt: an accurate similarity with a named African state (Mali, Ethiopia, Swahili towns): legitimacy, literate officials, connections to a wider religious world. Zero for a comparison with Asia.

    # ---- Long essay (LEQ style)
    - slug: apworld-u01-w03-q21
      type: long_answer
      topic_code: "1.5"
      source: "general knowledge"
      points: 6
      prompt: |
        Develop an argument that evaluates the extent to which trade shaped the development of states in Africa in the period c. 1200 to c. 1450.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Trade was the principal force behind African state-building in this period, creating Mali, the Swahili city-states and Great Zimbabwe where routes met resources, but religion and local political traditions determined the form those states took, as Ethiopia's Christian monarchy and the stateless societies beyond the routes show.

        Context: Africa's regions were linked to Dar al-Islam by the trans-Saharan and Indian Ocean routes; camel caravans and monsoon shipping had grown since the 700s; Islam had spread along both.

        Body 1 (trade as cause): Mali's wealth from taxing gold and salt; Mansa Musa's 1324 hajj; Timbuktu's scholars drawn by gold; Swahili ports built on monsoon trade in gold, ivory and cloth; Great Zimbabwe supplying gold to Kilwa.

        Body 2 (religion and politics shaping form): Mali's rulers used Islam for legitimacy and officials while villages kept local religion; Swahili elites blended African and Arab culture; Ethiopia built a Christian monarchy on highland agriculture and Red Sea trade; Hausa cities stayed independent.

        Body 3 (limits): trade explains where wealth gathered, not every state (Ethiopia) or the form of rule (empire versus city-state); decline of Great Zimbabwe and Mali shows that states also depended on land and succession.

        Conclusion: trade was the engine; religion and local tradition were the steering.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim evaluating the extent of trade's role with a line of reasoning. Zero for "trade was important to African states" without evaluation.

        Contextualization (0–1): relevant broader context: trans-Saharan and Indian Ocean networks; the spread of Islam; the camel and the monsoon; Dar al-Islam's demand for gold. Must be developed.

        Evidence (0–2): 1 pt for two or more specific examples (Mali, Sundiata, Mansa Musa, Timbuktu, Taghaza salt, Kilwa, Mombasa, Swahili language, Great Zimbabwe, Sofala, Ethiopia and Lalibela, Hausa cities). 2 pts when the evidence supports the argument about trade's role.

        Analysis and reasoning (0–2): 1 pt for sustained causation (or comparison between states). 1 pt for complexity: weighing trade against religion and environment; explaining differences between empire and city-state forms; noting decline; corroborating across regions.

        Common errors: treating Africa as a single state; dating European contact before 1450; claiming Mali conquered the East African coast; ignoring Ethiopia as a non-Muslim case.
