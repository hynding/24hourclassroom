    # ---- Short answers (SAQ style)
    - slug: apworld-u01-w02-q19
      type: short_answer
      topic_code: "1.4"
      source: "general knowledge; Spanish accounts of Tenochtitlan (1519) are described, not quoted"
      points: 3
      stimulus: |
        Spanish soldiers who entered the Valley of Mexico with Cortés in 1519 later recalled their first sight of the lake cities: stone towers and temples rising from the water, a straight causeway wide enough for many horsemen, canoes crowding the canals, and a market square at Tlatelolco where, they estimated, more than sixty thousand people bought and sold gold, silver, feathers, slaves, cloth, cacao and food under the supervision of judges who settled disputes on the spot. Several wrote that nothing in Spain or Italy had prepared them for it.
      prompt: |
        Using the passage, answer (a), (b) and (c).

        (a) Identify ONE feature of the Mexica state or economy that the Spanish descriptions reveal.
        (b) Explain ONE way the historical situation of the Spanish writers might have shaped their accounts.
        (c) Explain ONE difference between the Mexica state and the Inca state in how they organised economic life.
      answer: |
        (a) A large market economy with specialised goods, merchants and officials regulating trade, supported by tribute and by canoe transport on the lakes; or a dense urban population and monumental religious architecture.
        (b) The soldiers wrote years after the conquest, often to justify their deeds or claim rewards, so emphasising the size and wealth of what they had overcome magnified their achievement; their comparisons to Spain and Italy also show they described Mexico through European reference points.
        (c) The Mexica ran a market and tribute economy in which goods such as cacao served as money and merchants traded widely, whereas the Inca state collected labour through the mit'a and redistributed food and cloth from storehouses, with little market exchange.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific feature drawn from the passage: large markets; regulated trade (judges); tribute goods; urban scale; canoe transport; temples. Zero for a feature not in the passage (e.g. roads across the Andes).

        (b) 1 pt: links the writers' situation (conquerors writing afterwards; seeking reward or justification; European frame of reference) to emphasis or exaggeration. Zero for "they were biased" with no mechanism.

        (c) 1 pt: an accurate contrast: market and tribute (Mexica) versus labour and storehouses (Inca); cacao as money versus no money; subject rulers left in place versus direct administration. Zero for reversing the two.

    - slug: apworld-u01-w02-q20
      type: short_answer
      topic_code: "1.3"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE way the Bhakti movement challenged existing social or religious hierarchies in South Asia.
        (b) Explain ONE similarity between the Bhakti movement and Sufism.
        (c) Explain ONE way that religion shaped state-building in Southeast Asia in the period c. 1200 to c. 1450.
      answer: |
        (a) Bhakti taught that devotion to a chosen god, not Brahmin-led ritual or caste status, brought salvation, and its poets wrote in local languages so that women and low-caste people could take part.
        (b) Both stressed a direct, emotional relationship with God, often through song and poetry, and both bypassed religious elites (Brahmins, legal scholars); teachers such as Kabir drew on both traditions.
        (c) Sea-based states such as Malacca adopted Islam to attract Muslim merchants and gain legitimacy within the Indian Ocean trading world; or the Khmer kings used Hindu and then Buddhist temple-building, such as Angkor Wat, to express divine kingship and organise labour.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific challenge: downplaying caste; bypassing Brahmins; vernacular languages; women poets. Zero for "it was popular".

        (b) 1 pt: a specific shared feature: personal devotion; mysticism; music and poetry; openness to the poor; mutual borrowing (Kabir). Zero for a difference.

        (c) 1 pt: a specific link between religion and state power in Southeast Asia: Malacca's conversion and trade; Majapahit's Hindu-Buddhist kingship; Angkor Wat and the Khmer; Theravada Buddhism in Sri Lanka. Zero for examples outside Southeast Asia.

    # ---- Long essay (LEQ style)
    - slug: apworld-u01-w02-q21
      type: long_answer
      topic_code: "1.4"
      source: "general knowledge"
      points: 6
      prompt: |
        Develop an argument that evaluates the extent to which the Mexica (Aztec) and Inca empires used similar methods to build and maintain their states in the period c. 1200 to c. 1450.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (comparison, causation, or continuity and change).
      answer: |
        Thesis: Both empires relied on conquest, a divine ruler and religion to legitimise power, but they maintained control in very different ways: the Aztecs through tribute extracted from subject city-states that kept their rulers, the Inca through direct administration, resettlement and labour service, differences rooted in the market economy of Mesoamerica and the storehouse economy of the Andes.

        Context: Both built on older civilisations (Toltec and Maya in Mesoamerica; Wari, Tiwanaku and Chimú in the Andes), in a hemisphere without draft animals, iron or contact with Afro-Eurasia.

        Body 1 (similarities): military expansion from a core city (Tenochtitlan from 1428; Cusco from c. 1438); rulers tied to the sun god; religion justifying war and labour; environmental engineering (chinampas; terraces and irrigation).

        Body 2 (differences in control): Aztec tribute lists, subject rulers left in place, pochteca markets, cacao as money; Inca mit'a, roads, storehouses, quipu, resettlement, Quechua, royal mummies driving conquest.

        Body 3 (explanation): Mesoamerica had dense markets and many city-states, so a tribute web worked; the Andes had vertical ecology and little market exchange, so the state itself organised production and redistribution.

        Conclusion: similar in purpose and legitimacy, different in method; the Aztec method left resentful subjects, the Inca method left a dependent population, and both weaknesses showed after 1519.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim evaluating the extent of similarity with a line of reasoning (e.g. similar aims and legitimacy, different mechanisms of control). Zero for listing similarities and differences without evaluation.

        Contextualization (0–1): relevant broader context: earlier Mesoamerican and Andean states; the hemisphere's isolation and lack of draft animals and iron; comparison with state-building elsewhere in the period. Must be more than a phrase.

        Evidence (0–2): 1 pt for two or more specific examples (Triple Alliance 1428, tribute lists, chinampas, pochteca, human sacrifice, calpulli; Pachacuti, mit'a, roads, quipu, storehouses, ayllu, royal mummies, Quechua). 2 pts when the evidence is used to support the comparison.

        Analysis and reasoning (0–2): 1 pt for a sustained comparison. 1 pt for complexity: explaining why the methods differed (economy, geography), weighing similarities against differences, or showing consequences of each method (tributary resentment, Inca succession wars).

        Common errors: giving the Inca markets and coins; giving the Aztecs direct provincial administration; writing about the Spanish conquest instead of state-building before 1450.
