    # ---- True / false
    - slug: apworld-u01-w02-q15
      type: true_false
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The Vijayanagara Empire was a Muslim state founded by the Delhi sultans to govern southern India.
      answer: false
      explanation: |
        False. Vijayanagara (founded 1336) was a Hindu kingdom. Its founders had served the Delhi Sultanate and briefly converted to Islam, but they returned to Hinduism and built a southern state that resisted the sultanate's expansion.

    - slug: apworld-u01-w02-q16
      type: true_false
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Tenochtitlan was built on an island in a lake and fed partly by chinampas, raised fields constructed in the shallow water.
      answer: true
      explanation: |
        True. The Mexica founded Tenochtitlan in Lake Texcoco in 1325; chinampas, causeways and an aqueduct were the environmental adaptations that allowed one of the world's largest cities to grow there.

