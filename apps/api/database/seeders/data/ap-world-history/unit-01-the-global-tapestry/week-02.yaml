week: 2
unit: 1
title: "South and Southeast Asia, and the Americas, c. 1200–1450"
topics: ["1.3", "1.4"]
guide: guides/week-02.md
guide_description: |
  Hinduism, Islam and Buddhism in South Asia (the Bhakti movement, Sufism, the Delhi Sultanate and Vijayanagara),
  sea-based and land-based states in Southeast Asia (Srivijaya, Majapahit, Malacca, the Khmer), and state-building in
  the Americas: the Mexica tribute empire and Tenochtitlan, the Inca mit'a, roads and quipu, the Maya, Cahokia and
  Chaco Canyon. Worked examples on comparison with a reason and on causation for religious change.
flashcards_description: |
  28 cards on South and Southeast Asian states and religions and on the Aztec, Inca, Maya and North American
  societies, with the comparisons the exam asks for.

flashcards:
  - front: Bhakti movement → core teaching and who it reached
    back: |
      Hindu devotion to a personal god (Shiva, Vishnu, Krishna) as the path to salvation, expressed in local languages rather than Sanskrit. It reached women and lower castes and downplayed Brahmin ritual, challenging the caste hierarchy from within Hinduism.
    topic_code: "1.3"
  - front: Kabir → why he is a useful example
    back: |
      A fifteenth-century weaver-poet of northern India who mocked both Brahmin ritual and Muslim legalism and taught devotion to one God. He shows Bhakti and Sufi ideas meeting and ordinary people shaping religion.
    topic_code: "1.3"
  - front: Vijayanagara Empire (1336–1565) → origin and significance
    back: |
      A Hindu kingdom of southern India founded by two brothers who had served the Delhi Sultanate, converted to Islam and returned to Hinduism. It blocked Muslim expansion southward and ran a huge trading capital.
    topic_code: "1.3"
  - front: Rajput kingdoms → where and what
    back: |
      Hindu warrior clans ruling small kingdoms in northwestern India, often fighting the Delhi sultans and sometimes allying with them. They show that the Delhi Sultanate never fully controlled the subcontinent.
    topic_code: "1.3"
  - front: Buddhism in South Asia by 1450 → its condition
    back: |
      Nearly vanished from India, where its monasteries had been destroyed or absorbed into Hinduism, but thriving in Sri Lanka (Theravada) and Southeast Asia. A reminder that a religion's homeland is not always its centre.
    topic_code: "1.3"
  - front: How Islam gained converts in South Asia → three routes
    back: |
      Through Sufi teachers who accommodated local practice; through the advantages of belonging to the ruling faith under the Delhi Sultanate; and among groups low in the caste order. Conversion was slow and India stayed majority Hindu.
    topic_code: "1.3"
  - front: Sea-based versus land-based states in Southeast Asia → the distinction
    back: |
      Sea-based states (Srivijaya, Majapahit, Malacca) lived by taxing and supplying trade through the straits; land-based states (Khmer, Sinhala Sri Lanka) lived by irrigated rice. The sea states adopted Islam first because they wanted Muslim merchants.
    topic_code: "1.3"
  - front: Srivijaya → type of state, religion, fate
    back: |
      A Buddhist sea-based kingdom on Sumatra that taxed ships passing the Strait of Malacca and hosted Buddhist scholars. It declined in the 1300s as rivals, including Majapahit, took its trade.
    topic_code: "1.3"
  - front: Majapahit (1293–c. 1500) → type of state and religion
    back: |
      A Hindu-Buddhist sea-based empire centred on Java that dominated the spice trade of the Indonesian islands at its height in the 1300s. It lost ground to Muslim port states such as Malacca.
    topic_code: "1.3"
  - front: Sultanate of Malacca (c. 1400) → why its conversion mattered
    back: |
      Its ruler's adoption of Islam drew Muslim merchants from Gujarat, Arabia and China, making Malacca the entrepôt where Indian Ocean and Chinese shipping met. It made Islam a political force in Southeast Asia.
    topic_code: "1.3"
  - front: Khmer Empire (802–1431) → economic base and religious shift
    back: |
      A land-based rice state at Angkor fed by reservoirs and canals. Its kings built Angkor Wat for Vishnu and later turned to Theravada Buddhism; drought, floods and Thai attacks emptied Angkor by 1431.
    topic_code: "1.3"
  - front: Angkor Wat → what it tells you
    back: |
      A vast temple built in the early 1100s for the Hindu god Vishnu by the Khmer king, later used by Buddhists. It shows Indian religion and ideas of divine kingship adopted in Southeast Asia and a state rich enough to build on that scale.
    topic_code: "1.3"
  - front: Marco Polo on Sumatra (1290s) → what he noticed and why
    back: |
      He recorded spices, lign-aloes and spikenard "that never come into our parts": the goods a merchant valued. Useful evidence of Southeast Asia's role in trade, limited by his brief stay and commercial focus.
    topic_code: "1.3"
  - front: Tenochtitlan (founded 1325) → location and how it was fed
    back: |
      The Mexica capital on an island in Lake Texcoco, linked to shore by causeways and an aqueduct, fed by chinampas (raised lake fields) and by tribute. One of the largest cities in the world by 1500.
    topic_code: "1.4"
  - front: Aztec Triple Alliance (1428) → members and how it ruled
    back: |
      Tenochtitlan, Texcoco and Tlacopan, dominated by Tenochtitlan. Conquered city-states kept their rulers but paid tribute in cloth, maize, cacao, feathers and captives; the empire was a tribute network, not a directly administered state.
    topic_code: "1.4"
  - front: Chinampas → definition and significance
    back: |
      Artificial raised fields built from mud and vegetation in the shallow lakes around Tenochtitlan, yielding several harvests a year. A key environmental adaptation that fed a very large city.
    topic_code: "1.4"
  - front: Pochteca → who they were
    back: |
      Long-distance Aztec merchants who traded luxury goods beyond the empire and reported on foreign cities. They formed a distinct, privileged group below the nobility.
    topic_code: "1.4"
  - front: Aztec human sacrifice → how it linked religion, war and politics
    back: |
      Priests sacrificed war captives to feed the sun and keep the cosmos going, so warfare had a religious purpose and the state needed constant campaigns. It terrorised subject peoples, who later allied with the Spanish.
    topic_code: "1.4"
  - front: Codex Mendoza tribute lists → what they record
    back: |
      Painted lists, copied for Spanish officials after the conquest, showing the goods each Aztec province owed (cloth, feathers, cacao, warrior costumes). Evidence of the scale and organisation of the tribute system.
    topic_code: "1.4"
  - front: Inca Empire (c. 1438–1533) → founder-expander and extent
    back: |
      Pachacuti and his successors expanded from Cusco along some 4,000 km of the Andes, the largest state in the Americas. Ruled through roads, storehouses, resettlement and a labour tax.
    topic_code: "1.4"
  - front: Mit'a → definition and contrast with Aztec tribute
    back: |
      A rotating labour obligation on each Inca community for roads, terraces, mines, farming state land and army service, repaid with food and cloth from state storehouses. The Aztecs took goods; the Inca took labour.
    topic_code: "1.4"
  - front: Inca roads → scale and uses
    back: |
      Roughly 40,000 km of roads with bridges and way-stations carried armies, officials, goods and relay runners across the Andes. They made direct administration of a huge mountain empire possible.
    topic_code: "1.4"
  - front: Quipu → what it did
    back: |
      Knotted, coloured cords used by Inca officials to record census figures, tribute and stores. The Inca ran a large state without writing.
    topic_code: "1.4"
  - front: Ayllu → meaning
    back: |
      The Andean kin-based community that held land collectively and owed labour to the state and to local lords. The building block of Inca administration.
    topic_code: "1.4"
  - front: Inca ruler and royal mummies → effect on expansion
    back: |
      The ruler was a son of the sun; dead rulers' mummies kept their estates and servants. Each new ruler therefore needed new conquests to support himself, driving the empire outward.
    topic_code: "1.4"
  - front: Maya city-states after 1200 → what continued
    back: |
      Smaller cities such as Mayapan in Yucatán kept Maya writing, calendars and trade in salt, cacao and cotton by canoe. The classic cities had collapsed, but Maya civilisation had not.
    topic_code: "1.4"
  - front: Cahokia and Chaco Canyon → two North American examples
    back: |
      Cahokia (peak c. 1050–1200) was a Mississippian mound city ruling a maize-growing chiefdom; Chaco Canyon's Ancestral Puebloans built stone great houses and irrigation in the Southwest before drought dispersed them. Both show complex societies north of Mexico.
    topic_code: "1.4"
  - front: Compare Aztec and Inca control of conquered peoples
    back: |
      Aztecs left subject rulers in place and demanded tribute in goods; the Inca resettled populations, imposed Quechua and officials, and demanded labour. Different methods for different economies: market-based Mexico versus a storehouse economy in the Andes.
    topic_code: "1.4"

quiz:
  description: |
    23 questions · about 38 minutes · mostly on this week (topics 1.3 and 1.4: South and Southeast Asia and the
    Americas), with about a third reviewing week 1 (Song China and Dar al-Islam). Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Marco Polo on Sumatra (1.3)
    - slug: apworld-u01-w02-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book III ch. 9 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "When you leave the Island of Pentam and sail about 100 miles, you reach the Island of Java the Less. For all its name 'tis none so small but that it has a compass of two thousand miles or more. The Island hath great abundance of treasure, with costly spices, lign-aloes and spikenard and many others that never come into our parts."

        — Marco Polo describing Sumatra (which he calls Java the Less) on his return voyage from China in the 1290s, *The Travels of Marco Polo*, Book III, chapter 9 (Yule–Cordier edition, 1903)
      prompt: |
        The goods Polo lists best explain which feature of Southeast Asian states in the period 1200–1450?
      options:
        - "The rise of land-based rice kingdoms such as the Khmer Empire"
        - "The wealth and power of sea-based states that controlled the spice trade through the straits"
        - "The decline of Buddhism in the Indonesian islands"
        - "The dependence of Southeast Asia on Chinese paper money"
      option_explanations:
        - |
          The Khmer grew rich on irrigated rice at Angkor, inland; Polo is describing island spices for export.
        - |
          Correct. Spices and aromatics that "never come into our parts" were the goods that made Srivijaya, Majapahit and later Malacca rich by taxing and supplying trade.
        - |
          Polo says nothing about religion in this excerpt; Buddhism's fate is not the point of the passage.
        - |
          Island trade ran on Chinese coin, silver, cloth and barter, not Yuan paper money; the excerpt mentions no currency.
      answer: 1
      explanation: |
        Skill: using a source as evidence for a broader pattern. Spices are the economic base of the sea-based states.

    - slug: apworld-u01-w02-q02
      type: multiple_choice
      topic_code: "1.3"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book III ch. 9 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "When you leave the Island of Pentam and sail about 100 miles, you reach the Island of Java the Less. For all its name 'tis none so small but that it has a compass of two thousand miles or more. The Island hath great abundance of treasure, with costly spices, lign-aloes and spikenard and many others that never come into our parts."

        — Marco Polo describing Sumatra (which he calls Java the Less) on his return voyage from China in the 1290s, *The Travels of Marco Polo*, Book III, chapter 9 (Yule–Cordier edition, 1903)
      prompt: |
        Polo's phrase "never come into our parts" most directly reveals which of the following about his point of view?
      options:
        - "He wrote as a European merchant measuring places by what they could sell to Europe"
        - "He wrote as a Buddhist pilgrim seeking sacred sites"
        - "He wrote as a Chinese official assessing tribute"
        - "He wrote as a Sumatran ruler defending local customs"
      option_explanations:
        - |
          Correct. "Our parts" is Europe; Polo's eye went to goods Europeans could not get, the perspective of a Venetian trader.
        - |
          Polo was a Christian merchant; nothing in the passage concerns pilgrimage or sacred sites.
        - |
          Polo served the Yuan court but writes here as a Venetian for European readers; "our parts" cannot mean China.
        - |
          Polo was a visitor, not a local ruler, and the passage looks at Sumatra from outside.
      answer: 0
      explanation: |
        Skill: sourcing (point of view). A single phrase can locate the author.

    - slug: apworld-u01-w02-q03
      type: multiple_choice
      topic_code: "1.2"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book III ch. 9 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "When you leave the Island of Pentam and sail about 100 miles, you reach the Island of Java the Less. For all its name 'tis none so small but that it has a compass of two thousand miles or more. The Island hath great abundance of treasure, with costly spices, lign-aloes and spikenard and many others that never come into our parts."

        — Marco Polo describing Sumatra (which he calls Java the Less) on his return voyage from China in the 1290s, *The Travels of Marco Polo*, Book III, chapter 9 (Yule–Cordier edition, 1903)
      prompt: |
        Within a century of Polo's visit, the region he describes was increasingly ruled by Muslim port sultanates. Which of the following best explains that change?
      options:
        - "Mongol armies conquered the islands and imposed Islam"
        - "The Delhi Sultanate annexed Sumatra and Malaya"
        - "Rulers adopted Islam to attract Muslim merchants who dominated Indian Ocean trade, and Sufi teachers made conversion acceptable"
        - "Hindu kings of Vijayanagara forced the islands to convert"
      option_explanations:
        - |
          A Mongol fleet attacked Java in 1293 and was driven off; the Mongols never ruled the islands and were not Muslim missionaries.
        - |
          The Delhi Sultanate had no navy and never ruled beyond the subcontinent.
        - |
          Correct. Islam came by sea with Gujarati, Arab and Persian traders; port rulers such as Malacca's converted to gain their business, and Sufis spread the faith.
        - |
          Vijayanagara was Hindu and had no reason to spread Islam; its influence did not reach the islands.
      answer: 2
      explanation: |
        Skill: causation. The CED stresses merchants and Sufis as the carriers of Islam into Southeast Asia.

    # ---- Stimulus set B: a described Aztec tribute list (1.4)
    - slug: apworld-u01-w02-q04
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge; the Codex Mendoza (c. 1541) is described, not reproduced"
      points: 1
      stimulus: |
        Image description: A page from a painted Aztec tribute record, copied for Spanish officials around 1541. Down the left margin are the place-glyphs of seven towns in a tropical lowland province. Across the page are pictures of the goods they owed Tenochtitlan every year or every six months: bundles of cotton cloaks with a flag symbol meaning twenty and a feather symbol meaning four hundred, two warrior costumes with feathered headdresses and shields, strings of jade beads, bags of cacao beans, and bundles of brightly coloured tropical bird feathers. A Spanish gloss beside each picture records the quantity.
      prompt: |
        The record described is best used as evidence for which feature of the Mexica (Aztec) state?
      options:
        - "A money economy based on silver coins minted at Tenochtitlan"
        - "An empire that extracted goods from conquered provinces while leaving local rulers in place"
        - "A state that redistributed food through government storehouses in exchange for labour"
        - "The absence of any system of record-keeping in the Americas"
      option_explanations:
        - |
          The Aztecs had no coinage; cacao beans and cloth served as money, and the page shows goods, not coins.
        - |
          Correct. Tribute in cloth, feathers, jade and cacao from named towns is the signature of the Aztec tribute empire, which ruled through subject lords.
        - |
          Storehouses and labour tax describe the Inca mit'a system, not the Aztec tribute lists.
        - |
          The page itself is a record; Mesoamerican societies kept painted and glyphic records.
      answer: 1
      explanation: |
        Skill: using a described visual source. The tribute list is the key document for the Aztec economy.

    - slug: apworld-u01-w02-q05
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge; the Codex Mendoza (c. 1541) is described, not reproduced"
      points: 1
      stimulus: |
        Image description: A page from a painted Aztec tribute record, copied for Spanish officials around 1541. Down the left margin are the place-glyphs of seven towns in a tropical lowland province. Across the page are pictures of the goods they owed Tenochtitlan every year or every six months: bundles of cotton cloaks with a flag symbol meaning twenty and a feather symbol meaning four hundred, two warrior costumes with feathered headdresses and shields, strings of jade beads, bags of cacao beans, and bundles of brightly coloured tropical bird feathers. A Spanish gloss beside each picture records the quantity.
      prompt: |
        The warrior costumes and tropical feathers among the tribute goods most directly reflect which aspect of Aztec society?
      options:
        - "A Confucian emphasis on scholarly learning among the elite"
        - "The importance of a warrior nobility and of ceremonial display tied to religion and conquest"
        - "The Aztec preference for peaceful trade over warfare"
        - "The equality of all social ranks in Tenochtitlan"
      option_explanations:
        - |
          Confucianism belongs to East Asia; Aztec elites were defined by war and priesthood, not examinations.
        - |
          Correct. Feathered costumes and shields equipped a warrior elite whose status rested on capturing prisoners for sacrifice; display announced rank.
        - |
          Warfare was central to Aztec religion and politics; the tribute itself was the fruit of conquest.
        - |
          Aztec society was sharply ranked: nobles, priests and warriors over commoners and enslaved people.
      answer: 1
      explanation: |
        Skill: inferring social structure from material evidence.

    - slug: apworld-u01-w02-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge; the Codex Mendoza (c. 1541) is described, not reproduced"
      points: 1
      stimulus: |
        Image description: A page from a painted Aztec tribute record, copied for Spanish officials around 1541. Down the left margin are the place-glyphs of seven towns in a tropical lowland province. Across the page are pictures of the goods they owed Tenochtitlan every year or every six months: bundles of cotton cloaks with a flag symbol meaning twenty and a feather symbol meaning four hundred, two warrior costumes with feathered headdresses and shields, strings of jade beads, bags of cacao beans, and bundles of brightly coloured tropical bird feathers. A Spanish gloss beside each picture records the quantity.
      prompt: |
        A historian would most need to consider which of the following when using this record as evidence about the Aztec empire before 1519?
      options:
        - "That it was copied after the Spanish conquest for Spanish purposes, so its format and glosses may reflect Spanish interests in what could be taxed"
        - "That the Aztecs could not have collected tribute because they had no roads"
        - "That feathers and jade had no value in Mesoamerica"
        - "That the Spanish invented the idea of tribute and imposed it on the record"
      option_explanations:
        - |
          Correct. The copy served Spanish administrators who wanted to know what provinces could pay; a historian separates pre-conquest content from post-conquest framing.
        - |
          Tribute travelled on the backs of porters and by canoe; the Aztecs had no draft animals but collected tribute effectively.
        - |
          Feathers and jade were among the most valued goods in Mesoamerica, which is why they appear on the list.
        - |
          Tribute was an Aztec institution that the Spanish inherited and adapted; the record copies Aztec originals.
      answer: 0
      explanation: |
        Skill: sourcing (historical situation of production). Post-conquest copies of pre-conquest records need care.

    # ---- Stand-alone multiple choice, this week and review
    - slug: apworld-u01-w02-q07
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes the Bhakti movement in South Asia?
      options:
        - "A Buddhist monastic reform that restored Buddhism as India's majority religion"
        - "A Muslim legal school that enforced sharia in the Delhi Sultanate"
        - "A Jain merchant guild that controlled Indian Ocean trade"
        - "A Hindu devotional movement that stressed personal love for a god, used local languages and reached women and lower castes"
      option_explanations:
        - |
          Buddhism had nearly disappeared from India by this period; Bhakti was Hindu.
        - |
          Bhakti was Hindu devotion, not Islamic law; its Islamic parallel was Sufism, not jurisprudence.
        - |
          Jains were important merchants, but Bhakti was a religious movement, not a guild.
        - |
          Correct. Bhakti poets sang to Shiva, Vishnu or Krishna in Tamil, Hindi and other tongues and downplayed Brahmin ritual and caste.
      answer: 3
      explanation: |
        The CED names Bhakti as the key example of religious change reaching ordinary people in South Asia.

    - slug: apworld-u01-w02-q08
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The Inca mit'a differed from Aztec tribute in that the mit'a
      options:
        - "required payment in cacao beans and cotton cloth"
        - "was collected only from the city of Cusco"
        - "demanded rotating labour from communities, repaid from state storehouses"
        - "was abolished by Pachacuti in 1438"
      option_explanations:
        - |
          Cacao and cloth were Aztec tribute goods; the Inca economy ran on labour, not goods payments.
        - |
          The mit'a applied to communities across the whole empire, not to the capital alone.
        - |
          Correct. Each ayllu sent workers in turn for roads, terraces, mines and the army, and the state fed and clothed them from its stores.
        - |
          Pachacuti expanded the state and its labour system; he did not abolish it.
      answer: 2
      explanation: |
        Skill: comparison. The CED contrasts the Aztec tribute system with Inca labour obligations.

    - slug: apworld-u01-w02-q09
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which of the following best explains why Song China is described as the most commercialised society of its time?
      options:
        - "It had abolished agriculture in favour of trade"
        - "Double-cropped rice, canal transport, iron production, paper money and export manufacturing linked regional markets into one economy"
        - "It conquered the Silk Road cities of Central Asia"
        - "It adopted the Islamic banking system from the Abbasids"
      option_explanations:
        - |
          Agriculture, especially Champa rice, was the foundation of Song growth, not something abandoned.
        - |
          Correct. These developments together produced proto-industrialisation and a monetised economy.
        - |
          The Song lost territory and never controlled Central Asia; their strength was internal.
        - |
          Song credit instruments were Chinese developments; there was no borrowing of Abbasid banking.
      answer: 1
      explanation: |
        Spiral review of 1.1.

    - slug: apworld-u01-w02-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Delhi Sultanate, the Mamluk Sultanate and the Seljuk Turks had which of the following in common?
      options:
        - "All were founded by Arab tribes from the Arabian Peninsula"
        - "All were conquered by the Mongols in 1258"
        - "All were Hindu kingdoms that resisted Islam"
        - "All were ruled by Turkic military elites who governed as Muslims after the Abbasid Caliphate lost real power"
      option_explanations:
        - |
          Their founders were Turkic, not Arab; Arab political dominance had ended.
        - |
          The Mamluks defeated the Mongols in 1260 and the Delhi Sultanate repelled them; only the Seljuk lands fell.
        - |
          All three were Muslim states; the Delhi Sultanate ruled a Hindu majority but was itself Muslim.
        - |
          Correct. Turkic soldiers and migrants became the new rulers of the Islamic world's central lands and northern India.
      answer: 3
      explanation: |
        Spiral review of 1.2.

    - slug: apworld-u01-w02-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which pairing correctly matches a Southeast Asian state with its type and economic base?
      options:
        - "Khmer Empire: sea-based state living by taxing ships in the Strait of Malacca"
        - "Srivijaya: land-based state living by irrigated rice at Angkor"
        - "Majapahit: sea-based Hindu-Buddhist empire living by the spice trade of the islands"
        - "Sultanate of Malacca: land-based Buddhist kingdom in the Cambodian interior"
      option_explanations:
        - |
          The Khmer were a land-based rice state at Angkor, far from the strait.
        - |
          Srivijaya was a Buddhist sea-based state on Sumatra that taxed shipping; Angkor was Khmer.
        - |
          Correct. Majapahit, centred on Java from 1293, dominated the spice trade and was Hindu-Buddhist.
        - |
          Malacca was a Muslim port state on the Malay peninsula controlling the strait.
      answer: 2
      explanation: |
        Skill: classifying states by the CED's sea-based versus land-based distinction.

    - slug: apworld-u01-w02-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes Cahokia around 1100?
      options:
        - "A Mississippian mound city ruling a maize-growing chiefdom near the confluence of the Mississippi and Missouri rivers"
        - "An Inca provincial capital in the Andes"
        - "A Maya trading port on the Yucatán coast"
        - "A Pueblo great house in Chaco Canyon"
      option_explanations:
        - |
          Correct. Cahokia's earthen mounds and plazas mark the largest settlement north of Mexico, supported by maize farming and trade.
        - |
          Cahokia is in North America; the Inca ruled the Andes of South America.
        - |
          Maya ports were in Mesoamerica; Cahokia lies near present-day St. Louis.
        - |
          Chaco Canyon's stone great houses are in the arid Southwest; Cahokia's mounds are earthen and in the Mississippi Valley.
      answer: 0
      explanation: |
        The CED names Cahokia and Chaco as examples of complex societies in North America.

    - slug: apworld-u01-w02-q22
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Grand Canal was especially important to the Song state because it
      options:
        - "carried Mongol armies into southern China"
        - "allowed Chinese junks to reach the Indian Ocean"
        - "connected the rice-growing south, where most people lived, with the political north"
        - "replaced the need for paper money"
      option_explanations:
        - |
          The Mongols came overland from the north; the canal served Chinese commerce and government.
        - |
          The canal was inland; ocean trade sailed from coastal ports such as Quanzhou.
        - |
          Correct. With population and rice concentrated south of the Yangzi, the canal moved grain, taxes and goods to the capital and the frontier.
        - |
          Money and the canal served different purposes; both expanded together.
      answer: 2
      explanation: |
        Spiral review of 1.1.

    - slug: apworld-u01-w02-q23
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
