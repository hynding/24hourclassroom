  # ---- Short answers (SAQ style)
  - slug: apworld-u01-exam-q38
    type: short_answer
    topic_code: "1.5"
    source: "general knowledge; the rock-cut churches of Lalibela are described, not reproduced"
    points: 3
    stimulus: |
      Image description: A photograph of a church at Lalibela in the Ethiopian highlands, carved downward out of solid volcanic rock around the 1200s so that its roof, shaped as a Greek cross, lies level with the surrounding ground and its walls stand in a deep trench. Carved windows, doorways and interior columns imitate built architecture. Pilgrims in white shawls stand in the trench beside the church. Tradition holds that King Lalibela ordered the churches built as a "new Jerusalem" after Muslim control of Jerusalem made pilgrimage difficult.
    prompt: |
      Using the image description, answer (a), (b) and (c).

      (a) Identify ONE way the church reflects the role of religion in Ethiopian state-building.
      (b) Explain ONE way Ethiopia's situation differed from that of the Mali Empire in the same period.
      (c) Explain ONE similarity between the use of religious architecture by Ethiopian kings and by rulers in another region of the world c. 1200–1450.
    answer: |
      (a) The scale of the work and the royal tradition behind it show kings using Christianity to legitimise their rule and to organise labour on a monumental project; the "new Jerusalem" idea made the king a protector of the faith.
      (b) Ethiopia was a long-established Christian monarchy in a highland region, trading through the Red Sea and often at odds with Muslim neighbours, whereas Mali was a recently formed Sahelian empire whose rulers adopted Islam to connect with trans-Saharan merchants while most subjects kept local religions.
      (c) Like the Khmer kings who built Angkor Wat or European kings who endowed cathedrals, Ethiopian rulers used monumental religious buildings to display piety, command labour and express divine sanction for their authority.
    explanation: |
      Three points, one per part.

      (a) 1 pt: a specific link between the church and royal power: legitimacy; command of labour; the king as defender of Christianity; the new Jerusalem claim. Zero for describing the carving without the political link.

      (b) 1 pt: an accurate contrast with Mali: religion (Christianity vs Islam); age of the state; economic base (highland agriculture and Red Sea vs trans-Saharan trade); relation to Muslim neighbours. Zero for a vague "they were different".

      (c) 1 pt: a specific parallel from another region (Angkor Wat, European cathedrals, mosques of Timbuktu or Delhi, Aztec temples) with the function it shared.

  - slug: apworld-u01-exam-q39
    type: short_answer
    topic_code: "1.7"
    source: "general knowledge"
    points: 3
    prompt: |
      Answer (a), (b) and (c).

      (a) Identify ONE way that the economic basis of a state shaped its form of government in the period c. 1200 to c. 1450, using a specific example.
      (b) Identify ONE way that religion shaped the form of government in a different region, using a specific example.
      (c) Explain ONE change in how states were governed in any region between c. 1200 and c. 1450.
    answer: |
      (a) The Swahili city-states lived by taxing Indian Ocean trade, so they remained small independent ports governed by sultans and merchant families rather than becoming a territorial empire; or Song China's taxable agriculture supported a salaried bureaucracy.
      (b) In Europe the Catholic Church crowned kings, supplied their clerks and could excommunicate them, so royal government developed in partnership and tension with the Church; or Islam gave the Delhi sultans legitimacy and sharia courts over a Hindu majority.
      (c) In Western Europe, kings who had depended on feudal lords in 1200 built taxes, courts and paid armies by 1450, especially under the pressure of the Hundred Years' War; or in Dar al-Islam, Turkic sultanates replaced the Abbasid caliphate as the real governments.
    explanation: |
      Three points, one per part.

      (a) 1 pt: a specific state and an explicit link from its revenue or economy to its form of government. Zero for naming an economy without the governmental consequence.

      (b) 1 pt: a specific state in a different region from (a) with an explicit link from religion to government.

      (c) 1 pt: a specific change with dates or developments (European monarchies; Turkic sultanates; Mongol conquest of Song; rise of the Aztec and Inca). Zero for a continuity.

  # ---- Long essay (LEQ style)
  - slug: apworld-u01-exam-q40
    type: long_answer
    topic_code: "1.7"
    source: "general knowledge"
    points: 6
    prompt: |
      In the period c. 1200 to c. 1450, rulers across the world drew on religious traditions to build and justify their states.

      Develop an argument that evaluates the extent to which religion shaped the development of states in TWO different regions in the period c. 1200 to c. 1450.

      In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (comparison, causation, or continuity and change).
    answer: |
      Thesis (example using Dar al-Islam and Europe): Religion was central to legitimacy and administration in both regions, but it shaped the state differently: in Dar al-Islam, Islam provided the law, the officials and the cultural unity of states whose rulers were otherwise newcomers (Turkic sultans), while in Europe the Catholic Church was both the partner and the rival of kings, so that state-building meant negotiating with an independent religious institution.

      Context: the Abbasid Caliphate had fragmented and Turkic peoples had become Islam's rulers; Europe had been fragmented since Rome and the Church was its one continent-wide institution; both regions were connected by trade and by the transfer of Greek learning through Arabic.

      Body 1 (legitimacy): sultans as defenders of Islam (Delhi, Mamluks); European kings anointed by bishops; Ethiopia's Solomonic claim as a third case.

      Body 2 (administration): sharia courts and qadis staffing Muslim states, madrasas training them, Ibn Battuta's career; clergy as royal clerks in Europe, universities training lawyers, Church courts.

      Body 3 (limits and differences): the ulama could disapprove but had no hierarchy; the pope could excommunicate and crusade, and Magna Carta shows barons rather than the Church checking kings; economic bases (trade routes, farmland) mattered as much as religion in deciding state form.

      Conclusion: religion shaped states in both regions to a great extent, but the kind of religious institution determined whether it was a tool of rulers or a counterweight to them.
    explanation: |
      Scored on the six-point LEQ rubric.

      Thesis/claim (0–1): names two regions and makes an evaluative claim about the extent of religion's influence with a line of reasoning. Zero for "religion was important in both".

      Contextualization (0–1): relevant broader context for both regions (political fragmentation, trade networks, earlier religious history). Must be developed beyond a phrase.

      Evidence (0–2): 1 pt for two or more specific examples (e.g. Delhi Sultanate, Mamluks, sharia and qadis, madrasas, Sufis, Ibn Battuta; Church coronation, Scholasticism, universities, crusades, Magna Carta; or Mali, Ethiopia, Khmer, Aztec, Inca examples for other pairs). 2 pts when evidence supports the argument about religion's role.

      Analysis and reasoning (0–2): 1 pt for sustained comparison or causation. 1 pt for complexity: weighing religion against economic or military factors; distinguishing kinds of religious institution; showing change over time (Church and crown; caliphate to sultanates).

      Common errors: treating religion as identical everywhere; choosing two states in one region; ignoring non-religious causes; inventing institutions (an Islamic pope; a Chinese Church).
