unit: 1
description: |
  40 questions · about 70 minutes · every topic of Unit 1 (1.1 to 1.7). Because this is the first unit there is no
  earlier unit to review, so the whole exam is on the global tapestry of c. 1200–1450, with four source-based
  multiple-choice sets in the AP style (a primary source, a described Spanish account, a charter and an
  interpretation written for this course), stand-alone multiple choice, select-all, true/false and
  fill-in-the-blank items, two short-answer questions (3 points each) and one long essay question (6 points).
  Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
  automatically; the free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: Marco Polo on Kinsay (1.1)
  - slug: apworld-u01-exam-q01
    type: multiple_choice
    topic_code: "1.1"
    source: "Primary source: Marco Polo, The Travels of Marco Polo, Book II ch. 76 (Yule–Cordier edition, 1903), Wikisource"
    points: 1
    stimulus: |
      "First and foremost, then, the document stated the city of Kinsay to be so great that it hath an hundred miles of compass. And there are in it twelve thousand bridges of stone, for the most part so lofty that a great fleet could pass beneath them. And let no man marvel that there are so many bridges, for you see the whole city stands as it were in the water and surrounded by water, so that a great many bridges are required to give free passage about it."

      — Marco Polo describing Kinsay (Hangzhou), the former Southern Song capital, which he visited under Mongol rule in the 1280s, *The Travels of Marco Polo*, Book II, chapter 76 (Yule–Cordier edition, 1903)
    prompt: |
      The city Polo describes grew to its size chiefly because of which development?
    options:
      - "The Mongol decision to make it the capital of the Yuan dynasty"
      - "Song-era commercialisation built on double-cropped rice, water transport, manufacturing and paper money"
      - "The relocation of the Abbasid court to China after 1258"
      - "Its role as the terminus of the trans-Saharan trade"
    option_explanations:
      - |
        The Yuan capital was Khanbaliq (Beijing); Hangzhou's growth came under the Southern Song, before the Mongols.
      - |
        Correct. Champa rice, canals and rivers, silk and porcelain workshops and a monetised economy made Hangzhou one of the world's largest cities.
      - |
        The Abbasid court was destroyed in 1258; no Islamic caliphate ever moved to China.
      - |
        The trans-Saharan trade linked North and West Africa; it had nothing to do with Hangzhou.
    answer: 1
    explanation: |
      Skill: causation from a source to its context, the Song economic transformation.

  - slug: apworld-u01-exam-q02
    type: multiple_choice
    topic_code: "1.1"
    source: "Primary source: Marco Polo, The Travels of Marco Polo, Book II ch. 76 (Yule–Cordier edition, 1903), Wikisource"
    points: 1
    stimulus: |
      "First and foremost, then, the document stated the city of Kinsay to be so great that it hath an hundred miles of compass. And there are in it twelve thousand bridges of stone, for the most part so lofty that a great fleet could pass beneath them. And let no man marvel that there are so many bridges, for you see the whole city stands as it were in the water and surrounded by water, so that a great many bridges are required to give free passage about it."

      — Marco Polo describing Kinsay (Hangzhou), the former Southern Song capital, which he visited under Mongol rule in the 1280s, *The Travels of Marco Polo*, Book II, chapter 76 (Yule–Cordier edition, 1903)
    prompt: |
      Polo's phrase "the document stated" is most useful to a historian because it indicates that
    options:
      - "Polo invented the description without visiting the city"
      - "the Song government had banned foreign visitors"
      - "the city had no written records"
      - "Polo drew on a written Chinese or official account, so his figures reflect a source other than his own measurement"
    option_explanations:
      - |
        Polo visited Hangzhou; citing a document does not mean he was absent, only that he used it.
      - |
        The Yuan, not the Song, ruled when Polo visited, and they welcomed foreigners.
      - |
        The opposite: Polo's reliance on a document shows that records existed.
      - |
        Correct. He attributes the figures to a document, which tells the historian the numbers are second-hand and possibly formal or exaggerated.
    answer: 3
    explanation: |
      Skill: sourcing (how the author knew what he knew).

  - slug: apworld-u01-exam-q03
    type: multiple_choice
    topic_code: "1.7"
    source: "Primary source: Marco Polo, The Travels of Marco Polo, Book II ch. 76 (Yule–Cordier edition, 1903), Wikisource"
    points: 1
    stimulus: |
      "First and foremost, then, the document stated the city of Kinsay to be so great that it hath an hundred miles of compass. And there are in it twelve thousand bridges of stone, for the most part so lofty that a great fleet could pass beneath them. And let no man marvel that there are so many bridges, for you see the whole city stands as it were in the water and surrounded by water, so that a great many bridges are required to give free passage about it."

      — Marco Polo describing Kinsay (Hangzhou), the former Southern Song capital, which he visited under Mongol rule in the 1280s, *The Travels of Marco Polo*, Book II, chapter 76 (Yule–Cordier edition, 1903)
    prompt: |
      Which city in another region of the world around 1300–1450 offers the closest comparison to Hangzhou as a very large city sustained by water-borne supply and intensive agriculture?
    options:
      - "Tenochtitlan, fed by chinampas and reached by causeways across Lake Texcoco"
      - "Great Zimbabwe, a stone-walled cattle and gold centre on a plateau"
      - "Timbuktu, a caravan city on the edge of the Sahara"
      - "Kilwa, a coral-stone port on the Indian Ocean"
    option_explanations:
      - |
        Correct. Tenochtitlan was one of the world's largest cities, built in a lake, fed by raised fields and supplied by canoe, the nearest American parallel.
      - |
        Great Zimbabwe held perhaps 18,000 people and depended on cattle and mining, not intensive wet farming.
      - |
        Timbuktu was a desert-edge trading and scholarly town, far smaller and fed by river trade, not a lake city.
      - |
        Kilwa was a small port; its wealth came from trade, not from surrounding agriculture.
    answer: 0
    explanation: |
      Skill: comparison across regions (1.7), using the environmental basis of urban scale.

  # ---- Stimulus set B: a described Spanish account of Inca administration (1.4)
  - slug: apworld-u01-exam-q04
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge; the chronicle of Pedro de Cieza de León (1550s) is described, not quoted"
    points: 1
    stimulus: |
      A Spanish soldier and chronicler who travelled through Peru in the 1540s, within a generation of the conquest, described what he learned of Inca rule: that the empire was divided into four quarters under governors answerable to the ruler at Cusco; that a road ran the length of the Andes with lodgings and storehouses a day's march apart, stocked with maize, dried potatoes, cloth, sandals and weapons for passing armies; that conquered peoples were sometimes moved wholesale to distant provinces and replaced by loyal settlers; that officials counted the population and its tribute in labour using knotted cords; and that the ruler's dead predecessors were kept as mummies and consulted as if alive.
    prompt: |
      The description best supports which characterisation of the Inca state?
    options:
      - "A loose confederation of independent city-states"
      - "A trading state that lived by taxing caravans"
      - "A centralised empire that administered its provinces directly through officials, infrastructure and resettlement"
      - "A feudal monarchy in which lords held land in return for military service"
    option_explanations:
      - |
        Four quarters under governors answerable to Cusco is the opposite of a confederation.
      - |
        No caravans or merchants appear; the state supplied itself through storehouses and labour.
      - |
        Correct. Governors, roads, storehouses, resettlement and quipu records are the instruments of direct administration.
      - |
        Inca officials were appointed by the ruler; the account mentions no fiefs or vassals.
    answer: 2
    explanation: |
      Skill: characterising a state from described evidence.

  - slug: apworld-u01-exam-q05
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge; the chronicle of Pedro de Cieza de León (1550s) is described, not quoted"
    points: 1
    stimulus: |
      A Spanish soldier and chronicler who travelled through Peru in the 1540s, within a generation of the conquest, described what he learned of Inca rule: that the empire was divided into four quarters under governors answerable to the ruler at Cusco; that a road ran the length of the Andes with lodgings and storehouses a day's march apart, stocked with maize, dried potatoes, cloth, sandals and weapons for passing armies; that conquered peoples were sometimes moved wholesale to distant provinces and replaced by loyal settlers; that officials counted the population and its tribute in labour using knotted cords; and that the ruler's dead predecessors were kept as mummies and consulted as if alive.
    prompt: |
      The storehouses stocked with food, cloth and weapons are most directly linked to which Inca institution?
    options:
      - "The pochteca merchant guilds"
      - "The chinampa fields"
      - "The mit'a labour obligation, through which communities produced goods for the state"
      - "The civil service examination"
    option_explanations:
      - |
        Pochteca were Aztec merchants; the Inca had no merchant class of that kind.
      - |
        Chinampas were Aztec lake fields in Mexico, not Andean.
      - |
        Correct. Rotating labour on state lands and in state workshops filled the storehouses that fed armies and relieved famine.
      - |
        Examinations belong to China; Inca officials were appointed from the nobility.
    answer: 2
    explanation: |
      Skill: connecting infrastructure to the labour system that supplied it.

  - slug: apworld-u01-exam-q06
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge; the chronicle of Pedro de Cieza de León (1550s) is described, not quoted"
    points: 1
    stimulus: |
      A Spanish soldier and chronicler who travelled through Peru in the 1540s, within a generation of the conquest, described what he learned of Inca rule: that the empire was divided into four quarters under governors answerable to the ruler at Cusco; that a road ran the length of the Andes with lodgings and storehouses a day's march apart, stocked with maize, dried potatoes, cloth, sandals and weapons for passing armies; that conquered peoples were sometimes moved wholesale to distant provinces and replaced by loyal settlers; that officials counted the population and its tribute in labour using knotted cords; and that the ruler's dead predecessors were kept as mummies and consulted as if alive.
    prompt: |
      A historian would most need to keep in mind which of the following when using this account?
    options:
      - "The chronicler wrote after the conquest from what Andean informants and Spanish officials told him, so the account reflects both their memories and his European categories"
      - "The chronicler had no interest in how the empire worked"
      - "The Inca left detailed written histories that make the account unnecessary"
      - "Spanish observers were forbidden to travel in Peru"
    option_explanations:
      - |
        Correct. Cieza relied on interviews and translation and organised what he heard in terms a Spanish reader understood; the historian must allow for both.
      - |
        The detail about governors, roads and storehouses shows strong interest in administration.
      - |
        The Inca had no writing; Spanish and indigenous accounts after the conquest are the main written evidence.
      - |
        Spaniards travelled freely in Peru after 1533; the chronicler's journey is itself proof.
    answer: 0
    explanation: |
      Skill: sourcing (historical situation and process of production of a post-conquest account).

  # ---- Stimulus set C: Magna Carta (1.6)
  - slug: apworld-u01-exam-q07
    type: multiple_choice
    topic_code: "1.6"
    source: "Primary source: Magna Carta (1215), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "No freemen shall be taken or imprisoned or disseised or exiled or in any way destroyed, nor will we go upon him nor send upon him, except by the lawful judgment of his peers or by the law of the land. To no one will we sell, to no one will we refuse or delay, right or justice."

      — Magna Carta, clauses 39 and 40, agreed by King John of England and his rebellious barons, 1215 (Avalon Project text; "disseised" means deprived of land)
    prompt: |
      The promise "to no one will we sell ... right or justice" most directly responds to which practice of English kings before 1215?
    options:
      - "Appointing bishops without papal consent"
      - "Charging money for royal court hearings and favourable judgments"
      - "Levying taxes on the Church"
      - "Enforcing serfdom on the royal manors"
    option_explanations:
      - |
        Investiture disputes concerned the Church; these clauses concern justice.
      - |
        Correct. Kings raised revenue by selling access to royal justice; the barons demanded an end to the sale and delay of right.
      - |
        Church taxation is not the subject of these clauses.
      - |
        Serfs were not "freemen" and are outside the charter's concern.
    answer: 1
    explanation: |
      Skill: reading a clause against its immediate context.

  - slug: apworld-u01-exam-q08
    type: multiple_choice
    topic_code: "1.6"
    source: "Primary source: Magna Carta (1215), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "No freemen shall be taken or imprisoned or disseised or exiled or in any way destroyed, nor will we go upon him nor send upon him, except by the lawful judgment of his peers or by the law of the land. To no one will we sell, to no one will we refuse or delay, right or justice."

      — Magna Carta, clauses 39 and 40, agreed by King John of England and his rebellious barons, 1215 (Avalon Project text; "disseised" means deprived of land)
    prompt: |
      The reference to "freemen" and "judgment of his peers" indicates that the charter's protections were designed mainly for
    options:
      - "serfs bound to manors"
      - "foreign merchants"
      - "the clergy alone"
      - "the landholding nobility and other free property-owners"
    option_explanations:
      - |
        Serfs were unfree and had no "peers" in the charter's sense; the document ignored them.
      - |
        Merchants received some protections elsewhere in the charter, but these clauses concern free landholders judged by their equals.
      - |
        The clergy had their own courts; the barons wrote these clauses for themselves.
      - |
        Correct. Trial by one's peers was a baronial demand; "freemen" meant the propertied minority.
    answer: 3
    explanation: |
      Skill: identifying the audience and beneficiaries of a document.

  - slug: apworld-u01-exam-q09
    type: multiple_choice
    topic_code: "1.6"
    source: "Primary source: Magna Carta (1215), Avalon Project, Yale Law School"
    points: 1
    stimulus: |
      "No freemen shall be taken or imprisoned or disseised or exiled or in any way destroyed, nor will we go upon him nor send upon him, except by the lawful judgment of his peers or by the law of the land. To no one will we sell, to no one will we refuse or delay, right or justice."

      — Magna Carta, clauses 39 and 40, agreed by King John of England and his rebellious barons, 1215 (Avalon Project text; "disseised" means deprived of land)
    prompt: |
      Which of the following developments between 1215 and 1450 most changed the balance of power that the charter reflects?
    options:
      - "The replacement of feudal levies by royal taxes and paid armies during the Hundred Years' War, which strengthened kings"
      - "The abolition of the English monarchy"
      - "The conversion of England to Islam"
      - "The disappearance of the nobility after the Black Death"
    option_explanations:
      - |
        Correct. War pushed kings to build taxes, bureaucracies and professional soldiers, making them less dependent on the barons who had forced the charter, even as parliaments gained a role.
      - |
        The monarchy continued; it grew stronger.
      - |
        England remained Catholic throughout the period.
      - |
        The nobility survived the plague; it was serfdom that weakened.
    answer: 0
    explanation: |
      Skill: continuity and change in European governance.

  # ---- Stimulus set D: an interpretation of devotional religion (1.3)
  - slug: apworld-u01-exam-q10
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge; interpretation written for this course"
    points: 1
    stimulus: |
      A historian writing for this course argues: "Between 1200 and 1450 the most dynamic religious movements in Asia were not led by kings or clerics but by poets, mystics and wandering teachers. Bhakti saints in India sang to Krishna and Shiva in Tamil and Hindi, not Sanskrit; Sufi masters in Persia, India and the Malay world taught love of God through music and the example of their own lives. Both reached women, artisans and the low-born, and both unsettled the religious specialists whose authority rested on texts and ritual. Islam's spread into Southeast Asia owed more to such teachers than to any army."
    prompt: |
      Which of the following best supports the historian's claim in the last sentence?
    options:
      - "The Delhi Sultanate's conquest of northern India after 1206"
      - "The Mongol sack of Baghdad in 1258"
      - "The building of Angkor Wat for Vishnu"
      - "The conversion of the ruler of Malacca around 1400 after contact with Muslim merchants and Sufi teachers, with no Muslim invasion"
    option_explanations:
      - |
        Delhi's conquest is the counter-example: Islam arriving by army, in South Asia rather than Southeast Asia.
      - |
        The sack of Baghdad concerns Mongol conquest in the Islamic heartland, not religious spread in Southeast Asia.
      - |
        Angkor Wat is Hindu and earlier; it does not bear on Islam's spread.
      - |
        Correct. Malacca's conversion through trade and preaching, with no conquest, is exactly the pattern claimed for Southeast Asia.
    answer: 3
    explanation: |
      Skill: matching evidence to a specific claim.

  - slug: apworld-u01-exam-q11
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge; interpretation written for this course"
    points: 1
    stimulus: |
      A historian writing for this course argues: "Between 1200 and 1450 the most dynamic religious movements in Asia were not led by kings or clerics but by poets, mystics and wandering teachers. Bhakti saints in India sang to Krishna and Shiva in Tamil and Hindi, not Sanskrit; Sufi masters in Persia, India and the Malay world taught love of God through music and the example of their own lives. Both reached women, artisans and the low-born, and both unsettled the religious specialists whose authority rested on texts and ritual. Islam's spread into Southeast Asia owed more to such teachers than to any army."
    prompt: |
      The historian's description of Bhakti and Sufism as "unsettling" religious specialists most directly refers to
    options:
      - "Brahmins and Islamic legal scholars whose authority rested on Sanskrit or Arabic texts and ritual"
      - "Buddhist monks in Sri Lanka"
      - "Confucian scholar-officials in China"
      - "Catholic bishops in Europe"
    option_explanations:
      - |
        Correct. Devotional movements bypassed Brahmin ritual and the jurists' legalism by offering direct access to God in local languages.
      - |
        Theravada monks in Sri Lanka are not the specialists Bhakti and Sufism challenged.
      - |
        Confucian officials belong to East Asia and were not the target of these movements.
      - |
        Europe's clergy faced similar lay movements, but the passage is about Asia.
    answer: 0
    explanation: |
      Skill: identifying what a passage refers to from context.

  - slug: apworld-u01-exam-q12
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge; interpretation written for this course"
    points: 1
    stimulus: |
      A historian writing for this course argues: "Between 1200 and 1450 the most dynamic religious movements in Asia were not led by kings or clerics but by poets, mystics and wandering teachers. Bhakti saints in India sang to Krishna and Shiva in Tamil and Hindi, not Sanskrit; Sufi masters in Persia, India and the Malay world taught love of God through music and the example of their own lives. Both reached women, artisans and the low-born, and both unsettled the religious specialists whose authority rested on texts and ritual. Islam's spread into Southeast Asia owed more to such teachers than to any army."
    prompt: |
      Which development in another region offers the closest parallel to the movements the historian describes?
    options:
      - "The expansion of the Song civil service examinations"
      - "The growth of lay devotional piety in Europe that offered ordinary believers direct religious experience outside the clergy"
      - "The Inca state cult of the sun"
      - "The Mali rulers' adoption of Islam for diplomatic advantage"
    option_explanations:
      - |
        Examinations strengthened a textual elite, the opposite of the movements described.
      - |
        Correct. European lay piety, like Bhakti and Sufism, was devotion from below in vernacular languages that made clerics uneasy.
      - |
        The Inca cult was a state religion run from the top by the ruler and priests.
      - |
        A ruler's political conversion is top-down, not a popular devotional movement.
    answer: 1
    explanation: |
      Skill: comparison across regions (1.7).

  # ---- Stand-alone multiple choice
  - slug: apworld-u01-exam-q13
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best describes the effect of the Song civil service examinations on Chinese society?
    options:
      - "They transferred power from scholar-officials to hereditary aristocrats"
      - "They ended the influence of Confucianism"
      - "They created a scholar-gentry whose status rested on education and office, though wealth still determined who could prepare"
      - "They were restricted to Buddhist monks"
    option_explanations:
      - |
        The reverse: examinations undercut hereditary aristocracy in favour of educated landowners.
      - |
        The examinations tested the Confucian classics and made Confucianism the state orthodoxy.
      - |
        Correct. Examination success made families gentry; the years of study required kept the ladder tilted toward the well-off.
      - |
        Monks were outside the system; candidates were laymen trained in the classics.
    answer: 2
    explanation: |
      Topic 1.1: the social consequence of the examination system.

  - slug: apworld-u01-exam-q14
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Korea, Japan and Vietnam all adopted which of the following from China between c. 1200 and c. 1450?
    options:
      - "The practice of foot binding for all women"
      - "A Mongol-style military organisation"
      - "Chinese writing, Buddhism and Confucian political ideas, adapted to local conditions"
      - "The abolition of hereditary aristocracy"
    option_explanations:
      - |
        Foot binding remained a Chinese elite practice and was not adopted in Korea, Japan or Vietnam.
      - |
        None of the three adopted Mongol military structures; Japan and Vietnam resisted Mongol invasions.
      - |
        Correct. All three borrowed the script, Buddhism and Confucian ideas; Korea kept its aristocracy, Japan its samurai, Vietnam its distinct gender roles.
      - |
        Korea's aristocracy and Japan's warrior lords remained hereditary.
    answer: 2
    explanation: |
      Topic 1.1: borrowing and adaptation in East Asia.

  - slug: apworld-u01-exam-q15
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following was a consequence of the Mamluk victory at Ain Jalut in 1260?
    options:
      - "Egypt and Syria remained outside Mongol control, and Cairo became the leading centre of Arabic learning after Baghdad's fall"
      - "The Mongols conquered Egypt and ended the Mamluk Sultanate"
      - "The Abbasid caliph returned to Baghdad with full political power"
      - "The Delhi Sultanate collapsed"
    option_explanations:
      - |
        Correct. With Baghdad destroyed in 1258, Mamluk Cairo, protected by the victory, became the chief city of the Arabic-speaking world.
      - |
        The Mamluks won; the Mongols never conquered Egypt.
      - |
        The Mamluks installed a powerless caliph in Cairo; Baghdad remained under the Mongol Ilkhans.
      - |
        The Delhi Sultanate was unaffected and itself repelled Mongol raids.
    answer: 0
    explanation: |
      Topic 1.2: the shift of the Islamic world's centre of gravity after 1258.

  - slug: apworld-u01-exam-q16
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Ibn Khaldun's analysis of how dynasties rise through group solidarity and decline through luxury is best understood as evidence of
    options:
      - "the end of scholarship in the Islamic world after 1258"
      - "the continued intellectual innovation of Dar al-Islam in the fourteenth century"
      - "the adoption of Confucian historiography by Muslim writers"
      - "the spread of Buddhism into North Africa"
    option_explanations:
      - |
        Ibn Khaldun wrote in the 1370s, more than a century after 1258, which refutes the idea of an end to scholarship.
      - |
        Correct. His work is often called the first social-scientific history and shows Islamic thought developing new fields.
      - |
        There was no Confucian influence on North African historians.
      - |
        Buddhism never reached North Africa; Ibn Khaldun was a Muslim scholar.
    answer: 1
    explanation: |
      Topic 1.2: intellectual continuity and innovation.

  - slug: apworld-u01-exam-q17
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best explains the decline of the Khmer capital at Angkor by 1431?
    options:
      - "Mongol conquest of Cambodia"
      - "The conversion of the Khmer to Islam"
      - "The founding of Vijayanagara"
      - "A combination of environmental stress on its irrigation system and attacks by neighbouring Thai states"
    option_explanations:
      - |
        The Mongols raided mainland Southeast Asia but never conquered the Khmer.
      - |
        The Khmer turned from Hinduism to Theravada Buddhism, not Islam.
      - |
        Vijayanagara was a Hindu kingdom in southern India with no role in Cambodia.
      - |
        Correct. Drought and flooding strained Angkor's reservoirs and canals, and Thai (Ayutthaya) attacks culminated in the sack of 1431.
    answer: 3
    explanation: |
      Topic 1.3: environment and warfare in the fate of a land-based state.

  - slug: apworld-u01-exam-q18
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      The founders of the Vijayanagara Empire had served the Delhi Sultanate, converted to Islam and then returned to Hinduism to build a southern kingdom. This history best illustrates which feature of South Asia in the period?
    options:
      - "The complete replacement of Hinduism by Islam"
      - "The absence of any Muslim presence south of Delhi"
      - "The fluid interaction of Muslim and Hindu political and religious worlds, with Hindu states persisting alongside Muslim rule"
      - "The unification of all India under one ruler"
    option_explanations:
      - |
        Hinduism remained the majority faith; Vijayanagara itself was a Hindu power.
      - |
        The founders' service to Delhi shows Muslim power reaching into the south.
      - |
        Correct. Elites moved between the two worlds, and a Hindu kingdom rose to check Muslim expansion southward.
      - |
        India stayed divided among Delhi, Vijayanagara, the Rajputs and others.
    answer: 2
    explanation: |
      Topic 1.3: religious and political pluralism in South Asia.

  - slug: apworld-u01-exam-q19
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Aztec human sacrifice is best understood by historians as
    options:
      - "a practice with no connection to politics"
      - "a Spanish invention to justify conquest"
      - "a form of tax paid in cacao"
      - "a religious duty to sustain the sun that also gave warfare a sacred purpose and intimidated subject peoples"
    option_explanations:
      - |
        Sacrifice shaped war, tribute and the fear of subject city-states; it was deeply political.
      - |
        Aztec sources and archaeology confirm the practice; the Spanish exaggerated numbers but did not invent it.
      - |
        Sacrifice was of people, mostly war captives, not a goods payment.
      - |
        Correct. Captives fed the gods, so war was holy; the terror it produced helped the Spanish find allies in 1519.
    answer: 3
