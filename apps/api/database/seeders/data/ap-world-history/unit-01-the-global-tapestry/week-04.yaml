    # ---- Short answers (SAQ style)
    - slug: apworld-u01-w04-q19
      type: short_answer
      topic_code: "1.7"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE similarity in how states in two different regions used religion to support their rule in the period c. 1200 to c. 1450.
        (b) Identify ONE difference in how states in two different regions were administered in the same period.
        (c) Explain ONE reason for the difference you identified in (b).
      answer: |
        (a) Both Mali's mansas and European kings used a universal religion for legitimacy and for literate officials: Mali's rulers presented themselves as Muslim sovereigns and employed Muslim scribes, while European kings were anointed by the Church and governed with clergy.
        (b) Song China was administered by a salaried bureaucracy chosen by examination and rotated among provinces, whereas feudal Europe c. 1200 was administered locally by lords who held land in return for service and whose consent kings needed.
        (c) China had an ancient tradition of unified imperial rule, dense agriculture that could be taxed to pay officials, and printing that spread a common curriculum; Europe had been fragmented since Rome, had little money revenue, and so paid its warriors in land, which made them independent.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific similarity with two named states from different regions. Zero for two states in the same region or a vague "both used religion".

        (b) 1 pt: a specific administrative difference with two named states from different regions (bureaucracy versus feudal lords; direct rule versus tribute; city-state versus empire).

        (c) 1 pt: a cause for that difference: economy, geography, prior history, technology. Zero for restating the difference.

    - slug: apworld-u01-w04-q20
      type: short_answer
      topic_code: "1.7"
      source: "Primary sources: Marco Polo, The Travels of Marco Polo, Book II ch. 24 (Yule–Cordier edition, 1903), Wikisource; Magna Carta (1215), Avalon Project"
      points: 3
      stimulus: |
        Source 1: "And nobody, however important he may think himself, dares to refuse them on pain of death. And indeed everybody takes them readily, for wheresoever a person may go throughout the Great Kaan's dominions he shall find these pieces of paper current."
        — Marco Polo on the Great Khan's paper money, *The Travels of Marco Polo*, Book II, chapter 24 (Yule–Cordier edition, 1903)

        Source 2: "No scutage not aid shall be imposed on our kingdom, unless by common counsel of our kingdom."
        — Magna Carta, clause 12, 1215 (Avalon Project text)
      prompt: |
        Using the two sources, answer (a), (b) and (c).

        (a) Describe ONE difference between the state power shown in Source 1 and in Source 2.
        (b) Explain ONE reason for that difference, drawing on the history of the two regions.
        (c) Explain ONE limitation of using either source as evidence about how its state actually worked.
      answer: |
        (a) Source 1 shows a ruler able to impose a currency across a vast territory by command, backed by the death penalty; Source 2 shows a king who could not levy a tax without the consent of his kingdom's great men.
        (b) China had a centuries-old centralised bureaucracy and a monetised commercial economy that a conqueror could take over, whereas England's king depended on feudal lords for soldiers and money and had just lost a war, which gave the barons leverage to impose limits.
        (c) Polo wrote to astonish European readers and may have exaggerated the Khan's power and the money's acceptance (Yuan paper money in fact suffered inflation); Magna Carta records what the barons demanded in a moment of weakness, not how the king behaved afterwards (John repudiated it within months), so neither shows everyday practice.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a difference grounded in both sources: command versus consent; scope of authority; enforcement by death versus negotiation.

        (b) 1 pt: a historical reason: China's bureaucratic tradition and commercial economy; England's feudal dependence and John's defeats. Must draw on the regions' history, not only the texts.

        (c) 1 pt: a limitation tied to purpose, audience or situation: Polo's wish to impress; the charter as a demand rather than a description; later inflation or John's repudiation. Zero for "sources can be biased".

    # ---- Long essay (LEQ style)
    - slug: apworld-u01-w04-q21
      type: long_answer
      topic_code: "1.7"
      source: "general knowledge"
      points: 6
      prompt: |
        Develop an argument that compares the methods used by two states in different regions to maintain control over their territories in the period c. 1200 to c. 1450, and evaluates the extent to which those methods were similar.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (comparison, causation, or continuity and change).
      answer: |
        Thesis (example using Song China and the Mali Empire): Both depended on a literate religious-philosophical elite and on taxing a productive economy, but China governed through a centralised examined bureaucracy while Mali ruled a looser empire through provincial governors, cavalry and control of trade routes; the difference is explained by China's dense agriculture and ancient state tradition against Mali's dispersed population and recent formation.

        Context: both faced nomadic or desert neighbours; both were tied into long-distance trade (Silk Roads and Indian Ocean; trans-Saharan routes); both inherited institutions from predecessors (Tang; Ghana).

        Point 1 (ideology and officials): Confucian examinations and the scholar-gentry versus Islamic scholarship, Muslim scribes and judges at court, with villages keeping local religion.

        Point 2 (administration): salaried officials rotated by the court, the Grand Canal and census records versus governors, tributary kings and the mansa's cavalry; safe roads admired by Ibn Battuta.

        Point 3 (revenue): land tax, state monopolies and paper money versus tolls on gold and salt and tribute in kind.

        Complexity: both methods had limits: China fell to the Mongols in 1279 (though its institutions survived), and Mali lost provinces to Songhai in the 1400s as trade routes shifted; similarity in purpose, difference in means, and change over time in both.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): names two states from different regions and makes an evaluative claim about the extent of similarity with a line of reasoning. Zero for "they were similar in some ways and different in others".

        Contextualization (0–1): relevant broader context for both states (trade networks, predecessor states, neighbours, religion's spread). Must be developed.

        Evidence (0–2): 1 pt for two or more specific examples from the chosen states (e.g. examinations, scholar-gentry, Grand Canal, paper money; Sundiata, Mansa Musa, Timbuktu, governors, gold-salt tolls; or the equivalent for other pairs such as Inca and Aztec, Delhi and Mali, Kilwa and Venice). 2 pts when evidence is used to support the comparison.

        Analysis and reasoning (0–2): 1 pt for sustained comparison organised by points of comparison. 1 pt for complexity: explaining why the methods differed, weighing similarities against differences, or tracing change over time in both states.

        Common errors: choosing two states from the same region; describing each state in turn without linking sentences; leaving out the reason for the difference; inventing institutions (an Inca examination system, Mali paper money).
