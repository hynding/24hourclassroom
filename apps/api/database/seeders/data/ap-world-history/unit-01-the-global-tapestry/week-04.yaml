week: 4
unit: 1
title: "Comparing State-Building, c. 1200–1450"
topics: ["1.7"]
guide: guides/week-04.md
guide_description: |
  The unit's capstone: how rulers in six regions gained and kept power (bureaucracy and law, military elites,
  religious legitimacy, trade and tribute), why some regions produced empires and others city-states or feudal
  lordships, the continuities and changes across c. 1200–1450, and a full sketch of a comparison LEQ built for
  topic 1.7.
flashcards_description: |
  26 cards that pair states across regions and name the reasons for their similarities and differences, the raw
  material for comparison questions on the unit exam.

flashcards:
  - front: Four tools rulers used to build states, c. 1200–1450 → list them
    back: |
      Bureaucracy and law; military elites rewarded with land, plunder or tribute; religion as legitimacy; and revenue from trade, taxes or tribute. Every state mixed them differently, and the mix explains its form.
    topic_code: "1.7"
  - front: Legitimacy → definition and five sources
    back: |
      The accepted right to rule. Sources in this period: religion (Mandate of Heaven, Islam, Solomonic descent, son of the sun), tradition and dynasty, law (Magna Carta's king under law), conquest, and service to the community (justice, safe roads).
    topic_code: "1.7"
  - front: Centralised versus decentralised states → examples of each
    back: |
      Centralised: Song China (examined bureaucracy), the Inca (governors, roads, storehouses). Decentralised: feudal Europe c. 1200, Japan under the shogunate, the Hausa and Swahili city-states. Dar al-Islam was a shared culture with no shared ruler.
    topic_code: "1.7"
  - front: Why city-states rather than empires on the Swahili coast and in the Hausa lands
    back: |
      Wealth came from trade concentrated in ports and market towns; there was no need or means to govern a large hinterland, and rival towns competed rather than uniting. Compare the Italian merchant republics.
    topic_code: "1.7"
  - front: Why the Aztecs ruled by tribute rather than direct administration
    back: |
      The Valley of Mexico already held many city-states with their own rulers and markets; it was cheaper to defeat them and demand goods than to replace their governments. The result was a resentful tributary network.
    topic_code: "1.7"
  - front: Why the Inca administered directly
    back: |
      The Andes had little market exchange, so the state itself organised production and redistribution through the mit'a and storehouses; roads, resettlement and Quechua made direct rule possible across a vertical landscape.
    topic_code: "1.7"
  - front: Compare Song China and the Inca on administration
    back: |
      Both were centralised with provincial officials and state infrastructure (Grand Canal; Andean roads). China ran on writing, examinations and paper money; the Inca ran on quipu, labour service and storehouses, without writing or money.
    topic_code: "1.7"
  - front: Compare Song China and feudal Europe on where power lay
    back: |
      In China power lay with the emperor and salaried officials rotated to prevent local bases; in Europe c. 1200 it lay with lords holding land and private armies, and kings had to bargain, as Magna Carta shows.
    topic_code: "1.7"
  - front: Compare the Delhi Sultanate and the Mali Empire on religion
    back: |
      Both were Muslim ruling elites over non-Muslim majorities (Hindu India; West African villages keeping local religions). Both used Islam for legitimacy and officials; both spread it mainly through Sufis and merchants rather than forced conversion.
    topic_code: "1.7"
  - front: Compare Ethiopia and medieval Europe on religion and the state
    back: |
      Both were Christian monarchies in which the Church and the crown reinforced each other; Ethiopia's kings claimed Solomonic descent and ruled a highland kingdom, European kings were anointed by a Church that was a rival power as well as a support.
    topic_code: "1.7"
  - front: Compare sea-based states across regions
    back: |
      Srivijaya, Majapahit and Malacca in Southeast Asia; Kilwa and Mombasa in East Africa; Venice and Genoa in Europe. All taxed and supplied long-distance sea trade, were run by merchant elites and held little territory.
    topic_code: "1.7"
  - front: Compare land-based agrarian states across regions
    back: |
      Song China, the Khmer, the Delhi Sultanate, the Inca and European manors all rested on taxing or commanding farmers. Their size depended on how well they could move grain and officials: canals (China), reservoirs (Angkor), roads (Inca).
    topic_code: "1.7"
  - front: Compare how military elites were rewarded
    back: |
      European knights received fiefs; Islamic states gave Turkic soldiers land grants or plunder; the Mamluks became the ruling class; Aztec warriors received tribute and status from captives; Japanese samurai held land under lords. Every state had to pay its soldiers somehow.
    topic_code: "1.7"
  - front: Compare the Catholic Church and the ulama as checks on rulers
    back: |
      Both were religious institutions outside the ruler's direct control that could judge his legitimacy. The Church was a single hierarchy under the pope with its own courts and taxes; the ulama were scholars whose authority rested on learning, not an organisation.
    topic_code: "1.7"
  - front: Compare how Islam and Christianity spread, c. 1200–1450
    back: |
      Islam spread outward by merchants, Sufis and conquest into Africa, South and Southeast Asia; Christianity in this period mainly consolidated within Europe and Ethiopia, spreading by crusade in Iberia and the Baltic rather than by trade.
    topic_code: "1.7"
  - front: Compare Bhakti, Sufism and lay piety in Europe
    back: |
      All three were devotional movements that offered ordinary people direct access to the divine outside clerical elites and often in local languages. They show a cross-regional pattern of religious change from below in this period.
    topic_code: "1.7"
  - front: Compare Neo-Confucianism and Scholasticism
    back: |
      Both were elite philosophical syntheses that absorbed another tradition (Buddhism; Aristotle via Arabic) while defending an established orthodoxy, and both were taught in state or Church institutions that trained officials.
    topic_code: "1.7"
  - front: Continuities across Unit 1 → four to remember
    back: |
      Confucian government in China survived the Mongols; Islamic law and scholarship survived the loss of Baghdad; Hinduism stayed India's majority faith under Muslim rulers; the Catholic Church spanned Europe throughout.
    topic_code: "1.7"
  - front: Changes across Unit 1 → five to remember
    back: |
      Turkic rulers replaced Arabs in the Islamic heartland; Islam reached Southeast Asia and West Africa's courts; European monarchies grew and western serfdom weakened; the Aztec and Inca empires rose after 1400; Angkor, Srivijaya and Cahokia declined.
    topic_code: "1.7"
  - front: Marco Polo and Magna Carta side by side → what the pairing shows
    back: |
      Polo's Khan could force paper money on a continent; John's barons could stop a tax. Together they frame the contrast between a centralised Asian state and a negotiated European one, with the caution that each source had a purpose (to astonish; to protect barons).
    topic_code: "1.7"
  - front: Comparison LEQ → the three moves the rubric rewards
    back: |
      An evaluative claim (not just similar and different); organisation by point of comparison rather than by state; and an explanation of why the difference exists (geography, economy, prior history).
    topic_code: "1.7"
  - front: Comparison LEQ → how to earn the complexity point
    back: |
      Weigh similarities against differences, show change over time in the comparison, or explain limits of both methods (China fell to the Mongols; Mali fragmented). Sustain it across the essay, not in one sentence.
    topic_code: "1.7"
  - front: Error-spotting → "Europe was the most advanced region in 1200"
    back: |
      Wrong for this period. Europe was the least centralised and least commercialised of the six regions, with weak kings and a manorial economy; Song China and Dar al-Islam led in trade, cities and learning.
    topic_code: "1.7"
  - front: Error-spotting → "Religion worked the same way in every state"
    back: |
      Rulers everywhere claimed religious sanction, but the religion's institutions differed: a papacy that could excommunicate a king, scholars who could only disapprove, or a priesthood that served the ruler (Aztec, Inca).
    topic_code: "1.7"
  - front: Error-spotting → "Trade states were weaker than agrarian empires"
    back: |
      Not necessarily. Malacca, Kilwa and Venice were rich and durable; but they were small, dependent on routes that could shift, and vulnerable to naval powers, as the Portuguese would show after 1500.
    topic_code: "1.7"
  - front: Which reasoning process? "Explain why the Inca and Aztec ruled differently"
    back: |
      Comparison supported by causation: identify the difference (labour versus tribute) and then the cause (Andean storehouse economy versus Mesoamerican markets and existing city-states).
    topic_code: "1.7"

quiz:
  description: |
    21 questions · about 35 minutes · on topic 1.7 (comparison across c. 1200–1450), which by its nature reviews
    every topic of weeks 1 to 3. Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: a comparison table (1.7)
    - slug: apworld-u01-w04-q01
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course comparing four states around 1350.

        | State | Main revenue | Who staffed the government | Religious basis of rule |
        |---|---|---|---|
        | Yuan China (Mongol successor to the Song) | Land tax, paper money, trade | Examined scholars (reduced under the Mongols), foreign officials | Mandate of Heaven; Buddhism favoured |
        | Mali Empire | Tolls on gold and salt caravans | Governors, Muslim scribes, cavalry | Islam at court; local religion in villages |
        | Kingdom of France | Feudal dues, royal domain, emerging taxes | Clergy, nobles, a small royal court | Christian kingship anointed by the Church |
        | Kilwa (Swahili city-state) | Customs on Indian Ocean trade | A sultan and merchant families | Islam |
      prompt: |
        Which conclusion about state-building is best supported by the table?
      options:
        - "All four states relied on the same source of revenue"
        - "The source of revenue was linked to the kind of officials a state needed: taxing farmers required bureaucrats, taxing trade required ports and merchants"
        - "Only Christian states used religion to justify rule"
        - "Kilwa governed the largest territory of the four"
      option_explanations:
        - |
          The table shows four different revenue bases: land tax, caravan tolls, feudal dues and customs.
        - |
          Correct. China's land tax needed scholars and records; Mali's and Kilwa's trade revenue needed control of routes and merchants; France's feudal dues needed nobles.
        - |
          Every row names a religious basis; Islam and the Mandate of Heaven served as well as Christian anointing.
        - |
          Kilwa was a single city with a small hinterland; China, Mali and France all ruled far more land.
      answer: 1
      explanation: |
        Skill: comparison from a data stimulus. Link the columns to each other.

    - slug: apworld-u01-w04-q02
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course comparing four states around 1350.

        | State | Main revenue | Who staffed the government | Religious basis of rule |
        |---|---|---|---|
        | Yuan China (Mongol successor to the Song) | Land tax, paper money, trade | Examined scholars (reduced under the Mongols), foreign officials | Mandate of Heaven; Buddhism favoured |
        | Mali Empire | Tolls on gold and salt caravans | Governors, Muslim scribes, cavalry | Islam at court; local religion in villages |
        | Kingdom of France | Feudal dues, royal domain, emerging taxes | Clergy, nobles, a small royal court | Christian kingship anointed by the Church |
        | Kilwa (Swahili city-state) | Customs on Indian Ocean trade | A sultan and merchant families | Islam |
      prompt: |
        The entry for the Kingdom of France ("a small royal court", "emerging taxes") best reflects which development described in the CED?
      options:
        - "The completion of a centralised bureaucracy modelled on China's"
        - "The dominance of merchant republics over kings"
        - "The early stage of growing royal power in a still-feudal Europe"
        - "The abolition of the Church's political role"
      option_explanations:
        - |
          France had nothing like China's examined bureaucracy; its royal administration was small and new.
        - |
          Merchant republics flourished in Italy, but in France the king, not the towns, was gaining.
        - |
          Correct. By 1350 French kings were building taxes and courts, but nobles and clergy still staffed government and feudal dues still mattered.
        - |
          Clergy appear in the table as royal officials; the Church's role was growing with the state, not ending.
      answer: 2
      explanation: |
        Skill: placing a region on a continuum of centralisation.

    - slug: apworld-u01-w04-q03
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course comparing four states around 1350.

        | State | Main revenue | Who staffed the government | Religious basis of rule |
        |---|---|---|---|
        | Yuan China (Mongol successor to the Song) | Land tax, paper money, trade | Examined scholars (reduced under the Mongols), foreign officials | Mandate of Heaven; Buddhism favoured |
        | Mali Empire | Tolls on gold and salt caravans | Governors, Muslim scribes, cavalry | Islam at court; local religion in villages |
        | Kingdom of France | Feudal dues, royal domain, emerging taxes | Clergy, nobles, a small royal court | Christian kingship anointed by the Church |
        | Kilwa (Swahili city-state) | Customs on Indian Ocean trade | A sultan and merchant families | Islam |
      prompt: |
        Which similarity between Mali and Kilwa does the table most directly support?
      options:
        - "Both were ruled by Christian kings"
        - "Both depended on taxing long-distance trade and both had Muslim rulers"
        - "Both were governed by examined scholar-officials"
        - "Both were tributaries of Yuan China"
      option_explanations:
        - |
          Both rows list Islam as the religious basis of rule.
        - |
          Correct. Caravan tolls and customs duties are both trade revenue, and both rulers were Muslim, which connected them to the merchants they taxed.
        - |
          Examined scholars appear only in the China row.
        - |
          Neither African state had any relationship with the Yuan court.
      answer: 1
      explanation: |
        Skill: identifying a cross-regional similarity and its basis.

    # ---- Stimulus set B: an interpretation written for this course (1.7)
    - slug: apworld-u01-w04-q04
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge; interpretation written for this course"
      points: 1
      stimulus: |
        A historian writing for this course argues: "Between 1200 and 1450 the most durable states were those that could pay their soldiers and officials from a renewable source of revenue. Where that source was farmland, as in China and the Andes, rulers built bureaucracies and roads to reach the farmers. Where it was a trade route, as in Mali or on the Swahili coast, rulers built ports and caravan towns and left the countryside largely alone. Where it was neither, as in much of Europe, rulers paid in land and lived with the independence that land gave their vassals."
      prompt: |
        The historian's argument would be best supported by which piece of evidence?
      options:
        - "The Inca mit'a, which drew labour from every village and fed it from state storehouses"
        - "The Bhakti movement's use of local languages"
        - "The Aztec practice of human sacrifice"
        - "The rock-cut churches of Lalibela"
      option_explanations:
        - |
          Correct. The mit'a is a state reaching farmers directly to extract a renewable resource (labour), exactly the pattern the historian describes for agrarian states.
        - |
          Bhakti concerns religious change, not revenue and administration.
        - |
          Sacrifice concerns religion and war; it is not evidence about revenue and officials.
        - |
          The churches show Ethiopian Christianity and royal patronage, not the link between revenue and administration.
      answer: 0
      explanation: |
        Skill: matching evidence to an argument.

    - slug: apworld-u01-w04-q05
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge; interpretation written for this course"
      points: 1
      stimulus: |
        A historian writing for this course argues: "Between 1200 and 1450 the most durable states were those that could pay their soldiers and officials from a renewable source of revenue. Where that source was farmland, as in China and the Andes, rulers built bureaucracies and roads to reach the farmers. Where it was a trade route, as in Mali or on the Swahili coast, rulers built ports and caravan towns and left the countryside largely alone. Where it was neither, as in much of Europe, rulers paid in land and lived with the independence that land gave their vassals."
      prompt: |
        Which of the following would most directly challenge the historian's claim about Europe?
      options:
        - "Evidence that European kings had no armies at all"
        - "Evidence that by 1450 English and French kings had built regular taxes and paid armies, reducing their dependence on land grants"
        - "Evidence that the Church owned land"
        - "Evidence that Mali also used cavalry"
      option_explanations:
        - |
          Kings had armies; the question is how they paid them, and this option does not address that.
        - |
          Correct. If European monarchies had found renewable revenue by 1450, the claim that Europe's rulers were stuck paying in land needs qualifying.
        - |
          Church landholding is consistent with, not contrary to, the claim that land was the main currency of power.
        - |
          Mali's cavalry has nothing to do with the claim about Europe.
      answer: 1
      explanation: |
        Skill: evaluating an argument with counter-evidence; the change in Europe by 1450 is the key.

    - slug: apworld-u01-w04-q06
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge; interpretation written for this course"
      points: 1
      stimulus: |
        A historian writing for this course argues: "Between 1200 and 1450 the most durable states were those that could pay their soldiers and officials from a renewable source of revenue. Where that source was farmland, as in China and the Andes, rulers built bureaucracies and roads to reach the farmers. Where it was a trade route, as in Mali or on the Swahili coast, rulers built ports and caravan towns and left the countryside largely alone. Where it was neither, as in much of Europe, rulers paid in land and lived with the independence that land gave their vassals."
      prompt: |
        The historian's explanation for the differences among states relies mainly on which type of factor?
      options:
        - "Religious belief"
        - "Individual rulers' personalities"
        - "Climate change"
        - "Economic base and revenue"
      option_explanations:
        - |
          Religion is not mentioned; the passage explains forms of rule by how they were paid for.
        - |
          No ruler is named; the explanation is structural, not personal.
        - |
          Climate is not part of the argument; environment appears only as farmland versus trade route.
        - |
          Correct. The argument runs from source of revenue (farmland, trade route, neither) to form of government.
      answer: 3
      explanation: |
        Skill: identifying the type of causation an interpretation uses.

    # ---- Stand-alone comparison items
    - slug: apworld-u01-w04-q07
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Song China and the Inca Empire were similar in that both
      options:
        - "used a civil service examination to select officials"
        - "were centralised states with provincial officials and large infrastructure projects"
        - "relied on paper money"
        - "were ruled by Muslim sultans"
      option_explanations:
        - |
          Only China examined its officials; the Inca had no writing and chose officials from the nobility.
        - |
          Correct. Both reached their provinces through appointed officials and state-built systems: the Grand Canal and roads in China, the Andean road and storehouse network for the Inca.
        - |
          The Inca used no money of any kind; goods moved through state storehouses and labour service.
        - |
          Neither was Muslim; China's emperors claimed the Mandate of Heaven and the Inca ruler was son of the sun.
      answer: 1
      explanation: |
        Comparison across regions on administration (review of 1.1 and 1.4).

    - slug: apworld-u01-w04-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which best explains why Dar al-Islam remained culturally unified after 1258 even though it was politically divided?
      options:
        - "A single caliph continued to rule from Cairo with full political power"
        - "The Mongols imposed a uniform legal code on all Muslim lands"
        - "Muslims were forbidden to travel between states"
        - "Shared sharia law, Arabic scholarship and networks of merchants and Sufis connected its regions regardless of who ruled them"
      option_explanations:
        - |
          The Mamluks kept a shadow caliph in Cairo with no political power.
        - |
          The Mongols ruled only part of the Islamic world and followed their own law code alongside local ones.
        - |
          Travel for pilgrimage, trade and study was constant, as Ibn Battuta's career shows.
        - |
          Correct. Law, learning and trade made a jurist like Ibn Battuta employable from Morocco to the Maldives.
      answer: 3
      explanation: |
        Review of 1.2 framed as a comparison between political and cultural unity.

    - slug: apworld-u01-w04-q09
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The Khmer Empire and the Mali Empire differed most clearly in that
      options:
        - "the Khmer lived by irrigated rice and temple-building inland, whereas Mali lived by taxing caravan trade across a desert"
        - "the Khmer were Muslim while Mali was Hindu"
        - "Mali had no cities while the Khmer had many"
        - "the Khmer were a sea-based state while Mali was on the Indian Ocean"
      option_explanations:
        - |
          Correct. Angkor's reservoirs fed a rice state; Mali's wealth came from tolls on gold and salt crossing the Sahara.
        - |
          The reverse: the Khmer were Hindu then Buddhist, and Mali's rulers were Muslim.
        - |
          Mali had Timbuktu, Gao and Niani among others.
        - |
          The Khmer were land-based and Mali lay in the Sahel, far from any ocean.
      answer: 0
      explanation: |
        Comparison of economic bases across regions (review of 1.3 and 1.5).

    - slug: apworld-u01-w04-q10
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best compares the role of the Catholic Church in Europe with the role of Islamic scholars (the ulama) in Dar al-Islam?
      options:
        - "Both were organised as single hierarchies under one leader with their own courts and taxes"
        - "Neither had any influence over rulers"
        - "Both could judge a ruler's legitimacy, but the Church was a centralised institution under the pope while the ulama's authority rested on learning rather than organisation"
        - "Both were abolished by secular rulers before 1450"
      option_explanations:
        - |
          Only the Church was a single hierarchy; the ulama had no pope and no central organisation.
        - |
          Both shaped law, education and the legitimacy of rulers.
        - |
          Correct. A pope could excommunicate a king; scholars could withhold approval, but through reputation and teaching, not an institution.
        - |
          Both survived the period and long after.
      answer: 2
      explanation: |
        Comparison of religious institutions across regions (review of 1.2 and 1.6).

    - slug: apworld-u01-w04-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which pair of states best illustrates the CED's contrast between a tribute network and direct administration?
      options:
        - "The Aztec Triple Alliance and the Inca Empire"
        - "Kilwa and Mombasa"
        - "The Delhi Sultanate and the Mamluk Sultanate"
        - "France and England"
      option_explanations:
        - |
          Correct. The Aztecs collected tribute from subject rulers left in place; the Inca resettled peoples and governed through officials, roads and storehouses.
        - |
          Both were Swahili city-states of the same type.
        - |
          Both were Turkic sultanates with similar methods.
        - |
          Both were feudal monarchies growing stronger in similar ways.
      answer: 0
      explanation: |
        Comparison within the Americas (review of 1.4).

    - slug: apworld-u01-w04-q12
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        The Swahili city-states and the Italian city-states of Venice and Genoa were alike in all of the following ways EXCEPT that
      options:
        - "both were enriched by long-distance maritime trade"
        - "both were governed by merchant elites rather than large bureaucracies"
        - "both held little territory beyond the city itself"
        - "both were Muslim and tied to the Indian Ocean monsoon"
      option_explanations:
        - |
          This is a true similarity: both lived by sea trade.
        - |
          This is a true similarity: merchant families dominated both.
        - |
          This is a true similarity: neither ruled a large hinterland.
        - |
          Correct (the exception). The Swahili towns were Muslim and on the Indian Ocean; Venice and Genoa were Christian and on the Mediterranean.
      answer: 3
      explanation: |
        Comparison of sea-based states across regions (review of 1.5 and 1.6).

    # ---- Select all
    - slug: apworld-u01-w04-q13
      type: multi_select
      topic_code: "1.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following were continuities across the period c. 1200 to c. 1450? Select all that apply.
      options:
        - "Confucian ideas of government in China survived the Mongol conquest"
        - "Hinduism remained the majority religion of South Asia under the Delhi Sultanate"
        - "The Catholic Church spanned Europe throughout the period"
        - "The Abbasid caliph ruled all Muslims from Baghdad throughout the period"
        - "Islamic law and scholarship continued after the fall of Baghdad"
      option_explanations:
        - |
          Correct. The Yuan kept Chinese institutions, and the Ming restored the examinations fully.
        - |
          Correct. Conversion was slow and partial; most Indians stayed Hindu.
        - |
          Correct. No other institution reached across Latin Christendom.
        - |
          The caliphate was a shadow before 1258 and destroyed in that year; this is a change, not a continuity.
        - |
          Correct. Cairo, Damascus and Timbuktu carried on the tradition.
      answer: [0, 1, 2, 4]
      explanation: |
        Skill: continuity and change across the unit.

    - slug: apworld-u01-w04-q14
      type: multi_select
      topic_code: "1.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following rulers or states claimed a religious basis for their authority? Select all that apply.
      options:
        - "Chinese emperors, through the Mandate of Heaven"
        - "The Inca ruler, as a son of the sun"
        - "Ethiopia's Solomonic kings, through descent from Solomon"
        - "European kings, through anointing by the Church"
        - "The sultans of Delhi, as defenders of Islam"
      option_explanations:
        - |
          Correct. Heaven's mandate justified the dynasty and could be lost through misrule.
        - |
          Correct. Inca religion made the ruler divine and kept royal mummies as living presences.
        - |
          Correct. The Solomonic claim, restored in 1270, tied the dynasty to biblical kingship.
        - |
          Correct. Coronation by bishops made kingship a sacred office.
        - |
          Correct. Muslim sultans ruled as protectors of the faith over a Hindu majority.
      answer: [0, 1, 2, 3, 4]
      explanation: |
        Every option is correct: religious legitimacy was universal; what differed was its institutions.

    # ---- True / false
    - slug: apworld-u01-w04-q15
      type: true_false
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In the period c. 1200 to c. 1450, Western Europe was the most centralised and commercialised of the world's major regions.
      answer: false
      explanation: |
        False. Europe was the least centralised (feudal lords, weak kings) and least commercialised (manorial economy) of the six regions studied; Song China and Dar al-Islam led in trade, cities and learning. Europe's monarchies were only beginning to grow by 1450.

    - slug: apworld-u01-w04-q16
      type: true_false
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In a comparison essay, organising paragraphs by point of comparison (for example, legitimacy, administration, revenue) rather than by state makes it easier to earn the analysis points.
      answer: true
      explanation: |
        True. Treating both states in each paragraph forces the comparison into every sentence and leaves room to explain why the difference exists, which is what the reasoning and complexity points reward. A paragraph on each state in turn tends to describe rather than compare.

