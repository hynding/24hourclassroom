    # ---- Short answer
    - slug: apworld-u02-w07-q22
      type: short_answer
      topic_code: "2.6"
      source: "Primary source: Giovanni Boccaccio, The Decameron, Introduction to the First Day (trans. J. M. Rigg, 1903), Project Gutenberg; Ibn Battuta described, not quoted"
      points: 3
      prompt: |
        Boccaccio wrote of Florence in 1348 that "brother was forsaken by brother, nephew by uncle, brother by sister, and oftentimes husband by wife" (The Decameron, trans. J. M. Rigg, 1903). Ibn Battuta, in Damascus the same year, described Muslims, Jews and Christians fasting and praying together for relief from the plague.

        (a) Identify ONE way the Black Death reached both cities in 1348.
        (b) Explain ONE difference in the social responses the two sources describe.
        (c) Explain ONE limitation of using Boccaccio's account as evidence for the plague's effects.
      answer: |
        (a) 1 point: the plague travelled along the Silk Roads under the Mongols to the Black Sea, then by Genoese and other ships through the Mediterranean (Sicily and Italy; Alexandria and Syria); both cities were linked by sea trade to the same ports.
        (b) 1 point for a stated difference with reasoning: Boccaccio shows social bonds breaking (flight, abandonment of family), Ibn Battuta shows communal religious response across faiths; possible reasons include Boccaccio's literary purpose of explaining his characters' flight, differing religious teachings on plague as divine will, or the fact that both responses occurred in both places and each author chose what to record.
        (c) 1 point: Boccaccio was a literary author framing a story collection; his death toll is a round estimate; he describes the elite's experience; he wrote after the fact; he may exaggerate for effect.
      explanation: |
        Scoring: one point per part. (b) requires a difference and a reason or implication; (c) requires a specific limitation connected to the source's nature, not a generic "it is biased".

    - slug: apworld-u02-w07-q23
      type: short_answer
      topic_code: "2.7"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE similarity in the effects of the Silk Roads and the trans-Saharan trade routes in the period c. 1200 to c. 1450.
        (b) Explain ONE difference in the causes of growth of the Indian Ocean network and the Silk Roads.
        (c) Explain ONE way the environmental consequences of connectivity differed from the cultural consequences in this period.
      answer: |
        (a) 1 point: both spread Islam (Central Asia and the Sahel); both produced trading cities (Samarkand, Kashgar; Timbuktu, Djenné); both transferred knowledge (Islamic learning); both enriched states that taxed them (khanates; Mali).
        (b) 1 point with explanation: the Indian Ocean grew on maritime technology (monsoon knowledge, lateen sail, compass, astrolabe, junks) and on port states that protected merchants, while the Silk Roads grew on Mongol political unification and land technologies (saddles, caravanserais, credit); or the ocean's capacity for bulk goods versus the overland limit to luxuries.
        (c) 1 point with explanation: environmental effects (crop diffusion, the Black Death) changed populations and landscapes and were largely unintended, while cultural effects (religious syncretism, literary and scientific transfer) changed beliefs and were often carried deliberately by missionaries, scholars and converts; or the plague's effect was destructive while cultural diffusion was additive.
      explanation: |
        Scoring: one point per part. (b) and (c) require explanation, meaning a reason for the difference or a statement of its consequence.

    # ---- Long answer
    - slug: apworld-u02-w07-q24
      type: long_answer
      topic_code: "2.5"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which increased connectivity in the period c. 1200 to c. 1450 changed cultures in Afro-Eurasia.

        Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both continuity and change.
      answer: |
        Thesis (1 point): a defensible claim about degree, for example that connectivity changed religious geography and the spread of knowledge substantially, while core traditions (Confucian government, Hindu caste, Christian feudal society) persisted and absorbed rather than surrendered to new influences.
        Contextualisation (1 point): the Mongol peace, Indian Ocean and trans-Saharan networks, the preceding spread of Islam and Buddhism, or Unit 1's regional states.
        Evidence (2 points): at least two specific examples, for example Islam in Malacca and Mali; Sufi syncretism; Neo-Confucianism in Korea, Japan and Vietnam; Greek and Islamic learning reaching Europe through Spain; Chinese motifs in Persian painting; the Great Mosque of Djenné; Ibn Battuta's judgeship in Delhi; the travellers' accounts; the rise of Timbuktu or decline of Baghdad.
        Analysis and reasoning (1 point): uses continuity and change to explain how cultural change occurred (merchants, Sufis, translation) and what persisted (local custom under Islam; Chinese models adapted not replaced).
        Complexity (1 point): weighs regions differently (more change in Southeast Asia and the Sahel than in China or Western Europe), connects cultural change to environmental or economic causes, or notes that the plague interrupted some exchanges while others continued.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. A listing of cultural changes without a judgement about extent cannot earn the thesis point.
