week: 7
unit: 2
title: "What Connection Did: Cultures, Crops, Cities and Plague"
topics: ["2.5", "2.6", "2.7"]
guide: guides/week-07.md
guide_description: |
  Study guide for week 7 (CED topics 2.5–2.7): the cultural, environmental and economic consequences of the three Unit 2 networks. Covers the diffusion of religions, knowledge and art; the rise and fall of cities; the travellers Ibn Battuta, Marco Polo and Margery Kempe; the spread of bananas, Champa rice, sugar and citrus; the Black Death; and a side-by-side comparison of the Silk Roads, Indian Ocean and trans-Saharan routes. Reads Boccaccio's account of the plague in Florence closely.
flashcards_description: |
  30 cards on topics 2.5–2.7: syncretism and the spread of Islam, Buddhism and Neo-Confucianism; technology and knowledge transfer; cities that rose and fell; the three named travellers; crop diffusions; the route and effects of the Black Death; and the comparison of the three networks.
flashcards:
  - front: Syncretism → definition and one example from each of two networks
    back: "The blending of religious or cultural traditions. Indian Ocean: Sufi Islam absorbing local custom in Sumatra and Java. Trans-Saharan: Mali's rulers Muslim while subjects mixed Islam with older practice, as Ibn Battuta complained in 1352."
    topic_code: "2.5"
  - front: How Islam spread along the three networks → the common mechanism
    back: Muslim merchants dominated all three routes and settled as diasporic communities; Sufi teachers followed; rulers (Malacca, Mali, Kilwa) adopted Islam to attract trade and legitimacy. Trade, not conquest, carried the faith.
    hint: Think about who was doing the trading.
    topic_code: "2.5"
  - front: Spread of Buddhism and Neo-Confucianism in this period → where each went
    back: Theravada Buddhism spread in mainland Southeast Asia (Burma, Siam, Cambodia) via monks and trade; Neo-Confucianism moved from Song China to Korea, Japan and Vietnam through the Chinese written language and the examination model.
    topic_code: "2.5"
  - front: Technology that moved west along the networks → four Chinese inventions
    back: Paper, printing, gunpowder and the magnetic compass reached the Islamic world and Europe, mostly along the Silk Roads under the Mongols; all four shaped Unit 3 (gunpowder empires) and Unit 4 (navigation, the printed Bible).
    topic_code: "2.5"
  - front: Knowledge that moved into Europe from Dar al-Islam → what and through where
    back: Greek philosophy in Arabic (Aristotle), Islamic mathematics (algebra, Hindu-Arabic numerals), astronomy and medicine, via Spain (Toledo) and Sicily, feeding the universities and Scholasticism.
    topic_code: "2.5"
  - front: Persian as a literary language → extent in this period
    back: From Anatolia through Persia and Central Asia to the Delhi Sultanate, Persian was the language of poetry, court chronicles and administration; Arabic stayed the language of law and science.
    topic_code: "2.5"
  - front: Artistic blending under the Mongols → an example
    back: Chinese motifs (dragons, clouds, landscape conventions) entered Persian manuscript painting under the Ilkhanate, because the khanates exchanged artisans and books.
    topic_code: "2.5"
  - front: Great Mosque of Djenné → what it shows about cultural exchange
    back: Islamic mosque form (courtyard, mihrab, minarets) built in West African mud brick with local wooden beams; Islam adapted to local materials and builders.
    topic_code: "2.5"
  - front: Hangzhou's rise → causes
    back: Southern Song capital on the Grand Canal and near the sea; trade, Champa rice surplus and the commercial revolution made it the largest city of the age, perhaps a million people (Polo's Kinsay).
    topic_code: "2.5"
  - front: Decline of Baghdad and Constantinople → causes compared
    back: "Baghdad: Mongol sack of 1258 and the collapse of Mesopotamian irrigation; learning shifted to Cairo. Constantinople: Venetian and Genoese merchants took its trade, Ottomans its hinterland; fell in 1453."
    topic_code: "2.5"
  - front: Cities that grew on each of the three networks → one example each
    back: "Silk Roads: Samarkand or Kashgar. Indian Ocean: Kilwa, Calicut or Malacca. Trans-Saharan: Timbuktu or Djenné."
    topic_code: "2.7"
  - front: Ibn Battuta's route (1325–1354) → the main stops in order
    back: Tangier → Mecca → Persia and Iraq → Swahili coast → Anatolia → Golden Horde → Delhi (judge) → Maldives → Ceylon → Sumatra → China → home → Spain → Mali. Dictated the Rihla in Fez.
    hint: He went east first, then home, then south across the Sahara.
    topic_code: "2.5"
  - front: Why Ibn Battuta's Rihla is valuable to historians → two reasons
    back: It covers nearly all of Dar al-Islam from one observer, letting us compare courts, ports and customs; and he records what a Muslim jurist found normal or shocking, so his judgements reveal shared Islamic norms.
    topic_code: "2.5"
  - front: Marco Polo's account of China → what it told Europe
    back: Paper money, coal as fuel, the Grand Canal, cities larger than any in Europe, the Mongol post and army; dictated in a Genoese prison c. 1298. Shaped European expectations of Asia down to Columbus.
    topic_code: "2.5"
  - front: Margery Kempe → who she was and why the CED names her
    back: English townswoman and mystic (c. 1373–after 1438) who dictated an account of her pilgrimages to Jerusalem, Rome and Santiago. Shows long-distance travel by a woman of means and that pilgrimage used trade's routes and ships.
    topic_code: "2.5"
  - front: Compare the three CED travellers → purpose of each journey
    back: "Ibn Battuta: pilgrimage, then scholarship and office within Dar al-Islam. Polo: trade and service to Kublai. Kempe: Christian pilgrimage. All three dictated their accounts; none wrote for historians."
    topic_code: "2.5"
  - front: Banana diffusion → origin, route, effect
    back: Domesticated in Southeast Asia; carried across the Indian Ocean to East Africa; spread through sub-Saharan forest zones, supporting denser settlement and Bantu-speaking expansion.
    topic_code: "2.6"
  - front: Champa rice's two agricultural advantages → and the demographic result
    back: Ripened in about sixty days and tolerated drought, allowing two harvests a year in southern China; fed the Song population boom behind the commercial revolution.
    topic_code: "2.6"
  - front: Sugar and citrus in the Mediterranean → who carried them and later consequence
    back: Muslim farmers brought sugar cane, citrus, cotton and irrigation techniques into Sicily, Spain and Egypt; sugar later became the Atlantic plantation crop of Unit 4.
    topic_code: "2.6"
  - front: Environmental cost of crop diffusion → examples
    back: Terracing and canals for rice, cleared forest for bananas, irrigation for sugar; each reshaped landscapes and brought new pests and soil strain.
    topic_code: "2.6"
  - front: Black Death's route and dates → trace it
    back: Central Asia in the 1330s → along Mongol routes → Black Sea ports (Kaffa) by 1346 → Constantinople, Alexandria, Sicily 1347 → Florence, Cairo, Damascus, Paris 1348 → England and Scandinavia 1349–1350.
    hint: It followed the Silk Roads, then the sea.
    topic_code: "2.6"
  - front: Why the Pax Mongolica caused the Black Death → the mechanism
    back: Mongol security and the yam moved merchants, soldiers and rodents quickly across Eurasia; fleas on rodents carried the plague bacterium from its Central Asian reservoir to the ports of the Black Sea and Mediterranean.
    topic_code: "2.6"
  - front: Demographic effects of the Black Death → scale by region
    back: Perhaps a third of Europe and the Middle East died; Cairo and Florence lost about half their people; China's losses were heavy but disputed. Recovery took over a century.
    topic_code: "2.6"
  - front: Economic and social effects of the Black Death in Western Europe → three
    back: Labour shortages raised wages and weakened serfdom; landlords and states tried to freeze wages, provoking revolts; survivors inherited wealth, changing consumption and investment.
    topic_code: "2.6"
  - front: Religious responses to the plague → Christian and Muslim examples
    back: "Christian Europe: penitential processions, flagellants, massacres of Jewish communities blamed for poisoning wells. Damascus (Ibn Battuta): Muslims, Jews and Christians fasting and praying together for relief."
    topic_code: "2.6"
  - front: Black Death and the end of the Pax Mongolica → the link
    back: Plague killed merchants and soldiers, emptied caravanserais and cities, and coincided with the fall of the Ilkhanate (1335) and the Yuan (1368); overland trade shrank while the monsoon routes continued.
    topic_code: "2.6"
  - front: Boccaccio's Decameron as a plague source → strengths and limits
    back: Eyewitness detail on symptoms (gavoccioli) and social breakdown (families abandoning each other); but a literary frame with a round death toll (over 100,000 in Florence) that is impression, not count.
    topic_code: "2.6"
  - front: Similar causes of growth across all three networks → three
    back: Rising demand for distant goods (luxuries, spices, gold, salt); new or improved transport technology (saddles, dhows, compass, camel saddle); state support and protection (Mongols, port sultans, Mali).
    topic_code: "2.7"
  - front: Similar effects across all three networks → four
    back: Trading cities grew; Islam (and other faiths) spread with merchants; technology and knowledge transferred; disease and crops moved. Each is a 2.5 or 2.6 topic.
    topic_code: "2.7"
  - front: Key differences among the three networks → goods and political control
    back: "Silk Roads: high-value luxuries, Mongol unity. Indian Ocean: bulk goods possible, no single power. Trans-Saharan: gold and salt necessities, enslaved people a major cargo, Mali's protection."
    topic_code: "2.7"
quiz:
  description: |
    Week 7 quiz on CED topics 2.5–2.7 with spiral review of Unit 1 and topics 2.1–2.4 · 24 questions · about 40 minutes. Stimulus sets use Boccaccio's Decameron (Rigg translation, 1903), a crop-diffusion table and a comparison of the three travellers. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Boccaccio on the plague (2.6)
    - slug: apworld-u02-w07-q01
      type: multiple_choice
      topic_code: "2.6"
      source: "Primary source: Giovanni Boccaccio, The Decameron, Introduction to the First Day (trans. J. M. Rigg, 1903), Project Gutenberg"
      points: 1
      stimulus: |
        "I say, then, that the years of the beatific incarnation of the Son of God had reached the tale of one thousand three hundred and forty-eight when in the illustrious city of Florence ... [the deadly pestilence arrived]. ... In men and women alike it first betrayed itself by the emergence of certain tumours in the groin or the armpits, some of which grew as large as a common apple, others as an egg, some more, some less, which the common folk called gavoccioli. ... Brother was forsaken by brother, nephew by uncle, brother by sister, and oftentimes husband by wife; nay, what is more, and scarcely to be believed, fathers and mothers were found to abandon their own children, untended, unvisited, to their fate, as if they had been strangers."

        Giovanni Boccaccio, The Decameron, Introduction to the First Day (1353), translated by J. M. Rigg, 1903
      prompt: |
        The disease Boccaccio describes most likely reached Florence in 1348 by way of
      options:
        - "Mongol armies besieging the city"
        - "maritime trade from the Black Sea through Mediterranean ports such as Sicily and Genoa"
        - "Portuguese ships returning from the Indian Ocean"
        - "pilgrims returning from Santiago de Compostela"
      option_explanations:
        - |
          No Mongol army ever reached Italy; the plague came by trade, not conquest.
        - |
          Correct. The plague moved from Central Asia along Mongol routes to Black Sea ports, then by ship to Sicily and the Italian ports in 1347.
        - |
          The Portuguese did not reach the Indian Ocean until 1498, a century and a half later.
        - |
          Santiago lay in Spain, which the plague reached after Italy, not before.
      answer: 1
      explanation: |
        The 1347 arrival at Messina and Genoa by Genoese ships from the Black Sea is the standard route; the Silk Roads carried it to the sea, and the sea carried it to Florence.

    - slug: apworld-u02-w07-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "Primary source: Giovanni Boccaccio, The Decameron, Introduction to the First Day (trans. J. M. Rigg, 1903), Project Gutenberg"
      points: 1
      stimulus: |
        "I say, then, that the years of the beatific incarnation of the Son of God had reached the tale of one thousand three hundred and forty-eight when in the illustrious city of Florence ... [the deadly pestilence arrived]. ... In men and women alike it first betrayed itself by the emergence of certain tumours in the groin or the armpits, some of which grew as large as a common apple, others as an egg, some more, some less, which the common folk called gavoccioli. ... Brother was forsaken by brother, nephew by uncle, brother by sister, and oftentimes husband by wife; nay, what is more, and scarcely to be believed, fathers and mothers were found to abandon their own children, untended, unvisited, to their fate, as if they had been strangers."

        Giovanni Boccaccio, The Decameron, Introduction to the First Day (1353), translated by J. M. Rigg, 1903
      prompt: |
        Boccaccio's description of families abandoning one another is best used by a historian as evidence of
      options:
        - "the exact mortality rate of the plague in Florence"
        - "the moral superiority of Italian cities over Islamic ones"
        - "the breakdown of social bonds under the pandemic's pressure"
        - "the success of Florentine quarantine measures"
      option_explanations:
        - |
          Boccaccio gives a round figure elsewhere, but this passage is about behaviour, not numbers, and his numbers are impressions.
        - |
          Nothing in the passage compares cities; Ibn Battuta describes Damascus praying together, which if anything contrasts.
        - |
          Correct. The passage is eyewitness testimony to the social effects of mass death, which is what it reliably shows.
        - |
          No quarantine measures appear; the passage describes failure to care, not public health.
      answer: 2
      explanation: |
        Sourcing: a literary author with a frame story to set up, but describing what he saw; use it for social response, not statistics.

    - slug: apworld-u02-w07-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "Primary source: Giovanni Boccaccio, The Decameron, Introduction to the First Day (trans. J. M. Rigg, 1903), Project Gutenberg"
      points: 1
      stimulus: |
        "I say, then, that the years of the beatific incarnation of the Son of God had reached the tale of one thousand three hundred and forty-eight when in the illustrious city of Florence ... [the deadly pestilence arrived]. ... In men and women alike it first betrayed itself by the emergence of certain tumours in the groin or the armpits, some of which grew as large as a common apple, others as an egg, some more, some less, which the common folk called gavoccioli. ... Brother was forsaken by brother, nephew by uncle, brother by sister, and oftentimes husband by wife; nay, what is more, and scarcely to be believed, fathers and mothers were found to abandon their own children, untended, unvisited, to their fate, as if they had been strangers."

        Giovanni Boccaccio, The Decameron, Introduction to the First Day (1353), translated by J. M. Rigg, 1903
      prompt: |
        Review. Which development of the preceding century most directly made the pandemic Boccaccio describes possible?
      options:
        - "The Mongol unification of the Silk Roads, which moved people and goods rapidly across Eurasia"
        - "The founding of the Delhi Sultanate"
        - "The signing of Magna Carta"
        - "The conversion of Malacca to Islam"
      option_explanations:
        - |
          Correct. The Pax Mongolica and the yam carried merchants and rodents from the plague's Central Asian reservoir to the Black Sea.
        - |
          The Delhi Sultanate ruled northern India and had no role in moving the plague west.
        - |
          An English charter of 1215 has no connection to disease transmission.
        - |
          Malacca's conversion came around 1400, after the plague, and concerned the Indian Ocean.
      answer: 0
      explanation: |
        Spiral review of 2.2: the Mongol peace is the standard causal link between Unit 2's networks and the Black Death.

    # ---- Set B: crop diffusion table (2.6)
    - slug: apworld-u02-w07-q04
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: crop diffusions named in the CED for c. 1200–c. 1450.

        | Crop | Origin | Carried by | Reached | Effect |
        |---|---|---|---|---|
        | Bananas | Southeast Asia | Indian Ocean sailors and migrants | East Africa, then forest zones of sub-Saharan Africa | Denser settlement where grain grew poorly |
        | Champa rice | Champa (Vietnam) | Tribute and trade to Song China (c. 1000) | Southern China | Two harvests a year; population growth |
        | Sugar cane | South and Southeast Asia | Muslim farmers and merchants | Egypt, Sicily, Spain | Irrigated plantations; later Atlantic model |
        | Citrus | South and East Asia | Muslim farmers and merchants | Mediterranean | New orchards; dietary change |
        | Cotton | India | Muslim farmers; Indian Ocean trade | Egypt, Spain, West Africa | Textile industries; cloth as trade good |
      prompt: |
        Which generalisation about the period is best supported by the table?
      options:
        - "Crops moved mainly from the Mediterranean eastward to Asia"
        - "Crop diffusion required European colonisation"
        - "Only luxury goods, never food plants, moved along the networks"
        - "Most diffusions originated in South or Southeast Asia and moved along trade routes to new regions"
      option_explanations:
        - |
          Every row shows movement out of South or Southeast Asia, not into it.
        - |
          No European colonisation existed yet; the carriers were Muslim farmers and Asian sailors.
        - |
          The table is entirely food and fibre plants, disproving the claim.
        - |
          Correct. All five crops began in South or Southeast Asia and travelled with merchants, migrants or tribute along Unit 2's routes.
      answer: 3
      explanation: |
        The pattern is diffusion westward and southward from Asia's tropical and subtropical zones, carried by the Indian Ocean and Islamic worlds.

    - slug: apworld-u02-w07-q05
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: crop diffusions named in the CED for c. 1200–c. 1450.

        | Crop | Origin | Carried by | Reached | Effect |
        |---|---|---|---|---|
        | Bananas | Southeast Asia | Indian Ocean sailors and migrants | East Africa, then forest zones of sub-Saharan Africa | Denser settlement where grain grew poorly |
        | Champa rice | Champa (Vietnam) | Tribute and trade to Song China (c. 1000) | Southern China | Two harvests a year; population growth |
        | Sugar cane | South and Southeast Asia | Muslim farmers and merchants | Egypt, Sicily, Spain | Irrigated plantations; later Atlantic model |
        | Citrus | South and East Asia | Muslim farmers and merchants | Mediterranean | New orchards; dietary change |
        | Cotton | India | Muslim farmers; Indian Ocean trade | Egypt, Spain, West Africa | Textile industries; cloth as trade good |
      prompt: |
        The row for sugar cane is most directly connected to which later development in world history?
      options:
        - "The Mongol conquest of Persia"
        - "The Ming voyages of Zheng He"
        - "The Protestant Reformation"
        - "The Atlantic plantation system worked by enslaved Africans"
      option_explanations:
        - |
          The Mongols did not farm sugar; Persia was a market for it, not a model.
        - |
          Zheng He sought tribute, not plantations; sugar played no part in the voyages.
        - |
          The Reformation was a religious movement with no link to sugar cultivation.
        - |
          Correct. The irrigated, labour-intensive sugar plantation of the Mediterranean islands was copied in the Atlantic islands and then the Americas.
      answer: 3
      explanation: |
        The CED flags sugar's diffusion precisely because the plantation model moved from the Mediterranean to Madeira, São Tomé, Brazil and the Caribbean (Unit 4).

    - slug: apworld-u02-w07-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: crop diffusions named in the CED for c. 1200–c. 1450.

        | Crop | Origin | Carried by | Reached | Effect |
        |---|---|---|---|---|
        | Bananas | Southeast Asia | Indian Ocean sailors and migrants | East Africa, then forest zones of sub-Saharan Africa | Denser settlement where grain grew poorly |
        | Champa rice | Champa (Vietnam) | Tribute and trade to Song China (c. 1000) | Southern China | Two harvests a year; population growth |
        | Sugar cane | South and Southeast Asia | Muslim farmers and merchants | Egypt, Sicily, Spain | Irrigated plantations; later Atlantic model |
        | Citrus | South and East Asia | Muslim farmers and merchants | Mediterranean | New orchards; dietary change |
        | Cotton | India | Muslim farmers; Indian Ocean trade | Egypt, Spain, West Africa | Textile industries; cloth as trade good |
      prompt: |
        Review. The Champa rice row helps explain which feature of Song China studied in Unit 1?
      options:
        - "The abolition of the civil service examinations"
        - "The population growth that fed urbanisation and the commercial revolution"
        - "The Song decision to end foreign trade"
        - "The spread of Buddhism from China to Vietnam"
      option_explanations:
        - |
          The Song expanded the examinations; they were curtailed later under the Yuan.
        - |
          Correct. Two harvests a year roughly doubled rice output in the south, and China's population reached about 100 million under the Song.
        - |
          The Song encouraged maritime trade and taxed it heavily; they did not end it.
        - |
          Buddhism moved into China earlier and the table concerns a crop, not a religion.
      answer: 1
      explanation: |
        Spiral review of 1.1: Champa rice is the environmental cause behind the Song economic story.

    # ---- Set C: three travellers compared (2.5)
    - slug: apworld-u02-w07-q07
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge; the travellers' accounts are described, not quoted"
      points: 1
      stimulus: |
        Comparison written for this course of three travellers named in the CED.

        Ibn Battuta (Moroccan jurist) left for the hajj in 1325 and travelled for about twenty-nine years through Arabia, Persia, East Africa, Anatolia, the Golden Horde, India (serving as a judge in Delhi), the Maldives, Sumatra and China, and later Spain and Mali; he dictated his account in Fez. Marco Polo (Venetian merchant) travelled with his father and uncle to Kublai Khan's court in the 1270s, served the Yuan for about seventeen years, and dictated his book in a Genoese prison around 1298. Margery Kempe (English townswoman and mystic) made pilgrimages to Jerusalem, Rome and Santiago de Compostela in the 1410s and dictated her book in the 1430s.
      prompt: |
        Which conclusion about travel in the period is best supported by the three accounts together?
      options:
        - "The networks of the period served religious, commercial and official purposes and were used by women as well as men"
        - "Long-distance travel was possible only for merchants"
        - "All three travellers wrote their own accounts in Latin"
        - "Travel beyond one's own religious world was impossible"
      option_explanations:
        - |
          Correct. Pilgrimage, trade and service to a khan all used the same routes, and Kempe shows that a woman of means could travel far.
        - |
          Only Polo was primarily a merchant; Ibn Battuta travelled as a pilgrim and scholar and Kempe as a pilgrim.
        - |
          All three dictated their accounts, in Arabic, Franco-Italian and English respectively.
        - |
          Polo, a Christian, lived seventeen years in Mongol China; the accounts show the opposite.
      answer: 0
      explanation: |
        The three travellers are chosen by the CED to show the variety of people and motives the networks carried.

    - slug: apworld-u02-w07-q08
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge; the travellers' accounts are described, not quoted"
      points: 1
      stimulus: |
        Comparison written for this course of three travellers named in the CED.

        Ibn Battuta (Moroccan jurist) left for the hajj in 1325 and travelled for about twenty-nine years through Arabia, Persia, East Africa, Anatolia, the Golden Horde, India (serving as a judge in Delhi), the Maldives, Sumatra and China, and later Spain and Mali; he dictated his account in Fez. Marco Polo (Venetian merchant) travelled with his father and uncle to Kublai Khan's court in the 1270s, served the Yuan for about seventeen years, and dictated his book in a Genoese prison around 1298. Margery Kempe (English townswoman and mystic) made pilgrimages to Jerusalem, Rome and Santiago de Compostela in the 1410s and dictated her book in the 1430s.
      prompt: |
        Ibn Battuta's ability to find employment as a judge in Delhi and to travel from Morocco to China within Muslim communities is best explained by
      options:
        - "the shared legal, religious and linguistic culture of Dar al-Islam across many states"
        - "the military protection of the Mongol khanates throughout his route"
        - "his personal friendship with Kublai Khan"
        - "the absence of any political borders in Afro-Eurasia"
      option_explanations:
        - |
          Correct. A Maliki jurist trained in Morocco was useful anywhere Islamic law ran; Arabic and shared norms opened courts and mosques to him.
        - |
          He crossed the Golden Horde and Chagatai lands, but most of his route (Africa, India, the Maldives, Sumatra) was outside Mongol rule.
        - |
          Kublai died in 1294, three decades before Ibn Battuta set out.
        - |
          Borders existed and he was sometimes detained or robbed; what crossed borders was Islamic culture.
      answer: 0
      explanation: |
        His career is the clearest evidence that Islam formed one cultural world across many political ones.

    - slug: apworld-u02-w07-q09
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge; the travellers' accounts are described, not quoted"
      points: 1
      stimulus: |
        Comparison written for this course of three travellers named in the CED.

        Ibn Battuta (Moroccan jurist) left for the hajj in 1325 and travelled for about twenty-nine years through Arabia, Persia, East Africa, Anatolia, the Golden Horde, India (serving as a judge in Delhi), the Maldives, Sumatra and China, and later Spain and Mali; he dictated his account in Fez. Marco Polo (Venetian merchant) travelled with his father and uncle to Kublai Khan's court in the 1270s, served the Yuan for about seventeen years, and dictated his book in a Genoese prison around 1298. Margery Kempe (English townswoman and mystic) made pilgrimages to Jerusalem, Rome and Santiago de Compostela in the 1410s and dictated her book in the 1430s.
      prompt: |
        Review. Polo's overland journey to Kublai's court in the 1270s was made safer by which condition of the Silk Roads at that time?
      options:
        - "The Portuguese naval patrols of Central Asia"
        - "The Ming dynasty's Great Wall garrisons"
        - "Mongol control of most of the route, with caravanserais and relay stations"
        - "The Abbasid Caliphate's protection of merchants from Baghdad"
      option_explanations:
        - |
          Portugal had no presence in Asia until 1498 and none inland ever.
        - |
          The Ming came to power in 1368, nearly a century later.
        - |
          Correct. The Pax Mongolica, with its yam stations and the caravanserai network, made the 1270s the high point of overland safety.
        - |
          The Abbasid Caliphate had fallen to the Mongols in 1258, before Polo set out.
      answer: 2
      explanation: |
        Spiral review of 2.1: Polo's journey is the standard example of travel under the Mongol peace.

    # ---- Standalone new content
    - slug: apworld-u02-w07-q10
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        The spread of Neo-Confucianism to Korea, Japan and Vietnam in this period is best explained by
      options:
        - "Mongol conquest of those three states"
        - "the voyages of Zheng He"
        - "the shared use of Chinese writing and the Chinese model of government and examinations"
        - "the conversion of their rulers to Islam"
      option_explanations:
        - |
          Korea was subdued by the Mongols but Japan and Vietnam repelled them; conquest did not carry the philosophy.
        - |
          Zheng He sailed to Southeast Asia, India and Africa in the 1400s and carried no philosophy to Korea or Japan.
        - |
          Correct. Elites in all three read classical Chinese and copied Chinese institutions, so Zhu Xi's synthesis travelled with the texts.
        - |
          None of the three states' rulers converted to Islam.
      answer: 2
      explanation: |
        Cultural diffusion in East Asia ran through the written language and the Chinese state model, a Unit 1 continuity.

    - slug: apworld-u02-w07-q11
