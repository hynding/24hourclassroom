    # ---- True / false
    - slug: apworld-u02-w05-q15
      type: true_false
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The Mongol Empire remained a single unified state under one ruler from 1206 until the Ming overthrew the Yuan in 1368.
      answer: false
      explanation: |
        False. After the deaths of Chinggis (1227) and his successors, the empire divided by the 1260s into four khanates (Yuan, Ilkhanate, Chagatai, Golden Horde) that were often at war with each other. The Yuan was only one of them.

