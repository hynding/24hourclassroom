week: 5
unit: 2
title: "The Silk Roads and the Mongol Empire"
topics: ["2.1", "2.2"]
guide: guides/week-05.md
guide_description: |
  Why Silk Road exchange grew after 1200 (caravanserai, credit and paper money, better saddles and the compass,
  Mongol security), its effects on production and on cities such as Kashgar and Samarkand, and the Mongol Empire
  from Chinggis Khan's conquests to the four khanates: the decimal army, the yam, the Pax Mongolica, transfers of
  technology and the destruction that came with them. Causation chains to practise and a close reading of Polo.
flashcards_description: |
  30 cards on the Silk Roads and the Mongols: commercial practices, technologies, cities, the conquests, the
  khanates and the effects of Mongol rule, plus the causation links the exam tests.

flashcards:
  - front: Silk Roads → what they were and what travelled on them
    back: |
      A web of overland routes across Central Asia linking China, India, Persia and the Mediterranean. High-value, low-bulk goods (silk, porcelain, spices, horses, glass, silver) and ideas, religions and technologies moved along them, usually changing hands many times.
    topic_code: "2.1"
  - front: Three causes of increased Silk Road trade after 1200
    back: |
      Improved commercial practices (caravanserai, credit, paper money); new technologies (saddles, stirrups, the compass and maps); and Mongol security after 1250, which suppressed banditry and taxed trade instead of looting it.
    topic_code: "2.1"
  - front: Caravanserai → definition and effect
    back: |
      Roadside inns about a day's journey apart offering water, lodging, storage and protection to merchants and their animals, often built by rulers or pious foundations. They made long desert and mountain stages survivable and increased traffic.
    topic_code: "2.1"
  - front: Bill of exchange → how it helped long-distance trade
    back: |
      A written order to pay a sum at another place or time, so merchants could settle debts without carrying silver. Islamic merchants used it widely; together with partnerships and deposit banking it lowered the risk and cost of trade.
    topic_code: "2.1"
  - front: Paper money and credit in China → role in trade
    back: |
      Tang "flying cash" credit notes became Song paper money; merchants could move value without coin. Under the Yuan, paper notes circulated across China and were even tried, unsuccessfully, in Persia.
    topic_code: "2.1"
  - front: Kashgar → why it grew
    back: |
      An oasis city where routes around the Taklamakan desert met, a market for Chinese, Central Asian and Persian goods. Trading cities like it prospered as Silk Road traffic rose.
    topic_code: "2.1"
  - front: Samarkand → why it matters in this period
    back: |
      A Central Asian trading city on the Silk Roads, destroyed by the Mongols in 1220 and rebuilt by Timur in the late 1300s as a capital of mosques, madrasas and markets paid for by trade and plunder.
    topic_code: "2.1"
  - front: Effect of Silk Road demand on production → examples
    back: |
      Chinese workshops made porcelain and silk in export styles; Persian and Indian weavers produced textiles for distant markets; Song and Yuan iron and steel expanded. Demand for luxuries changed what artisans made and where.
    topic_code: "2.1"
  - front: Technologies that spread west along the Silk Roads
    back: |
      Gunpowder, printing, the magnetic compass and paper-making moved from China toward the Islamic world and Europe, especially under the Mongols. They later underpinned European exploration and the Reformation's printing press.
    topic_code: "2.1"
  - front: Religions on the Silk Roads, c. 1200–1450
    back: |
      Buddhism had moved east along them centuries earlier; now Islam spread east into Central Asia and western China with merchants and Sufis, and Nestorian Christians served at Mongol courts. Trade routes were religious routes.
    topic_code: "2.1"
  - front: Chinggis Khan → who and what he did by 1227
    back: |
      Temüjin, proclaimed Chinggis Khan in 1206 after uniting the Mongol tribes. He reorganised the army across clan lines, conquered northern China and Khwarazm in Central Asia, and left an empire his descendants extended from Korea to Hungary.
    topic_code: "2.2"
  - front: Secret History of the Mongols → what it is
    back: |
      A thirteenth-century Mongol chronicle, the oldest surviving Mongolian text, telling of Chinggis Khan's rise and the customs and politics of his court. It gives a Mongol view against the many accounts written by their victims and visitors.
    topic_code: "2.2"
  - front: Mongol military organisation → decimal system
    back: |
      Units of ten, a hundred, a thousand and ten thousand (a tumen), each commander giving orders to only ten subordinates, as Marco Polo explained. Units mixed clans, breaking old loyalties and binding soldiers to the khan.
    topic_code: "2.2"
  - front: Why Mongol armies won → four reasons
    back: |
      Mounted archers with extreme mobility and endurance; decimal organisation and discipline; adoption of siege engineers and gunpowder weapons from China and Persia; and calculated terror, destroying cities that resisted so others would submit.
    topic_code: "2.2"
  - front: Sack of Baghdad (1258) → cause and consequence
    back: |
      Hulagu's army took the city when the caliph refused to submit; the last Abbasid caliph was killed and the city's population and libraries devastated. The Ilkhanate was founded in Persia; Cairo replaced Baghdad as the Arabic world's centre.
    topic_code: "2.2"
  - front: Where the Mongols were stopped → three limits
    back: |
      The Mamluks at Ain Jalut (1260) kept them out of Egypt; storms and Japanese defenders repelled invasions of Japan (1274, 1281); heat, disease and resistance turned them back from Vietnam and Java.
    topic_code: "2.2"
  - front: Mongol khanates → the four successor states
    back: |
      The Yuan in China (Kublai), the Ilkhanate in Persia (Hulagu's line), the Chagatai khanate in Central Asia, and the Golden Horde over Russia and the western steppe. By the 1260s they were separate states, often at war with one another.
    topic_code: "2.2"
  - front: Kublai Khan and the Yuan dynasty (1271–1368) → how he ruled China
    back: |
      He adopted the style of a Chinese emperor, kept Chinese administration and paper money, but placed Mongols and foreign officials (such as Marco Polo) above Chinese scholars and curtailed the examinations. The Ming expelled the Yuan in 1368.
    topic_code: "2.2"
  - front: Ilkhanate → relationship with Islam
    back: |
      Founded by Hulagu after 1258 over Persia and Iraq; at first hostile to Islam, it converted under Ghazan in 1295 and patronised Persian culture, al-Tusi's observatory and Persian historians such as Rashid al-Din.
    topic_code: "2.2"
  - front: Golden Horde → how it ruled Russia
    back: |
      Mongols over the western steppe took tribute from Russian princes rather than ruling directly; Moscow's princes grew powerful as the Horde's tax collectors. The Horde converted to Islam and lasted into the 1400s.
    topic_code: "2.2"
  - front: Yam → definition and effect
    back: |
      The Mongol relay system of post stations every 25–30 miles stocked with horses and supplies, carrying messengers, officials and merchants with passes across the empire. It made communication and travel across Eurasia faster and safer than ever before.
    topic_code: "2.2"
  - front: Pax Mongolica → meaning and dates
    back: |
      The century of relative security (c. 1250–1350) when Mongol rule over most of the Silk Roads let merchants, envoys and missionaries cross Eurasia: Polo, Carpini, Rubruck and Ibn Battuta all travelled under it. It ended with the khanates' wars and the plague.
    topic_code: "2.2"
  - front: Transfers under Mongol rule → five examples
    back: |
      Gunpowder, printing and the compass westward; Persian astronomers to China and Chinese astronomy to Maragha; medical knowledge; Chinese paper money tried in Persia; artisans deported between regions. Mongols spread technology they did not invent.
    topic_code: "2.2"
  - front: Destructive effects of Mongol conquest → examples
    back: |
      Depopulation of Nishapur, Merv, Baghdad and cities of northern China; collapse of irrigation in Persia and Iraq; mass deportation of artisans. Historians balance these against the connections the Mongols created.
    topic_code: "2.2"
  - front: John of Plano Carpini (1245–1247) → who and what he saw
    back: |
      A Franciscan sent by the pope to the Mongol court, who witnessed Güyük's enthronement, described Mongol customs and warned Europe of their power. His account, translated by Rockhill in 1900, is an outsider's eyewitness source.
    topic_code: "2.2"
  - front: Marco Polo as a source on the Mongols → strengths and limits
    back: |
      He served Kublai for years and describes administration, money and the army in detail, but writes to astonish European readers, inflates numbers and sees the empire from the court, not from its victims.
    topic_code: "2.2"
  - front: Mongols and the Black Death → the connection
    back: |
      The security and traffic of the Mongol routes let the plague move from Central Asia west to Crimea and the Mediterranean by 1347. The same connectivity that spread silk and ideas spread disease.
    topic_code: "2.2"
  - front: Causation chain → Mongols to European exploration
    back: |
      Mongol security → more merchants and envoys → gunpowder, printing and the compass reach Europe → European demand for Asian goods and knowledge of the routes → after the Pax collapses, Europeans seek sea routes (Unit 4).
    topic_code: "2.2"
  - front: Compare Mongol rule in China and in Russia
    back: |
      In China the Yuan ruled directly as a Chinese-style dynasty with Mongol elites on top; in Russia the Golden Horde ruled indirectly through tribute collected by Russian princes. Direct conquest versus overlordship.
    topic_code: "2.2"
  - front: Error-spotting → "The Mongols invented paper money, gunpowder and the compass"
    back: |
      All three were Chinese inventions. The Mongols' contribution was to spread them across Eurasia by uniting the routes along which they travelled.
    topic_code: "2.2"

quiz:
  description: |
    23 questions · about 38 minutes · mostly on this week (topics 2.1 and 2.2: the Silk Roads and the Mongols), with
    about a third reviewing Unit 1. Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Marco Polo on the Mongol army (2.2)
    - slug: apworld-u02-w05-q01
      type: multiple_choice
      topic_code: "2.2"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book I ch. 54 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "Well, he appoints an officer to every ten men, one to every hundred, one to every thousand, and one to every ten thousand, so that his own orders have to be given to ten persons only, and each of these ten persons has to pass the orders only to other ten, and so on; no one having to give orders to more than ten. ... They also have milk dried into a kind of paste to carry with them; ... And in case of great urgency they will ride ten days on end without lighting a fire or taking a meal."

        — Marco Polo, Venetian merchant in the service of Kublai Khan, on the customs of war of the Tartars (Mongols), *The Travels of Marco Polo*, Book I, chapter 54 (Yule–Cordier edition, 1903)
      prompt: |
        The organisation Polo describes most directly helps explain which of the following?
      options:
        - "The Mongols' reliance on infantry drawn from conquered Chinese cities"
        - "The speed, discipline and scale of Mongol conquests across Eurasia between 1206 and 1279"
        - "The Mongol decision to avoid warfare in favour of trade"
        - "The Mongols' adoption of European feudal armies"
      option_explanations:
        - |
          Polo describes mounted men living on mares' milk, a steppe cavalry, not Chinese infantry.
        - |
          Correct. A decimal chain of command and riders who could go ten days without fire or meals made armies that moved and obeyed faster than any opponent.
        - |
          The Mongols promoted trade after conquest; the passage is about how they fought.
        - |
          The decimal system is the opposite of feudal levies raised by lords; Polo explains it because it was strange to Europeans.
      answer: 1
      explanation: |
        Skill: causation from a source. Military organisation is a cause of the conquests' success.

    - slug: apworld-u02-w05-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book I ch. 54 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "Well, he appoints an officer to every ten men, one to every hundred, one to every thousand, and one to every ten thousand, so that his own orders have to be given to ten persons only, and each of these ten persons has to pass the orders only to other ten, and so on; no one having to give orders to more than ten. ... They also have milk dried into a kind of paste to carry with them; ... And in case of great urgency they will ride ten days on end without lighting a fire or taking a meal."

        — Marco Polo, Venetian merchant in the service of Kublai Khan, on the customs of war of the Tartars (Mongols), *The Travels of Marco Polo*, Book I, chapter 54 (Yule–Cordier edition, 1903)
      prompt: |
        Polo's position as an employee of Kublai Khan most likely affected this passage by
      options:
        - "leading him to condemn Mongol cruelty in the strongest terms"
        - "preventing him from learning anything about the army"
        - "making him describe the army as Venetian in origin"
        - "giving him inside knowledge of Mongol institutions while inclining him to admire their efficiency"
      option_explanations:
        - |
          The passage is admiring, not condemnatory; Polo's hosts were the Mongols.
        - |
          The detailed description shows he learned a great deal.
        - |
          Nothing suggests a Venetian origin; Polo presents the system as a Mongol marvel.
        - |
          Correct. Service at court gave him accurate detail about organisation and supply, and loyalty to the Khan shaped his tone of wonder.
      answer: 3
      explanation: |
        Skill: sourcing (the author's situation and point of view).

    - slug: apworld-u02-w05-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "Primary source: Marco Polo, The Travels of Marco Polo, Book I ch. 54 (Yule–Cordier edition, 1903), Wikisource"
      points: 1
      stimulus: |
        "Well, he appoints an officer to every ten men, one to every hundred, one to every thousand, and one to every ten thousand, so that his own orders have to be given to ten persons only, and each of these ten persons has to pass the orders only to other ten, and so on; no one having to give orders to more than ten. ... They also have milk dried into a kind of paste to carry with them; ... And in case of great urgency they will ride ten days on end without lighting a fire or taking a meal."

        — Marco Polo, Venetian merchant in the service of Kublai Khan, on the customs of war of the Tartars (Mongols), *The Travels of Marco Polo*, Book I, chapter 54 (Yule–Cordier edition, 1903)
      prompt: |
        Which of the following was a long-term consequence of the conquests made possible by the army Polo describes?
      options:
        - "The permanent unification of Eurasia under one ruler until 1600"
        - "The isolation of China from the rest of the world"
        - "A century of relatively secure travel and exchange across Eurasia that transferred technologies such as gunpowder and printing westward"
        - "The end of all long-distance trade"
      option_explanations:
        - |
          The empire split into four khanates within a generation of Chinggis's death.
        - |
          Mongol China was more open to foreigners than the Song had been; Polo himself is the proof.
        - |
          Correct. The Pax Mongolica (c. 1250–1350) moved merchants, envoys, inventions and ideas across the continent.
        - |
          Trade grew under Mongol protection; the yam and the taxation of commerce encouraged it.
      answer: 2
      explanation: |
        Skill: tracing long-term effects (the CED's "making of the modern world").

    # ---- Stimulus set B: a table of Silk Road exchange (2.1)
    - slug: apworld-u02-w05-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course on Silk Road exchange, c. 1200–1450.

        | Direction | Goods | Technologies and ideas |
        |---|---|---|
        | From China westward | Silk, porcelain, tea, paper, lacquer | Gunpowder, printing, the magnetic compass, paper money (tried in Persia) |
        | From Persia, India and the Islamic world eastward and westward | Cotton textiles, carpets, spices, precious stones, glass | Islam, Persian astronomy and painting, Arabic mathematics and medicine |
        | From Europe and the steppe eastward | Horses, furs, silver, woollens, enslaved people | Christianity (Nestorian and Catholic missions) |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "China imported technology from Europe and exported raw materials"
        - "Exchange was two-directional in goods but technological transfer in this period ran mainly from China toward the west"
        - "Only Europe benefited from Silk Road trade"
        - "No religions moved along the routes"
      option_explanations:
        - |
          The table shows China exporting manufactured goods and inventions, not importing technology from Europe.
        - |
          Correct. Every row lists goods in more than one direction, but gunpowder, printing and the compass all appear in the China-to-west row.
        - |
          Goods and ideas reached every region in the table.
        - |
          Islam and Christianity both appear in the ideas column.
      answer: 1
      explanation: |
        Skill: analysing a data stimulus for pattern.

    - slug: apworld-u02-w05-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course on Silk Road exchange, c. 1200–1450.

        | Direction | Goods | Technologies and ideas |
        |---|---|---|
        | From China westward | Silk, porcelain, tea, paper, lacquer | Gunpowder, printing, the magnetic compass, paper money (tried in Persia) |
        | From Persia, India and the Islamic world eastward and westward | Cotton textiles, carpets, spices, precious stones, glass | Islam, Persian astronomy and painting, Arabic mathematics and medicine |
        | From Europe and the steppe eastward | Horses, furs, silver, woollens, enslaved people | Christianity (Nestorian and Catholic missions) |
      prompt: |
        The goods in the first row best explain which change in Chinese production during the period?
      options:
        - "The abandonment of silk weaving in favour of agriculture"
        - "The import of Persian weavers to make all Chinese textiles"
        - "The expansion of porcelain and silk workshops producing export styles for distant markets"
        - "The decline of Chinese cities"
      option_explanations:
        - |
          Silk remained a major export; demand increased rather than ended its production.
        - |
          Chinese textiles were made by Chinese workers; Persian designs influenced styles, not labour.
        - |
          Correct. Rising demand for luxuries led Chinese artisans to produce more porcelain and silk, often in styles made for Islamic and other foreign buyers.
        - |
          Trade enlarged cities such as Hangzhou and the ports; it did not shrink them.
      answer: 2
      explanation: |
        Skill: linking trade demand to changes in production (a CED effect of 2.1).

    - slug: apworld-u02-w05-q06
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course on Silk Road exchange, c. 1200–1450.

        | Direction | Goods | Technologies and ideas |
        |---|---|---|
        | From China westward | Silk, porcelain, tea, paper, lacquer | Gunpowder, printing, the magnetic compass, paper money (tried in Persia) |
        | From Persia, India and the Islamic world eastward and westward | Cotton textiles, carpets, spices, precious stones, glass | Islam, Persian astronomy and painting, Arabic mathematics and medicine |
        | From Europe and the steppe eastward | Horses, furs, silver, woollens, enslaved people | Christianity (Nestorian and Catholic missions) |
      prompt: |
        Which development most directly increased the volume of exchange shown in the table after about 1250?
      options:
        - "The Mongol conquest of the regions along the routes, which brought security and taxed trade rather than plundering it"
        - "The founding of the Delhi Sultanate"
        - "The building of Angkor Wat"
        - "The rise of the Aztec Triple Alliance"
      option_explanations:
        - |
          Correct. Under the Pax Mongolica merchants moved with passes along the yam stations and bandits were suppressed.
        - |
          Delhi's rule over northern India touched the routes only indirectly.
        - |
          Angkor was a Southeast Asian temple city with no connection to overland Central Asian trade.
        - |
          The Aztecs were in Mexico, with no contact with Eurasia.
      answer: 0
      explanation: |
        Skill: causation; the Mongols as the key cause of expanded exchange.

    # ---- Stand-alone, this week and review
    - slug: apworld-u02-w05-q07
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Caravanserai and bills of exchange contributed to Silk Road trade in which way?
      options:
        - "They lowered the risk and cost of long-distance commerce by providing shelter and credit"
        - "They replaced camels with ships"
        - "They were Mongol inventions imposed on merchants"
        - "They ended the need for trading cities"
      option_explanations:
        - |
          Correct. Inns a day apart protected goods and animals; credit instruments let merchants settle debts without carrying silver.
        - |
          Both served overland trade; ships belong to the Indian Ocean routes.
        - |
          Both predate the Mongols and arose from merchant and Islamic commercial practice.
        - |
          Trading cities grew as traffic rose; caravanserai often stood within or beside them.
      answer: 0
      explanation: |
        Topic 2.1: improved commercial practices as a cause of growth.

    - slug: apworld-u02-w05-q08
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which best describes how the Golden Horde governed Russia?
      options:
        - "Direct rule by Mongol governors in every town"
        - "Conversion of all Russians to Buddhism"
        - "Annexation of Russia to the Yuan dynasty"
        - "Indirect rule through Russian princes who paid tribute and collected taxes for the khan"
      option_explanations:
        - |
          The Horde stayed on the steppe and left Russian towns under their own princes.
        - |
          The Horde itself converted to Islam; Russia remained Orthodox Christian.
        - |
          The Golden Horde was a separate khanate, often hostile to the Yuan.
        - |
          Correct. Moscow's princes rose as the Horde's tax collectors, a lasting effect of Mongol overlordship.
      answer: 3
      explanation: |
        Topic 2.2: how khanates adapted to their regions.

    - slug: apworld-u02-w05-q09
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The yam system is best described as
      options:
        - "a Mongol religious ritual"
        - "a network of relay stations with horses and supplies that carried messengers and officials across the empire"
        - "a Chinese examination for Mongol officials"
        - "a tax on silk"
      option_explanations:
        - |
          The yam was administrative, not religious.
        - |
          Correct. Stations every 25–30 miles let riders cover hundreds of miles a day and gave merchants with passes safe lodging.
        - |
          The Mongols curtailed examinations; the yam was a communications system.
        - |
          The yam moved people and messages; it was not a tax.
      answer: 1
      explanation: |
        Topic 2.2: Mongol infrastructure as a cause of connectivity.

    - slug: apworld-u02-w05-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Mongol sack of Baghdad in 1258 had which effect on the Islamic world?
      options:
        - "It ended Islamic scholarship permanently"
        - "It converted the Mongols immediately to Islam"
        - "It ended the Abbasid Caliphate and shifted the centre of Arabic learning to Mamluk Cairo"
        - "It united all Muslims under the Ilkhans"
      option_explanations:
        - |
          Scholarship continued at Cairo, Damascus, Maragha and elsewhere.
        - |
          The Ilkhans converted only in 1295, a generation later.
        - |
          Correct. With the caliph dead and Baghdad devastated, Cairo under the Mamluks became the leading Arabic centre.
        - |
          The Mamluks, Delhi and others remained independent of the Ilkhans.
      answer: 2
      explanation: |
        Spiral review of 1.2 through its Mongol cause.

    - slug: apworld-u02-w05-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Under Kublai Khan's Yuan dynasty, which Song institution was curtailed while others continued?
      options:
        - "The civil service examinations, which the Yuan reduced while keeping Chinese administration and currency"
        - "Paper money, which the Yuan abolished"
        - "The Grand Canal, which the Yuan filled in"
        - "Buddhism, which the Yuan banned"
      option_explanations:
        - |
          Correct. Kublai placed Mongols and foreigners over Chinese scholars and limited the examinations, but kept the bureaucracy's structure and the currency.
        - |
          The Yuan expanded paper money, as Polo described.
        - |
          The Yuan extended the canal to reach their capital at Khanbaliq.
        - |
          The Yuan favoured Buddhism, especially its Tibetan form.
      answer: 0
      explanation: |
        Spiral review of 1.1 across the Song–Yuan transition.

    - slug: apworld-u02-w05-q12
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The mission of John of Plano Carpini to the Mongol court in 1245 was sent by
      options:
        - "the pope, reflecting the Church's role as Europe's one continent-wide institution"
        - "the Delhi sultan"
        - "the Song emperor"
        - "the Mali mansa"
      option_explanations:
        - |
          Correct. Only the papacy could send an envoy on behalf of Latin Christendom; Carpini's report warned Europe about Mongol power.
        - |
          Delhi had its own dealings with the Mongols by war, not by Franciscan envoys.
        - |
          The Song were at war with the Mongols and sent no Franciscans.
        - |
          Mali lay beyond the Sahara and had no dealings with the Mongols.
      answer: 0
      explanation: |
        Spiral review of 1.6 through a Unit 2 source.

    - slug: apworld-u02-w05-q22
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The Mongol naval expedition against Java in 1293 failed, and in the same year a new Hindu-Buddhist empire rose on the island. That empire was
      options:
        - "Srivijaya"
        - "the Khmer Empire"
        - "the Sultanate of Malacca"
        - "Majapahit"
      option_explanations:
        - |
          Srivijaya was an older Sumatran state already in decline by 1293.
        - |
          The Khmer ruled Cambodia on the mainland, not Java.
        - |
          Malacca was founded about a century later, around 1400, and was Muslim.
        - |
          Correct. Majapahit was founded on Java in 1293 and dominated the island spice trade in the 1300s.
      answer: 3
      explanation: |
        Spiral review of 1.3.

    - slug: apworld-u02-w05-q23
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which African trade network of the period c. 1200–1450 most resembled the Silk Roads in carrying high-value goods by caravan across a hostile landscape?
      options:
        - "The Indian Ocean monsoon trade of the Swahili coast"
        - "The Red Sea trade of Ethiopia"
