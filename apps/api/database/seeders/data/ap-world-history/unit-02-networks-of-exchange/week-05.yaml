    # ---- Short answers (SAQ style)
    - slug: apworld-u02-w05-q19
      type: short_answer
      topic_code: "2.2"
      source: "Primary source: John of Plano Carpini, in The Journey of William of Rubruck, trans. W. W. Rockhill (Hakluyt Society, 1900), Silk Road Seattle text"
      points: 3
      stimulus: |
        The Franciscan friar John of Plano Carpini, sent by the pope to the Mongols in 1245, attended the gathering at which Güyük was made Great Khan in 1246. He reports that the assembled chiefs "placed Cuyuc on the imperial seat, and the chiefs knelt before him," and that "the whole people did likewise, except ourselves who were not his subjects." He adds that once the Emperor has decided a question, no one may say anything more about it, "for it is not the custom."

        — John of Plano Carpini, *History of the Mongols*, in *The Journey of William of Rubruck*, translated by W. W. Rockhill, 1900
      prompt: |
        Using the passage, answer (a), (b) and (c).

        (a) Identify ONE feature of Mongol political authority shown in the passage.
        (b) Explain ONE way Carpini's position as a papal envoy shaped what he observed or reported.
        (c) Explain ONE way Mongol rule after 1246 affected exchange between Europe and Asia.
      answer: |
        (a) The Great Khan's authority was absolute once confirmed by the assembly of chiefs: everyone knelt, and his decisions could not be questioned.
        (b) As the pope's envoy he was not a subject, so he and his companions stood apart and observed the ceremony as outsiders; he reported to a European audience worried about Mongol invasion, which made him attentive to the khan's power and to the obedience of his people.
        (c) Mongol control of the Silk Roads created the Pax Mongolica, under which envoys like Carpini, missionaries and merchants such as Marco Polo could travel to China, and technologies such as gunpowder and printing moved west.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific feature from the passage: election by the chiefs; universal kneeling; decisions beyond question; the distinction between subjects and non-subjects.

        (b) 1 pt: a link between his situation (papal envoy, outsider, European audience fearing the Mongols) and a feature of the account.

        (c) 1 pt: a specific effect on exchange: the Pax Mongolica; the yam; Polo's journey; technology transfer; missions. Zero for an effect unrelated to exchange (e.g. the sack of Baghdad without its consequence for trade).

    - slug: apworld-u02-w05-q20
      type: short_answer
      topic_code: "2.1"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE commercial practice or technology that increased Silk Road exchange in the period c. 1200 to c. 1450.
        (b) Explain ONE effect of increased Silk Road exchange on a trading city or on production in a region.
        (c) Explain ONE way that Silk Road exchange was connected to a development you studied in Unit 1.
      answer: |
        (a) Caravanserai gave merchants safe lodging a day apart; or bills of exchange and paper money let them trade without carrying coin; or the magnetic compass and better saddles improved travel.
        (b) Samarkand and Kashgar grew as markets and way-stations, with mosques and madrasas paid for by trade; or Chinese workshops expanded porcelain and silk production in styles made for export.
        (c) Song China's commercial boom (week 1) produced the silk, porcelain and iron that the Silk Roads carried; or the Islamic world's merchants and credit practices (week 1) ran much of the trade; or Islam spread eastward along the routes into Central Asia, continuing the pattern of trade-borne conversion seen in Africa and Southeast Asia.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a specific practice or technology named in the CED or the guide. Zero for "better roads" with no specific.

        (b) 1 pt: a specific city or productive change with an explanation of how exchange caused it.

        (c) 1 pt: an explicit, accurate link to a Unit 1 development (Song economy, Islamic merchants, spread of Islam, Buddhism in East Asia, European demand for luxuries).

    # ---- Long essay (LEQ style)
    - slug: apworld-u02-w05-q21
      type: long_answer
      topic_code: "2.2"
      source: "general knowledge"
      points: 6
      prompt: |
        Develop an argument that evaluates the extent to which the Mongol Empire changed patterns of exchange across Eurasia in the period c. 1200 to c. 1450.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: The Mongols changed Eurasian exchange to a great extent, not by creating the Silk Roads but by uniting them under one security system for a century, which multiplied the movement of merchants, envoys, technologies and diseases; yet the routes, goods and merchant communities were older than the Mongols and outlasted them, so the change was in scale and security more than in kind.

        Context: the Silk Roads had linked Han China and Rome; by 1200 Song China's commercial economy and Islamic merchant networks were already expanding trade; Baghdad and the Seljuks held the western routes.

        Body 1 (change): conquests 1206–1279 unified the routes; the yam and passes; Pax Mongolica; Polo, Carpini, Ibn Battuta; transfer of gunpowder, printing, compass; Persian astronomers in China; Chinese paper money tried in Persia; deported artisans.

        Body 2 (continuity): caravanserai, credit and merchant diasporas predated the Mongols; luxury goods and the demand for them continued; Islam continued to spread along the routes as before.

        Body 3 (complexity): the Mongols also destroyed (Baghdad, Merv, Persian irrigation) and the connectivity they built carried the Black Death, which with the khanates' wars ended the Pax by 1350 and pushed later exchange toward the sea routes.

        Conclusion: a large change in scale, security and the direction of technology transfer, built on continuities and undone by its own consequences.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim evaluating the extent of change with a line of reasoning. Zero for "the Mongols changed trade a lot".

        Contextualization (0–1): relevant broader context: the earlier Silk Roads; Song commercialisation; Islamic merchant networks; the state of the routes before 1206. Must be developed.

        Evidence (0–2): 1 pt for two or more specific examples (Chinggis Khan, decimal army, the four khanates, yam, Pax Mongolica, Polo, Carpini, Rubruck, Ibn Battuta, gunpowder and printing transfer, Maragha, sack of Baghdad, Black Death). 2 pts when evidence supports the argument about change or continuity.

        Analysis and reasoning (0–2): 1 pt for sustained continuity and change (or causation). 1 pt for complexity: weighing destruction against connection; distinguishing change in scale from change in kind; explaining why the Pax ended and what replaced it.

        Common errors: crediting the Mongols with inventing paper money or the compass; treating the empire as unified to 1368; ignoring the destructive side; no Unit 1 context.
