    # ---- Short answer
    - slug: apworld-u02-w06-q21
      type: short_answer
      topic_code: "2.3"
      source: "general knowledge; Ibn Battuta's travels are described, not quoted"
      points: 3
      prompt: |
        Ibn Battuta reported that the Hindu rulers of India's Malabar coast protected Muslim merchants and let them build mosques, because the ports depended on their trade.

        (a) Identify ONE technology or environmental factor that made the Malabar ports central to Indian Ocean trade.
        (b) Explain ONE way the religious toleration Ibn Battuta describes affected culture in Indian Ocean port cities.
        (c) Explain ONE similarity between this policy and the behaviour of a trans-Saharan or Southeast Asian state toward merchants in the same period.
      answer: |
        (a) 1 point for a valid factor: the monsoon winds that brought Arab and East African ships to Malabar and Chinese ships from the east; pepper grown on the Malabar coast; the dhow or junk; the position of Calicut midway between the ocean's two halves.
        (b) 1 point for a cultural effect: Muslim diasporic communities took local wives and produced Muslim trading communities (such as the Mappila of Malabar) with blended language and custom; mosques and Islamic law coexisted with Hindu rule; Arabic loanwords and Islamic scholarship entered coastal cultures; similar blending produced Swahili on the East African coast.
        (c) 1 point for a similarity: Mali's rulers protected and taxed Muslim merchants and let Islam and traditional religion coexist; Malacca's ruler converted to Islam to attract Muslim traders; Kilwa's sultans welcomed Gujarati and Arab merchants; in each case a ruler whose income came from trade tolerated or adopted the merchants' faith.
      explanation: |
        Scoring: one point per part; (b) and (c) need a stated cause-and-effect or similarity, not just a name. The best answers link the toleration to the ruler's dependence on customs revenue.

    - slug: apworld-u02-w06-q22
      type: short_answer
      topic_code: "2.4"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE technological or environmental reason trans-Saharan trade grew between c. 1200 and c. 1450.
        (b) Explain ONE effect of trans-Saharan trade on the political development of West Africa.
        (c) Explain ONE effect of trans-Saharan trade on culture or religion in West Africa.
      answer: |
        (a) 1 point: the camel saddle and camel caravans; knowledge of oasis routes and wells; the demand for gold in Mediterranean mints and for salt in the Sahel; Mali's protection of the routes.
        (b) 1 point: Mali's rulers grew rich and powerful by taxing gold and salt and by controlling the trade routes and mines; Mansa Musa's hajj displayed that wealth; Songhai later captured Timbuktu and Gao to control the same trade; cavalry bought with trade income enforced the state's control.
        (c) 1 point: Islam spread among merchants and rulers of the Sahel; Timbuktu and Djenné became centres of mosques, manuscripts and scholarship; Arabic literacy and Islamic law entered West African courts; religious syncretism combined Islam with traditional practice.
      explanation: |
        Scoring: one point per part. (b) and (c) require explanation (a reason the trade caused the effect), not a bare identification.

    # ---- Long answer
    - slug: apworld-u02-w06-q23
      type: long_answer
      topic_code: "2.3"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which the Indian Ocean trade network and the trans-Saharan trade network differed in the technologies and environmental conditions that shaped them in the period c. 1200 to c. 1450.

        Write a complete essay with a thesis, context, specific evidence for both networks, and reasoning that compares them.
      answer: |
        Thesis (1 point): a defensible claim about degree of difference, for example that both networks depended on a transport technology adapted to a hostile environment (camel to desert, dhow and junk to monsoon sea) but that the ocean's capacity for bulk goods and its reliance on wind rather than animals made its trade larger and more varied.
        Contextualisation (1 point): the spread of Islam, the Mongol peace on the overland routes, the demand of Song and Yuan China or Mediterranean Europe for gold and spices, or the rise of Unit 1 states such as Mali and Malacca.
        Evidence (2 points): at least two specific pieces of evidence for the comparison, for example the monsoon and lateen sail; the junk's compartments as described by Ibn Battuta; the compass and astrolabe; the camel saddle; Taghaza salt; oasis caravans; Zheng He's fleets; Mansa Musa's hajj.
        Analysis and reasoning (1 point): uses comparison to explain similarities and differences (both used environmental knowledge; one moved bulk, one moved high-value goods; one had no single political master, the other was policed by Mali).
        Complexity (1 point): considers both similarity and difference, change over time (Songhai, the Ming withdrawal, the coming Portuguese), or how the two networks connected through Cairo and the Red Sea.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that only describes each network without comparing them earns at most the evidence points.
