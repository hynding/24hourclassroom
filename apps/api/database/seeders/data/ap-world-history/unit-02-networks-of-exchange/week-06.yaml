    - slug: apworld-u02-w06-q18
      type: true_false
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: Unlike the Indian Ocean routes, the Silk Roads mostly carried high-value, low-bulk luxury goods such as silk, porcelain and spices.
      answer: true
      explanation: |
        True. Pack animals could carry only what was worth its weight in transport costs; ships could carry timber, grain and cloth in bulk. This contrast is a standard comparison between topics 2.1 and 2.3.

