week: 6
unit: 2
title: "The Indian Ocean and the Trans-Saharan Routes"
topics: ["2.3", "2.4"]
guide: guides/week-06.md
guide_description: |
  The Indian Ocean network (monsoon winds, dhows and junks, compass and astrolabe, diasporic merchant communities,
  port cities from Kilwa to Malacca, and Zheng He's voyages) and the trans-Saharan network (camel saddles and
  caravans, the gold-salt exchange, Taghaza, Timbuktu, Mali and Songhai, and the trade in enslaved people), with a
  table comparing the three networks of Unit 2 and Ibn Battuta's observations described in our own words.
flashcards_description: |
  30 cards on the technologies, goods, cities, merchants and states of the Indian Ocean and trans-Saharan trade,
  with the comparisons between the three networks of Unit 2.

flashcards:
  - front: Monsoon winds → how they shaped Indian Ocean trade
    back: |
      Southwest winds in summer carried ships from Africa and Arabia to India; northeast winds in winter carried them home. Voyages followed an annual rhythm, merchants waited months in port, and ports where sailors wintered grew into cosmopolitan cities.
    topic_code: "2.3"
  - front: Dhow → what it was and why it mattered
    back: |
      The Arab and Indian ship with triangular lateen sails that could sail closer to the wind than square-rigged vessels. The workhorse of the Indian Ocean and Red Sea for trade in goods of every bulk.
    topic_code: "2.3"
  - front: Chinese junk → features that impressed observers
    back: |
      Large ships with multiple masts, a stern rudder and watertight compartments; Ibn Battuta described junks at Calicut with four decks, private cabins and crews of hundreds. The biggest ships of the age.
    topic_code: "2.3"
  - front: Compass and astrolabe in the Indian Ocean → origins and use
    back: |
      The magnetic compass came from China and the astrolabe was refined in the Islamic world; together with knowledge of the monsoon they let navigators find direction and latitude out of sight of land.
    topic_code: "2.3"
  - front: Why the Indian Ocean could carry bulk goods and the Silk Roads could not
    back: |
      A ship carries far more than a camel at lower cost per ton, so timber, grain, dates, horses and cheap cotton moved by sea while only luxuries could bear the cost of overland caravans.
    topic_code: "2.3"
  - front: Diasporic merchant communities → definition and examples
    back: |
      Merchants of one origin settled permanently in foreign ports: Arabs and Persians in Swahili towns and Calicut, Gujaratis in East Africa and Malacca, Chinese in Southeast Asian ports, Jews in Cairo and India. They carried languages, religions and architecture, and married locally.
    topic_code: "2.3"
  - front: Cultural effects of diasporic communities → two examples
    back: |
      The Swahili language and coral-stone mosques of East Africa, blending Bantu and Arab elements; the spread of Islam to Malacca and the Indonesian islands through settled Muslim traders. Trade settlements became channels of religion.
    topic_code: "2.3"
  - front: Calicut → role in the network
    back: |
      The chief port of India's Malabar coast, where pepper was sold and Arab, Persian and Chinese ships met under Hindu rulers who protected Muslim merchants because the trade depended on them. Vasco da Gama's destination in 1498.
    topic_code: "2.3"
  - front: Hormuz → role in the network
    back: |
      A port on an island at the mouth of the Persian Gulf, the gateway between Indian Ocean shipping and the overland routes into Persia and the Silk Roads. Its wealth came entirely from transit trade.
    topic_code: "2.3"
  - front: Entrepôt → definition
    back: |
      A port where goods are imported, stored and re-exported rather than consumed: Malacca, Hormuz, Aden and Kilwa were entrepôts whose rulers lived by taxing and protecting the flow.
    topic_code: "2.3"
  - front: Indian cotton textiles → their place in Indian Ocean trade
    back: |
      Cloth from Gujarat and Bengal was the ocean's staple manufactured export, traded for spices in Southeast Asia and gold and ivory in Africa. Textile demand changed production in India as silk demand did in China.
    topic_code: "2.3"
  - front: Zheng He's voyages (1405–1433) → purpose and scale
    back: |
      Seven Ming expeditions with fleets of large junks and tens of thousands of men to Southeast Asia, India, Hormuz, Aden and East Africa, seeking tribute and prestige, not colonies. Foreign envoys and exotic goods, including a giraffe, came back to the court.
    topic_code: "2.3"
  - front: Why the Ming stopped the voyages after 1433
    back: |
      Confucian officials judged them costly and showy; the Mongol frontier and the new capital at Beijing claimed resources; trade continued in private hands. The state left the ocean seventy years before the Portuguese entered it.
    topic_code: "2.3"
  - front: Ibn Battuta at Kilwa (1331) → what he reported
    back: |
      A well-built town of wood and coral with a generous Muslim sultan who raided the non-Muslim interior for plunder and captives. Evidence of a Muslim port state living by trade and by warfare against its hinterland.
    topic_code: "2.3"
  - front: Ibn Battuta at Calicut → what he reported
    back: |
      Chinese junks of several decks with private cabins and crews in the hundreds, Hindu rulers protecting Muslim traders, and the rule that only Chinese ships sailed the China route. Described in our own words because the translations are modern.
    topic_code: "2.3"
  - front: Camel saddle → why it made trans-Saharan trade possible
    back: |
      Saddles developed in Arabia and North Africa let camels carry heavy loads and riders. Camels can go days without water and cross sand that horses cannot, so caravans of hundreds of animals could cross the desert between oases.
    topic_code: "2.4"
  - front: Oases and desert way-stations → role in caravans
    back: |
      Wells and oasis towns a few days apart gave water and pasture; caravans sent scouts ahead to arrange water, and Berber communities sold protection and guidance. The desert equivalents of caravanserai.
    topic_code: "2.4"
  - front: Taghaza → what and why significant
    back: |
      A Saharan salt mine whose slabs were cut by enslaved workers and carried south to the salt-less Sahel; Ibn Battuta described houses and a mosque built of salt blocks there. Salt was as central to the trade as gold.
    topic_code: "2.4"
  - front: Gold-salt exchange → the logic of the trade
    back: |
      Salt from the desert and gold from the West African forests were each scarce where the other was abundant; merchants carried salt south and gold north, and Mali grew rich taxing the exchange in between.
    topic_code: "2.4"
  - front: West African gold → where it went
    back: |
      North across the desert to the mints of Morocco and Egypt and on to Europe, which drew much of its gold coinage from it before 1450. One reason the Portuguese sought the West African coast by sea.
    topic_code: "2.4"
  - front: Trans-Saharan trade in enslaved people → what to know
    back: |
      Captives from the Sahel were carried north to North Africa and the Islamic world for centuries before 1450, in a trade older and in this period larger than the Atlantic one. Rulers such as Kilwa's and Mali's took part.
    topic_code: "2.4"
  - front: Wangara and Dyula merchants → who they were
    back: |
      West African Muslim traders who carried gold from the forest zone to the Sahel market towns and linked the southern end of the network to the Berber and Arab caravans. The trade was African at its southern end.
    topic_code: "2.4"
  - front: Timbuktu and Djenné → what trade made them
    back: |
      Niger-bend market towns that became cities of mosques, scholars and manuscript copying under Mali and Songhai, as books and scholars crossed the desert with the gold and salt.
    topic_code: "2.4"
  - front: Mali's role in the trans-Saharan network
    back: |
      Taxed the gold and salt trade, policed the routes with cavalry, and connected to North Africa through Islam; Mansa Musa's hajj (1324) was its most famous journey. By the 1400s Songhai was taking its place.
    topic_code: "2.4"
  - front: Songhai Empire → rise and relation to Mali
    back: |
      A Niger-bend state under Sunni Ali (1460s) and Askia Muhammad that absorbed Mali's trade and cities, including Timbuktu, and became the largest West African empire until Moroccan guns destroyed it in 1591.
    topic_code: "2.4"
  - front: Ibn Battuta's Sahara crossing (1352) → what it shows about caravan organisation
    back: |
      A salt town, a ten-day waterless stage, a scout sent ahead to arrange water at the next oasis, and strict timing. The desert crossing required organisation comparable to a sea voyage.
    topic_code: "2.4"
  - front: Compare the Indian Ocean and trans-Saharan networks → transport and goods
    back: |
      Ships versus camels; bulk and luxury goods versus gold, salt, copper and captives; many competing port states versus one dominant Sahelian empire. Both carried Islam, merchants and scholars.
    topic_code: "2.4"
  - front: Compare the three Unit 2 networks → security
    back: |
      The Silk Roads depended on the Mongol peace; the Indian Ocean had no single power and ran on port rulers' protection and shared Islamic commercial law; the trans-Saharan routes relied on Mali's cavalry and Berber escorts.
    topic_code: "2.3"
  - front: Error-spotting → "Zheng He founded Chinese colonies"
    back: |
      Wrong. The voyages collected tribute and prestige and ended in 1433; China founded no overseas colonies. Chinese merchant communities abroad were private, not imperial.
    topic_code: "2.3"
  - front: Error-spotting → "The Portuguese created Indian Ocean trade"
    back: |
      Wrong. The network was ancient and flourishing; the Portuguese entered it in 1498 and tried to tax and control it with cannon, which is Unit 4's story.
    topic_code: "2.3"

quiz:
  description: |
    23 questions · about 38 minutes · mostly on this week (topics 2.3 and 2.4: the Indian Ocean and trans-Saharan
    networks), with about a third reviewing Unit 1 and week 5. Multiple choice, select-all and true/false items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Ibn Battuta on Chinese junks, described (2.3)
    - slug: apworld-u02-w06-q01
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge; Ibn Battuta's account of Calicut (1340s) is described, not quoted"
      points: 1
      stimulus: |
        Ibn Battuta, a Moroccan jurist, reached the port of Calicut on India's Malabar coast in the 1340s on his way to China. He later described the Chinese ships he saw there: the largest carried four decks, with private cabins and latrines for merchants, crews numbering in the hundreds including archers and men with naphtha fire, and vegetables grown in tubs on deck. He reported that only Chinese vessels made the voyage to China, that the ships were built at Quanzhou and Guangzhou, and that the Hindu ruler of Calicut protected Muslim merchants because the port's wealth depended on them.
      prompt: |
        The description best supports which conclusion about the Indian Ocean network in the fourteenth century?
      options:
        - "Chinese shipbuilding and commercial organisation allowed large-scale, long-distance voyages between China and India"
        - "Muslim merchants were excluded from Indian ports by Hindu rulers"
        - "The Indian Ocean trade had not yet begun"
        - "European ships dominated the route between India and China"
      option_explanations:
        - |
          Correct. Multi-deck junks with large crews and cabins for merchants show technology and organisation for regular bulk trade.
        - |
          The passage says the opposite: the Hindu ruler protected Muslim merchants because the port depended on them.
        - |
          The account describes a mature network with regular shipping and settled merchants.
        - |
          No European ship entered the Indian Ocean until 1498; the passage names only Chinese ships on the China route.
      answer: 0
      explanation: |
        Skill: drawing a supported conclusion from a described source.

    - slug: apworld-u02-w06-q02
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge; Ibn Battuta's account of Calicut (1340s) is described, not quoted"
      points: 1
      stimulus: |
        Ibn Battuta, a Moroccan jurist, reached the port of Calicut on India's Malabar coast in the 1340s on his way to China. He later described the Chinese ships he saw there: the largest carried four decks, with private cabins and latrines for merchants, crews numbering in the hundreds including archers and men with naphtha fire, and vegetables grown in tubs on deck. He reported that only Chinese vessels made the voyage to China, that the ships were built at Quanzhou and Guangzhou, and that the Hindu ruler of Calicut protected Muslim merchants because the port's wealth depended on them.
      prompt: |
        The ruler's protection of Muslim merchants at Calicut is best explained by
      options:
        - "the ruler's conversion to Islam"
        - "orders from the Delhi Sultanate"
        - "the economic value of diasporic merchant communities to port states that lived by taxing trade"
        - "the absence of any Hindu merchants in India"
      option_explanations:
        - |
          The passage identifies the ruler as Hindu; protection did not require conversion.
        - |
          Calicut lay far south of Delhi's reach and was independent.
        - |
          Correct. Port rulers across the ocean competed for merchants; foreign traders brought the goods and customs revenue on which the state depended.
        - |
          Gujarati and other Hindu merchants were major traders; the point is that foreign Muslims were welcomed too.
      answer: 2
      explanation: |
        Skill: explaining a pattern (tolerance for trade's sake) seen across Indian Ocean ports.

    - slug: apworld-u02-w06-q03
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge; Ibn Battuta's account of Calicut (1340s) is described, not quoted"
      points: 1
      stimulus: |
        Ibn Battuta, a Moroccan jurist, reached the port of Calicut on India's Malabar coast in the 1340s on his way to China. He later described the Chinese ships he saw there: the largest carried four decks, with private cabins and latrines for merchants, crews numbering in the hundreds including archers and men with naphtha fire, and vegetables grown in tubs on deck. He reported that only Chinese vessels made the voyage to China, that the ships were built at Quanzhou and Guangzhou, and that the Hindu ruler of Calicut protected Muslim merchants because the port's wealth depended on them.
      prompt: |
        Which later development in the same network is most directly foreshadowed by the ships Ibn Battuta describes?
      options:
        - "The Portuguese conquest of Calicut in 1400"
        - "The Ming state voyages of Zheng He (1405–1433), which used fleets of large junks to reach India, Arabia and East Africa"
        - "The abandonment of all Chinese shipbuilding"
        - "The Mongol invasion of India by sea"
      option_explanations:
        - |
          The Portuguese reached Calicut in 1498 and never conquered it.
        - |
          Correct. The junks of the 1340s were the technological base of the Ming treasure fleets two generations later.
        - |
          Chinese shipbuilding continued; the state, not the shipyards, withdrew after 1433.
        - |
          The Mongols failed at sea against Japan and Java and never invaded India by sea.
      answer: 1
      explanation: |
        Skill: continuity from private Chinese shipping to the state voyages.

    # ---- Stimulus set B: a table on a trans-Saharan crossing (2.4)
    - slug: apworld-u02-w06-q04
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course describing a caravan route from Sijilmasa in Morocco to the Niger bend about 1350, with rounded figures.

        | Stage | Distance (km, rounded) | Days | Goods carried | Notes |
        |---|---|---|---|---|
        | Sijilmasa to Taghaza | 800 | about 25 | Cloth, copper, horses, books, dates | Salt loaded at Taghaza's mines |
        | Taghaza to Walata | 900 | about 30 | Salt slabs added | Ten-day waterless stage; scout sent ahead for water |
        | Walata to the Niger bend (Timbuktu) | 400 | about 15 | Salt, cloth, copper | Gold, ivory and enslaved captives bought for the return |
        | Total | 2,100 | about 70 | | Caravans of hundreds to thousands of camels |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "The Sahara was crossed quickly and cheaply by horse"
        - "Trans-Saharan trade required large, organised caravans making long, dangerous journeys, so only valuable goods such as salt, gold and captives justified the cost"
        - "Gold was carried south from Morocco to the Niger"
        - "The route avoided all oases"
      option_explanations:
        - |
          The journey took about seventy days by camel; horses were cargo, not transport, and could not survive the crossing.
        - |
          Correct. Months of travel with waterless stages and caravans of hundreds of animals meant the trade was built on goods worth the risk.
        - |
          Gold moved north; the table shows it bought at the Niger for the return trip.
        - |
          Taghaza and Walata were oasis stops; the scout's job was to secure water at the next one.
      answer: 1
      explanation: |
        Skill: inferring the economics of a route from a data stimulus.

