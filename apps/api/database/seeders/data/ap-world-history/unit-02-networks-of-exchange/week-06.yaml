      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course describing a caravan route from Sijilmasa in Morocco to the Niger bend about 1350, with rounded figures.

        | Stage | Distance (km, rounded) | Days | Goods carried | Notes |
        |---|---|---|---|---|
        | Sijilmasa to Taghaza | 800 | about 25 | Cloth, copper, horses, books, dates | Salt loaded at Taghaza's mines |
        | Taghaza to Walata | 900 | about 30 | Salt slabs added | Ten-day waterless stage; scout sent ahead for water |
        | Walata to the Niger bend (Timbuktu) | 400 | about 15 | Salt, cloth, copper | Gold, ivory and enslaved captives bought for the return |
        | Total | 2,100 | about 70 | | Caravans of hundreds to thousands of camels |
      prompt: |
        The presence of "books" among the goods carried south is best explained by
      options:
        - "the demand of Mali's Muslim scholars and the growth of learning at Timbuktu"
        - "the illiteracy of North African merchants"
        - "the Mongol conquest of Morocco"
        - "European missionaries in the Sahel"
      option_explanations:
        - |
          Correct. Islam crossed the desert with trade; Timbuktu's mosques and scholars created a market for Arabic manuscripts.
        - |
          Merchants carried books to sell; the trade shows literacy on both ends.
        - |
          The Mongols never reached Morocco; their westernmost khanate stopped in Persia and Russia.
        - |
          No European missionaries operated in the Sahel in 1350; the books were Islamic.
      answer: 0
      explanation: |
        Skill: linking a trade good to cultural exchange.

    - slug: apworld-u02-w06-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table description: A table compiled for this course describing a caravan route from Sijilmasa in Morocco to the Niger bend about 1350, with rounded figures.

        | Stage | Distance (km, rounded) | Days | Goods carried | Notes |
        |---|---|---|---|---|
        | Sijilmasa to Taghaza | 800 | about 25 | Cloth, copper, horses, books, dates | Salt loaded at Taghaza's mines |
        | Taghaza to Walata | 900 | about 30 | Salt slabs added | Ten-day waterless stage; scout sent ahead for water |
        | Walata to the Niger bend (Timbuktu) | 400 | about 15 | Salt, cloth, copper | Gold, ivory and enslaved captives bought for the return |
        | Total | 2,100 | about 70 | | Caravans of hundreds to thousands of camels |
      prompt: |
        Which technology most directly made the journey in the table possible?
      options:
        - "The lateen sail"
        - "The magnetic compass"
        - "The camel saddle, which let camels carry heavy loads across waterless terrain"
        - "Paper money"
      option_explanations:
        - |
          Sails belong to the Indian Ocean; nothing sails across sand.
        - |
          Caravans navigated by guides, stars and known wells; the compass was a maritime tool in this period.
        - |
          Correct. Saddles developed in Arabia and North Africa turned the camel into a reliable pack animal for desert crossings.
        - |
          Trans-Saharan trade used gold, salt and barter; paper money was Chinese.
      answer: 2
      explanation: |
        Skill: identifying the enabling technology of a network (CED 2.4).

    # ---- Stand-alone, this week and review
    - slug: apworld-u02-w06-q07
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains why Zheng He's voyages ended in 1433?
      options:
        - "The fleets were destroyed by Portuguese warships"
        - "China had conquered the entire Indian Ocean and no longer needed fleets"
        - "The monsoon winds ceased"
        - "Confucian officials judged the voyages costly and unproductive, and the Ming turned resources to the northern frontier"
      option_explanations:
        - |
          The Portuguese did not enter the Indian Ocean until 1498.
        - |
          China sought tribute, not conquest, and ruled no part of the ocean.
        - |
          The monsoon is a permanent climatic pattern.
        - |
          Correct. The voyages brought prestige and tribute but no profit; the Mongol threat and the new capital at Beijing took priority.
      answer: 3
      explanation: |
        Topic 2.3: the end of the state voyages and its significance.

    - slug: apworld-u02-w06-q08
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Diasporic merchant communities in Indian Ocean ports contributed most directly to which cultural development?
      options:
        - "The spread of Islam to the Swahili coast and Southeast Asia through settled traders who married locally"
        - "The spread of Confucianism to East Africa"
        - "The conversion of China to Christianity"
        - "The end of Hinduism in India"
      option_explanations:
        - |
          Correct. Arab, Persian and Gujarati Muslims who settled in ports carried their faith, which rulers then adopted; Swahili culture and Malacca's conversion are the results.
        - |
          Chinese merchants settled in Southeast Asia, but Confucianism did not take root in Africa.
        - |
          Nestorian and Catholic missions reached Mongol China by land, and China did not convert.
        - |
          Hinduism remained India's majority faith throughout.
      answer: 0
      explanation: |
        Topic 2.3: cultural effects of merchant settlement.

    - slug: apworld-u02-w06-q09
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following is an accurate statement about the trans-Saharan trade in enslaved people?
      options:
        - "It began only after Europeans arrived in 1450"
        - "It was confined to the Swahili coast"
        - "It carried captives from the Sahel north to North Africa and the Islamic world for centuries before the Atlantic trade"
        - "It was abolished by Mansa Musa in 1324"
      option_explanations:
        - |
          The trade was centuries old by 1450; the Atlantic trade came later.
        - |
          The Swahili coast had its own Indian Ocean trade in captives; the trans-Saharan trade was separate.
        - |
          Correct. Captives were among the main goods carried north with gold, and the trade continued into the 1800s.
        - |
          Mali's rulers took part in the trade; no abolition occurred.
      answer: 2
      explanation: |
        Topic 2.4: the full range of goods, including people, that crossed the Sahara.

    - slug: apworld-u02-w06-q10
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Compared with the Silk Roads, the Indian Ocean network differed most in that it
      options:
        - "carried only religious ideas and no goods"
        - "could move bulk goods such as timber and grain because ships carried far more than camels"
        - "depended on Mongol protection"
        - "connected only two regions"
      option_explanations:
        - |
          The ocean carried pepper, cotton, porcelain and more; goods were its purpose.
        - |
          Correct. Ship transport made bulk cargo profitable; overland caravans could carry only high-value luxuries.
        - |
          The Mongols never controlled the ocean; port rulers and shared Islamic law provided security.
        - |
          It linked East Africa, Arabia, Persia, India, Southeast Asia and China.
      answer: 1
      explanation: |
        Spiral review of 2.1 through comparison with 2.3.

    - slug: apworld-u02-w06-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which African state's wealth came from the gold that reached the Swahili port of Kilwa through Sofala?
      options:
        - "Mali"
        - "Ethiopia"
        - "Great Zimbabwe"
        - "The Hausa kingdom of Kano"
      option_explanations:
        - |
          Mali's gold went north across the Sahara, not east to Kilwa.
        - |
          Ethiopia traded through the Red Sea and was not a gold supplier to Kilwa.
        - |
          Correct. The Shona kingdom at Great Zimbabwe controlled the plateau gold fields whose output reached the coast at Sofala.
        - |
          Kano lived by crafts and trans-Saharan trade in the central savanna.
      answer: 2
      explanation: |
        Spiral review of 1.5 in its Indian Ocean context.

    - slug: apworld-u02-w06-q12
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which statement correctly compares the security of the Silk Roads and the trans-Saharan routes in the fourteenth century?
      options:
        - "Both were protected by the Mongol khanates"
        - "The Silk Roads were protected by the Mongol peace, while the trans-Saharan routes relied on Mali's cavalry and Berber escorts"
        - "Neither route had any protection"
        - "The trans-Saharan routes were protected by the Yuan dynasty"
      option_explanations:
        - |
          The Mongols never reached the Sahara; no khanate extended into Africa.
        - |
          Correct. Different powers kept different routes safe; Ibn Battuta travelled both and praised Mali's security.
        - |
          Both routes had armed protection that merchants paid for in tolls.
        - |
          The Yuan ruled China, on the far side of Eurasia.
      answer: 1
      explanation: |
        Spiral review of 2.2 through comparison with 2.4.

    - slug: apworld-u02-w06-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The conversion of Malacca's ruler to Islam around 1400 and the city's rise as an entrepôt are best explained together by
      options:
        - "the Khmer Empire's conquest of the Malay peninsula"
        - "the Mongol capture of the city"
        - "the decline of all trade in Southeast Asia"
        - "the ruler's wish to attract Muslim merchants who dominated Indian Ocean trade through the strait"
      option_explanations:
        - |
          The Khmer were inland and in decline; they never held Malacca.
        - |
          The Mongols never took Malacca, which did not yet exist during their expeditions.
        - |
          Trade was growing, which is why a new port could rise so fast.
        - |
          Correct. Islam and the strait together drew Gujarati, Arab and Chinese Muslim traders, making Malacca the meeting point of the ocean's halves.
      answer: 3
      explanation: |
        Spiral review of 1.3 in its network context.

    - slug: apworld-u02-w06-q14
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Which Mongol institution most directly made it possible for a merchant such as Marco Polo to travel overland from Persia to China with official protection?
      options:
        - "The yam relay-post system with stations and passes for travellers"
        - "The Yuan civil service examinations"
        - "The Golden Horde's tribute collection in Russia"
        - "The Ilkhanate's conversion to Islam"
      option_explanations:
        - |
          Correct. The yam's stations, horses and passes carried envoys and merchants across the khanates under the Pax Mongolica.
        - |
