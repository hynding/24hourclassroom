    prompt: |
      The presence of "salt" in the trans-Saharan cargo column and in no other reflects
    options:
      - "the lack of salt in the Sahel, which made Saharan mine salt a necessity exchanged for gold"
      - "a religious prohibition on salt in the Indian Ocean"
      - "the Mongols' monopoly of salt in Asia"
      - "the use of salt as currency in China"
    option_explanations:
      - |
        Correct. Mines such as Taghaza supplied a region without salt; the gold-for-salt exchange was the trade's foundation.
      - |
