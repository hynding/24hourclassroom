unit: 2
description: |
  42 questions · about 72 minutes · every topic of Unit 2 (2.1 to 2.7) with review of Unit 1. Four source-based
  multiple-choice sets in the AP style (Marco Polo on the Mongol army, Boccaccio on the plague in Florence, a
  described account of Ibn Battuta in the Indian Ocean, and a comparison table of the three networks),
  stand-alone multiple choice, select-all, true/false and fill-in-the-blank items, two short-answer questions
  (3 points each) and one long essay question (6 points). Multiple choice, select-all and true/false items are
  graded at once; fill-in-the-blank items are matched automatically; the free-response items are graded by your
  teacher against the scoring notes.
questions:
  # ---- Stimulus set A: Marco Polo on the Mongol army (2.2)
  - slug: apworld-u02-exam-q01
    type: multiple_choice
    topic_code: "2.2"
    source: "Primary source: Marco Polo, The Travels of Marco Polo, Book I ch. 54 (Yule–Cordier edition, 1903), Wikisource"
    points: 1
    stimulus: |
      "Well, he appoints an officer to every ten men, one to every hundred, one to every thousand, and one to every ten thousand, so that his own orders have to be given to ten persons only, and each of these ten persons has to pass the orders only to other ten, and so on; no one having to give orders to more than ten. ... And in case of great urgency they will ride ten days on end without lighting a fire or taking a meal."

      — Marco Polo on the customs of the Tartars in war, The Travels of Marco Polo, Book I, chapter 54 (Yule–Cordier edition, 1903)
    prompt: |
      The organisation Polo describes most directly helps explain which feature of the Mongol conquests?
    options:
      - "The speed and coordination with which Mongol armies moved across Eurasia"
      - "The Mongols' reliance on infantry drawn from conquered peoples"
      - "The Mongols' preference for sieges over open battle"
      - "The Mongols' adoption of Chinese examinations for officers"
    option_explanations:
      - |
        Correct. The decimal chain of command and the riders' endurance made Mongol forces faster and more coordinated than feudal levies.
      - |
        The passage describes mounted riders, and the core army was Mongol cavalry; conquered specialists were used for sieges, not as the basis of the army.
      - |
        Polo describes riding and endurance, which is the opposite of static siege warfare; sieges relied on borrowed engineers.
      - |
        Officers were appointed by the khan, not examined; the Yuan curtailed Chinese examinations.
    answer: 0
    explanation: |
      Polo's decimal system is the standard evidence for why a small steppe population could conquer so widely.

  - slug: apworld-u02-exam-q02
    type: multiple_choice
    topic_code: "2.2"
    source: "Primary source: Marco Polo, The Travels of Marco Polo, Book I ch. 54 (Yule–Cordier edition, 1903), Wikisource"
    points: 1
    stimulus: |
      "Well, he appoints an officer to every ten men, one to every hundred, one to every thousand, and one to every ten thousand, so that his own orders have to be given to ten persons only, and each of these ten persons has to pass the orders only to other ten, and so on; no one having to give orders to more than ten. ... And in case of great urgency they will ride ten days on end without lighting a fire or taking a meal."

      — Marco Polo on the customs of the Tartars in war, The Travels of Marco Polo, Book I, chapter 54 (Yule–Cordier edition, 1903)
    prompt: |
      Polo's position as a European who served Kublai Khan for many years most likely affects this passage by
    options:
      - "making him hostile to everything Mongol"
      - "leading him to present Mongol institutions admiringly to readers whose own armies were feudal levies"
      - "giving him no first-hand knowledge of the army"
      - "causing him to omit any numbers"
    option_explanations:
      - |
        Polo admired Kublai and praised Mongol efficiency throughout the book.
      - |
        Correct. He writes as an insider explaining a marvel, which makes him reliable on structure and prone to admiration and inflated figures.
      - |
        He travelled with Mongol forces and officials for seventeen years; the problem is his perspective, not ignorance.
      - |
        He gives numbers constantly, often inflated; that is why historians read him for institutions rather than totals.
    answer: 1
    explanation: |
      Sourcing: point of view (a servant of the khan) and audience (Europeans) shape an admiring, institution-focused account.

  - slug: apworld-u02-exam-q03
    type: multiple_choice
    topic_code: "2.1"
    source: "Primary source: Marco Polo, The Travels of Marco Polo, Book I ch. 54 (Yule–Cordier edition, 1903), Wikisource"
    points: 1
    stimulus: |
      "Well, he appoints an officer to every ten men, one to every hundred, one to every thousand, and one to every ten thousand, so that his own orders have to be given to ten persons only, and each of these ten persons has to pass the orders only to other ten, and so on; no one having to give orders to more than ten. ... And in case of great urgency they will ride ten days on end without lighting a fire or taking a meal."

      — Marco Polo on the customs of the Tartars in war, The Travels of Marco Polo, Book I, chapter 54 (Yule–Cordier edition, 1903)
    prompt: |
      The military power Polo describes had which effect on the Silk Roads after about 1250?
    options:
      - "It closed the routes to all non-Mongol merchants"
      - "It diverted all trade to the Indian Ocean"
      - "It suppressed banditry and taxed trade, increasing the volume of goods and travellers on the routes"
      - "It replaced caravans with river shipping"
    option_explanations:
      - |
        Non-Mongol merchants such as Polo himself travelled freely with passes; the routes opened rather than closed.
      - |
        Overland trade grew under the Mongols; the shift to the sea came after the Pax broke down in the 1300s.
      - |
        Correct. The Pax Mongolica made the roads safe and profitable to tax, which is the CED's link between 2.2 and 2.1.
      - |
        Central Asia has no navigable rivers connecting China to Persia; caravans remained the means of transport.
    answer: 2
    explanation: |
      Mongol security is the chief political cause of Silk Road growth in this period.

  # ---- Stimulus set B: Boccaccio on the plague (2.6)
  - slug: apworld-u02-exam-q04
    type: multiple_choice
    topic_code: "2.6"
    source: "Primary source: Giovanni Boccaccio, The Decameron, Introduction to the First Day (trans. J. M. Rigg, 1903), Project Gutenberg"
    points: 1
    stimulus: |
      "In men and women alike it first betrayed itself by the emergence of certain tumours in the groin or the armpits, some of which grew as large as a common apple, others as an egg, some more, some less, which the common folk called gavoccioli. ... Brother was forsaken by brother, nephew by uncle, brother by sister, and oftentimes husband by wife; nay, what is more, and scarcely to be believed, fathers and mothers were found to abandon their own children, untended, unvisited, to their fate, as if they had been strangers. ... Upwards of a hundred thousand human beings lost their lives within the walls of the city of Florence."

      — Giovanni Boccaccio, The Decameron, Introduction to the First Day (1353), translated by J. M. Rigg, 1903
    prompt: |
      The symptoms Boccaccio describes identify the disease as
    options:
      - "smallpox, carried from the Americas"
      - "malaria, carried by mosquitoes from Africa"
      - "cholera, carried in contaminated water"
      - "bubonic plague, carried by fleas on rodents along trade routes"
    option_explanations:
      - |
        Smallpox produces a rash, not swellings; and it went to the Americas, not from them, after 1492.
      - |
        Malaria causes fevers, not swellings, and was already endemic in the Mediterranean.
      - |
        Cholera's symptoms are intestinal and its great pandemics belong to the nineteenth century.
      - |
        Correct. Buboes in the groin and armpits are the mark of bubonic plague, the disease of the Black Death.
    answer: 3
    explanation: |
      The gavoccioli are buboes; the Black Death was bubonic (and pneumonic) plague.

  - slug: apworld-u02-exam-q05
    type: multiple_choice
    topic_code: "2.6"
    source: "Primary source: Giovanni Boccaccio, The Decameron, Introduction to the First Day (trans. J. M. Rigg, 1903), Project Gutenberg"
    points: 1
    stimulus: |
      "In men and women alike it first betrayed itself by the emergence of certain tumours in the groin or the armpits, some of which grew as large as a common apple, others as an egg, some more, some less, which the common folk called gavoccioli. ... Brother was forsaken by brother, nephew by uncle, brother by sister, and oftentimes husband by wife; nay, what is more, and scarcely to be believed, fathers and mothers were found to abandon their own children, untended, unvisited, to their fate, as if they had been strangers. ... Upwards of a hundred thousand human beings lost their lives within the walls of the city of Florence."

      — Giovanni Boccaccio, The Decameron, Introduction to the First Day (1353), translated by J. M. Rigg, 1903
    prompt: |
      Which later development in Western Europe is most directly a consequence of the mortality Boccaccio describes?
    options:
      - "The strengthening of serfdom as lords tightened control"
      - "The decline of towns in favour of manors"
      - "Rising wages and the weakening of serfdom as labour became scarce"
      - "The expansion of the Mongol Empire into Italy"
    option_explanations:
      - |
        Lords tried to tighten control, but scarcity of labour gave peasants bargaining power and serfdom weakened in the west.
      - |
        Towns recovered and grew as survivors inherited wealth and wages rose.
      - |
        Correct. With a third of the workforce dead, survivors demanded higher wages and freedom of movement.
      - |
        The Mongols never reached Italy, and their empire was fragmenting in the 1340s.
    answer: 2
    explanation: |
      The labour-shortage effect is the CED's main economic consequence of the Black Death in Western Europe.

  - slug: apworld-u02-exam-q06
    type: multiple_choice
    topic_code: "2.5"
    source: "Primary source: Giovanni Boccaccio, The Decameron, Introduction to the First Day (trans. J. M. Rigg, 1903), Project Gutenberg"
    points: 1
    stimulus: |
      "In men and women alike it first betrayed itself by the emergence of certain tumours in the groin or the armpits, some of which grew as large as a common apple, others as an egg, some more, some less, which the common folk called gavoccioli. ... Brother was forsaken by brother, nephew by uncle, brother by sister, and oftentimes husband by wife; nay, what is more, and scarcely to be believed, fathers and mothers were found to abandon their own children, untended, unvisited, to their fate, as if they had been strangers. ... Upwards of a hundred thousand human beings lost their lives within the walls of the city of Florence."

      — Giovanni Boccaccio, The Decameron, Introduction to the First Day (1353), translated by J. M. Rigg, 1903
    prompt: |
      A historian comparing this account with Ibn Battuta's description of Damascus in 1348, where Muslims, Jews and Christians prayed together for relief, would most reasonably conclude that
    options:
      - "the plague was less severe in the Islamic world"
      - "responses to the same disaster varied with the author's purpose and the community's religious practice"
      - "Boccaccio copied his account from Ibn Battuta"
      - "the plague reached Damascus a century after Florence"
    option_explanations:
      - |
        Cairo and Damascus suffered as badly as Florence; Ibn Battuta reports daily death tolls in the thousands.
      - |
        Correct. Both describe real responses; Boccaccio's literary purpose and Christian Florence's experience differ from a jurist's view of a Muslim city's collective prayer.
      - |
        The two never met and wrote in different languages for different audiences.
      - |
        Both cities were struck in 1348, which is the point of the comparison.
    answer: 1
    explanation: |
      Comparing sources requires attention to author, audience and purpose; the contrast shows social response, not disease severity.

  # ---- Stimulus set C: Ibn Battuta in the Indian Ocean, described (2.3)
  - slug: apworld-u02-exam-q07
    type: multiple_choice
    topic_code: "2.3"
    source: "general knowledge; Ibn Battuta's travels are described, not quoted"
    points: 1
    stimulus: |
      Description written for this course of passages in the travels of Ibn Battuta (dictated 1355).

      At Kilwa on the East African coast in 1331, Ibn Battuta found a well-built town of wood and coral whose Muslim sultan was praised for generosity to the poor and for raids into the non-Muslim interior for plunder and captives. At Calicut on India's Malabar coast he saw Chinese junks, the largest with four decks, private cabins with latrines for merchants, and crews of up to a thousand; he reported that only Chinese ships sailed the route to China, and that Malabar's Hindu rulers protected Muslim merchants because the ports' income depended on them. In the Maldives he served as a judge under a Muslim sultana and tried, without success, to make women cover more of their bodies.
    prompt: |
      The description of Calicut best supports which conclusion about the Indian Ocean network?
    options:
      - "Chinese shipbuilding and Chinese merchants played a leading role in the eastern half of the ocean's trade"
      - "Hindu rulers excluded foreign merchants from their ports"
      - "Ships were small and could not carry passengers"
      - "The Portuguese already controlled the route to China"
    option_explanations:
      - |
        Correct. Multi-deck junks with cabins and large crews, sailing the China route exclusively, show China's maritime strength before the Ming withdrawal.
      - |
        The description says the opposite: Hindu rulers protected Muslim merchants for the sake of trade revenue.
      - |
        Four decks, private cabins and crews of a thousand describe very large ships carrying passengers.
      - |
        The Portuguese reached India in 1498, over 150 years after Ibn Battuta's visit.
    answer: 0
    explanation: |
      Ibn Battuta's junks are the standard evidence for Chinese maritime technology in the 1300s.

  - slug: apworld-u02-exam-q08
    type: multiple_choice
    topic_code: "2.3"
    source: "general knowledge; Ibn Battuta's travels are described, not quoted"
    points: 1
    stimulus: |
      Description written for this course of passages in the travels of Ibn Battuta (dictated 1355).

      At Kilwa on the East African coast in 1331, Ibn Battuta found a well-built town of wood and coral whose Muslim sultan was praised for generosity to the poor and for raids into the non-Muslim interior for plunder and captives. At Calicut on India's Malabar coast he saw Chinese junks, the largest with four decks, private cabins with latrines for merchants, and crews of up to a thousand; he reported that only Chinese ships sailed the route to China, and that Malabar's Hindu rulers protected Muslim merchants because the ports' income depended on them. In the Maldives he served as a judge under a Muslim sultana and tried, without success, to make women cover more of their bodies.
    prompt: |
      Ibn Battuta's failure to change women's dress in the Maldives, like his complaints about customs in Mali, is best interpreted as evidence that
    options:
      - "Islam had not reached the Indian Ocean islands"
      - "Muslim judges held no authority outside Arabia"
      - "the Maldives were governed by Hindu kings"
      - "conversion to Islam in trading regions was often syncretic, keeping local practices alongside the new faith"
    option_explanations:
      - |
        The Maldives had a Muslim sultana and employed him as an Islamic judge; Islam was present.
      - |
        He was appointed and paid as a judge; authority existed, but local custom resisted some of his rulings.
      - |
        The ruler was a Muslim sultana, which is itself a departure from his expectations.
      - |
        Correct. Across the networks, societies adopted Islam while keeping local custom, which a North African jurist found un-Islamic.
    answer: 3
    explanation: |
      Syncretism (2.5) is visible in Ibn Battuta's discomfort wherever Islam had spread by trade rather than conquest.

  - slug: apworld-u02-exam-q09
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge; Ibn Battuta's travels are described, not quoted"
    points: 1
    stimulus: |
      Description written for this course of passages in the travels of Ibn Battuta (dictated 1355).

      At Kilwa on the East African coast in 1331, Ibn Battuta found a well-built town of wood and coral whose Muslim sultan was praised for generosity to the poor and for raids into the non-Muslim interior for plunder and captives. At Calicut on India's Malabar coast he saw Chinese junks, the largest with four decks, private cabins with latrines for merchants, and crews of up to a thousand; he reported that only Chinese ships sailed the route to China, and that Malabar's Hindu rulers protected Muslim merchants because the ports' income depended on them. In the Maldives he served as a judge under a Muslim sultana and tried, without success, to make women cover more of their bodies.
    prompt: |
      Review. The description of Kilwa's sultan is most consistent with which feature of Swahili city-states studied in Unit 1?
    options:
      - "They were ruled directly by the Mali Empire"
      - "They were Muslim trading towns whose wealth came from the coast and whose relations with the interior were often extractive"
      - "They were Christian kingdoms allied with Ethiopia"
      - "They had no contact with the Indian Ocean trade"
    option_explanations:
      - |
        Mali lay on the far side of the continent and never ruled the East African coast.
      - |
        Correct. Kilwa's Muslim elite lived by trade (and Sofala's gold) and raided or traded with a non-Muslim interior for captives and goods.
      - |
        The Swahili towns were Muslim; Ethiopia's Christian kingdom lay far to the north.
      - |
        The towns existed because of the ocean trade; Ibn Battuta arrived by ship.
    answer: 1
    explanation: |
      Spiral review of 1.5: the Swahili coast as Muslim, mercantile and oriented to the sea rather than the interior.

  # ---- Stimulus set D: three-network comparison table (2.7)
  - slug: apworld-u02-exam-q10
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge; table compiled for this course"
    points: 1
    stimulus: |
      Table compiled for this course comparing the three Unit 2 networks, c. 1200–c. 1450.

      | | Silk Roads | Indian Ocean | Trans-Saharan |
      |---|---|---|---|
      | Transport | Camels, horses | Dhows, junks | Camels |
      | Typical cargo | Silk, porcelain, spices, paper; horses, silver, furs | Pepper, cotton cloth, porcelain, timber, grain, gold, ivory, enslaved people | Gold, salt, copper, cloth, books, enslaved people |
      | Political control | Mongol khanates c. 1250–1350 | None; competing port states | Mali (then Songhai) at the southern end |
      | Religion spread | Islam into Central Asia | Islam to East Africa and Southeast Asia | Islam to the Sahel |
      | Named cities | Kashgar, Samarkand | Kilwa, Calicut, Malacca, Hormuz | Timbuktu, Djenné |
    prompt: |
      Which difference shown in the table best explains why Indian Ocean trade continued to grow after 1350 while Silk Road trade declined?
    options:
      - "The ocean network spread Islam and the Silk Roads did not"
      - "The ocean network depended on no single political power, so the collapse of the Mongol khanates did not break it"
      - "The ocean network used camels"
      - "The ocean network carried no luxury goods"
    option_explanations:
      - |
        The table shows Islam spreading along all three networks, so this is not a difference.
      - |
        Correct. The Silk Roads depended on the Mongol peace; when it ended, overland security collapsed, while the monsoon and port states continued.
      - |
        Camels appear under the Silk Roads and trans-Saharan columns, not the ocean.
      - |
        Pepper and porcelain are luxuries; the ocean carried both luxuries and bulk goods.
    answer: 1
    explanation: |
      Political dependence is the key difference in 2.7; the ocean's lack of a single master was a strength when empires fell.

