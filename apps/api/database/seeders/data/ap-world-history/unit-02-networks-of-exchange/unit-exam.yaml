    prompt: |
      The "Religion spread" row is best explained by which shared feature of all three networks?
    options:
      - "Conquest of each region by Muslim armies"
      - "The Mongol khans' conversion to Islam"
      - "The dominance of Muslim merchants who settled in diasporic communities along every route"
