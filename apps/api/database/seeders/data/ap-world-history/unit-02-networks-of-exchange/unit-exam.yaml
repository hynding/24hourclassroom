      - |
        Correct. Muslim merchant networks ran all three routes, and where merchants settled, Sufis and scholars followed.
      - |
        The Quran was not translated for conversion; Arabic literacy spread with the faith.
    answer: 2
    explanation: |
      The common mechanism of religious diffusion in Unit 2 is commerce.

