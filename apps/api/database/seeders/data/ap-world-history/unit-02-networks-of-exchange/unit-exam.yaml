    answer: 0
    explanation: |
      Salt and gold are the two necessities whose uneven distribution made the desert worth crossing.

  # ---- Stand-alone multiple choice (new content)
  - slug: apworld-u02-exam-q13
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which commercial practice most directly reduced the need for merchants on the Silk Roads to carry large amounts of coin?
    options:
      - "The tributary system"
      - "The civil service examination"
      - "The yam relay posts"
      - "Bills of exchange and other credit instruments"
    option_explanations:
      - |
        The tributary system governed diplomatic exchange with the Chinese court, not merchant payments.
      - |
        Examinations selected officials; they had nothing to do with trade finance.
      - |
        The yam moved messengers and officials; it was not a financial instrument.
      - |
        Correct. Paper money, bills of exchange and banking let merchants settle debts across distances without transporting silver.
    answer: 3
    explanation: |
      Improved commercial practices are the CED's first cause of Silk Road growth.

  - slug: apworld-u02-exam-q14
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Rising demand for luxury goods along the Silk Roads had which effect on production in China?
    options:
      - "Chinese workshops stopped producing silk to focus on grain"
      - "China banned all exports to protect domestic supply"
      - "Chinese artisans expanded the production of porcelain and silk, including styles made for export markets"
      - "Chinese producers switched entirely to making weapons"
    option_explanations:
      - |
        Silk remained a leading export; grain was for home consumption.
      - |
        Song and Yuan China taxed and encouraged export trade.
      - |
        Correct. The CED notes that demand for luxuries encouraged Chinese, Persian and Indian artisans to expand output for distant buyers.
      - |
        Weapons were made, but porcelain, silk and iron for export were the growth sectors.
    answer: 2
    explanation: |
      Demand as a cause of changed production is an explicit CED learning objective for 2.1.

  - slug: apworld-u02-exam-q15
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which correctly matches a Mongol khanate with its region and a feature of its rule?
    options:
      - "Golden Horde: Persia; converted to Buddhism"
      - "Chagatai Khanate: China; adopted the civil service examinations fully"
      - "Yuan dynasty: China; placed Mongols and foreigners above Chinese officials"
      - "Ilkhanate: Russia; ruled through the Orthodox Church"
    option_explanations:
      - |
        The Golden Horde ruled Russia and the steppe and converted to Islam.
      - |
        The Chagatai Khanate ruled Central Asia and stayed closest to nomadic ways.
      - |
        Correct. Kublai ruled as emperor of China but ranked Mongols and foreign specialists such as Polo above Chinese scholars.
      - |
        The Ilkhanate ruled Persia and converted to Islam under Ghazan in 1295.
    answer: 2
    explanation: |
      Each khanate adapted to its region differently; know all four.

  - slug: apworld-u02-exam-q16
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which transfer of knowledge or technology is correctly described for the period of Mongol rule?
    options:
      - "Gunpowder moved from Europe to China"
      - "The printing press was invented in Persia and sent to China"
      - "Paper money was adopted permanently and successfully in Persia"
      - "Persian astronomers worked in China and Chinese astronomical knowledge reached the observatory at Maragha"
    option_explanations:
      - |
        Gunpowder was Chinese and moved westward.
      - |
        Printing was Chinese; it reached the west, not the reverse.
      - |
        The Ilkhans tried paper money in 1294 and it failed within months.
      - |
        Correct. The khanates exchanged scholars; the Ilkhanid observatory at Maragha and Kublai's court both hosted foreign astronomers.
    answer: 3
    explanation: |
      Scientific exchange between the Ilkhanate and the Yuan is the CED's example of Mongol-era knowledge transfer.

  - slug: apworld-u02-exam-q17
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which is the best example of the destructive side of the Mongol conquests?
    options:
      - "The collapse of irrigation agriculture in Persia and Iraq after the campaigns of the 1250s"
      - "The construction of the Grand Canal"
      - "The founding of Timbuktu"
      - "The spread of Champa rice"
    option_explanations:
      - |
        Correct. The sack of Baghdad and the ruin of Mesopotamian canals depopulated a region that had fed the caliphate.
      - |
