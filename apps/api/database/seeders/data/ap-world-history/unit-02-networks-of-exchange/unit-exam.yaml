  # ---- Short answer
  - slug: apworld-u02-exam-q40
    type: short_answer
    topic_code: "2.3"
    source: "Primary source: Marco Polo, The Travels of Marco Polo, Book III ch. 9 (Yule–Cordier edition, 1903), Wikisource"
    points: 3
    prompt: |
      Marco Polo wrote of Sumatra in the 1290s that "the Island hath great abundance of treasure, with costly spices, lign-aloes and spikenard and many others that never come into our parts" (The Travels of Marco Polo, Book III, chapter 9, Yule–Cordier edition, 1903).

      (a) Identify ONE reason, suggested by the passage, that Southeast Asia attracted merchants from across the Indian Ocean.
      (b) Explain ONE way the trade Polo describes affected the political development of Southeast Asia in the period c. 1200 to c. 1450.
      (c) Explain ONE limitation of Polo's account as evidence for the Indian Ocean trade.
    answer: |
      (a) 1 point: Southeast Asia produced spices and aromatics (cloves, nutmeg, pepper, aloes-wood) found nowhere else, so merchants from India, Arabia and China came to buy them.
      (b) 1 point with explanation: port states such as Srivijaya, Majapahit and Malacca grew by taxing and protecting the trade through the straits; Malacca's ruler adopted Islam around 1400 to attract Muslim merchants; rulers used trade wealth to build courts and navies.
      (c) 1 point: Polo was a visitor passing through on a Mongol mission, writing for European readers who wanted marvels; he exaggerates quantities, knew no local language, saw only ports, and his book was dictated years later from memory.
    explanation: |
      Scoring: one point per part. (b) must link trade to a state or ruler's power; (c) must name a specific limitation tied to Polo's situation.

  - slug: apworld-u02-exam-q41
    type: short_answer
    topic_code: "2.7"
    source: "general knowledge"
    points: 3
    prompt: |
      (a) Identify ONE cause of growth shared by the Silk Roads, the Indian Ocean and the trans-Saharan networks in the period c. 1200 to c. 1450.
      (b) Explain ONE way the effects of the Silk Roads differed from the effects of the Indian Ocean network in the same period.
      (c) Explain ONE way the spread of the Black Death illustrates the connection between the networks of exchange and their environmental consequences.
    answer: |
      (a) 1 point: rising demand for distant goods; improved transport technology (saddles, dhows, camel saddle); state protection of routes (Mongols, port sultans, Mali); Islamic commercial law and credit.
      (b) 1 point with explanation: the Silk Roads declined after 1350 with the Mongol collapse and plague, while the ocean trade continued; the Silk Roads transferred technologies such as gunpowder westward while the ocean moved crops such as bananas and bulk goods; the Silk Roads enriched inland oasis cities while the ocean built coastal port states.
      (c) 1 point with explanation: the plague moved along the same Mongol routes and the same ships that carried silk and spices, reaching the Black Sea in 1346 and the Mediterranean in 1347; the security and speed that made trade grow also made disease spread; its effects (depopulation, labour shortage, the end of the Pax) then changed the networks themselves.
    explanation: |
      Scoring: one point per part; (b) and (c) require an explanation of the difference or the connection, not a bare statement.

  # ---- Long answer
  - slug: apworld-u02-exam-q42
    type: long_answer
    topic_code: "2.2"
    source: "general knowledge; interpretation written for this course"
    points: 6
    prompt: |
      Evaluate the extent to which the Mongol Empire changed patterns of exchange across Afro-Eurasia in the period c. 1200 to c. 1450.

      Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both change and continuity.
    answer: |
      Thesis (1 point): a defensible claim about extent, for example that the Mongols transformed the overland routes and the transfer of technology for a century but left the Indian Ocean and trans-Saharan networks, and the long-term pattern of Islamic commercial dominance, largely untouched.
      Contextualisation (1 point): the pre-Mongol Silk Roads, Song China's commercial revolution, the Abbasid world, or the Indian Ocean's monsoon trade before 1200.
      Evidence (2 points): at least two specific examples, for example the decimal army and conquests; the yam; passes for merchants; Polo's and Carpini's journeys; the transfer of gunpowder, printing and the compass; Persian astronomers in China and the Maragha observatory; the sack of Baghdad; the Black Death's route; the fall of the Yuan and the Ming turn to the sea; the continued growth of Malacca and Kilwa outside Mongol reach.
      Analysis and reasoning (1 point): uses continuity and change (or causation) to explain how the Mongols caused the changes and why some patterns persisted.
      Complexity (1 point): weighs destructive against connective effects, distinguishes the overland from the maritime and Saharan networks, considers the brevity of the Pax, or traces consequences into later periods (European exploration, gunpowder empires).
    explanation: |
      Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that treats "the Mongols changed everything" without acknowledging the networks they never ruled cannot earn the complexity point.
