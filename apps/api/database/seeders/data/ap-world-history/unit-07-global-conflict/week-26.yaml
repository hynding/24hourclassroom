week: 26
unit: 7
title: "Conducting World War II, Mass Atrocities, and Causation in Global Conflict"
topics: ["7.7", "7.8", "7.9"]
guide: guides/week-26.md
guide_description: |
  How the Second World War was fought and why it killed seventy million: total mobilisation on every continent,
  colonial armies, radar and carriers and strategic bombing, ideology and propaganda on all sides, the atomic
  bomb. Then the century's mass atrocities, from the Armenian genocide and the Holocaust to Cambodia, Rwanda
  and Bosnia, and the unit's causation review of global conflict from 1900 to 1945.
flashcards_description: |
  30 cards on the course and conduct of the Second World War, its technologies and home fronts, the genocides
  of the twentieth century, and the ranking of causes that unit 7 asks for.

flashcards:
  - front: Course of the Second World War in Europe → the sequence 1939–1945
    back: |
      Poland (Sept 1939); Denmark, Norway, the Low Countries and France (spring 1940); Battle of Britain (1940); Balkans and Operation Barbarossa against the USSR (June 1941); Stalingrad (ends Feb 1943); Allied landings in Italy (1943) and Normandy (June 1944); Soviet advance to Berlin; German surrender 8 May 1945.
    topic_code: "7.7"
  - front: Course of the Second World War in Asia and the Pacific → the sequence 1937–1945
    back: |
      Japan at war with China from July 1937; U.S. oil embargo (1941); Pearl Harbor (7 Dec 1941); conquest of the Philippines, Malaya, Singapore, Burma and the Dutch East Indies; Midway (June 1942) turns the tide; island campaigns; firebombing of Tokyo (March 1945); Hiroshima (6 Aug) and Nagasaki (9 Aug); Soviet entry (8 Aug); surrender 15 August 1945.
    topic_code: "7.7"
  - front: Operation Barbarossa (22 June 1941) → why it was decisive
    back: |
      Germany's invasion of the Soviet Union opened the war's largest front: three million German troops, a war of annihilation against Slavs and Jews, the siege of Leningrad and the defeat at Stalingrad. About three-quarters of German military deaths came in the east; Soviet deaths reached about 27 million.
    topic_code: "7.7"
  - front: Pearl Harbor (7 December 1941) → cause and consequence
    back: |
      Japan, cut off from American oil after its occupation of Indochina, struck the U.S. Pacific fleet to win time for conquering Southeast Asia's resources. Roosevelt called it a date which will live in infamy; Congress declared war; Germany declared war on the United States four days later, making the conflict one war.
    topic_code: "7.7"
  - front: Blitzkrieg → what it was and where it worked
    back: |
      Fast combined assault by tanks, motorised infantry and dive-bombers, with radio coordination, to break through and encircle before the enemy could react. Poland in five weeks, France in six (1940); it failed in Russia's distances and winter.
    topic_code: "7.7"
  - front: New technologies of 1939–45 → eight and their uses
    back: |
      Radar (air defence), sonar (anti-submarine), the aircraft carrier (decisive in the Pacific), long-range bombers (strategic bombing), jet engines and the V-2 rocket, penicillin, code-breaking machines (Enigma, Bletchley Park), and the atomic bomb (Manhattan Project).
    topic_code: "7.7"
  - front: Strategic bombing in the Second World War → aim and examples
    back: |
      Destroying industry and morale from the air by attacking cities. The German Blitz on British cities (1940–41); Allied firestorms at Hamburg (1943) and Dresden (Feb 1945); the firebombing of Tokyo (9–10 March 1945, about 100,000 dead). It made civilians the front line.
    topic_code: "7.7"
  - front: Atomic bombs on Hiroshima and Nagasaki → facts and the debate
    back: |
      6 and 9 August 1945; about 80,000 and 40,000 immediate deaths, many more from burns and radiation. Truman's reasons: ending the war without invading Japan, saving Allied lives, demonstrating power (some historians add: to the Soviet Union). Japan surrendered on 15 August, after the Soviet declaration of war as well.
    topic_code: "7.7"
  - front: Home fronts in the Second World War → United States, USSR, Britain, Germany
    back: |
      United States: the arsenal of democracy, 300,000 aircraft, Lend-Lease, women in industry, internment of 120,000 Japanese Americans. USSR: factories moved east of the Urals, women in combat. Britain: rationing, conscription of women. Germany: 12 million forced labourers, full mobilisation only from 1943.
    topic_code: "7.7"
  - front: Colonial and dominion soldiers in 1939–45 → scale
    back: |
      About 2.5 million Indians (the largest volunteer army in history), fighting in North Africa, Italy and Burma; hundreds of thousands of Africans in Burma, Ethiopia and Italy; Algerians, Moroccans and Senegalese in the Free French armies; Australians, Canadians, New Zealanders and South Africans throughout. Their service strengthened claims to independence.
    topic_code: "7.7"
  - front: Atlantic Charter (14 August 1941) → content and later use
    back: |
      Roosevelt and Churchill declared their countries sought no territorial gain, respected the right of all peoples to choose their government, and wanted free trade, freedom from fear and want, and disarmament of aggressors. Colonial nationalists later held Britain to the self-determination clause.
    topic_code: "7.7"
  - front: Ideology and propaganda on all sides, 1939–45 → one example each
    back: |
      Liberal: the Four Freedoms and the Atlantic Charter. Soviet: the Great Patriotic War, Russian patriotism and the Orthodox Church. Nazi: a race war against Jews and Slavs for Lebensraum. Japanese: the Greater East Asia Co-Prosperity Sphere, liberation of Asia under Japanese leadership. All used film, radio, censorship and internment.
    topic_code: "7.7"
  - front: Civilian suffering in 1939–45 → five examples
    back: |
      The siege of Leningrad (about a million dead); the Bengal famine of 1943 (about three million); the Rape of Nanjing (1937); forced labour and sexual slavery in Japan's empire; the Nazi occupation of Poland and the Soviet Union; Soviet deportations of whole nationalities. Civilians were the majority of the war's roughly 70 million dead.
    topic_code: "7.7"
  - front: First World War versus Second World War → five differences
    back: |
      Deaths 10 million soldiers versus 70 million mostly civilians; static western trenches versus mobile fronts on every continent; machine gun and gas versus tank, carrier, bomber and atomic bomb; blockade versus strategic bombing, genocide and famine; armistice and treaties versus unconditional surrender and occupation.
    topic_code: "7.7"
  - front: Genocide → origin of the word and its legal definition
    back: |
      Coined by the Polish-Jewish lawyer Raphael Lemkin in 1944; the UN Genocide Convention (1948) defines it as acts committed with intent to destroy, in whole or in part, a national, ethnical, racial or religious group. Nuremberg had tried crimes against humanity before the word had legal force.
    topic_code: "7.8"
  - front: Armenian genocide (1915–17) → perpetrator, method, toll, conditions
    back: |
      The Ottoman Young Turk (CUP) government deported Armenians from Anatolia toward the Syrian desert; men were killed, women and children marched without food; about a million died. Conditions: war with Russia, fear of Armenian disloyalty, Turkish nationalism, the breakdown of a multinational empire. Denied by Turkey since.
    topic_code: "7.8"
  - front: Holocaust → the four stages, 1933–1945
    back: |
      1933–38: exclusion (boycotts, Nuremberg Laws of 1935, Kristallnacht 1938). 1939–41: ghettos in occupied Poland. 1941–42: mass shooting by the Einsatzgruppen in the Soviet Union (over a million). 1942–45: industrial murder in death camps (Auschwitz, Treblinka, Sobibor) after the Wannsee conference. About six million Jews murdered, with Roma, disabled people, Soviet prisoners, Poles and others.
    topic_code: "7.8"
  - front: Nuremberg trials (1945–46) → charges and significance
    back: |
      The four Allied powers tried 22 Nazi leaders for crimes against peace, war crimes and crimes against humanity; 12 were sentenced to death. Significance: individuals, including heads of state, could be held responsible under international law; the model for the Tokyo trials and later tribunals for Yugoslavia and Rwanda.
    topic_code: "7.8"
  - front: Cambodian genocide (1975–79) → perpetrator, victims, ideas
    back: |
      The Khmer Rouge under Pol Pot emptied the cities, abolished money and religion, and worked or executed about 1.7 million people (a fifth of the population), targeting the educated, minorities (Cham, Vietnamese) and anyone tied to the old regime. A revolutionary utopia pursued by terror after the Vietnam War had destabilised the country.
    topic_code: "7.8"
  - front: Rwandan genocide (1994) → perpetrator, victims, conditions
    back: |
      Hutu-led government, army and Interahamwe militias killed about 800,000 Tutsi and moderate Hutu in about a hundred days after the president's plane was shot down. Conditions: Belgian colonial hardening of Hutu and Tutsi into fixed identities, civil war with the Tutsi RPF, radio propaganda, and the withdrawal of the UN force.
    topic_code: "7.8"
  - front: Bosnia (1992–95) and Srebrenica → what happened
    back: |
      As Yugoslavia broke up, Bosnian Serb forces backed by Serbia expelled and murdered Bosnian Muslims (ethnic cleansing); at Srebrenica in July 1995 about 8,000 men and boys were killed in a UN safe area. NATO bombing and the Dayton Accords (1995) ended the war; the ICTY tried the leaders.
    topic_code: "7.8"
  - front: Conditions shared by the century's genocides → the pattern
    back: |
      A state in crisis or at war; an ideology (racial, national or revolutionary) defining a group as an enemy; prior exclusion and propaganda; bureaucratic organisation; the indifference or withdrawal of outsiders. Hatred alone explains none of them; state power and war are the constants.
    topic_code: "7.8"
  - front: Rape of Nanjing (December 1937) → facts
    back: |
      After taking the Chinese capital, Japanese troops killed tens of thousands of prisoners and civilians (Chinese estimates about 300,000) and raped tens of thousands of women over six weeks. Part of a wider pattern of atrocity in Japan's war in China and later in Southeast Asia.
    topic_code: "7.8"
  - front: Causation in global conflict, 1900–1945 → a three-level hierarchy
    back: |
      Structural: industrial technology, nationalism, imperialism, the collapse of multinational empires. Intermediate: the settlement of 1919, the Depression, fascist and militarist ideology. Immediate: the July Crisis of 1914, the invasion of Poland, Pearl Harbor. Rank them and explain the ranking.
    topic_code: "7.9"
  - front: Consequences of the two world wars → six to name
    back: |
      About 80 million dead; the end of the European empires' legitimacy and the beginning of decolonization; the United States and the Soviet Union as superpowers; the United Nations and the Genocide Convention; the atomic age; a Europe divided between the two victors.
    topic_code: "7.9"
  - front: Why the Second World War was more destructive than the First → four reasons
    back: |
      Mobile warfare and bombing spread the fighting over whole continents; ideological regimes waged war on civilians by design (Nazi race war, Japanese conquest); total mobilisation reached every economy and colony; the technologies of 1939–45 (bombers, atomic weapons) killed at a scale 1914 could not.
    topic_code: "7.9"
  - front: Stalingrad (August 1942 – February 1943) → why it mattered
    back: |
      The German Sixth Army was encircled and destroyed in the city on the Volga; about 300,000 Axis troops were lost. The first great German defeat, after which the Red Army advanced continuously; the turning point of the war in Europe.
    topic_code: "7.7"
  - front: Midway (June 1942) → why it mattered
    back: |
      American carriers, warned by code-breaking, sank four Japanese carriers; Japan lost the naval initiative in the Pacific for good. With Guadalcanal (1942–43) it began the island campaigns toward Japan.
    topic_code: "7.7"
  - front: Japanese American internment (1942–45) → what it shows about total war
    back: |
      About 120,000 people of Japanese descent, two-thirds of them U.S. citizens, were removed from the West Coast to camps by executive order. A democracy at war also repressed civilians; the United States apologised and paid compensation in 1988.
    topic_code: "7.7"
  - front: Morgenthau's reports (1915) → why they matter for 7.8
    back: |
      Henry Morgenthau, U.S. ambassador to the Ottoman Empire, cabled Washington in 1915 that a campaign of race extermination was under way against the Armenians, and later published an account. Contemporary diplomatic evidence shows the deportations were known abroad as they happened.
    topic_code: "7.8"

quiz:
  description: |
    25 questions · about 35 minutes · topics 7.7, 7.8 and 7.9 (conducting the Second World War, mass atrocities,
    and causation in global conflict), with about a third of the items reviewing the First World War, the peace,
    the Depression and the causes of 1939 from earlier in unit 7 and the empires of unit 6. Multiple choice,
    select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Roosevelt, 8 December 1941, and the Atlantic Charter
    - slug: apworld-u07-w26-q01
      type: multiple_choice
      topic_code: "7.7"
      source: "Primary sources: Franklin D. Roosevelt, address to Congress, 8 December 1941 (Miller Center); the Atlantic Charter, 14 August 1941 (Avalon Project); U.S. government works"
      points: 1
      stimulus: |
        Source 1: "Yesterday, December 7, 1941—a date which will live in infamy—the United States of America was suddenly and deliberately attacked by naval and air forces of the Empire of Japan." — President Franklin D. Roosevelt, asking Congress to declare war, 8 December 1941

        Source 2: "First, their countries seek no aggrandizement, territorial or other; [...] Third, they respect the right of all peoples to choose the form of government under which they will live; and they wish to see sovereign rights and self government restored to those who have been forcibly deprived of them". — The Atlantic Charter, joint declaration of Roosevelt and Churchill, 14 August 1941
      prompt: |
        Source 1 describes the event that
      options:
        - "began the Second World War in Europe"
        - "ended the war with Japan"
        - "brought the United States into the war as a full belligerent, uniting the European and Pacific conflicts into one world war"
        - "caused Germany to invade the Soviet Union"
      option_explanations:
        - |
          The European war began with Poland in September 1939, more than two years earlier.
        - |
          The war with Japan ended in August 1945, after the atomic bombs and the Soviet declaration of war.
        - |
          Correct. Congress declared war on Japan on 8 December; Germany and Italy declared war on the United States on 11 December, and American industry and manpower joined both theatres.
        - |
          Barbarossa began in June 1941, six months before Pearl Harbor.
      answer: 2
      explanation: |
        Skill: sourcing and chronology. Pearl Harbor is the hinge that made two regional wars one.

    - slug: apworld-u07-w26-q02
      type: multiple_choice
      topic_code: "7.7"
      source: "Primary sources: Franklin D. Roosevelt, address to Congress, 8 December 1941 (Miller Center); the Atlantic Charter, 14 August 1941 (Avalon Project); U.S. government works"
      points: 1
      stimulus: |
        Source 1: "Yesterday, December 7, 1941—a date which will live in infamy—the United States of America was suddenly and deliberately attacked by naval and air forces of the Empire of Japan." — President Franklin D. Roosevelt, asking Congress to declare war, 8 December 1941

        Source 2: "First, their countries seek no aggrandizement, territorial or other; [...] Third, they respect the right of all peoples to choose the form of government under which they will live; and they wish to see sovereign rights and self government restored to those who have been forcibly deprived of them". — The Atlantic Charter, joint declaration of Roosevelt and Churchill, 14 August 1941
      prompt: |
        Source 2 best illustrates which method of conducting the war?
      options:
        - "strategic bombing"
        - "the mobilisation of ideology, presenting the Allied cause as one of self-determination and no conquest, in contrast to the Axis programme of territorial expansion"
        - "the use of colonial troops"
        - "unrestricted submarine warfare"
      option_explanations:
        - |
          Bombing was a military method; the charter is a statement of aims.
        - |
          Correct. Like the Fourteen Points, the charter was a weapon of belief, aimed at Americans, occupied Europe and the colonies; every belligerent used such statements.
        - |
          Colonial troops fought for the Allies, but the charter says nothing about recruitment.
        - |
          Submarine warfare was Germany's method in the Atlantic.
      answer: 1
      explanation: |
        Skill: sourcing (purpose). The charter is the Allied war aims as propaganda and as promise.

    - slug: apworld-u07-w26-q03
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary sources: Franklin D. Roosevelt, address to Congress, 8 December 1941 (Miller Center); the Atlantic Charter, 14 August 1941 (Avalon Project); U.S. government works"
      points: 1
      stimulus: |
        Source 1: "Yesterday, December 7, 1941—a date which will live in infamy—the United States of America was suddenly and deliberately attacked by naval and air forces of the Empire of Japan." — President Franklin D. Roosevelt, asking Congress to declare war, 8 December 1941

        Source 2: "First, their countries seek no aggrandizement, territorial or other; [...] Third, they respect the right of all peoples to choose the form of government under which they will live; and they wish to see sovereign rights and self government restored to those who have been forcibly deprived of them". — The Atlantic Charter, joint declaration of Roosevelt and Churchill, 14 August 1941
      prompt: |
        Colonial nationalists in India and Africa read the third point of Source 2 in light of which earlier experience?
      options:
        - "Wilson's promise of self-determination in 1918, which the peace settlement of 1919 had applied to Europe but denied to the colonies through the mandate system"
        - "the Berlin Conference of 1884–85"
        - "the Monroe Doctrine"
        - "the Congress of Vienna"
      option_explanations:
        - |
          Correct. Having been disappointed once, Indian and African leaders demanded that the charter apply to them; Churchill said it did not, and the argument helped shape decolonization.
        - |
          Berlin divided Africa; it promised nothing to its peoples.
        - |
          The Monroe Doctrine (1823) concerned European intervention in the Americas.
        - |
          Vienna (1815) restored monarchies and ignored nationalities.
      answer: 0
      explanation: |
        Spiral review of 7.5 (unresolved tensions after the First World War): the second promise of self-determination met the memory of the first.

    # ---- Stimulus set B: Truman on Hiroshima
    - slug: apworld-u07-w26-q04
      type: multiple_choice
      topic_code: "7.7"
      source: "Primary source: Harry S. Truman, statement announcing the use of the atomic bomb at Hiroshima, 6 August 1945 (Truman Library); U.S. government work"
      points: 1
      stimulus: |
        "Sixteen hours ago an American airplane dropped one bomb on Hiroshima, an important Japanese Army base. That bomb had more power than 20,000 tons of T.N.T. [...] It is an atomic bomb."

        — President Harry S. Truman, statement released by the White House, 6 August 1945. The statement goes on to say that the bomb was the product of a huge secret effort by American, British and Canadian scientists and industry, and warns Japan to surrender or expect more.
      prompt: |
        The weapon the statement announces was the product of
      options:
        - "a private company's commercial research"
        - "the Manhattan Project, a state-directed scientific and industrial programme that exemplified total mobilisation of a modern economy for war"
        - "captured German plans"
        - "the League of Nations"
      option_explanations:
        - |
          Private firms built components, but the project was government-run and secret, with no commercial purpose.
        - |
          Correct. About 130,000 people and two billion dollars went into laboratories and plants at Los Alamos, Oak Ridge and Hanford; science and the state fused in the war effort.
        - |
          Germany's programme never approached a bomb; refugee scientists from Europe helped the American one.
        - |
          The League had ceased to function by 1940.
      answer: 1
      explanation: |
        Skill: sourcing and context. The bomb is the clearest case of 7.7's theme of technology and mobilisation.

    - slug: apworld-u07-w26-q05
      type: multiple_choice
      topic_code: "7.7"
      source: "Primary source: Harry S. Truman, statement announcing the use of the atomic bomb at Hiroshima, 6 August 1945 (Truman Library); U.S. government work"
      points: 1
      stimulus: |
        "Sixteen hours ago an American airplane dropped one bomb on Hiroshima, an important Japanese Army base. That bomb had more power than 20,000 tons of T.N.T. [...] It is an atomic bomb."

        — President Harry S. Truman, statement released by the White House, 6 August 1945. The statement goes on to say that the bomb was the product of a huge secret effort by American, British and Canadian scientists and industry, and warns Japan to surrender or expect more.
      prompt: |
        Truman's description of Hiroshima as "an important Japanese Army base" is best read as
      options:
        - "an accurate statement that no civilians lived in the city"
        - "a reference to Japanese atomic research"
        - "a sign that the bomb was dropped by mistake"
        - "a framing that presented a city of about 350,000 people as a military target, consistent with the wartime practice of strategic bombing in which cities had become legitimate objectives"
      option_explanations:
        - |
          Hiroshima held an army headquarters but was a city; about 80,000 people, mostly civilians, died at once.
        - |
          Japan had no significant atomic programme; the statement is about the American bomb.
        - |
          The target was chosen deliberately by a committee months earlier.
        - |
          Correct. Hamburg, Dresden and Tokyo had already been burned from the air; the statement reflects how total war had redefined the target.
      answer: 3
      explanation: |
        Skill: sourcing (point of view and audience). Read the choice of words as part of the war's conduct.

    - slug: apworld-u07-w26-q06
      type: multiple_choice
      topic_code: "7.3"
      source: "Primary source: Harry S. Truman, statement announcing the use of the atomic bomb at Hiroshima, 6 August 1945 (Truman Library); U.S. government work"
      points: 1
      stimulus: |
        "Sixteen hours ago an American airplane dropped one bomb on Hiroshima, an important Japanese Army base. That bomb had more power than 20,000 tons of T.N.T. [...] It is an atomic bomb."

        — President Harry S. Truman, statement released by the White House, 6 August 1945. The statement goes on to say that the bomb was the product of a huge secret effort by American, British and Canadian scientists and industry, and warns Japan to surrender or expect more.
      prompt: |
        Compared with the technologies that defined the First World War, the weapon described here differed most in that it
      options:
        - "was the first weapon to kill civilians"
        - "could destroy a whole city at once, where the machine gun, artillery and gas of 1914–18 had killed soldiers in the field over months of stalemate"
        - "strengthened defence against attack"
        - "was never used"
      option_explanations:
        - |
          Blockade, bombing and gas had killed civilians in 1914–18; the difference is scale and speed, not the fact.
        - |
          Correct. The First World War's weapons favoured the defence and produced attrition; the Second's bombers and the atomic bomb reached over the front to the city.
        - |
          The bomb was an offensive weapon against which there was no defence.
        - |
          It was used twice, on Hiroshima and Nagasaki.
      answer: 1
      explanation: |
        Spiral review of 7.3 (conducting the First World War): the comparison of the two wars' technologies.

    # ---- Stimulus set C: war deaths table
    - slug: apworld-u07-w26-q07
      type: multiple_choice
      topic_code: "7.7"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Estimated deaths in the Second World War, selected countries (millions, rounded; estimates vary)

        | Country | Military deaths | Civilian deaths (including famine and genocide) | Total | Share of 1939 population |
        |---|---|---|---|---|
        | Soviet Union | 9–11 | 15–18 | about 27 | about 14% |
        | China | 3–4 | 8–16 | 15–20 | about 3–4% |
        | Germany | 5 | 1–3 | 6–7 | about 8–9% |
        | Poland | 0.2 | 5.5–5.8 | about 6 | about 17% |
        | Japan | 2 | 0.5–1 | about 3 | about 4% |
        | India (British) | 0.1 | 2–3 (mostly Bengal famine) | 2–3 | under 1% |
        | United Kingdom | 0.4 | 0.07 | about 0.45 | about 1% |
        | United States | 0.4 | under 0.01 | about 0.4 | about 0.3% |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "The war's deaths fell overwhelmingly on the Soviet Union, China and Poland, and civilians outnumbered soldiers among the dead."
        - "The United States and Britain suffered the heaviest losses."
        - "Military deaths exceeded civilian deaths in every country."
        - "Japan lost a larger share of its population than Poland."
      option_explanations:
        - |
          Correct. The Eastern Front, the war in China and the Nazi occupation of Poland account for most of the roughly 70 million dead, and in the hardest-hit countries civilians were the majority.
        - |
          The two Western Allies together lost under a million; each lost under 1% of population.
        - |
          In the Soviet Union, China, Poland and India civilian deaths far exceeded military ones.
        - |
          Poland lost about 17% of its population, Japan about 4%.
      answer: 0
      explanation: |
        Skill: data analysis. Read both the totals and the shares; the geography of death explains the postwar geography of power and grievance.

    - slug: apworld-u07-w26-q08
      type: multiple_choice
      topic_code: "7.8"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Estimated deaths in the Second World War, selected countries (millions, rounded; estimates vary)

        | Country | Military deaths | Civilian deaths (including famine and genocide) | Total | Share of 1939 population |
        |---|---|---|---|---|
        | Soviet Union | 9–11 | 15–18 | about 27 | about 14% |
        | China | 3–4 | 8–16 | 15–20 | about 3–4% |
        | Germany | 5 | 1–3 | 6–7 | about 8–9% |
        | Poland | 0.2 | 5.5–5.8 | about 6 | about 17% |
        | Japan | 2 | 0.5–1 | about 3 | about 4% |
        | India (British) | 0.1 | 2–3 (mostly Bengal famine) | 2–3 | under 1% |
        | United Kingdom | 0.4 | 0.07 | about 0.45 | about 1% |
        | United States | 0.4 | under 0.01 | about 0.4 | about 0.3% |
      prompt: |
        Poland's civilian figure is best explained by
      options:
        - "the Bengal famine"
        - "civil war between Polish factions"
        - "strategic bombing by the Allies"
        - "the Nazi occupation, which murdered about three million Polish Jews in the Holocaust and about two million other Poles through execution, forced labour and starvation"
      option_explanations:
        - |
          The Bengal famine is listed under India.
        - |
          Poland's losses were inflicted by the German (and in 1939–41 the Soviet) occupiers, not by Poles.
        - |
          Allied bombing fell on Germany and Japan, not on occupied Poland.
        - |
          Correct. Poland was the site of the death camps and of a deliberate policy of destroying the Polish nation's leadership; its losses were the highest share in Europe.
      answer: 3
      explanation: |
        Skill: causation from data. Genocide and occupation, not battle, explain the Polish row.

    - slug: apworld-u07-w26-q09
      type: multiple_choice
      topic_code: "7.6"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Estimated deaths in the Second World War, selected countries (millions, rounded; estimates vary)

        | Country | Military deaths | Civilian deaths (including famine and genocide) | Total | Share of 1939 population |
        |---|---|---|---|---|
        | Soviet Union | 9–11 | 15–18 | about 27 | about 14% |
        | China | 3–4 | 8–16 | 15–20 | about 3–4% |
        | Germany | 5 | 1–3 | 6–7 | about 8–9% |
        | Poland | 0.2 | 5.5–5.8 | about 6 | about 17% |
        | Japan | 2 | 0.5–1 | about 3 | about 4% |
        | India (British) | 0.1 | 2–3 (mostly Bengal famine) | 2–3 | under 1% |
        | United Kingdom | 0.4 | 0.07 | about 0.45 | about 1% |
        | United States | 0.4 | under 0.01 | about 0.4 | about 0.3% |
      prompt: |
        China's losses began before 1939 because
      options:
        - "China had invaded Japan in 1931"
        - "the League of Nations had ordered China to fight"
        - "Japan had seized Manchuria in 1931 and launched full-scale war on China in July 1937, aggression the League and the Western powers did nothing to stop"
        - "the Chinese civil war began in 1937"
      option_explanations:
        - |
          Japan was the invader at every stage, from Manchuria in 1931 to the coastal cities in 1937.
        - |
          The League condemned Japan in the Lytton Report and did nothing further.
        - |
          Correct. The Marco Polo Bridge incident opened eight years of war in which Japan occupied the coast and committed the Nanjing massacre; the Asian war predates the European one.
        - |
