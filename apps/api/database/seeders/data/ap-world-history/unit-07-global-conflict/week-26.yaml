    # ---- Short answers
    - slug: apworld-u07-w26-q23
      type: short_answer
      topic_code: "7.8"
      source: "Primary source: Robert H. Jackson, opening statement for the prosecution at the International Military Tribunal, Nuremberg, 21 November 1945 (Robert H. Jackson Center); U.S. government work"
      points: 3
      stimulus: |
        "The wrongs which we seek to condemn and punish have been so calculated, so malignant, and so devastating, that civilization cannot tolerate their being ignored, because it cannot survive their being repeated."

        — Robert H. Jackson, a justice of the U.S. Supreme Court serving as chief American prosecutor, opening the case against the surviving Nazi leaders before the International Military Tribunal at Nuremberg, 21 November 1945
      prompt: |
        Using the source, answer (a), (b) and (c).

        (a) Describe the purpose Jackson gives for the trial.
        (b) Explain ONE way the trial represented a change in how the world responded to mass atrocity.
        (c) Explain ONE reason the principles established at Nuremberg did not prevent later genocides.
      answer: |
        (a) To condemn and punish crimes so deliberate and destructive that ignoring them would invite their repetition and so endanger civilisation itself: the trial is justified as prevention, not only as justice.
        (b) For the first time the leaders of a state were tried by an international court for crimes against humanity and crimes against peace, rather than being executed without trial or left unpunished as the Ottoman organisers of the Armenian genocide largely were; the principle of individual responsibility passed into the Genocide Convention of 1948.
        (c) The principles required states willing to enforce them; the Cold War divided the great powers, the UN had no standing force, and sovereignty protected perpetrators, so Cambodia (1975–79), Rwanda (1994) and Bosnia (1992–95) happened while outsiders stood aside; tribunals for the last two came only afterwards.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate statement of the purpose in the quotation (punishment as prevention; civilisation at stake). Zero for a purpose not in the source (e.g. compensation).

        (b) 1 pt: a change explained: international trial of state leaders; crimes against humanity as a legal category; contrast with earlier impunity; the Genocide Convention.

        (c) 1 pt: a reason explained and tied to a later case: lack of enforcement; Cold War paralysis; sovereignty; the withdrawal of peacekeepers in Rwanda; the delay of the Yugoslav and Rwandan tribunals.

    - slug: apworld-u07-w26-q24
      type: short_answer
      topic_code: "7.9"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE cause that contributed to both the First and the Second World War.
        (b) Explain ONE cause of the Second World War that did not exist in 1914.
        (c) Explain ONE consequence of the two world wars for the relationship between Europe and the rest of the world.
      answer: |
        (a) Nationalism; or militarism and arms races; or imperial rivalry; or alliance systems and their failures; or the instability of eastern Europe.
        (b) The Great Depression, which brought Hitler to power and pushed Japan into Manchuria; or fascist and Nazi ideology with its programme of racial conquest; or German grievance against the Treaty of Versailles; or the failure of the League's collective security; or appeasement.
        (c) The wars destroyed Europe's economic and military dominance and the legitimacy of its empires: colonial soldiers' service, the Atlantic Charter's promises and the bankruptcy of Britain and France led to decolonization after 1945; power passed to the United States and the Soviet Union; the United Nations replaced European concert diplomacy.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a cause genuinely present in both cases. Zero for a cause specific to one war (Versailles, Sarajevo).

        (b) 1 pt: a cause specific to 1939 explained, not just named.

        (c) 1 pt: a consequence for Europe's global position explained: decolonization; the superpowers; the UN; the loss of economic primacy; the division of Europe.

    # ---- Long answer (LEQ)
    - slug: apworld-u07-w26-q25
      type: long_answer
      topic_code: "7.9"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1900 and 1945 the world fought two wars of unprecedented scale.

        Evaluate the relative significance of the causes of global conflict in the period 1900–1945.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: The deepest causes of global conflict were structural, the combination of industrial technology, mass nationalism and imperial rivalry that unit 5 and unit 6 produced, because they made great-power war both likely and catastrophic; the settlement of 1919 and the Depression were the intermediate causes that turned the first war into the second; the triggers of 1914 and 1939 mattered least, since the structures would have found another occasion.

        Context: the industrial revolutions, the new imperialism and the nation-state of the nineteenth century; the collapse of the Qing, Ottoman and Russian regimes after 1900.

        Body 1 (structural): industrial weapons from the machine gun to the bomber; conscription and nationalism making whole peoples combatants; imperial rivalries in Morocco, the Balkans, Manchuria and Ethiopia; the alliance blocs of 1914 and the Axis of 1940.

        Body 2 (intermediate): Versailles and Article 231; the Depression's role in Hitler's rise and Japan's expansion; fascist and militarist ideology; the League's failures; appeasement.

        Body 3 (immediate): Sarajevo and the July Crisis; Poland and the Nazi-Soviet Pact; Pearl Harbor; why each was an occasion rather than a cause.

        Complexity: the second war's causes differed from the first in the role of ideology and deliberate aggression, which a purely structural account understates; the two wars can be read as one thirty-year crisis; counterfactuals (a United States in the League, a different response to Manchuria) test the ranking.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible ranking of causes with a reason. Zero for a list of causes with no judgment of relative significance.

        Contextualization (0–1): industrialization; nationalism; the new imperialism; the collapse of old regimes after 1900.

        Evidence (0–2): 1 pt for at least two specific examples (the naval race; the alliance blocs; Sarajevo; Article 231; the Depression and the Nazi vote; Manchuria; Ethiopia; Munich; the Nazi-Soviet Pact; Pearl Harbor). 2 pts for using them to support the ranking.

        Analysis and reasoning (0–2): 1 pt for causation structuring the essay (levels of cause; distinguishing cause from trigger). 1 pt for complexity: comparing the two wars' causes; the thirty-year-crisis argument; acknowledging where ideology or contingency outweighs structure.
