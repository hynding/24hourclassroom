    # ---- Short answers
    - slug: apworld-u07-w25-q23
      type: short_answer
      topic_code: "7.6"
      source: "Primary source: Kellogg-Briand Pact, Article I (1928), Avalon Project"
      points: 3
      stimulus: |
        "The High Contracting Parties solemly declare in the names of their respective peoples that they condemn recourse to war for the solution of international controversies, and renounce it as an instrument of national policy in their relations with one another."

        — Article I of the General Treaty for Renunciation of War (the Kellogg-Briand Pact), signed in Paris on 27 August 1928 by fifteen states and eventually by sixty-two, including Germany, Italy and Japan. The spelling is as printed in the original.
      prompt: |
        Using the source, answer (a), (b) and (c).

        (a) Describe the commitment the signatories made.
        (b) Explain ONE reason the pact failed to prevent war in the 1930s.
        (c) Explain ONE way the pact reflected the experience of the First World War.
      answer: |
        (a) The signatories condemned war as a way of settling disputes between them and renounced it as an instrument of national policy, promising to settle disputes by peaceful means.
        (b) It contained no enforcement mechanism, no sanctions and no definition of self-defence, so Japan in Manchuria, Italy in Ethiopia and Germany in Poland could invade while claiming defence or police action; it depended on the League and the democracies, which would not act; the Depression made every government unwilling to risk war to uphold it.
        (c) The slaughter of 1914–18 produced a popular revulsion against war and a belief that it could be outlawed by agreement, the same impulse behind the League and disarmament conferences; the pact was the high point of 1920s optimism that the war to end war had succeeded.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate description of the renunciation in the article. Zero for inventing enforcement terms the article does not contain.

        (b) 1 pt: a reason explained: no enforcement; no definition of self-defence; the League's weakness; the Depression; the ideology of the aggressor states.

        (c) 1 pt: a link to the war's memory and the interwar faith in collective agreement; Wilsonian internationalism; the League; disarmament. Zero for a vague statement that people wanted peace without connecting it to the war.

    - slug: apworld-u07-w25-q24
      type: short_answer
      topic_code: "7.5"
      source: "general knowledge"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE territory that became a League of Nations mandate after the First World War and the state that administered it.
        (b) Explain ONE way the mandate system continued the imperialism of the nineteenth century.
        (c) Explain ONE way the peace settlement of 1919 stimulated anti-colonial nationalism.
      answer: |
        (a) Iraq, Palestine or Transjordan (Britain); Syria or Lebanon (France); Tanganyika (Britain); South West Africa (South Africa); the Marshall, Caroline and Mariana islands (Japan); Togo or Cameroon (divided between Britain and France).
        (b) The mandatories were the existing colonial empires, which governed the territories much as they did colonies, extracting resources and suppressing revolts (Iraq 1920, Syria 1925), under the old language of tutelage and the civilising mission; the British and French empires reached their greatest size.
        (c) Wilson's rhetoric of self-determination raised expectations that the settlement then denied: the award of Shandong to Japan set off the May Fourth Movement, the refusal to hear Egyptian and Korean delegations produced the risings of 1919, and the mandates' broken promises to the Arabs fed revolts and the growth of Arab nationalism.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a correct territory and mandatory. Zero for a colony that was never a mandate (India, Algeria, Indochina).

        (b) 1 pt: an explanation of continuity: same powers, same methods, same justification; or the point that only Iraq became independent before 1945.

        (c) 1 pt: a specific link between the settlement and a nationalist movement: Shandong and May Fourth; Egypt; Korea; the Arab lands; India's reward of repression after wartime service; the Pan-African Congress.

    # ---- Long answer (LEQ)
    - slug: apworld-u07-w25-q25
      type: long_answer
      topic_code: "7.5"
      source: "general knowledge"
      points: 6
      prompt: |
        The First World War was fought by empires and settled in the language of self-determination.

        Evaluate the extent to which the First World War and the peace settlement that followed changed the relationship between the European empires and the peoples they ruled in the period 1914–1939.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (continuity and change, causation, or comparison).
      answer: |
        Thesis: The war and the settlement changed the relationship in ideas and expectations far more than in power: the empires emerged larger than ever and still in control, but their subjects had served in the war, heard the promise of self-determination, and built mass nationalist movements that made imperial rule depend on a consent it was losing; the change was in legitimacy, not yet in sovereignty.

        Context: the new imperialism of 1870–1914 and its rationales; the colonial contribution to the war (Indian troops, African carriers, Vietnamese workers); Wilson and the Bolsheviks both proclaiming self-determination.

        Body 1 (continuity of power): the mandate system (Article 22) gave Britain and France the Arab lands and German Africa; revolts in Iraq, Syria and Egypt were suppressed; India got the Rowlatt Act and Amritsar; Korea stayed Japanese; only Iraq (1932) and nominally Egypt (1922) gained independence.

        Body 2 (change in ideas and organisation): Gandhi's Non-Cooperation and Salt March turned Congress into a mass movement; May Fourth and the GMD/CCP reshaped Chinese politics; the Pan-African Congress and the ANC; Atatürk's Turkey showed a non-European state could remake itself; the Government of India Act (1935) conceded provincial self-rule.

        Body 3 (the settlement as cause): Wilson's rhetoric raised expectations; the refusal of Egyptian, Korean and Chinese claims radicalised them; the League's Permanent Mandates Commission created a forum for petitions; veterans' claims.

        Complexity: the change was uneven (Turkey and Iraq versus Indochina and Kenya); the Depression reversed some gains and increased imperial economic control; the ideas of 1919 reached fulfilment only after a second war, which is where the exam's unit 8 begins.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim about the extent of change, with a line of reasoning (e.g. ideas changed, power did not). Zero for "some things changed and some stayed the same" without weighting.

        Contextualization (0–1): the new imperialism; colonial participation in the war; the Fourteen Points or Bolshevik anti-imperialism.

        Evidence (0–2): 1 pt for at least two specific examples (mandates and Article 22; Amritsar and Non-Cooperation; May Fourth; Egypt 1919; Atatürk; the Pan-African Congress; Iraq 1932). 2 pts for using them to show both continuity and change in support of the claim.

        Analysis and reasoning (0–2): 1 pt for continuity and change structuring the essay. 1 pt for complexity: distinguishing change in legitimacy from change in sovereignty; regional variation; the Depression's reversal; linking the interwar movements to post-1945 decolonization.
