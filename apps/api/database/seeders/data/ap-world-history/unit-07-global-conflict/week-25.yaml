week: 25
unit: 7
title: "Unresolved Tensions After World War I and the Causes of World War II"
topics: ["7.5", "7.6"]
guide: guides/week-25.md
guide_description: |
  The peace of 1919 and what it left unresolved: Versailles and Article 231, the League without the United
  States, the mandate system that enlarged the empires, the Middle East promises, and the nationalist movements
  of the 1920s in India, China, Korea, Turkey, the Arab lands and Africa. Then the road to 1939: the Depression,
  fascism and Japanese militarism, the failure of collective security, appeasement and the Nazi-Soviet Pact.
flashcards_description: |
  30 cards on the Paris settlement, the League and the mandates, the anti-colonial nationalism of the interwar
  years, and the causes of the Second World War.

flashcards:
  - front: Fourteen Points (January 1918) → Wilson's main proposals
    back: |
      Open diplomacy, freedom of the seas, removal of trade barriers, arms reduction, impartial adjustment of colonial claims weighing the interests of the populations, self-determination for the peoples of Austria-Hungary, Russia and the Ottoman Empire, an independent Poland, and a general association of nations (Point XIV) to guarantee independence and territorial integrity.
    topic_code: "7.5"
  - front: Treaty of Versailles (1919) → terms imposed on Germany
    back: |
      Loss of Alsace-Lorraine, the Polish corridor, Danzig, northern Schleswig and all colonies; army limited to 100,000, no air force or submarines; Rhineland demilitarised; Article 231 (acceptance of responsibility for the war); reparations fixed in 1921 at 132 billion gold marks; exclusion from the League until 1926.
    topic_code: "7.5"
  - front: Article 231 of Versailles → why it mattered beyond money
    back: |
      It made Germany accept responsibility for a war imposed by its aggression, the legal basis for reparations. Germans of every party called the treaty a dictated peace (Diktat); the clause fed the stab-in-the-back myth and gave Hitler his best grievance.
    topic_code: "7.5"
  - front: Paris peace conference → the Big Three and what each wanted
    back: |
      Wilson (United States): the Fourteen Points and the League. Clemenceau (France): security against Germany through disarmament, the Rhineland and reparations. Lloyd George (Britain): reparations and colonies, but a Germany strong enough to trade. The treaty was a compromise none fully liked.
    topic_code: "7.5"
  - front: League of Nations → structure, purpose and weaknesses
    back: |
      Assembly, Council, secretariat and Permanent Court (1920); collective security against aggression under the Covenant. Weaknesses: the United States never joined, Germany excluded until 1926 and the USSR until 1934, no army, unanimity rule, and members unwilling to fight for Manchuria (1931) or Ethiopia (1935).
    topic_code: "7.5"
  - front: Mandate system → Article 22 of the Covenant and who got what
    back: |
      Former German and Ottoman lands held as a sacred trust of civilisation by advanced nations until able to stand alone. Britain: Iraq, Palestine, Transjordan, Tanganyika; France: Syria, Lebanon; both split Togo and Cameroon; Japan: German Pacific islands; South Africa: South West Africa. The empires grew; only Iraq (1932) became independent before 1945.
    topic_code: "7.5"
  - front: Britain's three wartime promises in the Middle East → why they conflicted
    back: |
      Hussein-McMahon letters (1915–16) promised Arab independence; Sykes-Picot (1916) divided the region with France; the Balfour Declaration (1917) favoured a Jewish national home in Palestine. The mandates fulfilled Sykes-Picot and Balfour and disappointed the Arabs: revolts in Iraq (1920) and Syria (1925), violence in Palestine.
    topic_code: "7.5"
  - front: Balfour Declaration (2 November 1917) → content and proviso
    back: |
      Britain viewed with favour the establishment in Palestine of a national home for the Jewish people, provided nothing prejudiced the civil and religious rights of existing non-Jewish communities. Written into the Palestine mandate; Jewish immigration and Arab opposition grew through the 1920s and 1930s.
    topic_code: "7.5"
  - front: Mustafa Kemal Atatürk → how the Turkish Republic was built (1919–1934)
    back: |
      Defeated the Greek invasion, rejected the Treaty of Sèvres and won Lausanne (1923); abolished the sultanate (1922) and caliphate (1924); Latin alphabet, European civil code, secular schools, surnames, women's suffrage (1934); state-led industry. A nation-state in place of an empire.
    topic_code: "7.5"
  - front: Amritsar massacre (13 April 1919) → event and effect
    back: |
      General Dyer's troops fired on an unarmed meeting in Jallianwala Bagh, Punjab, killing about 379. Combined with the Rowlatt Act (detention without trial), it destroyed Indian faith in gradual reform and turned opinion toward Gandhi's non-cooperation.
    topic_code: "7.5"
  - front: Gandhi's methods → satyagraha, Non-Cooperation and the Salt March
    back: |
      Satyagraha (truth-force): non-violent mass resistance. Non-Cooperation (1920–22): boycott of British courts, schools, cloth and titles, called off after violence at Chauri Chaura. Salt March (1930): a 240-mile walk to make salt in defiance of the tax, starting civil disobedience that filled the jails and made Congress a mass movement.
    topic_code: "7.5"
  - front: Hind Swaraj (1910) → Gandhi's argument about British rule
    back: |
      The English had not taken India; Indians had given it to them by adopting their courts, railways and goods, and kept them there. Independence meant self-rule in conduct as well as politics; modern industrial civilisation was the real enemy. Written in Gujarati in 1909, English edition 1910.
    topic_code: "7.5"
  - front: May Fourth Movement (1919) → cause and significance
    back: |
      Versailles gave Germany's Shandong rights to Japan; Beijing students protested on 4 May, boycotts spread. The movement rejected Confucian tradition for science and democracy, made nationalism the organising force of Chinese politics, and fed both the reorganised Guomindang and the Chinese Communist Party (1921).
    topic_code: "7.5"
  - front: Guomindang and Chinese Communist Party, 1923–1935 → the sequence
    back: |
      Sun reorganised the GMD with Soviet help (1923) in alliance with the CCP; after Sun's death (1925) Chiang Kai-shek's Northern Expedition (1926–28) reunified China under the GMD; Chiang turned on the communists in Shanghai (1927); the CCP retreated to rural bases and survived the Long March (1934–35) under Mao Zedong.
    topic_code: "7.5"
  - front: March First Movement (Korea, 1919) → what happened
    back: |
      Koreans, under Japanese annexation since 1910, read a declaration of independence and demonstrated across the country, inspired by self-determination. Japan suppressed it with thousands killed and then softened its rule slightly (cultural policy) while keeping control.
    topic_code: "7.5"
  - front: Pan-Africanism in the 1920s → Du Bois, Garvey, the ANC
    back: |
      Du Bois organised the Pan-African Congress in Paris (1919) to lobby the peacemakers; Garvey's UNIA preached Black pride and return to Africa; the African National Congress (1912) and the National Congress of British West Africa (1920) petitioned for rights. No independence yet, but a shared language and leadership.
    topic_code: "7.5"
  - front: Egypt's revolution of 1919 → outcome
    back: |
      Nationwide protests after Britain exiled the Wafd leader Saad Zaghlul forced Britain to declare Egypt nominally independent in 1922 while keeping control of the Suez Canal, defence and the Sudan. A pattern: formal sovereignty, continued imperial power.
    topic_code: "7.5"
  - front: Self-determination after 1919 → where it applied and where it did not
    back: |
      Applied to the peoples of the fallen Habsburg, Russian and Ottoman empires in Europe (Poland, Czechoslovakia, Yugoslavia, the Baltic states, Finland). Denied to Asians and Africans, whose lands became mandates or stayed colonies, which is why 1919 produced the May Fourth, March First and Egyptian risings.
    topic_code: "7.5"
  - front: Fascism → core ideas and the Italian case
    back: |
      Ultra-nationalism, the single party and the leader, hostility to liberalism and communism, glorification of war and the state, corporatist economy. Mussolini took power after the March on Rome (1922), made Italy a one-party state by 1926, and invaded Ethiopia (1935).
    topic_code: "7.6"
  - front: Nazism → what it added to fascism
    back: |
      Racial doctrine: Germans as a master race, Jews as the enemy to be removed, Slavs as future serfs; Lebensraum (living space) in eastern Europe; reversal of Versailles. Hitler was appointed chancellor in January 1933 and held dictatorial power by the summer through the Enabling Act.
    topic_code: "7.6"
  - front: How the Depression brought Hitler to power → the numbers
    back: |
      Nazi vote: 2.6% (1928), 18% (1930), 37% (July 1932). German unemployment reached about six million (30%). The middle class feared communism and ruin; conservatives thought they could use Hitler; Hindenburg appointed him chancellor on 30 January 1933.
    topic_code: "7.6"
  - front: Japanese militarism in the 1930s → causes and steps
    back: |
      Collapse of silk exports and tariffs abroad, resentment of Western naval limits and racial exclusion, army autonomy under the emperor. Kwantung Army seized Manchuria (1931) and created Manchukuo; Japan left the League (1933); full war with China from the Marco Polo Bridge incident (July 1937); Nanjing massacre (December 1937).
    topic_code: "7.6"
  - front: Kellogg-Briand Pact (1928) → what it promised and why it failed
    back: |
      Sixty-two states condemned recourse to war for settling international controversies and renounced it as an instrument of national policy. It had no enforcement clause and no definition of self-defence; Japan, Italy and Germany all signed and all invaded.
    topic_code: "7.6"
  - front: Collective security tested → Manchuria (1931) and Ethiopia (1935)
    back: |
      Manchuria: the Lytton Report condemned Japan; Japan left the League; nothing else happened. Ethiopia: sanctions on Italy excluded oil and the Suez Canal stayed open; Mussolini completed the conquest in 1936 and moved toward Hitler. Aggressors learned the League would not act.
    topic_code: "7.6"
  - front: Hitler's steps to war, 1933–1939 → the sequence
    back: |
      Left the League (1933); conscription and air force (1935); Rhineland remilitarised (March 1936); Anschluss with Austria (March 1938); Sudetenland at Munich (September 1938); rest of Czechoslovakia (March 1939); Nazi-Soviet Pact (23 August 1939); invasion of Poland (1 September 1939).
    topic_code: "7.6"
  - front: Appeasement → definition and reasons Britain and France chose it
    back: |
      Conceding to Hitler's demands to avoid war, culminating at Munich (1938). Reasons: memory of 1914–18, belief that Versailles had been unjust, fear of communism more than fascism, military unreadiness and Depression budgets, the hope that Hitler's aims were limited to German-speaking lands, and American isolation.
    topic_code: "7.6"
  - front: Munich Agreement (September 1938) → terms and consequence
    back: |
      Britain, France, Italy and Germany agreed that Czechoslovakia must cede the Sudetenland to Germany; Czechoslovakia was not consulted. Chamberlain claimed peace for our time; Hitler took the rest of the country in March 1939, which ended appeasement and brought the British and French guarantee to Poland.
    topic_code: "7.6"
  - front: Nazi-Soviet Pact (23 August 1939) → terms and why Stalin signed
    back: |
      A non-aggression treaty with a secret protocol dividing Poland and assigning the Baltic states and Bessarabia to the Soviet sphere. Stalin distrusted the Western powers after Munich, wanted time to rearm and territory as a buffer; Hitler wanted a one-front war. Poland was invaded eight days later.
    topic_code: "7.6"
  - front: Causes of 1914 versus causes of 1939 → the comparison
    back: |
      Shared: militarism, imperial ambition, nationalism, alliance failures, a trigger in eastern Europe. Different: 1939 was driven by ideological regimes (fascism, Nazism, Japanese militarism) and the Depression, and by the deliberate choice of one state to conquer, whereas 1914 was a crisis that escaped control.
    topic_code: "7.6"
  - front: Spanish Civil War (1936–39) → why it matters for 7.6
    back: |
      Germany and Italy armed Franco's nationalists (the bombing of Guernica, 1937) while the democracies stayed neutral and the USSR aided the republic. It tested weapons and tactics, cemented the Rome-Berlin Axis and showed again that the Western powers would not resist fascism.
    topic_code: "7.6"

quiz:
  description: |
    25 questions · about 35 minutes · topics 7.5 and 7.6 (the unresolved tensions of the peace and the causes of
    the Second World War), with about a third of the items reviewing the war, the revolutions and the Depression
    of weeks 23–24 and the empires and ideas of units 5 and 6. Multiple choice, select-all and true/false items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Fourteen Points (Point V) and Covenant Article 22
    - slug: apworld-u07-w25-q01
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary sources: Woodrow Wilson, Fourteen Points, 8 January 1918 (U.S. government work); Covenant of the League of Nations, Article 22 (1919), Avalon Project"
      points: 1
      stimulus: |
        Source 1: "A free, open-minded, and absolutely impartial adjustment of all colonial claims, based upon a strict observance of the principle that in determining all such questions of sovereignty the interests of the populations concerned must have equal weight with the equitable claims of the government whose title is to be determined." — Woodrow Wilson, Point V of the Fourteen Points, address to Congress, 8 January 1918

        Source 2: "To those colonies and territories which as a consequence of the late war have ceased to be under the sovereignty of the States which formerly governed them and which are inhabited by peoples not yet able to stand by themselves under the strenuous conditions of the modern world, there should be applied the principle that the well-being and development of such peoples form a sacred trust of civilisation [...] the tutelage of such peoples should be entrusted to advanced nations". — Covenant of the League of Nations, Article 22, 1919
      prompt: |
        Comparing the two sources, Article 22 is best understood as
      options:
        - "a direct application of self-determination to the colonies"
        - "a translation of Wilson's principle into continued imperial rule, with the former German and Ottoman territories entrusted to the victorious empires as mandates"
        - "a plan for immediate independence of the Ottoman Arab provinces"
        - "a rejection of any League supervision of colonies"
      option_explanations:
        - |
          The article speaks of peoples unable to stand by themselves; self-determination was for Europe.
        - |
          Correct. Point V promised to weigh the interests of colonial populations; Article 22 gave Britain, France, Japan and others tutelage over them, and the empires grew.
        - |
          Even the most advanced category of mandate (the Arab lands) was placed under British and French administration.
        - |
          The League's Permanent Mandates Commission did supervise, but supervision was not independence.
      answer: 1
      explanation: |
        Skill: comparison of sources. The gap between Wilson's language and the Covenant's practice is the heart of 7.5.

    - slug: apworld-u07-w25-q02
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary sources: Woodrow Wilson, Fourteen Points, 8 January 1918 (U.S. government work); Covenant of the League of Nations, Article 22 (1919), Avalon Project"
      points: 1
      stimulus: |
        Source 1: "A free, open-minded, and absolutely impartial adjustment of all colonial claims, based upon a strict observance of the principle that in determining all such questions of sovereignty the interests of the populations concerned must have equal weight with the equitable claims of the government whose title is to be determined." — Woodrow Wilson, Point V of the Fourteen Points, address to Congress, 8 January 1918

        Source 2: "To those colonies and territories which as a consequence of the late war have ceased to be under the sovereignty of the States which formerly governed them and which are inhabited by peoples not yet able to stand by themselves under the strenuous conditions of the modern world, there should be applied the principle that the well-being and development of such peoples form a sacred trust of civilisation [...] the tutelage of such peoples should be entrusted to advanced nations". — Covenant of the League of Nations, Article 22, 1919
      prompt: |
        Which 1919 development was most directly a reaction to the gap between the promise in Source 1 and the practice in Source 2?
      options:
        - "the Russian civil war"
        - "the founding of the Soviet Union"
        - "the May Fourth Movement in China, the March First Movement in Korea and the Egyptian revolution, protests by peoples who had expected self-determination and were denied it"
        - "the Wall Street crash"
      option_explanations:
        - |
          The civil war (1918–21) was fought over Bolshevik rule, not colonial claims.
        - |
          The USSR was proclaimed in 1922 and had its own reasons.
        - |
          Correct. Shandong went to Japan, Korea stayed Japanese and Egypt stayed British; each produced a nationalist rising in 1919 in the name of the self-determination Wilson had preached.
        - |
          The Wall Street crash came in October 1929, a decade after the peace conference.
      answer: 2
      explanation: |
        Skill: causation. 1919 was a year of risings in Asia and Africa because expectations had been raised and disappointed.

    - slug: apworld-u07-w25-q03
      type: multiple_choice
      topic_code: "6.1"
      source: "Primary sources: Woodrow Wilson, Fourteen Points, 8 January 1918 (U.S. government work); Covenant of the League of Nations, Article 22 (1919), Avalon Project"
      points: 1
      stimulus: |
        Source 1: "A free, open-minded, and absolutely impartial adjustment of all colonial claims, based upon a strict observance of the principle that in determining all such questions of sovereignty the interests of the populations concerned must have equal weight with the equitable claims of the government whose title is to be determined." — Woodrow Wilson, Point V of the Fourteen Points, address to Congress, 8 January 1918

        Source 2: "To those colonies and territories which as a consequence of the late war have ceased to be under the sovereignty of the States which formerly governed them and which are inhabited by peoples not yet able to stand by themselves under the strenuous conditions of the modern world, there should be applied the principle that the well-being and development of such peoples form a sacred trust of civilisation [...] the tutelage of such peoples should be entrusted to advanced nations". — Covenant of the League of Nations, Article 22, 1919
      prompt: |
        The phrases "sacred trust of civilisation" and "tutelage" in Source 2 continue which earlier justification for empire?
      options:
        - "the civilising mission of the nineteenth century, which claimed that advanced nations had a duty to govern peoples not ready to rule themselves"
        - "mercantilist arguments for monopoly trade"
        - "the religious crusading ideal of medieval Europe"
        - "the Marxist critique of imperialism"
      option_explanations:
        - |
          Correct. The language of Kipling and the Berlin Act survived the war intact; the mandate was the civilising mission with a League certificate.
        - |
          Mercantilism argued from bullion and monopoly, not from duty to the governed.
        - |
          Crusading rhetoric belongs to a much earlier period and to religious war.
        - |
          Hobson and Lenin attacked empire; Article 22 defends it.
      answer: 0
      explanation: |
        Spiral review of 6.1 (rationales for imperialism): the ideology of unit 6 outlived the war that was supposed to end it.

    # ---- Stimulus set B: Gandhi, Hind Swaraj
    - slug: apworld-u07-w25-q04
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary source: M. K. Gandhi, Hind Swaraj or Indian Home Rule, English edition (1910), James Madison University Gandhi Center text"
      points: 1
      stimulus: |
        "The English have not taken India; we have given it to them. They are not in India because of their strength, but because we keep them."

        — M. K. Gandhi, Hind Swaraj (Indian Home Rule), written as a dialogue between a reader and an editor; Gujarati edition 1909, English edition 1910. Gandhi was then a lawyer and campaigner in South Africa; he returned to India in 1915.
      prompt: |
        The passage's argument most directly supports which strategy, which Gandhi later led?
      options:
        - "armed rebellion against British garrisons"
        - "petitioning Parliament for gradual reforms"
        - "mass non-cooperation: withdrawing the Indian participation (in courts, schools, trade and administration) that kept the British in India"
        - "an alliance with Japan against Britain"
      option_explanations:
        - |
          If British rule rested on Indian consent rather than British strength, force was beside the point; Gandhi rejected it on principle too.
        - |
          Petitioning was the method of the early Congress (1885), which the passage implicitly criticises as cooperation.
        - |
          Correct. The Non-Cooperation Movement (1920–22) and civil disobedience (1930–34) withdrew the consent the passage describes.
        - |
          Gandhi sought no foreign ally; self-rule had to come from Indian conduct.
      answer: 2
      explanation: |
        Skill: sourcing (argument to strategy). The premise that Indians sustain the Raj leads straight to non-cooperation.

    - slug: apworld-u07-w25-q05
      type: multiple_choice
      topic_code: "7.5"
      source: "Primary source: M. K. Gandhi, Hind Swaraj or Indian Home Rule, English edition (1910), James Madison University Gandhi Center text"
      points: 1
      stimulus: |
        "The English have not taken India; we have given it to them. They are not in India because of their strength, but because we keep them."

        — M. K. Gandhi, Hind Swaraj (Indian Home Rule), written as a dialogue between a reader and an editor; Gujarati edition 1909, English edition 1910. Gandhi was then a lawyer and campaigner in South Africa; he returned to India in 1915.
      prompt: |
        Which event after the First World War did most to win Indians over to the position Gandhi takes here?
      options:
        - "the Rowlatt Act and the Amritsar massacre of 1919, which showed that wartime service would be rewarded with repression rather than self-government"
        - "the Boxer Uprising"
        - "the founding of the League of Nations"
        - "the Russian Revolution of 1905"
      option_explanations:
        - |
          Correct. Detention without trial and the killing of about 379 people at Jallianwala Bagh discredited cooperation and made the Non-Cooperation Movement of 1920 possible.
        - |
          The Boxers (1900) fought in China; Indian opinion was moved by Indian events.
        - |
          The League did nothing for India, but its founding was not the shock that changed Indian politics.
        - |
          The 1905 revolution in Russia had no direct effect on Indian opinion in 1919.
      answer: 0
      explanation: |
        Skill: causation. The massacre turned a philosophy into a mass movement.

    - slug: apworld-u07-w25-q06
      type: multiple_choice
      topic_code: "6.3"
      source: "Primary source: M. K. Gandhi, Hind Swaraj or Indian Home Rule, English edition (1910), James Madison University Gandhi Center text"
      points: 1
      stimulus: |
        "The English have not taken India; we have given it to them. They are not in India because of their strength, but because we keep them."

        — M. K. Gandhi, Hind Swaraj (Indian Home Rule), written as a dialogue between a reader and an editor; Gujarati edition 1909, English edition 1910. Gandhi was then a lawyer and campaigner in South Africa; he returned to India in 1915.
      prompt: |
        Compared with the Indian Rebellion of 1857, the response to British rule that Gandhi proposes differed mainly in that it
      options:
        - "sought to restore the Mughal emperor"
        - "was led by sepoys"
        - "relied on military force"
        - "aimed to end British rule by non-violent withdrawal of cooperation rather than by armed revolt, and addressed Indians as a nation rather than as soldiers and princes"
      option_explanations:
        - |
          The 1857 rebels proclaimed Bahadur Shah; Gandhi wanted self-rule, not the old dynasty.
        - |
          Sepoys began 1857; Gandhi's movement drew on lawyers, peasants, merchants and women.
        - |
          Force was 1857's method and Gandhi's chief objection.
        - |
          Correct. Unit 6's indigenous responses included armed resistance and new nationalist bodies; Gandhi fused the second with a new method, non-violent mass action.
      answer: 3
      explanation: |
        Spiral review of 6.3 (indigenous responses to state expansion): from 1857 to the Congress of 1885 to satyagraha.

    # ---- Stimulus set C: aggression timeline table
    - slug: apworld-u07-w25-q07
      type: multiple_choice
      topic_code: "7.6"
      source: "Timeline compiled for this course"
      points: 1
      stimulus: |
        Acts of aggression and international responses, 1931–1939

        | Date | Act | Response of the League, Britain and France |
        |---|---|---|
        | Sept 1931 | Japan seizes Manchuria | League's Lytton Report condemns Japan; Japan leaves the League (1933); no sanctions |
        | Oct 1935 | Italy invades Ethiopia | League sanctions on Italy, excluding oil; Suez Canal stays open; conquest completed 1936 |
        | March 1936 | Germany remilitarises the Rhineland | France and Britain protest; no action |
        | July 1937 | Japan invades China | no action; the United States continues trade with Japan |
        | March 1938 | Germany annexes Austria | no action |
        | Sept 1938 | Germany demands the Sudetenland | Munich conference cedes it to Germany |
        | March 1939 | Germany occupies the rest of Czechoslovakia | Britain and France guarantee Poland |
        | Sept 1939 | Germany invades Poland | Britain and France declare war |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "The League of Nations successfully deterred aggression until 1939."
        - "Repeated failure to resist aggression in the 1930s encouraged further aggression, until the occupation of Czechoslovakia ended the policy of concession."
        - "The United States led resistance to Japan from 1931."
        - "Italy and Japan opposed German expansion."
      option_explanations:
        - |
          Every row before the last shows aggression succeeding without penalty.
        - |
          Correct. Each unpunished act taught the aggressors that the democracies would not fight; only after March 1939 did Britain and France draw a line.
        - |
          The table notes that the United States kept trading with Japan until much later.
        - |
          Italy and Japan became Germany's allies (the Axis); the table shows them acting in parallel.
      answer: 1
      explanation: |
        Skill: data analysis (pattern over time). The exam expects you to read a timeline as a causal chain.

    - slug: apworld-u07-w25-q08
      type: multiple_choice
      topic_code: "7.6"
      source: "Timeline compiled for this course"
      points: 1
      stimulus: |
        Acts of aggression and international responses, 1931–1939

        | Date | Act | Response of the League, Britain and France |
        |---|---|---|
        | Sept 1931 | Japan seizes Manchuria | League's Lytton Report condemns Japan; Japan leaves the League (1933); no sanctions |
        | Oct 1935 | Italy invades Ethiopia | League sanctions on Italy, excluding oil; Suez Canal stays open; conquest completed 1936 |
        | March 1936 | Germany remilitarises the Rhineland | France and Britain protest; no action |
        | July 1937 | Japan invades China | no action; the United States continues trade with Japan |
        | March 1938 | Germany annexes Austria | no action |
        | Sept 1938 | Germany demands the Sudetenland | Munich conference cedes it to Germany |
        | March 1939 | Germany occupies the rest of Czechoslovakia | Britain and France guarantee Poland |
        | Sept 1939 | Germany invades Poland | Britain and France declare war |
      prompt: |
        The response recorded for September 1938 is the clearest example of
      options:
        - "collective security"
        - "containment"
        - "appeasement, the policy of conceding to a dictator's demands in the hope of avoiding war"
        - "isolationism"
      option_explanations:
        - |
          Collective security would have meant the League's members acting together against Germany; Munich did the opposite.
        - |
          Containment is the Cold War policy of week 27; it meant resisting expansion, not conceding to it.
        - |
          Correct. Chamberlain and Daladier handed the Sudetenland to Hitler without consulting Czechoslovakia; Hitler took the rest six months later.
        - |
          Isolationism describes the United States, which was absent from Munich; Britain and France were engaged, but engaged in concession.
      answer: 2
      explanation: |
        Skill: developments and processes. Know the word and the event that defines it.

    - slug: apworld-u07-w25-q09
      type: multiple_choice
      topic_code: "7.4"
      source: "Timeline compiled for this course"
      points: 1
      stimulus: |
        Acts of aggression and international responses, 1931–1939

        | Date | Act | Response of the League, Britain and France |
        |---|---|---|
        | Sept 1931 | Japan seizes Manchuria | League's Lytton Report condemns Japan; Japan leaves the League (1933); no sanctions |
        | Oct 1935 | Italy invades Ethiopia | League sanctions on Italy, excluding oil; Suez Canal stays open; conquest completed 1936 |
        | March 1936 | Germany remilitarises the Rhineland | France and Britain protest; no action |
        | July 1937 | Japan invades China | no action; the United States continues trade with Japan |
        | March 1938 | Germany annexes Austria | no action |
        | Sept 1938 | Germany demands the Sudetenland | Munich conference cedes it to Germany |
        | March 1939 | Germany occupies the rest of Czechoslovakia | Britain and France guarantee Poland |
        | Sept 1939 | Germany invades Poland | Britain and France declare war |
      prompt: |
        The first act in the table is most directly connected to which economic development of the preceding two years?
      options:
        - "the Soviet New Economic Policy"
        - "the collapse of Japan's silk and other exports in the Depression, which strengthened the army's argument that Japan needed its own resources and markets on the Asian mainland"
        - "the Dawes Plan"
        - "the introduction of the New Deal"
      option_explanations:
        - |
