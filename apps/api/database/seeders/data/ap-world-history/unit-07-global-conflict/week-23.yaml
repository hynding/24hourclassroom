      stimulus: |
        Map description: A map titled "The Ottoman Empire, 1878–1914" shows the empire's territory in three shades. The darkest shade, still Ottoman in 1914, covers Anatolia, the Arab lands from Syria to Yemen, and Iraq. A middle shade, "lost 1878–1908", covers Bosnia (to Austrian administration), Bulgaria, Cyprus (to Britain), Tunisia (to France, 1881) and Egypt (British occupation, 1882). The lightest shade, "lost 1908–1913", covers Bosnia (annexed by Austria 1908), Libya (to Italy, 1912), Albania (independent 1912), and Macedonia and Thrace (to Serbia, Greece and Bulgaria in the Balkan Wars, 1912–13). A note reads: "Public Debt Administration established 1881; constitution restored 1908."
      prompt: |
        The changes in the Balkans shown in the lightest shade contributed to the outbreak of the First World War mainly because
      options:
        - "they made the Ottoman Empire the strongest power in Europe"
        - "Serbia's enlargement and Austria's annexation of Bosnia intensified the rivalry between Serbia, backed by Russia, and Austria-Hungary, which led to the crisis of July 1914"
        - "Italy's seizure of Libya caused Britain to declare war on Italy"
        - "Albania invaded Austria-Hungary"
      option_explanations:
        - |
          The Ottomans were the weakest of the powers, which is why the vacuum they left was so dangerous.
        - |
          Correct. Austria annexed Bosnia in 1908 and watched Serbia double in size in 1912–13; the assassination in Bosnia by a Bosnian Serb in 1914 gave Vienna its chance.
        - |
          Britain did not go to war over Libya; Italy fought alongside Britain from 1915.
        - |
          Albania was a small new state with no such capacity.
      answer: 1
      explanation: |
        Skill: making connections. The Ottoman retreat is the link between 7.1 and 7.2: the Balkan vacuum fed the Austro-Serbian conflict.

    # ---- Stand-alone multiple choice (7.1, 7.2 and review)
    - slug: apworld-u07-w23-q10
      type: multiple_choice
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following was a cause of the fall of the Qing dynasty in 1911–12?
      options:
        - "The dynasty's successful industrialization"
        - "Accumulated humiliation from the unequal treaties and the Boxer indemnity, Japan's victory over Russia in 1905, and reforms that came too late to satisfy provincial elites"
        - "An invasion by the Soviet Union"
        - "The May Fourth Movement"
