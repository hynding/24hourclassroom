        (b) Explain ONE grievance of the revolution of 1910 that the article was meant to address.
        (c) Explain ONE way the article reflects a broader pattern in states that experienced revolution or regime change after 1900.
      answer: |
        (a) The nation owns all subsoil resources, including oil and minerals, regardless of who owns the surface; or lands taken from villages may be restored; or foreigners may not own land near borders and coasts.
        (b) Under Díaz, haciendas and foreign companies had taken village lands and foreign firms owned Mexico's railways, mines and oil; Zapata's followers demanded land back and nationalists resented foreign control, both of which Article 27 answers.
        (c) Like the Bolsheviks' nationalisation of industry and land in Russia or Sun Yat-sen's principle of people's livelihood in China, the article asserts the state's authority over the economy against foreign and landlord interests, the economic nationalism common to the revolutions of 7.1.
