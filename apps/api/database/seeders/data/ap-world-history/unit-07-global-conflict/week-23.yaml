        (c) The Moroccan crises of 1905 and 1911, in which Germany challenged French claims and Britain backed France, hardened the Anglo-French entente and left Germany feeling encircled; or the Anglo-German naval race, driven partly by Germany's wish for a world role, pushed Britain toward France and Russia.
