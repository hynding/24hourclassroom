        Three points, one per part.

        (a) 1 pt: a provision accurately drawn from the description. Zero for a provision not in the summary (e.g. the eight-hour day, which is Article 123).

        (b) 1 pt: a grievance explained and linked: land loss to haciendas; foreign ownership of resources; peonage; the demands of Zapata or Villa.

        (c) 1 pt: a comparison with another post-1900 case that shows economic nationalism or state control: Soviet nationalisation; Sun's principles; Atatürk's state-led economy; later Cárdenas oil nationalisation as continuation. Zero for a comparison with an unrelated event.

