      answer: 2
      explanation: |
        Spiral review of 6.2 (state expansion): the imperial wars of unit 6 and the European arms race of 7.2 overlapped in time and budget.

    # ---- Stimulus set B: interpretation on the July Crisis (7.2)
    - slug: apworld-u07-w23-q04
      type: multiple_choice
      topic_code: "7.2"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): The assassination at Sarajevo did not cause the First World War; it gave Austria-Hungary the occasion it had been waiting for since the Balkan Wars to destroy Serbia, and Germany the occasion to back its only reliable ally before Russia's rearmament made a war unwinnable. What turned a Balkan punitive expedition into a general war was the machinery built over the previous twenty years: two alliance blocs, mobilisation plans that could not be partly executed, and a belief in every capital that a short, decisive war was possible. No statesman in July 1914 wanted a four-year war; none was willing to be the one who backed down.
      prompt: |
        Which of the following best states the author's main argument?
      options:
        - "Serbia planned the war to destroy Austria-Hungary."
        - "The statesmen of 1914 wanted a long war to settle Europe's problems."
        - "The war was an accident caused by a single assassin."
        - "Long-term structures (alliances, mobilisation plans, the belief in short war) and the calculated choices of Vienna and Berlin turned a regional crisis into a general war, and the assassination was only the occasion."
      option_explanations:
        - |
          The passage presents Austria, not Serbia, as the state seeking a war.
        - |
          The last sentence says the opposite: no one wanted a four-year war.
        - |
          The passage explicitly denies that the assassination caused the war.
        - |
          Correct. The author separates occasion (Sarajevo), choice (Austria and Germany) and machinery (blocs, plans, short-war illusion), and ends with the refusal to back down.
      answer: 3
      explanation: |
        Skill: claims in a secondary source. Find the distinction the author draws (occasion versus cause) and the mechanism offered.

    - slug: apworld-u07-w23-q05
      type: multiple_choice
      topic_code: "7.2"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): The assassination at Sarajevo did not cause the First World War; it gave Austria-Hungary the occasion it had been waiting for since the Balkan Wars to destroy Serbia, and Germany the occasion to back its only reliable ally before Russia's rearmament made a war unwinnable. What turned a Balkan punitive expedition into a general war was the machinery built over the previous twenty years: two alliance blocs, mobilisation plans that could not be partly executed, and a belief in every capital that a short, decisive war was possible. No statesman in July 1914 wanted a four-year war; none was willing to be the one who backed down.
      prompt: |
        Which piece of evidence would most directly support the author's claim about "mobilisation plans that could not be partly executed"?
      options:
        - "The Zimmermann telegram"
        - "The Treaty of Versailles's war-guilt clause"
        - "Germany's Schlieffen Plan, which required an attack on France through Belgium as soon as Russia mobilised, so that a war with Russia automatically became a war with France and Britain"
        - "The Balfour Declaration"
      option_explanations:
        - |
          The telegram (1917) concerned Mexico and American entry, three years after the July Crisis.
        - |
          Article 231 (1919) assigned responsibility after the war; it is not evidence about plans in 1914.
        - |
          Correct. The plan's timetable is the standard example of a mobilisation scheme that turned any Russian move into a Western offensive.
        - |
          The Balfour Declaration (1917) concerned Palestine, not mobilisation.
      answer: 2
      explanation: |
        Skill: evidence for a claim. Match the specific mechanism the author names to the plan that embodied it.

    - slug: apworld-u07-w23-q06
      type: multiple_choice
      topic_code: "7.2"
      source: "Interpretation written for this course"
      points: 1
      stimulus: |
        Interpretation (written for this course): The assassination at Sarajevo did not cause the First World War; it gave Austria-Hungary the occasion it had been waiting for since the Balkan Wars to destroy Serbia, and Germany the occasion to back its only reliable ally before Russia's rearmament made a war unwinnable. What turned a Balkan punitive expedition into a general war was the machinery built over the previous twenty years: two alliance blocs, mobilisation plans that could not be partly executed, and a belief in every capital that a short, decisive war was possible. No statesman in July 1914 wanted a four-year war; none was willing to be the one who backed down.
      prompt: |
        A historian who wished to modify the author's argument would most likely point out that
      options:
        - "Austria-Hungary had no interest in Serbia"
        - "the alliance system was created in 1914"
        - "nationalism, including Serbian ambitions to unite South Slavs and pan-Slav feeling in Russia, shaped why the states made the choices the author describes, and deserves a place beside the structural machinery"
        - "the war lasted only a few weeks"
      option_explanations:
        - |
          Austria had resolved to crush Serbia after the Balkan Wars, as the passage itself says.
        - |
          The blocs were formed between 1882 and 1907, as the passage's "previous twenty years" implies.
        - |
          Correct. The passage emphasises structures and calculation; a modifier would add the nationalist passions that made Serbia a threat and Russia unwilling to abandon it.
        - |
          The passage refers to a four-year war, which is correct.
      answer: 2
      explanation: |
        Skill: argumentation (modifying a claim). The best modification adds a cause the author underweights without contradicting the evidence.

    # ---- Stimulus set C: map of Ottoman losses (7.1)
    - slug: apworld-u07-w23-q07
      type: multiple_choice
      topic_code: "6.2"
      source: "Map description written for this course"
      points: 1
      stimulus: |
        Map description: A map titled "The Ottoman Empire, 1878–1914" shows the empire's territory in three shades. The darkest shade, still Ottoman in 1914, covers Anatolia, the Arab lands from Syria to Yemen, and Iraq. A middle shade, "lost 1878–1908", covers Bosnia (to Austrian administration), Bulgaria, Cyprus (to Britain), Tunisia (to France, 1881) and Egypt (British occupation, 1882). The lightest shade, "lost 1908–1913", covers Bosnia (annexed by Austria 1908), Libya (to Italy, 1912), Albania (independent 1912), and Macedonia and Thrace (to Serbia, Greece and Bulgaria in the Balkan Wars, 1912–13). A note reads: "Public Debt Administration established 1881; constitution restored 1908."
      prompt: |
        Which conclusion is best supported by the map?
      options:
        - "The Ottoman Empire expanded between 1878 and 1914."
        - "By 1914 the empire had lost almost all of its European and North African territory to European powers and Balkan nationalist states, while keeping Anatolia and the Arab lands."
        - "The empire lost Anatolia in 1912."
        - "Egypt remained under direct Ottoman rule in 1914."
      option_explanations:
        - |
          Every shaded change on the map is a loss of territory; nothing was gained between 1878 and 1914.
        - |
          Correct. The two lighter shades trace a retreat from Europe and Africa; the dark core is what remained when the empire entered the war in 1914.
        - |
          Anatolia is in the darkest shade, still Ottoman.
        - |
          Egypt is marked as under British occupation from 1882.
      answer: 1
      explanation: |
        Skill: analysing a map. Read the legend's time layers; the pattern of loss explains the Young Turks' sense of crisis.

