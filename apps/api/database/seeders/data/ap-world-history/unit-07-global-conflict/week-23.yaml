      points: 3
      stimulus: |
        Source description: Article 27 of the Mexican Constitution of 1917 declares that ownership of the lands and waters within the national territory belongs originally to the nation, which may transfer title to private persons; that the nation owns all minerals and petroleum beneath the soil; that the nation may expropriate private property in the public interest with compensation; and that lands taken from villages may be restored to them. It also restricts foreigners' right to own land near the borders and coasts.
      prompt: |
        Using the source description, answer (a), (b) and (c).

