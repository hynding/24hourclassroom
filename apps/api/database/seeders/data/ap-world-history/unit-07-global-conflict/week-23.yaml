        Britain's 1900 figure reflects the South African War.
      prompt: |
        The note on Britain's 1900 figure refers to a war that is best understood as
      options:
        - "the Boxer Rebellion"
        - "a war of independence by Zulu kingdoms"
        - "a colonial war between Britain and the Boer republics of southern Africa over gold, diamonds and control of the region, part of the imperial expansion of unit 6"
