week: 23
unit: 7
title: "Shifting Power After 1900 and the Causes of World War I"
topics: ["7.1", "7.2"]
guide: guides/week-23.md
guide_description: |
  The collapse of four old regimes after 1900 (Díaz's Mexico, Qing China, the Ottoman sultanate and the Russian
  autocracy) and what replaced them, then the long-term causes of the First World War (militarism, alliances,
  imperialism, nationalism, the Balkans) and the July Crisis that turned an assassination in Sarajevo into a
  general war in five weeks.
flashcards_description: |
  30 cards on the Mexican, Chinese, Young Turk and Russian revolutions and on the causes of the First World War,
  from the alliance blocs to the mobilisation timetables of 1914.

flashcards:
  - front: Porfiriato (1876–1911) → strengths and the grievances it created
    back: |
      Porfirio Díaz gave Mexico order, railways and foreign investment in mines, oil and land. But haciendas and foreign companies swallowed village lands, rural workers fell into debt peonage, and elections were rigged; the grievances of peasants, workers and excluded elites fed the revolution of 1910.
    topic_code: "7.1"
  - front: Mexican Revolution → four leaders and what each wanted
    back: |
      Francisco Madero: honest elections and constitutional rule. Emiliano Zapata: land returned to villages ("Land and Liberty"). Pancho Villa: northern popular army and land reform. Venustiano Carranza: a constitutional nationalist state, which prevailed with the Constitution of 1917.
    topic_code: "7.1"
  - front: Mexican Constitution of 1917 → three key provisions
    back: |
      Article 27 made land and subsoil resources (oil, minerals) the property of the nation, allowing expropriation of foreign holdings; Article 123 guaranteed labour rights (eight-hour day, right to strike); anticlerical articles limited the Church. Nationalist and agrarian, not socialist.
    topic_code: "7.1"
  - front: United States and the Mexican Revolution → two interventions
    back: |
      U.S. forces occupied Veracruz in 1914 against Huerta's regime, and Pershing's expedition pursued Villa into Mexico in 1916–17 after his raid on Columbus, New Mexico. Both deepened Mexican nationalism and the suspicion of U.S. power written into the 1917 constitution.
    topic_code: "7.1"
  - front: Why the Qing fell in 1911 → four causes
    back: |
      Humiliation by the unequal treaties and the Boxer indemnity; Japan's 1905 victory over Russia, showing an Asian constitutional state could win; late and half-hearted reforms (examinations abolished 1905) that alienated elites; and railway nationalisation that angered provincial investors. The Wuchang mutiny of October 1911 spread province by province.
    topic_code: "7.1"
  - front: Sun Yat-sen → role and the Three Principles of the People
    back: |
      Leader of the Revolutionary Alliance that worked to overthrow the Qing; first provisional president of the Republic of China (1912). His Three Principles: nationalism (ending foreign domination and Manchu rule), democracy (constitutional government in stages) and people's livelihood (land and economic reform).
    topic_code: "7.1"
  - front: Yuan Shikai and the warlord era → what went wrong after 1912
    back: |
      Sun yielded the presidency to the general Yuan Shikai, who dissolved parliament and tried to make himself emperor in 1915–16. After his death in 1916 China fragmented among regional warlords until the Guomindang's Northern Expedition (1926–28) partly reunified it.
    topic_code: "7.1"
  - front: May Fourth Movement (1919) → trigger and consequences
    back: |
      Students in Beijing protested the Versailles decision to give Germany's rights in Shandong to Japan. The movement spread into a cultural and nationalist awakening that rejected Confucian tradition, embraced science and democracy, and produced both a reorganised Guomindang and the Chinese Communist Party (1921).
    topic_code: "7.1"
  - front: Ottoman decline before 1908 → territorial and financial losses
    back: |
      Greece (1830), Serbia, Romania and Bulgaria (1878), Egypt occupied by Britain (1882), Tunisia taken by France (1881), Bosnia administered by Austria (1878). The Public Debt Administration (1881) gave European creditors control of Ottoman revenues. Absolutism under Abdulhamid II could not reverse the decline.
    topic_code: "7.1"
  - front: Young Turk revolution (1908) → who, what, result
    back: |
      Officers and reformers of the Committee of Union and Progress forced Abdulhamid II to restore the constitution of 1876 and later deposed him. The CUP ruled as a modernising, increasingly Turkish-nationalist dictatorship, lost Libya (1912) and the Balkans (1912–13), and took the empire into the First World War on Germany's side.
    topic_code: "7.1"
  - front: Balkan Wars (1912–13) → outcome for the Ottomans and for Serbia
    back: |
      Serbia, Bulgaria, Greece and Montenegro drove the Ottomans out of almost all of Europe in 1912; the victors then fought over the spoils in 1913. Serbia roughly doubled in size, alarming Austria-Hungary, which resolved to crush it at the next chance: the road to Sarajevo.
    topic_code: "7.1"
  - front: Russian Revolution of 1905 → causes and result
    back: |
      Defeat by Japan (1904–05) and the shooting of petitioners on Bloody Sunday (January 1905) set off strikes, mutinies (the Potemkin) and peasant risings. Nicholas II's October Manifesto promised a Duma; once order returned he limited its powers. A rehearsal for 1917.
    topic_code: "7.1"
  - front: February Revolution 1917 → why the tsar fell
    back: |
      War defeats, inflation, food shortages and the strain of mobilising a peasant army broke the regime. Bread riots in Petrograd grew into a general strike; the garrison mutinied; Nicholas II abdicated in March (February by the Russian calendar). A Provisional Government shared power with the Petrograd Soviet.
    topic_code: "7.1"
  - front: Why the Provisional Government failed → three reasons
    back: |
      It kept Russia in the war, which the army and cities hated; it postponed land reform until a constituent assembly, while peasants seized land anyway; and it shared power with the soviets, which controlled the troops. Lenin's "peace, land and bread" answered each failure.
    topic_code: "7.1"
  - front: October Revolution 1917 → how the Bolsheviks took power
    back: |
      Lenin returned in April 1917 demanding all power to the soviets. In October (November) Bolshevik Red Guards under Trotsky's direction seized key points in Petrograd and arrested the Provisional Government. The Bolsheviks then dissolved the elected Constituent Assembly and made peace at Brest-Litovsk (March 1918).
    topic_code: "7.1"
  - front: Russian Civil War (1918–21) → sides and outcome
    back: |
      The Bolshevik Reds against the Whites (monarchists, liberals, rival socialists) and foreign interventions by Britain, France, the United States and Japan. Red control of the centre, Trotsky's Red Army and the Whites' disunity gave the Bolsheviks victory and a one-party state by 1921.
    topic_code: "7.1"
  - front: Comparison → Mexican, Chinese and Russian revolutions
    back: |
      All three overthrew regimes weakened by foreign economic domination and failed reform, and all passed through civil war. Outcomes differed: Mexico produced a nationalist, agrarian constitution (1917) and by 1929 a dominant party; China a republic that collapsed into warlordism; Russia a one-party Marxist state. Only Russia's revolution was socialist.
    topic_code: "7.1"
  - front: MAIN → the four long-term causes of the First World War
    back: |
      Militarism (arms race, mobilisation plans), Alliances (Triple Alliance vs Triple Entente), Imperialism (colonial and Balkan rivalries), Nationalism (Alsace-Lorraine, pan-Slavism, Serbian ambition). Add the Balkan power vacuum and the Sarajevo trigger for a complete causation answer.
    topic_code: "7.2"
  - front: Triple Alliance and Triple Entente → members and dates
    back: |
      Triple Alliance: Germany, Austria-Hungary, Italy (1882; Italy stayed neutral in 1914 and joined the Entente in 1915). Triple Entente: France and Russia (alliance 1894), Britain and France (Entente Cordiale 1904), Britain and Russia (1907). Two blocs turned a local war into a general one.
    topic_code: "7.2"
  - front: Anglo-German naval race → what it was and why it mattered
    back: |
      After Britain launched HMS Dreadnought (1906), which made all older battleships obsolete, Germany and Britain raced to build the new type. Germany's fleet programme convinced Britain that Germany threatened its security and pushed it toward France and Russia.
    topic_code: "7.2"
  - front: Schlieffen Plan → the idea and why it made war harder to stop
    back: |
      Germany's plan for a two-front war: defeat France quickly by sweeping through Belgium, then turn east against slower-mobilising Russia. Because the timetable required attacking France as soon as Russia mobilised, any Russian mobilisation meant a German attack on France and Belgium, which brought in Britain.
    topic_code: "7.2"
  - front: Moroccan crises (1905, 1911) → significance for 1914
    back: |
      Germany twice challenged French claims to Morocco, hoping to split France from Britain; each time Britain backed France and Germany was left isolated. The crises showed imperial rivalry feeding European tension and hardened the blocs.
    topic_code: "7.2"
  - front: Bosnian crisis (1908) → what happened and what it taught Russia and Serbia
    back: |
      Austria-Hungary annexed Bosnia-Herzegovina, which Serbia claimed and Russia had hoped to trade for concessions. Germany backed Austria and Russia, still weak after 1905, had to back down. Russia resolved not to be humiliated again, which shaped its decision to mobilise in 1914.
    topic_code: "7.2"
  - front: Sarajevo, 28 June 1914 → who, whom, why
    back: |
      Gavrilo Princip, a Bosnian Serb linked to the Serbian nationalist Black Hand, shot Archduke Franz Ferdinand, heir to Austria-Hungary, during a visit to Bosnia. Austria used the murder to settle accounts with Serbia; it was the trigger, not the cause, of the war.
    topic_code: "7.2"
  - front: July Crisis 1914 → the six steps from Sarajevo to general war
    back: |
      Germany's "blank cheque" to Austria (5–6 July); Austria's ultimatum to Serbia (23 July); Austria declares war on Serbia (28 July); Russia mobilises (30 July); Germany declares war on Russia (1 August) and France (3 August) and invades Belgium; Britain declares war on Germany (4 August).
    topic_code: "7.2"
  - front: Why Britain entered the war in 1914 → two reasons
    back: |
      Germany's invasion of neutral Belgium, whose neutrality Britain had guaranteed in 1839, gave a legal and moral cause; the deeper reason was that a German victory over France would leave one power dominating Europe and the Channel coast, which British policy had always opposed.
    topic_code: "7.2"
  - front: Nationalism as a cause of war → four forms in 1914
    back: |
      French desire to recover Alsace-Lorraine; pan-Slav sentiment in Russia for Serbia; Serbian ambition to unite South Slavs, which threatened multinational Austria-Hungary; and mass-press nationalism in every capital that made backing down look like dishonour.
    topic_code: "7.2"
  - front: Austria-Hungary's problem → why Serbia seemed an existential threat
    back: |
      A multinational empire of Germans, Magyars, Czechs, Poles, Croats, Serbs and others feared that a strong Serbia would draw its South Slav subjects away. Crushing Serbia looked like self-preservation to Vienna, which is why it risked war with Russia.
    topic_code: "7.2"
  - front: Immediate vs long-term causes → how to structure a 7.2 causation answer
    back: |
      Trigger: Sarajevo and the July Crisis. Short-term: the Balkan Wars and the Bosnian crisis. Long-term: militarism, alliances, imperialism, nationalism. Mechanism: alliances plus mobilisation timetables plus fear of humiliation. Rank them and say why.
    topic_code: "7.2"
  - front: Consequences of the First World War in one card → four empires fall
    back: |
      The German, Austro-Hungarian, Russian and Ottoman empires collapsed; the United States and Japan rose; new states appeared in Eastern Europe and the Middle East; the Bolsheviks took Russia; and the colonial world's contribution to the war fed nationalism. Details in weeks 24–25.
    topic_code: "7.2"

quiz:
  description: |
    24 questions · about 35 minutes · topics 7.1 and 7.2 (the fall of old regimes after 1900 and the causes of
    the First World War), with about a third of the items reviewing unit 6's imperial rivalries and economic
    imperialism and unit 5's nationalism and industrialization. Multiple choice, select-all and true/false items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: armaments table (7.2)
    - slug: apworld-u07-w23-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "Data table compiled for this course from standard estimates of military expenditure, rounded"
      points: 1
      stimulus: |
        Estimated military spending of the great powers (million pounds sterling, rounded):

        | Power | 1890 | 1900 | 1910 | 1913 |
        |---|---|---|---|---|
        | Germany | 29 | 41 | 64 | 111 |
        | Russia | 29 | 41 | 63 | 88 |
        | Britain | 31 | 69 | 68 | 77 |
        | France | 37 | 42 | 52 | 72 |
        | Austria-Hungary | 13 | 14 | 17 | 37 |
        | Italy | 15 | 15 | 24 | 28 |

        Britain's 1900 figure reflects the South African War.
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "Military spending by the great powers fell between 1890 and 1913."
        - "Germany's military spending nearly quadrupled between 1890 and 1913 and rose most sharply after 1910, consistent with an accelerating arms race."
        - "Britain spent more than Germany in 1913."
        - "Austria-Hungary was the largest military spender."
      option_explanations:
        - |
          Every row rises; the total more than doubled.
        - |
          Correct. From 29 to 111 million pounds, with the steepest jump in the last three years, the pattern historians call militarism.
        - |
          Britain's 77 million was below Germany's 111 in 1913; Britain's lead was at sea, not in total spending.
        - |
          Austria-Hungary spent the least of the five major powers in most years.
      answer: 1
      explanation: |
        Skill: analysing data. Read the trend over time for each row and compare the slopes; the acceleration after 1910 is the key observation.

    - slug: apworld-u07-w23-q02
      type: multiple_choice
      topic_code: "7.2"
      source: "Data table compiled for this course from standard estimates of military expenditure, rounded"
      points: 1
      stimulus: |
        Estimated military spending of the great powers (million pounds sterling, rounded):

        | Power | 1890 | 1900 | 1910 | 1913 |
        |---|---|---|---|---|
        | Germany | 29 | 41 | 64 | 111 |
        | Russia | 29 | 41 | 63 | 88 |
        | Britain | 31 | 69 | 68 | 77 |
        | France | 37 | 42 | 52 | 72 |
        | Austria-Hungary | 13 | 14 | 17 | 37 |
        | Italy | 15 | 15 | 24 | 28 |

        Britain's 1900 figure reflects the South African War.
      prompt: |
        The spending shown in the table most directly contributed to the outbreak of war in 1914 by
      options:
        - "bankrupting the great powers so that they sought colonies to pay their debts"
        - "ending the alliance system"
        - "persuading the powers to disarm at the Hague conferences"
        - "making every power confident that it could win quickly, and giving general staffs mobilisation plans whose timetables left diplomats little time once a crisis began"
      option_explanations:
        - |
          The powers were not bankrupt in 1914; the scramble for colonies predated the spending surge.
        - |
          Arms spending hardened the blocs rather than dissolving them.
        - |
          The Hague conferences of 1899 and 1907 failed to limit armaments.
        - |
          Correct. Armies and plans built for rapid offensive war (the Schlieffen Plan above all) turned the July Crisis into a race to mobilise first.
      answer: 3
      explanation: |
        Skill: causation. Militarism is a cause through its mechanism: plans and timetables, not just numbers.

