        Three points, one per part.

        (a) 1 pt: a correctly identified long-term cause. Zero for the assassination.

        (b) 1 pt: an explanation that shows the mechanism (alliances, mobilisation, the Schlieffen Plan, Belgium) rather than just listing declarations of war.

        (c) 1 pt: a specific colonial or naval rivalry linked to European alignments: Morocco; the naval race; Fashoda (1898) as resolved rivalry that pushed Britain and France together; the Balkans as an Ottoman imperial inheritance.

    # ---- Long answer (LEQ)
    - slug: apworld-u07-w23-q25
      type: long_answer
      topic_code: "7.1"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1900 and 1920 long-established regimes in Mexico, China, the Ottoman Empire and Russia fell to revolution or reform, and new kinds of state took their place.

        Evaluate the extent to which internal factors, rather than external pressures, caused the collapse of old regimes in the period 1900–1920.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: External pressures (foreign economic domination, military defeat, war) exposed and accelerated the collapse of the old regimes, but internal factors, above all the regimes' failure to reform and the grievances of peasants, workers and excluded elites, determined that collapse became revolution; the two worked together, with internal weakness the deeper cause.

        Context: the economic imperialism and unequal treaties of unit 6; the nationalism of unit 5; industrialization reaching Russia and Mexico late.

        Body 1 (external): Japan's defeat of Russia (1905) and the Boxer indemnity for China; foreign-owned oil and railways in Mexico; the Ottoman debt administration and territorial losses; the First World War breaking Russia.

        Body 2 (internal): rigged elections and land loss under Díaz; the Qing's abolition of the examinations and railway nationalisation alienating elites; the tsar's hollow Duma and peasant land hunger; Abdulhamid's absolutism.

        Body 3 (comparison of outcomes): Mexico's agrarian constitution, China's warlord collapse, Russia's one-party state, Turkey's republic; the differences reflect internal forces (who led, what they wanted) more than external ones.

        Complexity: the external and internal were linked (foreign domination created the internal grievances); the war was external for Russia but internal in its effects; Japan's success shows external pressure could be answered by reform.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim on the balance of internal and external causes with a line of reasoning. Zero for "both internal and external factors mattered" without weighting.

        Contextualization (0–1): economic imperialism; the unequal treaties; nationalism; late industrialization; the First World War.

        Evidence (0–2): 1 pt for at least two specific examples (Díaz and foreign capital, Zapata, 1917 constitution; Boxer Protocol, 1905, Wuchang, Sun Yat-sen; Ottoman losses, 1908, CUP; Bloody Sunday, 1905, February and October 1917, Brest-Litovsk). 2 pts for using them to support the weighting.

        Analysis and reasoning (0–2): 1 pt for causation structuring the essay (distinguishing underlying, precipitating and external causes). 1 pt for complexity: showing the interaction of internal and external causes; comparing cases with different balances; explaining different outcomes; a counter-case such as Japan or Siam.

        Common errors: writing only about Russia; treating the First World War as a cause of the Mexican or Chinese revolutions; confusing the February and October revolutions; no mention of the Ottoman case.
