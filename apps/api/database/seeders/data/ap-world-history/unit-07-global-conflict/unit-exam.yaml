      (c) Explain ONE way the international response to mass atrocities changed after 1945.
    answer: |
      (a) The Armenian genocide (1915–17); or the Cambodian genocide (1975–79); or the Rwandan genocide (1994); or the ethnic cleansing of Bosnia (1992–95); or the Rape of Nanjing (1937).
      (b) Nazi racial ideology, which defined Jews as a biological enemy of the German people; or the war in the east from 1941, which brought millions of Jews under German control and radicalised policy from exclusion to murder; or the long history of European antisemitism that made collaboration possible; or the bureaucratic state that organised the killing.
      (c) The Nuremberg and Tokyo trials established individual responsibility for crimes against humanity; the UN Genocide Convention (1948) defined genocide and bound states to prevent and punish it; later tribunals for Yugoslavia and Rwanda and the International Criminal Court (2002) applied the principle, though enforcement remained weak, as Cambodia and Rwanda showed.
    explanation: |
      Three points, one per part.

      (a) 1 pt: a correctly named atrocity with roughly correct dates.

      (b) 1 pt: a cause explained, not merely named; ideology, war, antisemitism or state organisation each acceptable.

      (c) 1 pt: a change in response explained with a specific (Nuremberg, the Genocide Convention, later tribunals); credit for noting the limits of enforcement if a specific is given.

  # ---- Long answer (LEQ)
  - slug: apworld-u07-exam-q45
    type: long_answer
    topic_code: "7.9"
    source: "general knowledge"
    points: 6
    prompt: |
      Economic forces shaped the wars and revolutions of the first half of the twentieth century.

      Evaluate the extent to which economic factors caused global conflict in the period 1900–1945.

      In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
    answer: |
      Thesis: Economic factors were a necessary but not sufficient cause of global conflict: the industrial economy supplied the weapons and the imperial rivalries behind 1914, and the Depression made fascism and Japanese expansion possible, but the decisions for war in both 1914 and 1939 were political and ideological, so economics explains the capacity and the pressure for conflict more than its outbreak.

      Context: industrialization, the new imperialism and the integrated world economy of 1870–1914.

      Body 1 (economic causes of 1914 and of the revolutions of 7.1): competition for markets and colonies; the arms industry and naval race; foreign economic domination in Mexico and China; the strain of war economies breaking Russia in 1917.

      Body 2 (economic causes of 1939): reparations and war debt; the Depression's role in Hitler's vote and Japan's turn to Manchuria; autarky and the drive for resources (Lebensraum, the Co-Prosperity Sphere); the oil embargo before Pearl Harbor.

      Body 3 (non-economic causes): nationalism and the alliance system; the Schlieffen timetable; fascist and Nazi ideology, including racial war; the failure of collective security and appeasement; Hitler's deliberate choice of war in a recovering economy.

      Complexity: the New Deal and the Soviet plans show that economic crisis did not lead to war everywhere, so regime type mattered; the economic and the ideological were linked (the Depression made ideology popular); the First World War's economic consequences (Keynes) were themselves a cause of the Second.
    explanation: |
      Scored on the six-point LEQ rubric.

      Thesis/claim (0–1): a defensible claim about the extent of economic causation with a line of reasoning. Zero for "economic factors were important" without weighing them against others.

      Contextualization (0–1): industrialization; the new imperialism; the pre-war world economy; or the aftermath of the First World War for a 1939-focused essay.

      Evidence (0–2): 1 pt for at least two specific examples (the naval race; foreign capital in Mexico; reparations; the Depression and the Nazi vote; silk exports and Manchuria; the oil embargo; Article 231; the Nazi-Soviet Pact). 2 pts for using them to support the weighting.

      Analysis and reasoning (0–2): 1 pt for causation structuring the essay (economic versus political and ideological causes; necessary versus sufficient). 1 pt for complexity: cases where economic crisis did not produce war; the interaction of economics and ideology; comparison of 1914 and 1939.
