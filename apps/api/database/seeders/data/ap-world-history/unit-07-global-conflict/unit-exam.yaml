  # ---- Stand-alone multiple choice (7.1–7.9 and review)
  - slug: apworld-u07-exam-q14
    type: multiple_choice
    topic_code: "7.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The Mexican Revolution that began in 1910 differed from the Russian Revolution of 1917 in that it
    options:
      - "was led by a Marxist party"
      - "produced a constitution (1917) that asserted national ownership of land and subsoil resources and labour rights while keeping private property, rather than a one-party communist state"
      - "took Mexico out of the First World War"
      - "restored the previous dictator"
    option_explanations:
      - |
        Mexico's revolution was agrarian and nationalist; its leaders (Madero, Zapata, Villa, Carranza) were not Marxists.
      - |
        Correct. Article 27 and Article 123 of the 1917 constitution answered land hunger and foreign ownership without abolishing capitalism; Russia's October produced the Bolshevik state.
      - |
        Mexico stayed neutral in the war; Russia left it at Brest-Litovsk.
      - |
        Díaz fled to exile in Paris in 1911 and never returned to power or to Mexico.
    answer: 1
    explanation: |
      Skill: comparison. Shared causes, different outcomes.

  - slug: apworld-u07-exam-q15
    type: multiple_choice
    topic_code: "7.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which development most directly followed the abdication of the last Qing emperor in February 1912?
    options:
      - "a stable parliamentary republic under Sun Yat-sen"
      - "the restoration of the Ming dynasty"
      - "the immediate victory of the Chinese Communist Party"
      - "a republic that fell under the general Yuan Shikai and then fragmented among regional warlords after his death in 1916"
    option_explanations:
      - |
        Sun handed the presidency to Yuan within weeks and the republic never stabilised.
      - |
        No dynasty was restored; Yuan's own attempt to become emperor (1915–16) failed.
      - |
        The CCP was founded in 1921 and did not win power until 1949.
      - |
        Correct. The warlord era (1916–28) was the setting of the May Fourth Movement and of the GMD-CCP struggle that followed.
    answer: 3
    explanation: |
      Skill: developments and processes. Know what came between the Qing and the Guomindang.

  - slug: apworld-u07-exam-q16
    type: multiple_choice
    topic_code: "7.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The Provisional Government that replaced the tsar in March 1917 lost power to the Bolsheviks in November mainly because it
    options:
      - "kept Russia in the war and postponed land reform, leaving soldiers, peasants and workers to the Bolshevik promise of peace, land and bread"
      - "made peace with Germany too quickly"
      - "abolished the soviets"
      - "was dominated by the nobility"
    option_explanations:
