      - |
        The soviets coexisted with the government (dual power) and the Bolsheviks won majorities in them.
      - |
        It was led by liberals and moderate socialists (Kerensky), not nobles.
    answer: 0
    explanation: |
      Skill: causation. The war is the link between the two revolutions of 1917.

