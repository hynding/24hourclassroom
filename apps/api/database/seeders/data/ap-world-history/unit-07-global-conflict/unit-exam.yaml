  - slug: apworld-u07-exam-q43
    type: short_answer
    topic_code: "7.3"
    source: "Described source: a British recruiting poster of 1915, described in our own words"
    points: 3
    stimulus: |
      Source description: A British recruiting poster printed in 1915 shows a comfortable middle-class sitting room some years after the war. A father in a suit sits in an armchair, looking uneasily out at the viewer; a small boy plays with toy soldiers on the carpet at his feet, and a girl sits on his lap with a picture book open. The girl is asking a question, printed as the poster's caption, which asks what the father did in the Great War. The poster was issued by the Parliamentary Recruiting Committee before Britain introduced conscription in 1916.
    prompt: |
      Using the source description, answer (a), (b) and (c).

      (a) Describe the message the poster is designed to convey.
      (b) Explain ONE way the poster illustrates the methods governments used to conduct the First World War.
      (c) Explain ONE way the method shown differed between Britain in 1915 and Britain or another belligerent later in the war.
    answer: |
      (a) That men who do not volunteer will be ashamed before their own children; it appeals to guilt, family honour and the fear of being asked the question after the war, implying that the war will be won and that not having served will be a lasting disgrace.
      (b) Governments mobilised whole populations through propaganda: the state used posters, the press and film to recruit, to sustain morale and to shame the unwilling, treating opinion as a resource of total war as much as munitions.
      (c) Britain relied on volunteers and persuasion in 1914–15 and introduced conscription in 1916 when volunteering fell short; France, Germany and Russia conscripted from the first day; by 1917–18 propaganda shifted from recruitment to sustaining morale, rationing and war loans, and the United States created a Committee on Public Information for the same purpose.
    explanation: |
      Three points, one per part.

      (a) 1 pt: an accurate description of the poster's appeal (shame, family, future judgment). Zero for a message not supported by the description (e.g. hatred of Germany, which the poster does not show).

      (b) 1 pt: the method named (propaganda or mobilisation of opinion) and explained as part of total war; credit also for the mobilisation of the family and home front.

      (c) 1 pt: a specific difference in method across time or country: conscription in 1916; continental conscription from 1914; the shift of propaganda's purpose; another country's agency. Zero for a vague statement that propaganda changed without a specific.

