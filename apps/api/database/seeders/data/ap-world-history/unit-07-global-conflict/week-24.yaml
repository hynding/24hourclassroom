      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify ONE new technology of the First World War.
        (b) Explain how that technology, or another, contributed to the stalemate and the scale of death on the Western Front.
        (c) Explain ONE way the war involved people outside Europe.
      answer: |
        (a) The machine gun; or quick-firing artillery; or poison gas; or the tank; or aircraft; or the submarine.
        (b) Machine guns and artillery gave the defence overwhelming firepower, so attacks across open ground failed at enormous cost; armies dug trenches from the Channel to Switzerland, and offensives such as the Somme (1916) gained a few miles for hundreds of thousands of casualties. Gas and new artillery techniques added to the toll without breaking the deadlock until tanks and combined tactics in 1918.
        (c) About 1.4 million Indians served in France, Mesopotamia and East Africa; France recruited hundreds of thousands of West and North Africans and Vietnamese workers; African carriers served in the East African campaign; Japan seized German Pacific islands and Shandong; the Ottoman fronts drew in Arabs and Armenians; Chinese labourers dug trenches in France.
      explanation: |
        Three points, one per part.

        (a) 1 pt: any technology new to or first used on a large scale in 1914–18. Zero for the rifle or the railway alone.

        (b) 1 pt: an explanation that links a technology to defensive advantage and attrition, not just a statement that many died. Mention of trenches, a named battle or casualty figures strengthens but is not required.

        (c) 1 pt: a specific non-European participation (colonial troops or labourers, African or Pacific campaigns, the Ottoman fronts, Japan, the United States from 1917).

    # ---- Long answer (LEQ)
    - slug: apworld-u07-w24-q25
      type: long_answer
      topic_code: "7.4"
      source: "general knowledge"
      points: 6
      prompt: |
        In the 1930s governments in the United States, Germany, Italy and the Soviet Union all responded to economic crisis by expanding the role of the state.

        Evaluate the extent to which the responses of different governments to the Great Depression were similar in the period 1929–1939.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (comparison, causation, or continuity and change).
      answer: |
        Thesis: Every major response expanded the state's direction of the economy, so the responses were similar in method, but they differed fundamentally in ownership and politics: the New Deal regulated a capitalist economy inside a democracy, fascist corporatism harnessed private industry to a dictatorship preparing for war, and the Soviet plans abolished private ownership altogether; the similarity was broad, the differences decisive.

        Context: the liberal world economy of gold, free trade and private finance built in the 1800s; the war's debts and reparations; the crash of 1929 and the collapse of trade and commodity prices.

        Body 1 (similarity): public works (CCC and TVA; autobahns; Magnitogorsk), state control of banking and currency, abandonment of gold and free trade, the retreat from laissez-faire everywhere; even Latin American governments turned to import-substitution.

        Body 2 (difference in ownership and politics): Roosevelt's regulation, Social Security and labour rights left industry private and elections intact; Mussolini and Hitler banned strikes and unions, kept Fiat and Krupp in private hands, and spent on rearmament; Stalin collectivised agriculture and ran industry by plan, at the cost of famine and the Gulag.

        Body 3 (difference in purpose): recovery and relief versus war preparation versus building socialism in one country; Japan's response, military expansion into Manchuria, shows the link between the Depression and aggression.

        Complexity: the similarities reflect a shared cause (the failure of the market) while the differences reflect pre-existing regimes; and the Depression's effects on colonial economies, which had no state of their own to respond, show the limits of the comparison.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim weighing similarity against difference with a line of reasoning. Zero for "they were similar and different" without weighting.

        Contextualization (0–1): the liberal world economy and gold standard; war debts and reparations; the 1929 crash and the collapse of trade and commodity prices.

        Evidence (0–2): 1 pt for at least two specific examples (New Deal programmes; corporatism, autobahns, rearmament; Five-Year Plans, collectivisation, famine; Smoot-Hawley; Britain leaving gold; import-substitution). 2 pts for using the evidence to support the weighting.

        Analysis and reasoning (0–2): 1 pt for comparison structuring the essay (methods, ownership, purpose). 1 pt for complexity: explaining why responses converged on the state while diverging in ownership; a case that complicates the pattern (Japan, Latin America, colonies); connecting the responses to the coming of war.
