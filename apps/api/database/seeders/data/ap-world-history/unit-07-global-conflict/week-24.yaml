      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Industrial production and unemployment, selected countries, 1932 (index of industrial production, 1929 = 100; unemployment as a share of the non-farm workforce, approximate)

        | Country | Industrial production, 1932 | Unemployment, 1932 |
        |---|---|---|
        | United States | 54 | about 25% |
        | Germany | 53 | about 30% |
        | France | 72 | about 15% |
        | United Kingdom | 84 | about 22% |
        | Japan | 98 | about 7% |
        | Soviet Union | about 180 | officially none |

        Note: the value of world trade fell by about two-thirds between 1929 and 1933. Prices of coffee, sugar, rubber, tin, wheat and cotton fell by half or more.
      prompt: |
        The note about commodity prices indicates that the Depression hit hardest which group of economies, shaped in the previous century?
      options:
        - "the industrial economies of western Europe"
        - "the self-sufficient peasant economies of inland Asia"
        - "the export economies of Latin America, Africa and Southeast Asia, built in the 1800s to supply raw materials to industrial countries"
        - "the city-states of the Mediterranean"
      option_explanations:
        - |
          Europe suffered, but a country selling one crop or mineral lost half its income at a stroke.
        - |
          Regions outside the world market, like the Soviet Union, were less exposed to the price collapse.
        - |
          Correct. Brazil's coffee, Chile's nitrates, Malaya's rubber, Gold Coast cocoa and Java's sugar were the monocultures of unit 6, and their collapse turned Latin America toward import-substitution.
        - |
          Mediterranean city-states had not been major economic actors since the 1600s.
      answer: 2
      explanation: |
        Spiral review of 6.4 (global economic development): the export monocultures of the imperial century were the Depression's most exposed victims.

    # ---- Stand-alone multiple choice
    - slug: apworld-u07-w24-q10
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best illustrates total war as practised in 1914–18?
      options:
        - "Governments conscripted men, rationed food, directed factories and railways, censored the press and recruited women into munitions work."
        - "Armies fought professional battles far from civilian life."
        - "Wars were decided by a single naval engagement."
        - "Monarchs settled disputes through dynastic marriage."
