        | Soviet Union | about 180 | officially none |

        Note: the value of world trade fell by about two-thirds between 1929 and 1933. Prices of coffee, sugar, rubber, tin, wheat and cotton fell by half or more.
      prompt: |
        The Soviet figure is best explained by
      options:
        - "the success of free-market reforms under Lenin"
        - "large loans from the United States"
        - "a boom in Soviet exports"
        - "the first Five-Year Plan (1928–32), which forced the building of heavy industry under state targets, at the cost of consumption and of the peasantry under collectivisation"
      option_explanations:
        - |
          Lenin's New Economic Policy of 1921 allowed some private trade, but Stalin ended it in 1928 and the growth came from command, not markets.
        - |
          The United States did not recognise the Soviet government until 1933 and lent it almost nothing.
        - |
          Soviet grain exports paid for some machinery, but exports fell in price like everyone else's; growth came from domestic forced investment.
        - |
          Correct. The plan tripled coal and steel targets and built Magnitogorsk and the Dnieper dam; the human cost included the famine of 1932–33.
      answer: 3
      explanation: |
        Skill: causation. The command economy was insulated from the market collapse but not from its own costs.

