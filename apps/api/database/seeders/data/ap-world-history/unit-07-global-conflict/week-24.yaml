week: 24
unit: 7
title: "Conducting World War I and the Interwar Economy"
topics: ["7.3", "7.4"]
guide: guides/week-24.md
guide_description: |
  How the First World War was fought and why it killed so many: total war, machine guns and artillery, gas, tanks,
  submarines, propaganda, colonial troops and labour, and American entry after the Zimmermann telegram. Then the
  interwar economy: reparations and the gold standard, the crash of 1929 and the spread of the Depression to export
  economies, and the three answers to it: the New Deal, fascist corporatism and the Soviet Five-Year Plans.
flashcards_description: |
  30 cards on total war and its technologies, the war outside Europe, the causes and spread of the Great
  Depression, and how liberal, fascist and communist states responded to it.

flashcards:
  - front: Total war → definition and three features in 1914–18
    back: |
      A war in which the whole economy and population are mobilised and civilians become both workers for the war and targets. Features: conscription of millions; state control of industry, railways and food (rationing); propaganda and censorship; women in munitions and transport; naval blockade and submarine warfare against civilian supply.
    topic_code: "7.3"
  - front: Why the Western Front became a stalemate → the technology explanation
    back: |
      Machine guns, magazine rifles, barbed wire and quick-firing artillery made defence far stronger than attack; railways brought reserves to any threatened point faster than attackers could advance on foot. Trenches from the Channel to Switzerland held from late 1914 to 1918 despite offensives costing hundreds of thousands.
    topic_code: "7.3"
  - front: New weapons of the First World War → six and their effects
    back: |
      Machine gun (made massed infantry attacks suicidal); heavy artillery (caused most deaths); poison gas (Ypres 1915; terror more than decisive); tanks (1916; broke wire but unreliable); aircraft (reconnaissance, then bombing); submarines (U-boats against merchant shipping, which brought in the United States).
    topic_code: "7.3"
  - front: Somme and Verdun (1916) → what the numbers show
    back: |
      Verdun: about 700,000 French and German casualties over ten months for no change in the line. The Somme: about 57,000 British casualties on the first day, over a million on all sides by November, for a few miles. Industrial firepower had turned battles into attrition.
    topic_code: "7.3"
  - front: War economies → how Germany and Britain mobilised industry
    back: |
      Germany's War Raw Materials Department under Walther Rathenau allocated materials and built substitutes; Britain's Ministry of Munitions (Lloyd George, 1915) took over factories and recruited women. Governments set prices, rationed food, borrowed and printed money. The state's reach grew permanently.
    topic_code: "7.3"
  - front: Women and the war → work and the vote
    back: |
      Millions of women took jobs in munitions, transport, farming and clerical work as men were conscripted. The experience strengthened the case for suffrage: women won the vote in Britain (1918, partial), Germany (1919) and the United States (1920). Most left industrial jobs when the men returned.
    topic_code: "7.3"
  - front: Propaganda in 1914–18 → purposes and methods
    back: |
      To recruit, sustain morale, sell war bonds and demonise the enemy. Posters, films, censored newspapers, atrocity stories; Britain's control of the transatlantic cables shaped American opinion. Wilfred Owen's "Dulce et Decorum Est" (1920) called the recruiting slogan "the old Lie".
    topic_code: "7.3"
  - front: Colonial troops and labour in the First World War → numbers to know
    back: |
      About 1.4 million Indians served (France, Mesopotamia, East Africa); France recruited several hundred thousand West and North Africans (tirailleurs sénégalais) and about 100,000 Vietnamese workers; around a million African carriers served in the East African campaign, perhaps 100,000 dying; some 140,000 Chinese labourers worked behind the Western Front.
    topic_code: "7.3"
  - front: The war outside Europe → four theatres
    back: |
      East Africa (Allied forces against German colonial troops until 1918); the Ottoman fronts (Gallipoli 1915, Mesopotamia, Palestine, the Arab Revolt from 1916); the Pacific and Shandong (Japan took German possessions in 1914); and the Atlantic (U-boats against shipping). A world war because the belligerents had world empires.
    topic_code: "7.3"
  - front: Gallipoli (1915) → what happened and why it matters
    back: |
      A British-led attempt, with Australian, New Zealand, Indian and French troops, to force the Dardanelles and knock the Ottomans out of the war. It failed with heavy losses on both sides. It made Mustafa Kemal's reputation and became a founding memory for Australia and New Zealand.
    topic_code: "7.3"
  - front: Unrestricted submarine warfare → dates and consequence
    back: |
      Germany declared the waters around Britain a war zone in 1915 (the Lusitania sank in May with 128 Americans), paused after U.S. protests, and resumed unrestricted attacks in February 1917 to starve Britain before America could matter. The gamble failed: the United States declared war in April 1917.
    topic_code: "7.3"
  - front: Zimmermann telegram (January 1917) → contents and effect
    back: |
      Germany's foreign secretary proposed that if the United States entered the war Mexico should "make war together, make peace together" with Germany and reconquer "lost territory in Texas, New Mexico, and Arizona". British intelligence intercepted it; its publication in March 1917 outraged American opinion.
    topic_code: "7.3"
  - front: Wilson's war message (2 April 1917) → the key sentence and its meaning
    back: |
      "The world must be made safe for democracy." Wilson framed American entry as a fight for political liberty and against autocracy rather than for territory ("We desire no conquest, no dominion"), which shaped the Fourteen Points and the liberal case for the League of Nations.
    topic_code: "7.3"
  - front: American contribution to victory → three forms
    back: |
      Loans and supplies to the Allies from 1914; the navy's convoys against U-boats from 1917; and about two million soldiers in France by late 1918, arriving as Germany's spring offensives exhausted its reserves. The armistice came on 11 November 1918.
    topic_code: "7.3"
  - front: Human cost of the First World War → figures to know
    back: |
      About 9–10 million soldiers killed and some 20 million wounded; several million civilians dead from blockade, famine and massacre (including the Armenian genocide); the influenza pandemic of 1918–19 killed perhaps 50 million worldwide, more than the war itself.
    topic_code: "7.3"
  - front: Keynes, The Economic Consequences of the Peace (1919) → argument
    back: |
      The British economist, who resigned from the peace delegation, argued that the reparations imposed on Germany were unpayable and would wreck the European economy on which all depended; he looked back on the integrated pre-war world in which a Londoner could order "the various products of the whole earth" by telephone. Public domain and quotable.
    topic_code: "7.4"
  - front: German hyperinflation (1923) → cause and effect
    back: |
      Reparations, the French occupation of the Ruhr and the government's printing of money to pay striking workers destroyed the mark; prices doubled in days and savings were wiped out. The middle class's ruin fed later support for extremist parties. The Dawes Plan (1924) stabilised the currency with American loans.
    topic_code: "7.4"
  - front: The circle of debt in the 1920s → how American loans held Europe up
    back: |
      American banks lent to Germany; Germany paid reparations to Britain and France; they repaid war debts to the United States. The whole arrangement depended on New York lending, so when American credit stopped in 1929 the circle broke and the Depression spread to Europe at once.
    topic_code: "7.4"
  - front: Gold standard between the wars → why it deepened the Depression
    back: |
      Countries on gold had to defend their currencies with high interest rates and spending cuts even as output fell, which deepened the slump; they could not expand money supply. Those that left gold early (Britain 1931) recovered sooner; those that stayed (France until 1936) suffered longer.
    topic_code: "7.4"
  - front: Causes of the Great Depression → five to combine
    back: |
      Overproduction in agriculture and industry; a speculative boom and the Wall Street crash (October 1929); the collapse of American lending and bank failures; the gold standard's deflationary pressure; and protectionism (Smoot-Hawley tariff 1930 and retaliation) that shrank world trade by about two-thirds in value by 1933.
    topic_code: "7.4"
  - front: Depression in export economies → Brazil, Chile, Java, West Africa
    back: |
      Commodity prices fell by half or more: Brazil burned coffee to prop up prices; Chile's nitrate exports collapsed and towns emptied; Javanese sugar and West African cocoa farmers could not pay taxes or debts. The export model of unit 6 was discredited and governments turned to state-led industrialization.
    topic_code: "7.4"
  - front: Import-substitution industrialization → definition and where it began
    back: |
      A policy of producing at home the manufactured goods previously imported, behind tariffs and with state support. Latin American states (Brazil under Vargas, Argentina, Mexico) adopted it in the 1930s as commodity exports collapsed; it became the dominant development strategy there until the 1980s.
    topic_code: "7.4"
  - front: The New Deal (1933–39) → aims and main measures
    back: |
      Franklin Roosevelt's programme of relief, recovery and reform within capitalism and democracy: bank regulation and deposit insurance, public works (Civilian Conservation Corps, Works Progress Administration, Tennessee Valley Authority), farm price supports, the Social Security Act (1935) and labour rights (Wagner Act). Recovery was partial until war spending.
    topic_code: "7.4"
  - front: Roosevelt's first inaugural (1933) → the famous line and its purpose
    back: |
      "The only thing we have to fear is fear itself." With banks closing across the country, Roosevelt sought to restore confidence and asked for broad executive power to act; within days he declared a bank holiday and began the Hundred Days of legislation.
    topic_code: "7.4"
  - front: Fascist corporatism → how Italy and Germany organised the economy
    back: |
      Private ownership kept, but the state directed the economy through corporations of employers and workers, banned independent unions and strikes, set wages, and spent on public works (autobahns) and rearmament. Aims: full employment, autarky (self-sufficiency) and readiness for war. Unemployment fell fast in Germany after 1933.
    topic_code: "7.4"
  - front: Five-Year Plans (from 1928) → goals and results
    back: |
      Stalin's command economy set targets for coal, steel, electricity and machinery, built new cities (Magnitogorsk) and abolished private industry. Heavy industrial output rose several-fold by 1940 at the cost of consumer goods, forced labour in the Gulag and a terror against "wreckers". The Soviet Union was largely untouched by the Depression.
    topic_code: "7.4"
  - front: Collectivisation (1929–33) → what it was and the famine
    back: |
      Peasants were forced into collective farms; those who resisted (labelled kulaks) were deported or shot; livestock was slaughtered rather than surrendered. Grain requisitions amid falling output caused famine in Ukraine, Kazakhstan and the Volga in 1932–33 that killed millions.
    topic_code: "7.4"
  - front: Japan's answer to the Depression → why Manchuria
    back: |
      The collapse of silk exports to the United States and rural distress discredited party government; army officers argued that Japan needed resources and markets it controlled. The Kwantung Army seized Manchuria in 1931 and Japan left the League in 1933: the Depression's political consequence in East Asia.
    topic_code: "7.4"
  - front: Comparison → New Deal vs corporatism vs Five-Year Plans
    back: |
      All expanded the state's role in the economy. The New Deal regulated and spent within capitalism and democracy; fascism kept private ownership but directed it toward autarky and war and crushed unions; the Soviet plan abolished private ownership and used terror. Results: partial recovery; rearmament boom; forced industrialization with famine.
    topic_code: "7.4"
  - front: The Depression's political legacy → three consequences
    back: |
      It discredited liberal free-trade capitalism and the gold standard; it strengthened extremist movements (Nazism's vote rose from 2.6% in 1928 to 37% in 1932); and it turned Japan, Germany and Italy toward conquest for resources, one of the causes of the Second World War (week 25).
    topic_code: "7.4"

quiz:
  description: |
    25 questions · about 35 minutes · topics 7.3 and 7.4 (conducting the First World War and the interwar
    economy), with about a third of the items reviewing the causes of the war and the revolutions of week 23 and
    the industrial economy and empires of units 5 and 6. Multiple choice, select-all and true/false items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Zimmermann telegram and Wilson (7.3)
    - slug: apworld-u07-w24-q01
      type: multiple_choice
      topic_code: "7.3"
      source: "Primary sources: Zimmermann telegram, decoded text (January 1917), U.S. National Archives; Woodrow Wilson, address to Congress, 2 April 1917 (U.S. government works)"
      points: 1
      stimulus: |
        Source 1: Germany's foreign secretary telegraphed its minister in Mexico in January 1917 that Germany would "begin on the first of February unrestricted submarine warfare", would try to keep the United States neutral, and if that failed would propose to Mexico an alliance to "make war together, make peace together, generous financial support", with Mexico to reconquer "lost territory in Texas, New Mexico, and Arizona". British intelligence intercepted and decoded it.

        Source 2: "The world must be made safe for democracy. Its peace must be planted upon the tested foundations of political liberty. We have no selfish ends to serve. We desire no conquest, no dominion." — President Woodrow Wilson, asking Congress to declare war on Germany, 2 April 1917
      prompt: |
        Taken together, the two sources best illustrate
      options:
        - "the causes of the outbreak of war in 1914"
        - "how German strategy (submarines and the Mexican proposal) brought the United States into the war, and how Wilson framed American entry in terms of democracy rather than territory"
        - "the terms of the Treaty of Versailles"
        - "the causes of the Russian Revolution"
      option_explanations:
        - |
          Both sources date from 1917, three years after the outbreak; they concern American entry.
        - |
          Correct. The telegram and unrestricted submarine warfare are the triggers; Wilson's speech is the justification, which later shaped the Fourteen Points.
        - |
          The Treaty of Versailles (1919) came two years after these sources and ended the war rather than widening it.
        - |
          The sources concern Germany, Mexico and the United States, not Russia.
      answer: 1
      explanation: |
        Skill: sourcing and making connections. Pair the provocation with the response and note the language of purpose.

    - slug: apworld-u07-w24-q02
      type: multiple_choice
      topic_code: "7.3"
      source: "Primary sources: Zimmermann telegram, decoded text (January 1917), U.S. National Archives; Woodrow Wilson, address to Congress, 2 April 1917 (U.S. government works)"
      points: 1
      stimulus: |
        Source 1: Germany's foreign secretary telegraphed its minister in Mexico in January 1917 that Germany would "begin on the first of February unrestricted submarine warfare", would try to keep the United States neutral, and if that failed would propose to Mexico an alliance to "make war together, make peace together, generous financial support", with Mexico to reconquer "lost territory in Texas, New Mexico, and Arizona". British intelligence intercepted and decoded it.

        Source 2: "The world must be made safe for democracy. Its peace must be planted upon the tested foundations of political liberty. We have no selfish ends to serve. We desire no conquest, no dominion." — President Woodrow Wilson, asking Congress to declare war on Germany, 2 April 1917
      prompt: |
        Germany's decision to resume unrestricted submarine warfare in February 1917 is best explained as
      options:
        - "a gamble that U-boats could starve Britain into surrender before American intervention could take effect, accepting the risk of U.S. entry"
        - "an attempt to win Mexican support without provoking the United States"
        - "a response to the Russian Revolution"
        - "a decision to end the war immediately"
      option_explanations:
        - |
          Correct. German planners calculated that Britain would be cut off within months; the calculation failed when convoys reduced losses and American troops arrived in 1918.
        - |
          The telegram itself admits that the policy might bring the United States in; Mexico was the fallback, not the aim.
        - |
          The decision was taken in January 1917, before the February Revolution.
        - |
          It was a bid to win, not to end, the war.
      answer: 0
      explanation: |
        Skill: causation. Total war at sea: the decision shows how blockade and counter-blockade targeted whole populations.

    - slug: apworld-u07-w24-q03
      type: multiple_choice
      topic_code: "6.5"
      source: "Primary sources: Zimmermann telegram, decoded text (January 1917), U.S. National Archives; Woodrow Wilson, address to Congress, 2 April 1917 (U.S. government works)"
      points: 1
      stimulus: |
        Source 1: Germany's foreign secretary telegraphed its minister in Mexico in January 1917 that Germany would "begin on the first of February unrestricted submarine warfare", would try to keep the United States neutral, and if that failed would propose to Mexico an alliance to "make war together, make peace together, generous financial support", with Mexico to reconquer "lost territory in Texas, New Mexico, and Arizona". British intelligence intercepted and decoded it.

        Source 2: "The world must be made safe for democracy. Its peace must be planted upon the tested foundations of political liberty. We have no selfish ends to serve. We desire no conquest, no dominion." — President Woodrow Wilson, asking Congress to declare war on Germany, 2 April 1917
      prompt: |
        Germany's choice of Mexico as a potential ally reflected which situation in 1917?
      options:
        - "Mexico's membership in the Triple Alliance"
        - "Mexican resentment of U.S. interventions during its revolution (Veracruz 1914, the Pershing expedition 1916–17) and of U.S. economic domination"
        - "Mexico's possession of a large navy"
        - "Mexico's alliance with Japan"
      option_explanations:
        - |
          Mexico belonged to no European alliance.
        - |
          Correct. Germany hoped the grievances created by U.S. economic imperialism and armed intervention would make Mexico a willing partner; Carranza declined.
        - |
          Mexico had no navy capable of affecting the war.
        - |
          The telegram suggested Mexico approach Japan, but no such alliance existed.
      answer: 1
      explanation: |
        Spiral review of 6.5 (economic imperialism and the Roosevelt Corollary) explaining why Germany thought Mexico might fight the United States.

    # ---- Stimulus set B: Owen, "Dulce et Decorum Est"
    - slug: apworld-u07-w24-q04
      type: multiple_choice
      topic_code: "7.3"
      source: "Primary source: Wilfred Owen, Dulce et Decorum Est, in Poems (1920; 1921 reprint), Project Gutenberg #1034"
      points: 1
      stimulus: |
        "If in some smothering dreams, you too could pace
        Behind the wagon that we flung him in, [...]
        My friend, you would not tell with such high zest
        To children ardent for some desperate glory,
        The old Lie: Dulce et decorum est
        Pro patria mori."

        — Wilfred Owen, a British officer killed in November 1918, describing a soldier dying after a gas attack; the Latin tag means "it is sweet and fitting to die for one's country". The poem was published in 1920.
      prompt: |
        The "old Lie" that Owen attacks is best understood as an answer to
      options:
        - "the recruiting posters, school lessons and patriotic rhetoric with which governments mobilised young men for a war of mass armies"
        - "the Bolshevik slogan of peace, land and bread"
        - "the pacifism of the Quakers"
        - "the economic arguments of free traders"
      option_explanations:
        - |
          Correct. Total war required consent; the state and the press sold the war as glorious, and Owen's poem is the soldier's reply from the trenches.
        - |
          The Bolsheviks opposed the war; Owen's target is those who glorified it.
        - |
          Pacifists shared Owen's horror; the poem is aimed at the war's cheerleaders.
        - |
          The poem concerns sacrifice and glory, not trade policy.
      answer: 0
      explanation: |
        Skill: sourcing (audience and purpose). Owen addresses the civilian who repeats the patriotic tag to children.

    - slug: apworld-u07-w24-q05
      type: multiple_choice
      topic_code: "7.3"
      source: "Primary source: Wilfred Owen, Dulce et Decorum Est, in Poems (1920; 1921 reprint), Project Gutenberg #1034"
      points: 1
      stimulus: |
        "If in some smothering dreams, you too could pace
        Behind the wagon that we flung him in, [...]
        My friend, you would not tell with such high zest
        To children ardent for some desperate glory,
        The old Lie: Dulce et decorum est
        Pro patria mori."

        — Wilfred Owen, a British officer killed in November 1918, describing a soldier dying after a gas attack; the Latin tag means "it is sweet and fitting to die for one's country". The poem was published in 1920.
      prompt: |
        The death the poem describes resulted from which feature of the First World War?
      options:
        - "naval blockade"
        - "aerial bombing of cities"
        - "cavalry charges"
        - "the use of new industrial weapons, in this case poison gas, which turned the war into one of mass killing at a distance"
      option_explanations:
        - |
          Blockade starved populations, but the poem describes a gas attack on soldiers.
        - |
          Bombing of cities began in the war, but the scene is a march behind the front.
        - |
          Cavalry was almost useless on the Western Front; the poem's soldiers are on foot.
        - |
          Correct. Chlorine, phosgene and mustard gas, first used in 1915, were among the technologies (with machine guns, artillery, tanks and aircraft) that made the war so deadly.
      answer: 3
      explanation: |
        Skill: developments and processes. Match the technology to its effect: gas, the weapon the poem turns on the reader.

    - slug: apworld-u07-w24-q06
      type: multiple_choice
      topic_code: "5.5"
      source: "Primary source: Wilfred Owen, Dulce et Decorum Est, in Poems (1920; 1921 reprint), Project Gutenberg #1034"
      points: 1
      stimulus: |
        "If in some smothering dreams, you too could pace
        Behind the wagon that we flung him in, [...]
        My friend, you would not tell with such high zest
        To children ardent for some desperate glory,
        The old Lie: Dulce et decorum est
        Pro patria mori."

        — Wilfred Owen, a British officer killed in November 1918, describing a soldier dying after a gas attack; the Latin tag means "it is sweet and fitting to die for one's country". The poem was published in 1920.
      prompt: |
        The weapons that produced the scene Owen describes were most directly products of which earlier development?
      options:
        - "the agricultural revolution of the 1700s"
        - "the maritime technologies of the 1400s"
        - "the second industrial revolution of the late 1800s, especially the chemical and steel industries"
        - "the printing press"
      option_explanations:
        - |
          Farming changes fed growing populations but produced no weapons.
        - |
          Compasses and caravels belong to unit 4, four centuries earlier.
        - |
          Correct. Germany's chemical industry made the gas, Krupp and Vickers the steel guns, and mass production the shells; the war was the industrial age turned to killing.
        - |
          Printing spread propaganda, not poison gas.
      answer: 2
      explanation: |
        Spiral review of 5.5 (technology of the industrial age): the war's weapons came from the industries unit 5 described.

    # ---- Stimulus set C: Depression data table
    - slug: apworld-u07-w24-q07
      type: multiple_choice
      topic_code: "7.4"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Industrial production and unemployment, selected countries, 1932 (index of industrial production, 1929 = 100; unemployment as a share of the non-farm workforce, approximate)

        | Country | Industrial production, 1932 | Unemployment, 1932 |
        |---|---|---|
        | United States | 54 | about 25% |
        | Germany | 53 | about 30% |
        | France | 72 | about 15% |
        | United Kingdom | 84 | about 22% |
        | Japan | 98 | about 7% |
        | Soviet Union | about 180 | officially none |

        Note: the value of world trade fell by about two-thirds between 1929 and 1933. Prices of coffee, sugar, rubber, tin, wheat and cotton fell by half or more.
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "The Depression affected every economy equally."
        - "The United States and Germany, the two economies most tied together by American loans, suffered the deepest industrial collapse, while the Soviet Union, outside the world market, grew."
        - "Japan suffered the worst unemployment."
        - "France recovered faster than any other country."
      option_explanations:
        - |
          The figures range from 53 to 180; the effects were very unequal.
        - |
          Correct. The Dawes Plan circle of American loans and German reparations broke first; the planned Soviet economy, cut off from world trade, reported rapid growth.
        - |
          Japan's unemployment of about 7% was the lowest in the table.
        - |
          France's figure of 72 is a decline; the table gives no recovery data, and France in fact stayed depressed longest because it clung to gold.
      answer: 1
      explanation: |
        Skill: data analysis. Read the index against 100 and link the pattern to the mechanism of spread (loans, trade).

