    prompt: |
      The Congo's difficulties at independence can be traced to the character of Belgian rule since the 1880s, when
    options:
      - "Belgium had governed the Congo as a model democracy"
      - "the Congo had been an independent kingdom allied to Belgium"
      - "the Congo had been Leopold II's personal possession and then a colony run for rubber and copper with forced labour and almost no education for Congolese beyond primary school"
      - "the Congo had been part of the Ottoman Empire"
    option_explanations:
      - |
        Belgium allowed no Congolese political participation until the final months.
      - |
        The Congo Free State was Leopold's property, recognised at Berlin in 1885, not an ally.
      - |
