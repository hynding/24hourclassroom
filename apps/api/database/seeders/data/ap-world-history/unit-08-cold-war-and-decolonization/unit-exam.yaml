      | State | Independent from | Year | Path | Cold War involvement after independence |
      |---|---|---|---|---|
      | India | Britain | 1947 | negotiated | non-aligned; aid from both blocs |
      | Vietnam | France | 1954 / 1975 | armed | American war 1965–73; Soviet and Chinese aid to the North |
      | Egypt | Britain (formal 1922; full 1956) | 1956 | revolution and Suez | Soviet aid for Aswan; switch to U.S. alignment 1970s |
