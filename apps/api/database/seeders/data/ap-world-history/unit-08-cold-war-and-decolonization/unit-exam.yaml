unit: 8
description: |
  45 questions · about 75 minutes · every topic of unit 8 (8.1 to 8.9) with review of units 6 and 7. Four
  source-based multiple-choice sets in the AP style (the Truman Doctrine against Kennedy's inaugural,
  Eisenhower's domino principle, the Carter Doctrine and Reagan at the Brandenburg Gate, and a table of
  decolonization and proxy wars), stand-alone multiple choice, select-all, true/false and fill-in-the-blank
  items, two short-answer questions (3 points each), one on a described photograph, and one long essay
  question (6 points) on causation. Multiple choice, select-all and true/false items are graded at once;
  fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher
  against the scoring notes.
questions:
  # ---- Stimulus set A: Truman (1947) and Kennedy (1961) (8.2, 8.3, 7.6)
  - slug: apworld-u08-exam-q01
    type: multiple_choice
    topic_code: "8.2"
    source: "Primary sources: Harry S. Truman, address to Congress, 12 March 1947 (Avalon Project); John F. Kennedy, inaugural address, 20 January 1961 (U.S. National Archives); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures." — President Harry S. Truman, asking Congress for aid to Greece and Turkey, 12 March 1947

      Source 2: "Let every nation know, whether it wishes us well or ill, that we shall pay any price, bear any burden, meet any hardship, support any friend, oppose any foe to assure the survival and the success of liberty." — President John F. Kennedy, inaugural address, 20 January 1961
    prompt: |
      Taken together, the two sources illustrate
    options:
      - "American support for the Non-Aligned Movement"
      - "the end of the Cold War"
      - "the retreat of the United States from world affairs"
      - "the continuity and expansion of containment from a regional aid pledge in 1947 to a global and unlimited commitment by 1961"
    option_explanations:
      - |
        Neither speech concerns non-alignment, which both presidents regarded with suspicion.
      - |
        The Cold War ran for thirty more years after Kennedy spoke.
      - |
        Both are commitments to act abroad; the trend is toward more, not less.
      - |
        Correct. Truman asked for 400 million dollars for two countries; Kennedy promised any price anywhere; Vietnam tested the promise.
    answer: 3
    explanation: |
      Skill: continuity and change across sources. Containment's scope grew with each decade.

  - slug: apworld-u08-exam-q02
    type: multiple_choice
    topic_code: "8.2"
    source: "Primary sources: Harry S. Truman, address to Congress, 12 March 1947 (Avalon Project); John F. Kennedy, inaugural address, 20 January 1961 (U.S. National Archives); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures." — President Harry S. Truman, asking Congress for aid to Greece and Turkey, 12 March 1947

      Source 2: "Let every nation know, whether it wishes us well or ill, that we shall pay any price, bear any burden, meet any hardship, support any friend, oppose any foe to assure the survival and the success of liberty." — President John F. Kennedy, inaugural address, 20 January 1961
    prompt: |
      Which action of 1947–49 most directly carried out the policy announced in Source 1?
    options:
      - "the Marshall Plan and the founding of NATO, which committed American money and then American arms to the defence of western Europe"
      - "the Nazi-Soviet Pact"
      - "the Bay of Pigs invasion"
      - "the invasion of Afghanistan"
    option_explanations:
      - |
        Correct. The doctrine's logic produced the European Recovery Program in 1948 and the Atlantic alliance in 1949.
      - |
        The Nazi-Soviet Pact was signed in 1939 between Germany and the Soviet Union.
      - |
        The Bay of Pigs invasion of April 1961 came under Kennedy, fourteen years after the speech.
      - |
        Afghanistan was invaded by the Soviet Union in 1979.
    answer: 0
    explanation: |
      Skill: causation. From doctrine to institutions in two years.

  - slug: apworld-u08-exam-q03
    type: multiple_choice
    topic_code: "8.3"
    source: "Primary sources: Harry S. Truman, address to Congress, 12 March 1947 (Avalon Project); John F. Kennedy, inaugural address, 20 January 1961 (U.S. National Archives); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures." — President Harry S. Truman, asking Congress for aid to Greece and Turkey, 12 March 1947

      Source 2: "Let every nation know, whether it wishes us well or ill, that we shall pay any price, bear any burden, meet any hardship, support any friend, oppose any foe to assure the survival and the success of liberty." — President John F. Kennedy, inaugural address, 20 January 1961
    prompt: |
      The commitment in Source 2 had which consequence in Southeast Asia?
    options:
      - "the immediate withdrawal of all American advisers from Vietnam"
      - "the escalation of American involvement in Vietnam from advisers under Kennedy to over 500,000 combat troops under Johnson, a proxy war that cost two to three million lives"
      - "the establishment of SEATO in 1954"
      - "the Geneva accords"
    option_explanations:
      - |
        Kennedy increased advisers from under a thousand to 16,000.
      - |
        Correct. The any-price logic led through the Gulf of Tonkin (1964) to the war Nixon inherited.
      - |
        SEATO was founded under Eisenhower, seven years before the speech.
      - |
        The Geneva accords of 1954 preceded the speech and were what the United States declined to enforce.
    answer: 1
    explanation: |
      Skill: causation (effects). The rhetoric of 1961 and the war of 1965–73.

  - slug: apworld-u08-exam-q04
    type: multiple_choice
    topic_code: "7.6"
    source: "Primary sources: Harry S. Truman, address to Congress, 12 March 1947 (Avalon Project); John F. Kennedy, inaugural address, 20 January 1961 (U.S. National Archives); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures." — President Harry S. Truman, asking Congress for aid to Greece and Turkey, 12 March 1947

      Source 2: "Let every nation know, whether it wishes us well or ill, that we shall pay any price, bear any burden, meet any hardship, support any friend, oppose any foe to assure the survival and the success of liberty." — President John F. Kennedy, inaugural address, 20 January 1961
    prompt: |
      Both presidents' insistence on resisting pressure wherever it appeared reflected the lesson their generation drew from
    options:
      - "the Congress of Vienna"
      - "the Opium Wars"
      - "the appeasement of Hitler at Munich in 1938, which seemed to prove that conceding to an expansionist power only invited further aggression"
      - "the Monroe Doctrine"
    option_explanations:
      - |
        Vienna (1815) was a model of great-power concert, not of resistance.
      - |
        The Opium Wars were nineteenth-century imperial wars in China.
      - |
        Correct. The Munich analogy ran through containment from Greece to Vietnam; both men had served in the war that followed appeasement.
      - |
        The Monroe Doctrine (1823) concerned the Americas and did not involve resisting expansion by a rival ideology.
    answer: 2
    explanation: |
      Spiral review of 7.6 (causes of the Second World War): the memory that shaped the Cold War.

  # ---- Stimulus set B: Eisenhower's domino principle (8.4, 8.5, 8.2)
  - slug: apworld-u08-exam-q05
    type: multiple_choice
    topic_code: "8.4"
    source: "Primary source: Dwight D. Eisenhower, press conference, 7 April 1954 (American Presidency Project); U.S. government work"
    points: 1
    stimulus: |
      "You have broader considerations that might follow what you would call the 'falling domino' principle. You have a row of dominoes set up, you knock over the first one, and what will happen to the last one is the certainty that it will go over very quickly."

      — President Dwight D. Eisenhower, answering a question about the importance of Indochina, press conference, 7 April 1954
    prompt: |
      The assumption behind the statement is that
    options:
      - "France would win the war in Indochina"
      - "Asian states would join the Non-Aligned Movement"
      - "communist movements in Asia were independent of one another and locally caused"
      - "the fall of one state to communism would cause its neighbours to fall in turn, because communism spread by contagion directed from outside rather than by local conditions"
    option_explanations:
      - |
        The statement was made as France was losing at Dien Bien Phu and looked for a reason to care about the outcome.
      - |
        Non-alignment was precisely what the domino theory feared would be impossible.
      - |
        That is the view the metaphor denies; the Sino-Soviet split and Vietnam's war with China (1979) later supported it.
      - |
        Correct. The theory treated nationalism and land hunger as secondary to Soviet or Chinese direction, a reading historians now question.
    answer: 3
    explanation: |
      Skill: sourcing (assumptions). Identify what a metaphor takes for granted.

  - slug: apworld-u08-exam-q06
    type: multiple_choice
    topic_code: "8.5"
    source: "Primary source: Dwight D. Eisenhower, press conference, 7 April 1954 (American Presidency Project); U.S. government work"
    points: 1
    stimulus: |
      "You have broader considerations that might follow what you would call the 'falling domino' principle. You have a row of dominoes set up, you knock over the first one, and what will happen to the last one is the certainty that it will go over very quickly."

      — President Dwight D. Eisenhower, answering a question about the importance of Indochina, press conference, 7 April 1954
    prompt: |
      The war in Indochina that prompted the statement was
    options:
      - "a war between France and the Viet Minh for Vietnam's independence, which France lost at Dien Bien Phu a month later, leading to the division of Vietnam at Geneva"
      - "a civil war within France"
      - "a war between Japan and the United States"
      - "a border war between India and China"
    option_explanations:
      - |
        Correct. The anti-colonial war of 1946–54 became a Cold War proxy war because Ho Chi Minh was a communist and the United States paid most of France's costs.
      - |
        The war was fought in Vietnam, not France, though it divided French opinion.
      - |
        The war between Japan and the United States had ended with Japan's surrender in 1945.
      - |
        The border war between India and China was fought in 1962, eight years later and far from Indochina.
    answer: 0
    explanation: |
      Skill: developments and processes. Decolonization and the Cold War in one war.

  - slug: apworld-u08-exam-q07
    type: multiple_choice
    topic_code: "8.2"
    source: "Primary source: Dwight D. Eisenhower, press conference, 7 April 1954 (American Presidency Project); U.S. government work"
    points: 1
    stimulus: |
      "You have broader considerations that might follow what you would call the 'falling domino' principle. You have a row of dominoes set up, you knock over the first one, and what will happen to the last one is the certainty that it will go over very quickly."

      — President Dwight D. Eisenhower, answering a question about the importance of Indochina, press conference, 7 April 1954
    prompt: |
      The same reasoning had already been applied in which Cold War decision?
    options:
      - "the decision to recognise the People's Republic of China"
      - "the dissolution of NATO"
      - "the intervention in Korea in 1950, undertaken to stop a communist advance that was assumed would otherwise spread to Japan and Southeast Asia"
      - "the withdrawal of American troops from Europe"
    option_explanations:
      - |
        The United States did not recognise Beijing until 1979.
      - |
        NATO was never dissolved; it outlived the Cold War.
      - |
        Correct. Korea was the first application of containment by force in Asia; the dominoes were already falling in American eyes.
      - |
        American troops stayed in Europe throughout the Cold War; no withdrawal was decided in 1954.
    answer: 2
    explanation: |
      Skill: comparison. The logic of containment applied before and after 1954.

  # ---- Stimulus set C: Carter (1980) and Reagan (1987) (8.7, 8.8, 8.3)
  - slug: apworld-u08-exam-q08
    type: multiple_choice
    topic_code: "8.7"
    source: "Primary sources: Jimmy Carter, State of the Union address, 23 January 1980 (American Presidency Project); Ronald Reagan, address at the Brandenburg Gate, 12 June 1987 (Reagan Library); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "An attempt by any outside force to gain control of the Persian Gulf region will be regarded as an assault on the vital interests of the United States of America, and such an assault will be repelled by any means necessary, including military force." — President Jimmy Carter, State of the Union address, 23 January 1980

      Source 2: "Mr. Gorbachev, open this gate! Mr. Gorbachev, tear down this wall!" — President Ronald Reagan, at the Brandenburg Gate, West Berlin, 12 June 1987
    prompt: |
      Source 1 was a response to two events of 1979. One was the Soviet invasion of Afghanistan; the other was
    options:
      - "the Iranian Revolution, which replaced an American-backed monarchy with an Islamic Republic hostile to the United States and held American diplomats hostage"
      - "the founding of OPEC"
      - "the Suez crisis"
      - "the Cuban Revolution"
    option_explanations:
      - |
        Correct. The loss of the Shah and the hostage crisis made the Gulf's security the doctrine's subject.
      - |
        OPEC was founded in 1960, nineteen years before the events the doctrine answers.
      - |
        The Suez crisis took place in 1956, under Eisenhower, and concerned Egypt.
      - |
        Cuba's revolution was 1959 and concerned the Caribbean.
    answer: 0
    explanation: |
      Skill: sourcing (context). Two shocks of one winter produced the doctrine.

  - slug: apworld-u08-exam-q09
    type: multiple_choice
    topic_code: "8.8"
    source: "Primary sources: Jimmy Carter, State of the Union address, 23 January 1980 (American Presidency Project); Ronald Reagan, address at the Brandenburg Gate, 12 June 1987 (Reagan Library); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "An attempt by any outside force to gain control of the Persian Gulf region will be regarded as an assault on the vital interests of the United States of America, and such an assault will be repelled by any means necessary, including military force." — President Jimmy Carter, State of the Union address, 23 January 1980

      Source 2: "Mr. Gorbachev, open this gate! Mr. Gorbachev, tear down this wall!" — President Ronald Reagan, at the Brandenburg Gate, West Berlin, 12 June 1987
    prompt: |
      Between the two sources, Soviet policy changed in that
    options:
      - "the Soviet Union joined NATO"
      - "Stalin returned to power"
      - "the Soviet Union invaded western Europe"
      - "Gorbachev, in power from 1985, began reforms at home, negotiated arms reductions with Reagan and prepared to withdraw from Afghanistan, so that Reagan could address him as a leader who might act"
    option_explanations:
      - |
        Russia joined NATO's Partnership for Peace only in 1994, long after the Soviet Union ended.
      - |
        Stalin died in 1953; no return was possible, and Gorbachev repudiated his legacy.
      - |
        No such invasion occurred; the Soviet Union was retreating from confrontation by 1987.
      - |
        Correct. The INF Treaty was signed six months after the speech; the wall fell two and a half years after it.
    answer: 3
    explanation: |
      Skill: continuity and change. The seven years between the sources contain the turn toward the Cold War's end.

  - slug: apworld-u08-exam-q10
    type: multiple_choice
    topic_code: "8.3"
    source: "Primary sources: Jimmy Carter, State of the Union address, 23 January 1980 (American Presidency Project); Ronald Reagan, address at the Brandenburg Gate, 12 June 1987 (Reagan Library); U.S. government works"
    points: 1
    stimulus: |
      Source 1: "An attempt by any outside force to gain control of the Persian Gulf region will be regarded as an assault on the vital interests of the United States of America, and such an assault will be repelled by any means necessary, including military force." — President Jimmy Carter, State of the Union address, 23 January 1980

      Source 2: "Mr. Gorbachev, open this gate! Mr. Gorbachev, tear down this wall!" — President Ronald Reagan, at the Brandenburg Gate, West Berlin, 12 June 1987
    prompt: |
      Both sources show the Cold War's effect of
    options:
      - "ending American involvement overseas"
      - "extending American military and political commitments across the globe, from the Persian Gulf to a divided German city, as a permanent feature of the superpower rivalry"
      - "transferring power to the United Nations"
      - "restoring the European empires"
    option_explanations:
      - |
        Both are commitments to act, in the Gulf and in Berlin.
      - |
        Correct. The ring of alliances and doctrines was the Cold War's lasting effect on American power.
      - |
        Neither source mentions the UN; both are unilateral statements.
      - |
        Decolonization was complete by 1980; the empires were gone.
    answer: 1
    explanation: |
      Skill: causation (effects). The global reach of the Cold War state.

  # ---- Stimulus set D: decolonization and proxy wars table (8.5, 8.3, 6.2)
  - slug: apworld-u08-exam-q11
    type: multiple_choice
    topic_code: "8.5"
    source: "Table compiled for this course"
    points: 1
    stimulus: |
      Independence and Cold War involvement in selected states, 1947–1991

      | State | Independent from | Year | Path | Cold War involvement after independence |
      |---|---|---|---|---|
      | India | Britain | 1947 | negotiated | non-aligned; aid from both blocs |
      | Vietnam | France | 1954 / 1975 | armed | American war 1965–73; Soviet and Chinese aid to the North |
      | Egypt | Britain (formal 1922; full 1956) | 1956 | revolution and Suez | Soviet aid for Aswan; switch to U.S. alignment 1970s |
      | Ghana | Britain | 1957 | negotiated | non-aligned; coup 1966 |
      | Congo | Belgium | 1960 | negotiated, then collapse | UN force; CIA and Belgian role in Lumumba's death; Mobutu backed by the West |
      | Algeria | France | 1962 | armed | non-aligned; Soviet arms |
      | Angola | Portugal | 1975 | armed | civil war with Cuban, Soviet, South African and American involvement to 1991 |
      | Afghanistan | (never a colony) | — | — | Soviet invasion 1979–89; U.S. aid to mujahideen |
    prompt: |
      Which conclusion is best supported by the table?
    options:
      - "The Cold War caused decolonization."
      - "Newly independent states escaped the Cold War entirely."
      - "The Cold War shaped the aftermath of independence in most cases, through aid, intervention or proxy war, whether independence had been negotiated or won by arms."
      - "Only former French colonies experienced Cold War intervention."
    option_explanations:
      - |
        The paths and dates reflect nationalism and imperial decisions; the Cold War column describes what came after.
      - |
        Every row shows involvement, from aid to invasion.
      - |
        Correct. Negotiated India and Ghana and armed Vietnam and Angola all appear in the last column; the Cold War cut across the distinction.
      - |
        British, Belgian and Portuguese former colonies appear with heavy involvement.
    answer: 2
    explanation: |
      Skill: data analysis. Separate the causes of independence from the Cold War's effects on its aftermath.

