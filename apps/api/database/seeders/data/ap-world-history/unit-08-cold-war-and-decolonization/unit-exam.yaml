  # ---- Long answer (LEQ)
  - slug: apworld-u08-exam-q45
    type: long_answer
    topic_code: "8.9"
    source: "general knowledge"
    points: 6
    prompt: |
      Between 1945 and 1991 the Cold War divided the world while decolonization created some one hundred new states.

      Evaluate the extent to which the Cold War shaped the process of decolonization and the development of newly independent states in the period 1945–1991.

      In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
    answer: |
      Thesis: The Cold War did not cause decolonization, whose roots lay in nationalism, the Second World War and imperial exhaustion, but it shaped the process and above all the aftermath to a great extent: it gave nationalists patrons and weapons, turned several independence struggles into proxy wars, led both superpowers to overthrow or sustain governments in new states, and gave the Non-Aligned Movement its leverage; the extent was greatest in strategic regions and least where neither superpower saw a stake.

      Context: the interwar nationalist movements; the war's destruction of European power and prestige; the Atlantic Charter and the UN; the two anti-colonial superpowers.

      Body 1 (process): Vietnam, where an anti-colonial war became a Cold War war; Indonesia, where American pressure forced Dutch withdrawal; Suez, where both superpowers ended the Anglo-French invasion; Angola and Mozambique, where Cold War patrons armed rival movements.

      Body 2 (aftermath): Iran 1953; Guatemala 1954; the Congo 1960–65; Cuba; Chile 1973; Afghanistan; Soviet aid for Aswan and Indian steel; American aid and military alliances (SEATO, CENTO).

      Body 3 (limits): Ghana and French West Africa, where independence and the first decades owed little to the Cold War; India's non-alignment as agency, not passivity; internal factors (borders, export economies, ethnicity) shaping the new states regardless of the superpowers.

      Complexity: the Cold War's end accelerated apartheid's fall and ended proxy wars in Angola and Central America, showing its weight by subtraction; nationalism used the Cold War as much as it was used by it; comparison with the League era, when no superpower rivalry existed and the empires grew.
    explanation: |
      Scored on the six-point LEQ rubric.

      Thesis/claim (0–1): a defensible claim about extent with a line of reasoning that distinguishes cause from shaping. Zero for "the Cold War affected decolonization in many ways".

      Contextualization (0–1): interwar nationalism; the Second World War; the Atlantic Charter and UN; the superpowers' anti-colonialism.

      Evidence (0–2): 1 pt for at least two specific examples (Dien Bien Phu and the domino principle; Suez; Lumumba; Bandung; Cuba; Angola; Iran 1953; Ghana as a counter-case). 2 pts for using them to support the weighting.

      Analysis and reasoning (0–2): 1 pt for causation structuring the essay (causes of independence versus Cold War shaping; regional variation). 1 pt for complexity: cases with little Cold War role; the agency of new states; the effect of the Cold War's end.
