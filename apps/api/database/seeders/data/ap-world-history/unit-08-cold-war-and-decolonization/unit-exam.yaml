      - |
        The Ottoman Empire never ruled in central Africa; its African territories were on the Mediterranean.
    answer: 2
    explanation: |
      Spiral review of 6.2 (state expansion): the colonial inheritance behind a decolonization failure.

  # ---- Stand-alone multiple choice (8.1–8.9 and review)
  - slug: apworld-u08-exam-q14
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The Bretton Woods conference of 1944 created
    options:
      - "the League of Nations"
      - "the European Union"
      - "NATO and the Warsaw Pact"
      - "the International Monetary Fund and the World Bank, with currencies fixed to the dollar and the dollar to gold, to prevent a repeat of the 1930s"
    option_explanations:
      - |
        The League dated from 1920 and was being replaced by the UN.
      - |
        European integration began with the Coal and Steel Community in 1951.
      - |
        The military alliances came in 1949 and 1955.
      - |
        Correct. The postwar economic order was built against the Depression's competitive devaluations and tariff wars.
    answer: 3
    explanation: |
      Skill: developments and processes. The economic institutions of 8.1.

  - slug: apworld-u08-exam-q15
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which best describes the position of the Soviet Union in 1945?
    options:
      - "untouched by the war and economically dominant"
      - "a defeated power under Allied occupation"
      - "devastated, with about 27 million dead, but holding the largest army in the world across eastern Europe and determined to keep a security zone there"
      - "a member of NATO"
    option_explanations:
      - |
        The Soviet Union had lost a quarter of its wealth and a seventh of its people.
      - |
        The Soviet Union was a victor, occupying others.
      - |
        Correct. Weakness and strength together explain Stalin's insistence on Poland and the buffer states.
      - |
        NATO was formed against the Soviet Union in 1949.
    answer: 2
    explanation: |
      Skill: contextualization. The paradox of Soviet power in 1945 is the root of the Cold War.

  - slug: apworld-u08-exam-q16
    type: multiple_choice
    topic_code: "8.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The Berlin blockade of 1948–49 ended with
    options:
      - "the Western withdrawal from Berlin"
      - "a Soviet invasion of West Germany"
      - "the building of the Berlin Wall"
      - "the Allied airlift supplying West Berlin for eleven months until Stalin lifted the blockade, followed by the founding of two German states and NATO"
    option_explanations:
      - |
        The West held the city; that was the point of the airlift.
      - |
        No invasion occurred; the Soviet Union avoided direct conflict.
      - |
        The Berlin Wall was built twelve years later, in August 1961, to stop emigration.
      - |
        Correct. The crisis hardened the division of Germany and Europe.
    answer: 3
    explanation: |
      Skill: developments and processes. The first Berlin crisis.

  - slug: apworld-u08-exam-q17
    type: multiple_choice
    topic_code: "8.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The Cuban missile crisis of 1962 was resolved when
    options:
      - "Khrushchev withdrew the missiles in exchange for an American pledge not to invade Cuba and a secret promise to remove U.S. missiles from Turkey"
      - "the United States invaded Cuba"
      - "the United Nations occupied Cuba"
      - "Castro was overthrown"
    option_explanations:
      - |
        Correct. The settlement led to the hotline and the Partial Test Ban Treaty of 1963; both leaders had looked at nuclear war and stepped back.
      - |
        The planned invasion of Cuba was never launched; the quarantine and negotiation replaced it.
      - |
        The United Nations mediated through its secretary-general but sent no force to Cuba.
      - |
        Castro remained in power until 2008; the settlement in fact guaranteed his survival.
    answer: 0
    explanation: |
      Skill: developments and processes. The closest approach to nuclear war.

  - slug: apworld-u08-exam-q18
    type: multiple_choice
    topic_code: "8.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following was a domestic effect of the Cold War in the United States?
    options:
      - "the abolition of the army"
      - "McCarthyism, loyalty investigations and the growth of a national security state alongside federal funding of science and universities"
      - "the adoption of a planned economy"
      - "the end of elections"
    option_explanations:
      - |
        The armed forces became permanent and large for the first time in peacetime.
      - |
        Correct. The Cold War reshaped American politics, universities and civil liberties.
      - |
        The United States remained a market economy; defence spending was its largest federal programme.
      - |
        Elections continued throughout the Cold War; the effects were on liberties and spending, not on the franchise.
    answer: 1
    explanation: |
      Skill: causation (effects). The Cold War at home.

  - slug: apworld-u08-exam-q19
    type: multiple_choice
    topic_code: "8.4"
    source: "general knowledge"
    points: 1
    prompt: |
      The Cultural Revolution in China (1966–76) was
    options:
