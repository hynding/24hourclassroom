    - slug: apworld-u08-w28-q23
      type: short_answer
      topic_code: "8.4"
      source: "Described source: Richard Nixon, address to the nation on the war in Vietnam, 3 November 1969 (American Presidency Project), summarised in our own words; U.S. government work"
      points: 3
      stimulus: |
        Source description: In a televised address on 3 November 1969, President Richard Nixon set out what became known as the Nixon Doctrine. He said that the United States would keep all its treaty commitments and would provide a shield if a nuclear power threatened an ally, but that in other cases of aggression it would furnish military and economic assistance while looking to the nation directly threatened to provide the manpower for its own defence. He described a programme, which he called Vietnamization, of withdrawing American troops as South Vietnamese forces took over the fighting, and appealed to what he called the great silent majority of Americans for support.
      prompt: |
        Using the source description, answer (a), (b) and (c).

        (a) Describe the change in American policy that the doctrine announced.
        (b) Explain ONE reason the United States adopted this policy in 1969.
        (c) Explain ONE consequence of the policy for Vietnam by 1975.
      answer: |
        (a) The United States would no longer send its own troops to fight communist insurgencies in allied states but would arm and finance them while the allies supplied the soldiers; in Vietnam this meant withdrawing American forces and transferring the war to the South Vietnamese army.
        (b) The war had become unwinnable at acceptable cost: over 500,000 troops, more than 30,000 American dead by 1969, the Tet offensive of 1968, mass protest at home and the collapse of the public consensus behind containment; Nixon had been elected promising to end the war.
        (c) American forces left under the Paris accords of 1973; without American troops or, after Congress cut aid, adequate supplies, South Vietnam collapsed and the North took Saigon in April 1975, uniting Vietnam under communist rule; Laos and Cambodia fell the same year.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate description of the shift from American manpower to allied manpower with American aid (Vietnamization).

        (b) 1 pt: a reason explained: casualties and cost; Tet; domestic protest; the 1968 election; the limits of the domino logic.

        (c) 1 pt: a consequence explained: the 1973 withdrawal; the fall of Saigon in 1975; the limits of the policy without American support; the spread of communism to Laos and Cambodia.

