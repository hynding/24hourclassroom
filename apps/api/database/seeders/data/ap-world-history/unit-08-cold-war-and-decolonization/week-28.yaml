    # ---- Long answer (LEQ)
    - slug: apworld-u08-w28-q25
      type: long_answer
      topic_code: "8.5"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1945 and 1975 almost every colony in Asia and Africa became an independent state, some by negotiation and some by war.

        Evaluate the extent to which the processes by which colonies gained independence after 1945 were similar across Asia and Africa.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (comparison, causation, or continuity and change).
      answer: |
        Thesis: The causes of independence were broadly similar everywhere (imperial exhaustion, nationalist mobilisation, the Cold War and the UN), but the processes differed sharply according to whether settlers held land and whether the colonial power was willing to leave: where neither obstacle existed, as in India, Ghana and French West Africa, power was negotiated; where either existed, as in Algeria, Kenya, Vietnam and Angola, independence came by war.

        Context: the nationalist movements of the interwar years; the Second World War's destruction of European power and prestige; the Atlantic Charter and the UN.

        Body 1 (similarities): mass nationalist parties led by Western-educated elites (Congress, the CPP, the FLN, the Viet Minh); the same arguments from self-determination; the same timing, 1947–65; Cold War patrons on both sides.

        Body 2 (differences in process): India's negotiation with Britain and its partition violence; Ghana's elections and transfer; de Gaulle's referendum; against Algeria's eight-year war and a million settlers, Kenya's emergency and camps, Vietnam's two wars, Portugal's refusal until 1974.

        Body 3 (why the differences): settlers made negotiation impossible; a colonial power's domestic politics (Labour in Britain, the Fourth Republic's collapse, Salazar's dictatorship) decided its willingness; strategic value (Suez, Indochina) raised the stakes.

        Complexity: negotiated independence could still be deadly (partition); armed struggle often ended in negotiation (Evian, Kenya); the Cold War cut across the distinction, turning Vietnam and Angola into proxy wars; continuity of economic dependence after political independence (neo-colonialism, Françafrique).
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible claim on the extent of similarity with a line of reasoning. Zero for "some were peaceful and some were violent" without explanation.

        Contextualization (0–1): interwar nationalism; the Second World War; the Atlantic Charter or the UN; the Cold War.

        Evidence (0–2): 1 pt for at least two specific examples (India 1947 and partition; Ghana 1957; the 1958 referendum; Algeria 1954–62; Mau Mau; Dien Bien Phu; Angola 1975; Suez). 2 pts for using them to support the comparison.

        Analysis and reasoning (0–2): 1 pt for comparison structuring the essay (similar causes, different processes, with variables named). 1 pt for complexity: cases that blur the line; the Cold War's cross-cutting effect; economic continuity after independence.
