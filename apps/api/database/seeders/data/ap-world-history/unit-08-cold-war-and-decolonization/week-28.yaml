week: 28
unit: 8
title: "The Spread of Communism, Decolonization, and Newly Independent States"
topics: ["8.4", "8.5", "8.6"]
guide: guides/week-28.md
guide_description: |
  Communism after 1945: Mao's China from land reform to the Great Leap Forward and the Cultural Revolution,
  Cuba, Vietnam and the domino theory. The end of the empires: negotiated independence in India and Ghana,
  armed struggle in Algeria, Vietnam and Kenya, partition in India and Palestine, and the Cold War's role. Then
  the new states: Nehru's India, Nasser's Egypt and Suez, Israel, Pakistan and Bangladesh, the Congo, Ghana,
  Tanzania, the Green Revolution and migration to the former imperial centres.
flashcards_description: |
  30 cards on the communist revolutions of China, Cuba and Vietnam, the paths to independence across Asia,
  Africa and the Middle East, and how the newly independent states governed and developed.

flashcards:
  - front: Why the Chinese Communist Party won the civil war (1946–49) → four reasons
    back: |
      Peasant support built by land reform and discipline in the war against Japan; the Guomindang's corruption, hyperinflation and brutality; Soviet-captured Japanese arms in Manchuria; superior strategy and morale. The People's Republic was proclaimed on 1 October 1949; Chiang fled to Taiwan.
    topic_code: "8.4"
  - front: Mao's first decade (1949–57) → what the new state did
    back: |
      Land redistributed to peasants and perhaps a million landlords killed; women given legal equality (Marriage Law 1950); industry nationalised; a Soviet-style Five-Year Plan (1953–57) with Soviet aid; the Hundred Flowers campaign (1956–57) inviting criticism, then the Anti-Rightist purge of those who gave it.
    topic_code: "8.4"
  - front: Great Leap Forward (1958–62) → aims, methods, result
    back: |
      Aim: overtake Britain in industry within fifteen years by mass mobilisation. Methods: people's communes of thousands of households, backyard steel furnaces, communal dining, inflated harvest reports. Result: steel useless, grain requisitioned on false figures, a famine of 1959–61 that killed between 20 and 45 million, the worst in history.
    topic_code: "8.4"
  - front: Cultural Revolution (1966–76) → aims, methods, result
    back: |
      Mao, sidelined after the Great Leap, mobilised student Red Guards against party rivals, intellectuals and the four olds (customs, culture, habits, ideas). Schools and universities closed, officials and teachers humiliated or killed (perhaps a million dead), millions of youths sent to the countryside; chaos until Mao died in 1976 and the Gang of Four fell.
    topic_code: "8.4"
  - front: Sino-Soviet split (1960 onward) → causes and consequences
    back: |
      Disputes over Khrushchev's de-Stalinisation and peaceful coexistence, Soviet refusal to share the bomb, border quarrels and rivalry for leadership of world communism. Soviet advisers withdrawn in 1960; border clashes in 1969; Nixon's visit to Beijing (1972) exploited the split. Communism was no longer one bloc.
    topic_code: "8.4"
  - front: Cuban Revolution (1959) → sequence to alignment with Moscow
    back: |
      Castro's guerrillas overthrew Batista (January 1959); land reform and nationalisation of American sugar and oil companies; U.S. embargo (1960); the Bay of Pigs invasion fails (April 1961); Castro declares the revolution socialist; Soviet aid and missiles (1962). Cuba exported revolution and doctors, and sent troops to Angola and Ethiopia.
    topic_code: "8.4"
  - front: Vietnam, 1945–1975 → the sequence
    back: |
      Ho Chi Minh declares independence (September 1945); war with France from 1946; Dien Bien Phu and the Geneva accords divide Vietnam at the 17th parallel (1954); U.S. backing of the South, advisers, then combat troops (1965–73, over 500,000 at peak); Tet offensive (1968); Paris accords (1973); the North takes Saigon (April 1975); Laos and Cambodia fall the same year.
    topic_code: "8.4"
  - front: Domino theory (1954) → who, what, and what it justified
    back: |
      Eisenhower told reporters in April 1954 that the fall of Indochina would topple its neighbours like a row of dominoes. It justified American support for South Vietnam, SEATO, and the escalation of the 1960s; after 1975 only Laos and Cambodia fell, and Thailand, Malaysia and Indonesia did not.
    topic_code: "8.4"
  - front: Why communism appealed in agrarian societies → four reasons and two costs
    back: |
      It promised land to peasants, independence from foreign domination, rapid industrialization and a disciplined party able to organise armies; the Soviet Union and China supplied arms, and colonial rule discredited the West. Costs: famine and purges (China, Cambodia), one-party rule and the suppression of dissent.
    topic_code: "8.4"
  - front: Why the empires ended after 1945 → five causes
    back: |
      Britain and France bankrupt and dependent on the United States; Japan's victories in 1941–42 had destroyed European prestige in Asia; colonial soldiers and the Atlantic Charter raised expectations; both superpowers opposed old-style empire and the UN gave nationalists a forum; the cost of holding colonies by force exceeded their value.
    topic_code: "8.5"
  - front: Indian independence and partition (1947) → sequence and cost
    back: |
      Quit India (1942); Labour government decides to leave (1946); Jinnah's Muslim League insists on Pakistan; Mountbatten advances the date to 15 August 1947 and the Radcliffe line divides Punjab and Bengal; up to a million killed and about 15 million displaced; Gandhi assassinated by a Hindu nationalist (January 1948); war over Kashmir (1947–48).
    topic_code: "8.5"
  - front: Ghana (1957) → how the first sub-Saharan colony became independent
    back: |
      Kwame Nkrumah's Convention People's Party used strikes, boycotts (positive action) and elections; Britain, judging the Gold Coast ready and resistance costly, transferred power on 6 March 1957. The model for negotiated independence across British Africa: Nigeria (1960), Tanganyika (1961), Uganda (1962), Kenya (1963).
    topic_code: "8.5"
  - front: French Africa (1958–60) → how fourteen states became independent in one year
    back: |
      De Gaulle's 1958 referendum offered membership in a French Community; Guinea alone voted no and was cut off; by 1960 the rest demanded and received independence while keeping the franc zone, French troops and advisers. Independence with continued French influence (Françafrique).
    topic_code: "8.5"
  - front: Algerian War (1954–62) → why it was fought and what it cost
    back: |
      A million French settlers and the claim that Algeria was part of France made negotiation impossible. The FLN's war, French torture and the Battle of Algiers (1957), the collapse of the Fourth Republic (1958), de Gaulle's turn to independence, a settler army revolt (1961), Evian accords (1962). Between 300,000 and a million dead; the settlers left.
    topic_code: "8.5"
  - front: Mau Mau rising in Kenya (1952–60) → cause and outcome
    back: |
      Kikuyu land grievances against white settlers in the highlands; an oath-bound movement attacked settlers and loyalists; Britain declared an emergency, detained about 80,000 in camps and hanged over 1,000. The rising was crushed but made settler rule untenable; independence under Jomo Kenyatta in 1963.
    topic_code: "8.5"
  - front: Negotiated versus armed independence → what decided the path
    back: |
      Armed struggle where settlers held land and political power (Algeria, Kenya, Rhodesia, Angola, Mozambique) or where the colonial power refused to leave (Vietnam, Indonesia); negotiation where the colonial power judged the cost too high and a credible nationalist party existed (India, Ghana, Nigeria, French West Africa).
    topic_code: "8.5"
  - front: Portuguese Africa (1961–75) → why last and how it ended
    back: |
      Salazar's dictatorship refused to decolonise; wars in Angola, Mozambique and Guinea-Bissau from 1961 drained Portugal until army officers overthrew the regime in the Carnation Revolution (April 1974). Independence in 1975, followed in Angola and Mozambique by civil wars with Cuban, South African, Soviet and American involvement.
    topic_code: "8.5"
  - front: Partition of Palestine and the founding of Israel (1947–49) → sequence
    back: |
      Britain hands the mandate to the UN; the partition plan (November 1947) is accepted by Jewish leaders and rejected by Arabs; civil war; Israel declares independence (14 May 1948); five Arab states invade and lose; armistice lines of 1949; about 700,000 Palestinians become refugees (the Nakba). Wars followed in 1956, 1967 and 1973.
    topic_code: "8.6"
  - front: Nehru's India (1947–64) → programme and legacy
    back: |
      Parliamentary democracy under the constitution of 1950 with universal suffrage; secularism; Five-Year Plans for state-led heavy industry and dams; land reform limited by landlords; non-alignment abroad. Legacy: a durable democracy, slow growth (the Hindu rate), wars with Pakistan (1947, 1965) and China (1962).
    topic_code: "8.6"
  - front: Nasser's Egypt → Suez (1956), Aswan and Arab nationalism
    back: |
      Free Officers overthrow the monarchy (1952); land reform; Nasser nationalises the Suez Canal (July 1956) after the West withdraws Aswan Dam funding; Britain, France and Israel invade; Eisenhower and Khrushchev force withdrawal. Nasser becomes the hero of Arab nationalism, builds Aswan with Soviet help, and loses the Six-Day War (1967).
    topic_code: "8.6"
  - front: Suez crisis (1956) → why it mattered beyond Egypt
    back: |
      It showed that Britain and France could no longer act without American consent, ended their standing as independent great powers, strengthened non-alignment and Arab nationalism, and brought the Soviet Union into Middle Eastern politics as Egypt's patron.
    topic_code: "8.6"
  - front: Pakistan and the Bangladesh war (1971) → cause and result
    back: |
      Pakistan's two wings were divided by a thousand miles of India and by language; West Pakistan dominated. After the Awami League won the 1970 election, the army's crackdown in the East killed hundreds of thousands and sent ten million refugees into India; India intervened in December 1971 and Bangladesh became independent.
    topic_code: "8.6"
  - front: Congo crisis (1960–65) → what went wrong
    back: |
      Belgium left in June 1960 with almost no trained Congolese administrators; the army mutinied, Katanga seceded with Belgian mining support, the UN intervened, Prime Minister Lumumba was murdered (January 1961) with Belgian and CIA complicity, and Mobutu seized power (1965) to rule for 32 years. A Cold War proxy struggle inside a decolonization failure.
    topic_code: "8.6"
  - front: Nkrumah's Ghana (1957–66) → programme and fall
    back: |
      Pan-Africanism (the Organisation of African Unity, 1963), state-led industrialization, the Akosombo Dam, free education. Falling cocoa prices, debt, corruption and one-party rule under the Preventive Detention Act; overthrown by the army in 1966, the first of many African coups.
    topic_code: "8.6"
  - front: Tanzania's ujamaa (1967) → aims and results
    back: |
      Julius Nyerere's Arusha Declaration: self-reliance and village socialism, with peasants moved into communal villages for schools, clinics and cooperative farming. Results: high literacy and unity across 120 ethnic groups, but agricultural output fell, forced villagisation after 1973 bred resentment, and the economy depended on aid.
    topic_code: "8.6"
  - front: Green Revolution → what it was and its mixed effects
    back: |
      High-yield dwarf wheat and rice (Borlaug, IRRI) with fertiliser, pesticides and irrigation, spread in Mexico, India, Pakistan and the Philippines from the 1960s. Effects: India self-sufficient in grain, famine ended in South Asia; but dependence on chemicals and credit, water depletion, and gains for larger farmers over smallholders.
    topic_code: "8.6"
  - front: Postcolonial migration to former imperial centres → examples
    back: |
      South Asians and West Indians to Britain (Windrush, 1948 onward); Algerians and West Africans to France; Indonesians and Surinamese to the Netherlands; Turks to Germany as guest workers. Labour shortages pulled, poverty pushed; the migrants reshaped European cities and politics.
    topic_code: "8.6"
  - front: Military coups and one-party states in new nations → why so common
    back: |
      Weak institutions inherited from colonial rule, borders holding rival peoples, armies as the best-organised institution, falling commodity prices and debt, Cold War patrons willing to back strongmen. Ghana 1966, Nigeria 1966, Uganda 1971 (Amin), Chile 1973, and dozens more.
    topic_code: "8.6"
  - front: Iran (1951–53) → oil nationalisation and the coup
    back: |
      Prime Minister Mossadegh nationalised the British-owned Anglo-Iranian Oil Company (1951); Britain organised a boycott; the CIA and MI6 engineered the coup of August 1953 that restored the Shah's power. A new state's attempt to control its resources overturned by Cold War intervention; the grievance fed the revolution of 1979.
    topic_code: "8.6"
  - front: Nixon Doctrine (1969) → what it changed
    back: |
      The United States would keep its treaty commitments and provide a nuclear shield, but allies facing conventional threats must provide the manpower for their own defence. Applied as Vietnamization: American troops withdrawn (1969–73) while South Vietnam was armed. The retreat from Kennedy's any-price pledge.
    topic_code: "8.4"

quiz:
  description: |
    25 questions · about 35 minutes · topics 8.4, 8.5 and 8.6 (the spread of communism, decolonization and the
    newly independent states), with about a third of the items reviewing the Cold War of week 27, the
    nationalism and revolutions of unit 7 and the empires of unit 6. Multiple choice, select-all and true/false
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
