        Spiral review of 7.5 (unresolved tensions after the First World War): the movements of the 1920s won in the 1940s–60s.

    # ---- Stimulus set C: Du Bois on the colour line (8.5, 8.6)
    - slug: apworld-u08-w28-q07
      type: multiple_choice
      topic_code: "8.5"
      source: "Primary source: W. E. B. Du Bois, The Souls of Black Folk (1903), Project Gutenberg #408"
      points: 1
      stimulus: |
        "The problem of the Twentieth Century is the problem of the color line."

        — W. E. B. Du Bois, African American scholar and later organiser of the Pan-African Congresses of 1919–1945, in the opening of The Souls of Black Folk, 1903. In the same book he explains that by the colour line he means the relation of the darker to the lighter races of men in Asia and Africa, in America and the islands of the sea.
      prompt: |
        Du Bois's prediction was borne out after 1945 chiefly by
      options:
        - "the end of European empires in Asia and Africa and the struggles against racial rule in the United States and South Africa, which made race and colonial status the central political questions of the mid-century"
        - "the disappearance of racial conflict after the Second World War"
        - "the success of the League of Nations"
        - "the Great Depression"
      option_explanations:
        - |
          Correct. Decolonization, the civil rights movement and the anti-apartheid struggle were the colour line's politics; Du Bois himself attended the fifth Pan-African Congress in 1945 and died in Nkrumah's Ghana in 1963.
        - |
          Racial conflict intensified, in Algeria, Kenya, Rhodesia, South Africa and the American South.
        - |
          The League upheld the colonial order through the mandates.
        - |
          The Depression was an economic crisis of the 1930s, not the century's racial question.
      answer: 0
      explanation: |
        Skill: sourcing (significance over time). A 1903 sentence read against the events of 1945–1994.

    - slug: apworld-u08-w28-q08
      type: multiple_choice
      topic_code: "8.6"
      source: "Primary source: W. E. B. Du Bois, The Souls of Black Folk (1903), Project Gutenberg #408"
      points: 1
      stimulus: |
        "The problem of the Twentieth Century is the problem of the color line."

        — W. E. B. Du Bois, African American scholar and later organiser of the Pan-African Congresses of 1919–1945, in the opening of The Souls of Black Folk, 1903. In the same book he explains that by the colour line he means the relation of the darker to the lighter races of men in Asia and Africa, in America and the islands of the sea.
      prompt: |
        The Pan-African idea that Du Bois helped to found shaped which policy of a newly independent African state?
      options:
        - "Ghana's Nkrumah's pursuit of African unity through the Organisation of African Unity (1963) and his support for liberation movements across the continent"
        - "Egypt's nationalisation of the Suez Canal"
        - "India's non-alignment"
        - "Israel's law of return"
      option_explanations:
        - |
          Correct. Nkrumah, a student of Du Bois's ideas, made Pan-Africanism state policy and hosted Du Bois in Accra.
        - |
          Suez was Arab nationalism and Egyptian sovereignty, not Pan-Africanism.
        - |
          Non-alignment was a Cold War stance shared across Asia and Africa, not a Pan-African programme.
        - |
          Israel's immigration law concerned Jews worldwide.
      answer: 0
      explanation: |
        Skill: causation. An idea of 1903 and 1919 became policy in 1957–66.

    - slug: apworld-u08-w28-q09
      type: multiple_choice
      topic_code: "6.1"
      source: "Primary source: W. E. B. Du Bois, The Souls of Black Folk (1903), Project Gutenberg #408"
      points: 1
      stimulus: |
        "The problem of the Twentieth Century is the problem of the color line."

        — W. E. B. Du Bois, African American scholar and later organiser of the Pan-African Congresses of 1919–1945, in the opening of The Souls of Black Folk, 1903. In the same book he explains that by the colour line he means the relation of the darker to the lighter races of men in Asia and Africa, in America and the islands of the sea.
      prompt: |
        The "color line" Du Bois describes had been drawn across the world in the nineteenth century by
      options:
        - "the Mongol conquests"
        - "the racial hierarchy of the new imperialism, in which Social Darwinism and the civilising mission justified European rule over Asians and Africans"
        - "the Protestant Reformation"
        - "the Treaty of Westphalia"
      option_explanations:
        - |
          The Mongols ruled in the 1200s and drew no racial lines.
        - |
          Correct. Unit 6's rationales for empire made race the organising principle of world politics by 1900; Du Bois named the consequence.
        - |
          The Reformation divided Christians in the 1500s; it had nothing to do with the colour line.
        - |
          Westphalia (1648) concerned European sovereignty.
      answer: 1
      explanation: |
        Spiral review of 6.1 (rationales for imperialism): the ideology of the imperial age is what decolonization overturned.

    # ---- Stand-alone multiple choice
