        In his State of the Union address of 22 January 1970, President Richard Nixon told Congress that the great question of the 1970s was whether Americans would make peace with nature and repair the damage done to air, land and water, and called clean air, clean water and open spaces "the common cause of all the people of this country". The Environmental Protection Agency was created later that year, followed by the Clean Air Act (1970) and the Clean Water Act (1972).
