      answer: |
        (a) That environmental damage is a national problem above party, that repairing it is the duty of all Americans and the government, and that clean air, water and open space are a shared right.
        (b) Rachel Carson's Silent Spring (1962) and the growing evidence of pollution (smog, oil spills such as Santa Barbara in 1969, the Cuyahoga River fire of 1969) created a mass environmental movement that culminated in the first Earth Day in April 1970, which politicians of both parties could not ignore; the movement had broad middle-class support unlike the anti-war protests.
        (c) Like the civil rights and women's movements, environmentalism used mass mobilisation and sought change through federal law and agencies, and was partly absorbed into the established order it criticised (the EPA); unlike the anti-apartheid or anti-colonial movements, it did not seek to overturn a regime but to regulate an economy, and it crossed Cold War lines, becoming a force in the Soviet bloc after Chernobyl.
      explanation: |
