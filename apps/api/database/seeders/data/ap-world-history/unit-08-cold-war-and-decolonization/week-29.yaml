        (b) 1 pt: a development of the 1960s explained as cause: Carson; visible pollution events; Earth Day and public opinion; the broader protest culture.

        (c) 1 pt: a specific comparison with another movement (civil rights, feminism, anti-war, anti-apartheid, Solidarity) explained in terms of method, aim or result.

