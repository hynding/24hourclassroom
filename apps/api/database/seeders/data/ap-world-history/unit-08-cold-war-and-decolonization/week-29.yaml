    # ---- Long answer (LEQ)
    - slug: apworld-u08-w29-q25
      type: long_answer
      topic_code: "8.8"
      source: "general knowledge"
      points: 6
      prompt: |
        In 1985 the Soviet Union was a superpower with an empire in eastern Europe; by the end of 1991 both had ceased to exist.

        Evaluate the extent to which internal factors, rather than external pressure, caused the end of the Cold War and the collapse of the Soviet Union in the period 1979–1991.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Internal factors were decisive: a command economy that had stopped growing, an arms burden it could not carry, the Afghan war, Chernobyl and the nationalism of the republics made reform unavoidable, and Gorbachev's reforms, with his refusal to use force, dissolved the system; external pressure from Reagan's buildup and Western broadcasting raised the costs and quickened the timetable but did not create the crisis.

        Context: the Cold War's structure since 1947; deterrence ruling out direct war; détente and its end in 1979; the Soviet economy's reliance on heavy industry and oil.

        Body 1 (internal, economic and military): growth falling to near zero; grain imports; defence at a fifth of output; Afghanistan's cost and the loss of legitimacy; Chernobyl's exposure of the system.

        Body 2 (internal, political): glasnost freeing criticism; perestroika disrupting planning; the end of the Brezhnev Doctrine; Solidarity, Hungary's border, Leipzig; the Baltic and Ukrainian national movements; Yeltsin and the failed coup.

        Body 3 (external): SDI and the buildup; aid to the mujahideen; Helsinki and human rights; the pope in Poland; the INF Treaty as a response to pressure and to need.

        Complexity: comparison with China, which faced similar economic problems and survived by force at Tiananmen, showing that the choices of leaders mattered; the view that pressure and reform worked together; the role of oil prices in the 1980s as an external economic shock.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible weighting of internal and external causes with a line of reasoning. Zero for "both internal and external factors mattered" without judgment.

        Contextualization (0–1): the structure of the Cold War; deterrence; détente's end; the Soviet economic model.

        Evidence (0–2): 1 pt for at least two specific examples (growth and grain figures; Afghanistan; Chernobyl; glasnost and perestroika; Solidarity; the Hungarian border; the Berlin Wall; SDI; the INF Treaty; the August coup). 2 pts for using them to support the weighting.

        Analysis and reasoning (0–2): 1 pt for causation structuring the essay (types of cause; necessary versus sufficient). 1 pt for complexity: the China comparison; the interaction of pressure and reform; oil prices; the role of individuals.
