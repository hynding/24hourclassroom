week: 29
unit: 8
title: "Global Resistance, the End of the Cold War, and Causation"
topics: ["8.7", "8.8", "8.9"]
guide: guides/week-29.md
guide_description: |
  Movements against established power after 1945: civil rights and anti-apartheid, the student revolts of 1968
  and the Prague Spring, feminism and environmentalism, Liberation Theology and the Iranian Revolution, and the
  groups that turned to violence. Then why the Cold War ended: Soviet economic failure, Afghanistan, Reagan's
  pressure, Gorbachev's reforms, Solidarity and the revolutions of 1989, German reunification and the
  dissolution of the Soviet Union in 1991, and the unit's causation review.
flashcards_description: |
  30 cards on the resistance movements of the postwar decades, their methods and results, the causes and
  sequence of the end of the Cold War, and the causal review that unit 8 asks for.

flashcards:
  - front: U.S. civil rights movement (1954–68) → milestones in order
    back: |
      Brown v. Board of Education (1954); Montgomery bus boycott (1955–56); Little Rock (1957); sit-ins (1960); Freedom Rides (1961); Birmingham and the March on Washington (1963); Civil Rights Act (1964); Selma and the Voting Rights Act (1965); King assassinated (April 1968).
    topic_code: "8.7"
  - front: Methods of the civil rights movement → where they came from
    back: |
      Non-violent direct action (boycotts, sit-ins, marches) adapted from Gandhi's satyagraha by King and others; litigation through the NAACP; appeals to federal power against southern states; television to show segregation's violence to the nation and the world, which Cold War competition made a liability.
    topic_code: "8.7"
  - front: Apartheid (1948–94) → the system
    back: |
      Legal racial classification; the Group Areas Act and pass laws confining Black South Africans to townships and homelands (Bantustans); separate and unequal schools; no vote for the Black majority. The National Party built it after 1948 on earlier segregation and justified it as separate development.
    topic_code: "8.7"
  - front: Anti-apartheid struggle → from defiance to majority rule
    back: |
      ANC defiance campaigns (1950s); Sharpeville massacre (1960) and the turn to armed struggle; Mandela jailed (1962–90); Soweto rising (1976); township revolts and strikes (1980s); international sanctions and divestment; de Klerk frees Mandela (1990); negotiations; first non-racial election, Mandela president (April 1994).
    topic_code: "8.7"
  - front: 1968 → what happened in four places
    back: |
      Paris: student revolt and a general strike of ten million (May). Prague: Dubcek's reforms crushed by Warsaw Pact invasion (August). Mexico City: the Tlatelolco massacre of students before the Olympics (October). United States: anti-war protest, the assassinations of King and Robert Kennedy, the Chicago convention. Shared: a young generation against authority, war and the old order.
    topic_code: "8.7"
  - front: Prague Spring (1968) → programme and end
    back: |
      Alexander Dubcek's socialism with a human face: an end to censorship, economic decentralisation, rehabilitation of purge victims, but no exit from the Warsaw Pact. Soviet and allied tanks invaded on 20–21 August; Dubcek was removed; the Brezhnev Doctrine declared Moscow's right to intervene in any socialist state.
    topic_code: "8.7"
  - front: Second-wave feminism → demands and gains
    back: |
      Equal pay and access to professions, contraception and abortion rights, an end to legal subordination in marriage and property, protection from violence. Gains: equal-pay laws (1960s–70s), women's suffrage in Switzerland (1971), the UN Decade for Women (1975–85), women entering universities and parliaments in large numbers; gaps in pay and power remain.
    topic_code: "8.7"
  - front: Environmental movement → origins and milestones
    back: |
      Rachel Carson's Silent Spring (1962) on pesticides; the first Earth Day (1970); Greenpeace (1971); the UN Stockholm conference (1972); environmental agencies and clean-air and clean-water laws in the United States under Nixon (1970–72); the Chernobyl disaster (1986) as a turning point in the Soviet bloc.
    topic_code: "8.7"
  - front: Liberation Theology → idea and consequences
    back: |
      Latin American Catholic theologians (Gutiérrez, 1971) read the Gospel as a preferential option for the poor and criticised dictatorship and inequality. Base communities organised peasants; priests and nuns were killed by right-wing regimes (Archbishop Romero, El Salvador, 1980); the Vatican under John Paul II restrained the movement.
    topic_code: "8.7"
  - front: Iranian Revolution (1978–79) → causes, course, results
    back: |
      Causes: the Shah's repression (SAVAK), rapid Westernising modernisation, oil wealth unevenly shared, the memory of the 1953 coup, and the clergy's networks. Course: mass strikes and demonstrations; the Shah leaves (January 1979); Khomeini returns; Islamic Republic by referendum. Results: the hostage crisis (1979–81), the Iran-Iraq War (1980–88), political Islam as a global force.
    topic_code: "8.7"
  - front: Carter Doctrine (January 1980) → what it declared and why
    back: |
      After the Soviet invasion of Afghanistan and the Iranian Revolution, Carter told Congress that any outside attempt to control the Persian Gulf would be treated as an assault on vital U.S. interests and repelled by force if necessary. The end of détente and the beginning of a permanent American military presence in the Gulf.
    topic_code: "8.7"
  - front: Political violence after 1945 → six groups and their causes
    back: |
      The IRA (Northern Ireland, 1969–98) and ETA (Basque Spain): nationalist; the PLO (from 1964) and later Hamas: Palestinian nationalism and Islamism; the Shining Path (Peru, 1980s): Maoist; the Red Brigades (Italy) and Red Army Faction (West Germany): far-left; al-Qaeda: religious, culminating on 11 September 2001. Common ground: closed or occupying states and the failure of other means.
    topic_code: "8.7"
  - front: Why some movements chose non-violence and others violence → the comparison
    back: |
      Non-violence worked where the state was a democracy sensitive to opinion and the movement could mobilise mass numbers (India, the U.S. South). Violence followed where the state was closed or settler-based (Algeria, South Africa after Sharpeville, Palestine) or where small groups lacked a mass base (the Red Brigades). Results differed as much as methods.
    topic_code: "8.7"
  - front: Solidarity (Poland, 1980–89) → sequence
    back: |
      Gdansk shipyard strikes (August 1980) win the right to an independent trade union under Lech Walesa; ten million members; martial law (December 1981) bans it; it survives underground with Church support; round-table talks (1989) lead to semi-free elections (June 1989) that Solidarity sweeps; the first non-communist government in the bloc (September 1989).
    topic_code: "8.8"
  - front: Internal causes of Soviet collapse → five
    back: |
      A command economy that could build steel but not computers or consumer goods, with growth stalled by the 1970s; perhaps a quarter of output spent on arms; the Afghan war (1979–89, 15,000 Soviet dead); Chernobyl (1986) exposing secrecy; nationalism in the Baltic, Ukrainian and Caucasian republics once glasnost let it speak.
    topic_code: "8.8"
  - front: Gorbachev's reforms (1985–91) → glasnost, perestroika, new thinking
    back: |
      Glasnost: openness, a freer press, release of dissidents, history told. Perestroika: restructuring, some market mechanisms, enterprise autonomy, which disrupted planning without creating a market. New thinking abroad: withdrawal from Afghanistan (1989), the INF Treaty (1987), renunciation of the Brezhnev Doctrine. Meant to save the system; it dissolved it.
    topic_code: "8.8"
  - front: Reagan's pressure on the Soviet Union → four instruments
    back: |
      A military buildup (the 600-ship navy, MX missiles, the Strategic Defense Initiative of 1983); aid to anti-communist insurgents (Afghan mujahideen, Nicaraguan contras, the Reagan Doctrine); ideological confrontation (the evil empire speech, 1983; the Berlin Wall speech, 1987); then negotiation with Gorbachev (Reykjavik 1986, INF 1987).
    topic_code: "8.8"
  - front: Afghanistan (1979–89) → why it mattered for the end of the Cold War
    back: |
      The Soviet invasion to save a communist government ended détente, brought the Carter Doctrine and an American-Saudi-Pakistani supply line to the mujahideen, cost the Red Army 15,000 dead and the regime its legitimacy, and ended with Gorbachev's withdrawal in February 1989. The Soviet Vietnam, and the seedbed of al-Qaeda.
    topic_code: "8.8"
  - front: Revolutions of 1989 → the sequence
    back: |
      Poland's elections (June); Hungary opens its Austrian border (summer); East Germans flee through it; Leipzig demonstrations; the Berlin Wall opened (9 November); Czechoslovakia's Velvet Revolution (November); Bulgaria's leadership removed; Romania's Ceausescu overthrown and shot (December). Gorbachev refused to send tanks; China's Tiananmen (June) showed the alternative.
    topic_code: "8.8"
  - front: German reunification (1990) → how it happened
    back: |
      East German elections (March 1990) won by parties favouring union; currency union (July); the Two Plus Four treaty with the four occupying powers; Gorbachev accepts a united Germany in NATO; reunification on 3 October 1990. The symbol of the Cold War's end in Europe.
    topic_code: "8.8"
  - front: Dissolution of the Soviet Union (1991) → sequence
    back: |
      Baltic declarations of independence (1990); Yeltsin elected president of Russia (June 1991); hardline coup against Gorbachev fails in three days (August); the Communist Party banned; Ukraine votes for independence (December); the Commonwealth of Independent States formed; Gorbachev resigns and the USSR ends on 25 December 1991.
    topic_code: "8.8"
  - front: Tiananmen Square (June 1989) → what it shows
    back: |
      Student demonstrations for reform in Beijing were crushed by the army on 3–4 June with hundreds or thousands killed. The Chinese party kept power by force while reforming the economy, the path the Soviet party did not take; communism survived in China, Vietnam, Cuba and North Korea after 1991.
    topic_code: "8.8"
  - front: Why the Cold War ended without a war → the explanation
    back: |
      Deterrence made a superpower war suicidal, so the contest was economic, technological and ideological, and the Soviet system lost it: it could not match Western productivity or satisfy its own people. Gorbachev chose reform and non-intervention over repression; the peoples of eastern Europe chose the exit he left open.
    topic_code: "8.8"
  - front: Causes of the end of the Cold War ranked → one defensible hierarchy
    back: |
      First, the structural failure of the Soviet command economy and its arms burden. Second, Gorbachev's choices (reform, withdrawal, non-intervention). Third, the movements in eastern Europe (Solidarity, the Church, the Leipzig demonstrators). Fourth, Western pressure (Reagan's buildup, Helsinki, broadcasting). Any order must be argued.
    topic_code: "8.9"
  - front: Consequences of the Cold War and decolonization → six to name
    back: |
      About 100 new states; some 25 million dead in proxy wars and partitions; a Europe divided for forty years then reunited; nuclear arsenals that remain; American predominance after 1991 and the globalization of unit 9; movements for rights (civil, women's, environmental) that outlived the structures that framed them.
    topic_code: "8.9"
  - front: Causation in the age of the Cold War → levels of cause
    back: |
      Structural: the outcome of the Second World War and nuclear weapons. Ideological: capitalism against communism, nationalism against empire. Economic: imperial exhaustion, Soviet stagnation, Western growth. Individual: Gandhi, Mao, Nasser, Mandela, Gorbachev, Reagan. Rank them for the question asked and give a reason.
    topic_code: "8.9"
  - front: Helsinki Accords (1975) → the unintended effect
    back: |
      Signed by 35 states to recognise Europe's postwar borders and promote cooperation; the Soviet Union accepted a basket of human-rights commitments it thought harmless. Dissidents (Charter 77, Moscow Helsinki Group) used the text against their governments; Western pressure on human rights had a legal footing.
    topic_code: "8.8"
  - front: Détente's end (1979–80) → the sequence
    back: |
      The Soviet invasion of Afghanistan (December 1979); the Carter Doctrine, the grain embargo and the Moscow Olympics boycott (1980); the Senate shelves SALT II; Reagan elected (November 1980) promising a buildup. The second Cold War of the early 1980s followed, before Gorbachev reversed it.
    topic_code: "8.8"
  - front: Nixon on the environment (1970) → the state takes up a movement
    back: |
      In his State of the Union address of January 1970 Nixon called clean air, clean water and open spaces the common cause of all the people of the country, the birthright of every American. The Environmental Protection Agency (1970), the Clean Air Act (1970) and the Clean Water Act (1972) followed: a protest movement absorbed into law.
    topic_code: "8.7"
  - front: Comparison of resistance across the blocs → West, East, third world
    back: |
      West: civil rights, 1968, feminism, environment, mostly tolerated and partly absorbed into law. East: Hungary 1956, Prague 1968, Solidarity 1980, crushed until 1989 then victorious. Third world: anti-apartheid, Iran, Liberation Theology, guerrilla and terrorist movements against both colonial and postcolonial states, with results from majority rule to theocracy.
    topic_code: "8.7"

quiz:
  description: |
    25 questions · about 35 minutes · topics 8.7, 8.8 and 8.9 (global resistance, the end of the Cold War and
    causation), with about a third of the items reviewing the Cold War, communism and the new states of weeks
    27–28 and the economy, ideas and nationalism of unit 7. Multiple choice, select-all and true/false items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Reagan, 1983 and 1987 (8.8)
    - slug: apworld-u08-w29-q01
      type: multiple_choice
      topic_code: "8.8"
      source: "Primary sources: Ronald Reagan, address to the National Association of Evangelicals, 8 March 1983, and address at the Brandenburg Gate, 12 June 1987 (Reagan Library); U.S. government works"
      points: 1
      stimulus: |
        Source 1: In March 1983 President Reagan urged his audience not to ignore "the aggressive impulses of an evil empire" or to call the arms race a simple misunderstanding, and so remove themselves from the struggle between right and wrong. — Address to the National Association of Evangelicals, Orlando, 8 March 1983

        Source 2: "Mr. Gorbachev, open this gate! Mr. Gorbachev, tear down this wall!" — President Reagan, speaking at the Brandenburg Gate in West Berlin, 12 June 1987
      prompt: |
        The difference in tone between the two sources reflects
      options:
        - "the shift from confrontation in the early 1980s to a direct challenge addressed to a Soviet leader with whom Reagan was by 1987 negotiating arms reductions"
        - "American withdrawal from NATO"
        - "the end of the Soviet Union in 1985"
        - "Reagan's conversion to communism"
      option_explanations:
        - |
          Correct. Gorbachev's arrival in 1985 and the Reykjavik summit of 1986 produced the INF Treaty of December 1987; the Berlin speech dared a reformer to go further.
        - |
          The United States remained NATO's leading member throughout.
        - |
          The Soviet Union dissolved in December 1991.
        - |
          Reagan's anti-communism was constant; what changed was his interlocutor.
      answer: 0
      explanation: |
        Skill: sourcing across time. Read the second speech against the first and against events between them.

    - slug: apworld-u08-w29-q02
      type: multiple_choice
      topic_code: "8.8"
      source: "Primary sources: Ronald Reagan, address to the National Association of Evangelicals, 8 March 1983, and address at the Brandenburg Gate, 12 June 1987 (Reagan Library); U.S. government works"
      points: 1
      stimulus: |
        Source 1: In March 1983 President Reagan urged his audience not to ignore "the aggressive impulses of an evil empire" or to call the arms race a simple misunderstanding, and so remove themselves from the struggle between right and wrong. — Address to the National Association of Evangelicals, Orlando, 8 March 1983

        Source 2: "Mr. Gorbachev, open this gate! Mr. Gorbachev, tear down this wall!" — President Reagan, speaking at the Brandenburg Gate in West Berlin, 12 June 1987
      prompt: |
        Historians who argue that Western pressure was a major cause of the end of the Cold War would cite, alongside these speeches,
      options:
        - "American recognition of East Germany"
        - "the withdrawal of American troops from Europe in 1985"
        - "the Marshall Plan of 1948"
        - "the Reagan military buildup, the Strategic Defense Initiative and aid to the Afghan mujahideen, which raised the cost of competition beyond what the Soviet economy could bear"
      option_explanations:
        - |
          Recognition came in 1974 under détente and had no part in the pressure argument.
        - |
          American forces stayed in Europe through 1991.
        - |
          The Marshall Plan belongs to the Cold War's beginning, forty years earlier.
        - |
          Correct. The pressure argument holds that Soviet leaders chose reform because they could not match SDI and a 600-ship navy while fighting in Afghanistan.
      answer: 3
      explanation: |
        Skill: argumentation. Know the evidence each side of the debate uses.

    - slug: apworld-u08-w29-q03
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary sources: Ronald Reagan, address to the National Association of Evangelicals, 8 March 1983, and address at the Brandenburg Gate, 12 June 1987 (Reagan Library); U.S. government works"
      points: 1
      stimulus: |
        Source 1: In March 1983 President Reagan urged his audience not to ignore "the aggressive impulses of an evil empire" or to call the arms race a simple misunderstanding, and so remove themselves from the struggle between right and wrong. — Address to the National Association of Evangelicals, Orlando, 8 March 1983

        Source 2: "Mr. Gorbachev, open this gate! Mr. Gorbachev, tear down this wall!" — President Reagan, speaking at the Brandenburg Gate in West Berlin, 12 June 1987
      prompt: |
        The wall in Source 2 had been built in 1961 in order to
      options:
        - "mark the border agreed at Yalta"
        - "protect West Berlin from Soviet attack"
        - "keep Western armies out of East Berlin"
        - "stop the flight of East Germans to the West through Berlin, which had cost East Germany about 2.7 million people since 1949"
      option_explanations:
        - |
          Yalta divided Germany into zones; the wall divided a city sixteen years later.
        - |
          The wall was built by the East to confine its own people.
        - |
          NATO forces in West Berlin were tiny; the wall faced inward.
        - |
          Correct. The open city was the hole in the Iron Curtain; sealing it stabilised the East German state at the cost of its reputation.
      answer: 3
      explanation: |
        Spiral review of 8.2 (the Cold War): the crisis of 1961 behind the speech of 1987.

    # ---- Stimulus set B: the Carter Doctrine (8.7, 8.3)
    - slug: apworld-u08-w29-q04
      type: multiple_choice
      topic_code: "8.7"
      source: "Primary source: Jimmy Carter, State of the Union address, 23 January 1980 (American Presidency Project); U.S. government work"
      points: 1
      stimulus: |
        "An attempt by any outside force to gain control of the Persian Gulf region will be regarded as an assault on the vital interests of the United States of America, and such an assault will be repelled by any means necessary, including military force."

        — President Jimmy Carter, State of the Union address to Congress, 23 January 1980, a month after the Soviet invasion of Afghanistan and eleven months after the Iranian Revolution
      prompt: |
        The two events named in the attribution shared which feature?
      options:
        - "Both were victories for the United States."
        - "Both were caused by the Marshall Plan."
        - "Both removed or threatened a regime allied to the United States in the region that supplied the West's oil: the Shah by a religious revolution, Afghanistan's neighbours by Soviet arms."
        - "Both were resolved by the United Nations."
      option_explanations:
        - |
          The Shah's fall and the Soviet move were both setbacks; Carter's doctrine is a response to loss.
        - |
          The Marshall Plan concerned Europe thirty years earlier.
        - |
          Correct. The revolution of 1979 and the invasion of December 1979 together ended American confidence in the Gulf and détente alike.
        - |
          The UN condemned the invasion and could do nothing about either.
      answer: 2
      explanation: |
        Skill: sourcing (context). The doctrine answers a religious revolution and a Soviet invasion at once.

    - slug: apworld-u08-w29-q05
      type: multiple_choice
      topic_code: "8.7"
      source: "Primary source: Jimmy Carter, State of the Union address, 23 January 1980 (American Presidency Project); U.S. government work"
      points: 1
      stimulus: |
        "An attempt by any outside force to gain control of the Persian Gulf region will be regarded as an assault on the vital interests of the United States of America, and such an assault will be repelled by any means necessary, including military force."

        — President Jimmy Carter, State of the Union address to Congress, 23 January 1980, a month after the Soviet invasion of Afghanistan and eleven months after the Iranian Revolution
      prompt: |
        The Iranian Revolution that preceded the doctrine was a reaction against established order in that it
      options:
        - "overthrew a modernising, Western-backed monarchy and replaced it with an Islamic Republic led by Shia clergy, rejecting both superpowers' models"
        - "established a communist state allied to Moscow"
        - "was led by the Shah himself"
        - "restored the Qajar dynasty"
      option_explanations:
        - |
          Correct. Khomeini's slogan of neither East nor West made political Islam a third force, alarming Washington and Moscow alike.
        - |
          Iranian communists (the Tudeh) were suppressed by the new republic.
        - |
          The Shah fled in January 1979; the revolution was against him.
        - |
          The Qajars had been replaced by the Pahlavis in 1925; no one sought their return.
      answer: 0
      explanation: |
        Skill: developments and processes. Religion as a basis for resistance to both modernising monarchy and Cold War alignment.

    - slug: apworld-u08-w29-q06
      type: multiple_choice
      topic_code: "8.3"
      source: "Primary source: Jimmy Carter, State of the Union address, 23 January 1980 (American Presidency Project); U.S. government work"
      points: 1
      stimulus: |
        "An attempt by any outside force to gain control of the Persian Gulf region will be regarded as an assault on the vital interests of the United States of America, and such an assault will be repelled by any means necessary, including military force."

        — President Jimmy Carter, State of the Union address to Congress, 23 January 1980, a month after the Soviet invasion of Afghanistan and eleven months after the Iranian Revolution
      prompt: |
        The Soviet invasion of Afghanistan became which kind of Cold War conflict?
      options:
        - "a direct war between Soviet and American armies"
        - "a UN peacekeeping operation"
        - "a proxy war in which the United States, Saudi Arabia and Pakistan armed the mujahideen against Soviet forces, at a cost of about a million Afghan and 15,000 Soviet lives"
        - "a war fought entirely by nuclear weapons"
      option_explanations:
        - |
          No American soldiers fought in Afghanistan in the 1980s; the war was fought by Afghans with American weapons.
        - |
          The UN condemned the invasion and mediated the withdrawal but did not fight.
        - |
          Correct. Afghanistan was the Soviet Vietnam, the last and one of the costliest proxy wars.
        - |
          Nuclear weapons were never used after 1945; their role was deterrence.
      answer: 2
      explanation: |
        Spiral review of 8.3 (effects of the Cold War): the proxy-war pattern in its final decade.

    # ---- Stimulus set C: Soviet economic indicators table (8.8)
    - slug: apworld-u08-w29-q07
      type: multiple_choice
      topic_code: "8.8"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Soviet economic indicators, 1950s–1980s (approximate)

        | Period | Average annual growth of national income | Defence spending as share of output | Net grain imports (million tonnes per year) |
        |---|---|---|---|
        | 1950s | about 6% | about 10% | net exporter |
        | 1960s | about 5% | about 12% | about 2 |
        | 1970s | about 3% | about 15% | about 15 |
        | early 1980s | about 2% | about 15–20% | about 35 |
        | 1986–90 | about 1%, falling | about 15–25% (estimates vary) | about 30 |

        Note: Western growth estimates for the same periods are lower than official Soviet figures; the trend is not disputed.
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "The Soviet economy grew faster in the 1980s than in the 1950s."
        - "Soviet growth slowed decade by decade while the burden of defence rose and the country became dependent on imported grain, a combination that made reform urgent by the mid-1980s."
        - "The Soviet Union never imported grain."
        - "Defence spending fell after 1970."
      option_explanations:
        - |
          Growth fell from about 6% a year in the 1950s to about 1% in the late 1980s.
        - |
          Correct. The table is the economic case for perestroika: a planned economy that could no longer feed itself or fund its arms race.
        - |
          Imports rose from zero to about 35 million tonnes a year.
        - |
          The defence share of output rose throughout the period shown, from about 10% to 15% or more.
      answer: 1
      explanation: |
        Skill: data analysis. Three trends in one table explain the internal cause of collapse.

    - slug: apworld-u08-w29-q08
      type: multiple_choice
      topic_code: "8.8"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Soviet economic indicators, 1950s–1980s (approximate)

        | Period | Average annual growth of national income | Defence spending as share of output | Net grain imports (million tonnes per year) |
        |---|---|---|---|
        | 1950s | about 6% | about 10% | net exporter |
        | 1960s | about 5% | about 12% | about 2 |
        | 1970s | about 3% | about 15% | about 15 |
        | early 1980s | about 2% | about 15–20% | about 35 |
        | 1986–90 | about 1%, falling | about 15–25% (estimates vary) | about 30 |

        Note: Western growth estimates for the same periods are lower than official Soviet figures; the trend is not disputed.
      prompt: |
        Gorbachev's response to the situation shown in the table was
      options:
        - "perestroika, an attempt to restructure the planned economy with some market mechanisms and enterprise autonomy, combined with cuts in the arms race and withdrawal from Afghanistan to reduce the burden"
        - "to invade western Europe for its resources"
        - "to return to Stalin's Five-Year Plans"
        - "to abolish the Communist Party in 1985"
      option_explanations:
        - |
          Correct. Reform at home required peace abroad; the INF Treaty and the withdrawal from Afghanistan were economic as well as diplomatic decisions.
        - |
          Reform meant retreat from confrontation, not war.
        - |
          The plans were the system that had produced the table.
        - |
          Gorbachev remained general secretary of the party until the coup of 1991; he sought to reform it, not end it.
      answer: 0
      explanation: |
        Skill: causation. The data explains the policy.

    - slug: apworld-u08-w29-q09
      type: multiple_choice
      topic_code: "7.4"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Soviet economic indicators, 1950s–1980s (approximate)

        | Period | Average annual growth of national income | Defence spending as share of output | Net grain imports (million tonnes per year) |
        |---|---|---|---|
        | 1950s | about 6% | about 10% | net exporter |
        | 1960s | about 5% | about 12% | about 2 |
        | 1970s | about 3% | about 15% | about 15 |
        | early 1980s | about 2% | about 15–20% | about 35 |
        | 1986–90 | about 1%, falling | about 15–25% (estimates vary) | about 30 |

        Note: Western growth estimates for the same periods are lower than official Soviet figures; the trend is not disputed.
      prompt: |
        The grain column reflects the long-term consequences of which Soviet policy of the 1930s?
      options:
        - "the New Economic Policy"
        - "Lend-Lease"
        - "the collectivisation of agriculture, which destroyed the independent peasantry and left Soviet farming permanently inefficient"
        - "the gold standard"
      option_explanations:
        - |
          The NEP (1921–28) had allowed peasants to sell their surplus, and grain output recovered under it; Stalin ended it.
        - |
          Lend-Lease was American wartime aid (1941–45), not a Soviet farm policy.
        - |
          Correct. Collective farms under state procurement never matched private plots in productivity; a country that had exported grain under the tsars imported it under Brezhnev.
        - |
          The Soviet Union was never on the gold standard in any sense relevant to farming.
      answer: 2
      explanation: |
        Spiral review of 7.4 (the interwar economy): the Five-Year Plans' agricultural legacy.

    # ---- Stand-alone multiple choice
    - slug: apworld-u08-w29-q10
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The U.S. civil rights movement and the Indian independence movement shared which method?
      options:
        - "petitioning the League of Nations"
        - "the formation of a communist party"
        - "armed insurrection against the state"
        - "non-violent mass direct action (boycotts, marches, civil disobedience) designed to expose injustice and make it costly to maintain, with King explicitly adapting Gandhi's satyagraha"
      option_explanations:
        - |
