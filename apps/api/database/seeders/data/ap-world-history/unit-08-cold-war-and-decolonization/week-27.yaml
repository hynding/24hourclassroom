    - slug: apworld-u08-w27-q23
      type: short_answer
      topic_code: "8.2"
      source: "Primary source: John F. Kennedy, inaugural address, 20 January 1961 (U.S. National Archives); U.S. government work"
      points: 3
      stimulus: |
        "Let every nation know, whether it wishes us well or ill, that we shall pay any price, bear any burden, meet any hardship, support any friend, oppose any foe to assure the survival and the success of liberty."

        — President John F. Kennedy, inaugural address, Washington, 20 January 1961
      prompt: |
        Using the source, answer (a), (b) and (c).

        (a) Describe the commitment Kennedy makes.
        (b) Explain ONE way this commitment was put into practice between 1961 and 1965.
        (c) Explain ONE way the commitment reflected the strategy of containment developed since 1947.
      answer: |
        (a) An open-ended pledge that the United States will accept any cost and any risk, anywhere in the world, to defend and advance liberty against its enemies, addressed to allies and adversaries alike.
        (b) The Bay of Pigs invasion of Cuba (April 1961); the quarantine of Cuba in the missile crisis (October 1962); the increase of American advisers in South Vietnam from under a thousand to 16,000 by 1963 and the commitment of combat troops in 1965; the Alliance for Progress in Latin America; the Berlin crisis of 1961.
        (c) Containment, from the Truman Doctrine onward, held that communism must be resisted wherever it advanced; Kennedy's any price, any burden language made that principle global and unlimited, the logic that led to Vietnam.
      explanation: |
        Three points, one per part.

        (a) 1 pt: an accurate description of the pledge (universal, unlimited, addressed to friend and foe).

        (b) 1 pt: a specific action of 1961–65 explained as an application: Cuba, Berlin, Vietnam, the Alliance for Progress, the Peace Corps, the space pledge.

        (c) 1 pt: a link to containment or the Truman Doctrine explained, not merely named; credit for noting the escalation from a regional aid pledge in 1947 to a global one in 1961.

