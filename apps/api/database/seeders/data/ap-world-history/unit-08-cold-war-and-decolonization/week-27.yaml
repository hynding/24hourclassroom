    # ---- True / false
    - slug: apworld-u08-w27-q19
      type: true_false
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: During the Cuban missile crisis of October 1962, American and Soviet forces fought a naval battle in the Caribbean before Khrushchev agreed to withdraw the missiles.
      answer: false
      explanation: |
        False. Kennedy's quarantine stopped Soviet ships without a battle; after thirteen days Khrushchev withdrew the missiles in exchange for an American pledge not to invade Cuba and the secret removal of U.S. missiles from Turkey. The superpowers never fought each other directly, which is the defining feature of the Cold War.

    - slug: apworld-u08-w27-q20
      type: true_false
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Unlike the League of Nations, the United Nations included both the United States and the Soviet Union from its founding in 1945.
      answer: true
      explanation: |
        True. The United States never joined the League and the Soviet Union was excluded until 1934 and expelled in 1939; both were founding permanent members of the UN Security Council, with a veto designed to keep them in. The UN therefore survived the Cold War but was paralysed whenever the two disagreed.

