        (c) In the United States: McCarthyism and loyalty investigations; the permanent military-industrial complex and the national security state; federal funding of science after Sputnik; civil rights reform partly justified as answering Soviet propaganda. In the Soviet Union: perhaps a quarter of output spent on arms, shortages of consumer goods, censorship and the KGB, prestige projects in space over housing.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a correctly named proxy war.

        (b) 1 pt: deterrence or the risk of nuclear escalation explained as the reason; credit also for the opportunity created by decolonization.

        (c) 1 pt: a specific domestic effect explained for either superpower.

    # ---- Long answer (LEQ)
    - slug: apworld-u08-w27-q25
      type: long_answer
      topic_code: "8.2"
      source: "general knowledge"
      points: 6
      prompt: |
        Within four years of defeating Germany together, the United States and the Soviet Union had divided Europe and the world into hostile blocs.

        Evaluate the extent to which ideological differences, rather than security interests, caused the Cold War in the period 1945–1950.

        In your essay, make a historically defensible claim, set the topic in its broader context, support your argument with specific evidence, and use a historical reasoning process (causation, comparison, or continuity and change).
      answer: |
        Thesis: Security interests created the conflict (Stalin's buffer in eastern Europe, the American determination to keep Germany and western Europe out of Soviet reach), but ideology turned a negotiable dispute over spheres into a global, moralised and unlimited rivalry; the two were inseparable, with security the deeper cause of the first moves and ideology the cause of their escalation.

        Context: the revolution of 1917 and Western intervention; the wartime alliance of necessity; the destruction of Europe; the American atomic monopoly.

        Body 1 (security): Soviet losses and the German invasions of 1914 and 1941; Poland and the Yalta dispute; the Soviet takeover of eastern Europe; the Western fear of a vacuum; the Berlin blockade over German statehood; NATO.

        Body 2 (ideology): the Truman Doctrine's two ways of life; Stalin's 1946 election speech and Zhdanov's two camps; Kennan's analysis of Soviet conduct as ideological; the Marshall Plan refused on ideological grounds; the communist coup in Prague; the Chinese revolution reading as a world movement.

        Body 3 (interaction): each side read the other's security moves as ideological aggression; the atomic bomb as both security asset and symbol; the economic systems made compromise over Germany impossible.

        Complexity: comparison with 1815 or 1919, when victors without ideological division managed spheres; the role of individuals (Stalin's paranoia, Truman's inexperience); the view that the Cold War was overdetermined and any one cause would have sufficed.
      explanation: |
        Scored on the six-point LEQ rubric.

        Thesis/claim (0–1): a defensible weighting of ideology against security with a line of reasoning. Zero for "both mattered" without judgment.

        Contextualization (0–1): 1917 and the interwar mistrust; the wartime alliance; the state of Europe in 1945; the atomic bomb.

        Evidence (0–2): 1 pt for at least two specific examples (Yalta and Poland; the Long Telegram; the Truman Doctrine; the Marshall Plan and Comecon; the Prague coup; the Berlin blockade; NATO; the Soviet bomb; NSC-68). 2 pts for using them to support the weighting.

        Analysis and reasoning (0–2): 1 pt for causation structuring the essay (distinguishing types of cause). 1 pt for complexity: showing how the two causes interacted; a comparison with earlier postwar settlements; acknowledging the weight of individuals or contingency.
