week: 27
unit: 8
title: "Setting the Stage, the Cold War, and Its Effects"
topics: ["8.1", "8.2", "8.3"]
guide: guides/week-27.md
guide_description: |
  The world of 1945 and the forty-year rivalry that followed: the superpowers, the United Nations and Bretton
  Woods, the causes of the Cold War, the Truman Doctrine, the Marshall Plan, Berlin, NATO and the Warsaw Pact,
  the arms race and deterrence, the crises from Korea to Cuba to Afghanistan, the Non-Aligned Movement, and the
  Cold War's effects on alliances, proxy wars, technology and domestic life in both blocs.
flashcards_description: |
  30 cards on the postwar settlement and institutions, the origins and course of the Cold War, its crises in
  order, and its military, economic and domestic effects.

flashcards:
  - front: The world of 1945 → why only two powers remained
    back: |
      Europe was ruined and occupied, Britain bankrupt, Japan defeated, the empires beaten in Asia. The United States had half the world's industrial output, the bomb and an intact homeland; the Soviet Union had 27 million dead but the largest army in the world standing in central Europe.
    topic_code: "8.1"
  - front: Yalta and Potsdam (1945) → what was agreed and what was not
    back: |
      Yalta (February): Germany to be divided into occupation zones; free elections promised in liberated Europe; the UN; Soviet entry against Japan. Potsdam (July–August): Germany demilitarised and denazified; Poland's borders moved west. The meaning of free elections in Poland was never agreed, and that dispute began the Cold War.
    topic_code: "8.1"
  - front: United Nations (1945) → structure and the lesson of the League
    back: |
      General Assembly of all members; Security Council with five permanent veto-holding members (United States, USSR, Britain, France, China). The veto kept the great powers inside, unlike the League the United States never joined; it also meant the UN could act only where the superpowers agreed.
    topic_code: "8.1"
  - front: Bretton Woods system (1944) → institutions and purpose
    back: |
      The International Monetary Fund (to lend to countries in balance-of-payments trouble), the World Bank (reconstruction and development loans), currencies fixed to the dollar and the dollar to gold at 35 dollars an ounce; the GATT (1947) to cut tariffs. Purpose: to prevent the competitive devaluations and protectionism that had deepened the Depression.
    topic_code: "8.1"
  - front: Causes of the Cold War → ideology, security, power
    back: |
      Ideology: capitalist democracy against a one-party planned economy, each sure history favoured it. Security: Stalin wanted a buffer in eastern Europe; the West saw expansion. Power: with Germany and Japan gone, two states faced each other across a vacuum. Add mistrust from 1917, the delayed second front and the atomic monopoly.
    topic_code: "8.2"
  - front: Soviet takeover of eastern Europe (1945–48) → the sequence
    back: |
      Red Army occupation; coalition governments with communists holding the police and interior ministries; opposition parties squeezed out (salami tactics); Poland, Romania, Bulgaria and Hungary by 1947; the Czechoslovak coup of February 1948 completed the bloc. Yugoslavia under Tito broke with Stalin in 1948.
    topic_code: "8.2"
  - front: Containment → Kennan's idea and its application
    back: |
      George Kennan's Long Telegram (1946) and X article (1947) argued that Soviet expansion could be checked by firm resistance at every point until the system mellowed or collapsed. Applied through the Truman Doctrine, the Marshall Plan, NATO, Korea and Vietnam; it defined American policy for forty years.
    topic_code: "8.2"
  - front: Truman Doctrine (12 March 1947) → occasion and pledge
    back: |
      Britain could no longer support Greece against communist guerrillas or Turkey against Soviet pressure. Truman asked Congress for 400 million dollars and pledged that the United States would support free peoples resisting subjugation by armed minorities or outside pressures. The first open commitment to containment.
    topic_code: "8.2"
  - front: Marshall Plan (1948–52) → amount, purpose, Soviet response
    back: |
      About 13 billion dollars of American aid to rebuild western Europe, offered to all of Europe in June 1947. Purpose: recovery, markets for American goods, and undercutting communist parties in France and Italy. Stalin forbade his satellites to accept and answered with Comecon (1949); the division of Europe hardened.
    topic_code: "8.2"
  - front: Berlin blockade and airlift (June 1948 – May 1949) → cause and outcome
    back: |
      The Western powers introduced a new currency in their zones and moved toward a West German state; Stalin cut road and rail access to West Berlin. The Allies supplied two million people by air for eleven months; Stalin lifted the blockade. Two German states were founded in 1949 and NATO was signed in April.
    topic_code: "8.2"
  - front: NATO (1949) and the Warsaw Pact (1955) → members and meaning
    back: |
      NATO: the United States, Canada, Britain, France, Italy, the Benelux states, Norway, Denmark, Iceland, Portugal; later Greece, Turkey and West Germany (1955). An attack on one is an attack on all. The Warsaw Pact answered West German rearmament and bound the Soviet satellites. Europe was divided into two armed camps.
    topic_code: "8.2"
  - front: Korean War (1950–53) → sequence and significance
    back: |
      North Korea invaded the South in June 1950; the UN (with the USSR boycotting the Security Council) authorised a U.S.-led force; MacArthur's Inchon landing drove north to the Yalu; China intervened in November; stalemate near the 38th parallel; armistice July 1953. Containment by proxy, China as a Cold War power, and the American military buildup of NSC-68.
    topic_code: "8.2"
  - front: NSC-68 (1950) → what it proposed
    back: |
      A secret National Security Council paper that described the Soviet Union as bent on world domination and called for a massive American conventional and nuclear buildup, tripling defence spending. The Korean War made Congress pay for it; the permanent military establishment dates from here.
    topic_code: "8.2"
  - front: Hungary (1956) and Czechoslovakia (1968) → what the Soviet Union would not allow
    back: |
      Hungary: Nagy's government announced free elections and withdrawal from the Warsaw Pact; Soviet tanks crushed the rising, about 2,500 killed, Nagy executed. Czechoslovakia: Dubcek's Prague Spring reforms ended by Warsaw Pact invasion; the Brezhnev Doctrine claimed a right to intervene in any socialist state. The West protested and did nothing.
    topic_code: "8.2"
  - front: Berlin Wall (August 1961) → why it was built and what it meant
    back: |
      About 2.7 million East Germans had fled through West Berlin since 1949. Khrushchev and Ulbricht sealed the border overnight. The wall stopped the exodus, stabilised East Germany, and became the symbol of a divided Europe until it fell on 9 November 1989.
    topic_code: "8.2"
  - front: Cuban missile crisis (October 1962) → sequence and results
    back: |
      Khrushchev placed nuclear missiles in Cuba to protect Castro and offset American superiority; Kennedy imposed a naval quarantine and demanded removal; after thirteen days Khrushchev withdrew in exchange for a pledge not to invade Cuba and the secret removal of U.S. missiles from Turkey. Results: the hotline, the Partial Test Ban Treaty (1963), the beginning of arms control.
    topic_code: "8.2"
  - front: Nuclear arms race → milestones 1945–1985
    back: |
      U.S. bomb 1945; Soviet bomb 1949; hydrogen bombs 1952 (U.S.) and 1953 (USSR); Sputnik and the ICBM 1957; submarine-launched missiles 1960; multiple warheads 1970; about 60,000 warheads by the mid-1980s. Britain (1952), France (1960), China (1964), India (1974) joined the club.
    topic_code: "8.3"
  - front: Deterrence and mutual assured destruction → the logic
    back: |
      Each side kept enough weapons to destroy the other after absorbing a first strike, so neither could gain by attacking. It kept the superpowers from direct war but made every crisis a gamble with annihilation, drove the arms race and the space race, and shifted conflict to proxies.
    topic_code: "8.3"
  - front: Space race → milestones and why it mattered
    back: |
      Sputnik (October 1957) shocked the United States; Gagarin first in orbit (1961); Kennedy's Moon pledge (1961); Apollo 11 (July 1969). Prestige, missile technology and science education were at stake; NASA, satellites and computing were the spin-offs.
    topic_code: "8.3"
  - front: Proxy wars → six examples and their tolls
    back: |
      Korea (1950–53, about 3 million dead); Vietnam (1955–75, 2–3 million); Angola (1975–2002, Cuban and South African intervention); the Horn of Africa (Ethiopia and Somalia, 1977–78); Afghanistan (1979–89, about a million); Nicaragua and El Salvador (1980s). The superpowers armed, financed and sometimes fought, but never against each other.
    topic_code: "8.3"
  - front: Covert interventions → the United States and the Soviet Union compared
    back: |
      CIA-backed coups in Iran (1953, Mossadegh), Guatemala (1954, Arbenz) and Chile (1973, Allende), and the Bay of Pigs failure in Cuba (1961). Soviet tanks in East Berlin (1953), Hungary (1956) and Czechoslovakia (1968), and the invasion of Afghanistan (1979). Both overthrew governments in the name of their ideology.
    topic_code: "8.3"
  - front: Non-Aligned Movement → founders, conferences, purpose
    back: |
      Nehru (India), Nasser (Egypt), Tito (Yugoslavia), Sukarno (Indonesia), Nkrumah (Ghana). Bandung conference of 29 Asian and African states (1955); founding at Belgrade (1961). Purpose: independence from both blocs, anti-colonialism, and aid from both sides; in practice members often leaned one way and fought each other.
    topic_code: "8.2"
  - front: Division of Germany and Korea → how each was divided and what followed
    back: |
      Germany: four occupation zones became the Federal Republic (West, 1949) and the Democratic Republic (East, 1949); Berlin divided inside the East; wall 1961; reunified 1990. Korea: divided at the 38th parallel between Soviet and American zones in 1945; two states in 1948; war 1950–53; still divided.
    topic_code: "8.3"
  - front: Cold War alliances around the world → the ring of pacts
    back: |
      NATO (1949, North Atlantic), the Rio Pact (1947, the Americas), ANZUS (1951), SEATO (1954, Southeast Asia), CENTO or the Baghdad Pact (1955, Middle East), the U.S.-Japan treaty (1951), against the Warsaw Pact (1955) and Soviet treaties with China (1950), Cuba, Vietnam and others.
    topic_code: "8.3"
  - front: Domestic effects in the United States → four examples
    back: |
      McCarthyism and loyalty oaths (1947–54); the national security state (CIA 1947, NSA 1952) and the draft; federal funding of science and universities after Sputnik; civil rights reform partly justified as answering Soviet propaganda about American racism.
    topic_code: "8.3"
  - front: Domestic effects in the Soviet bloc → four examples
    back: |
      Purges and the Gulag until Stalin's death (1953); censorship and the KGB; perhaps a quarter of national output spent on arms, starving consumers; show trials in the satellites (1949–52); heavy industry and space prestige over housing and food.
    topic_code: "8.3"
  - front: Détente (1969–1979) → what it was and why it ended
    back: |
      Nixon and Brezhnev's easing of tension: SALT I (1972) limiting missiles, Nixon's visit to China (1972), the Helsinki Accords (1975) recognising European borders and human rights. It ended with Soviet and Cuban interventions in Africa and the invasion of Afghanistan (December 1979), after which Carter and Reagan renewed the arms race.
    topic_code: "8.2"
  - front: Eisenhower's two warnings (1953, 1961) → the cost of the arms race
    back: |
      Chance for Peace (1953): every gun made and warship launched is a theft from the hungry and the cold. Farewell address (1961): guard against the unwarranted influence of the military-industrial complex. The president who built the arsenal counted its price.
    topic_code: "8.3"
  - front: Kennedy's inaugural (1961) → the promise and its consequences
    back: |
      The United States would pay any price and bear any burden to assure the survival and success of liberty. Within two years: the Bay of Pigs, the Berlin Wall, the missile crisis, and the first thousands of advisers in Vietnam; the rhetoric of global commitment that Vietnam would test.
    topic_code: "8.2"
  - front: Comecon (1949) → the Soviet answer to the Marshall Plan
    back: |
      The Council for Mutual Economic Assistance tied eastern Europe's economies to the Soviet Union through planned trade and specialisation, in place of American aid. It delivered growth in heavy industry but not consumer goods, and bound the satellites to Moscow economically as the Warsaw Pact did militarily.
    topic_code: "8.2"

quiz:
  description: |
    25 questions · about 35 minutes · topics 8.1, 8.2 and 8.3 (the postwar setting, the Cold War and its
    effects), with about a third of the items reviewing the world wars, the Depression and the ideologies of
    unit 7 and the empires of unit 6. Multiple choice, select-all and true/false items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: the Truman Doctrine (8.2)
    - slug: apworld-u08-w27-q01
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary source: Harry S. Truman, address to a joint session of Congress, 12 March 1947 (Avalon Project); U.S. government work"
      points: 1
      stimulus: |
        "One way of life is based upon the will of the majority, and is distinguished by free institutions, representative government, free elections, guarantees of individual liberty, freedom of speech and religion, and freedom from political oppression. The second way of life is based upon the will of a minority forcibly imposed upon the majority. It relies upon terror and oppression, a controlled press and radio; fixed elections, and the suppression of personal freedoms. I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures."

        — President Harry S. Truman, asking Congress for aid to Greece and Turkey, 12 March 1947
      prompt: |
        The immediate occasion of the speech was
      options:
        - "the Berlin blockade"
        - "the outbreak of the Korean War"
        - "the Soviet invasion of Afghanistan"
        - "Britain's announcement that it could no longer afford to support the Greek government against communist insurgents or Turkey against Soviet pressure"
      option_explanations:
        - |
          The blockade began in June 1948, fifteen months after the speech.
        - |
          Korea began in June 1950; the doctrine was later applied there.
        - |
          Afghanistan was invaded in 1979, more than thirty years later.
        - |
          Correct. Britain's bankruptcy handed the United States the role of guarantor in the eastern Mediterranean; Congress voted 400 million dollars.
      answer: 3
      explanation: |
        Skill: sourcing (context). The doctrine was announced to fill a British gap and became a global pledge.

    - slug: apworld-u08-w27-q02
      type: multiple_choice
      topic_code: "8.2"
      source: "Primary source: Harry S. Truman, address to a joint session of Congress, 12 March 1947 (Avalon Project); U.S. government work"
      points: 1
      stimulus: |
        "One way of life is based upon the will of the majority, and is distinguished by free institutions, representative government, free elections, guarantees of individual liberty, freedom of speech and religion, and freedom from political oppression. The second way of life is based upon the will of a minority forcibly imposed upon the majority. It relies upon terror and oppression, a controlled press and radio; fixed elections, and the suppression of personal freedoms. I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures."

        — President Harry S. Truman, asking Congress for aid to Greece and Turkey, 12 March 1947
      prompt: |
        The speech's division of the world into two ways of life is best understood as
      options:
        - "a neutral description of international relations in 1947"
        - "a proposal for the Non-Aligned Movement"
        - "the ideological framing of containment, presenting the rivalry with the Soviet Union as a contest between freedom and tyranny in which the United States must act anywhere"
        - "a call for the United States to withdraw from Europe"
      option_explanations:
        - |
          It is an argument to a reluctant Congress, built on the starkest contrast available.
        - |
          Non-alignment (Bandung 1955) was the rejection of exactly this two-camp view.
        - |
          Correct. The language turned a regional aid bill into a global doctrine; Marshall aid, NATO, Korea and Vietnam followed from the same logic.
        - |
          It committed the United States to Europe and the Mediterranean for the first time in peacetime.
      answer: 2
      explanation: |
        Skill: sourcing (purpose and point of view). Ideology was both cause and instrument of the Cold War.

    - slug: apworld-u08-w27-q03
      type: multiple_choice
      topic_code: "7.6"
      source: "Primary source: Harry S. Truman, address to a joint session of Congress, 12 March 1947 (Avalon Project); U.S. government work"
      points: 1
      stimulus: |
        "One way of life is based upon the will of the majority, and is distinguished by free institutions, representative government, free elections, guarantees of individual liberty, freedom of speech and religion, and freedom from political oppression. The second way of life is based upon the will of a minority forcibly imposed upon the majority. It relies upon terror and oppression, a controlled press and radio; fixed elections, and the suppression of personal freedoms. I believe that it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures."

        — President Harry S. Truman, asking Congress for aid to Greece and Turkey, 12 March 1947
      prompt: |
        Truman's pledge to resist "outside pressures" drew on which lesson American policymakers took from the 1930s?
      options:
        - "that appeasement of an expansionist dictatorship at Munich had led to a world war, so aggression must be resisted early rather than conceded to"
        - "that the League of Nations had succeeded in preventing aggression"
        - "that isolation from Europe had kept the United States safe"
        - "that the Depression had been caused by foreign aid"
      option_explanations:
        - |
          Correct. The Munich analogy shaped containment from Greece to Vietnam; Truman's generation had watched concession fail.
        - |
          The League had failed in Manchuria and Ethiopia; the UN was built to avoid its weakness.
        - |
          Isolation in the 1930s was precisely what postwar policymakers blamed for the war.
        - |
          The Depression was spread by the collapse of loans and trade, which the Marshall Plan was designed to reverse.
      answer: 0
      explanation: |
        Spiral review of 7.6 (causes of the Second World War): the memory of appeasement underlies the Cold War's doctrine.

    # ---- Stimulus set B: Eisenhower, 1953 and 1961
    - slug: apworld-u08-w27-q04
      type: multiple_choice
      topic_code: "8.3"
      source: "Primary sources: Dwight D. Eisenhower, Chance for Peace address, 16 April 1953 (American Presidency Project), and farewell address, 17 January 1961 (U.S. National Archives); U.S. government works"
      points: 1
      stimulus: |
        Source 1: "Every gun that is made, every warship launched, every rocket fired signifies, in the final sense, a theft from those who hunger and are not fed, those who are cold and are not clothed." — President Dwight D. Eisenhower, address to the American Society of Newspaper Editors, 16 April 1953, six weeks after Stalin's death

        Source 2: "In the councils of government, we must guard against the acquisition of unwarranted influence, whether sought or unsought, by the military-industrial complex." — President Eisenhower, farewell address to the nation, 17 January 1961
      prompt: |
        Taken together, the two sources show that Eisenhower
      options:
        - "opposed all military spending"
        - "recognised the economic and political costs of the arms race even as his administration built the American nuclear arsenal and the alliances that sustained it"
        - "proposed unilateral American disarmament"
        - "believed the Cold War had ended in 1953"
      option_explanations:
        - |
          His administration expanded the nuclear arsenal and the strategic air force; the point is cost, not abolition.
        - |
          Correct. The president who presided over massive retaliation and the ICBM also counted what deterrence took from the hungry and warned what it did to government.
        - |
          Neither speech proposes disarming; both seek to limit and control.
        - |
          The 1953 speech was an offer to the new Soviet leadership, not a declaration of victory.
      answer: 1
      explanation: |
        Skill: sourcing across time. Read a leader's warnings against his own policies.

    - slug: apworld-u08-w27-q05
      type: multiple_choice
      topic_code: "8.3"
      source: "Primary sources: Dwight D. Eisenhower, Chance for Peace address, 16 April 1953 (American Presidency Project), and farewell address, 17 January 1961 (U.S. National Archives); U.S. government works"
      points: 1
      stimulus: |
        Source 1: "Every gun that is made, every warship launched, every rocket fired signifies, in the final sense, a theft from those who hunger and are not fed, those who are cold and are not clothed." — President Dwight D. Eisenhower, address to the American Society of Newspaper Editors, 16 April 1953, six weeks after Stalin's death

        Source 2: "In the councils of government, we must guard against the acquisition of unwarranted influence, whether sought or unsought, by the military-industrial complex." — President Eisenhower, farewell address to the nation, 17 January 1961
      prompt: |
        The "military-industrial complex" of Source 2 was an effect of the Cold War in that
      options:
        - "it existed only in the Soviet Union"
        - "it had been abolished by NSC-68"
        - "permanent peacetime armament after 1950 created a lasting alliance of the armed services, arms manufacturers, Congress and research universities with an interest in continued spending"
        - "it referred to the United Nations"
      option_explanations:
        - |
          The Soviet Union had its own version, far larger as a share of its economy; Eisenhower was speaking of America.
        - |
          NSC-68 (1950) created the buildup Eisenhower describes.
        - |
          Correct. Defence spending stayed near 10% of national output through the 1950s; aerospace, electronics and federal science grew with it.
        - |
          The United Nations is not a military or industrial body.
      answer: 2
      explanation: |
        Skill: developments and processes. The Cold War's domestic effects on the American state and economy.

    - slug: apworld-u08-w27-q06
      type: multiple_choice
      topic_code: "7.7"
      source: "Primary sources: Dwight D. Eisenhower, Chance for Peace address, 16 April 1953 (American Presidency Project), and farewell address, 17 January 1961 (U.S. National Archives); U.S. government works"
      points: 1
      stimulus: |
        Source 1: "Every gun that is made, every warship launched, every rocket fired signifies, in the final sense, a theft from those who hunger and are not fed, those who are cold and are not clothed." — President Dwight D. Eisenhower, address to the American Society of Newspaper Editors, 16 April 1953, six weeks after Stalin's death

        Source 2: "In the councils of government, we must guard against the acquisition of unwarranted influence, whether sought or unsought, by the military-industrial complex." — President Eisenhower, farewell address to the nation, 17 January 1961
      prompt: |
        The structure Eisenhower warns about in Source 2 had its origin in
      options:
        - "the Marshall Plan"
        - "the total mobilisation of American industry and science for the Second World War, including the Manhattan Project, which was not dismantled after 1945 as earlier war efforts had been"
        - "the New Deal"
        - "the Bretton Woods agreements"
      option_explanations:
        - |
          Marshall aid went to European recovery, not American arms.
        - |
          Correct. The arsenal of democracy of 1941–45 became permanent when the Cold War began; the wartime fusion of state, industry and laboratory is the complex.
        - |
          The New Deal built dams and relief, not weapons.
        - |
          Bretton Woods concerned currencies and trade.
      answer: 1
      explanation: |
        Spiral review of 7.7 (conducting the Second World War): the war economy that never demobilised.

    # ---- Stimulus set C: nuclear warheads table
    - slug: apworld-u08-w27-q07
      type: multiple_choice
      topic_code: "8.3"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Estimated nuclear warhead stockpiles, United States and Soviet Union (approximate)

        | Year | United States | Soviet Union |
        |---|---|---|
        | 1945 | 2 | 0 |
        | 1950 | 300 | 5 |
        | 1955 | 2,400 | 200 |
        | 1960 | 18,600 | 1,600 |
        | 1965 | 31,000 | 6,100 |
        | 1970 | 26,000 | 11,600 |
        | 1975 | 27,000 | 19,000 |
        | 1980 | 24,000 | 30,000 |
        | 1986 | 23,000 | 40,000 |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "Both sides disarmed after 1970."
        - "The arms race ended with the Cuban missile crisis."
        - "The Soviet Union led the arms race throughout the Cold War."
        - "The United States held an overwhelming lead until the 1960s, after which the Soviet Union caught up and overtook it in numbers, while both kept tens of thousands of warheads."
      option_explanations:
        - |
          American numbers fell slightly, Soviet numbers more than tripled.
        - |
          The crisis of 1962 was followed by the fastest Soviet buildup of the whole period.
        - |
          The Soviet Union was behind by a factor of ten or more until the mid-1960s.
        - |
          Correct. The Soviet drive after the Cuban humiliation of 1962 produced parity by the 1970s; détente's arms-control treaties limited launchers, not warheads.
      answer: 3
      explanation: |
        Skill: data analysis. Read the trend in each column and the crossover point.

    - slug: apworld-u08-w27-q08
      type: multiple_choice
      topic_code: "8.3"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Estimated nuclear warhead stockpiles, United States and Soviet Union (approximate)

        | Year | United States | Soviet Union |
        |---|---|---|
        | 1945 | 2 | 0 |
        | 1950 | 300 | 5 |
        | 1955 | 2,400 | 200 |
        | 1960 | 18,600 | 1,600 |
        | 1965 | 31,000 | 6,100 |
        | 1970 | 26,000 | 11,600 |
        | 1975 | 27,000 | 19,000 |
        | 1980 | 24,000 | 30,000 |
        | 1986 | 23,000 | 40,000 |
      prompt: |
        The stockpiles shown had which effect on how the superpowers fought the Cold War?
      options:
        - "They made direct war between the superpowers unthinkable, so conflict shifted to proxy wars in Korea, Vietnam, Africa, Central America and Afghanistan."
        - "They led to frequent direct battles between American and Soviet forces."
        - "They were used in the Korean War."
        - "They made alliances unnecessary."
      option_explanations:
        - |
          Correct. Deterrence (mutual assured destruction) kept the superpowers from fighting each other and sent the fighting to the third world.
        - |
          American and Soviet forces never fought a declared battle; the risk shown in the table is why.
        - |
          No nuclear weapon was used after Nagasaki; Truman refused MacArthur's requests in Korea.
        - |
          NATO, the Warsaw Pact and the ring of regional pacts grew alongside the arsenals, to extend deterrence to allies.
      answer: 0
      explanation: |
        Skill: causation (effects). The arms race explains the geography of the Cold War's actual wars.

    - slug: apworld-u08-w27-q09
      type: multiple_choice
      topic_code: "7.2"
      source: "Data table compiled for this course from standard historical estimates (rounded)"
      points: 1
      stimulus: |
        Estimated nuclear warhead stockpiles, United States and Soviet Union (approximate)

        | Year | United States | Soviet Union |
        |---|---|---|
        | 1945 | 2 | 0 |
        | 1950 | 300 | 5 |
        | 1955 | 2,400 | 200 |
        | 1960 | 18,600 | 1,600 |
        | 1965 | 31,000 | 6,100 |
        | 1970 | 26,000 | 11,600 |
        | 1975 | 27,000 | 19,000 |
        | 1980 | 24,000 | 30,000 |
        | 1986 | 23,000 | 40,000 |
      prompt: |
        The pattern in the table most resembles which earlier development, and with what difference?
      options:
        - "the Anglo-German naval race before 1914, except that the nuclear race, unlike the dreadnought race, did not end in a war between the rivals"
        - "the scramble for Africa, except that it involved only one power"
        - "the Columbian Exchange, except that it moved weapons rather than crops"
        - "the Opium Wars, except that Britain was absent"
      option_explanations:
        - |
          Correct. Both were spirals of competitive armament between rival blocs; militarism helped cause 1914, while deterrence arguably prevented a third world war.
        - |
          The scramble was a race for territory among several powers, not an arms race.
        - |
          The Columbian Exchange was biological, not military.
        - |
          The Opium Wars were wars, not a race in weapons.
      answer: 0
      explanation: |
        Spiral review of 7.2 (causes of the First World War): militarism then and deterrence now.

    # ---- Stand-alone multiple choice
    - slug: apworld-u08-w27-q10
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The founders of the United Nations gave the five permanent members of the Security Council a veto in order to
      options:
        - "keep the great powers inside the organisation, avoiding the League's fate when the United States stayed out, at the cost of paralysis whenever they disagreed"
        - "ensure that small states controlled the organisation"
        - "give the General Assembly the power to declare war"
        - "exclude the Soviet Union"
      option_explanations:
        - |
