# The AP World History: Modern course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: "AP World History: Modern"
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: AP World History
slug: apworld
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of AP World History: Modern, c. 1200 to the present, one
  week at a time: a study guide, flashcards and a quiz every week, a summary
  and an exam at the end of each of the nine units, and an exam-prep guide
  and full practice exam in the 2027 format (55 multiple choice, three
  source-based short answers, a document-based question and a long essay)
  before the May exam. Original material written around the College Board
  Course and Exam Description, with primary sources quoted only from
  public-domain texts and translations.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
teacher: { name: "AP World History Teacher", email: apworld@example.com }
student: { name: "AP World History Student", email: apworld-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# The exam is Thursday 2027-05-06, session 1 (College Board AP Central);
# weeks 33-34 review, 35 buffer, 36 exam week.
start_date: 2026-08-31
exam_date: 2027-05-06
subject: social-studies
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The 2027 exam format, the DBQ and LEQ rubrics, the historical thinking skills and reasoning processes, the six course themes, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["AP World History: Modern Course and Exam Description", public domain]
attribution: |
  Original study material written for this course and organised around the
  College Board AP World History: Modern Course and Exam Description. Quoted
  primary sources are in the public domain: works and translations published
  before 1931, or U.S. government works, checked against Project Gutenberg,
  Wikisource, the Avalon Project at Yale Law School or the Internet Archive.
# The six course themes, by their CED codes; guides tag topics with them.
themes:
  ENV: Humans and the Environment
  CDI: Cultural Developments and Interactions
  GOV: Governance
  ECN: Economic Systems
  SIO: Social Interactions and Organization
  TEC: Technology and Innovation
units:
  - number: 1
    slug: unit-01-the-global-tapestry
    title: "The Global Tapestry, c. 1200–1450"
    weight: "8–10%"
    weeks: [1, 2, 3, 4]
    topics:
      "1.1": Developments in East Asia from c. 1200 to c. 1450
      "1.2": Developments in Dar al-Islam from c. 1200 to c. 1450
      "1.3": Developments in South and Southeast Asia from c. 1200 to c. 1450
      "1.4": State Building in the Americas
      "1.5": State Building in Africa
      "1.6": Developments in Europe from c. 1200 to c. 1450
      "1.7": Comparison in the Period from c. 1200 to c. 1450
  - number: 2
    slug: unit-02-networks-of-exchange
    title: "Networks of Exchange, c. 1200–1450"
    weight: "8–10%"
    weeks: [5, 6, 7]
    topics:
      "2.1": The Silk Roads
      "2.2": The Mongol Empire and the Making of the Modern World
      "2.3": Exchange in the Indian Ocean
      "2.4": Trans-Saharan Trade Routes
      "2.5": Cultural Consequences of Connectivity
      "2.6": Environmental Consequences of Connectivity
      "2.7": Comparison of Economic Exchange
  - number: 3
    slug: unit-03-land-based-empires
    title: "Land-Based Empires, 1450–1750"
    weight: "12–15%"
    weeks: [8, 9, 10]
    topics:
      "3.1": "Empires Expand"
      "3.2": "Empires: Administration"
      "3.3": "Empires: Belief Systems"
      "3.4": Comparison in Land-Based Empires
  - number: 4
    slug: unit-04-transoceanic-interconnections
    title: "Transoceanic Interconnections, 1450–1750"
    weight: "12–15%"
    weeks: [11, 12, 13, 14]
    topics:
      "4.1": Technological Innovations from 1450 to 1750
      "4.2": "Exploration: Causes and Events from 1450 to 1750"
      "4.3": Columbian Exchange
      "4.4": Maritime Empires Established
      "4.5": Maritime Empires Maintained and Developed
      "4.6": Internal and External Challenges to State Power from 1450 to 1750
      "4.7": Changing Social Hierarchies from 1450 to 1750
      "4.8": Continuity and Change from 1450 to 1750
  - number: 5
    slug: unit-05-revolutions
    title: "Revolutions, 1750–1900"
    weight: "12–15%"
    weeks: [15, 16, 17, 18]
