    # ---- Short answer
    - slug: apworld-u04-w13-q22
      type: short_answer
      topic_code: "4.5"
      source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), ch. 2, Wikisource"
      points: 3
      prompt: |
        Equiano wrote of the slave ship that it "was so crouded that each had scarcely room to turn himself, almost suffocated us" and recalled "the shrieks of the women, and the groans of the dying" (The Interesting Narrative, 1789).

        (a) Identify ONE economic reason the Atlantic slave trade grew between 1500 and 1750.
        (b) Explain ONE effect of the Atlantic slave trade on the societies of West or Central Africa.
        (c) Explain ONE limitation of Equiano's narrative as evidence about the slave trade as a whole.
      answer: |
        (a) 1 point: the demand for labour on sugar (and tobacco, rice) plantations after Indigenous populations collapsed; the profits of the triangular trade; the availability of captives through African states and Portuguese posts; mercantilist states chartering companies (Royal African Company) to supply colonies.
        (b) 1 point with explanation: coastal states such as Dahomey and Asante grew by selling captives for guns and became militarised; raided interior regions lost population; the export of mostly men skewed sex ratios and increased polygyny and women's agricultural labour; imported cloth and metal undercut local crafts; political instability and warfare increased as the gun-slave cycle spread.
        (c) 1 point: Equiano wrote decades later for an abolitionist audience, shaping emphasis; he was one child on one ship; his birthplace is debated (some evidence points to South Carolina), so his African chapters may draw on others' accounts; he described the British trade in the 1750s, not the Portuguese or Brazilian trade that was larger; survivors' narratives cannot speak for those who died.
      explanation: |
        Scoring: one point per part. (b) and (c) require explanation, not a bare name.

    - slug: apworld-u04-w13-q23
      type: short_answer
      topic_code: "4.6"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE example of resistance to European expansion in the Americas or Africa between 1600 and 1750.
        (b) Explain ONE way a state in Asia limited European influence in the same period.
        (c) Explain ONE similarity between resistance to the maritime empires and resistance to the land-based empires of Unit 3.
      answer: |
        (a) 1 point: the Pueblo Revolt (1680); Metacom's War (1675–1676); Ana Nzinga's wars in Angola; Maroon communities such as Palmares or the Jamaican Maroons; slave revolts; Kongo's resistance.
        (b) 1 point with explanation: Tokugawa Japan banned Christianity, forbade travel abroad and confined trade to the Dutch and Chinese at Nagasaki to protect the shogunate from missionaries and daimyo alliances; Ming and Qing China confined Europeans to Macau and later Canton under licensed merchants; the Mughals taxed and tolerated European traders as minor players; the Ottomans fought the Portuguese for the Red Sea.
        (c) 1 point with explanation: both were provoked by taxation, forced labour, religious imposition or land seizure (Pueblo missions and labour; Cossack serfdom and taxes; Maratha and Sikh resistance to Aurangzeb's orthodoxy); both used frontier geography (New Mexico, the Deccan hills, the Volga, Maroon mountains); both rarely overturned the state but forced concessions or changed how it ruled (Spain's milder reconquest; Versailles after the Fronde; Maratha power replacing Mughal).
      explanation: |
        Scoring: one point per part; (b) and (c) require explanation of how the limit or the similarity worked.

    # ---- Long answer
    - slug: apworld-u04-w13-q24
      type: long_answer
      topic_code: "4.5"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which the development of the Atlantic economy between c. 1500 and c. 1750 represented a change in labour systems in the Americas and Africa.

        Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both continuity and change.
      answer: |
        Thesis (1 point): a defensible claim about extent, for example that the Atlantic economy produced a fundamental change in the scale, racial basis and plantation purpose of coerced labour, while building on older forms (the Inca mit'a, African and Mediterranean slavery, European indenture) that it adapted rather than invented.
        Contextualisation (1 point): the Columbian Exchange and demographic collapse; the sugar plantation's path from the Mediterranean to the Atlantic islands; the trans-Saharan and Indian Ocean slave trades; mercantilism and chartered companies; Spanish silver.
        Evidence (2 points): at least two specific examples, for example the encomienda and the New Laws of 1542; the colonial mit'a at Potosí; haciendas and debt peonage; indentured servants in Virginia and Barbados; the shift to African slavery after 1660; Equiano on the Middle Passage; the numbers of the trade; Dahomey and Asante's gun-slave trade; skewed sex ratios in Africa; Maroon communities and revolts.
        Analysis and reasoning (1 point): uses continuity and change to explain what was new (chattel, hereditary, racial slavery on a transatlantic scale) and what persisted (coerced peasant and household labour, African participation in slaving).
        Complexity (1 point): compares regions (Spanish America's Indigenous labour versus the Caribbean's African labour), traces change over time within the period, connects labour change to demographic and economic causes, or weighs effects on Africa against effects on the Americas.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that asserts only change, without acknowledging adapted older systems, cannot earn the complexity point.
