    # ---- Standalone new content
    - slug: apworld-u04-w13-q10
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge; Thomas Mun's writings are described, not quoted"
      points: 1
      prompt: |
        Thomas Mun, a director of the English East India Company, argued in the 1620s that England's wealth depended on selling more to foreigners than it bought from them. This argument is an expression of
      options:
        - "free-trade liberalism"
        - "socialism"
        - "mercantilism, which measured national wealth by the balance of trade and the accumulation of bullion"
        - "the Confucian disdain for merchants"
      option_explanations:
        - |
          Free trade was Adam Smith's later attack on exactly this doctrine (Unit 5).
        - |
          Socialism belongs to the nineteenth century.
        - |
          Correct. Mun's 'balance of trade' is the classic mercantilist formula.
        - |
          Mun was a merchant and East India Company director defending merchants, not a critic of commerce.
      answer: 2
      explanation: |
        Mercantilism is the economic ideology behind the chartered companies and navigation acts.

    - slug: apworld-u04-w13-q11
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which best describes the outcome of the Pueblo Revolt of 1680?
      options:
        - "The Pueblo were exterminated"
        - "New Mexico became independent permanently"
        - "The revolt spread to Mexico City"
        - "The Spanish were driven from New Mexico for about twelve years and returned on terms that allowed more religious and labour autonomy"
      option_explanations:
        - |
          The Pueblo peoples survived and still inhabit their towns.
        - |
          Spain returned to New Mexico in the 1690s; the revolt expelled it for about twelve years, not permanently.
        - |
          The revolt was confined to the far northern frontier.
        - |
          Correct. Popé's coalition expelled the colonists in 1680; the Spanish reconquest (1692) accepted limits the first colony had not.
      answer: 3
      explanation: |
