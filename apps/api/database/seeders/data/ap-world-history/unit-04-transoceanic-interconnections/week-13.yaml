week: 13
unit: 4
title: "Maritime Empires Maintained, and the Challenges to Them"
topics: ["4.5", "4.6"]
guide: guides/week-13.md
guide_description: |
  Study guide for week 13 (CED topics 4.5–4.6): the economic and labour systems that sustained the maritime empires (the silver economy, mercantilism and joint-stock companies, plantations, the Atlantic slave trade and its effects on Africa, the encomienda, hacienda, mit'a, indenture and chattel slavery) and the internal and external challenges to state power (the Pueblo Revolt, Metacom's War, Ana Nzinga, Maroons, the Marathas, Cossack revolts, the Fronde, and Tokugawa restrictions on contact). Reads Equiano's account of the slave ship closely.
flashcards_description: |
  30 cards on topics 4.5–4.6: silver flows, mercantilism, joint-stock companies, the triangular trade, coerced labour systems compared, the slave trade's effects on Africa, and the resisters and restrictors of state power from New Mexico to Japan.
flashcards:
  - front: "Three streams of American silver after 1545"
    back: "To Spain (then the rest of Europe) to pay for wars and Asian goods; across the Pacific on the Manila galleons to China; around Africa in European ships to India and China. China absorbed perhaps half."
    topic_code: "4.5"
  - front: "Price revolution → cause and effect"
    back: "Silver flooding into Europe in the 1500s raised prices several-fold over the century; fixed-income landlords and wage earners suffered, merchants and debtors gained, and Spain's wealth leaked abroad."
    topic_code: "4.5"
  - front: "Mercantilism → four policies"
    back: "Export more than you import to accumulate bullion; keep colonies as suppliers and captive markets; grant monopolies and charter companies; use tariffs and navigation acts to exclude rivals."
    hint: "Wealth is bullion, trade is a contest."
    topic_code: "4.5"
  - front: "Thomas Mun's argument (1620s) → the mercantilist balance of trade"
    back: "An East India Company director argued that England grew rich by selling more abroad than it bought, so exporting silver to buy Asian goods for re-export was sound; the 'balance of trade' became the measure of policy."
    topic_code: "4.5"
  - front: "Joint-stock company → how it worked and why it mattered"
    back: "Investors bought shares and received dividends, spreading the risk of a voyage among hundreds; with a state charter it could hold monopolies, fleets and forts. The VOC and the English East India Company financed empire privately."
    topic_code: "4.5"
  - front: "New merchant elites of the period → where and how they rose"
    back: "Amsterdam, London, Seville, Lisbon and colonial ports; shareholders of the companies, sugar planters, slave traders and silver merchants who lent to kings and bought office and land."
    topic_code: "4.5"
  - front: "Triangular trade → three legs"
    back: "Europe to Africa: cloth, guns, iron, rum, cowries. Africa to the Americas: enslaved people (the Middle Passage). Americas to Europe: sugar, tobacco, rum, silver, cotton."
    topic_code: "4.5"
  - front: "Middle Passage → conditions and mortality"
    back: "Captives packed below decks for weeks, chained, with disease, heat and despair; death rates of ten to twenty per cent; Equiano recorded 'the shrieks of the women, and the groans of the dying'."
    topic_code: "4.5"
  - front: "Scale of the Atlantic slave trade → numbers and destinations"
    back: "About six million Africans shipped by 1750 and some twelve million by the 1860s; Brazil took about forty per cent, the Caribbean most of the rest; North America under five per cent."
    topic_code: "4.5"
  - front: "Why planters turned to enslaved Africans → three reasons"
    back: "Indigenous workers died of disease or fled; indentured Europeans were few and went free after their terms; African captives were available through existing African and Portuguese trade and were held for life."
    topic_code: "4.5"
  - front: "Chattel slavery versus earlier slaveries → the differences"
    back: "Chattel slavery in the Americas was permanent, hereditary, racial and tied to plantation gang labour; household, military and debt slavery in Africa and the Islamic world often allowed manumission and integration."
    topic_code: "4.5"
  - front: "Effects of the slave trade on Africa → four"
    back: "Coastal states (Dahomey, Asante, Oyo) grew by exchanging captives for guns; interior regions were raided and depopulated; the export of mostly men skewed sex ratios and encouraged polygyny; cheap imports undercut African crafts."
    topic_code: "4.5"
  - front: "Encomienda → definition and fate"
    back: "A Spanish grant of Indigenous labour and tribute to a conquistador in return for 'protection' and Christianisation; abused so badly that the crown abolished inheritance of it in the New Laws of 1542 after Las Casas's protests."
    topic_code: "4.5"
  - front: "Colonial mit'a → origin and use"
    back: "The Inca rotating labour draft, redirected by Viceroy Toledo in the 1570s to send one seventh of Andean men to Potosí's silver mines and Huancavelica's mercury mines; deadly and resented."
    topic_code: "4.5"
  - front: "Hacienda → how it bound labour"
    back: "A large private estate in Spanish America whose Indigenous and mixed-race workers were held by debt to the owner's store; replaced the encomienda as the rural labour system."
    topic_code: "4.5"
  - front: "Indentured servitude → terms and limits"
    back: "A contract to work four to seven years for passage, food and lodging, then freedom and sometimes land; supplied early Virginia, Maryland and Barbados until planters switched to slavery after about 1660."
    topic_code: "4.5"
  - front: "Continuity and change in coerced labour, 1450–1750 → one of each"
    back: "Continuity: the mit'a, Islamic and African slavery, serfdom all persisted or were adapted. Change: plantation chattel slavery on a racial basis and transatlantic scale, and contract indenture, were new."
    topic_code: "4.5"
  - front: "Pueblo Revolt (1680) → leader, causes, result"
    back: "Popé united the Pueblo peoples against Spanish missions, forced labour and suppression of their religion; killed hundreds of colonists and expelled Spain from New Mexico for twelve years; the Spanish returned on milder terms."
    topic_code: "4.6"
  - front: "Metacom's War (1675–1676) → who, why, result"
    back: "Wampanoag leader Metacom (King Philip) led a coalition against New England's land seizures and courts; a tenth of colonial men died; Indigenous power in southern New England was broken and survivors enslaved or dispersed."
    topic_code: "4.6"
  - front: "Ana Nzinga → who she was and how she resisted"
    back: "Queen of Ndongo and Matamba in Angola (d. 1663); fought Portuguese slave raiders for forty years, allied with the Dutch, sheltered escaped slaves and negotiated a treaty in 1657; the CED's example of African state resistance."
    topic_code: "4.6"
  - front: "Maroon communities → examples and significance"
    back: "Palmares in Brazil (most of the 1600s, thousands of people, destroyed 1694); Jamaican Maroons who forced a treaty in 1739; Suriname's Saramaka. Escaped slaves built states that colonial armies could not easily destroy."
    topic_code: "4.6"
  - front: "Slave resistance → forms"
    back: "Shipboard revolts; flight to Maroon settlements; plantation uprisings; sabotage and work slowdowns; preservation of African religion, language and kinship; the Haitian Revolution (Unit 5) was the culmination."
    topic_code: "4.6"
  - front: "Marathas → who and what they did to the Mughals"
    back: "Hindu warriors of the western Deccan under Shivaji (d. 1680) who fought Aurangzeb with mobile cavalry and hill forts; by 1750 their confederacy controlled much of India and the Mughal emperor was a figurehead."
    topic_code: "4.6"
  - front: "Cossack revolts → Razin (1670–1671) and the pattern"
    back: "Frontier Cossacks and peasants of the Volga and Don rose against serfdom, taxes and officials; Stenka Razin was executed, and Pugachev's revolt (1773–1775) repeated the pattern under Catherine II."
    topic_code: "4.6"
  - front: "The Fronde (1648–1653) → causes and consequence"
    back: "French nobles and the Paris courts rebelled against royal ministers' taxes during Louis XIV's childhood; its failure, and the king's memory of fleeing Paris, led him to build Versailles and tame the nobility."
    topic_code: "4.6"
  - front: "Tokugawa restrictions on foreign contact → four measures"
    back: "Christianity banned (1614) and the Shimabara rebellion crushed (1637–1638); Japanese forbidden to leave or return on pain of death; Portuguese expelled (1639); trade confined to Dutch and Chinese ships at Nagasaki."
    topic_code: "4.6"
  - front: "Why the Tokugawa restricted contact → two reasons"
    back: "Fear that Christianity and foreign trade would give daimyo in the southwest wealth and allies against the shogun; the Spanish conquest of the Philippines as a warning of missionaries preceding conquest."
    topic_code: "4.6"
  - front: "Sakoku → what it was not"
    back: "Not total isolation: Japan traded with the Dutch at Nagasaki, with China, Korea and the Ryukyus, and learned European science through 'Dutch studies'. It was contact on Japan's terms for two centuries."
    topic_code: "4.6"
  - front: "Ming and Qing limits on Europeans → where"
    back: "Portuguese confined to Macau (from 1557); after 1757 all European trade restricted to Canton under licensed Chinese merchants (the Cohong); missionaries tolerated for science, then restricted."
    topic_code: "4.6"
  - front: "Common pattern of resistance in 4.6 → one sentence"
    back: "Expanding states provoked the peoples they taxed, drafted, converted or enslaved; revolts rarely overturned the state but changed how it ruled, and some (Marathas, Maroons, Pueblo) won lasting concessions."
    topic_code: "4.6"
quiz:
  description: |
    Week 13 quiz on CED topics 4.5–4.6 with spiral review of Units 1–3 and topics 4.1–4.4 · 24 questions · about 40 minutes. Stimulus sets use Equiano's Interesting Narrative (1789), a described summary of the Tokugawa edicts and a table of coerced labour systems. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Equiano (4.5)
    - slug: apworld-u04-w13-q01
      type: multiple_choice
      topic_code: "4.5"
      source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), ch. 2, Wikisource"
      points: 1
      stimulus: |
        "The first object which saluted my eyes when I arrived on the coast was the sea, and a slave-ship, which was then riding at anchor, and waiting for its cargo. ... The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crouded that each had scarcely room to turn himself, almost suffocated us. ... The shrieks of the women, and the groans of the dying ... I now wished for the last friend, Death, to relieve me".

        Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, or Gustavus Vassa, the African (London, 1789), chapter 2
      prompt: |
        The conditions Equiano describes resulted most directly from
      options:
        - "the shortage of ships in the Atlantic"
        - "the slave traders' aim of maximising the number of captives carried per voyage to increase profit"
        - "African rulers' insistence on crowded ships"
        - "European laws requiring minimum space per captive"
      option_explanations:
        - |
          Ships were plentiful; the crowding was a choice, not a shortage.
        - |
          Correct. 'Tight packing' raised profits even at mortality rates of ten to twenty per cent.
        - |
          African sellers had no role in how Europeans loaded their vessels.
        - |
          Britain regulated space only with Dolben's Act in 1788, the year before Equiano published, and minimally.
      answer: 1
      explanation: |
        The Middle Passage was the logistics of a business; its horror was a cost accepted for profit.

    - slug: apworld-u04-w13-q02
      type: multiple_choice
      topic_code: "4.5"
      source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), ch. 2, Wikisource"
      points: 1
      stimulus: |
        "The first object which saluted my eyes when I arrived on the coast was the sea, and a slave-ship, which was then riding at anchor, and waiting for its cargo. ... The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crouded that each had scarcely room to turn himself, almost suffocated us. ... The shrieks of the women, and the groans of the dying ... I now wished for the last friend, Death, to relieve me".

        Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, or Gustavus Vassa, the African (London, 1789), chapter 2
      prompt: |
        Equiano published his narrative in London in 1789. Which context best explains its purpose?
      options:
        - "The British campaign to abolish the slave trade, which sought first-hand testimony to move Parliament and the public"
        - "The Spanish crown's inquiry into the encomienda"
        - "The founding of the Dutch East India Company"
        - "The Tokugawa ban on Christianity"
      option_explanations:
        - |
          Correct. Equiano was an active abolitionist; his book was evidence in a political campaign that succeeded in 1807.
        - |
          That was 1542 and concerned Indigenous labour in Spanish America.
        - |
          The VOC (1602) was unconnected to Equiano's book.
        - |
          Japanese policy had no bearing on a London publication.
      answer: 0
      explanation: |
        Sourcing: audience and purpose (British readers, abolition) shape the narrative's emphasis.

    - slug: apworld-u04-w13-q03
      type: multiple_choice
      topic_code: "2.4"
      source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), ch. 2, Wikisource"
      points: 1
      stimulus: |
        "The first object which saluted my eyes when I arrived on the coast was the sea, and a slave-ship, which was then riding at anchor, and waiting for its cargo. ... The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crouded that each had scarcely room to turn himself, almost suffocated us. ... The shrieks of the women, and the groans of the dying ... I now wished for the last friend, Death, to relieve me".

        Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, or Gustavus Vassa, the African (London, 1789), chapter 2
      prompt: |
        Review. The Atlantic trade Equiano describes differed from the trans-Saharan trade in enslaved people studied in Unit 2 chiefly in
      options:
        - "its scale, its plantation purpose and its permanent, hereditary and racial character"
        - "the fact that the trans-Saharan trade did not exist"
        - "the use of camels in the Atlantic"
        - "the absence of any African participation in the Atlantic trade"
      option_explanations:
        - |
          Correct. The Saharan trade was older and smaller, supplied household and military slaves, and allowed more manumission; the Atlantic trade fed plantations with chattel labour.
        - |
          The trans-Saharan trade carried captives north for centuries before 1450.
        - |
          Camels crossed the desert; ships crossed the ocean.
        - |
          African states and merchants supplied most captives in both trades.
      answer: 0
      explanation: |
        Spiral review of 2.4: continuity (African slave trades) and change (the Atlantic system).

    # ---- Set B: Tokugawa edicts described (4.6)
    - slug: apworld-u04-w13-q04
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge; the Tokugawa edicts of the 1630s are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the Tokugawa shogunate's edicts of 1635 and 1639 restricting foreign contact.

        The edicts forbade Japanese ships and subjects to go abroad and prescribed death for any Japanese who returned from overseas. They ordered that Christian priests and anyone sheltering them be reported and punished, offered rewards for informers, and required that arriving ships be searched for missionaries. Trade was to be conducted only at Nagasaki under official supervision, with the quantity of raw silk fixed by the authorities; in 1639 Portuguese ships were banned altogether, leaving only the Dutch (confined to the island of Dejima) and the Chinese. The stated reasons were the danger of Christianity to the state and the need to keep the daimyo from dealing with foreigners.
      prompt: |
        The edicts are best understood as
      options:
        - "a sign that Japan was too weak to resist European power"
        - "a total end to Japanese trade with the outside world"
        - "an assertion of state control over foreign contact to protect the shogunate from Christianity and from daimyo enriched or armed by foreign trade"
        - "a response to the Mongol invasions"
      option_explanations:
        - |
          Japan expelled the Portuguese and crushed a rebellion; the edicts were acts of strength.
        - |
          Dutch, Chinese, Korean and Ryukyu trade continued at controlled ports.
        - |
          Correct. The shogunate feared missionaries as the vanguard of conquest (as in the Philippines) and foreign trade as a resource for rival lords.
        - |
          The Mongol attacks were in 1274 and 1281; the edicts concern Europeans.
      answer: 2
      explanation: |
        Restriction of contact is listed in 4.6 as a state's response to the challenges of the period.

    - slug: apworld-u04-w13-q05
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge; the Tokugawa edicts of the 1630s are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the Tokugawa shogunate's edicts of 1635 and 1639 restricting foreign contact.

        The edicts forbade Japanese ships and subjects to go abroad and prescribed death for any Japanese who returned from overseas. They ordered that Christian priests and anyone sheltering them be reported and punished, offered rewards for informers, and required that arriving ships be searched for missionaries. Trade was to be conducted only at Nagasaki under official supervision, with the quantity of raw silk fixed by the authorities; in 1639 Portuguese ships were banned altogether, leaving only the Dutch (confined to the island of Dejima) and the Chinese. The stated reasons were the danger of Christianity to the state and the need to keep the daimyo from dealing with foreigners.
      prompt: |
        Why were the Dutch permitted to remain when the Portuguese were expelled?
      options:
        - "The Dutch were Catholic"
        - "The Dutch had conquered Japan"
        - "The Dutch paid tribute to the emperor"
        - "The Dutch were Protestant traders uninterested in missionary work and willing to accept confinement at Dejima, so they posed no religious threat"
      option_explanations:
        - |
          The Dutch were Protestant; it was the Catholic Portuguese and Spanish whose missionaries were feared.
        - |
          No European power conquered any part of Japan.
        - |
          The Dutch paid for trade privileges with gifts and reports on the world, not tribute as a subject state.
        - |
          Correct. The VOC wanted profit, not converts, and submitted to Japanese rules.
      answer: 3
      explanation: |
        Japan chose its partners by the risk they posed to the state.

    - slug: apworld-u04-w13-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge; the Tokugawa edicts of the 1630s are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the Tokugawa shogunate's edicts of 1635 and 1639 restricting foreign contact.

        The edicts forbade Japanese ships and subjects to go abroad and prescribed death for any Japanese who returned from overseas. They ordered that Christian priests and anyone sheltering them be reported and punished, offered rewards for informers, and required that arriving ships be searched for missionaries. Trade was to be conducted only at Nagasaki under official supervision, with the quantity of raw silk fixed by the authorities; in 1639 Portuguese ships were banned altogether, leaving only the Dutch (confined to the island of Dejima) and the Chinese. The stated reasons were the danger of Christianity to the state and the need to keep the daimyo from dealing with foreigners.
      prompt: |
        Review. The edicts' concern to keep the daimyo from foreign dealings belongs to the same Tokugawa strategy as which Unit 3 policy?
      options:
        - "The civil service examinations"
        - "Sankin-kotai, the compulsory alternate residence of daimyo in Edo with their families as hostages"
        - "The devshirme"
        - "The Table of Ranks"
      option_explanations:
        - |
          Examinations were Chinese; Japan did not use them.
        - |
          Correct. Both measures aimed to prevent regional lords from gaining independent resources or allies against the shogun.
        - |
          The devshirme was Ottoman recruitment of Christian boys.
        - |
          The Table of Ranks was Peter the Great's Russian reform.
      answer: 1
      explanation: |
        Spiral review of 3.2: foreign policy as a tool of domestic control.

    # ---- Set C: labour systems table (4.5)
    - slug: apworld-u04-w13-q07
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: coerced labour systems in the Americas, c. 1500–1750.

        | System | Who laboured | Basis of coercion | Where and when | Fate |
        |---|---|---|---|---|
        | Encomienda | Indigenous people | Royal grant of their labour and tribute to a colonist | Spanish America, 1500s | Curtailed by the New Laws (1542); replaced by repartimiento |
        | Colonial mit'a | Andean villagers | Rotating draft adapted from the Inca | Peru, from the 1570s | Fed Potosí for two centuries |
        | Hacienda peonage | Indigenous and mixed-race workers | Debt to the estate store | Spanish America, 1600s onward | Persisted into the 1900s |
        | Indentured servitude | Poor Europeans | Contract of four to seven years for passage | English colonies, 1600s | Declined after 1660 as slavery rose |
        | Chattel slavery | Africans and their descendants | Ownership as property, hereditary | Brazil, Caribbean, mainland colonies, 1500s–1800s | Grew to dominate plantation labour |
      prompt: |
        Which conclusion is best supported by the table?
      options:
        - "Coerced labour in the Americas declined steadily after 1542"
        - "Only Africans were ever coerced"
        - "Colonial economies relied on a succession and combination of coerced labour systems, with chattel slavery becoming dominant on plantations as Indigenous and indentured labour proved insufficient"
        - "The Inca mit'a was abolished by the Spanish"
      option_explanations:
        - |
          The encomienda was curtailed, but mit'a, peonage and slavery grew.
        - |
          Indigenous people and poor Europeans appear in three rows.
        - |
          Correct. The table shows systems replacing and overlapping one another, with slavery the plantation endpoint.
        - |
          The mit'a was adapted and intensified, not abolished.
      answer: 2
      explanation: |
        Topic 4.5 asks for continuity and change in labour; the table is the sequence.

