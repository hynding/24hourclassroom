week: 14
unit: 4
title: "Changing Social Hierarchies, and the Unit 4 Synthesis"
topics: ["4.7", "4.8"]
guide: guides/week-14.md
guide_description: |
  Study guide for week 14 (CED topics 4.7–4.8): how social hierarchies were maintained or changed between 1450 and 1750 (new merchant and creole elites, the Manchu displacement of Han officials, the casta system and racial hierarchies of the Americas, Indigenous intermediary elites, gender in colonial societies, and the treatment of Jews, Ottoman millets and Japanese Christians), followed by the Unit 4 synthesis of continuity and change in networks, economies, labour, states and societies. Describes the casta paintings, the Qing queue edict and the Ottoman reception of the Sephardim.
flashcards_description: |
  30 cards on topics 4.7–4.8: new and old elites, the casta categories, limpieza de sangre, Manchu–Han relations, Sephardic migration and the millets, hidden Christians, Indigenous nobles, gender in the colonies, and a continuity-and-change grid for the whole period.
flashcards:
  - front: "Three new elites of 1450–1750 and the source of each one's wealth"
    back: "Merchant shareholders and financiers (companies, silver, sugar); creoles of Spanish America (haciendas, mines, trade); Japanese merchants (lending to stipended samurai). All rose outside the old orders of land and birth."
    topic_code: "4.7"
  - front: "Creoles versus peninsulares → who and the grievance"
    back: "Creoles: Spaniards born in the Americas, owners of colonial wealth. Peninsulares: Spanish-born holders of the top offices (viceroys, judges, bishops). Creole exclusion from power fed the independence movements of Unit 5."
    hint: "Birthplace, not ancestry, divided them."
    topic_code: "4.7"
  - front: "Manchu displacement of Han elites → three measures"
    back: "Hereditary banner caste above the Han; half the top posts reserved for Manchus through quotas and dual appointments; the queue hairstyle imposed on Han men in 1645 as a mark of submission."
    topic_code: "4.7"
  - front: "Queue edict (1645) → content and meaning"
    back: "All Han men to shave the front of the head and braid the rest in Manchu style within ten days or die; enforced by massacre in Yangzi cities; it marked every Chinese subject's submission until 1911."
    topic_code: "4.7"
  - front: "Decline of the European nobility's independence → how and what they kept"
    back: "Monarchs turned lords into courtiers and officers (Versailles after the Fronde; Peter's Table of Ranks); nobles kept tax exemptions, precedence and local privilege. Taming, not abolition."
    topic_code: "4.7"
  - front: "Casta system → definition and top-to-bottom order"
    back: "Spanish colonial ranking by ancestry: peninsulares and creoles, then mestizos, mulattoes, Indigenous people, free and enslaved Africans, with dozens of intermediate named categories; rights, tribute and labour duties followed rank."
    topic_code: "4.7"
  - front: "Mestizo, mulatto, zambo → definitions"
    back: "Mestizo: Indigenous and European descent. Mulatto: African and European. Zambo: African and Indigenous. Casta paintings labelled such unions and their children."
    topic_code: "4.7"
  - front: "Why the casta categories were unstable in practice"
    back: "Wealth, marriage, occupation and appearance moved families across lines; officials and priests recorded categories inconsistently; the paintings' anxiety to classify shows a society that would not stay classified."
    topic_code: "4.7"
  - front: "Limpieza de sangre → origin and colonial afterlife"
    back: "'Purity of blood': Spanish statutes excluding converted Jews and Muslims and their descendants from offices and orders; carried to the Americas as the doctrine behind racial ranking."
    topic_code: "4.7"
  - front: "Casta paintings → what they are and what they show"
    back: "Eighteenth-century Mexican sets of sixteen panels, each a labelled family of mixed ancestry, painted for export to Spain; evidence of elite ideas of order, of dress and occupation by rank, and of anxiety about mixture."
    topic_code: "4.7"
  - front: "Racial hierarchy in the English colonies → how it differed from the Spanish"
    back: "A sharper two-way line: Virginia (1660s) made slavery hereditary through the mother and racial; free people of colour were few and restricted; no elaborate intermediate categories as in the casta system."
    topic_code: "4.7"
  - front: "Brazil's society → what made it distinctive"
    back: "Portuguese men, Indigenous women and enslaved Africans produced the most mixed population of the Americas, under a sugar slave regime as harsh as any; manumission was more common than in English colonies."
    topic_code: "4.7"
  - front: "Indigenous elites under Spanish rule → caciques and kurakas"
    back: "Native nobles confirmed in rank, land and tribute exemption in return for delivering their communities' labour and taxes; intermediaries who were both protectors and exploiters of their people."
    topic_code: "4.7"
  - front: "Gender in Spanish America → three patterns"
    back: "Patriarchal law and Church; a shortage of Spanish women produced unions with Indigenous and African women from which the castas descended; convents gave some creole women education and property; Indigenous women dominated markets."
    topic_code: "4.7"
  - front: "Gender effects of the slave trade in Africa"
    back: "Export of mostly men left women to farm and raised polygyny; women's agricultural labour increased; some female rulers and traders (Nzinga; the signares of Senegal) gained prominence."
    topic_code: "4.7"
  - front: "Expulsion of the Jews from Spain (1492) → causes and where they went"
    back: "Ferdinand and Isabella, completing the Reconquista, ordered conversion or exile; Sephardim went to the Ottoman Empire (Salonika, Istanbul), North Africa, Italy and after 1600 Amsterdam; Portugal followed in 1497."
    topic_code: "4.7"
  - front: "Ottoman reception of the Sephardim → what it shows"
    back: "Bayezid II welcomed the exiles as physicians, printers and merchants; Ottoman chroniclers record his scorn for a king who impoverished his own realm; religious minorities were assets to be used."
    topic_code: "4.7"
  - front: "Millet system → definition and logic"
    back: "Ottoman self-governing religious communities (Orthodox, Armenian, Jewish) under their own clergy, running their own courts, schools and tax collection; tolerated, subordinate, taxed (jizya) and useful."
    topic_code: "4.7"
  - front: "Christians in Japan after 1614 → fate"
    back: "Missionaries expelled, converts executed or forced to recant by trampling images; the Shimabara rebellion (1637–1638) crushed; hidden Christians (Kakure Kirishitan) kept the faith secretly for over two centuries."
    topic_code: "4.7"
  - front: "Moriscos → who and what happened in 1609"
    back: "Spain's converted Muslims and their descendants, suspected of secret Islam and Ottoman sympathy; some 300,000 expelled to North Africa in 1609–1614."
    topic_code: "4.7"
  - front: "Pattern in the treatment of minorities, 1450–1750"
    back: "States used religion to define belonging; minorities were tolerated and taxed where useful (Ottoman millets, Dutch Amsterdam, Akbar's India) and expelled or persecuted where ideology or fear prevailed (Spain, Japan, Aurangzeb's India)."
    topic_code: "4.7"
  - front: "Continuity in trade networks across 1450–1750"
    back: "The Indian Ocean, Silk Road and trans-Saharan routes continued, and Asian merchants kept most of their trade; Europeans added the Atlantic and Pacific and became the connectors between all of them."
    topic_code: "4.8"
  - front: "Where the world's economic centre lay in 1750"
    back: "Still in Asia: China and India produced most manufactured goods and absorbed most of the world's silver; Europe's new wealth came from being the intermediary and from the Americas."
    topic_code: "4.8"
  - front: "Continuity and change in labour, 1450–1750"
    back: "Continuity: peasant agriculture, serfdom, mit'a, African and Islamic slavery. Change: plantation chattel slavery, indenture and a transatlantic trade on an unprecedented scale."
    topic_code: "4.8"
  - front: "Continuity and change in states, 1450–1750"
    back: "Continuity: the land empires of Unit 3 ruled Eurasia and were little affected by Europeans. Change: maritime empires and chartered companies ruled the oceans and the Americas; the Aztec and Inca states were destroyed."
    topic_code: "4.8"
  - front: "Continuity and change in social hierarchies, 1450–1750"
    back: "Continuity: Confucian, caste, feudal and Islamic orders. Change: racial hierarchies in the Americas, creole and merchant elites, Manchu rule over Han, stipended samurai."
    topic_code: "4.8"
  - front: "Continuity and change in religion, 1450–1750"
    back: "Continuity: Islam, Hinduism, Buddhism and Confucianism in their regions. Change: Christianity carried to the Americas, the Philippines and parts of Africa and Asia; Western Christianity divided."
    topic_code: "4.8"
  - front: "The biggest change of the period → one sentence"
    back: "The Columbian Exchange and the Atlantic system joined the hemispheres for the first time, reshaping population, diet, disease and labour on every continent."
    topic_code: "4.8"
  - front: "What the period did NOT do → the CED's caution"
    back: "It did not make Europe dominant; Asia remained the economic centre and the land empires were untouched. It created the connections and hierarchies on which later European dominance (Unit 6) was built."
    topic_code: "4.8"
  - front: "How to answer a 4.8 continuity-and-change question"
    back: "Name the pattern (trade, labour, state, society, environment, religion); state one continuity and one change with a specific example each; explain the cause of the change and why the continuity persisted."
    topic_code: "4.8"
quiz:
  description: |
    Week 14 quiz on CED topics 4.7–4.8 with spiral review of Units 1–3 and topics 4.1–4.6 · 24 questions · about 40 minutes. Stimulus sets use a described casta painting series, a described account of the Sephardic expulsion and reception, and a continuity-and-change table for 1450–1750. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: casta paintings described (4.7)
    - slug: apworld-u04-w14-q01
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge; the casta paintings are described, not reproduced"
      points: 1
      stimulus: |
        Description written for this course of a set of casta paintings made in Mexico City in the 1760s.

        Sixteen panels each show a man, a woman and a child in a domestic or working setting, with a painted label naming the parents' categories and the child's: 'Spaniard and Indian produce Mestizo'; 'Spaniard and Mestiza produce Castizo'; 'Spaniard and Black produce Mulatto'; 'Black and Indian produce Lobo', and so on through combinations of increasing rarity. Families nearer the Spanish end are shown in fine European clothes in furnished rooms; those at the African and Indigenous end in simpler dress at trades or in kitchens, sometimes quarrelling. The sets were commissioned by officials and merchants and sent to Spain as curiosities and records of the colonial order.
      prompt: |
        The paintings are best used as evidence of
      options:
        - "the exact demographic proportions of New Spain"
        - "the absence of racial mixing in Spanish America"
        - "how the colonial elite conceived and wished to display a hierarchy of ancestry, status and behaviour"
        - "the legal equality of all subjects under Spanish law"
      option_explanations:
        - |
          Paintings depict ideal types, not census data.
        - |
          The paintings exist because mixing was universal.
        - |
          Correct. The genre records an elite's idea of order, linking ancestry to dress, work and conduct, for a Spanish audience.
        - |
          Spanish law assigned different duties and rights by category.
      answer: 2
      explanation: |
        Sourcing: patron and audience (officials, Spain) explain the paintings' message.

    - slug: apworld-u04-w14-q02
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge; the casta paintings are described, not reproduced"
      points: 1
      stimulus: |
        Description written for this course of a set of casta paintings made in Mexico City in the 1760s.

        Sixteen panels each show a man, a woman and a child in a domestic or working setting, with a painted label naming the parents' categories and the child's: 'Spaniard and Indian produce Mestizo'; 'Spaniard and Mestiza produce Castizo'; 'Spaniard and Black produce Mulatto'; 'Black and Indian produce Lobo', and so on through combinations of increasing rarity. Families nearer the Spanish end are shown in fine European clothes in furnished rooms; those at the African and Indigenous end in simpler dress at trades or in kitchens, sometimes quarrelling. The sets were commissioned by officials and merchants and sent to Spain as curiosities and records of the colonial order.
      prompt: |
        The sequence 'Spaniard and Mestiza produce Castizo' (and, in such series, 'Spaniard and Castiza produce Spaniard') suggests that in the casta system
      options:
        - "categories were purely biological and could never change"
        - "Indigenous ancestry was valued above Spanish"
        - "Africans could never appear in the paintings"
        - "repeated marriage toward the Spanish end could, in the elite's scheme, restore 'Spanish' status within generations, showing that the hierarchy was social as much as biological"
      option_explanations:
        - |
          The series itself shows categories changing across generations.
        - |
          The scheme placed Spanish ancestry on top.
        - |
          African ancestry appears in many panels.
        - |
          Correct. The scheme allowed ascent toward 'Spaniard' through marriage, a social ladder dressed as biology.
      answer: 3
      explanation: |
        The casta system ranked people, but its own rules admitted mobility.

    - slug: apworld-u04-w14-q03
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge; the casta paintings are described, not reproduced"
      points: 1
      stimulus: |
        Description written for this course of a set of casta paintings made in Mexico City in the 1760s.

        Sixteen panels each show a man, a woman and a child in a domestic or working setting, with a painted label naming the parents' categories and the child's: 'Spaniard and Indian produce Mestizo'; 'Spaniard and Mestiza produce Castizo'; 'Spaniard and Black produce Mulatto'; 'Black and Indian produce Lobo', and so on through combinations of increasing rarity. Families nearer the Spanish end are shown in fine European clothes in furnished rooms; those at the African and Indigenous end in simpler dress at trades or in kitchens, sometimes quarrelling. The sets were commissioned by officials and merchants and sent to Spain as curiosities and records of the colonial order.
      prompt: |
        Review. The presence of African ancestry in the paintings reflects which development of topics 4.3–4.5?
      options:
        - "The migration of free Africans to Mexico as merchants"
        - "The importation of enslaved Africans to replace an Indigenous workforce devastated by disease"
        - "The conquest of Mexico by an African army"
        - "The Columbian Exchange's transfer of crops"
      option_explanations:
        - |
          Africans in New Spain were overwhelmingly brought as slaves.
        - |
          Correct. Demographic collapse and the slave trade put Africans in Mexico, and intermarriage put them in the paintings.
        - |
          No such casta army existed; the paintings record household and market scenes, not military units.
        - |
          Crops do not explain the mixed human ancestry the paintings label; the subject is people, not plants.
      answer: 1
      explanation: |
        Spiral review of 4.3 and 4.5: the social order of 4.7 grew from the exchange and the slave trade.

    # ---- Set B: Sephardim described (4.7)
    - slug: apworld-u04-w14-q04
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge; the expulsion edict and Ottoman chronicles are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the expulsion of the Jews from Spain and their reception in the Ottoman Empire.

        In March 1492, weeks after the fall of Granada, Ferdinand and Isabella decreed that all Jews must accept baptism or leave Spain within four months, taking no gold or silver; perhaps 100,000 to 200,000 left, many to Portugal (which expelled or forcibly converted them in 1497), North Africa, Italy and the Ottoman Empire. Ottoman chroniclers record that Sultan Bayezid II ordered his governors to receive the exiles and reportedly mocked the Spanish king for impoverishing his own realm to enrich the sultan's. Sephardic communities in Salonika, Istanbul and Safed became printers, physicians, textile makers and merchants; a century later their descendants helped found the Jewish community of Amsterdam, where they financed Dutch trade.
      prompt: |
        The contrast between Spanish and Ottoman policy toward Jews is best explained by
      options:
        - "Ottoman ignorance of religion"
        - "the greater wealth of Spain"
        - "Spain's drive for religious uniformity after the Reconquista versus the Ottoman practice of governing useful religious minorities as taxed, self-governing communities"
        - "an alliance between Spain and the Ottomans"
      option_explanations:
        - |
          The Ottomans were a self-consciously Islamic empire; their policy was deliberate.
        - |
          Wealth did not dictate policy; Spain expelled productive subjects.
        - |
          Correct. One state defined belonging by one faith; the other used the millet model to profit from diversity.
        - |
          Spain and the Ottomans were enemies in the Mediterranean.
      answer: 2
      explanation: |
        Topic 4.7 asks how states treated minorities; the two models are the answer.

    - slug: apworld-u04-w14-q05
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge; the expulsion edict and Ottoman chronicles are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the expulsion of the Jews from Spain and their reception in the Ottoman Empire.

        In March 1492, weeks after the fall of Granada, Ferdinand and Isabella decreed that all Jews must accept baptism or leave Spain within four months, taking no gold or silver; perhaps 100,000 to 200,000 left, many to Portugal (which expelled or forcibly converted them in 1497), North Africa, Italy and the Ottoman Empire. Ottoman chroniclers record that Sultan Bayezid II ordered his governors to receive the exiles and reportedly mocked the Spanish king for impoverishing his own realm to enrich the sultan's. Sephardic communities in Salonika, Istanbul and Safed became printers, physicians, textile makers and merchants; a century later their descendants helped found the Jewish community of Amsterdam, where they financed Dutch trade.
      prompt: |
        The later migration of Sephardic descendants to Amsterdam is best connected to
      options:
        - "the rise of the Dutch Republic as a commercial centre tolerant of religious minorities, where merchant capital was welcome"
        - "the Dutch conversion to Islam"
        - "an Ottoman expulsion of Jews"
        - "the Spanish conquest of the Netherlands"
      option_explanations:
        - |
          Correct. Amsterdam's rise (fluyt, VOC, Bank of Amsterdam) drew Sephardic and other merchant communities that Catholic Spain excluded.
        - |
          The Dutch Republic was Calvinist in its public church, so this description is simply wrong.
        - |
          The Ottomans did not expel Jews; migration followed opportunity.
        - |
          The Dutch revolted against Spain; Spanish persecution pushed people toward, not from, Amsterdam.
      answer: 0
      explanation: |
        New merchant elites (4.7) and the Dutch empire (4.4) intersect here.

    - slug: apworld-u04-w14-q06
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge; the expulsion edict and Ottoman chronicles are described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of the expulsion of the Jews from Spain and their reception in the Ottoman Empire.

        In March 1492, weeks after the fall of Granada, Ferdinand and Isabella decreed that all Jews must accept baptism or leave Spain within four months, taking no gold or silver; perhaps 100,000 to 200,000 left, many to Portugal (which expelled or forcibly converted them in 1497), North Africa, Italy and the Ottoman Empire. Ottoman chroniclers record that Sultan Bayezid II ordered his governors to receive the exiles and reportedly mocked the Spanish king for impoverishing his own realm to enrich the sultan's. Sephardic communities in Salonika, Istanbul and Safed became printers, physicians, textile makers and merchants; a century later their descendants helped found the Jewish community of Amsterdam, where they financed Dutch trade.
      prompt: |
        Review. Spain's expulsion of 1492 belongs to the same policy of religious uniformity as which later European measure studied in Unit 3?
      options:
        - "The Peace of Westphalia"
        - "Akbar's abolition of the jizya"
        - "The Ottoman millet system"
        - "Louis XIV's revocation of the Edict of Nantes (1685), which drove Protestants from France"
      option_explanations:
        - |
          Westphalia accepted religious plurality between states.
        - |
          Akbar's measure was inclusion, the opposite policy.
        - |
          The millets are the Ottoman model of toleration contrasted in the passage.
        - |
          Correct. Both monarchs sacrificed productive subjects for one faith under one crown, and both enriched their rivals.
      answer: 3
      explanation: |
        Spiral review of 3.3: religious uniformity as state policy across the period.

    # ---- Set C: continuity and change table (4.8)
    - slug: apworld-u04-w14-q07
      type: multiple_choice
      topic_code: "4.8"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: continuity and change, c. 1450–c. 1750.

        | Pattern | Continuity | Change |
        |---|---|---|
        | Trade networks | Indian Ocean, Silk Roads, trans-Saharan routes continue; Asian merchants keep most trade | Atlantic and Pacific routes created; Europeans link all oceans |
        | Economic centre | China and India remain the largest producers and absorb most silver | Europe becomes the intermediary; global silver economy |
        | Labour | Peasant farming, serfdom, mit'a, Islamic and African slavery persist | Plantation chattel slavery, indenture, Atlantic slave trade |
        | States | Land empires rule Eurasia, untouched by Europeans | Maritime empires and companies rule oceans and the Americas; Aztec and Inca destroyed |
        | Societies | Confucian, caste, feudal, Islamic orders persist | Racial hierarchies in the Americas; creole and merchant elites; Manchu over Han |
        | Environment | Old World farming spreads | Columbian Exchange reshapes diet, disease and population everywhere |
      prompt: |
        The table best supports which overall judgement about the period?
      options:
        - "Europe had become the dominant power in the world by 1750"
        - "Nothing of importance changed between 1450 and 1750"
        - "The period created new global connections and hierarchies while the established economies and states of Asia remained central and largely unaffected"
        - "Asia declined sharply because of European trade"
      option_explanations:
        - |
          The 'Economic centre' and 'States' rows show Asia still central and the land empires untouched.
        - |
          The 'Change' column is full of entries, so the table does not argue that nothing changed.
        - |
          Correct. Every row pairs a real change (mostly in the Atlantic world) with a persistent Asian or agrarian pattern.
        - |
          Asia absorbed silver and grew; decline came later (Unit 6).
      answer: 2
      explanation: |
        Topic 4.8's judgement: connection without yet domination.

    - slug: apworld-u04-w14-q08
      type: multiple_choice
      topic_code: "4.8"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: continuity and change, c. 1450–c. 1750.

        | Pattern | Continuity | Change |
        |---|---|---|
        | Trade networks | Indian Ocean, Silk Roads, trans-Saharan routes continue; Asian merchants keep most trade | Atlantic and Pacific routes created; Europeans link all oceans |
        | Economic centre | China and India remain the largest producers and absorb most silver | Europe becomes the intermediary; global silver economy |
        | Labour | Peasant farming, serfdom, mit'a, Islamic and African slavery persist | Plantation chattel slavery, indenture, Atlantic slave trade |
        | States | Land empires rule Eurasia, untouched by Europeans | Maritime empires and companies rule oceans and the Americas; Aztec and Inca destroyed |
        | Societies | Confucian, caste, feudal, Islamic orders persist | Racial hierarchies in the Americas; creole and merchant elites; Manchu over Han |
        | Environment | Old World farming spreads | Columbian Exchange reshapes diet, disease and population everywhere |
      prompt: |
        Which row shows the greatest change for the Americas and the least for Eurasia's land empires?
      options:
        - "Trade networks"
        - "States"
        - "Economic centre"
        - "Environment"
      option_explanations:
        - |
          Trade changed everywhere, including Eurasia's new connections.
        - |
          Correct. The Aztec and Inca states were destroyed and replaced by European rule, while the Ming, Mughals and Ottomans were untouched.
        - |
          The economic centre stayed in Asia; the change was Europe's new role.
        - |
          The Columbian Exchange changed Eurasia too (maize, potatoes, population growth).
      answer: 1
      explanation: |
        Comparison within continuity and change: the same period hit regions very differently.

