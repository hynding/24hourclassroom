    # ---- Standalone new content
    - slug: apworld-u04-w14-q10
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The exclusion of creoles from the highest offices in Spanish America, reserved for peninsulares, had which long-term consequence?
      options:
        - "Creoles emigrated to Spain in large numbers"
        - "Creoles converted to Protestantism"
        - "The crown abolished the viceroyalties"
        - "A wealthy American-born elite came to see itself as the rightful ruler of its lands, a resentment that fed the independence movements after 1808"
      option_explanations:
        - |
          Creoles stayed; their wealth and identity were American.
        - |
          Creoles were Catholic throughout the period; religion did not separate them from peninsulares.
        - |
          Viceroyalties lasted until independence.
        - |
          Correct. The creole grievance is the social root of Bolívar's and San Martín's revolutions (Unit 5).
      answer: 3
      explanation: |
        New elites of 4.7 become the revolutionaries of Unit 5.

    - slug: apworld-u04-w14-q11
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Spain's confirmation of Indigenous nobles (caciques and kurakas) in their rank and privileges is best explained by
      options:
        - "Spanish belief in Indigenous equality"
        - "an alliance against Portugal"
        - "the colonial state's need for intermediaries who could deliver tribute and labour from communities that Spaniards could not govern directly"
        - "the Inca conquest of Spain"
      option_explanations:
        - |
          Spanish law ranked Indigenous people below Spaniards; the arrangement was practical, not egalitarian.
        - |
          Portugal was irrelevant to Andean or Mexican local rule.
        - |
          Correct. A few thousand Spaniards ruled millions through native elites who kept their standing by serving the new masters.
        - |
          The reverse occurred: caciques kept local authority precisely because Spain governed through them.
      answer: 2
      explanation: |
        Indirect rule through existing elites is a continuity between Indigenous empires and Spanish rule.

    - slug: apworld-u04-w14-q12
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly compares the position of merchants in Tokugawa Japan and in the Dutch Republic?
      options:
        - "In both, merchants held the highest political offices"
        - "In both, merchants were expelled"
        - "In Japan merchants were nobles; in the Netherlands they were serfs"
        - "In Japan merchants ranked lowest in Confucian theory yet grew rich lending to samurai, while in the Dutch Republic merchant regents governed the state directly"
      option_explanations:
        - |
          Japanese merchants held no offices; Dutch merchants did.
        - |
          Neither state expelled its merchants; Tokugawa Japan restricted foreign trade, not domestic commerce.
        - |
          Neither description is accurate; the contrast lay in political standing, not in economic success.
        - |
          Correct. The same economic rise met opposite political treatment.
      answer: 3
      explanation: |
        The rise of merchant elites was global; their political status varied by society.

