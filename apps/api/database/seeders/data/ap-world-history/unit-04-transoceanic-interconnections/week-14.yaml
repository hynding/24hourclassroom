      points: 1
      prompt: |
        Review. The Qing requirement that Han men wear the queue and the Mughal reinstatement of the jizya under Aurangzeb are best compared as:
      options:
        - "Measures that each abolished a hereditary elite in favour of examination-based recruitment"
        - "Visible marks of a ruling minority's dominance that generated resentment among a subject majority"
        - "Economic policies that reserved long-distance trade for the dynasty's own ethnic group"
        - "Religious reforms that merged the ruling and subject populations into one faith"
      option_explanations:
        - |
          Neither measure abolished a hereditary elite; both dynasties kept their nobilities and the Qing kept the examinations.
        - |
          Correct. The queue marked Han submission to Manchu rule; the jizya marked non-Muslim subjects under a Muslim dynasty. Both bred resentment that later rebellions used.
        - |
          Neither measure concerned trade; they concerned hairstyles and a tax on non-Muslims.
        - |
          Neither merged faiths; the Manchus kept their own identity and Aurangzeb hardened the line between Muslim and non-Muslim.
      answer: 1
      explanation: |
        Spiral review of 3.2: both empires used symbolic and fiscal markers to express minority rule.

