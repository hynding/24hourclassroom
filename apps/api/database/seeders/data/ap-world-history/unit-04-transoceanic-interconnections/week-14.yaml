    # ---- Short answer
    - slug: apworld-u04-w14-q22
      type: short_answer
      topic_code: "4.7"
      source: "general knowledge; the Spanish expulsion and the Ottoman reception are described, not quoted"
      points: 3
      prompt: |
        In 1492 the Catholic monarchs ordered Jews to convert or leave Spain. Tens of thousands sailed for North Africa, Italy and the Ottoman Empire, where Bayezid II is reported to have welcomed them and allowed them to settle in Salonica, Istanbul and Izmir under the millet system.

        (a) Identify ONE reason a state in this period restricted or expelled a religious minority.
        (b) Explain ONE reason the Ottoman Empire accepted the people Spain expelled.
        (c) Explain ONE way the treatment of minorities in Spanish America differed from the treatment of minorities in the Ottoman Empire.
      answer: |
        (a) 1 point: religious uniformity as a basis of royal legitimacy after the Reconquista; fear that Jews would encourage conversos to return to Judaism; pressure from the Inquisition and the clergy; confiscation of property; a similar logic in Tokugawa Japan (Christianity seen as the advance guard of conquest and a bond among rebellious daimyo).
        (b) 1 point with explanation: the millet system already governed Christians and Jews as taxpaying communities, so newcomers fit an existing structure; Sephardic artisans, physicians, printers and merchants brought skills and Mediterranean trade contacts; a larger taxpaying population strengthened the treasury; religious toleration of People of the Book was Islamic law and Ottoman custom.
        (c) 1 point with explanation: Spanish America ranked people by ancestry and appearance (the casta system, limpieza de sangre) and required Catholic conformity, with the Inquisition reaching Lima and Mexico City; the Ottomans ranked by religion but allowed each community self-government and did not try to convert Christians and Jews, though non-Muslims paid the jizya and faced legal disabilities. Alternatively: Spanish colonial society made converted Indigenous people and Africans a permanent lower order, whereas Ottoman conversion to Islam brought full legal status.
      explanation: |
        Scoring: one point per part. (b) and (c) need an explanation of why or how, not a bare statement.

    - slug: apworld-u04-w14-q23
      type: short_answer
      topic_code: "4.8"
      source: "general knowledge; interpretation written for this course"
      points: 3
      prompt: |
        "Between 1450 and 1750 the world's economic centre of gravity did not move; it stayed in Asia. What changed was the number of routes by which silver reached it."

        (a) Identify ONE piece of evidence that supports the claim that Asia remained the economic centre of the world in this period.
        (b) Explain ONE way the development of transoceanic routes changed economic life in a region outside Asia.
        (c) Explain ONE way an existing network of exchange studied in Unit 2 continued to operate after 1500.
      answer: |
        (a) 1 point: most American silver flowed to China through Manila and through Europe's purchases of Asian goods; China's demand for silver (single whip tax) set the price of silver; Indian cotton and Chinese porcelain and silk were the goods the Europeans sailed to buy; Mughal India and Ming/Qing China held the largest populations and manufacturing output.
        (b) 1 point with explanation: the Americas were tied to a plantation and mining economy, with enslaved African and coerced Indigenous labour producing silver and sugar for export; West African coastal states reoriented toward the Atlantic slave trade and imported guns and cloth; Western Europe saw merchant and financial elites rise through joint-stock companies, price inflation from silver, and new consumption of sugar, tobacco and coffee.
        (c) 1 point with explanation: the Indian Ocean network kept its monsoon rhythm and its Gujarati, Arab, Swahili and Chinese merchants, with the Portuguese taxing rather than replacing it; the Silk Roads continued under the Ottomans, Safavids and Mughals, carrying silk, horses and tea; the trans-Saharan trade continued to carry gold, salt and captives between the Sahel and North Africa even as some gold went to the coast.
      explanation: |
        Scoring: one point per part. The claim is a historian's interpretation written for this course; the student must support, change or qualify it with evidence.

    # ---- Long answer
    - slug: apworld-u04-w14-q24
      type: long_answer
      topic_code: "4.8"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which the social hierarchies of the world's societies changed between c. 1450 and c. 1750.

        Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both continuity and change. Draw on at least two regions.
      answer: |
        Thesis (1 point): a defensible claim about extent, for example that new elites built on commerce and conquest rose everywhere, and that the Americas saw the creation of a wholly new racial hierarchy, while older orders of birth, land and religion persisted and in several empires were reinforced.
        Contextualisation (1 point): the maritime and land-based empires of Units 3 and 4; the silver and slave trades; the Columbian Exchange; the Reformation and the religious conformity of the confessional states; the Manchu conquest of China.
        Evidence (2 points): at least two specific examples, for example creoles and peninsulares; the casta paintings and limpieza de sangre; the queue and the displacement of Han officials by bannermen; the expulsion of Jews from Spain and their reception in the Ottoman millets; hidden Christians in Japan; the rise of Japanese merchants beneath the samurai; European merchant and financial elites in Amsterdam and London; the Boyars under Peter the Great; Indigenous caciques and Aztec nobles as intermediaries; gender ratios in colonial societies and the role of Indigenous and African women.
        Analysis and reasoning (1 point): uses continuity and change to show what was new (racial hierarchy, commercial elites, Manchu minority rule) and what persisted (hereditary nobilities, religious hierarchy, patriarchal households, coerced labour at the bottom).
        Complexity (1 point): compares regions (the Americas' new order versus Asia's modified order), shows change within the period (Han officials gradually readmitted; creoles growing richer and angrier), connects social change to economic causes (silver, sugar, the slave trade), or weighs who gained against who lost.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay confined to one region or to change alone caps at 4.
