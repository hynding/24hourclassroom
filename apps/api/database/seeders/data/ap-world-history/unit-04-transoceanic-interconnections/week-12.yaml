    # ---- Short answer
    - slug: apworld-u04-w12-q22
      type: short_answer
      topic_code: "4.3"
      source: "Primary source: Bartolomé de Las Casas, A Brief Account of the Destruction of the Indies (1552), English edition of 1689, Project Gutenberg"
      points: 3
      prompt: |
        Las Casas wrote in 1552 that "of Three Millions of Persons, which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce Three Hundred" (English edition of 1689).

        (a) Identify ONE cause of the population decline Las Casas describes.
        (b) Explain ONE effect of the demographic collapse of the Americas on the development of European empires there.
        (c) Explain ONE reason a historian should be cautious about Las Casas's figures.
      answer: |
        (a) 1 point: epidemic disease (smallpox, measles, influenza) among a population without immunity; forced labour in mines and fields under the encomienda; warfare and massacre; famine and the disruption of food production; the separation of men and women.
        (b) 1 point with explanation: labour shortages led Europeans to import enslaved Africans for plantations and mines; depopulated land was taken for Spanish estates and ranches; the Spanish crown replaced the encomienda with the repartimiento and mit'a drafts; the collapse of Indigenous states made conquest and missionary conversion easier; abandoned land reverted to forest.
        (c) 1 point: he wrote to persuade the king to abolish the encomienda and so exaggerated; he had no census and estimated; his round numbers are rhetorical; later Protestant editions amplified his claims for anti-Spanish purposes; he attributed deaths to cruelty and ignored disease.
      explanation: |
        Scoring: one point per part. (b) must link collapse to a change in empire; (c) must connect caution to Las Casas's purpose or method.

    - slug: apworld-u04-w12-q23
      type: short_answer
      topic_code: "4.4"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE difference between the Portuguese and Spanish maritime empires in the sixteenth century.
        (b) Explain ONE way the Dutch and English empires of the seventeenth century differed in organisation from the Iberian empires.
        (c) Explain ONE way Asian or African states or merchants limited European power in the Indian Ocean before 1750.
      answer: |
        (a) 1 point: Portugal built fortified trading posts and taxed sea trade in Africa and Asia; Spain conquered territory and populations in the Americas and ruled through viceroys; Portugal's wealth was spices and later Brazilian sugar, Spain's was silver; Portugal's empire was a chain of ports, Spain's a continent.
        (b) 1 point with explanation: the Dutch and English worked through chartered joint-stock companies (VOC, East India Company) owned by private shareholders and granted state powers of war and government, so profit rather than crown or Church directed them; the Iberian empires were run by the crown, its viceroys and the Church with conversion as a stated aim.
        (c) 1 point with explanation: the Omani sultanate expelled the Portuguese from Muscat and Mombasa; the Mughals, Ming and Ottomans were untouched and could expel or tax Europeans at will; Asian merchants evaded the Portuguese pass system and kept most of the trade; Tokugawa Japan restricted Europeans to Nagasaki; Ming and Qing China confined trade to Macau and Canton; the Ottomans fought Portugal in the Red Sea.
      explanation: |
        Scoring: one point per part; (b) and (c) require explanation of how the difference or limit operated.

    # ---- Long answer
    - slug: apworld-u04-w12-q24
      type: long_answer
      topic_code: "4.3"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which the Columbian Exchange changed societies in the Americas and in Afro-Eurasia differently in the period c. 1492 to c. 1750.

        Write a complete essay with a thesis, context, specific evidence for both hemispheres, and reasoning that compares the effects.
      answer: |
        Thesis (1 point): a defensible claim about extent, for example that the exchange was catastrophic and transformative for the Americas (demographic collapse, new peoples, new animals, new rulers) while for Afro-Eurasia it was enriching and gradual (new staples, population growth, silver), so the difference was one of direction and scale rather than of kind.
        Contextualisation (1 point): the isolation of the Americas before 1492; the Unit 2 networks and the Black Death; the Unit 3 gunpowder advantage; the voyages of 4.2.
        Evidence (2 points): at least two specific examples from each hemisphere, for example smallpox at Tenochtitlan and among the Inca; Las Casas on Hispaniola; horses on the Plains; cattle ranching; sugar plantations and enslaved Africans; maize and sweet potatoes in Qing China; potatoes in Ireland and Prussia; cassava in Africa; Potosí silver reaching China; deforestation and soil exhaustion.
        Analysis and reasoning (1 point): uses comparison or causation to explain why effects differed (immunity, demography, who controlled the exchange).
        Complexity (1 point): notes effects within hemispheres (Africa suffered the slave trade while gaining maize and cassava; Europe gained crops but lost people to emigration), long-term versus short-term change, or environmental as well as human effects.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that treats only the Americas cannot earn full evidence points.
