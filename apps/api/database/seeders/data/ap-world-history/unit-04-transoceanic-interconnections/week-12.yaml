        - |
          Religious conversion is a cultural consequence.
      answer: 0
      explanation: |
        Spiral review of 2.6: the Black Death and the American epidemics belong to the same category of cause and effect.

    # ---- Standalone new content
    - slug: apworld-u04-w12-q10
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The Portuguese empire in the Indian Ocean differed from the Spanish empire in the Americas chiefly in that Portugal
      options:
        - "conquered large populations and ruled them through viceroys"
        - "sent no armed ships to Asia"
        - "relied entirely on Indigenous allies"
        - "held a chain of fortified ports and taxed passing trade rather than governing territory"
      option_explanations:
        - |
          That describes Spain in Mexico and Peru.
        - |
          Cannon-armed carracks were the basis of the whole system.
        - |
          Local allies mattered, but the method was naval force at chokepoints.
        - |
          Correct. Goa, Malacca, Hormuz and Macau were forts controlling sea lanes; Portugal lacked the people to do more.
      answer: 3
      explanation: |
        Trading-post versus territorial empire is the basic 4.4 comparison.

    - slug: apworld-u04-w12-q11
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The Manila galleon trade established in 1571 is best described as
      options:
        - "an annual exchange of American silver for Chinese silk and porcelain across the Pacific, linking Spain's empire to the Chinese economy"
        - "a route carrying African slaves to the Philippines"
        - "a Portuguese monopoly on spices"
        - "a Dutch route to Japan"
      option_explanations:
        - |
          Correct. Mexican silver went west from Acapulco; Chinese goods came east; China's silver demand (Unit 3) drew the metal.
        - |
          Enslaved Africans were carried across the Atlantic, not the Pacific.
        - |
          Portugal's spice trade ran around Africa, not across the Pacific.
        - |
          The Dutch reached Japan via Batavia; the galleon was Spanish.
      answer: 0
      explanation: |
