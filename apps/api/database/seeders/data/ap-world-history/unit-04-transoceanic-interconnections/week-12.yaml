week: 12
unit: 4
title: "The Columbian Exchange and the First Maritime Empires"
topics: ["4.3", "4.4"]
guide: guides/week-12.md
guide_description: |
  Study guide for week 12 (CED topics 4.3–4.4): the Columbian Exchange of diseases, animals and crops in both directions and its demographic and environmental effects; and the establishment of maritime empires: Portugal's trading posts, Spain's conquest of the Aztec and Inca empires with disease and Indigenous allies, the Manila galleons, the Dutch, English and French chartered companies and colonies, and the Asian and Omani merchants who kept trading. Reads Las Casas closely and describes Bernal Díaz and Cieza de León.
flashcards_description: |
  30 cards on topics 4.3–4.4: the transfers of the Columbian Exchange and their effects, the causes of the Spanish conquests, the methods of the Portuguese, Spanish, Dutch, English and French empires, and the continuities of Asian trade.
flashcards:
  - front: "Why Afro-Eurasian diseases devastated the Americas but not the reverse"
    back: "Afro-Eurasia's dense cities and domesticated herds had bred crowd diseases over millennia and given survivors immunity; the Americas, isolated for ten thousand years with few herd animals, had neither the diseases nor the immunity."
    topic_code: "4.3"
  - front: "Smallpox in the conquests → two decisive moments"
    back: "Struck Tenochtitlan in 1520 during Cortés's siege, killing the emperor Cuitláhuac; killed the Inca Huayna Capac and his heir around 1527, causing the succession war Pizarro exploited."
    topic_code: "4.3"
  - front: "Scale of the demographic collapse in the Americas"
    back: "Perhaps ninety per cent of the Indigenous population died in the century after 1492, from disease above all, with war, forced labour and famine; the Taino of Hispaniola nearly vanished within thirty years."
    topic_code: "4.3"
  - front: "Animals carried to the Americas → five and one effect"
    back: "Horses, cattle, pigs, sheep, chickens. Horses remade Plains and Pampas societies; cattle and sheep turned grasslands into ranches and trampled Indigenous fields."
    topic_code: "4.3"
  - front: "Crops carried to the Americas → from Europe and from Africa"
    back: "Europe: wheat, barley, sugar, grapes, olives, citrus, rice. Africa (with the slave trade): okra, yams, African rice varieties and the knowledge to grow them in the Carolinas and Brazil."
    topic_code: "4.3"
  - front: "Crops carried from the Americas → five and where each mattered"
    back: "Maize (Africa, southern Europe, China); potato (northern Europe, Ireland); cassava (West and Central Africa); tomato and pepper (Mediterranean, India); cacao and tobacco (Europe)."
    hint: "Think of what China and Ireland ate by 1800."
    topic_code: "4.3"
  - front: "American crops and Afro-Eurasian population growth → the link"
    back: "Maize, potatoes and sweet potatoes grew on poor or hilly land and yielded more calories per acre than wheat or millet; Qing China's population roughly doubled, and European populations rose, partly on these foods."
    topic_code: "4.3"
  - front: "Sugar's path from Unit 2 to Unit 4"
    back: "Muslim farmers to the Mediterranean; Portuguese to Madeira and São Tomé with enslaved labour; then Brazil (1530s) and the Caribbean (1640s): the plantation complex that drove the Atlantic slave trade."
    topic_code: "4.3"
  - front: "Environmental effects of the Columbian Exchange → four"
    back: "Deforestation for sugar and tobacco; soil exhaustion on plantations; mercury pollution from silver refining at Potosí; grazing animals and European weeds transforming grasslands; forest regrowth on depopulated land."
    topic_code: "4.3"
  - front: "Horses on the Great Plains → a Columbian Exchange case study"
    back: "Escaped and traded Spanish horses reached the Plains by the 1700s; Comanche, Lakota and others became mounted bison hunters, a new way of life created by an Old World animal."
    topic_code: "4.3"
  - front: "Las Casas's figures for Hispaniola → what they are and how to use them"
    back: "'Three Millions' reduced to 'scarce Three Hundred': a friar's polemic to end the encomienda, exaggerated for effect; the catastrophe was real, the numbers are rhetoric."
    topic_code: "4.3"
  - front: "Portugal's trading-post empire → method and four bases with dates"
    back: "Armed ships seized chokepoints and taxed passing trade rather than ruling territory: Goa (1510), Malacca (1511), Hormuz (1515), Macau (1557); also Mozambique, Mombasa and later Nagasaki."
    topic_code: "4.4"
  - front: "Why Portugal chose trading posts over territory"
    back: "A country of about a million people could crew ships and garrison forts but not conquer India or China; cannon at sea gave it an edge that armies on land did not."
    topic_code: "4.4"
  - front: "Limits of Portuguese power in the Indian Ocean"
    back: "Controlled a fraction of the trade; Asian merchants evaded the pass system; the Mughals, Ming and Ottomans were untouched; the Dutch took Malacca (1641) and Ceylon, the Omanis Muscat (1650) and Mombasa (1698)."
    topic_code: "4.4"
  - front: "Three causes of Cortés's victory over the Aztecs (1519–1521)"
    back: "Steel, horses, cannon and crossbows against obsidian weapons; tens of thousands of Tlaxcalan and other Indigenous allies who hated Aztec tribute demands; smallpox in Tenochtitlan during the siege."
    hint: "Technology, allies, disease."
    topic_code: "4.4"
  - front: "Pizarro and the Inca (1532–1533) → why so few men sufficed"
    back: "Smallpox had killed the emperor and set off a civil war; Pizarro seized Atahualpa by surprise at Cajamarca, took a room of gold as ransom, executed him and took Cuzco with the help of Inca factions."
    topic_code: "4.4"
  - front: "Spanish territorial administration → viceroyalties and their dates"
    back: "New Spain (Mexico, 1535) and Peru (1542), each under a viceroy appointed by the crown; later New Granada and Río de la Plata; audiencias (courts) checked the viceroys; the Church ran missions and schools."
    topic_code: "4.4"
  - front: "Manila galleon → route, cargo, significance"
    back: "From 1571, an annual voyage Acapulco–Manila–Acapulco carrying Mexican and Peruvian silver to buy Chinese silk and porcelain; the first regular trans-Pacific trade and a major channel of silver into China."
    topic_code: "4.4"
  - front: "Chartered company → definition and three examples"
    back: "A private joint-stock company given a state monopoly plus the right to wage war, make treaties and govern: Dutch VOC (1602), English East India Company (1600), French East India Company (1664)."
    topic_code: "4.4"
  - front: "VOC's conquests → four"
    back: "Batavia on Java (1619) as headquarters; the Spice Islands (Banda, Moluccas) by force and massacre; Malacca from Portugal (1641); Ceylon; and Cape Town (1652) as a way-station."
    topic_code: "4.4"
  - front: "English and French colonies by 1700 → three kinds"
    back: "Trading posts (Surat, Madras, Pondicherry); plantation islands worked by enslaved Africans (Barbados, Jamaica, Saint-Domingue, Martinique); settler colonies in North America (Virginia, New England, Quebec)."
    topic_code: "4.4"
  - front: "Jamestown (1607) and Quebec (1608) → what each was for"
    back: "Jamestown: an English company settlement that survived on tobacco. Quebec: a French post for the fur trade with Indigenous partners, thinly settled."
    topic_code: "4.4"
  - front: "Compare Spanish and Portuguese empires → territory and method"
    back: "Spain conquered populous states and ruled territory through viceroys, the Church and silver; Portugal held forts and sea lanes and taxed trade. Spain's wealth was American silver; Portugal's was Asian spices and Brazilian sugar."
    topic_code: "4.4"
  - front: "Compare Spanish and Dutch empires → who ran them"
    back: "Spain: the crown and its viceroys, with the Church. The Dutch: the VOC, a company of shareholders in Amsterdam, with its own fleets and governors; profit, not conversion or settlement, was the aim."
    topic_code: "4.4"
  - front: "Omani Empire → what it shows about European power"
    back: "An Arab maritime state that expelled the Portuguese from Muscat (1650) and Mombasa (1698) and took over Swahili and Gulf trade: Asian and African states could and did push back at sea."
    topic_code: "4.4"
  - front: "Asian merchants under European intrusion → the continuity"
    back: "Gujarati, Chinese, Japanese, Armenian and Arab traders kept sailing; the Mughals and Ming taxed or ignored Europeans; in the Indian Ocean Europeans were one armed group among many until the 1700s."
    topic_code: "4.4"
  - front: "Bernal Díaz → who, what, why it matters"
    back: "A soldier of Cortés who wrote a memoir decades later to claim credit for ordinary conquistadors; records the Tlaxcalan alliance, the first sight of Tenochtitlan and the smallpox; evidence for allies and disease as causes."
    topic_code: "4.4"
  - front: "Cieza de León → what he recorded in Peru"
    back: "Inca roads, bridges, storehouses, the mit'a and census, described admiringly in the 1540s by a Spaniard who saw what the conquest had taken over and was destroying."
    topic_code: "4.4"
  - front: "Potosí (1545) → why it matters for Unit 4"
    back: "The richest silver mountain in the world, in Upper Peru; its silver financed Spain's wars, flowed to China through Manila and Europe, and was mined by Indigenous mit'a labour at terrible cost."
    topic_code: "4.4"
  - front: "Why the northern Europeans succeeded after 1600 → three reasons"
    back: "Chartered companies pooled capital and risk; the fluyt and larger fleets cut costs; Spain and Portugal, united 1580–1640 and at war with the Dutch, were overstretched; Protestant states ignored Tordesillas."
    topic_code: "4.4"
quiz:
  description: |
    Week 12 quiz on CED topics 4.3–4.4 with spiral review of Units 1–3 and topics 4.1–4.2 · 24 questions · about 40 minutes. Stimulus sets use Las Casas's Brief Account (1689 English), a described passage of Bernal Díaz and a table of Columbian Exchange transfers. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Las Casas (4.3)
    - slug: apworld-u04-w12-q01
      type: multiple_choice
      topic_code: "4.3"
      source: "Primary source: Bartolomé de Las Casas, A Brief Account of the Destruction of the Indies (1552), English edition of 1689, Project Gutenberg"
      points: 1
      stimulus: |
        "...that of Three Millions of Persons, which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce Three Hundred. ... they sent the Males to the Mines to dig and bring away the Gold, which is an intollerable labor; but the Women they made use of to Manure and Till the ground ... The Men died in Mines, hunger starved and oppressed with labor, and the Women perished in the Fields".

        Bartolomé de Las Casas, A Brief Account of the Destruction of the Indies (1552), in the English edition of 1689
      prompt: |
        Which cause of the depopulation Las Casas describes does he NOT mention in this passage but modern historians consider the most important?
      options:
        - "Forced labour in the mines"
        - "The separation of men and women"
        - "Epidemic disease to which the Indigenous population had no immunity"
        - "Hunger"
      option_explanations:
        - |
          Mine labour is explicitly described in the passage as an intolerable labour.
        - |
          The passage says women were debarred from men and no children were raised.
        - |
          Correct. Smallpox and other virgin-soil epidemics killed the great majority; Las Casas, blaming Spanish cruelty, does not name them here.
        - |
          Starvation is named directly: the men died 'hunger starved'.
      answer: 2
      explanation: |
        A source's purpose shapes what it omits: Las Casas wanted to indict his countrymen, not germs.

    - slug: apworld-u04-w12-q02
      type: multiple_choice
      topic_code: "4.3"
      source: "Primary source: Bartolomé de Las Casas, A Brief Account of the Destruction of the Indies (1552), English edition of 1689, Project Gutenberg"
      points: 1
      stimulus: |
        "...that of Three Millions of Persons, which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce Three Hundred. ... they sent the Males to the Mines to dig and bring away the Gold, which is an intollerable labor; but the Women they made use of to Manure and Till the ground ... The Men died in Mines, hunger starved and oppressed with labor, and the Women perished in the Fields".

        Bartolomé de Las Casas, A Brief Account of the Destruction of the Indies (1552), in the English edition of 1689
      prompt: |
        The existence of an English translation printed in London in 1689 is best explained by
      options:
        - "English admiration for Spanish colonial methods"
        - "a Spanish request for English help in reforming the colonies"
        - "English plans to abolish slavery"
        - "the usefulness of Las Casas's indictment to Spain's Protestant rivals, who spread the 'Black Legend' of Spanish cruelty"
      option_explanations:
        - |
          The 1689 title calls Spanish conduct 'Popery ... in its Bloody Colours'; it is hostile.
        - |
          Spain suppressed the work at home; it did not solicit foreign editions.
        - |
          England was expanding its slave trade in 1689; abolition lay a century ahead.
        - |
          Correct. Protestant England and the Dutch republished Las Casas to discredit Catholic Spain while building their own empires.
      answer: 3
      explanation: |
        Sourcing the translation: an edition's date and place carry a purpose of their own.

    - slug: apworld-u04-w12-q03
      type: multiple_choice
      topic_code: "1.4"
      source: "Primary source: Bartolomé de Las Casas, A Brief Account of the Destruction of the Indies (1552), English edition of 1689, Project Gutenberg"
      points: 1
      stimulus: |
        "...that of Three Millions of Persons, which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce Three Hundred. ... they sent the Males to the Mines to dig and bring away the Gold, which is an intollerable labor; but the Women they made use of to Manure and Till the ground ... The Men died in Mines, hunger starved and oppressed with labor, and the Women perished in the Fields".

        Bartolomé de Las Casas, A Brief Account of the Destruction of the Indies (1552), in the English edition of 1689
      prompt: |
        Review. The forced labour Las Casas describes was later organised on the mainland by adapting which Indigenous institution studied in Unit 1?
      options:
        - "The Aztec calendar"
        - "The Inca mit'a, the rotating labour obligation that Spain redirected to the silver mines of Potosí"
        - "The Maya writing system"
        - "The Mississippian mound-building"
      option_explanations:
        - |
          The calendar was a ritual and astronomical system unrelated to labour.
        - |
          Correct. The Inca state's labour draft for roads and terraces became the Spanish draft for mines.
        - |
          Writing has no connection to labour organisation.
        - |
          Cahokia's mounds were built centuries earlier in North America.
      answer: 1
      explanation: |
        Spiral review of 1.4: Spanish labour systems rested on Indigenous foundations.

    # ---- Set B: Bernal Díaz described (4.4)
    - slug: apworld-u04-w12-q04
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge; Bernal Díaz's True History is described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of passages in Bernal Díaz del Castillo's True History of the Conquest of New Spain, written in the 1560s by a soldier who had served under Cortés.

        Díaz recalls that when the Spaniards first saw Tenochtitlan from the causeway in 1519, with its towers and temples rising from the lake, some soldiers asked whether it was a dream, having read of such things only in romances. He records that the Tlaxcalans, bitter enemies of the Aztecs, first fought the Spaniards and then allied with them, supplying thousands of warriors and porters for the march on the capital. He describes the disastrous retreat of the Noche Triste in 1520, when hundreds of Spaniards drowned under the weight of looted gold, and the smallpox that then swept the city and killed its new ruler. He writes, he says, so that the deeds of the ordinary soldiers will not be forgotten behind the glory given to Cortés.
      prompt: |
        Díaz's account most directly supports which explanation of the Spanish conquest of Mexico?
      options:
        - "The Spaniards won by numbers alone"
        - "The Aztecs welcomed the Spaniards as gods and did not resist"
        - "Indigenous allies and epidemic disease were as important as Spanish weapons"
        - "The conquest was accomplished without any Spanish losses"
      option_explanations:
        - |
          Díaz describes a few hundred Spaniards among thousands of allies.
        - |
          The Noche Triste shows ferocious Aztec resistance.
        - |
          Correct. The Tlaxcalan alliance and the smallpox are central to his narrative of victory.
        - |
          Hundreds of Spaniards died in the retreat of 1520.
      answer: 2
      explanation: |
        The CED names disease and Indigenous allies as causes of the Spanish conquests.

    - slug: apworld-u04-w12-q05
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge; Bernal Díaz's True History is described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of passages in Bernal Díaz del Castillo's True History of the Conquest of New Spain, written in the 1560s by a soldier who had served under Cortés.

        Díaz recalls that when the Spaniards first saw Tenochtitlan from the causeway in 1519, with its towers and temples rising from the lake, some soldiers asked whether it was a dream, having read of such things only in romances. He records that the Tlaxcalans, bitter enemies of the Aztecs, first fought the Spaniards and then allied with them, supplying thousands of warriors and porters for the march on the capital. He describes the disastrous retreat of the Noche Triste in 1520, when hundreds of Spaniards drowned under the weight of looted gold, and the smallpox that then swept the city and killed its new ruler. He writes, he says, so that the deeds of the ordinary soldiers will not be forgotten behind the glory given to Cortés.
      prompt: |
        Díaz's stated purpose for writing most likely affects his account by
      options:
        - "leading him to emphasise the hardships and courage of the rank-and-file soldiers and to correct official histories that glorified the commander"
        - "making him exaggerate the role of Cortés"
        - "making him omit the Tlaxcalans"
        - "causing him to deny that smallpox occurred"
      option_explanations:
        - |
          Correct. A veteran writing decades later to secure recognition (and rewards) for men like himself stresses their deeds and sufferings.
        - |
          He wrote against Cortés's monopoly of credit, not for it.
        - |
          He gives the Tlaxcalans a central role as warriors and porters.
        - |
          He records the epidemic plainly, along with the death of the new ruler.
      answer: 0
      explanation: |
        Point of view: a soldier's memoir against an official narrative.

    - slug: apworld-u04-w12-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge; Bernal Díaz's True History is described, not quoted"
      points: 1
      stimulus: |
        Description written for this course of passages in Bernal Díaz del Castillo's True History of the Conquest of New Spain, written in the 1560s by a soldier who had served under Cortés.

        Díaz recalls that when the Spaniards first saw Tenochtitlan from the causeway in 1519, with its towers and temples rising from the lake, some soldiers asked whether it was a dream, having read of such things only in romances. He records that the Tlaxcalans, bitter enemies of the Aztecs, first fought the Spaniards and then allied with them, supplying thousands of warriors and porters for the march on the capital. He describes the disastrous retreat of the Noche Triste in 1520, when hundreds of Spaniards drowned under the weight of looted gold, and the smallpox that then swept the city and killed its new ruler. He writes, he says, so that the deeds of the ordinary soldiers will not be forgotten behind the glory given to Cortés.
      prompt: |
        Review. The willingness of the Tlaxcalans to ally with the Spaniards is best explained by which feature of the Aztec Empire studied in Unit 1?
      options:
        - "Its system of direct rule that integrated conquered peoples as equals"
        - "Its tribute empire, which left subject and rival peoples resentful of demands for goods and sacrificial victims"
        - "Its abolition of warfare"
        - "Its conversion to Christianity before 1519"
      option_explanations:
        - |
          The Aztecs ruled indirectly through tribute and did not integrate subjects.
        - |
          Correct. Tlaxcala, never conquered but constantly at war with the Aztecs and raided for captives, had every reason to join an enemy of its enemy.
        - |
          The Aztec state fought 'flower wars' for captives continually.
        - |
          The Aztecs practised their own religion; conversion followed conquest.
      answer: 1
      explanation: |
        Spiral review of 1.4: the structure of the Aztec state explains its fall.

    # ---- Set C: Columbian Exchange table (4.3)
    - slug: apworld-u04-w12-q07
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: selected transfers of the Columbian Exchange.

        | From the Americas to Afro-Eurasia | Effect | From Afro-Eurasia to the Americas | Effect |
        |---|---|---|---|
        | Maize | Staple in Africa, southern Europe, China | Smallpox, measles, influenza | Population collapse of perhaps 90 per cent |
        | Potato | Fed northern Europe; Irish dependence | Horses | Mounted societies on the Plains and Pampas |
        | Cassava | West and Central African staple | Cattle, sheep, pigs | Ranching; damage to Indigenous fields |
        | Tomato, pepper, cacao, tobacco | New diets and habits worldwide | Wheat, sugar, rice, grapes | Plantations; European diets transplanted |
        | Silver (Potosí) | Flowed to China and Europe | Enslaved Africans; okra, yams, African rice | Plantation labour; African foods in the Americas |
      prompt: |
        The table best supports which generalisation?
      options:
        - "The exchange benefited both hemispheres equally"
        - "No crops moved westward"
        - "Disease moved only from the Americas to Europe"
        - "The Americas received mainly animals, diseases and people, while Afro-Eurasia received mainly crops and silver; the demographic effects ran in opposite directions"
      option_explanations:
        - |
          The Americas lost most of their population; Afro-Eurasia gained food and people.
        - |
          Wheat, sugar, rice and grapes went west.
        - |
          The deadly transfers were eastern diseases going west; syphilis is the one disputed reverse case.
        - |
          Correct. Westward went germs, livestock and enslaved people; eastward went staple crops and silver; population fell in one hemisphere and rose in the other.
      answer: 3
      explanation: |
        Topic 4.3 asks for effects in both directions; the asymmetry is the key.

    - slug: apworld-u04-w12-q08
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: selected transfers of the Columbian Exchange.

        | From the Americas to Afro-Eurasia | Effect | From Afro-Eurasia to the Americas | Effect |
        |---|---|---|---|
        | Maize | Staple in Africa, southern Europe, China | Smallpox, measles, influenza | Population collapse of perhaps 90 per cent |
        | Potato | Fed northern Europe; Irish dependence | Horses | Mounted societies on the Plains and Pampas |
        | Cassava | West and Central African staple | Cattle, sheep, pigs | Ranching; damage to Indigenous fields |
        | Tomato, pepper, cacao, tobacco | New diets and habits worldwide | Wheat, sugar, rice, grapes | Plantations; European diets transplanted |
        | Silver (Potosí) | Flowed to China and Europe | Enslaved Africans; okra, yams, African rice | Plantation labour; African foods in the Americas |
      prompt: |
        Which row most directly explains the growth of China's population under the Qing dynasty?
      options:
        - "Horses"
        - "Tobacco"
        - "Maize (with sweet potatoes), which grew on hillsides unsuited to rice and added calories to the Chinese diet"
        - "Cattle"
      option_explanations:
        - |
          Horses went west, and China had them already.
        - |
          Tobacco was consumed, not eaten; it fed no one.
        - |
          Correct. American crops let farmers cultivate marginal land, one reason China's population roughly doubled in the eighteenth century.
        - |
          Cattle went west to the Americas; China had its own oxen and buffalo.
      answer: 2
      explanation: |
        The CED's point that American crops fed Afro-Eurasian population growth.

