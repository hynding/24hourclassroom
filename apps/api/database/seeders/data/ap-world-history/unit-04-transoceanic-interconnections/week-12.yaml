      prompt: |
        Review. The "Smallpox" row is most similar in kind to which Unit 2 event?
      options:
        - "The spread of the Black Death along the Mongol routes, a disease carried by new connections to populations that had not met it"
        - "The founding of Timbuktu"
        - "The voyages of Zheng He"
        - "The conversion of Malacca to Islam"
      option_explanations:
        - |
          Correct. Both are environmental consequences of connectivity: trade or conquest routes carrying pathogens to the unexposed.
        - |
