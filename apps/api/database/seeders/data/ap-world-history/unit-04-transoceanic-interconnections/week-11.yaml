week: 11
unit: 4
title: "Technology and the Causes of European Exploration"
topics: ["4.1", "4.2"]
guide: guides/week-11.md
guide_description: |
  Study guide for week 11 (CED topics 4.1–4.2): the technologies Europeans borrowed and built for oceanic sailing (compass, astrolabe, lateen sail, caravel, carrack, fluyt, knowledge of the Atlantic winds) and the causes and events of state-sponsored exploration by Portugal, Spain, France, England and the Netherlands, including Dias, da Gama, Columbus, Magellan and the Treaty of Tordesillas. Reads Columbus's 1493 letter and the Tordesillas boundary clause closely.
flashcards_description: |
  30 cards on topics 4.1–4.2: borrowed and adapted maritime technologies, the Atlantic wind system, ship types, the motives of monarchs, the Portuguese and Spanish voyages, the northern Europeans' search for a passage, and the Treaty of Tordesillas.
flashcards:
  - front: "Four maritime technologies Europeans borrowed → origin of each"
    back: "Magnetic compass (China, via the Islamic world); astrolabe (Greek, refined by Islamic astronomers); lateen sail (Indian Ocean dhows); stern-post rudder (China). All reached Europe along Unit 2's networks."
    topic_code: "4.1"
  - front: "Caravel → design and advantage"
    back: "Small, strong Portuguese ship rigged with lateen sails, able to sail close to the wind and explore coasts and rivers; the vessel of Dias and of two of Columbus's three ships."
    topic_code: "4.1"
  - front: "Carrack → design and role"
    back: "Larger ship combining square sails for speed with lateen for handling, with high castles and room for cannon and cargo; the Portuguese and Spanish ship of trade and war on the ocean routes."
    topic_code: "4.1"
  - front: "Fluyt → who, when, why it mattered"
    back: "Dutch cargo ship of the 1590s: cheap to build, large hold, small crew, few guns; made Dutch shipping the cheapest in Europe and underpinned Amsterdam's commercial dominance."
    topic_code: "4.1"
  - front: "Volta do mar → meaning and significance"
    back: "'Turn of the sea': Portuguese sailors learned to swing out into the Atlantic to catch the westerlies home rather than beat against the trade winds; knowledge of the wind system made ocean round trips possible."
    hint: "It is about winds, not instruments."
    topic_code: "4.1"
  - front: "Trade winds and westerlies → how they shaped routes"
    back: "Easterlies in the tropics carried ships west (Columbus's outbound route); westerlies in temperate latitudes carried them east (his return); Magellan and the Manila galleons used the same belts in the Pacific."
    topic_code: "4.1"
  - front: "Astrolabe, quadrant and cross-staff → what they measured"
    back: "The angle of the sun or pole star above the horizon, giving latitude; longitude remained guesswork until the eighteenth century."
    topic_code: "4.1"
  - front: "Cartographic advances of the period → three"
    back: "Portolan charts with compass bearings; the recovery of Ptolemy's Geography with its latitude-longitude grid; Mercator's projection (1569), on which a constant compass bearing is a straight line."
    topic_code: "4.1"
  - front: "What Europeans actually added to borrowed maritime technology"
    back: "Combination and purpose: new hulls and rigs (caravel, carrack, fluyt), cannon aboard ship, systematic charting of winds and coasts, and state funding for repeated voyages."
    topic_code: "4.1"
  - front: "Three economic motives for European exploration"
    back: "Direct access to Asian spices and silks without Venetian and Muslim middlemen; West African gold at its source rather than across the Sahara; new lands for sugar after Madeira and the Canaries."
    topic_code: "4.2"
  - front: "Religious motives for Iberian exploration"
    back: "The crusading spirit of the Reconquista (Granada fell in 1492); converting non-Christians; outflanking Islam; the legend of Prester John, a Christian king somewhere beyond the Muslim world."
    topic_code: "4.2"
  - front: "Why monarchs sponsored voyages → the political cause"
    back: "Gunpowder states needed revenue and prestige; competition among Portugal, Spain, France, England and the Netherlands made each fear being left out; a voyage cost less than a war."
    topic_code: "4.2"
  - front: "Henry the Navigator → what he did and did not do"
    back: "Portuguese prince (d. 1460) who funded voyages down the African coast, colonised Madeira and the Azores and began the Atlantic slave trade; he did not himself navigate."
    topic_code: "4.2"
  - front: "Bartolomeu Dias (1488)"
    back: "Rounded the Cape of Good Hope, proving the Atlantic connected to the Indian Ocean; his crew forced him to turn back before India."
    topic_code: "4.2"
  - front: "Vasco da Gama's first voyage (1497–1499) → key facts"
    back: "Sailed around Africa, took a pilot at Malindi who knew the monsoon, reached Calicut in May 1498; his cloth and hats failed to impress the Zamorin; Muslim merchants were hostile; he returned with spices worth many times the voyage's cost."
    topic_code: "4.2"
  - front: "Columbus's first voyage (1492) → sponsor, landfalls, belief"
    back: "Funded by Isabella of Castile; reached the Bahamas, Cuba and Hispaniola in October 1492; believed to his death that he was near Asia, having underestimated the earth's size."
    topic_code: "4.2"
  - front: "What Columbus promised Sant Angel in 1493 → three things"
    back: "Gold 'as much as they desire', spices and cotton, and 'as many slaves as they choose to send for, all heathens'; also easy conversion of a people without iron or weapons."
    topic_code: "4.2"
  - front: "Treaty of Tordesillas (1494) → terms and effect"
    back: "Pope-brokered line 370 leagues west of the Cape Verde Islands; lands east to Portugal, west to Castile; gave Portugal Brazil (1500) and its African and Asian routes, Spain the rest of the Americas."
    topic_code: "4.2"
  - front: "Magellan's expedition (1519–1522)"
    back: "Portuguese captain in Spanish service; rounded South America through the strait named for him, crossed the Pacific, died in the Philippines; one ship of five under Elcano returned, proving the globe could be circled."
    topic_code: "4.2"
  - front: "Pedro Álvares Cabral (1500)"
    back: "Portuguese commander bound for India who swung wide into the Atlantic and reached Brazil, which fell on Portugal's side of the Tordesillas line."
    topic_code: "4.2"
  - front: "Northwest Passage → who sought it and what they found"
    back: "Cabot (1497), Cartier (1534), Hudson (1609) for England, France and the Dutch; no passage, but cod fisheries, furs and the St Lawrence and Hudson rivers, which became the bases of northern colonies."
    topic_code: "4.2"
  - front: "Why Portugal began exploration before Spain"
    back: "Small, poor, united early, facing the Atlantic with an African coast to follow, free of the Granada war that occupied Castile until 1492, and led by a prince willing to fund repeated voyages."
    topic_code: "4.2"
  - front: "Portuguese versus Spanish directions of exploration"
    back: "Portugal went south and east around Africa to the Indian Ocean; Spain went west across the Atlantic to the Americas. Tordesillas ratified the division."
    topic_code: "4.2"
  - front: "Reconquista and exploration → the link"
    back: "Centuries of war against Muslim states gave Iberian kingdoms a crusading ideology, a warrior nobility seeking land, and the habit of conquest and conversion that they carried overseas in the same year Granada fell."
    topic_code: "4.2"
  - front: "Role of Marco Polo's book and printing in exploration"
    back: "Polo's descriptions of Asian wealth, printed and widely read, fed Columbus's expectations (he owned an annotated copy); printing spread charts, accounts and Ptolemy's Geography."
    topic_code: "4.2"
  - front: "Da Gama at Calicut → what the Zamorin's reaction shows"
    back: "The Indian Ocean was a rich, established system; the Portuguese arrived as poor newcomers with nothing to sell, which is why they returned with cannon to seize what they could not buy."
    topic_code: "4.2"
  - front: "Columbus's letter → sourcing in one line"
    back: "A fundraising report to the royal treasurer: every observation (timid people, abundant gold, easy converts) argues for a second voyage; reliable on his aims, unreliable on what Hispaniola held."
    topic_code: "4.2"
  - front: "Tordesillas → what assumption it reveals"
    back: "That two Christian monarchs with papal sanction could divide the whole non-Christian world between them, ignoring every other state and people; France, England and the Dutch later rejected it."
    topic_code: "4.2"
  - front: "Compare Zheng He's voyages and the Portuguese voyages → purpose and sequel"
    back: "Zheng He: state prestige and tribute, huge fleets, ended by the court in 1433. Portugal: profit and conquest, small fleets, sustained by returns; the Ming withdrew from the sea as the Portuguese entered it."
    topic_code: "4.2"
  - front: "Diffusion as the theme of 4.1 → one sentence"
    back: "Technologies invented in Asia and the Islamic world, moved west by the networks of Unit 2, were combined by Europeans at the edge of Afro-Eurasia and used to join the ocean system that had produced them."
    topic_code: "4.1"
quiz:
  description: |
    Week 11 quiz on CED topics 4.1–4.2 with spiral review of Units 2 and 3 · 24 questions · about 40 minutes. Stimulus sets use Columbus's letter to Sant Angel (1892 English), the Treaty of Tordesillas (Davenport, 1917) and a table of maritime technologies. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Columbus (4.2)
    - slug: apworld-u04-w11-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Christopher Columbus, Letter to Luis de Sant Angel (1493), American History Leaflets no. 1 (A. Lovell & Co., 1892), Internet Archive"
      points: 1
      stimulus: |
        "They have no iron, nor steel, nor weapons, nor are they fit for them, because although they are well-made men of commanding stature, they appear extraordinarily timid. ... they are so unsuspicious and so generous with what they possess, that no one who had not seen it would believe it. They never refuse anything that is asked for. ... I can give them as much gold as they desire, if they will give me a little assistance, ... and as many slaves as they choose to send for, all heathens."

        Christopher Columbus, Letter to Luis de Sant Angel, treasurer of the Spanish crown, 1493 (English of 1892)
      prompt: |
        Columbus's purpose in writing this letter most likely explains which feature of the passage?
      options:
        - "Its detailed description of Taino religion"
        - "Its emphasis on the islanders' lack of weapons, their generosity and the gold and slaves they could yield, which together argue for funding another voyage"
        - "Its criticism of the Spanish monarchs"
        - "Its admission that he had failed to reach Asia"
      option_explanations:
        - |
          Religion is mentioned only as 'heathens' to be converted; there is no ethnographic detail.
        - |
          Correct. A report to the royal treasurer is a case for investment; every observation points to easy profit and conquest.
        - |
          He flatters the crown and presents himself as its servant.
        - |
          He insisted he had reached the Indies and never admitted otherwise.
      answer: 1
      explanation: |
        Sourcing: audience (the treasurer) and purpose (a second voyage) shape what Columbus chose to report.

    - slug: apworld-u04-w11-q02
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Christopher Columbus, Letter to Luis de Sant Angel (1493), American History Leaflets no. 1 (A. Lovell & Co., 1892), Internet Archive"
      points: 1
      stimulus: |
        "They have no iron, nor steel, nor weapons, nor are they fit for them, because although they are well-made men of commanding stature, they appear extraordinarily timid. ... they are so unsuspicious and so generous with what they possess, that no one who had not seen it would believe it. They never refuse anything that is asked for. ... I can give them as much gold as they desire, if they will give me a little assistance, ... and as many slaves as they choose to send for, all heathens."

        Christopher Columbus, Letter to Luis de Sant Angel, treasurer of the Spanish crown, 1493 (English of 1892)
      prompt: |
        The passage reflects which combination of motives for Spanish exploration?
      options:
        - "Scientific curiosity and the search for a northwest passage"
        - "The desire to trade as equals with established Asian states"
        - "Fear of Portuguese naval power"
        - "Economic gain (gold), labour (slaves) and religious expansion (heathens to convert)"
      option_explanations:
        - |
          There is no scientific language, and the northwest passage was a later northern European aim.
        - |
          Columbus proposes extraction and enslavement, not equal trade.
        - |
          Portugal is not mentioned; the Tordesillas rivalry came the following year.
        - |
          Correct. Gold, slaves and conversion are the three motives the CED names for Iberian expansion, and all three appear.
      answer: 3
      explanation: |
        The letter is the clearest short statement of the motives of 4.2.

    - slug: apworld-u04-w11-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "Primary source: Christopher Columbus, Letter to Luis de Sant Angel (1493), American History Leaflets no. 1 (A. Lovell & Co., 1892), Internet Archive"
      points: 1
      stimulus: |
        "They have no iron, nor steel, nor weapons, nor are they fit for them, because although they are well-made men of commanding stature, they appear extraordinarily timid. ... they are so unsuspicious and so generous with what they possess, that no one who had not seen it would believe it. They never refuse anything that is asked for. ... I can give them as much gold as they desire, if they will give me a little assistance, ... and as many slaves as they choose to send for, all heathens."

        Christopher Columbus, Letter to Luis de Sant Angel, treasurer of the Spanish crown, 1493 (English of 1892)
      prompt: |
        Review. Columbus's observation that the islanders had "no iron, nor steel, nor weapons" foreshadows which pattern seen in the land-based empires of Unit 3?
      options:
        - "States with gunpowder and steel weapons overpowering peoples who lacked them, as Morocco overpowered Songhai"
        - "The conversion of rulers to Shia Islam"
        - "The use of civil service examinations"
        - "The construction of monumental mosques"
      option_explanations:
        - |
          Correct. The military gap Columbus noted was the same gap that decided Tondibi and would decide the conquests of Mexico and Peru.
        - |
          Religious conversion of a ruler is unrelated to the weapons gap described.
        - |
          Examinations concern administration, not conquest.
        - |
          Architecture is legitimacy, not military advantage.
      answer: 0
      explanation: |
        Spiral review of 3.1: the gunpowder divide operated across the Atlantic as in Africa.

    # ---- Set B: Tordesillas (4.2)
    - slug: apworld-u04-w11-q04
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Treaty of Tordesillas (1494), in F. G. Davenport, European Treaties Bearing on the History of the United States (1917), Avalon Project"
      points: 1
      stimulus: |
        "...a boundary or straight line be determined and drawn north and south, from pole to pole, on the said ocean sea ... at a distance of three hundred and seventy leagues west of the Cape Verde Islands ... [and all lands found to the east of it] shall belong to, and remain in the possession of, and pertain forever to, the said King of Portugal ... [and all lands to the west] shall belong to, and remain in the possession of, and pertain forever to, the said King and Queen of Castile."

        Treaty of Tordesillas between Spain and Portugal, 7 June 1494, translated in Davenport, European Treaties (1917)
      prompt: |
        The treaty is best understood as a response to
      options:
        - "the Ottoman capture of Constantinople"
        - "the demands of Indigenous rulers in the Caribbean"
        - "competition between two Iberian monarchies after Columbus's voyage threatened Portugal's Atlantic and African claims"
        - "the Protestant Reformation"
      option_explanations:
        - |
          Constantinople fell in 1453; the treaty concerns the Atlantic, not the eastern Mediterranean.
        - |
          No Indigenous party was consulted; the treaty assumes their lands can be assigned.
        - |
          Correct. Portugal's papal grants covered Africa; Columbus's landfall required a new division to prevent war between the two crowns.
        - |
          The Reformation began in 1517, twenty-three years later.
      answer: 2
      explanation: |
        State competition is the CED's political cause of exploration; Tordesillas is its clearest document.

    - slug: apworld-u04-w11-q05
      type: multiple_choice
      topic_code: "4.2"
      source: "Primary source: Treaty of Tordesillas (1494), in F. G. Davenport, European Treaties Bearing on the History of the United States (1917), Avalon Project"
      points: 1
      stimulus: |
        "...a boundary or straight line be determined and drawn north and south, from pole to pole, on the said ocean sea ... at a distance of three hundred and seventy leagues west of the Cape Verde Islands ... [and all lands found to the east of it] shall belong to, and remain in the possession of, and pertain forever to, the said King of Portugal ... [and all lands to the west] shall belong to, and remain in the possession of, and pertain forever to, the said King and Queen of Castile."

        Treaty of Tordesillas between Spain and Portugal, 7 June 1494, translated in Davenport, European Treaties (1917)
      prompt: |
        Which later development was a direct consequence of where the line fell?
      options:
        - "Portuguese colonisation of Brazil after Cabral's landfall in 1500"
        - "French settlement of Quebec"
        - "The Dutch capture of Malacca"
        - "The English founding of Jamestown"
      option_explanations:
        - |
          Correct. The bulge of South America lay east of the line, so Brazil became Portuguese while the rest of the Americas went to Spain.
        - |
          France rejected the treaty and settled where it pleased.
        - |
          The Dutch ignored Iberian claims and took Malacca from Portugal in 1641.
        - |
          England likewise disregarded the papal division.
      answer: 0
      explanation: |
        The treaty explains the one Portuguese-speaking country in the Americas.

    - slug: apworld-u04-w11-q06
      type: multiple_choice
      topic_code: "2.3"
      source: "Primary source: Treaty of Tordesillas (1494), in F. G. Davenport, European Treaties Bearing on the History of the United States (1917), Avalon Project"
      points: 1
      stimulus: |
        "...a boundary or straight line be determined and drawn north and south, from pole to pole, on the said ocean sea ... at a distance of three hundred and seventy leagues west of the Cape Verde Islands ... [and all lands found to the east of it] shall belong to, and remain in the possession of, and pertain forever to, the said King of Portugal ... [and all lands to the west] shall belong to, and remain in the possession of, and pertain forever to, the said King and Queen of Castile."

        Treaty of Tordesillas between Spain and Portugal, 7 June 1494, translated in Davenport, European Treaties (1917)
      prompt: |
        Review. The treaty's assignment of everything east of the line to Portugal included the Indian Ocean, which in Unit 2 was
      options:
        - "an empty sea with no established trade"
        - "controlled entirely by the Ming navy"
        - "closed to all non-Muslims"
        - "a long-established trading system of Arab, Persian, Gujarati, Swahili and Chinese merchants linked by the monsoon, which Portugal would have to force its way into"
      option_explanations:
        - |
          It was the oldest and richest maritime network in the world.
        - |
          The Ming had withdrawn their fleets in 1433; no navy ruled the ocean.
        - |
          Hindu Calicut, Chinese traders and Jewish merchants all took part; it was open to anyone who could trade.
        - |
          Correct. The treaty assigned on paper a world that Portugal would enter with cannon from 1498.
      answer: 3
      explanation: |
        Spiral review of 2.3: the ocean Europeans claimed was already full.

    # ---- Set C: technology table (4.1)
    - slug: apworld-u04-w11-q07
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: maritime technologies in European use by 1500.

        | Technology | Origin | Route to Europe | European adaptation |
        |---|---|---|---|
        | Magnetic compass | Song China | Indian Ocean and Islamic world; Mediterranean by 1200s | Mounted in a box with a card; standard on all ships |
        | Astrolabe | Hellenistic Greece | Islamic astronomers; Spain | Simplified mariner's astrolabe for latitude at sea |
        | Lateen sail | Indian Ocean and Mediterranean | Arab and Byzantine ships | Combined with square sails on caravels and carracks |
        | Stern-post rudder | China | Indian Ocean; Europe by 1200s | Standard on all oceanic ships |
        | Gunpowder and cannon | China | Mongol routes; Islamic world | Mounted aboard ship; broadside warfare |
        | Knowledge of Atlantic winds | Portuguese experience | Repeated voyages down Africa, 1420s–1480s | The volta do mar; trade-wind and westerly routes |
      prompt: |
        The table best supports which conclusion?
      options:
        - "European exploration depended mainly on technologies developed elsewhere and transmitted through earlier networks of exchange, combined with Europeans' own accumulated sailing knowledge"
        - "All maritime technology was invented in Europe"
        - "The Chinese and Islamic worlds had no maritime technology"
        - "Wind knowledge was unimportant compared with instruments"
      option_explanations:
        - |
          Correct. Five of six rows originate outside Europe; the sixth is experience, not invention.
        - |
          Only the wind knowledge row is European, and it is experience rather than a device.
        - |
          The table shows the opposite: China and the Islamic world supplied most of the devices.
        - |
          The volta do mar was decisive for return voyages; instruments alone could not bring a ship home.
      answer: 0
      explanation: |
        Topic 4.1 is about diffusion and adaptation, which the table illustrates.

    - slug: apworld-u04-w11-q08
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge; table compiled for this course"
      points: 1
      stimulus: |
        Table compiled for this course: maritime technologies in European use by 1500.

        | Technology | Origin | Route to Europe | European adaptation |
        |---|---|---|---|
        | Magnetic compass | Song China | Indian Ocean and Islamic world; Mediterranean by 1200s | Mounted in a box with a card; standard on all ships |
        | Astrolabe | Hellenistic Greece | Islamic astronomers; Spain | Simplified mariner's astrolabe for latitude at sea |
        | Lateen sail | Indian Ocean and Mediterranean | Arab and Byzantine ships | Combined with square sails on caravels and carracks |
        | Stern-post rudder | China | Indian Ocean; Europe by 1200s | Standard on all oceanic ships |
        | Gunpowder and cannon | China | Mongol routes; Islamic world | Mounted aboard ship; broadside warfare |
        | Knowledge of Atlantic winds | Portuguese experience | Repeated voyages down Africa, 1420s–1480s | The volta do mar; trade-wind and westerly routes |
      prompt: |
        The "European adaptation" column for gunpowder points most directly to which later development?
      options:
        - "The Portuguese ability to seize and hold Indian Ocean ports such as Goa and Malacca against larger local states"
        - "The Dutch invention of the fluyt"
        - "The Ming withdrawal from the sea"
        - "The Treaty of Tordesillas"
      option_explanations:
        - |
          Correct. Ship-mounted cannon let small Portuguese fleets bombard ports and defeat local fleets, the basis of the trading-post empire (week 12).
        - |
          The fluyt was a cargo ship notable for carrying few guns.
        - |
          The Ming withdrew in 1433 for domestic reasons, before Portuguese guns reached Asia.
        - |
          The treaty divided claims on paper; it did not depend on naval gunnery.
      answer: 0
      explanation: |
        Gunpowder at sea is the link between Unit 3's land empires and Unit 4's maritime ones.

