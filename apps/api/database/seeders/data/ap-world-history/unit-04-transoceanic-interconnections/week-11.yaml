    # ---- Short answer
    - slug: apworld-u04-w11-q22
      type: short_answer
      topic_code: "4.2"
      source: "Primary source: Christopher Columbus, Letter to Luis de Sant Angel (1493), American History Leaflets no. 1 (A. Lovell & Co., 1892), Internet Archive"
      points: 3
      prompt: |
        Columbus reported in 1493 that the people of the Caribbean "have no iron, nor steel, nor weapons" and that he could send the crown "as much gold as they desire ... and as many slaves as they choose to send for, all heathens" (Letter to Luis de Sant Angel, 1892 English).

        (a) Identify ONE cause of Spanish exploration reflected in the passage.
        (b) Explain ONE way the technologies of the period made Columbus's voyage possible.
        (c) Explain ONE limitation of Columbus's letter as evidence about the peoples of the Caribbean.
      answer: |
        (a) 1 point: the desire for gold and wealth; the search for labour (enslaved people); the aim of converting non-Christians; competition with Portugal for new sources of wealth.
        (b) 1 point with explanation: the compass gave direction across the open Atlantic; the astrolabe or quadrant gave latitude; caravels could sail into the wind and survive the crossing; knowledge of the trade winds (outbound) and westerlies (return) gave a route home; cartography and Ptolemy's grid framed the plan.
        (c) 1 point: he wrote to secure funding and so exaggerated gold, generosity and ease of conquest; he spoke no local language and stayed weeks; he described people as potential converts and slaves, not as they understood themselves; he mistook where he was and interpreted everything through expectations drawn from Polo.
      explanation: |
        Scoring: one point per part. (b) must name a technology and explain its function; (c) must tie the limitation to Columbus's purpose or situation.

    - slug: apworld-u04-w11-q23
      type: short_answer
      topic_code: "4.1"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE technology that Europeans adopted from another region and used in transoceanic voyages between 1450 and 1600.
        (b) Explain ONE way state sponsorship contributed to European exploration in this period.
        (c) Explain ONE difference between the goals of Portuguese exploration and those of the northern European states in the sixteenth century.
      answer: |
        (a) 1 point: the magnetic compass (China); the astrolabe (Islamic world); the lateen sail (Indian Ocean); the stern-post rudder (China); gunpowder weapons (China); Ptolemaic cartography (Greek via Islamic and Byzantine copies).
        (b) 1 point with explanation: Portuguese princes funded repeated voyages down Africa that accumulated wind and coastal knowledge; Isabella's funding of Columbus and Charles V's of Magellan paid for ventures no merchant could risk; monarchs granted monopolies and charters (later trading companies) and used treaties such as Tordesillas to secure claims; competition between crowns drove each to sponsor more.
        (c) 1 point with explanation: Portugal sought a direct sea route to the spices and gold of Africa and Asia and built fortified trading posts, while England, France and the Dutch first sought a northwest passage to Asia and, failing that, turned to fisheries, furs and settlement in North America; or Portugal's motives included Reconquista-style crusading while the Protestant northern states were driven more by commercial rivalry with Spain.
      explanation: |
        Scoring: one point per part. (b) and (c) require explanation of how or why, not just a name.

    # ---- Long answer
    - slug: apworld-u04-w11-q24
      type: long_answer
      topic_code: "4.2"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which technological change was the most important cause of European transoceanic exploration in the period c. 1450 to c. 1600.

        Write a complete essay with a thesis, context, specific evidence and reasoning that weighs technology against other causes.
      answer: |
        Thesis (1 point): a defensible claim about extent, for example that technology was necessary but not the decisive cause: the instruments and ships were mostly borrowed and available for centuries, and what changed after 1450 was the motive and the money of competing gunpowder states cut off from Asian goods by Ottoman expansion.
        Contextualisation (1 point): the Unit 2 networks that transmitted the compass and astrolabe; the Ottoman conquest of Constantinople and Egypt; the Reconquista; the Ming withdrawal from the sea; the rise of centralised monarchies.
        Evidence (2 points): at least two specific examples, for example the caravel and the volta do mar; the compass and astrolabe; Henry the Navigator's sponsorship; Dias and da Gama; Isabella and Columbus; Tordesillas; Magellan; the Zamorin's indifference to Portuguese goods; the fluyt; the northwest passage voyages.
        Analysis and reasoning (1 point): uses causation to distinguish enabling conditions (technology) from motives (wealth, religion, competition) and triggers (Ottoman control of routes, Granada's fall).
        Complexity (1 point): notes that other societies (Ming China, the Ottomans) had equal or better technology and did not pursue oceanic empire, so technology alone cannot explain Europe's choice; or traces how exploration then drove further technological change.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that lists technologies without weighing them against motives cannot earn the analysis point.
