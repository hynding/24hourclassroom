    # ---- Standalone new content
    - slug: apworld-u04-w11-q10
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The Dutch fluyt gave the Netherlands a commercial advantage in the seventeenth century because it
      options:
        - "carried more cannon than any other ship"
        - "could sail faster than a caravel"
        - "was the first ship to use the compass"
        - "was cheap to build, had a large hold and needed a small crew, lowering freight costs below any rival's"
      option_explanations:
        - |
          The fluyt carried few guns; it relied on Dutch warships for protection.
        - |
          It was slow; its virtue was capacity and economy.
        - |
          The compass was in use centuries earlier.
        - |
          Correct. Low cost per ton of cargo made Dutch shipping dominant in Europe's carrying trade.
      answer: 3
      explanation: |
        The fluyt is the CED's example of a ship designed for trade rather than exploration or war.

    - slug: apworld-u04-w11-q11
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge; da Gama's journal is described, not quoted"
      points: 1
      prompt: |
        The journal of da Gama's voyage records that the Zamorin of Calicut was unimpressed by the Portuguese gifts of cloth, hats and basins and that Muslim merchants were hostile. These details best show that
      options:
        - "the Portuguese arrived as poor newcomers in a rich, established trading system that did not need them"
        - "India had no trade before the Portuguese"
        - "the Portuguese were welcomed as equals"
        - "Calicut was a Muslim state"
      option_explanations:
        - |
          Correct. The Indian Ocean's merchants dealt in gold, silk and spices; Portuguese trade goods were worthless there, which is why force followed.
        - |
          Calicut was a major port of a trade older than Portugal.
        - |
          The journal records suspicion and hostility, not welcome.
        - |
          The Zamorin was a Hindu ruler who protected Muslim merchants for their trade.
      answer: 0
      explanation: |
        The da Gama episode frames the whole Portuguese strategy in Asia.

    - slug: apworld-u04-w11-q12
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The search for a northwest passage by England, France and the Netherlands in the sixteenth and early seventeenth centuries had which result?
      options:
        - "The discovery of a sea route through North America to Asia"
        - "The conquest of Mexico"
        - "No passage, but knowledge of the North American coast, fisheries and fur-trading rivers that became the basis of their colonies"
        - "An alliance with Spain"
      option_explanations:
        - |
          No navigable passage was found until the twentieth century.
        - |
          Mexico was Spanish, conquered from the south.
        - |
          Correct. Cabot, Cartier and Hudson found cod, furs and the St Lawrence and Hudson rivers, where later settlement began.
        - |
          The northern powers competed with Spain and raided its shipping.
      answer: 2
      explanation: |
