unit: 4
description: |
  42 questions · about 72 minutes · every topic of Unit 4 (4.1 to 4.8) with review of Units 1 to 3. Four
  source-based multiple-choice sets in the AP style (Columbus's letter of 1493, Las Casas on Hispaniola, Equiano on
  the Middle Passage, and a continuity-and-change table for 1450–1750), stand-alone multiple choice, select-all,
  true/false and fill-in-the-blank items, two short-answer questions (3 points each) and one long essay question
  (6 points). Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are
  matched automatically; the free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: Columbus (4.2)
  - slug: apworld-u04-exam-q01
    type: multiple_choice
    topic_code: "4.2"
    source: "Primary source: Christopher Columbus, Letter to Luis de Sant Angel (1493), American History Leaflets no. 1 (A. Lovell and Co., 1892), Internet Archive"
    points: 1
    stimulus: |
      "They have no iron, nor steel, nor weapons, nor are they fit for them, because although they are well-made men of commanding stature, they appear extraordinarily timid. ... they are so unsuspicious and so generous with what they possess, that no one who had not seen it would believe it. ... I can give them as much gold as they desire, if they will give me a little assistance ... and as many slaves as they choose to send for, all heathens."

      Christopher Columbus, letter to Luis de Sant Angel, 1493 (American History Leaflets no. 1, 1892)
    prompt: |
      Columbus's description of the islanders as lacking iron and weapons most directly served which purpose of the letter?
    options:
      - "To warn the Spanish crown that conquest would be impossible without a large army"
      - "To persuade his sponsors that the islands could be taken and exploited at little cost"
      - "To argue that the islanders were the lost tribes of Israel"
      - "To report that the islands were already ruled by a Chinese governor"
    option_explanations:
      - |
        The letter argues the opposite: the people are timid and unarmed, so conquest will be easy.
      - |
        Correct. Unarmed, generous and timid people, plus promises of gold and slaves, made the case for funding a second voyage.
      - |
        Columbus does not identify the islanders with Israel; he calls them heathens to be converted.
      - |
        Although Columbus believed he was near Asia, he reports no Chinese authority on the islands.
    answer: 1
    explanation: |
      Read a source for its audience: Columbus was writing to a royal treasurer who could fund the next voyage.

  - slug: apworld-u04-exam-q02
    type: multiple_choice
    topic_code: "4.2"
    source: "Primary source: Christopher Columbus, Letter to Luis de Sant Angel (1493), American History Leaflets no. 1 (A. Lovell and Co., 1892), Internet Archive"
    points: 1
    stimulus: |
      "They have no iron, nor steel, nor weapons, nor are they fit for them, because although they are well-made men of commanding stature, they appear extraordinarily timid. ... they are so unsuspicious and so generous with what they possess, that no one who had not seen it would believe it. ... I can give them as much gold as they desire, if they will give me a little assistance ... and as many slaves as they choose to send for, all heathens."

      Christopher Columbus, letter to Luis de Sant Angel, 1493 (American History Leaflets no. 1, 1892)
    prompt: |
      The offer of gold and "as many slaves as they choose to send for" best reflects which motive for Spanish expansion in the late fifteenth century?
    options:
      - "A plan to resettle Spanish peasants displaced by the Reconquista"
      - "The desire to open a direct alliance with the Mughal Empire"
      - "An intention to abolish slavery throughout the Spanish possessions"
      - "The crown's wish to find a sea route that bypassed Portuguese posts on the African coast and paid for itself"
    option_explanations:
      - |
        Resettlement was not the purpose of the first voyages; the aim was trade, gold and a route to Asia.
      - |
        The Mughal Empire did not exist until 1526; Columbus sought the Great Khan and the Indies.
      - |
        The promise of slaves shows the opposite of abolition; enslavement was offered as a return on investment.
      - |
        Correct. Castile, excluded from the African route by Portugal, needed a western route that would yield revenue; gold and captives were the promised return.
    answer: 3
    explanation: |
      Motives for exploration: state rivalry, revenue and the search for Asian goods, with religion as justification.

  - slug: apworld-u04-exam-q03
    type: multiple_choice
    topic_code: "2.1"
    source: "Primary source: Christopher Columbus, Letter to Luis de Sant Angel (1493), American History Leaflets no. 1 (A. Lovell and Co., 1892), Internet Archive"
    points: 1
    stimulus: |
      "They have no iron, nor steel, nor weapons, nor are they fit for them, because although they are well-made men of commanding stature, they appear extraordinarily timid. ... they are so unsuspicious and so generous with what they possess, that no one who had not seen it would believe it. ... I can give them as much gold as they desire, if they will give me a little assistance ... and as many slaves as they choose to send for, all heathens."

      Christopher Columbus, letter to Luis de Sant Angel, 1493 (American History Leaflets no. 1, 1892)
    prompt: |
      Review. Columbus's voyage was shaped by the trade networks of Unit 2 in that:
    options:
      - "He was trying to reach the Mongol khans whose empire still ruled China in 1492"
      - "The Ming had invited Europe to send ships after the voyages of Zheng He"
      - "The Silk Road and Indian Ocean trades had carried Asian spices and silk to Europe at prices that made a direct route worth a gamble"
      - "The trans-Saharan trade had collapsed, leaving Europe without any source of gold"
    option_explanations:
      - |
        The Yuan dynasty had fallen in 1368; Columbus's Marco Polo was more than a century out of date.
      - |
        The Ming had ended the treasure voyages in 1433 and did not invite European ships.
      - |
        Correct. The old networks created the demand and the price gap that financed exploration.
      - |
        The trans-Saharan gold trade continued; Portugal reached it by sea at Elmina (1482).
    answer: 2
    explanation: |
      Spiral review of 2.1: exploration was a response to the wealth of the existing Afro-Eurasian networks.

  # ---- Stimulus set B: Las Casas (4.3, 4.5)
  - slug: apworld-u04-exam-q04
    type: multiple_choice
    topic_code: "4.3"
    source: "Primary source: Bartolome de las Casas, A Brief Account of the Destruction of the Indies (1552), English edition printed for R. Hewson (London, 1689), Project Gutenberg"
    points: 1
    stimulus: |
      "... that of Three Millions of Persons, which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce Three Hundred. ... they sent the Males to the Mines to dig and bring away the Gold, which is an intollerable labor; but the Women they made use of to Manure and Till the ground ... The Men died in Mines, hunger starved and oppressed with labor, and the Women perished in the Fields ..."

      Bartolome de las Casas, A Brief Account of the Destruction of the Indies, 1552 (English edition, London, 1689)
    prompt: |
      Modern historians attribute most of the population collapse Las Casas describes to a cause he barely mentions. That cause is:
    options:
      - "Epidemic diseases such as smallpox and measles, to which the Taíno had no immunity"
      - "The deliberate poisoning of wells by Portuguese rivals of Spain"
      - "Mass migration of the Taíno to the mainland to escape the Spanish"
      - "The eruption of volcanoes across the Caribbean in the 1520s"
    option_explanations:
      - |
        Correct. Virgin-soil epidemics killed the majority; forced labour and violence, which Las Casas stresses, compounded the catastrophe.
      - |
        No such Portuguese campaign occurred; Hispaniola was outside Portugal's sphere under Tordesillas.
      - |
        Some Taíno fled to other islands, but migration cannot account for a collapse of this scale.
      - |
        No volcanic catastrophe struck the Caribbean in that decade; disease is the documented cause.
    answer: 0
    explanation: |
      Las Casas wrote to indict Spanish cruelty; disease was the larger killer and the one his argument did not need.

  - slug: apworld-u04-exam-q05
    type: multiple_choice
    topic_code: "4.5"
    source: "Primary source: Bartolome de las Casas, A Brief Account of the Destruction of the Indies (1552), English edition printed for R. Hewson (London, 1689), Project Gutenberg"
    points: 1
    stimulus: |
      "... that of Three Millions of Persons, which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce Three Hundred. ... they sent the Males to the Mines to dig and bring away the Gold, which is an intollerable labor; but the Women they made use of to Manure and Till the ground ... The Men died in Mines, hunger starved and oppressed with labor, and the Women perished in the Fields ..."

      Bartolome de las Casas, A Brief Account of the Destruction of the Indies, 1552 (English edition, London, 1689)
    prompt: |
      The labour arrangement Las Casas describes, in which Spanish settlers were granted the right to the labour of Indigenous communities, was the:
    options:
      - "Hacienda"
      - "Mit'a"
      - "Encomienda"
      - "Asiento"
    option_explanations:
      - |
        Haciendas were landed estates that grew later, employing peons; the early Caribbean grants were encomiendas.
      - |
        The mit'a was the Andean rotational draft Spain adapted at Potosí, not the Caribbean system.
      - |
        Correct. The encomienda gave a Spaniard the tribute and labour of Indigenous people in return for nominal protection and instruction.
      - |
        The asiento was a licence to import enslaved Africans, not a grant of Indigenous labour.
    answer: 2
    explanation: |
      Know the four labour terms and where each applied.

  - slug: apworld-u04-exam-q06
    type: multiple_choice
    topic_code: "1.4"
    source: "Primary source: Bartolome de las Casas, A Brief Account of the Destruction of the Indies (1552), English edition printed for R. Hewson (London, 1689), Project Gutenberg"
    points: 1
    stimulus: |
      "... that of Three Millions of Persons, which lived in Hispaniola itself, there is at present but the inconsiderable remnant of scarce Three Hundred. ... they sent the Males to the Mines to dig and bring away the Gold, which is an intollerable labor; but the Women they made use of to Manure and Till the ground ... The Men died in Mines, hunger starved and oppressed with labor, and the Women perished in the Fields ..."

      Bartolome de las Casas, A Brief Account of the Destruction of the Indies, 1552 (English edition, London, 1689)
    prompt: |
      Review. Unlike the Taíno of Hispaniola, the Inca and Aztec states of topic 1.4 could be exploited through:
    options:
      - "Written law codes that required submission to any foreign ruler"
      - "Standing armies that the Spanish hired as mercenaries"
      - "Established silver mints that Spain converted to coin pesos"
      - "Existing systems of tribute and labour draft that the Spanish took over and redirected"
    option_explanations:
      - |
        Neither state had a law requiring submission to foreigners; the Inca had no alphabetic writing at all.
      - |
        Spain used Indigenous allies such as the Tlaxcalans, not hired Aztec armies.
      - |
        Neither state minted coins; Inca silver was worked for ornament and tribute, not currency.
      - |
        Correct. The Aztec tribute lists and the Inca mit'a already extracted goods and labour; Spain placed itself at the top of both.
    answer: 3
    explanation: |
      Spiral review of 1.4: the structure of the conquered state shaped how the colony extracted wealth.

  # ---- Stimulus set C: Equiano (4.5)
  - slug: apworld-u04-exam-q07
    type: multiple_choice
    topic_code: "4.5"
    source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), ch. 2, Wikisource"
    points: 1
    stimulus: |
      "The first object which saluted my eyes when I arrived on the coast was the sea, and a slave-ship, which was then riding at anchor, and waiting for its cargo. ... The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crouded that each had scarcely room to turn himself, almost suffocated us. ... The shrieks of the women, and the groans of the dying ... I now wished for the last friend, Death, to relieve me."

      Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, 1789
    prompt: |
      The conditions Equiano describes were a direct result of which feature of the Atlantic slave trade?
    options:
      - "The ships were designed for passengers and sailed half empty to reduce disease"
      - "Captains packed as many captives as possible to maximise profit on each crossing"
      - "The voyage lasted only a few days, so no provision was made for comfort"
      - "Enslaved people were carried as crew and worked the sails"
    option_explanations:
      - |
        The ships were cargo vessels; crowding, not emptiness, was the problem Equiano records.
      - |
        Correct. Profit per voyage drove tight packing, and mortality of 10–20 percent was treated as a cost of business.
      - |
        The Middle Passage took six to ten weeks, not days.
      - |
        Captives were chained below decks, not employed as sailors.
    answer: 1
    explanation: |
      The Middle Passage was the trade's human cost; its brutality followed from its economics.

  - slug: apworld-u04-exam-q08
    type: multiple_choice
    topic_code: "4.5"
    source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), ch. 2, Wikisource"
    points: 1
    stimulus: |
      "The first object which saluted my eyes when I arrived on the coast was the sea, and a slave-ship, which was then riding at anchor, and waiting for its cargo. ... The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crouded that each had scarcely room to turn himself, almost suffocated us. ... The shrieks of the women, and the groans of the dying ... I now wished for the last friend, Death, to relieve me."

      Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, 1789
    prompt: |
      Which fact about the Narrative most requires a historian to read it with care as evidence about the eighteenth-century slave trade?
    options:
      - "It was dictated to a Spanish priest who translated it from Arabic"
      - "It was commissioned by the Royal African Company to defend the trade"
      - "It describes only the Portuguese trade to Brazil"
      - "It was published in London in 1789 for an abolitionist readership, decades after the events it describes"
    option_explanations:
      - |
        Equiano wrote in English himself; there was no priest or Arabic original.
      - |
        The Company had no interest in a book that condemned its trade.
      - |
        Equiano's ship was English and sailed to Barbados and Virginia, not Brazil.
      - |
        Correct. The purpose, audience and distance in time shape what Equiano emphasised; the book was a weapon in the campaign for abolition.
    answer: 3
    explanation: |
      Sourcing: audience and purpose do not make a source false, but they tell you what it was built to do.

  - slug: apworld-u04-exam-q09
    type: multiple_choice
    topic_code: "2.4"
    source: "Primary source: Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789), ch. 2, Wikisource"
    points: 1
    stimulus: |
      "The first object which saluted my eyes when I arrived on the coast was the sea, and a slave-ship, which was then riding at anchor, and waiting for its cargo. ... The closeness of the place, and the heat of the climate, added to the number in the ship, which was so crouded that each had scarcely room to turn himself, almost suffocated us. ... The shrieks of the women, and the groans of the dying ... I now wished for the last friend, Death, to relieve me."

      Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano, 1789
    prompt: |
      Review. The Atlantic slave trade differed from the trans-Saharan trade in captives studied in topic 2.4 chiefly in:
    options:
      - "Its scale, its concentration on plantation labour and its transport by sea to the Americas"
      - "Its reliance on African rulers as suppliers, which the trans-Saharan trade never used"
      - "Its direction, since trans-Saharan captives were carried to the Americas as well"
      - "Its exclusive use of women and children, whereas the trans-Saharan trade took only men"
    option_explanations:
      - |
        Correct. Both trades used African suppliers, but the Atlantic trade was far larger, mostly male, plantation-driven and transoceanic.
      - |
        African rulers and merchants supplied both trades; that was a continuity, not a difference.
      - |
        The trans-Saharan trade carried people north to the Mediterranean and the Middle East, never across the Atlantic.
      - |
        The Atlantic trade took mostly men; the trans-Saharan trade took more women and children. This reverses the pattern.
    answer: 0
    explanation: |
      Spiral review of 2.4: compare the two trades on scale, destination, demand and sex ratio.

  # ---- Stimulus set D: continuity and change table (4.8)
  - slug: apworld-u04-exam-q10
    type: multiple_choice
    topic_code: "4.8"
    source: "general knowledge; table compiled for this course"
    points: 1
    stimulus: |
      Networks of exchange, c. 1450 and c. 1750

      | Feature | c. 1450 | c. 1750 |
      |---|---|---|
      | Main carriers of Indian Ocean trade | Gujarati, Arab, Swahili, Chinese merchants | The same, plus Portuguese, Dutch, English companies |
      | Source of silver in China | Japan, domestic mines | Japan, and the Americas via Manila and Europe |
      | Trans-Saharan trade | Gold, salt, captives north to the Mediterranean | Continues; some gold and captives diverted to the Atlantic coast |
      | Atlantic | Portuguese on the African coast; no American contact | Plantation and silver economies; about 80,000 Africans a year enslaved |
      | Europe's place | Edge of Afro-Eurasian trade, paying in silver | Carrier between the Americas, Africa and Asia, still paying Asia in silver |
    prompt: |
      Which conclusion does the table best support?
    options:
      - "The Indian Ocean trade was destroyed and replaced by the Atlantic trade"
      - "Europe became the manufacturing centre of the world by 1750"
      - "New transoceanic routes were added to older networks that continued to operate"
      - "China ceased to import silver once the Americas were discovered"
    option_explanations:
      - |
        The first row shows the old carriers still present in 1750; the Indian Ocean trade continued.
      - |
        The last row says Europe was still paying Asia in silver; Asia remained the source of manufactured goods.
      - |
        Correct. Every row shows an older pattern persisting with new routes and carriers added.
      - |
        The second row shows China importing more silver, from new sources, not less.
    answer: 2
    explanation: |
      The reasoning process of 4.8 is continuity and change; the table is built to show both.

  - slug: apworld-u04-exam-q11
    type: multiple_choice
    topic_code: "4.8"
    source: "general knowledge; table compiled for this course"
    points: 1
    stimulus: |
      Networks of exchange, c. 1450 and c. 1750

      | Feature | c. 1450 | c. 1750 |
      |---|---|---|
      | Main carriers of Indian Ocean trade | Gujarati, Arab, Swahili, Chinese merchants | The same, plus Portuguese, Dutch, English companies |
      | Source of silver in China | Japan, domestic mines | Japan, and the Americas via Manila and Europe |
      | Trans-Saharan trade | Gold, salt, captives north to the Mediterranean | Continues; some gold and captives diverted to the Atlantic coast |
      | Atlantic | Portuguese on the African coast; no American contact | Plantation and silver economies; about 80,000 Africans a year enslaved |
      | Europe's place | Edge of Afro-Eurasian trade, paying in silver | Carrier between the Americas, Africa and Asia, still paying Asia in silver |
    prompt: |
      The change in the "Source of silver in China" row was most directly caused by:
    options:
      - "The Ming decision to pay taxes in silver, which raised its price and drew American silver through Manila"
      - "The Qing conquest of Japan, which transferred Japanese mines to Chinese control"
      - "The Mughal invasion of Yunnan, which opened new mines"
      - "The Dutch discovery of silver in Java"
    option_explanations:
      - |
        Correct. The single-whip tax made silver the medium of Chinese taxation; Chinese demand pulled silver from Potosí across the Pacific and through Europe.
      - |
        The Qing never conquered Japan; Japanese silver reached China through trade.
      - |
        The Mughals never invaded Yunnan, and Yunnan's mines produced copper and some silver long before.
      - |
        Java has no significant silver; the Dutch bought spices there with silver they brought.
    answer: 0
    explanation: |
      Causation: Chinese fiscal policy, not European choice, set the direction of the world's silver.

  - slug: apworld-u04-exam-q12
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge; table compiled for this course"
    points: 1
    stimulus: |
      Networks of exchange, c. 1450 and c. 1750

      | Feature | c. 1450 | c. 1750 |
      |---|---|---|
      | Main carriers of Indian Ocean trade | Gujarati, Arab, Swahili, Chinese merchants | The same, plus Portuguese, Dutch, English companies |
      | Source of silver in China | Japan, domestic mines | Japan, and the Americas via Manila and Europe |
      | Trans-Saharan trade | Gold, salt, captives north to the Mediterranean | Continues; some gold and captives diverted to the Atlantic coast |
      | Atlantic | Portuguese on the African coast; no American contact | Plantation and silver economies; about 80,000 Africans a year enslaved |
      | Europe's place | Edge of Afro-Eurasian trade, paying in silver | Carrier between the Americas, Africa and Asia, still paying Asia in silver |
    prompt: |
      Review. The flow of silver described in the table strengthened the land-based empires of Unit 3 by:
    options:
      - "Allowing the Ottomans, Mughals and Qing to abandon taxation altogether"
      - "Funding salaried officials and standing armies as rulers collected taxes in coin rather than kind"
      - "Replacing their cavalry with steam-powered artillery"
      - "Making the Safavids the main carriers of Indian Ocean trade"
    option_explanations:
      - |
        No empire abandoned taxation; silver changed how taxes were paid, not whether they were.
      - |
        Correct. Silver money let the Mughals pay mansabdars, the Ottomans pay janissaries and the Qing pay bannermen, and let rulers reorganise revenue around coin.
      - |
        Steam power belongs to Unit 5; gunpowder artillery, not steam, armed these empires.
      - |
        The Safavids were a land power with little shipping; Gujaratis and Europeans carried the ocean trade.
    answer: 1
    explanation: |
      Spiral review of 3.2: the Unit 3 empires were financed partly by the Unit 4 silver flows.

  # ---- Stand-alone multiple choice (4.1–4.7)
  - slug: apworld-u04-exam-q13
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The Portuguese caravel's usefulness for exploring the African coast depended most on which borrowed feature?
    options:
      - "A hull of iron plates adopted from Ming shipyards"
      - "Cannon ports copied from Ottoman galleys"
      - "A rudder adopted from Viking longships"
      - "The lateen sail, which let the ship beat against the prevailing wind on the return voyage"
    option_explanations:
      - |
        No iron-hulled ship existed before the nineteenth century; the caravel was wooden.
      - |
        Caravels carried few guns; the heavier carrack and galleon were the gun platforms.
      - |
        The stern-post rudder came from China and northern Europe, but the caravel's distinctive advantage was its rig.
      - |
        Correct. The triangular lateen sail, long used in the Indian Ocean and Mediterranean, let the caravel sail close to the wind and return north against it.
    answer: 3
    explanation: |
      Technology in 4.1 is almost all adopted and recombined; the exam rewards knowing where each piece came from.

  - slug: apworld-u04-exam-q14
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Knowledge of the volta do mar (the "turn of the sea") allowed Portuguese sailors to:
    options:
      - "Calculate longitude at sea using a marine chronometer"
      - "Sail directly against the wind using oars"
      - "Return north from West Africa by swinging west into the Atlantic to catch westerly winds"
      - "Avoid the Sargasso Sea by hugging the Moroccan coast"
    option_explanations:
      - |
        The chronometer was invented in the 1760s; longitude remained a guess in this period.
      - |
        Caravels had no oars for ocean work; sailing against the wind meant tacking with the lateen rig.
      - |
        Correct. Understanding the wind wheel, rather than fighting the trade winds along the coast, made the return voyage practical and later pointed the way across the Atlantic.
      - |
        Hugging the coast was the problem; the volta do mar solved it by leaving the coast.
    answer: 2
    explanation: |
      Navigational knowledge counted as much as instruments.

  - slug: apworld-u04-exam-q15
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge; da Gama's journal is described, not quoted"
    points: 1
    prompt: |
      When Vasco da Gama reached Calicut in 1498, the journal of his voyage records that the Zamorin's officials laughed at his gifts of cloth, hats, coral and sugar, saying the poorest merchant from Mecca gave more. The episode best illustrates:
    options:
      - "That Portugal had entered a trading world far richer than itself, in which it had little to sell"
      - "That Indian rulers refused all contact with Christians"
      - "That the Portuguese had mistaken Calicut for China"
      - "That the Zamorin was a vassal of the Ottoman sultan"
    option_explanations:
      - |
        Correct. Europe's trade goods were unwanted in the Indian Ocean, which is why the Portuguese turned to force and the cartaz, and why silver became the European export.
      - |
        The Zamorin received da Gama; Calicut's Hindu ruler governed a port full of Muslim, Jewish and Christian merchants.
      - |
        Da Gama knew he had reached India; his pilot had sailed from Malindi for Calicut.
      - |
        Calicut was an independent kingdom; the Ottomans had no authority there.
    answer: 0
    explanation: |
      The gifts episode is the standard illustration of why Portugal's empire became one of guns and taxes.

  - slug: apworld-u04-exam-q16
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following was the Ming court's response to the treasure voyages of Zheng He after 1433?
    options:
      - "It doubled the fleet to compete with the Portuguese"
      - "It transferred the fleet to the Tokugawa shogunate"
      - "It founded colonies in East Africa to secure the giraffe trade"
      - "It ended state-sponsored voyages and later restricted the building of large ocean ships"
    option_explanations:
      - |
        The Portuguese did not reach the Indian Ocean until 1498; the Ming scaled down, not up.
      - |
        The Tokugawa shogunate was founded in 1603, long after; Japan received no Chinese fleet.
      - |
        The voyages reached East Africa but established no colonies; the giraffe was a tribute gift, not a trade.
      - |
        Correct. Confucian officials judged the voyages wasteful and the northern Mongol frontier the greater threat; the fleet was allowed to decay.
    answer: 3
    explanation: |
      The Ming decision is the contrast that makes European persistence significant.

  - slug: apworld-u04-exam-q17
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    prompt: |
      The introduction of maize and sweet potatoes to China in the sixteenth century had which long-term effect?
    options:
      - "A decline in population as peasants abandoned rice"
      - "The end of silver imports, since food could be grown instead"
      - "Population growth, as hillsides unsuited to rice could now be farmed"
      - "The conversion of Chinese peasants to Christianity by the missionaries who brought the seeds"
    option_explanations:
      - |
        Rice remained the staple; maize and sweet potatoes were added on marginal land, and population rose.
      - |
        Silver imports and American crops were unrelated flows; both increased.
      - |
        Correct. New World crops opened dry and hilly land, helping China's population roughly double between 1500 and 1750.
      - |
        Crops spread through Manila and Fujian merchants, and conversions were few.
    answer: 2
    explanation: |
