  # ---- Short answer
  - slug: apworld-u04-exam-q40
    type: short_answer
    topic_code: "4.4"
    source: "Primary source: Treaty of Tordesillas (1494), in F. G. Davenport, European Treaties bearing on the History of the United States (Carnegie Institution, 1917), Avalon Project"
    points: 3
    prompt: |
      The Treaty of Tordesillas (1494) provided that "a boundary or straight line be determined and drawn north and south, from pole to pole, on the said ocean sea ... at a distance of three hundred and seventy leagues west of the Cape Verde Islands," with lands east of it to "pertain forever to the said King of Portugal" and lands west to "the said King and Queen of Castile."

      (a) Identify ONE historical circumstance that led Spain and Portugal to negotiate this treaty.
      (b) Explain ONE way the treaty shaped the pattern of European empires in the following century.
      (c) Explain ONE limitation of the treaty as a description of how the world was actually divided after 1500.
    answer: |
      (a) 1 point: Columbus's return in 1493 and Portuguese claims to the African route; the papal bulls of 1493 that favoured Castile and Portugal's demand to move the line west; rivalry between the two Iberian crowns over the Atlantic islands and the route to the Indies.
      (b) 1 point with explanation: Portugal gained Brazil (reached by Cabral in 1500) and the African and Indian Ocean route, so its empire became a chain of trading posts; Spain gained the rest of the Americas and built a territorial empire on silver; the division encouraged Spain to seek a westward route to Asia (Magellan, Manila).
      (c) 1 point with explanation: it ignored every non-European people and state whose lands it allotted; it was unenforceable at sea and other European powers (France, England, the Dutch) ignored it; longitude could not be measured, so the line's position was disputed (the Moluccas, Brazil's extent); the Portuguese empire in Asia was a set of posts among states it could not rule.
    explanation: |
      Scoring: one point per part. (b) and (c) need an explanation, not just a named effect or limit.

  - slug: apworld-u04-exam-q41
    type: short_answer
    topic_code: "4.3"
    source: "general knowledge"
    points: 3
    prompt: |
      (a) Identify ONE effect of the Columbian Exchange on the population of the Americas.
      (b) Explain ONE way that effect changed the labour systems of the Americas between 1500 and 1750.
      (c) Explain ONE effect of the Columbian Exchange on a region of Afro-Eurasia.
    answer: |
      (a) 1 point: demographic collapse of up to 90 percent in a century from smallpox, measles, influenza and typhus; depopulation of the Caribbean islands; the later rise of a mixed population as Europeans and Africans arrived.
      (b) 1 point with explanation: the loss of Indigenous workers made encomienda unworkable and the New Laws (1542) curtailed it; planters turned to enslaved Africans for sugar and later tobacco and rice; Spain adapted the mit'a to keep Potosí staffed; haciendas drew survivors into debt peonage; indentured Europeans were used in the English colonies until Africans replaced them after 1660.
      (c) 1 point with explanation: maize, potatoes and cassava raised populations in Europe, China and West Africa; silver from the Americas inflated prices in Europe and monetised China's taxes; tobacco, sugar and chocolate became consumer goods; syphilis probably spread from the Americas; new crops let Chinese farmers cultivate hills, supporting Qing population growth.
    explanation: |
      Scoring: one point per part; (b) and (c) require an explanation of how the effect worked.

  # ---- Long answer
  - slug: apworld-u04-exam-q42
    type: long_answer
    topic_code: "4.8"
    source: "general knowledge; interpretation written for this course"
    points: 6
    prompt: |
      Evaluate the extent to which the European transoceanic voyages between c. 1450 and c. 1750 changed the world economy.

      Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both continuity and change. Bring in at least one region outside Europe and the Americas.
    answer: |
      Thesis (1 point): a defensible claim about extent, for example that the voyages connected the Americas to Afro-Eurasia for the first time and created an Atlantic plantation and silver economy, a fundamental change, while Asia remained the economic centre and the Indian Ocean and Silk Road networks continued under new participants.
      Contextualisation (1 point): the Afro-Eurasian networks of Unit 2; the Mongol collapse and Ottoman expansion raising the cost of overland trade; Ming withdrawal from the sea; adopted navigational technology; Iberian state rivalry and the Reconquista.
      Evidence (2 points): at least two specific examples, for example Columbus's letter; Tordesillas; Potosí and the Manila galleon; the single-whip tax and Chinese silver demand; the Portuguese cartaz and Goa; the VOC and EIC; the Columbian Exchange crops and disease; Las Casas on Hispaniola; the Atlantic slave trade and Equiano; Dahomey and Asante; mercantilism and the Navigation Acts; Tokugawa restrictions; the continued Gujarati and Swahili trade.
      Analysis and reasoning (1 point): uses continuity and change to explain what was new (global silver flows, the Atlantic system, chartered companies) and what persisted (Asian manufacturing primacy, Indian Ocean merchants, trans-Saharan trade, European silver deficit with Asia).
      Complexity (1 point): weighs regions against one another (Atlantic transformation versus Indian Ocean continuity), traces change within the period (Portuguese posts to Dutch and English companies), connects economic change to environmental and demographic causes, or argues that Asia shaped Europe's role as much as Europe shaped Asia's.
    explanation: |
      Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that leaves out Asia or Africa, or treats the change as total, cannot earn the complexity point.
