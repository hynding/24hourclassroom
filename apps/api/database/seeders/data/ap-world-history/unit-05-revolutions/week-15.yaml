    # ---- Short answer
    - slug: apworld-u05-w15-q22
      type: short_answer
      topic_code: "5.1"
      source: "Primary source: Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), Book I, ch. I, Project Gutenberg"
      points: 3
      prompt: |
        Adam Smith wrote in 1776 that "the greatest improvements in the productive powers of labour ... seem to have been the effects of the division of labour," illustrating it with a pin factory in which ten workers, each doing one step, "could make among them upwards of forty-eight thousand pins in a day."

        (a) Identify ONE economic policy of the period 1600–1750 that Smith's argument was written against.
        (b) Explain ONE way Smith's argument reflects the Enlightenment's methods or assumptions.
        (c) Explain ONE way Smith's ideas influenced economic policy or practice after 1776.
      answer: |
        (a) 1 point: mercantilism; chartered monopolies such as the East India Company; navigation acts; guild restrictions; the treatment of bullion as wealth; colonial trade monopolies.
        (b) 1 point with explanation: he reasons from observation of an actual workshop to a general law, in the empirical manner of the Scientific Revolution; he treats self-interest as a natural force that, like gravity, produces order without a directing authority; he applies reason to an area previously governed by custom and royal privilege; he assumes universal human nature.
        (c) 1 point with explanation: laissez-faire became the doctrine of British policy (repeal of the Corn Laws 1846, free trade); factory organisation adopted the division of labour; critics of the East India Company used his arguments; later classical economists (Ricardo, Malthus) built on him; governments reduced guild and tariff restrictions; his ideas were also used to oppose labour legislation in the industrial age.
      explanation: |
        Scoring: one point per part. (b) and (c) require an explanation linking Smith to the method or the later policy.

    - slug: apworld-u05-w15-q23
      type: short_answer
      topic_code: "5.1"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE Enlightenment idea that challenged an existing political or social hierarchy.
        (b) Explain ONE way Enlightenment ideas were used to support, rather than challenge, an existing hierarchy or practice in the period 1750–1900.
        (c) Explain ONE way a group excluded by the philosophes used Enlightenment arguments on its own behalf.
      answer: |
        (a) 1 point: natural rights; the social contract and consent of the governed; popular sovereignty; equality before the law; religious toleration against established churches; laissez-faire against guild and noble privilege.
        (b) 1 point with explanation: enlightened absolutists used reform language while keeping absolute power and serfdom; racial classification by Linnaeus, Buffon and others gave a scientific vocabulary later used to justify empire and slavery; the civilising mission presented conquest as spreading reason; Locke's property theory was used to dispossess peoples who did not farm in European ways; Rousseau's Émile justified women's exclusion from citizenship.
        (c) 1 point with explanation: Wollstonecraft and de Gouges argued that universal reason meant universal rights; enslaved people in Saint-Domingue claimed the Rights of Man and won abolition in 1794; Equiano and abolitionists used natural rights against the trade; creole elites used popular sovereignty against Spain; Seneca Falls (1848) rewrote the Declaration of Independence for women; Jews in France gained citizenship (1791) by appeal to equal rights.
      explanation: |
        Scoring: one point per part; (b) and (c) require an explanation of how the idea was used.

    # ---- Long answer
    - slug: apworld-u05-w15-q24
      type: long_answer
      topic_code: "5.1"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which the Enlightenment represented a change in European ideas about the source of political authority.

        Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both continuity and change.
      answer: |
        Thesis (1 point): a defensible claim about extent, for example that the Enlightenment relocated the source of authority from God and tradition to the reason and consent of the governed, a fundamental change in theory, while in practice most states remained monarchies and many thinkers kept monarchy, property qualifications and the exclusion of women and the enslaved.
        Contextualisation (1 point): the divine-right monarchies and confessional states of Unit 3; the Reformation and the wars of religion; the Scientific Revolution; the commercial and colonial world of Unit 4 with its merchant elites and hierarchies.
        Evidence (2 points): at least two specific examples, for example Hobbes's Leviathan; Locke's Second Treatise and the Glorious Revolution; Montesquieu's separation of powers; Rousseau's general will; Voltaire and toleration; the Encyclopédie and salons; enlightened absolutism (Catherine's Nakaz, Joseph II's Patent); Wollstonecraft and de Gouges; Burke's conservative reply; Smith on economic authority; the Declaration of Independence and the Rights of Man as applications.
        Analysis and reasoning (1 point): uses continuity and change to distinguish the theory (contract, consent, rights) from the practice (monarchy, serfdom, slavery), or to show that the Enlightenment's method was new while its political conclusions ranged from Hobbes's absolutism to Rousseau's republic.
        Complexity (1 point): compares thinkers (Locke versus Rousseau), traces change over time within the period (from Hobbes to the revolutions), connects ideas to their audiences (creoles, enslaved people, women), or weighs how far enlightened absolutism was change at all.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that treats the Enlightenment as a single doctrine, or as total change, cannot earn the complexity point.
