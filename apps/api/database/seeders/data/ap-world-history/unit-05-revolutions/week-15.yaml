    # ---- True or false
    - slug: apworld-u05-w15-q18
      type: true_false
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Rousseau's Social Contract advocated large representative democracies of the kind created by the French Revolution of 1789.
      answer: false
      explanation: |
        False. Rousseau distrusted representation and thought the general will could operate only in a small republic of citizens like Geneva; the French revolutionaries adopted his language but not his model.

    - slug: apworld-u05-w15-q19
