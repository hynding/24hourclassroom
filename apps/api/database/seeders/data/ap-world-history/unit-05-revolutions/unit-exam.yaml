unit: 5
description: |
  42 questions · about 72 minutes · every topic of Unit 5 (5.1 to 5.10) with review of Units 1 to 4. Four
  source-based multiple-choice sets in the AP style (Rousseau's Social Contract, the Declaration of the Rights of
  Man, Adam Smith's pin factory, and the Communist Manifesto), stand-alone multiple choice, select-all, true/false
  and fill-in-the-blank items, two short-answer questions (3 points each) and one long essay question (6 points).
  Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched
  automatically; the free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: Rousseau (5.1)
  - slug: apworld-u05-exam-q01
    type: multiple_choice
    topic_code: "5.1"
    source: "Primary source: Jean-Jacques Rousseau, The Social Contract (1762), Book I, trans. G. D. H. Cole (1913), Project Gutenberg"
    points: 1
    stimulus: |
      "Man is born free; and everywhere he is in chains. One thinks himself the master of others, and still remains a greater slave than they. ... The problem is to find a form of association which will defend and protect with the whole common force the person and goods of each associate, and in which each, while uniting himself with all, may still obey himself alone, and remain as free as before."

      Jean-Jacques Rousseau, The Social Contract, 1762, Book I (translated by G. D. H. Cole, 1913)
    prompt: |
      Rousseau's "problem" assumes which Enlightenment premise?
    options:
      - "That kings rule by the grace of God"
      - "That people are naturally free and equal, so any legitimate authority must come from their own agreement"
      - "That freedom is impossible and chains are natural"
      - "That the Church should decide the form of government"
    option_explanations:
      - |
        Divine right is the doctrine the Enlightenment rejected; Rousseau derives authority from the people.
      - |
        Correct. 'Born free' is the premise; the problem is how to form a society that keeps that freedom through consent.
      - |
        Rousseau's point is that the chains are not natural and must be made legitimate.
      - |
        The Church plays no role in Rousseau's contract.
    answer: 1
    explanation: |
      The social contract begins from natural freedom and equality.

  - slug: apworld-u05-exam-q02
    type: multiple_choice
    topic_code: "5.1"
    source: "Primary source: Jean-Jacques Rousseau, The Social Contract (1762), Book I, trans. G. D. H. Cole (1913), Project Gutenberg"
    points: 1
    stimulus: |
      "Man is born free; and everywhere he is in chains. One thinks himself the master of others, and still remains a greater slave than they. ... The problem is to find a form of association which will defend and protect with the whole common force the person and goods of each associate, and in which each, while uniting himself with all, may still obey himself alone, and remain as free as before."

      Jean-Jacques Rousseau, The Social Contract, 1762, Book I (translated by G. D. H. Cole, 1913)
    prompt: |
      Which revolutionary document most directly adopted Rousseau's vocabulary?
    options:
      - "The Declaration of the Rights of Man (1789), with its 'general will' and sovereignty in the nation"
      - "The Declaration of Independence (1776), with its 'pursuit of happiness'"
      - "The Treaty of Tordesillas (1494)"
      - "The Napoleonic Code's rules on marriage"
    option_explanations:
      - |
        Correct. Article 6 calls law 'the expression of the general will,' Rousseau's term.
      - |
        The American Declaration follows Locke's rights language; Rousseau's phrases are absent.
      - |
        Tordesillas is a fifteenth-century treaty between two crowns.
      - |
        The Code's family law restored patriarchal authority, the opposite of Rousseau's republican freedom.
    answer: 0
    explanation: |
      Know which thinker each revolution quoted.

  - slug: apworld-u05-exam-q03
    type: multiple_choice
    topic_code: "3.3"
    source: "Primary source: Jean-Jacques Rousseau, The Social Contract (1762), Book I, trans. G. D. H. Cole (1913), Project Gutenberg"
    points: 1
    stimulus: |
      "Man is born free; and everywhere he is in chains. One thinks himself the master of others, and still remains a greater slave than they. ... The problem is to find a form of association which will defend and protect with the whole common force the person and goods of each associate, and in which each, while uniting himself with all, may still obey himself alone, and remain as free as before."

      Jean-Jacques Rousseau, The Social Contract, 1762, Book I (translated by G. D. H. Cole, 1913)
    prompt: |
      Review. The passage's search for legitimacy in agreement rather than in religion contrasts most sharply with which Unit 3 practice?
    options:
      - "The Ottoman millet system"
      - "The Mughal land survey under Todar Mal"
      - "The use of religious authority, such as divine right, the caliphate or the Mandate of Heaven, to legitimise rulers"
      - "The Qing patronage of Tibetan Buddhism among the Mongols"
    option_explanations:
      - |
        Millets organised minorities; they were not a theory of the sultan's legitimacy.
      - |
        The land survey was a revenue measure, unrelated to the source of authority.
      - |
        Correct. Unit 3 rulers claimed authority from God; Rousseau derives it from the people's agreement.
      - |
        Qing patronage of Buddhism was a tool of legitimacy, but the general practice in option three is the broader contrast.
    answer: 2
    explanation: |
      Spiral review of 3.3: the Enlightenment answered the religious legitimacy of the land-based empires.

  # ---- Stimulus set B: Rights of Man (5.2)
  - slug: apworld-u05-exam-q04
    type: multiple_choice
    topic_code: "5.2"
    source: "Primary source: Declaration of the Rights of Man and of the Citizen (1789), Avalon Project"
    points: 1
    stimulus: |
      "1. Men are born and remain free and equal in rights. Social distinctions may be founded only upon the general good. 2. The aim of all political association is the preservation of the natural and imprescriptible rights of man. These rights are liberty, property, security, and resistance to oppression. 3. The principle of all sovereignty resides essentially in the nation. No body nor individual may exercise any authority which does not proceed directly from the nation."

      Declaration of the Rights of Man and of the Citizen, France, 1789
    prompt: |
      Article 1's provision that social distinctions may be founded "only upon the general good" was aimed at:
    options:
      - "The distinction between French and foreign citizens"
      - "The ranks of the revolutionary army"
      - "The difference between Paris and the provinces"
      - "The division of society into privileged orders of clergy and nobility by birth"
    option_explanations:
      - |
        Citizenship is not the subject of Article 1; the orders are.
      - |
        Military rank was not what the Assembly meant by social distinctions founded on birth.
      - |
        Regional difference was not the target; hereditary privilege was.
      - |
        Correct. The three estates, with privilege by birth, were the distinctions the National Assembly abolished on 4 August 1789.
    answer: 3
    explanation: |
      The social revolution of 1789 is in Article 1.

  - slug: apworld-u05-exam-q05
    type: multiple_choice
    topic_code: "5.2"
    source: "Primary source: Declaration of the Rights of Man and of the Citizen (1789), Avalon Project"
    points: 1
    stimulus: |
      "1. Men are born and remain free and equal in rights. Social distinctions may be founded only upon the general good. 2. The aim of all political association is the preservation of the natural and imprescriptible rights of man. These rights are liberty, property, security, and resistance to oppression. 3. The principle of all sovereignty resides essentially in the nation. No body nor individual may exercise any authority which does not proceed directly from the nation."

      Declaration of the Rights of Man and of the Citizen, France, 1789
    prompt: |
      The inclusion of "property" among the natural rights in Article 2 helps explain which later development?
    options:
      - "The Assembly's refusal to abolish slavery in the colonies until the enslaved of Saint-Domingue had already risen"
      - "The immediate grant of the vote to women"
      - "The Assembly's decision to restore the king's absolute power"
      - "The abolition of all private ownership in 1790"
    option_explanations:
      - |
        Correct. Enslaved people were legally property; the Assembly's planters' lobby used Article 2 to block abolition until 1794.
      - |
        Women received no vote; property rights did not extend citizenship to them.
      - |
        Article 3 removed sovereignty from the king; nothing restored absolutism.
      - |
        The Assembly protected property; abolition of ownership was never proposed.
    answer: 0
    explanation: |
      The rights of 1789 had limits that the Haitian Revolution exposed.

  - slug: apworld-u05-exam-q06
    type: multiple_choice
    topic_code: "4.7"
    source: "Primary source: Declaration of the Rights of Man and of the Citizen (1789), Avalon Project"
    points: 1
    stimulus: |
      "1. Men are born and remain free and equal in rights. Social distinctions may be founded only upon the general good. 2. The aim of all political association is the preservation of the natural and imprescriptible rights of man. These rights are liberty, property, security, and resistance to oppression. 3. The principle of all sovereignty resides essentially in the nation. No body nor individual may exercise any authority which does not proceed directly from the nation."

      Declaration of the Rights of Man and of the Citizen, France, 1789
    prompt: |
      Review. Which group in the colonial hierarchies of Unit 4 would have found Article 1 most useful against the order that ranked it?
    options:
      - "Peninsulares holding viceregal office"
      - "Manchu bannermen"
      - "Ottoman janissaries"
      - "Free people of colour in Saint-Domingue and creoles in Spanish America, ranked below whites or peninsulares by birth"
    option_explanations:
      - |
        Peninsulares benefited from distinction by birth.
      - |
        Bannermen were the privileged minority of the Qing.
      - |
        Janissaries were an Ottoman military corps, outside the Atlantic colonial order.
      - |
        Correct. Free coloured planters in Saint-Domingue demanded citizenship under Article 1 in 1790–91, and creoles used equality against peninsular privilege.
    answer: 3
    explanation: |
      Spiral review of 4.7: the hierarchies of 1450–1750 met the rights of 1789.

  # ---- Stimulus set C: Smith's pin factory (5.3)
  - slug: apworld-u05-exam-q07
    type: multiple_choice
    topic_code: "5.3"
    source: "Primary source: Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), Book I, ch. I, Project Gutenberg"
    points: 1
    stimulus: |
      "The greatest improvements in the productive powers of labour, and the greater part of the skill, dexterity, and judgment, with which it is anywhere directed, or applied, seem to have been the effects of the division of labour. ... One man draws out the wire; another straights it; a third cuts it; a fourth points it; a fifth grinds it at the top for receiving the head ... Those ten persons, therefore, could make among them upwards of forty-eight thousand pins in a day."

      Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations, 1776, Book I, chapter I
    prompt: |
      Smith identifies the division of labour as the main source of rising productivity. Which feature of British industrialisation after 1776 most directly extended his principle?
    options:
      - "The putting-out of whole tasks to rural households"
      - "The repeal of the Corn Laws"
      - "The gold standard"
      - "The factory, in which subdivided tasks were assigned to machines tended by workers"
    option_explanations:
      - |
        Putting-out dispersed work; Smith describes concentrated specialisation.
      - |
        The Corn Laws concerned grain tariffs, not production methods.
      - |
        The gold standard concerned currency, not the organisation of work.
      - |
        Correct. Once a job was divided into steps, each could be mechanised; Cromford and the cotton mills did exactly that.
    answer: 3
    explanation: |
      Smith's workshop became the factory.

  - slug: apworld-u05-exam-q08
    type: multiple_choice
    topic_code: "5.7"
    source: "Primary source: Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), Book I, ch. I, Project Gutenberg"
    points: 1
    stimulus: |
      "The greatest improvements in the productive powers of labour, and the greater part of the skill, dexterity, and judgment, with which it is anywhere directed, or applied, seem to have been the effects of the division of labour. ... One man draws out the wire; another straights it; a third cuts it; a fourth points it; a fifth grinds it at the top for receiving the head ... Those ten persons, therefore, could make among them upwards of forty-eight thousand pins in a day."

      Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations, 1776, Book I, chapter I
    prompt: |
      Smith's broader argument in The Wealth of Nations became the basis of which nineteenth-century economic policy?
    options:
      - "Mercantilist navigation acts"
      - "Bismarck's social insurance"
      - "Laissez-faire and free trade, as in Britain's repeal of the Corn Laws in 1846"
      - "The Soviet five-year plans"
    option_explanations:
      - |
        Smith attacked mercantilism; navigation acts were his target.
      - |
        Social insurance was a state intervention Smith's followers resisted.
      - |
        Correct. Free trade and minimal interference were Smith's policy, adopted by Britain as the industrial leader.
      - |
        Planned economies belong to the twentieth century and reject Smith.
    answer: 2
    explanation: |
      Laissez-faire is the economic ideology of 5.7.

  - slug: apworld-u05-exam-q09
    type: multiple_choice
    topic_code: "2.3"
    source: "Primary source: Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), Book I, ch. I, Project Gutenberg"
    points: 1
    stimulus: |
      "The greatest improvements in the productive powers of labour, and the greater part of the skill, dexterity, and judgment, with which it is anywhere directed, or applied, seem to have been the effects of the division of labour. ... One man draws out the wire; another straights it; a third cuts it; a fourth points it; a fifth grinds it at the top for receiving the head ... Those ten persons, therefore, could make among them upwards of forty-eight thousand pins in a day."

      Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations, 1776, Book I, chapter I
    prompt: |
      Review. The British cotton industry that applied Smith's principle with machines took as its model and rival the cloth of which region, studied in topic 2.3?
    options:
      - "The cotton textiles of India, long the Indian Ocean's chief manufactured export"
      - "The wool of Flanders"
      - "The silk of Song China"
      - "The furs of Siberia"
    option_explanations:
      - |
        Correct. Indian calicoes created the demand; the jenny, frame and mule let Britain undersell them.
      - |
        Flemish wool was Europe's own medieval industry; cotton was imitated from Asia.
      - |
        Chinese silk was imported but not the product Lancashire set out to copy.
      - |
        Furs were a Russian trade unrelated to textiles.
    answer: 0
    explanation: |
      Spiral review of 2.3: the industrial revolution began by copying an Asian product.

  # ---- Stimulus set D: Communist Manifesto (5.8)
  - slug: apworld-u05-exam-q10
    type: multiple_choice
    topic_code: "5.8"
    source: "Primary source: Karl Marx and Friedrich Engels, Manifesto of the Communist Party (1848), English edition of 1888, Project Gutenberg"
    points: 1
    stimulus: |
      "The history of all hitherto existing societies is the history of class struggles. ... The bourgeoisie ... has left remaining no other nexus between man and man than naked self-interest, than callous 'cash payment'. ... The bourgeoisie, by the rapid improvement of all instruments of production, draws all, even the most barbarian, nations into civilisation. ... They have a world to win. WORKING MEN OF ALL COUNTRIES, UNITE!"

      Karl Marx and Friedrich Engels, Manifesto of the Communist Party, 1848 (English edition of 1888)
    prompt: |
      The final call to "working men of all countries" reflects the authors' belief that:
    options:
      - "Industrial capitalism had created a single international working class whose interests crossed national borders"
      - "Each nation should pursue its own industrial policy"
      - "Workers should support their national monarchs"
      - "Only British workers could make a revolution"
    option_explanations:
      - |
        Correct. The Manifesto treats the proletariat as international because capital is; nationalism was for Marx a bourgeois distraction.
      - |
        National industrial policy is the opposite of the Manifesto's internationalism.
      - |
        The Manifesto calls for the overthrow of existing governments, not loyalty to kings.
      - |
        The call is to all countries; the 1888 edition noted the growth of workers' parties across Europe and America.
    answer: 0
    explanation: |
      Marxism was the industrial age's international ideology, as nationalism was its national one.

  - slug: apworld-u05-exam-q11
    type: multiple_choice
    topic_code: "5.8"
    source: "Primary source: Karl Marx and Friedrich Engels, Manifesto of the Communist Party (1848), English edition of 1888, Project Gutenberg"
    points: 1
    stimulus: |
      "The history of all hitherto existing societies is the history of class struggles. ... The bourgeoisie ... has left remaining no other nexus between man and man than naked self-interest, than callous 'cash payment'. ... The bourgeoisie, by the rapid improvement of all instruments of production, draws all, even the most barbarian, nations into civilisation. ... They have a world to win. WORKING MEN OF ALL COUNTRIES, UNITE!"

      Karl Marx and Friedrich Engels, Manifesto of the Communist Party, 1848 (English edition of 1888)
    prompt: |
      Which government response of the later nineteenth century was designed most directly to counter the appeal of the ideas in this passage?
    options:
      - "The repeal of the Corn Laws"
      - "The Treaty of Balta Liman"
      - "Bismarck's sickness, accident and old-age insurance laws of 1883–1889"
      - "The Meiji Charter Oath"
    option_explanations:
      - |
        The Corn Laws' repeal (1846) was a free-trade measure aimed at landowners, not socialists.
      - |
        Balta Liman was a trade treaty imposed on the Ottomans in 1838.
      - |
        Correct. Bismarck created state welfare to take the ground from under the Social Democrats, whose programme was Marxist.
      - |
        The Charter Oath (1868) launched Meiji reform and had nothing to do with socialism.
    answer: 2
    explanation: |
      Conservative welfare was a reaction to socialism.

  - slug: apworld-u05-exam-q12
    type: multiple_choice
    topic_code: "4.5"
    source: "Primary source: Karl Marx and Friedrich Engels, Manifesto of the Communist Party (1848), English edition of 1888, Project Gutenberg"
    points: 1
    stimulus: |
      "The history of all hitherto existing societies is the history of class struggles. ... The bourgeoisie ... has left remaining no other nexus between man and man than naked self-interest, than callous 'cash payment'. ... The bourgeoisie, by the rapid improvement of all instruments of production, draws all, even the most barbarian, nations into civilisation. ... They have a world to win. WORKING MEN OF ALL COUNTRIES, UNITE!"

      Karl Marx and Friedrich Engels, Manifesto of the Communist Party, 1848 (English edition of 1888)
    prompt: |
      Review. Marx's claim that the bourgeoisie draws all nations into its market continues a process that began with which development of Unit 4?
    options:
      - "The Tokugawa closure of Japan"
      - "The Ottoman millet system"
      - "The Qing queue edict"
      - "The creation of a global trade network linking the Americas, Africa, Europe and Asia through silver, sugar and slaves"
    option_explanations:
      - |
        Japan's closure was a withdrawal from the market, not its extension.
      - |
        Millets concerned religious communities, not trade.
      - |
        The queue was a political marker in China, unrelated to markets.
      - |
        Correct. The Atlantic and Pacific trades of 4.4–4.5 first joined the world's economies; industrial capitalism deepened the connection.
    answer: 3
    explanation: |
      Spiral review of 4.5: the world market has a history that predates the factory.

  # ---- Stand-alone multiple choice (5.1–5.10)
  - slug: apworld-u05-exam-q13
    type: multiple_choice
    topic_code: "5.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Mary Wollstonecraft's Vindication of the Rights of Woman (1792) applied Enlightenment principles by arguing that:
    options:
      - "Women were naturally weaker and should be excluded from public life"
      - "Women should rule in place of men"
      - "Reason is universal, so women's apparent weakness was the product of education and their exclusion from rights was a contradiction"
      - "The Church alone could define women's role"
    option_explanations:
      - |
        That was Rousseau's view in Émile, which Wollstonecraft attacked.
      - |
        She claimed equality of reason and rights, not supremacy; the Vindication asks for education, not rule.
      - |
        Correct. Her argument is Locke's universal reason applied to women.
      - |
        She argued from reason, not from religious authority.
    answer: 2
    explanation: |
      Early feminism used the Enlightenment against the philosophes' exclusions.

  - slug: apworld-u05-exam-q14
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Napoleon's invasion of Spain in 1808 triggered Spanish American independence because it:
    options:
      - "Gave the colonies to France directly"
      - "Removed the Spanish king, leaving colonial juntas to decide whom they obeyed, which became independence when Spain tried to reassert control"
      - "Abolished slavery throughout Spanish America"
      - "Allowed Bolívar to become viceroy of Peru"
    option_explanations:
      - |
        France never governed the American colonies; the juntas refused Joseph Bonaparte.
      - |
        Correct. The crisis of legitimacy at the centre opened the question of sovereignty in the colonies.
      - |
        Slavery was abolished gradually by the new republics decades later.
      - |
        Bolívar was never a Spanish official; he was a creole revolutionary.
    answer: 1
    explanation: |
      Causation: a European war was the trigger for American independence.

  - slug: apworld-u05-exam-q15
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The Haitian Revolution's effect on the Atlantic world included:
    options:
      - "The French sale of Louisiana (1803) and tighter control of enslaved populations by slaveholders in the United States, Cuba and Brazil"
      - "The immediate abolition of slavery in the United States"
      - "The recognition of Haiti by every American state in 1804"
      - "The end of sugar production in the Caribbean"
    option_explanations:
      - |
        Correct. Napoleon abandoned his American plans and sold Louisiana; slaveholding states treated Haiti as a warning and refused recognition.
      - |
        The United States kept slavery until 1865 and did not recognise Haiti until 1862.
      - |
        Recognition was withheld for decades; France demanded an indemnity in 1825.
      - |
        Sugar moved to Cuba, which boomed after Saint-Domingue's collapse.
    answer: 0
    explanation: |
      Effects of Haiti: a model for the enslaved, a warning for their owners.

  - slug: apworld-u05-exam-q16
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    prompt: |
      The unification of Italy (1861) and of Germany (1871) best illustrates which use of nationalism?
    options:
      - "Nationalism from below, by republican revolution"
      - "Nationalism as a movement for the abolition of slavery"
      - "Nationalism directed against industrialisation"
      - "Nationalism harnessed from above by monarchies (Piedmont, Prussia) using war and diplomacy"
    option_explanations:
      - |
        The republican risings of 1848 failed; the states were made by kings' ministers.
      - |
        Slavery was not an issue in Italian or German unification.
      - |
        Both new states promoted industry; Germany led the second industrial revolution.
      - |
        Correct. Cavour and Bismarck practised realpolitik, turning a popular idea into royal gain.
    answer: 3
    explanation: |
      Nationalism served conservatives as well as revolutionaries.

  - slug: apworld-u05-exam-q17
    type: multiple_choice
    topic_code: "5.4"
    source: "general knowledge"
    points: 1
    prompt: |
      The spread of industrialisation to Germany after 1871 and the deindustrialisation of India in the same century are best explained together by:
    options:
      - "The absence of coal in Germany"
      - "The presence in Germany of coal, a unified market and protective tariffs, and in India of colonial rule that removed tariffs and opened the market to British machine-made cloth"
      - "India's choice to stop weaving"
      - "A treaty between Germany and India"
    option_explanations:
      - |
        The Ruhr held Europe's richest coalfield.
      - |
        Correct. Industrialisation spread where its conditions and political control recurred; India had neither the coal-based industry nor the sovereignty to protect its crafts.
      - |
        Indian weavers were undersold, not voluntary leavers.
      - |
        No such treaty existed; Germany and British India had no trade agreement shaping either outcome.
    answer: 1
    explanation: |
      5.4 asks for both the spread and its opposite.

  - slug: apworld-u05-exam-q18
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      James Watt's improvements to the steam engine (1769, 1781) changed the location of industry because they:
    options:
      - "Required factories to be built beside fast rivers"
      - "Made coal unnecessary"
      - "Allowed factories to be sited near coalfields and in towns rather than beside water"
      - "Moved all industry to the countryside"
    option_explanations:
      - |
        Water-powered mills needed rivers; steam ended that need.
      - |
        Steam engines burned coal; its demand multiplied.
      - |
        Correct. Steam freed the mill from the river and created the coalfield city.
      - |
        The effect was the opposite: concentration in Manchester, Leeds, Birmingham, Glasgow.
    answer: 2
    explanation: |
      Technology changed geography.

  - slug: apworld-u05-exam-q19
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which pair correctly matches a second-industrial-revolution technology with its leading producers?
    options:
      - "Steam engines: Egypt and the Ottoman Empire"
      - "Railways: Haiti"
      - "Cotton spinning machines: Russia"
      - "Steel, chemicals and electrical equipment: Germany and the United States"
    option_explanations:
      - |
        Neither Egypt nor the Ottomans produced engines; both imported them.
      - |
        Haiti built no significant railways in the century.
      - |
        Russia imported British machines; it did not lead in textiles.
      - |
        Correct. German firms (Krupp, BASF, Siemens) and American ones (Carnegie, Edison) led steel, chemicals and electricity after 1870.
    answer: 3
    explanation: |
      The second industrial revolution had new leaders.

  - slug: apworld-u05-exam-q20
