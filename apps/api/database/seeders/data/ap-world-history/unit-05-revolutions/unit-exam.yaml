  # ---- Short answer
  - slug: apworld-u05-exam-q40
    type: short_answer
    topic_code: "5.2"
    source: "Primary source: Declaration of Sentiments (Seneca Falls, 1848), National Park Service"
    points: 3
    prompt: |
      The Declaration of Sentiments (Seneca Falls, New York, 1848) begins: "We hold these truths to be self-evident; that all men and women are created equal," and charges that "He has never permitted her to exercise her inalienable right to the elective franchise" and "He has withheld from her rights which are given to the most ignorant and degraded men - both natives and foreigners."

      (a) Identify ONE earlier document or thinker whose ideas the Declaration of Sentiments adapts.
      (b) Explain ONE way the Declaration's demands reflected changes in society brought by the industrial age.
      (c) Explain ONE way the women's movement of the nineteenth century was connected to another reform movement of the period.
    answer: |
      (a) 1 point: the Declaration of Independence (1776), which it rewrites with 'men and women'; Locke's natural rights; Wollstonecraft's Vindication (1792); de Gouges's Declaration of the Rights of Woman (1791); the Declaration of the Rights of Man (1789).
      (b) 1 point with explanation: industrialisation separated home from workplace and the cult of domesticity confined middle-class women to the home, against which educated women demanded a public role; women's factory labour and the 'degraded men' who could vote (new immigrant and working-class voters after suffrage expansion) made exclusion by sex more visible; new property and divorce laws were needed as wealth became movable and commercial; the print culture and railways of the industrial age allowed conventions and petitions to organise nationally.
      (c) 1 point with explanation: the abolitionist movement trained the organisers of Seneca Falls (Stanton and Mott met at the 1840 World Anti-Slavery Convention, where women were excluded), and Frederick Douglass spoke for the suffrage resolution; both movements argued from natural rights; temperance and the campaigns against child labour drew the same reformers; British suffragists emerged from the anti-slavery and Chartist milieu; later, socialists in Germany (Bebel) took up women's rights.
    explanation: |
      Scoring: one point per part. (b) and (c) require an explanation of the connection, not a bare name.

  - slug: apworld-u05-exam-q41
    type: short_answer
    topic_code: "5.6"
    source: "general knowledge"
    points: 3
    prompt: |
      (a) Identify ONE similarity between the industrialisation programmes of Meiji Japan and of Muhammad Ali's Egypt.
      (b) Explain ONE reason their outcomes differed.
      (c) Explain ONE way state-led industrialisation in the nineteenth century differed from Britain's industrialisation.
    answer: |
      (a) 1 point: both were responses to Western military and economic power (Perry; the Napoleonic invasion and European fleets); both built state factories, arsenals and shipyards with European engineers; both conscripted peasants into modern armies; both taxed or seized peasant resources to pay; both sent students abroad and founded technical schools.
      (b) 1 point with explanation: Japan kept its sovereignty and regained tariffs (1899) while Egypt lost both through Balta Liman (1838) and British occupation (1882); Japan built on Tokugawa literacy, roads and commerce, Egypt on a poorer base; Japan sold factories to private firms that became the zaibatsu, while Egypt's remained state monopolies that Europe dismantled; Japan abolished its old elite, while Egypt's programme depended on one ruler and lapsed after him; Japan's cotton and silk could be processed at home, Egypt's cotton was exported raw.
      (c) 1 point with explanation: Britain industrialised through private capital, markets and inventors over seventy years, with the state providing law and later regulation; state-led programmes compressed the process into a generation under government direction, financed by taxes or foreign loans, with the state choosing industries (arsenals, railways) for strategic reasons; Britain's industry grew out of an existing commercial economy, while Japan, Russia and Egypt had to create the preconditions deliberately; Britain exported manufactures and faced no industrial rival, while latecomers needed tariffs and often lacked them.
    explanation: |
      Scoring: one point per part; (b) and (c) require an explanation of why the outcomes differed or how the paths differed.

  # ---- Long answer
  - slug: apworld-u05-exam-q42
    type: long_answer
    topic_code: "5.10"
    source: "general knowledge; interpretation written for this course"
    points: 6
    prompt: |
      Evaluate the extent to which the political and industrial revolutions of the period c. 1750 to c. 1900 changed the political and social structures of societies in at least two regions of the world.

      Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both continuity and change.
    answer: |
      Thesis (1 point): a defensible claim about extent, for example that the revolutions replaced divine-right monarchy and a society of orders with nation-states, constitutions and classes in the Atlantic world, and reached other regions as state-led reform and economic reorganisation, while monarchies, aristocracies, patriarchy and agrarian life persisted for most people.
      Contextualisation (1 point): the land-based and maritime empires of Units 3 and 4; the Enlightenment; the Atlantic economy and its hierarchies; the Scientific and agricultural revolutions.
      Evidence (2 points): at least two specific examples from each of two regions, for example the Declaration of Independence and the survival of slavery; the Rights of Man, the abolition of privilege and the Napoleonic Code; the Haitian Revolution's abolition; Latin American republics and caudillos; Italian and German unification; Seneca Falls; the factory, Manchester, the Factory Acts, unions and Chartism; Marx and Bismarck's insurance; Meiji Japan's abolition of the samurai and conscription; the Tanzimat's legal equality; Russian emancipation and Witte; Egypt's cotton economy; India's deindustrialisation.
      Analysis and reasoning (1 point): uses continuity and change to explain what was new (popular sovereignty, the nation, classes, wage labour, mass politics, the regulating state) and what persisted (monarchy nearly everywhere, aristocratic power, patriarchal law, coerced labour in new forms, hand farming for most of humanity).
      Complexity (1 point): compares regions to show uneven change, traces change within the period (1789 to 1815; before and after 1850), distinguishes political from social change (Haiti versus Latin America), connects political and industrial revolutions to one another, or notes how the excluded used the revolutions' principles.
      Scoring note: an essay that addresses only political or only industrial change, or only one region, cannot earn the complexity point.
    explanation: |
      Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1.
