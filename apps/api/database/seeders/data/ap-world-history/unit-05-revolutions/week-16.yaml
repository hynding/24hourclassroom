    # ---- Short answer
    - slug: apworld-u05-w16-q22
      type: short_answer
      topic_code: "5.2"
      source: "general knowledge; the Haitian Declaration is described, not quoted"
      points: 3
      prompt: |
        On 1 January 1804 Jean-Jacques Dessalines proclaimed the independence of Haiti. The declaration, read at Gonaïves, renounced France forever, restored the island's Indigenous name, and called on the people to swear that they would die rather than live again under French rule.

        (a) Identify ONE cause of the Haitian Revolution.
        (b) Explain ONE way the Haitian Revolution differed in its outcome from the American Revolution.
        (c) Explain ONE effect of the Haitian Revolution on another society in the Atlantic world.
      answer: |
        (a) 1 point: the brutality and demography of the sugar plantation system; the French Revolution's split of the white population and the free coloured demand for citizenship; the Rights of Man as a claim the enslaved could make; Vodou and maroon networks of organisation; the leadership of Boukman, Toussaint and Dessalines.
        (b) 1 point with explanation: Haiti abolished slavery and destroyed the planter class, a social revolution, whereas the United States kept slavery and its elites; Haiti was led by the formerly enslaved, the United States by colonial gentry; Haiti was isolated diplomatically (no U.S. recognition until 1862, French indemnity 1825), the United States was recognised by France in 1778 and by Britain in 1783.
        (c) 1 point with explanation: France sold Louisiana to the United States (1803) after losing the colony; slaveholders in the United States, Cuba and Brazil tightened control and censored news of Haiti; Cuban sugar expanded to replace Saint-Domingue's; abolitionists in Britain used Haiti as proof of Black capacity; Bolívar received arms and ships from Haiti's President Pétion in 1816 on condition that he free the enslaved; refugees carried the revolution's news to Louisiana and Jamaica.
      explanation: |
        Scoring: one point per part. (b) and (c) require an explanation, not just a named difference or effect.

    - slug: apworld-u05-w16-q23
      type: short_answer
      topic_code: "5.2"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE state created or unified through nationalism between 1821 and 1871.
        (b) Explain ONE way nationalism was used by an existing government to expand or consolidate its power in this period.
        (c) Explain ONE way nationalism challenged an existing multi-ethnic empire in this period.
      answer: |
        (a) 1 point: Greece (1830); Belgium (1830); the Kingdom of Italy (1861); the German Empire (1871); Serbia or Romania (autonomy and independence by 1878).
        (b) 1 point with explanation: Bismarck used Prussia's wars and the nationalist enthusiasm they produced to bring the German states under the Prussian king, then used the empire to contain liberals; Cavour used Piedmont's constitution and the nationalist cause to absorb the Italian states by war and plebiscite; Napoleon III used national glory to legitimise his empire; Meiji Japan built a national cult of the emperor to unify reform (week 17).
        (c) 1 point with explanation: the Greek rising and later Serbian, Romanian and Bulgarian movements detached Ottoman provinces with European help; Hungarian, Czech and Italian nationalists shook the Habsburg Empire in 1848 and forced the Compromise of 1867; Polish risings (1830, 1863) challenged Russia; Filipino and Cuban nationalists ended Spain's last empire in 1898; the principle that each people deserves a state had no place for empires of many peoples.
      explanation: |
        Scoring: one point per part; (b) and (c) require an explanation of how nationalism worked for or against the state.

    # ---- Long answer
    - slug: apworld-u05-w16-q24
      type: long_answer
      topic_code: "5.2"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Compare the causes and outcomes of two of the Atlantic revolutions (American, French, Haitian, Latin American) between 1750 and 1830, and evaluate the extent to which they were products of Enlightenment ideas.

        Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both similarities and differences.
      answer: |
        Thesis (1 point): a defensible claim that compares the two revolutions and takes a position on extent, for example that both used Enlightenment language of rights and consent, but that each was caused primarily by concrete grievances (taxation, privilege, slavery, exclusion) and produced outcomes that reflected who led it rather than the ideas it proclaimed.
        Contextualisation (1 point): the Enlightenment of week 15; the colonial economies and hierarchies of Unit 4; the Seven Years' War and imperial debt; the absolutist and confessional states of Unit 3.
        Evidence (2 points): at least two specific examples for each revolution, for example the Stamp Act and the Declaration of Independence; the Constitution and the survival of slavery; the Estates-General, the abolition of privilege and the Declaration of the Rights of Man; the Terror and the Napoleonic Code; Saint-Domingue's demography, the 1791 rising, the abolition of 1794 and the Declaration of 1804; creole exclusion, Napoleon's invasion of Spain, the Jamaica Letter, Gran Colombia's collapse and the slow end of slavery.
        Analysis and reasoning (1 point): uses comparison to explain a similarity (shared vocabulary of rights, imperial fiscal crises) and a difference (political versus social outcome; leadership by elites versus the enslaved) with reasons.
        Complexity (1 point): weighs ideas against material causes, distinguishes justification from cause, traces how one revolution influenced another (France to Haiti, Haiti to Bolívar), or notes who each revolution excluded and how the excluded used its principles.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that attributes the revolutions wholly to ideas, or compares without explaining the differences, caps at 4.
