    # ---- Short answer
    - slug: apworld-u05-w18-q22
      type: short_answer
      topic_code: "5.8"
      source: "Primary source: Karl Marx and Friedrich Engels, Manifesto of the Communist Party (1848), English edition of 1888, Project Gutenberg"
      points: 3
      prompt: |
        Marx and Engels wrote in 1848 that "the history of all hitherto existing societies is the history of class struggles," that the bourgeoisie "has left remaining no other nexus between man and man than naked self-interest, than callous 'cash payment'," and that the workers "have a world to win."

        (a) Identify ONE condition of industrial workers in the 1840s that the authors' argument responded to.
        (b) Explain ONE way the authors' view of the bourgeoisie differed from that of the utopian socialists or of liberals such as Smiles.
        (c) Explain ONE effect of Marxist ideas on politics in Europe before 1900.
      answer: |
        (a) 1 point: long hours and low wages in textile mills; child labour; unemployment in the slumps of the 1840s (the hungry forties); slum housing, cholera and short life expectancy in Manchester and other towns; the failure of Chartism to win the vote; the breaking of older crafts and communities.
        (b) 1 point with explanation: Marx saw the bourgeoisie as a historically progressive class that had created unprecedented productive power and must be overthrown by its own creation, the proletariat, through class struggle; the utopians hoped to persuade employers and build cooperative communities without conflict; Smiles saw poverty as a failure of individual character curable by self-help, not as a product of class relations.
        (c) 1 point with explanation: the German Social Democratic Party, Marxist in programme, became the largest party in the Reichstag by 1912 and prompted Bismarck's anti-socialist laws and social insurance; the First (1864) and Second (1889) Internationals linked workers' parties across borders; the Paris Commune (1871) was read through Marx; trade unions and labour parties adopted socialist aims; governments expanded suffrage and regulation partly to contain the socialist threat; Russian Marxists (Lenin) prepared the revolution of 1917.
      explanation: |
        Scoring: one point per part. (b) and (c) require an explanation of the difference or the effect, not a bare name.

    - slug: apworld-u05-w18-q23
      type: short_answer
      topic_code: "5.9"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE way industrialisation changed the lives of women or children in Europe between 1780 and 1900.
        (b) Explain ONE way governments responded to the conditions of women and children in industry.
        (c) Explain ONE way the social hierarchy of industrial societies differed from the hierarchies of the period 1450–1750.
      answer: |
        (a) 1 point: women and children became a large share of the early mill workforce (about half of Lancashire cotton operatives were women in the 1830s); children worked twelve-hour days before 1833; later, middle-class women were confined to the home under the cult of domesticity; compulsory schooling removed children from work; the separation of home and workplace replaced the household economy; women's work shifted to domestic service and, later, clerical jobs.
        (b) 1 point with explanation: the Factory Act of 1833 limited children's hours and created inspectors after the Sadler Committee; the Mines Act of 1842 removed women and children from underground work; the Ten Hours Act of 1847 limited women's and young persons' hours; compulsory education laws (Prussia, Britain 1880, Japan 1872) took children out of mills; Bismarck's insurance protected families from sickness and accident.
        (c) 1 point with explanation: class based on wealth from industry and commerce replaced estates and orders based on birth; a middle class of owners and professionals displaced the landed gentry as the leading group; a propertyless working class dependent on wages replaced serfs, peasants and household labourers; careers open to talent replaced purchased office; yet aristocracies kept wealth and racial hierarchies hardened, which a complete answer may note as continuity.
      explanation: |
        Scoring: one point per part; (b) and (c) require an explanation of how the response worked or how the hierarchy differed.

    # ---- Long answer
    - slug: apworld-u05-w18-q24
      type: long_answer
      topic_code: "5.10"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the extent to which industrialisation changed the social and economic lives of people in Europe and in one region outside Europe between c. 1750 and c. 1900.

        Write a complete essay with a thesis, context, specific evidence and reasoning that addresses both continuity and change.
      answer: |
        Thesis (1 point): a defensible claim about extent, for example that industrialisation transformed work, class, cities and consumption in Britain and Western Europe, and reached other regions as a reorganisation of their economies toward raw-material export and as state-led programmes of reform, while most of the world's people continued to farm and older hierarchies persisted.
        Contextualisation (1 point): the Atlantic economy and merchant elites of Unit 4; the Enlightenment and political revolutions; the agricultural revolution; the causes of British industrialisation in 5.3.
        Evidence (2 points): at least two specific examples from each region, for example the factory and Bentley's testimony; Manchester's growth and Engels's description; the middle and working classes; the Factory Acts, unions and Chartism; the Manifesto and Bismarck's insurance; the cult of domesticity and Seneca Falls; rising real wages after 1850 and consumerism; for the outside region, India's deindustrialisation and raw cotton exports, Egypt's cotton and Balta Liman, Meiji Japan's mills, conscription and land tax, Russia's emancipation and Witte's railways, or China's Self-Strengthening.
        Analysis and reasoning (1 point): uses continuity and change to explain what was new (wage labour, class, urban life, mass goods, the state's regulation) and what persisted (hand farming for most people, aristocratic power, patriarchal law, coerced labour in new forms, unequal exchange).
        Complexity (1 point): compares the two regions to show industrialisation's uneven reach, traces change within the period (misery before 1850, gains after), connects social change to economic and political causes, or weighs the experience of different classes and of women against men.
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay confined to Europe, or treating change as total, cannot earn the complexity point.
