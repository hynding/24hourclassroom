    # ---- True or false
    - slug: apworld-u05-w18-q18
      type: true_false
      topic_code: "5.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Real wages for British workers rose steadily from the beginning of industrialisation in the 1780s, so that the first factory generation was already better off than its parents.
      answer: false
