week: 18
unit: 5
title: "The Industrial Economy, Its Critics, Its Society, and the Unit 5 Synthesis"
topics: ["5.7", "5.8", "5.9", "5.10"]
guide: guides/week-18.md
guide_description: |
  Study guide for week 18 (CED topics 5.7–5.10): the institutions of industrial capitalism (corporations, stock exchanges, the gold standard, transnational firms, free trade, consumerism and the global division of labour); the reactions of workers, socialists, anarchists, reformers and governments (unions, Chartism, Owen, Marx, Bismarck's insurance, the Factory Acts, the Self-Strengthening Movement); the industrial society of classes, cities, women and children; and the Unit 5 synthesis of continuity and change. Quotes the Communist Manifesto, Engels on the great towns, Smiles's Self-Help and the Declaration of Sentiments.
flashcards_description: |
  30 cards on topics 5.7–5.10: the corporation and limited liability, the gold standard, free trade and protection, transnational firms, consumerism, unions and Chartism, utopian and Marxist socialism, anarchism, factory law and social insurance, Self-Strengthening, the middle and working classes, separate spheres, the industrial city, living standards, and the continuity-and-change grid for 1750–1900.
flashcards:
  - front: "Corporation with limited liability → why it mattered"
    back: "Shareholders risk only their investment, so thousands could fund railways and factories too large for partnerships; generally available in Britain 1855–1862, traded on stock exchanges."
    hint: "capital for big things"
    topic_code: "5.7"
  - front: "Stock exchanges of London and New York → role"
    back: "Markets in shares and bonds that pooled savings and sent British (later American) capital to railways in Argentina, India and the United States; the financial side of the global economy."
    hint: "where capital was raised"
    topic_code: "5.7"
  - front: "Gold standard → dates and effect"
    back: "Currencies fixed to gold: Britain 1821, Germany 1873, United States 1900. Stable exchange rates eased trade and lending; the pound became the world's money."
    hint: "fixed to gold"
    topic_code: "5.7"
  - front: "Transnational businesses → three examples"
    back: "Hongkong and Shanghai Banking Corporation (1865) financing China trade; Lever Brothers / Unilever making soap in Britain from West African palm oil; Singer selling sewing machines worldwide. Also United Fruit."
    hint: "HSBC, Unilever"
    topic_code: "5.7"
  - front: "Free trade versus protection → who chose which"
    back: "Britain, the leader, repealed the Corn Laws (1846) and preached free trade; Germany (1879), the United States and Japan (after 1899) protected infant industries. Free trade is the leader's ideology, protection the follower's strategy."
    hint: "Corn Laws 1846"
    topic_code: "5.7"
  - front: "New global division of labour, c. 1900"
    back: "Industrial countries export manufactures and capital, import food and raw materials: wheat from the prairies, pampas and Russia, wool from Australia, cotton from India, Egypt and the U.S. South, rubber, palm oil and copper from the tropics."
    hint: "manufactures out, raw materials in"
    topic_code: "5.7"
  - front: "Consumerism in the industrial age"
    back: "Mass-produced goods bought by working and middle-class families (cotton clothes, soap, tea, sugar, newspapers, bicycles) through department stores and advertising; falling prices made mass demand."
    hint: "mass production meets mass demand"
    topic_code: "5.7"
  - front: "Luddites (1811–1816)"
    back: "English textile workers who broke the machines that displaced them; the first reaction to industrialisation, suppressed by troops and hangings."
    hint: "machine-breakers"
    topic_code: "5.8"
  - front: "Trade unions in Britain → legal status and growth"
    back: "Illegal until 1824; grew among skilled workers, then after the 1889 dock strike among the unskilled; won hours and recognition by strikes; the Labour Party followed in 1900."
    hint: "1824, 1889, 1900"
    topic_code: "5.8"
  - front: "Chartism (1838–1848) → demands and outcome"
    back: "Vote for all men, secret ballot, paid MPs, no property qualification, equal districts, annual parliaments; petitions of millions refused, movement collapsed, but most demands enacted by 1918 (Reform Acts 1867, 1884)."
    hint: "refused, then granted"
    topic_code: "5.8"
  - front: "Utopian socialists → three names and their idea"
    back: "Owen (New Lanark mills, New Harmony), Fourier (phalanxes), Saint-Simon (rule by engineers): cooperation in place of competition through model communities, without class struggle. Marx called them dreamers."
    hint: "model communities"
    topic_code: "5.8"
  - front: "Communist Manifesto (1848) → the core claims"
    back: "History is class struggle; the bourgeoisie destroyed feudal ties and left only 'cash payment,' but created its gravedigger, the proletariat, whose revolution will abolish private property and class. 'Working men of all countries, unite!'"
    hint: "Marx and Engels"
    topic_code: "5.8"
  - front: "What Marx admired about the bourgeoisie"
    back: "Its productive power: it 'draws all, even the most barbarian, nations into civilisation' with cheap goods and had created more productive forces than all previous generations. He wanted workers to own industry, not to abolish it."
    hint: "not anti-industry"
    topic_code: "5.8"
  - front: "Engels, Condition of the Working-Class in England (1845) → the great towns"
    back: "Observed Manchester and London: crowds in which 'the brutal indifference, the unfeeling isolation of each in his private interest' grows with density; 'the social war, the war of each against all, is here openly declared.' Hobbes's war realised in the city."
    hint: "indifference in the crowd"
    topic_code: "5.9"
  - front: "Anarchism"
    back: "Rejection of the state itself (Proudhon, Bakunin, Kropotkin); strong among workers in Spain, Italy and Russia; some turned to assassination (Tsar Alexander II 1881, President McKinley 1901)."
    hint: "no state at all"
    topic_code: "5.8"
  - front: "British Factory Acts and related laws → dates"
    back: "Factory Act 1833 (children's hours, inspectors), Mines Act 1842 (no women or children underground), Ten Hours Act 1847, Public Health Acts 1848 and 1875 (sewers, water). Liberals accepted that factories needed law."
    hint: "1833, 1842, 1847"
    topic_code: "5.8"
  - front: "Bismarck's social insurance → laws and motive"
    back: "Sickness (1883), accident (1884), old-age and disability (1889) insurance in Germany, the first welfare state, created by a conservative to take the ground from under the Social Democrats."
    hint: "welfare against socialism"
    topic_code: "5.8"
  - front: "Samuel Smiles, Self-Help (1859) → the creed"
    back: "'Heaven helps those who help themselves'; help from without enfeebles, help from within invigorates; no law can make the idle industrious. The middle-class answer to both socialism and state aid."
    hint: "Victorian self-reliance"
    topic_code: "5.8"
  - front: "Self-Strengthening Movement (China, 1861–1895)"
    back: "After the Opium Wars and Taiping: Zeng Guofan and Li Hongzhang built the Jiangnan Arsenal, Fuzhou shipyard, a steamship line, telegraphs, mines and language schools under 'Chinese learning as essence, Western learning for use.'"
    hint: "arsenals without a national policy"
    topic_code: "5.8"
  - front: "Why Self-Strengthening fell short"
    back: "Provincial and decentralised, no national fiscal control, court conservatism, Cixi's diversion of naval funds; Japan's victory in 1895 exposed it. Japan did the same thing with a sovereign, centralised state."
    hint: "compare Meiji"
    topic_code: "5.8"
  - front: "Middle class of the industrial age → who and what values"
    back: "Owners, managers, professionals, clerks and shopkeepers, wealth from industry and commerce not land; displaced the gentry as Britain's leading group by mid-century; values of work, thrift, respectability and the family home."
    hint: "bourgeoisie"
    topic_code: "5.9"
  - front: "Working class → who and its divisions"
    back: "Wage-earners in factories, mines, railways and docks, propertyless and dependent; divided between skilled artisans, operatives and casual labourers by wage and respectability; identity expressed in unions, parties, neighbourhoods."
    hint: "proletariat"
    topic_code: "5.9"
  - front: "Women and children in mills → the two phases"
    back: "First phase: cheap labour, about half of Lancashire cotton operatives women (1830s), children on twelve-hour days. Second: laws (1833, 1842, 1847) and schooling removed children and limited women; the home became a separate sphere."
    hint: "in, then partly out"
    topic_code: "5.9"
  - front: "Cult of domesticity (separate spheres)"
    back: "The middle-class ideal that a wife's sphere is the home and moral guardianship and the husband's the market; working-class families aspired to it; sharpened the separation of home and work that pre-industrial households had not known."
    hint: "home versus market"
    topic_code: "5.9"
  - front: "Industrial city → growth and conditions"
    back: "Manchester 25,000 (1772) to 300,000 (1851); London past two million. Back-to-back housing, cellars, no sewers, polluted water, coal smoke; cholera (1832, 1848) and typhus. By 1900 sewers, waterworks, parks, trams, building codes."
    hint: "built fast and badly, then fixed"
    topic_code: "5.9"
  - front: "Standard of living debate → the two-phase answer"
    back: "1790–1840: real wages flat, hours longer, diets worse, towns deadly. From the 1850s: real wages rose, food and cloth cheaper, by 1900 meat, cotton, newspapers and longer lives. Poorer first, richer later; timing varied."
    hint: "pessimists and optimists both right"
    topic_code: "5.9"
  - front: "Mass education → dates"
    back: "Compulsory schooling in Prussia early in the century, Japan from 1872, Britain from 1880; took children out of mills and made literate workers, voters and soldiers."
    hint: "schools replace mills"
    topic_code: "5.9"
  - front: "Continuity and change in labour, 1750–1900"
    back: "Change: free wage labour, a working class, unions, the end of serfdom (1861) and slavery (1833, 1865, 1888). Continuity: coerced labour in new forms (indenture, convict labour, forced cultivation) and most of the world still farming by hand."
    hint: "5.10 row"
    topic_code: "5.10"
  - front: "Continuity and change in social hierarchy and gender, 1750–1900"
    back: "Change: classes replace estates; careers open to talent; women in mills; the suffrage demand. Continuity: landed aristocracies keep wealth and power; patriarchal law (Napoleonic Code); no votes for women before 1893 (New Zealand); racial hierarchies harden."
    hint: "5.10 row"
    topic_code: "5.10"
  - front: "The Unit 5 argument about extent"
    back: "The industrial and political revolutions together produced the fastest change in production, politics and society in history, concentrated in a few regions; most of humanity met them as cheap cloth, new taxes and foreign power. Extent depends on where you stand."
    hint: "where you stand"
    topic_code: "5.10"
quiz:
  description: |
    Week 18 quiz on CED topics 5.7–5.10 with spiral review of Units 1–4 and topics 5.1–5.6 · 24 questions · about 40 minutes. Stimulus sets use the Communist Manifesto, Engels on the great towns, and Smiles's Self-Help. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Communist Manifesto (5.8)
    - slug: apworld-u05-w18-q01
      type: multiple_choice
      topic_code: "5.8"
      source: "Primary source: Karl Marx and Friedrich Engels, Manifesto of the Communist Party (1848), English edition of 1888, Project Gutenberg"
      points: 1
      stimulus: |
        "The history of all hitherto existing societies is the history of class struggles. Freeman and slave, patrician and plebeian, lord and serf, guild-master and journeyman ... The bourgeoisie ... has left remaining no other nexus between man and man than naked self-interest, than callous 'cash payment'. ... The bourgeoisie, by the rapid improvement of all instruments of production, draws all, even the most barbarian, nations into civilisation. ... They have a world to win. WORKING MEN OF ALL COUNTRIES, UNITE!"

        Karl Marx and Friedrich Engels, Manifesto of the Communist Party, 1848 (English edition of 1888)
      prompt: |
        The authors' claim that the bourgeoisie "draws all, even the most barbarian, nations into civilisation" refers most directly to:
      options:
        - "The spread of Christianity by missionaries"
        - "The export of cheap manufactured goods that forced every society into the capitalist world market"
        - "The abolition of slavery by the British Empire"
        - "The teaching of Latin in colonial schools"
      option_explanations:
        - |
          The Manifesto's agent is the bourgeoisie and its goods, not missionaries.
        - |
          Correct. The passage continues that cheap commodities are the artillery that batters down all Chinese walls; the market, not religion, is the force.
        - |
          Abolition is not the subject; Marx credits the bourgeoisie with economic, not humanitarian, transformation.
        - |
          Education is not mentioned; the instruments of production are.
      answer: 1
      explanation: |
        Marx described the global reach of industrial capitalism before most of it had happened.

    - slug: apworld-u05-w18-q02
      type: multiple_choice
      topic_code: "5.8"
      source: "Primary source: Karl Marx and Friedrich Engels, Manifesto of the Communist Party (1848), English edition of 1888, Project Gutenberg"
      points: 1
      stimulus: |
        "The history of all hitherto existing societies is the history of class struggles. Freeman and slave, patrician and plebeian, lord and serf, guild-master and journeyman ... The bourgeoisie ... has left remaining no other nexus between man and man than naked self-interest, than callous 'cash payment'. ... The bourgeoisie, by the rapid improvement of all instruments of production, draws all, even the most barbarian, nations into civilisation. ... They have a world to win. WORKING MEN OF ALL COUNTRIES, UNITE!"

        Karl Marx and Friedrich Engels, Manifesto of the Communist Party, 1848 (English edition of 1888)
      prompt: |
        Marx and Engels differed from the utopian socialists such as Owen and Fourier chiefly in arguing that:
      options:
        - "Industrial society should be abandoned for farming communes"
        - "The state should provide sickness and old-age insurance"
        - "Workers should accept their condition and practise self-help"
        - "Change would come through class struggle and the workers' seizure of power, not through model communities and persuasion"
      option_explanations:
        - |
          Marx admired industry's productive power and wanted the proletariat to own it.
        - |
          That was Bismarck's conservative strategy against the socialists.
        - |
          That is Smiles's creed, which Marx would have called bourgeois ideology.
        - |
          Correct. The Manifesto's final call to unite is a call to revolution; the utopians hoped to convince employers and build examples.
      answer: 3
      explanation: |
        Scientific socialism against utopian socialism: struggle, not example.

    - slug: apworld-u05-w18-q03
      type: multiple_choice
      topic_code: "4.7"
      source: "Primary source: Karl Marx and Friedrich Engels, Manifesto of the Communist Party (1848), English edition of 1888, Project Gutenberg"
      points: 1
      stimulus: |
        "The history of all hitherto existing societies is the history of class struggles. Freeman and slave, patrician and plebeian, lord and serf, guild-master and journeyman ... The bourgeoisie ... has left remaining no other nexus between man and man than naked self-interest, than callous 'cash payment'. ... The bourgeoisie, by the rapid improvement of all instruments of production, draws all, even the most barbarian, nations into civilisation. ... They have a world to win. WORKING MEN OF ALL COUNTRIES, UNITE!"

        Karl Marx and Friedrich Engels, Manifesto of the Communist Party, 1848 (English edition of 1888)
      prompt: |
        Review. The "bourgeoisie" Marx describes grew out of which group studied in topic 4.7?
      options:
        - "The Manchu bannermen of the Qing"
        - "The Indigenous caciques of Spanish America"
        - "The merchant and financial elites of Amsterdam, London and the colonial ports, enriched by the trade and companies of 1450–1750"
        - "The Ottoman devshirme officials"
      option_explanations:
        - |
          Bannermen were a hereditary military caste, not a commercial class.
        - |
          Caciques were Indigenous intermediaries, not a capitalist class.
        - |
          Correct. Unit 4's new merchant elites became, with industry, the owning class Marx names.
        - |
          The devshirme recruited slaves of the sultan for state service, unrelated to commerce.
      answer: 2
      explanation: |
        Spiral review of 4.7: the bourgeoisie has a history, which the Manifesto itself traces.

    # ---- Set B: Engels on the great towns (5.9)
    - slug: apworld-u05-w18-q04
      type: multiple_choice
      topic_code: "5.9"
      source: "Primary source: Friedrich Engels, The Condition of the Working-Class in England in 1844 (1845), trans. Florence Kelley Wischnewetzky (1885), Project Gutenberg"
      points: 1
      stimulus: |
        "The very turmoil of the streets has something repulsive, something against which human nature rebels. The hundreds of thousands of all classes and ranks crowding past each other, are they not all human beings with the same qualities and powers, and with the same interest in being happy? ... The brutal indifference, the unfeeling isolation of each in his private interest becomes the more repellant and offensive, the more these individuals are crowded together, within a limited space. ... Hence it comes, too, that the social war, the war of each against all, is here openly declared."

        Friedrich Engels, The Condition of the Working-Class in England in 1844 (published 1845; English translation 1885), "The Great Towns"
      prompt: |
        Engels's description of the industrial city most directly supports which claim about society in the industrial age?
      options:
        - "Industrial cities strengthened the bonds of village and parish"
        - "Urbanisation and market competition dissolved older ties and left individuals isolated in self-interest"
        - "Cities were small and sparsely populated in the 1840s"
        - "Class differences disappeared in the crowd"
      option_explanations:
        - |
          Engels says the opposite: the crowd has nothing in common.
        - |
          Correct. The passage's argument is that the market society of the city produces isolation and a war of each against all.
        - |
          'Hundreds of thousands ... crowded together' describes density, not sparseness.
        - |
          Engels notes 'all classes and ranks' and elsewhere describes the segregation of rich and poor districts.
      answer: 1
      explanation: |
        The industrial city as its sharpest critic saw it.

    - slug: apworld-u05-w18-q05
      type: multiple_choice
      topic_code: "5.9"
      source: "Primary source: Friedrich Engels, The Condition of the Working-Class in England in 1844 (1845), trans. Florence Kelley Wischnewetzky (1885), Project Gutenberg"
      points: 1
      stimulus: |
        "The very turmoil of the streets has something repulsive, something against which human nature rebels. The hundreds of thousands of all classes and ranks crowding past each other, are they not all human beings with the same qualities and powers, and with the same interest in being happy? ... The brutal indifference, the unfeeling isolation of each in his private interest becomes the more repellant and offensive, the more these individuals are crowded together, within a limited space. ... Hence it comes, too, that the social war, the war of each against all, is here openly declared."

        Friedrich Engels, The Condition of the Working-Class in England in 1844 (published 1845; English translation 1885), "The Great Towns"
      prompt: |
        Which fact about the author most affects how a historian should use this passage as evidence about English cities in 1844?
      options:
        - "Engels was a factory owner's son sent to Manchester, who wrote to indict capitalism and later co-wrote the Communist Manifesto"
        - "Engels had never visited England"
        - "Engels was employed by the British government to praise its cities"
        - "Engels wrote in 1944, a century later"
      option_explanations:
        - |
          Correct. He observed Manchester directly, which gives the book value, and he wrote to condemn the system, which shapes its emphasis.
        - |
          He lived in Manchester from 1842 to 1844 working in his father's firm.
        - |
          He was a private observer and critic, not a government writer.
        - |
          The book was written in 1844–45; the 1885 date is the English translation.
      answer: 0
      explanation: |
        Sourcing: point of view and purpose do not make a source false, but they tell you what it was built to show.

    - slug: apworld-u05-w18-q06
      type: multiple_choice
      topic_code: "5.1"
      source: "Primary source: Friedrich Engels, The Condition of the Working-Class in England in 1844 (1845), trans. Florence Kelley Wischnewetzky (1885), Project Gutenberg"
      points: 1
      stimulus: |
        "The very turmoil of the streets has something repulsive, something against which human nature rebels. The hundreds of thousands of all classes and ranks crowding past each other, are they not all human beings with the same qualities and powers, and with the same interest in being happy? ... The brutal indifference, the unfeeling isolation of each in his private interest becomes the more repellant and offensive, the more these individuals are crowded together, within a limited space. ... Hence it comes, too, that the social war, the war of each against all, is here openly declared."

        Friedrich Engels, The Condition of the Working-Class in England in 1844 (published 1845; English translation 1885), "The Great Towns"
      prompt: |
        Review. Engels's phrase "the war of each against all" deliberately echoes which Enlightenment-era thinker studied in topic 5.1?
      options:
        - "Rousseau's general will"
        - "Montesquieu's separation of powers"
        - "Wollstonecraft's vindication of women's rights"
        - "Hobbes's description of the state of nature as a war of all against all"
      option_explanations:
        - |
          The general will is Rousseau's remedy, not a description of conflict.
        - |
          Separation of powers concerns government structure, not social conflict.
        - |
          Wollstonecraft's subject was women's education and rights.
        - |
          Correct. Engels turns Hobbes's hypothetical state of nature into a description of the capitalist city: the state has not ended the war, the market has declared it.
      answer: 3
      explanation: |
        Spiral review of 5.1: the industrial age's critics argued with the Enlightenment's vocabulary.

    # ---- Set C: Smiles, Self-Help (5.8, 5.9)
    - slug: apworld-u05-w18-q07
      type: multiple_choice
      topic_code: "5.8"
      source: "Primary source: Samuel Smiles, Self-Help (1859), popular edition (John Murray, 1897), Project Gutenberg"
      points: 1
      stimulus: |
        "'Heaven helps those who help themselves' is a well-tried maxim, embodying in a small compass the results of vast human experience. ... Help from without is often enfeebling in its effects, but help from within invariably invigorates. ... no laws, however stringent, can make the idle industrious, the thriftless provident, or the drunken sober."

        Samuel Smiles, Self-Help, 1859
      prompt: |
        Smiles's argument was most directly opposed to which two responses to the industrial economy?
      options:
        - "Free trade and the gold standard"
        - "Trade unions and the Factory Acts, which he had drafted"
        - "Socialism and state welfare, both of which he saw as 'help from without' that enfeebles"
        - "Railways and the telegraph"
      option_explanations:
        - |
          Smiles was a liberal who favoured free trade; these were not his targets.
        - |
          Smiles drafted no Factory Acts; his point is that law cannot reform character.
        - |
          Correct. Self-help was the middle-class answer to both the socialists' collective remedy and the state's.
        - |
          Smiles celebrated engineers and railways in his Lives of the Engineers.
      answer: 2
      explanation: |
        The three responses to industrial poverty: self-help, socialism, state action.

    - slug: apworld-u05-w18-q08
      type: multiple_choice
      topic_code: "5.9"
      source: "Primary source: Samuel Smiles, Self-Help (1859), popular edition (John Murray, 1897), Project Gutenberg"
      points: 1
      stimulus: |
        "'Heaven helps those who help themselves' is a well-tried maxim, embodying in a small compass the results of vast human experience. ... Help from without is often enfeebling in its effects, but help from within invariably invigorates. ... no laws, however stringent, can make the idle industrious, the thriftless provident, or the drunken sober."

        Samuel Smiles, Self-Help, 1859
      prompt: |
        The virtues Smiles names (industry, thrift, sobriety) are best understood as the values of which group in industrial society?
      options:
        - "The landed aristocracy, whose wealth came from inherited estates"
        - "The casual labourers of the docks"
        - "The utopian socialists of New Harmony"
        - "The middle class of owners, managers and professionals, whose wealth came from work and saving"
      option_explanations:
        - |
          Aristocrats inherited; Smiles's heroes were self-made engineers and manufacturers.
        - |
          Casual labourers were the book's intended pupils, not its model.
        - |
          The utopians prescribed cooperation, not individual self-help.
        - |
          Correct. Work, thrift and respectability were the Victorian bourgeoisie's creed, offered to workers as a ladder.
      answer: 3
      explanation: |
        Class in the industrial age had values as well as incomes.

    - slug: apworld-u05-w18-q09
      type: multiple_choice
      topic_code: "5.1"
      source: "Primary source: Samuel Smiles, Self-Help (1859), popular edition (John Murray, 1897), Project Gutenberg"
      points: 1
      stimulus: |
        "'Heaven helps those who help themselves' is a well-tried maxim, embodying in a small compass the results of vast human experience. ... Help from without is often enfeebling in its effects, but help from within invariably invigorates. ... no laws, however stringent, can make the idle industrious, the thriftless provident, or the drunken sober."

        Samuel Smiles, Self-Help, 1859
      prompt: |
        Review. Smiles's distrust of laws as a remedy for poverty is most consistent with which Enlightenment doctrine studied in topic 5.1?
      options:
        - "Laissez-faire, Smith's argument that individuals pursuing their own interest serve the public better than state direction"
        - "Rousseau's general will as the source of law"
        - "Hobbes's absolute sovereign"
        - "Enlightened absolutism"
      option_explanations:
        - |
          Correct. Self-help is laissez-faire applied to character: the individual, not the state, is the agent.
        - |
          Rousseau made law the people's will; Smiles doubted law's power over character.
        - |
          Hobbes wanted a strong state; Smiles wanted a self-reliant individual.
        - |
          Enlightened absolutism reformed from above; Smiles's reform comes from within.
      answer: 0
      explanation: |
        Spiral review of 5.1: the liberal creed of the industrial age descends from Smith.

    # ---- Stand-alone multiple choice (5.7, 5.10)
    - slug: apworld-u05-w18-q10
      type: multiple_choice
      topic_code: "5.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Limited liability, made generally available in Britain in the 1850s and 1860s, promoted industrialisation because it:
      options:
        - "Allowed investors to risk only their investment, so thousands of shareholders could finance railways and factories too large for partnerships"
        - "Required the state to own all railways"
        - "Abolished the stock exchange"
        - "Made company directors personally liable for all debts"
      option_explanations:
        - |
          Correct. Limited risk brought in capital from people who would never have joined a partnership with unlimited liability.
        - |
          British railways were private; limited liability enabled private finance.
        - |
          The stock exchange grew with limited companies, since shares could be traded.
        - |
          The reverse: liability was limited to the shares held.
      answer: 0
      explanation: |
        The corporation is the industrial age's institutional invention for raising capital.

    - slug: apworld-u05-w18-q11
      type: multiple_choice
      topic_code: "5.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Why did Britain adopt free trade (repealing the Corn Laws in 1846) while Germany (1879) and the United States protected their industries with tariffs?
      options:
        - "Britain had no manufacturing industry to protect"
        - "Germany and the United States had signed a treaty with Britain promising protection"
        - "As the industrial leader Britain gained from open markets, while latecomers protected infant industries until they could compete"
        - "Free trade was imposed on Britain by the Ottoman Empire"
      option_explanations:
        - |
          Britain was the workshop of the world; that is why it wanted open markets.
        - |
          No such treaty existed; tariffs were domestic policy.
        - |
          Correct. Free trade is the leader's ideology and protection the follower's strategy; Japan did the same after 1899.
        - |
          The Ottoman Empire had free trade imposed on it (Balta Liman), not the reverse.
      answer: 2
      explanation: |
        Trade policy followed position in the industrial race.

