week: 17
unit: 5
title: "The Industrial Revolution: Beginnings, Spread, Technology and the State"
topics: ["5.3", "5.4", "5.5", "5.6"]
guide: guides/week-17.md
guide_description: |
  Study guide for week 17 (CED topics 5.3–5.6): why Britain industrialised first (coal, rivers, agriculture, capital, colonies, institutions), the move from cottage industry to factory, steam, iron, railways, steamships and the telegraph, the second industrial revolution of steel, chemicals, electricity and oil, the spread to Belgium, Germany and the United States and the deindustrialisation of India and Egypt, and state-led industrialisation in Muhammad Ali's Egypt, the Ottoman Tanzimat, Meiji Japan and Witte's Russia. Quotes Adam Smith's pin factory and Elizabeth Bentley's Sadler Committee testimony; describes the Charter Oath.
flashcards_description: |
  30 cards on topics 5.3–5.6: the causes of British industrialisation, the cotton machines, Watt and coal, railways and the telegraph, the second industrial revolution, deindustrialisation, and the state programmes of Egypt, the Ottomans, Japan and Russia.
flashcards:
  - front: "Why Britain first → the environmental factors"
    back: "Shallow coal seams near iron ore, fast rivers for water wheels and canals, a coastline close to everything, no land frontier to defend. Cheap energy, transport and security."
    hint: "coal, iron, rivers, ports"
    topic_code: "5.3"
  - front: "Agricultural revolution → four changes and the effect"
    back: "Enclosure, crop rotation with turnips and clover, selective breeding, the seed drill. Fewer farmers fed a population that went from 6 million (1750) to 21 million (1851); displaced labourers went to the mills."
    hint: "feeds the towns, frees the hands"
    topic_code: "5.3"
  - front: "Where Britain's investment capital came from"
    back: "Profits of the Atlantic economy (sugar, slaving, shipping, the East India trade), a banking system, national debt and stock exchange developed since the 1690s."
    hint: "Unit 4 paid for Unit 5"
    topic_code: "5.3"
  - front: "Institutions that favoured British industry"
    back: "Parliament protecting property and patents; scientific societies spreading useful knowledge; Dissenters barred from universities going into trade and engineering; high wages and cheap coal that made machines pay."
    hint: "law, knowledge, wages"
    topic_code: "5.3"
  - front: "Cottage industry (putting-out system)"
    back: "Merchants supplied raw wool or cotton to rural households that spun and wove at home for piece rates; the mode of production the factory replaced after 1770."
    hint: "before the factory"
    topic_code: "5.4"
  - front: "Cotton machines → three inventions and dates"
    back: "Spinning jenny (Hargreaves, 1764), water frame (Arkwright, 1769), mule (Crompton, 1779): multiplied thread output and let spinners overtake weavers. Cotton output rose over a hundredfold, 1770–1850."
    hint: "jenny, frame, mule"
    topic_code: "5.3"
  - front: "Cromford mill (1771) → why it matters"
    back: "Arkwright's water-powered mill gathered machines and workers under one roof with a bell and a clock: the first factory, and the model of industrial discipline."
    hint: "the first factory"
    topic_code: "5.4"
  - front: "Watt's steam engine → the two improvements"
    back: "Separate condenser (1769) cut Newcomen's coal use by three quarters; rotary motion (1781) turned wheels. Freed the factory from the river and put it in the coalfield town."
    hint: "condenser, rotary"
    topic_code: "5.5"
  - front: "Coke smelting and puddling → effect"
    back: "Darby's coke (1709) and Cort's puddling and rolling (1784) made cheap iron from coal rather than scarce charcoal; iron for machines, rails and bridges."
    hint: "iron from coal"
    topic_code: "5.5"
  - front: "Railway → first lines and economic effects"
    back: "Stockton and Darlington (1825), Liverpool and Manchester (1830); 6,000 miles by 1850. Cut overland transport costs by more than half, created national markets, and demanded iron, coal and engineering on a scale that drove the whole economy."
    hint: "transport and demand"
    topic_code: "5.5"
  - front: "Steamship and telegraph → what they joined"
    back: "Steam at sea (Atlantic 1838, Suez 1869) and the telegraph (1837; Atlantic cable 1866) joined world markets in time as well as space; interiors became reachable by rail and knowable by wire."
    hint: "space and time"
    topic_code: "5.5"
  - front: "Second industrial revolution → four fields and leaders"
    back: "Steel (Bessemer 1856), chemicals (dyes, fertilisers, explosives), electricity (dynamo 1866, lamp 1879, motors), oil (Drake 1859, internal combustion 1885). Led by Germany and the United States, c. 1870–1914."
    hint: "steel, chemicals, electricity, oil"
    topic_code: "5.5"
  - front: "Why Belgium and Germany industrialised early on the continent"
    back: "Belgium: coal, iron and proximity to Britain (1820s). Germany: the Zollverein customs union (1834), then unification (1871), Ruhr coal, state railways and research-based chemical and electrical firms; Europe's leader by 1900."
    hint: "coal plus customs union"
    topic_code: "5.4"
  - front: "United States industrialisation → path"
    back: "Water-powered New England mills (Lowell, 1820s), smuggled British designs, railways, Carnegie steel and Rockefeller oil; surpassed Britain in output by the 1890s."
    hint: "Lowell to Carnegie"
    topic_code: "5.4"
  - front: "Deindustrialisation → where and why"
    back: "India, Egypt and the Ottoman lands lost handicraft textiles and metalwork as machine-made British cloth undersold them, aided by low tariffs (Balta Liman 1838) and railways into the interior; reorganised as raw-material suppliers."
    hint: "the other side of British exports"
    topic_code: "5.4"
  - front: "India's weavers → from 1750 to 1850"
    back: "The world's largest textile exporters in 1750; lost export markets to Lancashire, then the home market after tariffs and railways; Bengal's spinners were the first casualties. India then exported raw cotton and opium."
    hint: "exporter to importer"
    topic_code: "5.4"
  - front: "Why industrial power forced states to act"
    back: "The Opium War (1839–42) and Crimean War (1853–56) showed that factories meant warships and rifles; states that lacked them faced defeat or dependence."
    hint: "military lesson"
    topic_code: "5.6"
  - front: "Muhammad Ali's programme (Egypt, 1805–1848)"
    back: "State cotton for export, textile mills, foundries, shipyards, European engineers, a conscript peasant army, schools and a press; took Syria and threatened Istanbul (1839)."
    hint: "defensive industrialisation"
    topic_code: "5.6"
  - front: "Treaty of Balta Liman (1838) → effect on Egypt"
    back: "Imposed on the Ottomans and extended to Egypt: abolished state monopolies, fixed a 5 percent tariff; Muhammad Ali's mills could not compete with Lancashire, and Egypt became a cotton supplier and, by 1882, a British protectorate."
    hint: "tariff sovereignty lost"
    topic_code: "5.6"
  - front: "Tanzimat (1839–1876) → promises and results"
    back: "Legal equality of subjects regardless of religion, conscript army, secular schools and law codes, provincial councils, railways, factories, a constitution (1876). Built a modern bureaucracy but debt led to bankruptcy (1875) and European control of revenue; constitution suspended 1878."
    hint: "Ottoman reorganisation"
    topic_code: "5.6"
  - front: "What ended Tokugawa isolation"
    back: "Perry's warships (1853) and the unequal treaties (1858), which discredited the shogunate and led to its overthrow by reforming samurai in 1868."
    hint: "black ships"
    topic_code: "5.6"
  - front: "Charter Oath (1868) → five promises (described)"
    back: "Deliberative assemblies and public discussion; unity of all classes in state affairs; freedom of occupation for all; abandonment of evil customs of the past; knowledge sought throughout the world to strengthen imperial rule."
    hint: "Meiji programme in five articles"
    topic_code: "5.6"
  - front: "Meiji reforms → the samurai order abolished"
    back: "Domains abolished (1871), conscript army (1873), samurai stipends and swords ended (1876); a land tax on peasants paid for it all."
    hint: "who paid"
    topic_code: "5.6"
  - front: "Meiji industrialisation → method"
    back: "Iwakura mission (1871–73) studied the West; state built railways, telegraphs, a mint, model mills (Tomioka silk, 1872), shipyards and arsenals, then sold most to private houses, the zaibatsu; tariffs regained 1899."
    hint: "build, then sell"
    topic_code: "5.6"
  - front: "Zaibatsu"
    back: "Japanese family conglomerates (Mitsui, Mitsubishi, Sumitomo) that bought state factories cheaply and, with state contracts, dominated banking, shipping and industry."
    hint: "Mitsui, Mitsubishi"
    topic_code: "5.6"
  - front: "Why Japan succeeded where Egypt failed"
    back: "Japan kept its sovereignty and (after 1899) tariffs, had Tokugawa literacy and commerce to build on, and let private firms take over; Egypt lost its tariffs (1838) and then its government (1882) to European power."
    hint: "sovereignty and tariffs"
    topic_code: "5.6"
  - front: "Russia → Crimea to Witte"
    back: "Defeat in the Crimea led to serf emancipation (1861); Witte (1892–1903) used the gold standard, high tariffs, French loans and the Trans-Siberian Railway (1891–1916) to build coal, iron and oil output and factory cities."
    hint: "state-led, peasantry unreformed"
    topic_code: "5.6"
  - front: "Trans-Siberian Railway → purposes"
    back: "To bind the empire from Moscow to Vladivostok, open Siberia's resources and settlement, and project power into Manchuria; a state project financed by foreign loans."
    hint: "Witte's railway"
    topic_code: "5.6"
  - front: "Britain versus Japan, Russia, Egypt → from below and from above"
    back: "Britain industrialised through private capital over seventy years; the others through state programmes in a generation. Japan succeeded, Russia half succeeded on an unreformed rural base, Egypt was stopped by European intervention."
    hint: "the comparison 5.6 wants"
    topic_code: "5.6"
  - front: "Sadler Committee (1832) → what it was"
    back: "A parliamentary inquiry into child labour in textile mills; Elizabeth Bentley testified she began work at six, worked 5 a.m. to 9 p.m. when busy, and was strapped for flagging. Led to the Factory Act of 1833."
    hint: "testimony that made law"
    topic_code: "5.3"
quiz:
  description: |
    Week 17 quiz on CED topics 5.3–5.6 with spiral review of Units 1–4 and topics 5.1–5.2 · 24 questions · about 40 minutes. Stimulus sets use Adam Smith's pin factory, Elizabeth Bentley's testimony to the Sadler Committee, and a described summary of the Meiji Charter Oath. Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Set A: Smith's pin factory (5.3)
    - slug: apworld-u05-w17-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), Book I, ch. I, Project Gutenberg"
      points: 1
      stimulus: |
        "The greatest improvements in the productive powers of labour, and the greater part of the skill, dexterity, and judgment, with which it is anywhere directed, or applied, seem to have been the effects of the division of labour. ... One man draws out the wire; another straights it; a third cuts it; a fourth points it; a fifth grinds it at the top for receiving the head ... Those ten persons, therefore, could make among them upwards of forty-eight thousand pins in a day."

        Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations, 1776, Book I, chapter I
      prompt: |
        The organisation of work Smith describes most directly anticipated which feature of industrial production?
      options:
        - "The putting-out of spinning to rural households"
        - "The factory, where each worker performs one repeated step in a sequence"
        - "The guild system of master, journeyman and apprentice"
        - "The hacienda's debt-bound labour"
      option_explanations:
        - |
          Putting-out dispersed whole tasks to households; Smith describes concentration and specialisation.
        - |
          Correct. Subdivided, repetitive tasks under one roof are the factory's logic, stated before steam factories existed.
        - |
          Guilds trained a worker in a whole craft; Smith's pin-maker never makes a whole pin.
        - |
          The hacienda was agricultural and coerced; Smith describes free wage labour in a workshop.
      answer: 1
      explanation: |
        Smith described in 1776 what Arkwright's mills were beginning to do.

    - slug: apworld-u05-w17-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), Book I, ch. I, Project Gutenberg"
      points: 1
      stimulus: |
        "The greatest improvements in the productive powers of labour, and the greater part of the skill, dexterity, and judgment, with which it is anywhere directed, or applied, seem to have been the effects of the division of labour. ... One man draws out the wire; another straights it; a third cuts it; a fourth points it; a fifth grinds it at the top for receiving the head ... Those ten persons, therefore, could make among them upwards of forty-eight thousand pins in a day."

        Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations, 1776, Book I, chapter I
      prompt: |
        Smith's argument that the division of labour raises output helps explain why British manufacturers invested in machinery because:
      options:
        - "Machines could perform a single subdivided step faster than a hand, so a task once divided could be mechanised"
        - "Machines allowed workers to make whole pins again"
        - "The division of labour required workers to own their tools"
        - "Smith advised the government to buy machines for every workshop"
      option_explanations:
        - |
          Correct. Once a job was broken into simple steps, each step could be given to a machine; specialisation prepared mechanisation.
        - |
          Machines carried the division further; they did not reverse it.
        - |
          Smith's workers owned nothing but their labour; the capitalist owned tools and workshop.
        - |
          Smith opposed state direction of industry; the investment was private.
      answer: 0
      explanation: |
        Causation: specialisation, then machines, then steam.

    - slug: apworld-u05-w17-q03
      type: multiple_choice
      topic_code: "5.1"
      source: "Primary source: Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), Book I, ch. I, Project Gutenberg"
      points: 1
      stimulus: |
        "The greatest improvements in the productive powers of labour, and the greater part of the skill, dexterity, and judgment, with which it is anywhere directed, or applied, seem to have been the effects of the division of labour. ... One man draws out the wire; another straights it; a third cuts it; a fourth points it; a fifth grinds it at the top for receiving the head ... Those ten persons, therefore, could make among them upwards of forty-eight thousand pins in a day."

        Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations, 1776, Book I, chapter I
      prompt: |
        Review. Smith's method in this passage, reasoning from an observed workshop to a general law of production, reflects which Enlightenment commitment?
      options:
        - "Divine right"
        - "The general will"
        - "Empiricism: knowledge derived from observation and experience"
        - "Mercantilist bullionism"
      option_explanations:
        - |
          Divine right concerns kings, and Smith's argument appeals to no authority at all.
        - |
          The general will is Rousseau's political concept, unrelated to Smith's analysis of work.
        - |
          Correct. Smith observes a pin factory and generalises; Locke's empirical method applied to economics.
        - |
          Smith attacked bullionism; wealth for him is production, not treasure.
      answer: 2
      explanation: |
        Spiral review of 5.1: the Enlightenment's method underlies its economics.

    # ---- Set B: Sadler Committee (5.3, 5.4)
    - slug: apworld-u05-w17-q04
      type: multiple_choice
      topic_code: "5.4"
      source: "Primary source: Testimony of Elizabeth Bentley to the Sadler Committee (1832), Parliamentary Papers 1831–32 vol. XV, as reprinted in Scott and Baltzly, Readings in European History Since 1814 (1930), Victorian Web"
      points: 1
      stimulus: |
        "What time did you begin to work at a factory?" "When I was six years old." ... "What were your hours of labour in that mill?" "From 5 in the morning till 9 at night, when they were thronged." ... "Suppose you flagged a little, or were too late, what would they do?" "Strap us."

        Testimony of Elizabeth Bentley, aged 23, to the Sadler Committee of the House of Commons, 1832
      prompt: |
        The conditions Bentley describes differed from those of the cottage industry that factories replaced chiefly in that:
      options:
        - "Factory work was done at home at the family's own pace"
        - "Children had never worked before the factory"
        - "Cottage workers were paid more than factory workers for the same cloth"
        - "Factory hours and discipline were set by the machine and the overseer, not by the household"
      option_explanations:
        - |
          Home work at the family's pace describes the cottage industry, not the factory.
        - |
          Children worked in cottage industry and on farms; what was new was the length, intensity and discipline of mill work.
        - |
          Hand spinners were undercut by machine thread; their piece rates collapsed.
        - |
          Correct. The sixteen-hour day and the strap enforced the rhythm of water and steam power; the household no longer set its own time.
      answer: 3
      explanation: |
        The shift from home to factory is the change in the mode of production that 5.4 asks about.

    - slug: apworld-u05-w17-q05
      type: multiple_choice
      topic_code: "5.3"
      source: "Primary source: Testimony of Elizabeth Bentley to the Sadler Committee (1832), Parliamentary Papers 1831–32 vol. XV, as reprinted in Scott and Baltzly, Readings in European History Since 1814 (1930), Victorian Web"
      points: 1
      stimulus: |
        "What time did you begin to work at a factory?" "When I was six years old." ... "What were your hours of labour in that mill?" "From 5 in the morning till 9 at night, when they were thronged." ... "Suppose you flagged a little, or were too late, what would they do?" "Strap us."

        Testimony of Elizabeth Bentley, aged 23, to the Sadler Committee of the House of Commons, 1832
      prompt: |
        The fact that this testimony was taken by a committee of the House of Commons best supports which conclusion?
      options:
        - "Parliament had no interest in factory conditions before 1850"
        - "The British state was beginning to investigate and then regulate industrial labour, leading to the Factory Act of 1833"
        - "Mill owners controlled the committee and suppressed the testimony"
        - "Child labour was already illegal in 1832"
      option_explanations:
        - |
          The committee itself shows parliamentary interest in 1832.
        - |
          Correct. Sadler's inquiry led to the Factory Act of 1833, which limited children's hours and created inspectors.
        - |
          The testimony was published and used by reformers; opponents attacked its method but could not bury it.
        - |
          Child labour was legal and widespread; the Act of 1833 was the first effective restriction in textiles.
      answer: 1
      explanation: |
        Sourcing: the context of a document tells you what it was for.

    - slug: apworld-u05-w17-q06
      type: multiple_choice
      topic_code: "4.5"
      source: "Primary source: Testimony of Elizabeth Bentley to the Sadler Committee (1832), Parliamentary Papers 1831–32 vol. XV, as reprinted in Scott and Baltzly, Readings in European History Since 1814 (1930), Victorian Web"
      points: 1
      stimulus: |
        "What time did you begin to work at a factory?" "When I was six years old." ... "What were your hours of labour in that mill?" "From 5 in the morning till 9 at night, when they were thronged." ... "Suppose you flagged a little, or were too late, what would they do?" "Strap us."

        Testimony of Elizabeth Bentley, aged 23, to the Sadler Committee of the House of Commons, 1832
      prompt: |
        Review. The raw cotton that Bentley's mill spun was by 1832 supplied mainly by which labour system studied in topic 4.5?
      options:
        - "The Andean mit'a at Potosí"
        - "Indentured servants in Virginia"
        - "Enslaved African labour on the plantations of the American South"
        - "Japanese merchants under the Tokugawa"
      option_explanations:
        - |
          The mit'a produced silver at Potosí, not cotton; it belongs to the Andes, not to the cotton trade.
        - |
          Indenture had given way to slavery by 1700 and Virginia grew tobacco.
        - |
          Correct. After the cotton gin (1793) the slave plantations of the Deep South supplied most of Lancashire's raw cotton; the factory and the plantation were one system.
        - |
          Japan was closed and grew no cotton for export.
      answer: 2
      explanation: |
        Spiral review of 4.5: industrial Britain depended on the coerced labour of the Atlantic world.

    # ---- Set C: Charter Oath described (5.6)
    - slug: apworld-u05-w17-q07
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge; the Charter Oath is described, not quoted"
      points: 1
      stimulus: |
        In April 1868 the new Meiji government issued the Charter Oath in the emperor's name. Its five articles promised that deliberative assemblies would be established and all matters decided by public discussion; that all classes, high and low, would unite in carrying out the affairs of state; that common people as well as officials would be allowed to pursue their own callings; that evil customs of the past would be abandoned and everything based on the just laws of nature; and that knowledge would be sought throughout the world to strengthen the foundations of imperial rule.
      prompt: |
        The promise to seek knowledge "throughout the world" was carried out most directly by:
      options:
        - "The Iwakura mission to the United States and Europe (1871–1873) and the hiring of foreign experts"
        - "The closing of Japanese ports to foreign ships"
        - "The restoration of the samurai's right to wear swords"
        - "The conquest of Korea in 1868"
      option_explanations:
        - |
          Correct. The mission studied Western institutions and industry, and thousands of foreign advisers were hired to build railways, schools and arsenals.
        - |
          Closing the ports was Tokugawa policy; Meiji opened Japan to learn.
        - |
          The sword privilege was abolished in 1876; the Oath's 'evil customs' were the old order.
        - |
          Japan annexed Korea in 1910; no conquest occurred in 1868.
      answer: 0
      explanation: |
        The Oath's fifth article is the programme of Meiji borrowing.

    - slug: apworld-u05-w17-q08
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge; the Charter Oath is described, not quoted"
      points: 1
      stimulus: |
        In April 1868 the new Meiji government issued the Charter Oath in the emperor's name. Its five articles promised that deliberative assemblies would be established and all matters decided by public discussion; that all classes, high and low, would unite in carrying out the affairs of state; that common people as well as officials would be allowed to pursue their own callings; that evil customs of the past would be abandoned and everything based on the just laws of nature; and that knowledge would be sought throughout the world to strengthen the foundations of imperial rule.
      prompt: |
        The promise that all classes would unite in state affairs and that commoners could pursue their own callings foreshadowed which Meiji reform?
      options:
        - "The abolition of the samurai's hereditary stipends and privileges and the creation of a conscript army open to all classes"
        - "The restoration of the Tokugawa four-class order"
        - "The expulsion of Christian missionaries"
        - "The grant of universal male suffrage in 1868"
      option_explanations:
        - |
          Correct. The domains (1871), stipends and swords (1876) were abolished and conscription (1873) made commoners soldiers; the samurai order ended.
        - |
          The Oath promised the opposite of the old order; the four classes were dissolved.
        - |
          Missionaries were tolerated after 1873; the Oath concerns class and knowledge, not religion.
        - |
          Japan's first elections came in 1890 under a limited franchise; the Oath promised assemblies, not votes.
      answer: 0
      explanation: |
        The Oath was a plan, and most of it was carried out within a decade.

    - slug: apworld-u05-w17-q09
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge; the Charter Oath is described, not quoted"
      points: 1
      stimulus: |
        In April 1868 the new Meiji government issued the Charter Oath in the emperor's name. Its five articles promised that deliberative assemblies would be established and all matters decided by public discussion; that all classes, high and low, would unite in carrying out the affairs of state; that common people as well as officials would be allowed to pursue their own callings; that evil customs of the past would be abandoned and everything based on the just laws of nature; and that knowledge would be sought throughout the world to strengthen the foundations of imperial rule.
      prompt: |
        Review. The "evil customs of the past" the Oath renounced belonged to the Tokugawa order studied in topic 3.2, which had been built on:
      options:
        - "A hereditary class system of samurai, peasants, artisans and merchants under daimyo controlled by the shogun's alternate attendance"
        - "An examination-based civil service open to all"
        - "Rule by Buddhist monasteries"
        - "A parliament of merchants"
      option_explanations:
        - |
          Correct. Hereditary status, domain lords and sankin-kotai were the Tokugawa system the Meiji oligarchs dismantled.
        - |
          Examinations were China's system, not Japan's; Tokugawa office was hereditary.
        - |
          Tokugawa rule was secular and the shogunate controlled the temples.
        - |
          Merchants ranked last in the official order and had no parliament.
      answer: 0
      explanation: |
        Spiral review of 3.2: know what the Meiji state replaced.

    # ---- Stand-alone multiple choice (5.4–5.6)
    - slug: apworld-u05-w17-q10
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Beyond carrying goods more cheaply, railways drove industrialisation in Britain, Germany and the United States because they:
      options:
        - "Replaced coal with wood as the main fuel"
        - "Ended the need for canals and steamships"
        - "Were built entirely by the state in every country"
        - "Created enormous demand for iron, steel, coal and engineering, and built national markets that justified larger factories"
      option_explanations:
        - |
          Railways burned coal and multiplied its demand.
        - |
          Canals declined, but steamships grew with railways; the two together made the world market.
        - |
          British and American lines were mostly private; Prussia, Russia and Japan used the state. No single pattern.
        - |
          Correct. Railways were the largest customer of heavy industry and the maker of unified markets; demand and supply reinforced each other.
      answer: 3
      explanation: |
        Causation runs both ways: industry built railways and railways built industry.

    - slug: apworld-u05-w17-q11
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which best explains why India, the world's largest textile exporter in 1750, was importing British cloth by 1850?
      options:
        - "Indian weavers chose to stop producing cloth"
        - "A plague destroyed India's cotton plants"
        - "Machine-made British cloth was cheaper, British rule removed protective tariffs and railways carried imports inland, while Indian cotton was exported raw"
        - "The Mughal emperor banned weaving in 1800"
      option_explanations:
        - |
          Weavers were undersold, not voluntary retirees; many starved or returned to the land.
        - |
          Indian cotton cultivation expanded, for export to British mills.
        - |
          Correct. Deindustrialisation came from machine competition under a colonial trade policy that served Lancashire.
        - |
          The Mughal emperor had no such power in 1800 and issued no such ban.
      answer: 2
      explanation: |
        Deindustrialisation is the other side of British industrial exports.

    - slug: apworld-u05-w17-q12
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Muhammad Ali's industrialisation of Egypt resembled Meiji Japan's in method but failed chiefly because:
      options:
        - "Egypt had no cotton to supply its mills"
        - "Muhammad Ali refused to hire European engineers"
        - "Egypt's peasants were all conscripted into Japan's army"
        - "The Treaty of Balta Liman (1838) and European pressure stripped Egypt of tariffs and monopolies, so its factories could not compete, and Britain later occupied the country"
      option_explanations:
        - |
          Egypt grew long-staple cotton; the problem was selling cloth, not growing fibre.
        - |
          He hired many European engineers and officers; borrowing was his method.
        - |
          Egyptian peasants were conscripted into Muhammad Ali's own army; the option confuses the two cases.
        - |
          Correct. The loss of tariff sovereignty, then of political sovereignty (1882), is the difference from Japan, which kept both.
      answer: 3
      explanation: |
        Comparison in 5.6: same programme, different outcome, because of sovereignty.

    # ---- Standalone review multiple choice
    - slug: apworld-u05-w17-q13
