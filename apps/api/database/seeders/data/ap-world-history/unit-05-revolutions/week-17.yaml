    # ---- Short answer
    - slug: apworld-u05-w17-q22
      type: short_answer
      topic_code: "5.3"
      source: "Primary source: Testimony of Elizabeth Bentley to the Sadler Committee (1832), Parliamentary Papers 1831–32 vol. XV, as reprinted in Scott and Baltzly, Readings in European History Since 1814 (1930), Victorian Web"
      points: 3
      prompt: |
        Elizabeth Bentley told the Sadler Committee in 1832 that she had begun factory work "When I was six years old," worked "From 5 in the morning till 9 at night, when they were thronged," and was punished for flagging: "Strap us."

        (a) Identify ONE reason factory owners employed children in the early textile mills.
        (b) Explain ONE way the conditions Bentley describes resulted from the technology of the industrial revolution.
        (c) Explain ONE way governments or workers responded to such conditions in the nineteenth century.
      answer: |
        (a) 1 point: children were cheap; small enough to crawl under and between machines; obedient and easily disciplined; families needed their wages; orphans were supplied by parish workhouses as apprentices; machines removed the need for adult strength or skill.
        (b) 1 point with explanation: water and steam power ran continuously, so the mill's hours were set by the machine, not the worker; machines required tending rather than skill, so children could replace adults; the cost of the engine and building pushed owners to run them as long as possible; the pace of the machine made flagging a problem to be punished.
        (c) 1 point with explanation: the Factory Act (1833) limited children's hours and created inspectors, followed by the Mines Act (1842) and the Ten Hours Act (1847); workers formed trade unions (legal in Britain after 1824) and Chartism demanded the vote; socialists and reformers (Owen's New Lanark) proposed alternatives; Germany under Bismarck introduced social insurance (1880s); compulsory schooling removed children from mills.
      explanation: |
        Scoring: one point per part. (b) and (c) require an explanation of how technology produced the conditions or how the response worked.

    - slug: apworld-u05-w17-q23
      type: short_answer
      topic_code: "5.6"
      source: "general knowledge"
      points: 3
      prompt: |
        (a) Identify ONE state outside Western Europe and the United States that undertook a programme of industrialisation between 1800 and 1900.
        (b) Explain ONE reason that state's government, rather than private investors, led its industrialisation.
        (c) Explain ONE reason the outcomes of state-led industrialisation differed between two such states.
      answer: |
        (a) 1 point: Meiji Japan; Muhammad Ali's Egypt; the Ottoman Empire under the Tanzimat; Russia under Witte.
        (b) 1 point with explanation: military defeat or threat (Perry, Opium War, Crimea) made industry a matter of survival, and only the state could act fast; there was little private capital or banking; the state could tax peasants (the Meiji land tax), borrow abroad (Russia) or seize land (Egypt); rulers wanted arsenals and railways for strategic reasons private investors would not fund; no entrepreneurial class existed with the knowledge, so the state hired foreign experts and built model factories.
        (c) 1 point with explanation: Japan kept its sovereignty and regained tariffs (1899), while Egypt lost both to Balta Liman (1838) and British occupation (1882); Japan built on Tokugawa literacy and a commercial economy and sold factories to the zaibatsu, while Russia industrialised on an unreformed peasant base; the Ottomans' foreign debt led to bankruptcy and European control of revenue (1881); Japan's reforms abolished the old elite (samurai), while Russia's kept the autocracy and nobility; geography and resources (Japanese silk and coal, Russian iron and oil, Egyptian cotton only) shaped what each could sell.
      explanation: |
        Scoring: one point per part; (b) and (c) require an explanation of why or how, not a named state alone.

    # ---- Long answer
    - slug: apworld-u05-w17-q24
      type: long_answer
      topic_code: "5.3"
      source: "general knowledge; interpretation written for this course"
      points: 6
      prompt: |
        Evaluate the relative importance of environmental factors and other factors in explaining why the Industrial Revolution began in Britain in the late eighteenth century rather than elsewhere.

        Write a complete essay with a thesis, context, specific evidence and reasoning that weighs the causes.
      answer: |
        Thesis (1 point): a defensible claim that ranks causes, for example that Britain's coal and geography were necessary but not sufficient, and that agricultural change, Atlantic capital and markets, protected property and high wages together explain why coal was used as it was.
        Contextualisation (1 point): the Atlantic economy and mercantilism of Unit 4; Indian cotton and the Indian Ocean trade; the Scientific Revolution and Enlightenment; Song China's earlier coal and iron; the agricultural revolution.
        Evidence (2 points): at least two specific examples, for example coal seams near iron in the Midlands and South Wales; canals; Darby's coke; enclosure and crop rotation; population growth from 6 to 21 million; the Bank of England and the stock exchange; raw cotton from slave plantations; the Calico Act and the jenny, water frame and mule; Cromford; Watt's condenser; patents and Parliament; Smith's division of labour; Belgium's coal compared with France's lack of it.
        Analysis and reasoning (1 point): uses causation to distinguish necessary conditions (coal, water) from the triggers (cotton demand, wage costs, capital), and explains how the factors interacted.
        Complexity (1 point): compares Britain with Song China or India to show why resources alone did not suffice, weighs short-term and long-term causes, acknowledges the role of the Atlantic slave economy, or notes that industrialisation spread only where several factors recurred (Belgium, the Ruhr, New England).
      explanation: |
        Scored on the AP LEQ rubric: thesis 1, context 1, evidence 2, analysis 1, complexity 1. An essay that names coal alone, or lists causes without weighing them, cannot earn the complexity point.
